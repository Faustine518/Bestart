      <article class="chapter" aria-labelledby="heading-chapter-08">
        <header class="chapter-header">
          <span class="chapter-number">08</span>
          <h2 id="heading-chapter-08">Love Me Like That（下）</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">探讨爱情的难度，或许是一个伪命题。</p><p class="story-paragraph">因为在我看来当两个人坠入爱河的时候，天使也会帮他们作弊。</p><p class="story-paragraph">比如在大雨倾盆前的最后一秒牵着手疯跑到家，比如在明明不对的季节碰到偶然盛开的樱花。再比如一起散步时总能买到最后一份加了麻薯的红豆饼，嘴唇相碰的那一刻也能刚好遇上圣诞树点亮顶端最后的那颗星星。</p><p class="story-paragraph">幸福和幸运就好像总是打包在一起的命运礼物，在三年的时间里馈赠给我们许多。</p><p class="story-paragraph">以至于当我第一次清楚地意识到自己想和郑成灿永远永远在一起的时候，相爱其实早就已经成为了我们的本能，和吃饭睡觉一样的，不需要经过任何后天学习与思考的本能。</p><p class="story-paragraph">本能到我们好像生来就会爱对方。</p><p class="story-paragraph dialogue">“曾经我也觉得这种话很夸张。”</p><p class="story-paragraph dialogue">“但后来发现如果真的能碰到很好的人的话，这种其实也可以成为事实。”</p><p class="story-paragraph">用这些话给前面的恋爱回忆做完总结，编剧老师抬起头来和我相视一笑。</p><p class="story-paragraph">故事讲述到这里，前置采访也完成了大半。我随意舒展了一下身子，喝水润嗓的同时也远远地望见导演手中的台本被翻到了尾页。</p><p class="story-paragraph">一场盛大的筵席过后总归是逃不过告别散场，所以在终于听见最后一个问题的时候，我反而有种如释重负的感觉。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue screen-line">「和X是怎么分手的呢？」</p><p class="story-paragraph">其实分开的这半年里我也有思考过这个问题。</p><p class="story-paragraph">心动相对简单，那是一瞬间的事，但决堤却是日积月累，裂纹的蔓延是漫长且静默的连锁反应。我始终想不出的是，第一道缝隙到底出现在哪里。</p><p class="story-paragraph">不像任何烂俗的剧情发展，我们之间没有劈腿，没有插足，甚至连大吵一架都没有，但就是在这样无人犯错的情况下，我们还是无可避免地走向了死局。</p><p class="story-paragraph">所以我说探讨爱情的难度真的就是一道伪命题。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“前面不是说过相爱是本能这样的话嘛...”</p><p class="story-paragraph">我把语速放到很慢，一边讲一边思索着下一句的措辞。</p><p class="story-paragraph dialogue">“但不知道是从什么时候开始的...”</p><p class="story-paragraph dialogue">“不知道什么时候开始我们就都变成了压抑本能的怪人。”</p><p class="story-paragraph">分手前的那个秋天，我们还一起在首尔林公园看了枫叶。</p><p class="story-paragraph">那天天气很好，依旧是在能晒到阳光的地方铺了野餐垫，郑成灿躺在我身边用书盖住脸休息。</p><p class="story-paragraph">风是突然吹起来的，一时间满树的枫叶纷纷扬扬往下落，漫天的橙红色大雪，像风送来深秋的表白信却被拆解成了千千万万句。</p><p class="story-paragraph">我随手捡起一枚正好落在郑成灿书上的叶子，用指尖捏住叶柄轻轻地捻动，跳跃的小火苗一般。</p><p class="story-paragraph dialogue">“感觉降温来得比往年都要早一些。”听着风声呼啸，我轻轻地发出感叹：“今年冬天应该会比较冷吧。”</p><p class="story-paragraph dialogue">“那得再多买些保暖的衣服了。”郑成灿顶着书本说话，声音翁翁的带着点慵懒鼻音。</p><p class="story-paragraph dialogue">“不要。”我低头看了他一眼，拒绝得干脆。</p><p class="story-paragraph dialogue">“왜——（为什么）”郑成灿把问句拖得很长，但那透着些许无奈的语气一听便知，他已经猜到了这又是我逗他的把戏。</p><p class="story-paragraph dialogue">“气温降到4度以下的话...”</p><p class="story-paragraph">我开始故弄玄虚，但话还没说完反倒自己先笑了起来。</p><p class="story-paragraph">为防止再度笑场，第二遍我讲得语速飞快。</p><p class="story-paragraph dialogue">“气温降到4度以下的话，什么衣服都没有成灿的怀抱管用啊。”</p><p class="story-paragraph dialogue">“啊..”</p><p class="story-paragraph">似叹非叹的一声。</p><p class="story-paragraph dialogue">“是机器人吗？”</p><p class="story-paragraph">郑成灿被太阳晒得暖暖的，连吐槽听起来都显得懒洋洋。</p><p class="story-paragraph">什么嘛，真是不懂情趣。</p><p class="story-paragraph">我有些挫败地轻哼了一声，赌气似的背过身去。</p><p class="story-paragraph">不一会儿我就听见他坐起来的声音，紧接着一团温暖就将我完全包裹住了。</p><p class="story-paragraph">他从背后抱过我很多次，可那一次却在记忆里保留得格外清晰。</p><p class="story-paragraph">我至今都完全记得他起伏的鼻息，记得他身上的木质香气，记得他环抱着我的时候轻轻放在小腹上的双手是左手在上。</p><p class="story-paragraph">现在回想起来才发现这大概也是一种分开的征兆。就好像濒死的人会迸发出最后一次力量一样，当时的第六感察觉到蛛丝马迹，所以也自我保护一般地把他留在了记忆里。</p><p class="story-paragraph">原来当一段关系快要走到末路的时候，各种悲剧的指向都会很明晰。</p><p class="story-paragraph">他抱了我好久都没说话，只是把头埋在我的肩窝里，呼吸均匀舒缓得跟睡着了一样。几乎是在快要放开手的时候，风才把他的声音送进了我的耳朵。</p><p class="story-paragraph dialogue">“我也不能一直都在你身边啊。”</p><p class="story-paragraph">我猛地扭过头去看他，但当时的我只是觉得这话听起来好扫兴。</p><p class="story-paragraph dialogue">“为什么？你不爱我了吗？”</p><p class="story-paragraph dialogue">“不，我爱你啊。”</p><p class="story-paragraph">郑成灿揉了揉我的头发，哄小动物一样的手法。</p><p class="story-paragraph dialogue">“我只是在假设。”</p><p class="story-paragraph dialogue">“我只是想说哪怕有我在，冬天也还是得自己穿得暖暖的。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">后面发生的对话我就不记得了，而记住的这一段则恰好成了一语成谶的开端。</p><p class="story-paragraph">去年的冬天确实特别特别冷，而他也确实没再留在我身边。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">分手的那天首尔在下入冬的第一场雪。</p><p class="story-paragraph">营销部门的工作总是繁琐不堪，终于在九点之前改完了最后一版方案，精疲力竭地走到写字楼大门口的时候才发现下雪了。</p><p class="story-paragraph">掏出手机，提示框里除了炸鸡啤酒，初雪天告白等实时热门话题推送外，还静静地躺着三条来自郑成灿的未接来电。</p><p class="story-paragraph">等公交的时候才回拨过去。</p><p class="story-paragraph dialogue">“抱歉，今天一直在忙工作的事所以没看见电话。”</p><p class="story-paragraph dialogue">“怒那，下雪了。”</p><p class="story-paragraph">他的声音轻轻地贴到我耳朵上，感觉听筒口冒出了一枚小小的太阳。</p><p class="story-paragraph dialogue">“嗯。”</p><p class="story-paragraph">大概是疲惫到了极点，所以完全是无意识的，声音就带上了一点哭腔。</p><p class="story-paragraph">本来还要再说点什么，但老板却在这时插进来了电话。</p><p class="story-paragraph dialogue">“抱歉。”</p><p class="story-paragraph">短到不足半分钟的电话，我却几乎只用来说了两次抱歉。</p><p class="story-paragraph">没等郑成灿回复我就急忙按了转接。</p><p class="story-paragraph">无非又是一些关于方案的反馈和调整建议，鸡毛蒜皮的小事翻来覆去，重复相似的文件改改删删。电话听到最后我都已经疲于答复了，只能一直点着头全部应下。</p><p class="story-paragraph">一路上都在通话，我都没来得及看一眼车窗外的飘雪。</p><p class="story-paragraph">也没来得及看郑成灿发给我的一条接一条的kkt。</p><p class="story-paragraph">回到家的时候鞋袜都浸湿透了，打开灯才发现郑成灿正坐在客厅等我。</p><p class="story-paragraph dialogue">“今天也很忙吗？”他远远地看着我，脸上的神色不清晰。</p><p class="story-paragraph">太疲惫了，我只能用鼻子哼出两声作为应答。直到仰躺进沙发里才感觉整个人堪堪活过来了一点。</p><p class="story-paragraph dialogue">“你怎么回来了？”我休息了一会忽然想起来他今晚似乎是有安排一台手术的。</p><p class="story-paragraph">郑成灿倒了温水递给我，但并不回答我的问题。</p><p class="story-paragraph dialogue">“该不会？临时请假了吧？”</p><p class="story-paragraph dialogue">“就因为我挂电话那点事吗？”</p><p class="story-paragraph">我腾得一下从沙发上坐起来，但头真的太痛了，我不受控地露出了不太好看的表情。</p><p class="story-paragraph dialogue">“今天有遇到什么事吗？”</p><p class="story-paragraph">突然的反问让我有些没反应过来。</p><p class="story-paragraph dialogue">“刚才那通电话不是哭了吗？”郑成灿一边说着一边帮我把外衣收好。</p><p class="story-paragraph dialogue">“啊...其实没什么事，就是工作上的小事！”</p><p class="story-paragraph dialogue">“手术机会对你来说很重要！”</p><p class="story-paragraph dialogue">“你对我来说也很重要啊。”</p><p class="story-paragraph">第一次听到郑成灿用这么强硬的语气反驳我，我一时间竟然有些不知所措。</p><p class="story-paragraph dialogue">“怒那，你为什么就是，就是不肯和我分享你的事了...”</p><p class="story-paragraph dialogue">“什么都不肯讲给我听...”</p><p class="story-paragraph dialogue">“我们已经有半个月没有在kkt互发午餐了...”</p><p class="story-paragraph dialogue">“上次感冒你也瞒着我自己买药吃...”</p><p class="story-paragraph dialogue">“我们本来应该互相分担的不是吗？”</p><p class="story-paragraph">如果不是听见他的控诉，我都不知道他偷偷地在心里记下了这么多。我本来以为像他这样的人应该最不容易被敏感和情绪折磨。</p><p class="story-paragraph dialogue">“你才刚毕业进医院，我不想太麻烦你。”</p><p class="story-paragraph dialogue">“为什么你会觉得是麻烦？”</p><p class="story-paragraph">因为我没有安全感。毕业后直面社会才让我逐渐意识到你真的是极好的人，你那么好，而我不够好，所以我不敢再随便消磨你的爱意，因为我没有什么可以再给你。</p><p class="story-paragraph">答案这一刻在脑海里是清晰的，但我最终还是只说了一句：“太累了。”</p><p class="story-paragraph dialogue">“可是我也很累。”郑成灿几乎是在苦笑。</p><p class="story-paragraph dialogue">“快回医院去吧。”我真的没有力气了，只能不停地揉着太阳穴：“别闹了。”</p><p class="story-paragraph">不知道气氛沉寂了多久，我昏昏欲睡的时候才听见郑成灿说。</p><p class="story-paragraph dialogue">“怒那，那我们都让彼此轻松一点吧。”</p><p class="story-paragraph">我也不明白为什么那天晚上的疲惫会那样沉重，沉重到产生了干脆把一切都推开的念头。</p><p class="story-paragraph">于是我说那要分手吗。</p><p class="story-paragraph">他淡淡地在我身后说了句好。</p><p class="story-paragraph">那晚他推门出去的时候我想我大概是快睡着了。直到第二天从沙发上醒过来我才意识到我好像失去郑成灿了。</p><p class="story-paragraph">打开手机，kkt里还有一堆昨晚和老板通电话时他发给我的未读消息。</p><p class="story-paragraph dialogue screen-line">「怎么了？」</p><p class="story-paragraph dialogue screen-line">「刚刚是哭了吗？」</p><p class="story-paragraph dialogue screen-line">「怎么又突然挂电话？」</p><p class="story-paragraph dialogue screen-line">「今天晚上的手术改期了，我等会就回来陪你」</p><p class="story-paragraph dialogue screen-line">「今天下初雪诶，要吃炸鸡啤酒才对啊」</p><p class="story-paragraph dialogue screen-line">「我现在去买点，你要什么味道？」</p><p class="story-paragraph dialogue screen-line">「不说话的话，那就还是买蜂蜜芥末咯」</p><p class="story-paragraph dialogue screen-line">「买好了」</p><p class="story-paragraph dialogue screen-line">「我到了」</p><p class="story-paragraph">我这时才终于看见了厨房柜台上放着的那盒炸鸡，但放了一夜已经凉透了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“那你们分手后没有再联系过对方吗？”</p><p class="story-paragraph">编剧老师临时又加了一个问题。</p><p class="story-paragraph dialogue">“没有。”我摇了摇头。</p><p class="story-paragraph">一开始可能是赌气，但赌气的同时也错过了最佳时机。一次次打开对话框欲言又止，自尊心就总在这种不对的时间作祟。</p><p class="story-paragraph">有天晚上一个人看《乱世佳人》，接近四个小时的电影不知不觉就看到了后半夜，结尾的时候斯嘉丽拉住白瑞德哭着说我只知道我爱你，白瑞德却坦然地拿掉她的手说那就是你的不幸了。</p><p class="story-paragraph">我当时一瞬间就想到了郑成灿，我在想他也在和我一样不幸吗？</p><p class="story-paragraph">他也会突然想起我吗？</p><p class="story-paragraph">他还爱我吗？</p><p class="story-paragraph">线上没有联系，线下也从没见过面。分开之后我们好像总能完美地错开，很有默契地成为了两条绝不相交的平行线。就像两滴水重新落回大海里一样，我们各自藏匿进错落的街巷楼宇。</p><p class="story-paragraph">没了爱做纽带，错过自然就成为了常态。</p><p class="story-paragraph">所以在一开始接到节目组电话的时候我是完全不相信的。PD是先联系了郑成灿然后才来找我，我不相信郑成灿居然会想再见我。毕竟我们都曾表现得那样心狠。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">晚餐游戏结束了，后半段我完全是浑浑噩噩的状态。</p><p class="story-paragraph">起身帮忙收拾的时候节目组又送来了今晚的第二个信封。</p><p class="story-paragraph dialogue screen-line">「请新来的嘉宾选定一位进行约会」</p><p class="story-paragraph">可以随便选吗？这是听到内容后我脑海里蹦出来的第一个想法。真羡慕啊，如果我也可以随便选的话，我想选郑成灿。</p><p class="story-paragraph">允在先做出了选择，被选中的宥真一脸的不可置信。</p><p class="story-paragraph dialogue">“明天见。”允在的眼睛笑起来像月亮。</p><p class="story-paragraph">接下来众人的目光移向了雅贤，雅贤沉吟了一会。</p><p class="story-paragraph dialogue">“我想选...成灿xi。”</p><p class="story-paragraph">这种感觉就像是突然被人用子弹击中了心脏一样，我不知道有没有人发现了我皱起的眉头。</p><p class="story-paragraph">郑成灿是很好很好的人，所以他被选中也并不是意外的事。我尝试这样安慰我自己。但这个逻辑好像又不那么行得通，银硕也很好，元彬也很好，在座的各位都很好，那为什么偏偏要选郑成灿？</p><p class="story-paragraph">理由一个个成立又推翻，我这样疯狂地寻找借口也不知道是在和谁较劲，只知道这场仅存在于我脑海里的独角戏又快要将我的眼泪引出来。</p><p class="story-paragraph">不要选郑成灿好不好？这样没有道理的话我只能在心里一遍一遍地讲。</p><p class="story-paragraph">郑成灿很礼貌地应允下来的一瞬间，如果不是规则限制，我真的会起身离开。但我不可以，我必须依旧安静地坐在镜头前，坐在所有的嘉宾前，不可以流泪，不可以反驳，保持一致的微笑和点头是我唯一的选择。</p><p class="story-paragraph">真是不公平的规则啊。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">夜色渐深了，大家开始非常散漫地聊起天来。</p><p class="story-paragraph">但我感觉我应该还是像一樽僵坐的石像。</p><p class="story-paragraph">郑成灿不知道是什么时候就坐到我身边的，他的手机屏幕举到我面前的时候我才稍微拣回了一点点意识。</p><p class="story-paragraph dialogue screen-line">「要出去聊聊吗？」</p><p class="story-paragraph">白色的备忘录上只有这样短短的一句话，但我盯了好久才点了点头。</p><p class="story-paragraph">找准时机分开出门后，我和郑成灿在昏暗的庭院里面对面了。</p><p class="story-paragraph dialogue">“心情不好吗？”</p><p class="story-paragraph">来这里之后的几次对话好像总是他在做主导。</p><p class="story-paragraph dialogue">“你的心情好吗？”我问他。</p><p class="story-paragraph dialogue">“说不上来。”他笑了笑，倒显得诚实。</p><p class="story-paragraph dialogue">“明天有约会的话，应该还是很开心的事吧。”不自觉地话里就带上了酸味。</p><p class="story-paragraph dialogue">“还好。”</p><p class="story-paragraph">不上不下的答案，我不满意。</p><p class="story-paragraph dialogue">“所以你要和我聊什么？”</p><p class="story-paragraph dialogue">“感觉你心情不太好。”</p><p class="story-paragraph dialogue">“不好很多天了啊。”我摇了摇头。</p><p class="story-paragraph dialogue">“我希望你可以轻松一点。”</p><p class="story-paragraph">大概是习惯使然 ，一说温柔的话他就会摸我的头发。</p><p class="story-paragraph dialogue">“那你明天不去约会好不好？”</p><p class="story-paragraph">他这样的举动忽然给了我莫名的勇气，于是我把方才憋在心里的无厘头的话当着他的面说出来了。</p><p class="story-paragraph">他愣了一下，旋即哈哈大笑起来。</p><p class="story-paragraph dialogue">“说什么呢？”</p><p class="story-paragraph dialogue">“节目的规则是这样。”</p><p class="story-paragraph">他的手在我的头上连揉带摸，我的心快要被他揉化了，也快要揉碎了。</p><p class="story-paragraph dialogue">“不要再心情不好了。”</p><p class="story-paragraph dialogue">“不要再为我心情不好了。”</p><p class="story-paragraph">他轻轻地说着，他好像什么都知道一样。</p><p class="story-paragraph">可他明明什么都不知道…</p><p class="story-paragraph">再次回到客厅的时候已经到了该发心动短信的时间。</p><p class="story-paragraph">大家都沉默地编辑着。</p><p class="story-paragraph">我的目光在男嘉宾身上挨个落脚，发给谁呢？该发给谁呢？今天和其他的人都没有什么交集，所以要发给郑成灿吗？</p><p class="story-paragraph">我的心脏开始撞击肋骨，牙齿狠狠咬住下了嘴唇。</p><p class="story-paragraph dialogue screen-line">「谢谢你的粥」</p><p class="story-paragraph">我居然就这样发出去了。</p><p class="story-paragraph">已发送的提示字样点醒了我，客厅里的温度好像在直线上升，一时间如坐针毡起来，我几乎是逃跑着回了二楼的卧室。</p><p class="story-paragraph">节目组发来的信息也到了。</p><p class="story-paragraph">我摸黑坐到床边，按下短信图标的时候手指都在打颤。</p><p class="story-paragraph dialogue screen-line">「今晚好好睡吧」</p><p class="story-paragraph">看不出是谁的信息，今天好像没有和任何人提起过我失眠的毛病。</p><p class="story-paragraph">手指继续往下划，第二条信息紧随其后。</p><p class="story-paragraph dialogue screen-line">「你的X选择了你」</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">眼泪几乎是在一瞬间就落下来的，我从没想过这几个字居然能有这样大的影响力。</p><p class="story-paragraph">他选择了我，他选择了我，这好像是什么诱导开花的咒语，我感觉自己在开花。</p><p class="story-paragraph">今天的我会好好睡觉的，因为今天的郑成灿选择了我。</p><p class="story-paragraph">而这，其实也就够了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">【贴一个关于本能的小剧场：看电影】</p><p class="story-paragraph">雨声从窗户外蔓延进来，今晚这场雨真大。</p><p class="story-paragraph">我窝在郑成灿的怀里看电影，找了很久的片子，最后还是选了看泰坦尼克号。电影进行到露丝被骗上救生艇的情节，她回过头看着船上的杰克越来越远，信号弹在他身后炸开，像盛放易逝的烟花。</p><p class="story-paragraph">我仰头和成灿说话【好多人都说露丝如果这时候听话坐船走的话，她和杰克最后都能活。】</p><p class="story-paragraph">成灿一边嚼冰块一边问我【那你会走吗？】</p><p class="story-paragraph">【我不走。】我的回答不假思索。</p><p class="story-paragraph">成灿微微一怔，低下头来看我。</p><p class="story-paragraph">【你不是不赞同。】</p><p class="story-paragraph">我耸了耸肩【没有啊，反而我喜欢这种，因为爱本来就是一瞬间的本能。】</p><p class="story-paragraph">【那你知道我这一瞬间的本能是什么吗？】</p><p class="story-paragraph">郑成灿讳莫如深地看着我。</p><p class="story-paragraph">【什么。】</p><p class="story-paragraph">我没注意到他神色的变化，只继续抓了一把爆米花塞进嘴里，不小心落了一些碎屑到郑成灿的衣服上，我连忙伸手去扫，结果手腕被一把抓住。</p><p class="story-paragraph">【我想吻你。】</p><p class="story-paragraph">他的语气很平和，但从他手上的力度，我猜他忍了很久。</p></div>
        <nav class="chapter-pager" aria-label="章节翻页"><button type="button" data-target="chapter-07"><span>‹ 上一章</span><strong>Love Me Like That（上）</strong></button><button type="button" data-target="chapter-09" class="next"><span>下一章 ›</span><strong>你懂我的吧</strong></button></nav>

      <article class="chapter" aria-labelledby="heading-chapter-09">
        <header class="chapter-header">
          <span class="chapter-number">09</span>
          <h2 id="heading-chapter-09">你懂我的吧</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">被窸窣的声音吵醒，迷迷糊糊间看见正蹲在角落里翻找行李的雅贤。</p><p class="story-paragraph">节目组安排雅贤和我跟智恩住同一间房。</p><p class="story-paragraph">和昨晚初见时的成熟装扮截然不同，今早的她穿着珠光白的缎面睡裙，裙面的褶皱像粼粼的水波纹，而头发松松地挽在脑后，从耳畔垂下来的几缕又像是水边随时等风来的杨柳。</p><p class="story-paragraph">雅贤转身放衣服的时候视线刚好和我对上。</p><p class="story-paragraph dialogue">“你也醒啦？”她的声音清清淡淡的，像沾了晨露的茉莉。</p><p class="story-paragraph dialogue">“嗯..你第一天就起这么早。”</p><p class="story-paragraph">我随口说着从床上撑坐起来，旁边智恩的床是空的，大概是又去晨练了。目光回转，雅贤箱子边的衣服已经摞成了小山，于是我小声问她在找什么。</p><p class="story-paragraph dialogue">“找蓝色的衣服。”雅贤抽空抬头回复我。</p><p class="story-paragraph dialogue">“今天不是有约会嘛...”</p><p class="story-paragraph dialogue">“昨天就和成灿约了穿蓝色搭配来着...”</p><p class="story-paragraph dialogue">“啊，和成灿约了吗？”</p><p class="story-paragraph">我像个失忆的人一样重复着雅贤的内容。收到短信后我好像完全把这件事抛之脑后了，昨晚才抚平的水面无可避免地又开始起波澜。哪怕不去渲染爱情的遗力，他也是我指甲边缘总在不断重复生出的倒刺，碰到就会作痛，虽然轻微但也折磨。</p><p class="story-paragraph dialogue">“是的。我也不知道怎么就提了蓝色。”雅贤有些苦恼地抓了抓头发说自己都没找到合适的蓝色衣服。</p><p class="story-paragraph dialogue">“他挺喜欢蓝色的。”</p><p class="story-paragraph">我几乎又是脱口而出，这么多天了还是没能改掉这个屡次险些违背规则的习惯。但还好声音够小，被雅贤突然打开柜门的吱呀声掩盖掉了。</p><p class="story-paragraph">她拿出一条蓝色的衬衫裙放在身前比划着询问我的意见。</p><p class="story-paragraph dialogue">“挺好看的。”我夸赞得很诚心，这条裙子的裁剪灵动活泼，但颜色又很清新沉静。</p><p class="story-paragraph dialogue">“他会喜欢的。”</p><p class="story-paragraph">我又喃喃了一句，这次也不知道有没有人听见。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">郑成灿突然敲门的时候我正在镜子前补腮红。</p><p class="story-paragraph">他刚探头进来明显也是愣了一下，但调整得很快，如果方才我没有抬头大概也会抓不出他的破绽。</p><p class="story-paragraph dialogue">“准备好了吗？”</p><p class="story-paragraph">不知道是不是早晨的原因，他的声音听起来也和初升的太阳一样温柔地透着暖。</p><p class="story-paragraph">可这样温暖的问题不是属于我的。</p><p class="story-paragraph">雅贤在我身后回了一声快好了，我僵坐在镜子前却没办法继续看自己的脸，窥探别人幸福的小偷此刻脸上应该流露出什么样的神情，我实在不想通过镜子看见。</p><p class="story-paragraph">于是我只能用余光去瞟郑成灿，他果然穿了件蓝色的短袖，这个颜色很衬他这种皮肤白的人，整个人清爽得像放了满杯冰块的薄荷气泡水。</p><p class="story-paragraph">我们之前在一起的时候，像这样搭配着情侣装出门的情况并不多。那时的我好像总是会下意识地去回避一些生活的仪式感，可能也是胆小的人的通病，太外化的幸福反而会让人产生下一秒被没收的惶恐。</p><p class="story-paragraph">于是我一次一次地选择了含蓄，选择了隐晦，天真地以为这样就可以逃过一切自然规律的制裁。</p><p class="story-paragraph">雅贤比我勇敢太多，此刻穿着相同色系的他们看起来真的就是一对完全相配的情侣。</p><p class="story-paragraph">坦荡的表达原来会这样惹人艳羡。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“不上班吗今天？”</p><p class="story-paragraph">反应了一会才觉察到郑成灿的这个问题是抛给我的。</p><p class="story-paragraph dialogue">“等会就走。”我装模作样地用刷子去戳腮红，哪怕刷毛已经染得通红。</p><p class="story-paragraph">郑成灿点了点头不再说什么，正好雅贤这时也收拾妥当了，两个人站在门口一起和我道别。</p><p class="story-paragraph dialogue">“好好玩吧。”</p><p class="story-paragraph">我笑着说，嘴角尽量抬得高。</p><p class="story-paragraph">听说嘴巴先笑的话，眼睛最终也会笑的。反正眼泪也没有办法把郑成灿留下来，那还不如像他说的那样让彼此都轻松一点。</p><p class="story-paragraph">笑容一直维持到他们的身影消失在转角，失落感迅速尾随着攀缘而上，没有心情继续化妆，就只能对着镜子久久地发呆。</p><p class="story-paragraph">他们的谈笑还在隐隐约约地从楼道，从客厅，从庭院飘来，声音隔着墙壁朦胧得像是某种加密的对话，甚至感觉连笑声都变成了一种我不听懂的语言。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">经历了早上的一波三折，抵达工位的时候大概是疲惫得仿佛整夜未睡，不然同事也不会在茶水间突然悄声问我节目录制的近况。</p><p class="story-paragraph">我摆摆手说没事的。</p><p class="story-paragraph">也确实是没事啊，一切其实都只是在按照节目的规则与流程正常运转，我的辛苦怪不上任何人。</p><p class="story-paragraph">当然我也不怪谁，只怪我自己。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">一整天都在被关于他们约会揣测的胡思乱想纠缠。</p><p class="story-paragraph">莫名地不想回小屋，于是我主动申请了加班，一直熬到整座大楼其他的公司也都打烊了之后，我才磨蹭着下楼去乘地铁。</p><p class="story-paragraph">公司离小屋大概有二十分钟的车程。</p><p class="story-paragraph">深夜的车厢空空荡荡，我一个人歪靠在门边的透明挡板上。</p><p class="story-paragraph">车窗外的楼宇灯火接二连三地闪过，首尔在此刻变成特别的天幕，移动的车灯是飞驰的流星。流动的光影串联起来构成整座城市的发光脉络，远远看去好像有无数的故事正在发生，终结，未完待续。</p><p class="story-paragraph">但慨叹的同时抬眼看见了映在玻璃上的脸，才意识到自己也是这众多故事中的一员。</p><p class="story-paragraph">可至于是悲剧还是喜剧，我却没有预知的能力。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">回到家的时候，一楼静悄悄的，只有宥真和银硕还在客厅。</p><p class="story-paragraph dialogue">“怎么回来这么晚？”</p><p class="story-paragraph dialogue">“要吃点什么吗？”</p><p class="story-paragraph">两人你一言我一语跟我打招呼，但显然他们本来是有别的话要聊，于是我很识趣地径直上了二楼给他们留出空间。</p><p class="story-paragraph">智恩和雅贤已经洗漱完了，我推开门的时候两个人正靠在床上看手机。</p><p class="story-paragraph">寒暄问候过，我也草草收拾了一下歪到了床上。</p><p class="story-paragraph dialogue">“吃过饭了吗？”雅贤忽然侧过头来问我：“冰箱里应该还有今天带回来的红豆饼。”</p><p class="story-paragraph dialogue">“还好，不饿。”我谢绝了她的好意，但犹豫了一下还是抓住了这个话头：“姐姐今天去哪里约会了吗？还买了红豆饼？”</p><p class="story-paragraph dialogue">“我们刚聊完。”智恩也放下手机参与进来。</p><p class="story-paragraph dialogue">“怎么了吗？”有些意外的走向，我把上半身支起来更多。</p><p class="story-paragraph dialogue">“也没有别的意思，只是感觉成灿怎么说呢？”雅贤挑了挑一侧的眉毛：“感觉今天更像是友情的建立吧。”</p><p class="story-paragraph dialogue">“他比看起来要更有边界感一些。”</p><p class="story-paragraph dialogue">“走近他好像不是一时半会就可以做到的事。”</p><p class="story-paragraph">雅贤说着又释然地笑了笑：“可能大家都还有所保留吧。毕竟X在身边。”</p><p class="story-paragraph">她的目光飘向我这边，我不太清楚其中的含义，只能故作镇定地将脸埋了一大半到枕头里。</p><p class="story-paragraph dialogue">“你们现在还会因为X摇摆吗？”智恩突然有些苦恼地发问。</p><p class="story-paragraph dialogue">“我不会了。”雅贤回答得很干脆。</p><p class="story-paragraph dialogue">“真是残忍啊。”本来是开玩笑的语气，但智恩的笑容却逐渐变得勉强。</p><p class="story-paragraph dialogue">“本来也以为我可以这样洒脱的。”</p><p class="story-paragraph dialogue">“但X的存在却还是会动摇我。”</p><p class="story-paragraph dialogue">“好像没办法做到不去注意他。”</p><p class="story-paragraph">智恩的碎碎念，一时间却仿佛在倾诉我自己的心声。</p><p class="story-paragraph">雅贤叹了一口气，凑过去拍了拍智恩的肩膀：“慢慢来就好了。”</p><p class="story-paragraph dialogue">“慢慢来就会好吗？”我有些茫然。</p><p class="story-paragraph">手机在这时提醒又到了发心动短信的时间。</p><p class="story-paragraph dialogue">“发给谁？”</p><p class="story-paragraph dialogue">“发给X吗？”智恩笑着为自己刚才瞬时的表白开解，但眼神还是没有力气。</p><p class="story-paragraph">屋内安静下来，只能听见指尖敲击屏幕的声音。</p><p class="story-paragraph">我却不知道该发给谁，今天可以说是完全缺席的一天，如果只是遵从题意发给心动的人的话，那我又要发给郑成灿吗？可是今天郑成灿还会选择我吗？按照他一贯礼貌待人的处事方式，他今天大概会发给一起约会的雅贤吧。</p><p class="story-paragraph">我不喜欢一厢情愿，但我的内心却已经习惯使然地偏向了一边。</p><p class="story-paragraph">就像自然而然沿着河道顺势流淌的水，我心里的沟沟壑壑都只蜿蜒到郑成灿这一处地方。</p><p class="story-paragraph dialogue">“今天玩得开心吗？”</p><p class="story-paragraph">没有什么浓烈的字眼，我的私心其实更多藏在节目组的第二条短信里，于是我咬咬牙按下了发送。由于对回信没有报任何希望，所以我发完后就以加班太累为由道了晚安。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">半夜不明原因地惊醒，摸索着拿起手机看时间，才迷迷糊糊地看见了提示栏里的三条消息。</p><p class="story-paragraph">怎么会有三条呢？心下纳罕着点开。</p><p class="story-paragraph dialogue screen-line">「明天一起做晚饭吧」</p><p class="story-paragraph">第一条大概是元彬的消息，我前天晚上和他提了一嘴我会做饭。</p><p class="story-paragraph dialogue screen-line">「回来了吗？」</p><p class="story-paragraph dialogue screen-line">「你的X选择了你」</p><p class="story-paragraph">第二条消息相比起来就显得奇奇怪怪，怎么会发给我，又怎么浪费一次机会发这样显而易见的问题，我本来以为他的决策我总能猜得八九不离十，但这一刻我好像不懂郑成灿了。</p><p class="story-paragraph">企图再消化一下这些无厘头的话，但睡意一浪接一浪的袭来，两行字逐渐洇开模糊，就像午后醒来努力回想却还是渐渐消失的梦一样。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">第二天早上出门的时候没能碰到郑成灿，关于短信的困惑在心里埋了一天也不可避免有些褪色了。人的好奇心有时候就像暴露在空气中很快会被氧化的苹果，需要抓住时机。</p><p class="story-paragraph">像这样缺少时机的话，我们真的还可以回到从前吗？</p><p class="story-paragraph">下班后在路边摊等最新一锅红豆饼出炉的时候，我忽然这样悲观地想。</p><p class="story-paragraph">其实和郑成灿分开以后我就再没吃过这些，味道也是记忆的一部分，像我这样没有定力的人只能通过逃避来忘记。今天破天荒地来买纯粹是因为下班路过的时候想起了雅贤昨天的话。</p><p class="story-paragraph">习惯性地跟着他做同样的事，我在心里苦笑着自己又在重蹈覆辙。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">雨季的雨总是突如其来得不讲道理。</p><p class="story-paragraph">老板才刚给我装了半袋的饼，雨就淅淅沥沥地落了下来，顺着顶棚的边缘拉扯出一条条纤长的珠线。在我手忙脚乱地想要撑开雨伞的时候，一辆黑色的车在小摊前停了下来。</p><p class="story-paragraph">车窗摇下来，我不可置信地看清了郑成灿的脸。</p><p class="story-paragraph">突然亮起来的霓虹灯在他脸上流溢着变幻的色彩，让他本就难懂的表情变得更加晦涩，我大概真的不懂郑成灿了。</p><p class="story-paragraph dialogue">“上车吧。”他看了一眼我身后的摊点。</p><p class="story-paragraph dialogue">“你怎么来这里了？”我抓着伞柄向他走近一些，隔着雨声我有些听不清对话。</p><p class="story-paragraph dialogue">“路过。”他说着扬了扬下巴提醒我去拿老板装好的红豆饼。</p><p class="story-paragraph">于是我们的距离又拉开了。</p><p class="story-paragraph dialogue">“我还是自己回去吧。”付完钱后我小声地跟他说。</p><p class="story-paragraph">虽然我们已经在露台，在房间都单独相处过了，但车厢这样狭小的空间还是会让人觉得有些尴尬。一言不发的沉默，是我不敢想象更无法承受的凌迟。</p><p class="story-paragraph dialogue">“雨越下越大了啊。”</p><p class="story-paragraph">郑成灿将我从头到脚扫视了一番。</p><p class="story-paragraph dialogue">“你不是最讨厌湿漉漉的感觉吗？”</p><p class="story-paragraph">他平静地陈述事实，而后又云淡风轻地将已经被他拆解完的选择题推回给我。</p><p class="story-paragraph">还有什么理由拒绝呢？</p><p class="story-paragraph">我们静默地对峙了片刻，以我收伞上车告终。</p><p class="story-paragraph">久违的副驾驶座，但却是和之前完全不同的心情。</p><p class="story-paragraph">果然同预想的一样，车里安静得只能听见雨落在窗玻璃上的声音，细细密密的，像在胡乱结着网，感觉它们的节奏破碎又着急。</p><p class="story-paragraph dialogue">“放点歌吗？”我构思了半天的提议。</p><p class="story-paragraph">他点了点头，依旧专心地望着前方。</p><p class="story-paragraph">车上原先的歌单被清空了，我有些讪讪地抿了抿嘴巴，只能连上了自己的手机蓝牙，随手点了播放键后，李夏怡的声音却不合时宜地飘了出来。</p><p class="story-paragraph">慌乱地想要解锁手机更换歌曲，郑成灿却在这时说话了。</p><p class="story-paragraph dialogue">“就放着吧，之前不是很喜欢吗？”</p><p class="story-paragraph">我不知道被他掌握了这么多的习惯到底是好是坏。</p><p class="story-paragraph">但众所周知的医学常识，受伤的创口如果不及时和衣物剥离的话，血肉和纤维粘黏到一起只会导致更棘手的情况。那我们现在这样算什么，如果只是因为残留的惯性联系在一起的话，那真正分开的时候又该有多疼呢？</p><p class="story-paragraph">歌曲悠悠地唱到了副歌部分。夹带着慵懒颗粒的嗓音和雨天很是相配。</p><p class="story-paragraph">[Now I believe]</p><p class="story-paragraph">--如今我坚信</p><p class="story-paragraph">[걸어걸어 가는 발걸음마다]</p><p class="story-paragraph">--每走一步</p><p class="story-paragraph">[기분 좋아 꼭 둘이서 추는 춤 같아]</p><p class="story-paragraph">--心情都无比美妙，如同你和我共舞</p><p class="story-paragraph">[My oh my oh my oh 내 사랑]</p><p class="story-paragraph">--我的爱人</p><p class="story-paragraph">[Be my only love]</p><p class="story-paragraph">--做我唯一的爱人</p><p class="story-paragraph">[&#x27;My only one&#x27;]</p><p class="story-paragraph">--我的唯一</p><p class="story-paragraph">告白的词句在这样的场景里听起来反倒像是最后的留言。</p><p class="story-paragraph">来这里之前，我其实真的以为我已经痊愈了，我已经恢复到可以不再想他，不再爱他，不再为他所动的样子了，那时候的我也是信奉着像昨天雅贤说的那种，只要慢慢来就都会好的。</p><p class="story-paragraph">但来这里之后的短短几天，我才发现原来也有时间都无能为力的事情，光阴刻下的划痕是没办法抹平的，它们只会长成一圈又一圈的年轮，在往后的任何时间剖开，都能被重新清楚地看见。</p><p class="story-paragraph">我忍不住扭过去看郑成灿。</p><p class="story-paragraph">他恰好也转过头来看我。</p><p class="story-paragraph dialogue">“昨天怎么回来那么晚？”他问。</p><p class="story-paragraph">奇怪的时机，但我还是回答了他是加班的原因。</p><p class="story-paragraph dialogue">“这么辛苦。”</p><p class="story-paragraph dialogue">“昨天的红豆饼没吃吗？怎么想着今天自己过来买？”</p><p class="story-paragraph dialogue">“雅贤和我说了，但我不是很饿。”</p><p class="story-paragraph">他点了点头，又不再说话了。车灯扫过路口几颗熟悉的木槿花树，我知道快到了。</p><p class="story-paragraph dialogue">“以后那么晚回家还是要记得吃点什么。”</p><p class="story-paragraph">车快要开进院门的时候郑成灿才终于又同我说话了。</p><p class="story-paragraph">但我敏感地捕捉到他的措辞，以后，回家，记得。他的语境时空好像不止是局限在小屋里，他的范围听起来似乎放到了更长远的未来。</p><p class="story-paragraph">心里突然就塌掉了一块，但就像早就蛀空的牙齿脱落了一角，疼痛谈不上，只是隐隐地发酸。</p><p class="story-paragraph dialogue">“我不会再回来那么晚了。”</p><p class="story-paragraph">空气里好像有无形的阻力，我的话语迎着飓风跋涉向他。</p><p class="story-paragraph">郑成灿愣了一下，转而笑着说好。</p><p class="story-paragraph dialogue">“下车吧，到家了。”</p><p class="story-paragraph">我跟在他身旁朝小屋的方向走去，他撑着伞的右手近在咫尺，清晰的血管走向感觉再凑上去一些就能听见脉搏。</p><p class="story-paragraph">我又忍不住抬头去看他，但他太高了，我只能看见他的清晰的下颌转角，他正目视前方兀自走着。</p><p class="story-paragraph">他没有懂我。我在心里默念，就像我已经开始不懂他了一样。</p><p class="story-paragraph">我不会再回来那么晚了的潜台词是，他的上一句叮嘱作废。</p><p class="story-paragraph">但这样无法宣之于口的，他又怎么会懂呢。</p><p class="story-paragraph">我们像两座许久都未通行的岛屿，仅凭溅起的浪花传递讯息。</p></div>
        <nav class="chapter-pager" aria-label="章节翻页"><button type="button" data-target="chapter-08"><span>‹ 上一章</span><strong>Love Me Like That（下）</strong></button><button type="button" data-target="chapter-10" class="next"><span>下一章 ›</span><strong>过线了会怎样</strong></button></nav>

      <article class="chapter" aria-labelledby="heading-chapter-10">
        <header class="chapter-header">
          <span class="chapter-number">10</span>
          <h2 id="heading-chapter-10">过线了会怎样</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">接下来的几天都没有进行什么特别的环节，我们看似平稳地度过了一个又一个在小屋的日子。</p><p class="story-paragraph">因为工作的原因，我平时白天并没有太多的时间呆在家里，但其实仅仅只是晚上回到小屋能见到郑成灿这一件事，也足够让人期待。期待和痛苦是可以共存的矛盾，我不敢见他和我想见他是交织着攀缘的双生花。</p><p class="story-paragraph">当然小屋里除了我和郑成灿，也上演着其他的悲欢离合，我们是被围观故事的主角却也一并旁观着别人的故事。</p><p class="story-paragraph">有人在新建一段关系，有人在挽留旧的过去，有人已经坦然释怀，有人仍在心生妒忌，有人错把遗憾当成爱意，有人却将真心长埋深底。这栋房子里同时存在了好多个或平行或相交的时空面，而我们也都在这团难解难分的乱麻里。因为没有上帝视角，就只能单纯地依靠着各种蛛丝马迹在感性与理性之间被拉扯。何去何从，选择与方向的更改很有可能就在一瞬。这样的高随机性也让每一个看似平静的表象之下都藏了一只惊弓之鸟。</p><p class="story-paragraph">虽然才相处了一周多的时间，但我好像几乎已经见过了所有人的第二面。无论是前两天在客厅偶然撞见的银硕和宥真，还是凌晨独自出门散心的允在，亦或是特别爱笑但也会偶尔失神的熙媛。</p><p class="story-paragraph">明面上与新人的相处都在继续，可一到角落里大家似乎也都还在整理自己。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“确实很劳心费神。”</p><p class="story-paragraph">接受后采的时候，我忍不住向工作人员大吐苦水。</p><p class="story-paragraph dialogue screen-line">「那当初为什么还是会选择来参加这个节目呢？」</p><p class="story-paragraph dialogue screen-line">「换乘恋爱其实也已经有几季了」</p><p class="story-paragraph">节目组真的是不会放过每一次可以深挖的机会。</p><p class="story-paragraph dialogue">“要说实话吗？”</p><p class="story-paragraph dialogue">“如果我说因为演出费的话会不会很俗啊？”</p><p class="story-paragraph dialogue">“这一段会播出去吗？”</p><p class="story-paragraph">把玩笑当作障眼法的行为在编剧老师面前完全行不通，我只能摸了摸鼻尖重新组织语言。</p><p class="story-paragraph dialogue">“当初只是想着能再见到成灿。”</p><p class="story-paragraph dialogue">“我们的分开好像还是太草率了些。”</p><p class="story-paragraph dialogue">“哪怕只是有机会好好说句对不起呢？”</p><p class="story-paragraph">我慢慢直视起镜头，这一次是百分之百的真话了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“想什么呢？”朴元彬的手在我眼前晃了晃。</p><p class="story-paragraph">水池里的水积了大半，已经完全没过了全部的碗碟，我赶忙反应过来将把手合上。</p><p class="story-paragraph">为了弥补前几天做晚饭放了他鸽子的事，今天我们俩组队收拾碗筷。客厅里断断续续地传递进来其他人的闲聊声，但只能听见零散的词汇。</p><p class="story-paragraph dialogue">“最近几天感觉都回来得还挺早。”元彬很随意地同我搭话。</p><p class="story-paragraph">我和他的相处好像确实会比旁人更自在一些，如果从观众的视角来看很有可能会认为是一条比较明显的换乘线。</p><p class="story-paragraph dialogue">“没有那么忙了，项目要收尾了。”我拿起一只玻璃杯放到指尖旋转着擦洗：“工作这种事情还是你们更幸福一点。”</p><p class="story-paragraph dialogue">“怎么说？”元彬转过头来看我。</p><p class="story-paragraph dialogue">“你们的时间都握在自己的手里吧。”</p><p class="story-paragraph dialogue">“多自由啊。”我带着憧憬陈述理由。</p><p class="story-paragraph dialogue">“啊...这样吗？”元彬的眉眼间出乎意料地闪过一丝惆怅。</p><p class="story-paragraph">可能就是因为这短暂的情绪波动，他一个不小心没拿住，手上的瓷盘跌落到水池的边缘，清脆又沉重的一声响，碎片迸裂开。</p><p class="story-paragraph dialogue">“没受伤吧！”元彬的第一反应是来查看我的情况。</p><p class="story-paragraph">右手突然被人轻轻握住，他沾水的双手像两块温润的凉玉。</p><p class="story-paragraph dialogue">“我..没事。”我吱唔着说，但下一秒就彻底噤声了。</p><p class="story-paragraph">众人被器具摔碎的响动吸引过来，我一抬头就望见了郑成灿站在人群的最后面看着我。</p><p class="story-paragraph">但他的大半张脸被阴影盖住了，像无端升起了一团浓雾。</p><p class="story-paragraph dialogue">“天呐！”熙媛看见地上七零八落的碎片惊呼了一声，银硕和允在很快找来了清扫工具，其他人也纷纷走进来帮忙处理。</p><p class="story-paragraph">我默默地和元彬分开，独自蹲到更深的角落里去收捡迸溅过去的残渣。</p><p class="story-paragraph dialogue">“没事吗？”</p><p class="story-paragraph">逃不过的，我听见郑成灿的声音冷冷地落下来，断字干脆得如同下雪子。他蹲到我旁边，水池和餐台之间本来就只有一条窄窄的过道，他的身形那样宽，体温和呼吸一时间都铺天盖地地接踵而来，带着强烈的侵略意味。</p><p class="story-paragraph dialogue">“不小心？”他又问了一句。</p><p class="story-paragraph">但语气不像问候，像逼供。</p><p class="story-paragraph">骤然升温的空气像翻起的海水呛进肺里，我的干咳声听起来欲盖弥彰。</p><p class="story-paragraph">大概是别的地方都收拾得差不多了，能感觉到有人向我们这边移动过来。</p><p class="story-paragraph">郑成灿才终于肯换了种更温和的语气问我。</p><p class="story-paragraph">我张了张口，但很久才找回自己的声音。</p><p class="story-paragraph dialogue">“没事。”我低着头小声说。</p><p class="story-paragraph dialogue">“刚刚是事发突然。”画蛇添足一样的补充，但嘴巴比大脑行动更快。</p><p class="story-paragraph">两句话就跟丢进了黑洞一样没有回音。</p><p class="story-paragraph">他没做任何反应，只抓走了最后几块比较显眼的碎片，然后就又飞快地起身离开了。</p><p class="story-paragraph">不一会儿我听见他在和走过来的宥真对话。可能说到了什么有趣的话题，他忽然就笑了起来，那种轻松又自如的笑声，我很久都没有听到过了。</p><p class="story-paragraph">原来他不是不会快乐，他只是和我在一起的时候不快乐。</p><p class="story-paragraph">只有我们别扭得仿佛两颗生了锈的齿轮，明明艰涩不堪却又非要强行咬合，结果弄巧成拙，把什么都变得曲折。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">深夜发完心动短信后带着最后一点没喝完的酒去二楼的露台吹风，十分意外地撞见了元彬。</p><p class="story-paragraph">瞟见他手指上的ok绷，我有些抱歉地询问他的伤势。</p><p class="story-paragraph dialogue">“一点小口子。”他有些不好意思地笑了笑。</p><p class="story-paragraph dialogue">“不过你没关系吗？”话锋转到我身上，他看我的眼神突然认真。</p><p class="story-paragraph dialogue">“什么？”</p><p class="story-paragraph dialogue">“没什么。”一楼有人关掉了客厅的灯，元彬瞳孔里的光暗了些。</p><p class="story-paragraph">短促的提示音响起，我们对视了一眼后开始查看各自的手机。</p><p class="story-paragraph">只有一条讯息。</p><p class="story-paragraph dialogue screen-line">「希望没有受伤」</p><p class="story-paragraph">难以捉摸的语气竟然让我产生了一丝侥幸心理。但紧跟而来的第二条信息很快就又把刚刚鼓起来一点的气球戳破了。</p><p class="story-paragraph dialogue screen-line">「你的X没有选择你」</p><p class="story-paragraph">不是郑成灿发来的消息。那不是他的话，是...</p><p class="story-paragraph">我猛然抬起头，朴元彬果然正在看着我，他的眼睛真的很好看，和郑成灿不一样的好看。里面有满开的带刺玫瑰，透出让人发晕的淡淡香味，目光像丝又像剑，像水又像风。</p><p class="story-paragraph dialogue">“没有受伤吧。”他轻轻地问我，好像生怕大声一点就会吓跑我一样，之前似乎只有郑成灿会这样对我说过话。</p><p class="story-paragraph">今晚没有月色，但他看起来身上结了一层隐隐反光的薄霜，我安静地望着他，却很清楚自己在看着两个人。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">命运好像就是在故意捉弄我。</p><p class="story-paragraph">这一晚的混乱之后录制很快进行到了男嘉宾单向选择女嘉宾约会的环节。约会前还需要和女生的X进行秘密对话，对话结束后男生可以再进行一次邀约调整。</p><p class="story-paragraph">朴元彬选择我是不意外的，但我没想到还会收到宋银硕的邀请。</p><p class="story-paragraph">男生们结束X谈话后我在厨房碰到过一次郑成灿，但他明显是在有意躲开我，看着匆匆离开的背影我却也没办法开口喊他。胶水灌满喉咙，酸涩的水只能往胸腔里倒流。</p><p class="story-paragraph">我们的关系好像又回到了刚开始录制的时候那样，甚至可以说更糟。</p><p class="story-paragraph">一直都解不开的题目，哪怕写满了稿纸，好像也只是越写越乱。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">和宋银硕的约会在上午。</p><p class="story-paragraph">到约定的咖啡店的时候，他已经点好了饮品在靠窗的位置等我。</p><p class="story-paragraph dialogue">“怎么会选我啊？”</p><p class="story-paragraph">直接用这个必然存在的问题开门见山。</p><p class="story-paragraph">宋银硕停下搅动冰块的手，嘴角往一边微微扬起，这种清淡又带着点玩味的笑容是他的常用表情。</p><p class="story-paragraph dialogue">“一直没有机会进一步聊聊。”</p><p class="story-paragraph dialogue">“感觉我们是处境很像的人。”</p><p class="story-paragraph dialogue">“什么处境？”我歪着头问他。</p><p class="story-paragraph">他却又避开了我的问题把话题岔到了别的方向。</p><p class="story-paragraph dialogue">“昨天还好吗？”他依旧保持着那副笑容。</p><p class="story-paragraph">昨天和郑成灿擦肩而过后确实在厨房偷偷哭了一会，不过居然被发现了吗？我眨了眨眼睛，不置可否地抿起嘴巴。宋银硕确实是很细心的人，尽管大多数时候他都保持着一副默不作声，疏离远观的状态。</p><p class="story-paragraph dialogue">“是要洗的碗太多了啊！”我故作轻松地开玩笑，既然是约会的话，还是不太想让我的情绪给别人造成负担。</p><p class="story-paragraph dialogue">“啊，昨天用的碗确实挺多。”他很擅长不让话掉到地上。</p><p class="story-paragraph dialogue">“下次做饭我会酌情考虑的。”他笑起来的时候，左边的眼睛会眯缝着，让人觉得是一种聪明的真诚。</p><p class="story-paragraph dialogue">“下次不要再为这种事情哭了吧。”</p><p class="story-paragraph dialogue">“应该没有被别人发现吧？”我挠了挠头。</p><p class="story-paragraph dialogue">“可能...”</p><p class="story-paragraph dialogue">“还是有。”</p><p class="story-paragraph dialogue">“昨天你的X和我提到了很多次要照顾到你的情绪。”</p><p class="story-paragraph">我没想到宋银硕就这样诚实直白地把这些话说出来了。这是我第一次从别人口中听到郑成灿是如何讲述我的。</p><p class="story-paragraph">既然提到要照顾，又为什么非要假借他人之手？郑成灿难道真的不知道，哪怕只是从他的眼睛里跑出来一点点光，都可以把我的全身捂热？倒也不是真的有多么脆弱到需要所有人的照顾，我只是在他一个人面前才会毫无招架地丢盔卸甲。</p><p class="story-paragraph dialogue">“我的情绪..也还好吧。”我矢口否认了他的描述。</p><p class="story-paragraph dialogue">“他还说了什么？”</p><p class="story-paragraph dialogue">“你喜欢冰美吗？”</p><p class="story-paragraph dialogue">“不喜欢，我喜欢摩卡。”没明白为什么会斜插进来这样的问题，我愣愣地回答他。</p><p class="story-paragraph dialogue">“好险。”宋银硕拍了拍胸口。</p><p class="story-paragraph">看着他的反应，思路回转过来了一些，我问他是X说我喜欢冰美吗？但宋银硕不再回答我的问题，他只是笑着卖关子。</p><p class="story-paragraph dialogue">“播出的时候你应该就会知道了吧。”</p><p class="story-paragraph">下午吃过茶点，我和宋银硕道别，随后奔赴下一个约会地点。</p><p class="story-paragraph">在江边看到朴元彬的时候已经临近傍晚。</p><p class="story-paragraph">傍晚的落日，淡金色的黄昏，江风里带着潮湿的草籽香味，记忆果然可以存在于任何载体，我完全是自然而然地就想到了郑成灿，想起我们被一浪接一浪的水声包裹着的初吻，脚步不由自主地慢了下来。</p><p class="story-paragraph">几近停滞的时候，我才听见朴元彬在不远的地方喊我的名字，赶忙小跑过去，不知道该如何解释，只能不停地小声说抱歉。</p><p class="story-paragraph dialogue">“昨天还好吗？”和宋银硕一摸一样的问题。</p><p class="story-paragraph">我瞪大了眼睛问他是X也和他说了什么照顾之类的话吗？</p><p class="story-paragraph">朴元彬一边摆弄帐篷的一角，一边点了点头。</p><p class="story-paragraph">所以郑成灿是打算做什么深藏功与名的幕后英雄吗？</p><p class="story-paragraph">我无奈地从鼻子里发出一声轻笑。</p><p class="story-paragraph dialogue">“怎么了吗？”元彬仰起头来问我。</p><p class="story-paragraph dialogue">“没什么，就是想到了一些很幼稚的事。”</p><p class="story-paragraph">我说着蹲下身去帮他处理缠在一起的线头。</p><p class="story-paragraph">今天晚上的约会内容是江边露营，小火炉在一旁安静地烧着，伴着木柴的噼啪声，我们聊了好多话题。他给我讲他的家乡蔚山，讲他小时候学击剑时的糗事，讲他为了音乐被迫放弃的点点滴滴。</p><p class="story-paragraph">他的人生经历远比我想象得要复杂，但也精彩。每一轮四季应该都在他身上留下了鲜明的痕迹。</p><p class="story-paragraph dialogue">“和我说这么多吗？”</p><p class="story-paragraph dialogue">“我们不是越来越熟悉吗？”他把头靠在椅背上，酒精作用下他的眼神变得像温软的勾子。</p><p class="story-paragraph">我不敢看他了，只能继续一杯接一杯地让烧酒下肚。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">一直到把酒全部喝完我和朴元彬才回家。</p><p class="story-paragraph">客厅里其他人都已经到齐，我看了一眼时间确实不算早了。</p><p class="story-paragraph dialogue">“去哪里玩了？”民浩过来将元彬扶住。</p><p class="story-paragraph dialogue">“你们在玩什么吗？”我只瞟了一眼坐在桌角的郑成灿，随即注意力就被桌上散放的积木吸引了过去。</p><p class="story-paragraph dialogue">“抽积木。”雅贤回答了我之后又有些担心地问我需不需要休息。</p><p class="story-paragraph">我摇了摇头，虽然头有些晕晕的，但也不至于到意识模糊的境地，于是我拉了一把椅子坐下，嚷嚷着说也要参与游戏。</p><p class="story-paragraph">因为元彬坐在最靠外，所以最新一轮从他开始。</p><p class="story-paragraph">他起身没有犹豫地就抽走了右上角的一块，他扫视了一眼积木背面的内容，随即轻轻地念了出来，还是有点小醉的缘故，他的语调上扬起来像唱歌一样。</p><p class="story-paragraph dialogue screen-line">「请选择一位异性对视30秒」</p><p class="story-paragraph">他读完这句话和念出我的名字完全是无缝衔接。众人都开始起哄鼓掌，突如其来的热闹一时间似乎加重了我头晕脑胀的症状。我揉了两下太阳穴，但为了不扫大家的兴致，我还是将视线笔直地转了过去。</p><p class="story-paragraph">在灯光的映照下，元彬的瞳孔像透明的琥珀，仿佛能映出来我自己的影子。</p><p class="story-paragraph">但我同时也敏锐地察觉到了来自另一个角落的注视，所以在智恩说出三十秒结束的时候，我飞速地挪开了目光。</p><p class="story-paragraph">接下来依次是允在、宥真、银硕，然后轮到郑成灿了。</p><p class="story-paragraph">他站起身来投下的阴影感觉都能将我完全笼罩住，我看着他用指尖轻轻一拨，成功拿出了一块中间的积木。</p><p class="story-paragraph dialogue screen-line">「请选择一位异性对视30秒」</p><p class="story-paragraph">如果命运非要捉弄人的话，我希望他可以不要再是这样密集的频次。完全像历史重演一般，我听见郑成灿也果断地叫了我的名字。</p><p class="story-paragraph">大家又开始兴奋地用手打起节拍。</p><p class="story-paragraph">我在心里重复默念着“不能让别人看出来X之间的异常氛围”的规则，一边视死如归一般略微侧过去一点脸。</p><p class="story-paragraph">但郑成灿已经完全转过身来在等我。</p><p class="story-paragraph dialogue">“开始计时！”计时员智恩按下手机上的秒表开关，我和郑成灿的目光别扭地交汇在一起。</p><p class="story-paragraph">人在不安的时候眼神就会下意识地逃避，他的视线如同一座高耸入云的尖峰直挺挺地压过来，步步紧逼之下我只能节节败退。像什么猫捉老鼠的把戏，他好像是故意放任我逃离，但又会在藕断丝连的瞬间一把将我拉回深渊去。</p><p class="story-paragraph">从来不知道三十秒也会这样难捱。就在我快要缴械投降说出放过我的时候，智恩终于宣布时间到了。</p><p class="story-paragraph">像经历了一场旷日持久的虚无跋涉，我完全脱力地垂下头。</p><p class="story-paragraph dialogue">“连着抽了好几个一样的了。”宋银硕突然发话。</p><p class="story-paragraph dialogue">“成灿再抽一个吧。”</p><p class="story-paragraph">在我还没反应过来的时候，郑成灿已经又抽了一块积木出来。不知道是写了什么内容，我看见他的瞳孔有非常清晰地颤动。</p><p class="story-paragraph dialogue screen-line">「请选择一位异性对视30秒」</p><p class="story-paragraph">宣读的话音还没落下，大家就开始哄堂大笑起来。</p><p class="story-paragraph dialogue">“今天是怎么回事啊？”</p><p class="story-paragraph dialogue">“这个积木是只有这一句吗？”</p><p class="story-paragraph dialogue">“等会结束了检查看看。”</p><p class="story-paragraph dialogue">“我可以选了吗？”好像只有郑成灿一个人在非常认真地玩游戏，他的较真劲有时候就是用在一些很奇怪的地方。</p><p class="story-paragraph">正在心里感叹的时候，我的名字又被他那好听的嗓音念出来了。</p><p class="story-paragraph">气氛忽然安静下来，众人有些面面相觑。我也瞬间清醒了，有些不可置信地望向他。</p><p class="story-paragraph">他看起来倒是依旧很坦然，好像只是说了一件稀松平常的事。</p><p class="story-paragraph dialogue">“那我开始计时了。”智恩将我和郑成灿都打量了一眼，然后主动打破了僵局。</p><p class="story-paragraph">没办法，我只能又一次看向他的眼睛。</p><p class="story-paragraph">事情的发展简直荒谬得就如同两根平行线突然产生交点。</p><p class="story-paragraph">但其实这一次是截然不同的。这一点在四目相对后的下一秒我就发现了。</p><p class="story-paragraph">他没有再用那样冷冰冰的眼神看我，相反的，他的眼底开始漾起温柔又胆怯的暗流，雾气，泡沫，玻璃碎片在他的瞳孔里变幻不定。水渐渐地溢出来向我蔓延，这一次他不是要我把拉回深渊，他只是用温热的潮湿来试图浸润我。</p><p class="story-paragraph">曾经我特别喜欢看郑成灿的眼睛，他看书的时候我会凑过去摘下他的眼镜看，一起在阳台上目送夕阳的时候我会突然转过身踩上他的拖鞋仰起头看，甚至是接吻的时候我也偶尔会偷偷打量他因为我而微颤的睫毛和眼部皮肤。</p><p class="story-paragraph dialogue">“我怎么就没有这么好看的眼睛。”</p><p class="story-paragraph">他总是会被我这种不切实际的斗气惹得一阵好笑。</p><p class="story-paragraph dialogue">“这么好看的眼睛能不能只看我。”我伸出小拇指试图跟他拉勾。</p><p class="story-paragraph">他很听话地陪我拉钩，盖印。</p><p class="story-paragraph dialogue">“一百年不许变。”</p><p class="story-paragraph">这种用来哄小孩子的话有时候大人也爱听。</p><p class="story-paragraph">客厅的灯光在郑成灿的眼睛里落下矩形的光影，随着他瞳孔的闪动，星星点点地仿佛在写什么句子。</p><p class="story-paragraph">对不起。</p><p class="story-paragraph">还是我爱你。</p><p class="story-paragraph">我的脑海里此刻再想不出来别的，我早就说过在照顾情绪这件事上，没有什么会比他本人管用。短短的时间里郑成灿就又成功地把我融化了，溶掉了这几天积累成的又涩又硬的壳，我在他面前又重新变成透明且柔软的一团。</p><p class="story-paragraph">我好像突然又有勇气完全去正视他的眼睛了。</p><p class="story-paragraph">希望这一切不是喝醉酒的幻觉。</p><p class="story-paragraph">希望这一次，我们对上了正确的暗号。</p></div>
        <nav class="chapter-pager" aria-label="章节翻页"><button type="button" data-target="chapter-09"><span>‹ 上一章</span><strong>你懂我的吧</strong></button><button type="button" data-target="chapter-11" class="next"><span>下一章 ›</span><strong>如果爱忘了</strong></button></nav>

      <article class="chapter" aria-labelledby="heading-chapter-11">
        <header class="chapter-header">
          <span class="chapter-number">11</span>
          <h2 id="heading-chapter-11">如果爱忘了</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">本来以为会是一个平静的周末，结果在午后时间节目组突然又送来了新的信件。</p><p class="story-paragraph">因为昨天晚上短暂的小小闹剧，和大家一起坐在客厅的时候我多少还是有些局促，虽然智恩偶尔也会递话给我，但我也只能简单地作出一些回复，而后便又安静地在沙发的角落蜷成一团。</p><p class="story-paragraph">这突如其来的门铃声恍如救世主，于是我第一个跑出去取回了信封。</p><p class="story-paragraph">在众人的猜测声中我抽出了薄薄的信纸。</p><p class="story-paragraph">信上密密麻麻写了好几行规则，我没办法一口气提前默读完，便只能慢慢地念起来。</p><p class="story-paragraph dialogue screen-line">「请编辑短信选择前往X-room还是Personal room」</p><p class="story-paragraph dialogue screen-line">「如果选择X-room的话，可以回忆与X过去的恋爱经历并查看事前采访」</p><p class="story-paragraph dialogue">「如果选择Personal room的话，将可以了解你最好奇的异性信息，并在参观完后和对方进行1对1的对话」</p><p class="story-paragraph dialogue screen-line">「二选一，请谨慎考虑」</p><p class="story-paragraph">与新人的发展和与旧人的纠缠在此之前都只是交错并行的各条暗线，笑容包裹着眼泪，心动串联着心痛，这种共处模式虽然混乱无序，但也几近习惯。</p><p class="story-paragraph">现如今节目组却又要强行把这些乱线拆开，这封信无疑是在提醒我们换乘进行过半，分叉路口的抉择已经迫在眉睫。</p><p class="story-paragraph">听完内容，客厅果然陷入了沉寂，几乎每个人都收敛了表情。</p><p class="story-paragraph">我下意识地看向郑成灿，他没思考太久就拿起了手机。</p><p class="story-paragraph dialogue">“是发送短信吗？”</p><p class="story-paragraph">没料到他会突然抬起头来问我，视线对上的一刻我像被触碰的含羞草一样狠狠皱缩了一下叶片。</p><p class="story-paragraph dialogue">“对，发短信就好。”</p><p class="story-paragraph">被抓包以后我不敢再看他，只俯身把信纸放到茶几的正中间，方便每个人都可以自主阅读。</p><p class="story-paragraph">回到原先的位置坐下，拿起手机点开对话框以后我却陷入了思考。</p><p class="story-paragraph">做选择是一件很难的事情，哪怕现在只是两者选其一。</p><p class="story-paragraph">我不太擅长选择，所以在玩游戏碰到剧情线分流的节点时，我总是喜欢先存档再逐一尝试，但现实生活不存在这样的机制，每一次选择就是在人生路上打下一个固定的锚点，都决定着最后形状的一笔一画。</p><p class="story-paragraph">而放到爱的语境里只会变得更难，爱是两个人的选择，两个人的选择除了需要正确，还需要吻合。</p><p class="story-paragraph dialogue">“这流程也太紧凑了吧。”熙媛发完了信息，开始发表看法。</p><p class="story-paragraph dialogue">“因为紧凑才揪心啊。”雅贤笑了笑，继续在屏幕上敲字。</p><p class="story-paragraph dialogue">“选哪一个都感觉好残忍啊。”</p><p class="story-paragraph dialogue">“必须要做出整理了。”</p><p class="story-paragraph">大家的讨论在我的耳边萦绕着，但我始终没捕捉到郑成灿的声音。</p><p class="story-paragraph">他刚刚看起来好像没有考虑太久。那他会选谁？熙媛还是雅贤？我期冀着第三个选项，但我实在没有什么信心，曾经的我是他的第一顺位，但现在的我真的还可以让他毫不犹豫吗？</p><p class="story-paragraph">如果最后只有我一个人去X room的话，我想象不出滔天的回忆巨浪会如何击碎我，大概从骨骼到灵魂都会变得粉碎吧。</p><p class="story-paragraph">手指在屏幕上游移，白光很是刺眼，第一次无比清晰地察觉到自己对未知的恐惧。可是除了郑成灿，我好像也没办法说服自己做出别的选择，不知道该如何解释这种情况，但是就当下而言，离开他远比靠近他要更难做到。</p><p class="story-paragraph">再也不见这四个字哪怕只是在脑海里出现了一秒都让人觉得眩晕，于是我最终敲下了“X room”的选择。</p><p class="story-paragraph">大概一小时后以后大家开始在工作人员的安排下陆陆续续出门了。</p><p class="story-paragraph">郑成灿比我先走，我竟不知不觉跟他到了门口，但我们什么都没说，人在关键时刻失语好像是常态。</p><p class="story-paragraph">我看着他穿鞋，出门，以大门合上的那一刻为节点，命运就已经生成了后续的走向。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">又过了一小时我才收到提醒前往录制地的短信。</p><p class="story-paragraph">这一次节目组安排了一整幢小别墅用来进行房间布置。刚刚在车上远远地望着的时候，感觉就像一个巨大的记忆盒子，原来时间可以浓缩成这样的空间表达。</p><p class="story-paragraph">顺着指引，我来到了第一个主房间，桌上放着的立牌重复了一遍规则，X room和Personal room的房门面对面，俨然两个对立世界的入口。</p><p class="story-paragraph">我深吸了一口气转身把手放到了X room的门把上，金属的把手碰到手心竟然像一把刺人的冰刃。我知道门后面是什么，但就是因为太过于清楚我们过去有多么幸福，所以才变得更胆怯。</p><p class="story-paragraph">看影视剧和文学作品的时候，我更偏好痛感，贪恋一些在顶峰上戛然而止，在流年里无疾而终的剧情，总觉得遗憾的加码可以让时间变得厚重。但没想到有一天这样的厚重也会需要我自己来承受。</p><p class="story-paragraph">锁舌离开锁口的声音像铰链开始运作，记忆的闸门就此打开。</p><p class="story-paragraph">暖光照亮的房间，陌生的环境里充斥着熟悉的物件，相片和文字，像不同语言的诗行，但都在共同讲着我和郑成灿的故事。</p><p class="story-paragraph">而一张张卡片从天花板悬吊下来，仿佛一场从冲破了时光隔层的倾盆大雨。</p><p class="story-paragraph">我是自愿走进雨里。</p><p class="story-paragraph">最近的地方摆了两封信，是我们在一起一百天的时候互相写的。也不知道为什么我们都不约而同地选择了这种温柔而笨拙的方式。</p><p class="story-paragraph dialogue screen-line">「好神奇啊，居然在一起一百天了」</p><p class="story-paragraph dialogue screen-line">「真的谢谢你喜欢我」</p><p class="story-paragraph dialogue screen-line">「好像每一天都有变得更多爱你一点」</p><p class="story-paragraph dialogue screen-line">「成灿就是我的人生太阳啊～」</p><p class="story-paragraph dialogue screen-line">「我没有一刻不想你」</p><p class="story-paragraph dialogue screen-line">「我们一直一直在一起吧」</p><p class="story-paragraph dialogue screen-line">「让我们成为“没有什么是永远的”这句话的例外吧」</p><p class="story-paragraph">两边的文字穿插在一起看，当时的表达真是青涩又直白，大概只有没有体会过时间威力的年轻人才敢用永远，一直这样的词汇来妄言。</p><p class="story-paragraph">我看见相框玻璃上映出此时自己的脸，彼时的文字作底，但对于爱可以抵挡万难的坚信却似乎已经不复存在了。</p><p class="story-paragraph">再往前走两步放着一本人生四格的相册。之前没有这样整理过，现在一张张罗列好才惊觉居然拍了这么多。</p><p class="story-paragraph">首尔林小巷里的一家店我和郑成灿去得最频繁，大多数都是随意在路上散步的时候就进去拍了。</p><p class="story-paragraph">拍照的本意是纪念，当时好像真切地认为每一天都值得纪念。</p><p class="story-paragraph">我们一起戴可爱或怪诞的头饰，有时候也会直接用手给对方比划猫耳或鹿角，有时候会贴脸拍，有时候会拥抱，比心的动作也是五花八门。</p><p class="story-paragraph">印象最深刻的那张我很快就在相册中发现了，没有什么巧妙的设计，反而是一次无心之举。</p><p class="story-paragraph">那天是我突发奇想在倒计时5秒的时候亲了他的左脸，他的反应远比我想象的快，虽然受到了瞬时的冲击，但也只是扫了一眼时间便将我一把抓进怀里，嘴唇相碰的时候快门也刚好按下了。</p><p class="story-paragraph">本意是想抓住他的窘迫，结果拍出来我自己更像一只受到巨大惊吓的兔子。</p><p class="story-paragraph">怎么会有人一边亲吻，一边缩着头往别人的臂弯里躲呢。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">这本相册旁边还挂了很多其他的相片，颜色鲜艳如初，仿佛都是昨天才拍的一样。</p><p class="story-paragraph">我们真的分手了吗？一瞬间我竟然产生了这样的疑问。</p><p class="story-paragraph">照片里的两个人长着和我们一样的面孔，而他们的幸福看起来那样隽永。</p><p class="story-paragraph">我一张一张慢慢地看着，时间之水开始倒流，一个又一个的场景串联成线，仿佛在播放一部跨度巨大的定格电影。</p><p class="story-paragraph">有我在趁他烤肉的时候抓拍的合影，有我们第一次结伴去鬼屋出来时的双双大惊失色，有我们两手合握着绳子在公园的小道上遛狗，小狗的毛发像雪一样白，所以郑成灿给它取名叫冬天。</p><p class="story-paragraph dialogue screen-line">「我好像没办法离开你了」</p><p class="story-paragraph">这句话是我曾经在kkt发给郑成灿的，没想到会被节目组贴在相片合集的最下面作为这块篇章的总结。</p><p class="story-paragraph">那时候的我们那样美好，的确无论重返几次当年，我想我都会义无反顾地和他说出这句话。</p><p class="story-paragraph">只是没办法离开是我的事，但离开是他的事。这个道理我现在才明白。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">因为抑制眼泪的本能，我仰起头来，但更多的话语碎片像潮水一样向我涌来。悬挂的卡片上印着的各种句子都是我们分别复述给节目组的。</p><p class="story-paragraph dialogue screen-line">「郑成灿是傻瓜」</p><p class="story-paragraph dialogue screen-line">「只要你和我说晚安的话，我就能睡着啦」</p><p class="story-paragraph dialogue screen-line">「不要生病，不要感冒」</p><p class="story-paragraph dialogue screen-line">「我们什么时候去日本看东京塔呀」</p><p class="story-paragraph dialogue screen-line">「快点出来吧，我想见你」</p><p class="story-paragraph dialogue screen-line">「今天想吃什么便当呢」</p><p class="story-paragraph">这上面的每一句话我几乎都能回忆起精准的语气，明明安静的房间此刻却变得格外喧闹嘈杂，无数个时空平面的我们在此刻重叠，一幕幕仿佛都在眼前真实地上演着。</p><p class="story-paragraph">郑成灿的嗓音甚至也在我的耳边不远不近地响起，温柔清澈得像细细的流水，但这些水只能淌过一道又一道的伤口，留下一阵阵灼热又缠绵的疼痛感。</p><p class="story-paragraph">有时候格外希望过日子就像撕日历纸，撕掉了就是不存在了。但这又怎么可能呢？时间是最精细的雕刻家，它总是能把最重要的东西刻在最脆弱柔软的地方。</p><p class="story-paragraph">不能忍受剜除阵痛的人就只能接纳这细密漫长的折磨。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">眼睛变成了盛满水的池塘，这种时候就算是合上了也无济于事。眼泪还是顺着眼角流出来了，情绪不是什么时候都乖乖听话的，抑制到一定程度的时候它们就会变成肆意反扑的失控怪兽。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">站在原地平复了好久才有力气继续看下去。</p><p class="story-paragraph">接下来是一些旧的物件，情侣单品并不多，只有一些鞋子和出去约会的时候互相做的手串。</p><p class="story-paragraph">视线忽然扫到角落里叠得整齐的花格围巾，这条围巾是我们在一起后的第一个冬天郑成灿买给我的，当时因为旧了就随便扔在了衣柜里，没想到他竟然还留着。</p><p class="story-paragraph">记得那年圣诞节我们一起去了光化门广场，哪怕冒着漫天大雪也想看一次难得的圣诞树亮灯仪式，临出门的时候他给我围了这条围巾，结果自己的却忘了拿，最后一个人在广场边上冻得瑟瑟发抖。</p><p class="story-paragraph dialogue">“一起围吗？”等返程公交的时候我戳了戳他的胳膊。</p><p class="story-paragraph">他转过头看我，鼻头都冻得通红了，夜色里看着像泛起红晕的白瓷。</p><p class="story-paragraph dialogue">“我没事。”虽然嘴硬但发颤的声线没法骗人。</p><p class="story-paragraph">我迅速扯开围巾将他也圈了进来，这是我少有的强势时刻，他非常明显地愣了几秒。</p><p class="story-paragraph">在围巾构筑的小小空间里我们贴得极近，他毛茸茸的头发像突然从编织针脚里长出了几颗蒲公英。</p><p class="story-paragraph">能感觉到他冰凉的皮肤在慢慢回温，我把下半张脸埋在围巾里嗡嗡地问他好些了吗。</p><p class="story-paragraph">他轻轻地嗯了一声，然后把我的左手重新拉进了他的大衣口袋里。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">我把围巾从柜台上拿起来，虽然有些起毛球了，但面料的触感还是十分柔软，甚至还能感觉到一丝温热。下意识地将它贴到脸上，很意外没有什么尘封太久的味道，反而能闻到一点点皂角香。</p><p class="story-paragraph">这种味道我经常在郑成灿的衣服上闻到，太熟悉了，熟悉得仿佛下一秒将围巾揭下来，他就会出现在我面前一样。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">最后一个展柜里放着从我们的共享日历本中摘出的一些片段。</p><p class="story-paragraph">我们之前总会把一些一起完成的大事写在日历上，最开始有这个想法的时候我和郑成灿开玩笑说要一直写到头发白了，眼睛花了。本来以为他会笑我三分钟热度，结果他很认真地回答我说，那试试呢。</p><p class="story-paragraph">虽然最终没有写到那么久，但三年的时间里我们还是零零碎碎记录了许多。</p><p class="story-paragraph dialogue screen-line">「9月13日，在汉江边上一起度过了难忘的生日」</p><p class="story-paragraph dialogue screen-line">「6月21日，接冬天小狗回家啦」</p><p class="story-paragraph dialogue screen-line">「11月3日，今日下雨重温了时空恋旅人」</p><p class="story-paragraph">看到最后一行，赫然的几个大字突然像陨石坠落一样砸进眼睛里。</p><p class="story-paragraph dialogue screen-line">「12月10日，我们分手了」</p><p class="story-paragraph">突然被人从睡梦里叫醒，花园变成了荒野。我这时才意识到整个房间原来这样安静，刚刚发生的都像幕布落下后才发现观赏了一出独角戏一般荒谬。</p><p class="story-paragraph">我们分手了，我还是完全适应不了这个事实。</p><p class="story-paragraph">思路从未像此刻这般清楚。</p><p class="story-paragraph">分开太痛了，我承受不来，我终于肯承认这是我从没说出口的坦言。</p><p class="story-paragraph">我不要戏剧里燃烧的那一霎那了，我只想和郑成灿长久地见面，日复一日地见面，只要能在身边，我就会真心感谢每一天都升起的太阳，每一缕拂过他再拂过我的风。</p><p class="story-paragraph">我其实没办法解释爱是什么，因为对于这个名词我也是一知半解，但既然已经可以肯定只有靠近他我才会不那么痛苦，那我想应该可以就此确信这就是爱了吧。</p><p class="story-paragraph">我还在爱着郑成灿吧。</p><p class="story-paragraph">爱到都在嫉妒曾经被他爱着的自己。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">房间里的视频是突然播放起来的，不得不说节目组真的很会选择时机，在我的情绪快要决堤的时候，郑成灿的声音温和地贴附了上来，像一剂良方。</p><p class="story-paragraph dialogue">“因为是初恋，所以我们处理问题的方式好像都不是特别的成熟。”</p><p class="story-paragraph">我顺着声音找到另一个角落里突然亮起的电视屏幕，郑成灿端正地坐在那间我熟悉的采访间里，他的眼睛望着别的方向，我从未以这种旁观者的姿态倾听过他的心里话。</p><p class="story-paragraph dialogue">“这半年里面其实也不是没想过找她。”</p><p class="story-paragraph dialogue">“因为感觉以她的性格，其实，哦不是，应该是一定会过得很辛苦。”</p><p class="story-paragraph">他若有所思地扯出一个很淡很淡的笑容。</p><p class="story-paragraph dialogue">“当时说分手的原因，是我看到她似乎在因为我受累的时候，忽然就有了放手的想法。”</p><p class="story-paragraph dialogue">“我希望她可以直接地告诉我一些事情，但这对于她好像逐渐成了负担。可是她如果不告诉我，这又会让我很难过。”</p><p class="story-paragraph dialogue">“怎么办呢？”他忽然自嘲似的笑起来。</p><p class="story-paragraph dialogue">“爱有时候也是会无能为力的。”</p><p class="story-paragraph">【那为什么会来参加我们的节目】</p><p class="story-paragraph dialogue">“是因为很多朋友都说我不喜欢曝光自己吗？”</p><p class="story-paragraph dialogue">“但其实也没有绝对的不可能。”</p><p class="story-paragraph dialogue">“不可能有时候也会有变成可能的方法吧。”</p><p class="story-paragraph dialogue">“你问我什么方法吗？”</p><p class="story-paragraph dialogue">“可以选择保密吗？”</p><p class="story-paragraph dialogue">“以后如果有机会的话，我会说的。”</p><p class="story-paragraph">画面随着他的话音落下也逐渐转黑。磨砂的屏幕上映出我呆呆的虚影，我才发现刚刚一直都没看见旁边放置的沙发，竟就这样僵立着看完了整段视频。</p><p class="story-paragraph">完全安静下来的空间在无声地提醒我该离开了，但我却好像完全被抽空了力气，这里像是一场美梦，而我就是在快要醒来的边缘拼命挣扎着。</p><p class="story-paragraph">我不想从这场梦境里出去，我不想去到没有郑成灿的真实世界里，哪怕我知道这里其实更该说成是一片陈旧的沼泽地。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">在门口犹豫不前的时候，口袋的手机传来了震感，拿出来查看，是节目组发来的新消息。</p><p class="story-paragraph dialogue screen-line">「请前往以下地址，你的X在那里等你」</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">我几乎是一路飞跑出门的，甚至在车上的时候还询问了一次司机师傅可不可以再快一些。</p><p class="story-paragraph">可是为什么要再快一些呢？郑成灿又不是只会短暂停留的蝴蝶。</p><p class="story-paragraph">我大抵是更担心自己好不容易建立又几近消散的勇气。</p><p class="story-paragraph">他还爱我，他不再爱我，这样摇摆混乱的思绪做了太久我一切行为的绝对指挥家，这一次我想自己指挥自己了。</p><p class="story-paragraph">想快点见到他，这是我尝试给自己下的第一道命令。</p><p class="story-paragraph">郑成灿在咖啡厅靠窗的位置等我。</p><p class="story-paragraph">窗外浓密的树荫送进来绿色的光影，我刚进门就看他像一幅静谧的画，一幅等待着一个冒失之人闯进去的画。</p><p class="story-paragraph dialogue">“等了很久吗？”还没坐下，我就直接发问了。</p><p class="story-paragraph dialogue">“还好。”他抬起头来似乎很平静地看着我。</p><p class="story-paragraph dialogue">“看了...那个吗？”他的反应让我不由得一时间又变得小心翼翼起来。</p><p class="story-paragraph dialogue">“什么？”</p><p class="story-paragraph dialogue">“X room。”</p><p class="story-paragraph">这样的一问一答让我忽然觉得无比委屈，所以他没去看吗？不然为什么要问我看什么？那我刚刚突然萌生的努力念头又算什么呢？</p><p class="story-paragraph">我真的有在努力了，但一个人的努力在命运的走向面前渺小得就像一粒沙尘试图挡住洪水。这样是否有些不公平了，他能不能也像我一样难过一次呢？</p><p class="story-paragraph">我看着他的眼睛，眼泪几乎又快要在一瞬间止不住，但我还是努力让它倒流了回去，可倒流的眼泪就像强劲的硫酸溶液，能瞬时把五脏六腑都灼烧透了。于是我又几不可察地皱了皱眉头。</p><p class="story-paragraph dialogue">“你刚看完吗？”郑成灿反问我。</p><p class="story-paragraph">我有气无力地点了点头，已经不想再多说什么了，我只能开始胡乱地搅动他给我点好的咖啡，白色的拉花变成混沌的形状，和我一样。</p><p class="story-paragraph dialogue">“我也看完了。”他轻轻地说。</p><p class="story-paragraph">我听见他端起杯子的声音，抬起头的时候咖啡杯刚好挡住了他的脸。</p><p class="story-paragraph dialogue">“你也看了吗？X room?”</p><p class="story-paragraph">没有意义的重复，但我莫名地就是想听到他用完整的话语来陈述。</p><p class="story-paragraph dialogue">“是的，我去了X room。很意外吗？”</p><p class="story-paragraph dialogue">“我确实不敢肯定。”</p><p class="story-paragraph dialogue">“为什么呢？”</p><p class="story-paragraph dialogue">“你有好几天都没有给我发过短信了。”</p><p class="story-paragraph dialogue">“可是你不也一样吗？”</p><p class="story-paragraph">郑成灿忽然笑起来，但这个笑容是没有太多温度的。</p><p class="story-paragraph dialogue">“你在误会我和元彬吗？”</p><p class="story-paragraph dialogue">“那你又在误会我和谁呢？”</p><p class="story-paragraph">我们仿佛竞技场上的对手，一来一回地刺痛彼此，似乎靠痛觉就能分辨爱意。</p><p class="story-paragraph">倔强又滑稽的回合制。</p><p class="story-paragraph">但不想再这样消磨下去，于是我主动岔开了话题。</p><p class="story-paragraph dialogue">“你采访最后说的秘密是什么？”</p><p class="story-paragraph dialogue">“好像还没有到揭晓的时候。”郑成灿继续喝杯子的咖啡，尽管这一杯已经快要见底了。</p><p class="story-paragraph dialogue">“看到房间的时候有什么想法吗？”在我沉默之后，他又接过了发问的主动权。</p><p class="story-paragraph dialogue">“感觉到我们曾经那么喜欢对方。”我实话实说。</p><p class="story-paragraph dialogue">“所以分开后真的过得很好吗？”</p><p class="story-paragraph dialogue">“可是说不好的话，又有什么意义呢？”我狐疑地问。</p><p class="story-paragraph dialogue">“我过得不好呢。”郑成灿一个字一个字地说。</p><p class="story-paragraph dialogue">“对不起...”我愣了几秒，但这三个字好像是我唯一能说的，我说着慢慢把头垂得更低了。</p><p class="story-paragraph dialogue">“我应该早点跟你说对不起的。”</p><p class="story-paragraph dialogue">“早点是什么时候呢？”</p><p class="story-paragraph dialogue">“当初如果你说了亲爱的对不起，或许我们就不会来换乘恋爱了吧。”</p><p class="story-paragraph">他语气模棱两可，听起来既不绝对严肃，却也不像轻佻的玩笑。</p><p class="story-paragraph">我有些不敢置信听到的内容，于是又一次看向郑成灿。</p><p class="story-paragraph">他也正微微歪着头在看我。一双眼睛亮亮的像透明光滑的树脂球，我相信人的眼睛是有海洋的，因为此刻他的眼睛里就有，广袤的，神秘的，包容的，平静但又小有波澜的。</p><p class="story-paragraph dialogue">“会吗？”</p><p class="story-paragraph dialogue">“或许吧。”</p><p class="story-paragraph">我不敢肯定他眼底忽然泛起的淡淡潮红是出于什么原因，但我好像能确定他的海域里至少还倒映着我的影子。</p><p class="story-paragraph dialogue">“我们来节目以后还从来没有这么正式地聊过。”他又一次转移了对话的方向。</p><p class="story-paragraph">我完全在被他牵引着走，但却并没有觉得累。</p><p class="story-paragraph dialogue">“是吧。”</p><p class="story-paragraph dialogue">“最近有特别喜欢的人吗？”郑成灿企图再喝一口咖啡，但杯子已经彻底空了，于是他放下杯子干脆和我对视。</p><p class="story-paragraph dialogue">“所以我喜欢谁你真的不清楚吗？”</p><p class="story-paragraph">我感觉自己此刻已经变成了一本完全敞开的书。</p><p class="story-paragraph">请翻动我吧，请阅读我吧，请理解我吧，我的眼神大概就在传递着这样的讯息。</p><p class="story-paragraph">但他好像并不为所动，只是沉默的望着我，仿佛要把我完全看穿一样。</p><p class="story-paragraph">当然如果能看穿倒也是好的。</p><p class="story-paragraph dialogue">“前两天过得很累吗？喝了不少酒呢。”</p><p class="story-paragraph">今天他的话题不知道为什么总是在跳跃，好像总在围着一个隐形的点绕圈一样。</p><p class="story-paragraph dialogue">“还好，这段时间其实好很多了，那天是因为和元彬聊得还不错。”</p><p class="story-paragraph dialogue">“我倒也不是说元彬。”</p><p class="story-paragraph">他说着又垂下眼睛去划动手机的屏幕。</p><p class="story-paragraph">好像是在阅读什么东西，我看见他的手指顿了片刻，随即又是一声叹息。</p><p class="story-paragraph dialogue">“节目组提醒说时间快到了，我似乎要先离开了呢。”</p><p class="story-paragraph">这就要走了吗？这句话的突然出现仿佛旷野上凭空扯过一道亮白色的闪电。</p><p class="story-paragraph">我看着他挪动椅子做出快要起身的动作，忽然内心升起一股无尽的失落，来势汹汹地好像下一秒就要将心脏拽进无底黑洞里去。</p><p class="story-paragraph">如果今天就这样分开的话，我们还会有以后吗？</p><p class="story-paragraph">没有以后的话，我要怎么生活下去呢？</p><p class="story-paragraph">想到这些我都感觉快要没办法呼吸了，于是我猛地抬起头向郑成灿发起了求救。</p><p class="story-paragraph dialogue">“可以不走吗？”我张口的第一秒眼泪也跟着声音一起出来了。</p><p class="story-paragraph">郑成灿不是在采访里面说希望我可以直接告诉他一些事情吗？这一次我真的说出来了，这已经是我压在最心底的事情了。</p><p class="story-paragraph">郑成灿停滞住了，他用一种复杂的眼神盯着我。</p><p class="story-paragraph dialogue">“怎么又哭了。”抽纸被轻轻推到我面前。</p><p class="story-paragraph dialogue">“可以不走吗？”我哽咽得有些说不上话，但还是在不依不饶，有一种强烈的第六感要我这次务必抓住他。</p><p class="story-paragraph dialogue">“不走的话...”</p><p class="story-paragraph">他沉吟了半晌。</p><p class="story-paragraph dialogue">“不走的话，也有一个方法。”</p><p class="story-paragraph dialogue">“什么方法？”</p><p class="story-paragraph dialogue">“和我约会吧。”</p><p class="story-paragraph dialogue">“在走完这个环节之后。”</p><p class="story-paragraph">我是第一次如此感谢人类的不理智。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">于是结束环节后，我和郑成灿开始了第一次私下约会。</p><p class="story-paragraph">没有任何的提前规划，我们就这样肩并肩的在街上闲逛，隔着时近时远的距离。</p><p class="story-paragraph dialogue">“怎么突然哭起来了。”</p><p class="story-paragraph dialogue">“就是突然不想你走。”</p><p class="story-paragraph dialogue">“我有那么好吗？”</p><p class="story-paragraph dialogue">“我从来没否认过这一点。”</p><p class="story-paragraph">郑成灿停下脚步看了我一眼，良久说了声谢谢，然后又继续开始前进。</p><p class="story-paragraph">夏天的夜幕总是迟迟才降临，我们趁着最后一点夕阳走到了汉江公园。放学的高中生在广场上嬉闹，骑着双人自行车的情侣时不时地从我们跟前路过。越往江边走，吉他弹唱的声音越清晰。</p><p class="story-paragraph">It&#x27;s a beautiful life</p><p class="story-paragraph">Beautiful day</p><p class="story-paragraph">너의 기억에서 내가 살텐데（我会活在你的记忆里）</p><p class="story-paragraph">Beautiful life beautiful day</p><p class="story-paragraph">내 곁에서 머물러줘（请陪在我身边）</p><p class="story-paragraph">我不自觉地侧过头去看郑成灿，有风拂过他的额发，软软地支棱起一点又轻柔地垂放下来，这个距离好像能看见他的睫毛，纤长的，颤抖的。</p><p class="story-paragraph">他那样近，近得只要稍微抬一抬胳膊就可以牵手，但他又那样远，远得我只能在一旁模糊地看着他，就像隔着薄雾看清晨的远山一样。</p><p class="story-paragraph">一路逛到街上的霓虹灯牌都亮起来了，我的肚子不争气地发出一声鸣叫。</p><p class="story-paragraph">他转过头问我饿了吗。我点了点头。</p><p class="story-paragraph">随便找了一家看起来人气还不错的烤肉店落座，很自然地他坐到里面，把靠外的位置留给我，习惯总是难改，一遍又一遍地将曾经提醒。</p><p class="story-paragraph">正在点菜的时候旁边又来了一对年轻的情侣，女孩子很兴奋地挽着男生的手臂。</p><p class="story-paragraph dialogue">“每周末都来这里充电吧！”她这样说道。</p><p class="story-paragraph dialogue">“你给我充电。”</p><p class="story-paragraph">对话听在耳朵里，我情不自禁地笑起来，曾经我也爱在周末没课的时候拉郑成灿出去寻觅美食，每次就在宿舍楼下直直地冲进他怀里，嚷嚷着说要充电。</p><p class="story-paragraph">这顿饭虽然是久违的两人食，但进行得还算顺利，我们都很快就进入了过去习惯的角色，或许任旁的人看来，我们和旁边的那桌情侣并没有什么不同。</p><p class="story-paragraph">唯一的不同可能就是我们的烧酒是一瓶接着一瓶。</p><p class="story-paragraph">郑成灿并不是一个特别喜欢酒精的人，但今天莫名其妙跟着我喝了好几杯。</p><p class="story-paragraph">以至于回家的路上他突然在路边的长椅上坐了下来。</p><p class="story-paragraph">暖黄的灯光孤零零地落在他身上，整个人看起来竟像一只颓丧的大型金毛犬。</p><p class="story-paragraph dialogue">“走不了了吗？那我去拦车吧。”</p><p class="story-paragraph">我说着就要往路边去，郑成灿却忽然抓住我的手。</p><p class="story-paragraph dialogue">“别走了。”</p><p class="story-paragraph">这次居然换他说出这句话了。</p><p class="story-paragraph dialogue">“就这样呆一会吧。”</p><p class="story-paragraph">他嘟囔着垂下头，语气是下位者的请求，但抓着我手的力度丝毫没有示弱。</p><p class="story-paragraph">入夜的首尔不再像白天那般炎热，风悠悠地在树桠间穿行，带来汽笛，带来蝉鸣，带来冰镇橘子汽水的味道。</p><p class="story-paragraph">我想大概新的命运节点又一次出现了。</p><p class="story-paragraph">但这一次我们不用再自己去做出选择。</p><p class="story-paragraph">在这种意识将散未散，在眼泪将流未流的时候。其实就这样拉着手在路灯下坐着，什么话也不用说的。</p><p class="story-paragraph">心跳会替我们做最诚实的选择。</p></div>

      <article class="chapter" aria-labelledby="heading-chapter-12">
        <header class="chapter-header">

          <h2 id="heading-chapter-12">一起去看海吧</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">今晚好像要失眠，拉满的酒精值竟然也没有起到丝毫的作用。漫无目的地盯着天花板发呆是一件极其容易让人烦躁的事，于是在大概凌晨三点左右我索性起床去了一楼的客厅。</p><p class="story-paragraph">客厅连通着小院的玻璃滑门没有完全紧闭，空气里凝了一层薄薄的露水，一呼一吸间除了清淡的草籽香还夹带着沁心的潮湿气。将门拉开更大的缝隙后，我光着脚踩上地毯，在空无一人的房间里直接靠着沙发席地而坐。</p><p class="story-paragraph">胳膊肘搭在膝盖上掏出手机，屏幕还停留在心动短信的界面。</p><p class="story-paragraph">今晚依旧是收到了两条讯息。</p><p class="story-paragraph dialogue">「明天一路顺利」这条大概是元彬发来的。</p><p class="story-paragraph">而「秘密最后一天告诉你」则十分明显是来自郑成灿。</p><p class="story-paragraph">到底是什么秘密需要这么久的酝酿期，没有头绪的同时视线不自觉地越过手机落到了左手上，手指蜷曲微张着，像有独立生命力的植物。户外路灯的微光落洒到指缝间，被照亮的肌肤上似乎还残留着只属于郑成灿的温度。</p><p class="story-paragraph">几小时之前他真的握住我的手了吗？哪怕是回想也让人觉得难以置信。我尝试着活动了一下五指，在虚空中重新描摹形状，他的手大而修长，足以将我的完全包裹住。</p><p class="story-paragraph">郑成灿之前爱笑我的手小，我不服气就要同他比大小，他从来都会乐呵呵地伸出手来任由我随意摆弄，然后在手掌贴合的时候一把将我的手牢牢抓住。几次下来我大概知道他的手从始至终就是在守株待兔，就等着抓我这只不安分的兔子。</p><p class="story-paragraph">虽然是第一次谈恋爱，但郑成灿就是会有很多这种让人意外的小把戏，而且每次得逞的时候都会眯缝着眼睛露出得意的笑容，嘴巴咧开有两枚兔牙。</p><p class="story-paragraph dialogue">“你笑着和不笑的时候温差真的很大。”</p><p class="story-paragraph dialogue">“你知道的吧。”</p><p class="story-paragraph">我曾经也很认真地和他讨论过这件事情。他眨了眨眼睛似乎有些不明所以。 “不笑的时候完全就是生人勿近的冷都男啊。”我用手掌在面部比划着。</p><p class="story-paragraph dialogue">“啊，真的吗？”</p><p class="story-paragraph dialogue">“那这样呢？”郑成灿说着摆出了一副笑脸供我评判。</p><p class="story-paragraph dialogue">“像小狗！”</p><p class="story-paragraph dialogue">“之前不是说像小鹿吗？”郑成灿撇了撇嘴巴。</p><p class="story-paragraph dialogue">“嗯...小鹿只能在森林里。”我乱七八糟地解释着。</p><p class="story-paragraph dialogue">“那小狗呢？”</p><p class="story-paragraph dialogue">“嗯...”</p><p class="story-paragraph dialogue">“小狗可以在家里。”</p><p class="story-paragraph">白天的X room完全是打开潘多拉盒子的钥匙，本来应该睡觉的时间回忆却止不住地倒灌进大脑里。三年的时间，一千多个日夜，掰碎了洒在时间的缝隙里，在寂静无人的夜晚铺成星星点点的银河。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">忽然背后有人叫我的名字。</p><p class="story-paragraph">这么晚了属实是吓了我一跳。但瞬时的惊吓后我很快辨识出了那熟悉的声线，扭过身子往楼梯口的方向望去，果然是郑成灿站在那里。</p><p class="story-paragraph dialogue">“还没睡吗？”</p><p class="story-paragraph">我们的声音在黑暗里也能默契地重叠在一起，结果谁也没回答这个问题。我仰头看着郑成灿走过来。</p><p class="story-paragraph dialogue">“怎么在这里坐着？”他问。</p><p class="story-paragraph">虽然光线昏沉，但我也能猜到他此刻必然又是一副轻轻皱着眉的表情。</p><p class="story-paragraph">其实他之前每次管我的时候都是那种样子，明明年纪比我还要小一些，却总是爱操心很多事。倒也不是少年老成，用纯粹的真诚来解释应该会更贴切些。他是那种一看就知道原生家庭氛围很幸福的孩子，他也确实比我更会爱人。</p><p class="story-paragraph dialogue">“睡不着。”我把头歪靠到沙发边缘，虽然困意为零，但身体的疲惫却很真实。</p><p class="story-paragraph dialogue">“又在想什么吗？”他坐到我旁边的椅子上，出奇得有耐心。</p><p class="story-paragraph dialogue">“太多了，讲不清楚。”</p><p class="story-paragraph">我嘟哝着，表述比思考难太多了。这大概也是为什么很多时候人会宁愿选择脑海中的翻来覆去，也不愿意选择透露只言片语吧。</p><p class="story-paragraph dialogue">“明天不是要去济州岛嘛。”</p><p class="story-paragraph">郑成灿叹了一口气，身子向我倾斜过来一些，下一秒我的头顶就感觉到了他手部的重量。这个重量径直压到身体里，我感觉自己的头发和心脏此刻都在他的手心里了。</p><p class="story-paragraph">那些烧酒还是让大脑有些混沌了，在他的提醒下我才清晰地想起来明天的行程安排。</p><p class="story-paragraph">和郑成灿一起回家后节目组确实是送来了新的信件，通知所有人明天将开启济州岛之旅，而我和郑成灿互选了出发结伴。</p><p class="story-paragraph">我要和郑成灿一起去济州岛，这件事无论怎么想都觉得好不真实。大概也是因为本能的不敢相信，所以在昏昏沉沉之间我习惯性地将它归为了梦境一类。</p><p class="story-paragraph dialogue">“好快啊。”我恍恍惚惚如同梦呓。</p><p class="story-paragraph dialogue">“什么？”</p><p class="story-paragraph dialogue">“时间，时间过得好快啊。”</p><p class="story-paragraph dialogue">“录制进行到济州岛的话，就快要结束了吧。”</p><p class="story-paragraph">郑成灿沉默了片刻，感觉是一时半会也想不出合适的措辞，他只又拍了拍我的脑袋让我先去睡觉。</p><p class="story-paragraph dialogue">“那你怎么也还没睡？”我这才想起来反问他。</p><p class="story-paragraph dialogue">“酒好像喝多了。”郑成灿说着自己笑起来，他压低的笑声像掩在灌木间的细流，淌在安静的夜晚里，完全适配。</p><p class="story-paragraph dialogue">“你之前怎么能喝那么多的呢？”他疑惑道。</p><p class="story-paragraph dialogue">“喝酒多又不是什么很好的本领。”</p><p class="story-paragraph">这样只会让酒精带来麻痹的阈值持续攀升啊。但这后半句我换掉了。</p><p class="story-paragraph dialogue">“喝不习惯的话也不要强学。”我是这样说的。</p><p class="story-paragraph">不知道是不认可还是什么原因，郑成灿忽然又不说话了，但他的手指还在摩挲我的发丝，只可惜头发没有感觉细胞，他的温度没办法传达。</p><p class="story-paragraph dialogue">“去睡觉吧。”良久听见他说了这么一句。</p><p class="story-paragraph dialogue">“你呢？”</p><p class="story-paragraph dialogue">“我也马上回去了。你先上去吧。”</p><p class="story-paragraph">仿佛有意安抚我一般，他又很快加了一句早上见。</p><p class="story-paragraph">事实证明他的安抚是极其有效的，逆鳞瞬间从身体的各个部位剥落了，我感觉自己此刻就像一只温和的顺毛动物，只要有人抚摸就能开心得活蹦乱跳。</p><p class="story-paragraph dialogue">“那明天见吧。”这么黑他应该看不见我的笑脸，但我还是留给了一个他。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">回房间后大概又睡了四个小时。</p><p class="story-paragraph">到天亮起床出门的时候在二楼的小客厅意外地碰到了元彬。他看起来睡得也不太好，眼下的乌青若隐若现，我瞬间感觉有些抱歉了，昨天选择济州岛出发同行人的环节让他落单了。</p><p class="story-paragraph dialogue">“早上好。”他笑着跟我打招呼，哪怕精神不佳他的瞳孔还是黑得发亮。</p><p class="story-paragraph">我点了点头回应他。</p><p class="story-paragraph dialogue">“行李收拾好了吗？”他看起来还是乐意同我搭话的，只是弯弯绕绕找了一个非常保险的话题。</p><p class="story-paragraph dialogue">“嗯，你也收好了吗？”</p><p class="story-paragraph dialogue">“昨天晚上收拾了。”他垂下眼睛侧了侧目光：“昨天没吃早餐吗？”</p><p class="story-paragraph">这个问题我没听懂，只能无奈又委婉地歪了歪头。</p><p class="story-paragraph dialogue">“昨天做了煎面包来着。留了一份在桌上。”他的声音越来越小，说话的时候也一直不看我。我见过猫咪闹脾气的时候就是这样，如果人的耳朵长在头上，那元彬的此刻大概已经耷拉下来了。</p><p class="story-paragraph">我大概明白他的意思了，但道歉的话也不是很合适，于是我解释说因为昨天上午有急事出门所以没看见。</p><p class="story-paragraph">感觉还受到他了的影响，我的声音竟也小小的。</p><p class="story-paragraph dialogue">“嗯。”他抿了抿嘴唇，好像又思考了一会才扯出来一个笑容。</p><p class="story-paragraph dialogue">“今天好好玩吧。”</p><p class="story-paragraph">他终于肯正视我了，但墨水一样黑的眼睛哪怕泛起些涟漪也是不容易觉察的。</p><p class="story-paragraph">我盯着他迟疑了好一会才又点了点头。</p><p class="story-paragraph dialogue">“是和成灿吗？”</p><p class="story-paragraph dialogue">“是。”</p><p class="story-paragraph dialogue">“嗯...那好好玩吧。”</p><p class="story-paragraph dialogue">“到济州岛以后我们会有机会一起去看海的吧。”元彬最后又问了一句。</p><p class="story-paragraph">会吧，我说。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">结束和元彬的对话后我继续往楼下走去，却又在转角处碰到了郑成灿。</p><p class="story-paragraph">他双臂抱胸靠墙站着，但眼睛是合上的，看起来似乎在闭目养神。听见我的脚步声逐渐接近，他才慢慢睁开眼转过头来。</p><p class="story-paragraph dialogue">“怎么站在这里？”我惊讶地问，同时又回头看了看身后二楼客厅的入口。总不会是站在这个位置听我和元彬的对话吧。</p><p class="story-paragraph dialogue">“去吃早饭吧。”他随意地说着，看了我一眼便转身向楼下走去。</p><p class="story-paragraph dialogue">“怎么了？”我一边跟在他身后一边小声询问。</p><p class="story-paragraph dialogue">“今天做的鸡蛋卷。”他也不回头理我，只继续自顾自地说着答非所问的话。</p><p class="story-paragraph dialogue">“生气啦？”我又问了一句，但他已经不回复我了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">吃完早饭收拾妥当最后的行李，大概10点多我们从小屋出发了。</p><p class="story-paragraph">去金浦机场有半小时的车程，但这一路上我和郑成灿都只是各自望着一边的窗外静默着。</p><p class="story-paragraph">林立的房屋向着反方向呼啸而去，有种在时间里穿梭的错觉。</p><p class="story-paragraph">首尔的小屋录制居然就此告终了，这次的济州岛之行虽然才刚刚开始却也莫名有着一种强烈的尾声感，仿佛正在去奔赴一场注定两小时后就会结束的演唱会。而借节目组之手，从命运那里偷来的和郑成灿重新相处的日子也会随着一起完结掉吗？</p><p class="story-paragraph">那未完待续的可能性存在吗？</p><p class="story-paragraph">我试图通过车窗的反射去观察身旁的郑成灿，但阳光太亮了，以至于什么都还没看清眼睛就已经酸涩了起来。</p><p class="story-paragraph">济州岛其实距离首尔并不远，但我和郑成灿在一起的三年里却一次都还没有去过。说起来也是很好笑的一件事，之前并不是没有过旅行的计划，但总因为各种突发情况耽误，现如今分手了，我们竟然又意外获得了同游的机会。</p><p class="story-paragraph">人生偶尔就是会出现这种不同频的时刻，晚来的弥补，迟到的完满，久违的续集，但好在是没落成遗憾吧。这段时间我的接纳能力似乎在慢慢见长。</p><p class="story-paragraph">在飞机上用头戴耳机听音乐是郑成灿一贯的习惯，于是我很自觉地一落座就开始补觉。在轻微的颠簸环境好像会更容易入睡一些，我很快就意识模糊了，再醒过来的时候头已经正正靠在了郑成灿的肩膀上。</p><p class="story-paragraph">几乎是弹射似的把头直起来，很不太好意思地说了声抱歉。</p><p class="story-paragraph dialogue">“太累了，就睡着了。”</p><p class="story-paragraph dialogue">“那现在好点了吗？”郑成灿不知道什么时候已经把耳机拿下来了。</p><p class="story-paragraph dialogue">“好了很多。”我小声说，头发不知不觉在指尖绕了好几圈。</p><p class="story-paragraph">经济舱的座位对于郑成灿而言还是有些逼仄，所以他的身子往我这边微侧着，以一种封锁的姿态。虽然郑成灿不怎么喜欢夏天，但我还是想说他现在俨然和夏天这个季节一样，晴雨是不定的，潮湿包裹着热浪，是一种难懂又暧昧的天气。</p><p class="story-paragraph">飞机播报在这时候响起，提醒乘客飞机即将着陆请系好安全带。</p><p class="story-paragraph dialogue">“居然要到济州岛了。”我不禁慨叹了一声。</p><p class="story-paragraph dialogue">“之后也一直没来过吗？”</p><p class="story-paragraph">我思考了一下意识到郑成灿说的是分手之后，于是摇摇头说分手以后就没有出门旅行过。</p><p class="story-paragraph dialogue">“不是很喜欢出去玩的吗？”</p><p class="story-paragraph dialogue">“一个人的话就不喜欢了。”凭空出现了一点勇气，我竟然敢在说这话的时候直视上郑成灿的眼睛。但飞机穿越云层时导致的晦明变换投映在他的脸上，让我没有机会发现任何神色的端倪。</p><p class="story-paragraph dialogue">“我倒是有经常带冬天出门。”他突然提起了我们之前一起养的小狗。</p><p class="story-paragraph">那是一只很可爱的马尔济斯，抱在怀里和棉花团子别无二致，但因为我们新租的公寓不能养宠物的缘故，冬天就一直寄养在郑成灿父母那里，分手以后很自然地成了他一个人的小狗。</p><p class="story-paragraph dialogue">“我知道你会把它照顾得很好的。”这一点我从来没质疑过。</p><p class="story-paragraph">郑成灿打开手机找出冬天的几张近照递给我，小狗戴着金色的蝴蝶结东张西望。</p><p class="story-paragraph dialogue">“不知道它还认不认识我。”我用手指缩放照片，尽量看清楚它身上的每一处细节。小狗不懂什么是爱情，也不懂什么是破裂，它只需要沐浴着阳光奔跑，在爱里茁壮成长。</p><p class="story-paragraph dialogue">“回首尔了要去见见吗？”郑成灿说。</p><p class="story-paragraph">我扭过头确认他这句话的真实性，可以吗？我这样问了。</p><p class="story-paragraph dialogue">“我从来都没有不允许。”他说。</p><p class="story-paragraph">飞机在他话音落下的时候也平稳地落到了跑道上。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">从机场出来以后并不是马上就去民宿，节目组还给我们预留了一小段的游玩时间，于是我们直奔了一直相约要看但没看成的济州岛大海。</p><p class="story-paragraph">阳光洒落在下午的海面上，粼粼微光像破碎浮动的金箔。我们之前也去釜山看过大海，但不知为何我竟然在此刻有种被美到想要落泪的冲动，大概是因为这场风景的来之不易。</p><p class="story-paragraph">郑成灿的心情也变明朗了许多，他先我一步往海边小跑过去。</p><p class="story-paragraph">受到他的影响我也顾不得沙滩是否好走，海浪是否会打湿鞋袜，也忽然跟在他身后跑起来。一时间广安里的海风仿佛吹到了这里，我们在风里逐渐又变成了那对追着海鸥打打闹闹，累了就相拥着在海边看夕阳沉坠的普通情侣。爱果真是会留痕的，然后在一些意想不到的时刻和地点降临。</p><p class="story-paragraph">鼻翼间满是湿咸的海风味道，我停下脚步拼命吸了几口，像留存标本一样，如果这是我和郑成灿最后一次来海边的话，我还是想多保存一些日后可以回忆的元素。很多人会在和前任分手以后就将关系断得一干二净，将所有关联的东西都扫地出门，但我不是那么果断的人，我们曾经的爱情太好了，我舍不得像丢废品一样丢掉。</p><p class="story-paragraph">之前因为布置X room要给节目组提供东西的时候，其实我还是有所保留的，比如郑成灿第一次给我买药的收据单，我们的第一张电影票，还有他写给我的各种早安纸条都在我书柜的最顶层留着。</p><p class="story-paragraph">郑成灿在远处向我招手，我赶忙加快了步伐。</p><p class="story-paragraph">走近后他提议要不要在沙滩上写字，理由是很多ins博主都会在海边留一张这样的照片。</p><p class="story-paragraph">他看起来兴致不错，大概自由的氛围让他也放松下来不少。</p><p class="story-paragraph">写什么呢？我问他。</p><p class="story-paragraph">他不说话只蹲在地上用随手捡的短枝开始勾划。写完他自己的名字后他又另起了一行继续写，第一个字写到一半我认出来是我的名字。</p><p class="story-paragraph">他很快写完后站起身。</p><p class="story-paragraph">只有两个人的名字光秃秃地躺在那里，其实按照网上的例子一般都是会用爱心圈起来，但显然这并不适合当下的情境。于是孤零零的两行字，像两座海面上的独立小岛。</p><p class="story-paragraph dialogue">“拍照做个纪念吧。”酸涩的汁水此刻其实已经开始在往外泵涌了，但我还是这样说着拿出了手机。</p><p class="story-paragraph">没成想海浪在这时涌了过来，再退下的时候字迹已经被冲刷掉了。</p><p class="story-paragraph">突如其来的变故让我们两个人都呆立在了原地。</p><p class="story-paragraph">玄学的效力往往在人惴惴不安的时候可以发挥到最大，好的预兆会被极力追捧，而坏的预兆则会带来压倒性的恐惧。我感觉胸腔都被这股浪潮在一瞬间拍成了细碎的粉末，氧气找不到进入肺部的通道，窒息的感觉让我开始止不住地发抖。</p><p class="story-paragraph">这会是什么意思？是从此没有我们的意思吗？</p><p class="story-paragraph">从生命里拿掉一个人真的就像这样一冲一刷般容易吗？</p><p class="story-paragraph">巨大的遗憾跟着浪潮上涌，仿佛也把我连同这沙滩上的名字一并拖进深海里去了。</p><p class="story-paragraph dialogue">“怎么办啊？”</p><p class="story-paragraph">我真的感到惶恐了，但我发出声音的那一刻才发现好像连质问大海的力气都没有。</p><p class="story-paragraph dialogue">“怎么办啊，成灿。”</p><p class="story-paragraph">我转过头去看见郑成灿模糊成了一抹影子才意识到眼泪又一次糊住了眼睛。</p><p class="story-paragraph">这一次感性得连我自己都害怕了，我怎么会对失去郑成灿这件事恐惧成这样？</p><p class="story-paragraph">他也是没料到我的反应会这样激烈，一时间竟然显出点手足无措的态势。</p><p class="story-paragraph dialogue">“没事的，再写一个吧。”</p><p class="story-paragraph">他试着用温柔的嗓音安慰我，并又一次蹲了下来。</p><p class="story-paragraph">我呆呆地看着他的背影，海风把他的衬衫吹得鼓起来，起起伏伏，像他呼吸的频率。</p><p class="story-paragraph">我忽然好想在这里抱住他，让我感觉一下他是真的存在的就好。但因为有摄像机的缘故，这种行为必然是不会被允许的。</p><p class="story-paragraph">于是我只能站着，任由风也渐渐把眼泪吹干了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">最终还是成功拍到了写有两个人名字的照片，说不上心满意足，但也算是可以怀着不太糟糕的心情踏上了前往民宿的路。</p><p class="story-paragraph">抵达的时候才到了一部分人。</p><p class="story-paragraph dialogue">“今天一路上都还顺利吗？”银硕一边把水递过来一边问我们。</p><p class="story-paragraph dialogue">“都挺好的。”我抽了两下鼻子，就哭了那么一下应该不至于眼睛就红肿了吧。</p><p class="story-paragraph dialogue">“去哪里玩了吗？”宥真抛过来问题。</p><p class="story-paragraph dialogue">“到海边转了一下。”这次是郑成灿先回答了。</p><p class="story-paragraph dialogue">“济州岛的大海真的很美吧。”雅贤感叹道：“但这次的心境太复杂了。”</p><p class="story-paragraph dialogue">“也不知道能不能好好享受。”</p><p class="story-paragraph dialogue">“我努力一下咯。”允在开玩笑道，过去的几天他和雅贤之间的关系发展迅速。</p><p class="story-paragraph">正在谈论着今晚可能会安排的行程，其他四个落单者组成的小队也到家了。</p><p class="story-paragraph">全员到齐后，节目组送来了新的信件。</p><p class="story-paragraph dialogue screen-line">「请前往以下地址，今晚将一同观赏短片《时空恋旅人》」</p><p class="story-paragraph dialogue">“大发，居然用了这个电影的名字！”熙媛惊呼了一声。</p><p class="story-paragraph dialogue">“是公开X吧。”</p><p class="story-paragraph dialogue">“天呐，会哭吗？”</p><p class="story-paragraph dialogue">“多带点抽纸好了。”这番讨论以银硕的玩笑话结尾。</p><p class="story-paragraph">晚上的短片观赏地布置得很是漂亮。</p><p class="story-paragraph">远远地就看见了各种垂吊的灯串，宽大又柔软的沙发，抱枕和玩偶也放置了不少。在这样温馨的地方将公开大家的X，公开不同的但都围绕着爱情内核的故事。</p><p class="story-paragraph">天色在我们一句接一句的闲聊中完全黑定了，突然传来机器运转的电流声，一道光束从沙发后面投射到幕布上。时空恋旅人的字样出现了。</p><p class="story-paragraph dialogue">“啊，好紧张。”智恩用手捧住了嘴巴。大家也都陷入了漫长的沉默，倒计时的一分钟被拉长得仿佛有一个世纪之久，不知道拍摄出来的成品会是怎样，也不知道我和郑成灿在旁人眼中是否还算相配。</p><p class="story-paragraph">屏幕再次亮起来的时候，宥真的身影出现了。</p><p class="story-paragraph">她当时的头发要更长一些，咖啡店的暖光让她整个人看起来娴静得仿佛一眼静置在深林里的潭水。熟悉的风铃声响起，先是特写到脚，随后银硕的脸也出现了屏幕上。</p><p class="story-paragraph dialogue">“什么嘛！”众人惊呼起来。</p><p class="story-paragraph dialogue">“我居然猜错了。”民浩惊讶地拍着银硕的胳膊，而当事人只是淡淡一笑，视线依旧钉在画面上。</p><p class="story-paragraph dialogue">“你瘦了好多。”宥真笑着低下了头。</p><p class="story-paragraph dialogue">“我们也有快两年没见了嘛。”</p><p class="story-paragraph">从谈话间得知两人谈了5年之久，但因为工作原因只能进行异地恋情。</p><p class="story-paragraph dialogue">“为什么找我来参加这个？”宥真问。</p><p class="story-paragraph dialogue">“想再试试。”银硕的干脆回答和他平时不温不火的模样形成了巨大的反差，我都没忍住叫出声来。他曾经说和我处境相似，但明明他要比我勇敢太多了。</p><p class="story-paragraph">灯光至此暗了下去。接着出现的是熙媛，她的X正如我所料，是元彬。</p><p class="story-paragraph dialogue">“还在做音乐相关的工作吗？”</p><p class="story-paragraph dialogue">“嗯。”</p><p class="story-paragraph dialogue">“你知道的，我没办法丢掉。”</p><p class="story-paragraph dialogue">“你的选择是对的。”画面中的熙媛说着眼泪就顺着脸颊流了下来。</p><p class="story-paragraph dialogue">“我们有过好的曾经也就够了。”</p><p class="story-paragraph dialogue">“谢谢你选择过我。”</p><p class="story-paragraph">屏幕再次暗下来，元彬安静地起身给熙媛递去了纸张。我好像忽然明白元彬之前一谈到工作就会失神的原因了。</p><p class="story-paragraph">当我还在望着他们的时候，灯光已经再一次亮起来了。我听见了大家的起哄声，一回头便看见了推门而入的郑成灿。</p><p class="story-paragraph">镜头下的他很是帅气，导演甚至还给了他一段挺长的特写。他和我同时出现在画框里的时候，我紧张得呼吸好像停滞了，只能随手抓起一个抱枕挡在身前。智恩见状将我搂过去一点，我才又稍微放松了一些。</p><p class="story-paragraph dialogue">“接下来的这段时间，我们也会好好过吧。”这句话一出来，当时的疼痛感也跟着一起袭来了。郑成灿怎么能露出那样冷漠的神情呢？我甚至听见旁边有人倒吸了一口气。</p><p class="story-paragraph dialogue">“好好相处吧。”画面中的我看起来竟也坦然得不像话。</p><p class="story-paragraph">可是事实已经证明这完全就是在大放厥词，这两周的时间里我因为郑成灿流的眼泪恐怕比之前好几年累计起来的都要多。</p><p class="story-paragraph dialogue">“如果成灿遇到合适的人的话，我会给他应援的。”视频中的我还在继续夸下海口，我有些心虚地望向郑成灿的方向，他的眼睛被灯光照得亮亮的，看得很认真的样子。</p><p class="story-paragraph dialogue">“这么果断吗？”智恩在我耳边小声地笑起来。</p><p class="story-paragraph dialogue">“我撒谎的样子能看出来吗？”我低声回答她，但视线依旧停在郑成灿身上。</p><p class="story-paragraph">下一个公布了智恩的X，她和允在居然经历了七年的爱情长跑，难怪第一天入住读X介绍信的时候她会哭成那样。</p><p class="story-paragraph">这下角色转换，轮到我安慰智恩了，她一边说着抱歉一边止不住眼泪的样子让我忽然好讨厌爱情的存在。它就像恶劣的慢性毒药，初尝那么甜蜜，依赖性却又在悄无声息地腐蚀掉人的理智和自尊。</p><p class="story-paragraph">连相爱了这么久的人也会走散，那到底什么样的两个人才可以成功地走到时间尽头？</p><p class="story-paragraph">放映结束后，我们各怀心事地回到了各自的房间。幸运的是这次我还和智恩一间屋子。</p><p class="story-paragraph">她的眼睛哭肿了，站在镜子前小心地用冰敷着。</p><p class="story-paragraph dialogue">“你和成灿其实我很早就看出来了。”她大概也是想转换一下心情，所以主动谈起了关于我的话题。</p><p class="story-paragraph dialogue">“这么明显吗？”我愕然。</p><p class="story-paragraph dialogue">“眼神是不一样的呀。”智恩说。</p><p class="story-paragraph dialogue">“而且他看你的眼神明显比允在看我的要留有余地的多。”</p><p class="story-paragraph dialogue">“所以你对他还有留念吗？”</p><p class="story-paragraph">节目录制到最后一周，这其实已经是一个逐渐没有办法逃避的问题了。于是我抿了抿嘴巴说有吧。</p><p class="story-paragraph dialogue">“那他对你呢？”</p><p class="story-paragraph dialogue">“我不知道，我们好像从没有聊起过这个话题。”</p><p class="story-paragraph">智恩转过脸来看我的时候，手机屏幕突然亮起来，是今晚的心动信息送到了。</p><p class="story-paragraph">我是发了一个大海的emoji给郑成灿，本来编辑了很长的文字但总觉得词不达意，所以就全删掉了。我真的不是一个特别会表达的人，郑成灿之前说的没有错，我的不表达应该也算是分手的导火索之一。</p><p class="story-paragraph dialogue screen-line">「真的会应援吗」</p><p class="story-paragraph dialogue screen-line">「来自郑成灿的消息」</p><p class="story-paragraph dialogue screen-line">「你的X选择了你」</p><p class="story-paragraph">三条消息直白地呈现在眼前。到济州岛以后发件人的信息将不再隐秘，公开的走向也是在敦促着我们尽快厘清内心的那团乱线。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“那要找机会试探一下吗？”智恩还在热心地帮我出谋划策。</p><p class="story-paragraph">我点了点头，但随即又摇了摇头，视线重新落回到郑成灿发来的信息上。</p><p class="story-paragraph">目前的当务之急好像不应该是试探。</p><p class="story-paragraph">我们都还是两个困在各自迷宫里的人，蹒跚学步，小心翼翼。</p><p class="story-paragraph">积压的时间尘埃也远比我想象得要沉重。</p><p class="story-paragraph">可想要拨开这片云层的话，又该怎么去做呢？</p></div>
