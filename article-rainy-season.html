      <article class="chapter" aria-labelledby="heading-chapter-foreword">

        </header>
        <div class="story-body"><blockquote class="foreword-poem"><span>All the shame</span><span>when you called my name.</span><span>I felt pain</span><span>when you came.</span><cite>——《Can We Kiss Forever? 》</cite></blockquote></div>
        <nav class="chapter-pager" aria-label="章节翻页"><button type="button" disabled><span>‹ 上一章</span><strong>已是开篇</strong></button><button type="button" data-target="chapter-01" class="next"><span>下一章 ›</span><strong>好久不见</strong></button></nav>
      </article>
    </template><template id="template-chapter-01">
      <article class="chapter" aria-labelledby="heading-chapter-01">
        <header class="chapter-header">

          <h2 id="heading-chapter-01">好久不见</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">最近首尔进入了雨季。</p><p class="story-paragraph">今早起床的时候天色就阴沉，能感觉到云压得很低，空气里处处翻滚涌动着湿热的气息。我百无聊赖地搅动了两下面前的冰柠蜜，屋外逐渐渗透进来淅淅沥沥的声音，应该是憋了一天的雨终于落下来了。</p><p class="story-paragraph">来不及竖起耳朵听雨，周遭的补光灯已经尽数打开，我下意识地抬手去遮挡光线，PD却在这时凑上前来再次同我核对台本。</p><p class="story-paragraph">细细密密的文字被各种颜色的荧光笔画满了标记，问题参考，反应参考，回答参考都被悉数罗列得仔仔细细，俨然一本谈情说爱的答案范本，如果爱情真的有答案的话。</p><p class="story-paragraph">其实这些文件我之前已经读过了，但此刻上面的字符却莫名变得扭曲悬浮，白底黑字好像要硬生生砸进人眼睛里，一阵头晕脑胀，我无奈又抱歉地摆了摆手。</p><p class="story-paragraph dialogue">“让她静一静吧。”在一旁席地而坐的导演说，转而又侧身去问一旁的艺统：“男嘉宾快到了吧？”</p><p class="story-paragraph dialogue">“快了。”艺统看了一眼手机道：“大概还有五分钟。”</p><p class="story-paragraph">我等过郑成灿很多个五分钟，在我们还未相爱的时候，在我们用力热恋的时候，在我们无言以对的时候。</p><p class="story-paragraph">五分钟有时候短得就在一瞬间，有时候又长得仿佛捱过了一个世纪。</p><p class="story-paragraph">而等待的心情也总是千差万别的。</p><p class="story-paragraph">譬如现在我脑子里写满的是逃跑。</p><p class="story-paragraph">胡思乱想被咖啡店进门口传来一阵风铃声打断。</p><p class="story-paragraph">就像兔子受到惊吓，我猛地瑟缩起身子。近乡情怯原来不假，一点风吹草动就把我打回了原型，我又变成了那个彻头彻尾的胆小鬼。</p><p class="story-paragraph">完全不敢看来人，只听到一连串的脚步声由远及近。紧接着是拉开座椅的声音，紧接着是一句熟悉又陌生的问候。</p><p class="story-paragraph dialogue">“怒那，好久不见。”</p><p class="story-paragraph">熟悉的称谓，熟悉的语气，就连话尾上扬的语调都还是一模一样。</p><p class="story-paragraph">心里骤然间就传来接二连三土崩瓦解的声音，来这里之前预设的一百道防线瞬间垮塌。早该知道在郑成灿面前我永远都没法筑起高墙，让我溃不成军对他来说一直都是易如反掌。</p><p class="story-paragraph">屋内陷入寂静，静得好像都能听见摄像设备丝丝的电流声。我觉得我该说点什么，但大脑的宕机让我完全想不起哪怕台本上一个字，全身的血液大抵都涌到了心脏这一处小小的天地，砰砰作响得仿佛正在发生一场宇宙级的连环爆炸。</p><p class="story-paragraph dialogue">“怒那，看看我吧。”</p><p class="story-paragraph">郑成灿的声音飘过来。</p><p class="story-paragraph">和从前的调笑如出一辙，我条件反射一般地抬起头，但在对上面前那双眼睛的瞬间又猛然泄了气。好像又被他得逞了，我忽然感到懊恼，慌乱被他尽收眼底，这一场赌局我又成了一上桌就亮完全部底牌的输家。</p><p class="story-paragraph">我又想藏起来了。</p><p class="story-paragraph dialogue">“过得好吗？”他开始轻轻地发问。</p><p class="story-paragraph">他的声音总是有种独特的少年感。如果是在从前，我会形容他的声音像夏天正午时候打开的第一罐冰镇汽水，连冒泡都能让人觉得欣喜。但此刻我只感到酸涩。</p><p class="story-paragraph dialogue">“还行。”我边说边捣鼓杯子里的柠檬片，目光小心地在他身上游移，害怕被捕捉。</p><p class="story-paragraph">他看起来瘦了一些，穿着宽松的蓝色连帽衫，隐约能看见白皙脖颈处的骨骼。衣服上有星星点点潮湿的水迹，应该是刚刚来的路上溅了雨水。店里的暖光灯映照着他的瞳孔犹如澄澈无暇的琥珀，我深谙这双眼睛的魔力，于是在丧失客观立场前我又转移了视线。</p><p class="story-paragraph dialogue">“这样...”</p><p class="story-paragraph">一阵沉默。</p><p class="story-paragraph dialogue">“所以一直没有打过电话。”</p><p class="story-paragraph">好像听出了一丝责备，我手上的动作一滞，铁勺撞击到玻璃杯壁发出一声震耳的脆响。但很快下一秒他就打消了我的这个念头。</p><p class="story-paragraph dialogue">“我也过得不错。”</p><p class="story-paragraph">他自说自话一般。</p><p class="story-paragraph dialogue">“是吗？”</p><p class="story-paragraph dialogue">“那就好。”</p><p class="story-paragraph">我尽力摆出了一副笑脸。</p><p class="story-paragraph dialogue">“接下来的这段时间，我们也会好好过吧。”他好像是在向我发问，但听起来又完全是陈述的语气。我点了点头，垂眼的片刻发现郑成灿的脸倒映在玻璃杯壁上，有些许弧形的畸变。</p><p class="story-paragraph dialogue">“会吧。”我说：“好好相处吧。”</p><p class="story-paragraph">好好相处吧。</p><p class="story-paragraph">在郑成灿和我表白的那一天，我也是这样说的。</p><p class="story-paragraph">那是在学校操场边从左往右数的第三盏路灯下，我记得很清楚。</p><p class="story-paragraph">记得清楚的还有他因为一路小跑而略微凌乱的头发，他湿润又明亮的小鹿眼，以及他来不及平复呼吸就着急扔出的那一句，傻瓜，我喜欢的是你。</p><p class="story-paragraph">青涩又莽撞的告白毫无修饰地直撞过来，我的心里好像突然炸开了一朵小小的烟花。</p><p class="story-paragraph">我记得那晚吹得应是很轻很轻的微风，但路旁的叶片还是沙沙响个不停，我愣愣地仰头看他，看他背后的路灯从他的身缘溢出朦胧的光晕，他抿了抿嘴唇，好像在一直憋着不敢大口喘气。</p><p class="story-paragraph">然后我说：“那就好好相处吧。”</p><p class="story-paragraph">他一下就笑了起来，露出小小的，俏皮的虎牙。</p><p class="story-paragraph">像每一部青春电影的开篇，那时候我真的以为我们会是永远的男女主角。</p></div>
        <nav class="chapter-pager" aria-label="章节翻页"><button type="button" data-target="chapter-foreword"><span>‹ 上一章</span><strong>Foreword</strong></button><button type="button" data-target="chapter-02" class="next"><span>下一章 ›</span><strong>最熟悉的陌生人</strong></button></nav>

    </template><template id="template-chapter-02">
      <article class="chapter" aria-labelledby="heading-chapter-02">
        <header class="chapter-header">
          <span class="chapter-number">02</span>
          <h2 id="heading-chapter-02">最熟悉的陌生人</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">综艺节目的录制流程紧锣密鼓，和郑成灿在咖啡店见面后的第二天便要入住小屋。</p><p class="story-paragraph">一整晚没来由的失眠让化妆师给我费了不少的心思，折腾了半天才好不容易将眼下的乌青遮去了七七八八。</p><p class="story-paragraph">剧组各机位都准备就绪，我深吸了一口气，在众人的注视下推着行李箱踏上了长长的坡道。</p><p class="story-paragraph">首尔的地形总是有很多的起起落落，所以房子常常会建造得堆摞在一处，一层一层，远看就仿佛空间折叠了一样。视线逐渐跃向更远的地方，错落的枝桠，路过的鸟群，最终定格在天空，经过了昨天一晚上的雨水洗礼，天空蓝得格外纯粹，干净得像异世界的图层。</p><p class="story-paragraph">放在曾经，碰上这样的天气，我和郑成灿是一定要外出散步的。</p><p class="story-paragraph">他是一个很喜欢晴天的人，一本正经地说可以把阳光当成养分一样吸收。我学着他的样子站在光线充足的地方大口呼吸，他总是很容易就被我逗得哈哈大笑，一伸手将我拉进怀里。</p><p class="story-paragraph">他揉着我的头发说要成为我的专属太阳，就像他的名字一样，成灿，成灿，成为灿烂的太阳。</p><p class="story-paragraph">我猜现在的他应该已经完全做到了，除了不再属于我这一点。</p><p class="story-paragraph">录制的小屋被安排在半坡处。</p><p class="story-paragraph">是一个带有小花园的房子，屋外木槿花开得正盛，淡粉色的花朵团团簇簇，长势喜人。</p><p class="story-paragraph">推开大门，玄关处已经整齐地摆了一双黑色的男士帆布鞋，快速判断码数后，我放心地弯下腰换鞋。</p><p class="story-paragraph dialogue">“您好。”</p><p class="story-paragraph">有声音突然从头顶传来，但因为手上的鞋带刚解开一半，我只能保持着半躬的姿势仰起头答话。</p><p class="story-paragraph">来者是一个留着微长卷发的男人，穿着宽松的黑色圆领T恤，胸前的金色星星吊坠还在轻轻晃动。大概也是察觉到了搭话时机的不妥，他的嘴角尝试扯起了一点似笑非笑的弧度。</p><p class="story-paragraph dialogue">“您是第一个吗？”我飞速换好拖鞋直起身问。</p><p class="story-paragraph dialogue">“是的，我叫朴元彬。”他不太好意思地自我介绍，但还是友好地一路将我引到客厅的沙发边坐下。</p><p class="story-paragraph">我这时候才得以仔细地打量他。</p><p class="story-paragraph">他是很清隽的类型，头发弯曲的弧度让他看起来有种艺术从业者的缠绵气质，微微低头的时候刘海会遮住大半眼睛。他的眼睛是好看的，亮亮的黑色玻璃球一样，和成灿的眼睛是两种截然不同的好看，如果非要描述的话，成灿是柔软的幼鹿，元彬更像是谨慎且狡黠的猫咪。</p><p class="story-paragraph dialogue">“您来多久了。”</p><p class="story-paragraph dialogue">“我也是刚到。”</p><p class="story-paragraph dialogue">“今天天气还不错。”</p><p class="story-paragraph dialogue">“是啊，久违的大晴天。”</p><p class="story-paragraph">我们俩有一搭没一搭地扯着闲话，直到大门处又传来声响。这时候我才发现心被拴了一根线，线的另一端系在了大门的门把上。</p><p class="story-paragraph">我腾得站起身，突如其来的动作惹得朴元彬微微一愣，对视上他的眼睛，我们忽然又都笑了起来。</p><p class="story-paragraph dialogue">“什么嘛。”我故作轻松地抱怨着又坐下，险些忘记了录制规则的第一条就是时刻藏好。</p><p class="story-paragraph">很快走进来了第三位入住者，是一个高瘦的男人，穿着灰白跳色的休闲套装。他的脸庞有棱角但不至于尖锐，眉眼间透出慵懒松散的同时又能让人感受到一丝无端的坦诚。</p><p class="story-paragraph dialogue">“宋银硕。”</p><p class="story-paragraph">他简洁地自报家门，微微鞠了一躬便随手拉了一把单独的沙发凳坐下。</p><p class="story-paragraph">看起来有些高冷。我在心里暗暗思忖，手指却不自觉地打结。</p><p class="story-paragraph dialogue">“是最近流行的新手势吗？”这个看似沉默寡言的男人竟然主动挑起了话题，但我和朴元彬一时间都没能明白他的意思。</p><p class="story-paragraph">他淡淡一笑，将目光送到我的手指上，我这才意识到在我打量他的时候他也一直在观察我的小动作。</p><p class="story-paragraph dialogue">“要学吗？”我配合他的玩笑挥了挥手。</p><p class="story-paragraph dialogue">“看着难度有点大。”他神情认真地说，像真的思考过了似的。</p><p class="story-paragraph">是个不太幽默的互动，但气氛还是随之松动了许多。</p><p class="story-paragraph">我小幅度地舒展了一下胳膊，听见一旁的朴元彬也轻轻叹了口气。</p><p class="story-paragraph">接下来又陆续来了几位嘉宾，客厅逐渐热闹起来，人越聚越多，每个人都心照不宣地挂着极致亲和的笑脸，屋子里保持着一种诡异的平衡氛围。所幸宋银硕和后来的韩熙媛配合默契，闲聊之余偶尔插进来一些不轻不重的玩笑，几对前任共处一室的尴尬氛围很快被他们调和了不少。</p><p class="story-paragraph">众人说话，发笑，拍手，周遭被各种声音填满，但我还是逐渐感觉到自己被锁进了一个单独的透明隔层。就像电影里希区柯克式的变焦镜头，身边的人物和景致都慢慢模糊，只有我被抽离到了时空之外。</p><p class="story-paragraph">还有一个人没有来。</p><p class="story-paragraph">而这个人，全场大抵就剩我还在等待。</p><p class="story-paragraph">无法抑制的焦虑情绪开始蚕食伪装的外壳。</p><p class="story-paragraph">我环顾四周。</p><p class="story-paragraph">陌生的录制场地，陌生的参演嘉宾，陌生的社交模式，突然好像溺进了可怖的深海里。我本能地开始渴望郑成灿的到来，唯一熟悉的他成了我唯一能握住的稻草。可他真的会是我的救命稻草吗？</p><p class="story-paragraph">我害怕他来，害怕他不来，更害怕他来了也不会拯救我。</p><p class="story-paragraph">他应该不会再救我了。</p><p class="story-paragraph">最后一位入住者姗姗来迟的时候太阳已经快要落下。</p><p class="story-paragraph">听见声响大家纷纷都站起来迎接，隔着重重叠叠的身影我一眼就看到了郑成灿。</p><p class="story-paragraph">有的人长得瘦高，只会让人觉得不过是一根细杆，但有的人就是树，是颀长的白杨。</p><p class="story-paragraph">他总是显眼的，于我而言，可能这将会是我一辈子都改不掉的习惯。</p><p class="story-paragraph">在众人的欢呼声中，他一边礼貌地颔首一边寻了一个角落的位置坐下，是整个客厅里离我最远的位置。</p><p class="story-paragraph">直到和他的目光正正碰上，我才意识到自己的视线已经追随了他一路，我想要从他的眼神里捕捉点什么，但他并没有做过多的停留，甚至可以说转头转得决绝。</p><p class="story-paragraph">他面向所有人微笑着做起自我介绍。</p><p class="story-paragraph">名字是郑成灿，我听见他用他那好听的嗓音说。</p><p class="story-paragraph">一时间此起彼伏的「郑成灿」在我耳边响起，为了避免露出破绽我也机械式地默念起来，哪怕这三个字曾经同我的人生纠缠得难舍难分，哪怕它们像线一样胡乱地穿插在我的生活里织了一张细细密密，难以脱身的网。</p><p class="story-paragraph dialogue">“林宥真。”</p><p class="story-paragraph dialogue">“宋银硕。”</p><p class="story-paragraph dialogue">“韩熙媛。”</p><p class="story-paragraph">为了欢迎郑成灿，大家开始做最后一轮姓名介绍。</p><p class="story-paragraph">按照座位的顺序，从林宥真开头，到我这里结束。尽管在心里演练了好几遍，但轮到我的时候还是突然感到了一阵口干舌燥。实在没忍住轻轻咳嗽了两声，坐在一旁的朴元彬很好心地递来水杯。我摇摇头谢绝了他的好意，还是快点让这个环节结束吧，我想。</p><p class="story-paragraph">于是我大声地念出自己名字，尽量让每一个字听起来清晰又有力。</p><p class="story-paragraph dialogue">“嗯。”</p><p class="story-paragraph">他点了点头，将我的名字完整地重复了一遍。</p><p class="story-paragraph">在我的印象里他好像从来都没叫过我的全名，哪怕是最后临近分手的边缘，在结束了一次又一次漫长的沉默对峙后他也只是满眼疲惫地哑着嗓音说，够了，怒那。</p><p class="story-paragraph">记住了。他安静地看着我的眼睛说。</p><p class="story-paragraph">他的演技远比我想象得要好得多，以至于有那么一个瞬间我都快要被他说服。他的眼神淡得那样无色无味，好像我们真的就是从未谋面的陌生人。</p><p class="story-paragraph">哦不，恐怕比陌生人还要再疏远一些。</p><p class="story-paragraph dialogue">“那成灿的MBTI是什么呢？”韩熙媛适时地转移了话题， 大家又开始七嘴八舌地猜测。</p><p class="story-paragraph dialogue">“infj。”</p><p class="story-paragraph">我冷不丁地抛出一句话，斩钉截铁的语气让屋内一下子安静了下来。</p><p class="story-paragraph dialogue">“啊？感觉成灿不会是i诶。”韩熙媛用手撑住头，认真分析我给出的答案的可能性。</p><p class="story-paragraph dialogue">“我也觉得是e。”林宥真附和道，一旁的宋银硕也若有所思地点了点头。</p><p class="story-paragraph dialogue">“estp。”当事人并不拖泥带水，非常主动地揭晓了答案。</p><p class="story-paragraph dialogue">“什么啊！哈哈哈，怎么会猜得完全相反！”众人都笑起来，韩熙媛更是咯咯地笑倒在我肩上。</p><p class="story-paragraph">是啊，怎么会完全相反呢。</p><p class="story-paragraph">我偷偷抬眼看向郑成灿的方向，因为这是我隐秘而又拙劣的报复。</p></div>

      <article class="chapter" aria-labelledby="heading-chapter-03">
        <header class="chapter-header">
          <span class="chapter-number">03</span>
          <h2 id="heading-chapter-03">致曾经亲爱的你</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">入住小屋后的第一顿晚餐，大家一致决定猜拳分组。</p><p class="story-paragraph">于是一番比划后，我和朴元彬还有韩熙媛组成了超市采购小分队，宋智恩和林宥真负责饭后的收洗，而今晚烹饪的重头任务则是交给了宋银硕、金民浩和郑成灿。</p><p class="story-paragraph dialogue">“期待三位男生的手艺哦！”熙媛出门前还不忘凑到厨房门边给今晚的厨师们加油打气，她好像总是有用不完的活力，这一点从刚见到她的那一刻就发现了，热情阳光的女孩，像初春的花一样。</p><p class="story-paragraph">借着她创造的机会，我的目光也顺势飘进了厨房。</p><p class="story-paragraph">有些人身上就是有磁铁一样的吸引力，这一点我不得不承认。</p><p class="story-paragraph">厨房里挤了不少人，我却只看见了郑成灿。他正站在水台旁反手系围裙，裙带很细，倒显得他的手指动作有些许的笨拙。</p><p class="story-paragraph">需要帮忙吗？心里有个声音在偷偷作祟。</p><p class="story-paragraph">我是知道的，因为工作忙碌的缘故，郑成灿其实并不是擅长料理的类型。除了偶尔碰上我兴致大发或者刚好有空给他做便当外，大多数时候他还是习惯在快餐店解决一日三餐。</p><p class="story-paragraph">记得第一次决定给他做饭问到他最喜欢的食物时，他特别认真地想了很久，然后告诉我说是汉堡。我一时间哑然失笑，说那从今天开始就好好吃饭吧。他当时忽然就从背后环抱过来，头发和声音都毛茸茸地窝在我的耳颈处，他闷闷地说，好啊。</p><p class="story-paragraph">郑成灿有的时候，就是会变成突然黏人的狗狗。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“走吧。”熙媛突然拍了拍我的肩膀，思绪如弹簧般骤然回弹，我这才意识到自己又在不知不觉中被牵引了好远。迅速将目光从全程都无动于衷的罪魁祸首身上收回，我在心里暗暗地给自己立规矩。</p><p class="story-paragraph">别在意他，我对自己说，向前看。</p><p class="story-paragraph">如果只有一个人被困在回忆里，那未免也太不公平了些。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">采购的路上，元彬敏锐地捕捉到了我的情绪。作为小屋最早来的两位参演者，我们好像无形中生出了一点惺惺相惜的革命友谊。</p><p class="story-paragraph dialogue">“怎么了。”</p><p class="story-paragraph">趁着熙媛去前面的货架挑选牛奶的空档，他略微侧过身来压着声音问我。</p><p class="story-paragraph dialogue">“没什么，就是觉得有点难过。”</p><p class="story-paragraph dialogue">“因为X吗？”</p><p class="story-paragraph dialogue">“...可以这么说吧...但更大一部分还是因为我自己。”</p><p class="story-paragraph">元彬不说话，只用他黑亮澄澈的眼睛看着我。</p><p class="story-paragraph dialogue">“感觉大家都适应得很快。”</p><p class="story-paragraph">说到这里，脑子里忽然就闪过了郑成灿入住时果断挪开视线的画面，后知后觉的心脏一滞，嗓子里瞬间灌上了胶水，一肚子的话好像都没办法说出来了。</p><p class="story-paragraph">眼睛的酸涩感紧随其后，我飞快地低下头盯着地面狠狠地吸了一口气，真的并不想，并不想这么快就成为镜头前第一个输家。</p><p class="story-paragraph dialogue">“好像只有我处理不好。”</p><p class="story-paragraph">良久，我才发出蚊子一样哼哼的声音，由于元彬没有立马接过话头，空气又掉进了沉默里。</p><p class="story-paragraph">但不一会儿一包糖果被递到眼前。</p><p class="story-paragraph dialogue">“吃点甜的或许可以好一些。”我好像听见他也轻轻地叹了一口气。</p><p class="story-paragraph dialogue">“已经做得很好了。”他说。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">提着满满几袋“战利品”打道回府，小屋里已经有了饭菜的飘香。</p><p class="story-paragraph">智恩和宥真正窝在客厅的沙发里捧着咖啡说悄悄话，我们的突然出现似乎让她俩受到了惊吓，几个人面面相觑了片刻忽然笑作一团。还是幸运的，所幸大家都是很好相处的人，在没有X的空间里，我得以放松下来。</p><p class="story-paragraph">今晚的饭菜很丰盛。</p><p class="story-paragraph">很惊讶银硕竟然是隐藏的厨艺好手，他做的肉酱意面、泡菜炒饭和沙拉都是卖相极佳。另外两位也各做了一道菜，民浩做了煎烤五花，郑成灿则是做了一份鸡蛋卷。</p><p class="story-paragraph">落座的时候满心里只想着要和郑成灿错开些，结果还是后知后觉发现选到了离鸡蛋卷最近的位置。于是一整个晚餐时间，我几乎都没怎么吃东西，不过老实说也确实没什么胃口，毕竟胃是非常直接的情绪器官。</p><p class="story-paragraph">百无聊赖地咀嚼着吃了很久的一块五花肉，筷子在碗里轻轻地划着圆，安静地听大家在一旁有一搭没一搭地夸赞着今晚厨师们的手艺。</p><p class="story-paragraph">直到坐在斜对面的智恩忽然请我帮她夹一块鸡蛋卷。</p><p class="story-paragraph dialogue">“你也尝尝吧～很好吃呢！”智恩吃了一小口后还不忘招呼我：“看你好像一直没试这盘菜。”</p><p class="story-paragraph">我愣了一下随即感谢了她的关心，为了不漏出明显的破绽我立马也夹了一块到碗里。</p><p class="story-paragraph">其实和在场的所有人一样，我也是第一次吃到郑成灿做的鸡蛋卷。应该是分开后他自己学会的料理，我看着那一层层卷得紧实的蛋皮，搭配着零星的火腿和小葱做点缀，忽然一时间有了光阴流逝的实感。</p><p class="story-paragraph">原来我们分开的时间都已经这样长了，长得足以学会一项完全崭新的技能。</p><p class="story-paragraph">所以在同我分开的这段时间里，他到底还改变了多少呢？</p><p class="story-paragraph">那昨天见面的时候是只有我一个人在撒谎吗？他是真的...过得还不错吗？</p><p class="story-paragraph">我感到了委屈。</p><p class="story-paragraph dialogue">“很好吃啊！”好像真的吃到了很了不起的美食，智恩非常兴奋地继续向厨师本人表示感谢。郑成灿的目光移了过来，尽管我没有抬头但还是隐隐约约地感觉到了。像舞台上突然打下了聚光灯，带着点让人燥热的温度。</p><p class="story-paragraph">我也学着智恩的样子夹起鸡蛋卷吃了一小口，然后微笑起来。</p><p class="story-paragraph dialogue">“确实很好吃啊，成灿xi。”</p><p class="story-paragraph">我们就这样又一次对上了视线。这一次他没有很快地躲开，反而是持续地沉默地望着我。他的额发有些长了，落下细碎的阴影覆在他的眼睛上，神情显得讳莫如深。</p><p class="story-paragraph">你看，我一个人也可以好好吃饭。</p><p class="story-paragraph">我猜此刻他在心里藏着的是这句话。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">晚餐快要结束的时候，门口适时地响起了按铃声。</p><p class="story-paragraph dialogue">“啊！是不是！”熙媛第一个反应过来，惊叫了一声用手捂住了嘴巴。大家也都猜到了接下来的流程，气氛骤然间降温。</p><p class="story-paragraph">智恩主动起身去门口取回了信封并宣读了规则。</p><p class="story-paragraph dialogue screen-line">「接下来请轮流朗读来自X的介绍信」</p><p class="story-paragraph">这个环节还是如期而至了，我不自觉地用余光去瞟郑成灿的方向，他低着的头掩在装红酒的玻璃瓶后，只能看见模糊的轮廓。</p><p class="story-paragraph">经过简单的商讨，大家决定从离门口最近的位置开始，顺时针朗读信件。</p><p class="story-paragraph">于是负责上菜的银硕成了第一个。</p><p class="story-paragraph">在所有人的注视下，他很麻利地取出了信纸，目光上下扫描了一番便开始了朗读。</p><p class="story-paragraph dialogue">“说实话，很感谢生命里出现了像银硕这样的人。”</p><p class="story-paragraph dialogue">“虽然不会主动地说一些精巧漂亮的话，但可以十分确定他的内心是温暖且柔软的。”</p><p class="story-paragraph dialogue">“偶尔会讲一些无厘头的笑话，其实是他独特的表达爱意的方式。”</p><p class="story-paragraph dialogue">“银硕受到伤害是我的不对，在我看来这段感情的错误应该全在我。”</p><p class="story-paragraph dialogue">“希望这一次银硕能碰到真正可以灵魂相拥的人。”</p><p class="story-paragraph dialogue">“另外补充一句，银硕的泡菜炒饭真的很好吃，能让人想起妈妈的感觉（问号笑脸）”</p><p class="story-paragraph">银硕的话音未落，智恩就已经哭红了眼睛，一旁地宥真沉默着给她递过去新开封的抽纸。</p><p class="story-paragraph dialogue">“不会真的吃了泡菜炒饭想到妈妈了吧。”银硕合上手里的信纸，望向哭泣的智恩开玩笑道，智恩破涕为笑，降到低谷的气氛被拉起来了几分。</p><p class="story-paragraph">第二位是宥真，她从今天入住以来就并不常说话，有很漂亮的脸蛋，穿着衬肤色的树莓粉衬衫，由内而外散发着一种沉稳善思的气质。</p><p class="story-paragraph">她很安静地拆开信封抽出信纸，隔着纸背都可以隐约看见她的X似乎写了很长的篇幅。</p><p class="story-paragraph dialogue">“宥真是一个内心很有力量的人，她从不轻易向别人展现脆弱的一面。”</p><p class="story-paragraph dialogue">“很遗憾没办法继续做宥真的守护者。”</p><p class="story-paragraph dialogue">“但还是很感谢她能给我这段珍贵的恋爱体验。以后还能遇见这样好的人吗？如今时常也会有这样的想法。”</p><p class="story-paragraph dialogue">“希望我给她留下的痕迹不全是伤痕，也真心希望她能在这里得到治愈，拜托大家。”</p><p class="story-paragraph">不得不说来自X的介绍信真的是很神奇的东西。</p><p class="story-paragraph">唤醒一场来自旧时空的雨，去淋湿当下的两个人。</p><p class="story-paragraph">过去式的爱与恨重新杂糅在一起，在文字的装饰和解剖下变成美丽又刺痛人的玫瑰。</p><p class="story-paragraph">目前还仅仅只是从旁观者的角度，我都不免佩服起节目组的流程策划。</p><p class="story-paragraph">元彬是第三位，他在开始读信前又轻轻叹了一口气，他今天好像总是会叹气。</p><p class="story-paragraph dialogue">“很幸运能遇见元彬，在最好的年纪遇见最好的人，我始终相信是一种恩赐。”</p><p class="story-paragraph dialogue">“元彬是充满惊喜的矛盾体，他有很大很大的梦想，也有很小很细腻的情绪。”</p><p class="story-paragraph dialogue">“如果可以碰到一路同行的另一个人，我一定会给予最热情的应援！”</p><p class="story-paragraph">后面还有一些俏皮的话，但我渐渐听不太清了，刚发现下一个就要轮到我，本来预设好的平静心情还是在最后的关头又掀起了波澜。手心沁出一层薄汗，感觉信封突然变成了烫手的山芋，烫得人都快要握不住。</p><p class="story-paragraph">终于到我，众人的目光齐刷刷地向我投射过来，应该也包含郑成灿的那一束。</p><p class="story-paragraph">我小心地将封口处撕开，仿佛在做什么精密的手术一般抽出了那张信纸。节目组提供的纸张很有质感，仅仅一张捏在手里也能感觉到一丝厚重，当然也有可能是承载了厚重东西的缘故。</p><p class="story-paragraph">我深吸了一口气将信纸打开，信件的内容不长不短。</p><p class="story-paragraph">是郑成灿眼里的我。</p><p class="story-paragraph dialogue">“是她让我开始相信世界上真的有爱存在。”</p><p class="story-paragraph">完全没有意料到第一句话就会有如此分量，我不免愣了愣神，视线继续慢慢下移。</p><p class="story-paragraph dialogue">“她具有魔力，和她在一起的时候，时间好像只会有两种标签，在一起的时间，不在一起但特别想念的时间。”</p><p class="story-paragraph">”她会做很好吃的料理，如果有机会吃到的话，请一定要给她很多很多的赞美。”</p><p class="story-paragraph dialogue">“她的共情能力很强，不习惯麻烦别人，所以有时候会连带着眼泪和伤口都偷偷地藏起来，希望你可以主动地走近她去发现，并给她耐心且温柔的保护。”</p><p class="story-paragraph dialogue">“真的很抱歉最后的我没能做到，让她流了很多的眼泪也吃了很多的苦。”</p><p class="story-paragraph dialogue">“因为她真的是非常非常可爱的人，所以理应遇见比我更好的人。”</p><p class="story-paragraph">用平静的语气读完这封信真的不是一件容易的事，几次都快要哽咽失声但还是尽力忍住，以至于读完后才发现指甲嵌进了掌心肉里，一道道红色的痕迹很是骇人。</p><p class="story-paragraph">大家鼓掌给我鼓励，掌声响起的那一刻却仿佛触发了心底的某处开关，大理石桌面倒映着白色吊灯的光影，明晃晃地让人眼睛一阵钻心的刺痛。眼泪最终还是落了下来，有几滴洇在未折叠起来的信纸上，黑字变得扭曲。</p><p class="story-paragraph">它们本就是扭曲的，明明说着多么多么难忘，却又让人那么那么难过。</p><p class="story-paragraph">接下来熙媛、民浩和智恩也都陆续朗读了自己的信件，智恩本来就一直红着眼，在念完自己的那封信后眼泪忽然如决堤一般汹涌而出。大家手忙脚乱，好一阵安抚过后，才迟迟轮到了最后一位。</p><p class="story-paragraph">接连两次都让郑成灿排到最后，仿佛是冥冥中对我的某种惩罚。</p><p class="story-paragraph">他不知什么时候已经撕开了信封，所以轮到他的时候直接就抽出了信纸。随着他展开纸张的动作，我感觉我的心也在他的指尖被剖开，摊平，审阅。</p><p class="story-paragraph dialogue">“成灿是我生命里最珍贵的人，这种珍贵没有时间和空间的限定。”他停顿了一下。</p><p class="story-paragraph dialogue">“他一直说想成为像太阳一样的人，他也的确是我曾经阴霾生活里的太阳，托他的福，让我得以顺利地度过了很多难捱的暗黑时刻。”</p><p class="story-paragraph dialogue">“成灿喜欢的东西很多，因为他是太过温柔的人所以总是很乐于广泛地传播自己的爱意。他喜欢小狗也喜欢秋天，因此秋天带小狗出去散步这件事叫上他一定不会出错。”</p><p class="story-paragraph dialogue">“啊，但是成灿不喜欢蘑菇，如果出去吃饭的话请一定要避开这个选项。”</p><p class="story-paragraph dialogue">“很抱歉最后一段时间留下很多不好的记忆，为了不让我受累，他其实做了很多很多的努力。所以真心希望成灿可以碰到更加合适的人，用新的笑容去掩盖掉旧的泪水吧。”</p><p class="story-paragraph">我这才发原来在信的结尾我们都出奇一致地用到了更好、更合适这样的形容词。</p><p class="story-paragraph">曾经就听说过一种说法，说匹配的爱人可以弥补灵魂的空缺。可是这世上真的会有完全合适，完全精准到严丝合缝的两个人吗？</p><p class="story-paragraph">我找不到答案，当时如此，现在亦是。</p><p class="story-paragraph">念完信件，郑成灿同我预想的一样没有流露过多的反应，好像从头到尾都只是一个他人故事的转述者。</p><p class="story-paragraph">他就是这样的，一旦决定冷静就很难被影响，心弦上结起厚厚的冰。只是希望这一次他选择冻伤我的时候没有再冻伤自己。</p><p class="story-paragraph">大家一阵鼓掌后这个漫长又磨人的环节终于算是结束了。</p><p class="story-paragraph">但餐厅里的氛围还是低迷着，各怀心事。</p><p class="story-paragraph dialogue">“好安静啊。”熙媛尝试打破僵局：“要安排一下明天晚上的菜谱吗？”</p><p class="story-paragraph dialogue">“怎么刚吃完又想到吃了。”宥真笑起来配合她缓和气氛。</p><p class="story-paragraph dialogue">“明天想吃什么？”银硕俨然一副首席主厨的架势，郑成灿闻言也笑起来，看起来今天备餐的过程中两个人变亲近了不少。</p><p class="story-paragraph dialogue">“辣炒年糕？”熙媛抛出选项，大家一致通过。</p><p class="story-paragraph">饭后众人相约到客厅再喝第二轮，但我因为明天早上工作的原因只能先行回房休息。</p><p class="story-paragraph">独自一个人慢悠悠地回到二楼的卧室，漆黑一片却也并不想开灯。窗户没有关，夜风悠悠地吹进来竟有几分醒酒的功效。我顺势趴到窗台上去看庭院里的那片木槿花，光线昏黄，花瓣合在一处沉沉地垂着头。但木槿花朝开暮落，明天太阳出来以后它们就又能恢复如初，绽放成最美丽模样。</p><p class="story-paragraph">如果人也能如此就好了。</p><p class="story-paragraph">脑子里不知道为什么突然就冒出了这样的奇怪想法。</p><p class="story-paragraph">但说真的，如果人真的能像木槿花一样，每一天都是全新的一天，不受记忆困扰之苦的话，那世界上快乐的人必定会呈指数级增长。</p><p class="story-paragraph">没有过去做底色，心就能纯净如水。</p><p class="story-paragraph">而水是自由自在的。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">胡思乱想的时候节目组的信息发到了我的手机。</p><p class="story-paragraph dialogue screen-line">「请选择今天最让你心动的人，并发送短信。」</p><p class="story-paragraph">并没有做太多的思考，我很快便编辑好了短信并发送给了元彬。</p><p class="story-paragraph dialogue">“谢谢你的糖果。”</p><p class="story-paragraph">我是这样写的。</p><p class="story-paragraph">因为的确很想再次感谢他，所以在绝对不发给郑成灿的想法前提下，我的选择毫不犹豫。</p><p class="story-paragraph">而接下来等待短信反馈的时间就比我想象的要漫长许多，其实我清楚郑成灿的短信不会发给我，但很多时候心跳并不受到大脑的控制。</p><p class="story-paragraph">手机屏幕上的数字犹如龟速一般跳动，我感觉房间里静得都快要听不见自己的呼吸了。</p><p class="story-paragraph">仿佛等待了一个世纪之久，提示音才突然响起。手机的震动通过左手传至胸口，引起一阵轻微的绞痛。</p><p class="story-paragraph">点开消息框，也是很短的一句话。</p><p class="story-paragraph dialogue">“不要哭了，你做得很好。”</p><p class="story-paragraph">这个句式和语气，我很快便识别出了消息来自元彬。</p><p class="story-paragraph">但紧接着还未完全转黑的手机屏幕又一次亮了起来，第二条信息这样直接就砸进了我的眼睛里。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue screen-line">「你的X没有选择你」</p></div>

      <article class="chapter" aria-labelledby="heading-chapter-04">
        <header class="chapter-header">
          <span class="chapter-number">04</span>
          <h2 id="heading-chapter-04">你离开的季节</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">今天起得很早，走到屋外的时候天空还泛着鱼肚白。昨天夜里应该是又下过雨了，一呼一吸间有湿润的青草和泥土香气，我站在寂静无人的坡道上长长地伸了个懒腰。</p><p class="story-paragraph">经历了昨日一整天的混沌，今天好像逐渐有了适应的感觉。</p><p class="story-paragraph">白天去公司解决完重要的项目会议，傍晚返程的路上忽然想散散步，于是打车到就近的路口，一个人慢悠悠地往小屋的方向踱步。</p><p class="story-paragraph">虽然是7月，但临近日落，暑气收敛了许多。遥远的天际线处温柔地翻滚着西柚色的晚霞，像一段缓慢而绵长的行板，目光所及都镀上了一层余晖。暮色渐浓了，但夜又还未降临，偶尔会飘来一两声汽车悠长的鸣笛，暧昧又孤独的蓝调时刻，心似乎也变得静谧。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">回到屋子就看见元彬一个人安静地斜歪在沙发里，落地窗外的木槿花在他身后像暗粉色的图腾。</p><p class="story-paragraph dialogue">“怎么不开灯？”我随手将换下来的外套搭在近门口的木椅上。</p><p class="story-paragraph dialogue">“还不算太黑。”他将唯一戴着的那只耳机摘下来，我才发现他在听音乐。</p><p class="story-paragraph">换好鞋走过去，坐到他旁边的沙发上，他有些慵懒地挪动了一下身子，然后轻轻仰过头来问我今天工作是否顺利。元彬应该是全天都在家，还穿着一身宽松的居家服，头发松松软软地自然下垂，一时间竟真像一只刚睡醒的猫咪。</p><p class="story-paragraph">我简单同他吐槽了一下今天的工作内容，随即便询问起其他嘉宾的情况。</p><p class="story-paragraph dialogue">“也不是只有我在家里...”元彬正说着，熙媛打招呼的声音就从楼梯口传来。</p><p class="story-paragraph">她应该是编了头发，穿着一条薄荷绿的长裙子，虽然屋内光线很暗，但这个颜色还是十分亮眼，扑面而来的氧气感。</p><p class="story-paragraph dialogue">“是要出门吗？”</p><p class="story-paragraph">她趴在楼梯栏杆上冲我笑着点了点头：“对，和成灿xi出去买今天晚上要用的年糕。”</p><p class="story-paragraph dialogue">“啊...成灿吗？”几乎是脱口而出的问句，但我也不知道自己想要以此来确认什么。</p><p class="story-paragraph">我没有任何立场再去过问他的事情了。</p><p class="story-paragraph dialogue">“嗯呢，发现昨天忘记买年糕了。”熙媛似乎没有听出我语调里的异样，继续自顾自地给我描述事情的起因：“刚好成灿xi说可以开车。”</p><p class="story-paragraph">我想起刚刚回家时门口停着的那辆黑色的SUV，当时只觉得有些眼熟，原来真的是郑成灿的车。</p><p class="story-paragraph dialogue">“那...他人呢？”我试探道。</p><p class="story-paragraph dialogue">“在外面吧...”</p><p class="story-paragraph">熙媛说着忽然直起身子开始兴奋地挥手，我和元彬同时顺着她的目光回头看去。</p><p class="story-paragraph">硕大的落地窗外，我看见了同样在招手的郑成灿。</p><p class="story-paragraph">黄昏的末尾时分，他全身披着淡淡的暗金色站在花树前，像一幅快要全部褪色的旧画。我肯定他没有看见我，那样的笑脸才得以久违地挂到他脸上。得到熙媛的回应后，他又笑了笑才转过身大步向外面走去。</p><p class="story-paragraph">我的目光像尾巴一样跟着他，但夜色仿佛陡然间就全部沉坠了下来。</p><p class="story-paragraph">他很快消失不见了。</p><p class="story-paragraph">屋里恢复寂静。</p><p class="story-paragraph">近乎机械式地起身去开灯，顺路又去厨房给自己倒了一杯冰水，仰起头一口气全部灌进了胃里，腹部传来一阵钻心的绞痛，藤蔓破土一般，我的眼泪忽然就落了下来。</p><p class="story-paragraph">想起了小时候弄丢的那只小熊娃娃。</p><p class="story-paragraph">也是在这样的夏天傍晚，沿着街道找了一圈又一圈，那时候没有路灯，所以夜幕彻底降临的那一刻我一屁股摔坐到地上哇哇大哭了起来。妈妈蹲下来试着安慰我，但眼泪好像就是擦不干净。</p><p class="story-paragraph dialogue">“天全黑了，找不到了。”我把头埋进妈妈的怀里，囫囵地哭诉：“我没有小熊了。”</p><p class="story-paragraph">我没有小熊了。</p><p class="story-paragraph">而这一次，我也没有郑成灿了。</p><p class="story-paragraph">为了避免被元彬再次发现哭红的眼睛，我选择躲回了二楼的房间。直到楼下逐渐传来断续的嬉笑声，我才再次收拾好妆面下楼。</p><p class="story-paragraph">但刚走到楼梯转角处就和上楼来放衣服的郑成灿撞了个正着。</p><p class="story-paragraph">他个子真的很高，哪怕矮了我两三层台阶，却还是可以非常轻松地和我水平对视。</p><p class="story-paragraph">四目相对，本来正常足以两人上下的楼道突然之间开始无限缩窄，全身的器官似乎也在这一刻被狠狠挤压，赶在心跳超速前我深深地吸了一口气。</p><p class="story-paragraph dialogue">“在休息？”没想到郑成灿会主动破冰，但由于他的眼底和声音都毫无波澜，我并不敢擅自将这句话归为关心。</p><p class="story-paragraph dialogue">“睡觉。”我目光飘忽，随口编了个谎。</p><p class="story-paragraph dialogue">“哦。”他点了点头，随即略微侧起身来示意我可以过去，保留了非常礼貌的距离。</p><p class="story-paragraph">我们就这么没话讲吗？莫名的有些恼火，但种种质问始终也只是憋在嗓子眼，沉默了半晌，我轻轻问他是才买了年糕回来吗？</p><p class="story-paragraph">他愣了一下说是，我也点了点头，然后便从他让出的空间走过去。</p><p class="story-paragraph">全程我都尽力收紧身子，把头垂得很低，但相互贴近的半秒钟里却还是清楚地感觉到了他的鼻息，以及他周身散发的温度，是很暖的温度。</p><p class="story-paragraph">暖得有那么一瞬间我都产生了拥抱上去的冲动。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">今天的晚餐银硕如约做了很大一份辣炒年糕，配上宥真带回来的特酿米酒，大家都吃得很尽兴，年糕很合我的口味，所以哪怕今天心情不算很好但也还是吃了一些。</p><p class="story-paragraph">酒足饭饱后，节目组的信件也随之到来。</p><p class="story-paragraph">众人纷纷转移到更空旷的客厅落座，熙媛取回信件后很自然地坐到了郑成灿身旁的位置。</p><p class="story-paragraph">看在眼里，我端起杯子抿了一小口水。</p><p class="story-paragraph">说不嫉妒是假的，脑海里此刻大概有一千个问题在如野草一般疯长，缠绕编织。</p><p class="story-paragraph dialogue screen-line">「他们去哪里购物了」</p><p class="story-paragraph dialogue screen-line">「仅仅买一次东西就这么熟了吗」</p><p class="story-paragraph dialogue screen-line">「熙媛是喜欢成灿吗」</p><p class="story-paragraph dialogue screen-line">「那...成灿会喜欢熙媛吗」</p><p class="story-paragraph">我感觉自己无形中就变成了一颗盈满酸涩汁水的柠檬果实，一只以妒火为食的怪物。</p><p class="story-paragraph">我讨厌变成这样。</p><p class="story-paragraph">都怪郑成灿，让我变成了讨厌的人。</p><p class="story-paragraph dialogue screen-line">「男嘉宾挑选了记录着和X的记忆的场所。请女嘉宾选择喜欢的回忆碎片，来决定约会对象。」</p><p class="story-paragraph">恍恍惚惚中听熙媛念完规则，又看见她从信封里掏出了四枚方形卡片，分别是男嘉宾选定场所的一角。但节目组故意截取了一些难以辨识的角落，因此放眼望去，我并没有很快识别出哪张来自郑成灿。</p><p class="story-paragraph">宥真很快就做出了选择，在询问过我们的意见后她拿走了最右边的一块，看起来像是某一处窗台，我的记忆检索不出，应该不是郑成灿的卡片。</p><p class="story-paragraph dialogue">“应该是室内活动吧～”宥真笑着解释自己的理由，她笑起来眼睛弯弯的，像初生的月亮。</p><p class="story-paragraph">我继续辨识剩下的三张，一张似乎是汉江边的栏杆，一张大概是唱片的一角，最后一张则是呈现了一些棕色的纹路。</p><p class="story-paragraph">会是什么呢？粗糙的棕色纹路看起来像树。如果是树的话？是首尔林公园吗？！</p><p class="story-paragraph">灵感在一瞬间降临，我想我应该猜出来了，最后一张是首尔林公园的银杏树。</p><p class="story-paragraph">他选择的竟然是这里。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">和郑成灿交往后的第一个秋天，我们就去了首尔林公园看银杏。</p><p class="story-paragraph">像很多情侣那样，我们找了一个阳光可以照到的地方，铺好野餐垫，摆上餐篮和花束后便不约而同地仰面躺下了。</p><p class="story-paragraph">耳边是风声和鸟叫，阳光在枝桠缝隙间闪烁，满树的银杏叶仿佛都在隐隐发光。</p><p class="story-paragraph">风悠悠地吹落下一片心形的叶子，我见状伸手去接，郑成灿也在这时抬起了胳膊，但他不是去接叶子，而是轻轻地去碰我的手。他的手指干净又纤长，有很清晰的骨节，白皙的皮肤在阳光下变得透明，能看见安静的血管走向。</p><p class="story-paragraph">我鬼使神差地用小拇指去勾他的手腕，他忽然就反握过来，仿佛预谋已久。看着他的指尖顺着我手部的骨骼一寸寸缓慢游走，穿插，纠缠，直至十指相扣。</p><p class="story-paragraph">我们就这样牵着手躺在树下聊天，从草莓聊到蝴蝶，从秋天的落叶聊到春天的早樱，从天空中那朵半明半暗的云聊到广安里海边金色的浪花。</p><p class="story-paragraph">我们好像聊到了万物，但我们又都在万物之外。</p><p class="story-paragraph">难怪郑成灿会喜欢秋天，真的是个很好的季节，刚刚好的天气，刚刚好的温度，刚刚好还在爱我的你。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">熙媛的声音打断了我的思绪。</p><p class="story-paragraph dialogue">“你们有想法吗？”她侧着头问我和智恩，手指指着的正是棕色的卡片。</p><p class="story-paragraph">我想说些什么，但又什么也说不出来。智恩则是摇了摇头，很是苦恼：“随便吧，我选不出。”</p><p class="story-paragraph dialogue">“那我就选这张啦。”熙媛笑道。</p><p class="story-paragraph dialogue">“好。”我终于憋出了一个字，并随手拿起了看起来像唱片的那张：“那我选这个。”</p><p class="story-paragraph">抬头的一瞬间，我感觉碰上了郑成灿的视线，但当我看向他，他又似乎在望着别的地方。</p><p class="story-paragraph">拿起手机扫描卡片背后的二维码，元彬的照片随即出现了屏幕上。</p><p class="story-paragraph dialogue screen-line">「请确认您的约会对象是朴元彬」</p><p class="story-paragraph">居然选到了比较熟的人，我心下一惊，下意识地用目光去找元彬，结果发现他也正在看着我。大概是看见了我表情的变化，他的嘴角勾起了一抹似有若无的笑意。</p><p class="story-paragraph dialogue">“要是能再多透露点地点信息就好了。”</p><p class="story-paragraph dialogue">“是啊，我都不知道明天应该穿什么比较合适。”</p><p class="story-paragraph dialogue">“你们男生都是知道的吧！”</p><p class="story-paragraph">女生们确认完对应的男嘉宾后又七嘴八舌地聊开了。</p><p class="story-paragraph">但还没说上几句，节目组就又发来了信息。</p><p class="story-paragraph dialogue screen-line">「现在请前往秘密聊天室，和约会对象的X进行谈话」</p><p class="story-paragraph">于是女生们陆陆续续收拾好出门。</p><p class="story-paragraph">夏天昼夜温差大，刚推开大门我就不禁打了个寒战，喝了些酒然后被风一吹感觉太阳穴都不可控地胡乱蹦跳了起来，就这样头重脚轻地走向了位于坡顶的秘密聊天室。</p><p class="story-paragraph">首先是需要和元彬的X对话。</p><p class="story-paragraph">想不出来什么特别的问题，我就简单地问了一些基本信息。</p><p class="story-paragraph dialogue">“他吃辣吗？”</p><p class="story-paragraph dialogue">“喜欢吃，但是不太能吃。”</p><p class="story-paragraph dialogue">“平时喜欢做什么呢？”</p><p class="story-paragraph dialogue">“或许...发呆？ㅋㅋㅋ。”</p><p class="story-paragraph dialogue">“还有吗？”</p><p class="story-paragraph dialogue">“弹吉他吧。他很擅长这个。”</p><p class="story-paragraph">元彬的X回复得很快，偶尔还会搭配一些可爱的表情，会是谁呢？我在心里一阵揣测。</p><p class="story-paragraph">结束这段对话后，我开始等待熙媛来询问我关于郑成灿的事。</p><p class="story-paragraph">一段漫长的煎熬，手指拧成结，又松开，直到面前的屏幕再次亮起。</p><p class="story-paragraph">--“您好～”</p><p class="story-paragraph">熙媛的语调果然很活泼，一上来就配了几个笑脸emoji。我盯着这种句子后加几个表情的表达形式，忽然脑子里一阵短促的电流感，所以元彬的X是熙媛吧！</p><p class="story-paragraph">尝试消化这个讯息，但还是忍不住苦笑起来，所以这就是换乘恋爱吗？</p><p class="story-paragraph">--“请问明天的约会我有什么需要注意的吗？”</p><p class="story-paragraph dialogue">“应该没有，成灿是很友好的人。”</p><p class="story-paragraph">--“那该穿什么衣服去呢？成灿喜欢什么样的风格？”</p><p class="story-paragraph dialogue">“穿什么都可以，但最好是方便散步的鞋子。”</p><p class="story-paragraph dialogue">“熙媛很漂亮，他会喜欢你的。”</p><p class="story-paragraph">这句是实话，熙媛很有活力，也很可爱，我想应该没有人会不喜欢这样的女孩。</p><p class="story-paragraph">--“明天要去的地方是好的回忆还是坏的回忆呢？”</p><p class="story-paragraph dialogue">“应该是好的吧。”</p><p class="story-paragraph">我犹豫了一下，又输入了一句话。</p><p class="story-paragraph dialogue">“是很好很好的回忆。”</p><p class="story-paragraph">仿佛突然就觉醒了领地意识，对面的熙媛此刻应该会觉得我有一点强势吧，可我真的没办法做到完全轻描淡写，这是我和他的回忆，就请我允许短暂地变成自私的人吧。</p><p class="story-paragraph">--“啊..是对X还有留恋吗？”</p><p class="story-paragraph">--“不回答也是可以的。”</p><p class="story-paragraph dialogue">“说没有留恋应该是谎话吧。”</p><p class="story-paragraph">我本来想这样说的，但为了不给熙媛造成更大的困扰，最终还是全部删掉了。</p><p class="story-paragraph dialogue">“可能吧，我也不太清楚。”我这样发出去了。</p><p class="story-paragraph">--“X是个什么样的人呢？”</p><p class="story-paragraph">看到这个问题的一瞬间，各种郑成灿的影子在我的眼前开始交叉重叠，他笑着，哭着，沉默者，失望着，一帧帧虚幻又真实。</p><p class="story-paragraph dialogue">“是..很好的人。”所有的形容词凝聚成了一句话，思绪如潮水般一浪接一浪的翻涌而来。</p><p class="story-paragraph dialogue">“成灿他很会替别人着想，做事情很有分寸。”</p><p class="story-paragraph dialogue">“性格很有趣也很有魅力，多和他相处的话就会发现。”</p><p class="story-paragraph">我的手指在键盘上翻飞，不知不觉竟然连着输入了好几条。</p><p class="story-paragraph">--“看起来是很不错的人，那为什么会分手呢？”</p><p class="story-paragraph dialogue">“因为...”</p><p class="story-paragraph dialogue">“因为在一起这件事好像变成了彼此的负担。”</p><p class="story-paragraph">这是我自己的理解，但我想郑成灿的想法应该也是相似的，记得分手那天他一直在反复地跟我说：“轻松一点吧，怒那，我们都让对方轻松一点。”</p><p class="story-paragraph">--“好的，那我没什么别的问题了。”</p><p class="story-paragraph">--“祝你明天玩得开心。”</p><p class="story-paragraph dialogue">“你也是。”我回复道，尽管有点违心的意味，但我还是不希望熙媛被我的情绪殃及。</p><p class="story-paragraph">所有的对话结束，整个人犹如一个猛然泄气的气球瘫靠到椅背上。如果不是亲身经历，我不知道原来向别人分享郑成灿是一件这样吃力的事情，如果有可能的话，我其实什么都不想说。仿佛在重新去拼接一幅破碎的拼图画，每一块都还余留着从前的指纹，烙印一般。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">又是独自一人头昏脑胀地往小屋走去，结果被节目组提醒还要去前面的电话亭接听来自X的语音，说是节目开拍前录制的。</p><p class="story-paragraph">站在电话亭里平复了好一会心情才轻轻拿起了听筒。</p><p class="story-paragraph">郑成灿的嗓音一瞬间就将我包围。</p><p class="story-paragraph">--“怒那，你好。”</p><p class="story-paragraph">--“这两天没有太辛苦吧。”</p><p class="story-paragraph">太难得的温柔语调，一时间都让我恍惚了，感觉他还像从前一样正在电话那头哄我入睡。睡吧睡吧，今天也辛苦了，他那时候总会这样喃喃。</p><p class="story-paragraph">--“应该猜出来我选的地方了吧。之前的银杏叶我还夹了一片在书里，前两天刚翻出来了。”</p><p class="story-paragraph">--“叶片的脉络都拓印到纸上了。”</p><p class="story-paragraph">他说着自己笑起来，呼吸声被放大，像有风在触碰我的耳朵，又像一起一伏的潮汐。</p><p class="story-paragraph">--“那时候才意识到，原来已经过去这么久了啊。”</p><p class="story-paragraph">是啊，原来已经过去这么久了，我在心里小声地附和。</p><p class="story-paragraph">--“明天好好玩吧。路上注意安全。”</p><p class="story-paragraph">他轻轻地停顿了一下，我的呼吸也随之一滞。</p><p class="story-paragraph">--“那么，晚安。”</p><p class="story-paragraph">清脆的挂断声，接着是一连串嘟嘟嘟的忙音，郑成灿仿佛电子蝴蝶一般飞走了，抓不住的。</p><p class="story-paragraph">回到小屋的时候，夜风已经把眼泪吹干了。尽管才入住的第二天，我都已经快要数不清楚自己流泪的次数了。</p><p class="story-paragraph">今天也是一样需要给心动的人发送信息。</p><p class="story-paragraph dialogue">“今天的炒年糕很好吃。”我简单思考了一下就发给了宋银硕，随后很快也收到了来自元彬的短信。</p><p class="story-paragraph dialogue">“明天见。”</p><p class="story-paragraph">吸取了昨天的经验，收到短信后我并没有立马就将手机放到一旁，而是继续望着屏幕等待节目组的宣判。</p><p class="story-paragraph">果然不久第二条信息也出现在了消息提示栏里。</p><p class="story-paragraph dialogue screen-line">「你的X没有选择你」</p><p class="story-paragraph">并没有太多的意外，我点了点头，将手机熄屏后我窝进沙发里开始闭目养神。</p><p class="story-paragraph">我不会再哭了。</p><p class="story-paragraph">只是成灿，我其实过得很辛苦。</p></div>

          <h2 id="heading-chapter-05">恋爱这件小事</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">早上起来隐约听见窗外有淅淅沥沥的雨声。</p><p class="story-paragraph">雨季的雨来得总是随心所欲。</p><p class="story-paragraph">我穿着睡衣摸进厨房想找点东西吃，却迎头撞见了正在冰箱里翻找的郑成灿。刚睡醒大脑还处于半宕机的状态，我眯起眼靠着墙壁粘粘乎乎地道了声早安。</p><p class="story-paragraph dialogue">“早。”回答我的却是宥真。</p><p class="story-paragraph">才发现她也在厨房里，站在靠窗的角落很热情地冲我举了举手里的咖啡杯：“要喝咖啡吗？”</p><p class="story-paragraph dialogue">“呃...”有点犹豫。</p><p class="story-paragraph">因为肠胃敏感的缘故，我其实并没有早晨空腹喝咖啡的习惯。在脑子里琢磨了半天婉拒的措辞，正要回答，郑成灿却忽然截了我的话头。</p><p class="story-paragraph dialogue">“或许有人要吃牛奶燕麦吗？”他边说着边从冰箱里拎出了一袋麦片和一盒牛奶：“感觉今天会比较需要体力。”他说话的时候低着头，也不知道在同谁讲。</p><p class="story-paragraph dialogue">“哦...有道理。”宥真若有所思地抿了一口咖啡笑道：“那麻烦你了，成灿xi。”</p><p class="story-paragraph">随即她又看向我抬了抬下巴：“喝什么？”</p><p class="story-paragraph dialogue">“那...一杯拿铁吧，谢谢智恩。”我其实有些犯懵。</p><p class="story-paragraph">估计是未开封的麦片包装比较难撕开，耳边持续传来塑料摩擦的声响，我靠在墙角默默地看了郑成灿的背影好一会。</p><p class="story-paragraph dialogue">“可以也帮我做一份麦片吗？”最终决定问出这句话的时候，我承认有赌的成分。</p><p class="story-paragraph dialogue">“嗯...”</p><p class="story-paragraph">我的声音很小，但他回答得很快。</p><p class="story-paragraph">轻快又短促的音节落在空气里，像风拨了一下弦。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">简单解决完早饭，我按时出门赴约。</p><p class="story-paragraph">走到十字路口就远远地看见朴元彬站在唱片店门口。他撑着一把透明的伞，银色的头戴耳机挂在脖子上，穿着黑粉格纹的宽松衬衫。雨拉起一层朦胧的帘幕，竟有几分像千禧海报的画面。</p><p class="story-paragraph">碰面，寒暄，并肩走进店里，元彬说他是这里的常客。</p><p class="story-paragraph dialogue">“是和X经常来吗？”</p><p class="story-paragraph">他好像料到了我会问这个问题，挑选唱片的手指并没有停顿。</p><p class="story-paragraph dialogue">“曾经是，但已经很久都是一个人来了。”他说得很轻松。</p><p class="story-paragraph">好像在和旁人谈及回忆的时候，哪怕再铭心刻骨，也很少会有人真的表现出歇斯底里，有些可能的确是被时间冲淡了，忘记了，但掩耳盗铃，自我麻痹的也大有人在。</p><p class="story-paragraph">我不知道元彬属于哪种，毕竟我连自己都看不懂。</p><p class="story-paragraph dialogue">“要听吗？”不知他什么时候已经捣鼓好了设备，蹲坐着抬起手来递给我一个耳机。</p><p class="story-paragraph">他黑色的瞳孔干净得没有一点杂质，像漫长纯粹的极夜。</p><p class="story-paragraph">我靠着他坐下，小小的双人沙发。店里不知道用的什么香氛，木质的味道在下雨天变得潮湿又缠绵，感觉快要生出翠绿的青苔。</p><p class="story-paragraph">耳机里的音乐悠悠地飘出来，舒缓复古的乐器，慵懒沉淀的女声，英文歌词我听不太清，但还是能捕捉到一些惯用的爱情词汇。</p><p class="story-paragraph">baby，love，you and me，是唱不腻的永恒话题。</p><p class="story-paragraph">之前从没来过唱片店，所以今天的一切都显得格外新奇，元彬带我听了很多不同类型的音乐，他总是听得很专注，我有时候就盯着他的侧脸发呆。</p><p class="story-paragraph">爱真的是很神奇的东西，它可以把世界分隔出专属的一隅，在那一方小小的天地里，我们变成无畏的勇士，变成虔诚的信徒，变成天才的梦想家。</p><p class="story-paragraph">爱音乐，爱人都是一样。</p><p class="story-paragraph">结束唱片店之旅，元彬选了一家传统的韩料餐厅吃午饭。</p><p class="story-paragraph dialogue">“没想到你居然会选传统料理诶。”</p><p class="story-paragraph">吃饭的时候我开始和他有一搭没一搭地闲聊。</p><p class="story-paragraph dialogue">“因为昨天有听说你是喜欢摇滚吉他的人？感觉那样的话应该会更喜欢...西式的餐饮？”</p><p class="story-paragraph dialogue">“是吗？所以是发现我是个反叛又传统的人了吗？”</p><p class="story-paragraph">元彬笑道，并夹了一根年糕放到嘴里慢慢地咀嚼。</p><p class="story-paragraph">这对形容词昨天也被提到了，在秘密聊天室和熙媛对话的时候。</p><p class="story-paragraph">我一时间有些惊讶，并如实地告诉他我从他的X那里听到了相似的描述。</p><p class="story-paragraph dialogue">“看起来还是很有默契的人啊。”我不免随口发出一句了感慨。</p><p class="story-paragraph">他闻言轻笑了一声低下头，耳畔的头发顺势滑落下来。</p><p class="story-paragraph">良久，我听见他叹了一口气。</p><p class="story-paragraph dialogue">“默契的人却也不一定就能做爱人。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">默契的人不一定就能做爱人。</p><p class="story-paragraph">心里突然掠过一阵大风，我不合时宜地在别人的故事里想起郑成灿了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">来参加正式录制的前一周，我接受了节目组的前置访谈。</p><p class="story-paragraph">访谈的房间布置得很舒适，让人情不自禁就放松下来将过往的种种都娓娓道来。</p><p class="story-paragraph dialogue screen-line">「和X是怎么认识的呢？」</p><p class="story-paragraph">听到第一个问题，我抿了抿嘴巴。</p><p class="story-paragraph">我和郑成灿的初次见面其实更像是我一个人的兵荒马乱。</p><p class="story-paragraph">是在研究生一年级的时候，因为人像摄影课的突击作业，我不得不开始手忙脚乱地找模特，但忙活了好几天都没有找到特别合适的。</p><p class="story-paragraph">苦寻无果，一个人心烦意乱地坐在便利店窗边吃半价便当的时候，我看见了郑成灿。</p><p class="story-paragraph">可能世上真的有聆听人心愿的神祗，我当时心里就是这样想的。他那样显眼地立在等候绿灯的人群里，独树一帜，远看上去真的像是从天而降的奇迹。</p><p class="story-paragraph">心里当即就做了决定，顾不得许多，我一个箭步夺门而出，拦到他面前的时候已经上气不接下气。</p><p class="story-paragraph">这时我才完全看清楚他的脸，真是好看得不像话，明明还没到夜晚，他的眼睛却倒映着月光，流淌的，波澜的，又像无限延伸的海面，漾着一层层温柔的浪。</p><p class="story-paragraph">他歪了歪头很礼貌地问我有什么事情。</p><p class="story-paragraph dialogue">“或许...”我深吸了一口气，但耳朵里有咚咚的鼓鸣，心脏也在胡乱跳高：“或许，你可以...”</p><p class="story-paragraph dialogue">“你可以做我的模特吗？”为了完整说出这句话，我几乎是用喊的。</p><p class="story-paragraph">他的瞳孔非常明显地震了一下，但转而却笑了起来，我仰着头一眼就看见了他尖尖的虎牙。</p><p class="story-paragraph">他说好啊。没有一点犹豫的意思。</p><p class="story-paragraph dialogue">“诶？！”这下震惊转移到了我身上，也太过于顺畅了吧，我不禁连连摆起手来：“不用问一下是什么模特吗？万一我是骗子呢？”</p><p class="story-paragraph dialogue">“嘶...”</p><p class="story-paragraph">他摸了摸下巴，看看天空，又低头看看我，笑容突然变得更大了些，眼睛弯弯的，漂亮又饱满的卧蚕，睫毛垂下来像柔软的蝴蝶翅膀。</p><p class="story-paragraph dialogue">“你看起来不会骗我诶。”</p><p class="story-paragraph">他身后的绿灯突然在这时又亮了起来，信号灯响起一长串清脆的滴滴声，行人开始走动，我们面对面站着，像湍急洪流中的唯二定数。</p><p class="story-paragraph">大概就是这个时候，我意识到好像出大事了。</p><p class="story-paragraph">我好像喜欢上郑成灿了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">之后的拍摄过程都很顺利。他好像天生就是应该待在聚光灯和摄影机前的人，同组的成员一边选片一边赞不绝口，问我是从哪里淘来的宝藏。</p><p class="story-paragraph dialogue">“秘密。”我摇头晃脑卖起了关子。</p><p class="story-paragraph dialogue">“明天小组聚餐把他也一起喊过来吧。”秀彬突然提议：“这次作业也麻烦了他不少。”</p><p class="story-paragraph dialogue screen-line">「所以这是一个和X升温的节点吗？」</p><p class="story-paragraph dialogue">“嗯。”我回忆着当时的情景，情不自禁地笑了起来，暧昧是最涩但也最甜的糖。</p><p class="story-paragraph">虽然借着拍摄的缘由加了郑成灿的kkt，但我们联系的次数其实屈指可数。</p><p class="story-paragraph">有几次想要发早安来着，但都因为觉得突兀而作罢。我太清楚自己的表达能力了，在毫无关系的陌生人面前我可以随心所欲，夸夸而谈，但在郑成灿面前我却好像总是在无限缩小，无限退化，直到最后就只能做一个瞻前顾后，笨嘴拙舌的傻瓜。</p><p class="story-paragraph">单恋是一种会让人变成傻瓜的诅咒。</p><p class="story-paragraph">信心满满地答应组员们一定将郑成灿叫来，一个人躲进卧室后却一阵犯难。</p><p class="story-paragraph dialogue">“滴滴，在吗？”编辑的长篇大论全部删掉了。</p><p class="story-paragraph dialogue">“有什么事？”他回复得很快，应该是下了晚课也回到宿舍了。</p><p class="story-paragraph dialogue">“明天有时间吗？晚上拍摄组有个聚餐。”我咬咬牙就这样发出去了。</p><p class="story-paragraph">其实也就间隔了一分钟，但我的心感觉已经快要撞碎肋骨。</p><p class="story-paragraph dialogue">“好啊”</p><p class="story-paragraph">他的回复出现在对话框里，两个字像定心的药丸。</p><p class="story-paragraph">聚餐的地点在学校附近的烤肉店。</p><p class="story-paragraph">还没有摄入多少酒精，店里暖黄色的灯光就先把人照得微醺了。</p><p class="story-paragraph">郑成灿就坐在我的旁边，浓烈的烤肉味中都能隐约能闻到他衣服上淡淡的皂荚香。</p><p class="story-paragraph">他站起身来帮我拿纸巾，我却只盯着他的手指发呆。光线打下来，把他的手指轮廓勾勒得清晰又明了。</p><p class="story-paragraph">为什么不能牵手啊！我被自己心里突如其来的呐喊吓了一跳，但却耐不住这个声音愈演愈烈。这样的角落里多适合牵手啊，在桌子的阴影下面偷偷地拉扯，让全身的血液都涌到指尖，然后像烙铁一样在对方的手心手背都灼上专属印记。</p><p class="story-paragraph">为什么不能牵手。</p><p class="story-paragraph">这个问题在脑海里翻来覆去，说不出也止不住。郁闷的情绪像蛇尾一样攀上心头，烧酒也就一杯接着一杯。</p><p class="story-paragraph">后面发生的事情就是在一起以后郑成灿讲给我听的了。</p><p class="story-paragraph">他说那天晚上我叫嚷着非要留下来一个人喝酒，所以最后只能由他送我回去。也不知道为什么会醉得那么厉害，整个人歪在他的怀里怎么也站不起来。于是他索性让我趴到他的背上将我背回宿舍。</p><p class="story-paragraph">他说回去的路上我一直窝在他的肩膀上说个不停。</p><p class="story-paragraph">说什么呢？我问。</p><p class="story-paragraph dialogue">“帕波（傻瓜）。你一直在说帕波。”</p><p class="story-paragraph">郑成灿，帕波。</p><p class="story-paragraph dialogue screen-line">「那和X是什么时候在一起的呢？」</p><p class="story-paragraph dialogue">“大概这次聚餐后的两周吧。”我在心里默算了一下时间。</p><p class="story-paragraph">郑成灿和我同校，不过他是医学生。</p><p class="story-paragraph">以他这样的资质很难不成为学校的名人，于是哪怕只是出现了一点有关绯闻的风吹草动，也很快就在公共论坛传开了。</p><p class="story-paragraph dialogue">“是真的吗？”我在聊天框里输入了又删掉，删掉了又输入。</p><p class="story-paragraph">键盘随着指尖的节奏震动，感觉自己也在同时被反复地猛烈捶打，一天没吃东西但胃里依旧翻江倒海，好想吐。</p><p class="story-paragraph">不知道是什么时候睡着的，大概是哭累了以后吧。</p><p class="story-paragraph">收到他的消息的时候天就已经快黑了。</p><p class="story-paragraph">我当时是被消息的震动吵醒，伸手去摸手机的时候才发现枕头湿了大半，肿着眼睛迷迷糊糊地点开kkt。</p><p class="story-paragraph dialogue screen-line">「可以来图书馆这边吗？」</p><p class="story-paragraph">这是他第一次给我发出邀请，可我的心里却打起了退堂鼓。</p><p class="story-paragraph">不知道他找我做什么，能找我做什么呢？万一是和我分享恋情的话，我应该祝福吗？我可以祝福吗？能坦然地说得出口吗？我想把手机干脆扔到别的地方去，结果发现连这样做的力气也没有。</p><p class="story-paragraph">没过多久他发来了第二条消息。</p><p class="story-paragraph dialogue screen-line">「那我来找你。」</p><p class="story-paragraph">昏暗的室内手机屏幕的光线打在脸上，刺进眼睛里。</p><p class="story-paragraph">时间一点点流逝，我忽然从床上蹦了起来，好像有一股情绪从心脏直直地冲上了大脑，视死如归一般。</p><p class="story-paragraph">既然他想见我，刚好我也想见他，那就见面吧。我要去告诉他我的想法了，如果他不喜欢的话那就让这一切全都在今天结束吧。不想再一个人难受了，我又不是真的傻瓜。</p><p class="story-paragraph">怀着这样的心情往图书馆的方向跑去，一路小跑到操场边的第三盏路灯时，我怔怔地停下来了。</p><p class="story-paragraph">我看见郑成灿了。</p><p class="story-paragraph">他真的是我的魔咒，仅仅只在一瞬间，我就感觉自己变成了一瓶被人堵住了瓶口的汽水，一连串的二氧化碳发疯似地上涌，堆积起来形成一堆臃肿的白色泡沫。我实在没办法走路了，只能在原地站着。</p><p class="story-paragraph">显然他也看见了我，加快脚步向我跑过来。</p><p class="story-paragraph">他越来越近，越来越清晰，我听见了他的喘息和心跳，一下一下都好像与我同频。</p><p class="story-paragraph dialogue">“是真的吗？”在他靠近的那一刻，我闭上眼睛鼓起勇气扔出了这个困扰了我一整天的问题。我要卸下重负了。</p><p class="story-paragraph">他愣了半晌，因为小跑而急促的呼吸落在我身上，像夏季的雨点，溅起一个个泛着热气水花。</p><p class="story-paragraph dialogue">“傻瓜，我喜欢的是你。”</p><p class="story-paragraph">声音忽然就飘进我的耳朵里，轻得像一阵夏夜的风，却足以在我这里掀起滔天的海啸。</p><p class="story-paragraph">眼睛突然就变得模糊，他站在光晕里像一团随时要融化开的水墨，那么近又那么远，一切都显得太不真实。是幻觉吗？我不禁伸手去触碰他，他的衣服，他的皮肤，他的温度。</p><p class="story-paragraph dialogue">“那..那就好好相处吧。”我好像又变成了胡言乱语的傻瓜。</p><p class="story-paragraph">他有些担忧又有些好笑地弯下腰来帮我擦眼泪。</p><p class="story-paragraph dialogue">“怎么哭成这样啊？”</p><p class="story-paragraph dialogue">“我喜欢你啊。”</p><p class="story-paragraph dialogue">“我知道。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“因为我也一样。”</p><p class="story-paragraph">最后一句他凑在我的耳边说。</p><p class="story-paragraph">我也一样深不可测地喜欢你啊。</p></div>

        <header class="chapter-header">
          <span class="chapter-number">06</span>
          <h2 id="heading-chapter-06">只有我不行的恋爱</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">今天的餐桌话题无疑是第一次约会。</p><p class="story-paragraph dialogue">“玩得开心吗？”</p><p class="story-paragraph">话题不知怎么突然就落到了我头上。</p><p class="story-paragraph dialogue">“挺好的。”我笑了笑，将盘里的意面慢慢搅在叉子上。</p><p class="story-paragraph">今天的雨并没有持续太长时间，转晴的天气，闲适的行程，动情的音乐，的确是一次合格约会的组成元素。</p><p class="story-paragraph dialogue">“去了哪里呢？”熙媛表现得很好奇，歪过头来看我。</p><p class="story-paragraph dialogue">“唱片店。”我和斜对面的元彬对视了一眼。</p><p class="story-paragraph dialogue">“啊！我也很喜欢这种地方。”智恩捧场得很迅速。</p><p class="story-paragraph dialogue">“是啊，感觉以后也想要更多地去了解了。”</p><p class="story-paragraph">我说着把视线又转了回来。</p><p class="story-paragraph dialogue">“熙媛去了哪里？”</p><p class="story-paragraph">话锋一转，但并不怎么高明的明知故问，所以在抛出这个问题之后我就立马后悔了。</p><p class="story-paragraph">郑成灿果然转过头来看我，脸上的神情意味不明。</p><p class="story-paragraph dialogue">“我们去了首尔林公园。”熙媛的坦诚更加反衬出我的龃龉。</p><p class="story-paragraph">她的话匣子打开了就开始滔滔不绝。</p><p class="story-paragraph">我听见她讲到两个人撑着伞在公园石道上散步，讲到中午吃到了多么美味的烤肉，讲到互拍了好几张人生拍立得，任谁听来都是一次令人满意且难忘的约会故事。</p><p class="story-paragraph">也是崭新的故事，故事里没有一点我的影子。</p><p class="story-paragraph">她的话语不断地点醒我原来我和成灿已经是过去式。</p><p class="story-paragraph">旧事不再被提起就会变得暗淡，这种自然规律就像太阳沉山，鲜花成泥，诗集老去。我想起在X介绍信里写给他的最后一句，用新的笑容去掩盖旧的泪水吧。当时落笔时只觉得是体面又洒脱的宣誓，却完全没意识到时间的覆盖其实真的就像写下一句话那样轻而易举。</p><p class="story-paragraph">那他...没有和你聊聊过去的事吗？</p><p class="story-paragraph">随着熙媛的话音落下，这个几次都呼之欲出的问题也永久地梗在我的喉咙里了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">饭后的自由时间决定去二楼的露台吹吹风。</p><p class="story-paragraph">节目组在这里布置了很舒服的秋千椅，我随便拿了个抱枕圈在怀里发呆，感受凉爽又潮湿的夜风迎面而来，不知道是不是方才喝了太多酒的缘故，不知不觉间我竟昏昏沉沉地睡了过去。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">再醒来的时候郑成灿就站在了我的旁边。</p><p class="story-paragraph">他逆着光，衣服上晕了一层淡淡的橘黄，明暗交界处，人也显得虚实参半，以至于看见他的第一眼我都以为自己还在梦里。</p><p class="story-paragraph dialogue">“怎么睡在这里了？”</p><p class="story-paragraph">又是这让人讨厌的平淡语气，平淡得好像没有一点情绪的参杂。</p><p class="story-paragraph">有时候我甚至宁愿他能拿出最尖锐的语言，攻击我也好，奚落我也罢，恨也是一种特殊对待，总好过无动于衷。</p><p class="story-paragraph dialogue">“马上就走的。”我避开他的视线，伸手去拿手机，别扭地向他散发无用的怒气。</p><p class="story-paragraph dialogue">“又要逃走吗？”他非常直白地点破我的意图，神情显得有些无奈。</p><p class="story-paragraph dialogue">“留下来又能干什么？”</p><p class="story-paragraph">我大声地质问，情绪的起伏导致太阳穴也突突得胀痛起来。</p><p class="story-paragraph">未免也太霸道了些，剥夺我的心绪，我的理智，如今连我后退的资格也要一并夺走吗？</p><p class="story-paragraph">明明你今天也换乘得很愉快...</p><p class="story-paragraph">委屈的情绪井喷一般，心脏被酸水填满，尽管硬撑着露出倔强的表情，但眼泪还是不争气地流了出来。</p><p class="story-paragraph">空气陷入了诡异的安静。</p><p class="story-paragraph">泪水无声地在脸上肆意横流，五官皱在一起，我感觉自己此刻一定像个尴尬裸露的小丑。真是讨厌啊，讨厌默不作声的郑成灿，讨厌让我流泪的郑成灿，也讨厌被郑成灿轻易左右的自己。</p><p class="story-paragraph">都过去这么久了，我身体里的风筝线还是握在他手里。</p><p class="story-paragraph">泪眼朦胧间我看见他走过来伸出了手。拇指碰触到眼角，突如其来的升温让我一瞬间敏感得几乎就要晕倒。</p><p class="story-paragraph">他几不可闻地叹了一口气，手上的动作轻缓得仿佛时间穿越回了过去。</p><p class="story-paragraph dialogue">“你知道我拿你的眼泪没办法。”</p><p class="story-paragraph">旧的影子仿佛在他身上重叠，但他已经不再是过去的郑成灿了。</p><p class="story-paragraph dialogue">“那就别招惹我啊！”</p><p class="story-paragraph">我哭得更大声了，一面上气不接下气，一面又觉得丢脸得想要马上藏起来。如果不能给流浪的小狗提供持续又充沛的爱，那就最好不要招惹它。我记得这是他曾经告诉我的道理。</p><p class="story-paragraph dialogue">“睡在这里会感冒的。”他轻轻说着，跟日常工作里哄不听话的小孩一样，并用手背在我的额头上试了试温：“今天的温差很大。”</p><p class="story-paragraph">郑成灿总是很关注气温的问题，可能是作为医生的职业病。</p><p class="story-paragraph">和他在一起之前哪怕是深冬我也爱穿着单裤出门，但在一起之后家里就堆满了他买来的毛绒帽子和针织围巾，每一次降温的提醒他甚至能比气象局的公共警告更及时。一起去看光化门广场的圣诞树的时候，哪怕我已经全副武装，他也会把我的两只手都塞进他的大衣口袋里。</p><p class="story-paragraph">我笑他过度反应。他只说感冒了会很难受啊。</p><p class="story-paragraph dialogue">“我不想你太难受。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">相衬之下，分手之后的嘘寒问暖就只能是勾人深陷的泥潭。</p><p class="story-paragraph">我转身要走，喉咙却在这时不通情理地干痒起来，实在忍不住，我偏过头咳嗽了两声。</p><p class="story-paragraph dialogue">“还是着凉了。”郑成灿平静地陈述事实。</p><p class="story-paragraph">铁证如山，我僵立在原地进退两难，症状甚至在短时间内变得越发明显，我只能又皱着眉头咳嗽起来。</p><p class="story-paragraph dialogue">“没带药吧。”</p><p class="story-paragraph">虽然不想承认，但还是诚实地点了点头。</p><p class="story-paragraph">郑成灿正要再说些什么，宋银硕的声音却在二楼的会客厅响起。</p><p class="story-paragraph">几乎是条件反射一般，我迅速后退了两步拉开了彼此的距离。</p><p class="story-paragraph">宋银硕是很懂得保持分寸的人，丝毫没有询问为什么我会和郑成灿单独出现在露天阳台，只是很简洁地告知我们该到楼下的客厅进行今晚的集体环节了。</p><p class="story-paragraph">三个人一起下楼，客厅里大家已经摆好了零食和红酒，我和郑成灿心照不宣地挑了两个分开的位置。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“那现在就开始宣读信件啦！”</p><p class="story-paragraph">今天的主持是民浩，他从信封里拿出薄薄的一张纸。</p><p class="story-paragraph dialogue screen-line">「请公开各位的职业」</p><p class="story-paragraph">这个节目的机制就是像剥洋葱，将每个人一层一层地剥开，最后才能露出底色和真心。</p><p class="story-paragraph">为了保障戏剧性和综艺效果，大家还是一致认同采用先猜测后公开的形式。</p><p class="story-paragraph">挨个进行下来，有让人意料之外的反转，也有让人大呼“果然”的顺理成章。</p><p class="story-paragraph">元彬是独立音乐制作人，知性的宥真是律师，很会做饭的银硕经营着一家餐厅，智恩是模特，熙媛是英语讲师，而一看就体格健硕的民浩是运动教练。</p><p class="story-paragraph">我的职业在这中间显得平平无奇，所以没等大家过多地猜测，我就很自觉地公开了身份。</p><p class="story-paragraph dialogue">“营销公司的普通职员罢了。”</p><p class="story-paragraph dialogue">“哪有，工作应该也会很有趣吧。”熙媛笑着拍了拍我的肩膀。我自以为的假想敌却总是给我最热情的反馈，我有一些惭愧。</p><p class="story-paragraph">轮到郑成灿大家又开始各抒己见。</p><p class="story-paragraph">有猜体育生的，也有猜金融工作者的。</p><p class="story-paragraph dialogue">“该不会，是医生吧。”律师的观察力果然还是很厉害，宥真第一个猜到了正确答案。</p><p class="story-paragraph">郑成灿笑着点了点头：“是，儿科医生。”</p><p class="story-paragraph">众人十分配合得惊呼起来。</p><p class="story-paragraph dialogue">“我还以为你和我同行。”民浩打趣道：“身体锻炼得也很好啊。”</p><p class="story-paragraph dialogue">“难怪整个人看起来都很温和。”智恩将郑成灿上下一番打量：“不过医生的话工作感觉会很辛苦诶。”</p><p class="story-paragraph">确实很辛苦。</p><p class="story-paragraph">这个问题我在心里替他做了回答。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">一周前的采访其实也问到了关于X职业的问题。</p><p class="story-paragraph dialogue">“怎么说呢。”我将垂下来的碎发重新别到耳后。</p><p class="story-paragraph dialogue">“有时候我们的确会像两条平行线。”</p><p class="story-paragraph">医学院的学习和工作一旦密集起来，我和郑成灿就有了时差。每次在kkt发完晚安后，他还得继续在实验室和图书馆奔波，这些虽然他从来不会告诉我，但我也心知肚明。</p><p class="story-paragraph">有好几个睡不着的夜晚，我小心翼翼地发过去视频邀请都能很快被接通。屏幕那边他的房间还灯火通明着，他摘下眼镜一边揉眉心一边问我怎么还没睡。</p><p class="story-paragraph dialogue">“你不也还没睡吗？”我缩在被子里嘟嘟囔囔：“我要陪你。”</p><p class="story-paragraph">他哑然失笑，但面上的疲惫掩不住，嘴角的弧度有些牵强。</p><p class="story-paragraph dialogue">“快睡吧。”温柔的语气是他惯用的哄人手段。</p><p class="story-paragraph dialogue">“那你什么时候睡呢？”</p><p class="story-paragraph">不知道什么原因，失眠的时候被他哄上两句比吃多少片褪黑素都有效。</p><p class="story-paragraph">睡意很快就如潮水般袭来，我缓慢地眨了眨眼。</p><p class="story-paragraph dialogue">“马上睡了，你快睡吧。”</p><p class="story-paragraph">他嘴上应着，但我清楚地知道他是个凡事都要争上游的笨蛋，他做任何事情都做得很认真。</p><p class="story-paragraph dialogue">“认真的人会比别人更辛苦些。”我对着摄像机后面的编剧老师说。</p><p class="story-paragraph">唯一一次因为熬夜的事情对他生气是在毕业季的夏天。</p><p class="story-paragraph">那天刚经历完身心俱疲的面试，返回学校的路上正好看到有卖鲷鱼烧的小摊。红豆麻薯味道是郑成灿喜欢的味道，于是我买了满满一袋决定去找他。</p><p class="story-paragraph">出于制造惊喜的目的，我并没有提前通过kkt告知，一路走到实验楼下撞见了他的同学。</p><p class="story-paragraph dialogue">“来找成灿吗？”</p><p class="story-paragraph dialogue">“嗯。”</p><p class="story-paragraph dialogue">“不太巧，他去医务室了。”</p><p class="story-paragraph dialogue">“发生..什么事了吗？”</p><p class="story-paragraph">一时间没能将这个信息消化，我竟有些犯结巴。</p><p class="story-paragraph dialogue">“受伤了吧，听说。”</p><p class="story-paragraph">耳朵里猛地一阵响起轰鸣，后面他还说了一些话，但我已经完全听不见了。</p><p class="story-paragraph">数天未见的想念，工作不顺的委屈，未知情况的恐惧，桩桩件件都在顷刻间化作巨石重重击向我的胸口，眼泪争先恐后地想要流出来却全堵在了眼眶里，胃里翻江倒海，我开始止不住地发抖。</p><p class="story-paragraph">直到听见郑成灿叫我的名字，我才得以从这片吃人的情绪沼泽中脱身。</p><p class="story-paragraph">他从走廊的尽头快步向我走过来，空间把他的脚步声放大。</p><p class="story-paragraph">我的眼睛哭肿了，只能隔着一层朦胧的水雾去看他。</p><p class="story-paragraph">人生总有那几个瞬间会被定格成永久。那么这一刻我想应该就是其中之一。</p><p class="story-paragraph">像电影里套上了黑柔滤镜的升格画面，他越过一道道从窗户倾斜投下的光柱向我走来，光线里细密的尘埃翻滚腾跃。</p><p class="story-paragraph">这冗长得仿佛无底洞一般的走廊就像我晦暗难捱的人生，他是其中的唯一亮色。他怎么不是我的太阳呢？他甚至可以做这一瞬的神明。</p><p class="story-paragraph">郑成灿第二次叫我名字的时候我的眼睛又开始下雨。</p><p class="story-paragraph">在他完全走近的那一刻，我狠狠扑进了他的怀里，就好像在海上漂流了三天三夜的人抱住了唯一的救命稻草。</p><p class="story-paragraph dialogue">“你怎么来了？”他的声音包裹着我，一只手轻轻揉着我的头发。</p><p class="story-paragraph">我的力气被抽空了没法回答，他便也不再说话，就这样安静地抱着我听我足足哭了十分钟。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">平复下来之后我开始在他身上一阵乱摸。</p><p class="story-paragraph dialogue">“找什么？”他有点好笑。</p><p class="story-paragraph dialogue">“伤哪里了？”我有意压低了音调，并摆出非常严肃的表情。</p><p class="story-paragraph dialogue">“啊...”他抿了抿嘴巴，有些心虚地眨了眨眼，随即将左腿的裤腿慢慢卷起来。</p><p class="story-paragraph dialogue">“足球场上很常见的小伤，不碍事的。”</p><p class="story-paragraph dialogue">“都缠绷带了还叫小伤！”</p><p class="story-paragraph dialogue">“昨天不是又很晚才睡吗？熬完大夜为什么还要去踢足球？你不是总说考试周没时间吗？”我不知道自己居然有这样好的口才，一连串说下来竟堵得郑成灿一个字都插不进来。</p><p class="story-paragraph dialogue">“是买了鲷鱼烧吗？”自知理亏，他开始顾左右而言他。</p><p class="story-paragraph">我被他说得愣了半秒才拿起一旁的袋子查看，可惜密闭太久了里面全是水汽。</p><p class="story-paragraph dialogue">“都凉了！”我再度振声道。</p><p class="story-paragraph dialogue">“去吃好吃的吧。”郑成灿忽然就蹲到了我面前，用手扶住我的膝盖。</p><p class="story-paragraph">太坏了！我在心里嚷嚷起来。</p><p class="story-paragraph">他完全就是清楚自己的优势所在，又圆又亮的小鹿眼就这样看着我，温柔的春水在其间流动，俨然一只示弱又期待的小动物。</p><p class="story-paragraph dialogue">“那我要吃蘑菇！”我还不想就这样败下阵来，于是装出一副依旧在生气的样子，挑了他最不喜欢的食物做报复。</p><p class="story-paragraph dialogue">“吃什么都可以。”他歪着头回答我，面上的笑容像风一样挠得我心里痒痒的。</p><p class="story-paragraph">我不再说话了。</p><p class="story-paragraph">只是感觉自己又中了他的圈套，明明我还有好多教训的话都没有说完。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">胡思乱想着，客厅内其他人的谈笑声都虚化成了没有字句的背景音。</p><p class="story-paragraph">但视线还是不自觉地飘向了回忆的主人公，郑成灿在笑着，在拍手，在说些什么。</p><p class="story-paragraph">游刃有余的社交模样，看起来完全不会有像我这样不断陷进过去的情况。</p><p class="story-paragraph">他是有意回避还是真的已经完全忘记，我不知道应该在什么样的场景下才能有机会问出这些问题，更何况问出去以后呢？</p><p class="story-paragraph">人也不能总在过去的瞬间里找永恒。</p><p class="story-paragraph">或许郑成灿这样才是对的。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">大家的手机陆陆续续响起提示音，又到了发心动短信的时间。</p><p class="story-paragraph">我依旧把短信发给了元彬，感谢他今天的约会照顾。</p><p class="story-paragraph">消息栏里也很快又躺进来了两条消息，没报任何希望地点开。</p><p class="story-paragraph dialogue">“今天辛苦了。”</p><p class="story-paragraph dialogue">“你的X没有选择你。”</p><p class="story-paragraph">这句话太熟悉了，已经完全没有当初的杀伤力了，再锋利的刀用过几次以后也会变钝的。</p><p class="story-paragraph">与之对应的，再深的伤口过得久了也会结痂。</p><p class="story-paragraph">郑成灿起身说要先去洗漱。我有气无力地瞟了他一眼，但他没有看我。在这里的几天里，我看了太多他的背影。</p><p class="story-paragraph">和剩下的几个人将客厅的垃圾都收拾干净后，我慢慢地踱上去二楼的台阶，今天在露台睡着的那段时间确实还是让我有些感冒了，头变得昏昏沉沉，重得我只能驮起身子。</p><p class="story-paragraph">同住的智恩还没上来，我一个人在漆黑房间里胡乱地摸了好一阵灯的开关。陡然间袭来的亮光让我不得不抬手挡住了眼睛。</p><p class="story-paragraph">缓了好一阵才完全适应，视线再聚焦时，我才看见进门处的桌子上放了一只方方正正的药盒。</p><p class="story-paragraph">这只盒子我再熟悉不过了，是郑成灿买的。</p><p class="story-paragraph">曾经被他装满了各种常用药，用来应付我的小毛小病。</p><p class="story-paragraph">这只盒子怎么会出现在这里？我忍着头部的眩晕将它拿起来，底部忽然有小纸条飘落下来，正正落在我的手心里。</p><p class="story-paragraph dialogue screen-line">「记得吃药」</p><p class="story-paragraph">不知道是从哪里撕下来的一点边角，字迹看起来也写得急促。</p><p class="story-paragraph">我有些吃力地将盒子打开，里面整整齐齐地码着各种散装的冲剂，都是很新鲜的日期。</p><p class="story-paragraph">我感觉自己的大脑越来越晕，几乎要扶住墙壁才可以站稳。</p><p class="story-paragraph dialogue">“怎么了？”智恩在这时候回来了，很及时地搀住了我的一只胳膊。</p><p class="story-paragraph dialogue">“没事。”我边说边咳嗽了两声。</p><p class="story-paragraph dialogue">“感冒了吗？”智恩非常眼尖地捕捉到了我手里的药盒：“我帮你拿下去冲吧。”</p><p class="story-paragraph">我无力地点了点头，不知道为什么病症突然就加重成这样。</p><p class="story-paragraph dialogue">“怎么还哭了。”智恩突然小声地惊呼起来，我这才发现眼睛又变得潮湿了。</p><p class="story-paragraph dialogue">“没事。”我摆了摆手，并请她帮我把药拿下去。</p><p class="story-paragraph">智恩出去的时候顺手关上了门。</p><p class="story-paragraph">在完全合上的最后一刻，我透过缝隙看了一眼对面男生房间的门。</p><p class="story-paragraph">房门紧闭着，像缄默不言的心事。</p></div>

          <h2 id="heading-chapter-07">Love Me Like That（上）</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">托感冒的福，混混沌沌的状态下我竟然难得拥有了一次长睡眠。</p><p class="story-paragraph">完全清醒过来的时候，阳光已经把窗帘照得透亮了，隐约可以看见最外一层纱幔的花纹走势，茸茸地仿佛还在继续生长。</p><p class="story-paragraph">打开手机确认时间才惊觉居然一觉睡到了11点。</p><p class="story-paragraph">换好衣服出门，整个二楼都静悄悄的，今天真的是很好的天气，小会客厅被照得亮堂堂，墙面上投射有各式的几何光斑，像某种独特的拼贴美学。</p><p class="story-paragraph">我轻轻地挪着步子，但走到郑成灿的房门前脚步还是诚实地停下来了。</p><p class="story-paragraph">说不清楚停下来的目的，昨晚的药盒的确可以算是一把钥匙，不安导致的揣测却是无穷尽的门。</p><p class="story-paragraph">我的手举起又放下，底气累积又坍塌，感觉自己变成了一根在雨中不断燃起又熄灭的火把。</p><p class="story-paragraph">或许应该表示一下感谢？但是仅仅止步于感谢吗？可除了感谢之外以我们现在的关系我又能多说什么呢？我又在期待什么呢？</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">总该知道被爱的人才有资格期待。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“找谁？”</p><p class="story-paragraph">正在独自踌躇着，忽然听见了熟悉的声音。</p><p class="story-paragraph">转头看见郑成灿的那一刻我真的下意识里相信了命运自有安排。</p><p class="story-paragraph">他是一身运动的装束，刘海被汗浸湿了，黑色的背心贴在身上，显出好看的肌肉线条走势。他用圆润又明亮的眼睛看着我，感觉方才一路回来沐浴的阳光都还停留在里面。</p><p class="story-paragraph">我的身体大概是在一瞬间长出了一只钟表，但滴滴答答数的不是时间，是心跳的节奏。</p><p class="story-paragraph dialogue">“找你。”</p><p class="story-paragraph">完全是盯着他的眼睛就脱口而出了这句话。</p><p class="story-paragraph">郑成灿说过我坦诚起来能透明得让人一眼看穿，在一些本能占领大脑的短暂时刻。</p><p class="story-paragraph dialogue">“找我吗？”</p><p class="story-paragraph">郑成灿笑着摇了摇头，走到我身前打开房门进屋，我也顺势跟着他走了进去，这个陌生的，隐蔽的，属于他的空间。</p><p class="story-paragraph">算是一种允许吗？我望着他的后脑勺在心里无声地发问。</p><p class="story-paragraph dialogue">“好些了吗？”</p><p class="story-paragraph">关上门后郑成灿主动抛出了话题，他说着话将左腕的手表取下来，接触到桌面的一刻发出清晰又干脆的声响，和他一样不拖泥带水。</p><p class="story-paragraph dialogue">“好很多了。”</p><p class="story-paragraph">我点了点头，这样的相处情势还是有些陌生了，我的手指拧在一起，并小退了两步到更靠近门的位置，人一胆小就会不自觉地往角落里去。</p><p class="story-paragraph dialogue">“昨天的药盒...”</p><p class="story-paragraph">我们的声音忽然重叠在一起，却又很快同时戛然而止了。</p><p class="story-paragraph dialogue">“谢谢。”</p><p class="story-paragraph">捕捉到他沉默的缝隙，我飞速丢出了自己的目的，然后马上又像蜗牛一样缩回壳里，安静地等待下一瞬间的判决。</p><p class="story-paragraph dialogue">“我们是需要说谢谢的关系了吗？”</p><p class="story-paragraph">屋内沉寂了好一会郑成灿才接了我的话。</p><p class="story-paragraph">但他的问句带着开玩笑的语气，所以无心还是有意，我完全分不明晰。</p><p class="story-paragraph dialogue">“那我们是什么关系？”</p><p class="story-paragraph">我用同样的语气回敬他，但我知道我的玩笑是只是包装。</p><p class="story-paragraph">可是包装和内容不太匹配的时候，人就容易变得骑虎难下。</p><p class="story-paragraph">所以话音消散后，空气果不其然就冻住了。</p><p class="story-paragraph">从分手之后互相没有打过一次电话也没有发过一条信息就可以看出，沉默是我们的另一种默契。</p><p class="story-paragraph">明明眼泪越来越多，但话却越来越少。</p><p class="story-paragraph">完全南辕北辙的拉扯。</p><p class="story-paragraph">作为旁观者时我们总是标榜自己理性又清醒，可一旦成为局中之人，就都无一幸免地变成了哑巴，变成了不幸福又死命倔犟的傻瓜，变成了企图用痛觉来辨别爱意的悖论家。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">直到敲门声打破了僵局，熙媛的声音从门外传来。</p><p class="story-paragraph dialogue">“成灿xi，在吗？”</p><p class="story-paragraph">像突然被人抓住尾巴一般，一股电流从头通到脚。这并不是一个让人发现我和郑成灿X关系的正确节点。方才的尴尬瞬间抛诸脑后，我赶忙缩到墙角，用眼神向郑成灿求助。</p><p class="story-paragraph">他看了我一眼，嘴角反而浮起了一点点笑意。</p><p class="story-paragraph dialogue">“在的。”</p><p class="story-paragraph">上扬的尾音听着竟像邀请？</p><p class="story-paragraph dialogue">“那我可以进来吗？”</p><p class="story-paragraph">听见熙媛的手放到门把上的声音，我的慌乱指数直线上线，开始拼命地冲郑成灿摇头，并紧急物色起可行的藏身之处。</p><p class="story-paragraph dialogue">“我换好衣服马上就下来。”</p><p class="story-paragraph">他又看了我一眼，才慢悠悠地将话音一转。</p><p class="story-paragraph dialogue">“哦，这样啊。”所幸熙媛没再追究：“那我们在厨房等你。”</p><p class="story-paragraph">我听见了她转身离开的脚步声。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">等到外面完全没了动静，我才长长地舒了一口气。</p><p class="story-paragraph">郑成灿倒是显得悠然自得。</p><p class="story-paragraph dialogue">“干嘛又吓我！”心脏还在怦怦乱跳：“万一被发现了怎么办！”</p><p class="story-paragraph dialogue">“发现什么？”</p><p class="story-paragraph dialogue">“发现我们的关系啊！”</p><p class="story-paragraph dialogue">“我们是什么关系？”</p><p class="story-paragraph">明明是由我先提出的问题，这下却又被郑成灿拿来反问我，我一时间被堵得哑口无言。</p><p class="story-paragraph">不是敞亮的朋友，也不是体面的爱人，我们是什么关系...</p><p class="story-paragraph">你希望是什么关系？心里想这样问来着，但表面上看来还只是静默地站着。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“等会下来吃午饭吧。”</p><p class="story-paragraph">他倒也不想再继续为难我，很快就岔开了话题。</p><p class="story-paragraph dialogue">“午饭吃什么？”</p><p class="story-paragraph dialogue">“会有粥，生病了还是先吃点好消化的东西。”</p><p class="story-paragraph dialogue">“谁做？”</p><p class="story-paragraph dialogue">“我做啊。”</p><p class="story-paragraph">他说着竟有些无奈地笑起来。</p><p class="story-paragraph dialogue">“除了我还有人清楚你生病后的口味吗？”</p><p class="story-paragraph">我又不说话了。</p><p class="story-paragraph">但这一刻的空气从冻河变成了起伏的浪。</p><p class="story-paragraph">我从来都不觉得自己是个有个性的人，至少在遇见郑成灿之前。如果把自己比作一本书的话，我认为也只会有通篇的空白页。</p><p class="story-paragraph">是他出现以后，才慢慢填上了一些内容。我爱上看二号线的夕阳是因为他曾带我去看，我喜欢小狗是因为他很喜欢，我音乐软件里的歌单有一大半来自他的推荐，就连生病后喝粥的口味其实也是他培养出的习惯。</p><p class="story-paragraph">所以郑成灿说得没有错，确实没有人比他更清楚我了。</p><p class="story-paragraph">甚至说得更极端一点，现有的我有一部分完全是他的，是他塑造的。</p><p class="story-paragraph">郑成灿转过身去柜里取毛巾，对于我继续赖在原地的行为不置可否，我就干脆望着他翻找的背影发呆。</p><p class="story-paragraph">有那么一瞬间我竟然感觉我们又变成了普普通通的情侣。</p><p class="story-paragraph">没有遍布的摄像机，没有设限的录制规则，我们也从来没有分开过。</p><p class="story-paragraph">只是一起呆在一间暖暖的小屋子里，在彼此触手可及的地方真真切切地存在着。</p><p class="story-paragraph">这种时候哪怕一言不发都是好的。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">午饭时间，除了一些正常菜式，郑成灿确实额外准备了满满一大份营养粥，完全是我曾经生病后最爱吃的那家粥店的做法。</p><p class="story-paragraph">大概也是分开后的那段时间里学会的吧。</p><p class="story-paragraph">今天郑成灿就坐在我的对面，所以当我的目光一落到他身上时，他也很快转过头来看我。</p><p class="story-paragraph dialogue">“怎么样？”</p><p class="story-paragraph">他大方地和我对视着询问我的意见，看起来没有一丝破绽。</p><p class="story-paragraph dialogue">“好吃的。”</p><p class="story-paragraph">我反而显得匆忙，演技依旧是让人苦手的事。甚至一低头粥里的热气还立马升腾起来，在眼底结成了一层薄雾。</p><p class="story-paragraph">智恩也在这时碰了碰我的胳膊，关心起我的身体状况，众人的话题迅速转移过来。</p><p class="story-paragraph dialogue">“怎么感冒了呀？”</p><p class="story-paragraph dialogue">“最近的温度确实变化不定。”</p><p class="story-paragraph dialogue">“那还好今天做了粥。”</p><p class="story-paragraph dialogue">“是啊，好巧。”</p><p class="story-paragraph">我低着头轻轻附和。</p><p class="story-paragraph">但其实不是巧合呀，是秘密...</p><p class="story-paragraph">是我和郑成灿的秘密。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">饭后没多久就集体收到了节目组发来的新讯息。</p><p class="story-paragraph dialogue screen-line">「请前往多人对话室」</p><p class="story-paragraph">这是一个将每个人的声音都进行特殊处理后的语音对话环节，但比打字聊天更直白些。毕竟下意识的停顿和语气都骗不了人。</p><p class="story-paragraph">男生和女生是分开的，我在工作人员的指引下进了自己的小房间。</p><p class="story-paragraph">简单的试过音后，不知道是谁非常果断地抛出了第一个问题。</p><p class="story-paragraph dialogue screen-line">「或许对X还有心意吗？」</p><p class="story-paragraph dialogue">“我不太清楚。”</p><p class="story-paragraph dialogue">“..有吧。”</p><p class="story-paragraph dialogue">“我也...”我跟随着上一个声音答道。</p><p class="story-paragraph dialogue screen-line">「昨天的约会有让心意出现变动吗？」</p><p class="story-paragraph dialogue">“没有。”</p><p class="story-paragraph dialogue">“说实话，我有。”</p><p class="story-paragraph">那个声音说完兀自笑了起来。</p><p class="story-paragraph">是熙媛吗？我后知后觉地被自己的无端揣测吓了一跳。</p><p class="story-paragraph dialogue screen-line">「大家有收到过X的短信吗？」</p><p class="story-paragraph dialogue">“...有。”</p><p class="story-paragraph dialogue">“没有。”</p><p class="story-paragraph dialogue">“我也...”</p><p class="story-paragraph">我好像变成了一个纯粹的附和者，刻意在逃避一些直白的正面陈辞。</p><p class="story-paragraph dialogue screen-line">「或许有人收到过银硕的短信吗？」</p><p class="story-paragraph">这个问题应该是来自宋银硕的X，调整后的声线是可爱细软的，但问题本身却是勇敢直进的。</p><p class="story-paragraph">我不禁倒吸了一口气，抿了抿嘴巴：“没有诶。”</p><p class="story-paragraph dialogue">“我也没有。”</p><p class="story-paragraph dialogue">“我有收到过。”</p><p class="story-paragraph">这个声音很干脆，落在空气里像一记短炮。</p><p class="story-paragraph">气氛陡然变得诡谲起来。</p><p class="story-paragraph">虽然其实我们都很清楚，换乘的节目设定就是这样，搬出平日生活里不常有的戏剧化情节，强效且高频地去刺激人的本能。</p><p class="story-paragraph">爱也好，恨也罢，都要无限放大。</p><p class="story-paragraph">有的人因此沐浴爱河，但也有人因此异化出偏执。</p><p class="story-paragraph">一轮对话结束后，大家重聚在客厅，各自都心照不宣地没有提及方才在对话室里发生的事情，但言语往来间也还是暗藏了些许试探。</p><p class="story-paragraph">在这里深受困扰的人原来远不止我一个。</p><p class="story-paragraph">男生们回来得更晚一些，元彬是最后一个进来的，带着门口信箱里取到的信封。</p><p class="story-paragraph dialogue screen-line">「请迎接新的入住者。」</p><p class="story-paragraph">信封里的内容是这样写的，在宣读的话音刚落下的时候，门铃非常及时地响起来了。</p><p class="story-paragraph">我随着众人一同去门口迎接，来者是一男一女。为了表示对新嘉宾的欢迎，节目组也很贴心地帮忙点好了今天的晚餐，来自一家还不错的西餐厅。</p><p class="story-paragraph">男生们纷纷帮忙把披萨和各种小食拿到客厅里，女生们已经开始了寒暄。</p><p class="story-paragraph dialogue">“全雅贤？”</p><p class="story-paragraph dialogue">“对。”</p><p class="story-paragraph">熙媛显得格外热情，社交向来都是她的主场。新来的嘉宾看起来风格更偏向成熟的类型，穿着淡蓝色的绸缎裙子，灯光打上去感觉有粼粼的水光。</p><p class="story-paragraph">男嘉宾叫朴允在，这则是我在偷听郑成灿讲话的时候听到的。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">吃食摆放完毕，大家纷纷围坐到茶几边。</p><p class="story-paragraph">熙媛提议今天晚上边吃边玩游戏。</p><p class="story-paragraph dialogue">“酒桌就是要配游戏的呀！”</p><p class="story-paragraph">因为新人的加入，大家的情绪都十分高涨，民浩甚至在听到要玩游戏之后直接从地上一跃而起去厨房又多拿了两瓶酒过来。</p><p class="story-paragraph">选定了非常简单的折手指游戏，答案只有是与否，是的话就弯曲一只手指。</p><p class="story-paragraph">随机提问正式开始，大家反而一致沉默了下来，面面相觑了片刻，宋银硕忽然笑道：“既然都不说的话，那我先问吧。”</p><p class="story-paragraph dialogue screen-line">「来这里之后对X的心意变大了」</p><p class="story-paragraph">第一个问题一出，众人纷纷惊呼起来，笑着抱怨才刚开始就这么严峻，两位新人更是捂住了嘴巴。</p><p class="story-paragraph">反观问题的提出者反而表现得最轻松，宋银硕憋着笑意开始倒数，数到1的时候非常干脆地弯下了一根手指。</p><p class="story-paragraph dialogue">“什么嘛！大家也都折了一根。”熙媛很快就扫视了一圈。</p><p class="story-paragraph">我这才敢去看郑成灿的手指，虽然只是轻微的弯曲幅度，但他右手的大拇指确实弯折起来了。</p><p class="story-paragraph">让人胡思乱想的游戏，我忽然感觉身体里面好像有棵扭曲的藤蔓在生长，一边结了甜果，另一边却依旧结出成堆的酸果。</p><p class="story-paragraph">所以是真的心意出现了变化，还只是应付游戏，甚至说是在众人面前保留一份对X的体面而已？有时候答案太过明显地呈现在眼前反而让人退缩。</p><p class="story-paragraph">因为像郑成灿这样心软的人，如果他可怜我，他一样会对我施舍一点点好。</p><p class="story-paragraph">但这样的可怜和可怜本身才是真正矛盾的因果。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue screen-line">「这里除了我之外还有X的理想型」</p><p class="story-paragraph">智恩很快接上了第二个问题。</p><p class="story-paragraph">这一次我依然很快弯下了手指，郑成灿也是。</p><p class="story-paragraph">在我偷看他的答案的时候，我们的目光毫无征兆地撞在了一起，他的眼底闪过了一丝不易察觉的震动。</p><p class="story-paragraph">在我来看，这里确实有比我更适合他的女孩。比如熙媛，她比我开朗比我漂亮。比如智恩，她比我温柔比我善良。比如宥真，她比我聪明比我冷静。再比如刚刚才来的雅贤，她也是充满了神秘的吸引力。</p><p class="story-paragraph">可是我呢？我的秘密，我的谎言，我的缺点，郑成灿已经尽数悉知了，这样的我几乎都快要成为他理想型的反义词集合。</p><p class="story-paragraph">那郑成灿认为的我的理想型又是谁呢？</p><p class="story-paragraph">我的目光飘向这几天来接触最多的元彬。</p><p class="story-paragraph">如果选择除X之外的人的话，我最大概率会选元彬，我猜郑成灿可能也是这样想的。</p><p class="story-paragraph">他很清楚地知道我喜欢眼睛好看的人，喜欢脾气温和的人，喜欢想法独立但又乐于包容的人。</p><p class="story-paragraph">但他不知道的是，这些精准的形容其实也有来处。</p><p class="story-paragraph">他不知道万物都有惯性，喜欢也会定型。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue screen-line">「比起初恋，我更想成为最后的恋人」</p><p class="story-paragraph">这个问题是民浩提出来的，他解释说因为最近有一部以初恋的遗憾为题材的电影上映，所以这也是社交论坛上新晋的热门话题。</p><p class="story-paragraph">这个问题我没有弯下手指，因为我讨厌遗憾，我讨厌一切迫不得已，被迫放弃，爱而不得，尽管这样的讨厌在真实的生活规律面前显得着实无力。</p><p class="story-paragraph">可郑成灿的答案这次与我相反，我瞟见他没有犹豫地折下了第三根手指。</p><p class="story-paragraph dialogue">“成灿xi，为什么？”一直没有说话的雅贤突然发问。</p><p class="story-paragraph dialogue">“因为初恋往往很悲伤啊。”</p><p class="story-paragraph dialogue">“人为什么要选择悲伤呀。”</p><p class="story-paragraph">俏皮又礼貌的答案，惹得大家都笑起来。</p><p class="story-paragraph">人为什么要选择悲伤呀。</p><p class="story-paragraph">旁人都一笑带过，但我却没办法轻易放过这句话，紧绷的神经网将它一遍遍过筛。</p><p class="story-paragraph">思绪也就又在众人的谈笑声中不知不觉飘远。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue screen-line">「所以和X都是彼此的初恋对吗？」</p><p class="story-paragraph dialogue">“是的。”我思索了片刻，抬起头笑着面向镜头答道。</p><p class="story-paragraph dialogue">“老实说，第一次听说的时候，我也很难相信他那样的人居然从没谈过恋爱。”</p><p class="story-paragraph">毕竟他那样的人，从始至终在我看来都值得被偏爱。</p><p class="story-paragraph">记得是在汉江边的那个傍晚。</p><p class="story-paragraph">黄昏的光晕笼罩着江面，江风悠悠地吹，草虫的鸣叫中偶尔穿插一两声清脆的自行车铃，昼与夜的交接时刻，世界显得生动又充盈。</p><p class="story-paragraph">我和郑成灿买了两瓶烧酒来江边吃泡面。</p><p class="story-paragraph dialogue">“听说晚上这里的人会更多一些。”我环顾着四周。</p><p class="story-paragraph dialogue">“会有很多大学情侣吧。”</p><p class="story-paragraph dialogue">“这么笃定吗？不会之前也和别的女孩子来过吧。”</p><p class="story-paragraph">我佯装生气着去看郑成灿的反应，他却直接放下了筷子，非常认真地看着我。</p><p class="story-paragraph dialogue">“怎么突然认真啊？”我有些堂皇。</p><p class="story-paragraph dialogue">“怒那是第一个啊。”郑成灿皱了皱眉头，倒显得委屈。</p><p class="story-paragraph dialogue">“该不会...”我眯缝起眼打量他。</p><p class="story-paragraph dialogue">“是初恋啊。”</p><p class="story-paragraph">郑成灿很快接过我的话头，</p><p class="story-paragraph dialogue">“怒那是第一个啊。”他又重复了一遍。说话的时候额发被风吹起又轻飘飘地落下，像微微振翅的蝴蝶。</p><p class="story-paragraph">夜色沉坠，江边的灯陆陆续续亮了起来，灯光映到他眼里的时候，蝴蝶也飞进了我心里。</p><p class="story-paragraph dialogue">“可我不是哦。”</p><p class="story-paragraph">回过神来后还是忍不住想要逗他，没有人会不喜欢逗毛发蓬松的小狗。</p><p class="story-paragraph">于是我索性把面推到一边，右手撑住头开始随口扯谎：“可我不是新手哦。”</p><p class="story-paragraph dialogue">“是吗...”</p><p class="story-paragraph">郑成灿低下头去若有所思。</p><p class="story-paragraph">我看着他头顶的发旋忍不住偷笑。</p><p class="story-paragraph">但他很快就又抬起头来。</p><p class="story-paragraph dialogue">“那以后都会是我吧。”</p><p class="story-paragraph dialogue">“诶？”</p><p class="story-paragraph dialogue">“以后都是我吧，怒那。”</p><p class="story-paragraph">我怀疑那一刻他瞳孔里晃动的不是灯影，是酿了几个世纪的酒精。</p><p class="story-paragraph">不然明明烧酒都还没喝两口，我怎么就感觉有些醉了。</p><p class="story-paragraph">目光顺势移游到了他的嘴唇上，健康的血色在我眼里却成了伊甸园里勾引着人的苹果红。</p><p class="story-paragraph dialogue">“那你会接吻吗？”</p><p class="story-paragraph">我就这样说出来了，一句彻头彻尾的疯话。</p><p class="story-paragraph">这次换他不说话了，看了我许久，忽然起身换到我身旁的座位。</p><p class="story-paragraph dialogue">“这次就会了。”</p><p class="story-paragraph">还没听清楚他的尾音，他的嘴唇就轻轻地贴了上来，小心翼翼但又带着一点点野心和怒气。身为始作俑者的我却瞬间不敢呼吸了，他近在咫尺的睫毛惹得我浑身止不住地一阵轻颤。</p><p class="story-paragraph">原来我才是被狩猎的那只小兽。</p><p class="story-paragraph">书里把初吻的感觉写成是地铁开进站时呼啸的那一阵风，写成是汽水里升起又破裂的那一串气泡，写成羽毛，写成蝴蝶的翅膀。但我觉得都不是，哪有那样轻描淡写。</p><p class="story-paragraph">能和自己喜欢的人接吻，是一场神迹。</p><p class="story-paragraph">突然间就想到了十八岁成年的那个夜晚，爸爸给我放了一束小小的烟花，天空短暂地亮了一小片，不是什么绚烂的烟花，但却是只属于我的烟花。</p><p class="story-paragraph">郑成灿的手不知道什么时候就扶上了我的头发，鼻息间全是他衣服上的皂角味道。</p><p class="story-paragraph">都是第一次接吻，我真没想到自己竟然会是哭得稀里哗啦的那个。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">稚嫩的初恋情侣，一起做爱情的虔诚学徒。</p><p class="story-paragraph">从那以后我们还共享了无数个第一次，第一次相拥而眠的夜晚，第一次坦诚吐露的心声，第一次相顾无言的落泪。太多太多的第一次组成了我们共同的三年。</p><p class="story-paragraph">所以我对于郑成灿的感谢其实远不止我在X介绍信里写出来的那么多。</p><p class="story-paragraph">教会人如何去爱，无论何时都是一件特别伟大的事。</p></div>
        <nav class="chapter-pager" aria-label="章节翻页"><button type="button" data-target="chapter-06"><span>‹ 上一章</span><strong>只有我不行的恋爱</strong></button><button type="button" data-target="chapter-08" class="next"><span>下一章 ›</span><strong>Love Me Like That（下）</strong></button></nav>
