          <h2 id="heading-chapter-13">如果还有再见的话</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">公开X后的第一天，大家似乎都适应得挺快，甚至偶尔还能互相开一开关于X的玩笑。</p><p class="story-paragraph">今天白天没有特别的行程安排，我在房间和公司对接完最新的方案初稿后，从智恩口中得知今晚将会有烤肉派对。昨晚影片播放结束后加入了最后两位新嘉宾，这场聚会估计也是出于快速破冰的考虑。</p><p class="story-paragraph">民宿后面有很大一块草坪空地，聚餐的地点就是设在这里。</p><p class="story-paragraph">济州岛入夜后的气温要比首尔明显低很多，新鲜的肉香混杂在清爽的晚风里，燃烧的木柴时而发出噼啪脆响，酒精在这时成了一种唾手可得的催化剂，众人的情绪很快就高涨起来。</p><p class="story-paragraph">没听清楚是谁提了一嘴想做真心话的游戏，几个人一拍即合，熙媛便率先向元彬发出了提问。</p><p class="story-paragraph dialogue">“你的心意已经确定了吗？”</p><p class="story-paragraph">第一个问题就如同惊雷一般炸出呼声一片，被提问者反而表现得最为淡然。</p><p class="story-paragraph">元彬提了提嘴角说：“是的，已经确定了。”</p><p class="story-paragraph">并不敢认定他转移的目光就一定和这句话存在关联，但的确是在这之后我们忽然对上了视线。元彬就坐在我的斜对角，来济州岛以后除了在厨房几次短暂的会面，我们还没怎么正式交流过。</p><p class="story-paragraph">熙媛若有所思地点了点头，释然一笑后示意提问的权力交到了元彬的手里。</p><p class="story-paragraph">在元彬将问题抛给我之前其实我就隐隐有些预感，不过他并没有刻意刁难我，只是用温和的嗓音问我现在还和刚来节目时候的心情差不多吗？</p><p class="story-paragraph dialogue">“有些不一样了。”</p><p class="story-paragraph dialogue">“在这里左右心情的因素太多了。”我看着他的眼睛尽量回答得诚恳。</p><p class="story-paragraph">这下众人的注意力全部集中到了我这里，我摇摇头以还没想好为由把下一个提问的机会让了出去。</p><p class="story-paragraph">其实还是有很多想要问的，想问郑成灿。可不太外放的性格让我倾向于找一个更加私密的环境，有一种想要藏起来修复破碎物品的私心。</p><p class="story-paragraph">虽然我知道哪怕此刻向他提问他一定也不会让我难堪，但有所保留的答案也没什么意义不是吗？</p><p class="story-paragraph">民浩见状顺势就接过了话头。</p><p class="story-paragraph dialogue">“我想问熙媛。”</p><p class="story-paragraph dialogue">“就在此刻，最想发送短信的人是谁？”</p><p class="story-paragraph">平日里没有怎么关注过别人的发展走向，所以民浩选择的对象让我有些意外。</p><p class="story-paragraph dialogue">“此刻吗？”熙媛眨了眨眼睛，把手里的半块披萨放回到盘里。</p><p class="story-paragraph dialogue">“成灿欧巴。”她说。</p><p class="story-paragraph">像是陷入了诡异的怪圈，有什么东西黏上手心一样，话题峰回路转，我晕头转向地又一次被强行拽回了漩涡中心。</p><p class="story-paragraph">大家惊呼之余，我能清楚地感觉到有视线在我们两对当事人之间游走，虽然都是没有恶意的打量，但还是像一条条绳索一样捆缚过来，勒紧，打结。勇敢出击的新人，何去何从的前任，如果放在影视作品里，这也会是我爱看的故事情节。</p><p class="story-paragraph">制作组的摄像机此刻应该也在对准我的脸进行特写，希望能捕捉到观众喜闻乐见的震惊和迟疑，如果能有怨怼或者是眼泪的话就更好了。</p><p class="story-paragraph">但这样的戏剧时刻我却偏偏做不出任何反应了，如同过载的程序会罢工一样。</p><p class="story-paragraph">我只是用自己都快要听不见的声音重复了一遍成灿欧巴。这些字眼形成隐秘的体内风暴，它们呼啸纠缠，不聚积表情，只敲打神经。</p><p class="story-paragraph">是我忘记这个节目的主题和规则了，本来每个嘉宾就可以自由地选择与被选择。沐浴了几次阳光居然就以为太阳可以私有，但终究阳光是阳光，太阳是太阳。</p><p class="story-paragraph">直到智恩戳了戳我的胳膊，我才意识到现在是她在对我发问了。</p><p class="story-paragraph dialogue">“如果只有最后一次约会了，你会选谁呢？”</p><p class="story-paragraph">我猜到这是她所谓的帮我创造机会，但在信心和勇气都被压缩到趋于零的时候，我是没办法说实话的。</p><p class="story-paragraph">一阵漫长的沉默后，我举起酒杯笑着问可以喝酒代替吗？</p><p class="story-paragraph dialogue">“拜托大家也问问别的人吧。”不想成为过分扫兴的人，所以我已经是在用当下能发出的最欢快的语调在求饶了。</p><p class="story-paragraph dialogue">“是啊，也给新嘉宾一点参与感吧。”</p><p class="story-paragraph dialogue">“来来来，该我提问了。”</p><p class="story-paragraph dialogue">“我问允在吧。”</p><p class="story-paragraph">兴许是我努力挤出的笑容也盖不住勉强，大家很照顾我，让我以酒代罚后迅速转移了话题中心。</p><p class="story-paragraph dialogue">“对不起啊。”智恩小声地凑到我耳边向我道歉：“我没想到你会这么辛苦的。”</p><p class="story-paragraph">我在桌下拍了拍她的手说没事。</p><p class="story-paragraph dialogue">“是我自己的问题。”</p><p class="story-paragraph">是我自己一厢情愿地篡改了游戏的规则，所以危机感才会在这时给我如此沉重的当头一棒。郑成灿身边的位置确实可以有很多的候选人，并不是只会有“我”和“空缺”这两种状态。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">发愣的我逐渐成了游戏的边缘人，但所幸这一轮饭后环节并没有持续太久，很快节目组就递上来了新的信封。距离最近的宥真接过，我看见她扫视了一遍内容后皱了皱眉头。</p><p class="story-paragraph dialogue screen-line">「请男嘉宾为自己的X选择下一次的约会对象」</p><p class="story-paragraph dialogue screen-line">「有二十分钟的讨论交流时间」</p><p class="story-paragraph dialogue">“是我们给X选吗？”新来的贤宇有些疑惑。</p><p class="story-paragraph dialogue">“是的，给男生的选择权呢。”</p><p class="story-paragraph dialogue">“这么刺激吗？”</p><p class="story-paragraph">大家陆续选好了谈话空间后两两结伴离开了聚餐地，银硕走的时候侧身跟我说他和宥真不去宿舍，如果我们有需要的话可以使用。</p><p class="story-paragraph dialogue">“走吗？”</p><p class="story-paragraph">最后只剩我还在原地坐着，郑成灿走过来碰了碰我的肩膀。</p><p class="story-paragraph">我起身跟着他，一路上我们就始终保持着这样一前一后的状态，他慢的时候我也有意放慢步子。刚才的游戏乱局估计让他心情也不太明朗，他的身形比平时看起来要更弯驼一些。我望着他的背影为即将到来的对话打起腹稿，不想再用眼泪绑架他了，这一次我想好好地和他说说话。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">宿舍里果然空无一人，郑成灿站在门口按了半天也只打开了客厅顶部的一圈轨道灯。</p><p class="story-paragraph dialogue">“就这样聊吧。”我说着往屋里走：“今晚的时间也不是很多。”</p><p class="story-paragraph dialogue">“那你有想要约会的人吗？”郑成灿如我所愿地单刀直入了，他给我倒了一杯凉水，杯底撞到桌面，水面泛起波纹。</p><p class="story-paragraph dialogue">“没有。”我看着他的眼睛说。</p><p class="story-paragraph dialogue">“说实话吧，怒那。”</p><p class="story-paragraph dialogue">“我也想为你做点事来着。”</p><p class="story-paragraph dialogue">“是元彬吗？”郑成灿歪了歪头，他不笑的时候看起来真的很难接近，指尖在桌面一顿一顿地敲起拍子，听得我有点心烦意乱。</p><p class="story-paragraph dialogue">“非要这样说话吗？”我问。</p><p class="story-paragraph dialogue">“我是觉得说出来会更好。”郑成灿似乎在暗指我刚刚逃避问题喝酒的事。</p><p class="story-paragraph dialogue">“我一直都是偏向你的。”</p><p class="story-paragraph">这句话其实从刚刚进门前就在酝酿了，也不知道放在这里是否合适，但一直想说的欲望和前一句的怂恿让我就这样脱口而出了。</p><p class="story-paragraph">紧跟着的沉寂是可以预见的，于是我也就只是安静地望着郑成灿，他低着头的时候额发会垂下来挡住眼睛，所以我看看他的发旋，再看看他交错的指尖。</p><p class="story-paragraph">大概是下雨了，窗外忽然就有了淅淅沥沥的声音，今年的雨季真是漫长，这种不定时的潮湿感觉已经持续了好几个月。</p><p class="story-paragraph dialogue">“那你希望我怎么做呢？”这一次郑成灿放轻了声音，问句融在雨声里听起来雾蒙蒙的。</p><p class="story-paragraph dialogue">“我不是非要这样说话。”</p><p class="story-paragraph dialogue">“只是不知道怎么话说出口就变成了这样。”</p><p class="story-paragraph dialogue">“我有时候都不明白为什么我们会在这里。”</p><p class="story-paragraph">他的声音在前两句的时候听起来已经有些发颤了，但很快又自行打住了，郑成灿不是那种轻易让自己失控的人。毕竟是医学院的佼佼者，没有人不夸赞他的理智。</p><p class="story-paragraph dialogue">“还是说说约会选择的事吧。”他抬起头来，感觉他眼底有些许泛红，我推了面前的纸巾给他。</p><p class="story-paragraph dialogue">“我说了选谁都可以的呀。”</p><p class="story-paragraph dialogue">“你做的选择，我都会去的。”</p><p class="story-paragraph dialogue">“这是你的权力。”</p><p class="story-paragraph">雨势渐大了，接二连三的雨滴拍落到窗玻璃上，注视了一眼屋内对立静坐的二人后就飞快地滑落了，留下一道道凌乱又潮湿的轨迹。</p><p class="story-paragraph dialogue">“下去吧。”二十分钟的闹钟响起，郑成灿长舒了一口气对我说。</p><p class="story-paragraph dialogue">“想好选谁了吗？”</p><p class="story-paragraph dialogue">“不是说选谁都可以吗？”郑成灿说着帮我撑开门让我先出去。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">在客厅聚集后，几位男嘉宾先后公布了自己给X做出的选择。</p><p class="story-paragraph">元彬说出成灿的时候看向了我，我轻点了两下头作为对他眼里担心的回应。</p><p class="story-paragraph">最后只剩郑成灿没有说话了，大家一致望向了他，我的心也悬吊了起来。</p><p class="story-paragraph dialogue">“我的选择是。”</p><p class="story-paragraph">呼吸被不由得拉长，我往前倾了倾身子。</p><p class="story-paragraph dialogue">“银硕。”两个出乎意料的音节。</p><p class="story-paragraph dialogue">“我吗？”不光是我，被点名的人也觉得不可思议，银硕指了指自己想再次确认一下。</p><p class="story-paragraph dialogue">“是。”郑成灿点了点头，露出一个清清淡淡的笑容。</p><p class="story-paragraph dialogue screen-line">「为什么会这样选择？」</p><p class="story-paragraph">今晚的短信我这样发给了郑成灿。</p><p class="story-paragraph dialogue screen-line">「希望这个选择没有让你为难，应该和银硕相处得也还不错吧。」</p><p class="story-paragraph">而他发给我的信息很巧合地形成了一问一答的闭环。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">和宋银硕的约会被安排在一家调香店。</p><p class="story-paragraph">情侣互调香水，是在韩国很流行的一种约会方式。</p><p class="story-paragraph dialogue">“喜欢什么香型？”老板娘笑眯眯地询问我们。</p><p class="story-paragraph dialogue">“木质或者玫瑰吧。”我其实不太爱研究这些，从前往往是和郑成灿喷同一瓶香水，他喜欢清冷的雪松，也喜欢微甜发酸的玫瑰味。</p><p class="story-paragraph dialogue">“我们这次做点不一样的吧。”银硕忽然提议道。</p><p class="story-paragraph dialogue">“不一样的吗？你有什么想法。”</p><p class="story-paragraph dialogue">“做济州岛的味道吧。”他眨了眨眼睛，嘴角弯起来：“留给自己的纪念。”</p><p class="story-paragraph">老板娘夸赞了一番这个想法的独特后将我们带到了调香台前，瓶瓶罐罐上印着各种成分名字，我们开始一边动手实操一边闲聊起来。</p><p class="story-paragraph dialogue">“成灿那家伙真是。”银硕滴完两次香剂后突然笑着发出一声感慨。</p><p class="story-paragraph dialogue">“仗着我们是室友就这样把我推出来了。”</p><p class="story-paragraph dialogue">“没有让你很难办吧？”我有些不好意思地问他。</p><p class="story-paragraph dialogue">“我还好，我们也算比较熟了嘛。他应该也是这样想的。”</p><p class="story-paragraph dialogue">“况且他这样也不是第一次了。”他斜向上看了看，似乎在回忆什么。</p><p class="story-paragraph dialogue">“还记得上次我问你喜欢的咖啡的事情吗？”</p><p class="story-paragraph dialogue">“他居然告诉我一个错误的答案。”</p><p class="story-paragraph dialogue">“我不知道你们现在到底发展如何了。”</p><p class="story-paragraph dialogue">“但成灿他，可能比你想得要简单。”</p><p class="story-paragraph">银硕忽然收回视线与我对视，他的眼睛细长又有棱角，聚焦的时候会让人有一种在凝望深渊的感觉。</p><p class="story-paragraph dialogue">“我也没有什么别的意思，只是想给你的选择再提供一些额外的信息。”</p><p class="story-paragraph dialogue">“你做好选择了吗？”我问。</p><p class="story-paragraph dialogue">“我的选择一直都是既定的呀。”银硕这句话回答得很认真。我真的十分佩服这种能在任何时候都做出坚定选择的人。</p><p class="story-paragraph">上午的时间很快就过去，他做了一瓶海盐味的香水，我说不出自己做的味道，只能喷在空气里给他试闻。</p><p class="story-paragraph dialogue">“加了一点青苔。”我补充道。</p><p class="story-paragraph dialogue">“像下雨的橘子林。”银硕说。</p><p class="story-paragraph dialogue">“是吧，有一点点潮湿的味道。”我提到最近总是下雨。</p><p class="story-paragraph dialogue">“雨季的时候，济州岛的晴天也很难得啊。”</p><p class="story-paragraph dialogue">“如果最后一天能是晴天就好了，想最后看一次落日。”我双手合十做出祈祷的模样。</p><p class="story-paragraph dialogue">“会是晴天吧，雨季也快结束了。”银硕翻了翻手机说。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">在济州岛的最后几天其实也和在首尔的日常差不多，有所意愿的人依旧进行着高频的约会与见面。唯一不同的可能就是孤独失意的人现在可以去海边行走散心。</p><p class="story-paragraph">大海总是宽广地包容着任何心事。</p><p class="story-paragraph">智恩似乎和允在发生了比较严重的争吵，她在某天深夜突然把头捂在被子里哭起来，听见动静后我爬到她的床上抱住她。</p><p class="story-paragraph">人的眼泪怎么可以那么多呢？像汩汩的溪流一样，我感觉衣服的右肩都快要被完全洇湿了。而心脏作为这一切的源头，又到底是装下了多少多深的酸涩之水。</p><p class="story-paragraph dialogue">“快结束了。”我只能这样拍着智恩的背小声安慰。</p><p class="story-paragraph dialogue">“结束以后我再也不要见他了。”智恩嗡嗡地说着狠话。</p><p class="story-paragraph dialogue">“再见并不总是好事。”</p><p class="story-paragraph">哄她到完全入睡后，我才回到自己的床上躺下。</p><p class="story-paragraph">但她的话却缠绕在了我的脑海里。</p><p class="story-paragraph">再见并不总是好事，那我和郑成灿的再见呢？也是一种忤逆规律的强行而为吗？分开的人还有再见的必要吗？再见又真的能带来什么实质的改变吗？</p><p class="story-paragraph">此刻的我既觉得无比亢奋却又深感疲惫，既觉得无比难过却又感到一丝释然。人的情绪在复杂的时候就像永远找不到开端的毛线球，丝丝相扣，相互牵制，以至于什么都有只言片语可说，但又什么都无从说起。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">不知不觉已经到了终选的前一天。</p><p class="story-paragraph">今天节目组安排所有人进行最后一次和X的约会。</p><p class="story-paragraph">天公不作美，早上还没出门就又开始飘起了小雨。于是我们只得取消了原定的户外拍照活动，全程转到室内。</p><p class="story-paragraph">这家饭店的冷气开得很足，郑成灿又折返回车里拿了提前备好的毯子给我。</p><p class="story-paragraph dialogue">“我们还是拍点照片吧，虽然没有办法到外面去。”</p><p class="story-paragraph">因为是最后一次约会，我尽量收拾了心情。</p><p class="story-paragraph">很多时候第一次往往都比最后一次要隆重和盛大。大抵是因为第一次都是可知的，前所未有时的突然发生很难不耀眼得像星星。而最后一次就显得隐蔽太多，最后一次是戛然而止的，他发生的时候总是普通得和往常别无二致，可能要好久好久以后才会幡然醒悟到自己已然平凡地度过了。</p><p class="story-paragraph">第一次总是在期待中来的，而最后一次总是在回忆中才能界定的。</p><p class="story-paragraph">所以这也是为什么遗憾总是滞后的，成长也总是滞后的。</p><p class="story-paragraph">而当最后一次被明确地被定义了的时候，再无情的人其实也会忍不住想要抓住尾巴。</p><p class="story-paragraph">没有人不会因为目送一场终结而动容吧。</p><p class="story-paragraph">郑成灿应该也是怀着和我一样的心情，所以今天他也一直挂着笑容，虽然淡得像风一吹就会散掉一样。</p><p class="story-paragraph dialogue">“是我给你拍，还是拍合照啊？”郑成灿拨弄着手机问我。</p><p class="story-paragraph dialogue">“合照吧。”我撅起嘴巴：“我自己的照片够多了。”</p><p class="story-paragraph dialogue">“那我坐过来？”郑成灿像在向我发出申请一样。</p><p class="story-paragraph dialogue">“不然呢？”我笑着让他自然一点。</p><p class="story-paragraph">郑成灿环顾了一下四周，随即站起身坐过来，他今天的头发做了一点微卷，我闻见有淡淡的摩丝味道。</p><p class="story-paragraph dialogue">“今天头发很好看呢。”由衷地夸赞了一句。</p><p class="story-paragraph dialogue">“你今天也很漂亮。”他转过头来看着我。</p><p class="story-paragraph">被郑成灿的眼睛直直地盯着是一件很危险的事情，因为会一不小心就陷进去，像表面温柔但又深不可测的沼泽一样。</p><p class="story-paragraph">于是我别开视线说拍照吧。</p><p class="story-paragraph">他把手机举到很高，186的个子胳膊也是不一般的长，之前旅游的时候我就总叫他人形自拍杆。这样的俯视视角下，我总像被他笼罩着一样。应该是拍了好多好多张，我感觉他按快门的手几乎没有停歇过。</p><p class="story-paragraph">然而还在选照片的时候菜就端上来了。郑成灿又回到了对面的位置。</p><p class="story-paragraph dialogue">“等会把照片都drop给我吧，不用挑了。”我说着戳起了一块年糕。</p><p class="story-paragraph dialogue">“万一拍得都不太好呢？”郑成灿突然这样没头没脑地来了一句。</p><p class="story-paragraph dialogue">“下次再拍吗？”我笑了，突然发现故作轻松地讲玩笑话好像是我的一种天赋。</p><p class="story-paragraph dialogue">“下次吗？”郑成灿点了点头默许一样，随后把食物完整地送进了嘴里。</p><p class="story-paragraph dialogue">“明天的选择，有想法了吗？”空气太安静了，我觉得得说点什么。</p><p class="story-paragraph dialogue">“你是什么想法？”郑成灿没抬头。</p><p class="story-paragraph dialogue">“我依旧是偏向你的。”大概是处在最后一次的氛围里，我异常得诚实。</p><p class="story-paragraph dialogue">“就完全没办法不在意你。”</p><p class="story-paragraph">我不光没办法不在意你，我还从始至终都在想你，在想着重新拥有你，霸占你。</p><p class="story-paragraph dialogue">“不会对我失望吗？”郑成灿依旧低着头和我说话。</p><p class="story-paragraph dialogue">“要说失望的话，我可能对自己比较失望。”</p><p class="story-paragraph dialogue">“我本来不是这样爱哭的人不是吗？”</p><p class="story-paragraph">我确实本来不是这样的。</p><p class="story-paragraph">我其实一直以为自己可以坦然地重新回到一个人生活的状态，但实践后才发现人在尝试过接触太阳以后就很难再回去没有光的地方。</p><p class="story-paragraph">人和向日葵是一样的，有天生的趋光性。</p><p class="story-paragraph dialogue">“对不起让你哭了那么多次。”郑成灿的声音忽然又在发抖了。</p><p class="story-paragraph">良久，他抬起手去擦眼角的时候，我终于看见他的眼泪了。</p><p class="story-paragraph">断了线的珠子一样顺着面颊滚落下去，但也像呼啸的小行星撞击上我的心脏。</p><p class="story-paragraph">郑成灿是很理智的人，但也同样是很感性的，这并不矛盾。他会因为很多事情哭，比如和朋友久别重逢，比如终于养了一只小狗，但他又不会放任自己落泪，他每一次流泪的时机其实都很珍贵。</p><p class="story-paragraph">我不会说让他别哭了的话，我只是安静地把纸张递给他。</p><p class="story-paragraph dialogue">“年糕太辣了。”没想到他接过纸的时候还在含含糊糊地嘴硬，短暂的沉默后我们两个都笑出了声。</p><p class="story-paragraph">如果时光能就此停驻，我觉得也不失为一个不错的结局。</p><p class="story-paragraph">但手机的提示音就是在这时候响起了。</p><p class="story-paragraph dialogue">“只有我的吗？”我有点疑惑地翻过来划开屏幕。</p><p class="story-paragraph dialogue screen-line">「X约会时间结束请离开」</p><p class="story-paragraph dialogue screen-line">「另外请输入想要见面的人的名字，配对成功将进行下一轮约会」</p><p class="story-paragraph">我不知道自己僵住了多久，以至于郑成灿顶着还在泛红的眼睛问我发生什么事了。</p><p class="story-paragraph dialogue">“约会结束了。”我喃喃道：“这么快吗？”</p><p class="story-paragraph dialogue">“那你...要走了吗？”郑成灿抿了抿下嘴唇。</p><p class="story-paragraph dialogue">“应该是的。”我忽然有点不敢看他了，就像我每次都害怕看盛典的最后一轮烟花一样，它们往往都是最热闹也最华丽的，但它们同样还昭示着最冷清也最孤独的长夜。</p><p class="story-paragraph dialogue">“我们好像还没认真地聊很多。”郑成灿似乎陷入了思考，连带着我也开始在脑海里翻来覆去地寻找可以作为结尾的话题。</p><p class="story-paragraph dialogue">“如果当时我们能用一种更恰当的方式说再见呢？”忽然想到了这个问题，于是我在起身离开座位之前问出来了：“结局会不会有所不同。”</p><p class="story-paragraph">如果当时他说分手的时候我能注意到他眼底的迟疑，如果他没有一言不发地推门出去，如果我当时能克服疲惫起身拉住他的手腕，我们会不会有所不同。这些假设我曾经一个人想了无数遍，在这样最后的时刻我忽然想听听他的看法，也算是给过去的我们重新画一个句号。</p><p class="story-paragraph dialogue">“为什么一定要如果呢？我们还有一次机会不是吗？”</p><p class="story-paragraph">郑成灿居然摇摇头反驳我的话。</p><p class="story-paragraph dialogue">“说再见的机会，还有一次啊。”他望向窗户上凝结的水滴。</p><p class="story-paragraph dialogue">“这次我们好好做吧。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">拖着疲惫的身体回到房间，雨天的时候人的身心好像就是更容易困顿。</p><p class="story-paragraph">今天的雨几乎下了一整天，我不由得为之前许下的想看最后一次落日的愿望隐隐担忧起来。</p><p class="story-paragraph">今晚的最后一条心动短信送达的时候，我刚吹完头发。歪靠到枕头上打开手机，软件提醒有5条消息。</p><p class="story-paragraph dialogue screen-line">「最后一个夜晚也晚安」</p><p class="story-paragraph dialogue screen-line">「来自朴元彬的信息」</p><p class="story-paragraph dialogue screen-line">「明天搭配一次衣服吧，我们」</p><p class="story-paragraph dialogue screen-line">「来自郑成灿的消息」</p><p class="story-paragraph dialogue screen-line">「你的X选择了你」</p></div>
        <nav class="chapter-pager" aria-label="章节翻页"><button type="button" data-target="chapter-12"><span>‹ 上一章</span><strong>一起去看海吧</strong></button><button type="button" data-target="chapter-14" class="next"><span>下一章 ›</span><strong>雨季不再来</strong></button></nav>

      <article class="chapter" aria-labelledby="heading-chapter-14">
        <header class="chapter-header">
          <span class="chapter-number">14</span>
          <h2 id="heading-chapter-14">雨季不再来</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">从楼上下来的时候郑成灿已经在一楼客厅等我了。</p><p class="story-paragraph">远远地就看见了他的背影，面向宽大的落地窗坐着。</p><p class="story-paragraph">民宿的窗户是可以直接望见大海的，雨后阳光下的海面是新鲜的湛蓝色，而郑成灿坐在光影里仿佛和这片生动的蓝融为一体。</p><p class="story-paragraph">他今天依旧卷了头发，也不知是不是我昨天接连夸赞了好几句的缘故，不过微卷蓬松的头发确实让他看上去有一种不具攻击性的精致感。</p><p class="story-paragraph">屋外忽然有风吹进来，暖风是轻柔的，连带着我叫他名字的声音也是轻柔的。</p><p class="story-paragraph">郑成灿闻声转过身来，他真的从名字到人都和阳光有极高的适配度，看见他脸的一瞬间我感觉自己再挪不开眼睛。</p><p class="story-paragraph dialogue">“准备好了吗？”他的目光跟随着我下楼梯的步伐。</p><p class="story-paragraph dialogue">“嗯，没等很久吧。”我走到他跟前，莫名地开始紧张。</p><p class="story-paragraph">今天我们商量着搭了一身浅色的衣服，他穿的那件衬衫如果没记错的话应该是我之前买给他的。</p><p class="story-paragraph">虽说郑成灿是天生的衣服架子，每次一起逛百货商场无论拿什么给他试穿店员都会赞不绝口，但相比于深色系我还是更喜欢看他穿一些明亮轻盈的颜色。因为他的皮肤很白，五官又长得柔和，哪怕只是最普通的纯白T恤，他也能看起来像清早没有尘埃的风，像薄荷，像干净高耸的雪山。</p><p class="story-paragraph">我没忍住上前一步捏了捏他的衣角，但又很快将手收回了。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“我们是今天最后出门的一组吗？”上车后我一边捣鼓安全带一边随口发问。</p><p class="story-paragraph dialogue">“看起来是这样。”郑成灿率先扣好了，忽然很自然地伸过手来要帮我。</p><p class="story-paragraph">他的气息瞬时逼近，其实只是很熟悉的皂角味，但在最后一天的渲染下竟变得格外勾人，勾人心绪的同时也勾住眼泪，我屏住呼吸盯着他的发旋有些犯晕。</p><p class="story-paragraph">好在郑成灿的动作很快，不一会就听见安全带锁好时的咔哒声响，像世界的时钟被重新按下启动键一样，风开始继续吹，我的心脏开始继续跳动。</p><p class="story-paragraph dialogue">“没有休息好吗？”他转动钥匙的时候轻飘飘地问了一句。</p><p class="story-paragraph dialogue">“怎么？”我有些惊慌于他是否看见了我发红的眼睛，最后一天了，我其实并不是很想用哭泣和安慰作为我们的开场。</p><p class="story-paragraph dialogue">“今天看起来...”</p><p class="story-paragraph">郑成灿偏过头长长地瞥了我一眼：“没什么...”</p><p class="story-paragraph dialogue">“还是很漂亮。”他用平静的陈述语气说。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue screen-line">「请开车前往下列地址，这里有人要向你表白」</p><p class="story-paragraph">按照节目组的短信指示，我们终于驶出了民宿。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">今天的晴朗天气是意外之喜，我情不自禁地扒到车窗边往外看。阳光果真是最好的滤镜，路边矮房上的彩色墙绘搭配着夏季才有的茂盛绿意，光与影穿插在其间像流动的生命体，感觉整个世界都在大口呼吸。</p><p class="story-paragraph dialogue">“这边有海。”郑成灿提醒我换个方向看看。</p><p class="story-paragraph">我很听话地将视线转到他那边，近在迟尺的海面上波光浮跃，而我们的车正在沿海公路上行驶着，这条海岸线像柔软的臂弯，长得似乎绵延无际。</p><p class="story-paragraph dialogue">“确实这边风景更好诶！”我惊呼完才意识到自己吵吵闹闹得像个第一次出门的小孩，于是赶忙噤声。</p><p class="story-paragraph">郑成灿倒是不甚在意，他只是一边目视前方观察路况一边笑着问我大海就这么好看吗。</p><p class="story-paragraph">我狠狠点了点头说好看啊。</p><p class="story-paragraph">目光不知怎么就滑落到了他的侧脸上，这么近的距离可以看见他隐隐发光的睫毛末端。再稍微偏转一些，我看见了他右耳上还清晰存在的耳洞痕迹。</p><p class="story-paragraph">那是我很久以前拉他去打的，以一个人打会害怕为由。</p><p class="story-paragraph">郑成灿先打完后哄着我说不痛的，但我还是狠狠抓着他的手不放，以至于最后玩了一整天回到家，他的手心手背上都还留着被我指头攥出的红印。</p><p class="story-paragraph">之后我给他买过一些小巧的银饰耳钉，清纯的脸蛋用金属制品点缀会有一种别样的反差，而且每次吻上他发烫耳垂的时候，耳钉的存在就像一粒掉进热可可里的小小的冰块。</p><p class="story-paragraph">但因为医生职业的原因他戴的次数并不是很多。我一直以为这个耳洞早就该消失了，可没想到居然还存在着。</p><p class="story-paragraph dialogue">“不管看多少次都很好看啊。”我又补充了一句。</p><p class="story-paragraph">但这次的主语指向不明，他大概不知道我正看着他的耳洞，那个完全因为我而存在于他身上的小小印记。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">不想太快就将注意力聚焦到今天的终选上，于是我选择和郑成灿再叙叙旧。</p><p class="story-paragraph">回忆过去的事比预判即将发生的事还是要轻松得多，前者是踩在具体的时间上，而后者则是需要飞起来去抓飘渺的想象。</p><p class="story-paragraph">飞起来后的方向完全是由风决定的，我讨厌那种不安全感。</p><p class="story-paragraph dialogue">“分手以后就一次都没想过找我吗？”这个问题如果今天不问恐怕往后也没有机会了。</p><p class="story-paragraph dialogue">“建大你常去的那家小酒馆还记得吗？”</p><p class="story-paragraph dialogue">“嗯...怎么提到那里，你去了吗？”我有些疑惑。</p><p class="story-paragraph dialogue">“你不是几乎从来不去吗？不爱喝酒的人。”</p><p class="story-paragraph dialogue">“我去过一次。”</p><p class="story-paragraph dialogue">“而且那天很巧，我碰到你了。”</p><p class="story-paragraph dialogue">“我们在酒馆碰过面吗？”我努力回想了一下，但并不能找到这段记忆。</p><p class="story-paragraph dialogue">“那天你喝醉了。”郑成灿转过脸来，眉头轻轻地皱了两下。</p><p class="story-paragraph">我知道他向来都不喜欢我把自己灌醉，因为在他看来只有伤心到无药可救的人才会没有节制地喝酒，普通人为什么要轻易地依赖酒精呢？</p><p class="story-paragraph dialogue">“然后很抱歉我跟了你一路。”他说。</p><p class="story-paragraph dialogue">“当时应该是分开的第三天，我一直跟着你走到家门的最后一个转角。”</p><p class="story-paragraph">完全是第一次听说这段故事，真是让人难以置信。在我的记忆里分手之后我们两个似乎只是展开了一场漫长的拉锯战，默契地用沉默的时间长短定输赢。结果越拖越久，久到我们都忘记了怎么重新开口。</p><p class="story-paragraph dialogue">“为什么不叫住我呢？”</p><p class="story-paragraph dialogue">“不知道...”</p><p class="story-paragraph dialogue">“人有时候就是很奇怪不是吗？”</p><p class="story-paragraph dialogue">“明明是因为你才会想去喝酒，结果见到你之后又放你走掉了。”</p><p class="story-paragraph dialogue">“可能就是不敢吧。”郑成灿无奈地笑了两声：“毕竟当时你那样轻易得就放走了我。”</p><p class="story-paragraph">不敢这两个字眼我几乎从来没从他的口中听到过。</p><p class="story-paragraph">原来郑成灿这样的人也会有胆怯的时候。</p><p class="story-paragraph dialogue">“我一直以为只有我一个胆小鬼。”我喃喃道。</p><p class="story-paragraph dialogue">“所以你又是在怕我什么呢？”郑成灿忽然将话锋一转：“你在分手的时候也说怕麻烦我。”</p><p class="story-paragraph dialogue">“我是什么很可怕的人吗？”</p><p class="story-paragraph">他复原着那天的场景，他甚至清楚地记得一来一回的每一次对话。</p><p class="story-paragraph dialogue">“我怕你太好了。”</p><p class="story-paragraph">我知道这句话很奇怪，郑成灿也有些不解地哼了一声。</p><p class="story-paragraph dialogue">“你太好了，我会配不上你。”</p><p class="story-paragraph dialogue">“你长得好，成绩好，工作也好，那么多人都喜欢你的。”我掰着手指盘点他的长处。</p><p class="story-paragraph dialogue">“所以你认为自己不好吗？”郑成灿明显把车速放慢了。</p><p class="story-paragraph dialogue">“嗯...会想把自己不好的地方都藏起来。”</p><p class="story-paragraph dialogue">“怎么会有这种想法呢？”郑成灿摇了摇头，随即又短促地叹了口气。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">导航提示即将到达目的地，我们才生硬地将交流拉回到今天的正题上。</p><p class="story-paragraph dialogue">“想好选择了吗？”</p><p class="story-paragraph dialogue">“已经想好了。”直到最后一天我才像银硕一样果断地说出了这种话。</p><p class="story-paragraph dialogue">“那就好。”郑成灿的手在方向盘上摩挲着：“不会太为难。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">车渐渐停下来，这里是一处延伸向大海的石质栈桥。</p><p class="story-paragraph">我一眼就看见了坐在不远处路牌下的元彬，他的头发在风里飘飞着。车窗上还有下雨时留下的些许水渍，斑驳在眼前如同老式电影的噪点，而他被框在玻璃里仿佛是这一幕的主演。</p><p class="story-paragraph">手机收到了节目组发来的讯息。</p><p class="story-paragraph dialogue screen-line">「朴元彬将在电话里和你表白」</p><p class="story-paragraph dialogue screen-line">「如果之后下车就代表选择朴元彬」</p><p class="story-paragraph dialogue screen-line">「如果不下车就代表选择郑成灿」</p><p class="story-paragraph">选择的时间终于还是要来了。</p><p class="story-paragraph">我和郑成灿同时陷入了沉默，海浪声骤然放大，一点点同化着我们呼吸的节拍。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“不想再说点什么吗？”</p><p class="story-paragraph dialogue">“可能...会是我们的最后一次对话诶。”我小心翼翼地试探。</p><p class="story-paragraph">如果之前在酒馆是不敢的话，那这次来挽留我一下吧。这是我的潜台词。</p><p class="story-paragraph dialogue">“你做任何决定我都会支持你的。”郑成灿淡淡地开口。</p><p class="story-paragraph dialogue">“选元彬，或者是...选我。”</p><p class="story-paragraph dialogue">“希望这次可以完全为自己做选择吧。”</p><p class="story-paragraph dialogue">“选择幸福就好了。”</p><p class="story-paragraph dialogue">“怒那是很好的人，值得任何喜欢。这一点可能是我目前唯一想强调的了。”</p><p class="story-paragraph">他说话的时候眼睛一直望着我，目光感觉在我的脸上勾勒了一圈又一圈。</p><p class="story-paragraph dialogue">“如果我在这里下车了，回去的路上不会哭鼻子吗？”</p><p class="story-paragraph">人在情绪复杂的时候会想方设法的自我开解，于是我又若无其事地开起了玩笑，提及昨天他掉眼泪的事。</p><p class="story-paragraph">郑成灿怔住了片刻，继而笑了起来，眼下的窝蚕像夏天堆得极低的柔软云朵。</p><p class="story-paragraph dialogue">“可能会吧。”他终于挪开视线垂了一下眼睛。</p><p class="story-paragraph dialogue">“但这一次不要考虑我，考虑自己吧。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">我还想再说点什么，但电话铃声突然响起，屏幕上出现了元彬的名字。郑成灿将头偏向另一边，我接通电话，目光往车外飘去。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“接得很快嘛。”元彬的声音夹带着海水声一起涌起听筒里。</p><p class="story-paragraph dialogue">“不好意思，让你久等了。”今天阳光很盛，要在海边独自待这么久不是一件容易事。</p><p class="story-paragraph dialogue">“没事。”</p><p class="story-paragraph">一阵沉默。</p><p class="story-paragraph">大概是因为长期都只和音乐打交道的缘故，元彬并不是特别擅长主导对话的人，偶尔语速加快甚至会出现结巴的情况，他有时候是会露出点笨拙的可爱。</p><p class="story-paragraph dialogue">“过去三周了。”感觉电话那头酝酿了很久。</p><p class="story-paragraph dialogue">“还记得我们的第一面吗？”</p><p class="story-paragraph dialogue">“记得，玄关那里，你戴着星星的挂坠。”</p><p class="story-paragraph">那枚挂坠比本人要更早一步出现在我眼前，晃晃悠悠，仿佛真的星星从天上掉落下来一样。</p><p class="story-paragraph dialogue">“记得这么清楚。”</p><p class="story-paragraph dialogue">“毕竟是我来这里认识的第一个人嘛。”</p><p class="story-paragraph dialogue">“嗯..”元彬忽然笑起来：“第一次约会也是我们。”</p><p class="story-paragraph dialogue">“是，那些唱片很好听，回首尔以后我也应该会经常去的。”</p><p class="story-paragraph dialogue">“一个人去吗？”</p><p class="story-paragraph dialogue">“哈哈，不开你的玩笑了。”</p><p class="story-paragraph dialogue">“但说实话感觉从那次约会以后我们就开始变得差了一些时机。”</p><p class="story-paragraph">元彬语速突然加快，自顾自地扔了三句话出来。</p><p class="story-paragraph dialogue">“临行前的早晨说要一起来济州岛看海的。”</p><p class="story-paragraph">在他的提醒下我才想起来这件事，来济州以后感觉时间流逝得太快了，一切的一切都在奔着最后一刻飞速进行着。</p><p class="story-paragraph dialogue">“对不起...我忘记了。”</p><p class="story-paragraph">感觉元彬正在看过来，我有点不好意思和他对视。</p><p class="story-paragraph dialogue">“这三周的时间因为你，我过得很开心。”</p><p class="story-paragraph dialogue">“至少和你在一起的那些时间都是。”</p><p class="story-paragraph">我低着头向他袒露自己真实的内心所想。</p><p class="story-paragraph dialogue">“但是元彬...”</p><p class="story-paragraph dialogue">“这一次我不能和你一起去看大海了。”</p><p class="story-paragraph dialogue">“有人让我在最后的时间务必要选择幸福，虽然这段幸福注定会捆绑很多的痛苦与坎坷。但我知道如果当下选择离开他，我大概只会过得更不好。”</p><p class="story-paragraph dialogue">“所以对不起元彬。”</p><p class="story-paragraph dialogue">“我也真心希望你幸福。”</p><p class="story-paragraph dialogue">“不要说对不起的话。”电话那头元彬的气息被放大，像不稳定但柔和的阵风。</p><p class="story-paragraph dialogue">“谢谢你祝福我，我也祝福你。”</p><p class="story-paragraph">我看见他忽然将手机从耳旁拿下，伸向大海的方向。一时间风声夹杂着水声席卷而来，充盈在我的耳畔。</p><p class="story-paragraph">他面朝大海站着，清瘦的身形，腰间围着的衣衫被风吹得鼓成帆，又像翅膀，感觉下一秒他就会消失一样。</p><p class="story-paragraph dialogue">“听见大海的声音了吧。”元彬的声音再次响起：“那这次也算是一起看海了。”</p><p class="story-paragraph dialogue">“所以请一定不要因为我而遗憾。”</p><p class="story-paragraph dialogue">“那么...再见？”</p><p class="story-paragraph dialogue">“再见，元彬。”</p><p class="story-paragraph dialogue">“去幸福吧。”他说完最后一句话后便自行挂断了电话。</p><p class="story-paragraph">既然我们的人生没有交集的可能，那就各自勇敢地奔赴下一程吧。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">不知道握着手机听了多久的忙音，等我回过神来的时候郑成灿似乎已经盯着我看了很久。</p><p class="story-paragraph dialogue">“不走吗？”我被他看得有些不自在了。</p><p class="story-paragraph dialogue">“结束了吗？”他完全是在明知故问。</p><p class="story-paragraph dialogue">“是啊，我选择你了。”好像就是有意要让我把完整的结果公布出来似的，他这下才踩动了汽车的油门。</p><p class="story-paragraph dialogue">“我不是故意的。”车子行驶出一段后，郑成灿忽然开口说话。</p><p class="story-paragraph dialogue">“我是真的想要确认一下你的选择。”</p><p class="story-paragraph dialogue">“难道我就表现得这么不明显吗？”我把胳膊环抱到胸前，结束自己的环节后整个人好像都放松了许多。</p><p class="story-paragraph dialogue">“不是说和他在一起的时间很开心吗？”</p><p class="story-paragraph dialogue">“开心和幸福之间就一定是等号吗？”我反问他。</p><p class="story-paragraph">毕竟在我的认知里，将幸福定义为当下的开心是极其狭义的。真正的幸福远比这要复杂的多，就像月亮固有的明暗两面，幸福和不幸也是纠缠的双生花。幸福的人会不自觉地想要追求长久，而长久这样虚无的东西注定会让人变得心事重重，瞻前顾后。</p><p class="story-paragraph">开心可以是绝对纯粹的，但幸福是笑里带着泪。</p><p class="story-paragraph">所以当时简单的一句让我选择幸福，在我听来其实并不是一个特别简单的任务啊。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">新的目的地离得并不是很远，车很快就开到一家装潢精致的咖啡店旁停下，根据节目组提供的信息，这里有想要和郑成灿表白的人。</p><p class="story-paragraph">和我先前的步骤一样，车停稳后有消息发送到了他的手机。</p><p class="story-paragraph dialogue">“是熙媛等会要给你打电话过来吧？”我试探性地问。</p><p class="story-paragraph">其实从抵达这里的那一刻起，我才刚获得一会的轻松感就荡然无存了。接下来的环节我需要全程参与，但又完全没有主动权，可以说我又变成了漂泊无依的风筝，唯一的风筝线落在郑成灿手里。</p><p class="story-paragraph dialogue">“是的，所以你还有什么想对我说的吗？在我做出选择之前。”</p><p class="story-paragraph">郑成灿放下手机直视我。</p><p class="story-paragraph">这个时刻仿佛成了我握在手里的最后一张命运牌。</p><p class="story-paragraph dialogue">“幸福这种事，一个人恐怕会做不到吧。”我小声地说。</p><p class="story-paragraph dialogue">“所以如果我在这里下车的话，我的选择是不是就前后矛盾了？”</p><p class="story-paragraph">郑成灿没回答我的问题，只是轻轻地笑了笑。他笑起来真的很好看，会让人瞬间觉得心安，哪怕他的笑容可能并没有附带什么额外的含义。</p><p class="story-paragraph">铃声响起，熙媛的电话拨过来了。</p><p class="story-paragraph">我听不见听筒那边的声音，只能从郑成灿的回答里获取一些单方面的零碎信息。</p><p class="story-paragraph dialogue">“嗯，是的。”</p><p class="story-paragraph dialogue">“啊...我也要谢谢你的。”</p><p class="story-paragraph dialogue">“没事，都过去了啊。”</p><p class="story-paragraph dialogue">“我记得的。”</p><p class="story-paragraph">信息太碎了，完全都是一些我听不懂的话，而且每一句都在提醒着我，在我的时空之外，还有属于郑成灿自己的平行时空。在他和熙媛的故事里，我没有任何的参与度，甚至可能连旁观者都不是。</p><p class="story-paragraph">所以他会做什么选择呢？这一刻，问题的答案变得扑朔迷离起来。</p><p class="story-paragraph">等会如果真的需要下车的话，我可不要再落一滴眼泪了。一边在脑海里排演起体面的告别场面，一边低下头开始把玩衣服上的系带。</p><p class="story-paragraph">这根带子很长，我把它们在手指上缠了一圈又一圈，无意识间竟缠到指尖开始发红发紫。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“但是很抱歉我得离开了。”</p><p class="story-paragraph">不知道对话怎么进行到了这里，但这句话就是忽然跃进我的耳朵里。我猛地抬起头来。</p><p class="story-paragraph">郑成灿还在通话，只是将身子转过来大半面向我。</p><p class="story-paragraph dialogue">“我明白你的意思熙媛。”</p><p class="story-paragraph dialogue">“但我真的没办法把她一个人留在这里。”</p><p class="story-paragraph dialogue">“大概是还有必须要两个人一起去做的事情吧。”</p><p class="story-paragraph">郑成灿说到这里时对视上了我的眼睛，好像这句话不只是说给通话的对方，也在同时说给我听。</p><p class="story-paragraph dialogue">“早点回去吧，让你破费还给我点好了咖啡。”</p><p class="story-paragraph dialogue">“谢谢你熙媛，那么我得走了。”</p><p class="story-paragraph">话音落下，郑成灿挂断了电话。</p><p class="story-paragraph">四目相对，车子仿佛掉进了一个没有介质的异时空，安静得听不见一点声响，犹如宇宙爆炸后的新纪元伊始。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph dialogue">“走吗？”</p><p class="story-paragraph">郑成灿连续问了两遍我才找回自己的声音。</p><p class="story-paragraph dialogue">“去..哪儿？”简单的三个字被我说得磕磕绊绊。</p><p class="story-paragraph">都结束了吗？可为什么我们还在彼此的身边呢？太过强烈的不真实感，是梦吗？</p><p class="story-paragraph">事前的惴惴不安在心里还留有余震，我眨了眨眼睛想要努力看清郑成灿的样子。</p><p class="story-paragraph dialogue">“是真的。”他笑了笑留了张侧脸给愣神的我，有时候我真的怀疑他能听见我的心声。</p><p class="story-paragraph dialogue">“不是最后一天想看落日吗？”</p><p class="story-paragraph dialogue">“银硕告诉你的？”</p><p class="story-paragraph dialogue">“嗯，在海边看应该会很不错吧。”</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">车子重新驶上沿海公路，郑成灿说他知道有一处视野开阔的海水浴场。</p><p class="story-paragraph">临近傍晚，沿途的风景仿佛和下午出门时的有些不一样了，但又说不上来哪里发生了变化。大概是光的颜色变得更暖了一些，所有的事物都加套上了一层温柔的滤镜。</p><p class="story-paragraph">抵达海岸，离落日时刻还有约莫半个钟头。</p><p class="story-paragraph">看见郑成灿从后备箱取出野餐垫的时候，我才忽然意识到这场日落计划应该不是临时起意的。他其实也早早地就做好选择了吧。</p><p class="story-paragraph">久违地两个人并排在海边坐下，他拍了拍自己的肩膀示意我可以靠过去。</p><p class="story-paragraph dialogue">“会舒服一点。”</p><p class="story-paragraph dialogue">“可以吗？”我还有些不太习惯。</p><p class="story-paragraph dialogue">“你之前靠的时候可从来没问过。”郑成灿笑道。</p><p class="story-paragraph">我把头歪到他肩上的时候，他也顺势用胳膊将我揽到了怀里。一气呵成，自然得就好像我们从来都没有分开过一样。</p><p class="story-paragraph">我终于可以肆意地闻他衣服上那股清淡的皂角香，感受他身体的温度，听他的心跳只隔着皮肤。</p><p class="story-paragraph dialogue">“真好啊。”海风快要把我吹化掉了，我窝在熟悉的小小空间里轻声感叹道。</p><p class="story-paragraph dialogue">“什么真好？”</p><p class="story-paragraph">”这个夏天真好。”眼睛忽然有些酸酸的，我索性闭了起来。</p><p class="story-paragraph dialogue">“你不是不喜欢夏天吗？”合上眼后更能感觉到郑成灿的声音就近在咫尺。</p><p class="story-paragraph dialogue">“是啊，为什么一直讨厌的东西突然就变得喜欢了呢？”我喃喃着跟像快要睡着了一样。</p><p class="story-paragraph">大概是因为这个夏天真的太好了。</p><p class="story-paragraph">好在有大海，有落日，有加了冰块的橘子汽水，有听不倦的潮起潮落声。</p><p class="story-paragraph">当然它更好在有你有我，有我们。</p><p class="story-paragraph dialogue">“之前采访时提到的秘密，不好奇了吗？”郑成灿晃了晃我的肩膀。</p><p class="story-paragraph dialogue">“所以是什么呢？”</p><p class="story-paragraph dialogue">“让不可能变成可能的秘密，是什么呢？”</p><p class="story-paragraph dialogue">“我爱你。”</p><p class="story-paragraph dialogue">“让不可能变成可能的秘密是我爱你。”</p><p class="story-paragraph">郑成灿就是这样，哪怕说着最具冲击力的告白情话，他也可以做到面不改色。他望着我，眼底俨然是这片海洋的缩影，潮水，落日和我都映在他的瞳孔里。</p><p class="story-paragraph">不知道夏天为什么会刮春风，但我的心脏此刻确实浸润在春风里了，万般情绪在沉寂了许久的旷野上疯长，生命力仿佛重新灌注回身体里。</p><p class="story-paragraph">我爱你，这句话确实是魔法。</p><p class="story-paragraph dialogue">“我爱你。”短短一分钟里，郑成灿说了第三遍。</p><p class="story-paragraph dialogue">“这句话从过去到现在，其实始终都是成立的。”他的眼眶开始泛红。</p><p class="story-paragraph">分开的那半年时间里，原来我们依旧是一如往昔地相爱着。</p><p class="story-paragraph">感觉自己完全被海风融化了，失去一切屏障后，我的眼泪也不受控地溢了出来。</p><p class="story-paragraph dialogue">“回去以后租一间更大的房子吧。”</p><p class="story-paragraph dialogue">“这次把冬天也接过来。”郑成灿说着开始有些哽咽，我不禁伸出手去捧住他的脸，温热的液体瞬间润湿了我的手心。</p><p class="story-paragraph">所以真正抵达一个人的时刻，好像并不是拥抱，也不是亲吻，反而是他的眼泪愿意落在你身上的时候。眼泪落下的时候，外壳也随之落下了，他是在不计后果地露出柔软又罕见的内里。</p><p class="story-paragraph dialogue">“我们明天就回家吧。”我模模糊糊地擦拭着他的眼角。</p><p class="story-paragraph">眼泪本来就不应该成为我们互相刺痛的武器，从今往后，如果非要落泪，我们也都只流幸福的泪吧。</p><p class="story-paragraph">在济州岛的最后一场落日马上就要降临了，天空和海面都已经染上了绚丽的颜色。两个人坐在沙滩上给对方擦着眼泪，笨拙得像一边泪眼婆娑一边互相道歉的幼稚园小孩。但这又有什么关系呢？我们本来也就是一直这样摸索着相爱。</p><p class="story-paragraph">我们可能依旧不完美，就像夏季总有雨。但我不会再介怀今年夏天的多雨。</p><p class="story-paragraph">漫长的雨季终究是快要结束了，而我们也将会在晴天回家。</p></div>

        <header class="chapter-header">
          <span class="chapter-number">15</span>
          <h2 id="heading-chapter-15">番外</h2>
          <span class="chapter-rain" aria-hidden="true"></span>
        </header>
        <div class="story-body"><p class="story-paragraph">换乘恋爱最新季终于完美收官了。</p><p class="story-paragraph">作为韩国话题度最高的恋爱综艺，这一季从开播起就在论坛上掀起了不小的讨论热潮。大众热切地分析着每一位嘉宾的心动走向，有人主张破镜重圆，也有人赞成勇敢换乘，两派向来都是争执不下。这段时间在社交媒体首页看见带有自己名字的热帖已经成了常事，身边追更的朋友偶尔也会发来消息。</p><p class="story-paragraph dialogue screen-line">「谈恋爱真是件辛苦事啊」</p><p class="story-paragraph dialogue screen-line">「居然在录制的时候哭了那么多次吗」</p><p class="story-paragraph dialogue screen-line">「有时候看的我都替你们俩着急」</p><p class="story-paragraph dialogue screen-line">「没想到兜兜转转还是回到了一起」</p><p class="story-paragraph">当然我和郑成灿也会在每个周末蹲守节目更新，当局者迷，旁观者清，能从上帝视角去重新复盘一件事的机会是非常难得的。这种体验就像终于可以潜入水下窥探冰山全貌一样。</p><p class="story-paragraph">每一次捕捉到一些在录制过程中并不知道的细节时，我都会偷偷地转移视线去观察郑成灿的反应。当然偶尔忍不住也会故意点明了事实逗他。</p><p class="story-paragraph">郑成灿吃瘪时的表情真的很可爱，欲笑又止，眼睛亮亮的，嘴巴扁成小鸭子。窝在他怀里的时候还可以清楚地抓到瞳孔一瞬间的震颤，仿佛他心跳漏掉的这一拍是落在我手里。</p><p class="story-paragraph dialogue">“看了采访室，感觉很多细节你比我记得还清楚。”</p><p class="story-paragraph dialogue">“跟元彬和银硕在秘密聊天室对话的时候怎么表现得这么不耐烦啊。”</p><p class="story-paragraph dialogue">“买红豆饼那天其实不是顺路吧，我怎么感觉你是有意去了我公司楼下。”</p><p class="story-paragraph dialogue">“济州岛出发前一夜和我聊完天后原来自己偷偷在客厅哭吗？”</p><p class="story-paragraph dialogue">“为什么趁我在飞机上睡着了摸我的头发！所以我的头其实是被你掰过去的吧！当时还泰然地看着我道歉来着！”</p><p class="story-paragraph">我捏起拳头在郑成灿面前比划着，假意示威：“好啊！趁人之危啊！”</p><p class="story-paragraph">他若有所思地注视了我几秒，忽然将我整个人从他怀里放倒到沙发上，随即又栖身上前，宽大的身形瞬时把光遮去了大半。我仰躺着有些看不清他的脸，但从嘴角的模糊走势可以判断出此刻他定是含着笑。</p><p class="story-paragraph dialogue">“那要不要再趁人之危一点。”</p><p class="story-paragraph">声音落在耳边，带着一阵湿热的呼气，像海风。风钻进脖子里痒痒的，我不自觉地瑟缩成一团，殊不知这个动作却进一步坐实了羊入虎口的现状。</p><p class="story-paragraph dialogue">“不要这样看我，怒那。”</p><p class="story-paragraph">果然下一秒郑成灿就压低了声音贴上我的耳廓，严丝合缝的，非要把这句话完完整整地送给我似的。他贴附上来的嘴唇是软的，像金鱼摆尾时抚起的那一层绕圈的水纹。</p><p class="story-paragraph dialogue">“痒。”</p><p class="story-paragraph">我被他惹得止不住笑，尝试将身上人推开一些，但显然是徒劳。</p><p class="story-paragraph">郑成灿黏人的时候就是不折不扣的小狗，仗着不通人类的语言随意任性，眼神也变成湿漉漉的，暧昧间带着乞怜的意味。</p><p class="story-paragraph">大概没人会想到向来以沉稳一面示人的郑医生其实是撒娇的好手。</p><p class="story-paragraph dialogue">“今天晚上还有聚餐。”我象征性地啄了一下他的嘴角提醒道。</p><p class="story-paragraph">今晚换乘节目组在狎鸥亭预订了一家烤肉店用于收官庆功，所有的剧组工作人员和参演嘉宾都被邀请到场。</p><p class="story-paragraph">这句话是有效的，但效果不多。</p><p class="story-paragraph">郑成灿眨了两下眼睛终于肯挪开一只手，但随即指尖又穿插进发缝里，是揉猫咪的手法。</p><p class="story-paragraph dialogue">“一次也不可以吗？”他笑盈盈地说着让人脸红心跳的话，有时候我真的感觉郑成灿的聪明是全方位的，就连在这种事情上他也总是占我的上风。</p><p class="story-paragraph">明明我是姐姐对吧。</p><p class="story-paragraph dialogue">“随便你！”被他盯得大脑快要冒烟，我干脆缴械投降。</p><p class="story-paragraph">嘴唇上落下轻飘飘的一个吻，像接了片茸茸的羽毛。回来再说吧，郑成灿忽然就放过了我，但手指从头发上拿开的时候又不经意地划过脸颊，像猫的尾巴。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">抵达烤肉店的时候人已经差不多都到齐了，参演嘉宾被安排坐在同一桌。</p><p class="story-paragraph">其实大家结束录制回首尔后也都一直保持着联系，只是因为各自工作和生活的缘故，这样线下齐聚的机会少有。省去了很多客套的开场，酒杯相碰，话题直接就聊开了。</p><p class="story-paragraph">银硕和宥真终于将工作调整到了相近的街区，还租了一间很不错的公寓。元彬除了继续做吉他店的老板，还开始在油管上分享自作曲，音乐事业开展得如火如荼。雅贤和允在是我们这一季唯一换乘的情侣，相处了四个多月越发觉得彼此很是合拍，谈笑间都是幸福的气息。</p><p class="story-paragraph">而其他人也都重新步入了崭新的生活正轨，比如智恩的头发剪短了，我笑着说她更漂亮了，之前是玫瑰，现在像带刺的玫瑰。“防渣男。”她攥着我的手说玩笑话。</p><p class="story-paragraph dialogue">“那你们呢？”智恩扬了扬下巴，示意我和郑成灿：“你们还好吗？”</p><p class="story-paragraph dialogue">“嗯。”郑成灿先我一步回答了，没想到他在一旁烤肉的时候也一直留意着我们的对话。</p><p class="story-paragraph dialogue">“真好啊。”智恩用右手撑住头歪着脸看我，但忽然想到什么似的，眉头微微皱起来：“不过，我看了节目才知道，成灿居然偷偷进了我们的房间！”</p><p class="story-paragraph dialogue">“什么时候？”我堂皇道。</p><p class="story-paragraph dialogue">“感冒药，就那一次。”郑成灿说着把肉剪好分到我们每个人的盘里。</p><p class="story-paragraph dialogue">“嗯。你那天突然感冒得那么严重，还吓了我一跳。”智恩瘪起嘴巴，佯装生气。</p><p class="story-paragraph">回过神来的我赶忙把她拽进怀里，对不起啦，我哄着她，连带着周围的人也都笑起来。</p><p class="story-paragraph">人生能有几次这样的回忆呢？和一群人同住在一个屋檐下这么久，偶尔插科打诨，偶尔喝酒聊天到后半夜，展露最真实的自己，分享交换最隐秘的心事。这次参加换乘恋爱带给我的其实远不止我和郑成灿两人之间的收获，还有很多是关于友情，关于选择，关于成长。而这桩桩件件都是极珍贵的宝藏。</p><div class="rain-divider" aria-hidden="true"><i></i><i></i><i></i></div><p class="story-paragraph">结束聚餐回到家已经过了十二点。</p><p class="story-paragraph">摘下口罩后，我和郑成灿忽然就在玄关处对立着打量起来，他憋不住先笑出声：“鬼鬼祟祟的，又不是艺人。”</p><p class="story-paragraph">最近节目热度还在持续高涨，我们其实都接到了不少商务邀约，但除了一些双人访谈，其余的全部都被郑成灿推掉了。很多朋友都说这是发展自媒体的好机会，当然我也这样问过他。</p><p class="story-paragraph dialogue">“你想做吗？”他反问我。</p><p class="story-paragraph dialogue">“被所有人盯着谈恋爱应该不好受吧。”</p><p class="story-paragraph dialogue">“嗯，那我们就推掉。”</p><p class="story-paragraph dialogue">“可是你比我适合镜头诶。当初参加节目的时候就完全没想过曝光的事吗？”</p><p class="story-paragraph dialogue">“没有。”郑成灿摇摇头，很坚决：“只是想把你找回来。”</p><p class="story-paragraph dialogue">“就够了？”</p><p class="story-paragraph dialogue">“就够了。”</p><p class="story-paragraph">由此达成共识后，我们这段时间出行便都戴着口罩。拍摄结束后就只是相恋的普通人，我们还是都不太习惯让爱成为放在聚光灯下的展览品。</p><p class="story-paragraph">靠墙歇了一会后我嚷嚷着好热要去冰箱里找冰块吃。但刚一动身子大腿右侧的皮肤便是一阵生疼，不免倒吸了一口气。</p><p class="story-paragraph">郑成灿闻声侧过头来问我怎么了。</p><p class="story-paragraph">裙子掀起来一些才发现腿上不知道什么时候青紫了一大片，大概是在烤肉店洗手台的边缘碰了一下，但当时喝了酒人晕晕乎乎的，竟然到现在才察觉。</p><p class="story-paragraph dialogue">“痛吗？”郑成灿不由分说便把我抱到了就近的料理台上。</p><p class="story-paragraph">装好冰块，包上毛巾，他动作很快。</p><p class="story-paragraph dialogue">“不是什么大事。”酒劲还没全退，我含含糊糊地跟他搭话。</p><p class="story-paragraph">而下一秒突如其来的冰凉触感更是让我瞬间宕机了，只能咬着牙憋出来一个凉字。</p><p class="story-paragraph dialogue">“还是不小心。”郑成灿不理会我的下意识反抗，只是低着头将我的裙摆又往上推了一些，看着衣服的褶皱堆在一起，我的心脏也变得皱巴巴了。</p><p class="story-paragraph">他的手又稳又轻，是惯拿手术刀的手。冰块渗出的水把毛巾润湿了些，在皮肤上游走的时候会拖行出不甚明显的水渍。</p><p class="story-paragraph">不干脆的潮湿像反复无常的倒春寒，所到之处感觉毛发都翘立起来，被这气候戏弄的春草。</p><p class="story-paragraph dialogue">“成灿。”忍不住轻声叫了他的名字，手也不自觉地放到他蓬松的头发上。郑成灿抬起头问我怎么了，还是太凉了吗？</p><p class="story-paragraph dialogue">“不是。”我摇了摇头说就是单纯地想叫你。一呼一应，确定还在身边罢了。</p><p class="story-paragraph dialogue">“以后每次我叫你名字的时候，你都回答我好不好？”我揉了揉他的头发，每次鼓励冬天的时候，我也会这么做。</p><p class="story-paragraph">郑成灿的眼睛闪了闪，随即说好。</p><p class="story-paragraph">冰敷得差不多了，他将毛巾放到一旁准备抱我下来。但身体刚刚贴近一些，温暖的气息便把我弄得头晕目眩，于是我忽然反抱住了他。</p><p class="story-paragraph dialogue">“怒那。”</p><p class="story-paragraph">他显然是有些错愕，我的脸贴在他胸腔上的时候听见了鼓点一样的心跳。</p><p class="story-paragraph dialogue">“就这样抱一会嘛。”我哼哼唧唧，其实我黏人的时候也很可怕的，这一点郑成灿屡次认证。</p><p class="story-paragraph">忽然有笑声跟着心跳一起涌起耳朵里，怪挠人的。我慢吞吞地仰起脸问他笑什么。</p><p class="story-paragraph dialogue">“没什么，太可爱了知道吧。”郑成灿今天也喝了一些酒，此刻眼尾还留着些许红晕，淡淡的，但很漂亮，像夜里看花。</p><p class="story-paragraph dialogue">“今天出门的时候不是说回家有事吗？”我主动提起来了，在他暧昧不清的眼神攻势下。</p><p class="story-paragraph dialogue">“确实有事。”郑成灿忽然俯下身子，但在鼻尖相碰的那一刻又停了下来，他的呼吸是烫的，被烈日晒了一整天还蠢蠢欲动的潮水一般。可是不能再多停留一秒了，我感觉自己快要被这接二连三的浪拍碎了，心脏开始尖叫，于是我将他的衣领拽过来吻了上去。</p><p class="story-paragraph">我总是这样，一步一步自愿掉进郑成灿给我设好的陷阱里。</p><p class="story-paragraph">这一吻的时间好长，感觉跨进了一个全新的世纪。分开的时候已经不止是眼尾，面上也泛起了潮红，他的鼻尖隐隐有汗，嘴唇看起来也晶莹。意犹未尽的喘息勾连着，是我们两人之间刚结的蛛网。</p><p class="story-paragraph dialogue">“我先去洗了。”</p><p class="story-paragraph">方才的冲动劲头已经被完全冲散了，我把头扭到一边去，感觉现在只要一有动静我就会像兔子一样逃走。</p><p class="story-paragraph dialogue">“洗了之后呢？”郑成灿明知故问，笑容忽然放大快把我淹没。</p><p class="story-paragraph dialogue">“我是伤员诶。”我低下头支支吾吾。</p><p class="story-paragraph dialogue">“那不做了？”</p><p class="story-paragraph dialogue">“...”</p><p class="story-paragraph dialogue">“...”</p><p class="story-paragraph">郑成灿弯下腰把头歪到我跟前笑着看我。</p><p class="story-paragraph dialogue">“又不是第一次了。”</p><p class="story-paragraph">他还在笑我，可我的手指捻在一起都快要拧成一股绳。</p><p class="story-paragraph">好讨厌郑成灿。</p><p class="story-paragraph">他从浴室出来的时候我已经躲进被窝里了。</p><p class="story-paragraph">脚步声像倒计时的钟表滴答，忽然感觉到床垫有明显的下沉，我整个人又蜷缩起来。</p><p class="story-paragraph">但郑成灿把我抓进他怀里完全毫不费力，所以等我反应过来的时候人都已经在他的臂弯里了，呼吸缠绕在头顶，在耳垂，像湿腻的藤蔓。</p><p class="story-paragraph">他没有穿上衣，才刚洗完澡，裸露的皮肤还蒸腾着热气。沐浴用的精油是我选的，沉静的木质香，但此刻融浸在体温里竟显出几分情欲。</p><p class="story-paragraph">我们身上的味道是一样的。</p><p class="story-paragraph">郑成灿用一只手托住我的头，另一只手将我的左手握住，他的手指纤长，交握的时候骨节分明。指尖还在手背上打圈的时候，第一个吻就落下来了。</p><p class="story-paragraph">他的口腔里有薄荷的味道，清凉得让人眩晕，和含着冰块无异。</p><p class="story-paragraph">被子早在他上来的时候就已滑落到地上，没了任何遮挡物的庇佑，我就这样头晕目眩地被他将上身衣物推到了胸口以上。</p><p class="story-paragraph">四月首尔的温度还没回暖，突然大面积地暴露在空气中，我不禁有些发抖。</p><p class="story-paragraph dialogue">“冷吗？”</p><p class="story-paragraph dialogue">“还好。”我咬住下嘴唇，把视线移到一边。</p><p class="story-paragraph">他的呼吸和手指一并在皮肤上行走，仿佛在弹奏整个乐章最轻柔的慢板，但所到之处落脚是热的，原本冰凉的也逐渐变得发烫。</p><p class="story-paragraph">身体仿佛生出结晶来，我也成为了司汤达笔下结晶的盐树枝。</p><p class="story-paragraph">窗帘没有拉，外面高楼灯牌上的七彩霓虹灯映照进来，赤橙蓝紫，交织浓重的颜色在屋里蔓延。我们住的楼层还算高，所以听不太清马路上汽笛的声音。于是在这样静悄悄的夜晚，整个房间纯粹得仿佛全宇宙的中心，在这里永恒取代了变数，而我们只有彼此。</p><p class="story-paragraph dialogue">“可以吗？”郑成灿习惯性问我，哪怕是在欲望最浓烈的时候他也从不会为所欲为。有时候觉得他温柔得简直不真实，世界上怎么会有这么好的人呢？</p><p class="story-paragraph">得到应允后他的手指才一路向下，从胸部到腹部，再到耻骨，头发蹭在我仰起的脖颈间，像一团让人窒息的雾气。身体已然融化掉，我只能胡乱地捧住他的脸，亲吻眼睛，鼻尖和嘴角。</p><p class="story-paragraph dialogue">“我会好好做的姐姐。”郑成灿用发颤的声音说这种话的时候格外性感，努力控制几近紊乱的呼吸，手臂和脖颈上的筋脉会浮现得更加明显，蜿蜒曲折，是生命河流的走势。</p><p class="story-paragraph">混乱间胳膊肘不小心压到了大腿的青紫，我吃痛地深吸了一口气，眼角溢出眼泪。</p><p class="story-paragraph">他比我慌乱，重新俯身上来轻啄我的眼角，匍匐的姿势讨好一般。</p><p class="story-paragraph dialogue">“没关系。”我有些脱力，但还是揉了揉他的头发。</p><p class="story-paragraph">为了避免二次碰撞，这一次他把我的双腿分开了，一览无余，羞耻心大爆炸，我把头狠狠埋进他的胸口。</p><p class="story-paragraph">我仿佛不再是我了，我是深海柔软的水母，是掉进泉眼漩涡的枯叶，是被拆解开的一个个零碎的笔画部首。</p><p class="story-paragraph">在郑成灿的身下，我可以是任何存在。</p><p class="story-paragraph">而他触碰起来则是滚烫又湿腻，像受潮后还依旧熊熊燃烧的火把。</p><p class="story-paragraph">唇齿纠缠，身体已经完全失控了，我退化成初生的婴儿，迷离的双眼看不清事物，连呼吸都只能学着郑成灿的节奏。手臂再没有力气勾住脖子，滑落的瞬间他扶住我的腰肢，平托着捏造成曼妙的曲线与他迎合。</p><p class="story-paragraph">他的动作轻缓但有力，不容抗拒的，藕断丝连的，是液体自有的张力。喉间的呻吟也重叠在一起，回荡在黑暗中，是动人的和弦。</p><p class="story-paragraph dialogue">“我们会永远在一起的吧。”接近高潮的时候我凑到他身旁断断续续地耳语。每一次碰撞我们的灵魂都快要融为一体。</p><p class="story-paragraph">他没有精力答话，但眼底的海洋掀起滔天波澜，一阵一阵将我完全吞噬掉。</p><p class="story-paragraph">卧室变成末世的方舟，我们在无人知晓的深夜逃亡到天涯海角。</p><p class="story-paragraph">半夜梦醒的时候，郑成灿还抱着我。</p><p class="story-paragraph">察觉到我的动静，他迷迷糊糊睁开了眼。</p><p class="story-paragraph dialogue">“怎么醒了。”他的声音有点闷，但幼稚得可爱。</p><p class="story-paragraph dialogue">“没什么，突然在想我们的未来。”</p><p class="story-paragraph dialogue">“嗯，未来也会一直在一起的。”郑成灿思索了一会郑重地回答道。</p><p class="story-paragraph dialogue">“还好这次找回你了。”我侧过身面向他，手指凭惯性去抚摸他山根上的那颗痣。</p><p class="story-paragraph dialogue">“嗯，但是没有下一次丢掉的机会了。事不过三。”</p><p class="story-paragraph dialogue">“诶？不是就分过一次手吗？”我不解了。</p><p class="story-paragraph dialogue">“还拒绝了一次节目组不是吗？第一次邀约的时候。”</p><p class="story-paragraph dialogue">“你怎么知道的？”</p><p class="story-paragraph dialogue">“因为是我拜托他们又请了你一次。”</p><p class="story-paragraph">郑成灿翻身凑过来亲吻上我的额头。</p><p class="story-paragraph">这一吻像纯白的初雪，纯净得只有爱意。</p></div>

      </article>
    </template></div>

  <script>
    (() => {
      const chapters = [{id:"chapter-foreword",title:"Foreword"},{id:"chapter-01",title:"好久不见"},{id:"chapter-02",title:"最熟悉的陌生人"},{id:"chapter-03",title:"致曾经亲爱的你"},{id:"chapter-04",title:"你离开的季节"},{id:"chapter-05",title:"恋爱这件小事"},{id:"chapter-06",title:"只有我不行的恋爱"},{id:"chapter-07",title:"Love Me Like That（上）"},{id:"chapter-08",title:"Love Me Like That（下）"},{id:"chapter-09",title:"你懂我的吧"},{id:"chapter-10",title:"过线了会怎样"},{id:"chapter-11",title:"如果爱忘了"},{id:"chapter-12",title:"一起去看海吧"},{id:"chapter-13",title:"如果还有再见的话"},{id:"chapter-14",title:"雨季不再来"},{id:"chapter-15",title:"番外"}];
      const shell = document.getElementById('reader-shell');
      const select = document.getElementById('chapter-select');
      const prevButton = document.getElementById('prev-button');
      const nextButton = document.getElementById('next-button');
      const announcement = document.getElementById('chapter-announcement');
      const progress = document.getElementById('reading-progress');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let currentIndex = 0;

      function indexFromHash() {
        const id = location.hash.slice(1);
        const found = chapters.findIndex(chapter => chapter.id === id);
        return found >= 0 ? found : 0;
      }

      function mount(index, userInitiated = false) {
        currentIndex = Math.max(0, Math.min(index, chapters.length - 1));
        const chapter = chapters[currentIndex];
        const template = document.getElementById(`template-${chapter.id}`);
        shell.replaceChildren(template.content.cloneNode(true));
        select.value = chapter.id;
        prevButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === chapters.length - 1;
        document.title = `雨季不再来 · ${chapter.title}`;
        announcement.textContent = `已进入${chapter.title}`;
        progress.style.width = '0%';

        shell.querySelectorAll('[data-target]').forEach(button => {
          button.addEventListener('click', () => goTo(button.dataset.target, true));
        });

        if (location.hash !== `#${chapter.id}`) {
          history.replaceState(null, '', `#${chapter.id}`);
        }
        if (userInitiated) {
          window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
        }
      }

      function goTo(id, userInitiated = false) {
        const index = chapters.findIndex(chapter => chapter.id === id);
        if (index >= 0) mount(index, userInitiated);
      }

      select.addEventListener('change', () => goTo(select.value, true));
      prevButton.addEventListener('click', () => mount(currentIndex - 1, true));
      nextButton.addEventListener('click', () => mount(currentIndex + 1, true));
      window.addEventListener('hashchange', () => mount(indexFromHash(), false));
      window.addEventListener('scroll', () => {
        const available = document.documentElement.scrollHeight - innerHeight;
        const ratio = available > 0 ? Math.min(1, scrollY / available) : 0;
        progress.style.width = `${ratio * 100}%`;
      }, { passive: true });
      window.addEventListener('keydown', event => {
        if (!event.altKey) return;
        if (event.key === 'ArrowLeft' && currentIndex > 0) mount(currentIndex - 1, true);
        if (event.key === 'ArrowRight' && currentIndex < chapters.length - 1) mount(currentIndex + 1, true);
      });

      mount(indexFromHash(), false);
    })();
  </script>
