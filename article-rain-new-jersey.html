      <article class="chapter" data-chapter="chapter-01">
        <header class="chapter-header"><span class="chapter-number">01</span><h2 data-source-key="5:0">第一章</h2><p>New Jersey · Cello memoir</p></header>
        <div class="story-body"><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="6:0">0/</b><i></i></p><p class="story-paragraph" data-source-key="7:0">夹在春夏之间的日子里，总是阴雨连绵。</p><p class="story-paragraph" data-source-key="8:0">马上到来的五月，我就要飞往德国，作为大提琴首席参加慕尼黑交响乐展演。</p><p class="story-paragraph" data-source-key="9:0">这些年浑浑噩噩，所谓人生理想，竟然也实现了二分之一。</p><p class="story-paragraph" data-source-key="10:0">这是我拉琴的第十六年。</p><p class="story-paragraph" data-source-key="11:0">不长不短，刚好足够把琴弓与手臂肌腱牢牢缠绕在一起，血肉相连，再不分彼此。</p><p class="story-paragraph" data-source-key="12:0">又或许只是我的盲目自信，毕竟也曾与某人亲密无间，两个人连疼痛都同频，还以为是携手一生的缘分。</p><p class="story-paragraph" data-source-key="13:0">现在只偶尔听到他的消息，什么大赏又拿了一位，什么典礼又获得了奖项，是十年如一日的出类拔萃。</p><p class="story-paragraph" data-source-key="14:0">于是我内心那点泛黄的愧怍，也有了抚平的迹象。</p><p class="story-paragraph" data-source-key="15:0">舞台上，眉目俊美的男子举起奖杯，自然流畅地说着获奖感言，我却没来由觉得陌生。</p><p class="story-paragraph" data-source-key="16:0">只想起多年前二人结伴参加柴可夫斯基青少年组表演赛，那是我们的第一个国际赛事，两个十四岁的稚嫩小孩，却在一众少年英才里突出重围，载誉而归。</p><p class="story-paragraph" data-source-key="17:0">第一次面对那么多记者和闪光灯，他比我还要堂皇，捏我的手心问「怎么办怎么办」，我笑他胆小鬼，只能挡在他身前替他发言。</p><p class="story-paragraph" data-source-key="18:0">掌心还留有他汗水的湿润，一切好像就发生在昨天。</p><p class="story-paragraph" data-source-key="19:0">可现实是十年时光如水般淌过——</p><p class="story-paragraph" data-source-key="20:0">一个人抬眼就能望见演奏厅璀璨的吊顶，另一个则信步踏上了尖叫欢呼的霓虹舞台。</p><p class="story-paragraph" data-source-key="21:0">山高水长，经年不见。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="22:0">1/</b><i></i></p><p class="story-paragraph" data-source-key="23:0">我六岁就展现出了惊人的声乐天赋，不管琴有多破，总是可以演奏出很美妙的声音。</p><p class="story-paragraph" data-source-key="24:0">当然，被砸烂的琴除外——我父亲某日犯起躁郁症，抡起我的大提琴就往墙上砸，琴弦和外壳零碎一地。</p><p class="story-paragraph" data-source-key="25:0">他嘶吼道:「别拉了！我叫你别拉了！」</p><p class="story-paragraph" data-source-key="26:0">我心中惊惧，愣在原地一句话也说不出。</p><p class="story-paragraph" data-source-key="27:0">那时他们正在协议离婚，事后只是随意丢下一句: 「让你母亲带你去美国，重新买一架吧。」</p><p class="story-paragraph" data-source-key="28:0">于是我坐上了去往新泽西的飞机，跨过遥远的海域，在一家卖琴的旧店里同Anton不期而遇。</p><p class="story-paragraph" data-source-key="29:0">五官秀气的小男孩，和我相中了同一架大提琴，各自都不肯谦让。</p><p class="story-paragraph" data-source-key="30:0">小小的Anton回身望着自己的提琴教授，又强调了一遍: 「I really like this one. 」</p><p class="story-paragraph" data-source-key="31:0">声线是稚气未脱的可爱与黏糊。</p><p class="story-paragraph" data-source-key="32:0">我那时秉着「天才少女」的名号，断定他不过是个拿乐器当玩具的调皮男孩儿，于是顺应着自己的虚荣心，当场演奏了一首我最爱的曲子——《杰奎琳之泪》。</p><p class="story-paragraph" data-source-key="33:0">琴声如泣如诉，哀怨又沉重。</p><p class="story-paragraph" data-source-key="34:0">一曲毕，却是他身后的教授第一个鼓起掌。</p><p class="story-paragraph" data-source-key="35:0">他笑着问:「小姑娘，你愿意做我的学生吗？」</p><p class="story-paragraph" data-source-key="36:0">我疑惑地去望这个白眉毛的西方人，回想起总在琴谱扉页瞥见他的面容。</p><p class="story-paragraph" data-source-key="37:0">原来是一位德高望重，隐在雾中的音乐家。</p><p class="story-paragraph" data-source-key="38:0">断然不会犹豫，我在他们的注视下轻轻点了点头。两个半大孩童的目光在半空中相遇，都带着些许好奇和探究。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="39:0">2/</b><i></i></p><p class="story-paragraph" data-source-key="40:0">那把大提琴最终归我所有，是怀特教授赠给我的入门礼物。</p><p class="story-paragraph" data-source-key="41:0">Anton不愉快起来，大抵认为我不仅抢了他的琴，还抢走了他的老师。</p><p class="story-paragraph" data-source-key="42:0">我心中也忿忿，不觉得他比我更有才华，直到某日Anton的搭档请假，我们被迫一起练习，却是惊人的默契。</p><p class="story-paragraph" data-source-key="43:0">同样精准的音感，同样信手拈来的姿态。</p><p class="story-paragraph" data-source-key="44:0">我扭头惊讶地看向他，猜想那天我演奏《杰奎琳之泪》时，他是不是也有同样的感觉。</p><p class="story-paragraph" data-source-key="45:0">怀特教授望见我们，二人连揉弦时身体的摆动幅度都相同，于是兴致盎然的挑起了眉。</p><p class="story-paragraph" data-source-key="46:0">Anton则是同我对望着，狡黠地扬起嘴角，于是我也忍不住笑了。</p><p class="story-paragraph" data-source-key="47:0">我们比同龄人走得快了太多，孤独了太久，此刻如同遇到了高山流水的知音，于是心有灵犀地相视一笑。</p><p class="story-paragraph" data-source-key="48:0">那之后我们就一起上课，共享同一个琴房，十来岁的我们背着比自己还要大的琴盒，穿梭在新泽西或繁荣或孤瑟的街道上。</p><p class="story-paragraph" data-source-key="49:0">我入门晚，怀特教授讲的一些指法和技巧，我并不能马上领会，只能课后泡在琴房里加练。</p><p class="story-paragraph" data-source-key="50:0">每次我练习，Anton也要借口留下来，最后又和我一起离开。</p><p class="story-paragraph" data-source-key="51:0">琴房窗户大开，夏季的风吹起纱帘，散去一室闷热。Anton就坐在我身侧，或是看书或是写作业，在遇到瓶颈时又会悄悄开口，教给我正确的指法。</p><p class="story-paragraph" data-source-key="52:0">我问你怎么还不回家，他就支支吾吾道一句: 「我妈妈说不能让女孩子晚上一个人回家。」</p><p class="story-paragraph" data-source-key="53:0">闻言我忍不住笑起来，他红着一张脸，难为情地过来推我的肩膀。</p><p class="story-paragraph" data-source-key="54:0">我把琴弓收进盒子里，又笑着去哄他: 「别生气了，我今天请你吃冰淇淋。」</p><p class="story-paragraph" data-source-key="55:0">我还记得Anton最喜欢柏林路上的那家哈根达斯，巧克力味的。</p><p class="story-paragraph" data-source-key="56:0">「没有巧克力的话，哈密瓜味也可以哦。」抱着一桶冰淇淋的Anton凑过来补充。</p><p class="story-paragraph" data-source-key="57:0">我无奈地耸耸肩，随后还是把「哈密瓜味」也加进了备忘录里。</p><p class="story-paragraph" data-source-key="58:0">彼时我们已经一同加入费城交响乐团，是乐团里年纪最小的两个人。</p><p class="story-paragraph" data-source-key="59:0">我们每天要花四小时在乐团里排练，结束后还要赶到怀特教授家里上课，不提我们还有学业要兼顾。</p><p class="story-paragraph" data-source-key="60:0">时间永远不够用，不是背着沉重的琴盒一路狂奔，就是跳进林肯后座倒头便睡。</p><p class="story-paragraph" data-source-key="61:0">即使累成这样，Anton也要坚持送我回家，陪我走过最黑的那一段路，然后在路灯下同我挥手告别，对我说明天见。</p><p class="story-paragraph" data-source-key="62:0">很多次到了卧室阳台低头一看，他还静静站在原地。</p><p class="story-paragraph" data-source-key="63:0">Anton在乐团里多少有些羞涩安静，可背过众人，在飞速奔驰的汽车后座，他也会靠在我的肩上，黏糊糊地，抱怨自己好困好累。</p><p class="story-paragraph" data-source-key="64:0">我笑了起来，伸手摸摸他的脸，才发现他早已睡着了，于是自己也闭上了眼。</p><p class="story-paragraph" data-source-key="65:0">多少个四季的午后我们都是如此。</p><p class="story-paragraph" data-source-key="66:0">窗外景色飞驰，而我们二人交颈相依，风声雨声一并远离，只能听见彼此的沉沉呼吸。</p><p class="story-paragraph" data-source-key="67:0">像是两根相邻的琴弦，风一吹，就要亮出同样的音色。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="68:0">3/</b><i></i></p><p class="story-paragraph" data-source-key="69:0">曾有人评价莫扎特说，天才的童年是悲剧的童年。</p><p class="story-paragraph" data-source-key="70:0">我不敢比肩莫扎特，也不想自诩什么天才，可要说我的少年时代是一部悲剧，那Anton大抵是剧中较为明亮的那几帧。</p><p class="story-paragraph" data-source-key="71:0">我们吃过同一碟食物，喝过同一杯水，共享过有线耳机和行李箱，衣服混穿到分不清主人，最凄惨的时候两个人躲在演出舞台后面，饿得头昏眼花，只能分食一个小小的三角饭团，我一半他一半。</p><p class="story-paragraph" data-source-key="72:0">吃着吃着，我突然崩溃大哭，搂住他的脖子说Anton我好累好饿，我不想拉琴了。</p><p class="story-paragraph" data-source-key="73:0">他无措的帮我擦眼泪，不知道该怎么办，只能把一整个饭团都留给我。</p><p class="story-paragraph" data-source-key="74:0">在染着悲剧底色的青春期里，我们是最最亲密的人。</p><p class="story-paragraph" data-source-key="75:0">每次乐团里的哥哥姐姐打趣我们是「金童玉女」「青梅竹马」，Anton都会涨红了脸颊和耳朵，轻轻反驳一句「别胡说」，最后又像是怕我多想似的，用余光偷偷的瞟我。</p><p class="story-paragraph" data-source-key="76:0">那是排练间隙的琐碎闲聊，一小段愉快的时光。</p><p class="story-paragraph" data-source-key="77:0">在乐团待到十五岁，我与Anton分别担任大提琴副首席一号和副首席二号，坐在离指挥台很近的位置。</p><p class="story-paragraph" data-source-key="78:0">我们面貌青涩，不拉琴时在众人之间总是有些突兀。可当演出开始，第一个音符从我们指下飘出，就再没有人会怀疑我们副首席的身份。</p><p class="story-paragraph" data-source-key="79:0">我们在舞台上如此契合，离开演奏厅，却也不是没有过龃龉。</p><p class="story-paragraph" data-source-key="80:0">我在学业上只是按部就班，又因为那讳莫如深的家世，几乎没有什么朋友，可Anton同我不一样，他讲话风趣，又很爱笑，所以其实他并不缺朋友。</p><p class="story-paragraph" data-source-key="81:0">有几次他故意缺席乐团的庆功宴，悄悄跟我说朋友们在等他。</p><p class="story-paragraph" data-source-key="82:0">他们一起游泳，跑到沙滩上办派对，Anton给我发来讯息，照片上他笑得很开心，身边有好多好多人。</p><p class="story-paragraph" data-source-key="83:0">留我一个人待在无聊乏味的宴席上，冷脸围观一群成年人喝得烂醉，接受他们无厘头的盘问和打趣。</p><p class="story-paragraph" data-source-key="84:0">于是看到那张照片，看到那么开心的Anton，心中便涌起无端的委屈和责怪。</p><p class="story-paragraph" data-source-key="85:0">好像是被父母不管不顾丢到午托班的孩子，越孤独就越委屈，越委屈就越想念。</p><p class="story-paragraph" data-source-key="86:0">那时候我还不懂为什么，后来才后知后觉，原来是可怕的占有欲在作祟。</p><p class="story-paragraph" data-source-key="87:0">庆功宴结束，Anton等在门口要送我回家，我还怨怼着他，干脆无视他转身就走，他喊我的名字，疑惑问我怎么了。</p><p class="story-paragraph" data-source-key="88:0">Anton追上我，很自然的拉起我的手，又温声问了一遍: 「怎么不开心？是不是聚会太无聊了？」</p><p class="story-paragraph" data-source-key="89:0">心里早就打好了讨伐的腹稿，却在看到他神情的那一秒败下阵来。</p><p class="story-paragraph" data-source-key="90:0">我带着哭腔坦白道:「你不在，我就会害怕。」</p><p class="story-paragraph" data-source-key="91:0">只半句，他已然是懂了，再没有比他更了解我的人了。</p><p class="story-paragraph" data-source-key="92:0">Anton扬起嘴角笑了，露出一排齐整的牙齿，眼睛像月牙儿一般。</p><p class="story-paragraph" data-source-key="93:0">他打趣道: 「原来是这样，原来你是胆小鬼。」</p><p class="story-paragraph" data-source-key="94:0">又把我环在怀里，在我耳边很认真的说: 「对不起，是我错了，我不该把你丢下。」</p><p class="story-paragraph" data-source-key="95:0">我羞得满脸通红，像只鸵鸟一样埋起头。</p><p class="story-paragraph" data-source-key="96:0">明明从前也不是没有拥抱过，多少次拿了奖杯都要搂着对方合影，从来没有觉得这么别扭。</p><p class="story-paragraph" data-source-key="97:0">抱了好一会，我才找回力气推开他，前言不搭后语:「你回去.…….我要回家了。」</p><p class="story-paragraph" data-source-key="98:0">抬眼去瞟他，他也正是满脸羞涩的笑。</p><p class="story-paragraph" data-source-key="99:0">Anton最后还是把我送到楼下，像以往无数次一样同我挥手告别，可我们都隐隐意识到，那夜连星空都特别。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="100:0">4/</b><i></i></p><p class="story-paragraph" data-source-key="101:0">在乐团前往纽约参加演出的前几天，我的状态突然变得很差，手臂没了力气，看到琴便心生厌烦。</p><p class="story-paragraph" data-source-key="102:0">Anton发现后也停下了练习，讲些冷笑话转移我的注意力，又像是突然想到什么似的，冷不丁问我:</p><p class="story-paragraph" data-source-key="103:0">「你想去游泳吗？」</p><p class="story-paragraph" data-source-key="104:0">我当然不会游，可那时正是新泽西最适合游泳的天气。</p><p class="story-paragraph" data-source-key="105:0">望着那双真挚的眼睛，我鬼使神差的点点头。</p><p class="story-paragraph" data-source-key="106:0">怀特教授假装看不见我们逃课，Anton便拉起我的手跑到他最熟悉的游泳馆里，献宝似的说要教会我。</p><p class="story-paragraph" data-source-key="107:0">我没有泳衣，只能掀起裙摆把小腿伸进泳池里过个瘾。</p><p class="story-paragraph" data-source-key="108:0">Anton则规规矩矩换上泳帽泳裤，我一回身就见他从更衣房里出来，白皙的皮肤上肌肉线条清晰可见，我立刻别开了眼。</p><p class="story-paragraph" data-source-key="109:0">他跳进泳池，游到我身边来，问我怎么不下水。</p><p class="story-paragraph" data-source-key="110:0">我因心虚而蹩脚地不敢看他，Anton干脆捧起我的脸，委屈问我:「怎么了？你不喜欢这里吗？」</p><p class="story-paragraph" data-source-key="111:0">又难免瞟到他，于是我立刻变成了一个被捧着的红番茄。</p><p class="story-paragraph" data-source-key="112:0">恼羞成怒，伸手去推他却被灵巧地躲开，我扑了个空，下一秒就因惯性掉进了泳池里，水花溅得很高。</p><p class="story-paragraph" data-source-key="113:0">当然是惊慌地尖叫和挣扎，直到Anton抓住我的肩膀温声安抚我:</p><p class="story-paragraph" data-source-key="114:0">「不要害怕，有我在呢。」</p><p class="story-paragraph" data-source-key="115:0">我安静下来，发现自己又被他抱在怀里。</p><p class="story-paragraph" data-source-key="116:0">两个人都是湿淋淋的浮在水中，四目相对，周遭一切像被按下暂停键。</p><p class="story-paragraph" data-source-key="117:0">那时那地，我才终于意识到是什么变了。</p><p class="story-paragraph" data-source-key="118:0">是逐渐生出的性别意识，是他凸出的喉结，是我鼓起的胸脯，以及我们无力抗拒的异性荷尔蒙。</p><p class="story-paragraph" data-source-key="119:0">是缠绕夜晚的那些绮丽梦境，男男女女，唇齿相接，身体随着呼吸律动，垂眸去望，原来是一张讳莫如深的面孔。</p><p class="story-paragraph" data-source-key="120:0">于是再不清白。</p></div>
      </article>
    </template><template id="chapter-02">
      <article class="chapter" data-chapter="chapter-02">
        <header class="chapter-header"><span class="chapter-number">02</span><h2 data-source-key="122:0">第二章</h2><p>New Jersey · Cello memoir</p></header>
        <div class="story-body"><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="123:0">5/</b><i></i></p><p class="story-paragraph" data-source-key="124:0">两人都正处在一个言行随心所欲，不会考虑也不会在乎后果的年纪。即使演出在即，也要旷了排练跑到游泳馆疯玩。</p><p class="story-paragraph" data-source-key="125:0">后果就是我的免疫力告罄，夜里发起高烧，都到了几乎昏厥的程度，还记得问一句Anton怎么样了。</p><p class="story-paragraph" data-source-key="126:0">怀特教授恨铁不成钢的数落我道：「Anton自己天天游泳，能有什么事，倒不如担心下你自己。」</p><p class="story-paragraph" data-source-key="127:0">他的言下之意是我可以养病，纽约的演出却不能因此推迟。</p><p class="story-paragraph" data-source-key="128:0">最终乐团决定让另一位女大提琴手顶替我的位置，与Anton共同演奏副首席的双人合奏部分。</p><p class="story-paragraph" data-source-key="129:0">整个乐团里五十几号人，只有Anton举手反对。团长也有些动气，问他道:</p><p class="story-paragraph" data-source-key="130:0">「你凭什么反对？适可而止吧Anton，难道要全团的人都为你们的错误买单吗？」</p><p class="story-paragraph" data-source-key="131:0">Anton也知道自己理亏，憋红了脸一句话都没有说，转身就跑到医院来找我诉苦。</p><p class="story-paragraph" data-source-key="132:0">看到浑身乏力躺在病床上打点滴的我，他一副欲言又止的模样，站在原地低头绞起了衣角。</p><p class="story-paragraph" data-source-key="133:0">我有些好笑的看着他:「你怎么了？」</p><p class="story-paragraph" data-source-key="134:0">「对……对不起，都怪我，你才会生病的。」</p><p class="story-paragraph" data-source-key="135:0">Anton立在病床旁，垂下一双雾蒙蒙的眼睛看我，声音还可怜兮兮地黏在一起。</p><p class="story-paragraph" data-source-key="136:0">「都是我的错，你不能去纽约了。」</p><p class="story-paragraph" data-source-key="137:0">他态度诚恳，继续认错。</p><p class="story-paragraph" data-source-key="138:0">我憋住笑意，故意蹙起眉踢了他一脚，哀戚戚道: 「是啊，我期待了很久呢，你打算怎么赔偿我呢Anton？」</p><p class="story-paragraph" data-source-key="139:0">「.…….我去给你买哈根达斯！你想要草莓味还是柠檬味？」</p><p class="story-paragraph" data-source-key="140:0">他揉了揉被我踢的地方，扬起一张灿烂笑脸。</p><p class="story-paragraph" data-source-key="141:0">我翻了个白眼:「哪有人生病还吃冰淇淋的，你就不能盼我点好吗？」</p><p class="story-paragraph" data-source-key="142:0">又正色道:「你这次顺顺利利去演出，就算是对我的补偿了。」</p><p class="story-paragraph" data-source-key="143:0">「可是……. 」</p><p class="story-paragraph" data-source-key="144:0">Anton有些气愤地欲言又止，我知道他想说什么。</p><p class="story-paragraph" data-source-key="145:0">那个顶替我的人，因为嫉妒我年纪这么小就能当上副首席，曾经往我的备用琴上喷腐蚀剂，好好的一架大提琴只能被丢掉。</p><p class="story-paragraph" data-source-key="146:0">Anton当时想去找她理论，被我拦住了。</p><p class="story-paragraph" data-source-key="147:0">我很平静地把琴扔进垃圾堆，说和这种人计较什么呢。</p><p class="story-paragraph" data-source-key="148:0">有些人的恨是没有原因的，他们平庸，没有天份，碌碌无为，于是你的优秀，你的才华，你的善良和幸福都成了原罪。</p><p class="story-paragraph" data-source-key="149:0">「没关系，我们还会有很多机会一起演奏的，对吧？」</p><p class="story-paragraph" data-source-key="150:0">面上漾起安抚的笑容，我扯住他的衣袖摇晃了一下。</p><p class="story-paragraph" data-source-key="151:0">Anton垂眸看着我的眼睛，最终点了点头。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="152:0">6/</b><i></i></p><p class="story-paragraph" data-source-key="153:0">乐团很快飞往纽约，进行为期三天的演出活动。</p><p class="story-paragraph" data-source-key="154:0">Anton像是怕我一个人无聊似的，每天都很乖巧的给我发信息。</p><p class="story-paragraph" data-source-key="155:0">「酒店早餐是烤面包片和沙拉，难吃死了。」</p><p class="story-paragraph" data-source-key="156:0">「去彩排啦。」</p><p class="story-paragraph" data-source-key="157:0">「司机车技很烂，我快吐了呜呜……每天都在想念我们家的林肯。」</p><p class="story-paragraph" data-source-key="158:0">「你的盐水瓶滴完了记得换！！!每次都流血了！」</p><p class="story-paragraph" data-source-key="159:0">「演出前十分钟，耶。」</p><p class="story-paragraph" data-source-key="160:0">我点开他最后发来的那张自拍，Anton换上了黑色的演出服，脸上落了妆，勾起嘴角朝镜头比了个剪刀手。</p><p class="story-paragraph" data-source-key="161:0">领带估计是自己打的，歪歪扭扭。</p><p class="story-paragraph" data-source-key="162:0">以前都是我帮他打领带，他帮我系裙子后面的蝴蝶结，导致他现在系的蝴蝶结比女孩子系的都要漂亮。</p><p class="story-paragraph" data-source-key="163:0">每次我拿这件事调侃他，他都要捂着耳朵叫我别说了。</p><p class="story-paragraph" data-source-key="164:0">我没来得及回复他，因为怀特教授见到我出现在演奏厅门口，十分惊讶，我连忙示意他别声张。</p><p class="story-paragraph" data-source-key="165:0">看到Anton发的那么多信息，又因为那莫名的心灵感应，总猜测着他心里是不是同我一样空落落。</p><p class="story-paragraph" data-source-key="166:0">于是连夜买了机票飞过来，所有人都还蒙在鼓里。</p><p class="story-paragraph" data-source-key="167:0">弯着腰溜到前排坐下，演出还没开始。</p><p class="story-paragraph" data-source-key="168:0">Anton冷着脸坐在指挥台旁，很不开心的模样，和自拍里的开朗剪刀手十分割裂，我差点笑出声。</p><p class="story-paragraph" data-source-key="169:0">各部门乐器就位，我趁机站起来扬声喊他:</p><p class="story-paragraph" data-source-key="170:0">「Anton Lee!加油哦！」</p><p class="story-paragraph" data-source-key="171:0">说完自顾自鼓起掌，周围有人认出我们，响起了善意的哄笑声和掌声。</p><p class="story-paragraph" data-source-key="172:0">Anton怔愣抬起头，下一秒就和笑意吟吟的我对上了目光。</p><p class="story-paragraph" data-source-key="173:0">于是他也翘起嘴角露出一个笑来，眼睛亮亮的。</p><p class="story-paragraph" data-source-key="174:0">很快又害羞地低下头去，不再敢望我。</p><p class="story-paragraph" data-source-key="175:0">于是我第一次作为观众聆听了Anton的演出，看他神态自若，琴弓在空中挥出完美的痕迹，乐声悠扬而沉郁。</p><p class="story-paragraph" data-source-key="176:0">我沉浸在交响乐中，几乎要落泪了:</p><p class="story-paragraph" data-source-key="177:0">Anton从来都是天生的大提琴家。</p><p class="story-paragraph" data-source-key="178:0">演出结束后，Anton兴奋地跳下舞台朝我奔过来，我怀抱一大束白玫瑰站在原地，对他祝贺道:</p><p class="story-paragraph" data-source-key="179:0">「演出顺利！」</p><p class="story-paragraph" data-source-key="180:0">这是哪一年的事情，我不太记得清了，因为我们相互扶持的岁月里有无数个这样的瞬间。</p><p class="story-paragraph" data-source-key="181:0">不用开口说一个字，只是笑意盈盈地望着彼此，一切就能干戈化玉帛，蜿蜒变坦途。</p><p class="story-paragraph" data-source-key="182:0">似乎永远都走在通往光明的康庄大道之上。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="183:0">7/</b><i></i></p><p class="story-paragraph" data-source-key="184:0">十六岁的时候，我与Anton一同考入新泽西州立高中，两个人更是形影不离。</p><p class="story-paragraph" data-source-key="185:0">搭同一辆车上下学，连午饭都是一式两份，又因为同样出众的才华和名气，我们在十六七岁的荷尔蒙群体里简直成了众矢之的。</p><p class="story-paragraph" data-source-key="186:0">在同学们口中，我的名字后面必然跟着Anton的名字，两人到底是什么关系，成了他们热烈讨论的话题，甚至私下发起了匿名投票。</p><p class="story-paragraph" data-source-key="187:0">我曾经不小心点进去看到过，大部分人觉得我们是有亲缘关系的兄妹或姐弟，其他高票认为我们是「要好的伙伴」，只有一小部分投给了「情侣」选项。</p><p class="story-paragraph" data-source-key="188:0">我们到底是什么关系呢？偶尔连自己都会疑惑。</p><p class="story-paragraph" data-source-key="189:0">于是干脆截图发给了Anton，以调侃的口吻让他看热闹。</p><p class="story-paragraph" data-source-key="190:0">信息很快显示已读，但是一直没有回复。</p><p class="story-paragraph" data-source-key="191:0">我了然地摁灭了手机，干巴巴的笑了一下。</p><p class="story-paragraph" data-source-key="192:0">有时会怀疑我们真是一双失散的兄妹，因为就连沉默这种事情，我们都表现出了惊人的的默契。</p><p class="story-paragraph" data-source-key="193:0">正式跨入青春期的节点到底是什么，我到现在都没弄清楚。</p><p class="story-paragraph" data-source-key="194:0">可能是Anton猛然窜高的个子，我踮起脚再也抢不到他手里的三明治；可能是我再也没见过Anton掉眼泪，明明不久之前还很爱哭来着；可能是我们都默契地藏起了人拜托自己转交给对方的情书，被发现后两个人又尴尬又别扭，冷战了一个早上。</p><p class="story-paragraph" data-source-key="195:0">给我寄情书的男孩之一非常有毅力，他把我堵在学校门口，懒洋洋倚在一辆帅气的机车旁，扬言要带我去兜风。</p><p class="story-paragraph" data-source-key="196:0">彼时Anton已经先一步钻进了汽车后座，侧过脸来莫测地望我们，脸上没有一丝笑意，大概是催促的意思。</p><p class="story-paragraph" data-source-key="197:0">我敲了敲背上的琴盒，不好意思的笑起来:</p><p class="story-paragraph" data-source-key="198:0">「抱歉，我马上要去上提琴课，谢谢你的好意。」</p><p class="story-paragraph" data-source-key="199:0">面前这个金发碧眼的男孩却并不气馁，他问我上课的地址，说要在那里等我。</p><p class="story-paragraph" data-source-key="200:0">我几乎保持不住笑容，连忙逃走。</p><p class="story-paragraph" data-source-key="201:0">Anton大概是等得不耐烦了，抱起手臂冷哼了一声，我在他看不见的地方无声耸了耸肩，并不打算理他。</p><p class="story-paragraph" data-source-key="202:0">那段时间我们之间的气氛越来越奇怪，Anton动不动就要阴阳怪气刺我几句，我忍得够久了。</p><p class="story-paragraph" data-source-key="203:0">「怎么，机车不比大提琴有趣得多？」</p><p class="story-paragraph" data-source-key="204:0">他又来了。</p><p class="story-paragraph" data-source-key="205:0">我扭过头问他:「你是不能好好说话吗？非要这样？」</p><p class="story-paragraph" data-source-key="206:0">他也不甘示弱，干脆翻起旧账:</p><p class="story-paragraph" data-source-key="207:0">「不能好好说话的是你。昨天在餐厅你说吃什么随便，我就给你点了意面，结果你一整天没理我，你难道不应该跟我道歉吗？」</p><p class="story-paragraph" data-source-key="208:0">「你点的意面有番茄酱！明明知道我最讨厌番茄酱，你敢说不是故意的？」</p><p class="story-paragraph" data-source-key="209:0">「是服务员弄错了啊，我昨天解释了一百遍，道歉了一百遍，可你今天还要丢下我去骑机车！你太过分了！」</p><p class="story-paragraph" data-source-key="210:0">Anton大概是真气得狠了，控诉得满脸通红，像个小动物似的，又可怜又好笑。</p><p class="story-paragraph" data-source-key="211:0">我差点维持不住严肃，想去掐他的脸颊肉了。</p><p class="story-paragraph" data-source-key="212:0">又听见他委委屈屈的，提起冷战的旧事:</p><p class="story-paragraph" data-source-key="213:0">「还有之前你藏了隔壁班女生写给我的情书，还有你……」</p><p class="story-paragraph" data-source-key="214:0">我连忙喊停:</p><p class="story-paragraph" data-source-key="215:0">「你什么意思，好像你没藏我的似的….我的还多一封呢。」</p><p class="story-paragraph" data-source-key="216:0">他忍不住吐槽道:</p><p class="story-paragraph" data-source-key="217:0">「什么多一封啊？明明是刚才那个黄毛小子写了两封….」</p><p class="story-paragraph" data-source-key="218:0">沉默一瞬，下一秒两个人都不顾形象大笑起来。</p><p class="story-paragraph" data-source-key="219:0">Anton笑得靠到我身上，我捶他的肩膀喊他滚开，他就耍赖把手伸进我颈窝里挠痒痒，还做着鬼脸说:</p><p class="story-paragraph" data-source-key="220:0">「番茄意面唔…….多吃点吧番茄意面….….」</p><p class="story-paragraph" data-source-key="221:0">两个人在车厢里闹作一团。</p><p class="story-paragraph" data-source-key="222:0">是上一秒急赤白脸下一秒就能捧腹大笑的，十六岁的我们。</p></div>
      </article>
    </template><template id="chapter-03">
      <article class="chapter" data-chapter="chapter-03">
        <header class="chapter-header"><span class="chapter-number">03</span><h2 data-source-key="224:0">第三章</h2><p>New Jersey · Cello memoir</p></header>
        <div class="story-body"><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="225:0">8/</b><i></i></p><p class="story-paragraph" data-source-key="226:0">再完美再密不可分的关系，也早已停滞在多年前某个昨天了。</p><p class="story-paragraph" data-source-key="227:0">演出当天慕尼黑还在落雪，是一年之中最冷最坚硬的季节。</p><p class="story-paragraph" data-source-key="228:0">新泽西不会有这样的天气，除开横跨春夏的漫长雨季，那里一整年的阳光都很好。</p><p class="story-paragraph" data-source-key="229:0">顺利谢幕后，我收拾好乐器正准备离开，却瞟见团长正揪着一个小男孩大声训话，问他为什么又故意偷懒，仗着自己年纪小，就知道使小聪明。</p><p class="story-paragraph" data-source-key="230:0">我失笑了一下，难免多看几眼。</p><p class="story-paragraph" data-source-key="231:0">男孩是不久前才破格录入的新人，打破了纽约爱乐团从不招收少年演奏者的传统。</p><p class="story-paragraph" data-source-key="232:0">这样的人，当然是绝对的天赋异禀，旁人争得头破血流的东西，他自出生起就已经早早攥在手里了。</p><p class="story-paragraph" data-source-key="233:0">我与Anton少年时代的成就已经足够令人咂舌，可这个男孩比起我们，只会更加璀璨夺目。</p><p class="story-paragraph" data-source-key="234:0">这就是少年英才的世界，从不讲求公平，也没有努力一说。我费尽半生，不过才堪堪叩响了它的大门。</p><p class="story-paragraph" data-source-key="235:0">团长走后，男孩回身见我还站在原地，于是朝我走来，喊我一声「姐姐」。</p><p class="story-paragraph" data-source-key="236:0">我打趣他道:「又惹他生气了吧？这个月第几次了？」</p><p class="story-paragraph" data-source-key="237:0">他有些窘迫地挠挠头，又突然想起什么似的，翻出手机亮给我看。</p><p class="story-paragraph" data-source-key="238:0">又问我:「姐姐，我昨天逛推特的时候看到了这个，这个人是不是你呀？」</p><p class="story-paragraph" data-source-key="239:0">我疑惑去瞧，原来是多年前为成人礼演奏会拍摄的一张双人海报。</p><p class="story-paragraph" data-source-key="240:0">我与Anton背对背立在画面中央，各自扶了一架大提琴，不卑不亢直视着镜头。</p><p class="story-paragraph" data-source-key="241:0">还记得Anton选了那套白色西装，拍摄时总爱翘起嘴角，我偏偏反其道行之，穿的是纯黑色的礼裙，有些叛逆的风格，神情挑衅地看向镜头。</p><p class="story-paragraph" data-source-key="242:0">两个意气风发的少年人，一黑一白，是将要在众人仰望的乐坛里呼风唤雨的存在。</p><p class="story-paragraph" data-source-key="243:0">当年海报发出后，我们在网络上收获了大量关注，有很多从不听交响乐的人也从各地慕名而来。</p><p class="story-paragraph" data-source-key="244:0">想起这些，我笑容淡淡:</p><p class="story-paragraph" data-source-key="245:0">「对，很久以前拍的，没想到还能看见。」模糊又听见男孩说起什么「好看」「帅气」之类的，我只自顾自径直离开，生怕一步踏错，又要扎进那名为过往的混沌漩涡之中。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="246:0">9/</b><i></i></p><p class="story-paragraph" data-source-key="247:0">加入纽约爱乐团坐上大提琴首席的位置，以及受邀去往维也纳金色大厅办一场独奏会，是我自十来岁时起就定下的人生理想。</p><p class="story-paragraph" data-source-key="248:0">我问Anton他的人生理想是什么，他想了很久告诉我说:</p><p class="story-paragraph" data-source-key="249:0">「我喜欢音乐，也喜欢我的家人，所以我不会放弃音乐，也想永远和家人站在一起。」</p><p class="story-paragraph" data-source-key="250:0">Anton拥有很爱他的家庭，我到他家做客的时候，他弟弟总会缠着我让我陪他玩。</p><p class="story-paragraph" data-source-key="251:0">我刻意不去回想儿时被父亲砸烂的大提琴，转而笑着对Anton点了点头。</p><p class="story-paragraph" data-source-key="252:0">却听见他又对我说:</p><p class="story-paragraph" data-source-key="253:0">「可是你一个人做首席也太可怜了，那我就勉为其难当一下副首席吧，就在你身后，怎么样？」</p><p class="story-paragraph" data-source-key="254:0">见我不说话，他继续嘟嘟囔囔:</p><p class="story-paragraph" data-source-key="255:0">「好吧好吧，金色大厅也陪你去，我就在台下当你的听众，就像你上次那样……是不是还得准备祝贺花呀？你不是嫌百合臭吗，我就偏要送百合，看你怎么办。」</p><p class="story-paragraph" data-source-key="256:0">他故意逗我，还以为我会笑骂他还击。</p><p class="story-paragraph" data-source-key="257:0">哪知道我闻言愣了很久——</p><p class="story-paragraph" data-source-key="258:0">惊觉我们二人是如此紧密地缠绕着彼此的人生，是连梦想都可以重合的关系了。</p><p class="story-paragraph" data-source-key="259:0">拍摄完海报，我们正式开始为十八岁的成人礼着手排练。</p><p class="story-paragraph" data-source-key="260:0">我们曾跟随乐团参加过很多表演，可是属于自己的演奏会，这还是第一次。</p><p class="story-paragraph" data-source-key="261:0">选曲目的时候我非要把《杰奎琳之泪》当做开场曲，理由是「这可是我们第一次见面的时候拉的曲子」，怀特教授立在一旁点头微笑，Anton拗不过我只能双手赞同。</p><p class="story-paragraph" data-source-key="262:0">那张双人海报被挂在市中心最显眼的位置，配文是：「上帝用音符造就的孩子，珠联璧合，誓要谱出世上最动人心魄的音乐」，又浮夸又抓眼。</p><p class="story-paragraph" data-source-key="263:0">我同Anton立在海报下大声嘲笑，说这广告词有够中二的，然后转身就被路人认出来，向我们要签名和合影。</p><p class="story-paragraph" data-source-key="264:0">我们自小的事迹与海报一同被发掘。</p><p class="story-paragraph" data-source-key="265:0">youtube上开始出现我们的比赛集锦，所谓的高光时刻，转赞量惊人。甚至有人找我们拍纪录片，但最终被怀特教授婉拒了。</p><p class="story-paragraph" data-source-key="266:0">「太早成名不是坏事，当然也不会是什么好事。」</p><p class="story-paragraph" data-source-key="267:0">怀特教授是这么说的。</p><p class="story-paragraph" data-source-key="268:0">即使他同意，Anton大抵也是不愿意的，他打小就有些羞涩内敛，面对镜头总会不自在。</p><p class="story-paragraph" data-source-key="269:0">那段时间我和Anton调整排练日程，尽量不外出，只偶尔在晚上偷跑出来买两桶冰淇淋。</p><p class="story-paragraph" data-source-key="270:0">可还是被人叫住了。</p><p class="story-paragraph" data-source-key="271:0">我在新泽西街头看到我父亲时，有一瞬间不知身处何地。</p><p class="story-paragraph" data-source-key="272:0">缓缓才意识到这是我与母亲蜗居的异国城市，不是曾经暴躁易怒的他身旁。</p><p class="story-paragraph" data-source-key="273:0">「你现在倒是大红人了，这么多年也不知道联系爸爸。」</p><p class="story-paragraph" data-source-key="274:0">他干巴巴地笑起来，在漫长的抛弃和不理会之后，很突兀地捡起名为父女的遮羞布。</p><p class="story-paragraph" data-source-key="275:0">我有些恍惚地立在原地，听见他踌躇道:</p><p class="story-paragraph" data-source-key="276:0">「.……你现在赚了不少钱吧？爸爸的公司之前出了点问题，我们都是一家人，你……. 」</p><p class="story-paragraph" data-source-key="277:0">他苍老了好多，也变了好多。</p><p class="story-paragraph" data-source-key="278:0">十年未见开口第一句就是借钱，可他以前从来不在乎钱的。</p><p class="story-paragraph" data-source-key="279:0">他会给我买好看的娃娃，昂贵的巧克力，我学大提琴动辄就是六七位数，他也从不眨眼。</p><p class="story-paragraph" data-source-key="280:0">除开那些暴力破碎的瞬间，我偶尔会觉得他也蛮爱我的。</p><p class="story-paragraph" data-source-key="281:0">我冷漠道:「没有钱。」</p><p class="story-paragraph" data-source-key="282:0">「没有？怎么可能……别骗爸爸了，我用完就还给你啊，别这么倔行吗？」</p><p class="story-paragraph" data-source-key="283:0">他咬紧牙关还在讪笑。</p><p class="story-paragraph" data-source-key="284:0">见我面色含霜，他也换了一副撕破脸皮的姿态:</p><p class="story-paragraph" data-source-key="285:0">「你没有，你妈妈总有吧？！你们的住址随便一查就知道了，别想糊弄我！」</p><p class="story-paragraph" data-source-key="286:0">他一提起母亲我就再难以忍受，朝他尖叫道:</p><p class="story-paragraph" data-source-key="287:0">「你怎么还有脸去见她！你到底对得起谁？！」</p><p class="story-paragraph" data-source-key="288:0">总有人说亲缘关系是切不断的，我在此刻亦是信了。</p><p class="story-paragraph" data-source-key="289:0">男人因我的忤逆而怒火中烧，高高扬起手臂，是与十年前砸烂提琴如出一辙的动作。</p><p class="story-paragraph" data-source-key="290:0">又或者我早就从那一地残骸中幻视到自己今日的结局。</p><p class="story-paragraph" data-source-key="291:0">「别说了！我叫你别说了！」</p><p class="story-paragraph" data-source-key="292:0">——「别拉了！我叫你别拉了！」</p><p class="story-paragraph" data-source-key="293:0">男人冲上来狠狠掴了我一巴掌，用力将我推向那车水马龙一派霓虹光景之中。</p><p class="story-paragraph" data-source-key="294:0">——他抡起大提琴就往墙上砸，一下又一下，八岁的我听见琴弦在喊疼。好疼。</p><p class="story-paragraph" data-source-key="295:0">下一秒我便朝身后倒去，从我曾经站立过的璀璨舞台上跌下去，所有鲜花与掌声都渐次远离，不断下落的身体打碎了时间壁垒，我又还是那个惊弓之鸟般的小女孩。</p><p class="story-paragraph" data-source-key="296:0">是她在喊疼，是她躲在琴弦里痛哭，是她正跌入寂寂虚空之中，一去不复返。</p><p class="story-paragraph" data-source-key="297:0">新泽西街头喧嚣如潮，身体坠到地面上，像是碎掉一般找不回知觉。远处一辆汽车在夜色中朝我驶来。</p><p class="story-paragraph" data-source-key="298:0">我会死掉吗？这样也好。</p><p class="story-paragraph" data-source-key="299:0">——可一双有力的臂膀忽就将我紧紧抱起。</p><p class="story-paragraph" data-source-key="300:0">刹车的尖啸声被屏蔽在怀抱之外，我的心一下子揪起来了</p><p class="story-paragraph" data-source-key="301:0">两个人一同摔在侧方的柏油路上，我急忙去望Anton，他的手臂血肉模糊的一片。</p><p class="story-paragraph" data-source-key="302:0">我握起他的手，无措地掉下泪:</p><p class="story-paragraph" data-source-key="303:0">「不行，不行.……怎么可以….….我们去医院，去医院……」</p><p class="story-paragraph" data-source-key="304:0">无力感漫过了四肢百骸，心脏凌乱地跳着，生命中很关键的一部分似乎被活生生剥离了。</p><p class="story-paragraph" data-source-key="305:0">我语无伦次的拨着电话，Anton却还拉住我，很乖巧的说不要慌，他没事的。</p><p class="story-paragraph" data-source-key="306:0">轻轻地搂住他，害怕他会立刻碎掉一般。</p><p class="story-paragraph" data-source-key="307:0">下一秒，抬眼就望见了那张挂在高处的十分吸睛的双人海报。</p><p class="story-paragraph" data-source-key="308:0">「上帝用音符造就的孩子们，珠联璧合，誓要谱出最动人心魄的音乐」。</p><p class="story-paragraph" data-source-key="309:0">一语成谶。</p><p class="story-paragraph" data-source-key="310:0">在这个夜晚，属于我们的成人礼已悄然落幕。</p><p class="story-paragraph" data-source-key="311:0">我们终于走出了那潮湿的雨季，以另一种泣血的姿态。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="312:0">10/</b><i></i></p><p class="story-paragraph" data-source-key="313:0">那之后的很长一段时光我都想刻意忘记。</p><p class="story-paragraph" data-source-key="314:0">只记得在医院走廊里的金属凳上坐了一夜，惨白的灯光水淋淋地洒在脸上，好像是眼泪一般。</p><p class="story-paragraph" data-source-key="315:0">第二天清晨Anton的父母弟弟从国外赶回来，所有人围在候诊室里只等一个宣判。</p><p class="story-paragraph" data-source-key="316:0">我不敢面对他们，灰溜溜立在门前。</p><p class="story-paragraph" data-source-key="317:0">德高望重的医生望着Anton，斟酌道:</p><p class="story-paragraph" data-source-key="318:0">「无名指神经受损，静养的话不会影响正常生活，但是大提琴，是不可以再拉了的。」</p><p class="story-paragraph" data-source-key="319:0">遥远的天边乍起惊雷，那一瞬间世界轰鸣，是什么东西碎掉了的声音。</p><p class="story-paragraph" data-source-key="320:0">——琴弦断裂，锵的一声。</p><p class="story-paragraph" data-source-key="321:0">不要。请不要。</p><p class="story-paragraph" data-source-key="322:0">水杯从我手中跌落，碎片摔了满地。突兀的声响，众人都回首来望我。</p><p class="story-paragraph" data-source-key="323:0">Anton见是我，松开了蹙起的眉，很轻松地嗔怪我:</p><p class="story-paragraph" data-source-key="324:0">「倒水怎么去了这么久？我都要被渴死了。」</p><p class="story-paragraph" data-source-key="325:0">是并不在意的姿态，好像那无名指与他半点无关。</p><p class="story-paragraph" data-source-key="326:0">我却不敢去看他，浑身发抖，身体早已经被他父母弟弟的眼神钉在了原地。</p><p class="story-paragraph" data-source-key="327:0">他弟弟从前最喜欢我，此刻却像一头受伤的小兽一般，红着眼眶怒目而视，是毫不遮掩的恨意。</p><p class="story-paragraph" data-source-key="328:0">Anton因我毁掉前程，光明人生像是被生生截断，只剩一片昏暗破落的荒野。</p><p class="story-paragraph" data-source-key="329:0">滔天的愧怍像是巨浪一般把我掀翻，我双腿发软地瘫坐下去，几乎成了跪在众人面前。</p><p class="story-paragraph" data-source-key="330:0">Anton疑惑喊了我的名字，像是在问我为什么要这样。我流泪吐出真挚的话语，是斩断一切的姿态:</p><p class="story-paragraph" data-source-key="331:0">「对不起。一切都是我的错。」</p><p class="story-paragraph" data-source-key="332:0">抬首却看见Anton万般受伤的神色，懵懂而无妄，却是我从未见过的失望和认真。</p><p class="story-paragraph" data-source-key="333:0">他淡淡道:</p><p class="story-paragraph" data-source-key="334:0">「我从来不想要你的道歉。我这样做是因为我知道，如果危险的是我，你也会做出同样的选择。」</p><p class="story-paragraph" data-source-key="335:0">长在一起的两颗心脏突然钝痛起来。</p><p class="story-paragraph" data-source-key="336:0">年少的梦话里说了多少遍愿意一命换一命，可真的发生之后，却才发现不是那么简单的一回事。</p><p class="story-paragraph" data-source-key="337:0">人终究是一种群居动物，即使我们愿意为了彼此付出所有，缠绕在我们周围的藤蔓也绝不会轻易松手。</p><p class="story-paragraph" data-source-key="338:0">我瘫坐在原地，几乎要苦苦哀求了:</p><p class="story-paragraph" data-source-key="339:0">——求你不要这么说。求你恨我。求你不要原谅我。</p><p class="story-paragraph" data-source-key="340:0">最终只是望进他的眼睛，很轻很轻地摇了摇头。</p><p class="story-paragraph" data-source-key="341:0">四目相对，泪流满面又无能为力的一眼。</p><p class="story-paragraph" data-source-key="342:0">清白与否，早已经不再重要。</p><p class="story-paragraph" data-source-key="343:0">因为全部，全部，都结束了。</p></div>
      </article>
    </template><template id="chapter-04">
      <article class="chapter" data-chapter="chapter-04">
        <header class="chapter-header"><span class="chapter-number">04</span><h2 data-source-key="345:0">第四章</h2><p>New Jersey · Cello memoir</p></header>
        <div class="story-body"><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="346:0">11/</b><i></i></p><p class="story-paragraph" data-source-key="347:0">Anton待在医院静养的几个月里，几乎都是我在照料。两个人像是预知到了势必分离的未来一般，心照不宣地选择了忘记眼前的事情。</p><p class="story-paragraph" data-source-key="348:0">我几个月没有再拉琴，每天都翻阅菜谱，学做新菜品送到病房去。</p><p class="story-paragraph" data-source-key="349:0">我手生，做的饭菜有时难吃有时好吃。可无论难吃与否，Anton都会全部吃完，然后苦着一张漂亮的脸，央求我下次别做了。</p><p class="story-paragraph" data-source-key="350:0">然后第二天再次重复这番对话。</p><p class="story-paragraph" data-source-key="351:0">快出院时，他拜托弟弟取了外卖想改善伙食，被我抓个正着。</p><p class="story-paragraph" data-source-key="352:0">我揪他的耳朵骂他少吃点垃圾食品，又监视他吃完了我煮的面条，里面卧了两个荷包蛋。</p><p class="story-paragraph" data-source-key="353:0">后来我就躺在沙发上百无聊赖地看电视。</p><p class="story-paragraph" data-source-key="354:0">当地新闻的频道里，有很多我们的粉丝慕名前来参加演奏会，赶到新泽西时，却只来得及望见海报被撤下的瞬间。</p><p class="story-paragraph" data-source-key="355:0">硕大的海报自高处垮下，像是万丈高楼一瞬倒塌。</p><p class="story-paragraph" data-source-key="356:0">不论曾经如何风光无两，此刻也俨然成为一座废墟了。</p><p class="story-paragraph" data-source-key="357:0">有位来自拉斯维加斯的粉丝接受了采访，他情绪很激动，声泪俱下的控诉我和Anton是「诈骗犯」，欺骗了他的感情，说完又哇哇的哭了。</p><p class="story-paragraph" data-source-key="358:0">我差点没笑出声，乐呵呵地跟他吐槽说:</p><p class="story-paragraph" data-source-key="359:0">「好夸张啊，我们又不是明星艺人。」</p><p class="story-paragraph" data-source-key="360:0">没听见他回话，扭头却对上了他的目光。</p><p class="story-paragraph" data-source-key="361:0">他神情小心翼翼地，轻轻对我道:</p><p class="story-paragraph" data-source-key="362:0">「可我要去做艺人了。」</p><p class="story-paragraph" data-source-key="363:0">长久的沉默。</p><p class="story-paragraph" data-source-key="364:0">于是我们就这样无妄地看向对方，有什么在这场对视中悄悄熄灭了。</p><p class="story-paragraph" data-source-key="365:0">最终听见自己颤抖着说了一句:</p><p class="story-paragraph" data-source-key="366:0">「……真的吗？我当然支持你。」</p><p class="story-paragraph" data-source-key="367:0">「你做什么都是最好，你一直一直是最好的。」</p><p class="story-paragraph" data-source-key="368:0">或许是第一次，也是最后一次，如此直白地告诉他我对他的认可。</p><p class="story-paragraph" data-source-key="369:0">早在与他第一次合奏时，这些话语就已经藏在喉咙里了，却在十年后才真正被听见。</p><p class="story-paragraph" data-source-key="370:0">他又不好意思的笑起来:</p><p class="story-paragraph" data-source-key="371:0">「真的吗？我怕没有人会喜欢我……」</p><p class="story-paragraph" data-source-key="372:0">我立刻反驳道:</p><p class="story-paragraph" data-source-key="373:0">「才不会呢！你肯定能红，你要做大明星！到时候世界巨星AntonLee，可干万不能忘了我啊。」</p><p class="story-paragraph" data-source-key="374:0">我笑眯眯地哄他高兴，他亦满脸期待地望着我。</p><p class="story-paragraph" data-source-key="375:0">那瞬间却在心里默默坦白:</p><p class="story-paragraph" data-source-key="376:0">其实我骗了你，没有人比我更想你待在原地，同我永远在一起。</p><p class="story-paragraph" data-source-key="377:0">曾经不过一把琴就轻易能绑住彼此，让我们相携在未知的海域里不断下沉。下沉。</p><p class="story-paragraph" data-source-key="378:0">终有一日琴弦断裂，你回身上岸。</p><p class="story-paragraph" data-source-key="379:0">我愈沉愈深，开口却说不出挽留的话，大抵是因为——</p><p class="story-paragraph" data-source-key="380:0">我们之间，横亘了一条三寸长的伤痕。</p><p class="story-paragraph" data-source-key="381:0">它蜿蜒在你无名指的背面，永远不会再愈合。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="382:0">12/</b><i></i></p><p class="story-paragraph" data-source-key="383:0">再后来我们几乎不见面了。</p><p class="story-paragraph" data-source-key="384:0">他是什么时候离开的新泽西，我也并不清楚。</p><p class="story-paragraph" data-source-key="385:0">怀特教授在电话里大发雷霆，质问我是不是也要去做明星，不是的话赶紧滚回来拉琴。</p><p class="story-paragraph" data-source-key="386:0">我讷讷说好。</p><p class="story-paragraph" data-source-key="387:0">走之前还去到我们最爱的冰淇淋店，点了一份巧克力味的哈根达斯，直到夕阳西下也没能吃完。</p><p class="story-paragraph" data-source-key="388:0">行走在去往琴房的路上，这条我们曾经踏过无数遍的柏油马路。</p><p class="story-paragraph" data-source-key="389:0">我心中默念着Anton的名字，不知道怎么就哭了。</p><p class="story-paragraph" data-source-key="390:0">在Anton回国后不久，还能收到他发来的一些消息。</p><p class="story-paragraph" data-source-key="391:0">什么跳舞太难啊，练习生关系不好啊之类的抱怨，又或是哪位哥哥很照顾他，他给对方准备了礼物这样的分享。</p><p class="story-paragraph" data-source-key="392:0">我只偶尔回复。他发得也越来越少。</p><p class="story-paragraph" data-source-key="393:0">在我正式进入纽约爱乐团的那一年，我们终于断了联系。</p><p class="story-paragraph" data-source-key="394:0">那天我的旧手机掉进了水杯里，里面有我们所有的联系方式。</p><p class="story-paragraph" data-source-key="395:0">我手忙脚乱地把它从水里捞出来，一抬眼却看见熟悉的脸庞出现在了大屏幕里。</p><p class="story-paragraph" data-source-key="396:0">他很青涩很害羞地对着镜头道:</p><p class="story-paragraph" data-source-key="397:0">「大家好，我是李灿荣。」</p><p class="story-paragraph" data-source-key="398:0">——原来是出道了。</p><p class="story-paragraph" data-source-key="399:0">我后知后觉露出一个笑来，却比哭还要难看。</p><p class="story-paragraph" data-source-key="400:0">我的AntonLee，我的大提琴家，在今日终于蜕变成了光鲜亮丽、万众瞩目的艺人李灿荣。</p><p class="story-paragraph" data-source-key="401:0">他的才华和美丽，终于不能被我私藏，而是成了人人都可以分而饮之的大众展品。</p><p class="story-paragraph" data-source-key="402:0">这件展品摆在最显眼的位置，大家都喜欢他，赞美他。</p><p class="story-paragraph" data-source-key="403:0">我隐在众人之间，却只想起曾几何时，他因害怕镜头而捏我的手心，像个胆小鬼一般依赖我，躲在我的身后。</p><p class="story-paragraph" data-source-key="404:0">我直至今日都还坚持唤他Anton，是因为心中还留存有最后一丝妄想。</p><p class="story-paragraph" data-source-key="405:0">可此时此刻我与屏幕中的李灿荣对视，很清楚也很明白：</p><p class="story-paragraph" data-source-key="406:0">他再也不会回头看了。</p><p class="movement-mark"><span>MOVEMENT</span><b data-source-key="407:0">13/</b><i></i></p><p class="story-paragraph" data-source-key="408:0">从慕尼黑回来后不久，竟然收到了来自维也纳的演奏邀请。</p><p class="story-paragraph" data-source-key="409:0">那是作为我的另外二分之一人生理想的存在。</p><p class="story-paragraph" data-source-key="410:0">在手握琴弓近二十年之后的今天，我亦快要攀到了最高点。</p><p class="story-paragraph" data-source-key="411:0">怀特教授得知后也很替我高兴，一把年纪了还能捋着胡子笑出声。</p><p class="story-paragraph" data-source-key="412:0">后来的大半年时间，都在准备独奏会的事。</p><p class="story-paragraph" data-source-key="413:0">关于那个人，没有刻意关注过，但在拟定赠票名单时，竟然想到了对方。</p><p class="story-paragraph" data-source-key="414:0">想起他说过，等我实现梦想的这一天，他一定要坐在听众席第一排，为我送上祝贺花。</p><p class="story-paragraph" data-source-key="415:0">此刻我握着笔尖，只哑然失笑。</p><p class="story-paragraph" data-source-key="416:0">寄给他的话，大概会被当成粉丝信件随便处理掉吧。</p><p class="story-paragraph" data-source-key="417:0">于是便没有寄，演出时只见第一排空出了一个位置，如同一件完美作品的最后一星瑕疵。</p><p class="story-paragraph" data-source-key="418:0">可是世间事，本就难以处处完美。</p><p class="story-paragraph" data-source-key="419:0">我别开脸不再去看，转而望见了金色大厅上方那璀璨美丽的水晶吊顶，炫目得我几乎要落泪了。</p><p class="story-paragraph" data-source-key="420:0">从新泽西到维也纳，这条路我走了好多好多年。</p><p class="story-paragraph" data-source-key="421:0">我这伤痕累累，被天才之名裹挟的人生，在立在这方舞台上之际，也终于有了得救的迹象。</p><p class="story-paragraph" data-source-key="422:0">演出完美结束，谢幕时我扶着话筒半天说不出话，完全哽咽了。</p><p class="story-paragraph" data-source-key="423:0">怀特教授看红了眼，走上前来送上祝贺花，是我一贯喜欢的白玫瑰。</p><p class="story-paragraph" data-source-key="424:0">很难说我此刻到底是更期待白玫瑰，还是一束不太好闻的百合花。</p><p class="story-paragraph" data-source-key="425:0">——「你不是觉得百合臭吗？那我偏要送你百合，看你怎么办。」</p><p class="story-paragraph" data-source-key="426:0">「姐姐，有人留了一束百合在这里！」</p><p class="story-paragraph" data-source-key="427:0">门前有小男孩朝我喊道。</p><p class="story-paragraph" data-source-key="428:0">我凝固了一秒，几乎是仓皇地奔出去。说不清是失望还是什么，当然没有人影，只有一束鲜嫩欲滴的粉色百合留在原地。</p><p class="story-paragraph" data-source-key="429:0">返程的飞机起飞前，打开的手机推送出了新闻网页，又瞥到了熟悉的名字。</p><p class="story-paragraph" data-source-key="430:0">原来是那人在繁忙的通告间隙还抽出时间开了直播，明明是小众的粉丝平台，却因为对方少见地满足了粉丝的心愿而再次出圈。</p><p class="story-paragraph" data-source-key="431:0">我微不可查地翘起嘴角，想起曾经夸赞过他「你一直一直是最好的」，果然做什么都是最好，对粉丝也很好。</p><p class="story-paragraph" data-source-key="432:0">就这样想着，顺手点进了直播的片段回放。</p><p class="story-paragraph" data-source-key="433:0">昏暗的房间里只能看见他俊美的眉眼，有些沉默地抿着唇，眼见粉丝评论不断滚动，过了一会他很轻很轻地问:</p><p class="story-paragraph" data-source-key="434:0">「……大提琴吗？大家想听那个吗……」</p><p class="story-paragraph" data-source-key="435:0">我笑容淡下去，有些无措的眨了眨眼。</p><p class="story-paragraph" data-source-key="436:0">眼见屏幕里的他，当真翻找出了一架落灰的大提琴，是曾经和我一起购入的那一架，大概也是他的最后一架提琴。</p><p class="story-paragraph" data-source-key="437:0">镜头前的男人调整好坐姿，很生疏地试出几个音节，与他曾经的信手拈来早已相去甚远。</p><p class="story-paragraph" data-source-key="438:0">随后他垂下头颅，静静开始演奏。</p><p class="story-paragraph" data-source-key="439:0">似咏似叹的旋律，敲打着所有人的心门。</p><p class="story-paragraph" data-source-key="440:0">原来是一段翩然远逝，宛如初见的《杰奎琳之泪》。</p><p class="story-paragraph" data-source-key="441:0">还未来得及反应其中深意，一颗心就已经开始钝痛，直直向下坠去，把躯壳扯得七零八落，堵塞了多年的血和恨终于汩汨流了一地。</p><p class="story-paragraph" data-source-key="442:0">一曲毕，他仍垂首在原地，沉默了不知道有多久，最后终于扬起一张漂亮的脸，很平淡地，完全释怀了似的，很轻很轻地笑了一下。</p><p class="story-paragraph" data-source-key="443:0">似乎是在道别。</p><p class="story-paragraph" data-source-key="444:0">窗外阳光很好，可我此刻却像一只被淋湿的雏鸟。</p><p class="story-paragraph" data-source-key="445:0">新泽西大抵从不下雨，湿润的从来都是我们二人。</p><p class="story-paragraph" data-source-key="446:0">乘务员俯下身提醒我关掉手机，又关切地问我需不需要一些纸巾。</p><p class="story-paragraph" data-source-key="447:0">我狼狈地擦去眼泪，拉下眼罩再不出声。世界随之变为一片漆黑，竟然也渐渐有了睡意。</p><p class="story-paragraph" data-source-key="448:0">飞机颠簸，我却自顾自沉浸在梦境之中。</p><p class="story-paragraph" data-source-key="449:0">梦里我又看见雨季里朦胧的新泽西，街道萧瑟很少人，十六岁的两个身影粘在一起。</p><p class="story-paragraph" data-source-key="450:0">少男少女都背着那沉重的琴盒，我明明是远远望见他们，那重量却很真实地压在了我肩上。</p><p class="story-paragraph" data-source-key="451:0">我几乎是贪婪又无妄地望着他们。</p><p class="story-paragraph" data-source-key="452:0">看到依偎在汽车后座小声说着话的他们，看到躲在舞台后面分食一个饭团的他们，看到在冰淇淋店争论今天买什么口味的他们。</p><p class="story-paragraph" data-source-key="453:0">最后两人各自抱着一桶冰淇淋，心满意足地走在回家的路上。</p><p class="story-paragraph" data-source-key="454:0">男孩故意说起什么俏皮话，女孩就要不客气的踢他一下。</p><p class="story-paragraph" data-source-key="455:0">下一秒似乎有人喊我的名字，四下张望，原来是那个男孩回首发现了正在偷窥的我。</p><p class="story-paragraph" data-source-key="456:0">「Anton,怎么了？」女孩疑惑地问。</p><p class="story-paragraph" data-source-key="457:0">「没事。」男孩偏头回答道。</p><p class="story-paragraph" data-source-key="458:0">下一刻，只见十六岁的Anton回身朝我露出一个很真挚很灿烂的笑容，牙齿齐整，眼眸如月牙一般。</p><p class="story-paragraph" data-source-key="459:0">他朝我挥了挥手，缓缓地道一句:</p><p class="story-paragraph" data-source-key="460:0">「——再见。」</p><p class="story-paragraph" data-source-key="461:0">然后看向前方，伸手揽住女孩的肩膀，愈走愈远。</p><p class="story-paragraph" data-source-key="462:0">最终消失在了茫茫雨幕之中。</p><p class="end-mark" data-source-key="464:0">END</p></div>
      </article>
    </template></div>
  <script>
    (() => {
      const chapterIds=['chapter-01','chapter-02','chapter-03','chapter-04'],chapterTitles=['第一章','第二章','第三章','第四章'];const select=document.getElementById('chapter-select'),mount=document.getElementById('chapter-mount'),shell=document.getElementById('reader-shell');const prevTop=document.getElementById('prev-top'),nextTop=document.getElementById('next-top'),prevBottom=document.getElementById('prev-bottom'),nextBottom=document.getElementById('next-bottom'),prevLabel=document.getElementById('prev-label'),nextLabel=document.getElementById('next-label'),progress=document.getElementById('reading-progress');let currentIndex=0;
      function indexFromHash(){const found=chapterIds.indexOf(location.hash.slice(1));return found<0?0:found;}
      function updateButtons(){const first=currentIndex===0,last=currentIndex===chapterIds.length-1;[prevTop,prevBottom].forEach(button=>button.disabled=first);[nextTop,nextBottom].forEach(button=>button.disabled=last);prevLabel.textContent=first?'已经是第一章':chapterTitles[currentIndex-1];nextLabel.textContent=last?'全文完':chapterTitles[currentIndex+1];}
      function mountChapter(index,shouldScroll=false,replace=false){currentIndex=Math.max(0,Math.min(index,chapterIds.length-1));const id=chapterIds[currentIndex],template=document.getElementById(id);mount.replaceChildren(template.content.cloneNode(true));select.value=id;updateButtons();document.title=`雨落新泽西 · ${chapterTitles[currentIndex]}`;const url=`#${id}`;if(replace)history.replaceState(null,'',url);else if(location.hash!==url)history.pushState(null,'',url);progress.style.width='0';if(shouldScroll)shell.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
      function move(delta){mountChapter(currentIndex+delta,true);}select.addEventListener('change',()=>mountChapter(chapterIds.indexOf(select.value),true));prevTop.addEventListener('click',()=>move(-1));nextTop.addEventListener('click',()=>move(1));prevBottom.addEventListener('click',()=>move(-1));nextBottom.addEventListener('click',()=>move(1));addEventListener('popstate',()=>mountChapter(indexFromHash(),false,true));addEventListener('scroll',()=>{const doc=document.documentElement,max=doc.scrollHeight-innerHeight;progress.style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`; },{passive:true});mountChapter(indexFromHash(),false,true);
    })();
  </script>
