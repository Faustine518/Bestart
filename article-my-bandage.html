      <article class="chapter" data-chapter="chapter-06">
        <header class="chapter-header"><span class="chapter-number">06</span><h2>Chapter 6</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="126:0">次日，郑成灿把砸到我的罪魁祸首带到我面前。</p><p class="story-paragraph" data-source-key="126:1">男生不敢看我贴着敷料的脸，一边摸着后脖颈，一边躲闪着眼神。</p><p class="story-paragraph" data-source-key="126:2">其实我也有些不好意思，毕竟他不是有意而为，听到道歉就够了。但男生又自掏腰包给我垫了药费，这事儿就算是结束了。</p><p class="story-paragraph dialogue" data-source-key="126:3">“不用去医院吗？”</p><p class="story-paragraph" data-source-key="126:4">郑成灿皱着眉头问我。</p><p class="story-paragraph dialogue" data-source-key="126:5">“没关系吗？看起来还挺严重的。”</p><p class="story-paragraph" data-source-key="126:6">我摇摇头，心里很抵触去医院这种事，所以昨天宋银硕提起时，也被我拒绝了。</p><p class="story-paragraph" data-source-key="126:7">反正自己摸爬滚打这么多年，早就练皮实了。这点小伤，没多久就好了吧。</p><p class="story-paragraph" data-source-key="126:8">初缠恋的萌芽受到摧残而生长不良，我像已经死心的怨妇，就算郑成灿站到我面前主动嘘寒问暖，我也只是觉得有些涩口。确实还有余恋，但心里邦邦邦邦一直敲着退堂鼓，想前进，又害怕。</p><p class="story-paragraph" data-source-key="126:9">本就是见色起意的感情，何必那么执着呢。</p><p class="story-paragraph" data-source-key="126:10">但郑成灿那双如同晴空一般澄澈的小鹿眼总是出现在脑海里，我一咬牙，又觉得还是不舍得。心里的两个小人就这样吵架，最后谁都没吵赢，反到两败俱伤。</p><p class="story-paragraph" data-source-key="126:11">午休时宋银硕也发消息问我感觉怎么样，我说还好。</p><p class="story-paragraph dialogue" data-source-key="126:12">［郑成灿带着元彬去道歉了？］</p><p class="story-paragraph dialogue" data-source-key="126:13">［原来他叫元彬啊］</p><p class="story-paragraph" data-source-key="126:14">宋银硕没回我，我也没想太多。过了一会儿，又收到他的消息。</p><p class="story-paragraph dialogue" data-source-key="126:15">［晚上爸妈好像会回家］</p><p class="story-paragraph" data-source-key="126:16">悬在屏幕上的手指一顿，一时间说不清楚自己是什么心情。</p><p class="story-paragraph" data-source-key="126:17">距离上次见到爸爸，已经过去好几个星期了。具体多久，我不知道。因为我不可能特地打勾记录，数他究竟回来几次，停留多久，和我说什么。</p><p class="story-paragraph" data-source-key="126:18">见他与不见他，对我来说也没什么区别。</p><p class="story-paragraph" data-source-key="126:19">我已经不是那个拖着行李箱怯怯地敲门、天真的渴望得到父爱的女孩了。</p><p class="story-paragraph" data-source-key="126:20">甚至他们两个不回来好像更好一些，我和宋银硕在一起生活得很自在。</p><p class="story-paragraph" data-source-key="126:21">等等，我…和宋银硕吗？</p><p class="story-paragraph" data-source-key="126:22">宋银硕，是处于“我们”的范围里吗？</p><p class="story-paragraph" data-source-key="126:24">因为不想见到亲爹后妈，故意拖了很久才往家走。如果能不碰见任何一位直接溜回房间就好了。我一路上打着这样的算盘，到家时却正好碰到他们三个围坐在饭桌前聊天。</p><p class="story-paragraph" data-source-key="126:25">刚一开门，三双眼睛立刻直直地看过来。</p><p class="story-paragraph" data-source-key="126:26">身体下意识变得僵直，瞬间浑身不舒服起来，但又必须装出无事发生的样子。</p><p class="story-paragraph" data-source-key="126:27">没掐好时间，应该再晚一会儿的。</p><p class="story-paragraph" data-source-key="126:28">心里暗自后悔，把书包撂下后去洗手，本想偷偷钻回房间，却被宋银硕叫住。</p><p class="story-paragraph dialogue" data-source-key="126:29">“你在外面吃过晚饭了吗？”</p><p class="story-paragraph" data-source-key="126:30">我脚步一顿，感觉有些懊恼，却又不能不识抬举，只能乖乖转身入座了。</p><p class="story-paragraph" data-source-key="126:31">令我吃惊的是，饭桌上的菜都快凉了，却没人动筷，就好像大家一直在等我一样。</p><p class="story-paragraph" data-source-key="126:32">晚饭时，饭桌上很沉默，就算说话，也是他们三个一来一往的聊天。我默默地往嘴里扒饭，听他们一家三口聊些不咸不淡的话题，无法插嘴，也不想插嘴。我再一次变成了边缘人物，而我有意让自己成为透明的人。</p><p class="story-paragraph" data-source-key="126:33">果然胃是情绪器官，处于不舒服的环境里，胃口也小了很多。不知道今天是谁做的饭，不管是谁，我都觉得食之无味。</p><p class="story-paragraph" data-source-key="126:34">没吃几口，就停下了。</p><p class="story-paragraph" data-source-key="126:35">宋银硕不动声色地往我的碗里夹了一片肉。</p><p class="story-paragraph" data-source-key="126:36">我微微怔了一下，只听他微微靠近了些，小声说了句：“这个你还没吃。”</p><p class="story-paragraph" data-source-key="126:37">然后又用耳语的音量补充：“我做的，放心吃吧。”</p><p class="story-paragraph" data-source-key="126:38">傻傻地抬头，却正好和他的妈妈对视上了。</p><p class="story-paragraph" data-source-key="126:39">说不清她眼里是什么情绪，只是看了我一眼，她就收回了视线。</p><p class="story-paragraph" data-source-key="126:40">我垂眸，把宋银硕夹给我的菜送进嘴里，很好吃，能尝出熟悉的味道，从他做给我的每一餐里，都能体会到这样的感觉。</p><p class="story-paragraph" data-source-key="126:41">我又夹了几口，直到再也吃不下什么，才把筷子放下。</p><p class="story-paragraph" data-source-key="126:42">这次宋银硕没说什么，反倒是在我即将离座之时，他的妈妈开口了。</p><p class="story-paragraph dialogue" data-source-key="126:43">“脸怎么受伤了呀？”</p><p class="story-paragraph" data-source-key="126:44">我下意识摸了摸鼻子，触到的却是薄薄一层敷料。这才明白为什么今天总能感受到对面两位的视线，我赶忙回答：“昨天运动会，被球砸到了。”</p><p class="story-paragraph" data-source-key="126:45">她点点头，嘱咐道：“要注意安全才行啊。”</p><p class="story-paragraph dialogue" data-source-key="126:46">“好，谢谢…阿姨。”</p><p class="story-paragraph" data-source-key="126:47">脸上勉强扯出来的僵笑带动痛觉神经，我赶紧转身，隐藏住我即将崩坏的表情。</p><p class="story-paragraph" data-source-key="126:48">连后妈都发问了，我的亲爸爸，却一点都不关心吗。</p><p class="story-paragraph" data-source-key="126:49">回到自己的房间，又把自己仰面摔在床上，听见客厅里还有声音，三个人其乐融融…我的心很乱，第一次先宋银硕一步奔向浴室。原本怕我占用浴室的时间太长，会影响他使用，所以一直都是等他用完隔一阵我才会过去。小心翼翼的寄居者，生怕自己的到来会影响原住民的幸福。</p><p class="story-paragraph" data-source-key="126:50">但我明白了，其实他根本无所谓的。</p><p class="story-paragraph" data-source-key="126:51">从浴室出来时，只看到夫妻两人依偎在沙发上看电视的背影，宋银硕已经回房间了。</p><p class="story-paragraph" data-source-key="126:52">我低头，不再聚焦于他们的二人世界，轻手轻脚地回到自己的房间。</p><p class="story-paragraph" data-source-key="126:53">那种幸福，似乎总是离我很远。</p><p class="story-paragraph" data-source-key="126:54">坐在床边发呆，什么都不想。也不知道过了多久，突然听到门板传来“叩叩”两声。</p><p class="story-paragraph" data-source-key="126:55">我有些迟疑，猜到了可能是宋银硕，因为这一家人里只有他会来找我。但就算是他，也从来没有进过我的房间。</p><p class="story-paragraph" data-source-key="126:56">刚一开门，就感受到一阵水汽。</p><p class="story-paragraph" data-source-key="126:57">宋银硕才从浴室出来，头发也没吹，湿哒哒地垂在额头前，又被他随意往后一撩。</p><p class="story-paragraph" data-source-key="126:58">他眼睛的颜色好像更浓了，像下雨时世界被打湿，变成深颜色。</p><p class="story-paragraph" data-source-key="126:59">我有些堂皇，问他怎么了。</p><p class="story-paragraph" data-source-key="126:60">他扬了扬手中的药瓶，问我要不要上药。</p><p class="story-paragraph" data-source-key="126:61">我侧身为他让路。随后又想到这是他第一次进出我的房间，便有点不好意思。</p><p class="story-paragraph" data-source-key="126:62">而整个过程中，宋银硕都面不改色，自然得仿佛这是他自己的房间一样。</p><p class="story-paragraph" data-source-key="126:63">我在床沿坐下，他站在我前面。</p><p class="story-paragraph" data-source-key="126:64">宽阔的肩膀遮住了一小部分的光，所以他又俯下身，凑近我的面庞。</p><p class="story-paragraph" data-source-key="126:65">手掐着我的下巴上抬时，我突然想到，为什么要让他来替我滴药水，明明我自己也可以的。就仿佛被什么东西上身了一样，鬼使神差地答应下来，竟没有像之前那样说“我自己来就好”。</p><p class="story-paragraph" data-source-key="126:66">而现在他表情真挚地用虎口固定住我的下巴，靠得越来越近，真像接吻的前奏。</p><p class="story-paragraph" data-source-key="126:67">我在想什么？</p><p class="story-paragraph" data-source-key="126:68">宋银硕往我的鼻腔里滴了不知道什么东西，有点刺激，辣得我眼眶泛了点泪花。</p><p class="story-paragraph" data-source-key="126:69">睁眼时，看到宋银硕突然笑了。我疑惑地问他：“怎么了？”</p><p class="story-paragraph dialogue" data-source-key="126:70">“鼻子上贴着东西，很像海绵宝宝里的海超人。”</p><p class="story-paragraph" data-source-key="126:71">我愣了一下，绞尽脑汁地想，海超人究竟是个什么东西？等到我想起来时，整张脸瞬间被气的通红。</p><p class="story-paragraph" data-source-key="126:72">我气急败坏地锤了他一下：“哪有！”</p><p class="story-paragraph" data-source-key="126:73">宋银硕笑得更开心了。</p><p class="story-paragraph" data-source-key="126:74">我嗔怒着摸摸自己鼻子上的纱布，一时间也无法反驳他。</p><p class="story-paragraph dialogue" data-source-key="126:75">“你还不如直接骗我说‘没笑什么’的。”</p><p class="story-paragraph dialogue" data-source-key="126:76">“那你再问一次？”</p><p class="story-paragraph dialogue" data-source-key="126:77">“你笑什么？”</p><p class="story-paragraph dialogue" data-source-key="126:78">“没什么。”</p><p class="story-paragraph" data-source-key="126:79">等到对话重新上演一次，我才意识到自己竟然乖乖地听了他，真的重复了一次。</p><p class="story-paragraph" data-source-key="126:80">中计了。</p><p class="story-paragraph dialogue" data-source-key="126:81">“这有什么用！”</p><p class="story-paragraph" data-source-key="126:82">我有点无能狂怒了，但看宋银硕笑得直捂肚子，我也无语地跟着他笑起来。</p><p class="story-paragraph" data-source-key="126:83">然后，在某一个临界点，我们的笑容又突然同时消失。</p><p class="story-paragraph" data-source-key="126:84">好像有什么错位了。</p><p class="story-paragraph" data-source-key="126:85">他讪讪地摸了摸脖子，在我的床边无言地坐了一会儿。</p><p class="story-paragraph" data-source-key="126:86">我也意识到有些不对，却又不知道说什么才好，默默忍受着诡异的气氛。</p><p class="story-paragraph dialogue" data-source-key="126:87">“那个…”</p><p class="story-paragraph dialogue" data-source-key="126:88">“你…”</p><p class="story-paragraph" data-source-key="126:89">我和他同时开口，两个人又顿住。我吸了吸鼻子：“你先说。”</p><p class="story-paragraph" data-source-key="126:90">宋银硕也没客气，直接道：“那我就先回房间了。”</p><p class="story-paragraph" data-source-key="126:91">我呆呆回答：“是啊，我也该睡了。”</p><p class="story-paragraph" data-source-key="126:92">他站起身，迈着稳重的步伐，没有回头。</p><p class="story-paragraph" data-source-key="126:93">看着宋银硕劲瘦的背影，心里突然生出一种自己不愿承认的眷恋。</p><p class="story-paragraph" data-source-key="126:94">不想让他走。</p><p class="story-paragraph dialogue" data-source-key="126:95">“能帮我把灯关一下吗？”</p><p class="story-paragraph" data-source-key="126:96">为了让他多停留几秒。我坐在床上问。</p><p class="story-paragraph dialogue" data-source-key="126:97">“好。”</p><p class="story-paragraph" data-source-key="126:98">他淡淡回答。</p><p class="story-paragraph" data-source-key="126:99">一瞬间，房间陷入昏暗，唯一的光源是从门口照射进来的走廊的暖光。宋银硕就站在光线流进来的方向，我能看到的只有他隐藏在阴影中的侧脸。他像是被按了暂停键，又像是还有话要说，握着门把手的指节犹豫，最终还是踏出了房间。</p><p class="story-paragraph" data-source-key="126:100">在关门之前，宋银硕又迟疑了一下。</p><p class="story-paragraph" data-source-key="126:101">随后，我听到他轻声说了一句。</p><p class="story-paragraph dialogue" data-source-key="126:102">“晚安。”</p><p class="story-paragraph" data-source-key="126:103">和走廊的灯光一起，他的身影消失在逐渐缩小的门缝后。</p><p class="story-paragraph" data-source-key="126:104">我就这样静静地坐在床上，直到双眼适应黑暗，房间里的陈设逐渐变得历历在目。我猛地躺下，烦躁地把被子蒙过头，恍惚中闻到了自己身上的沐浴露味。</p><p class="story-paragraph" data-source-key="126:105">宋银硕和我用的是同样的沐浴露。刚刚他贴近我时，也闻到了类似的味道。</p><p class="story-paragraph" data-source-key="126:106">一瞬间觉得我呼吸的不是自己身上的味道，而是宋银硕的残留。可他已经离开了十几分钟，摸过坐过的地方早已没了痕迹，一点余温都没有，仿佛他从未光临过。只有耳边萦绕的声音告诉我那不是假的。</p><p class="story-paragraph" data-source-key="126:107">晚安，晚安，晚安…</p><p class="story-paragraph" data-source-key="126:108">宋银硕的经过像一场蝴蝶效应，他的翅膀轻轻一扇，我的心骤然狂风暴雨。</p><p class="story-paragraph" data-source-key="126:109">从什么时候起，宋银硕不再是那个让我讨厌的哥哥了呢？</p><p class="story-paragraph" data-source-key="126:110">又或者，他从来就没有值得我讨厌的时候。只是我太嫉妒了。</p><p class="story-paragraph" data-source-key="126:111">我嫉妒他拥有我不能拥有的一切，嫉妒幸福与爱对他来说如此触手可及，嫉妒他从未缺少过安全感，而我从来都没有拥有过这些。</p><p class="story-paragraph" data-source-key="126:112">恩智突然提议再去一次之前去过的拉面店，还要到新开的陶瓷店转一转。</p><p class="story-paragraph" data-source-key="126:113">我发消息告诉宋银硕我的去向，说自己要晚点到家，在外面吃，不用等我。</p><p class="story-paragraph dialogue" data-source-key="126:114">[几点回来？]</p><p class="story-paragraph dialogue" data-source-key="126:115">[我不确定 怎么了？]</p><p class="story-paragraph dialogue" data-source-key="126:116">[九点之前必须到家]</p><p class="story-paragraph" data-source-key="126:117">嗯嗯？</p><p class="story-paragraph dialogue" data-source-key="126:118">[这算什么 门禁吗]</p><p class="story-paragraph" data-source-key="126:119">他发过来一个bingo的emoji。</p><p class="story-paragraph" data-source-key="126:120">随后又发过来：</p><p class="story-paragraph dialogue" data-source-key="126:121">[太晚了不安全 我会去接你]</p><p class="story-paragraph" data-source-key="126:122">自上而下产生一种奇怪的感觉。好像是被限制住了，但这种束缚感却并不让我厌烦，反而尝出了些许的甜蜜。</p><p class="story-paragraph" data-source-key="126:123">我真是变怪了。</p><p class="story-paragraph" data-source-key="126:124">和两个朋友在外面玩的时候，我一直在看表，生怕错过回家的时间。</p><p class="story-paragraph" data-source-key="126:125">恩智有些无语地问：“你是要赶下一场吗？”</p><p class="story-paragraph dialogue" data-source-key="126:126">“不是。”我颇为认真地答：“我有门禁。”</p><p class="story-paragraph dialogue" data-source-key="126:127">“门禁？之前从来没听你说过啊。”</p><p class="story-paragraph dialogue" data-source-key="126:128">“我哥给我安排了门禁，九点。”</p><p class="story-paragraph" data-source-key="126:129">恩智和炤熙用一种看外星人的眼神看着我，仿佛我是什么珍稀物种一样，被那种目光瞧着的我感到有些发毛，做好了被朋友吐槽的准备，但他们什么也没说。</p><p class="story-paragraph" data-source-key="126:130">回家的时间比想象中早得多，我慢慢地磨蹭在路上，犹豫要不要给宋银硕发个消息，告诉他我回来了。或许他会自作主张地说会出来接我。</p><p class="story-paragraph" data-source-key="126:131">但我一抬头，天未黑透，还不到“危险”的程度，那他应该不会麻烦一趟吧。</p><p class="story-paragraph" data-source-key="126:132">纠结的时候，我已经到达楼下，刚好碰到熟悉的身影从门口匆匆出来。我没刹住脚步，等反应过来时，已经和郑成灿撞了个满怀。</p><p class="story-paragraph dialogue" data-source-key="126:133">“唔…”</p><p class="story-paragraph" data-source-key="126:134">鼻尖再次受到重击，撞到他的胸口，硬邦邦的，痛得我泪花都出来了。</p><p class="story-paragraph" data-source-key="126:135">我也没敢说什么，正要装作什么都没发生过，就像撞到一位陌生人，道个歉就可以结束了。但郑成灿却叫住了我。</p><p class="story-paragraph dialogue" data-source-key="126:136">“我有话对你说。”</p><p class="story-paragraph dialogue" data-source-key="126:137">“啊？”</p><p class="story-paragraph" data-source-key="126:138">我有些不可置信，指了指自己：“我？”</p><p class="story-paragraph" data-source-key="126:139">郑成灿无可奈何地笑了：“这还有第三个人吗？”</p><p class="story-paragraph dialogue" data-source-key="126:140">“噢，好…”</p><p class="story-paragraph" data-source-key="126:141">虽然不知道郑成灿想做什么，但我还是跟他过去了。低着头看脚尖，有些忐忑地攥着衣服边边，可是感受到那股郑重其事的氛围，又觉得不抬头似乎不太礼貌。</p><p class="story-paragraph" data-source-key="126:142">为了表示出自己的尊重，我决定鼓起勇气看着他。</p><p class="story-paragraph dialogue" data-source-key="126:143">“不...别看我，你看我的话…我有点说不出来了。”</p><p class="story-paragraph dialogue" data-source-key="126:144">“噢，好吧。”</p><p class="story-paragraph" data-source-key="126:145">我又把头别过去。</p><p class="story-paragraph" data-source-key="126:146">听到他尴尬地清了清嗓子。</p><p class="story-paragraph dialogue" data-source-key="126:147">“之前…办公室那次，是我反应过度了，我不是讨厌你才躲开的，我没有那个意思。”</p><p class="story-paragraph dialogue" data-source-key="126:148">“还有…那天，我也是后来才反应过来自己可能是让你难过了。听起来可能很像借口，但我没怎么和女生交往过，很多方面都考虑不到，也猜不透女生的心思…后来我常常想到你那天伤心的表情，就不太敢面对你。”</p><p class="story-paragraph" data-source-key="126:149">我还是没忍住抬头看向他。</p><p class="story-paragraph" data-source-key="126:150">郑成灿的眼里闪着愧疚的光芒，整张脸写满了“我很抱歉”四个大字，真是个不擅长说谎的人。</p><p class="story-paragraph dialogue" data-source-key="126:151">“所以呢？”我扁了扁嘴，郑成灿沉默了，然后垂着眼睛说：“我想解释的就是这些。”</p><p class="story-paragraph dialogue" data-source-key="126:152">“那现在说完了？”</p><p class="story-paragraph dialogue" data-source-key="126:153">“嗯。”</p><p class="story-paragraph dialogue" data-source-key="126:154">“那我走了？”</p><p class="story-paragraph dialogue" data-source-key="126:155">“等下。”郑成灿的语气里还带着些不甘，短暂的坚定后，又像颗霜打的植物一样蔫了下来。</p><p class="story-paragraph dialogue" data-source-key="126:156">“那你不生气了？”</p><p class="story-paragraph" data-source-key="126:157">我觉得有点好笑：“我一直都没生气啊。”</p><p class="story-paragraph" data-source-key="126:158">哪有生气的资格。与其生他的气，不如说是和自己较劲。</p><p class="story-paragraph dialogue" data-source-key="126:159">“明天周末，我和别的学校有比赛。你…要来看吗？”</p></div>
      </article>
    </template><template id="chapter-07">
      <article class="chapter" data-chapter="chapter-07">
        <header class="chapter-header"><span class="chapter-number">07</span><h2>Chapter 7</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="132:0">虽然郑成灿只是问我要不要去看他踢球，根本不算正式的约会，但我还是站在镜子前面，试了一整个衣柜的衣服，眼看自己的床铺被堆成一座小山，却找不到一件满意的。</p><p class="story-paragraph" data-source-key="132:1">苦恼之际，我听到了敲门的声音。</p><p class="story-paragraph" data-source-key="132:2">丢下手中的衣服去开门，却忘记自己的房间现在一塌糊涂。</p><p class="story-paragraph dialogue" data-source-key="132:3">“什么时候回来的，不是好我说去接你一段的吗。”</p><p class="story-paragraph" data-source-key="132:4">宋银硕看到我身后凌乱的现场，愣了一下：“你在整理衣柜？”</p><p class="story-paragraph dialogue" data-source-key="132:5">“没…”</p><p class="story-paragraph" data-source-key="132:6">他像是突然想到什么。</p><p class="story-paragraph dialogue" data-source-key="132:7">“要出门？”</p><p class="story-paragraph dialogue" data-source-key="132:8">“嗯。”</p><p class="story-paragraph dialogue" data-source-key="132:9">“和谁？”</p><p class="story-paragraph" data-source-key="132:10">我支支吾吾，有些心虚地说：“郑成灿……”</p><p class="story-paragraph dialogue" data-source-key="132:11">“什么时候？干什么去？”</p><p class="story-paragraph" data-source-key="132:12">宋银硕的问题一个接一个，像警察在拷问犯人一样，我索性全都告诉他，刚刚回来的时候在外面遇到了成灿，他邀请我去看他的球赛。</p><p class="story-paragraph dialogue" data-source-key="132:13">“噢，他也叫了我呢。”</p><p class="story-paragraph" data-source-key="132:14">他云淡风轻地说。</p><p class="story-paragraph dialogue" data-source-key="132:15">“什么？”</p><p class="story-paragraph" data-source-key="132:16">有点意料之外，我还以为郑成灿只叫了我一个人。心中略有失落，原本和郑成灿的二人世界泡汤了。但本来他们两个就是好朋友，郑成灿叫上宋银硕的同时也叫上了我，似乎没什么可以怪罪的。我并没有特别抗拒，很快就接受了现实。</p><p class="story-paragraph" data-source-key="132:17">次日，闹钟还没铃响，我就从焦躁不安的梦中惊醒。距离原本计划好的时间还有一段距离，我却怎么也睡不着了。认命地爬下床去洗漱，从浴室出来时，正好碰上睡眼惺忪的宋银硕。</p><p class="story-paragraph dialogue" data-source-key="132:18">“早。”</p><p class="story-paragraph" data-source-key="132:19">我的脚步顿了一下：“早。”</p><p class="story-paragraph dialogue" data-source-key="132:20">“你想什么时候出门？”</p><p class="story-paragraph dialogue" data-source-key="132:21">“啊？”</p><p class="story-paragraph dialogue" data-source-key="132:22">“不需要化妆打扮吗？”</p><p class="story-paragraph" data-source-key="132:23">我的语气有些不确定：“…一个小时？”</p><p class="story-paragraph" data-source-key="132:24">宋银硕点点头，表示会等我一起。</p><p class="story-paragraph" data-source-key="132:25">我赶紧钻回卧室，想到宋银硕还在外面等着我，手上的动作不禁加快起来。还没到一个小时，就准备就绪了。昨天纠结许久，最后还是选择穿裙子。为了盖住膝盖上的伤疤，是刚好到小腿的保守款式。这样的话，宋银硕也不会多嘴。</p><p class="story-paragraph" data-source-key="132:26">推开门探头出去，看到正在沙发上低头玩手机的他。</p><p class="story-paragraph" data-source-key="132:27">似乎听到了我的声音，宋银硕抬起头：“准备好了？”</p><p class="story-paragraph dialogue" data-source-key="132:28">“嗯。”</p><p class="story-paragraph" data-source-key="132:29">他站起身，抚平裤子上褶皱的布料。柔软的灰色卫衣套在他的身上，有种说不出的感觉，像一床温暖馨香的被子，希望能够被他紧紧地包裹住。</p><p class="story-paragraph dialogue" data-source-key="132:30">“发什么呆。”</p><p class="story-paragraph" data-source-key="132:31">宋银硕的手在我面前挥了挥：“走吗？”</p><p class="story-paragraph dialogue" data-source-key="132:32">“噢噢，走吧。”</p><p class="story-paragraph" data-source-key="132:33">我默默跟在他身后，掩饰住自己的表情。</p><p class="story-paragraph" data-source-key="132:34">比赛进行的场地距离我们不算很远，宋银硕似乎习惯了我的步调，迁就着我的速度，悠哉悠哉地四处张望，我的注意力也不自觉地跟着他的视线走。</p><p class="story-paragraph" data-source-key="132:35">突然意识到，就算我们两个都不说话，气氛也不会尴尬了。我说不清这算好事还是坏事，只是盯着他的肩头和一小角脸，原来相熟的兄妹是这种感觉吗…</p><p class="story-paragraph" data-source-key="132:36">我们到达的时候，郑成灿已经开始比赛了。观看的人不多也不少，大多是两个学校的学生，还有一小部分凑热闹的路人。我原本就对运动不感兴趣，只是因为郑成灿才过来的。而现在郑成灿在球场上忙前忙后，我看不懂，张望一阵后就觉得没劲，之前还会因为新鲜而全程观看，今天只希望比赛能快点结束。</p><p class="story-paragraph" data-source-key="132:37">郑成灿毫不意外地带领队伍拿下胜利。结束后，他一边擦汗一边朝我们所在的方向奔来。笑容咧得大大的，露出一口可爱的牙齿，像一只爆冲的大型犬。</p><p class="story-paragraph" data-source-key="132:38">我怕他撞上我，往宋银硕的身边靠了靠。</p><p class="story-paragraph" data-source-key="132:39">他跑到我们面前，稳稳刹住车。但脸上多了一丝疑惑，宋银硕面不改色地对着他道了句：“恭喜。”</p><p class="story-paragraph" data-source-key="132:40">郑成灿疑惑的目光移到了我这里，我也有些不明所以。但他却没问什么。</p><p class="story-paragraph" data-source-key="132:41">踢赢了比赛的成灿比平时更加兴奋，换下了浸满汗水的球衣，说要请我们去吃饭。我当然乐得开心，宋银硕也没有异议。</p><p class="story-paragraph" data-source-key="132:42">我们三个一起走在路上，宋银硕隔在我和郑成灿的中间，和成灿有一搭没一搭地聊天。</p><p class="story-paragraph" data-source-key="132:43">郑成灿身高腿长，和最初的宋银硕一样，三步两步就超越我们俩个，最后干脆回头问我们怎么走那么慢。</p><p class="story-paragraph dialogue" data-source-key="132:44">“我有点累，我们慢点走吧。”宋银硕淡淡地回。</p><p class="story-paragraph dialogue" data-source-key="132:45">“你又没上场，有什么累的。”</p><p class="story-paragraph" data-source-key="132:46">郑成灿嘴上这么说，却也放慢了脚步。</p><p class="story-paragraph" data-source-key="132:47">我知道宋银硕是为了我才这么说的，耳根红了红，心里有种说不出的感觉。</p><p class="story-paragraph" data-source-key="132:48">我们像在家吃饭时那样，选了一家符合我们三人口味的西式快餐。其实是郑成灿的能量条急需汉堡补充，而我和宋银硕又无所谓吃什么，便随着他选了。</p><p class="story-paragraph" data-source-key="132:49">套餐做得很快，没多久就喊我们去取餐。</p><p class="story-paragraph" data-source-key="132:50">坐在外侧的宋银硕自然地起身去取餐台，留下郑成灿和我大眼瞪小眼。</p><p class="story-paragraph" data-source-key="132:51">想到昨天郑成灿低头解释的模样，今天的见面似乎不像我想象中的那么雀跃，宋银硕在的时候还好，他一离开，反而传来阵阵无形的尴尬。</p><p class="story-paragraph" data-source-key="132:52">我的手指在桌子下面蜷成一团。</p><p class="story-paragraph" data-source-key="132:53">想不通郑成灿究竟为什么要和我解释，是想和朋友的妹妹和谐共处，还是…？</p><p class="story-paragraph" data-source-key="132:54">不过比起郑成灿的想法，我现在更猜不透的是我自己的想法。从前那么盼望见面的人，现在正坐在这里，我的心里却平静得像一池湖水，已经没有了小鹿乱撞的感觉。或许是我三分钟热度，又或许是我喜新厌旧吧。他是我腻的旧，那我喜的新又是谁呢？</p><p class="story-paragraph" data-source-key="132:55">宋银硕端着满满一大盘回来，郑成灿眼睛都亮了，说了句“我开吃了”就把手伸向了汉堡。</p><p class="story-paragraph" data-source-key="132:56">我似乎一直都不明白自己的心。喜欢郑成灿是没有确切理由的，只是想尝试一下恋爱，所以看中了优秀的他。可这样为了恋爱而产生的悸动浮于表面，又能持续多久呢？</p><p class="story-paragraph dialogue" data-source-key="132:57">“对了，你不是说你不来吗？”</p><p class="story-paragraph" data-source-key="132:58">郑成灿三口两口吃完一整个汉堡，含糊不清地问宋银硕。</p><p class="story-paragraph dialogue" data-source-key="132:59">“你听错了，我没说过我不来。”</p><p class="story-paragraph" data-source-key="132:60">宋银硕头也不抬地往嘴里塞了根薯条。</p><p class="story-paragraph dialogue" data-source-key="132:61">“是吗？”</p><p class="story-paragraph" data-source-key="132:62">郑成灿用没沾油的手指挠了挠后脑勺，看起来有些呆呆的，好像在回忆究竟有没有这么一回事，最后还是相信了宋银硕的话。</p><p class="story-paragraph" data-source-key="132:63">我被他可爱的举动逗笑，下一秒，笑容僵在脸上。</p><p class="story-paragraph" data-source-key="132:64">宋银硕……不会是故意参与进来的吧？</p><p class="story-paragraph" data-source-key="132:65">后背产生凉丝丝的感觉，像是突然发现了一个惊天大秘密那样悚然。</p><p class="story-paragraph" data-source-key="133:0">饭后郑成灿被一个电话叫走，宋银硕和我走在回家的方向。</p><p class="story-paragraph" data-source-key="133:1">刚刚的想法一直萦绕在脑海中。郑成灿问宋银硕要不要来时，他是拒绝的，而听到我说我要去，他又开口说他也会在场。</p><p class="story-paragraph" data-source-key="133:2">我偷偷瞄了一眼宋银硕，依旧是那副云淡风轻的模样。</p><p class="story-paragraph dialogue" data-source-key="133:3">“看你有些心不在焉，听说今晚在江边有小型的烟火表演，要去看吗？”</p><p class="story-paragraph" data-source-key="133:4">我没有多余的心思消化他的话，想也没想就答应下来：“好啊。”</p><p class="story-paragraph" data-source-key="133:5">对于烟火表演这种活动，我向来没有过多的执念。毕竟参加这类庆典的人群通常都是幸福的一家几口或热恋情侣，像我这样孤身一人前往的观众实在是少之又少。不想被当作异类，也不想在美好和幸福的包围下产生乐景哀情的落差。每次路过这种活动，我都会默默移开视线，走开，不愿参与进去，不忍打破别人的快乐。</p><p class="story-paragraph" data-source-key="133:6">但今天是宋银硕问我，要不要一起去，所以我才敢答应。</p><p class="story-paragraph" data-source-key="133:7">我和他走在江边，草坪上已经陆陆续续有人坐下等待了。各式的野餐垫铺在地上，缤纷得像撒在抹茶冰激凌上的糖针。我从来都没想过，有朝一日自己也能自然而然地融入庆典的气氛中。</p><p class="story-paragraph dialogue" data-source-key="133:8">“我们没有垫子，怎么办…”</p><p class="story-paragraph" data-source-key="133:9">宋银硕看了我一眼，默默找了一块相对干爽的草坪，二话不说脱掉了卫衣外套，只剩下里面的黑色无袖打底。</p><p class="story-paragraph" data-source-key="133:10">等我反应过来时，他单膝撑地，已经把衣服铺在了地面，然后拍了拍：“这不就有坐了？”</p><p class="story-paragraph dialogue" data-source-key="133:11">“啊？噢…”</p><p class="story-paragraph" data-source-key="133:12">我红着脸，拽着裙摆坐了下去。</p><p class="story-paragraph" data-source-key="133:13">外套的面积毕竟不如野餐垫，宋银硕只能挨着我坐。</p><p class="story-paragraph" data-source-key="133:14">裸露的胳膊在空气中挥发温度，我感受到他的体温，不禁想起每一次接触时，自他传递到我的热度，心跳不可抑制地加速。还好现在是傍晚，我脸颊的异色不至于太过明显。</p><p class="story-paragraph" data-source-key="133:15">太近了…我不自在地挪动了一下，反而适得其反地碰到了他。</p><p class="story-paragraph dialogue" data-source-key="133:16">“你脸怎么这么红。”</p><p class="story-paragraph dialogue" data-source-key="133:17">“！”</p><p class="story-paragraph" data-source-key="133:18">我闻声看向他，而他刚好面色坦然地收回视线。</p><p class="story-paragraph dialogue" data-source-key="133:19">“可能是晚霞照的，呵呵…”</p><p class="story-paragraph" data-source-key="133:20">正想尴尬地把头转回去，却发现余光中，他的耳垂早已红透 。</p><p class="story-paragraph dialogue" data-source-key="133:21">“那你怎么也…”</p><p class="story-paragraph dialogue" data-source-key="133:22">“晚霞。”</p><p class="story-paragraph" data-source-key="133:23">他目不斜视。</p><p class="story-paragraph dialogue" data-source-key="133:24">“晚霞是橙红色的，映在脸上就是这个效果。”</p><p class="story-paragraph dialogue" data-source-key="133:25">“噢…”</p><p class="story-paragraph" data-source-key="133:26">我被说服了，心里还有点庆幸，还好刚刚找到个完美无缺的理由搪塞，毕竟宋银硕可没那么好骗。</p><p class="story-paragraph" data-source-key="133:27">在我们徘徊到驻足的过程中，江岸边已经逐渐涌入了人群。和我想象中的一样，大多是一家几口，很明显的恩爱夫妻，带着孩子或宠物，也有不少稚嫩的面庞，年轻的情侣，像磁铁的正负极一样双手系在一起，没有一刻分离。我听着人潮喧嚷，心中还是会荡漾起羡慕之情。但如果我像从前那样只身前来的话，肯定会相形见绌，觉得自己是世界中唯一的灰色，是雁群中受伤落队的孤鸟。</p><p class="story-paragraph" data-source-key="133:28">宋银硕在我身边自言自语地说着：“来的人很多嘛。”</p><p class="story-paragraph dialogue" data-source-key="133:29">“是啊。”</p><p class="story-paragraph" data-source-key="133:30">在幸福的衬托下，我竟然不觉得自己萧瑟了。</p><p class="story-paragraph" data-source-key="133:31">除了谢谢以外，我还能和宋银硕说什么呢？</p><p class="story-paragraph" data-source-key="133:32">清澈的晚风拂过，掀起了我裙摆的一角，我刚要去抚，宋银硕的手已经抢先一步，替我压住了。</p><p class="story-paragraph" data-source-key="133:33">他冰凉的指尖触到了我的小腿，虽然已经是深春了，夜晚的江风却还是发冷的。宋银硕的外套垫在我们身下，一句抱怨的话都没有。</p><p class="story-paragraph" data-source-key="133:34">我攥紧了自己手下的布料，仿佛我紧攥着他被吹凉的手。</p><p class="story-paragraph dialogue" data-source-key="133:35">“你冷不冷？”</p><p class="story-paragraph dialogue" data-source-key="133:36">“看。”</p><p class="story-paragraph" data-source-key="133:37">他没回答我，而是提醒我。</p><p class="story-paragraph" data-source-key="133:38">我抬起头，江水的平面突然升起一束光芒，微微颤颤地急速上升，然后在浓稠的夜色中绽放。</p><p class="story-paragraph" data-source-key="133:39">嘭——嘭——</p><p class="story-paragraph" data-source-key="133:40">身边的感叹声不绝于耳，宋银硕漂亮的嘴唇也受到震撼而微微张开，似乎在无声的感叹。</p><p class="story-paragraph" data-source-key="133:41">我一咬牙，伸手盖在他冰凉的手背上。</p><p class="story-paragraph" data-source-key="133:42">他没有躲开，反手把我的手扣在下面，放在他骨感的膝盖处，然后逐渐收紧，直至十指相扣。</p><p class="story-paragraph" data-source-key="133:43">我们这才真正融入焰火下的小世界，因为我和他看起来就像一对平常的情侣，双手交叠，焰火的光芒在脸上明明灭灭，眼中充盈着幸福的池水。</p><p class="story-paragraph" data-source-key="133:44">我看着焰火，没有许愿，而是感恩。</p><p class="story-paragraph" data-source-key="133:45">这或许是我人生中最幸福的一刻了，我要感谢这场体验的到来，并且贪婪地希望时光可以流逝得慢一些，再慢一些。最好一直持续十七个年头。这样，在我的一生中，幸福的时间就比不幸的时间更长了。</p><p class="story-paragraph" data-source-key="133:46">直到最后一点光芒消失在世界的尽头，他松开被我捂暖的手，站了起来。我也恋恋不舍地跟着起身。</p><p class="story-paragraph" data-source-key="133:47">宋银硕拍掉外套背面的草叶，满不在乎地重新穿回身上。</p><p class="story-paragraph" data-source-key="133:48">刚刚紧握着他的那只手空荡荡的悬在身侧，他的眼睛隐藏在眉骨的阴影中，又被垂下的刘海遮住了。</p><p class="story-paragraph dialogue" data-source-key="133:49">“走吗？”</p><p class="story-paragraph dialogue" data-source-key="133:50">“嗯。”</p><p class="story-paragraph" data-source-key="133:51">我低着头，跟在他的斜后方。</p><p class="story-paragraph" data-source-key="133:52">人群来的有早有晚，却在同一时间撤离。</p><p class="story-paragraph" data-source-key="133:53">人行道路上不可避免地挤满了撤离的观众，我都不用自己挪动脚步，腹背受敌般地不自控行走着，有些无助地抬头，却发现原本在我斜前方的宋银硕不见了身影。</p><p class="story-paragraph" data-source-key="133:54">心里突然六神无主起来，像是失去了唯一的依靠一样，急切地左顾右盼，但前后左右的人阻碍着我的视线，越是焦急就越不知所措，不知道被谁的脚绊了一下，整个人往前踉跄了一下，好在人挤人的状态下，摔都没办法摔在地上，脸磕到前人的后背上，听到他不满地嘟囔着什么。我赶紧道歉，一边说着“对不起”，一边红了眼眶。</p><p class="story-paragraph" data-source-key="133:55">突然感觉自己的手被牵住了。熟悉的温度再次传递过来，惊愕之中，我看到了宋银硕的眼睛，他逆着人群挤到了我身边。</p><p class="story-paragraph" data-source-key="133:56">这是我第一次在他的脸上看到如此明显的担忧，而他出现了，我的眼泪也夺眶而出。</p><p class="story-paragraph" data-source-key="133:57">宋银硕把我架在他的臂弯里，把我和周边的人隔开，像一个保护罩。我的后背贴着他薄薄的胸膛，恐慌的心逐渐平静下来。</p><p class="story-paragraph" data-source-key="133:58">听到他说了一句：“对不起。”</p><p class="story-paragraph" data-source-key="133:59">我咬着嘴唇摇头，在心里否定，不是你的错。</p><p class="story-paragraph" data-source-key="133:60">终于人群被岔路口稀释，我们脱离拥挤得以喘息。</p><p class="story-paragraph" data-source-key="133:61">宋银硕拿开了环在我身边的手臂，明明已经没有人挤人了，他牵着我的手却没有松开。而我必须承认自己卑劣的贪心，所以装作什么都不知道那样，同样反握着他的手。</p><p class="story-paragraph" data-source-key="133:62">他带着劫后余生的微笑，舒了口气，然后试探性地问我。</p><p class="story-paragraph dialogue" data-source-key="133:63">“我们回家？”</p><p class="story-paragraph" data-source-key="133:64">我眼里含着泪水，用力地点头。</p><p class="story-paragraph dialogue" data-source-key="133:65">“…好。”</p><p class="story-paragraph" data-source-key="133:66">我们回家。</p></div>
      </article>

      <article class="chapter" data-chapter="chapter-08">
        <header class="chapter-header"><span class="chapter-number">08</span><h2>Chapter 8</h2></header>
        <div class="story-body"><p class="story-paragraph dialogue" data-source-key="138:0">“为什么你最近都不怎么提郑成灿了？”</p><p class="story-paragraph dialogue" data-source-key="138:1">“是啊，前几天他不是约你去看他比赛…”</p><p class="story-paragraph dialogue" data-source-key="138:2">“张嘴闭嘴就是你哥，难道你真开始听你哥的话了？不能吧？”</p><p class="story-paragraph dialogue" data-source-key="138:3">“你不是和你哥不怎么熟吗？”</p><p class="story-paragraph" data-source-key="138:4">我承受着恩智和炤熙的连番轰炸，却一个问题都答不上来。</p><p class="story-paragraph" data-source-key="138:5">最后僵硬地扯了扯嘴角，弱弱地说了一句。</p><p class="story-paragraph dialogue" data-source-key="138:6">“啊，可能是在一起住久了，所以和宋银硕比较熟了吧…”</p><p class="story-paragraph" data-source-key="138:7">宋银硕。</p><p class="story-paragraph" data-source-key="138:8">我从来都不叫他“哥哥”，只有和外人提起时，才会称他为“哥”。这是我哥，那个人是我哥，他是我哥，宋银硕是我的哥哥。其余时刻，我只称他为：宋银硕。</p><p class="story-paragraph" data-source-key="138:9">好像关系很好的兄妹之间，是会直呼其名的吧？那我和宋银硕，可以算进那个行列里吗？</p><p class="story-paragraph" data-source-key="138:10">把我和他划进那个行列，就等同于把诺贝尔奖颁给了我一样，我受不起。只肯叫他宋银硕，其中有我自己的小心思，最初是因为想和他划清界限，现在也是因为想和他划清界限，但已经不一样了。如果他不是我的哥哥就好了。</p><p class="story-paragraph" data-source-key="138:11">可如果他不是我哥，那他还会对我这么好吗？</p><p class="story-paragraph" data-source-key="138:12">不要宋银硕做我哥哥的代价是失去宋银硕，想要得到宋银硕的代价是让他成为我的哥哥。</p><p class="story-paragraph" data-source-key="138:13">哥哥的身份，把他和我永远绑在了一起，却又把他和我推得无限远。我可以触碰他，却不能以我渴望的方式去触碰。这种血缘带来的“便利”，究竟是馈赠，还是掠夺呢。</p><p class="story-paragraph" data-source-key="138:14">我终于得到了自己渴望已久的亲情和关怀，不是吗。为什么不肯满足。</p><p class="story-paragraph" data-source-key="138:15">妈妈跟着她爱着并且同样爱着她的人远走高飞了，只留我一个在这里。爸爸也和他爱着并且也爱着他的女人结婚了，一家三口相亲相爱，我又是多余的那个。无论是她还是他都走向了命运的大团圆结局，而我是他们幸福路上的绊脚石。身边的所有人都拥有爱，都得到了爱，都学会了怎么去爱，都拥有爱人的能力，似乎只有我不行。我没有爱，也不会爱，到最后自己也分不清了。究竟是因为我一直都没得到爱，所以我没学会怎么去爱，还是说，因为我不会给予爱，所以才得不到爱。在我的认知中，爱和买卖一样，是相互的，是有理由的，是有来有回的。我爱你，因为你漂亮，你体贴，你是我的理想型，你富有，或者精神富有，总之你身上有我需要的东西，所以我爱你，没有谁会无缘无故的对谁好。</p><p class="story-paragraph" data-source-key="138:16">所以宋银硕成为了我心底的谜。因为我的定理只对我生效，我需要宋银硕，这是我的理由。但我的定理却无法解释宋银硕。</p><p class="story-paragraph" data-source-key="138:17">我始终不明白我这种一无所有的人，为什么能得到他如此多的关怀？他有什么理由陪在我身边却什么都不图？他想从我这得到什么？我又给得起吗？</p><p class="story-paragraph" data-source-key="138:18">有关宋银硕的一切就像是误入了一家没有标价的珠宝店，他先把琳琅的首饰挂在我身上让我试戴，却不告诉我它们的价格。我一边忐忑，一边被耀目的光芒迷惑了双眼，等到我意识到自己可能永远都负担不起它们的价值时，我已经舍不得把它们卸下了。</p><p class="story-paragraph" data-source-key="138:19">我已经无法把宋银硕从生活中剔除，可是现在才察觉到危险，太晚了。</p><p class="story-paragraph" data-source-key="138:20">那日牵手回家，宋银硕照旧拿着滴鼻的药水来到我的房间，但我的伤已经好了。所以他知趣地退了出去，因为时间还早，他没说晚安。</p><p class="story-paragraph" data-source-key="138:21">看他消失在门口，我第一次恨自己强悍的自愈力。</p><p class="story-paragraph" data-source-key="138:22">那之后他就不来了。</p><p class="story-paragraph" data-source-key="138:23">他和我都是喜欢呆在自己房间的人，就算住在同一屋檐下，见面的次数也很少。</p><p class="story-paragraph" data-source-key="138:24">白天去学校上课，晚上才回家，饭后他就回到自己房间，非必要不出门。</p><p class="story-paragraph" data-source-key="138:25">为了多见他，我慢慢把活动的地点搬到了客厅，常常窝在沙发上发呆，等宋银硕出来时，再装出不在意的样子低头玩手机。用余光偷偷看他，看他倒水、洗手、翻冰箱；看他穿着棉质的柔软家居服，下摆有久卧的褶皱，心里猜他刚刚在玩哪一款游戏；看他露出的一截脚踝，像笔直的画线；看他用过的水槽边尚未干涸的水迹；看他翘起一撮头发的后脑勺；看他放在冰箱里切了一半的胡萝卜和喝了一口的果汁；看他单薄的背影；就是不能去看他的正脸。因为我是一位跟踪者，我把他拿过的刀攥在手心，感受他残留的体温，我站在他洗衣后晾满衣物的阳台，呼吸湿润的馨香，我想这就是宋银硕身上的感觉，因为他不喷香水，而这样能让我更好的藏匿，毕竟柔顺剂是我们公用的，我可以轻而易举地得到他身上的味道，但如果他用香水，我就要特地去买同款，会露出马脚。住在同一屋檐下，意味着我得到了从前不敢想象的照料，同时也带来了难以忍受的煎熬。我的需求从“渴望得到”变成“得到更多”，像只喂不饱的饕餮一样无法满足于这些虚无缥缈的痕迹。我不是想要通过他残留的体温间接触碰他，我想可以光明正大的伸出手，我是饿的快死的狗，而他是宠物用的慢食碗，我想大口大口地吞掉所有的食物，可每次只能得到一点点的慰藉。</p><p class="story-paragraph" data-source-key="138:26">洗过澡后，我坐在沙发上发呆，而宋银硕也习惯了我的出现，最开始他还会惊讶地问我怎么出来了，现在对他而言，我和沙发上的靠枕一样，成为了合理的存在。</p><p class="story-paragraph" data-source-key="138:27">宋银硕去了浴室，打开了花洒，暂停了花洒，又打开了花洒，他拿起我们一起用的洗护产品，在头发上揉搓出洁白的泡沫，我熟悉那个味道，我每天都在用。但如果它出现在宋银硕的身上，好像一切就不同了，脱离了我的认知范围，让我难以想象。</p><p class="story-paragraph" data-source-key="138:28">直到浴室的水声最终消失，我才慢腾腾地从沙发起身，回头看了一眼留在原处的屁股印，突然觉得自己好笑。</p><p class="story-paragraph" data-source-key="138:29">还是回房间吧。</p><p class="story-paragraph" data-source-key="138:30">这样像个痴女一样在外面守着他，只为了每天能多见他一两次，明明是住在同一屋檐下的兄妹，却要这样躲躲藏藏。现在又像罪犯逃逸一样，仓皇地躲回自己的世界。</p><p class="story-paragraph" data-source-key="138:31">我无力地靠在门板上，浴室的水声不知停了多久，房间安静得让人恐慌。</p><p class="story-paragraph" data-source-key="138:32">只能听到自己的心跳声，在封闭的卧室里，像开了外放一样。</p><p class="story-paragraph" data-source-key="138:33">房间的门刚合上，周围的一切就陷入了黑暗，我愣了一下，还以为是自己忘了开灯。</p><p class="story-paragraph" data-source-key="138:34">摸索到门边的开关，反复按了几次，都没有亮灯。这才反应过来，可能是停电了。</p><p class="story-paragraph" data-source-key="138:35">下意识地去摸口袋，空空如也，刚刚在沙发上发呆时我带出去的手机，被我忘在了客厅里。</p><p class="story-paragraph" data-source-key="138:36">我想不到附近还有什么可以辅助自己的光源，就算有，我也不见得能找到。</p><p class="story-paragraph" data-source-key="138:37">只能凭记忆出去找手机了。</p><p class="story-paragraph" data-source-key="138:38">我在黑暗中摸到了门把手，拧开后扶着门框转身。</p><p class="story-paragraph" data-source-key="138:39">整个家都是一片漆黑，像是走进了盲人的世界。</p><p class="story-paragraph" data-source-key="138:40">我被门槛绊得踉跄了一下，还好自己一直抓着门框，但刚迈步就差点摔倒，让我有些犯了怯，害怕继续向前走，但又不得不走。此时此刻希望宋银硕出现的心情达到了最高点，我很想喊他，问问他在哪里，刚要开口，又像嘴里被人塞了毛巾一样堵住了声音，不知道该喊“哥哥”还是“宋银硕”，我从来都没有正面称呼过他。</p><p class="story-paragraph" data-source-key="138:41">就在我纠结之际，我听到宋银硕的声音。</p><p class="story-paragraph dialogue" data-source-key="138:42">“是你吗？”</p><p class="story-paragraph dialogue" data-source-key="138:43">“是。”</p><p class="story-paragraph dialogue" data-source-key="138:44">“你在房间里？”</p><p class="story-paragraph dialogue" data-source-key="138:45">“我在我房间门口。”我顿了顿：“你拿了手机吗？能看清吗？”</p><p class="story-paragraph dialogue" data-source-key="138:46">“没有，我的手机在我房间里。”</p><p class="story-paragraph dialogue" data-source-key="138:47">“我的手机在沙发上。”</p><p class="story-paragraph" data-source-key="138:48">我陷入了无助的状态，根据声音我能判断宋银硕离我的位置还有一定距离，而他手边也没有光源。我们像两个瞎子一样在黑暗中寻找彼此。</p><p class="story-paragraph dialogue" data-source-key="138:49">“我看不清，什么都看不见。”</p><p class="story-paragraph" data-source-key="138:50">我的语气中带着焦急，心里的不安定感越来越浓，视觉的缺失让我的其他感官变得更加敏感，不受控制地胡思乱想，黑暗中会不会藏着什么鬼怪，或者其实是某个杀人犯关掉了我们的电闸所以家里才停电了，而他会在下一秒把刀砍在我的脖子上…再想到从前每一个独自蜷缩在家中的漆黑夜晚，没有大人陪着我，每次听到走廊有脚步声，我都觉得是人贩子来绑架我，他们会破门而入，把我这个没有爸爸妈妈的孩子带走。</p><p class="story-paragraph dialogue" data-source-key="138:51">“你在哪？”</p><p class="story-paragraph" data-source-key="138:52">我对着黑暗无助地问。</p><p class="story-paragraph dialogue" data-source-key="138:53">“你别动，我去找你。”</p><p class="story-paragraph" data-source-key="138:54">就算宋银硕这么说，我也还是想要赶紧到达他的身边，往前走了几步，手脱离了墙边，在黑暗中逐渐完全失去了方向。等我意识到的时候，前后左右都没有可以支撑我的物体了，四处摸索，都是空无一物，完全不知道自己身在何方了，只能蹒跚向前。</p><p class="story-paragraph" data-source-key="138:55">顺利地走到了过道的拐角，有一块颜色相对更淡的黑色，好像是拉了窗帘的窗口。</p><p class="story-paragraph" data-source-key="138:56">我看到希望，朝着那边走，得意忘形地忘记了现在是什么状态，步子迈的和平常一样，然后脚下被狠狠地绊了一个趔趄，失去重心，狠狠摔在了地上。</p><p class="story-paragraph" data-source-key="138:57">小腿传来刺痛的感觉，火烧火燎的，我颤抖着指尖摸过去，痛感更甚了，一定是被柜子的木板擦伤了。</p><p class="story-paragraph dialogue" data-source-key="138:58">“你摔倒了吗？”</p><p class="story-paragraph" data-source-key="138:59">宋银硕的语气中也带着焦急，我蜷成一团，把膝盖贴到心脏的位置。</p><p class="story-paragraph" data-source-key="138:60">伤口就像把自己拉开了一条缝，力气一点一点的从那条缝里里流出去，慢慢抽干自己，身边的氧气也逐渐干涸。躺在冰凉的地板上，像一条砧板上的鱼，渐渐失去了呼吸的能力。想大口地喘息，可是心中压满了恐慌的感觉，只能把自己缩得越来越小，越来越小，连宋银硕的脚步声都听不见了，只能感受到自己的胸膛艰难地起伏着，吸气，呼气，耳边传来难忍的鸣声。</p><p class="story-paragraph" data-source-key="138:61">就像几乎死掉一样。</p><p class="story-paragraph" data-source-key="138:62">我闭上本就不能视物的双眼，意识再回笼时，宋银硕跪在我旁边，不断地摇晃着我。</p><p class="story-paragraph dialogue" data-source-key="138:63">“还好吗？能听见我说话吗？”</p><p class="story-paragraph" data-source-key="138:64">我按住他即将拨出紧急电话的手，摇了摇头：“没事。”</p><p class="story-paragraph dialogue" data-source-key="138:65">“差点就要叫救护车了。”</p><p class="story-paragraph" data-source-key="138:66">手电筒的光芒微弱，但好歹能看到宋银硕的轮廓了。我的呼吸逐渐平复下来，后背渗满了黏糊糊的汗水，手心里也一样。</p><p class="story-paragraph dialogue" data-source-key="138:67">“我只是感觉…感觉…”</p><p class="story-paragraph" data-source-key="138:68">说着说着，喉咙就酸酸地哽咽起来。</p><p class="story-paragraph dialogue" data-source-key="138:69">“感觉很不安全。”</p><p class="story-paragraph" data-source-key="138:70">黑暗之中，他怔了一下，把我的手机放在地板上，抓着我的肩膀把我提起来。</p><p class="story-paragraph" data-source-key="138:71">短暂的停顿后，宋银硕从背后抱住我。</p><p class="story-paragraph" data-source-key="138:72">闻到共用的沐浴露的香气，湿漉漉的，仿佛片顷间骤降的倾盆暴雨将我包裹。</p><p class="story-paragraph dialogue" data-source-key="138:73">“这样抱你会更有安全感一点吗？”</p><p class="story-paragraph" data-source-key="138:74">他说话时，能清楚地感受到他胸腔的震动，隔着两人穿着的衣料，酥酥麻麻。</p><p class="story-paragraph" data-source-key="138:75">一瞬间，岌岌可危的心降落在柔软的鹅毛上。</p><p class="story-paragraph" data-source-key="138:76">跟着他回到他的房间，宋银硕把我安置在他的床上：“我去找医药箱，你一个人在这里…”随后又补了一句：“没关系吗？”</p><p class="story-paragraph" data-source-key="138:77">我咬着嘴唇，摇摇头。</p><p class="story-paragraph" data-source-key="138:78">他几步就消失在门口，没过多久就带着家用医疗箱回来。</p><p class="story-paragraph" data-source-key="138:79">宋银硕用手机打着手电筒，低下头细细察看我小腿上那一块不大不小的擦伤。</p><p class="story-paragraph" data-source-key="138:80">他嘟着认真的嘴巴，为我的伤口贴上了两条OK绷。</p><p class="story-paragraph dialogue" data-source-key="138:81">“我不想一个人…”</p><p class="story-paragraph" data-source-key="138:82">我抱着膝盖，像个无赖一样坐在他的床上不走，表面理直气壮，实际心虚得手心又渗出细汗。</p><p class="story-paragraph dialogue" data-source-key="138:83">“很害怕。”</p><p class="story-paragraph" data-source-key="138:84">宋银硕沉默的期间，我一直在偷瞄他的表情，祈祷他能主动说出让我留下的提议。</p><p class="story-paragraph" data-source-key="138:85">终于，不知过了多久，宋银硕皱着眉头，有些不确定地说：“那留下…？”不像是提议，更像是他在自己问自己。可以让我留下吗，应该让我留下吗？</p><p class="story-paragraph" data-source-key="138:86">宋银硕从柜子里又抱了一床被褥出来，铺在地板上。</p><p class="story-paragraph" data-source-key="138:87">手机的手电筒熄灭后，房间又回到无休无止的黑暗中。</p><p class="story-paragraph" data-source-key="138:88">我躺在宋银硕的床上辗转反侧，朝思夜想的哥哥就睡在旁边的地板上，房间安静到我能够清楚地听见他的呼吸。一翻身把脸埋进蓬松的枕头，又能闻到宋银硕的洗发露味。</p><p class="story-paragraph" data-source-key="138:89">实在是太让人在意了。</p><p class="story-paragraph dialogue" data-source-key="138:90">“睡不着吗？”</p><p class="story-paragraph" data-source-key="138:91">我闷闷地把他的被子裹得更紧：“嗯。”然后有些厚脸皮地说：“还是害怕。”</p><p class="story-paragraph" data-source-key="138:92">宋银硕轻轻笑着：“胆小鬼。”</p><p class="story-paragraph dialogue" data-source-key="138:93">“那你要怎样才能不害怕？”</p><p class="story-paragraph dialogue" data-source-key="138:94">“牵手。”</p><p class="story-paragraph" data-source-key="138:95">我把手垂到床边，宋银硕没有拒绝，叹了口气，然后握住。</p><p class="story-paragraph" data-source-key="138:96">为了保持这样的姿势，我紧贴着床沿，有些摇摇欲坠。但我不怕摔下去，反正下面又宋银硕垫背。</p><p class="story-paragraph" data-source-key="138:97">摔下去更好，然后理所当然地和他躺在同一张床垫上。</p><p class="story-paragraph" data-source-key="138:98">我坏心地想。</p></div>

      <article class="chapter" data-chapter="chapter-09">
        <header class="chapter-header"><span class="chapter-number">09</span><h2>Chapter 9</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="143:0">我先宋银硕一步醒过来，揉了揉眼睛，发现我们牵着的手不知道什么时候松开了。</p><p class="story-paragraph" data-source-key="143:1">撑着脸伏在床沿看打着地铺的宋银硕，他的睡脸意想不到的乖巧，半张脸都埋在被子里，只剩下一个头顶和眉眼，很静谧。</p><p class="story-paragraph" data-source-key="143:2">就这样盯着他，发现他露在外面的皮肤逐渐泛红，最后变得像只煮熟的大虾一样。</p><p class="story-paragraph dialogue" data-source-key="143:3">“你醒了吗？”我感觉很好笑。</p><p class="story-paragraph" data-source-key="143:4">宋银硕有些尴尬地睁开眼睛，把睡衣的褶皱拽平后起身，落荒而逃一样跑去洗漱。留我一个人在后面偷笑。</p><p class="story-paragraph" data-source-key="143:5">我回了趟房间后也去洗漱，再碰到他时，他已经恢复了淡定，仿佛什么都没有发生过一样。很想逗逗他，但想了想还是放弃了。</p><p class="story-paragraph" data-source-key="143:6">刷牙的时候，又感觉昨天的经历就像梦一样，被宋银硕紧紧圈在怀里时闻到的味道也逐渐消散。我鬼使神差地挤了一点沐浴露到指尖，再凑到鼻子下面。</p><p class="story-paragraph" data-source-key="143:7">一点都不一样。</p><p class="story-paragraph" data-source-key="143:8">我失望地把那一点沐浴露用水冲掉，然后吐出嘴里的牙膏沫。</p><p class="story-paragraph" data-source-key="143:9">出门就看到宋银硕穿着笔挺的制服，在门口百无聊赖地刷着手机。</p><p class="story-paragraph" data-source-key="143:10">他看了我一眼，没说“好慢”，而是说“该走了”。</p><p class="story-paragraph" data-source-key="143:11">我回他：“马上！”然后跑回房间把书包甩在背上，到门口匆匆忙忙地踩上鞋子。</p><p class="story-paragraph" data-source-key="143:12">忘记了从哪天起，宋银硕开始和我一起上学，他高三有早读，而我因为走得慢不想迟到所以起得更早。和他并肩走在上学的路上，好像沿途的空气都透亮了许多。</p><p class="story-paragraph" data-source-key="143:13">如果能一直这样下去就好了。</p><p class="story-paragraph" data-source-key="143:14">最近总是生出这样的想法，吃着他做的饭时，和他一起上学时，跟他去看焰火时，两手十指相扣时，被他背后抱时，在黑暗中听着他恬静的呼吸时，他存在于我的余光里时。每一个让我想要“时间停留在这瞬间”的时刻，都有一个前提条件，那就是宋银硕在我的身边。</p><p class="story-paragraph" data-source-key="143:15">所以当他说起自己暑假需要去补习班时，我脑海中美好的幻想被打破了。</p><p class="story-paragraph" data-source-key="143:16">原本期待着暑假的到来，想要每天和宋银硕窝在家里，偶尔他会叫来郑成灿，或和郑成灿出去，那时我也可以出去找恩智和炤熙。最重要的是，我知道他就在我触手可及的范围内，和我仅有一墙之隔，虽然我不能越界，但他就在我身边。</p><p class="story-paragraph" data-source-key="143:17">突如其来的消息打得我措手不及，我先是愣了下，木木地说：“啊，这样啊…”</p><p class="story-paragraph" data-source-key="143:18">过了一会儿才反应过来，明知这不是什么错事，心里还是不可抑制地埋怨起他。</p><p class="story-paragraph" data-source-key="143:19">其实这不是我生气的唯一原因，归根结底，这种怒气只不过是个烟雾弹而已，最让我担心的是，因为这件事，我意识到了宋银硕不可能永远在我身边。等他高考结束，他会离开这个家，去读大学，然后慢慢淡忘这里，淡忘我，他会交女朋友，会结婚，可能还会生孩子。他这样被爱包围着长大的人，是个好儿子，好哥哥，好朋友，以后更会成为一个好丈夫，一个好父亲。而我只是他人生中不咸不淡的过客，他以后选择建立怎样的家庭，都与我无关了。</p><p class="story-paragraph dialogue" data-source-key="143:20">“去就去呗，好好学习。”</p><p class="story-paragraph" data-source-key="143:21">我低下头，用脚尖踢石子，却踢了个空。脚尖尴尬地悬在地面之上，又被我装作什么都没有发生过。</p><p class="story-paragraph" data-source-key="143:22">考试过后迎来了假期，我每天百无聊赖地呆在家里，我睡醒时宋银硕已经不在家了，只有温热的早午餐算是他留下的痕迹。</p><p class="story-paragraph" data-source-key="143:23">一天，两天…我像在桥下等待的尾生一样看着潮水慢慢把我吞没，几乎要溺死在期盼里。最开始我还赌气地不去客厅等他，后来才发现我和他之间又回到了最初的模式，完美的交错，没有一点沟通的机会。我们已经很久没有说过话了。他的假期比上学更忙。</p><p class="story-paragraph" data-source-key="143:24">把自己陷进柔软的床铺中时，突然意识到，原来一直都是我在努力地去争取见他的时机，我停止努力了，我们就没有碰面了，又回到住在同一屋檐下的陌生人的状态。</p><p class="story-paragraph" data-source-key="143:25">这样真的好不公平。</p><p class="story-paragraph" data-source-key="143:26">我撒气般地扯着枕头边，给恩智和炤熙发消息，约他们一起出去。</p><p class="story-paragraph" data-source-key="143:27">可却把见面地点定在了宋银硕补习班的附近。我承认自己真的是输了个彻底。</p><p class="story-paragraph" data-source-key="143:28">在他补习班的对面，有一家很实惠的辣炖排骨。李炤熙喜欢吃辣，我们三人便决定去吃那一家，但饭点时人很多，必须在门口排号。</p><p class="story-paragraph" data-source-key="143:29">正值盛夏，即便太阳已快落山，温度依旧灼人，李炤熙热得受不了，自告奋勇要去旁边的便利店买冰饮，留我和恩智在门口等待。</p><p class="story-paragraph" data-source-key="143:30">一边聊着八卦，一边漫不经心地望向宋银硕补习班的位置。我不知道他上下课的时间，正想着宋银硕此时此刻会做什么，一回头，却透过排骨店的玻璃窗，看到宋银硕和另一个女生面对面坐着。</p><p class="story-paragraph" data-source-key="143:31">我傻住了。</p><p class="story-paragraph dialogue" data-source-key="143:32">“哎？那不是你哥吗？”</p><p class="story-paragraph" data-source-key="143:33">恩智惊喜地说：“那个女生是谁，不会是他女朋友吧。”</p><p class="story-paragraph" data-source-key="143:34">喉咙像是吞了浓浓一口糖浆，齁的我声音发哑，发呛。</p><p class="story-paragraph dialogue" data-source-key="143:35">“我不知道。”原来自己的声音能难听成这样。</p><p class="story-paragraph" data-source-key="143:36">恩智还没意识到我的不对劲，兴奋地隔着玻璃数数：“他坐的桌子还有好几个空位呢，我们要不要像上次…哎？你…”</p><p class="story-paragraph dialogue" data-source-key="143:37">“想让我哥请客就直说嘛。”</p><p class="story-paragraph" data-source-key="143:38">我强撑着扯出笑容，开了个玩笑把自己的情绪掩盖过去。恩智还以为自己看错了，用探究的目光盯着我，最后却也没觉察出有什么不对。</p><p class="story-paragraph dialogue" data-source-key="143:39">“要不我们去吃别的吧。”</p><p class="story-paragraph" data-source-key="143:40">我扯了扯恩智的袖口。</p><p class="story-paragraph dialogue" data-source-key="143:41">“太热了，还有好多人，我不想等了。”</p><p class="story-paragraph dialogue" data-source-key="143:42">“好吧。”恩智很爽快地就同意了：“那你不去跟你哥打个招呼？”</p><p class="story-paragraph dialogue" data-source-key="143:43">“旁边有女生，我们就别去打扰了。”</p><p class="story-paragraph dialogue" data-source-key="143:44">“也是。”</p><p class="story-paragraph" data-source-key="143:45">李炤熙怀里抱了三瓶冰镇橙汁，还没走到门口就被我们拉走，有些没反应过来，但还是乖乖地跟在我们两个身后。</p><p class="story-paragraph dialogue" data-source-key="143:46">“那我们去哪儿啊。”</p><p class="story-paragraph dialogue" data-source-key="143:47">“要不…去我家？”恩智朝我眨了眨眼，然后对我们两个说：“我家今天没人，我前一阵刚从网上学了一个夏日调酒，我们要不要…”</p><p class="story-paragraph" data-source-key="143:48">李炤熙有些微微犯难，但我正需要一个借酒消愁的机会，不等李炤熙犹豫，我先答应下来：“好啊。”</p><p class="story-paragraph" data-source-key="143:49">我们三个买了些下酒的拉面和零食，一起去了恩智家。</p><p class="story-paragraph" data-source-key="143:50">既要忍耐心中的情绪，又要在朋友面前装出若无其事的样子，这样让我感觉更疲惫了。恩智的调酒刚端上来，我就开始猛灌，因为年龄的原因，我们还没有偷偷去club聚在一起喝过酒。恩智不知道我的酒量有多少，我自己也不知道。等到意识逐渐模糊时，他们才开始拦着我，但已经来不及了。</p><p class="story-paragraph dialogue" data-source-key="143:51">“别喝了…别喝了！”</p><p class="story-paragraph" data-source-key="143:52">恩智不断地给李炤熙使眼色：“拦着她一点啊！”</p><p class="story-paragraph" data-source-key="143:53">手中的杯子被夺走，我傻傻地看着自己空荡荡的掌心，残留的只有杯壁上挂着的水珠。</p><p class="story-paragraph" data-source-key="143:54">我嘴唇一扁，豆大的泪水从眼眶中滚落。</p><p class="story-paragraph dialogue" data-source-key="143:55">“这是怎么了？”</p><p class="story-paragraph" data-source-key="143:56">我只是摇头，憋着话，什么都不肯透露。</p><p class="story-paragraph" data-source-key="143:57">这可把恩智急坏了，她在我旁边像个陀螺一样转来转去，李炤熙坐在一旁手足无措，不知道该说什么才好，只能一张一张地给我抽纸，到最后身边的纸团已经堆成了一座山。</p><p class="story-paragraph dialogue" data-source-key="143:58">“怎么了？你妈给你发消息了？”</p><p class="story-paragraph" data-source-key="143:59">摇头。</p><p class="story-paragraph dialogue" data-source-key="143:60">“郑成灿说什么了？”</p><p class="story-paragraph" data-source-key="143:61">摇头。</p><p class="story-paragraph dialogue" data-source-key="143:62">“不会是你哥吧？”</p><p class="story-paragraph" data-source-key="143:63">我不说话。</p><p class="story-paragraph dialogue" data-source-key="143:64">“因为你哥找了个女朋友？”</p><p class="story-paragraph" data-source-key="143:65">我不说话。</p><p class="story-paragraph dialogue" data-source-key="143:66">“我还以为你俩不熟呢，原来你对你哥占有欲这么大啊。”</p><p class="story-paragraph" data-source-key="143:67">恩智很显然是把我和宋银硕当成了普通的兄妹，只有我知道不是那样的。</p><p class="story-paragraph" data-source-key="143:68">也不知道哭了多久，到最后眼皮都开始酸胀，但醉意也仿佛被我哭走了一样，我渐渐缓过来，意识恢复清澈。</p><p class="story-paragraph dialogue" data-source-key="143:69">“我想住你家。”</p><p class="story-paragraph" data-source-key="143:70">恩智也怕我回去的路上有危险，所以答应下来：“本来还想让他送你的，那正好你直接和我住。”</p><p class="story-paragraph dialogue" data-source-key="143:71">“那我先回去了？”</p><p class="story-paragraph" data-source-key="143:72">李炤熙和我们告别，我摇摇晃晃地跟着恩智把他送到门口。结果没多久就听到敲门声，恩智去开门，看到折返的李炤熙，很惊讶。</p><p class="story-paragraph dialogue" data-source-key="143:73">“你怎么回来了。”</p><p class="story-paragraph" data-source-key="143:74">李炤熙越过恩智对我说：“你哥在楼下。”</p><p class="story-paragraph dialogue" data-source-key="143:75">“啊？”</p><p class="story-paragraph" data-source-key="143:76">我有些傻眼了，突然意识到了什么，赶紧掏出一直静音放在口袋里的手机，无数个未接来电和消息。</p><p class="story-paragraph" data-source-key="143:77">这才有了夜不归宿被抓包的感觉。</p><p class="story-paragraph" data-source-key="143:78">我穿上鞋子，和李炤熙一起下楼。刚出单元门，就看到路灯下宋银硕颀长的身影。他的表情隐藏在阴影之中，我看不见。怯怯地被李炤熙押送过去，到他面前时又丢人地绊了一下，被宋银硕拎小鸡一样拎住了。</p><p class="story-paragraph" data-source-key="143:79">他对李炤熙道了声谢，然后抓着我的手腕往家的方向走去。</p><p class="story-paragraph" data-source-key="143:80">一路上都是低气压。</p><p class="story-paragraph" data-source-key="143:81">原本我还觉得有点心虚，想着想着，又觉得自己没什么错，再一看宋银硕的侧脸，不久前他和其他女生谈笑风生地坐在排骨店里的景象就涌上记忆，于是怒气顶替了所有情绪，我狠狠地甩开宋银硕的手。</p><p class="story-paragraph dialogue" data-source-key="143:82">“你生什么气。”</p><p class="story-paragraph" data-source-key="143:83">我没好气地说。</p><p class="story-paragraph" data-source-key="143:84">宋银硕有些无奈：“我没生气。”</p><p class="story-paragraph dialogue" data-source-key="143:85">“那你怎么不说话，还板着张臭脸。”</p><p class="story-paragraph dialogue" data-source-key="143:86">“那你怎么不回我消息也不接我电话，还给自己灌了这么多酒？”</p><p class="story-paragraph" data-source-key="143:87">我自知理亏，把头别到一边去，不肯说话。</p><p class="story-paragraph" data-source-key="143:88">就这样僵持到了家中，我头也不回地往自己的卧室走，摔门后静坐了五分钟，准备去洗漱，一开门却看到宋银硕在门口。</p><p class="story-paragraph dialogue" data-source-key="143:89">“发生什么了？”</p><p class="story-paragraph" data-source-key="143:90">他温和地问。</p><p class="story-paragraph" data-source-key="143:91">我没理他，径直走进浴室。</p><p class="story-paragraph" data-source-key="143:92">出来后，看到宋银硕还在我门口，我愣了一下，又赶紧整理好表情，做出一副漠不关心的样子。</p><p class="story-paragraph dialogue" data-source-key="143:93">“因为我吗？”</p><p class="story-paragraph" data-source-key="143:94">我的手顿住了。</p><p class="story-paragraph" data-source-key="143:95">刚想咬着牙开门，又听见身后传来他的声音。</p><p class="story-paragraph dialogue" data-source-key="143:96">“哥哥做错什么了吗？”</p><p class="story-paragraph" data-source-key="143:97">熟悉的嗓音唤起了我强压下去的情绪，一瞬间，那些原以为已经被我哭干的泪水又从眼眶涌出来。</p><p class="story-paragraph dialogue" data-source-key="143:98">“是，又怎样？”</p><p class="story-paragraph" data-source-key="143:99">宋银硕顿了几秒，又用那种循循善诱的语气问我：“那是因为什么呢。”</p><p class="story-paragraph" data-source-key="143:100">我仰着头，不想让泪水滚落出来，于是赶紧开门关门，让自己回到熟悉的空间，但没想到宋银硕也紧随其后，第一次不经我的允许就推门进来。</p><p class="story-paragraph dialogue" data-source-key="143:101">“因为什么？”</p><p class="story-paragraph" data-source-key="143:102">有时我真的会讨厌他这种穷追不舍的韧性，可是我也知道，如果他今天选择“算了”，那我就永远都没有说出来的机会了。</p><p class="story-paragraph dialogue" data-source-key="143:103">“你明知道…你还和别的女生在一起。”</p><p class="story-paragraph" data-source-key="143:104">宋银硕被我问懵了：“我和谁在一起了？”</p><p class="story-paragraph dialogue" data-source-key="143:105">“和你一起吃饭的女生。”我咬牙切齿地说。</p><p class="story-paragraph dialogue" data-source-key="143:106">“那是我补习班的同学，而且我不是和她单独去的，还有几个人一起的。”</p><p class="story-paragraph dialogue" data-source-key="143:107">“胡说，我当时看到那里只坐了你们两个。”</p><p class="story-paragraph dialogue" data-source-key="143:108">“他们去卫生间了，但凡你多等一会儿，就能看到他们回来了。”</p><p class="story-paragraph" data-source-key="143:109">所有的一切都是我一个人的胡思乱想。我还有些不甘心，但也不知道该说什么。</p><p class="story-paragraph dialogue" data-source-key="143:110">“你问完了，那现在轮到我问了吗？”</p><p class="story-paragraph" data-source-key="143:111">宋银硕云淡风轻地说。</p><p class="story-paragraph dialogue" data-source-key="143:112">“你刚刚说我明知道，我明知道什么？”</p><p class="story-paragraph" data-source-key="143:113">我呼吸一滞。</p><p class="story-paragraph dialogue" data-source-key="143:114">“什么？为什么因为我哭成这样？”</p><p class="story-paragraph" data-source-key="143:115">我什么都没有回答。深呼吸了几次，借着还未散去的酒意，我终于抬头看向他的眼睛，然后看向他猫咪一样弯弯的嘴唇，心想，大不了就和之前一样，再也不要说话了。</p><p class="story-paragraph" data-source-key="143:116">心一横，捧着宋银硕的脸，吻了上去。</p><p class="story-paragraph" data-source-key="143:117">我看到他极速瞪大的双眼，只是嘴唇贴嘴唇就让他的脸颊红得像发烧一样。</p><p class="story-paragraph dialogue" data-source-key="143:118">“你疯了！”</p><p class="story-paragraph" data-source-key="143:119">宋银硕猛地推开我。</p><p class="story-paragraph dialogue" data-source-key="143:120">“我没疯。”</p><p class="story-paragraph" data-source-key="143:121">终于轮到我做平静的那个人了。</p><p class="story-paragraph" data-source-key="143:122">宋银硕呆坐在我的床沿，一直是一副不可置信的表情，半分钟后，他才落荒而逃。</p><p class="story-paragraph" data-source-key="143:123">我从来没见过这样的宋银硕，好笑的同时，心里又有些苦涩。</p><p class="story-paragraph" data-source-key="143:124">下床关上了房间的灯，然后把自己埋进被子里。</p><p class="story-paragraph" data-source-key="143:125">我发现自己根本无法承受失去哥哥的后果，在心里编好了明天和他辩解的理由，就说我喝多了喜欢亲人，恩智和炤熙都被我亲了好几遍了，不信你可以去问。</p><p class="story-paragraph" data-source-key="143:126">这时，宋银硕又敲开我的门。</p><p class="story-paragraph" data-source-key="143:127">走廊的灯光照射进我的房间，我看着他低头回到我的床前，心里刚理好的草稿又乱成一团。只好闭上眼睛。</p><p class="story-paragraph dialogue" data-source-key="143:128">“对不起，我刚刚…”</p><p class="story-paragraph dialogue" data-source-key="143:129">“……”</p><p class="story-paragraph dialogue" data-source-key="143:130">“…算了。”我听见他叹了口气：“你睡吧。”</p><p class="story-paragraph dialogue" data-source-key="143:131">“我睡不着。”</p><p class="story-paragraph dialogue" data-source-key="143:132">“如果你不牵着我的话，我睡不好。”</p><p class="story-paragraph dialogue" data-source-key="143:133">“你呀…”</p><p class="story-paragraph" data-source-key="143:134">宋银硕的语气有些无可奈何，但还是坐在我的床沿，在朦胧之中摸索到我的手。他不肯躺下，就像一座大理石雕像一般，固执地守在我的床边。</p><p class="story-paragraph dialogue" data-source-key="143:135">“你看着我，我睡不着。”</p><p class="story-paragraph dialogue" data-source-key="143:136">“那我不看你，我看点别的。”</p><p class="story-paragraph" data-source-key="143:137">他把台灯打开，随手抽了一本书。</p><p class="story-paragraph" data-source-key="143:138">我想听他的声音，就让他给我读。</p><p class="story-paragraph" data-source-key="143:139">宋银硕没有扭捏，我闭上眼睛，手心传递过来的是他的温度，耳边萦绕的也是他的声音，在我如此短暂的人生中，还能找到比这更安定的时刻吗？</p><p class="story-paragraph" data-source-key="143:140">还好，我的哥哥是宋银硕，宋银硕是无论我提出什么要求都会淡然答应的哥哥。</p><p class="story-paragraph" data-source-key="143:141">他一直读着，直到故事过去了一半，嗓子都有点哑了。我听到他指尖捻动纸张的声音，最终“啪”地一声，书被他轻轻合上。</p><p class="story-paragraph" data-source-key="143:142">他试探性地叫了一声我的名字。我装睡，没有回答。听着他的声音，我舍不得睡，因为不想错过一秒。</p><p class="story-paragraph" data-source-key="143:143">确认我已经“进入梦乡”后，宋银硕抽走与我相牵的手，然后轻手轻脚地把书放回原位。</p><p class="story-paragraph" data-source-key="143:144">我以为他会直接转身回去自己的房间，但他非但没有，还定定地站在我的床头，在黑暗中注视着我。</p><p class="story-paragraph" data-source-key="143:145">最后俯身，非常轻的，在我的额头上落下一个克制的吻。</p><p class="story-paragraph" data-source-key="143:146">听到他关上门，我才睁开眼睛。</p></div>

      <article class="chapter" data-chapter="chapter-10">
        <header class="chapter-header"><span class="chapter-number">10</span><h2>Chapter 10</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="148:0">同父异母的兄妹，可以在一起吗？</p><p class="story-paragraph" data-source-key="148:1">就算知道答案，我还是控制不住地去网络上检索。像一条竭泽之鱼，哪怕能找到一点点的水源，看到一点点的认同。</p><p class="story-paragraph" data-source-key="148:2">得到的结果当然是不行。</p><p class="story-paragraph" data-source-key="148:3">不行，不行，不行。</p><p class="story-paragraph" data-source-key="148:4">不管是生理上，还是伦理上，或者法律上，都不可以。</p><p class="story-paragraph" data-source-key="148:5">同父异母的兄妹之间产生的恋情，是禁断的，不伦的，见不得光的。如果我说我好像喜欢上了我同父异母的哥哥，不光身边的朋友会惊恐，世人会指责，我的父亲也肯定会避我如蛇蝎一般不管不顾地把我赶走。</p><p class="story-paragraph" data-source-key="148:6">真的一点办法都没有吗？</p><p class="story-paragraph" data-source-key="148:7">就连恩智和炤熙我都不敢告诉，一个人守着这个惊天大秘密，这种滋味并不好受，可我必须做好要一辈子守口如瓶的准备，这个秘密将被我带进坟墓里，成为我火化后藏在骨灰中的舍利子。</p><p class="story-paragraph" data-source-key="148:8">这就是我爱上哥哥的代价。</p><p class="story-paragraph" data-source-key="148:9">宋银硕以为我不知道他留给我的那个吻，所以还能像个没事人一样跟我说话。</p><p class="story-paragraph" data-source-key="148:10">在那之后，他每天晚上都会跑回来和我一起吃饭，然后再踏着匆匆的步伐回去。我心疼他为了我浪费了很多时间，便在家学起了做饭。</p><p class="story-paragraph" data-source-key="148:11">最初的成果并不美丽，我自己忍着难以下咽的味道吃了不知多少份失败品，做出来的最棒的那份还是比不上宋银硕的手艺。但宋银硕不觉得有什么，十分给面子地把我做出来的饭菜吃得一干二净。</p><p class="story-paragraph" data-source-key="148:12">我也不知道为什么独自生活了这么多年都没有学会做饭，但把下厨投喂的对象换成宋银硕后，自己对料理的欲望便陡然上升。</p><p class="story-paragraph" data-source-key="148:13">是因为自己不重要吗？</p><p class="story-paragraph" data-source-key="148:14">还是因为宋银硕太重要了呢。</p><p class="story-paragraph" data-source-key="148:15">每次他气定神闲地吃掉我做出的垃圾饭时，我的心里并没有想象中的那么开心，反而有时…会觉得难过，甚至慢慢的，生长出了埋怨的心理。</p><p class="story-paragraph" data-source-key="148:16">不管我做什么饭他都会吃掉，就像不管我说什么他都会听从那样。</p><p class="story-paragraph" data-source-key="148:17">可是宋银硕。可以不要表现得好像什么都愿意答应我一样吗？</p><p class="story-paragraph" data-source-key="148:18">可以不要给我那么多错觉吗？</p><p class="story-paragraph" data-source-key="148:19">正是因为他那副永远处变不惊的模样，我开始怀疑那天的额头吻究竟是不是真的。</p><p class="story-paragraph" data-source-key="148:20">那个额头吻，究竟是真实存在的吗？</p><p class="story-paragraph" data-source-key="148:21">每一次关灯躺在床上，我的手心总会自动回忆宋银硕的触觉，和他十指相扣。我闭上眼睛，额头就能感受到他双唇的温度，再一睁眼，又全都消失不见，就像一场梦魇，所以那究竟是真的吗？</p><p class="story-paragraph" data-source-key="148:22">如果是真的，那它代表着什么呢？</p><p class="story-paragraph" data-source-key="148:23">郑成灿久违地给我发消息，问我有没有时间和他一起去看新上映的电影。</p><p class="story-paragraph dialogue" data-source-key="148:24">[我拿到两张票 但银硕要去补习班]</p><p class="story-paragraph dialogue" data-source-key="148:25">[可以啊]</p><p class="story-paragraph" data-source-key="148:26">我平静地答应下来。</p><p class="story-paragraph dialogue" data-source-key="148:27">[不然浪费了怪可惜的]</p><p class="story-paragraph" data-source-key="148:28">看着郑成灿发送来的开场时间，我眉头抽了抽。只剩不到一小时了。</p><p class="story-paragraph" data-source-key="148:29">知道郑成灿喜欢随心所欲的出门，但没想到他随心到这种程度。</p><p class="story-paragraph" data-source-key="148:30">我赶紧换了身衣服，踩上鞋子夺门而出，一边走一边给宋银硕发消息，说自己要出去一趟，让他在外面解决晚饭。</p><p class="story-paragraph" data-source-key="148:31">可能是正在上课中，宋银硕并没有回复我。</p><p class="story-paragraph" data-source-key="148:32">赶到影院门口时，距离开场还有十分钟。</p><p class="story-paragraph" data-source-key="148:33">我站在原地等待郑成灿，又过了五分钟，才看到他从电梯口出来。</p><p class="story-paragraph" data-source-key="148:34">到我身边时，他已是气喘吁吁。</p><p class="story-paragraph dialogue" data-source-key="148:35">“我们…我们，先等等。”</p><p class="story-paragraph dialogue" data-source-key="148:36">“还等吗？电影要开场了哎。”</p><p class="story-paragraph dialogue" data-source-key="148:37">“嗯。”郑成灿有些为难地挠了挠头：“银硕说他也来。”</p><p class="story-paragraph dialogue" data-source-key="148:38">“啊？”</p><p class="story-paragraph" data-source-key="148:39">意料之外，又意料之中的。</p><p class="story-paragraph" data-source-key="148:40">一瞬间，不知道自己该失望还是该欣喜，只是翘首以盼着宋银硕的到来。</p><p class="story-paragraph" data-source-key="148:41">就这样又等了几分钟，看到他步履匆匆地出现，刘海乱糟糟地垂在额头前，鬓角也有汗湿的痕迹，他随手拨弄了一下头发，然后不知道跟谁说了句：“抱歉”。我的心里也有了答案。</p><p class="story-paragraph" data-source-key="148:42">加票时没有连座了，就单独买了一张后面的位置。</p><p class="story-paragraph" data-source-key="148:43">看着出票机缓缓吐出三张票，我有些犯难，还是选择自己拿过那张位于后面的票：“你们坐一起吧，我…”</p><p class="story-paragraph dialogue" data-source-key="148:44">“不用，我去后面就行。”</p><p class="story-paragraph" data-source-key="148:45">宋银硕伸手抽走了它。</p><p class="story-paragraph" data-source-key="148:46">进去时，电影已经开场了，我和郑成灿坐在前排，宋银硕坐在我的身后。</p><p class="story-paragraph" data-source-key="148:47">郑成灿瞪着大眼睛看着电影屏幕，凑过来小声问我：“前面是什么剧情啊。”</p><p class="story-paragraph" data-source-key="148:48">我有些无奈，也凑到他耳边：“我不知道，我也没看见啊。”</p><p class="story-paragraph" data-source-key="148:49">突然感觉身后凉飕飕的，就算后脑勺没长眼睛，也能想象到宋银硕此时的表情。</p><p class="story-paragraph" data-source-key="148:50">很难不让人在意。</p><p class="story-paragraph" data-source-key="148:51">整场电影我都如坐针毡，只有郑成灿一个人看得津津有味。</p><p class="story-paragraph" data-source-key="148:52">结束后我们出去，郑成灿一直在跟我讨论剧情，我因为根本没看进去电影，一直回答得心不在焉。</p><p class="story-paragraph" data-source-key="148:53">他又问宋银硕觉得怎么样，宋银硕也含糊着回答：“嗯，就，挺好的。”</p><p class="story-paragraph" data-source-key="148:54">我怀疑他根本就没看电影，一眼都没看，因为整场电影我都能感受到宋银硕盯着我的视线。</p><p class="story-paragraph" data-source-key="148:55">在岔路口和郑成灿分开后，我没忍住，问宋银硕今天怎么来了。</p><p class="story-paragraph dialogue" data-source-key="148:56">“每天上补习班，太枯燥了，出来调节下心情。”</p><p class="story-paragraph dialogue" data-source-key="148:57">“那你觉得这个电影怎么样？”</p><p class="story-paragraph dialogue" data-source-key="148:58">“嗯，就，挺好的。”</p><p class="story-paragraph dialogue" data-source-key="148:59">“你是不是不希望我和郑成灿坐在一起。”</p><p class="story-paragraph dialogue" data-source-key="148:60">“……”</p><p class="story-paragraph" data-source-key="148:61">他尴尬地咳了一下：“没有。”</p><p class="story-paragraph dialogue" data-source-key="148:62">“口是心非。”</p><p class="story-paragraph" data-source-key="148:63">我低下头，看着我们两个并行的脚步。</p><p class="story-paragraph dialogue" data-source-key="148:64">“那你为什么不让我去坐后面，你和郑成灿坐一起不就好了吗。”</p><p class="story-paragraph dialogue" data-source-key="148:65">“…感觉你会更想坐前面。”</p><p class="story-paragraph" data-source-key="148:66">宋银硕目视前方说出这句话。</p><p class="story-paragraph" data-source-key="148:67">心里的池水仿佛落了只蜻蜓，一圈一圈地泛开。</p><p class="story-paragraph" data-source-key="148:68">你说对了。但我更想的，是和你一起坐在前面。</p><p class="story-paragraph" data-source-key="148:69">我在心里想。</p><p class="story-paragraph" data-source-key="148:70">沉默地走在回家的路上，太阳落山，月亮升起，一盏一盏的路灯开始夜晚的工作，其实我还有问题，也藏在静谧的夜晚中。</p><p class="story-paragraph" data-source-key="148:71">那个吻是真的吗？</p><p class="story-paragraph" data-source-key="148:72">为什么要吻我呢？</p><p class="story-paragraph" data-source-key="148:73">为什么要一直对我这么好呢？</p><p class="story-paragraph" data-source-key="148:74">同父异母的兄妹，真的不能在一起吗？</p><p class="story-paragraph" data-source-key="148:75">推开房门前，我的脑海里都是这些问题，一并涌上脑海，像蟹笼里的螃蟹，同时挣扎着往上爬，最后谁都爬不到出口。</p><p class="story-paragraph" data-source-key="148:76">宋银硕经过我时，问我怎么一直在原地站着。</p><p class="story-paragraph" data-source-key="148:77">我又一次缠着他：“给我讲故事吧。”</p><p class="story-paragraph dialogue" data-source-key="148:78">“你都多大了还要听睡前故事。”</p><p class="story-paragraph" data-source-key="148:79">我不动，就那样沉默地站在门口，颇像一个家长不给买玩具就不肯走的熊孩子。</p><p class="story-paragraph" data-source-key="148:80">僵持了一阵后，宋银硕又败下阵来，妥协地朝我走来。</p><p class="story-paragraph dialogue" data-source-key="148:81">“好好好…”</p><p class="story-paragraph" data-source-key="148:82">我胜利了，欢天喜地般回到卧室。</p><p class="story-paragraph" data-source-key="148:83">宋银硕关掉大灯，点亮台灯，在书柜前徘徊了一会儿，问我：“还读上次的吗？”</p><p class="story-paragraph" data-source-key="148:84">我无所谓地“嗯嗯”回答。</p><p class="story-paragraph" data-source-key="148:85">他抽出上次没读完的那本夜莺与玫瑰，坐回我的床边，纸张哗啦啦地翻动，寻找上次停顿的位置。</p><p class="story-paragraph" data-source-key="148:86">在一个寒冷的冬夜，一个年轻的学生要献上一朵红玫瑰才能与心仪的姑娘共舞。当夜莺听到年轻的学生因无法采得一朵红玫瑰而悲泣时，以为学生正是它一直在歌唱和寻找的真情人。于是，为了帮助心爱的学生达成愿望，夜莺毅然决定用自己的生命之血培育一朵红玫瑰。</p><p class="story-paragraph" data-source-key="148:87">宋银硕缓缓地读着。</p><p class="story-paragraph" data-source-key="148:88">我在心里摇头反对。</p><p class="story-paragraph" data-source-key="148:89">如果我是它的话，我绝对不会放弃自己去成全别人的爱。</p><p class="story-paragraph" data-source-key="148:90">正如我做不到把宋银硕拱手让人那样。如果可以的话，我会自私地想要他永远都找不到真爱。</p><p class="story-paragraph" data-source-key="148:91">他的真爱不可以是别人，只能是我。</p><p class="story-paragraph" data-source-key="148:92">也不可能是我。</p><p class="story-paragraph" data-source-key="148:93">夜莺与玫瑰的故事还在上演，夜莺放弃了自己的生命，只为成全爱人的幸福。</p><p class="story-paragraph" data-source-key="148:94">我很想叫宋银硕不要再读了，这个故事听得我很悲伤，但读到夜莺死去时，宋银硕自己停了下来。</p><p class="story-paragraph" data-source-key="148:95">我听见他在深呼吸。</p><p class="story-paragraph dialogue" data-source-key="148:96">“睡着了吗？”</p><p class="story-paragraph" data-source-key="148:97">他自言自语道。</p><p class="story-paragraph" data-source-key="148:98">我闭着眼睛，一动也不动，把呼吸拉长成酣睡的状态。</p><p class="story-paragraph" data-source-key="148:99">装睡，因为我想确认一些事情。</p><p class="story-paragraph" data-source-key="148:100">宋银硕轻轻叫了一声我的名字，我没有反应。他像上次一样，蹑手蹑脚地把书放回书架上。</p><p class="story-paragraph" data-source-key="148:101">书脊落到木板的声音，干净利落的像个圆滚滚的句号，直到这一刻就是剧终了。</p><p class="story-paragraph" data-source-key="148:102">不，还没有结束。</p><p class="story-paragraph" data-source-key="148:103">我没听到他离开的脚步，他还站在原地，透过朦胧冷淡的白色月光，穿透所有的不真实感，把吻带到我的额头。</p><p class="story-paragraph" data-source-key="148:104">但这次他偷吻我的时候，我睁眼了。</p><p class="story-paragraph dialogue" data-source-key="148:105">“你也喜欢我，对吧。”</p><p class="story-paragraph" data-source-key="148:106">他吓了一跳：“你没睡？”</p><p class="story-paragraph dialogue" data-source-key="148:107">“对吗？”我执着地问。</p><p class="story-paragraph" data-source-key="148:108">宋银硕没有说话。</p><p class="story-paragraph" data-source-key="148:109">或许让浓稠的夜晚吞掉所有的秘密会是我们之间最好的选择。但模糊的完美与全知的赴险，我会选择走向那条不归路。因为我的爱情本身就是一场赴险，整个世界的伦理都在与我对抗，这样是不可以的。可哪样是可以的呢？什么时候连爱也要分黑白对错了呢？</p><p class="story-paragraph" data-source-key="148:110">他没说是，也没说不是。</p><p class="story-paragraph dialogue" data-source-key="148:111">“我是你哥哥。”</p><p class="story-paragraph" data-source-key="148:112">宋银硕艰难地说。</p><p class="story-paragraph" data-source-key="148:113">哥哥，我从来都没想过让你当我的哥哥，我不需要哥哥，我只需要宋银硕。</p><p class="story-paragraph dialogue" data-source-key="148:114">“可是你明明就！”</p><p class="story-paragraph" data-source-key="148:115">我见他要离开，急得去抓他的领口，想扯住衣服，却勾到了他脖子上的黑色绳链。</p><p class="story-paragraph" data-source-key="148:116">他被勒得暂停呼吸，一瞬间失去重心，倒在床铺上。</p><p class="story-paragraph" data-source-key="148:117">瞳孔之间的距离急剧缩短，我闭上双眼。</p><p class="story-paragraph" data-source-key="148:118">全部摇摇欲坠，我几乎能看到崖壁边滚落的泥土石块，坠落到深不见底的缝隙，连回声都听不见。</p><p class="story-paragraph" data-source-key="148:119">这是绝境，现在勒马已经来不及了。</p><p class="story-paragraph" data-source-key="148:120">就算要粉身碎骨。</p><p class="story-paragraph" data-source-key="148:121">我贴过去，唇齿相撞的痛感带走我所有的自控力。</p><p class="story-paragraph" data-source-key="148:122">双唇再次相贴，却不同于上次的蜻蜓点水。我凭着本能去咬他的下唇，像是要发泄一般，品尝到了不属于自己的血腥味。</p><p class="story-paragraph" data-source-key="148:123">他由抗拒，变得顺从，到最后开始回吻。</p><p class="story-paragraph" data-source-key="148:124">宋银硕捧着我的脸，紧绷着手臂不让我抽身，湿热的呼吸交缠在一起，全部的道德都被我们抛之脑后，好像明天就是世界末日了一样，什么都不用管，什么都不用想，只要紧紧抱住我的哥哥，一起下沉。</p><p class="story-paragraph" data-source-key="148:125">等到我的手探进他半袖的下摆时，宋银硕才清醒过来。</p><p class="story-paragraph dialogue" data-source-key="148:126">“不，”他脆弱又沙哑地，按住了我的手。</p><p class="story-paragraph dialogue" data-source-key="148:127">“这个真的不可以。”</p><p class="story-paragraph" data-source-key="148:128">我的手被他抓着拿出去，像搁置易碎易爆品一样，他把我的手放回了被子上，拿开之前，又像恋恋不舍，紧握了一下才松手。</p><p class="story-paragraph dialogue" data-source-key="148:129">“该睡了。”</p><p class="story-paragraph" data-source-key="148:130">他退后几步，毅然决然地转身。</p><p class="story-paragraph" data-source-key="148:131">我还没有从那个吻中挣扎出来，等我反应过来时，立刻甩开身上的被子，跟着他跑到他的房间。</p><p class="story-paragraph dialogue" data-source-key="148:132">“不，不行。”</p><p class="story-paragraph" data-source-key="148:133">猛地从背后抱住他，差点把他扑了个趔趄。宋银硕稳住身形后，想要拽开我环在他腰间的双臂。</p><p class="story-paragraph" data-source-key="148:134">手悬在空中踟蹰了许久，最后放下了。</p><p class="story-paragraph dialogue" data-source-key="148:135">“不要赶我走。”</p><p class="story-paragraph" data-source-key="148:136">我把脸埋在他单薄的后背里：“我什么都不会做，你不要赶我走。”</p><p class="story-paragraph" data-source-key="148:137">宋银硕哑笑：“你怎么不担心我做什么？”</p><p class="story-paragraph dialogue" data-source-key="148:138">“你要是真做什么就好了。”</p><p class="story-paragraph dialogue" data-source-key="148:139">“……”</p><p class="story-paragraph" data-source-key="148:140">和我想象的一样，宋银硕再次接受了我的要求。</p><p class="story-paragraph" data-source-key="148:141">我躺倒在他的床上，这次他没去柜子里抱出备用的被子，而是躺在我的身后，犹豫了一下，从后面把我抱住。</p><p class="story-paragraph" data-source-key="148:142">宋银硕用下巴抵在我的头顶，隔着睡衣的布料，他的胸口紧贴着我的后背，心跳像雨水从屋檐滴落，回声嗒嗒流入我的血液。而在身后和我紧密相贴的他的身体中，本来就有一半和我相同的血脉，每一个毛细血管都像是嗅到了同类的气息，连流动的速率都逐渐趋同。</p><p class="story-paragraph" data-source-key="148:143">我把自己完完全全地缩进宋银硕的环境。宋银硕的枕头，宋银硕的被子，宋银硕的怀抱。</p><p class="story-paragraph" data-source-key="148:144">明白了什么叫落叶归根，倦鸟归巢。</p><p class="story-paragraph" data-source-key="148:145">宋银硕在的地方，就是我可以扎根的地方，就是我可以筑巢的地方。</p><p class="story-paragraph" data-source-key="148:146">半梦半醒之前，我喃喃地说：</p><p class="story-paragraph dialogue" data-source-key="148:147">“这个世界上，只有你愿意收留我了。”</p></div>

      <article class="chapter" data-chapter="chapter-11">
        <header class="chapter-header"><span class="chapter-number">11</span><h2>Chapter 11</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="153:0">第二天睡醒时，宋银硕已经不在身边了。</p><p class="story-paragraph" data-source-key="153:1">阳光透过白色的窗帘落到柔软的床铺上，我伸手摸向身后的位置，没有温度。</p><p class="story-paragraph" data-source-key="153:2">一瞬间，心里像是丢了块石子打水漂，轻轻的在水面点了几个涟漪，最后沉进水中，了无音讯。</p><p class="story-paragraph" data-source-key="153:3">好像知道会发生什么了。</p><p class="story-paragraph" data-source-key="153:4">我慌张地踩上拖鞋，到客厅去找他，但整个家里都不见他的身影，直到我看到茶几上的留言。</p><p class="story-paragraph" data-source-key="153:5">早饭在锅里。</p><p class="story-paragraph" data-source-key="153:6">乍一看，好像这只是个平静的清晨，像过去的每一个清晨一样。</p><p class="story-paragraph" data-source-key="153:7">但我知道，这种宁静只是假象。</p><p class="story-paragraph" data-source-key="153:8">一切都不一样了，昨晚的亲昵，就是崩坏的临界值了。</p><p class="story-paragraph" data-source-key="153:9">宋银硕开始躲着我了。</p><p class="story-paragraph" data-source-key="153:10">我坐在沙发上，木木地嚼着宋银硕留下的早餐。用牙齿咬断，咀嚼，吞咽，每一个动作都仿佛机械输入的指令，仅仅是凭本能做出的动作。我的灵魂去哪里了呢？它落在夜莺与玫瑰的书脊上，落在褶皱的床铺上，落在他手写的纸条上，落在离我越来越远的他那里。</p><p class="story-paragraph" data-source-key="153:11">美梦结束了，不是吗？</p><p class="story-paragraph" data-source-key="153:12">我们之间伦理的绳索已经绷到了最紧，在昨晚的深吻后，被生生的扯断了，无力地垂在一旁，像一条死气沉沉的蛇。</p><p class="story-paragraph" data-source-key="153:13">嘴唇上还停留着宋银硕的触觉，如今，我终于不用再猜想那些瞬间究竟是真还是想象而已了。它清晰地残留在我的唇间，像一口气喝掉一整杯果汁，残余物挂在杯壁上，舔一下还是甜的，但已经干涸了。已经结束了。</p><p class="story-paragraph" data-source-key="153:14">我犹豫着要不要给他发消息，迫切需要知道他在哪里，还会不会回来，可是又怕他埋怨我，是我把他拉进危险区域的。</p><p class="story-paragraph" data-source-key="153:15">不，他是宋银硕。宋银硕永远都不会怪罪我。</p><p class="story-paragraph dialogue" data-source-key="153:16">［你几点回来？］</p><p class="story-paragraph" data-source-key="153:17">我颤抖着指尖按下发送键，心脏立刻忐忑不安地躁动起来。</p><p class="story-paragraph" data-source-key="153:18">要是他去他父母那里了怎么办，要是他也对我避之不及了怎么办，要是他真的再也不回来了，怎么办？</p><p class="story-paragraph" data-source-key="153:19">隔了好一会儿，他才回我。</p><p class="story-paragraph dialogue" data-source-key="153:20">［晚上吧］</p><p class="story-paragraph" data-source-key="153:21">过阵又补充一条：</p><p class="story-paragraph dialogue" data-source-key="153:22">［五点钟 ］</p><p class="story-paragraph" data-source-key="153:23">我松了一口气，还好，宋银硕没有抛弃我。</p><p class="story-paragraph" data-source-key="153:24">接下来的一天，我都坐立不安地在沙发上等待。电视机里播放着宋银硕喜欢的动漫，我抱着膝盖陷在沙发里，只能听到天书一样的日语左耳进右耳出，大脑则一直处于呆滞的状态。仿佛自己成为了小王子里的狐狸，眼巴巴地等着他回来，他说五点到家，可我从他说完的那一刻起就开始等待。我期盼他回来，希望能看到他温和的双眼，希望听到他的声音，希望能够回到他的怀抱里……这是被驯服的代价，承认自己陷入爱情的过程，就等同于承认自己被驯服的过程。</p><p class="story-paragraph" data-source-key="153:25">如果他更早回来，我会开心，晚些回来，我会失望。宋银硕的每一个举措都牵动着我的神经。</p><p class="story-paragraph" data-source-key="153:26">终于，我听到门口传来开门的声音。</p><p class="story-paragraph" data-source-key="153:27">像只留守在家的宠物一样竖起耳朵，等他进来的时候，又要装出不在意的样子。</p><p class="story-paragraph dialogue" data-source-key="153:28">“你回来了？”还是忍不住和他说话。</p><p class="story-paragraph dialogue" data-source-key="153:29">“嗯。”宋银硕垂眸，我看到他身后的门没关，紧接着又进来了一位。</p><p class="story-paragraph" data-source-key="153:30">他带了郑成灿回来。</p><p class="story-paragraph" data-source-key="153:31">郑成灿看到我在家，热情地和我打了招呼。</p><p class="story-paragraph" data-source-key="153:32">我尴尬地笑了笑：“你来了啊。”</p><p class="story-paragraph dialogue" data-source-key="153:33">“银硕说要下厨，但你们两个人吃不完，就把我也叫过来了。”</p><p class="story-paragraph" data-source-key="153:34">郑成灿轻车熟路地换上居家鞋，很自然地坐到沙发上，和我保持着一小段距离。</p><p class="story-paragraph" data-source-key="153:35">我的视线仍追着宋银硕跑，看他把书包丢到地上，然后打开冰箱，自言自语地念叨着：“没东西了。”</p><p class="story-paragraph" data-source-key="153:36">再转身回来，全程都没有看我一眼。</p><p class="story-paragraph dialogue" data-source-key="153:37">“我去买菜。”</p><p class="story-paragraph dialogue" data-source-key="153:38">“我也去！”</p><p class="story-paragraph" data-source-key="153:39">我急得快要跳起来，宋银硕的视线终于在我这里停留了一下，随后不动声色地移开。</p><p class="story-paragraph dialogue" data-source-key="153:40">“你和成灿在家等我，我很快就回来。”</p><p class="story-paragraph" data-source-key="153:41">郑成灿好像也有些意外似的：“要不我也去？”</p><p class="story-paragraph dialogue" data-source-key="153:42">“不用。”宋银硕淡淡地否决：“去趟超市而已。”</p><p class="story-paragraph" data-source-key="153:43">我呆呆站在原地，心中的纹裂逐渐扩大，最终碎了一地。</p><p class="story-paragraph" data-source-key="153:44">我想，我懂宋银硕的话外之音了。</p><p class="story-paragraph" data-source-key="153:45">电视里的动漫还在继续播放，我和郑成灿沉默地坐在沙发上，他目不转睛地盯着眼前的大屏幕，但我知道他不感兴趣，从中途开始看的话也看不进去的。</p><p class="story-paragraph" data-source-key="153:46">我产生了想要逃避的心情。</p><p class="story-paragraph dialogue" data-source-key="153:47">“我去拿点零食。”</p><p class="story-paragraph" data-source-key="153:48">郑成灿抬头看我时，微微露出兔牙，随后又默默低下头，没有说什么。</p><p class="story-paragraph" data-source-key="153:49">为了推迟回到郑成灿身边的时间，我故意磨磨蹭蹭地在冰箱前选择。最后抱着满满一怀的零食往回走，正巧宋银硕回来，和我面面相觑。</p><p class="story-paragraph dialogue" data-source-key="153:50">“少吃一点，一会儿还要吃饭呢。”</p><p class="story-paragraph" data-source-key="153:51">他瞥了我一眼，换好拖鞋后提起地上的袋子朝厨房走。</p><p class="story-paragraph" data-source-key="153:52">我紧抓着手中的塑料包装，包装袋的锯齿嵌进手掌，像一排排牙齿啮咬着我。我转身，又把它们一个个回归原位，然后仍不死心地跑到哥哥身边。</p><p class="story-paragraph dialogue" data-source-key="153:53">“需要我帮忙吗？”</p><p class="story-paragraph dialogue" data-source-key="153:54">“没有什么需要你帮忙的地方。”宋银硕顿了一下，似乎在思考什么。</p><p class="story-paragraph dialogue" data-source-key="153:55">“去和成灿坐着，等饭做好了一起吃就可以了。”</p><p class="story-paragraph dialogue" data-source-key="153:56">“可是我想帮你。”</p><p class="story-paragraph" data-source-key="153:57">宋银硕不为所动，我继续说：</p><p class="story-paragraph dialogue" data-source-key="153:58">“我想在这里，和你一起。”</p><p class="story-paragraph dialogue" data-source-key="153:59">“回去吧。”</p><p class="story-paragraph" data-source-key="153:60">他终于肯抬头直视我了。黑色的双眸中看不出任何情绪，没有责怪，也没有温存，皱着眉头无奈的样子，真像一个哄着妹妹的哥哥。</p><p class="story-paragraph dialogue" data-source-key="153:61">“饭一会儿就做好了，饿的话，就先吃点别的。”</p><p class="story-paragraph" data-source-key="153:62">随后低头，继续手中的动作。</p><p class="story-paragraph" data-source-key="153:63">我失魂落魄地回到沙发，发现郑成灿把动漫换成了电影，看氛围像是一部浪漫片。</p><p class="story-paragraph dialogue" data-source-key="153:64">“啊…我看你已经不看了，就关掉了。”</p><p class="story-paragraph dialogue" data-source-key="153:65">“没关系的。”</p><p class="story-paragraph" data-source-key="153:66">不管是什么电影，都无所谓了，反正我也无心观看。</p><p class="story-paragraph" data-source-key="153:67">把自己嵌进沙发靠背，和郑成灿坐在沙发上一言不发地看电影。偶尔能听到厨房传来叮叮当当的声音，总是惹得我转交视线，看向宋银硕的背影，围裙半松半紧的系在身上，勾勒出他的腰线。明明昨晚我的手臂也像围裙一样，环在他的腰上。可从今以后似乎再也没有这样的机会了。没想到有朝一日，我竟会羡慕起一条围裙。</p><p class="story-paragraph" data-source-key="153:68">吃饭的时候，宋银硕也没有像之前那样。他的话变少了，都是郑成灿在说，我为了不让他冷场，强装出兴奋的样子，和他聊的热火朝天。我说的越多，宋银硕的面色就越暗淡，最后他开始频繁地离座。</p><p class="story-paragraph" data-source-key="153:69">只有郑成灿一个人被蒙在鼓里。</p><p class="story-paragraph dialogue" data-source-key="153:70">“对了，银硕去日本的话，你要一个人住在这里吗？”</p><p class="story-paragraph" data-source-key="153:71">宋银硕回房间时，郑成灿突然跟我提起。</p><p class="story-paragraph" data-source-key="153:72">我有点不太理解：“啊？去什么日本？”</p><p class="story-paragraph dialogue" data-source-key="153:73">“你不知道吗？”郑成灿的表情有些意料之外：“银硕他打算出国留学了。”</p><p class="story-paragraph dialogue" data-source-key="153:74">“…啊。”</p><p class="story-paragraph" data-source-key="153:75">乍一听说，心里还迟钝着，不知道该以怎样的心情面对。</p><p class="story-paragraph dialogue" data-source-key="153:76">“去哪？”我呆呆地问。</p><p class="story-paragraph dialogue" data-source-key="153:77">“日本吧，好像。”郑成灿好心地为我重复了一遍：“他没告诉你吗。”</p><p class="story-paragraph" data-source-key="153:78">我摇头。</p><p class="story-paragraph dialogue" data-source-key="153:79">“我不知道。”</p><p class="story-paragraph" data-source-key="153:80">根本不知道。</p><p class="story-paragraph dialogue" data-source-key="153:81">“什么时候的事？”</p><p class="story-paragraph dialogue" data-source-key="153:82">“前两天他才跟我提起，只是有这个想法。但一般他有想法了，就一定会去做的吧。”</p><p class="story-paragraph dialogue" data-source-key="153:83">“是啊，真好 。”</p><p class="story-paragraph" data-source-key="153:84">我喃喃道：“他最喜欢那些动漫和游戏之类的东西了，去了肯定会很开心吧。”</p><p class="story-paragraph" data-source-key="153:85">郑成灿赞同地点点头。</p><p class="story-paragraph" data-source-key="153:86">宋银硕回来时，手里端着切好的水果。</p><p class="story-paragraph" data-source-key="153:87">果盘落到我们面前，磕出清脆的响声。</p><p class="story-paragraph" data-source-key="153:88">他自始至终都躲避着我的视线，双唇禁抿，不肯正眼看我我。像在抗拒着什么，却又不安心让我完全脱离他的视野。我体会到他的矛盾，慢慢意识到。</p><p class="story-paragraph" data-source-key="153:89">宋银硕是铁了心要离开我的。</p><p class="story-paragraph" data-source-key="153:91">不久之前我还在想，如果宋银硕读了大学很少回家怎么办，他在外面谈了女朋友怎么办，他忘记我了怎么办？</p><p class="story-paragraph" data-source-key="153:92">可是他总是那幅模样，让我觉得好像现在这种平淡的日子就是永远一样，好像一切的担心都只是自己在杞人忧天，那些离别永远不会降临到我们身上。</p><p class="story-paragraph" data-source-key="153:93">可郑成灿告诉我，他已经有了离开的想法，甚至不是换个城市，而是要换个国家。</p><p class="story-paragraph" data-source-key="153:94">面对这样的消息，我只能抱头鼠窜，连问他一句都不敢。</p><p class="story-paragraph" data-source-key="153:95">我怕他亲口告诉我，是的，我要离开你，到另一个国度去，我要和你划清界限。</p><p class="story-paragraph" data-source-key="153:96">开学后，宋银硕就开始为高考做准备了，每天起早贪黑地上学，去补习班，或许还会偷偷学日语，但我不知道，因为我又没有和他说话的机会了。我出门时，他已经走了，我放学了，他还没有下课，我去洗澡，他刚到家，我准备睡了，而他还醒着。</p><p class="story-paragraph" data-source-key="153:97">生活看似规律，实则早已乱成一团。对我来说，白天和黑夜已经没有什么区别了，时间不是线性前进，而是拐了弯的走，弯弯曲曲盘绕蜿蜒，像逐渐抬升的峭壁山路，没有柳暗花明的可能，只有在下一个拐弯处失足坠崖的风险。</p><p class="story-paragraph" data-source-key="153:98">宋银硕应该也是这样想的吧。</p><p class="story-paragraph" data-source-key="153:99">如果他不离我远远的，那我们真的会摔向悬崖底，粉身碎骨死无全尸。而他不是可以疯狂到什么都不顾的人，他冷静、自持、而且擅长忍耐。就算我像条疯狗一样不顾一切地缠过去拉着他说大不了我们一起死，他也能用一句话一个眼神就让我的意识恢复清醒。</p><p class="story-paragraph" data-source-key="153:100">我们只是兄妹。</p><p class="story-paragraph" data-source-key="153:101">在浑浑噩噩中，高考很快结束了。</p><p class="story-paragraph" data-source-key="153:102">他毕业的那天，我去了他的毕业典礼。不只是为了宋银硕，也为了郑成灿。</p><p class="story-paragraph" data-source-key="153:103">想到电视剧里那些充满青春气息的毕业场景，我在路过花店时，进去选了两束花。</p><p class="story-paragraph" data-source-key="153:104">一束给郑成灿，一束给宋银硕。</p><p class="story-paragraph" data-source-key="153:105">郑成灿接过花的那一瞬间，脸瞬间爆红，手不自在地摸上了后脑勺，然后傻乎乎地笑起来。</p><p class="story-paragraph" data-source-key="153:106">我也跟着笑了。</p><p class="story-paragraph" data-source-key="153:107">宋银硕倒是面不改色，只有我发现他耳根通红，不是冬天太冷冻出来的，而是因为别的什么。</p><p class="story-paragraph dialogue" data-source-key="153:108">“要一起去吃饭庆祝一下吗？”郑成灿问。</p><p class="story-paragraph dialogue" data-source-key="153:109">“好呀。”我立马捧场回答。</p><p class="story-paragraph dialogue" data-source-key="153:110">“我约了别人，你们去吃吧。”</p><p class="story-paragraph" data-source-key="153:111">宋银硕不自在地把脸别到一边，我和郑成灿同时愣住。</p><p class="story-paragraph" data-source-key="153:112">我还想继续问什么，宋银硕却不给我纠缠的机会：“别忘了你的门禁，早点回家。”</p><p class="story-paragraph dialogue" data-source-key="153:113">“那，我们走吧。”</p><p class="story-paragraph" data-source-key="153:114">郑成灿笑着看我，小鹿眼里盛满了期待的闪光。</p><p class="story-paragraph" data-source-key="153:115">我没办法拒绝，只能跟着郑成灿走。</p><p class="story-paragraph" data-source-key="153:116">心中却把宋银硕骂了一千一万遍。</p><p class="story-paragraph dialogue" data-source-key="153:117">“有没有什么想吃的？”</p><p class="story-paragraph dialogue" data-source-key="153:118">“都好。”</p><p class="story-paragraph" data-source-key="153:119">郑成灿没得到准确的答案，又不确定地问了一遍：“再想想吧。”</p><p class="story-paragraph" data-source-key="153:120">我苦恼了一阵，最后的答案还是一样的。</p><p class="story-paragraph dialogue" data-source-key="153:121">“我真的吃什么都可以。”</p><p class="story-paragraph" data-source-key="153:122">很显然在吃的方面，郑成灿也是纠结体质。似乎是觉得带我一个女生去Burger King不太好，所以他带我进了一家很漂亮的店。</p><p class="story-paragraph" data-source-key="153:123">很久很久之前，我似乎非常期待能和郑成灿有一段二人约会的时间。</p><p class="story-paragraph" data-source-key="153:124">现在他坐在我的对面，我满脑子想的却是宋银硕究竟约了谁一起。</p><p class="story-paragraph" data-source-key="153:125">这是我不知道第几次拿起手机。反复地查看宋银硕有没有给我发消息，连郑成灿的话都没听进耳朵。</p><p class="story-paragraph dialogue" data-source-key="153:126">“嗯？你说什么？”</p><p class="story-paragraph dialogue" data-source-key="153:127">“我说，我报的大学…”</p><p class="story-paragraph dialogue" data-source-key="153:128">“很好啊，那么好的大学，离家又近。”</p><p class="story-paragraph dialogue" data-source-key="153:129">“嗯。”郑成灿点点头：“很方便回来，甚至不住学校都可以了。”</p><p class="story-paragraph dialogue" data-source-key="153:130">“是啊。”我附和道。</p><p class="story-paragraph dialogue" data-source-key="153:131">“所以银硕不在的话，我会替他照顾你的。”</p><p class="story-paragraph" data-source-key="153:132">郑成灿笑得有些腼腆，我的表情却僵在了脸上。</p><p class="story-paragraph dialogue" data-source-key="153:133">“宋…我哥他拜托你的吗？”</p><p class="story-paragraph" data-source-key="153:134">他摇摇头，欲言又止，最后还是下定决心要说出来：“不是，是我…”</p><p class="story-paragraph dialogue" data-source-key="153:135">“好啊。”</p><p class="story-paragraph" data-source-key="153:136">我赶紧打断他，挤出一个灿烂的笑容，好像这样就可以掩盖住自己眼里的湿润一样。</p><p class="story-paragraph" data-source-key="153:137">郑成灿看到我这副模样，就把话题岔开到别的地方去了。</p><p class="story-paragraph" data-source-key="153:138">冬天天短，太阳缓缓落山，还没到真正的夜晚，外面的路灯就亮了起来。</p><p class="story-paragraph" data-source-key="153:139">郑成灿步行陪我回家，在看到拐角处的宋银硕时，对我说：“那我就送你到这里。”</p><p class="story-paragraph dialogue" data-source-key="153:140">“好。”我朝他摆摆手，想了一下，还是说了。</p><p class="story-paragraph dialogue" data-source-key="153:141">“下次见！”</p><p class="story-paragraph" data-source-key="153:142">郑成灿也挥着胳膊回复我：“下次见。”</p><p class="story-paragraph" data-source-key="153:143">等我回过头时，脸上的笑容已经纹裂了。</p></div>
