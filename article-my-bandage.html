      <article class="chapter" data-chapter="chapter-12">
        <header class="chapter-header"><span class="chapter-number">12</span><h2>Chapter 12</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="158:0">宋银硕站在几米开外的路灯下，望着我，没有表情。</p><p class="story-paragraph" data-source-key="158:1">我也同样倔强地站在原地，不肯向前。</p><p class="story-paragraph" data-source-key="158:2">黑色的大衣裹在他的身上，把他衬成了长长一条黑影，差点和地面的影子融为一体了。不知道站了多久，久到天空开始飘下零星的白色雪花，在暖调路灯的映射下，一片片的划过，像流星一样带着拖尾，最终降落到宋银硕的肩头。</p><p class="story-paragraph" data-source-key="158:3">当然是他先妥协的。</p><p class="story-paragraph" data-source-key="158:4">宋银硕一言不发地向我走来，三两步走到我面前，却在安全距离停下了。</p><p class="story-paragraph dialogue" data-source-key="158:5">“回家吗？外面很冷。”</p><p class="story-paragraph" data-source-key="158:6">我油盐不进的问他：“为什么要把我和郑成灿丢在一起？”</p><p class="story-paragraph dialogue" data-source-key="158:7">“……”</p><p class="story-paragraph dialogue" data-source-key="158:8">“你明知道我之前喜欢他，你也知道我现在…你却选择…却不肯和我们一起走，为什么？”</p><p class="story-paragraph" data-source-key="158:9">宋银硕放弃和我对视，缓缓地垂下头。</p><p class="story-paragraph" data-source-key="158:10">这段时间积累在心中的难言之痛，如今终于爆发，像在我的动脉上狠狠戳了个洞，血液如喷泉一样四溅，深深处那些情绪全都一股脑地顺着洞口涌出来，流到最后，我的体内变得空无一物。</p><p class="story-paragraph dialogue" data-source-key="158:11">“你说话啊…”</p><p class="story-paragraph" data-source-key="158:12">尾音带着颤抖的哭腔，我感觉自己快要虚脱了。</p><p class="story-paragraph dialogue" data-source-key="158:13">“对不起。”宋银硕沙哑地开口，“下次…不会再这样了。”</p><p class="story-paragraph dialogue" data-source-key="158:14">“没有下次了知道吗？没有下次了。”</p><p class="story-paragraph" data-source-key="158:15">我终于无助地哭了起来，像个被抛弃的孩子一样不顾一切地喊道：“你到底是什么想的！”</p><p class="story-paragraph" data-source-key="158:16">宋银硕有些动容地前进了半步，又停下了。保持在一个踟蹰的距离，可对我而言，这样的距离和彼岸一样遥远，这样的距离等同于无声的拒绝。</p><p class="story-paragraph dialogue" data-source-key="158:17">“那你为什么最开始不肯帮我和他撮合呢？如果…如果你最开始…我现在不可能，也不可能这样……”</p><p class="story-paragraph dialogue" data-source-key="158:18">“对不起…是我太自私了。”</p><p class="story-paragraph" data-source-key="158:19">他还是又朝我迈了一步。</p><p class="story-paragraph" data-source-key="158:20">冰凉的指尖擦掉了我没注意到的泪水，最后干脆双手捧着我的脸颊，用大拇指接管不断从我眼眶中流出的泪水。</p><p class="story-paragraph" data-source-key="158:21">宋银硕闭上眼睛，又轻声说了一遍。</p><p class="story-paragraph dialogue" data-source-key="158:22">“对不起。”</p><p class="story-paragraph" data-source-key="158:23">透过氤氲的水雾看着他，他的面庞就在咫尺之间，可是我想，再也没有比这更遥远的距离了。</p><p class="story-paragraph" data-source-key="158:24">我们就这样对视着，风雪不断地擦过，有一种老电影般的诗意，但这不是浪漫的时刻。</p><p class="story-paragraph" data-source-key="158:25">他放在我脸颊的手已经冻得僵直了，但他没有拿掉，而是慢慢俯身。</p><p class="story-paragraph" data-source-key="158:26">我闭上眼睛等待。</p><p class="story-paragraph" data-source-key="158:27">他的脸最终停留在我的额头前方，没有吻下来，落在我头上的换成了他柔软的掌心，带着克制地揉了揉我的头顶。</p><p class="story-paragraph dialogue" data-source-key="158:28">“我是你哥哥啊。”</p><p class="story-paragraph" data-source-key="158:29">轻飘飘的自言自语，很快被风吹散，浮在空中成为人们看不见的介质。</p><p class="story-paragraph" data-source-key="158:30">眼泪像断了线的珠子一样。</p><p class="story-paragraph" data-source-key="158:31">宋银硕笑得很无奈，又很悲怆。</p><p class="story-paragraph dialogue" data-source-key="158:32">“讨厌哥哥了吗？”</p><p class="story-paragraph" data-source-key="158:33">我破涕而笑。</p><p class="story-paragraph dialogue" data-source-key="158:34">“讨厌，全世界最讨厌的人就是你。”</p><p class="story-paragraph dialogue" data-source-key="158:35">“对不起。但就算你讨厌我，我也一直是你的哥哥，没有选择的余地。”</p><p class="story-paragraph dialogue" data-source-key="158:36">“我爱你。”</p><p class="story-paragraph" data-source-key="158:37">我执着地望着他的眼睛。</p><p class="story-paragraph" data-source-key="158:38">宋银硕微笑着，很久很久都没有回答。</p><p class="story-paragraph" data-source-key="158:39">最后，我的手被他牵住，他扯着我往家的方向走。</p><p class="story-paragraph dialogue" data-source-key="158:40">“别担心。”</p><p class="story-paragraph dialogue" data-source-key="158:41">“我会永远陪着你。”</p><p class="story-paragraph" data-source-key="158:42">是不是因为你是哥哥，你是宋银硕，你永远都不能对我说“我爱你”，</p><p class="story-paragraph" data-source-key="158:43">所以才用“我会永远陪着你”这种话来代替？</p><p class="story-paragraph" data-source-key="158:44">宋银硕从来没有跟我说过确切的离别日，我不知道那天会在什么时候到来。</p><p class="story-paragraph" data-source-key="158:45">我只知道他离开的那天将是我的死刑日，所以我不敢问，只是忐忑地过着每一天，像每一个等待判决的犯人那样，煎熬地等待。</p><p class="story-paragraph" data-source-key="158:46">我的成绩不如他，又不像郑成灿拥有体育特长，所以我也报了补课班。没等最后一个暑假，而是寒假开学的前夕就去了。</p><p class="story-paragraph" data-source-key="158:47">宋银硕每天都接送我，我们就像真正的兄妹那样，一起说说笑笑地回家，如果没有偶尔升起的悲哀感，我真的会以为自己失忆了。</p><p class="story-paragraph" data-source-key="158:48">每天，每天都陪着我，好像他根本不会离开那样。</p><p class="story-paragraph" data-source-key="158:49">在难得的休息日，他会叫上成灿，我们三个人一起吃饭、看电影、一起玩联机游戏。</p><p class="story-paragraph" data-source-key="158:50">就算被我看出了他的企图，我也乖乖地配合宋银硕，玩他的红娘过家家。</p><p class="story-paragraph" data-source-key="158:51">一次坐在教室里，室内的暖气出了问题，温度很低。我缩在座位上手凉脚凉，突然很想吃热乎乎的烤红薯。</p><p class="story-paragraph" data-source-key="158:52">课间我发消息告诉宋银硕，宋银硕答应我接我放学时会给我买过来。</p><p class="story-paragraph" data-source-key="158:53">但没想到老师拖堂拖了整整半小时，我在座位上躁动不安，想到在冷风中等待的宋银硕，心里像是热锅煎蚂蚁一样。</p><p class="story-paragraph" data-source-key="158:54">下课时我第一个飞奔出去，看到楼下熟悉的身影，激动得直接扑到他怀里，再抬头，看到宋银硕被冻得红扑扑的鼻尖和温柔的眼神，仿佛整个人成为一块慢慢融化的水果硬糖。</p><p class="story-paragraph dialogue" data-source-key="158:55">“慢点跑，万一摔了怎么办？”</p><p class="story-paragraph dialogue" data-source-key="158:56">“没关系，你会把我扶起来的。”</p><p class="story-paragraph" data-source-key="158:57">我接过他递过来的烤红薯，隔着纸袋摸上去，还是热的，我一边欢呼一边吃着甜到流蜜汁的烤红薯，回家进门脱下外套，看到宋银硕卫衣上的深色污渍，像一根银针刺痛我的眼睛。</p><p class="story-paragraph" data-source-key="158:58">那个冬天，宋银硕为了让我吃到心心念念的热红薯，把它藏在自己的里怀保温。他见到我时，才把它从自己的衣服里变出来。最适口的温度，我满足地吃着，不知道嘴里的甜蜜其实是宋银硕的体温。直到回家后他脱下羽绒服，我看到他卫衣腹部的地方有蜜薯的糖渍，才明白过来为什么他在外面等了我近四十分钟，我的烤红薯却还是温热的。</p><p class="story-paragraph" data-source-key="158:59">那一瞬间我很想抱着他大哭一场，不管我们是不是流淌着一半同样的血，不管他是不是我的哥哥。我只想吻他，想把手心贴近他的心脏，想用鼻尖感受他脖颈脉搏跳动的节奏，想不再靠间接才能把他的温度吞吃入腹。</p><p class="story-paragraph" data-source-key="158:60">但我只是看着他，他对我说晚安，用手揉了揉我的发顶，然后轻声说：</p><p class="story-paragraph dialogue" data-source-key="158:61">“快去洗澡，然后睡吧。”</p><p class="story-paragraph" data-source-key="158:62">红薯的蜜汁从胃里流到心里。</p><p class="story-paragraph" data-source-key="158:63">我眼里含着泪水，说，好。</p><p class="story-paragraph" data-source-key="158:64">其实也不用那么贪婪。</p><p class="story-paragraph" data-source-key="158:65">只要能感受到他掌心的温度就够了。</p><p class="story-paragraph" data-source-key="159:0">直到有一天深夜，我听到他的房间传来收拾行李的声音。接着门廊里传来行李箱滚动的声音。</p><p class="story-paragraph" data-source-key="159:1">就是今天了。</p><p class="story-paragraph" data-source-key="159:2">我躺在床上，透过月光看着天花板。</p><p class="story-paragraph" data-source-key="159:3">可我想不到他居然要在半夜逃走。</p><p class="story-paragraph" data-source-key="159:4">原来真正的胆小鬼不是我，是宋银硕。</p><p class="story-paragraph" data-source-key="159:5">我想，我要装作不知道，像之前装睡只为偷得一枚哥哥的额头吻那样。我不应该自私地只为自己着想，总是打破宋银硕的意愿。如果他想不告而别，我应该尊重他才对，或许是他觉得和我告别太难，所以才选择深夜出逃的。</p><p class="story-paragraph" data-source-key="159:6">曾经我一度以为，是宋银硕怕我不能真正的断舍离，他是为了我好，所以才远走他乡。但我忘记了他也是有感情的人，也是同样需要割舍的那位。或者他是为了自己，才硬着头皮离开的。</p><p class="story-paragraph" data-source-key="159:7">我希望是后者，我希望宋银硕可以自私一次。</p><p class="story-paragraph" data-source-key="159:8">但他的脚步离我越来越远，声音也越来越轻。</p><p class="story-paragraph" data-source-key="159:9">只是留学，又不是永别。</p><p class="story-paragraph" data-source-key="159:10">不用舍不得，还会再见的，不是吗？</p><p class="story-paragraph" data-source-key="159:11">当我反应过来时，人已经冲出卧室了。我没想到自己开门的声音那么大。我站在这里，宋银硕已经走到门口了，听到门响，又猛地回头。</p><p class="story-paragraph" data-source-key="159:12">月夜的惨淡光芒下，我只看到宋银硕模糊的轮廓，却不知道他是什么表情。</p><p class="story-paragraph" data-source-key="159:13">他应该也不知道我的。</p><p class="story-paragraph" data-source-key="159:14">我们是两个隐匿在黑暗中的恋人，我们不能说话，也不能公开，我们的过去，只不过是一层薄薄的影，无法形容，无法记载，也不可以被铭记。</p><p class="story-paragraph" data-source-key="159:15">我们什么都没说，只是这样对望着，随后同时转身。</p><p class="story-paragraph" data-source-key="159:16">然后同时，关上了门。</p><p class="story-paragraph" data-source-key="159:17">意外的，那晚我睡得很好。我明白了为什么人们说，和死亡相比，死亡到来前的等待其实更加恐怖。悬在我头上的那把刀终于落下了，我终于可以死心了。</p><p class="story-paragraph" data-source-key="159:18">第二天一早，看到手机里宋银硕给我的留言：</p><p class="story-paragraph dialogue" data-source-key="159:19">［想哭的时候 就给我打电话］</p><p class="story-paragraph" data-source-key="159:20">我回复他：</p><p class="story-paragraph dialogue" data-source-key="159:21">［路上小心］</p><p class="story-paragraph" data-source-key="159:22">我只有给你打电话的时候，才会想哭。</p><p class="story-paragraph" data-source-key="159:23">直到现在我才明白，为什么我在宋银硕身边哭了那么多次。因为人不光为心碎的瞬间流泪，太过幸福的时候也会流泪。而宋银硕拓宽了我幸福的范围，让我变得很敏感。吃他做的炒饭很幸福，和他一起回家很幸福，坐在一起看动漫很幸福，就算什么都不做只是待在他身边都很幸福。所以总有一种幸福到几乎要流泪的冲动。</p><p class="story-paragraph" data-source-key="160:0">他去日本后，我们唯一一次通话，是在一个夜晚。宋银硕突然打电话给我，絮絮叨叨地说了很多，我听出他可能是喝了酒，所以耐心地接听着。他说他在日本一切顺利，还交到一个很会跳舞的朋友，让我不必担心他的内向，他很喜欢那里，又让我不要自责。我都嗯嗯着应下了，他还问我最近有没有和成灿见面，我说有，我们刚刚就一起吃饭了。银硕笑了，笑得干巴巴的，笑得像在哭一样，他说那就好，最好赶快在一起才行啊。</p><p class="story-paragraph" data-source-key="160:1">我也快哭了，可我笑着问他，你之前不是最讨厌我和成灿单独在一起的吗？</p><p class="story-paragraph" data-source-key="160:2">宋银硕沉默了，像是暴泄的洪水突然晒干了一样，一切戛然而止，安静得可怕。良久，他才找回自己的声音，说。</p><p class="story-paragraph" data-source-key="160:3">你很好，成灿也很好，所以都很好，很好。</p><p class="story-paragraph" data-source-key="160:4">我突然觉得他说自己过得很好是假的。因为我和他说我在这边过得很快乐时，也是假话。不是说我活的不幸福，有郑成灿陪着我，还有我最亲近的两位朋友陪着我，以及远方的他在我的心里，我已经不孤独了。可是没有宋银硕在我身边，就好像总是少了点什么似的。</p><p class="story-paragraph" data-source-key="160:5">哥哥，宋银硕。银硕。</p><p class="story-paragraph" data-source-key="160:6">究竟多远的距离才算遥远呢？究竟怎样的亲昵才算相爱呢？</p><p class="story-paragraph" data-source-key="160:7">从故乡到东京不过两个小时的空中旅行，甚至都不需要跨越时差，为什么不肯和我通讯呢？为什么连联系我，都要借助酒精呢？</p><p class="story-paragraph" data-source-key="161:0">手伸进口袋，摸到了宋银硕留给我的OK绷，我才发现我不是没了他以后缺少了些什么，我是因为有他的存在，而多了一份什么。</p><p class="story-paragraph" data-source-key="161:1">未来的日子里，不管陪在我身边的是郑成灿，是别人，又或是只有我自己，宋银硕将永远成为那个，在我跌倒受伤时，只要想起来就可以止血的存在。</p><p class="story-paragraph" data-source-key="161:2">因为宋银硕，不只是我的哥哥，他还是我唯一的家人，是我真正的初恋，最重要的，他是我永远永远随身携带的，我的OK绷。</p></div>
      </article>
    </template></div>
  <script>
    (() => {
      const chapterIds=['chapter-01','chapter-02','chapter-03','chapter-04','chapter-05','chapter-06','chapter-07','chapter-08','chapter-09','chapter-10','chapter-11','chapter-12'];
      const chapterTitles=['Chapter 1','Chapter 2','Chapter 3','Chapter 4','Chapter 5','Chapter 6','Chapter 7','Chapter 8','Chapter 9','Chapter 10','Chapter 11','Chapter 12'];
      const select=document.getElementById('chapter-select');
      const mount=document.getElementById('chapter-mount');
      const shell=document.getElementById('reader-shell');
      const progress=document.getElementById('reading-progress');
      const controls={prev:[document.getElementById('prev-top'),document.getElementById('prev-bottom')],next:[document.getElementById('next-top'),document.getElementById('next-bottom')]};
      let current=0;
      const indexFromHash=()=>{const index=chapterIds.indexOf(location.hash.slice(1));return index<0?0:index;};
      function updateProgress() {
        const element=mount.firstElementChild;
        if(!element) return;
        const start=element.offsetTop;
        const distance=Math.max(element.offsetHeight-innerHeight,1);
        progress.style.width=`${Math.max(0,Math.min(1,(scrollY-start)/distance))*100}%`;
      }
      function render(index,pushHash=true,scroll=true) {
        current=Math.max(0,Math.min(chapterIds.length-1,index));
        const id=chapterIds[current];
        mount.replaceChildren(document.getElementById(id).content.cloneNode(true));
        select.value=id;
        controls.prev.forEach(button=>button.disabled=current===0);
        controls.next.forEach(button=>button.disabled=current===chapterIds.length-1);
        document.getElementById('prev-label').textContent=current?chapterTitles[current-1]:'已经是第一章';
        document.getElementById('next-label').textContent=current<chapterIds.length-1?chapterTitles[current+1]:'全文完';
        document.title=`我的OK绷 · ${chapterTitles[current]}`;
        if(pushHash&&location.hash!==`#${id}`) history.pushState(null,'',`#${id}`);
        if(scroll) shell.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
        updateProgress();
      }
      function move(delta) { render(current+delta); }
      select.addEventListener('change',()=>render(chapterIds.indexOf(select.value)));
      controls.prev.forEach(button=>button.addEventListener('click',()=>move(-1)));
      controls.next.forEach(button=>button.addEventListener('click',()=>move(1)));
      addEventListener('popstate',()=>render(indexFromHash(),false,false));
      addEventListener('scroll',updateProgress,{passive:true});
      addEventListener('resize',updateProgress,{passive:true});
      render(indexFromHash(),false,false);
    })();
  </script>
</body>
