        <header class="chapter-header"><span class="chapter-number">01</span><h2>Chapter 1</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="4:0">托人转交给郑成灿的情书原封不动地出现在校门口的垃圾桶里。</p><p class="story-paragraph" data-source-key="5:0">李炤熙嘴笨，在原地手足无措，不知道该怎么安慰我才好。我也失了魂，仿佛出现在垃圾桶里的不是我的信封而是我被剜出来的心脏一样。只有恩智还能勉强打破沉默，时不时安慰我一下。当着两个朋友的面，我强扯出些笑容，装作若无其事的样子。等到在岔路口分别后独自一人时，情绪才像雪崩一样坍塌。</p><p class="story-paragraph" data-source-key="6:0">抹了一路的眼泪，回到家时眼眶一定红得特别明显。所以宋银硕才会问我怎么了。</p><p class="story-paragraph dialogue" data-source-key="7:0">“跟你有关系么。”</p><p class="story-paragraph" data-source-key="8:0">我冷淡地回，没有心情去跟这位压根不熟的兄长解释什么，只想快点回到房间与世隔绝，就像那扇小小的门能够把所有的伤害都锁在外面一样。</p><p class="story-paragraph" data-source-key="9:0">房间很小，只有最基本的家具，像个样板房似的，没有生活气息，根本看不出这是我住了半年的地方。</p><p class="story-paragraph" data-source-key="10:0">把自己摔在床上，眼都不眨地看着天花板，直到眼球表面变得干涩刺痛，才逐渐找回了些理智。</p><p class="story-paragraph" data-source-key="11:0">垃圾桶内刺目的未拆信件与宋银硕随口的关心交织在一起，在脑海里上演着一出驴唇不对马嘴的戏剧。乱糟糟的，如同我的人生，找不到一个可以嵌合我的位置。</p><p class="story-paragraph" data-source-key="12:0">真要庆幸父母都不在家。不然我给他们的宝贝儿子甩脸色看，我爸一定会把我扫地出门的。</p><p class="story-paragraph" data-source-key="13:0">说是父母，其实只有父亲是我的亲生父亲。这个家里的母亲不是我的生母，她是宋银硕的生母。我的生母半年前再婚，和新丈夫一起搬去加利福尼亚了。她不愿意带着我这个拖油瓶，于是把我丢给并不爱我的爸爸。而自从他们离婚后，我一次都没有见过他。</p><p class="story-paragraph" data-source-key="14:0">拖着行李箱来到这里的那天，也是我第一次见到我同父异母的哥哥，宋银硕。</p><p class="story-paragraph" data-source-key="15:0">比起疏远的亲生父母及后妈，他对我而言，还多了一层讨厌。说恨太严重，说讨厌，又形容不尽心里的复杂。</p><p class="story-paragraph" data-source-key="16:0">他出生的时候，我的父母已经结婚了。按常理来说，他是见不得光的私生子才对。而作为婚生子的我，对他怀恨在心也是可以理解的。</p><p class="story-paragraph" data-source-key="17:0">但很可惜，宋银硕的生母并不是什么小三，他也算不上私生子。非要论起的话，我的生母和我才是后来者。父亲和他的母亲是恋人，因为家境等原因始终没能修成正果，他才和我的生母结婚。而那时，宋银硕的母亲就已经未婚先孕了。后来她生下了宋银硕，等待十年之久，而没让她失望的是，爷爷去世后三个月，父亲就和我的生母离婚了。眨眼间就把自己心爱多年的女人娶了回来，一家三口其乐融融。</p><p class="story-paragraph" data-source-key="18:0">多么壮烈的爱情故事，像晚八点的黄金档狗血肥皂剧。如果我不是被抛弃的那一方，那我一定会骄傲地认为，父母的爱情故事简直就像小说一样美好。但我是被摘出去的那个，所以从不觉得他们伟大，我能看到的，只有父亲既要又要的可恶嘴脸。从他抛弃有我的家庭奔向另一个家庭时，他就不再是我的爸爸了。</p><p class="story-paragraph" data-source-key="19:0">而在我还小的时候，我并不知道他在外面另有一个深爱的儿子。他和所有忙碌的父亲一样，很少回家，但每次回家都变魔术一样地给我带着玩具，他会抽出时间带我去儿童乐园，让我骑在他的肩上看街头表演。天真的我以为我们很少见面是因为他忙并不是他不爱我，直到长大后我才明白，我得到的父爱，都是宋银硕用剩的。</p><p class="story-paragraph" data-source-key="20:0">离婚后，没了家庭的管束，他一次都没有回来看过我。一转眼过了六年，再见时，时间残酷地把一对父女变成了一对有血缘关系的陌生人。</p><p class="story-paragraph" data-source-key="21:0">或许就像我讨厌他一样，他也压根就不喜欢我。甚至我住进来以后，他和妻子都不怎么回家了，仿佛我是什么瘟神一样，这半年里，我和两位长辈说过的话都不超过二十句。</p><p class="story-paragraph" data-source-key="22:0">我只是寄居在这个家里的幽灵，我是多余的，是透明的，是柜子最上面够不到的蛛丝网一样，允许出现但不被欢迎的存在，如果能够掸掉这种蛛网，那它绝对不会存活；如果父亲不需要承担我这个女儿的抚养义务，那他绝不会收留我。</p><p class="story-paragraph" data-source-key="23:0">来到这里的那天，一路上我忐忑不安，心里充满了对未知的期待。</p><p class="story-paragraph" data-source-key="24:0">至少在记忆中还留有父爱的影子，而我的生母自始至终都把我当做空气看待，对比之下，我往好的方向想，就算我有六年没有见过父亲，或许他见到我还会像很久很久之前那样…</p><p class="story-paragraph" data-source-key="25:0">或许会跟之前的生活不同。</p><p class="story-paragraph" data-source-key="26:0">直到见到父亲的那一刻，才被浇了一盆冷水。</p><p class="story-paragraph" data-source-key="27:0">怎么也想不到，这个家里唯一欢迎我的人，是那个我从未谋面的哥哥。而在这些人当中，我最该恨的就是他。</p><p class="story-paragraph" data-source-key="28:0">他们母子夺走了我的家，宋银硕占据着我本该拥有的生活，占据了我本该得到的爱。</p><p class="story-paragraph" data-source-key="29:0">可我也知道，我的怨恨不过是我自欺欺人的把戏，就算没有他们母子，我好像也幸福不到哪儿去。</p><p class="story-paragraph" data-source-key="30:0">在床上躺了不知多久，胃饿得有些抽疼。起身想出去找点东西吃，又想到自己刚对宋银硕出言不逊过，于是谨慎地伏在门板听了五分钟。</p><p class="story-paragraph" data-source-key="31:0">客厅没什么动静，或许宋银硕已经回房间了。这才松了口气，轻手轻脚地出门觅食。</p><p class="story-paragraph" data-source-key="32:0">结果刚走出卧室的过道，就和正坐在沙发上端着饭碗大嚼晚餐的宋银硕四目相对了。</p><p class="story-paragraph" data-source-key="33:0">整个人像是被冰雪魔法冻住了一样，一瞬间僵在原地。</p><p class="story-paragraph" data-source-key="34:0">宋银硕倒是没什么反应，看了我一眼，然后唰唰两下把碗底剩下的炒饭扒进嘴里，嚼了两下才含糊不清地说。</p><p class="story-paragraph dialogue" data-source-key="35:0">“你的那份在锅里。”</p><p class="story-paragraph dialogue" data-source-key="36:0">“呃？啊，好…”</p><p class="story-paragraph" data-source-key="37:0">趿着拖鞋去厨房盛宋银硕做的炒饭，又想起回来时自己对他的恶劣态度，不禁耳朵一红，感觉自己真是有些混球了。</p><p class="story-paragraph" data-source-key="38:0">而且我过得是寄人篱下的生活，想不被赶出去的话，要学会低头才行啊。</p><p class="story-paragraph" data-source-key="39:0">端着碗路过沙发时，小声地落了句：</p><p class="story-paragraph dialogue" data-source-key="40:0">“刚刚抱歉了，我确实心情不太好。”</p><p class="story-paragraph" data-source-key="41:0">宋银硕这才有了点反应，用纸巾擦桌子的手顿了下，然后略显尴尬地回了句：“没事。”</p><p class="story-paragraph" data-source-key="42:0">碗筷叮叮当当碰出清脆的响声，他把用过的餐具丢进水槽，经过我时，我还捧着碗小心翼翼地走着。于是他超过我，回头轻飘飘地来了句：“那你洗碗行吗？”</p><p class="story-paragraph dialogue" data-source-key="43:0">“噢，好。”</p><p class="story-paragraph" data-source-key="44:0">他做饭，我洗碗，很公平嘛。</p><p class="story-paragraph" data-source-key="45:0">宋银硕点点头，迈着长腿三两步就走回卧室了。</p><p class="story-paragraph" data-source-key="46:0">我慢慢地磨蹭着，终于也走到了自己的卧房，就在宋银硕房间的对面。</p><p class="story-paragraph" data-source-key="47:0">加了肉的泡菜炒饭送进嘴里，味道很好，却被我吃出了不同的滋味。</p><p class="story-paragraph" data-source-key="48:0">这不是郑成灿第一次拒绝我，在这次之前，我试过很多种办法，送水送零食，每天去他踢球的地方刷脸，我以为他记住我了，就和别人旁敲侧击得到了他的联系方式，结果好友申请发过去没多久就被拒绝了。但我没有放弃，毕竟他的追求者有点多，困难也是应该的。</p><p class="story-paragraph" data-source-key="49:0">对于郑成灿的喜欢，说实话有些随意。起因是前几天午休时路过足球场，看到一群女生围在那里尖叫，恩智扯着我过去凑热闹，我一眼就看到了穿梭于球场的那个高挑的身影，然后发现他就是尖叫声的制造者。</p><p class="story-paragraph dialogue" data-source-key="50:0">“哇啊啊——”</p><p class="story-paragraph" data-source-key="51:0">在一个漂亮的射门后，恩智也跟着旁边的人呐喊起来，我为她的合群感到无奈，又瞄了一眼球场上正高举双臂庆祝的身影。</p><p class="story-paragraph dialogue" data-source-key="52:0">“你认识他？”</p><p class="story-paragraph dialogue" data-source-key="53:0">“郑成灿啊！这你不知道？”</p><p class="story-paragraph dialogue" data-source-key="54:0">“听说过。”</p><p class="story-paragraph" data-source-key="55:0">其实也觉得面熟，可能某次擦肩而过也被他的外表震撼到了，但并没有留下很深刻的印象。今天不知怎么，或许是周围的气氛太过热烈，又或许是球场上的郑成灿发挥出了百分之两百的魅力，在荷尔蒙的催动下，我竟也觉得有几分心动。</p><p class="story-paragraph dialogue" data-source-key="56:0">“怎么？喜欢上了？”</p><p class="story-paragraph dialogue" data-source-key="57:0">“你喜欢吗？”毕竟恩智比我更早认识他，虽然她这个大嘴巴，看到哪个心仪的男生都会第一时间告诉我和李炤熙，但我还是想要确认一下。</p><p class="story-paragraph" data-source-key="58:0">恩智做出一个“怎么可能”的表情。</p><p class="story-paragraph dialogue" data-source-key="59:0">“帅确实帅，但很可惜，不是我喜欢的type。”</p><p class="story-paragraph" data-source-key="60:0">我被她的夸张逗笑了。</p><p class="story-paragraph" data-source-key="61:0">和恩智转身离开的那一刻，我想，要是二十四小时的冷却后还能想起他，那就是我一见钟情了。</p><p class="story-paragraph" data-source-key="62:0">第二天回家时，爸爸坐在客厅沙发上看着转播的足球赛事，我的脑中一下就蹦出了郑成灿的身影。</p><p class="story-paragraph" data-source-key="63:0">没有什么英雄救美的情节，也没有日久生情的厚重。就像去逛宠物店时看到了可爱的小狗，然后手指一点，挺起胸脯说：我要这只。</p><p class="story-paragraph" data-source-key="64:0">郑成灿就是我为了挑选而挑选出的人。</p><p class="story-paragraph" data-source-key="65:0">在这个信奉“恋爱不分早晚”的时代，直到高中二年级，我都没有情窦初开过，不管是暗恋还是明恋全都没有过，更别提真正意义上的确定恋人关系了。每次听恩智跟我和炤熙讲她的crush，我们两个都是一脸懵懂不解。准确点说，是李炤熙在懵懂，我在不解。很快恩智就会被我的问题搞到失语，然后说：“真不愧是块木头，想象不到你以后能跟什么样的人在一起。”</p><p class="story-paragraph" data-source-key="66:0">这时候李炤熙就会插嘴：“那肯定要找块石头呗，木头配石头，天生一对啊。”</p><p class="story-paragraph" data-source-key="67:0">我打心底里不同意他俩的木头论，怎么会有人愿意承认自己是块木头呢。</p><p class="story-paragraph" data-source-key="68:0">于是证明自己的时机到了。郑成灿是我翻身的机会，又高又帅又优秀，就算只是见色起意的决定，我也不算吃亏。</p><p class="story-paragraph" data-source-key="69:0">我的初恋就这样草率地开始了。</p><p class="story-paragraph" data-source-key="70:0">可不管郑成灿表现得有多么冷漠，看到自己的信封出现在垃圾桶里，还是不免难过。</p><p class="story-paragraph" data-source-key="71:0">从胡思乱想中挣脱出来时，隔壁浴室的水声已经停了。</p><p class="story-paragraph" data-source-key="72:0">我的卧室对面是宋银硕的房间，隔壁是我们两人共用的卫生间。主卧在另一侧，有独卫，两位长辈不怎么回家，也不会过来用这间卫浴。</p><p class="story-paragraph" data-source-key="73:0">在我的到来之前，宋银硕独享着这侧的空间，现在住的这间小卧室，原本是他的游戏房，是我压缩了他的领地。所以我一直观察着宋银硕的作息规律，尽可能的和他错开，以免自己影响原住民的生活。</p><p class="story-paragraph" data-source-key="74:0">端着被我吃得一干二净的碗，准备去收拾。</p><p class="story-paragraph" data-source-key="75:0">他做饭是边做边清理的，所以没剩下什么厨余。我把碗筷放进洗碗机，等待期间坐在沙发上发呆。</p><p class="story-paragraph" data-source-key="76:0">这时我听到了卫浴的门声，宋银硕从浴室出来了。</p><p class="story-paragraph" data-source-key="77:0">由于我和他之间一直有一条无形的边界，所以我并没有回头看他。他的脚步也没有停留，径直回到了自己的卧室。</p><p class="story-paragraph" data-source-key="78:0">按照他的习性，洗完澡回去，就基本不会再出来了。</p><p class="story-paragraph" data-source-key="79:0">我松了口气，去料理台继续做清理，以为不必再尴尬了。</p><p class="story-paragraph" data-source-key="80:0">但没想到只过了几分钟，宋银硕又出来了。</p><p class="story-paragraph" data-source-key="81:0">脚步声还离我越来越近，他是奔着厨房来的。</p><p class="story-paragraph" data-source-key="82:0">顿时感觉有些紧绷，但又不能表现出来。只能装作不知道有他的存在那样，慢慢地做着自己手上的家务。</p><p class="story-paragraph dialogue" data-source-key="83:0">“我房间的小冰箱里没喝的了，所以来找点。”</p><p class="story-paragraph" data-source-key="84:0">他打破寂静，突然说了一句。好像是在跟我解释，我没回头，自顾自地应了一句：“是吗…”</p><p class="story-paragraph dialogue" data-source-key="85:0">“啊，但是这儿的冰箱也快空了啊。”</p><p class="story-paragraph" data-source-key="86:0">这才下意识回头看了一眼他，僵硬地回复道：</p><p class="story-paragraph dialogue" data-source-key="87:0">“这样啊。”</p><p class="story-paragraph" data-source-key="88:0">宋银硕还在冰箱里翻找着什么，从我的角度只能看到他被冰箱灯光照亮的侧脸。优越的眉骨和因为认真而微微鼓起的嘴唇。刚洗完澡没戴眼镜看不清，所以眼睛也眯着，表情有点好笑。</p><p class="story-paragraph" data-source-key="89:0">我一怔，意识到自己这样盯着他看有些不太对，赶紧收回视线继续整理。</p><p class="story-paragraph" data-source-key="90:0">身后的翻找声也很快就停止了。</p><p class="story-paragraph" data-source-key="91:0">人类在没有安全感的情况下会变得警惕。我在宋银硕的家里，听觉自然而然的就变得敏锐。作为一个外来者，我下意识地时刻观察主人的动向，没有可以放松的时刻。</p><p class="story-paragraph" data-source-key="92:0">在浴室脱衣服的时候，又听到宋银硕卧室的门开了，随后是房门的开启关闭，不知道他出门是要做什么，跟我没有关系。他走了，这里只剩下我一个人，我反而更轻松。</p><p class="story-paragraph" data-source-key="93:0">或许是去买东西了。刚刚他说，冰箱里没有东西了。</p><p class="story-paragraph" data-source-key="94:0">什么时候我也可以像宋银硕一样自在的活着呢？不用看人眼色，拥有自己的家，想做什么就做什么…</p><p class="story-paragraph" data-source-key="95:0">淋浴的热水把我从头浇到脚，温暖地包裹着我的皮肤。耳边充斥着哗哗的水声，仿佛自己真的被隔离在只有自己的世界里。至于外面的世界是怎样的，我不关心，也不会再干扰到我了。</p><p class="story-paragraph" data-source-key="96:0">带着水汽走出浴室，不知道宋银硕有没有回来。我没听到声音，但却意外地发现自己的卧室门口，有一杯便利店的冰块，还有一包软糖。</p><p class="story-paragraph" data-source-key="97:0">一下就反应过来，这是宋银硕放的。</p><p class="story-paragraph" data-source-key="98:0">我捡起来，看到冰杯盖子上贴的便利贴，上面是他的字迹。</p><p class="story-paragraph dialogue" data-source-key="100:0">[不敷一下眼睛的话 明早起床会变成悲伤蛙的]</p></div>
      </article>

      <article class="chapter" data-chapter="chapter-02">
        <header class="chapter-header"><span class="chapter-number">02</span><h2>Chapter 2</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="105:0">次日，为了郑成灿，我和恩智打算再去球场上转一圈，这次把李炤熙也拽出来了。不爱出门的他有些不情不愿的，被我和恩智痛斥了一番“死宅”后，终于愿意跟我们一起出来闲逛了。</p><p class="story-paragraph dialogue" data-source-key="105:1">“你今晚还有声乐练习吗？”</p><p class="story-paragraph dialogue" data-source-key="105:2">“没有吧。”</p><p class="story-paragraph" data-source-key="105:3">恩智惊喜地扯着我们两个的袖子：“那我们晚上去吃拉面吧，最近有一家新开的拉面店，据说特别好吃。”</p><p class="story-paragraph" data-source-key="105:4">能在外面吃晚饭，我当然求之不得，李炤熙也同意后，我们约好了放学先不回家，一起去那家拉面店。</p><p class="story-paragraph" data-source-key="105:5">犹豫了一下，还是拿出手机，点开和哥哥几乎没什么对话的聊天框。</p><p class="story-paragraph dialogue" data-source-key="105:6">［我今晚和朋友在外面吃］</p><p class="story-paragraph dialogue" data-source-key="105:7">［晚饭不要带我的份了］</p><p class="story-paragraph" data-source-key="105:8">很快，那边就发来一个OK的emoji。</p><p class="story-paragraph" data-source-key="105:9">走到足球场，发现人有点少，恩智和我一番张望，却没看到郑成灿的身影。</p><p class="story-paragraph dialogue" data-source-key="105:10">“可惜…今天他没来踢球吧。”</p><p class="story-paragraph" data-source-key="105:11">恩智拍了拍我的肩膀作为安慰。</p><p class="story-paragraph" data-source-key="105:12">我忍下失落，一边说着“这也是有可能的”，一边扯着她们两个往回走。</p><p class="story-paragraph" data-source-key="105:13">刚准备离开，就看到远处那个在围栏树荫下喝水的高个子。</p><p class="story-paragraph" data-source-key="105:14">郑成灿的身上还穿着运动衣，正和身边的人有说有笑。而他身边的人更是眼熟，我们刚刚才互通过消息。</p><p class="story-paragraph" data-source-key="105:15">李炤熙见我表情不太对，问我怎么了。</p><p class="story-paragraph" data-source-key="105:16">我歪头疑惑了一下，然后抬手指给她们看。</p><p class="story-paragraph dialogue" data-source-key="105:17">“啊！郑成灿，原来在这里！”</p><p class="story-paragraph" data-source-key="105:18">恩智惊叫一声，表现得比我还激动。幸好我们离那边还有一定距离，不然她这大嗓门喊出来，绝对会被郑成灿发现的。她也知道自己有点大惊小怪了，心虚地朝我笑了下，手在嘴上做了个拉拉链的动作。</p><p class="story-paragraph" data-source-key="105:19">我有些无措地抓着衣角：“不光是郑成灿，他旁边的人…是我哥。”</p><p class="story-paragraph dialogue" data-source-key="105:20">“啊？？？”</p><p class="story-paragraph" data-source-key="105:21">恩智立马又忘了刚刚的悔改，震惊得眼珠几乎要瞪出来。</p><p class="story-paragraph dialogue" data-source-key="105:22">“你说那是你哥？你后妈生的你哥？”</p><p class="story-paragraph" data-source-key="105:23">我有些窘迫地点了点头。</p><p class="story-paragraph" data-source-key="105:24">现在不光是恩智，炤熙也瞪圆了眼睛。</p><p class="story-paragraph dialogue" data-source-key="105:25">“那完了。”</p><p class="story-paragraph dialogue" data-source-key="105:26">“怎么了？”</p><p class="story-paragraph" data-source-key="105:27">恩智啧啧道：“你和郑成灿没戏了。”</p><p class="story-paragraph" data-source-key="105:28">我有些不解：“为什么？”</p><p class="story-paragraph dialogue" data-source-key="105:29">“一般的哥哥都不会愿意妹妹和自己的朋友在一起吧？”</p><p class="story-paragraph dialogue" data-source-key="105:30">“不能吧。”我愣住了。</p><p class="story-paragraph dialogue" data-source-key="105:31">“不信你问问他，你愿意你姐姐和你的朋友谈恋爱吗？”</p><p class="story-paragraph" data-source-key="105:32">李炤熙仔细思考了一下：“我…姐姐不会和你们在一起的。”</p><p class="story-paragraph" data-source-key="105:33">我俩有些无语。</p><p class="story-paragraph dialogue" data-source-key="105:34">“那假如是男的！男的！”</p><p class="story-paragraph" data-source-key="105:35">李炤熙果断地摇头：“不会。”</p><p class="story-paragraph dialogue" data-source-key="105:36">“你看吧？”</p><p class="story-paragraph" data-source-key="105:37">我泄气了，但心里仍隐隐地亮着希望之光。</p><p class="story-paragraph" data-source-key="105:38">宋银硕和我又不熟，应该不会插手我的事吧…？</p><p class="story-paragraph" data-source-key="105:39">远处的郑成灿喝干瓶子里的最后一口水，和宋银硕并肩走回了教学楼。循着走廊的窗户，我看见他们进了同一间教室。</p><p class="story-paragraph" data-source-key="105:40">如此画面可给我带来了不小的冲击。不敢相信宋银硕和郑成灿居然是同学，而我一直都不知道。</p><p class="story-paragraph" data-source-key="105:41">我只知道宋银硕比我大一岁，所以和郑成灿一样刚升到高中三年级，可我们两个不光在家里保持互不干扰的生活态度，去上学时也一直都是一前一后的错开，仿佛事先商量过一样。所以宋银硕对我来说，是连他在几年几班上学都不知道的哥哥。</p><p class="story-paragraph" data-source-key="105:42">因为根本不在乎宋银硕，所以从来都没有尝试过在人群中寻找他吗？所以每次经过他们教室，眼里都只有郑成灿，于是自动地把宋银硕过滤掉了吗？</p><p class="story-paragraph" data-source-key="105:43">回去的时候，我们三个刻意经过高三的楼层。</p><p class="story-paragraph" data-source-key="105:44">路过他们教室的时候，我像做贼一样，往里面飞快地瞟了一眼，一下就找到了显眼的郑成灿。</p><p class="story-paragraph" data-source-key="105:45">不知道他们在聊什么，总之郑成灿笑得很开心。宋银硕也一样。</p><p class="story-paragraph" data-source-key="105:46">我怔了一下。这样的哥哥对我来说很陌生，因为我从未见过他大笑的样子，他也同样没见过我的笑容。</p><p class="story-paragraph" data-source-key="105:47">猛然意识到，半年以来一直生活在同一屋檐下的哥哥，对自己来说却像是一本从未翻开的练习簿。有关宋银硕的每一道题，我都不会解。</p><p class="story-paragraph" data-source-key="105:48">原来我和我的哥哥，是彼此的陌生人啊。</p><p class="story-paragraph" data-source-key="106:0">回到教室，一整个下午我都无心听课，脑子里想着郑成灿的事情。</p><p class="story-paragraph" data-source-key="106:1">哥哥真的会阻拦妹妹的恋情吗？应该不是每一位哥哥都这样的吧…</p><p class="story-paragraph" data-source-key="106:2">不想得之不易的心动轻易地被宋银硕否决，便开始自我安慰，以我和宋银硕的关系，他应该不会管那么宽。毕竟我没把他当亲哥哥，或许他也没把我当真妹妹。比起护妹心切，他要阻拦，也是为了郑成灿好而阻拦才对。更何况他们男生也不会像女生一样为朋友的恋情操心，也不会在乎自己的朋友和谁谈恋爱。这样一想，又觉得问题不大了。</p><p class="story-paragraph" data-source-key="106:3">放学时，我被外语老师叫去帮忙做了点活，于是让恩智和炤熙先到校门口等我。但被耽误的时间比我预想的更久，出去时已经比往常晚了整整半小时。</p><p class="story-paragraph" data-source-key="106:4">想着两个朋友可能会等急，脚上的步伐便不自觉地加快，却忘记了自己不太会走路，一着急就容易绊倒。</p><p class="story-paragraph" data-source-key="106:5">眼看着就要到校门口了，险些摔了个狗啃泥，还好李炤熙反应快，先在我与大地接吻前扶住了我。</p><p class="story-paragraph dialogue" data-source-key="106:6">“急什么啊，我们俩又不会扔下你自己去。”</p><p class="story-paragraph" data-source-key="106:7">恩智有些嗔怪地说。我笑了下，拍掉裤子上根本不存在的灰，招呼他们两个：“我们走吧。”</p><p class="story-paragraph" data-source-key="106:9">尽管科学研究表明，人类会在三到六岁间开始形成最早的记忆。但在我的脑海里，记忆从出生的那一刻起就存在了。</p><p class="story-paragraph" data-source-key="106:10">保姆给我喂奶，换尿布，哄睡，没有感情，但尽职尽责。</p><p class="story-paragraph" data-source-key="106:11">没有父母的参与。</p><p class="story-paragraph" data-source-key="106:12">没有爸爸妈妈拿着识字卡陪我学认字，没有爸爸妈妈拿着玩具教我翻身再扶我走路，没有爸爸妈妈把相机的镜头对准我，为我留下瞬间的回忆。</p><p class="story-paragraph" data-source-key="106:13">我是什么时候开口说话的？我说出的第一个音节是什么？我是怎么学会翻身的？我最喜欢的玩具是什么？他们全都无法回答，我连一张童年的照片都没有。</p><p class="story-paragraph" data-source-key="106:14">所以我很晚才学会说话，很晚才学会走路。</p><p class="story-paragraph" data-source-key="106:15">关于走路的最早记忆，是某个傍晚。妈妈突然回家了，心情不错地逗了我一会儿。我因为很少见到家里的大人，所以一看见爸爸妈妈就格外黏糊，她没坐多一会儿就离开了，我见她要走，急得迈开没什么肌肉的藕节腿去追赶，结果当然是追不上。我跌倒在地板上，开始撕心裂肺地大哭。而她留给我的只有一个厌恶的眼神。</p><p class="story-paragraph" data-source-key="106:16">明明那时我还只是个牙都没长齐的小孩，可那个眼神，我却一直记到了现在。</p><p class="story-paragraph" data-source-key="106:17">我被保姆抱去哄，可你怎么指望一个小孩能懂得什么是爱与不爱，能懂为什么这种分别无法用哭泣来挽留。又过了很久我才明白，原来哭泣能换来的只有温奶粉、玩具、以及干爽的尿不湿。哭泣换不到的，是爱。</p><p class="story-paragraph" data-source-key="106:18">所以我的腿脚一直不是很利索，正常走路没问题，可一走急了，跑起来了，就容易左脚绊右脚，然后摔倒。</p><p class="story-paragraph" data-source-key="106:19">所以自小就经常磕磕碰碰，在膝盖和手肘上留了不少疤痕，直到我拥有了超出同龄人的沉稳后，受伤的情况才有所缓解。可我不是不想和其他孩子一样奔跑打闹，我只是不能。因为跌倒后没人会扶起我，我只能缩到角落去，自己舔舐伤口。</p><p class="story-paragraph" data-source-key="106:20">而那时的宋银硕和我一样需要照料，父亲拿不出多余的时间施舍给我，直到我读上幼儿园，他才出现在我的记忆中，像对待乞丐一样，把他用剩的爱丢到我的碗里。</p><p class="story-paragraph" data-source-key="106:21">原本我出来时就已经晚了，恩智和炤熙又要陪我慢慢走。等我们到达人气爆棚的拉面店时，里面已经坐满了人。</p><p class="story-paragraph dialogue" data-source-key="106:22">“怎么这么多人啊…”</p><p class="story-paragraph" data-source-key="106:23">听到恩智失落的感叹，我的愧疚更甚，只能把眼睛像扫描仪一样转动，希望我的望眼欲穿能给我们三个变出一桌空位。最后却只找到了不算空位的空位，在很角落的地方有个六人桌，那里只坐了两个人。</p><p class="story-paragraph" data-source-key="106:24">往常我是不会选择拼桌的，但今天因为自己耽误了时间，又不想让好朋友失望，只能硬着头皮过去，想问问他们能不能一起坐。</p><p class="story-paragraph" data-source-key="106:25">走到一半又发现不对劲，这两个头戴鸭舌帽的男生，有种说不上来的熟悉。</p><p class="story-paragraph" data-source-key="106:26">再走近一点，好巧不巧，正是我刚刚恋上的郑成灿，和我同父异母的哥哥。</p><p class="story-paragraph" data-source-key="106:27">宋银硕先看到了我，有些惊讶。</p><p class="story-paragraph" data-source-key="106:28">他没问我怎么在这，而是淡淡地来了一句：“吃饭？”</p><p class="story-paragraph" data-source-key="106:29">…那当然，不然我出现在拉面店是为什么啊？</p><p class="story-paragraph" data-source-key="106:30">一时间没反应过来，等我想转身逃跑时，宋银硕和郑成灿已经拿起了原本放在座位上的书包和外套，给我们让出了位置。</p><p class="story-paragraph" data-source-key="106:31">我避无可避，转身时绝望地合上了眼睛，朝着门口的朋友招手。从恩智呼之欲出的眼神里，我读出了至少二十句尖叫。</p><p class="story-paragraph" data-source-key="106:32">这下回去可有的说了，我默默感叹。</p><p class="story-paragraph" data-source-key="106:33">三个人尴尬地围到桌旁，拘谨地杵在原地。</p><p class="story-paragraph" data-source-key="106:34">怎么坐又是个问题，我不知道是该挨着宋银硕，还是该挨着郑成灿。或者说，不知道该坐在郑成灿身边，还是坐在郑成灿对面。</p><p class="story-paragraph" data-source-key="106:35">最后李炤熙替我做了决定，一屁股坐在郑成灿身边。我也落座到宋银硕的旁边，恩智挨着我。</p><p class="story-paragraph" data-source-key="106:36">一抬眼就能看到让我耿耿于怀的那个人，我紧张得手都不知道该怎么摆了，只能装出若无其事的模样和恩智讨论菜单。</p><p class="story-paragraph dialogue" data-source-key="106:37">“这是我妹妹。”</p><p class="story-paragraph" data-source-key="106:38">宋银硕轻描淡写地对郑成灿说。</p><p class="story-paragraph dialogue" data-source-key="106:39">“噢，你好。”</p><p class="story-paragraph" data-source-key="106:40">郑成灿给了我一个礼貌的笑，粼粼的小鹿眼闪着些许好奇的光，随后又转为疑惑，仿佛正在脑海里搜索着什么。</p><p class="story-paragraph" data-source-key="106:41">我表面风平浪静地跟他回了句你也好，实际上心脏都快跳到嗓子里了。</p><p class="story-paragraph" data-source-key="106:42">手心逐渐析出湿滑的汗，闭上双眼默默祈求郑成灿千万不要记得我。</p><p class="story-paragraph dialogue" data-source-key="106:43">“我好像在哪儿见过你。”</p><p class="story-paragraph" data-source-key="106:44">心里咯噔。</p><p class="story-paragraph dialogue" data-source-key="106:45">“呃？是吗…但，这个，我们好像没见过吧？”</p><p class="story-paragraph" data-source-key="106:46">郑成灿的眉头搅在一起，并没有放弃思考。</p><p class="story-paragraph" data-source-key="106:47">宋银硕似乎发现了我的异常，开玩笑地替我解围：</p><p class="story-paragraph dialogue" data-source-key="106:48">“呀，这是我妹妹，想搭讪的话别这么老套。”</p><p class="story-paragraph" data-source-key="106:49">郑成灿朝我抱歉一笑，抓起筷子继续闷头吃饭。</p><p class="story-paragraph" data-source-key="106:50">我松了一口气。</p><p class="story-paragraph" data-source-key="106:51">店里人多，但上菜还不算慢。由于同桌的两位正是我们平日在背后议论的当事人，所以恩智和炤熙吃得也很拘谨。</p><p class="story-paragraph" data-source-key="106:52">旁边的两位不知情，也不觉得有什么，依旧嚼得津津有味，尤其是郑成灿，三下五除二搞定一大碗拉面，连面汤都不放过。喝干后又夹了一只宋银硕的煎饺，边吃边揉着肚子。</p><p class="story-paragraph" data-source-key="106:53">在他面前，我紧张得几乎要把脸埋进碗里，一秒都不敢抬头。</p><p class="story-paragraph" data-source-key="106:54">突然有只手轻轻拍了拍我的胳膊，把我吓得一抖。</p><p class="story-paragraph dialogue" data-source-key="106:55">“头发，掉进去了。”</p><p class="story-paragraph" data-source-key="106:56">宋银硕淡定地指了下我的侧脸。</p><p class="story-paragraph" data-source-key="106:57">他这么一说，一整桌的人都开始抬头看我，郑成灿也瞄了我一眼。</p><p class="story-paragraph" data-source-key="106:58">脸颊开始发烫，“噢”了一声后把碎发别在耳后，象征性地又吃了两口，就再也咽不下去了。</p><p class="story-paragraph" data-source-key="106:59">等我的朋友们也吃好的时候，宋银硕才吃得差不多。</p><p class="story-paragraph" data-source-key="106:60">去结账时，他顺带把我们三人的账单也一起付了，恩智和炤熙惊喜地感谢他，他只摆摆手，颇有点bking气质地说了句。</p><p class="story-paragraph dialogue" data-source-key="106:61">“没关系，我是她哥哥么。”</p><p class="story-paragraph" data-source-key="106:62">我和两位朋友不同路，走到店门口就要分别。</p><p class="story-paragraph" data-source-key="106:63">恋恋不舍地和他们摆手说再见后，一回头看到了正注视着我的宋银硕。</p><p class="story-paragraph dialogue" data-source-key="106:64">“回家？”</p><p class="story-paragraph" data-source-key="106:65">我吓了一跳，所答非所问地来了一句：“你怎么还没走？”</p><p class="story-paragraph dialogue" data-source-key="106:66">“我是你哥哥啊。”他笑得有些无奈，又重复了一遍刚刚结账时他说过的话。</p><p class="story-paragraph dialogue" data-source-key="106:67">“这么晚了丢下妹妹一个人走，那像话吗？”</p><p class="story-paragraph" data-source-key="106:68">我无力反驳，心里暗暗地有些抗拒，但又不能拒绝。</p><p class="story-paragraph" data-source-key="106:69">宋银硕腿长，走路带风，走两步就超过我一截，然后停下来等等我，走两步又快我一截，再回头确认一下我的位置。这样反复几次后，他索性也慢下步伐，我走两步，他走一步。</p><p class="story-paragraph" data-source-key="106:70">我感觉有些不好意思：“我走路有点慢，你要是着急的话就先走吧，我没关系的。”</p><p class="story-paragraph dialogue" data-source-key="106:71">“我不急。”他果断地回答。</p><p class="story-paragraph dialogue" data-source-key="106:72">“对不起。”</p><p class="story-paragraph dialogue" data-source-key="106:73">“这又不是什么错误，有什么需要道歉的。”</p><p class="story-paragraph" data-source-key="106:74">我有些诧异地看了他一眼，宋银硕双手插在兜里，依旧目不斜视地前进着。但他却像是知道我在看他一样，问我：“怎么了？”</p><p class="story-paragraph dialogue" data-source-key="106:75">“没什么。”我把视线收了回来。</p><p class="story-paragraph dialogue" data-source-key="106:76">“是不喜欢在别人面前公开我这个哥哥吗？”</p><p class="story-paragraph" data-source-key="106:77">他突然来了这么一句，我有些发懵，但还是诚实地摇头了，又问他为什么这么说。</p><p class="story-paragraph dialogue" data-source-key="106:78">“你都没跟你的朋友介绍我，还要我自己说。”</p><p class="story-paragraph" data-source-key="106:79">半开玩笑的语气，被我听出了一丝委屈。想到刚刚宋银硕把我介绍给郑成灿时说了“这是我妹妹”，而反过来，我却什么都没说。</p><p class="story-paragraph" data-source-key="106:80">一时间无言以辩，只得解释道：</p><p class="story-paragraph dialogue" data-source-key="106:81">“他们两个认识你，之前有跟他们提过。”</p><p class="story-paragraph dialogue" data-source-key="106:82">“噢~”</p><p class="story-paragraph" data-source-key="106:83">宋银硕一挑眉，没再说什么。反而我的脸越来越烫。</p><p class="story-paragraph" data-source-key="106:84">什么啊，就仿佛我经常跟别人炫耀有他这么个哥哥一样。早知道就认真道个歉，撒个谎说下次一定介绍他就好了啊…</p><p class="story-paragraph" data-source-key="106:85">可是说出去的话就像泼出去的水，再怎么懊悔也没有用了。</p><p class="story-paragraph" data-source-key="106:86">初春的街道依旧带着瑟瑟冷风，储满了晚饭的胃暖暖的。眼前又突然闪过昨晚被宋银硕放在我门口的冰块杯，我好像还没来得及跟他说谢谢。又一阵冷风吹过，冻得我身体紧绷，停住了脚步。再一抬头，看到宋银硕缩着脖子往衣服里钻，一开始以为是他觉得冷，可看到他搞怪的表情，又意识到他是在学我。</p><p class="story-paragraph" data-source-key="106:87">我有些嗔怒地想要去锤他，他两三步就和我拉开了距离。为了避免在他面前摔倒丢脸的风险，我站在原地，没有挪动脚步。</p><p class="story-paragraph" data-source-key="106:88">宋银硕像是意识到了什么似的，乖乖走回我的身边，表情还带着一点贱兮兮，但贴我贴的很近，似乎要诱导我把刚刚打空的一拳补回来一样。</p><p class="story-paragraph" data-source-key="106:89">我笑着，轻轻地敲了一下他的胳膊，说不出来的触感。蓬松的薄羽绒服下包裹着的，是他骨感却柔软的臂膀。</p><p class="story-paragraph" data-source-key="106:90">意识到这是真正的兄妹才会做出的举动，我的脸更烫了。</p><p class="story-paragraph" data-source-key="106:91">低下头，想把自己隐藏进阴影中，不要被身边的人发现自己的异样。</p><p class="story-paragraph dialogue" data-source-key="106:92">“谢谢你昨晚的冰块。”</p><p class="story-paragraph" data-source-key="106:93">宋银硕脚步一顿，随后轻笑一声。</p><p class="story-paragraph dialogue" data-source-key="106:94">“真是个有礼貌的孩子啊。”</p><p class="story-paragraph" data-source-key="106:95">我有些不解，埋下去的头又抬起来了，疑惑地看着他。</p><p class="story-paragraph" data-source-key="106:96">这次他把目光交过来，只掠了我一眼，便收回去了。</p><p class="story-paragraph dialogue" data-source-key="106:97">“‘谢谢’和‘抱歉’，是你的口头禅吗？”</p><p class="story-paragraph dialogue" data-source-key="106:98">“应该…不是吧。”</p><p class="story-paragraph dialogue" data-source-key="106:99">“但你跟我说了很多次。”</p><p class="story-paragraph" data-source-key="106:100">宋银硕抬起手，在我的额头上轻轻敲了一下。</p><p class="story-paragraph dialogue" data-source-key="106:101">“不用跟我那么客气。”</p><p class="story-paragraph dialogue" data-source-key="106:102">“我是你哥哥啊。”</p><p class="story-paragraph" data-source-key="106:103">他又说了一遍。</p></div>

      <article class="chapter" data-chapter="chapter-03">
        <header class="chapter-header"><span class="chapter-number">03</span><h2>Chapter 3</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="111:0">我把关于郑成灿的想法告诉恩智，说我和宋银硕的兄妹关系比较特殊，他应该不会插手。</p><p class="story-paragraph" data-source-key="111:1">恩智听过我的分析后得出结论：</p><p class="story-paragraph" data-source-key="111:2">我在郑成灿这里已经占据了有利地形，属于近水楼台先得月，照比其他追求者，早已胜在了起跑线。而我竟然才发现宋银硕这个最大的便利。</p><p class="story-paragraph" data-source-key="111:3">但同时我又意识到，越是这样，我反而越不能明目张胆的接近郑成灿了。</p><p class="story-paragraph" data-source-key="111:4">如果说郑成灿对我没兴趣，又因为我的存在和宋银硕闹僵，那就是得不偿失。除了按兵不动以外，我想不到任何的措施。</p><p class="story-paragraph" data-source-key="111:5">昨晚面对郑成灿时心虚窘迫的自己，仿佛偷了油吃又恰好没被抓住的老鼠，就算侥幸得以安然无恙，再回忆起那场惊魂也依旧会心慌。还好他追求者众，根本没把我放在眼里，不然怕是要尴尬死。</p><p class="story-paragraph" data-source-key="111:6">爸爸给我转了这个月的生活费，没有多余的话语。继父也按时发来消息，给了我额外的大红包，又问我最近如何，在爸爸这里生活还适应吗。</p><p class="story-paragraph" data-source-key="111:7">我跟他说，我过得很好。</p><p class="story-paragraph" data-source-key="111:8">其实妈妈再婚，我虽恨她，但也为她开心。因为我的继父确实是个很不错的人，他曾问我愿不愿意跟着他们一起去加州，我说我无所谓，是我的母亲不愿意带着我，怕我打搅她的新生活。</p><p class="story-paragraph" data-source-key="111:9">有时我也想过，会不会我死皮赖脸地跟着他们走会更好些，那样的话最起码我还有个和蔼的，不会把我当作空气的新爸爸。但我的母亲一定会否决，我也无法再承受她嫌恶的目光了，倒不如在这里当个透明人。</p><p class="story-paragraph" data-source-key="111:10">总之多了一笔意外之财，我想到前一阵宋银硕请我和朋友们吃的那顿拉面。</p><p class="story-paragraph" data-source-key="111:11">因为无法心安理得地享受他的好，于是抱着谁也不要亏欠谁的想法，想要把那顿饭还给他。其实细算的话，我已经吃了他无数顿饭了，想还也还不清，但这次他把我的朋友也带上了，所以我必须请回去。</p><p class="story-paragraph" data-source-key="111:12">回到家时发现宋银硕不在，他还没做饭，于是叫了外卖，问他什么时候回来吃饭。</p><p class="story-paragraph dialogue" data-source-key="111:13">[啊 抱歉]</p><p class="story-paragraph dialogue" data-source-key="111:14">[忘记告诉你了 我和成灿正准备出去吃呢]</p><p class="story-paragraph dialogue" data-source-key="111:15">[这样]</p><p class="story-paragraph dialogue" data-source-key="111:16">[怎么了？]</p><p class="story-paragraph" data-source-key="111:17">我看着桌子上的两份豪华披萨和双拼炸鸡，有些汗颜。</p><p class="story-paragraph dialogue" data-source-key="111:18">[我已经叫好外卖了，带了你的份]</p><p class="story-paragraph dialogue" data-source-key="111:19">[是太饿了吗？怎么突然叫外卖]</p><p class="story-paragraph" data-source-key="111:20">确实，我到这里后，就没再点过外卖了。怕这里的父母不喜欢我吃垃圾食品，每次饿了都是去冰箱里拿点酸奶泡点麦片什么的。而且宋银硕每次做饭都会给我带份，毕竟是异母哥哥做的，不敢不吃。所以我小心翼翼地，每次都吃得很干净。</p><p class="story-paragraph dialogue" data-source-key="111:21">[今天好像不能回去做饭了]</p><p class="story-paragraph" data-source-key="111:22">那边发过来一个米啊内的表情包。</p><p class="story-paragraph" data-source-key="111:23">我怔了一下，自己好像成为他的负担了。</p><p class="story-paragraph" data-source-key="111:24">于是赶紧解释道:</p><p class="story-paragraph dialogue" data-source-key="111:25">[不是 是上次你替我们结了账]</p><p class="story-paragraph" data-source-key="111:26">那端沉默了。</p><p class="story-paragraph" data-source-key="111:27">有些坐立不安，感觉自己还是说错话了，明明他让我和他别那么见外的，我再这样好像有点不识好歹了。</p><p class="story-paragraph dialogue" data-source-key="111:28">[能带成灿吗？]</p><p class="story-paragraph" data-source-key="111:29">我傻眼了。</p><p class="story-paragraph" data-source-key="111:30">这可真是意料之外的优答。</p><p class="story-paragraph" data-source-key="111:31">我立马回：</p><p class="story-paragraph dialogue" data-source-key="111:32">[当然当然]</p><p class="story-paragraph dialogue" data-source-key="111:33">[好 那我们马上回去^^]</p><p class="story-paragraph" data-source-key="111:34">想起上次同桌吃饭时郑成灿那风卷残云的气势，我怕不够吃，又叫了份burgerking，刚好在两位回家前送到了。</p><p class="story-paragraph" data-source-key="111:35">我忐忑不安地坐在沙发上，听见门铃响起，整个人像灌了沥青一样凝固在原地。</p><p class="story-paragraph" data-source-key="111:36">宋银硕进门前先说了句“我回来了”，踩着居家拖鞋走过来时，看到了满满一桌的食物，微微惊讶了一下，然后带着笑意回头看了一眼成灿，轻飘飘地说了一句：</p><p class="story-paragraph dialogue" data-source-key="111:37">“你点的刚好都是他爱吃的呢。”</p><p class="story-paragraph" data-source-key="111:38">这算什么，歪打正着吗。</p><p class="story-paragraph" data-source-key="111:39">心里有些窃喜，却装作不在意的样子：“是吗？”又偷偷瞄了一眼门口的郑成灿。</p><p class="story-paragraph" data-source-key="111:40">虽然他是客人，进门却轻车熟路，显然之前来过很多次。</p><p class="story-paragraph" data-source-key="111:41">但我从来没看到过宋银硕带朋友回家。又或许正是因为我住了进来，再带陌生男性回来不太好，所以他才不再带朋友回家的。</p><p class="story-paragraph" data-source-key="111:42">洗手回来后，我们三个就这样坐在地板上，围着茶几开始吃饭。</p><p class="story-paragraph" data-source-key="111:43">有郑成灿在，饭桌终于不像只有我和宋银硕两人时那么沉默了。宋银硕和郑成灿聊天，我在旁边偷听，看郑成灿一口咬掉半个汉堡，结结实实地吓了一跳。</p><p class="story-paragraph dialogue" data-source-key="111:44">“真不愧长这么高啊。”</p><p class="story-paragraph" data-source-key="111:45">我小声说。</p><p class="story-paragraph dialogue" data-source-key="111:46">“是啊。”宋银硕面不改色：“简直就是‘进击的巨人’。”</p><p class="story-paragraph" data-source-key="111:47">我和郑成灿沉默了三秒。</p><p class="story-paragraph dialogue" data-source-key="111:48">“不好笑吧。抱歉。”</p><p class="story-paragraph" data-source-key="111:49">宋银硕用没戴塑料手套的那只手挠了挠脖子，我和郑成灿噗呲一声笑了出来，心里的忐忑有所缓解，本来已经开始坚信郑成灿对我毫无印象了，在宋银硕去卫生间的时候，他却突然问我：</p><p class="story-paragraph dialogue" data-source-key="111:50">“我们见过的，对吧。”</p><p class="story-paragraph dialogue" data-source-key="111:51">“啊？呃，可…可能吧。”</p><p class="story-paragraph dialogue" data-source-key="111:52">“在球场上，你给我递过水，我想起来了。”</p><p class="story-paragraph dialogue" data-source-key="111:53">“……”</p><p class="story-paragraph" data-source-key="111:54">我被他突如其来的记忆复苏打了个措手不及，满脑子想的都是否定，赶紧否定。</p><p class="story-paragraph" data-source-key="111:55">但说出口的却是：</p><p class="story-paragraph dialogue" data-source-key="111:56">“哈哈，是啊，你居然还记得。”</p><p class="story-paragraph" data-source-key="111:57">我干笑了两声。郑成灿的表情变得犹豫，似乎在纠结要不要开口。</p><p class="story-paragraph" data-source-key="111:58">产生一种不太好的预感。</p><p class="story-paragraph" data-source-key="111:59">只能默默祈祷。千万不要直接戳破我啊…</p><p class="story-paragraph" data-source-key="111:60">可是很显然，上帝并不想让我如愿。</p><p class="story-paragraph dialogue" data-source-key="111:61">“你…是不是…?”</p><p class="story-paragraph" data-source-key="111:62">喜欢我？三个字没有真正说出来，但我已经猜到他什么意思了。</p><p class="story-paragraph" data-source-key="111:63">心里像打翻了牛奶一样慌张，下意识地想要挽回，可是我还能怎么解释呢？</p><p class="story-paragraph dialogue" data-source-key="111:64">“能不能…不要告诉我哥？”</p><p class="story-paragraph" data-source-key="111:65">我的语气里带着难以掩饰的挫败。</p><p class="story-paragraph" data-source-key="111:66">郑成灿显然没想到我会这么说，小鹿一样的双眼里出现短暂的迷茫，随后才肯定地答应下来。</p><p class="story-paragraph dialogue" data-source-key="111:67">“我不说，你放心吧。”</p><p class="story-paragraph dialogue" data-source-key="111:68">“在聊什么？”</p><p class="story-paragraph" data-source-key="111:69">宋银硕回来，坐在我和郑成灿中间。成灿摇摇头，说：“没什么。”</p><p class="story-paragraph dialogue" data-source-key="111:70">“就问了下我是哪个班级的。”我看出郑成灿不太会说谎，所以自己夺过了话茬。一想到刚刚他的反应，心里就像生了锈一样。</p><p class="story-paragraph" data-source-key="111:71">宋银硕沉默了一会，有点听不出语气地说：</p><p class="story-paragraph dialogue" data-source-key="111:72">“我好像也不知道呢。”</p><p class="story-paragraph dialogue" data-source-key="111:73">“一班，二年级一班。”</p><p class="story-paragraph" data-source-key="111:74">我怕郑成灿露馅，赶紧回复道，因为我根本没跟他讲过这些，如果宋银硕问他，那就麻烦了。但这样抢答，反倒有些欲盖弥彰的感觉。</p><p class="story-paragraph" data-source-key="111:75">由于心虚，脸颊和脖子的温度变得发烫，好在宋银硕没再追问什么。</p><p class="story-paragraph" data-source-key="111:77">对于父母辈的恩怨，我知道的只有那些，其余的一概不知。</p><p class="story-paragraph" data-source-key="111:78">其实在已知的部分中，也有很多是我的猜想。不过事实往往会比想象中的更为复杂，那是成年世界的暗流涌动，导致我根本分辨不清谁对谁错。宋银硕的母亲被迫与爱人分开，被迫把美好的爱变成了婚外情，明明是原配，最后却成为了小三，所以我从不要求她欢迎我。我的妈妈本是一心一意地对待她的丈夫，可没想到被父亲中伤的那么彻底，到最后连我都不肯接受了。酿成这种惨象的人是这出三角恋的男主人公，而他又是这三者里唯一一位施舍给我一点爱的人，哪怕很短暂，也很有限。这种给予后又收回的施舍，也让我更加恨他了。</p><p class="story-paragraph" data-source-key="111:79">所以我时常想，为什么他就不能硬气些，既然那么爱那个女人，怎么就不能拿出鱼死网破的气势和家里闹掰呢？为什么一定要将无辜的母亲卷入进来？如果本不相爱，那我是怎么诞生的呢？不相爱的话，为什么要让我出生在这个世界上？</p><p class="story-paragraph" data-source-key="111:80">可是没人能回答我的问题，这个世界上无法理解的人和事情有太多了。</p><p class="story-paragraph" data-source-key="111:81">不过有些已成定局。就算没人欢迎我，我也还是来到了这个世界。就算他们不爱我，他们也还是生下了我。</p><p class="story-paragraph" data-source-key="111:82">长这么大，其实我连自己父亲是做什么工作的都不知道。总之不能让我跻身富二代一列，却也不会少我吃穿。他和我的继母感情稳定，两人鲜少回家。或许是知道自己的儿子是个自立的孩子，父母不在家也能生活的畅快，所以不担心。</p><p class="story-paragraph" data-source-key="111:83">至于我，我是不重要的那个，不管我需不需要照顾，他们都不会考虑到我的层面。</p><p class="story-paragraph" data-source-key="111:84">幸运的是，宋银硕的责任心比我的父亲强了不知多少。从我到这个家的第一天起，只要他在家，就会按时下厨，并且把我的那份也带上；怕我会避嫌，所以我来了之后从不带男性朋友回家，还是我见过并同意了，才把郑成灿领来做客；看到我哭，会问我怎么了，会买来敷眼睛的冰杯。宋银硕从来没有把我当作不速之客。我在这里如履薄冰的生活，也因为他的存在而轻松了不少。</p><p class="story-paragraph" data-source-key="111:85">这个世界上又多了一桩我无法理解的事情。</p><p class="story-paragraph" data-source-key="111:86">既然我已经和郑成灿认识了，之后宋银硕就也没再避着什么，照常带郑成灿来做客，只不过让成灿过来之前，他都会先告诉我。</p><p class="story-paragraph" data-source-key="111:87">因为被戳破了小心思，我和郑成灿之间一直都有些宋银硕不知情的尴尬。后来郑成灿似乎意识到，他的追问对一个女孩的自尊心来说摧残力不亚于台风过境。像是要作出弥补一样，他试图装作什么都没有发生过，热心地和我搭话，还主动加了我的联系方式，而就在不久前，他刚拒绝过我的申请。</p><p class="story-paragraph" data-source-key="111:88">又一次宋银硕不在的间歇，我和郑成灿沉默对坐，时不时抿一口水。</p><p class="story-paragraph" data-source-key="111:89">突然他问我知不知道我刚到这个家时宋银硕是什么反应。</p><p class="story-paragraph" data-source-key="111:90">我说我不知道。心里也很好奇为什么宋银硕愿意照顾我这个根本没有意义的人。这也是我一直都想不通的事情。如果换做我是他，根本不会大发善心地每天关照这个初来乍到的妹妹，但宋银硕和我不一样，我的成长过程中没有体会过付出与陪伴，所以我无法想象自己给予别人的景象，但他是充满爱的孩子，他给我的照顾，不过是举手之劳而已，因为那些爱对他而言，根本不是稀罕物。</p><p class="story-paragraph dialogue" data-source-key="111:91">“其实也没什么，就是突然有一天，银硕跟我说，‘不能再来我家了’，我还以为是叔叔阿姨有些介意，结果他告诉我，是突然间多了个妹妹。”</p><p class="story-paragraph dialogue" data-source-key="111:92">“我问他，是亲戚家的妹妹来借住吗？他说不是，是半亲生的。”</p><p class="story-paragraph dialogue" data-source-key="111:93">“‘什么是半亲生？’，他说，‘就是一半亲生的，同父异母的妹妹’。”</p><p class="story-paragraph" data-source-key="111:94">我有些讶异：“然后呢？”</p><p class="story-paragraph" data-source-key="111:95">郑成灿摇摇头：“然后就没有了。虽然我们关系好，但我也不想过分刺探他的隐私，所以就只问了这些。”</p><p class="story-paragraph" data-source-key="111:96">宋银硕拿着从他房间里的小冰箱取出来的饮料回来了，坐下时有点怪里怪气地说我们两个总是趁他不在讲悄悄话。</p><p class="story-paragraph" data-source-key="111:97">递给我的易拉罐已经被贴心地启开了，我抿了一口，气泡水在嘴里迸溅，我舒爽地眯起眼。</p><p class="story-paragraph" data-source-key="111:98">缩小的视野里，宋银硕低着头咬了一口披萨角，即使是喉结并不明显的类型，还是能看到细长脖颈在吞咽时的滚动，我赶紧把视线移到一边，正对上郑成灿的双眼，他也因清爽的汽水而幸福地眯着小鹿眼睛。</p><p class="story-paragraph" data-source-key="111:99">因为宋银硕，我突然多出许多与郑成灿接触的机会，也不得不因为贪图与郑成灿的相处时间而推脱了几次和恩智炤熙的晚饭邀约，两人抱怨不止，说我重色轻友，我破费一顿烤肉，才终于把他们的嘴巴堵住。</p><p class="story-paragraph" data-source-key="111:100">我给自己包了块五花肉，都快送进嘴里了，突然觉得有点吃不下了，于是拐了个弯，塞进恩智的嘴里。</p><p class="story-paragraph dialogue" data-source-key="111:101">“来~爱的饭包。”</p><p class="story-paragraph" data-source-key="111:102">恩智嘴里的肉还没咽完，紧接着又被我塞了一口，两腮鼓得像仓鼠一样，嚼了好久也没嚼完，含含糊糊地痛斥我把吃不完的东西全塞给她了。</p><p class="story-paragraph dialogue" data-source-key="111:103">“我呢我呢。”炤熙亮着眼睛问我怎么不给他包，我一摆手：“挑食小学生，自己包去吧。”</p><p class="story-paragraph" data-source-key="111:104">恩智在李炤熙清亮的哀嚎中咽完了那一口包饭，我捂着耳朵感叹自己是怎么做到同时和两个大嗓门当朋友的。差点噎死的恩智赶紧顺了口水，然后问我：“最近进展如何。”</p><p class="story-paragraph" data-source-key="111:105">我无语：“说得好像我们很久没见过了一样，午休的时候不是问过一遍了吗？”</p><p class="story-paragraph dialogue" data-source-key="111:106">“嘿嘿，这不是怕你趁课间，又和那谁互通消息了嘛。”</p><p class="story-paragraph dialogue" data-source-key="111:107">“没有，加完好友，一句话都没说过，就和我哥在一起的时候有聊天。”</p><p class="story-paragraph" data-source-key="111:108">恩智露出恨铁不成钢的表情：“你傻啊！你不找他，难不成他能来找你吗？”</p><p class="story-paragraph" data-source-key="111:109">低头看着盘子里的油渍，温吞吞地来了一句。</p><p class="story-paragraph dialogue" data-source-key="111:110">“我不知道能说什么。”</p><p class="story-paragraph dialogue" data-source-key="111:111">“没话找话啊。”</p><p class="story-paragraph dialogue" data-source-key="111:112">“那他讨厌我怎么办。”</p><p class="story-paragraph" data-source-key="111:113">想到郑成灿问我是不是曾经对他献过殷勤时那副尴尬的表情，我就恨不得把自己扎进土里。</p><p class="story-paragraph dialogue" data-source-key="111:114">“再找他说话，好像有点不识好歹了。”我闷闷地说。</p><p class="story-paragraph" data-source-key="111:115">恩智有些急了，她直线一样的性格很难理解我的踟蹰，果然她说：</p><p class="story-paragraph dialogue" data-source-key="111:116">“反正都到这一步了，他都已经知道了，那为什么不继续？上厕所哪有拉一半夹断提裤子的道理！”</p><p class="story-paragraph" data-source-key="111:117">旁边李炤熙抱怨一声：“我还没吃完呢！”撂下筷子沉思了一会儿，又弱弱补充：“我觉得她话糙理不糙…”</p><p class="story-paragraph" data-source-key="111:118">恩智得到支持，也不问我的意见，一拍桌子替我决定：</p><p class="story-paragraph dialogue" data-source-key="111:119">“明天继续！”</p></div>

      <article class="chapter" data-chapter="chapter-04">
        <header class="chapter-header"><span class="chapter-number">04</span><h2>Chapter 4</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="116:0">从来不见宋银硕出现在球场，午休时间他都会选择在教室里睡懒觉。中午自然成为唯一能够单独见到郑成灿的时段。</p><p class="story-paragraph" data-source-key="116:1">我被恩智“强迫”来到球场，心一横，也觉得她说得对。既然已经被发现了，那不如就厚脸皮一些，万一死缠烂打成功了呢？</p><p class="story-paragraph" data-source-key="116:2">郑成灿答应过要保密，就说明我的追求不会影响他和宋银硕之间的友情，那我也就不用过度担心了。大不了就再也不见郑成灿呗。</p><p class="story-paragraph" data-source-key="116:3">抱着两瓶饮料坐在球场外围。身旁还有几个不认识的女生也在扒着铁围栏看，等到郑成灿一边擦汗一边往外走时，叽叽喳喳地沸腾了一小会儿。</p><p class="story-paragraph dialogue" data-source-key="116:4">“去呀，去呀，没关系的。”</p><p class="story-paragraph" data-source-key="116:5">我听见她们催促其中的一个女生，暖阳透过叶隙落在她们的发丝上，柔软又勇敢的背影。</p><p class="story-paragraph" data-source-key="116:6">像是旁观到了五彩斑斓的梦幻泡泡，不敢惊动戳破，只能默默跟在她们身后走。</p><p class="story-paragraph" data-source-key="116:7">郑成灿出来后看见了我，便直奔我的方向而来，前面的女生还不知情，以为郑成灿是朝她们过来的，立刻爆发出惊喜的尖叫。</p><p class="story-paragraph" data-source-key="116:8">直到他掠过她们停在我面前。</p><p class="story-paragraph" data-source-key="116:9">余光看到她们由惊愕转为失落的表情。</p><p class="story-paragraph" data-source-key="116:10">泡泡破了，落在我脸上，变成淬了毒的剜刀。</p><p class="story-paragraph" data-source-key="116:11">感觉自己像个罪人。</p><p class="story-paragraph" data-source-key="116:12">他似乎想问我怎么来了，随后看到我怀里捧着的水，那么大只的一个人愣在原地。</p><p class="story-paragraph" data-source-key="116:13">我不敢看他，也不敢承受别人的失望。低下头，后悔。心里想着，果然我还是不来最好。</p><p class="story-paragraph" data-source-key="116:14">郑成灿接过我的水，怔怔地说了句：“谢谢。”</p><p class="story-paragraph dialogue" data-source-key="116:15">“不用客气，那我…先走了？”</p><p class="story-paragraph" data-source-key="116:16">我逃也般地转身，还没走呢，就听见郑成灿叫我，脚步又扎根在原地。我回头，看到他的眼里盛满了慎重的情绪，像是走在初冬的湖面，生怕踩碎脚下的那层薄冰，尖利的碎片可能会刺伤某个人。</p><p class="story-paragraph" data-source-key="116:17">我察觉出他视死如归的状态，又有一种不太妙的预感。</p><p class="story-paragraph dialogue" data-source-key="116:18">“谢谢你，但…我和银硕是很好的朋友，以后，可以不要再…”</p><p class="story-paragraph dialogue" data-source-key="116:19">“噢。”</p><p class="story-paragraph" data-source-key="116:20">我尴尬地笑了下，找了个无厘头的理由：“这个是感谢你前天到我家时带来的酸奶碗，很好吃。”</p><p class="story-paragraph" data-source-key="116:21">郑成灿体谅地点头，没有继续说下去。</p><p class="story-paragraph" data-source-key="116:22">他的保护反而使我更难受了。觉得自己说的话做的事都好滑稽，就像个跳梁小丑一样。</p><p class="story-paragraph" data-source-key="116:23">讨厌狡辩，也讨厌对着外人说话时不得不把那个地方称作“我家”，更讨厌因为自己是宋银硕的妹妹，所以他才肯多看我几眼，又因为我是宋银硕的妹妹，所以他不肯多接触我几次。</p><p class="story-paragraph" data-source-key="116:24">不能再看着郑成灿了。</p><p class="story-paragraph" data-source-key="116:25">大脑一片空白，像是闯祸砸了别人玻璃的孩子一样拔腿离开。越走越快，越走越快，想要把一腔的委屈都泄在身后。我只是喜欢他，没有任何错。郑成灿请不要讨厌我，那些女生也不要受伤，好吗？喜欢是没有错的，拒绝一个人的喜欢也是没有错的。整件故事我找不出一位罪人，可为什么总感觉自己好像犯了弥天大错一样负罪呢。被我甩在身后的是郑成灿与无辜被伤的女孩，没能被我甩开的是心里的狼藉。它们永远跟着我。因为我本身就是一片狼藉。</p><p class="story-paragraph" data-source-key="116:26">等我反应过来时，眼泪已经被疾走的风横吹进鬓角里，痒痒的。我听着耳边簌簌的风响，泪水就像泄了闸，无休无止地流淌。</p><p class="story-paragraph" data-source-key="116:27">我蹲下，把脸埋进手心里。</p><p class="story-paragraph" data-source-key="116:28">直到听见身后传来脚步声。以为是路人，又或者是郑成灿因为愧疚而追了过来。</p><p class="story-paragraph" data-source-key="116:29">想到还有这种可能性存在，我透着指缝满怀希望地睁开眼睛，还没看到人，就听见宋银硕喊我的名字。</p><p class="story-paragraph" data-source-key="116:30">像一片羽毛落到湖面，吸饱了水后沉进湖底。我的心也落空了。</p><p class="story-paragraph dialogue" data-source-key="116:31">“这是怎么了…”</p><p class="story-paragraph" data-source-key="116:32">他有些茫然，也蹲下，试图和我平视。我赌气般地在他凑近后把脸躲进膝盖：“没什么。”</p><p class="story-paragraph dialogue" data-source-key="116:33">“骗人。我出来找成灿，看到你和他说话了。”</p><p class="story-paragraph dialogue" data-source-key="116:34">“……”</p><p class="story-paragraph dialogue" data-source-key="116:35">“他说什么了把你气成这样？”</p><p class="story-paragraph dialogue" data-source-key="116:36">“………”</p><p class="story-paragraph dialogue" data-source-key="116:37">“喂，说话啊。”他用指尖戳了戳我朝向他的头顶。良久的沉默后，我听见宋银硕无奈地叹了口气。</p><p class="story-paragraph dialogue" data-source-key="116:38">“你…是不是喜欢郑成灿啊。”</p><p class="story-paragraph" data-source-key="116:39">我的啜泣卡顿了一下，算是对秘密泄露的回应。</p><p class="story-paragraph" data-source-key="116:40">想到刚刚郑成灿的反应。宋银硕也是他拒绝我的理由之一。不想和好朋友的妹妹有过多的牵扯，所以从一开始就不给我机会…可又不是我选择宋银硕做我的哥哥的，如果我能选，我会选择不认识他，会选择没有他这个哥哥。</p><p class="story-paragraph dialogue" data-source-key="116:41">“都怪你。”</p><p class="story-paragraph" data-source-key="116:42">我说话还带着哭腔。</p><p class="story-paragraph" data-source-key="116:43">宋银硕很显然被我无理取闹到了，用无辜的语气问：“怎么怪起我来了？”</p><p class="story-paragraph dialogue" data-source-key="116:44">“就是怪你。”我咬牙，把一肚子的委屈都赖在他头上，如果没有他的存在，郑成灿或许就不会顾虑那么多了。</p><p class="story-paragraph" data-source-key="116:45">我只希望他赶快走，给我一个安静的空间整理自己，所以话里话外都是找他的茬，但宋银硕竟然一一应下了我的诬告，不分黑白地把错误揽下。</p><p class="story-paragraph dialogue" data-source-key="116:46">“好好，都怪我。是我不好。”他把我的胳膊拉开，强迫我离开这种“谁都别来烦我”的隔绝状态。</p><p class="story-paragraph" data-source-key="116:47">我被他盯得有些难堪，就把脸别到一边去抹眼泪。</p><p class="story-paragraph dialogue" data-source-key="116:48">“我也道过歉了，要怎样才能让你止哭？”宋银硕耐着性子问。</p><p class="story-paragraph" data-source-key="116:49">我顿住，有些厚脸皮地要求他。</p><p class="story-paragraph dialogue" data-source-key="116:50">“你帮我追他，我就不哭了。”</p><p class="story-paragraph" data-source-key="116:51">宋银硕没说同意，也没说拒绝。就像没听见一样，站起身，又俯下来把我架起。</p><p class="story-paragraph dialogue" data-source-key="116:52">“快到上课时间了，先回教室吧。”</p><p class="story-paragraph dialogue" data-source-key="116:53">“听到了吗？”我不死心地又重复一遍。</p><p class="story-paragraph" data-source-key="116:54">宋银硕的脖子有点发红，过了几秒才面露难色地回答我：</p><p class="story-paragraph dialogue" data-source-key="116:55">“这要看他愿不愿意吧，我说的又不算。”</p><p class="story-paragraph" data-source-key="116:56">这是今天收到的第二份拒绝。而我已经没有知觉去体会失望了，慢慢磨蹭回自己的班级，又想，刚刚走得那么快，没有摔个狗啃泥简直就是奇迹。</p><p class="story-paragraph" data-source-key="116:58">愚人节过后，学校上上下下开始为春季运动会做筹备。</p><p class="story-paragraph" data-source-key="116:59">身为体育差生的我，每次运动会都会抢先报名一些铅球、立定跳等不需要跑动的项目，以防最后剩余的万人嫌长跑项目落到我的头上。可今年报名项目的时候，我刚巧被老师叫走，回来时就只剩下一项女子长跑没人报名了。整个班级还没有参与项目的女生只有我和另一位脚上打了石膏的，所以报名栏上该填谁的名字就显而易见了。</p><p class="story-paragraph dialogue" data-source-key="116:60">“那个…能不能不填啊，我不太会跑步…”</p><p class="story-paragraph" data-source-key="116:61">体育委员有些为难地挠了挠头：“那也不能叫永熙跑啊，她脚都骨折了。”</p><p class="story-paragraph" data-source-key="116:62">我的表情不情不愿，体育委员还贴心地安慰我说慢慢跑就可以，名次不重要。可我的脑海里却浮现出一种可能性，因奔跑而跌倒时围观我的人不停嘲笑我的窘样的场景…还没有真实经历到，光是想想就觉得心跳加速。</p><p class="story-paragraph" data-source-key="116:63">如果真让我去跑长跑，脸皮都会丢光的吧。</p><p class="story-paragraph" data-source-key="116:64">绝对不能让这种事发生。</p><p class="story-paragraph" data-source-key="116:65">我去求了报名立定跳远的同学，各种“威逼利诱”，终于让她松口同意和我交换项目。</p><p class="story-paragraph" data-source-key="116:66">带着劫后余生的欣喜去找体育委员，他却告诉我，报名表已经送走了，要自己去体育部改才行。</p><p class="story-paragraph" data-source-key="116:67">我傻眼了，好像…郑成灿是学生会体育部的部长来着。</p><p class="story-paragraph" data-source-key="116:68">如果前几天没有发生过那件事的话，偶然得到一个正当理由去找他，我肯定窃喜得不行。</p><p class="story-paragraph" data-source-key="116:69">但被拒绝的场景依旧历历在目，甚至隔了两天，才敢翻出回忆跟恩智和炤熙讲。</p><p class="story-paragraph" data-source-key="116:70">有那么一瞬间，我想打发李炤熙替我跑腿，但又斥责自己，这种缩头乌龟的行为也太没出息了，我是带着正当理由去的，为什么连见他一面都要心虚？况且体育部也不只他一个人，我未必会撞见他。虽然我还是想见到郑成灿，就算尴尬也想。</p><p class="story-paragraph" data-source-key="116:71">于是趁大课间时，我溜出教室。循着走廊，抬头寻找学生会的办公室标牌。</p><p class="story-paragraph" data-source-key="116:72">静止的阳光从窗户透进来，被途经的学生穿过，影影绰绰。喧嚷的走廊里有各种各样的声音，我又从别人口中听到了“郑成灿”的名字，但这次还有“宋银硕”。因为他是我讨厌的哥哥，所以我时常忘记他也是一小部分女生心仪的人。长得帅，还温柔，人又聪明，和郑成灿同理，宋银硕被人喜欢也是理所应当的事情。到了，学生会。</p><p class="story-paragraph" data-source-key="116:73">透过门上的玻璃，我看到办公室里空无一人。</p><p class="story-paragraph" data-source-key="116:74">说不上来该失落还是该庆幸。指关节礼貌地叩门，静候一秒才进去。</p><p class="story-paragraph" data-source-key="116:75">很安静，只有我一个人。</p><p class="story-paragraph" data-source-key="116:76">心底确确实实的传来迟钝的失落，像刀背割肉，压过了原本的踟蹰。</p><p class="story-paragraph" data-source-key="116:77">原来，比起害怕见到他，还是期待见到他的感情更强烈一些。</p><p class="story-paragraph" data-source-key="116:78">我挨个搜罗着办公桌上的标识，终于看到立着体育部亚克力牌的桌子，桌上桌下堆着好多个球。我在上面找到我们班的报名表，正要改动，就听到开门的声音，一抬头，和郑成灿四目相对。</p><p class="story-paragraph" data-source-key="116:79">他像一只受惊的兔子一般，在门口手足无措的站着。</p><p class="story-paragraph dialogue" data-source-key="116:80">“啊，抱歉，我不知道你在…”</p><p class="story-paragraph" data-source-key="116:81">随后仓皇地转身。</p><p class="story-paragraph" data-source-key="116:82">看到郑成灿被我惊动，我下意识地甩下水性笔，朝门口跑去:</p><p class="story-paragraph dialogue" data-source-key="116:83">“等下，我！”</p><p class="story-paragraph" data-source-key="116:84">却在门口被门槛狠狠绊了一下，整个人向前扑倒，结实地摔在地上。</p><p class="story-paragraph" data-source-key="116:85">身体还没有反应过来痛感，我就被人扶起来了。</p><p class="story-paragraph dialogue" data-source-key="116:86">“走路要注意脚下啊。”</p><p class="story-paragraph" data-source-key="116:87">熟悉的、无奈的语气。</p><p class="story-paragraph" data-source-key="116:88">抬头看到宋银硕平静的双眼，一时间没有缓过神，无助地看向郑成灿离去的方向，已经不见人影了。</p><p class="story-paragraph dialogue" data-source-key="116:89">“摔到哪儿了？说话？”</p><p class="story-paragraph" data-source-key="116:90">他的手心在我眼前晃了晃：“摔傻了？”</p><p class="story-paragraph" data-source-key="116:91">我呆呆地摇头。宋银硕见我不说话，叹了口气，替我掸掉袖子上的灰尘，又扯过我因迷茫而一直攥紧的手心。</p><p class="story-paragraph" data-source-key="116:92">现在是春季，学生都穿着长款制服，所以直接接触地面的部位只有裸露在外的手。</p><p class="story-paragraph" data-source-key="116:93">宋银硕一根一根地掰开我的手指，把我的手放在他的掌心摊平。</p><p class="story-paragraph" data-source-key="116:94">这时我才看到皮肤上渗出的血珠，鲜红色映在眼里，混合着灰土，后知后觉地体会到灼烧般的痛。但比充血的掌心更令人在意的，是宋银硕传递过来的温度。微凉的指尖把我托举，却让我感到了燎原的热度。</p><p class="story-paragraph" data-source-key="116:95">他的眉头皱起来，再和我对视时，眼里多了些我辨别不清的情绪。</p><p class="story-paragraph dialogue" data-source-key="116:96">“冲一下。”他拽着我的手腕，往水房的方向走。我跟不上他的步伐，被扯得踉踉跄跄。</p><p class="story-paragraph" data-source-key="116:97">到达后，他不由分说地打开水龙头，把我的手掌放到下面。</p><p class="story-paragraph" data-source-key="116:98">我被蜇痛，倒抽一口凉气，小心翼翼地观察着宋银硕认真的侧脸。</p><p class="story-paragraph" data-source-key="116:99">他用指尖抹掉了我伤口上的灰土，不知道从哪里掏出来几张皱巴巴的纸巾。想替我擦，又突然想到什么似的，有点难为情的补充一句：</p><p class="story-paragraph dialogue" data-source-key="116:100">“纸是没用过的。”然后塞进我的手心。</p><p class="story-paragraph" data-source-key="116:101">我闷闷地说了声“谢谢”，轻轻地用它沾掉伤口处多余的血水。</p><p class="story-paragraph dialogue" data-source-key="116:102">“你刚刚…是要去追郑成灿？”</p><p class="story-paragraph" data-source-key="116:103">我没说话，算是默认了。</p><p class="story-paragraph dialogue" data-source-key="116:104">“搞不懂你。”宋银硕摇头，退后一步，看我仍愣在原地不动，又提醒一句：“预备铃响了，快回去吧。”</p><p class="story-paragraph" data-source-key="116:105">我像是被施了命令的机器人，不假思索地跟着宋银硕往外走。</p><p class="story-paragraph" data-source-key="116:106">随后又突然想起来自己的报名表还没改，这可是正事。</p><p class="story-paragraph dialogue" data-source-key="116:107">“你先回去吧，我还要再去一趟办公室。”</p><p class="story-paragraph dialogue" data-source-key="116:108">“郑成灿不在，他肯定回教室了。”</p><p class="story-paragraph" data-source-key="116:109">宋银硕误会了我的意思，他以为我还要去找成灿。我的心里有些不悦。</p><p class="story-paragraph dialogue" data-source-key="116:110">“不是，我是要去改报名表…”</p><p class="story-paragraph" data-source-key="116:111">正式上课的铃声从广播喇叭传来，宋银硕瞄了一眼，没再看我：“你先回去上课吧，下午再改也可以，我会跟他说，让他等你一下的。”</p><p class="story-paragraph" data-source-key="116:112">得到了意料之外的回答，来不及感谢他，点点头，就赶紧朝教室的方向赶去了。</p><p class="story-paragraph dialogue" data-source-key="116:113">“等下。”</p><p class="story-paragraph" data-source-key="116:114">又被宋银硕叫住，手中被他塞了不知道什么东西，我没来得及看，害怕迟到太久，只能先扭头赶路了。</p><p class="story-paragraph" data-source-key="116:115">回到座位后松开手心，才发现是两张皱巴巴的OK绷。</p><p class="story-paragraph" data-source-key="116:116">整整一堂课我都心不在焉。郑成灿落荒而逃的背影在心间挥之不去，我烦心得厉害，用笔尖在课本上戳了很多个点点。</p><p class="story-paragraph" data-source-key="116:117">好像真的被讨厌了。</p><p class="story-paragraph" data-source-key="116:118">再去一次的话，也是不自量力的行为吧…他已经那么明确地和我划开界限了，我不应该再像听不懂话的傻子一样奔过去的。</p><p class="story-paragraph" data-source-key="116:119">午休时，我把手机从手机箱里偷拿出来，给宋银硕发消息：</p><p class="story-paragraph dialogue" data-source-key="116:120">[你替我跟成灿说一声，把我的项目换成跳远吧]</p><p class="story-paragraph dialogue" data-source-key="116:121">[我就不再跑一趟了]</p><p class="story-paragraph dialogue" data-source-key="116:122">[拜托了]</p><p class="story-paragraph" data-source-key="116:123">他很快回我一个“OK”。</p></div>
      </article>

      <article class="chapter" data-chapter="chapter-05">
        <header class="chapter-header"><span class="chapter-number">05</span><h2>Chapter 5</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="121:0">不知道郑成灿和宋银硕都说了什么，总之他再也没带郑成灿来做客了。我也不能去央求宋银硕让他为我和郑成灿制造机会，一切仿佛陷入了死局。</p><p class="story-paragraph" data-source-key="121:1">不算初恋的初恋就这么夭折，我连续好几天都打不起精神，吃的东西也变少了，恍恍惚惚，像是失恋了一样，就连体重也跟着下降，整个人憔悴了不少。</p><p class="story-paragraph" data-source-key="121:2">恩智和炤熙不敢再和我提起郑成灿，我就装作什么都没有发生过，实际每次打开talk时都能看到与郑成灿空无一物的聊天框。我一咬牙，删掉了。但我又没争气到那个地步，被我删掉的，只是聊天框而已。</p><p class="story-paragraph" data-source-key="121:3">到了运动会的那天。李炤熙有短跑比赛，我和恩智去替他加油。走到一半听到广播喊：“参与跳远项目的同学请到台下集合。”就跟他们两个说了一声，自己过去了。</p><p class="story-paragraph" data-source-key="121:4">路上经过高三的地盘，想低头快点略过，余光还是捕捉到了身着蓝白球衣的郑成灿。</p><p class="story-paragraph" data-source-key="121:5">他一定是参加了足球项目吧。</p><p class="story-paragraph" data-source-key="121:6">咬了咬嘴唇，不让自己继续想有关他的事情。闷头走到位置，明明马上就要开始比赛了，心里却一点都不紧张。我知道自己只不过是个凑数的，来走个过场而已，根本没想过要拿奖。</p><p class="story-paragraph" data-source-key="121:7">到我的时候，随便跳了一次，果然，根本排不上名次。</p><p class="story-paragraph" data-source-key="121:8">我的任务完成了，没有过多的停留，准备去找恩智和炤熙回合。</p><p class="story-paragraph" data-source-key="121:9">朝着操场的方向张望，也不知道短跑比赛是不是开始了。</p><p class="story-paragraph" data-source-key="121:10">红色的跑道上并没有选手奔跑的身影，倒是草坪中央有穿梭的两群人，伴随着一阵又一阵的哄喊。经验丰富的我一下就从里面捕捉到郑成灿的身影，他们已经上场了。</p><p class="story-paragraph" data-source-key="121:11">我只能做个胆小鬼，远远地看着他在球场上灵活移动，传球，射门。</p><p class="story-paragraph" data-source-key="121:12">因为郑成灿，一向对运动不感兴趣的我也看得津津有味，把和朋友汇合这件事忘到了脑后，定在原地遥望着，又着了魔一般地朝他的方向移动。</p><p class="story-paragraph" data-source-key="121:13">这么多人围着，他又在全神贯注地比赛，应该不会发现我吧…</p><p class="story-paragraph" data-source-key="121:14">我在没什么人的位置蹲下，扯长了袖子捂住下半张脸。</p><p class="story-paragraph" data-source-key="121:15">又是一个漂亮的射门。我听到人群中爆发出欢呼声，郑成灿高举双臂庆祝，球服的半袖滑落，露出他白净又结实的臂膀。会是怎样的触感呢？我没和男生有过什么身体接触。李炤熙的胳膊像一对儿小鸡翅膀，和郑成灿的肯定不一样……脑海中闪过之前和宋银硕一起回家的夜晚，我虚着的拳头落在他的胳膊上，他的身体流淌着平静的血液，隔着外套感受到那种温度。我有些不自在地揉了揉逐渐滚烫的耳垂，结束回忆时，突然听到有人喊了句“小心！”。</p><p class="story-paragraph" data-source-key="121:16">等我反应过来时，球刚刚好好砸中了鼻子。我仄歪了一下，感觉到湿热的液体流淌到下巴，啪嗒，啪嗒，滴在白色的校服内衬上。</p><p class="story-paragraph" data-source-key="121:17">伸手抹了一把鼻子嘴巴，满手的鲜红色。</p><p class="story-paragraph dialogue" data-source-key="121:18">“欸？”</p><p class="story-paragraph" data-source-key="121:19">我傻住了。</p><p class="story-paragraph" data-source-key="121:20">世界开始在我眼前打转、模糊、变得漆黑一片。</p><p class="story-paragraph" data-source-key="121:21">最后的画面是郑成灿焦急万分地跑来，蓬松的发丝一翘一翘。</p><p class="story-paragraph" data-source-key="121:22">好像小狗耳朵，我想。</p><p class="story-paragraph dialogue" data-source-key="121:23">“没事吧！你还好吗——”</p><p class="story-paragraph" data-source-key="121:25">醒过来时，我躺在学校的医务室里。看着白色的天花板，晕倒前的画面在脑海重播，郑成灿奔过来，扑在我身边…</p><p class="story-paragraph" data-source-key="121:26">惊觉，刚刚好像是郑成灿抱我过来的。</p><p class="story-paragraph" data-source-key="121:27">于是猛然坐起来。</p><p class="story-paragraph" data-source-key="121:28">但旁边并没有郑成灿的身影。</p><p class="story-paragraph dialogue" data-source-key="121:29">“醒了？”</p><p class="story-paragraph" data-source-key="121:30">宋银硕似笑非笑地看着我。</p><p class="story-paragraph" data-source-key="121:31">我茫然的看了一圈，没有，什么都没有。</p><p class="story-paragraph dialogue" data-source-key="121:32">“郑成灿呢？”</p><p class="story-paragraph dialogue" data-source-key="121:33">“我让他先回去了。”身旁的哥哥轻飘飘地说。</p><p class="story-paragraph dialogue" data-source-key="121:34">“怎么，很失望吗？”</p><p class="story-paragraph dialogue" data-source-key="121:35">“……”</p><p class="story-paragraph dialogue" data-source-key="121:36">“我又不是不能照顾你，别用那种失望的表情看着我。”</p><p class="story-paragraph" data-source-key="121:37">宋银硕无奈地笑了，又是这样。</p><p class="story-paragraph" data-source-key="121:38">总是在我被成灿无意伤害后出现。</p><p class="story-paragraph" data-source-key="121:39">总用这副拿我没有一点办法的样子来到我身边。</p><p class="story-paragraph" data-source-key="121:40">总是在我睁眼希望看到成灿时，打破我的憧憬。</p><p class="story-paragraph" data-source-key="121:41">鼻腔很痛，每一次呼吸都带着血的味道，像是气管中生出带刺的荆棘，阻塞着喘息。</p><p class="story-paragraph dialogue" data-source-key="121:42">“是郑成灿送我过来的吗？”</p><p class="story-paragraph dialogue" data-source-key="121:43">“是。”</p><p class="story-paragraph dialogue" data-source-key="121:44">“那你明知道我喜欢他，为什么要把他支走？”</p><p class="story-paragraph" data-source-key="121:45">看到我的眼泪，宋银硕明显有些慌乱了，深黑的瞳仁打颤。</p><p class="story-paragraph dialogue" data-source-key="121:46">“…对不起。”</p><p class="story-paragraph" data-source-key="121:47">我低下头，眼泪滴落。衣服上还残留着刺目的血迹，刚开始干涸，外边一圈变成深棕色。我们谁都没有说什么，整个医务室里，只能听到我小声啜泣的声音。</p><p class="story-paragraph dialogue" data-source-key="121:48">“和我这个哥哥相处…让你很不舒服吗？”</p><p class="story-paragraph" data-source-key="121:49">宋银硕温润的嗓音突然从身侧传来。</p><p class="story-paragraph" data-source-key="121:50">我没想到他会说这种话，瞪大了双眼惊讶地看着他，连哭都忘了。</p><p class="story-paragraph" data-source-key="121:51">依旧是那副云淡风轻的样子，和他问出来的问题一点都不搭配。</p><p class="story-paragraph dialogue" data-source-key="121:52">“讨厌哥哥了吗？”</p><p class="story-paragraph" data-source-key="121:53">怎么会有人说这种话的时候也听不出激烈的情绪呢？</p><p class="story-paragraph" data-source-key="121:54">我突然觉得面前的宋银硕很神奇，至少我捉摸不透。</p><p class="story-paragraph" data-source-key="121:55">他见我的表情有所缓解，舒了口气，放松下来，然后笑着抬手指了下我的鼻子。</p><p class="story-paragraph dialogue" data-source-key="121:56">“鼻子都快哭成小丑了。”</p><p class="story-paragraph" data-source-key="121:57">听他这么说，那种绝望感又回来了。</p><p class="story-paragraph" data-source-key="121:58">看到我欲哭的表情，宋银硕立马有些磕巴地解释：“我不是那个意思，我是想说，红扑扑的样子还挺可爱的。”</p><p class="story-paragraph" data-source-key="121:59">我没理他，自己又抹了把眼泪。宋银硕尴尬地了咳了下，然后问我：“那你现在感觉怎么样？”</p><p class="story-paragraph dialogue" data-source-key="121:60">“还好。”</p><p class="story-paragraph" data-source-key="121:61">只是鼻子很痛。</p><p class="story-paragraph dialogue" data-source-key="121:62">“要回家吗？”</p><p class="story-paragraph" data-source-key="121:63">我有点迟疑：“可以吗？”</p><p class="story-paragraph dialogue" data-source-key="121:64">“今天是运动会，早退应该也没什么关系吧。”</p><p class="story-paragraph" data-source-key="121:65">说是问我，实际上宋银硕已经起身，背起我的书包。我刚想问他哪儿拿来的，他像是猜出我想问什么，解释道：“你朋友也来过了，我让她们帮忙把你的东西带过来的。”</p><p class="story-paragraph dialogue" data-source-key="121:66">“噢…”</p><p class="story-paragraph" data-source-key="121:67">我慢吞吞地把脚踩进运动鞋。不知道是谁替我做的这些，校医？郑成灿？还是宋银硕呢。感觉到脸颊又开始发烫，我努力晃了晃头，想把那些不着边际的想法甩出去。</p><p class="story-paragraph" data-source-key="121:68">回到家后，我才看到手机上郑成灿发过来的消息：</p><p class="story-paragraph" data-source-key="121:69">*［因为还要管理运动会现场，所以不得不叫来银硕，不能守着你，真的很抱歉］</p><p class="story-paragraph" data-source-key="121:70">*［明天我带着那个踢球的人给你赔偿道歉］</p><p class="story-paragraph" data-source-key="121:71">*［你现在还好吗］</p><p class="story-paragraph" data-source-key="121:72">我怔了一下，已经是几个小时前发来的了。我赶紧回复：</p><p class="story-paragraph dialogue" data-source-key="121:73">［不不不，不是你的错，我现在好多了］</p><p class="story-paragraph dialogue" data-source-key="121:74">［谢谢你担心我］</p><p class="story-paragraph" data-source-key="121:75">再抬头，看到宋银硕在厨房忙碌的背影。突然觉得心里像是被踮脚走路的猫咪踩了一圈，柔软，发痒，还带着酥酥麻麻的痛。</p><p class="story-paragraph" data-source-key="121:76">原来不是宋银硕支走了郑成灿。</p><p class="story-paragraph" data-source-key="121:77">那为什么他被我误会了却不辩解呢？</p><p class="story-paragraph" data-source-key="121:78">郑成灿应该是还在忙，所以没回复我。我把手机放到一边，大脑已经乱成了一团麻线。</p><p class="story-paragraph" data-source-key="121:79">因为愧疚，我想去帮宋银硕做些什么，但蹑手蹑脚地走到他旁边，却发现他已经有条不紊地处理好了所有食材，现在正在等锅里的油升温。</p><p class="story-paragraph" data-source-key="121:80">看到我过来，宋银硕头也不抬地问：</p><p class="story-paragraph dialogue" data-source-key="121:81">“是饿了吗，别急，很快就好。”</p><p class="story-paragraph dialogue" data-source-key="121:82">“不…”我的话在喉咙里停了一下，像是犹豫的磁带，丝丝拉拉地卡顿后又继续播放：“我…就是来看看你…我能不能帮你……”</p><p class="story-paragraph" data-source-key="121:83">说话的声音越来越小。宋银硕这才抬头看我一眼，没什么多余的反应，长长的胳膊从我面前经过，拿起一旁的碗，把里面切好的蔬菜通通倒进锅里。</p><p class="story-paragraph dialogue" data-source-key="121:84">“唰啦”一声，带着水分的蔬菜落入油中，声音很大，油水迸溅，我吓得往后退了一步，听见宋银硕轻笑一声。</p><p class="story-paragraph dialogue" data-source-key="121:85">“这里没什么需要帮忙的，你的任务就是等着吃饭。”</p><p class="story-paragraph" data-source-key="121:86">我悻悻地退回沙发，望着宋银硕在料理台忙碌的身影，心底升起的情绪像一盒颜料搅在一起，感激、愧疚、讨厌、眷恋…赤橙黄绿青蓝紫，搅合在一起就成了黑色。</p><p class="story-paragraph" data-source-key="121:87">他是第一位悉心照顾我的人，可是如果他和他的母亲不存在的话，或许我早就能得到我本该得到的父爱母爱了，我早就可以被呵护、被关心、被体贴、被唠叨，而不是等到十六七岁才得到零星的照料，还是由一个刚认识半年多的异母哥哥来对我付出，而且我没有任何能回报他的资本。</p><p class="story-paragraph" data-source-key="121:88">宋银硕端着卖相讨喜的什锦炒饭放在我面前，然后转身回到厨房端来他自己的那份。</p><p class="story-paragraph" data-source-key="121:89">身侧的沙发陷落，他坐在我的旁边，隔着一段兄妹间本分的距离。</p><p class="story-paragraph" data-source-key="121:90">我木木地舀了一勺饭，大口的塞进嘴里。忘记吹了，饭烫得舌头疼，烫得我鼻酸，烫得我眼眶又湿了。</p><p class="story-paragraph dialogue" data-source-key="121:91">“饿成这样？才刚出锅，要先吹一吹再吃啊。”</p><p class="story-paragraph" data-source-key="121:92">宋银硕看了我一眼，我怕被他发现，不自然地低下头，想让发丝挡住自己的表情。</p><p class="story-paragraph" data-source-key="121:93">但这位令人讨厌的哥哥从来不肯给我如愿逃避的机会。</p><p class="story-paragraph" data-source-key="121:94">他的手指轻轻撩起我脸侧的障碍物，替我别到耳后。</p><p class="story-paragraph dialogue" data-source-key="121:95">“头发都快掉进碗里了。”</p><p class="story-paragraph" data-source-key="121:96">两滴眼泪渗进炒饭中。</p><p class="story-paragraph" data-source-key="121:97">宋银硕冰冻住，我感受到他的不知所措，咽下嘴里的食物后，把盘子放在茶几上，自己去抽了两张纸巾。</p><p class="story-paragraph dialogue" data-source-key="121:98">“原来我做的饭魅力这么大，把你好吃哭了吗？”</p><p class="story-paragraph" data-source-key="121:99">他故意这么说，想要逗我笑。但他越是这样，我越控制不住自己。咬着嘴唇。我不想哭的。</p><p class="story-paragraph dialogue" data-source-key="121:100">“鼻子好痛。”</p><p class="story-paragraph" data-source-key="121:101">这并不是我委屈的真正原因，我只是需要一个借口。这点疼不算什么，可我就是想任性一次，因为从小到大从来都没有人准许我任性，准许我跌倒后可以去求安慰，我的伤口暴露在空气中，没有人会问我怎么了。宋银硕的出现就像我的救命稻草，一举一动都在诱导我，暗示我，我可以抓住他，依赖他，向他撒娇，我可以再无理取闹一些，我不用那么小心翼翼，因为他是我的哥哥。可由于另外两位亲人从来都没做到亲人的义务，反而把我踢得远远的，所以我不习惯他的好，我害怕了，踟蹰了，怕自己习惯后会变得娇气。由俭入奢易，由奢入俭难。我只能把他当做陌生人，而他从来都不强迫我接受他，他只是站在让我舒适的距离，像月亮对地球一样。</p><p class="story-paragraph dialogue" data-source-key="121:102">“怎么这么爱哭。”</p><p class="story-paragraph" data-source-key="121:103">他犹豫了一下，还是用拇指轻轻揩掉了我没擦干的泪水。</p><p class="story-paragraph dialogue" data-source-key="121:104">“那你怎么这么不爱哭。”</p><p class="story-paragraph dialogue" data-source-key="121:105">“因为没有什么需要我哭的事情啊。”</p><p class="story-paragraph" data-source-key="121:106">宋银硕的语气有些无奈，不知什么时候拿来了冰袋，轻轻敷在我的鼻梁上，力度轻柔，仿佛酣睡时的呼吸。</p><p class="story-paragraph dialogue" data-source-key="121:107">“你不吃饭了吗。”</p><p class="story-paragraph" data-source-key="121:108">我还带着哭腔，宋银硕面不改色地看着我的伤处：“等下一起吃。”</p><p class="story-paragraph dialogue" data-source-key="121:109">“我好了，好很多了。我们吃饭吧。”</p><p class="story-paragraph" data-source-key="121:110">听到我这么说，宋银硕有些狐疑，但还是坐回位置。</p><p class="story-paragraph" data-source-key="121:111">我们沉默地吃了几分钟，我又突然打破寂静：“其实我原来也不爱哭的…”</p><p class="story-paragraph" data-source-key="121:112">虽然像是狡辩，但确实是这样。来到这里，认识了宋银硕和郑成灿后，我把小时候强忍着不敢哭的泪水都流出来了。</p><p class="story-paragraph" data-source-key="121:113">为什么在宋银硕的身边，我总是很想哭呢？</p><p class="story-paragraph dialogue" data-source-key="121:114">“可能我的世界里有很多值得我哭的事情吧。”</p><p class="story-paragraph" data-source-key="121:115">我扁着嘴，撒气一样地用勺子扒拉着盘子里的饭粒。不知道是在气自己没出息，泪水太多，还是气自己命不好。</p><p class="story-paragraph" data-source-key="121:116">又过了一会儿，才听到宋银硕的回答。</p><p class="story-paragraph" data-source-key="121:117">他的声音一直都是平缓的，像晒过后铺平的被子，温暖、缠眷、柔软，沉甸甸地包裹住我的情绪。最有效的抚慰剂。</p><p class="story-paragraph dialogue" data-source-key="121:118">“想哭的时候当然要哭，没人可以强迫你不许落泪。”</p><p class="story-paragraph" data-source-key="121:119">我想到小时候受到磕碰时放声大哭的自己，所有人都觉得那是魔音绕梁。首先给我的不是安慰，而是捂住耳朵嫌恶地叫我：</p><p class="story-paragraph" data-source-key="121:120">不要哭，把哭声憋回去。</p><p class="story-paragraph" data-source-key="121:121">为了不打扰别人，所以不可以放声大哭，只能啜泣，就算啜泣也很碍眼，必须躲起来才行。</p><p class="story-paragraph" data-source-key="121:122">原来哭泣不是错误，而是我的权利吗？</p></div>
