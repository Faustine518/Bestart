      <p class="masthead-english">Four Springs</p>
      <p class="masthead-meta">凑崎纱夏 · 名井南</p>

  <div hidden id="chapter-templates"><template id="chapter-foreword">
      <article class="chapter" data-chapter="chapter-foreword">
        <header class="chapter-header"><span class="chapter-number">序</span><h2>Foreword</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="4">这篇文发出来的时候冬天都还没到，现在已经是春天了。可能上一个冬天又被遗忘，但没有关系，新的春天已经到来，事与愿违是常事，但只要能敞开心扉留下那些有始有终的时光又有什么不好呢。</p></div>
      </article>
    </template><template id="chapter-01">
      <article class="chapter" data-chapter="chapter-01">
        <header class="chapter-header"><span class="chapter-number">01</span><h2>二十一天</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="12">因为春天到了吗？我好像喜欢上了一个人。</p><p class="story-paragraph" data-source-index="14">毫无关联的两件事被凑崎纱夏强加上了因果关系，名井南那天出现在眼前的模样再次浮现。</p><p class="story-paragraph dialogue" data-source-index="16">“初次见面，多多指教，我是名井南。”</p><p class="story-paragraph" data-source-index="18">春天的阳光不像其他季节那样刺眼，透过医院花园遍布的植被，温温柔柔地打在名井南的身上，笑的时候嘴角的那颗痣让凑崎纱夏愣了片刻，毫无理由的触动在提醒她此刻内心似乎正在上演一见钟情的戏码，一定是最近沉迷在了魔幻的青春偶像剧里，所以在对方露出疑惑的神情的时候才反应过来。</p><p class="story-paragraph dialogue" data-source-index="20">【啊，你好，我是明石医生的病人凑崎纱夏】</p><p class="story-paragraph" data-source-index="22">为什么对第一次见面的人这样在意呢？凑崎纱夏从认识到后来不得不面对自己的感情这期间就一直在反复思考，名井南作为陌生人出现的那一刻就毫无理由地，霸道地，冲进了自己的世界。</p><p class="story-paragraph" data-source-index="24">在以后的每一个春天，凑崎纱夏都在反复纠结自己的奇怪心情源于何处。</p><p class="story-paragraph" data-source-index="26">凑崎纱夏是这所医院的常客，但这并不代表她的身体不好，恰恰相反，她是个不管身体状况还是心理方面都表现的十分良好的人，即使作为被动的病人那一方反而经常说着宽慰医生的话。</p><p class="story-paragraph dialogue" data-source-index="28">【明石医生不要太辛苦了。】</p><p class="story-paragraph dialogue" data-source-index="29">【能有这么漂亮的护士小姐替我检查身体实在太幸运啦。】</p><p class="story-paragraph" data-source-index="31">甜言蜜语这样的小把戏对凑崎纱夏来说是简单的小把戏，但是能将每一句浮夸的夸赞说的让人露出不好意思的笑脸似乎也只有凑崎纱夏可以做到。</p><p class="story-paragraph" data-source-index="33">凑崎纱夏人如其名，像春天向夏天过渡的太阳，散发出来的阳光温暖而又恰到好处，就像现在洒在名井南身上的这一束。</p><p class="story-paragraph dialogue" data-source-index="35">【名井小姐是医院新来的医生吗？我以前没见过呢。啊，我的确是医院的常客，身体？身体没有不好，只是之前出过车祸，所以需要定期来检查！】</p><p class="story-paragraph" data-source-index="37">名井南是个言简意赅的人，即使如此，回过神的凑崎纱夏也能靠着仿佛是天赋一样的口才和初次见面的陌生人侃侃而谈，更何况这个陌生人虽然惜字如金，但是说的每句话都可以恰到好处的将话题继续。</p><p class="story-paragraph dialogue" data-source-index="39">【我是新来的医生】 【身体没有大碍吧】 【这种情况的确需要定期复查，我是明石老师以前带过的学生，你有什么问题也可以问我】 【直接加我的LINE吧】</p><p class="story-paragraph" data-source-index="41">凑崎纱夏正纠结着要怎么交换联系方式，没想到橄榄枝由对方主动抛出，看起来天生拥有不可侵犯的边界感的人竟然这样体贴，她把名井南的这份体贴归咎于医生对病人的负责。</p><p class="story-paragraph" data-source-index="43">凑崎纱夏并非对这位新来的年轻医生一无所知，她上次来这里会诊就知道院长的女儿即将到来，虽然只是以实习生的身份进来，但这样的背景足以引起科室的议论，不过可能忌讳院长女儿这一层关系，旁人并没有特别多嘴，只有前不久新来的护士跟凑崎纱夏简单八卦了几句。无非就是这位含着金钥匙出生的天之骄子有多么厉害，以前叛逆的时候学了好久的芭蕾，说放弃就放弃，转战医科，看起来似乎是为了追随父亲的脚步。</p><p class="story-paragraph" data-source-index="45">凑崎纱夏有分寸地迎合着护士的聊天话题，她那时候在意的并不是这位名井医生有多么出类拔萃，只是凭着良好的交往礼节，她不会让独自侃侃而谈的护士感觉尴尬。等到她和名井南的故事已经发展到不知道何处的时候凑崎纱夏才又像较真的孩子那样反复回忆护士说的话，在心里想我喜欢的人真是了不起，我应该比名井南要更早开始喜欢。</p><p class="story-paragraph" data-source-index="47">世界是由何其伟大的公式组成的呢？凑崎纱夏在中学的时候就深谙数学的伟大，尽管试卷上的分数只有25分。人类千年的历史和经验造就了现在的现代世界，未来想必也不会逃脱自然规律这样的公式。</p><p class="story-paragraph" data-source-index="49">凑崎纱夏认为一切都是有套路的，所谓的习惯，经验和秘诀无非是不同的名词套着【套路】的外壳而已，比如将数学公式记个滚瓜烂熟就可以在考试中取得不错的成绩，面试时严格遵循【首先其次最后】的步骤说些夸夸奇谈的话也可以给对方留下不错的印象，在医院更是严格遵循套路，门诊，机器检查，最后根据纸条上各个数值进一步确定身体情况，甚至连抑郁症这样看起来渗透人的内心，不可捉摸的东西，社会上也有不少为它出版的著作，里面尽是分析和解决病情的套路。</p><p class="story-paragraph" data-source-index="51">21天可以养成一个习惯也是一个套路，凑崎纱夏坚定自己的想法，21天可以改变存在很久的行为，那么21天可不可以让名井南习惯自己？那时候的她以为自己只是因为初遇就产生的好奇心想要和名井南做朋友，想要看见名井南，想要偶遇名井南，想要和她说说话，仅此而已。</p><p class="story-paragraph" data-source-index="53">凑崎纱夏在医院附近的幼稚园上班，下午很早就放学的时间让她即使在校车上绕着城市巴士站走一圈，回到原点也可以看见还在加班的名井南下楼去便利店买咖啡。</p><p class="story-paragraph" data-source-index="55">幼稚园除了周三以以外每天下午两点以后就放学了，校车绕着城市在兜兜转转的路线一路前行，凑崎纱夏在心里估摸着马上还要磨蹭多久可以遇上门诊时间结束后下楼的名井南。这样人为的“偶遇”背后需要付出的精力是不容小觑的，凑崎纱夏要比她表面所呈现的样子更注重细节，怎样表现的像是那家便利店的常客，和打临时工的高中生攀谈会更有说服力。</p><p class="story-paragraph dialogue" data-source-index="57">【小津你刚上高一就开始来兼职了吗？真了不起！】</p><p class="story-paragraph" data-source-index="59">在这样的对话里顺着小津的视线去看进来的名井南，顺势而为地打招呼，一起出便利店，走到必须再见的分岔路口。同路的时间不过几分钟而已，在这几分钟里说一些没营养的话题：便利店新进的饮料口味不错，路边的花似乎比去年还要鲜艳。凑崎纱夏想这样简短的对话对名井南来说是没有什么负担的，因为第二天的“偶遇”，名井南会购买她推荐的酸奶，新加的联系方式，头像背景居然是她随口夸过漂亮的花。</p><p class="story-paragraph" data-source-index="61">尽管这样的“偶遇”在旁人看来费力且意义不大，凑崎纱夏依然乐在其中，她是个多情的人，对初次见面的名井南产生了好奇心，而每天几分钟的见面可以让她再多了解一些名井南。名井南的确像护士嘴里说的那样敬业负责，哪怕自己只是一个科室的病人遇见了也会关心几句，同时又带着点小女孩涉世未深的懵懂，在医院以外的便利店，在那条只有十几米的小路，她会笑着说【明天见】</p><p class="story-paragraph" data-source-index="63">凑崎纱夏想名井南可能不知道这句简单礼貌的告别想要实现，自己是需要花费一点功夫的。</p><p class="story-paragraph" data-source-index="65">可是凑崎纱夏喜欢这样，所以她不嫌麻烦，坚持了21天，在第21天的那个星期三和名井南分离以后，她产生了第二个虚无缥缈的念头。这个念头比电视剧才会出现的一见钟情的戏码还要荒诞，凑崎纱夏觉得宇宙都在帮自己偶遇名井南。</p><p class="story-paragraph" data-source-index="67">周三幼稚园放学的时间是11.40，再回到医院附近的便利店的时候已经快一点了，名井南居然还在那里，看起来是刚吃完饭不久昏昏沉沉地在打盹。用手撑着脑袋的女孩身上还穿着没来得及脱下的白色大褂，脸上是和身份不符的稚气，比自己小了几个月而已，无意识的撅着嘴巴看起来和收银台旁边的小津差不多大。</p><p class="story-paragraph" data-source-index="69">便利店这样的环境是无法好好休息的，名井南眨巴几下眼睛为了让自己清醒一点，主动向凑崎纱夏打招呼，嗓音带着春末的湿润：【纱夏，中午好】。</p><p class="story-paragraph" data-source-index="71">凑崎纱夏为这样的称呼沾沾自喜起来，对谁都彬彬有礼的名井南愿意称呼自己的名字是不是代表她们已经是朋友了。</p><p class="story-paragraph" data-source-index="73">名井南不明白凑崎纱夏明明坐下来就可以和自己平视了，为什么她要多此一举地用手撑着膝盖弯着身子看自己，这样的姿势让两个人的距离已经越过了安全距离，对方眼睛里的笑意比脸上还要多几分，和自己懒洋洋的声音不一样，甜腻的声调像在对自己撒娇：【小南医生，中午好】</p><p class="story-paragraph" data-source-index="75">之后名井南回到科室，看着墙上的镜子，里面是自己面无表情却带着红晕的脸，她欲盖弥彰一样和别人搭话：【夏天要来了吗？好热】，旁边的护士愣住了，不知道怎样回应这个奇怪的问题。</p><p class="story-paragraph dialogue" data-source-index="77">【小南医生】，既亲昵又客气的称呼，矛盾的东西由凑崎纱夏喊出来居然也不会突兀。</p><p class="story-paragraph" data-source-index="79">凑崎纱夏最大限度的在人际交往的原则上跳跃，巧妙地消除和名井南的距离感。</p><p class="story-paragraph" data-source-index="81">那时候凑崎纱夏因为突如其来的心动而期待着未来，因为潜意识经验自然而然产生的【21天攻略】沾沾自喜的时候忽略了一件事情，狡猾而又多情的人先动了心无异于猎人躺在陷阱里守株待兔。</p><p class="story-paragraph" data-source-index="84">凑崎纱夏在完成第一个21天攻略后有了更贪婪的心思，21天后的习惯需要更多个日日夜夜来巩固，这之后的名井南会不会在某一天和自己有一点点更特别的关系？她承认自己对名井南的心思已经不仅仅可以用好奇心来解释了，现实逼着她面对。</p><p class="story-paragraph" data-source-index="86">在某个夜晚突然醒来后，她的第一反应不是刚才有没有做梦，也没有无法回忆梦境的疑问，而是在想名井南。</p><p class="story-paragraph" data-source-index="88">凑崎纱夏没想到自己会对初识不久的人动这样的心思，失眠的混乱需要名井南的一句晚安，她掏出手机给名井南几天前的动态点了赞，动态的内容只有那朵春天的花。这样的举动既不会打扰名井南，也可以让现在的自己稍稍安心。</p><p class="story-paragraph" data-source-index="90">短暂的消息铃声打破了夜晚的沉默，可能是太安静了，凑崎纱夏没想到自己的心跳声居然有这么清晰，她点开备注是【小南医生】的对话框：姐姐，该睡觉了，晚安。</p><p class="story-paragraph" data-source-index="92">从来不喊自己姐姐的名井南为了哄自己睡觉喊了姐姐。</p><p class="story-paragraph" data-source-index="94">凑崎纱夏在剧烈的心跳中反应过来，身为医生的名井南深夜还在工作，但是这样似乎也解释不了为什么刚一点赞就得到了对方的回复，凑崎纱夏没有自以为是地认为名井南在一直关注自己的动态，她将功劳依旧归咎于宇宙，可能某一位神明听见了自己的祈愿，所以恰好在那一个时机让忙碌的名井南看了手机。</p><p class="story-paragraph" data-source-index="96">不用这样的理由凑崎纱夏会失眠一整夜的，虽然第二天闹钟响起来的时候她还是昏昏沉沉，在电车上盯着那条消息发呆，再往上翻就没有别的内容了，只有两条名井南发的消息。</p><p class="story-paragraph dialogue" data-source-index="98">【不要老是喝饮料，多喝水】凑崎纱夏回忆起初次见面名井南手中的可乐，又想起她每次在便利店饮料冰柜面前驻足纠结很久，对病人严格要求的小南医生私下是个爱喝碳酸饮料的小孩。</p><p class="story-paragraph dialogue" data-source-index="100">【下次来体检找我吧，明石医生那两天没空】凑崎纱夏第无数次感谢上帝，给了自己这么多好运气，在每一次偶遇，在夜里的失眠，在下一次的体检。</p><p class="story-paragraph" data-source-index="102">凑崎纱夏想给名井南留下乖乖听话的好印象，夜里没有回复，在一大早才回复了两个可爱的表情。对方应该才来得及看手机，或许小南医生对早起上班也不满，回复的消息后面跟着系统自带的【愤怒】的表情。凑崎纱夏透过常见的表情好像看见了名井南撅着嘴巴的样子，尽管这20来天的见面从来没有看见过，可能是自己的想象力太丰富，脑海里浮现出的表情居然一直到进入幼稚园才消散，然后在自己发呆的片刻又出现。</p><p class="story-paragraph" data-source-index="104">好可爱。</p><p class="story-paragraph" data-source-index="106">凑崎纱夏的脸红了，对着关系绝对不能用熟悉形容的人产生这样的念头，她也有点不好意思。虽然和名井南的交流只有自己每天绞尽脑汁的偶遇，手机上的联系也仅限于医生对病人的关心，但就是那两条短短的留言和第一次听见的晚安，给了凑崎纱夏无限的勇气，面前一片黑好像也没关系，在黑暗里准确无误地找到自己想要的东西就像找到了微小却又明显的光，名井南就是那束光。</p><p class="story-paragraph" data-source-index="108">下次体检的时间如约而至，这中间又经历了一个“21天”，凑崎纱夏在这期间依旧战战兢兢实施着【21天攻略】这样的事情，她想自己这辈子的好运气似乎都用在了邂逅名井南上，因为这中间有那么一两天自己因为突如其来，意料之外的堵车晚去了一会儿也可以在便利店看见熟悉的身影。</p><p class="story-paragraph" data-source-index="110">看起来完全可以独当一面的名井医生在自己面前露出了少女才会有的憨厚神情，像在说漫才一样诉说医院的事物多么繁忙，喘口气下来买杯咖啡有多么不容易，尽管她手上拿着的是冰可乐。凑崎纱夏在偷偷庆幸，这样子的名井南好像只有自己看过。</p><p class="story-paragraph" data-source-index="112">以及趁小津去检查货物的时候突然凑过来在耳边窃窃私语，过近的距离和温热的呼吸让凑崎纱夏要很努力才不会让自己的慌乱暴露出来，好在这个突如其来的靠近在说完话后就回到原位。</p><p class="story-paragraph dialogue" data-source-index="114">【便利店的饭好难吃哦，我上幼稚园的时候妈妈会给我做漂亮又好吃的便当，这个完全不能比。】</p><p class="story-paragraph" data-source-index="116">你现在已经是大人了啊，怎么还和幼稚园的自己比较。</p><p class="story-paragraph dialogue" data-source-index="118">【不过这家便利店会送我免费的番茄酱，所以我经常来吃，加上纱夏也经常来，嘿嘿。】</p><p class="story-paragraph" data-source-index="120">你是大人了啊，怎么为了甜甜的番茄酱这种小事来决定吃饭这么重要的事情，而且为什么突然提我啊，不要再在这么近的距离冲我笑了。</p><p class="story-paragraph" data-source-index="122">凑崎纱夏晕晕乎乎的不敢抬头看名井南，直到听见小津惊呼：【姐姐，你怎么流鼻血了！】</p><p class="story-paragraph" data-source-index="124">凑崎纱夏摸了摸自己的鼻子，一片干燥，困惑着抬头才发现小津嘴里的[姐姐]喊的是名井南，在片刻的慌乱之后立马镇定下来，小津的大惊小怪和名井南的不以为然让凑崎纱夏自觉担负起了照顾名井南的责任。</p><p class="story-paragraph" data-source-index="126">名井南为什么突然留鼻血，可能因为春季空气里的水分子还不那么充分，又或者名井南想到了什么让人激动的事情，又或者名井南有特别开心就会流鼻血的特异功能，奇怪的念头让凑崎纱夏想笑，第一次经历这种事情怎么会冒出这样的想法。</p><p class="story-paragraph" data-source-index="128">等小津找到棉签和卫生纸过来的时候，凑崎纱夏已经用指腹擦掉了名井南的鼻血，她只接过棉签沾了沾一次性水杯里的水反复在名井南鼻子那里点了几次，另外一只手扶着名井南的脑袋不让她乱动。</p><p class="story-paragraph" data-source-index="130">身为医生的名井南怎么会不知道流鼻血了不能仰头，用棉签擦鼻子这样的小事她自己就可以做，凑崎纱夏事后回忆这件事有点懊悔，自己这样会不会有点过界，可是名井南那时候老老实实地接受了自己的照顾看起来并不反感。</p><p class="story-paragraph" data-source-index="132">慌乱的小插曲结束后名井南又要回医院了，她脸上露出的神情凑崎纱夏经常见到，幼稚园的早上刚入学的孩子不愿意离开自己的父母就会露出这样的表情，名井南和那些孩子不一样的是没有掉眼泪，没有尖叫，只是撅着嘴巴问自己：【纱夏，你明天还会来吗？】</p><p class="story-paragraph" data-source-index="134">名井南似乎察觉到是因为自己的话里还想见凑崎纱夏的意味太过明显才让对方沉默，琢磨了一下让自己的意思更清晰：【谢谢今天的事情，我请你吃饭】</p><p class="story-paragraph" data-source-index="136">晚餐的时间，凑崎纱夏鬼使神差地在订单里加了番茄酱，红色的酱汁堆在盘子上，这个颜色让她想到给白天给名井南擦鼻血的情况，自己的手指碰到了名井南的嘴唇。凑崎纱夏低头看着自己的指尖，上面沾染的名井南的温度早已荡然无存，她用舌尖添了一下手指，刚才拆酱料包装的时候，沾到了一点。</p><p class="story-paragraph" data-source-index="138">其实凑崎纱夏不大喜欢番茄酱的味道，昨天晚餐因为临时添加了番茄酱的缘故只动了一点，好在名井南端过来的午饭只有她自己的那一份上面有番茄酱，自己的这一份午餐旁边还有削好的芒果。</p><p class="story-paragraph dialogue" data-source-index="140">【我拜托小津削的，因为我工作的关系所以只能请纱夏吃便当了，用水果补偿吧。等我放假的时候再请纱夏吃一顿大餐！】</p><p class="story-paragraph" data-source-index="142">凑崎纱夏害怕芒果的汁水蹭到脸上，小口小口咀嚼着，好一会儿才回应名井南：【不用这么客气啦，我体检的时候还要麻烦你，而且芒果就足够了，正好我很喜欢吃芒果】</p><p class="story-paragraph" data-source-index="144">名井南没有因为有点久的回应不耐烦，笑着开口：【是吗？正好今天水果店的芒果新鲜又便宜，所以我就买了】</p><p class="story-paragraph" data-source-index="146">小津忙着加热关东煮里的食材忍不住诽谤：哪有那么多正好，芒果的价格跟自己的时薪差不多贵了，有钱大小姐家果然对金钱不敏感。</p><p class="story-paragraph" data-source-index="148">体检的日子如约而至，常规的心电图检查是必要的，医院很大，每个科室在弯弯绕绕的角落，凑崎纱夏想告诉名井南自己经常来，不用跟着自己，不过明石医生不在，自己也算名井南的病人，想到这里轻轻喊了一声：【小南医生】</p><p class="story-paragraph" data-source-index="150">只单纯地回应了一句【嗯】，名井南的沉默看起来好像是习惯了凑崎纱夏莫名其妙的呼唤，凑崎纱夏又喊了一声，依旧没有下文，名井南一边低头看着手上的检查单子一边陪着凑崎纱夏玩着[称呼名字]的无聊游戏：【嗯】</p><p class="story-paragraph" data-source-index="152">心电图的数值不太正常，名井南皱着眉头提醒凑崎纱夏马上重新做一次，【心跳为什么这么快呢？】</p><p class="story-paragraph" data-source-index="154">凑崎纱夏结结巴巴地回答：【刚才跑着过来的，歇一下再做应该就没事了。】电脑精确无误的数值提醒着自己该去面对一个事实了，即使名井南没有追问下去，凑崎纱夏也知道事情的正确答案并不是刚才的回答，真相是躺在那里的时候，自己满脑子都是名井南。</p><p class="story-paragraph" data-source-index="156">平时想到名井南的时候心跳有这么快吗？从一开始的好奇想要进一步了解，第一次见面还想要有第二次，想要和名井南聊天，想看着她对自己撒娇，手机界面上显示【小南医生】的时候会激动，每次见面时的心跳加速和之后很久消散的余温，反复想起的那个人，这种体验让凑崎纱夏心动而又混乱，记忆在明确一个念头：我好像喜欢名井南，是因为春天吗？</p><p class="story-paragraph" data-source-index="158">医院本身就有的沉闷气氛以及在里面想不出来答案的纠结让凑崎纱夏有些烦躁，出来后看见名井南穿着白大褂，淡妆都没化，嘴唇不知道是因为天气原因还是反复舔过，起了皮。凑崎纱夏心一软，名井南为了及时陪伴自己所以一大早就匆忙过来了吗？这样的她看起来跟小孩子一样，却老老实实在外面一直等着自己。</p><p class="story-paragraph" data-source-index="160">和名井南一样站在走廊等候的无非是病人亲近的家属，等待自己的名井南是我的家属吗？这样的念头没来由生起，凑崎纱夏终于笑了，对上身边人的视线，里面没有疑惑，倒是跟自己一样的放松。</p><p class="story-paragraph" data-source-index="162">命运，缘分，这样虚无缥缈的词好像只有十六岁的少年和四十岁也无所事事的上班族会相信，凑崎纱夏尊重世界的规律，坚定凡事都有自己的轨道，直到遇见名井南，她在心里感谢自己知道的任何一位神明，包括上帝，怎么会有人和自己这么合拍，相遇的每一步路都太顺风顺水，幸运的让自己甚至以为在做梦，可如果是名井南的话，该怎么做这场美梦才能永远不会醒来。</p><p class="story-paragraph" data-source-index="164">凑崎纱夏错开名井南的视线，又一次在心里感谢上帝，自作多情地想，我笑的话名井南就会笑吗？</p><p class="story-paragraph" data-source-index="166">检查的项目在不同的楼层，名井南说自己今天不太忙，确认凑崎纱夏今天是休息日后询问她：【不忙的话我们走路过去吧，医院的电梯不管什么时间都挤满了人。】</p><p class="story-paragraph" data-source-index="168">凑崎纱夏和名井南慢悠悠步行下到一楼，穿过医院的花园。</p><p class="story-paragraph" data-source-index="170">即使身边到处都是形色匆忙的人，空气中混合着不绝于耳的人声，有抱怨，有叹息，以及有惊无险后的庆幸，医院的环境用嘈杂来形容也不为过，凑崎纱夏的情况有些特殊，她不用担心自己的身体，不过每次来医院，这里太多的哀愁被她目睹后也会感到伤心，除了这一次名井南在身边，实在奇怪，明明认识没多久，可是却实实在在感觉安心。</p><p class="story-paragraph" data-source-index="172">再夸张一点，和名井南在医院这样特殊的地方步行，凑崎纱夏竟然觉得这种感觉不亚于一场浪漫的约会。</p><p class="story-paragraph" data-source-index="174">来往的穿着白大褂的人，无论什么职位看见名井南都是客客气气地打招呼，在听见凑崎纱夏喊名井南的称呼后露出不知是何意味的神情。名井南礼貌回应每一个人，同时也回应着凑崎纱夏时不时就喊一下自己的幼稚行为。</p><p class="story-paragraph" data-source-index="176">凑崎纱夏是在乎别人的眼神的，但是她发现自己更喜欢别人知道自己和名井南亲近，年长几个月的稳重只有面对名井南一个人的时候才会出现，和名井南共同出现在公众场合的时候，自己像个有了好东西就迫不及待给别人炫耀的小孩，比如刚才打招呼的人，比如便利店的小津。</p><p class="story-paragraph" data-source-index="178">有些检查的结果需要多等一天，凑崎纱夏递给名井南一杯柚子茶，坐在便利店里闲聊，体检的项目已经结束了，但是谁也没有开口说出分别的话。</p><p class="story-paragraph dialogue" data-source-index="180">【其实我身体很不错，只是之前出过一次车祸，所以不得不隔一段时间就要来一次医院，明石医生是很负责的人，他也参与了我的那次手术。说真的，我醒来的时候以为自己死掉了，浑身都没有力气，胳膊里还插着很长的针，呼吸面罩这种东西戴久了也很闷，但是可能真的大难不死必有后福吧，我在那之后并没有出现什么别的后遗症，唯一有点特殊的情况】</p><p class="story-paragraph" data-source-index="182">凑崎纱夏看着小津因为自己的话干活的动作慢了下来，自己出车祸的事情很少的人知道，倒也不是为了避讳什么，单纯不愿意看见说出来后对方露出惊讶或者沉默的表情而已，可是看着名井南近乎天真的表情，仿佛自己说出什么恐怖的事情她都会像听童话故事那样去接受。</p><p class="story-paragraph" data-source-index="184">至于小津这家伙，完全就是想听八卦吧。</p><p class="story-paragraph dialogue" data-source-index="186">【我失忆了，听起来像是小说一样吧，但是是真的哦，医生说我的大脑也有受损，可是我并没变成白痴，神经系统也在好好支配我的器官，不仅如此，爸爸妈妈，朋友，楼下的小猫我都记得一清二楚，甚至我感觉自己更聪明了，童年模糊的记忆努力一下我也可以再次回忆，但是我的朋友和明石医生却一直强调我忘了很重要的事情，问他们是什么却又不说，再重要的回忆没有影响到现在的生活还需要回忆吗？】</p><p class="story-paragraph" data-source-index="188">凑崎纱夏停住了，像是为了说服自己的确没有必要回忆没有线索的过去，沉默了一会儿才开口，语气比刚才缓慢的多，【如果我忘记了很重要的人，那个人也没有来找我，说明她放弃我了吧。】</p><p class="story-paragraph" data-source-index="190">小津看着名井南背后的手紧了紧，用比平常还要温柔的声音开口：【不需要回忆了，纱夏记得爱你的人就够了。】</p><p class="story-paragraph" data-source-index="192">好奇怪的回答，那凑崎小姐爱的人不需要记得吗？和大人没差几岁的高中生不在意大人间的弯弯绕绕，不过片刻犹豫，小津就去忙自己的事了。</p><p class="story-paragraph" data-source-index="194">凑崎纱夏听过很多次别人对自己的评价是像只狐狸，善于勾引，这并不是贬低自己，是稍微亲近一点的同龄人对自己说的玩笑话，但是也有点事实的成分在。</p><p class="story-paragraph" data-source-index="196">漂亮的脸蛋和开朗的性格搭配在一起吸引了很多人的眼光，凑崎纱夏发誓自己绝对不是故意的，不过是笑着喊对方姐姐，或者用无比真挚的眼神望着对方，对方就露出了害羞的神色。自己以前从来不觉得那些举动有什么特殊意味，可是看见了名井南，凑崎纱夏荒诞地将[勾引]一词和她挂上钩，哪怕对方脸上露出的是一种无辜而又单纯的表情。</p><p class="story-paragraph" data-source-index="198">名井南的一切都在蛊惑凑崎纱夏，外人面前她端正的不可亵渎却愿意回应自己的小把戏，自己面前她又总是温柔和乖巧的，露出像孩子一样的天真神色喊自己姐姐。一定是因为这样，所以自己才愿意讲出自己的秘密，也一定是因为这样在分离的时候冲动地揪住对方的衣角。</p><p class="story-paragraph" data-source-index="200">名井南看着故意低自己一点的凑崎纱夏，在只有月光和路灯的光芒下，她看起来像是一条舍不得主人的流浪狗，亮晶晶的眼睛似乎随时都会流出珍贵的眼泪。</p><p class="story-paragraph" data-source-index="202">名井南看着难得露出可怜神情的凑崎纱夏问自己：【明天可以再见吗】</p><p class="story-paragraph" data-source-index="204">不顾一切的举动提出来的问题看起来似乎有些无关紧要，凑崎纱夏太谨慎了，被爱意包裹的人更害怕拒绝，勇敢的人当然也会有犹豫的时刻，可她实在无法压住那荒唐的，愈发激烈的心跳。</p><p class="story-paragraph" data-source-index="206">夏天要来了，凑崎纱夏把自己升起来的体温归咎于自然温度，夜晚的平静让等待的时间更加缓慢，也许只有五分钟，或者三分钟，甚至更短，在心跳声中名井南开了口：</p><p class="story-paragraph dialogue" data-source-index="208">【当然可以，以后的很多个明天我们都可以见面，纱夏，我也很想你】</p><p class="story-paragraph" data-source-index="210">尽管我们每天都在见面，但我也总是在想你，在经过便利店的必经之路上的那条小路，在看见手机相册的那朵花的时候。</p><p class="story-paragraph" data-source-index="212">时间和空间的每一处重合点，我都在想你。</p></div>

      <article class="chapter" data-chapter="chapter-02">
        <header class="chapter-header"><span class="chapter-number">02</span><h2>昨日流水</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="218">凑崎纱夏收拾东西的间隙伸了个懒腰，开始漫无边际地思考，说是思考其实只是看着没有停下动作的名井南发呆而已。</p><p class="story-paragraph" data-source-index="220">暧昧的含糊不清的夜晚过去没多久，自己就和名井南在一起了，自然而然，水到渠成，凑崎纱夏坦然接受着命运的安排，甚至连清晰的告白都没有，以后争论谁先爱上谁这样的无聊问题估计永远找不到答案。</p><p class="story-paragraph" data-source-index="222">凑崎纱夏看起来面色平静，其实那一夜过去后内心的波澜涌动持续了很久，她没有正式谈过一场恋爱的记忆，可能车祸前自己有和男生暧昧过的桥段，但是在记忆里输入关键词也无法提取多少有效信息。所以从某种程度来说，名井南是自己的初恋。</p><p class="story-paragraph" data-source-index="224">凑崎纱夏有时候会幻想两个女人接吻是什么感觉，柔软，轻盈，但是只要一想到对方是名井南就立马害羞地不敢继续幻想。按理说，短暂浮现脑海中的画面是无人知晓的秘密，凑崎纱夏不必这样谨小慎微，可她看着名井南那双眼睛，里面只有自己的影子，强烈的情绪波动便神奇地平复下来。</p><p class="story-paragraph" data-source-index="226">名井南是让自己安心的存在，不仅仅限于对视这一个方面，其他地方表现得更为突出，凑崎纱夏有时候会怀疑名井南是不是有读心术，或者上辈子就和名井南相遇过，因为对方总是能恰如其分地去理解自己话里的意思并去实施。</p><p class="story-paragraph" data-source-index="228">故事并没有幻想的那样绚丽奇妙，只是名井南太体贴又太聪明了而已，但这样的相处模式偶尔也会让凑崎纱夏产生错觉：名井南好像和自己认识了很久。</p><p class="story-paragraph" data-source-index="230">比如今天才来自己家的名井南对房间布局似乎很熟悉，靠着自己模糊的手势和不是十分明确的话语也能在房间里轻车熟路地找到某些东西的存放位置。</p><p class="story-paragraph" data-source-index="232">像是游戏里拥有外挂的玩家。</p><p class="story-paragraph dialogue" data-source-index="234">【我爸爸以前的宿舍也在这里，他那时候为了更好工作，直接在这边租了好久的公寓，我经常过来看望他，纱夏家里的布局和爸爸过去的家差不多。】更神奇的地方来了，奇怪的念头才刚刚浮现在自己脑海，名井南似乎就猜测到了然后说出了一个十分合理的原因。这是游戏的策划者才能做到的事情呀。</p><p class="story-paragraph" data-source-index="236">凑崎纱夏摇摇脑袋强迫着自己打消奇怪的念头，蹲在地上摇头晃脑的样子与名井南老家里的小狗十分相似，还有点像苦恼的小朋友。名井南走过去，视线与她平齐，跪在地上用手撑着自己，吻住了凑崎纱夏。</p><p class="story-paragraph" data-source-index="238">好啦好啦，别再多想啦，再没有什么东西比此刻名井南的亲吻还要美好，先享受当下吧。</p><p class="story-paragraph" data-source-index="240">亲吻一直持续到凑崎纱夏稳不住身子，两个人倒在地上，凑崎纱夏看着倒在地上的名井南还在冲自己笑，看起来傻乎乎的，她凑过去亲吻的同时抱住了名井南，这次可不能再让自己心爱的小南医生摔倒了。</p><p class="story-paragraph" data-source-index="242">小插曲结束后，已经是黄昏了，凑崎纱夏看着空了不少的家才有了实感，自己真的要和名井南住一起了。不是那种为了拼房租的无措之举，也不是好友间约定着好玩一起待几天，而是以情侣的身份光明正大地踏入对方的空间，共享房子里的一切，包括对方。</p><p class="story-paragraph" data-source-index="244">答应同居那天的对话看起来是名井南一时冲动，但其实自己也没把控住不是吗？凑崎纱夏平时想到什么就做什么的大前提是在一切都在自己的掌控中进行的，每一个细节都要求完美的人按理说对同居这样的大事会顾虑很多的。</p><p class="story-paragraph dialogue" data-source-index="246">【要和我住一起吗？】</p><p class="story-paragraph" data-source-index="248">名井南的语气和神情都平平淡淡，凑崎纱夏愣了半天才明白对方询问的不是[午餐的饮料是搭配可乐还是牛奶]这种问题，而是[每天醒来都看见对方，晚上躺一张床上，吃穿住行都要一起]的同居邀约。</p><p class="story-paragraph" data-source-index="250">名井南没有怪凑崎纱夏长久的沉默，继续自顾自地开口：【因为我想和纱夏每天都在一起，我想多看看纱夏。】</p><p class="story-paragraph" data-source-index="252">没有拐拐绕绕，没有花言巧语，名井南就是这样，少言但是说出来的每一句话都真挚而让人心动。便利店玻璃的另一侧车水马龙，行人来来往往，凑崎纱夏即使不看也知道外面的世界有多么热闹，但她只是望着名井南的笑脸出神，遇见名井南后自己的心脏好像变得越来越柔软，轻易一句话就可以击溃。</p><p class="story-paragraph" data-source-index="254">玻璃的这一侧，凑崎纱夏俯过身子，第一次吻住了名井南。嘴唇在小津扭过身子前就离开了，亲吻就那么几秒，凑崎纱夏却想了特别特别多：我之前和别人接过吻吗？第一次亲吻名井南为什么会有种熟悉感。另外，名井南的嘴唇怎么比幼稚园午餐里的布丁还要软，只是吃布丁的时候自己可没有像现在这样没出息的的手软心慌。</p><p class="story-paragraph dialogue" data-source-index="256">【好。】</p><p class="story-paragraph" data-source-index="259">凑崎纱夏在尽力猜测平井桃看起来不太高兴的原因，是自己谈恋爱了没有第一时间告诉她吗？可这不能怪我，从遇见名井南到谈恋爱，再到同居生活，一切都像开了八倍速，我怎么能控制意识的自由下沉，心动就像风一样捉摸不透。</p><p class="story-paragraph" data-source-index="261">还是因为今天摆脱平井桃来帮忙搬家她觉得麻烦，但是平井桃是自己多年好友，她的性格并非是那种生闷气的类型，青春年少时两人也有过争执吵架，当天的晚上就会在黑暗的房间说着真心话，在拥抱里和好。</p><p class="story-paragraph" data-source-index="263">凑崎纱夏遇到了大难题，难得自己也会有绞尽脑汁也想不出答案的时刻，通过拼接细节得到答案是她的超能力。可是平井桃为什么要露出那样看起来有点伤心的表情呢？总不能是因为初次见面的名井南吧，逻辑和经验让凑崎纱夏固执地觉得平井桃在生气，而且因为自己。</p><p class="story-paragraph" data-source-index="265">凑崎纱夏不想让气氛尴尬，最好的朋友和喜欢的人第一次见面不应该是这个走向，她使出了小时候就使用过的，但是经久不衰的把戏，乖巧地喊平井桃，【姐姐，怎么了吗】</p><p class="story-paragraph" data-source-index="267">平井桃不高兴的时候凑崎纱夏才会撒娇地一遍遍喊着姐姐。</p><p class="story-paragraph" data-source-index="269">凑崎纱夏在没遇见名井南以前也是幸福的。独生子女的家庭结构让父母将所有爱都给了她，就连家族里面年长的奶奶也是最疼爱这个小孙女，更幸运的是，凑崎纱夏遇见了像家人一样的朋友，平井桃的性格极好，更难得的是愿意毫不吝啬对别人付出真心，尤其凑崎纱夏。</p><p class="story-paragraph" data-source-index="271">凑崎纱夏的人生绝对可以用顺风顺水形容，除了大学毕业后的那一场无端车祸，命运是否喜欢在完美的事物上留下瑕疵？平井桃对那场车祸的反应比凑崎纱夏本人还要大，作为当事人的凑崎纱夏反而不以为然，失去【对生活没有影响】的记忆有什么关系呢，流水因为河道的分歧即使东去只要还在前进就没关系。</p><p class="story-paragraph" data-source-index="273">凑崎纱夏用开玩笑的语气问平井桃是不是自己欠她钱了所以才那么难过，身为病人的她在醒过来后做的第一件事就是安抚身边人。</p><p class="story-paragraph" data-source-index="275">病房的气氛实在太怪了，凑崎纱夏和平井桃做了近十年的朋友，从来没有遇见这样的时刻，她越是安慰平井桃对方越是哭得厉害，那天平井桃的脸快要和今天的重合了。</p><p class="story-paragraph" data-source-index="277">那天的平井桃实在奇怪，她说：【纱夏，其实你很幸运。】</p><p class="story-paragraph" data-source-index="279">凑崎纱夏想要辩解，我知道自己很幸运，能在车祸里幸存，活着本身就是一种幸运了，更何况我并没有因为这场车祸失去什么。但凑崎纱夏什么也没说，平井桃脸上的无奈和很少看见的悲伤太过清晰，她无法再张口。</p><p class="story-paragraph" data-source-index="281">今天的平井桃也很奇怪，她说：【不要再做傻事了。】</p><p class="story-paragraph" data-source-index="283">即使没有称呼，凑崎纱夏也知道这话在给自己说，她想辩解，差点就当着名井南的面说出口：和名井南在一起怎么是傻事，我知道自己在做什么，知道和名井南在一起未来会吃很多苦，甚至有些麻烦是我无法想象的，但是我愿意抛之一切，只要可以和名井南在一起。</p><p class="story-paragraph" data-source-index="285">勇气这种东西在绝境才会生出，即使是死局，凑崎纱夏也有不顾一切要踏入的决绝。</p><p class="story-paragraph" data-source-index="287">凑崎纱夏偏头看着名井南，最后什么也没说。和名井南在一起的感觉美好的不真实，凑崎纱夏想不到合适的词来形容，非要说的话，就是自己已经适应了成熟的大人的身份，但是依然愿意相信名井南是童话故事里最美好的人物，最后的理智告诉自己，名井南有一天可能会离开自己或者因为自己伤心，她不想那样。</p><p class="story-paragraph" data-source-index="289">自己对名井南有无限欲望其实都可以用一句话概括：【名井南快乐就好，最好每一天都可以快乐。】</p><p class="story-paragraph" data-source-index="291">名井南因为自己快乐自己就留下来，因为自己伤心自己就离开。所以凑崎纱夏面对平井桃没有缘由的提醒，什么也没说，只是拉住了名井南的手。</p><p class="story-paragraph" data-source-index="293">夏天的白昼再漫长，黑夜也会来临，平井桃站在黄昏的地平线，脑海里突然蹦出大学的文学老师解释黄昏的意思，她一向对这种课程不感兴趣，只是那节课的时间点正好也是黄昏，这才打起精神听老师说：【黄昏有逢魔之时的意思哦，那种模糊的时刻对面的人也是模糊的，会让人分不清现实。】</p><p class="story-paragraph" data-source-index="295">眼睁睁看着朋友踏入模糊的现实，旁观者比本人还要难过。</p><p class="story-paragraph" data-source-index="297">名井南打破了僵局，跟着凑崎纱夏喊平井桃姐姐。平井桃接受了再明显不过的示好，她是善良又体面的人，因为太聪明和太敏感而生出的情绪蓬勃发出也能巧妙收回，迅速换个话题又开始和她们交谈，脸上的表情和语气都挂着轻松，刚才那句突兀的话好像不是自己说的一样。</p><p class="story-paragraph" data-source-index="299">凑崎纱夏迅速接着好友抛出来的话，她松了一口气，平井桃到底是她最好的朋友，无论是平井桃本身的品性还是二人多年的情谊兜着底，她都相信自己和名井南的恋情可以得到对方的祝福。</p><p class="story-paragraph" data-source-index="301">平井桃在前面开车，透过后视镜看见凑崎纱夏握着名井南的手，安抚一样捏了捏，微不足道的动作被自己看见了。车内的气氛还不错，凑崎纱夏不断抛出话题，无关紧要的，不痛不痒的，平井桃极其负责地接过她的每一个话头，一切都如同车外的风景一样美好平静。</p><p class="story-paragraph" data-source-index="303">只有平井桃自己知道，没握着方向盘的另外一只手藏在座位下偷偷发抖。</p><p class="story-paragraph" data-source-index="306">名井南的家在医院不远处，但是在和凑崎纱夏之前的家相反的方向。凑崎纱夏一进门就接受了自己是这个家的一份子的身份，没有一点刚到陌生环境的局促感，提着大包小包的东西兴奋地游荡在各个房间，审视了一圈后钻进名井南的怀里，故意低着身子亲名井南白白嫩嫩的脖子，看着那里变得微微红了笑着开口:【你真是个小孩子，一点都不会照顾自己。】</p><p class="story-paragraph" data-source-index="308">名井南无奈地亲亲凑崎纱夏的额头，说这话的恋人有没有发现冲着自己撒娇的样子更像个小朋友呢？</p><p class="story-paragraph dialogue" data-source-index="310">【名井南，以后每次见面都亲亲我可以吗？】</p><p class="story-paragraph" data-source-index="312">早上醒来算一次见面，下班回家算一次见面，从房间到客厅算一次，这样的算法名井南要在一天内亲凑崎纱夏好多次。</p><p class="story-paragraph" data-source-index="314">名井南亲了一下又一下对方的额头，在碰到凑崎纱夏的嘴角的时候含含糊糊地说【好】，同时不忘用一个别扭的姿势关上门，然后继续刚才未完待续的吻。</p><p class="story-paragraph" data-source-index="316">接吻结束的时候已经到了晚餐时间了，凑崎纱夏拍拍发烫的脸，表达不满名井南过渡放纵的方式是鼓起自己的脸，像只仓鼠一样蹭名井南。</p><p class="story-paragraph" data-source-index="318">凑崎纱夏起身打开名井南的冰箱，只有速食食品和各种酱料，刚才说名井南是个小孩子的话真是没有冤枉她。凑崎纱夏从名井南每天光顾便利店的时候就给她下了定义，厉害的小南医生私底下是个不会照顾自己的小朋友。那时候只想着在便利店偶遇名井南，现在在一起了，对待的方法则不可同昨日而言。凑崎纱夏在心里估算着明天去超市要买什么蔬菜水果，默默记下冰箱里番茄酱是什么品牌，纠结要不要给嗜甜的名井南买两罐不健康的碳酸饮料，牛奶是必备的，虽然名井南给小津抱怨过喝牛奶会胖。</p><p class="story-paragraph" data-source-index="320">那时候自己和名井南还不太熟，收银台的小津倒是先自己一步已经和名井南搭上了话，主动问名井南：【姐姐是因为跳舞要保持身材所以那时候不敢喝牛奶的吗？】，名井南咬着牛奶吸管，点点头就没了下文。</p><p class="story-paragraph" data-source-index="322">凑崎纱夏承认自己那时候看着名井南嘴角的牛奶痕迹忽略了对话的内容，虽然只是一瞬，但是对名井南升起的绮丽幻想还是让她羞红了脸，刻意压制下去后在某个深夜，半梦半醒的时候浮现出来，夹杂着比当时更为浓烈的欲望.</p><p class="story-paragraph" data-source-index="324">把这个当做秘密好了，凑崎纱夏是无法开口说自己曾经偷偷想着那样一个简单的画面在独处的时候自慰。</p><p class="story-paragraph" data-source-index="326">名井南以为凑崎纱夏口中的【今天的晚餐只能应付一下了】是吃家里储藏的各种口味的拉面，结果是在软件上下单了外卖，送过来的时候餐品还是热的，被凑崎纱夏摆盘后看起来有模有样的。名井南顺从地听从凑崎纱夏的指挥，这个家以往的安静在今天被打破，但是她乐意如此。</p><p class="story-paragraph" data-source-index="328">凑崎纱夏吃东西的样子很有食欲，总是大口大口咀嚼，和名井南一点点吃的样子大相径庭，但这样的画面看起来也是和谐的，第一顿在一起吃的正式的晚餐，看起来像上演了很多遍。凑崎纱夏将此归咎于和名井南相处就会产生的安定感以及她和自己真的很合拍，说是天生一对也不为过。</p><p class="story-paragraph" data-source-index="330">名井南看凑崎纱夏突然莫名其妙在偷笑，然后莫名其妙掏出手机对桌子上的残羹剩饭拍照。下一刻，自己手机的特别铃声响起，刷新出来的第一条动态就是凑崎纱夏的，图片显示的是桌子上的菜，看起来毫无食欲，文案只有一句简单的话：【和名井南一起吃饭】</p><p class="story-paragraph" data-source-index="332">小孩子拥有自己喜欢的东西就会忍不住炫耀，一朵小花，膨化食品，和喜欢的人一起吃饭，做了很久的大人的凑崎纱夏在今晚也回溯到孩童的过往。</p><p class="story-paragraph" data-source-index="334">客厅里只有名井南玩电动发出的声音，是90年代的日本很流行流行的游戏，但现在的日本无论是大人还是小孩都不怎么玩这个游戏了，《马里奥》作为日本经典游戏现在最常见的出现场合是在环路影城，以玩偶的形式出现。</p><p class="story-paragraph" data-source-index="336">还执意要做拯救公主的马里奥的只有名井南，哪怕马里奥在大多时候已经被人遗忘。</p><p class="story-paragraph" data-source-index="338">凑崎纱夏不知道名井南还喜欢打游戏，刻板印象让她以为名井南是那种深夜了还埋头在半个人高一样的医学书里阅读，里面可能都是自己看不懂的晦涩词语。其实凑崎纱夏的猜想没错，名井南的确每天要花费很多功夫去阅读，学习，早上用最新一期的医学论文和面包搭配，科室不忙的时候回研究所对着研究报告皱眉头，碎片化的时间也用来学习，别人口中了不起的名井南并非一夕而成，而是依靠日复一日地坚持这些无聊琐碎的习惯才能维持。</p><p class="story-paragraph" data-source-index="340">但是玩游戏这样和学习完全对立的事情名井南也在坚持每天做，大多数时间只玩这一款游戏，固执和不和谐的搭配，放在她身上倒也合理。</p><p class="story-paragraph" data-source-index="342">再亲密的情侣第一天同居也会尴尬的，但凑崎纱夏没有这样的感觉，她靠在名井南身上看着马里奥在水管上跳来跳去吃金币，在碰到某个机关出现星星的时候大惊小怪：【名井南！快吃星星！】</p><p class="story-paragraph" data-source-index="344">凑崎纱夏对矮乎乎的马里奥没什么兴趣，只是觉得星星从方块里掉下来有意思，那颗星星可以让马里奥变成无敌状态。名井南看着凑崎纱夏亮晶晶的眼睛说【好】，吻住了凑崎纱夏的眼睛，屏幕上马里奥原地不动，掉落的星星在随机概率的操控下自己走到了马里奥面前。</p><p class="story-paragraph" data-source-index="346">亲吻从眼睛流转到嘴唇，凑崎纱夏无力招架，背后是沙发中间垫着名井南的手，不老实的在背后画圈圈。亲吻结束了，凑崎纱夏的呼吸还没有平稳不下来，两个人的距离还是很近，呼吸都缠在一起，名井南的嘴唇娇艳的和番茄酱一样，但是比番茄酱可口很多，凑崎纱夏用高挺的鼻子像逗小朋友一样碰名井南的，刚才接吻的时候鼻子撞到了一起。</p><p class="story-paragraph" data-source-index="348">凑崎纱夏笑笑，吻住名井南鼻梁上的那颗痣，算作赔礼道歉。</p><p class="story-paragraph" data-source-index="350">凑崎纱夏自认为平时还算有点仪式感的人，和名井南的第一次要这么潦草的在沙发上进行吗？虽然她没想象过玫瑰花，红酒之类的，但是起码要在床上吧，不过现实没有时间让她来布置这些东西了。</p><p class="story-paragraph" data-source-index="352">名井南含着凑崎纱夏的耳垂一声声喊着【姐姐】，凑崎纱夏坐在她的怀里抖得不成样子，像只受惊的小猫，却把全部身心都交给了罪魁祸首的自己，身体贴得很紧，温度透过薄薄的衣料传过来，名井南庆幸现在是夏天，可以方便自己轻而易举就撩开简单的衣物。</p><p class="story-paragraph" data-source-index="354">凑崎纱夏白净的侧脸上有一道清晰的水线，沾染的还有不太明显的红晕，眼睫毛上挂着水，看起来雾蒙蒙一片。这样的画面激发了名井南的原始欲望，亲吻比刚才还要猛烈，几乎没有什么技巧，像是动物撕咬猎物那样重重咬凑崎纱夏的嘴唇，咬出一点痕迹后立马道歉，道歉的方式是伸出舌头温柔地舔抵。</p><p class="story-paragraph" data-source-index="356">平时的名井南不是这样的，好像变了个人一样，压迫感和情欲逼出了凑崎纱夏的眼泪，身体和内心深处涌出的欲望让她环住名井南的胳膊更紧了，太激烈的动作会让自己掉下去。</p><p class="story-paragraph dialogue" data-source-index="358">【不要...不要这种时候叫我姐姐...哼...】，这实在太犯规了，平时没礼貌地喊名字，这种时候却反常地叫姐姐，说名井南不是故意逗自己，凑崎纱夏半点也不信。即使知道这是个小把戏，凑崎纱夏也还是中招了，正经的称呼在暧昧的时刻显得禁忌感十足，         <header class="chapter-header"><span class="chapter-number">03</span><h2>浦岛太郎</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="424">幼稚园本来要给学生放卡通片的，临时出了故障，凑崎纱夏只得口头讲完这个故事。修理电脑的工作人员手上动作没有停，尽量避免自己发出的声音影响到凑崎老师授课，凑崎老师很会讲故事，就连他也听的入神，虽然《浦岛太郎》这个故事已经在日本家喻户晓。</p><p class="story-paragraph dialogue" data-source-index="426">【即使浦岛太郎只在大海深处待了3天，但陆地上已经经过了300年，他回去的时候一切都已经物是人非了。】凑崎纱夏讲完故事，放映的电脑也差不多修理好了。</p><p class="story-paragraph" data-source-index="428">工作人员点点头表示已经没问题了，拉开障子门，脚都踏出去了却突然扭头问凑崎纱夏：【这样的结局是浦岛太郎还是龙女的错呢？】</p><p class="story-paragraph" data-source-index="430">凑崎纱夏选择了第三个选项：【谁都没有错，只是命运是个小偷，偷走了浦岛太郎的时间。】</p><p class="story-paragraph" data-source-index="432">这样说似乎在推卸故事主角的责任，但是不可能发生的事情才叫奇迹，无法改变的路线才叫命运，什么错都没有犯的人被命运推到了根本没有选择的分叉口，谁都无可奈何，唯一的选择只有接受。工作人员叹了口气，凑崎纱夏这样的回答比故事原有含义还让人难过。</p><p class="story-paragraph" data-source-index="434">送走幼稚园最后的一个学生，凑崎纱夏本可以直接离开，看见地面因为几场雨变得泥泞又原路返回，拿出工具开始打扫，这不是她的工作，但今天名井南要开会，自己晚点回家也没关系。</p><p class="story-paragraph" data-source-index="436">凑崎纱夏的记性很好，名井南手机里备忘录中保存的值班表，密密麻麻有好多，她也记得一清二楚，医生值班时间不同，但她可以保证名井南每天回家的时候正好吃上还冒着热气的饭菜。</p><p class="story-paragraph" data-source-index="438">名井南在外面再厉害，回到只有两人的生活空间也是个不会照顾自己的小孩子，凑崎纱夏珍视名井南，所以记得各种啰啰嗦嗦的小事，包括对方的作息习惯，二人琐碎的生活细节。</p><p class="story-paragraph" data-source-index="440">几场洒脱的雨过去，地面的小水坑盛着暴雨中被打落的树叶，已经泛黄了，空气已经不是那么干燥，湿润，微微凉意都在提醒凑崎纱夏，夏天彻底过去了。东京的秋季，时间不算长，可能只有几个星期，更新换代几次后冷空气就会回访，迎来属于自己和名井南的第一个冬天，她在心里暗暗想，一定要和名井南看一次初雪。</p><p class="story-paragraph" data-source-index="442">没有特别的规定，但是大家都默契地将初雪看作浪漫，和喜欢的人在一起看过一次初雪就会永远在一起。凑崎纱夏以前对这种浪漫故事是一笑而过的，但是爱上了名井南，对什么事情都开始隐隐约约地期待。</p><p class="story-paragraph" data-source-index="444">凑崎纱夏分神得厉害，风衣上粘上了一朵秋叶的碎片也没发现，回家被名井南捻下来后才哑然失笑，她说出自己那时候发呆的内容：【名井南，我们到时候一起看雪吧。】</p><p class="story-paragraph" data-source-index="446">没头没脑，莫名其妙的约定。</p><p class="story-paragraph dialogue" data-source-index="448">【好。】</p><p class="story-paragraph" data-source-index="450">还好名井南无条件接受凑崎纱夏所有毫无缘由的奇怪想法。</p><p class="story-paragraph" data-source-index="453">凑崎纱夏算过自己和名井南正式在一起的日子，夏天到现在也足够几个月了，但知道她们恋情的人也就平井桃，便利店的小津应该算一个，毕竟自己每次为了省时间去便利店购物买的都是名井南爱吃的东西。</p><p class="story-paragraph" data-source-index="455">世界上最了解我们口味的人有谁呢？除了自己其实是经常去的便利店的工作人员，甚至不需要对方花费功夫，只要我们多去几次，对方潜意识里就会记得我们经常购买的各种物品种类。何况小津是个聪明的孩子，甚至有时候会主动推销名井南爱吃的零食，狡猾的目光里带着善意。</p><p class="story-paragraph" data-source-index="457">凑崎纱夏自己是不太在乎性取向的事情被人发现，在遇见名井南以前她从来没觉得自己以后会是个同性恋，只是因为名井南恰好是个女生而已，记忆中的第一次恋爱发展到现在的地步水到渠成，自然而然。</p><p class="story-paragraph" data-source-index="459">社会上对同性恋的态度和以前也有了翻天覆地的变化，但凑崎纱夏依然恰当控制自己和名井南在公共场合的距离，不仅仅因为取向问题在社会上还是个模糊的议题，还有名井南的家世，那样显赫的身份很大程度上不会允许名井南任性做自己想做的事情。自己也和名井南聊过关于未来的话题，几乎每次都由自己抛出，各种各样的未来，名井南每次都回应【好】，凑崎纱夏不觉得这是敷衍，也没有傻到以为谈话可能成真，但也会在仅有几次的关于这个话题的聊天中感到希望。</p><p class="story-paragraph" data-source-index="461">凑崎纱夏想过很多个故事的结局，她是个成熟的大人，好的，不好的，都想过。甚至在心里做好了名井南离开自己的预设，被家人逼着离开自己也好，或者她自己玩够了这个游戏厌倦了也没关系，凑崎纱夏都可以欣然接受，她从来都不是爱做梦的人，名井南已经是她做过的最美的一场的梦了。</p><p class="story-paragraph dialogue" data-source-index="465">【你和名井同学谈恋爱了吗？】，教过的学生发展的再好，明石还是和以前一样喊她。</p><p class="story-paragraph" data-source-index="467">明石医生的询问轻飘飘的，但好似水里闷雷，炸的凑崎纱夏心里破涛汹涌，也就一瞬间，慌乱和不安就又收回去了，点头的时候她反而松了一口气。自己和名井南几乎没有一起去过什么特别的地方，最多的约会场合是医院附近的便利店，被明石医生发现也没什么奇怪。</p><p class="story-paragraph" data-source-index="469">明石医生是自己和名井南唯一一个有共同联系的人，她有时候对名井南有种虚无缥缈的感觉，可能现实太美如同梦，凑崎纱夏反而不安，不知道也不能对谁讲，名井南的前途是要比自己的爱情重要的，她也不愿意花费很多时间去给平井桃说一个几乎不认识的人。来医院的时候遇上明石医生心里也总是有种做贼心虚的不安，现在被他发现了，凑崎纱夏竟然有一种想要分享的冲动。</p><p class="story-paragraph" data-source-index="471">医院的走廊什么时候这么安静过，门诊时间已经结束了，护士送过来报告后自觉离开了，顺带关上科室的门，房间里只有凑崎纱夏说话的声音。</p><p class="story-paragraph" data-source-index="473">声音很慢很轻，凑崎纱夏时不时笑一下，然后又不好意思摆摆头。</p><p class="story-paragraph" data-source-index="475">明石对事情发展到如今的局面并不奇怪，虽然凑崎纱夏和名井南在医院的互动正常而有分寸，但看见这两个人成双入对地出现，他就知道故事会朝着不可控的方向发展。明石不是第一次看这样的故事，在心里无可奈何地叹了很多次气也找不到合适的解决办法。</p><p class="story-paragraph" data-source-index="477">明石身为医生，对陌生人和身边人的唯一期待不过是身体健康，平平安安，对性取向这样的事情他并不在乎，他在乎的是名井南将来该何去何从，她走的路是条死胡同，几乎不可能有个好结局。</p><p class="story-paragraph" data-source-index="479">对凑崎纱夏埋怨的话半点也说不出口，这孩子什么都不知道什么也没做错，她就只是喜欢名井南而已。</p><p class="story-paragraph dialogue" data-source-index="481">【纱夏，你想要个好结局吗？】明石的话虽隐晦，但凑崎纱夏明白他的意思，这个问题她也问过自己好多次，在第一次遇见名井南，在便利店买名井南爱吃的食物，在无数个看着名井南发呆的时刻，她开口：【我想要名井南有个好结局。】</p><p class="story-paragraph" data-source-index="483">明石做很难的手术时也没有露出这样艰难的神色，听见凑崎纱夏的回答心里只是觉得自己无能和残忍，他马上说的话一定会让凑崎纱夏很难过，命运何其不公，而自己无论出于什么责任都不得不做命运的刽子手。</p><p class="story-paragraph dialogue" data-source-index="485">【可是名井南遇见你之后是绝对不会有好结局的。】明石因为这句直白的话由自己说出而产生了非常大的愧疚，尤其是看见凑崎纱夏的反应，她手足无措的样子看起来像不知道自己到底做错什么，表现的像个自责的孩子，低着头不说话。</p><p class="story-paragraph dialogue" data-source-index="487">【不是因为你们的性别，也不是因为家世。】明石看着凑崎纱夏，确认她的脸色缓和一点后才开口，他是个心软的人，想最大限度的让凑崎纱夏好过一点。</p><p class="story-paragraph dialogue" data-source-index="489">【名井南是我看着长大的，在没成为我的学生之前我就知道她的情况，她的家人极为珍视她，不仅仅表现在物质方面，这孩子有着无法回头的固执，想做的事情一定要做，名井院长也愿意放纵她，她和你一样是受宠爱的人。】</p><p class="story-paragraph" data-source-index="491">只是两个一样受宠爱的人并列一起，有化学反应，也有公式限制，就算有清晰的步骤，得到的结果也只是π一样的死循环，是没意义的。</p><p class="story-paragraph" data-source-index="493">明石沉默了好久才开口：【是因为你车祸的后遗症。纱夏，你的失忆症不是常规意义上的那种。你当初的那场车祸其实很严重，我们花了很大的功夫才把你从鬼门关拉回来，你当时浑身是血，院长亲自给你操刀，就是名井南的父亲。手术结束后的很久你都没有醒，我翻了很多书，和院长每天都在开会讨论办法。你当时的状态完全就是植物人，你的...不，我们都很难过，所以我们做了一个很大胆的决定，就是对你大脑的基因进行改造。】</p><p class="story-paragraph" data-source-index="495">房间安静得可怕，凑崎纱夏偷偷捏着自己的手才没有倒下去，隔着一张桌子的明石医生严肃的样子在证明他不是开玩笑，也不是讲科幻小说。</p><p class="story-paragraph dialogue" data-source-index="497">【还好我们成功了，但是有后遗症，纱夏，你会忘掉最爱的人，这不是你能控制的。人的身体虽然是自己的，但几乎没有人可以完全控制属于自己的身体，我是医生也会生病，如果可以控制，人人都能长生不老，我们人类所创造的社会看似了不起，实际不值一提，不过在自然规律的操控下战战兢兢维持罢了。】明石医生说的话完全不像一位学者会说的，也不像个医生，他明白以后凑崎纱夏不会再来了，此刻的他只是个对后辈心软的长者而已。想尽可能多说一点减轻凑崎纱夏的负担。</p><p class="story-paragraph" data-source-index="499">纱夏，这不怪你。</p><p class="story-paragraph dialogue" data-source-index="501">【虽然国外的研究所也有这样类似的情况，但他们把这情况称为【进化】，情感有时候会影响人的理智，瘾君子为了快乐而选择沉沦，意识作为我们唯一一个身体中可以操控的东西，在某些时刻却完全不起作用。但你的大脑却不会，它会迅速处理无数个瞬时记忆，哪怕那些瞬时记忆已经在你生活的经历中变成了难忘的回忆，只要它察觉到你对这些记忆投入了过度的感情，就会像个机器一样删除。】</p><p class="story-paragraph" data-source-index="503">明石认为世界上再没有比这还要残忍的话了，爱上一个人当然会沉沦其中，但是大脑却像个无情的只会说【为你好】的教育家将其残忍地抹除，逼着理智回归正道，而这样可怕的行径却被那些人称为【进化】。</p><p class="story-paragraph" data-source-index="505">根本就是死局，凑崎纱夏想，我最后一定会忘记名井南的。预设的很多种结局没有一种是眼前的这一种，缓了好久也无法接受的这一种。</p><p class="story-paragraph" data-source-index="507">可凑崎纱夏能怎么办，她只有接受这一条路。</p><p class="story-paragraph" data-source-index="509">她的大脑似乎真的格外与众不同，即使在这样的情况下也能压抑悲伤，想着晚上给名井南做什么饭，在哪一天的什么时候谈分手，离开的时候什么可以留下，什么要打扫干净。</p><p class="story-paragraph" data-source-index="511">那天明石医生说的最后一句话带着一丝可怜的味道，【纱夏，我们只是想让你活下去，不要怪谁。】</p><p class="story-paragraph" data-source-index="513">凑崎纱夏听完故事到接受现实都没有要怪罪谁的意思，非要说对明石医生的态度的话，其实她很感激甚至还有点无法言说的愧疚，明石医生和自己一样是普通人，他是因为自己才被卷进这个故事，要怪只能怪自己倒霉，是故事的主角，是东京现实中的浦岛太郎。</p><p class="story-paragraph" data-source-index="515">凑崎纱夏恭恭敬敬鞠了个躬就离开了，和来的时候一样安静，临走的时候带上了办公室的门。</p><p class="story-paragraph" data-source-index="517">凑崎纱夏晚上给名井南热牛奶的时候才稍微喘息了一下，片刻的美好让她差点以为下午的谈话是一场梦，可大脑在不停发出信号：现在的生活才是梦。</p><p class="story-paragraph" data-source-index="519">就当做一场梦吧，在梦里，自己还和平常一样在名井南身边，看她玩已经落伍很久的红白机游戏，看她喝完东西还会留下痕迹。凑崎纱夏躺在名井南的膝盖上，伸手擦去她嘴角的牛奶，笑话她：【名井南，你真是个小孩子。】</p><p class="story-paragraph" data-source-index="521">小孩子的情绪来得快走得也快，名井南要真是个小孩子就好了，这样她就不会因为自己伤心了。</p><p class="story-paragraph" data-source-index="523">每次做爱的主导者几乎都是名井南，她在这方面的表现和做医生一样有天赋，性爱结束收拾好一切才会恢复在凑崎纱夏面前的天真模样，嘟哝着好累好困，几乎是在钻进凑崎纱夏怀里的瞬间就已经睡着，今天也不例外。凑崎纱夏轻轻拉开了一点距离，确认名井南的确熟睡之后，尽量控制自己的声音不会吵醒枕边人才开口：【名井南，你永远都不要因为我难过好不好。】过了一会儿用更小的声音说：【不要忘记我好不好。】</p><p class="story-paragraph" data-source-index="525">这是凑崎纱夏记忆里自己说过最自私的话了，她希望名井南快乐，但也贪婪，她的侥幸心理让她想：也许名井南记得自己和永远快乐可能不冲突。</p><p class="story-paragraph" data-source-index="527">过了好久，静悄悄的夜响起了梦话一样的呢喃：【好。】</p><p class="story-paragraph" data-source-index="529">凑崎纱夏皱起的眉头在名井南第二句梦话中平复，跳动的心却做不到。</p><p class="story-paragraph dialogue" data-source-index="531">【我们去看雪。】</p><p class="story-paragraph" data-source-index="533">凑崎纱夏背过身，极力克制自己的动作。</p><p class="story-paragraph" data-source-index="535">月亮知道那一夜有个人流了多少眼泪，眼泪的秘密变成了旁边的星星，启明星升起，天亮了，美梦该醒了。</p><p class="story-paragraph" data-source-index="537">凑崎纱夏请了假，在每天都坐的大巴上一遍又一遍绕着城市转，她把便利店的车站当做起点，看着一路风景回忆这几个月的时间轴。和名井南的故事其实也没有持续多久，从春天开始到现在，一年四季都还没走完，但是怎么会感觉爱了名井南很久很久呢？</p><p class="story-paragraph" data-source-index="539">上班时间的大巴上除了司机就是自己，这座车好像凑崎纱夏花一百日圆包下来的，空荡荡的车厢里她想起好多事。比如春天的那个【21天攻略】，攻略的准备工作是在【习惯】的前提下进行的，春天的攻略成功了，但是再给名井南21天，她可以习惯没有自己吗？凑崎纱夏忍不住换位思考，如果是我的话21天是做不到的，给自己多少个21天都不行，名井南已经成为我习惯的一部分。</p><p class="story-paragraph" data-source-index="541">透过车窗玻璃可以看见商场外面的广告是名井南爱喝的那款饮料，凑崎纱夏又开始细数名井南爱吃的东西：可乐，牛奶，番茄酱，有时候兴致来了还会给自己烤面包，怎么看都是小孩子口味。名井南的兴趣很多，还喜欢做些针织品，做这些东西费劲费神，但依旧给自己做了几个，离开的时候自己可不能带走。名井南还喜欢玩各种游戏，在马里奥的世界给自己摘星星，也玩经营类的游戏，类似便利店售卖货物之类的。自己那时候还玩笑：【我俩摘不到星星，一起开个便利店吧。】</p><p class="story-paragraph" data-source-index="543">现在看来，开便利店这样的事情不比摘一颗天上的星星简单。</p><p class="story-paragraph" data-source-index="545">那个时候的名井南似乎沉浸在游戏里，都没听清自己说的什么就下意识地说“好”。</p><p class="story-paragraph" data-source-index="547">看来名井南要说话不算话了，但这怎么能怪她。</p><p class="story-paragraph" data-source-index="549">便利店是起点，也是终点。凑崎纱夏进了便利店没看见小津的身影，值班的是位兼职临时工的阿姨，自来熟的对没见过几次面的凑崎纱夏念叨：【小津的学习很忙啊，老板也不招新人，只会说小津考完试就不忙了，让我辛苦一下，真是的，老年人的私生活也很忙啊！】</p><p class="story-paragraph" data-source-index="551">凑崎纱夏想自己的脸色一定很差，因为阿姨看见自己的脸后，喋喋不休的声音停止了，还大方地递过来一包卫生纸，带着疑惑的神情提问：【哎呀，怎么了？擦擦眼泪吧。】</p><p class="story-paragraph" data-source-index="553">我那天哭的很伤心吗？凑崎纱夏在冬天快到来的那几天再经过便利店好几次都没有再见到那位阿姨，那位阿姨看见不太熟的女孩哭泣没有嫌麻烦，也没有多问，只是语气温柔像妈妈一样安慰自己：【女孩子再哭就不漂亮啦，忘掉伤心的东西去和朋友大吃一顿吧，明天会好起来的。】</p><p class="story-paragraph" data-source-index="555">阿姨是很善良的人，但是她说错了一句话，我没有明天了，凑崎纱夏对这件事保持绝对态度，除了名井南，我再也无法爱上别人了。</p><p class="story-paragraph" data-source-index="557">凑崎纱夏收拾好自己，对着狭小的手机屏幕确认眼睛哭过的痕迹是否还很明显，屏幕因为指纹的无意触摸自己亮了起来，都是名井南发的消息:</p><p class="story-paragraph" data-source-index="559">[要喝奶茶吗？我听科室的护士说贡茶出了新品。]</p><p class="story-paragraph" data-source-index="560">[我给你买了哦。]</p><p class="story-paragraph" data-source-index="561">[天气好冷，你今天出门穿的很少，你在哪里，我去接你好不好。]</p><p class="story-paragraph" data-source-index="563">每句话后面都配着系统自带的小表情，这是名井南的习惯，凑崎纱夏第一次收到名井南发的消息的时候就发现了，那时看见便心头一软，看了好多次都还觉得可爱，只是今天有点儿想哭。</p><p class="story-paragraph" data-source-index="565">桌面切回主界面，备忘录的样式明显切刺眼，点开里面都是关于名井南的各种大小事，密密麻麻一片。明石医生没有撒谎，凑崎纱夏真的在跟着时间的脚步遗忘名井南，她拼命挣扎也无济于事，甚至延缓一下速度都做不到。</p><p class="story-paragraph" data-source-index="567">名井南下楼的时候手上还拿了一条围巾，看见凑崎纱夏在小区的秋千上晃荡才放下心来。她蹲着身子给凑崎纱夏一圈圈系围巾，马上就回家了，不做这些也没关系，可对方是凑崎纱夏呀，是名井南最喜欢的人呀。凑崎纱夏呆呆的还没反应过来，名井南没忘行使约定，在冷风中亲吻凑崎纱夏的额头。</p><p class="story-paragraph" data-source-index="569">温柔的举动击溃了凑崎纱夏心里最后的一点执着，这段感情是一定要结束的，而谁来结束，怎样结束，体面不体面，主导者都只能是自己。罪人怎么能让名井南来做，冷暴力的做法凑崎纱夏想也不敢想，也做不到。</p><p class="story-paragraph" data-source-index="571">名井南是多么聪明的人，在凑崎纱夏不回消息的时候就察觉到端倪，系围巾的时候在拉近的距离里看见了凑崎纱夏通红的眼眶，她开口说话，既没有做医生时的冷静镇定，也没有少年人的意气风发，声音里的恳求意味再明显不过：【纱夏，跟我回家好不好。】</p><p class="story-paragraph dialogue" data-source-index="573">【名井南，】凑崎纱夏睁大眼睛看着名井南，她不想忘记名井南的样子，她想太不公平了，名井南对自己说了很多次【好】，可自己却不能这样，【我们以后不能再见面了。】</p><p class="story-paragraph" data-source-index="575">离别和告白一样毫无特别，在一个稀疏平常的夜晚，只是告白发生在不久前的热烈夏季，但好像已经是上一个世纪的事了，现在是新时代的，冷酷的冬天，季节的变化明明白白告诉世人自然的进度，今时不同往日，有些事情必须得结束了。</p><p class="story-paragraph" data-source-index="577">虽然凑崎纱夏没有提结束两个字，但名井南知道此刻就是她们结束的时间点。故事从开始到结尾，名井南都是知道凑崎纱夏的心意的。</p><p class="story-paragraph" data-source-index="579">这是凑崎纱夏第一次在公共场合和名井南做出格的事情，其实只是接吻而已，她心里愤愤不平，早知道故事的结局是这样，我当初应该再多吻一下名井南，再多看一看她。</p><p class="story-paragraph" data-source-index="581">名井南终于露出笑脸，她想自己这样凑崎纱夏会安心一点，当然也有曾经的恋人最后一次任性的行为的原因。</p><p class="story-paragraph dialogue" data-source-index="583">【纱夏，你去见明石医生了吗？还是见过我的父亲？】</p><p class="story-paragraph" data-source-index="585">凑崎纱夏没有说实话，她不想名井南误以为今晚的分手是因为别人的阻挠，但她也无法说出故事的真相，她真的努力了，很多次，但是没有用，记忆在消失。</p><p class="story-paragraph dialogue" data-source-index="587">【没有，我身体已经恢复了，我要回大阪了。】</p><p class="story-paragraph" data-source-index="589">名井南笑意盈盈，一如初见，开口说：【我知道了，一路顺风。】</p><p class="story-paragraph" data-source-index="591">凑崎纱夏在备忘录里确定了名井南今天的日程，她今天要加班，从早到晚有充足的时间可以去她家打包自己的东西。她们可以不用再见，也不用再进行一次道别。</p><p class="story-paragraph" data-source-index="593">平井桃过来帮凑崎纱夏搬东西，她什么也没多问，反应还没有知道凑崎纱夏谈恋爱那天大，沉默地将一件件东西搬下来，她已经无话可说了，都说旁观者清，其实旁观者什么都做不到，安慰和批评对此刻的凑崎纱夏来说都毫无意义。</p><p class="story-paragraph" data-source-index="595">直到最后她们在凑崎纱夏的楼下分别，平井桃的架势看起来是要离开了，突然顿住脚步，在漆黑的楼梯道里似乎想到了什么，开口喊：【纱夏，过来抱抱我吧。】</p><p class="story-paragraph" data-source-index="597">下一秒，背后就接触到了一个温暖的怀抱，平井桃一动不动地站在那里背对凑崎纱夏，任由她揪住自己的衣角，力气很大，平井桃感觉有股力量好像也在拉扯自己。但平井桃什么都没说，只是沉默地听一直都是直呼自己名字的妹妹抽泣：【姐姐，我好难受。】</p><p class="story-paragraph" data-source-index="599">凑崎纱夏露出的笑脸太多次，平井桃差点忘了，这个妹妹小时候其实很爱哭，只是后来长大了就再也不将自己的眼泪给别人看，除了自己，或许还有名井南。</p><p class="story-paragraph" data-source-index="601">凑崎纱夏不知道自己什么时候停止哭泣的，她还是抱着平井桃没有松手，她太累了，这些天的压力快让她站不稳，凑崎纱夏又喊平井桃姐姐，【我告诉你我和名井南谈恋爱的时候你看起来不开心，我那时候挺后悔告诉你的，我不想让你担心我，我也知道你是为我好，觉得我和女生谈恋爱会很辛苦才那样，但是名井南真的特别好。】</p><p class="story-paragraph" data-source-index="603">凑崎纱夏顿了顿，她又想哭了，缓了一会儿才又开口：【现在看来还好姐姐你知道，不然我以后忘记名井南就不好了，你到时候跟我提提名井南吧，说些什么都好，但不要说她和我在一起过，要不然那时候的我肯定会嫉妒现在的自己，你可以告诉我名井南是脑科医生，名井南爱打单机游戏，有时候挺像小孩子的。】</p><p class="story-paragraph dialogue" data-source-index="605">【姐姐，名井南真的是特别好的人。】</p><p class="story-paragraph" data-source-index="607">凑崎纱夏说了一大堆啰嗦的，没有逻辑的话，平井桃就这样安静的听着，疑点的地方她也不问，在最后答应凑崎纱夏：【好，我知道了。我也知道名井南是个特别好的人。】</p><p class="story-paragraph" data-source-index="609">平井桃最后没有留下来，有的人的难过需要自己一个人去消化，有些时候有些话不要说得太清楚比较好。手上拿的是刚脱下来的外套，衣摆的地方被拽的已经变形了，背后眼泪留下的痕迹还很清晰，平井桃今天晚上叹了好多次气，扭头向车站的反方向走去。</p><p class="story-paragraph" data-source-index="611">凑崎纱夏从名井南的家离开什么也没带，虽然不久前那里也是自己的家。凑崎纱夏翻遍了家里的每一个角落找到两个人生活过的每一件物证，放一起拍了一张照片，也没上传。之后她又写了一堆便利签，事无巨细的，有让名井南多喝水少喝饮料的嘱咐，让名井南不要边吃早饭边看论文，写完就给撕了，和垃圾一起带走。</p><p class="story-paragraph" data-source-index="613">最后真要走了，凑崎纱夏才第一次打开名井南的switch，点开标签为《马里奥》的游戏。聪明的大脑此刻居然不起作用了，马里奥好几条生命被她浪费，费了好大力气才过了一关，按住上放学键，屏幕上的马里奥跳起来顶头顶上的砖头，终于弹出一颗星星，但是系统的随机概率这次让星星和马里奥背道而驰了。</p><p class="story-paragraph" data-source-index="615">凑崎纱夏看着屏幕上的【GAME OVER】闪了几秒又切换成【PLAY GAME】，她想要再来一次，再来一次每天在便利店的偶遇，那时候两个人都还不熟，说些什么都不用顾虑的废话，仅仅这样就已经很好了。</p><p class="story-paragraph" data-source-index="617">收拾完东西已经深夜了，凑崎纱夏想这样的时刻是可以很好用来伤心的，她乐意为了名井南再凌迟一遍自己的心，在记忆消失前为了这份感情而伤心的感觉其实很珍贵，她放任自己沉溺于悲伤。</p><p class="story-paragraph" data-source-index="619">凑崎纱夏对着一张照片看了很久很久，那是她和名井南共同生活过的唯一物证，可惜自己的记忆不比这张照片可靠，最后在天将明不明的时候她按下了删除键。</p><p class="story-paragraph" data-source-index="621">自己的记忆里，彻底要没有名井南了。</p></div>

        <header class="chapter-header"><span class="chapter-number">04</span><h2>四个春天</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="627">凑崎纱夏现在醒来要发很久呆，用来回忆和名井南的故事，比高考生还要努力，虽然大多数回忆起来的都只有零零散散，七零八落的碎片，但她还记得“初雪”的约定。气象台主持人的声音从客厅传来： 今天是12月25号，星期三，今天夜间到明天白天，天气晴，最低温度1摄氏度，最高温度4摄氏度，未来三天，局部大雪。</p><p class="story-paragraph" data-source-index="629">这是今年的第一场降雪哦，电视台主持人愉悦的声音伴随叮叮当当的乐曲结束了今日份的天气预报。</p><p class="story-paragraph" data-source-index="631">凑崎纱夏伸出头看电视，屏幕上已经开始插播广告，她心里既没有雀跃也没有难受，有的是一种不知道是何意味的期待。</p><p class="story-paragraph" data-source-index="633">凑崎纱夏踩着规定时间的最后一秒踏入办公室，笑着冲同事点点头，为刚才的差点迟到道歉。同事点点头什么也没说，她不知道是不是冬天的缘故，这个平时最乐观的女孩精神差了很多，可能是自己的错觉吧，因为凑崎纱夏每天领着小朋友活动的时候看起来还是精力满满，下班了也不急着回去，慢慢悠悠地在办公室玩单机游戏。</p><p class="story-paragraph" data-source-index="635">要是没发生那天的事，自己是不会多想的。</p><p class="story-paragraph" data-source-index="637">想到这里，同事叹了口气，那天自己班级的孩子突然不舒服，她匆匆忙忙回来已经是傍晚了，办公室的灯居然亮着，进去一看是凑崎纱夏在玩游戏。屏幕上穿着背带裤，戴着红帽子的小人到处顶机关，像个无头苍蝇。</p><p class="story-paragraph dialogue" data-source-index="639">【纱夏，你在干嘛，这样是通不了关的。】当时不应该多嘴的，同事暗暗后悔，她看见凑崎纱夏极力抿着嘴巴也没成功阻止眼泪流下来。</p><p class="story-paragraph dialogue" data-source-index="641">【我怎么找不到星星了。】</p><p class="story-paragraph" data-source-index="643">没头没脑的话让同事也不知道怎么接腔，后来私下委婉地问过好几次凑崎纱夏是不是没睡够。</p><p class="story-paragraph" data-source-index="645">凑崎纱夏摇摇头，她没撒谎，每天的睡眠时间绝对有八小时，只是会整夜整夜地做梦。</p><p class="story-paragraph" data-source-index="647">梦里有春天初遇名井南，夏天和名井南接吻，秋天名井南问她要不要喝贡茶，甚至还有没结束的冬天，在梦里大雪纷飞的那一天她又见到了名井南。</p><p class="story-paragraph" data-source-index="649">梦里的一切细节都很真实，凑崎纱夏有好几次醒来分不清这是梦还是真的发生过，仔细回忆回忆梦里的大雪，她断定这就只是一场梦，自己从来没和名井南看过雪。</p><p class="story-paragraph" data-source-index="651">凑崎纱夏抽了一天时间整理搬回来的东西，尽管当时刻意没有带走那个家的一些东西，但是这个家里自己和名井南相恋的证物还是有的，比如这本日记本，这个记事本最开始是为了【21天攻略】的进行，后来成了自己和名井南的恋爱日记，最后变成了自己的备忘录，尤其察觉到自己对名井南的一些事情记忆越来越模糊，她就把所有事情都记在了上面。</p><p class="story-paragraph" data-source-index="653">凑崎纱夏删光了手机里一切的证据，她担心忘掉现在的一切后又因为没整理好的细节会又一次对名井南产生好奇，她对自己够狠心，可以不去打扰名井南，但对名井南不够决绝，说到底还是舍不得。</p><p class="story-paragraph" data-source-index="655">所以这本本子还留着，她想名井南了会翻一翻，在最后一页的正面写：凑崎纱夏最喜欢名井南，不要忘记名井南。凑崎纱夏不知道名井南有多爱自己，她身为年长的那一方和名井南相比是隐忍克制的，但她不需要名井南知道自己在私下的时候有多么努力去爱她，就像自己现在也还在和记忆对抗，这样简单的事情就已经花光了凑崎纱夏的全部力气。</p><p class="story-paragraph" data-source-index="657">凑崎纱夏气馁，却不肯放弃。</p><p class="story-paragraph" data-source-index="659">名井南的爱其实不比自己的少，凑崎纱夏知道这件事后已经是三天后了，那天是今年的第一场大雪来临的日子。</p><p class="story-paragraph" data-source-index="661">刺骨寒风钻进衣领，凑齐纱夏才发现自己忘记戴围巾就出来了，又懒得回去拿，索性步行在街上闲逛，逛着逛着到了便利店门口。透过玻璃凑崎纱夏看见收银台的人是位眼熟的阿姨，但怎么也想不起来名字，她自嘲难道【失忆症】变严重了。</p><p class="story-paragraph" data-source-index="663">小津算是见证自己和名井南爱情的人物，今天小津不在，凑崎纱夏才生出勇气走进便利店。纠结了一下措辞才跟阿姨开口：【小津今天不来吗？大一的课程这么多呀。】</p><p class="story-paragraph dialogue" data-source-index="665">【是纱夏呀，小津去给老板送饭了。】</p><p class="story-paragraph" data-source-index="667">凑崎纱夏这才惊觉自己之前来这个便利店来的如此频繁，却一次都没有目睹过老板的真容，更奇怪的是眼熟的阿姨好像真的认识自己，喊自己喊的亲亲热热。</p><p class="story-paragraph dialogue" data-source-index="669">【疑心病】一旦升起，看什么事情都是疑点重重，何况凑崎纱夏的大脑和最著名的名侦探一样敏锐，只要抓住细节就可以找到答案。</p><p class="story-paragraph dialogue" data-source-index="671">【那个，不好意思，请问我们上次见面的时间您还记得吗？】凑崎纱夏耐心寻找适合的角度去套对方的话。</p><p class="story-paragraph dialogue" data-source-index="673">【啊，你不记得了吗？不过也难怪，我们上次见面还是去年的秋天，没错，是在秋天，那个时候小津忙着准备高考，这里每天都是我值班。你那天来便利店也不说话，突然就哭起来了，真是吓了我一大跳，但是最后你不是擦干眼泪走了吗，临走你告诉了我的名字。】</p><p class="story-paragraph" data-source-index="675">凑崎纱夏的大脑有一瞬间像是电脑卡机了一样空白，记忆提供给她的信息是今年春天，自己第一次来到这里。凑崎纱夏差点站不稳，扶住桌子的一角，手掌传来的尖锐的疼痛提醒她该问下一个问题了。</p><p class="story-paragraph dialogue" data-source-index="677">【这里的老板是谁啊。】</p><p class="story-paragraph dialogue" data-source-index="679">【啊，纱夏你不认识吗？我有几次坐大巴经过这里还看见了你和老板交谈呀，就是对面医院院长的女儿，名井南呀！】阿姨低着头处理柜台的标签，这让她错过了对面的人脸色有多苍白，继续自顾自地开口：【名井南虽然是这个店的老板，但是她不怎么来店里，她其实是医院附属研究所的高材生，没想到吧，这里的老板是个很厉害的人，听说是搞脑部研究的，就是记忆啊基因那些的，但小津跟我说她以前不是做这些的，她好像是学芭蕾的，不知道为什么突然就换了人生职业。】</p><p class="story-paragraph dialogue" data-source-index="681">【阿姨！不要再说了！】小津的呵斥突如其来，阿姨这才发现凑崎纱夏的脸色实在不好，整个人抖成了筛子，伸出手想要扶住对方，触碰到的皮肤凉的可怕。</p><p class="story-paragraph" data-source-index="683">小津，小津就叫小津吗？凑崎纱夏猛地抬头，眼神里的坚决不容忽视，开口的语气听起来却很可怜：【小津，你叫什么名字。】</p><p class="story-paragraph" data-source-index="685">小津难得露出为难的表情，只是送个便当的功夫，十分钟不到，事情的发展就脱离了可控的范围，脑海里闪过许多应付提问的话术，但没有一个能应对这个关于名字的最简单提问。</p><p class="story-paragraph dialogue" data-source-index="687">【凑崎小姐，我叫明石津。】</p><p class="story-paragraph" data-source-index="690">一些被忽略的真相在心里呼之欲出，我忘记的不仅仅是名井南本人，包括和她有关的一切。</p><p class="story-paragraph" data-source-index="692">大脑的系统比世界上最先进的计算机系统还要复杂一百倍，想一想，我们生活里每天要面临多少个瞬间呢？怎么数都数不清，所以聪明的大脑只留下重要的关键词，然后在必要的时候形成合理的记忆就可以了。</p><p class="story-paragraph" data-source-index="694">因此记忆是很容易混乱的，有时候不可以太相信自己的记忆哦，如果能在记录的时候做到绝对客观，备忘录反而要比自己的记忆更可靠。</p><p class="story-paragraph" data-source-index="696">凑崎纱夏的大脑故意删去了重要的事件，还好破碎的片段和那本本子上还可以提供细节。</p><p class="story-paragraph" data-source-index="698">明石津，也就是小津，是明石医生的孩子。</p><p class="story-paragraph" data-source-index="700">名井南和明石津并不是今年才相遇，小津是医生的孩子，他们一定很早就认识，所以小津喊我【凑崎小姐】，喊名井南【姐姐】。</p><p class="story-paragraph" data-source-index="702">明石医生那天说的话是所有模糊记忆中最突出和最清晰的部分，因为那天听见这话的自己很难过，多么聪明的大脑，它只留下让凑崎纱夏难过的部分欺骗其他系统，痛苦的记忆应该删去。</p><p class="story-paragraph dialogue" data-source-index="704">【纱夏，我们都很难过。】</p><p class="story-paragraph dialogue" data-source-index="706">“我们”包括的人里面会不会有名井南？</p><p class="story-paragraph" data-source-index="708">大胆的猜测一旦形成就拉不住刹车一样狂奔，一切的疑点居然都有了解释，我在车祸前就遇见了名井南，平井桃和医生口中提到过，我忘记了一个人，原来就是名井南。</p><p class="story-paragraph" data-source-index="710">所以明石医生说【纱夏，我们只是想让你活下去，不要怪谁。】凑崎纱夏一直以为明石医生口中的“谁”是他自己，现在回想，说的人是名井南。</p><p class="story-paragraph" data-source-index="712">纱夏，名井南也不想这样，你车祸的那天浑身是血，她从来没有那么失态过，手足无措的样子让路过的病人也忍不住可怜她。她跪在地上求着自己的父亲能亲自为你做手术，你要知道她的父亲开始是不满你们的恋情的，可是毕竟是自己的女儿，更何况医者仁心，她的父亲挽着女儿的手走上了一条充满荆棘的路。好不容易捡回一条命你却还是闭着眼睛，她整天都在流泪，每天都在求父亲和老师，她说:纱夏的生活不应该止步于此的，只要你可以醒过来用什么办法都可以，一切代价她会承担，包括被你遗忘，所以不要怪她。</p><p class="story-paragraph" data-source-index="714">所以平井桃说【纱夏，其实你很幸运。】你心爱的人陪伴你直到醒来，听见你说【我身体没事啦】才默默离开，她的一切付出我看在眼里但是说不出口，我有一瞬间很想说出来，可是名井南的眼泪和哀求历历在目，我不可以让她功亏一篑。从某种意义来说，记忆力差反而是幸运儿，好的不好的统统抛之脑后，反正明天又是新的一天。</p><p class="story-paragraph" data-source-index="716">平井桃口里的【不要再做傻事了】是给名井南说的，却被凑崎纱夏傻乎乎接了过去。</p><p class="story-paragraph" data-source-index="718">凑崎纱夏强制被删除的记忆留给她的空白让她随时可以重新开始，可名井南不是，她总是放弃自珍贵的选择权，又何必一次次蹚这趟浑水。再有意思的东西做多了也会没意思，再亲密的关系有一天可能也会厌倦，名井南却非要做拯救公主的马里奥，不辞辛劳，浑身遍体鳞伤也依旧乐此不疲穿梭在冒险关卡，她对凑崎纱夏的爱似乎没有尽头，反正比一局游戏五条命的马里奥还要多，和凑崎纱夏相爱的游戏她已经做了四次。</p><p class="story-paragraph" data-source-index="720">在四个春天里，凑崎纱夏都爱上了名井南。</p><p class="story-paragraph" data-source-index="722">在四个春天里，名井南都接受了凑崎纱夏的花，尽管那朵花充满了荆棘，扎的她满手是血，她也小心翼翼接过。</p><p class="story-paragraph" data-source-index="724">平井桃想起自己以前看过的希腊故事，盗取火种的普罗米修斯和名井南的身影重叠，他们都为了其实一开始就可以放弃的东西执着，名井南受的苦或许不比胆大包天为人类盗火的普罗米修斯少，心脏在夕阳被秃鹰啄的血淋淋，清晨又自动恢复原样等着新一天的凌迟。唯一不同的是普罗米修斯是被宙斯困在高加索山，名井南是自愿待在过去的回忆，无数人对她伸出手，她都不听劝。</p><p class="story-paragraph" data-source-index="726">困在记忆的人不是凑崎纱夏，是名井南。</p><p class="story-paragraph" data-source-index="728">平井桃说【我也知道名井南是特别好的人。】那天晚上凑崎纱夏对平井桃说了一堆，平井桃在听的时候要很努力才压制心里荒谬的想法，她差点就说，我当然知道名井南是个特别好的人，在车祸的转折点之前，你和名井南都是学校意气风发的人，我看着你们相遇然后相爱，站在一起的时候就是天生一对，你爱的人使出了全部筹码去爱你。</p><p class="story-paragraph" data-source-index="730">车站的反方向是医院的研究所，平井桃想到凑崎纱夏抱着自己哭的模样其实很难过，每一次都会难过，她想做点什么却什么也不能做，在去找名井南的路上恳求上帝：做一次好人，放过她们吧。</p><p class="story-paragraph" data-source-index="732">高高在上，虚无缥缈的神明如果可以听见世人的祈求，世界上就不会有那么多苦难了。平井桃在黑暗的房间里找到名井南的时候，她在里面无声流泪，看见自己来了说出了和纱夏一样的话：【姐姐，我好难受。】</p><p class="story-paragraph" data-source-index="734">今天晚上回忆的连锁反应开始于阿姨的话：【老板就是名井南啊。】</p><p class="story-paragraph dialogue" data-source-index="736">【我俩摘不到星星，一起开个便利店吧。】 【好】</p><p class="story-paragraph dialogue" data-source-index="738">【不要忘记我好不好。】 【好】</p><p class="story-paragraph dialogue" data-source-index="740">【没有，我身体已经恢复了，我要回大阪了。】 【我知道了，一路顺风。】</p><p class="story-paragraph" data-source-index="742">面对凑崎纱夏的要求名井南只有一次没说好，她陪着凑崎纱夏演完那场戏，尽管演技拙劣也不愿撒谎，做了那么多不过是不想凑崎纱夏担心，至于其他每个答应凑崎纱夏时说的【好】，名井南都说到做到了。</p><p class="story-paragraph dialogue" data-source-index="744">【这里的老板是个很厉害的人，听说是搞脑部研究的，就是记忆啊基因那些的，小津跟我说她以前不是做这些的，她好像是学芭蕾的，不知道为什么突然换了人生职业。】</p><p class="story-paragraph" data-source-index="746">所以那些三番五次涌起的熟悉感和安心不是凭空生起，是和名井南在一起好久后身体的本能反应，像是肌肉记忆，触碰到名井南就会心软。美好的回忆在不经意间出现，混合着当时的场景迷糊住了凑崎纱夏，她竟觉得名井南每一个恰到好处地反应只是因为名井南体贴又聪明，为什么没有想过那样的默契是需要花费许多时间才能拥有的。</p><p class="story-paragraph" data-source-index="748">凑崎纱夏没吃东西，强烈的身体反应让她的胃翻江倒海一直吐酸水，局面混乱，非常狼狈。</p><p class="story-paragraph" data-source-index="750">依靠仅有的细节和想象力去回溯过往对凑崎纱夏来说不容易，她在和自己的大脑对抗，矛盾撕扯着她，控制着一切的大脑在最上面发号施令，这样回忆下来凑崎纱夏已经筋疲力尽，脑袋涨的快要爆炸了，不仅如此，遍布全身的神经系统都在制止她的行为。</p><p class="story-paragraph" data-source-index="752">凑崎纱夏分不出来身体和心脏的痛感哪个更强烈，或许都有混合着在一起折磨着她。</p><p class="story-paragraph dialogue" data-source-index="754">【不需要回忆了，纱夏记得爱你的人就够了。】</p><p class="story-paragraph" data-source-index="756">纱夏记得桃，记得明石老师，记得一切和我没有关系但是美好的回忆就够了。我和纱夏的一切，我一个人记得就够了，就当我在可笑地发梦吧。</p><p class="story-paragraph" data-source-index="758">命运对凑崎纱夏开了个多么荒唐的命运呀，从头到尾都让她像傻瓜一样被蒙在鼓里，都说不知者无罪，其实不知道真相的人更容易做傻事，也更容易受伤。可是命运对凑崎纱夏并不是完全苛责，它让凑崎纱夏遇见名井南，平井桃，明石医生和小津。为了让凑崎纱夏的人生还可以前进，大家都默契地恪守自己本不应该承担的责任，尤其名井南，宁愿自己难过也要陪她做那些春秋大梦。</p><p class="story-paragraph" data-source-index="760">凑崎纱夏这次不得不跟名井南对着干，痛感让她连笔都快提不起来了，她颤颤巍巍在本子的最后一面写字，就这一下，让我再写完最后一句话，放过名井南吧，她是最无辜的那个人。</p><p class="story-paragraph dialogue" data-source-index="762">【不可以认识...，不要爱上...】</p><p class="story-paragraph" data-source-index="764">从梦中醒来的那个瞬间有一秒吗？也就一眨眼的功夫，梦境的内容就狡猾地消失一干二净了，让想要回味美梦的人急地原地打转，意识恍惚，半梦半醒，等完全清醒的时候才会嘲笑自己，不过是一场梦啊，有什么好纠结的呢？</p><p class="story-paragraph" data-source-index="766">凑崎纱夏盯着似乎是填词游戏一样的空白，她不知道自己此刻正在干什么，扭头看向窗外，外面开始飘起雪花，有一瞬间她以为自己掉进了水晶球。</p><p class="story-paragraph" data-source-index="768">凑崎纱夏只要往前翻一页就可以看见上面密密麻麻写的全是【名井南】，正确答案在指尖晃动流转，但是她已经忘记自己在干什么了，身体仿佛经历一场激烈的争斗，累得不行，心脏跳动得好激烈，去看一下医生吧。</p><p class="story-paragraph" data-source-index="770">不然我会死掉的，凑崎纱夏保持着原来的动作，手里的笔记本并没有翻页，仅穿了一件厚毛衣就出了门。</p><p class="story-paragraph" data-source-index="772">明石津想自己高考那天也没有今天这样手足无措过，阿姨是不知情的人，没有理由责怪她，只是嘱咐她看好店，什么也来不及解释就匆匆忙忙跑出去跟着凑崎纱夏。凑崎纱夏上楼到客厅的灯亮起也就十分钟，这期间明石津给自己的老板打了电话，名井南的声音听起来比自己镇定多了，电话结束到现在，要不要报警或者冲上去砸门的冲动念头都来了好几次。</p><p class="story-paragraph" data-source-index="774">明石津的注意力全在楼上客厅的灯光，雪花什么时候落下来的，凑崎小姐什么时候下来的都没发现，是听见名井南的喘气声才反应过来。</p><p class="story-paragraph" data-source-index="776">名井南的表现不像电话里那样冷静，气喘嘘嘘的模样用狼狈形容也不为过，走得匆忙，身上的白大褂都没得来及脱掉，却没有忘记将紫色的厚围巾也给带上。明石津看着名井南走向坐在路边长椅的凑崎纱夏，表情还是温温柔柔的笑，看得出来在极力控制，她将围巾套在凑崎小姐的脖子上系了好几圈才开口：【下雪了，要跟我一起看吗？】</p><p class="story-paragraph" data-source-index="778">名井南说话算话。</p><p class="story-paragraph" data-source-index="780">凑崎纱夏想自己真的该去医院了，但眼前的人打扮看起来应该就是医生，她想说我不知道自己怎么了，我一看见你心脏就疼得厉害，哪里都难受，她无法对第一次见面的陌生人说这些话，也害怕对面的人被自己奇怪的话吓地逃跑。凑崎纱夏即使难过也想要待在这个人的身边，所以她只是流着眼泪说：【好，跟你一起看雪。】</p><p class="story-paragraph" data-source-index="782">凑崎纱夏终于听了一次名井南的话。</p><p class="story-paragraph" data-source-index="784">凑崎纱夏看着满天飞雪，脑海里却想着春天，还要下多少场雪才可以到春天，她总觉得春天有什么东西在等着自己，寻找宝藏一样的心情让她雀跃，但是看着旁边的人的脸的时候，心脏又在发疼，揪住围巾也掩饰不了失态。</p><p class="story-paragraph" data-source-index="786">名井南笑着用手捂住凑崎纱夏的眼睛，在亲吻自己手背的时候才落下一颗泪，她说：【不看我就不会痛了，睡一觉，明天又会有太阳。】</p><p class="story-paragraph" data-source-index="788">明石津站在大雪纷飞里看着一动不动地二人，不知道凑崎纱夏倒在名井南肩膀上是晕过去了还是真的睡着了，谁都不忍心打扰现在的宁静，宁静一直维持到父亲开着车过来接人，父亲看着面前的场景什么斥责的话也没说，声音小得像在叹息：【回医院吧。纱夏的情况我会帮忙。】</p><p class="story-paragraph" data-source-index="790">明石津没有跟着上车，举着伞看车子远去的背影，越来越小，最后变得还没有一片雪花大。捡起地上的日记本，翻到最后一页，明石津看了好久，再抬头的时候泪流满面，在人来人往的街道放肆大哭。</p><p class="story-paragraph" data-source-index="792">那一夜的雪是东京几十年来下得最大的一次，商场大屏幕在放映地方台的漫才节目，上面的主持人夸张地形容这场大雪：【势头简直是要淹没东京市呀！我那时候出门还以为世界要重置了，白茫茫一片，真是漂亮又可怕啊。】</p><p class="story-paragraph" data-source-index="794">后来又下了几次雪，但都没有初雪那一场大，仿佛只是为了赶进度，敷衍地掉了几个雪花片，又迎来了春天。</p><p class="story-paragraph" data-source-index="797">因为春天到了吗？我好像喜欢上了一个人。</p><p class="story-paragraph" data-source-index="799">凑崎纱夏路过便利店的时候，看着玻璃反光印出自己的脸，奇怪的心动冒了出来。</p></div>

      <article class="chapter" data-chapter="chapter-05">
        <header class="chapter-header"><span class="chapter-number">05</span><h2>便利店事件之现在进行时</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="805">我叫明石津，我的父亲就是便利店附近医院赫赫有名的脑科医生，按理说我是不需要来兼职的，但是高一的时候我就发现了小说和漫画里的粉色桥段根本就是虚无缥缈和现实严重不符合的故事，即使社团本身也没有什么让我感兴趣的，与其耐着性子参与无聊的社交还不如来便利店，反正都是冲人摆笑脸，这里还有钱可以拿。</p><p class="story-paragraph" data-source-index="807">就是这样现实而又无聊的决定，改变了我的未来三年和大学一年，甚至不止如此。如果重来一次，无论如何，我也绝对不要踏入那家便利店，一定会离那两个漂亮的不得了的女人远远的。</p><p class="story-paragraph" data-source-index="809">其中的一个女人叫凑崎纱夏，说真的，第一次见到她我真的吓了一大跳，因为实在太漂亮了，我不是文科生，只能用简单的【漂亮】来形容了。她是个非常奇怪的女人，比如每天下午都会来我兼职的这家便利店的拐角处鬼鬼祟祟待一会儿，这世界上有个叫监控的东西她不知道吗？</p><p class="story-paragraph" data-source-index="811">从我的同事——45岁八卦欲达到顶峰的一个大妈口中我对她多少有一点了解，此人除了非常明显的美貌以外，还拥有异于常人的能力，尽管这个能力她没有炫耀过。用我的搭档的话来说，就是非常聪明，以及强大的毅力，考幼儿园的老师，或者考别的什么证书，在和职业八竿子打不着关系的跳舞和唱歌等艺术方面也取得过成就，但是从来没有炫耀过，只会炫耀今天多吃了一碗饭这种无聊的事情。</p><p class="story-paragraph" data-source-index="813">大妈的文化水平看来不如我，我翻译一下，凑崎纱夏是拥有异于常人的精神力的人，这样说可能有些中二，但是在我了解了一些她的事情之后除了这个词我找不到其他合适的词了。</p><p class="story-paragraph" data-source-index="815">努力和天赋看起来似乎是有着明显分界线的东西，甚至有些自大狂以为努力这种东西完全不如天赋，但是在日本放眼整个世界，有多少人能真正做到只要确定了目标就可以心无旁鹭地走下去呢？带着一种决绝的勇气往黑暗里踏入，很多人都会犹豫吧，凑崎小姐却绝对不会。如此强大的人周遭都带着云淡风轻的不在意，她在意的东西只有便利店隔壁水果店的新鲜芒果和附近医院的名井南。</p><p class="story-paragraph" data-source-index="817">名井南是另外一个漂亮的女人，是故事的主角，不要质疑说这话是否严谨，我这样说的原因是她比凑崎小姐还要奇怪。</p><p class="story-paragraph" data-source-index="819">名井南是我很崇拜的对象，虽然在为数不多的几次见面中她说话的声音还没有她家宠物狗哼哼的声音大，但是在我考出不及格的分数的时候，我的父亲就会用书本敲着我的脑袋说他曾经的学生名井南多么多么聪明，怎么申请到东京大学的学位，还是在浪费了好几年时光后才进入第一次接触的医疗行业，最后回到自己父亲开的医院附属的研究所工作。奇怪的地方就在这里，研究所的高材生甘愿在我父亲的科室做实习生一样的工作，虽然这位大小姐根本就不差钱，但这样实在大材小用。</p><p class="story-paragraph" data-source-index="821">我过了很久才明白，名井南的所作所为都是为了凑崎小姐。</p><p class="story-paragraph" data-source-index="823">比如在凑崎小姐想要制造便利店偶遇的浪漫戏码，世界上哪有那么巧的事情，每天都能遇见，其实是名井南自投罗网，她每天会掐着时间进入便利店。凑崎小姐没来之前，她几乎没来过我们便利店。也就是说，所有的偶遇啦，邂逅啦，都是名井南一手促成。</p><p class="story-paragraph" data-source-index="825">最后毫无疑问，她俩恋爱了，虽然都是两个女生，不过这和我有什么关系呢？同性恋异性恋谁和谁恋我完全没有兴趣了解，说到底，别人谈恋爱根本和我毫无关系。我的父亲却露出一副便秘一样的纠结的表情，我正想借机对着他说些大道理，结果我还没开口他却问我，【你会和没有未来的人谈恋爱吗？】</p><p class="story-paragraph" data-source-index="827">早就知道内情的父亲守口如瓶，连我也没透漏半分消息，所以我当时对父亲的话嗤之以鼻，凑崎小姐和名井南这样的人怎么可能没有未来，普通人都有明天，她们的明天应该要比偶像剧还要美好。</p><p class="story-paragraph" data-source-index="829">谁知道故事的发展比偶像剧还要扯淡，如果是现在的我对那个时候白痴一样的自己提问的话，我绝对会晃着自己的肩膀大叫：【你会和没有过去的人谈恋爱吗？快点阻止这个奇怪的玩笑啊！】</p><p class="story-paragraph" data-source-index="830">命运对凑崎小姐开了一个极为荒诞的玩笑，以奇怪的方式延续着二人的恋爱故事，这件事我到年底的冬天和第二年的春天的交界点才发现。</p><p class="story-paragraph" data-source-index="832">季节和季节之间的变换是没有地图上地区之间那样明显的分界线的，但是凑崎小姐古怪的【失忆症】却做到了，在那一天，凑崎小姐会忘掉和最心爱的人的有关一切，包括名井南，包括相处的每一天，邂逅的每一个地方，发生的每一件事，甚至也包括我。</p><p class="story-paragraph" data-source-index="835">在我高二那年做了一个人生中最错误的决定，假期结束后我为了买新出的高价篮球鞋选择继续在这里兼职。在一个非常的午后，我遇见了很久没有见过面的凑崎小姐，她指着我的工牌问我：【你叫小津吗？】我工牌上写的是明石津，她却像去年一样自顾自地对着第一次见面的人喊小名，不对不对，我那时候迅速反应过来眼前的事实，但是无法接受：凑崎小姐不认识我了。</p><p class="story-paragraph" data-source-index="837">然后我又目睹着凑崎小姐和名井医生第二次相遇，当时的我还很奇怪，以为自己掉进了时间的漩涡，难道只有我一个人顺着指针逆时针的旋转回到了过去，直到名井医生踏入便利店呼唤我。</p><p class="story-paragraph dialogue" data-source-index="839">【小津，你今年高二吗？】</p><p class="story-paragraph" data-source-index="841">还好还好，我的记忆没出现问题。我发誓以后都不会再看那些漫画书了，不然怎么会把自己心里的中二想法直接问出来，不过名井南的回答和科幻小说也没什么大区别了，她向我解释了来龙去脉，然后又问我为什么还在这里兼职，看着她希翼的眼神我想她应该想听见【因为和你们是朋友】这样的回答，我清了清嗓子；【因为我要买新球鞋，你的抠门老师不给我钱。】</p><p class="story-paragraph" data-source-index="843">父亲是名井南的老师，在这层关系上之前我都喊名井南姐姐。</p><p class="story-paragraph" data-source-index="845">名井小姐沉默了很久，再抬头说出来的话让我更是吓一跳：【你在这里做了一年都不知道老板是谁吗？】</p><p class="story-paragraph" data-source-index="847">从那之后改口喊名井南老板，成为她的忠诚的狗腿子，毕竟她掌握着我能否买新鞋子的生死大权。</p><p class="story-paragraph" data-source-index="849">在今天之前我只在意给我发工资的店长，知道这家店的老板就是眼前的名井医生的时候我想要叫出来，在她说要给我涨工资的时候我这样做了，虽然涨工资的条件是不可以对纱夏说出真相。</p><p class="story-paragraph" data-source-index="851">我对此并不太在意，难道重来一次纱夏还会走上那条老路吗？概率这种东西一旦出现就会产生无数种可能，连最厉害的数学家也很难对这种事情得到确定的数值，谁能保证纱夏不会选择其他的道路。无论什么事情，【时机】是非常重要的，说的再极端一点，时机晚了零点几秒，【命运】的交叉线变成平行线都有可能。</p><p class="story-paragraph" data-source-index="853">现实点看待问题，谁能保证这一次我老板还是凑崎小姐最爱的人，如果无法逃脱命运这个可笑的玩笑的话，我即使泄密也无所谓啊，反正明年凑崎小姐又会忘记。</p><p class="story-paragraph" data-source-index="855">我当时是多么无知，才会生出这样残忍的念头，用会拿别人的悲伤当下酒菜的混蛋这类说法形容那时候的我也不为过。</p><p class="story-paragraph" data-source-index="857">名井南临走的时候对我说了很轻的一句话，混合着叹息，我如果听力再差一点绝对听见清，不过好在我听清了，并且很确定，她对我说了【对不起】</p><p class="story-paragraph" data-source-index="859">那个短暂的午后我接受的信息却是巨大而又难以参透的，看起来很多余的保密，莫名其妙的道歉，我花了很久才弄懂其中真正的含义。在我弄懂的时候我忍不住猜测我老板的想法，回忆往日种种，想起老板和自己说话的那个午后，我这个油盐不进的人，那一刻差点想哭。</p><p class="story-paragraph" data-source-index="861">第二年凑崎小姐又爱上了名井南，在年末的冬天忘记我和名井南。</p><p class="story-paragraph" data-source-index="863">第三年重复。</p><p class="story-paragraph" data-source-index="865">第四年我升了大学，但是不放心这两个人，还是在没课的时候回便利店，甚至因为大学课程的设置，我回来的更加频繁了。我当时已经不需要新鞋子了，不知道是什么驱使我往返于市区的电车，可能我继承了父亲的心软，也可能我看过太多次我老板和凑崎小姐伤心的样子。</p><p class="story-paragraph" data-source-index="867">这一年凑崎小姐又爱上了名井南，在年末的冬天忘记我和名井南。</p><p class="story-paragraph" data-source-index="869">其实我在凑崎小姐第二次把我忘记的时候就已经发现自己是一个多么脆弱的人，也明白了去年名井医生为什么会对我说对不起。不久前见面还可以笑着交流的朋友在某个平常的一天问自己是谁，简直是每一年都在经历一次失去的痛苦，名井南一定要比还我深刻地体会到其中的痛苦，所以才会在那天对我道歉。</p><p class="story-paragraph" data-source-index="871">我想到这里心脏便若隐若现地察觉到痛感，我选择留下来，就当因为我老板每年都在给我涨工资吧。</p><p class="story-paragraph" data-source-index="873">刚学会走路的孩子会对世界充满好奇，比如熊熊燃烧的火焰，那是多么可怕又美丽的事物，即使大人劝诫，责骂，甚至打一顿，也还是有叛逆的孩子去触碰，不过在体验到烧灼的痛苦后绝对不会有孩子会主动去触碰明火了，甚至因为疼痛的阴影对火焰避之不及。</p><p class="story-paragraph" data-source-index="875">趋利避害是每一个生物的本能啊，但是也算是医生的我老板却违背了这个基因本能，那么痛苦的事情体验了好多次，来年的春天依旧义无反顾地和凑崎小姐相恋。</p><p class="story-paragraph" data-source-index="877">这样看来，我比小孩子还要笨，第二笨的人是我。我那时候的中二病因为年龄的增长减缓了很多，虽然遇见了小说才有的情节，但是反而坚定了自己是个普通人的认知，并且为这种认知而庆幸。其实我们大家都是很普通的人啊，没有想象中的好也没有想象中的坏，对名井医生和凑崎小姐的故事难过所以想力所能及帮帮她，再贱的人也有为别人着想的时候吧。</p><p class="story-paragraph" data-source-index="879">助人为乐其实没什么大不了的，举手之劳而已，只是我付出的代价有点大，我陪着老板的时候也会伤心啦，我就像个大扑棱蛾子跟着我老板一起往火坑里扑，不对，我最多算扑电灯泡，死不了的。</p><p class="story-paragraph" data-source-index="881">我老板不一定。</p><p class="story-paragraph" data-source-index="883">患了【阿尔兹海默症】的病人的家属有时候也会去我父亲的办公室咨询问题，怎么形容这种病呢？就像有个人拿橡皮擦一点点擦去脑海里的记忆一样，那些和朋友家人的经历只有对方才记得，在这种病的影响下，记忆和个人的幻想有什么区别呢？有些重感情的人会对患这种病的身边人花费巨大精力，但是效果却微乎其微，花了一百天喋喋不休讲过去的事情，病人可能只有五分钟想起来。</p><p class="story-paragraph" data-source-index="885">怎么看，投资和回报都不成比例，但是我老板不在乎这些，她花费的时间更久，至少有四年，这还不算我来便利店之前的时间，我不了解，也没人愿意多说，我就不提了。</p><p class="story-paragraph" data-source-index="887">凑崎小姐的病像是【阿尔兹海默症】的分支。百分之百会遗忘爱人的概率让她的恋爱好像只能以不好的结局收场，虽然每次收场的人都是名井南。</p><p class="story-paragraph" data-source-index="889">虽然考卷的内容一样，但是给出凑崎小姐出的是的概率问题。</p><p class="story-paragraph" data-source-index="891">故事的最后百分之百是凑崎小姐消失的记忆为结尾，能否开始则有百分之五十的概率，这取决于凑崎小姐会不会在春日的某一天对着名井南微笑。</p><p class="story-paragraph" data-source-index="893">给我老板出的是判断问题，谁知道她作弊改题目，把题目改成了【yes or yes】的死题。</p><p class="story-paragraph" data-source-index="895">只要一个确定的信号，我老板会走完剩下的所有路程，尽管我们所有人都知道那条路有多么苦多么累，她也绝对不扭头。</p><p class="story-paragraph" data-source-index="897">有时候真觉得名井南是个固执的笨蛋，虽然她是我老板，但是毫不偏颇地说句公道话：她绝对不是那种偏执的变态，非要得到凑崎小姐。如果凑崎小姐对她视而不见，转头爱上别人，我想我老板也绝对不会踏入凑崎小姐的生活，她自讨苦吃的前提是凑崎小姐会爱上她。</p><p class="story-paragraph" data-source-index="899">在命运的捉弄下，这个故事以一种非常奇怪的形式在继续。这种简单的思维在我父亲问我为什么还要去那里兼职的时候不攻自破了，时间不是小偷啊，所有的不幸都怪罪到命运头上好像也不合理，命运布置在海面上的漩涡明显又庞大，避开就可以了。</p><p class="story-paragraph" data-source-index="901">名井南避开就可以了，可是她不愿意。</p><p class="story-paragraph" data-source-index="903">凑崎小姐的情况看起来的确无药可救，但是主导的人不是她呀，她只是一个每年都会重置记忆的可怜的人，难道凑崎纱夏爱上名井南是一种错误？这实在说不过去吧，没有哪条法律有这样的规定。</p><p class="story-paragraph" data-source-index="905">谁都没有错，我们大家都陷在了漩涡里，无辜的我想要脱身很简单，但是我却在大一的时候做了一件很多余的事。因为突飞猛涨的个子让凑崎小姐再也无法对着初次见面的“陌生人”喊小津了，所以我把自己工牌的名字从“明石津”改成了“小津”，在她计划着来这里偶遇名井医生的前几分钟给戴好。</p><p class="story-paragraph" data-source-index="907">说我是过于犹豫也好，说我优柔寡断也罢，我的确把凑崎纱夏和名井小姐当作了朋友，退一步说，就算不是朋友，我也于心不忍。</p><p class="story-paragraph" data-source-index="909">名井医生其实很孤独，不要笑话我随意猜测别人的心情，外人看来名井南这样的富家千金，名牌大学毕业的高等生，前途无限啊，怎样看都和痛苦沾不上边吧，不过痛苦和幸福这两种决然不同的事物有一个共同点。</p><p class="story-paragraph" data-source-index="911">世界上的痛苦和幸福都是没有等级的，痛苦就是痛苦，会让人流泪，幸福也就是幸福，会让人大笑，多么微不足道的事都可能引起这样的情绪。比如名井南会因为一朵枯萎的花感到难过，也会因为凑崎小姐的笑容而开心。</p><p class="story-paragraph" data-source-index="913">作为被凑崎小姐遗忘对象之一的我，在冬日的那一天是唯一可以有一点共鸣的，也是唯一一个可以听名井南倾诉的人吧，虽然她每次什么也不说，就坐在老位置喝着饮料，什么也不做，盯着外面，看的看的流下眼泪。我很有眼色的以各种借口赶走每一个想在便利店多呆一会的客人。</p><p class="story-paragraph" data-source-index="915">有一次我去医院找我父亲，正好遇见她，她看起来十分正常，耐心地跟病人说着注意事项，脸上还在笑呢，眼泪就直接流下来，把对面的病人吓了一大跳。我当时看见她那模样差点也哭出来，原来名井南无时无刻都在悲伤，只是这种悲伤持续的时间太久，她已经能够很好地伪装自己，但是刻意忽略的事情会在某个非常平常的时刻毫无征兆地泄露出来，没有任何征兆。</p><p class="story-paragraph" data-source-index="922">另外一个我愿意继续这样下去的原因是凑崎小姐的笔记本，她的四本笔记本几乎都是相同的内容。</p><p class="story-paragraph" data-source-index="924">前面是写着21天攻略的内容，就最开头几页有详细的计划，后面就是一些“小南医生好可爱哦”，“好想名井南”，“好喜欢名井南”，这种简单直白的话。</p><p class="story-paragraph" data-source-index="926">哎呦，真是的，无论是谁陷入爱情看起来都像个笨蛋啊，凑崎纱夏，名井南，都不例外。</p><p class="story-paragraph" data-source-index="928">再后面就是她和我老板的一些琐碎记录，那几页被撕下来了，痕迹还没清理干净，我把那几页装订好给了我老板，她在凑崎小姐搬进她家的时候再寄给我，免得被发现。</p><p class="story-paragraph" data-source-index="930">我之前的描述好像她俩是笨蛋一样，其实两个人都是谨慎的不得了的人，除了我父亲最清楚这个【失忆症】的规则的人就是我老板，所以她基本不和凑崎小姐去别的地方，她担心万一某个地方留下了不错的回忆或者认识了有趣的人，最后凑崎小姐因为她给忘记就很可惜了。</p><p class="story-paragraph" data-source-index="932">我听完这话低着头翻白眼，什么意思，忘记我就不可惜了。</p><p class="story-paragraph" data-source-index="934">不过我还以为我老板是怕麻烦才那样做，没想到答案出乎意料，不过也是，在凑崎纱夏面前，什么事名井南都不怕麻烦，她只担心凑崎纱夏伤心，担心别人伤心。</p><p class="story-paragraph" data-source-index="936">我老板这个人，真的很好啊。</p><p class="story-paragraph" data-source-index="938">之后是日记的后半本，凑崎小姐开始察觉到不对劲了，她那时候刚体会到失忆症的可怕该多么害怕呀，却谁也不能说，装着样子和名井医生分手，然后来便利店的角落偷偷哭。</p><p class="story-paragraph" data-source-index="940">凑崎小姐经常对着别人笑，我不知道她是不是每次都开心，基本没看她哭过，在别人察觉前她就会背过身子，我知道她哭是因为她每次都坐在监控下面哭。</p><p class="story-paragraph" data-source-index="942">我等她平稳了一点装模作样问她怎么了，如果能转移她一点点的注意力我也会满足的，无论凑崎小姐还是我老板，包括我之内的每一个人都尽最大力度地帮助她们，可是有什么用，我们也是命运的产物。</p><p class="story-paragraph" data-source-index="944">闲聊的时候凑崎小姐给了我好多钱（夸张说法，反正是可以买很多瓶西柚茶的钱），让我请名井南喝茶，提醒她多喝水，说完这些就不理我了，一个人坐那里哭，像小学生背书一样一直翻着这本笔记本，这本本子都是她和名井南的故事，她想再多看几眼吧。</p><p class="story-paragraph" data-source-index="946">我把零钱和笔记本一起放在一起，这笔钱根本没有用武之地，凑崎小姐不来这里的话，名井医生也不会来。</p><p class="story-paragraph" data-source-index="948">笔记最后一页的两面是完全相反的内容,正面写着:凑崎纱夏最喜欢名井南了，绝对不可以忘记她。背面的内容是：不可以认识——，不可以爱上——，含糊的话语字迹都不太清晰，写字的主人当时该有多么痛苦呢？我无法想象，凑崎小姐在结尾一定是明白再次相遇自己也还是会爱上我老板了吧，那个时候，她可能已经忘记【名井南】的名字了，所以空着没有写。</p><p class="story-paragraph" data-source-index="950">今年的事情是个意外，那个善良的喜欢多管闲事的大妈嘴跟机关枪一样，微小的火苗她都能点起一场大火，她一下子把我和老板拼命隐藏好久的秘密一下抖落出来了，豪气的模样像超市打折日抢到了高级牛排。可是这不是她的错，她不怎么来便利店，算是故事里最边缘的角色了。</p><p class="story-paragraph" data-source-index="952">说来说去都怪我父亲，为什么要让我去送便当！</p><p class="story-paragraph" data-source-index="954">我写了一大堆，恨不得把每个人都骂一遍，可是写到这里，我彻底失望了，真的谁的错都没有啊，是命运在戏弄我们每个人，命运真是了不起的玩意，呵呵。</p><p class="story-paragraph" data-source-index="956">我再回忆父亲当初的问题，其实和我的并不矛盾，一个并列命题就可以概括所有：凑崎纱夏和名井南的故事既没有过去，也没有未来。</p><p class="story-paragraph" data-source-index="958">我们的问题不能成立，因为主角不是我们，是名井南和凑崎纱夏，她们没有选择的余地，只能接受不可改变的公式命题。</p><p class="story-paragraph" data-source-index="960">靠近黑洞的时候时间会停止，其实有个地方的时间也停止了，就是我兼职的便利店。</p><p class="story-paragraph" data-source-index="962">明石津写了罗里吧嗦毫无逻辑的一大堆话，擦擦眼泪，将随笔和凑崎纱夏的四本日记本放在了一处，出房间的时候父亲还在玄关处。</p><p class="story-paragraph dialogue" data-source-index="964">【你要去医院吗？不用等我这么久的。】</p><p class="story-paragraph dialogue" data-source-index="965">【没关系的，反正我们目的地差不多，顺路而已。】</p></div>
      </article>
    </template></div>
  <script>
    (() => {
      const chapterIds = ['chapter-foreword', 'chapter-01', 'chapter-02', 'chapter-03', 'chapter-04', 'chapter-05'];
      const chapterTitles = ['Foreword', '二十一天', '昨日流水', '浦岛太郎', '四个春天', '便利店事件之现在进行时'];
      const select = document.getElementById('chapter-select');
      const mount = document.getElementById('chapter-mount');
      const shell = document.getElementById('reader-shell');
      const progress = document.getElementById('reading-progress');
      const controls = { prev:[document.getElementById('prev-top'),document.getElementById('prev-bottom')], next:[document.getElementById('next-top'),document.getElementById('next-bottom')] };
      let current = 0;
      const indexFromHash = () => { const index=chapterIds.indexOf(location.hash.slice(1)); return index<0?0:index; };
      function render(index,pushHash=true,scroll=true) {
        current=Math.max(0,Math.min(chapterIds.length-1,index));
        const id=chapterIds[current];
        mount.replaceChildren(document.getElementById(id).content.cloneNode(true));
        select.value=id;
        controls.prev.forEach(button=>button.disabled=current===0);
        controls.next.forEach(button=>button.disabled=current===chapterIds.length-1);
        document.getElementById('prev-label').textContent=current?chapterTitles[current-1]:'已经是序章';
        document.getElementById('next-label').textContent=current<chapterIds.length-1?chapterTitles[current+1]:'全文完';
        document.title=`四个春天 · ${chapterTitles[current]}`;
        if(pushHash&&location.hash!==`#${id}`) history.pushState(null,'',`#${id}`);
        if(scroll) shell.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
        updateProgress();
      }
      function move(delta) { render(current+delta); }
      select.addEventListener('change',()=>render(chapterIds.indexOf(select.value)));
      controls.prev.forEach(button=>button.addEventListener('click',()=>move(-1)));
      controls.next.forEach(button=>button.addEventListener('click',()=>move(1)));
      addEventListener('popstate',()=>render(indexFromHash(),false));
      function updateProgress() { const root=document.documentElement; const max=root.scrollHeight-innerHeight; progress.style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`; }
      addEventListener('scroll',updateProgress,{passive:true});
      addEventListener('resize',updateProgress,{passive:true});
      render(indexFromHash(),false,false);
    })();
  </script>
