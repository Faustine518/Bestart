  <div hidden id="chapter-templates"><template id="chapter-01">
      <article class="chapter" data-chapter="01">
        <header class="chapter-header"><span class="chapter-number">01</span><h2>真烦人</h2></header>
        <div class="story-body"><p class="opening-note" data-source-index="1">——分手之后憎恨埋怨着对方却没有一刻停止过喜欢彼此的我们</p><p class="story-paragraph dialogue" data-source-index="7">“真烦人”</p><p class="story-paragraph" data-source-index="10">小声嘟囔着，却很刻意，分明知道对面的人能听到。知珉有些烦躁的捏紧手里的报告，眼睛不想在面前的人身上多停留半秒</p><p class="story-paragraph dialogue" data-source-index="13">“说真的，两个专业之间有什么必然联系吗？为什么非要一起做这个项目？”</p><p class="story-paragraph" data-source-index="16">和暴躁的知珉相比，金旼炡显得泰然自若的多，慢条斯理的把手里的材料递给她，“导师是这样说的，前辈有什么意见的话可以再请求，我都可以”</p><p class="story-paragraph" data-source-index="19">烦死了</p><p class="story-paragraph" data-source-index="22">刘知珉最终皱着眉头接过了材料，高跟鞋哒哒哒大力踩在地板上。她甩上了门，也许并不礼貌，但，没有人会和前女友讲礼貌，就算那个人是金旼炡也没道理</p><p class="story-paragraph" data-source-index="25">虽然不想承认，但她不是因为这个生气的</p><p class="story-paragraph" data-source-index="28">前辈……</p><p class="story-paragraph" data-source-index="31">知珉发出急促的短笑，还真是金旼炡，把一切事都做的这么完美，让人连挑剔的理由都没有</p></div>
      </article>
    </template><template id="chapter-02">
      <article class="chapter" data-chapter="02">
        <header class="chapter-header"><span class="chapter-number">02</span><h2>前女友</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="41">三明治、冰美式……要不要拿些可颂面包？</p><p class="story-paragraph dialogue" data-source-index="44">“你最近胃口有变好啊？”绘里拿着托盘站在她身后，上下打量着她，“你遇见什么好事了？”</p><p class="story-paragraph" data-source-index="47">好事？她什么好事也没遇见，纯粹是饿的。刘知珉承认自己有较真的成分在，但她也完全没想到金旼炡真的就因为那三言两语的挑剔拉着自己加了一个晚上的班</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph dialogue" data-source-index="51">“那我能说她其实没做错吗？”，知珉愤愤的捶了一下桌子，仍旧有些无精打采，“我难道要输给前女友吗？”</p><p class="story-paragraph dialogue" data-source-index="54">“别小肚鸡肠了”，绘里大笑起来，甚至想把刘知珉这幅颓废的样子拍下来放到校园网上，让全世界都知道刘知珉报复不成反而被精力充沛年下前女友拉着做了一晚上数据</p><p class="story-paragraph dialogue" data-source-index="57">“真是搞笑了，还以为你是被甩的那一个，她不是在报复你吗？”</p><p class="story-paragraph dialogue" data-source-index="60">“谁知道……”</p><p class="story-paragraph dialogue" data-source-index="63">“但是，说真的，你们确定不会再和好了吗？”</p><p class="story-paragraph" data-source-index="65">空气一下子凝固起来，刘知珉埋头扒拉着盘子，叉子偶尔碰到瓷盘发出的声响变成了两个之间全部的声音</p><p class="story-paragraph" data-source-index="68">绘里识趣的没再问，把餐巾纸递给她，“快擦擦你的眼泪，别丢人了”</p><p class="story-paragraph" data-source-index="71">刘知珉慌张的抬手，摸到脸上，脸颊上还是干爽的，意识到自己被耍了，恶狠狠的瞪她一眼，拍开了面前的手</p><p class="story-paragraph dialogue" data-source-index="74">“你管我呢”</p></div>
      </article>
    </template><template id="chapter-03">
      <article class="chapter" data-chapter="03">
        <header class="chapter-header"><span class="chapter-number">03</span><h2>没关系</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="83">和前女友一起共事的感觉是什么样的？现在可以回答了，除了让人难以忍受的想爆发怒火之外再也没有其他情绪——这是知珉和金旼炡一起做数据之后的第三个工作日得出来的结论</p><p class="story-paragraph" data-source-index="86">确实不合拍，争吵似乎一触即发，在知珉看来她是在报复，不论在哪个方面都在咄咄逼人</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph dialogue" data-source-index="90">“呀，有必要这样吗？经济学的东西我要比你清楚吧，做好数据就好了啊”，在金旼炡第四次打断自己的发言之后，知珉冷下脸，隔着会议桌冲她发脾气</p><p class="story-paragraph dialogue" data-source-index="93">“…虽然是被请来做数据支持，但自己的想法不能说吗？……前辈”</p><p class="story-paragraph" data-source-index="96">最后两个字咬的很重，一字一顿，怎么听都像是在挑衅，刘知珉最终抿上嘴唇，把草稿扔在桌子上，夺门而出</p><p class="story-paragraph" data-source-index="99">站在工作角度来讲，她既不专业也不成熟，把个人情绪带到工作里是她的问题。可那家伙难道就一点错也没有了吗？说好公事公办，却一个劲的刁难自己</p><p class="story-paragraph" data-source-index="102">知珉靠在休息室的玻璃门后，急促的喘着气，说实话，她还没做好准备，和金旼炡以前后辈的关系相处。那张冷漠的脸只要一想起来就会感到委屈，她喉咙有些酸涩，眉头紧皱着</p><p class="story-paragraph" data-source-index="105">绝对不能流泪。只能这样告诉自己</p><p class="story-paragraph" data-source-index="108">大概十来分钟的时间，休息室的门被推开，同个小组的崔正浩拿着咖啡走进来，有些不好意思的露出笑容，欲言又止</p><p class="story-paragraph dialogue" data-source-index="111">“那个……你心情还好吗？”，他把咖啡放到桌子上，“旼炡是后辈，可能…说话有些莽撞，别放在心上”</p><p class="story-paragraph" data-source-index="114">知珉的眼尾有些红晕，莫名的吸引人，她挤出笑脸，尽可能的维持着端庄，“我知道，是我的问题，我太敏感了”</p><p class="story-paragraph" data-source-index="117">金旼炡当然不是莽撞的人，她比任何人都内敛沉稳，如果说她变成这样是因为被我给甩了，这位会是什么表情，这样想着觉得应该是十分有趣的场景</p><p class="story-paragraph" data-source-index="120">知珉盯着他有些走神，漂亮的脸蛋让人很难移开视线，崔正浩不由自主的脸颊发烫，不好意思的挠挠头</p><p class="story-paragraph dialogue" data-source-index="123">“没有…知珉…也…做的很不错”，试探性的说了平语，他小心翼翼的开始观察她的表情</p><p class="story-paragraph" data-source-index="126">门口突然传来了很大的动静，视线被集中到声音的来源地，门口出现了一个瘦小的身影，戴着鸭舌帽的脸被遮住了一半，看不清她脸上的表情。刚才还在会议室的金旼炡不知道什么时候背着书包来了这，背包里的电脑撞到玻璃门发出巨响，一瞬间有些尴尬</p><p class="story-paragraph dialogue" data-source-index="129">“啊…不好意思，打扰到你们了吗？”</p><p class="story-paragraph" data-source-index="132">虽然是道歉的话，但无论是语气和表情都是一副无所谓的样子。不知道是不是错觉，总觉得金旼炡的眼神里的寒意很重，凉飕飕的视线瞥向知珉面前的崔正浩身上</p><p class="story-paragraph" data-source-index="135">刘知珉深吸一口气，她决定不再和金旼炡有任何争吵。和正浩说过之后，知珉笑着拿起咖啡越过了金旼炡，经过她身边的时候却被拉住了手腕，知珉一下子浑身僵硬起来</p><p class="story-paragraph dialogue" data-source-index="138">“我能和知珉前辈单独说吗？”，她有意无意的瞟向崔正浩</p><p class="story-paragraph" data-source-index="141">他显然也意识到旼炡在暗示些什么，有些尴尬的对着知珉笑了笑，在刘知珉点头之后走了出去，关门前还不放心的说了不要吵架</p><p class="story-paragraph" data-source-index="144">旼炡的情绪并不能显而易见的看出来，她把肩膀上的书包扔到沙发上，仍旧是那副淡漠的神情</p><p class="story-paragraph dialogue" data-source-index="147">“不是有话说？”，知珉眼睁睁看着金旼炡拿过她手上的咖啡喝进了自己的胃里，对她的态度有些不爽</p><p class="story-paragraph dialogue" data-source-index="150">“…嗯，中午饭吃了吗？”</p><p class="story-paragraph dialogue" data-source-index="153">“没有，就问这个？”</p><p class="story-paragraph dialogue" data-source-index="156">“一会要一起去吗？”</p><p class="story-paragraph dialogue" data-source-index="159">“别扯开话题，现在是那种关系吗？”知珉没由来的烦躁，好像两个人之间的关系看起来只有自己在苦恼</p><p class="story-paragraph dialogue" data-source-index="162">“前后辈那样也不行？正浩哥不是也和你一起吃吗？”</p><p class="story-paragraph" data-source-index="165">正浩哥……注意力全被这亲昵的称呼吸引走了，不自觉的有些嫉妒。不是喊我前辈吗？对别人是可以喊哥哥的关系了吗？明明认识才不过一个月</p><p class="story-paragraph dialogue" data-source-index="168">“那是别人的事”</p><p class="story-paragraph dialogue" data-source-index="171">“好，那说我们的事”，金旼炡把咖啡重新放在桌子上，“正浩哥喜欢你”</p><p class="story-paragraph" data-source-index="174">甚至不是疑问句，她直接斩钉截铁的说了这句话，金旼炡一直都这样，性格方面一直都不加掩饰，现在也如此。难以形容那时的情绪，既庆幸又不安，大概是这样</p><p class="story-paragraph" data-source-index="177">知珉迟愣了许久，声音沉下来，“和你没关系”。已经尽量让自己看起来冷静，脑海里却想起金旼炡过去因为嫉妒抓着自己手腕接吻的样子，差点因为这些回忆流下眼泪</p><p class="story-paragraph dialogue" data-source-index="180">“没关系？”，金旼炡再次这样问，“是你以为的没关系吗？”</p><p class="story-paragraph" data-source-index="183">金旼炡抬起头，棒球帽的阴影打在她脸上，却足以看清她有些泛红的眼眶，她一步一步朝着知珉逼近，声音有些发颤</p><p class="story-paragraph dialogue" data-source-index="186">“刘知珉，你喜欢别人了吗？”话说到一半突然哽住，旼炡咬住了下唇，却固执的看着她，更像是质问</p><p class="story-paragraph" data-source-index="189">因为这些话变得恼羞成怒，知珉恶狠狠瞪她，却在看到旼炡有些颤动的瞳孔心跳滞涩。知珉推开她的肩膀，分明没有用力，旼炡却踉跄着向后退了两步</p><p class="story-paragraph dialogue" data-source-index="192">“少管别人的事”</p><p class="story-paragraph" data-source-index="195">知珉逃跑一样的大跨步推开门走了出去。还是轻易的就感到了疲惫，她们之间总是在这种问题上牵扯不清，问那种问题，比说自己烦人还让人感到委屈，怎么能那么侮辱别人，问是不是喜欢上别人了……如果真的能轻易做到就好了</p></div>
      </article>

      <article class="chapter" data-chapter="04">
        <header class="chapter-header"><span class="chapter-number">04</span><h2>隐瞒者</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="207">不知道是哪里出了问题</p><p class="story-paragraph" data-source-index="210">就算分手已经有一段日子却还是想不清楚。差不多已经适应一个人的日子的时候却接到了这个项目通知，金旼炡对于这种吃力不讨好的工作并没有太大兴趣，但在看到名单里刘知珉的名字的时候却立刻改变了主意</p><p class="story-paragraph" data-source-index="213">有很长一段时间都在怨恨她，在见到她之前满脑子都在想着如何如何让她感到难堪，在发觉崔正浩对刘知珉有好感之前也没有改变过主意</p><p class="story-paragraph" data-source-index="216">金旼炡一向很相信那个人的吸引力</p><p class="story-paragraph" data-source-index="219">刘知珉确实是那样的人，即使没有了旼炡也会立刻就能找到下一任那种十分有魅力的女人。但旼炡也承认她太嫉妒了，在第一次看到崔正浩对知珉露出那样的表情的时候就爆发了妒火</p><p class="story-paragraph" data-source-index="222">她不常去为了项目活动特意租住的会议室，人很多，认识的人却没有几个，人际交往并不是她熟悉的领域，和刘知珉的矛盾曝光之后好像就更少有人来找自己交谈，毕竟大家都更喜欢善解人意又漂亮十足的知珉</p><p class="story-paragraph" data-source-index="225">熬夜到深夜的时候大家会聚在一起吃东西，饭桌上的话一旦多起来旼炡就会变得没胃口，吃两口就觉得胃胀，于是放下外卖挪动到沙发上</p><p class="story-paragraph" data-source-index="228">也可能和情绪有关系</p><p class="story-paragraph" data-source-index="231">刘知珉总笑，笑声在她耳朵里格外刺耳。旼炡冷眼看向被围起来的她</p><p class="story-paragraph" data-source-index="234">不愧是经济管理学院最有人气的姐姐啊，即使熬夜素颜也那么好看。旼炡莫名的感到难受，无论是哪个地方</p><p class="story-paragraph" data-source-index="237">和我约会的时候也很漂亮，每次都很漂亮。想到这些人可能没有见过心情才好了一点</p><p class="story-paragraph dialogue" data-source-index="240">“旼炡啊，不过来再吃一点吗？”</p><p class="story-paragraph" data-source-index="243">和自己一起过来的同期招呼了自己，脑袋扭过来。旼炡挤出笑，刻意忽视和同期一起看过的刘知珉的视线</p><p class="story-paragraph dialogue" data-source-index="246">“吃饱了，我不太想吃了”</p><p class="story-paragraph dialogue" data-source-index="249">“消食药我放在书包里”知珉低着头，就像说出一件无足轻重的小事，连看都没看旼炡一眼</p><p class="story-paragraph" data-source-index="252">也许是自尊心作祟</p><p class="story-paragraph dialogue" data-source-index="255">“不用，我先回家了”</p><p class="story-paragraph" data-source-index="258">人生中几乎所有的失控都来源于她。我真的很讨厌刘知珉</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="262">肚子疼的让她甚至流起冷汗，蜷缩起来也得不到缓解，整个人都埋在沙发里，最后也不知道是疼晕过去还是睡着了，总之没了意识，再醒过来的时候天已经完全黑了下来</p><p class="story-paragraph" data-source-index="265">旼炡缓慢的坐起来，长时间的睡眠让她有点头脑发晕，保持着呆坐的姿势很久才迟钝的拿起桌子上的手机</p><p class="story-paragraph" data-source-index="268">因为静音手机上的电话消息一个也没看见，打开才发现前辈和同组的学生在不断问自己要昨天的数据分析报告</p><p class="story-paragraph" data-source-index="271">她站起来，肚子只剩一些微弱的疼，但依旧有些无力，腰部也存留着一些酸软。旼炡摸黑找到房间的灯，冰冷的手摸上去，径直走进了卧室</p><p class="story-paragraph" data-source-index="274">从床头柜拿到报告之后才清清嗓子给前辈打去了电话</p><p class="story-paragraph dialogue" data-source-index="277">“前辈…抱歉，我休息的时候手机静音了，报告在我这里，需要我送过去吗？”</p><p class="story-paragraph dialogue" data-source-index="280">“啊…你没事…已经有人去找你了”</p><p class="story-paragraph dialogue" data-source-index="283">“嗯？”旼炡的眉毛皱起来，她不是很喜欢不熟的人来自己家，觉得很麻烦。更何况谁知道她家里的住址呢？</p><p class="story-paragraph" data-source-index="286">敲门声穿过客厅飘进她的耳朵，她心跳停滞了一下</p><p class="story-paragraph dialogue" data-source-index="289">“知珉过去了，听说你不接电话有点急……她说知道你家在哪……应该…”</p><p class="story-paragraph" data-source-index="292">电话里的人声逐渐变得模糊不清，她现在只能听的到那阵急促的敲门声</p><p class="story-paragraph" data-source-index="295">在担心我吗？</p><p class="story-paragraph" data-source-index="298">金旼炡马上挂断了电话，走路时的双腿都有些打颤。她拉开了门，熟悉的脸出现在面前，似乎很着急的跑过来，知珉不断喘着气</p><p class="story-paragraph dialogue" data-source-index="301">“你没事吗？”</p><p class="story-paragraph" data-source-index="304">分手之后，我总是生病，大多数的时候都是一个人难受着过来的。我的性格使然，不会轻易暴露自己的脆弱，所以即使疼到快要忍受不了也不会告诉任何一个人。可我分手之前不是这样度过的，刘知珉总是那么细心，就算我什么都不说也会亲亲我的额头，会为我冲好药剂，在我发脾气闹别扭的时候不厌其烦的哄着我</p><p class="story-paragraph" data-source-index="307">已经隔了那么久，我似乎仍旧适应不了没有刘知珉的生活，我太讨厌这样的落差感了</p><p class="story-paragraph" data-source-index="310">金旼炡低下了头，死死咬住了嘴唇，她害怕不小心会哭出来，她仍旧那样，虽然想告诉刘知珉自己不太好，可还是装作什么都没发生过一样摇了摇头</p><p class="story-paragraph" data-source-index="313">报告被僵硬的胳膊递过去，知珉却没了动作，等金旼炡再抬头却看见刘知珉眼周的红晕</p><p class="story-paragraph dialogue" data-source-index="316">“能别总让人担心吗？金旼炡你不是孩子了！！为什么一点都没变！！”</p><p class="story-paragraph" data-source-index="319">有些失控的音量在旼炡耳朵里变得极其刺耳，也许刘知珉说的没错，她自始至终都是个幼稚的孩子，就像现在，甚至连别人发脾气都觉得难以接受</p><p class="story-paragraph dialogue" data-source-index="322">“不是你说不要管别人的事吗？”，报告被旼炡攥紧，她却往后退了一步，“凭什么现在来指责我？”</p><p class="story-paragraph" data-source-index="325">耳边逐渐嗡嗡作响，知珉似乎执意不肯让着她，“不舒服难道不能告诉别人吗？如果你真的告诉我我会不管你吗？！！”</p><p class="story-paragraph dialogue" data-source-index="328">“我让你来你就来？不是说已经分手没关系了吗？”</p><p class="story-paragraph dialogue" data-source-index="331">“你现在要计较这些是吗？”</p><p class="story-paragraph dialogue" data-source-index="334">“你凭什么这么说？！！”</p><p class="story-paragraph" data-source-index="337">旼炡眼眶滚烫起来，用力抓住了知珉的手腕，把她往屋子立马扯，“我在斤斤计较吗？？是我在做错事吗？？难道一直以来不都是我一个人在辛苦忍受着吗？？”</p><p class="story-paragraph" data-source-index="340">我们第一次爆发了争吵，认识这么久以来，我们没有对彼此说过任何过分的话，哪怕是分手那天都是温和的结束的</p><p class="story-paragraph" data-source-index="343">明明是去约会，却被提了分手。看着心爱的人在自己面前哭的一塌糊涂，我愧疚到连挽留她的底气都没有了，我是什么时候让她感到这样受伤的呢？事情是什么时候开始变的不对劲的呢？</p><p class="story-paragraph" data-source-index="346">我浑身都颤抖起来，眼前雾蒙蒙一片，知珉姐姐在哭，我爱的人正在因为我受苦，我能做的，也是那时候唯一能做的………我拼命忍住满腔的哽咽，告诉自己不能再做错的事，我点头，没有说任何话，看着她慢慢从大哭到止住眼泪，疲倦的脸上对我似乎没有了留恋……</p><p class="story-paragraph" data-source-index="349">一直到那个熟悉的影子消失在我面前，我才崩溃着站起来，慌张的手足无措，我没法付钱，不知道该怎么和别人交流，周围的视线都聚集在我身上，恐惧瞬间包围了我，我想狂奔着追上知珉姐姐，却无法迈开沉重的双腿，似乎整个世界都变得灰蒙蒙的</p><p class="story-paragraph" data-source-index="352">就算我连为什么被扔下都不知道，我也没有跟她说过任何讨人厌的话</p><p class="story-paragraph" data-source-index="355">金旼炡用力关上了门，几乎把知珉逼到一个角落，报告不知道什么时候被她扔在地上散了一地</p><p class="story-paragraph dialogue" data-source-index="358">“刘知珉…不是已经打算开始下一段爱情了吗？”</p><p class="story-paragraph" data-source-index="361">可我还没忘，我的房间里依旧还有刘知珉的外套，有她送给我的玩偶，我们拍过的合照摆放的到处都是，连随手捡来的枫叶都被我封存起来夹在课本里，每次上课翻到……姐姐知道我有多少次忍不住在课堂上泪流满面了吗？</p><p class="story-paragraph dialogue" data-source-index="364">“你是这么想的吗？是不是你觉得我是一个随随便便就会喜欢上谁的人？”知珉的声音开始虚弱起来，混杂着细微的颤抖</p><p class="story-paragraph dialogue" data-source-index="367">“你不是吗？现在不也在忙着和别的男人吃饭吗？”</p><p class="story-paragraph" data-source-index="370">刘知珉突然笑了，侧过脸去，“金旼炡…你真是最差劲的人了”。她回过头，被眼泪洇湿的眼睛看向金旼炡，“你觉得是我对不起你吗？在那段感情里只有你受伤了是吗？”</p><p class="story-paragraph" data-source-index="373">知珉用力吞咽着哽咽的脖颈不断用力，“可是，不是你一直都在遮遮掩掩吗？”</p><p class="story-paragraph" data-source-index="376">为什么不能在人多的地方牵手？为什么在学校见面要戴上帽子口罩？为什么接吻只能在没人的晚上？为什么约会每次都在学校附近最偏僻的那个咖啡厅？她现在一点也不想知道了。因为金旼炡，根本就是一个彻头彻尾的混蛋</p><p class="story-paragraph dialogue" data-source-index="379">“我还要告诉你”</p><p class="story-paragraph" data-source-index="382">她太讨厌面前这个人了，那张即使现在看着也会觉得可爱的脸，为什么总对自己露出憎恶的表情，金旼炡如果真的恨的话，再多讨厌自己一点也没关系了</p><p class="story-paragraph dialogue" data-source-index="385">“这些年…我不止一次想过分手…”</p><p class="story-paragraph" data-source-index="388">她知道这句话有多么能刺痛金旼炡的自尊。旼炡的眼泪果然在这句话之后立刻淌在了脸颊上，逐渐失控的眼泪并没有让她有报复的快感，相反的，刘知珉也开始变得厌恶起自己</p><p class="story-paragraph dialogue" data-source-index="391">“我第一次产生要分手的念头不是去年……是你瞒着我自己去医院做手术，是所有人都知道唯独瞒着我那一年……”</p><p class="story-paragraph" data-source-index="394">可那已经是三年前的事了</p><p class="story-paragraph" data-source-index="397">心口猛烈的疼痛起来。已经是那么久远的回忆了，不说的话一定不会想起来</p><p class="story-paragraph" data-source-index="400">旼炡靠着墙微微弯腰，袖子蹭过脸颊留下刺痛，胸口和腹腔的疼痛连成一片，甚至让她有些窒息</p><p class="story-paragraph" data-source-index="403">在爱情里面千万不要做隐瞒者，这是警告</p><p class="story-paragraph" data-source-index="406">有点太迟知道了这件事。那个时候明明只是不想看到刘知珉为了我变得难过，不想她为我担心……到头来，却让她受到了最大的伤害</p><p class="story-paragraph" data-source-index="409">金旼炡的确，做的太差了</p></div>

        <header class="chapter-header"><span class="chapter-number">05</span><h2>最差劲的人</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="421">小组来了新的人员，说是做技术指导的前辈，自我介绍完之后才知道是和知珉同个学院已经毕业的前辈，借着这个理由在第一天就开始熟络起来，称呼也从前辈变成秀妍姐姐</p><p class="story-paragraph" data-source-index="424">前辈在某些方面和知珉意外合的来，除却小组聚在一起讨论课题之外还会经常一起吃饭，可能有了有些超出合作关系的友谊，但当然了，除此之外再也不会有别的情绪了</p><p class="story-paragraph" data-source-index="427">我当然知道金旼炡会因此不爽，毕竟她原来就是这样的，但还是故意这样干了，只是想让她吃亏而已，每次看到旼炡因为我和前辈在一起而露出冷漠甚至是憎恶的表情时，我的心里都会产生一种别样的乐趣</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="433">不知道是不是错觉，总觉得成秀妍的目光很火热，一起讨论过课题不过几次，私下一起吃过饭的时候也并不多，可对自己的兴趣却十分明显</p><p class="story-paragraph" data-source-index="436">是暗示吗？知珉实在忍耐不了好奇，在某一天试探性的抛出问题</p><p class="story-paragraph dialogue" data-source-index="439">“姐姐知道……就是…两个女人恋爱的那种吗？”</p><p class="story-paragraph" data-source-index="442">知道这种问题太奇怪，知珉尴尬到恨不得把脸都埋到盘子里去，半晌，听到成秀妍盘旋在头顶的笑声</p><p class="story-paragraph dialogue" data-source-index="445">“知道，我喜欢女人”</p><p class="story-paragraph" data-source-index="448">刘知珉猛的抬起头，和她赤裸裸的目光对视上，有些惊讶于她的坦率，但更多的是紧张</p><p class="story-paragraph dialogue" data-source-index="451">“都这样问了…你难道不是喜欢女人的吗？”，成秀妍慢条斯理的夹起一块牛肉，却没有放进嘴里，似笑非笑的看着她，“难道我想错了？你和…姓金的那位后辈？”</p><p class="story-paragraph" data-source-index="454">刹那间知珉想立刻摇头否认，下意识想像从前一样避免被别人发现她们之间的关系，但她猛然间哽住了，想起来现在原本就不再是那种关系了，于是她抿了抿嘴唇，干涩的喉咙一言不发</p><p class="story-paragraph dialogue" data-source-index="457">“后辈对我很不客气，所以这样猜了，但总之是因为喜欢你”</p><p class="story-paragraph dialogue" data-source-index="460">“她不喜欢”，知珉立刻用凌厉的声音否定了她</p><p class="story-paragraph" data-source-index="463">成秀妍停下动作，一副看好戏的表情，挑眉看向她，这让知珉有些不自在，清咳一声马上低下头，努力想转移话题</p><p class="story-paragraph dialogue" data-source-index="466">“说真的…这家烤肉不怎么好吃…”</p><p class="story-paragraph dialogue" data-source-index="469">“你也喜欢她，你们是在吵架还是分手了？”</p><p class="story-paragraph" data-source-index="472">刘知珉胸口有点苦闷，哀嚎着叫了一声姐姐，“能不问这个吗？”，她放下了筷子，扶住额头，“反正都过去很久了”</p><p class="story-paragraph dialogue" data-source-index="475">“那看来是分手了啊……”成秀妍脸上的笑意更大了，“分手了就是分手了啊，为什么不能说，旼炡是个可爱的孩子”</p><p class="story-paragraph" data-source-index="478">知珉警觉起来，饭吃到一半没了胃口，她上下打量着成秀妍，心里思索起来，具体金旼炡喜欢什么类型的并没有说过，这些年也没有明确说过对谁很有好感，如果只是喜欢姐姐类型的人，那么成秀妍一定会是她的理想型吧</p><p class="story-paragraph dialogue" data-source-index="481">“就算是…但是…”</p><p class="story-paragraph" data-source-index="484">知珉犹豫着，迫切的想做点什么，胡乱回复了一句，“旼炡可能不会对前辈感兴趣，她是个慢热的孩子”，解释起来有点多余，但她急于打断成秀妍对金旼炡的想法</p><p class="story-paragraph" data-source-index="487">成秀妍突然笑起来，“我又没说什么，为什么总这么警觉，你现在的表情和那孩子几乎一模一样”</p><p class="story-paragraph dialogue" data-source-index="490">“什么？”</p><p class="story-paragraph dialogue" data-source-index="493">“就那样啊…”</p><p class="story-paragraph dialogue" data-source-index="496">“什么啊，我不知道你想说什么…”</p><p class="story-paragraph dialogue" data-source-index="499">“把我当做对手一样来看待，很讨厌彼此身边出现新的人，你们不都那样吗？”</p><p class="story-paragraph" data-source-index="502">刘知珉没话说了，她的确很看不惯金旼炡身边出现新的人，至于金旼炡的想法，也许她只是还不适应，这种感觉只是基于习惯而已</p><p class="story-paragraph dialogue" data-source-index="505">“啊我真的不知道，请别再问了”，知珉皱着眉捂住脸，没人比她现在还要想知道金旼炡的想法了</p><p class="story-paragraph dialogue" data-source-index="508">“为什么这么烦啊”</p><p class="story-paragraph" data-source-index="511">成秀妍放下筷子摆出故作惊讶的表情，“现在是在说前辈烦人吗？”</p><p class="story-paragraph dialogue" data-source-index="514">“姐姐不是知道我没那个意思吗？”，知珉有些无奈的叹了口气，转而又沉默了一阵，“就是…我和旼炡之间…有些事很让人心烦”</p><p class="story-paragraph dialogue" data-source-index="517">“不愧是孩子们啊…”，成秀妍感慨的望向窗外。虽然并没有想打扰她们之间的感情，但是对两个人产生了浓厚的兴趣，本身也是个十分八卦的前辈</p><p class="story-paragraph dialogue" data-source-index="520">“晚上喝酒？”成秀妍拍了拍胸脯，一副前辈的姿态，“姐姐来请客”</p><p class="story-paragraph dialogue" data-source-index="523">“算了，不要”</p><p class="story-paragraph" data-source-index="526">怎么看起来这前辈都是不靠谱的人，即使是同类人也不能轻易的就答应这样的请求。刘知珉摇了摇头，拒绝的意味十分明显</p><p class="story-paragraph dialogue" data-source-index="529">“你不来我叫那孩子了，她一定来…”</p><p class="story-paragraph" data-source-index="532">真是，无语了。一副讨厌鬼的模样，绝对不能放任酒量不好的旼炡和她去喝酒</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="538">再三警告过成秀妍不许再有约金旼炡喝酒的想法之后才勉强从她车上出去，原本想约好周末再一起喝酒，但考虑到这前辈的酒量，知珉还是皱着眉毛拒绝了</p><p class="story-paragraph" data-source-index="541">喝的酒并不多，对于知珉来说也算不上什么，因为发泄了情绪心情还不错，一路哼着歌走到家门口</p><p class="story-paragraph" data-source-index="544">刚过转角就看到门口站着的某人</p><p class="story-paragraph" data-source-index="547">她放慢了脚步，前几天才吵过架，让她现在没有那么多力气再去应对旼炡，刘知珉不自觉的叹出一口气，步子都有些沉重</p><p class="story-paragraph" data-source-index="550">金旼炡打扮的很漂亮，头发半扎起来，化了淡妆，穿着纯白的蕾丝短裙，白色罩衫下露出来的也是若隐若现的白色内衣。她一直都很好看，意识到这件事，知珉心情有些怪异的发痒</p><p class="story-paragraph" data-source-index="553">刘知珉走到门口，低头按密码的同时注意着旁边的动静，而金旼炡从一开始就靠着墙，没有要搭话的意思</p><p class="story-paragraph" data-source-index="556">门打开的很快，一直等到知珉一只脚都迈了进去也没有听到金旼炡的声音，她忍无可忍的开口，“什么都不准备说？”，刘知珉实在不太明白她的意思，不打招呼就来，却什么话都不说，这样在家门口又想让谁放的下心来</p><p class="story-paragraph" data-source-index="559">金旼炡终于挪动了位置，直起身子和她四目相对，没有流眼泪却潮湿的眼睛一直望着她。可能已经到了这种地步吧，我只是看到金旼炡就变得敏感脆弱</p><p class="story-paragraph" data-source-index="562">旼炡一言不发的向前走，捉住了知珉的手腕，突然间的肢体接触让知珉有些不自在，想甩开却被更大力气抓住，旼炡偏头看向她，眼尾泛起了红晕</p><p class="story-paragraph" data-source-index="565">她要哭了吗？</p><p class="story-paragraph" data-source-index="568">不知道，只是光想象到她哭泣的样子就什么都不敢做了，小心翼翼的顺从着她</p><p class="story-paragraph" data-source-index="571">门被关上的瞬间金旼炡就贴上来，微凉的柔软覆盖上自己的嘴唇，知珉心跳仿佛停滞一般的感到呼吸艰难，她双手按在旼炡的肩膀上想把她推开，但这个举动似乎让金旼炡更加恼火，下唇的一角被咬住发出刺痛，她不由自主的皱紧了眉头</p><p class="story-paragraph" data-source-index="574">金旼炡按住她的头接吻，另一只手却抓住知珉的手腕，她太熟悉这样的姿势，以至于一下子就反应过来，她知道金旼炡在生气，在嫉妒</p><p class="story-paragraph" data-source-index="577">除了秀妍前辈她再也想不出第二个让她这样的人</p><p class="story-paragraph" data-source-index="580">金旼炡很卖力的伸着舌头，上颚时不时就能感受到她温热的舌尖，刺激的她头皮发麻，本能的选择回应，于是知珉也环住了她的腰，两个人推搡着倒在床上</p><p class="story-paragraph" data-source-index="583">她压在金旼炡身上，旼炡很主动，骨节分明的手已经撩开了她的上衣，轻轻抓挠着她的肋骨，再这样下去可能会后悔吧，刘知珉抓住仅剩的理智打断了她</p><p class="story-paragraph dialogue" data-source-index="586">“够了…金旼炡，够了…”</p><p class="story-paragraph" data-source-index="589">知珉抓住了她想要解开自己内衣的手，缓缓拉下来，因为接吻不断喘着气，她撑着床想要站起来，金旼炡却环住她的脖子制止了她的动作，湿润的喘息声回荡在她耳边</p><p class="story-paragraph dialogue" data-source-index="592">“给我”</p><p class="story-paragraph" data-source-index="595">旼炡再次向下按压她的脖子，嘴唇贴合在一起，空余的一只手被金旼炡抓住，旼炡压着她的手摸向自己的大腿，手腕蹭到蕾丝裙子，再往上就是内裤，知珉猛的抽回了手，反过来抓住金旼炡的手腕</p><p class="story-paragraph" data-source-index="598">被压制似乎是意料之中的事，旼炡脸上没有过多惊异的神色，更多的是失落，她们之间隔了不过几厘米距离，连呼吸都共享着同一片灼热</p><p class="story-paragraph" data-source-index="601">没了动作很久，旼炡的视线变得狠厉起来，声音也变得尖锐，“你和别人睡了吗？”</p><p class="story-paragraph" data-source-index="604">知珉看到她眼里的憎恶，疲惫感再次席卷而来，好像经历一万次风吹之后才会忘记的事情再次回想起来</p><p class="story-paragraph" data-source-index="607">她厌倦了争吵和互相伤害，于是沉默着站起来，“没有”，有些凄凉的笑了一声，“就算有了又怎么了？”</p><p class="story-paragraph dialogue" data-source-index="610">“你觉得无所谓是吗？”，旼炡问了这样的话，开始眼眶滚烫，动手脱下自己的衣服，一件不剩全扔到地上，赤裸着身体从背后环住知珉</p><p class="story-paragraph dialogue" data-source-index="613">“可我真的很讨厌你和别人睡…”</p><p class="story-paragraph" data-source-index="616">虽然浑身都颤栗着，旼炡还是用力抱住她。能怎么办呢？她一定知道自己不会放任这样的她不管，知珉转过身，宣泄一样的咬住了旼炡的肩膀。她真的恨金旼炡，不明白为什么她总让自己做这样的难题</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="620">因为家里没有指套，知珉轻轻吻她的小腹，小声问她能不能用嘴，她想着可能会被拒绝，因为金旼炡对这种事一向害羞</p><p class="story-paragraph" data-source-index="623">旼炡楞了几秒，伸手去拿外套，口袋里带了还没拆封过的安全套，白皙纤长的手拆开，金旼炡撕开包装，抓住知珉的手，水润的下唇被咬住，她脸颊绯红，却镇静的给自己套上黏腻的指套</p><p class="story-paragraph dialogue" data-source-index="626">“别用嘴，不干净”</p><p class="story-paragraph" data-source-index="629">不知道是说谁不干净，总之让知珉感到不满，于是欺身上前，空余的手扶住旼炡发红的膝盖，知道自己用力又不温柔，甚至一度让她觉得有点痛</p><p class="story-paragraph" data-source-index="632">从前戏吻上她的脖颈开始旼炡似乎就变得哽咽了，知珉有些做不下去了，低头轻轻亲她的脸颊，低声问她</p><p class="story-paragraph dialogue" data-source-index="635">“不做了好不好？”</p><p class="story-paragraph" data-source-index="638">可越是这样说金旼炡的眼泪就越多，她环住知珉的脊背摇头，把眼泪蹭到了她的胸口</p><p class="story-paragraph" data-source-index="641">刘知珉只能把动作放轻，小心翼翼的把手指伸进去，动作很慢，担心金旼炡会不适应，会仔细观察金旼炡的表情</p><p class="story-paragraph" data-source-index="644">慢慢的旼炡呻吟起来，声音很低，把脸埋进被子里之后就更加听不见。她太瘦了，胸口的骨骼凸起，每根肋骨都看得清形状，弯腰的时候脊背的每一块骨头都会凸显出来，盈盈一握的腰一条手臂就能圈起来，白皙的皮肤让她一旦兴奋就会透出粉红</p><p class="story-paragraph" data-source-index="647">知珉停下动作，她不想欺负金旼炡，可她总觉得旼炡在忍，旼炡很难受，“要不然算了”，知珉抽出手，有些颓废的垂下眼皮</p><p class="story-paragraph" data-source-index="650">旼炡埋在被子里的脸露出来，眼睛还残存着未擦干的眼泪，鼻尖通红，被子上浸湿了一片，看到那片泪渍，知珉偏开脑袋，眼眶的温度逐渐升高</p><p class="story-paragraph dialogue" data-source-index="653">“怎么了？”旼炡的声音脆弱又沙哑，脱了力一样的问她</p><p class="story-paragraph dialogue" data-source-index="656">“你不是不喜欢吗？”</p><p class="story-paragraph dialogue" data-source-index="659">“……我什么时候说了”金旼炡突然咬牙切齿的说，“能别总替别人决定吗？”</p><p class="story-paragraph" data-source-index="662">她似乎不止是在说这件事。知珉的手腕再次被抓住，“不想给我做，那我给前辈做？”</p><p class="story-paragraph" data-source-index="665">因为这两个字知珉马上哭了，崩溃着推开她，用手背粗鲁的擦掉眼泪。她一边从旁边拿过新的指套戴上，一边呜咽着</p><p class="story-paragraph dialogue" data-source-index="668">“你太烦人了”</p><p class="story-paragraph" data-source-index="671">眼泪顺着鼻梁滑下来，她不知道为什么就哭了，觉得太狼狈，不只是因为自己，更讨厌看见金旼炡用这样的姿态来对自己</p><p class="story-paragraph" data-source-index="674">是来报复她的吧。明明做着这样的事却那么生疏的叫前辈，三番两次的来提醒自己仅仅是为了让自己难受吗？</p><p class="story-paragraph" data-source-index="677">她仍旧不明白金旼炡</p><p class="story-paragraph" data-source-index="680">卧室里回荡着两个人压抑着的呻吟声，金旼炡死死用手抓着床单，拼命忍耐着喉咙里的尖叫，眼泪时不时就会滑落下来</p><p class="story-paragraph dialogue" data-source-index="683">“为什么总哭？”，知珉没有她那样的耐力，不知道第多少次用空余的手替她擦掉眼泪之后，压着嗓子问她</p><p class="story-paragraph" data-source-index="686">旼炡因为这句话更用力的捏紧了被子，试图挡住自己的脸</p><p class="story-paragraph dialogue" data-source-index="689">“不是，为什么总那样？”</p><p class="story-paragraph" data-source-index="692">她甚至有点恼火，立刻拉开了被子，手上的动作停下来，一时间有些难受。就是非常讨厌金旼炡这样，什么都不说，难受或者是舒服，怎么什么都不肯告诉她呢？</p><p class="story-paragraph dialogue" data-source-index="695">“…哈…姐姐……”，旼炡的睁开的眼睛弥漫着水雾，瞳孔涣散到有些失神，声音断断续续的，不经意间露出了罕见的脆弱</p><p class="story-paragraph dialogue" data-source-index="698">“有点…”，她皱起眉头，极力掩饰着什么，半晌嗓子里又冒出哽咽，“别假装对我好…随便做吧…我都可以…”</p><p class="story-paragraph" data-source-index="701">如果不是脸上仍旧残存着泪珠，那样淡漠的神情绝对不会让人联想到金旼炡刚才的样子</p><p class="story-paragraph dialogue" data-source-index="704">“你又这样”，刘知珉甚至还没从那句姐姐里缓过神来就又一次被泼了一头冷水，“这样很烦人知道吗？”</p><p class="story-paragraph" data-source-index="707">金旼炡的表情因为这句话僵硬了一瞬，但马上就因为知珉再次用力抽动手指而崩溃起来。高潮的滞空感让她很恐惧，像以往一样张开手慌张的想要知珉的怀抱，但却落了空</p><p class="story-paragraph" data-source-index="710">刘知珉分明也都知道</p><p class="story-paragraph" data-source-index="713">为什么这么对我呢？我究竟做错了什么？以前分明都会做的事，现在为什么不做了？还是又对谁体贴了吗？说我烦人的话也是真心的吗？</p><p class="story-paragraph" data-source-index="716">旼炡一切都捞空了，无论是知珉的怀抱还是枕头被子，全部都没有抓到，就那样独自一个人咬住下唇猛烈的颤抖起来</p><p class="story-paragraph" data-source-index="719">下身更加湿润起来，余韵中仍旧敏感的地方又开始被进进出出的抽插起来。她突然怀念起以前无论什时候都会小心翼翼在乎着她感受的刘知珉，现在在做的事反而更像惩罚。她哭起来，一只手捂住不受控制的脸，另一只手伸到身下想制止知珉的动作</p><p class="story-paragraph" data-source-index="722">但最终她哭的厉害，却只在指尖碰到知珉手腕的时候瞬间缩回了手，快感多到刺痛的身体忍耐着，也一下子爆发了委屈，尽管努力克制还是哆哆嗦嗦的哽咽出声</p><p class="story-paragraph dialogue" data-source-index="725">“姐姐…知珉…别和别人睡…”</p><p class="story-paragraph" data-source-index="728">不知道是不是真心话，但是她那时唯一有力气能说出来的话</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="732">不知道为什么看着那样的旼炡觉得可怜，觉得如果什么都不做才是侮辱她。刘知珉并不知道她来的原因，整个过程也并不享受，金旼炡一直在哭</p><p class="story-paragraph" data-source-index="735">做完之后才感到后悔，分明知道旼炡的身体一向没有那么好的耐力，也知道她是擅长忍耐的孩子，明明都忍受到了极限，但除了流泪居然什么制止的动作和话语都没有做</p><p class="story-paragraph" data-source-index="738">最后抱着脱力的金旼炡去浴室的时候才发现她浑身都通红的要命，嘴唇被自己咬出了血迹，双眼也哭的猩红。累到连下床的力气都没有，嗓音沙哑的小声喊姐姐</p><p class="story-paragraph" data-source-index="741">旼炡开心了吗？应该没有，那孩子昨晚也一直在叫着姐姐，叫刘知珉的名字，哭泣声要多于呻吟声，知珉第一次在这种事上也感到挫败，仅有的一次由金旼炡主动的性爱也没有让她觉得开心</p><p class="story-paragraph" data-source-index="744">我又怎么可能不难过，在抱着睡着之后的旼炡时，摸着她温顺的头发，她仍旧那么瘦弱，小小的一只，我很轻易的就能把她整个人圈在怀里。我也哭了，不管什么时候我都依然心疼她，小声跟睡着的她说抱歉，我只能这样干，我们之间似乎只能止步于此，我分明知道，无论如何都不应该这么对她。我从来没想过让她流泪</p><p class="story-paragraph" data-source-index="747">到底在这段关系中还能做好什么事呢？</p><p class="story-paragraph" data-source-index="750">一开始，就只是觉得在一起太艰难了而已，难道是只有我一个人感到艰难吗？我才察觉到，从始至终我都没有问过旼炡的意见</p><p class="story-paragraph" data-source-index="759">续.</p><p class="story-paragraph" data-source-index="769">冰咖啡放在桌子上，刘知珉站在面前，她有点感到悲凉，打开咖啡盖子，喝到只剩下冰块的杯子更让她感到难受，金旼炡最终仰头，舌头卷入残留着咖啡味的冰块</p><p class="story-paragraph" data-source-index="772">她需要什么东西来冷静一下。实在不明白，哪有人睡完之后就来道歉的呢？更何况也不是第一次睡了。用力咬碎了那块冰，她吐出一口凉气</p><p class="story-paragraph dialogue" data-source-index="775">“不用道歉，反正…都是成年人，我是自愿的”那件事是自愿的没错，可说出来这句话时却并不是心甘情愿，甚至有些反感和勉强，因为这意味她和刘知珉之间的关系已经生疏到了这样的地步</p><p class="story-paragraph" data-source-index="778">金旼炡并不想看见知珉听到这话时松了一口气的表情，于是迅速垂下眼皮，拿起咖啡走了出去，她仍旧有些心脏微痛，那是一种若有若无的痛感</p><p class="story-paragraph" data-source-index="781">她承认当时是头脑一热了，原本那天走出实验室的时候没有那样的想法，只是想好好道歉来着，为那天的争吵说句对不起就行了，可出门之前却听到秀妍前辈的声音</p><p class="story-paragraph" data-source-index="784">前辈十分热情的喊着知珉，偶尔会冒出来一两句亲爱的，她都很少这样喊过刘知珉，金旼炡听到她们约好去喝酒的消息，甚至约会一直排到了第二天</p><p class="story-paragraph" data-source-index="787">金旼炡很容易多想，分手之后尤其明显</p><p class="story-paragraph" data-source-index="790">之前害怕做那个的时候会痛一直把指甲修剪的整整齐齐，在分手之后没多久姐姐就留了长指甲，但又没过多久，她便又剪短了，不知道是不是为了别人，我承认我很敏感，也很容易多想，事实上，我嫉妒任何一个让她做出改变的人</p><p class="story-paragraph" data-source-index="793">嫉妒是个很可怕的东西，一旦遇见这种事就会全然失掉理智，她总是被这种情绪支配。已经记不清那天到底哭了几次才决定好打车去刘知珉家，分手后第一次给刘知珉打电话却发现被拉黑，那时候的心情，几乎难以忍耐的爆发</p><p class="story-paragraph" data-source-index="796">慌不择路的她，想法开始变得简单</p><p class="story-paragraph" data-source-index="799">如果能让姐姐回来，即使是这样一点自尊也没有的出卖身体我也愿意。我甚至做好了被侮辱的打算</p><p class="story-paragraph" data-source-index="802">哪怕已经做好了准备，却还是在做的时候眼泪流的一塌糊涂，因为刘知珉不再喜欢了，她很讨厌这样的想法</p><p class="story-paragraph" data-source-index="805">为什么这么了解这个人呢？</p><p class="story-paragraph" data-source-index="808">我愿意抛弃的尊严，在刘知珉看来是一文不值的东西，我都知道，她最讨厌我嘴里的自尊，我也逐渐变得讨厌起来</p><p class="story-paragraph" data-source-index="811">我不要了，全部都……我只需要这个人，陪在我身边就好了，为什么要分手呢？甚至连一点机会也不留给我</p><p class="story-paragraph" data-source-index="814">我快被折磨疯了，刘知珉知道吗？</p></div>

      <article class="chapter" data-chapter="06">
        <header class="chapter-header"><span class="chapter-number">06</span><h2>最后的饭局</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="824">反复的逃避只会让事情变得更糟，项目结束之后，甚至不知道该怎么处理两个人的关系</p><p class="story-paragraph" data-source-index="827">刘知珉开始无比懊悔自己那天的决定，早知道就该走，把原本就理不清的关系搞的更加复杂，这并不是一开始她想要的</p><p class="story-paragraph" data-source-index="830">项目进行收尾工作的时候，导师提出来请大家一起吃饭，饭局结束之后，计算机系的学生们就不会再参与进来，刘知珉很清楚，这些结束之后想再见金旼炡一面将会变得十分困难，所以即使觉得尴尬和惭愧也还是咬着牙过去了</p><p class="story-paragraph" data-source-index="833">晚上的时候秀妍前辈打来了电话，说是本来打算顺路去把旼炡接过来，但突然有了急事，担心金旼炡会一直等她所以拜托自己去接她</p><p class="story-paragraph" data-source-index="834">。她一定知道知珉没有拒绝的理由，不管出于哪个层面</p><p class="story-paragraph" data-source-index="837">知珉掏出手机，翻出旼炡的联系方式，前几天发去的问她最近有没有好点的短信还没有回复，这次也会假装看不见吗？</p><p class="story-paragraph" data-source-index="840">刘知珉还是犹豫着打去了电话，振铃不过几秒就听见旼炡略带疲惫的声音从听筒里传来</p><p class="story-paragraph dialogue" data-source-index="843">“…前辈？”</p><p class="story-paragraph" data-source-index="846">一时间还是被这声前辈给打击到，知珉极力收起了不满的情绪，直接切入正题</p><p class="story-paragraph dialogue" data-source-index="849">“秀妍姐姐说暂时来不了，我接你去吃饭，在家里吗？”</p><p class="story-paragraph dialogue" data-source-index="852">“在家，来楼下接我吧”</p><p class="story-paragraph" data-source-index="855">旼炡的声音实在是有些太过虚弱无力，刘知珉死死握住了方向盘，反复挣扎了几遍才犹豫着问出口</p><p class="story-paragraph dialogue" data-source-index="858">“你生病了吗？”</p><p class="story-paragraph" data-source-index="861">我其实很讨厌这样的习惯，尤其在分手之后，我总会因为不能照顾好她而格外自责。换季的时候担心她会为了耍帅穿单薄的衣服而发烧感冒，看到她薄薄的脊背会想旼炡是不是又因为吃零食而没有好好吃正餐……</p><p class="story-paragraph" data-source-index="864">我知道我不该问</p><p class="story-paragraph" data-source-index="867">听筒那边沉默了很久，再有动静的时候已经是被突然挂断的提示音。知珉颓唐的垂下手臂，额头靠在了方向盘上</p><p class="story-paragraph" data-source-index="870">不知道是不是又搞砸了……</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="874">距离并不算远，从学校开车到她家楼下不过十几分钟。正当知珉犹豫着要不要给她打个电话把她叫下来的时候，停车场转角走过来带着帽子口罩，把脸遮掩的很严实的金旼炡</p><p class="story-paragraph" data-source-index="877">旼炡在停车场环视一圈很快就找到了她的车，迈开大步走过来，这让知珉有些紧张，像第一次约会时那样，尴尬的不知道该说点什么</p><p class="story-paragraph" data-source-index="880">结果比她想象中更安静，旼炡从上车起就安安静静坐在座位上，手机也没有拿出来看一眼，整个人似乎都蜷缩着，看起来十分没有精神</p><p class="story-paragraph" data-source-index="883">担心她带着口罩帽子会有点闷，知珉把车窗悄悄打开了一点，不断用余光注意她的反应</p><p class="story-paragraph dialogue" data-source-index="886">“前辈开车不好好看路吗？”旼炡闷闷的声音透过口罩传来，比在电话里听起来更哑</p><p class="story-paragraph dialogue" data-source-index="889">“有在吃药吗？”知珉比起被抓包的尴尬，最先还是为金旼炡的身体感到担忧</p><p class="story-paragraph" data-source-index="892">金旼炡又陷入沉默，这让刘知珉有种想发火的冲动，握紧方向盘的手不断抓紧又松开</p><p class="story-paragraph dialogue" data-source-index="895">“没有…不是要喝酒吗？”</p><p class="story-paragraph dialogue" data-source-index="898">“说自己不能喝又怎么了？”</p><p class="story-paragraph dialogue" data-source-index="901">“不想那样…”</p><p class="story-paragraph" data-source-index="904">知珉的嘴角绷起来，不想再和她多说些什么，反而调转了方向。虽然没有任何解释但旼炡看着她的动作就大概能猜出来，可能是要带她去买药</p><p class="story-paragraph" data-source-index="907">车子稳稳的停在药房门口，朦胧的绿色屏幕光一下子有点刺痛她，旼炡迅速打开门走了出去，两三步迈上台阶，甚至没有回头看那个人有没有跟上来</p><p class="story-paragraph" data-source-index="910">很快旼炡就拎着口袋从药店里走出来。刘知珉还是能轻易察觉出来她的不高兴，打着火之后才开口</p><p class="story-paragraph dialogue" data-source-index="913">“我知道自己多管闲事了，让你来买药也是，但是，身体是你自己的，即使我们分手了也是…”</p><p class="story-paragraph dialogue" data-source-index="916">“……”</p><p class="story-paragraph" data-source-index="919">塑料袋子发出滋滋的响声，旼炡用手不断捏着口袋发出细碎的响声，这让金旼炡的声音也连带着有些嘈杂</p><p class="story-paragraph dialogue" data-source-index="922">“别提那个了，我不想听”</p><p class="story-paragraph dialogue" data-source-index="925">“……”知珉有些茫然，不知道她说的是哪个，别提什么？</p><p class="story-paragraph dialogue" data-source-index="928">“那么轻易就接受了？…我说我很讨厌你会相信吗？”，旼炡突然扭过头直视她的侧脸，仅仅露出来的一双眼干涩的厉害，“分手也是，买药也是，一切都是，为什么总自作主张？”</p><p class="story-paragraph dialogue" data-source-index="931">“真讨厌…”</p><p class="story-paragraph" data-source-index="934">语调里藏着让人难以忽视的委屈</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="940">酒局上让人很不顺心，秀妍前辈坐在旼炡的旁边，而知珉左手边空出来的位置不知道怎么就被别人安排上了理所应当该给崔正浩去坐，除了烦躁和尴尬之外没什么好说的</p><p class="story-paragraph" data-source-index="943">除此之外让她一整场都心不在焉的是金旼炡时有时无的轻咳声，知珉不动声色的把温水推到她旁边，没有眼神示意也没有口头表达，就只有那一个动作，她知道金旼炡能懂她的意思</p><p class="story-paragraph" data-source-index="946">但金旼炡显然不想理她，旼炡只瞥了一眼就自顾自的埋头吃起东西。正当她踌躇不决，想着要不要主动告诉她可以先吃药时，崔正浩的身体靠了过来，几乎半边身体都贴过来，难闻的酒味立刻就冲进了鼻子里</p><p class="story-paragraph" data-source-index="949">知珉条件反射一样的向着旼炡的方向靠了靠，异常的行为让旼炡也察觉到，一直看向盘子里的眼睛终于落在她的脸上</p><p class="story-paragraph" data-source-index="952">金旼炡的眉毛不易察觉的皱起来，手放下筷子，胳膊刚抬到半空，崔正浩就先一步醉醺醺的开口了</p><p class="story-paragraph dialogue" data-source-index="955">“还好…有知珉帮忙，项目一直都很顺利”</p><p class="story-paragraph" data-source-index="958">声音不算小，周围的视线都聚焦过来，落在知珉和崔正浩身上，来回打量之后露出让人烦人的笑。刘知珉只能被迫礼貌的回应，一边和成秀妍使眼色，但那个人丝毫没注意到</p><p class="story-paragraph" data-source-index="961">喝了几杯烧酒的导师很兴奋，情绪高涨起来，开始问东问西，起初是问计算机系那几位男生在学校遇见的趣事，慢慢就转移到个人的感情经历，刘知珉隐约察觉到不对劲的气氛，陪着笑的同时努力降低自己的存在感</p><p class="story-paragraph dialogue" data-source-index="964">“最近有在交往的人吗？”，崔正浩把知珉已经空掉的酒杯填满，用着似乎只有两个人能听到的声音</p><p class="story-paragraph" data-source-index="967">该怎么说呢？既不想说没有在交往的人让他觉得有机可乘，也不想说有交往的人，因为害怕金旼炡会误会。不知道为什么这个时候还在在乎旼炡对这件事的意见</p><p class="story-paragraph dialogue" data-source-index="970">“以前…有，分手没多久”，只能说了这样的话，想暗示崔正浩空窗期的时间并不长，不太可能会马上开启下一段恋爱</p><p class="story-paragraph" data-source-index="973">说完这话之后，旼炡马上放下了筷子，知珉被那声音吸引过去，立刻偏头看她。金旼炡看起来依旧有些苍白的脸变得有些凝重，察觉到知珉在看她也没有扭头，赌气一样的伸手够桌子上的烧酒</p><p class="story-paragraph" data-source-index="976">刘知珉变得煎熬起来，看着旼炡笨拙的给自己倒上烧酒，又一口气喝下去，苦涩辛辣的酒让她瞬间皱起眉头</p><p class="story-paragraph dialogue" data-source-index="979">“这样……那为什么分手了？”，他又很没有眼色的问了这样话</p><p class="story-paragraph" data-source-index="982">知珉眼皮垂下来，她并不想在外人面前提起这些，更何况金旼炡就在旁边坐着</p><p class="story-paragraph dialogue" data-source-index="985">“……很久了，不太想说”</p><p class="story-paragraph" data-source-index="988">金旼炡猛烈的咳嗽起来，急切的抽过一边的纸巾捂住口鼻，嘶哑的声音让刘知珉开始难受，什么也顾不得的拍拍她的背，看见她因为咳嗽涨红的脸端起了水杯</p><p class="story-paragraph dialogue" data-source-index="991">“难受吗？旼炡啊，喝口水？”</p><p class="story-paragraph" data-source-index="994">金旼炡这才抬起眼睛看她，不知道是不是因为咳嗽泛出生理性的眼泪，露出来的眼白上分布着几条红血丝，红晕的眼睛看着她，好像说了很多话</p><p class="story-paragraph" data-source-index="997">因为这样的眼神刹那间愣住了，心脏滞涩的转动起来，实话说，看见金旼炡的眼泪，实在是太心疼了</p><p class="story-paragraph" data-source-index="1000">空气停滞过几秒，在旼炡移开视线之后又重新流动起来，她挤出笑对着看向她的人摆摆手，说只是因为喝酒有些着急了，不小心呛到</p><p class="story-paragraph" data-source-index="1003">一切又安静下来，知珉却惆怅起来。喝酒之后有些发晕的脑子让她没办法思考，总是产生想和金旼炡说话的冲动，不自觉和她越靠越近</p><p class="story-paragraph dialogue" data-source-index="1006">“喝醉了吗？”，旼炡小声问她，头微微垂下来</p><p class="story-paragraph" data-source-index="1009">手里被塞进来东西，那双手的指尖蹭过掌心，有些发痒</p><p class="story-paragraph" data-source-index="1012">是一颗解酒糖</p><p class="story-paragraph dialogue" data-source-index="1015">“刚才买的……不要喝醉……那样会头痛”</p><p class="story-paragraph" data-source-index="1018">金旼炡总是这样。我开始因为这颗糖动摇起来，甚至差点流泪，我想抱抱她，真的……但我最终连谢谢也没有说，只是攥紧了拳头</p><p class="story-paragraph" data-source-index="1021">计算机系的导师因为喝的有些醉，说要先离开，这时候金旼炡也站起来，和大家打了招呼，说她还有其他事要早点回去</p><p class="story-paragraph" data-source-index="1024">转身的背影太无力，让知珉有一瞬间觉得旼炡可能下一刻就会晕倒，她想说送金旼炡回家，但想到喝了酒，有些懊恼的又坐了回去</p><p class="story-paragraph" data-source-index="1027">趁着人群嘈杂的时候，知珉有些没底气的混在中间开口，“注意安全”</p><p class="story-paragraph" data-source-index="1030">也许金旼炡并没有听见，也可能并不想理会，总之她在出门前都没有再看刘知珉一眼</p></div>
      </article>

        <header class="chapter-header"><span class="chapter-number">07</span><h2>解酒糖</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="1036">刘知珉走出来，想呼吸一口新鲜空气，觉得屋子太吵闹，莫名奇妙头疼，思绪也很混乱。事实上，从金旼炡出门那一刻开始她就开始变得焦躁不安了</p><p class="story-paragraph" data-source-index="1039">才跨过门槛就愣在了原地，她手里捏紧刚才金旼炡塞给她的解酒糖，发出苦笑，早该知道啊，这孩子什么时候都在拿捏她的心情，以前是，分手之后也没有改变</p><p class="story-paragraph" data-source-index="1042">金旼炡坐在台阶上，显而易见是在等她，知珉走上前去，一言不发坐在她身边</p><p class="story-paragraph dialogue" data-source-index="1045">“怎么没回去？”，知珉偏头看她</p><p class="story-paragraph" data-source-index="1048">用手掌捂住脸颊的人缓慢而迟钝的拿开自己的双手，僵硬的脸上露出比哭还难看的笑，“不是知道那个嘛……”</p><p class="story-paragraph dialogue" data-source-index="1051">“……”</p><p class="story-paragraph dialogue" data-source-index="1054">“前辈……”，金旼炡的语气似乎变得艰难起来，马上皱起了眉头，可能是错觉，刘知珉觉得她有些委屈。就这样叫了自己一声之后，突然陷入了沉默</p><p class="story-paragraph" data-source-index="1057">过了大概几分钟，她像放弃了什么一样，声音低到像是在自言自语</p><p class="story-paragraph dialogue" data-source-index="1060">“能不叫这个吗？…我不喜欢”</p><p class="story-paragraph" data-source-index="1063">我究竟什么时候让你叫前辈了？那不是你自己非要这样做的吗？其实从始至终，我都没有逼你做过什么事。知珉猛烈的头疼起来，也不自觉的有些恼火</p><p class="story-paragraph dialogue" data-source-index="1066">“能不能…”旼炡紧张的吞咽了一下口水，“叫姐姐？”</p><p class="story-paragraph" data-source-index="1069">金旼炡喝酒了，但绝对不至于到喝醉的地步，我不太明白她这个时候究竟想做些什么，沉默着应允了，因为我其实也很想听她叫我姐姐，我比金旼炡还要更讨厌那个该死的称呼</p><p class="story-paragraph" data-source-index="1072">旼炡深吸了一口气，喉咙变得轻快起来，“……知珉姐姐”</p><p class="story-paragraph" data-source-index="1075">知珉瞬间攥紧了拳头，胸口苦闷，尤其听到金旼炡颤抖的尾音下藏匿着的哽咽</p><p class="story-paragraph dialogue" data-source-index="1078">“我有话要对姐姐说…”，她哽咽的语气更加明显，“因为已经过去了有一段时间，想着姐姐应该不会再因为那个伤心了，所以一定要问，问完之后，就真的再也不会提了，以后也不会再出现在姐姐面前”</p><p class="story-paragraph" data-source-index="1081">好不容易沸腾起来的心又因为这句话冷却下来，刘知珉甚至想转头就走了</p><p class="story-paragraph" data-source-index="1084">以后都不会出现在我面前是什么意思？</p><p class="story-paragraph dialogue" data-source-index="1087">“我其实…很想知道为什么”，旼炡扭过头看向知珉，果不其然的已经眼眶通红，和知珉的双眼对上，她慌忙的转移了视线，欲盖弥彰的挡住自己的侧脸，另一只手揩去自己的眼泪</p><p class="story-paragraph dialogue" data-source-index="1090">“姐姐你知道吗？”</p><p class="story-paragraph dialogue" data-source-index="1093">“………”</p><p class="story-paragraph dialogue" data-source-index="1096">“那个时候我们从没有吵过架，一次也没有，可是为什么，突然就分手了，一点预兆都没有，我没有做好准备…”</p><p class="story-paragraph" data-source-index="1099">是这样，对于那个孩子来说，一切可能都那么突然。昨天还温柔的告诉自己好好吃饭的恋人，仅仅隔了一天就变成了想见却不能见的陌生人</p><p class="story-paragraph" data-source-index="1102">旼炡的声音蒙上了浓厚的鼻音</p><p class="story-paragraph" data-source-index="1105">关于分手那天的记忆似乎已经太遥远，知珉以为忘了，可分明胸口还是那么清晰的疼痛。我曾经十分怨恨过，你那天应该问问我的……哪怕让我感受到你一点舍不得，我都会为此而动摇的，为什么隔了这么久的时间？久到我以为我们真的从来没有相爱过</p><p class="story-paragraph" data-source-index="1108">以为不会因为那些苦闷的回忆感到委屈了……知珉最终也捂住了变得滚烫的眼睛，“旼炡啊……现在那个理由还重要吗？”</p><p class="story-paragraph" data-source-index="1111">不再重要了吧，因为我似乎察觉到我们再也不会回到从前了，再说出来，也只会平白增添你的烦恼</p><p class="story-paragraph dialogue" data-source-index="1114">“为什么不重要了呢…”，旼炡每个音节都开始走调，她愈发控制不住眼泪。对她来说，那十分重要，困扰了她几乎一年的理由，每天晚上都会绞尽脑汁的胡思乱想，怎么会不重要呢？</p><p class="story-paragraph dialogue" data-source-index="1117">“你能保证不哭吗？”</p><p class="story-paragraph dialogue" data-source-index="1120">“……”</p><p class="story-paragraph" data-source-index="1123">金旼炡无法答应她的请求，毕竟从刚才开始就已经没办法止住眼泪</p><p class="story-paragraph dialogue" data-source-index="1126">“对不起……但我现在不能……”</p><p class="story-paragraph" data-source-index="1129">知珉突然笑了，抬头看天，兀自开口，“我有时候希望，你在任何时候都能像现在一样坦诚”</p><p class="story-paragraph dialogue" data-source-index="1132">“你还是不怎么了解我，旼炡啊，我还是会伤心，即使到了现在”</p><p class="story-paragraph dialogue" data-source-index="1135">“………”</p><p class="story-paragraph dialogue" data-source-index="1138">“从前也是……生病了，我是最晚知道的，有了喜欢的东西，宁愿自己兼职去买也不花我的钱，学习上的事情可以排在约会之上，大学四年你从来没有为我翘过一节课，我身边的朋友全都认识你，你呢？你有和谁说过我是你的女朋友吗？你几乎没说过喜欢我，我爱你也从来没有听见过……”</p><p class="story-paragraph dialogue" data-source-index="1141">“………”</p><p class="story-paragraph dialogue" data-source-index="1144">“我想起一开始，好像就是我先纠缠你来着，你是因为没有办法摆脱我才一直陪着我吗？我会有那样的想法，如果是因为这样，我宁愿你早点甩了我”</p><p class="story-paragraph" data-source-index="1147">分手那天到底有多么稀松平常呢？一切都很不起眼，如果没有那件事，可能连说过的话也一点都不会记得。但其实她是突然之间才有了这个想法的</p><p class="story-paragraph" data-source-index="1150">那天知珉熬夜到凌晨赶完了课题，突然很想见她，在此之前她们有两周都没有见面，分明就在一个学校上学。早上只睡了几个小时就起来收拾打扮，她给旼炡发消息，隔了一个小时才得到回应，约会的地点还是学校附近那家隐蔽的咖啡厅</p><p class="story-paragraph" data-source-index="1153">知珉没有介意这些，因为是金旼炡，一切都可以不介意。她提前半个小时来了这里，百无聊赖的坐着，知珉一向是等待的那个。可当她看到戴着帽子几乎看不清脸的金旼炡时却突然间感到疲惫</p><p class="story-paragraph" data-source-index="1156">金旼炡坐下来，点了咖啡和甜点，像往常一样喋喋不休说着平时发生的种种，知珉会笑着回应她的话，当她把第一块甜点放到嘴里的时候，她吃到了很讨厌的坚果，的确一点预兆也没有</p><p class="story-paragraph" data-source-index="1159">似乎到了没办法再忍耐的地步，知珉放下咬了一半的蛋糕，望着旼炡还弯着的眼睛，她从没觉得那样疼过，因为没办法看着旼炡的眼睛说出那样话，她捂住脸，已经哽咽的声音从喉咙里传来</p><p class="story-paragraph" data-source-index="1162">只有三个字</p><p class="story-paragraph" data-source-index="1165">她说，分手吧</p><p class="story-paragraph" data-source-index="1168">我们之间，从来没有那样安静过，我看见金旼炡呆滞的眼神，我无比期待她能开口挽留我，哪怕问问我为什么也好，我一定会因为那些话而犹豫的，可当我流着泪在她面前哭到快要窒息的时候，却看到模糊的视线里她接二连三的点头，她甚至一句话也没有多说</p><p class="story-paragraph" data-source-index="1171">我太恨金旼炡了</p><p class="story-paragraph" data-source-index="1174">我很容易就会感到疲惫，可金旼炡却总是发现不了，我们之间好像是极与极的关系，怎么努力都没办法触及到对方最柔软的那块潮湿之地</p><p class="story-paragraph" data-source-index="1177">我们真的不合拍</p><p class="story-paragraph dialogue" data-source-index="1180">“你问我为什么突然想分手……”，知珉拼命忍住眼泪，“旼炡啊，你明白我那时有多么患得患失吗？”，你从不会给我肯定的回答，一次也没有，我怎么能不动摇呢？</p><p class="story-paragraph" data-source-index="1183">这么久的时间，你总是来找我，可从来没说过想和我重新开始</p><p class="story-paragraph" data-source-index="1186">我想我也不懂你</p><p class="story-paragraph" data-source-index="1189">旼炡已经变得泣不成声，一刻不停的说着抱歉，知珉不禁想起那天哭着走出咖啡馆的自己，心口发疼，我们是什么时候变成这样的呢？</p><p class="story-paragraph" data-source-index="1192">她拍着旼炡弓起来的背，一下又一下的给她顺着呼吸，分明就近在咫尺，却已经变成了再也不能为她擦去眼泪的关系</p><p class="story-paragraph" data-source-index="1195">知珉最终把解酒糖塞回她的手心</p><p class="story-paragraph" data-source-index="1198">希望你依旧是吃掉甜点之后会笑的孩子</p></div>
      </article>

      <article class="chapter" data-chapter="08">
        <header class="chapter-header"><span class="chapter-number">08</span><h2>仍旧爱你</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="1208">事情的走向没有按照预料中的发生</p><p class="story-paragraph" data-source-index="1211">按理来说，就像金旼炡说的那样，以后再也不见，那是最后的结果，被迫接受的我，虽然有一肚子怨言也没有了发泄的理由</p><p class="story-paragraph" data-source-index="1214">实习之后的日子每天都变成了固定的格式化过程，知珉早上推着半梦半醒的自己洗漱，潦草的打扮过后会去坐同一趟班车，雷打不动的在迟到之前赶到工位</p><p class="story-paragraph" data-source-index="1217">偶尔偶尔，极少数情况下，会在晚上下班之后和同事聚会，喝完酒之后回来，疲惫的收拾起自己……没什么变故，很无聊，但这就是大人的生活</p><p class="story-paragraph" data-source-index="1220">学校几乎不再回去了，一个月之后的毕业典礼结束，就再也不会去了。虽然有点遗憾，但这就是生命中的常态，也没什么不好接受的</p><p class="story-paragraph" data-source-index="1223">知珉望着天花板发呆，突然间响起敲门声，她立马警觉起来。这么晚的时间，谁会不打招呼过来？</p><p class="story-paragraph" data-source-index="1226">她坐起身，小心翼翼的踱步到门口，敲门声没有规律，有一下没一下，不像是敲门，更像是用手掌在拍门，力道不重，似乎门外的人也没什么力气，虽然不是怕鬼的人，但这个时候知珉也开始胆战心惊的心脏狂跳</p><p class="story-paragraph" data-source-index="1229">知珉凑近猫眼看，只看到外面人衣服的衣角，和靠在门上的头顶，呼吸停滞了一瞬，她马上拉开了门</p><p class="story-paragraph" data-source-index="1232">门后的人因为突如其来的开门没有防备，原本就软弱无力的身体没了依靠一下子向前跌去，好在知珉及时拉住了她</p><p class="story-paragraph" data-source-index="1235">酒气扑面而来，金旼炡醉到连站起来的力气都没有了，无力的抓住她的胳膊，这才勉强没有摔倒</p><p class="story-paragraph" data-source-index="1238">牙齿被她咬的吱呀作响，“金旼炡……”，知珉爆发了怒火，抓着她手腕的手开始用力，“是不是疯了？！！”</p><p class="story-paragraph dialogue" data-source-index="1241">“现在多晚了知道吗？！”</p><p class="story-paragraph dialogue" data-source-index="1244">“………”</p><p class="story-paragraph dialogue" data-source-index="1247">“什么时候变成酒鬼了？！”</p><p class="story-paragraph dialogue" data-source-index="1250">“………”</p><p class="story-paragraph" data-source-index="1253">旼炡脑袋低垂着，摇摇晃晃的扶住柜子，却还是固执的抓住知珉的胳膊</p><p class="story-paragraph" data-source-index="1256">刘知珉知道和喝醉的金旼炡是没办法沟通的，于是强忍着继续责骂她的心情，揽过她的腰一步一步把她扶到床上</p><p class="story-paragraph" data-source-index="1259">喝醉酒又会难受很久吧。知珉喉咙里仿佛闷了一口气，看着床上迷迷糊糊开始慢慢蜷缩起来的人有些呼吸艰难</p><p class="story-paragraph dialogue" data-source-index="1262">“……姐姐”</p><p class="story-paragraph" data-source-index="1265">非常细微的声音，被知珉捕捉到，她开始慌张起来，迅速的站起来想走出卧室</p><p class="story-paragraph dialogue" data-source-index="1268">“姐姐……”，难受的呻吟着，“难受…我好难受……”，双手挣扎着乱抓起来，想脱掉自己的衣服</p><p class="story-paragraph" data-source-index="1271">知珉只能再转过头走回去，抓住她乱动的手。双手被禁锢住，金旼炡开始着急起来，眼睛半张开，盯着知珉，哼唧着挣扎</p><p class="story-paragraph dialogue" data-source-index="1274">“想干什么？”</p><p class="story-paragraph" data-source-index="1277">金旼炡既不说话，也没有停下挣扎，其实知珉根本没用什么力气，慢慢的旼炡的眼睛开始弥漫上一层雾气，细小的呻吟声变成啜泣声</p><p class="story-paragraph dialogue" data-source-index="1280">“先别把我赶出去…”，像是控诉，也像是撒娇</p><p class="story-paragraph" data-source-index="1283">知珉妥协着松开了手，没了束缚的手马上撑着床半坐起来，旼炡软弱无骨的胳膊揽住了知珉的脖子，瘦小的身板贴上来，被酒精染红的脸一点点凑近</p><p class="story-paragraph" data-source-index="1286">知珉大口喘息着，最终在嘴唇离自己不过厘米之差的时候推开了金旼炡的肩膀</p><p class="story-paragraph dialogue" data-source-index="1289">“你喝醉了”</p><p class="story-paragraph dialogue" data-source-index="1292">“是那样”</p><p class="story-paragraph" data-source-index="1295">旼炡用略带不满的眼睛看着她，一本正经的反驳。“不喝醉的话，就不能来了”，她再次拉进了两个人的距离，“姐姐你…”，旼炡突然哽咽了，大颗大颗的眼泪落下来，比任何一次都汹涌</p><p class="story-paragraph dialogue" data-source-index="1298">“你想我吗？一次也行…”</p><p class="story-paragraph dialogue" data-source-index="1301">“……”</p><p class="story-paragraph dialogue" data-source-index="1304">“一次也没有吗？”</p><p class="story-paragraph" data-source-index="1307">旼炡的额头抵在了她的胸口，没了抬起来的力气，肩膀因为啜泣不断耸动着，呜咽声在卧室里格外清晰，口齿不清的说着，委屈的像个孩子</p><p class="story-paragraph" data-source-index="1310">不知道要怎么把我们已经分手了这样的话告诉变成这样的旼炡，我能做的只是揽住她的腰，让她不至于没了支撑从我身上滑下去</p><p class="story-paragraph dialogue" data-source-index="1313">“姐姐…知珉姐姐…”，她一直这样叫着，一声又一声，掺杂着破碎的语气，每一声哽咽都会加重知珉的郁闷，她只能把旼炡揽的更紧，希望她明早起来一切都会忘记</p><p class="story-paragraph dialogue" data-source-index="1316">“怎么了？我们旼炡…”，哪怕已经极力遏制住了情绪，还是差点因为这样熟悉的语气流下眼泪，似乎就在昨天，只是闹了一场小脾气，而她也不过正在安慰委屈的恋人而已</p><p class="story-paragraph dialogue" data-source-index="1319">“我…我真的…”，旼炡揪住她的衣领，眼泪蹭到她的脖颈上，“想你想到快要疯了…”，旼炡突然讨好一样的亲了亲知珉的下巴</p><p class="story-paragraph" data-source-index="1322">金旼炡很少用这样的姿态来对待自己，知珉有些难捱，但又无计可施</p><p class="story-paragraph" data-source-index="1325">知珉死死咬住嘴唇，偏开头，努力不去看面前的人，搂旼炡的胳膊更加用力，她同样在忍耐着</p><p class="story-paragraph" data-source-index="1328">金旼炡摇晃着脑袋，声音混杂着哽咽，断断续续的，像小猫的呻吟，勉强拼凑起来才听的清</p><p class="story-paragraph dialogue" data-source-index="1331">“我现在…我有点没办法了…”</p><p class="story-paragraph dialogue" data-source-index="1334">“……”</p><p class="story-paragraph dialogue" data-source-index="1337">“姐姐，不喜欢我了吗？我…没机会了吗？”</p><p class="story-paragraph" data-source-index="1340">她盯着知珉，却只能看到知珉偏过去的侧脸，沉默让她变得惊恐，旼炡这个时候没力气思考很多东西，就像没得到肯定的孩子一样闹腾起来，她用了最大的力气，努力攀附上知珉的脖颈</p><p class="story-paragraph" data-source-index="1343">纤细的腰塌下来，软的似乎没骨头，微凉的手捧住知珉的脸，想让她把头转过来</p><p class="story-paragraph" data-source-index="1346">知珉很轻易的就顺着旼炡的动作回过了头，两个人视线碰撞在一起，旼炡突然爆发了很大的力气，钳制住她的脸颊，混合着酒精味道的吻扑面而来</p><p class="story-paragraph" data-source-index="1349">原本就对这种事不是很擅长的金旼炡在喝醉之后更是亲吻的一塌糊涂，乱咬乱舔，眼角渗出眼泪，嘴里还溢出呜咽声</p><p class="story-paragraph" data-source-index="1352">知珉只用了不到一半的力气就把她推开了，彻底失了倚仗的旼炡从床上滑落，半跪在床边，双手捂住脸颊</p><p class="story-paragraph" data-source-index="1355">我看到她的肩膀没有规略的耸动着，长发垂下来遮住她的脸，我感到慌张，害怕她会受伤，于是马上站起来想把她从地上拉起来，在我触碰到旼炡纤细的胳膊的时候，我听见了她的哭声，相比于呜咽和抽噎，那样压抑的哭泣声在我耳朵里变得一声比一声凄厉，整个卧室都回荡着她足够悲伤的呻吟声</p><p class="story-paragraph" data-source-index="1358">刘知珉也停滞了动作，她仍旧在面对旼炡的时候手足无措。</p><p class="story-paragraph dialogue" data-source-index="1361">“我其实…”，金旼炡的话断裂在喉咙里，声带像被撕裂一样发不出声音</p><p class="story-paragraph" data-source-index="1364">失去的钝痛十分清晰，连酒精都难以掩盖这样的疼痛，也许明天早上起来一切都会忘记，但分手这样的事实到底应该怎么改变</p><p class="story-paragraph" data-source-index="1367">原本想再道歉的…原本还想厚着脸皮再求求她原谅自己的…原本觉得一切都可以重新开始的…</p><p class="story-paragraph" data-source-index="1370">鼓足了勇气才挣扎着来了这里</p><p class="story-paragraph" data-source-index="1373">可刘知珉不再喜欢我了，即使喝醉了酒也没办法耍赖不承认。金旼炡最终撑着地板摇摇晃晃的扶住墙壁，虚浮的脚步迈了不过两步就被叫停</p><p class="story-paragraph dialogue" data-source-index="1376">“去哪？”，知珉小声喘着气问她，看着那个连走路都困难的孩子，胸腔无比难过</p><p class="story-paragraph" data-source-index="1379">金旼炡停顿了一瞬，又马上迈开腿，咬紧下唇，慌忙的想立刻离开，发软的双腿让她有些站不稳，膝盖弯曲时磕到门框，差点跪在地上</p><p class="story-paragraph dialogue" data-source-index="1382">“非要走的话，我可以送你回家”</p><p class="story-paragraph" data-source-index="1385">知珉的声音从背后传来，金旼炡再次感到难堪。不明白为什么总在她面前做丢脸的事，总把最难看的一面留给姐姐</p><p class="story-paragraph" data-source-index="1388">旼炡急促的呼吸着，半晌才回应，“我…自己”</p><p class="story-paragraph" data-source-index="1390">我什么时候都拿这个孩子没办法，因为太了解她，以至于到现在看到的不是她在逃避我，而是她十分难过的在逞强，即使到了现在也会因为岌岌可危的自尊心而要拒绝我</p><p class="story-paragraph" data-source-index="1393">刘知珉不合时宜的笑起来，想发脾气，于是用力拽住了她的手腕，“怕麻烦我为什么现在要来我家？”，因为怒火有些呼吸不畅，胸口剧烈的起伏着，“你能做对一件事吗？能稍微让人舒心一点吗？”</p><p class="story-paragraph dialogue" data-source-index="1396">“………”</p><p class="story-paragraph dialogue" data-source-index="1399">“金旼炡…为什么总让我感到难受？”</p><p class="story-paragraph" data-source-index="1402">旼炡手腕被抓住，怒火灼伤了她，她蜷缩在墙角，用力握紧的拳头能看出来她在极力忍耐着</p><p class="story-paragraph" data-source-index="1405">被知珉责备之后老老实实的任由她拉着手腕上了出租车，原本清醒一些的大脑下楼吹过冷风之后又变得迷糊起来</p><p class="story-paragraph" data-source-index="1408">春天的晚上还是有些冷，金旼炡只穿了一层薄薄的衬衫，她不想金旼炡因为受冷着凉又生起病，于是麻利的脱掉外套给她套上</p><p class="story-paragraph" data-source-index="1411">下车的过程很顺利，知珉犹豫了一下，抬头望了望楼上，有些担心她是不是真的还能自己上去</p><p class="story-paragraph dialogue" data-source-index="1414">“可以自己上去吗？”</p><p class="story-paragraph" data-source-index="1417">旼炡垂着的脑袋迟愣的上下点头，挣开知珉扶住自己的手，扶住路边的电线杆</p><p class="story-paragraph dialogue" data-source-index="1420">“上去吧”，刘知珉盯着面前的人，往后退了两步，“看你上去我再回去”</p><p class="story-paragraph" data-source-index="1423">金旼炡应该是听懂了，从上车开始就沉默着不发一言的嘴唇微微张开，最终却什么也说出口，门口的灯并不明亮，视线昏暗到看不清她脸上的表情，只知道她僵硬的转身，慢吞吞的走到单元门口却顿住了脚步</p><p class="story-paragraph" data-source-index="1426">旼炡扶住门框，一向瘦弱的脊背突然微微弯曲，因为用力抓住门框手背青筋暴起。她没有回头，发着抖的哽咽也十分微弱，说出的话也让知珉觉得现在的一切都是幻觉</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph dialogue" data-source-index="1430">“但是……姐姐能原谅我吗？”</p><p class="story-paragraph dialogue" data-source-index="1433">“就这一次……”</p><p class="story-paragraph dialogue" data-source-index="1436">“求你了……”</p><p class="story-paragraph" data-source-index="1439">无助又破碎的哀求，每一个语调都像是一把尖刀，彻底扎穿了我的心脏</p><p class="story-paragraph" data-source-index="1442">我分明知道她是多要强的孩子，她从没说过这样的话。可就像走到十字路口，我太茫然了，一瞬间不知道她说的是原谅她晚上醉酒来自己家里，还是原谅在那段恋爱的日子里她所做错的一切</p><p class="story-paragraph" data-source-index="1445">我曾经无比期待过金旼炡亲口说出恳求的话，可当真的听到这句话，我竟然觉得心脏刺痛的厉害，我现在这么做，究竟是在伤害谁……</p><p class="story-paragraph" data-source-index="1448">我知道，那时我差点冲上去抱住她，告诉她我一切都愿意原谅她，可我没那么做，金旼炡也没有给我这个机会，她在说完这句话之后逃一样的消失在了黝黑的门口</p><p class="story-paragraph" data-source-index="1451">我们总是在做这样的事</p></div>

      <article class="chapter" data-chapter="09">
        <header class="chapter-header"><span class="chapter-number">09</span><h2>不能更糟</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="1459">临近毕业典礼的时候却变成了知珉格外忙碌的一段时间，项目结束之后最先面临的就是面试问题，虽然已经有了实习单位却对薪资并不满意，连续投了几次简历之后却都以经验不足被拒绝的十分果断</p><p class="story-paragraph" data-source-index="1462">正当她焦头烂额不知道去处的时候，原来合作过的贸易公司却主动抛出了橄榄枝，不管是哪个方面似乎都格外符合她的标准，在三番两次确认之后签了合同，虽然坎坷了一点但结果总归是好的</p><p class="story-paragraph" data-source-index="1465">去公司上班的第一天就看到了格外熟悉的脸，那个在项目合作期间看了无数次的脸又出现在自己面前，刘知珉其实很想上去和看起来有些距离感的成秀妍打个招呼</p><p class="story-paragraph" data-source-index="1468">但不知道是哪里惹到她了，在叫住她之后，那位前不久还和蔼可亲又爱聊八卦的前辈对自己摆出了脸色，一副看不惯自己的模样</p><p class="story-paragraph dialogue" data-source-index="1471">“不是…怎么那么看别人，我惹到前辈了吗？”犹豫了几次还是问出口，为了避免被讨厌还特意谨慎的用了敬语，喊了前辈</p><p class="story-paragraph" data-source-index="1474">结果成秀妍似乎怒火更大起来，环抱着胸开始冷笑，“果然是刘知珉啊，扯清关系这种事做的最好了”</p><p class="story-paragraph dialogue" data-source-index="1477">“那是什么意思？”知珉的眉毛紧蹙起来</p><p class="story-paragraph dialogue" data-source-index="1480">“别总装无辜，我现在可是有阵营的人”</p><p class="story-paragraph dialogue" data-source-index="1483">“到底又在说什么让人听不懂的话？”</p><p class="story-paragraph" data-source-index="1486">虽然没有听懂，但是下意识联想到了旼炡。刘知珉更加焦急起来</p><p class="story-paragraph dialogue" data-source-index="1489">“行了吧，我也就是生生你的气，毕竟除了我那个傻孩子才不会告诉你，我是真心很喜欢旼炡”，成秀妍走进了电梯里，向外面的人招手，“别总那么迟钝，快进来啊”</p><p class="story-paragraph dialogue" data-source-index="1492">“说起来，你来这里上班？那我算的上是你的上司啊”，她对着知珉摆手，露出遗憾的神情</p><p class="story-paragraph dialogue" data-source-index="1495">“那是什么意思？金旼炡什么事？”</p><p class="story-paragraph" data-source-index="1498">刘知珉迫切的只想知道这一件事</p><p class="story-paragraph dialogue" data-source-index="1501">“没什么重要的，就是看她最近不太好，有点迁怒你，可能也不是因为你…”成秀妍故意用无所谓的语气说这样话，反而让刘知珉心口更加郁闷</p><p class="story-paragraph dialogue" data-source-index="1504">“为什么过得不好？又生病了吗？还是，遇见什么解决不了的问题？她总容易和自己生气，告诉姐姐你了吗？那么秀妍姐姐能帮的上忙吗？”</p><p class="story-paragraph" data-source-index="1507">成秀妍的动作因为知珉一连串的发问停下来，她露出不解的表情，似乎对这些话十分奇怪，“你们究竟是为什么分手啊？真的不能告诉我？”</p><p class="story-paragraph dialogue" data-source-index="1510">“姐姐能不能先回答我的问题”</p><p class="story-paragraph dialogue" data-source-index="1513">“啊为什么一个两个都这样…”，成秀妍无奈的吐槽起来，但很快直起腰，“她过得不太好，项目结束之后给我发消息说要一起喝酒”</p><p class="story-paragraph" data-source-index="1516">知珉僵硬在原地，她担心成秀妍会做点不该做的事，趁着电梯开门的缝隙把她拉出去，带到公司文化廊的角落</p><p class="story-paragraph dialogue" data-source-index="1519">“说什么了到底？”</p><p class="story-paragraph dialogue" data-source-index="1522">“别用那种眼神看我，我没做坏事”</p><p class="story-paragraph dialogue" data-source-index="1525">“拜托前辈别总绕弯子”</p><p class="story-paragraph dialogue" data-source-index="1528">“……说是跟我道歉…说自己太幼稚，因为以前的事对我不客气，当着我的面喝醉了，还絮絮叨叨说了半天你们的事…说自己做的不好…还哭了……总之旼炡真的很难过”</p><p class="story-paragraph" data-source-index="1531">只是提到描述就能在脑海里幻想出来旼炡哭泣着说抱歉的模样。知珉变得更加难受起来，鼻头开始发酸，频繁感到心口抽痛</p><p class="story-paragraph dialogue" data-source-index="1534">“你不会也要哭了吧…我真的…一把年纪还要为两个孩子操心吗？”成秀妍吐槽起来，马上从包里翻找纸巾</p><p class="story-paragraph dialogue" data-source-index="1537">“就算分手了也好好做吧，两个人都这么难受是怎么回事，难道还能比现在更糟吗？”</p><p class="story-paragraph" data-source-index="1540">知珉接过她递过来的纸巾，但只是紧紧攥在了手里。不想金旼炡过得不好，也不想让她难过……就算已经是前任的关系也是如此</p></div>
      </article>

      <article class="chapter" data-chapter="10">
        <header class="chapter-header"><span class="chapter-number">10</span><h2>只能选一个</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="1550">虽然不知道为什么要来，但听到成秀妍说到金旼炡最近的状态还是一如既往的为她担心。刘知珉尽可能走到阴影处，避免被发现，她熟悉金旼炡租住公寓周围的每一条路，大学四年来这里的次数比回家的次数还要多，所以她几乎没费功夫就让保安打开了门禁</p><p class="story-paragraph" data-source-index="1553">上次来这里时和旼炡大吵一架，这样的回忆并不美好，所以在上楼梯时也一直在犹豫，不知道自己作为分手之后的前女友到底有什么立场因为别人一两句话而三番两次打扰别人</p><p class="story-paragraph" data-source-index="1556">长长的廊道，黝黑寂静，偶尔发出动静声控灯才会亮起来，知珉一眼就认出了旼炡家门口的位置</p><p class="story-paragraph" data-source-index="1559">门框上仍旧贴着刘知珉随手买来的装饰品，这么久的时间都已经开始褪色，但似乎依旧干净</p><p class="story-paragraph" data-source-index="1562">喉咙涌上了热气，知珉慌张的偏头移开视线，心跳鼓动的厉害，她犹豫着抬手，又放下，反复几次才终于闭上眼睛敲响房门</p><p class="story-paragraph" data-source-index="1565">等待了几分钟却没有回应，知珉有些心慌，毫不犹豫的又敲了敲门，接着又是一段漫长的等待，正当她焦急的拿出手机想给旼炡打去电话的时候，门被打开了</p><p class="story-paragraph" data-source-index="1568">只开了一条小小的门缝，旼炡的大部分身子都藏在门后，屋内黑压压一片，似乎只有电视机发着微弱的光</p><p class="story-paragraph" data-source-index="1571">金旼炡穿着单薄的卫衣，那已经是几年前逛街时随手买的了，因为说穿着很舒服所以干脆当成了睡衣。旼炡还和原来的样子一模一样，和五六年前一样略带警惕的脸几乎没有任何差别</p><p class="story-paragraph" data-source-index="1574">唯一不同的是，知珉在她身上嗅到了淡淡的酒精味，除此之外还有一些烟草味</p><p class="story-paragraph" data-source-index="1577">这世界上没有一个人有资格去管前女友的事</p><p class="story-paragraph" data-source-index="1580">这是起码的规则</p><p class="story-paragraph" data-source-index="1583">知珉握紧了拳头，却拉开门把金旼炡推进去</p><p class="story-paragraph" data-source-index="1586">金旼炡因为突如其来的变故有些抗拒，但很快在看清是谁之后沉默着低下头，任由知珉拉着她坐到沙发前的毛毯前</p><p class="story-paragraph" data-source-index="1589">电视机前还有没喝完的烧酒。前几天喝完的啤酒空罐还没来的及收拾起来，更让人心烦的是拆开的香烟盒子和明显缺少了的几支烟，金旼炡本能的感到慌张，想开口说点什么</p><p class="story-paragraph dialogue" data-source-index="1592">“以前不是很讨厌这个吗？”</p><p class="story-paragraph" data-source-index="1595">旼炡因为这句话抿住了嘴唇，她总觉得现在什么话都有些苍白，毕竟变成酒鬼的是她，不学好去吸烟的也是她</p><p class="story-paragraph dialogue" data-source-index="1598">“没怎么吸烟…太呛了…”，旼炡断断续续的解释着，每说一个字都会犹豫，“酒也是，我…心情不好才喝一点…”</p><p class="story-paragraph" data-source-index="1601">刘知珉突然站起来，让她有一瞬间心惊</p><p class="story-paragraph" data-source-index="1604">不喜欢吗？讨厌这样的我，所以现在连和我在一起都不愿意了吗？</p><p class="story-paragraph" data-source-index="1607">她拉住知珉的袖口，声音又开始发抖，“我…我以后不会这样了，真的…”，能不能不要再觉得金旼炡是个特别糟糕的人…</p><p class="story-paragraph" data-source-index="1610">衣服的一角轻松被知珉扯开，看着那个背影又开始窒息的难过。她并不知道刘知珉今天为什么回来，但总归不想让她走</p><p class="story-paragraph" data-source-index="1613">刘知珉熟练的走到厨房，没一会就把冰箱里的酒都拿到桌子上，接着打开，气泡炸裂的细微声在静谧的空气里格外清晰</p><p class="story-paragraph dialogue" data-source-index="1616">“我记得…你原来…”，酒精灌进口腔有些苦涩，知珉仔细思索起来，不知不觉的又开始回想起以前的事</p><p class="story-paragraph" data-source-index="1619">金旼炡急切的打断了她，“能别说以前吗？”，拳头逐渐握紧。别再说从前，太让人讨厌了，因为那些回忆，在这些时间里我已经想念了无数次，再也不想提了</p><p class="story-paragraph" data-source-index="1622">刘知珉目光有些空洞，并没有因为旼炡的打断而停止思念，反而愈加感到沉重</p><p class="story-paragraph dialogue" data-source-index="1625">“我们分开好像快有一年的时间了吧”</p><p class="story-paragraph dialogue" data-source-index="1628">“……十个月二十三天”，旼炡语气迟缓，但没有多加思索就回答了她的问题，她坐在知珉旁边，双手环住膝盖，“我都记得，我记得很清楚…每一天都是”</p><p class="story-paragraph dialogue" data-source-index="1631">“哈…是啊，你不是一向记忆很好嘛”知珉无力的笑出声，眉毛却紧蹙着，手里的易拉罐被捏响</p><p class="story-paragraph" data-source-index="1634">金旼炡停顿了许久，目光落在电视机旁倒扣着的相框上，止不住的心口酸涩，接下来的每一个字都变得艰难起来</p><p class="story-paragraph dialogue" data-source-index="1637">“分手…很久了”</p><p class="story-paragraph dialogue" data-source-index="1640">“久吗？”知珉扭头望向她，嘴角挂着淡笑，“可我们在一起的时间分明更久”，滚烫的视线相撞，知珉又做了那个率先避开的人，“你知道吧？姐姐不是记忆力很好的人…但我们在一起的时间快有七年…你的每个瞬间我几乎都没忘”</p><p class="story-paragraph dialogue" data-source-index="1643">“高中的时候不喜欢上文学课，讨厌吃食堂的泡菜，吃到冰镇过的西瓜会胃痛，习惯做题的时候捏耳朵……”，猛然间觉得喉咙涌上哽咽，说话都开始断断续续起来，“十几岁的金旼炡…虽然嘴上说不喜欢我，却嫉妒我身边的每一个人，会悄悄放过早上迟到的我，会为我赶走让人害怕的鸽子……”</p><p class="story-paragraph" data-source-index="1646">刘知珉深吸一口气，抬起头，再开口时灼热的空气和苦闷的哽咽已经一起吐出，“已经那么久了吗？分明觉得就是昨天发生的事…”</p><p class="story-paragraph" data-source-index="1649">她偏头，注意到把脸埋在膝盖里不断擦拭着眼泪的旼炡，似乎一切都开始豁然起来。知珉迅速擦干了眼泪，为旼炡打开一瓶啤酒，推到她面前</p><p class="story-paragraph dialogue" data-source-index="1652">“我们…总得好好结束一次吧，就算那么久了，也不想看到你总因为那件事责备自己，喝醉之后，就忘掉吧……全部……”</p><p class="story-paragraph" data-source-index="1655">无论正确还是错误，都要丢掉</p><p class="story-paragraph" data-source-index="1658">等到金旼炡终于抬起头拿起啤酒的时候，知珉看到她脸上湿润的泪痕</p><p class="story-paragraph dialogue" data-source-index="1661">“玩真心话的游戏吗？不想只喝酒，不想回答的话再喝吧，要试试吗？”</p><p class="story-paragraph" data-source-index="1664">没有等到知珉回答，旼炡就自顾自说起来，“稍微让着我一下吧，因为我有好多问题呢，我能先问吧？”，旼炡笑的很勉强，看起来狡黠的笑有很多破绽，“那么……刘知珉，以后会找别人恋爱吗？”</p><p class="story-paragraph" data-source-index="1667">她仍旧在意这件事</p><p class="story-paragraph dialogue" data-source-index="1670">“会”</p><p class="story-paragraph" data-source-index="1673">知珉几乎是斩钉截铁的回答了这个问题，没有一分钟犹豫。不管是因为什么，都不想让彼此的人生因为对方停滞下去，这是刘知珉的愿望</p><p class="story-paragraph dialogue" data-source-index="1676">“会因为我和别人交往了讨厌我？还是会真心祝福我？”</p><p class="story-paragraph dialogue" data-source-index="1679">“一定会讨厌姐姐的”，旼炡极力压制了喉咙里的哭泣，但仍旧十分明显的气息不顺</p><p class="story-paragraph dialogue" data-source-index="1682">“但是…”</p><p class="story-paragraph dialogue" data-source-index="1685">“到了那个时候，我会哭着祝你幸福的……如果能让你心疼从而改变主意的话，那样就最好了”</p><p class="story-paragraph dialogue" data-source-index="1688">“不过应该不会了吧，真的还会心疼我的话，就不会有那一天了”</p><p class="story-paragraph" data-source-index="1691">希望刘知珉不要再喜欢上任何人，这是我的私心。希望刘知珉能过得比过去每一天都要幸福，这是我最大的心愿，即使让她感到幸福的人不再是我，而是另外的某一个人</p><p class="story-paragraph" data-source-index="1694">回答了问题，但是旼炡却拿起酒瓶喝了一大口酒。她抹了一把脸，接着问，“为什么以前没说过那个…讨厌我做的那些事直接告诉我就好了啊…为什么不说？觉得我不会改吗？”</p><p class="story-paragraph dialogue" data-source-index="1697">“因为并不知道你是不是真的喜欢我，我害怕这些话说出口的时候会让彼此受伤。我讨厌看到你对我毫不在意的模样，真的……如果…如果你像我在意你一样那么喜欢着我……我也不会喜欢你会因为这些而责备自己的时刻，所以才选择了什么都不说”</p><p class="story-paragraph" data-source-index="1700">突然觉得心口轻松很多。知珉闭上眼，几乎全盘托出</p><p class="story-paragraph dialogue" data-source-index="1703">“我什么时候说不喜欢你了…”旼炡的声音强烈起来，音量逐渐拔高，甚至压抑到了快要崩溃的地步，每一声都开始失控</p><p class="story-paragraph dialogue" data-source-index="1706">“但你也几乎没说过喜欢我”</p><p class="story-paragraph" data-source-index="1709">刘知珉的音量也开始不受控制。不知道为什么又牵扯到了这件事上，她实际上比金旼炡还要抗拒翻出来这些陈旧的伤口</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph dialogue" data-source-index="1713">“我喜欢姐姐啊……”</p><p class="story-paragraph" data-source-index="1716">眼泪不受控制从眼眶里掉落的感觉并不好受，她半跪着抓住了知珉的胳膊，现在的样子绝对不好看，也一定十分狼狈</p><p class="story-paragraph dialogue" data-source-index="1719">“特别喜欢，我喜欢姐姐，还想听什么？我爱你，我喜欢你，我全都说给你听…以后不会再吝啬这些话…”</p><p class="story-paragraph dialogue" data-source-index="1722">“……”</p><p class="story-paragraph dialogue" data-source-index="1725">“是…觉得重新在一起太困难吗？还是你已经腻了，不再喜欢我了？”</p><p class="story-paragraph" data-source-index="1728">看着知珉紧紧咬住的下唇和泛红的眼眶，她心理的防线开始逐渐被击溃，呼吸变得异常困难，每一次抽吸都伴随着胸腔的疼痛</p><p class="story-paragraph dialogue" data-source-index="1731">“不回答也没关系，我替姐姐来喝吧”</p><p class="story-paragraph" data-source-index="1734">金旼炡猛的抓起桌上的酒杯，冰凉的啤酒因为喝的太急促顺着嘴角流下来一直蔓延到脖子，纤细的脖颈似乎一掐就会彻底断掉</p><p class="story-paragraph" data-source-index="1737">我看着金旼炡被啤酒呛到之后剧烈的咳嗽起来，于是握紧了她的手，她却仍旧固执的问</p><p class="story-paragraph dialogue" data-source-index="1740">“你还喜欢我吗？”</p><p class="story-paragraph" data-source-index="1743">我没办法回答这个问题，那是肯定的结果，但我不能说，不能随便让事情变得复杂，可我却忍不下心说谎，不愿意在这件事上骗她，我十分清楚她会因为这些多难过</p><p class="story-paragraph" data-source-index="1746">旼炡水润的嘴唇被咬住，又马上松开，她再次拿起新的啤酒灌进胃里。对酒精那么敏感的她，就算只喝一点也会感到十分难受，现在是不是已经开始觉得头晕了呢？</p><p class="story-paragraph dialogue" data-source-index="1749">“你还喜欢我吗？”金旼炡又重复这个问题，冰凉的啤酒滑进胃里让她感到阵痛，她挣开刘知珉抓住她手腕的手，拿起杯子</p><p class="story-paragraph" data-source-index="1752">她只想知道这个问题的答案</p><p class="story-paragraph" data-source-index="1755">已经开始模糊掉的光影重叠在一起，金旼炡几乎蜷缩成一团，单薄的脊背弯曲着，辛辣苦涩的液体再次含在了嘴里</p><p class="story-paragraph dialogue" data-source-index="1758">“我问你还喜欢我吗？”</p><p class="story-paragraph dialogue" data-source-index="1761">“我不用你帮我喝”，知珉恼怒的抓住她手里的酒杯，“我也不想玩这个游戏”</p><p class="story-paragraph" data-source-index="1764">金旼炡扒住她的胳膊，浑身的力气似乎都在流失，“我只想知道这一件事…”，她在知珉面前缓慢的垂下脑袋，“你告诉我吧…都那么久了…姐姐…我好累…”</p><p class="story-paragraph" data-source-index="1767">只要还喜欢我，不管多久我都会等下去，无论再遇到喜欢刘知珉的谁我都可以有底气去面对，什么样的惩罚我都接受，因为我有可以坚持下去的理由……求求你告诉我，别让我再一个人胡思乱想那么久</p><p class="story-paragraph dialogue" data-source-index="1770">“……”</p><p class="story-paragraph dialogue" data-source-index="1773">“我又让你觉得为难了吗？”</p><p class="story-paragraph" data-source-index="1776">金旼炡的声音越来越低，落在知珉耳朵里的音节却越来越清晰</p><p class="story-paragraph dialogue" data-source-index="1779">“我总是做这样的事……不管什么时候都是”</p><p class="story-paragraph dialogue" data-source-index="1782">“………”</p><p class="story-paragraph dialogue" data-source-index="1785">“我和姐姐是没办法成为朋友的…”</p><p class="story-paragraph dialogue" data-source-index="1788">“……”</p><p class="story-paragraph dialogue" data-source-index="1791">“那么，还是由姐姐来选吧……是做陌生人……还是做你的金旼炡……只能选一个来做…”</p><p class="story-paragraph" data-source-index="1795">我确定这是最后一次，我知道旼炡这孩子的决心，说完结束之后我相信她不会再一蹶不振下去，那是我最期待看到的场景，我原本也是来对我们之间的曾经做彻底的了结的</p><p class="story-paragraph" data-source-index="1798">我的金旼炡。今天离开之后会在某一天加上别人的前缀，曾经无数次幻想过的未来现在磕磕绊绊破碎的样子也那么让人心痛。旼炡拉着我胳膊的手无力的滑下来，她趴在我面前，我只能看到她不知道什么时候变瘦，连弯腰都会轻易凸起骨骼的后背，像个易碎的玩偶在我面前不停的啜泣，我拼命克制颤抖的手抚摸上她柔软的头发</p><p class="story-paragraph" data-source-index="1801">我脑海里全部都是你对着我微笑的样子。希望你的下一段人生，还要这样微笑着度过，就算再也不是因为我</p></div>

        <header class="chapter-header"><span class="chapter-number">11</span><h2>错过的盛夏</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-index="1824">毕业典礼的合照环节差不多是刘知珉最害怕的，来来往往的人挤过来询问能否合照，就算不认识也要露出微笑，会担心认错人，说出不礼貌的话</p><p class="story-paragraph" data-source-index="1827">肩膀上搭上了一只手，知珉回过头，看见许久没见过的脸，忍住不惊讶出声，“秀妍姐姐？”</p><p class="story-paragraph" data-source-index="1830">学士服让她有些拘束，动作都被束缚住，想给她一个拥抱却被绊住了手脚，一直到打扮精致的女人主动贴上来才苦哈哈的抱怨</p><p class="story-paragraph dialogue" data-source-index="1833">“衣服真的…我其实想先抱你的”</p><p class="story-paragraph" data-source-index="1836">成秀妍拍拍她的肩膀，似乎很无语，“别总那副模样，一副多情的样子，真讨厌”</p><p class="story-paragraph dialogue" data-source-index="1839">“说什么呢？”，知珉有些尴尬的摸了摸脖子，对成秀妍与生俱来的性格没有任何办法</p><p class="story-paragraph dialogue" data-source-index="1842">“真是大人物啊，据说是经济管理学院的优秀代表呢”</p><p class="story-paragraph" data-source-index="1845">她语气里调侃的语气实在太强烈，让刘知珉一时间不知道该怎么回答。面对成秀妍的时候倒是显得腼腆内向起来</p><p class="story-paragraph dialogue" data-source-index="1848">“别总是一见面就打趣我啊前辈”</p><p class="story-paragraph dialogue" data-source-index="1851">“为什么又开始叫前辈了？…你知道吗？旼炡最近经常来找我，叫秀妍姐姐叫的让人十分心情好”</p><p class="story-paragraph" data-source-index="1854">不知道为什么再听到金旼炡的名字从别人嘴里说出来有些怪异。知珉走神之际，成秀妍又凑上来</p><p class="story-paragraph dialogue" data-source-index="1857">“你和她？…她最近总问我关于你的事…你们还没有和好吗？”</p><p class="story-paragraph" data-source-index="1860">知珉再次感到头痛。谢天谢地，绘里不知道从哪里走出来，说要一起拍大合照，才终于有了逃跑的借口</p><div class="scene-divider" aria-label="场景转换"><i></i><i></i><i></i></div><p class="story-paragraph" data-source-index="1866">一切活动结束之后，绘里把知珉手里的捧花接过来，冷着脸指向礼堂门口，“有人在找你”</p><p class="story-paragraph dialogue" data-source-index="1868">“我哪里惹到你了”知珉皱着眉嘟囔着提起裙摆，向着门口走去</p><p class="story-paragraph" data-source-index="1871">正午的太阳十分热烈，滚烫的温度似乎能让人融化，她抬起手遮住太阳，只有一小片阴影挡住了刺目的阳光，知珉站在门口张望起来</p><p class="story-paragraph" data-source-index="1874">炽热的日光让人感到眩晕，知珉短暂的闭上了双眼，还没有完全适应黑暗就再次睁眼。这次穿着扎染蓝色露脐上衣和牛仔七分裤的金旼炡出现在自己面前</p><p class="story-paragraph" data-source-index="1877">纤细的腰暴露在空气里，不知道什么时候染了白金色的头发，微卷的长发半扎起来，在人群中格外扎眼，手上抱着精致的花束，路过的人群几乎都会被金旼炡漂亮的样子吸引</p><p class="story-paragraph" data-source-index="1880">知珉捏紧大腿旁边的布料，白色长裙的裙摆被提起来，她几乎是小跑着走向金旼炡</p><p class="story-paragraph" data-source-index="1883">也就是一瞬间，想把金旼炡藏起来</p><p class="story-paragraph dialogue" data-source-index="1886">“毕业快乐姐姐”，旼炡乖巧的不像话，把花递到面前，里面的向日葵格外显眼</p><p class="story-paragraph" data-source-index="1889">知珉有些别扭的接过来，不自然的打量她的脸，金旼炡又变漂亮了</p><p class="story-paragraph dialogue" data-source-index="1892">“原来说很忙是去染头发了啊…”</p><p class="story-paragraph" data-source-index="1895">她有些不满的抱怨金旼炡，其实只是因为看到别人觊觎金旼炡的样子很不爽，但并不是在交往的关系让她不能光明正大的说出口</p><p class="story-paragraph dialogue" data-source-index="1898">“啊…那个…不好看吗？”金旼炡故作纠结的咬住手指，微微低头，但却向上看她，一副做错事的模样</p><p class="story-paragraph" data-source-index="1901">她绝对是在撒娇</p><p class="story-paragraph" data-source-index="1904">刘知珉总是对这样的她束手无策，于是躲闪的小声嘟囔了一句，“什么啊…”</p><p class="story-paragraph dialogue" data-source-index="1907">“要一起约会吗？和还算漂亮？的我？”</p><p class="story-paragraph dialogue" data-source-index="1910">“不是下午还要上课吗？”知珉挑起眉毛，上下打量她</p><p class="story-paragraph dialogue" data-source-index="1913">“翘课了，我不去了”</p><p class="story-paragraph" data-source-index="1916">知珉没来得及思考就被拉住了手腕，那只即使在夏天也微凉的手顺着手腕和自己的掌心紧紧贴合在一起，人来人往的路上，好像是第一次正大光明的这样牵手穿过人群</p><p class="story-paragraph dialogue" data-source-index="1919">“真烦人，姐姐少漂亮一点吧，总是有讨厌的人在用那种眼神看”</p><p class="story-paragraph" data-source-index="1922">旼炡生气的脸鼓起来，在侧边看像鼓胀的包子。知珉拼命忍住了笑意</p><p class="story-paragraph dialogue" data-source-index="1925">“干脆就答应和我交往吧，这样刘知珉就不再是单身了啊，只有我能看”</p><p class="story-paragraph dialogue" data-source-index="1928">“……”</p><p class="story-paragraph dialogue" data-source-index="1931">“算了…做错事的金旼炡还是乖乖弥补过错吧…别再做烦人的事了…”</p><p class="story-paragraph" data-source-index="1934">金旼炡拉着刘知珉在人群中穿梭，一个人自顾自说着，可能会有些奇怪，但在刘知珉看来一切都那么可爱</p><p class="story-paragraph" data-source-index="1937">终于走到人很少的小路上，金旼炡仍旧充当那个喋喋不休诉说的人，突然间她停下来，脸上充斥着警惕的表情，看向前方，像察觉到危险信号的小型犬</p><p class="story-paragraph" data-source-index="1940">知珉也顺着她的目光看过去——是崔正浩</p><p class="story-paragraph" data-source-index="1943">一时间变得尴尬起来，知珉犹豫着要不要解释什么，崔正浩注意到前面的她却开始挥手，知珉知珉这样喊她的名字</p><p class="story-paragraph dialogue" data-source-index="1946">“姐姐”，旼炡突然站到身前，一副生气但又委屈的表情</p><p class="story-paragraph dialogue" data-source-index="1949">“怎么了？”</p><p class="story-paragraph dialogue" data-source-index="1952">“请先预支给我一个吻吧”</p><p class="story-paragraph" data-source-index="1955">我还没来得及反应，旼炡就揽住了我的脖子，因为穿了高跟鞋，旼炡不止比我矮了半个头，我承认我在迎合她，于是微微低头，和她的嘴唇贴在一起</p><p class="story-paragraph" data-source-index="1958">身后的呼喊声停止了，我悄悄睁开眼，看到近在咫尺的金旼炡露出得逞的笑，虽然是没得选，但是，我知道，无论如何，我都只会说那一个答案</p><p class="story-paragraph" data-source-index="1961">——我的金旼炡</p><p class="story-paragraph" data-source-index="1964">我抬头，太阳仍旧刺眼，耳边是不停息的蝉鸣，我无比确信</p><p class="story-paragraph" data-source-index="1967">那年错过的盛夏，又重新向我们张开了怀抱</p></div>
      </article>
    </template></div>
  <script>
    (() => {
      const chapterIds = ['chapter-01', 'chapter-02', 'chapter-03', 'chapter-04', 'chapter-05', 'chapter-06', 'chapter-07', 'chapter-08', 'chapter-09', 'chapter-10', 'chapter-11'];
      const chapterTitles = ['真烦人', '前女友', '没关系', '隐瞒者', '最差劲的人', '最后的饭局', '解酒糖', '仍旧爱你', '不能更糟', '只能选一个', '错过的盛夏'];
      const select = document.getElementById('chapter-select');
      const mount = document.getElementById('chapter-mount');
      const shell = document.getElementById('reader-shell');
      const progress = document.getElementById('reading-progress');
      const controls = { prev: [document.getElementById('prev-top'), document.getElementById('prev-bottom')], next: [document.getElementById('next-top'), document.getElementById('next-bottom')] };
      let current = 0;
      const indexFromHash = () => { const i = chapterIds.indexOf(location.hash.slice(1)); return i < 0 ? 0 : i; };
      function render(index, pushHash = true, scroll = true) {
        current = Math.max(0, Math.min(chapterIds.length - 1, index));
        const id = chapterIds[current];
        mount.replaceChildren(document.getElementById(id).content.cloneNode(true));
        select.value = id;
        controls.prev.forEach(button => button.disabled = current === 0);
        controls.next.forEach(button => button.disabled = current === chapterIds.length - 1);
        document.getElementById('prev-label').textContent = current ? chapterTitles[current - 1] : '已经是第一章';
        document.getElementById('next-label').textContent = current < chapterIds.length - 1 ? chapterTitles[current + 1] : '全文完';
        document.title = `最喜欢的讨厌的你 · ${chapterTitles[current]}`;
        if (pushHash && location.hash !== `#${id}`) history.pushState(null, '', `#${id}`);
        if (scroll) shell.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        updateProgress();
      }
      function move(delta) { render(current + delta); }
      select.addEventListener('change', () => render(chapterIds.indexOf(select.value)));
      controls.prev.forEach(button => button.addEventListener('click', () => move(-1)));
      controls.next.forEach(button => button.addEventListener('click', () => move(1)));
      addEventListener('popstate', () => render(indexFromHash(), false));
      function updateProgress() {
        const doc = document.documentElement;
        const max = doc.scrollHeight - innerHeight;
        progress.style.width = `${max > 0 ? Math.min(100, scrollY / max * 100) : 0}%`;
      }
      addEventListener('scroll', updateProgress, { passive: true });
      addEventListener('resize', updateProgress, { passive: true });
      render(indexFromHash(), false, false);
    })();
  </script>
