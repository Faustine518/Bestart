      <article class="chapter" data-chapter="section-08">
        <header class="chapter-header"><span class="chapter-number">08</span><h2>Chapter 8</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="2218:0">凌晨三点，深冬的寒气顺着建筑的缝隙侵袭进来，无孔不入。</p><p class="story-paragraph" data-source-key="2220:0">每靠近那个日子一天，志宇的梦魇就越加重一分，时间并没有起到多少淡化记忆的作用，几年来遭受的折磨也无法真正抵偿那一天的债。似乎无论过去多久，如同鬼影一样明灭的红蓝闪光都会永远缠着她。</p><p class="story-paragraph" data-source-key="2222:0">有风湿的人在阴雨天会更痛，而志宇总会在寒冬的夜晚失眠，一闭上眼就会看到那晚的景象，耳边又会交叠响起那些杂音和呼呼的风声，就算把整个身体缩起来，那晚被多绚死死抓住又狠狠挣开的手腕，似乎也会隐隐作痛，即使好不容易睡着，也会惊醒。</p><p class="story-paragraph" data-source-key="2224:0">自从多绚回来后，她连像条狗一样睡在多绚卧室床边地毯上的资格都没有了，说是她的信息素太乱，扰人心烦，便被打发到了一间空置的房间里独自待着。除此之外，忙于处理工作的多绚早出晚归，最近也不怎么碰她了，回来就把自己关在书房里。她却并不因此松一口气，对方越是这样，志宇反而越感到不安。</p><p class="story-paragraph" data-source-key="2226:0">志宇放轻脚步走在地板上，控制着不发出一点声响。一身冷汗地醒来，喉咙里却发干，她不得不起身，去厨房找一点冰水。</p><p class="story-paragraph" data-source-key="2228:0">书房的门缝里漏出一道冷色的光，在压抑的黑暗里格外显眼。</p><p class="story-paragraph" data-source-key="2230:0">多绚还没有睡，虽然在静谧的夜里压低了说话的声音，但志宇轻轻靠近门边，还是可以很明显地听出来，对方在打电话。</p><p class="story-paragraph" data-source-key="2232:0">偷听是不对的，于自己也没有好处，就当是想听听多绚的声音吧，毕竟被冷落了好几天，再说这种时间还能联系谁。关于多绚有了新玩具的猜想又不安地在脑海中冒出来，志宇鬼使神差地屏住了呼吸，小心翼翼地在门外站定。</p><p class="story-paragraph" data-source-key="2234:0">好在只是那种冷静、没有起伏的语调。</p><p class="story-paragraph dialogue" data-source-key="2236:0">“……不，不需要等朴氏的回购协议生效。”</p><p class="story-paragraph dialogue" data-source-key="2238:0">“评估报告我已经发给那边了。政客最擅长的就是切割，只要闻到腐烂的味道，他们动作比谁都快。”</p><p class="story-paragraph" data-source-key="2240:0">多绚的声音隔着门缝传出来，带着掌控局面的沉稳。</p><p class="story-paragraph" data-source-key="2242:0">这笔旧账终于还是要清算了吗……志宇没有忘记前段时间在那个叫她浑身不适、无地自容的聚会上，当她被朴允熙不讲道理地缠住，多绚过来帮自己解围时向对方低声放下的话。</p><p class="story-paragraph" data-source-key="2244:0">趁我还没腾出手来把朴家的旧账一并清算。</p><p class="story-paragraph" data-source-key="2246:0">请不要在这个时候，让我改变主意。</p><p class="story-paragraph" data-source-key="2248:0">果然多绚回来不只是为了把她当成一条狗养着。志宇感到一阵彻骨的寒意。如果不是因为父亲在几年前锒铛入狱且像个懦夫一样死在狱中，自己也落得这般下场，多绚的算账名单上排第一位的，应该是崔家才对。</p><p class="story-paragraph" data-source-key="2250:0">倒是应该感谢命运吗？狗一样的人生，已经是这幅样子了，已经没有办法再烂了，竟然因此让最恨自己的人失去了首要的报复摧毁目标，只得用这种不痛不痒的方式一点一点折磨回来。</p><p class="story-paragraph" data-source-key="2252:0">屋内一阵短暂的沉默之后，志宇听见多绚冷笑了一声。</p><p class="story-paragraph dialogue" data-source-key="2254:0">“我既然能费心思把她弄回来，就没想过退路。”</p><p class="story-paragraph dialogue" data-source-key="2256:0">“等一切结束，多余的东西自然有去处。扔回原来的地方，还是随便烂在哪里……那不重要。”</p><p class="story-paragraph" data-source-key="2258:0">多绚顿了顿，语调变得意兴阑珊，听不出是疲惫，还是对大局已定感到厌倦。</p><p class="story-paragraph dialogue" data-source-key="2260:0">“在那之前，只要待在该待的地方，发挥最后一点价值就行。”</p><p class="story-paragraph" data-source-key="2262:0">模糊的词句在志宇的脑海里冲撞，却也只是在几秒后陷入沉寂。</p><p class="story-paragraph" data-source-key="2264:0">多余的东西……大概是在说自己吧。</p><p class="story-paragraph" data-source-key="2266:0">志宇没有动，连眼睫都没有颤动一下。</p><p class="story-paragraph" data-source-key="2268:0">自己的价值是什么呢？</p><p class="story-paragraph" data-source-key="2270:0">想起那天非去不可的聚会，让她打扮得人模人样的，恰好遇到允熙，似乎算准了对方会纠缠一番，在刚好的时机过来解围……又想起那天出门前多绚暧昧的像欣赏漂亮玩具一样打量她的眼神。啊，真是被养得太心安理得，以至于如果不听到这通电话，都意识不到那一切都在多绚精准的计算中。</p><p class="story-paragraph" data-source-key="2272:0">带她去那个场合，在众目睽睽之下与她这个耻辱一样的存在并肩又如何，就算当着允熙的面管她叫“我的人”又如何，也不过只是为了扰乱允熙的思维，在收割朴家之前上演一出精神攻击而已，而自己只不过是一个工具，一颗棋子，却还天真地以为……</p><p class="story-paragraph" data-source-key="2274:0">随便烂在哪里，那不重要。</p><p class="story-paragraph" data-source-key="2276:0">什么都可以平静地听下去，唯有这一句……</p><p class="story-paragraph" data-source-key="2278:0">抵在墙壁上的指尖似乎被寒冷侵蚀，变得僵硬，一根一根地缩回来。书房里的通话还在继续，多绚似乎又翻动了几页纸张，志宇却什么都听不清了，已经失去了再听下去的勇气。</p><p class="story-paragraph" data-source-key="2280:0">只是慢慢地转身，缩回了阴影深处，像一个从未出现过的幽灵，一点动静都没有地，回到了走廊尽头的房间。没有开灯，任由自己跌坐在那张空荡荡的床上。</p><p class="story-paragraph" data-source-key="2282:0">是悲伤吗？好像不是，如果因为听到会被丢掉就悲伤，那在过去的几年里应该早就悲伤而死了。与其说是伤心，心中深不见底的恍惚的迷茫更像是一团迷雾，浓浓的，完全掩盖了多绚的面容。</p><p class="story-paragraph" data-source-key="2284:0">下意识地抬起手指，轻轻摩挲着唇瓣。偏偏在这种时候想起来呢。</p><p class="story-paragraph" data-source-key="2286:0">嘴唇上似乎还残留着前些日子在车里纠缠留下的细微刺痛感。那时候，多绚的眼神里藏不住的、浓烈到极点的爱恨。</p><p class="story-paragraph" data-source-key="2288:0">明明那时候……那么用力抓住我的，叫我记住那种疼的……</p><p class="story-paragraph" data-source-key="2290:0">也是你啊。</p><p class="story-paragraph" data-source-key="2292:0">因为想起了那样炙热的情感，此时回荡在耳边的那句随便烂在哪里变本加厉，仿佛冰冷的针尖，刺入耳膜，更深深地刺入心脏。</p><p class="story-paragraph" data-source-key="2294:0">她感到一种前所未有的荒谬。被多绚撕裂成两部分的灵魂，一半还在眷恋那个带着痛感的吻，另一半却已经在刚才那番冷酷的话语里提前凋零。</p><p class="story-paragraph" data-source-key="2296:0">志宇在床上蜷缩起身体，房间里暖气充足，也没有喝到冰水，却比刚才一身冷汗地惊醒时，体感冷一万倍。之前梦境里的黑色潮水似乎又悄无声息地涌来，漫过了床，没过了鼻尖，上一次是绝望，这一次是迷茫。甚至不知道是多绚的无情更叫人心凉，还是即便发现了真相，却仍在犹豫着渴望的自己更卑贱。</p><p class="story-paragraph" data-source-key="2303:0">接下来的几天，多绚又一次几乎消失在志宇的视线中，与上次消失不同，她还是会每天回到这间公寓来，只不过是志宇不敢面对那个像迷雾一样的女人罢了，反正多绚也不找她，虽然处在同一个屋檐下，也像两个毫不相干的存在。</p><p class="story-paragraph" data-source-key="2305:0">客厅里静得能听到加湿器喷出水雾的轻微运作声。志宇算准了多绚深夜回来时门廊里的脚步声，在指纹锁的提示音响起之前，她就会适时地回到那个冷清的次卧。</p><p class="story-paragraph" data-source-key="2307:0">不敢在多绚眼前晃。那晚隔着门缝听到的话像一把悬在头顶的铡刀，让志宇产生了生理性的畏缩，反正只要多绚不传唤，只要她竭力缩减自己的生存空间，好像只要足够表现得渺小，足够可以被忽略，就能延缓被多绚当废品处理掉的进度。</p><p class="story-paragraph" data-source-key="2309:0">这一天却还是终于到来了。十年前的这晚，志宇在寒夜中抛下了多绚。对于多绚来说，自己跑掉的背影就是她们整个过去的结局，一个最残忍的结局。</p><p class="story-paragraph" data-source-key="2311:0">可能永远没有机会告诉多绚，在多绚父亲出殡那天，她其实去过殡仪馆，躲在远处的树干后面，远远看过一眼当时已经两天两夜没有合眼的多绚。那个穿着黑色丧服的瘦弱的身影，似乎在那两天里迅速干瘪下来，面庞憔悴得好像随时会倒下一般。</p><p class="story-paragraph" data-source-key="2313:0">前来送行的人寥寥无几，死因牵扯到罪案，在外人看来是畏罪自杀，没有人愿意和这种事扯上关系，所以昔日的同事和校友之类的人际几乎都没有出现，人情就是如此寡淡的东西。到最后出发时，灵车前就只有多绚和母亲而已。</p><p class="story-paragraph" data-source-key="2315:0">上车前，多绚的动作突然凝固了。志宇看到她的头微微侧向一旁，是直觉吗，还是让她感知到了自己的视线。志宇在树后，猛地缩回了身体，心跳快得要炸裂。她甚至在祈祷，祈祷多绚千万不要看见她。让多绚在送别父亲的路上，还看到仇人的女儿，岂不是太罪该万死了吗。</p><p class="story-paragraph" data-source-key="2317:0">可最终，多绚也没有真的转过身，只是迟疑过几秒，随后决绝地跨上了那辆通往家族墓地的黑色灵车。</p><p class="story-paragraph" data-source-key="2319:0">志宇看着灵车缓缓驶去，消失在视野里，她才发觉身上单薄的黑色西装根本扛不住深冬的寒气。</p><p class="story-paragraph" data-source-key="2321:0">今天也一样，首尔迎来了入冬以来最阴沉的一个傍晚。</p><p class="story-paragraph" data-source-key="2323:0">多绚很早就出门了，也没有任何要回来的迹象。志宇在空荡的客厅里打开了电视，声音调得很低，也不是真的需要看，只是有个声音也好，毕竟多绚留给她与外界产生单向联系的渠道，也就剩下电视了。</p><p class="story-paragraph" data-source-key="2325:0">晚间新闻正在播报一则经济简讯，主播的语调冷静而平直。</p><p class="story-paragraph dialogue" data-source-key="2327:0">“……今日，首尔检察厅宣布正式对朴氏基建旗下的三家核心子公司展开专项稽查……”</p><p class="story-paragraph dialogue" data-source-key="2329:0">“……执政党发言人公开表示，将重新审视此前由朴氏中标的所有政府合作项目……”</p><p class="story-paragraph" data-source-key="2331:0">志宇这才正眼看向电视画面，正是朴氏财团总部大楼前乱成一团的景象。身穿深蓝制服的搜查官们正从大楼里搬出一箱箱资料。</p><p class="story-paragraph dialogue" data-source-key="2333:0">“……目前正面临各大债权银行的联合催收……”</p><p class="story-paragraph" data-source-key="2335:0">难道……这就是多绚的手笔？</p><p class="story-paragraph" data-source-key="2337:0">志宇目不转睛地盯着屏幕上被闪光灯淹没的允熙和她哥哥，两张过去不可一世的脸，在闪光灯下显得惨白而面如死灰。她身体控制不住地轻颤。</p><p class="story-paragraph" data-source-key="2339:0">就在这一瞬间，志宇明白了多绚那夜在电话里所说到的价值。</p><p class="story-paragraph" data-source-key="2341:0">如果手里只有证据，那些老谋深算的政客或许还会按兵不动，毕竟朴家根基深厚。但在竞标前夕，多绚带着她出现在允熙面前，放下那种话，让人方寸大乱。</p><p class="story-paragraph" data-source-key="2343:0">多绚一定是算准了允熙的偏执傲慢，聊到她会在那场聚会后心神不宁，甚至可能为了反击慌不择路，动用了某些不该动的资金、关系。到头来，自己只是一个好用的压力源，被多绚精准投放到了允熙已经岌岌可危的心理防线上，然后等时机成熟，猎人笑着收网。虽然她也不知道多绚能从中得到什么，但至少这个已经成长得精明如狐狸，狠辣如狮子的女人，一定不会让自己亏。</p><p class="story-paragraph" data-source-key="2345:0">在志宇漫长的出神中，电视上的新闻很快转成了关于天气预报的消息，说是今晚会开始下雪。她瘫坐在沙发上，屏幕的冷光映在她的瞳孔里。多绚还没有回来。</p><p class="story-paragraph" data-source-key="2347:0">如此，朴家已经垮了，复仇大概也进入了收尾阶段吧。</p><p class="story-paragraph" data-source-key="2349:0">好像一块被拧干了所有价值的抹布。</p><p class="story-paragraph" data-source-key="2351:0">正如多绚那天所说的，等一切结束，多余的东西自然有去处。</p><p class="story-paragraph" data-source-key="2353:0">想想可笑，多余的东西却听着要下雪的天气预报，担心着还没有回家的最终赢家。多绚或者正在哪里庆祝如此成果吧。虽然已经没有崔家可以给她扳倒了，但能在父亲的忌日里干出这样一番成就，或许也会减轻些堆积了十年的恨意和寂寥吧。</p><p class="story-paragraph" data-source-key="2355:0">门口却传来了指纹锁开启的提示音。</p><p class="story-paragraph" data-source-key="2357:0">糟了。</p><p class="story-paragraph" data-source-key="2359:0">过于陷入思考以至于没有察觉门廊上的动静，是多绚回来了，志宇却没能来得及躲回房间里。只得先抓起遥控器关掉电视，空气彻底安静下来，志宇在黑暗中僵硬地站起身。门开了，玄关的感应灯随之亮起，志宇不禁眯起眼睛，还没看清人影，先闯入感官的是一股浓烈的酒气。</p><p class="story-paragraph" data-source-key="2361:0">不知该不该迎上去，但看多绚摇摇晃晃走进来的身影，手上还拎着威士忌酒瓶，酒液已经只剩四分之一了，如果都是她喝下去的，那应该醉得不轻。志宇还是硬着头皮走了过去。靠近了才发现，除了酒气，她身上还带着一股山里的泥土腥气。志宇伸手扶她，手还没碰到多绚的胳膊，就被扑面而来的寒气激得缩了一下。</p><p class="story-paragraph" data-source-key="2363:0">那是蔚山乡下山头上刮了一整天的割脸寒风。</p><p class="story-paragraph" data-source-key="2365:0">那张原本总是冷淡精致的脸，此刻也因为半天山风吹袭而显得憔悴。外面下雪了，穿得并不厚实的多绚，鼻尖和脸颊冻得发红。眼睛里布满了交错的红血丝，眼神涣散，却在对上志宇视线的一瞬间，猛地聚焦。</p><p class="story-paragraph" data-source-key="2367:0">身体晃了晃，多绚没有站稳，顺势把大半个身子的重量都压在了志宇身上。</p><p class="story-paragraph" data-source-key="2369:0">冰凉的额头抵在志宇的颈窝里，喷出的呼吸也是凉的。</p><p class="story-paragraph dialogue" data-source-key="2371:0">“……你还在啊。”</p><p class="story-paragraph" data-source-key="2373:0">听不出是什么意思的话，好像是在怪她怎么还没消失，但身体又维持着这样的姿势，贪婪又嫌弃地吸入志宇颈侧那点活人的暖气。</p><p class="story-paragraph dialogue" data-source-key="2375:0">“看电视了吗？”</p><p class="story-paragraph dialogue" data-source-key="2377:0">“我还以为，朴家一倒，你就应该跟着朴允熙一起滚了……”</p><p class="story-paragraph" data-source-key="2379:0">多绚突然抬起头，在志宇的肩膀上推了一把，推得她后退了一步。</p><p class="story-paragraph dialogue" data-source-key="2381:0">“结果一开门还是你啊。”</p><p class="story-paragraph dialogue" data-source-key="2383:0">“还待在这里干什么？等我请你吃庆功宴吗？”</p><p class="story-paragraph" data-source-key="2385:0">带着明显的醉意，大着舌头说出的每个字都往志宇最疼的地方戳。一边说，一边胡乱蹬掉鞋子，摇晃着往客厅走，甩开了志宇跟上去试图搀扶的手，然后摔进沙发里，手里的酒瓶滚落在地毯上，落地时发出一声闷响。</p><p class="story-paragraph" data-source-key="2387:0">她看了一眼黑漆漆的客厅，又看向站在不远处不知所措的志宇，压抑已久的暴戾在酒精的催化下迅速回温。并没有最初以为的爽快，按计划搞垮了朴家，让那个曾经把自己按在地上跪着羞辱的朴允熙在自己面前下跪哀求，明明算是一雪前耻，却也没有多快乐。</p><p class="story-paragraph" data-source-key="2389:0">一下午的时间，多绚都在父亲的墓前呆坐。本该洒在墓前的威士忌，不是什么名贵的类型，只是父亲生前爱喝的、在加拿大随便哪个liquor store都能买到的酒，也被她自己喝掉一大半。酒在平时本是禁忌，可在父亲的墓前，她发现自己甚至无法坦荡地跪下，即便害死父亲的元凶早已死在监狱里，这却不是她所能控制的，反而是一股力气打在棉花上的无力和空虚。更无法面对的，还是她仍和仇人的女儿纠缠在欲海里，无法自拔。</p><p class="story-paragraph" data-source-key="2391:0">所以一句话也说不出来，只能不停喝酒。</p><p class="story-paragraph" data-source-key="2393:0">多绚盯着志宇，眼睛亮得惊人，现在倒是感觉有一肚子话可以说了。</p><p class="story-paragraph dialogue" data-source-key="2395:0">“刚才在爸爸面前……我不知道该说什么。”</p><p class="story-paragraph" data-source-key="2397:0">她歪着头，看着志宇由于震惊而微微颤动的肩膀，伸出手，意思要志宇靠过来。志宇迟疑了一秒，还是努力压制住身体的颤抖，顺从地过去跪在多绚面前，把脸凑到多绚冰凉的掌心里，指尖顺着志宇的侧脸滑到耳后。</p><p class="story-paragraph dialogue" data-source-key="2399:0">“我说，我买下了害死你的人的女儿，每天看着她像狗一样跪在我脚下……”</p><p class="story-paragraph dialogue" data-source-key="2401:0">“……但我没敢告诉他，我竟然还会吻你。”</p><p class="story-paragraph" data-source-key="2403:0">志宇的身体猛地僵住。</p><p class="story-paragraph dialogue" data-source-key="2405:0">“也不敢说，我回温哥华那几天，也停不下来想你……”</p><p class="story-paragraph dialogue" data-source-key="2407:0">“怕等我回来，你已经跑了……”</p><p class="story-paragraph dialogue" data-source-key="2409:0">“但你他妈竟然没跑……”</p><p class="story-paragraph" data-source-key="2411:0">多绚发出一声短促的冷笑，布满血丝的眼里是恨和自嘲交织在一起的荒唐。她还温柔地帮志宇理了理脸侧散落的碎发，似乎那样才好更清楚地看见她这张叫人又爱又恨的脸。</p><p class="story-paragraph dialogue" data-source-key="2413:0">“我就觉得更恶心了。”</p><p class="story-paragraph dialogue" data-source-key="2415:0">“你说，他在天上看着我这样，会不会也觉得很恶心？”</p><p class="story-paragraph" data-source-key="2417:0">多绚说着说着，明明笑了起来，嘴角却还是垮着。</p><p class="story-paragraph dialogue" data-source-key="2419:0">“崔志宇，你他妈就像个诅咒。只要你在一天，我就永远没法当个干净人。”</p><p class="story-paragraph" data-source-key="2421:0">她的手重新回到志宇的脑后，手指插进发丝里，像亲昵的恋人一样，将已经在不停发抖的志宇拉向自己，额头抵着额头。</p><p class="story-paragraph dialogue" data-source-key="2423:0">“……你让我觉得，我和你爸那种烂人没什么区别，和你这条狗也没什么区别。”</p><p class="story-paragraph" data-source-key="2425:0">多绚拍了拍她的后脑勺，扔下最后这句话，站起身，身形摇摇晃晃地回了卧室。</p><p class="story-paragraph" data-source-key="2429:0">志宇依旧跪着，在这片多绚离去后留下的像耳鸣一样的沉寂中，慢慢弯下脊背，把脸埋进沙发。</p><p class="story-paragraph" data-source-key="2431:0">良久，多绚的话似乎已经不再让她的神经感到尖锐的疼痛了。漫无边际的虚无感是黑色的海水，再一次淹没了她，但这一次，好像已经不再恐惧被淹没了，幻想中黑色粘稠的海水变得像母亲的羊水一样亲切，一点也不冰冷可怕了。</p><p class="story-paragraph" data-source-key="2433:0">她看着那瓶滚落在地的威士忌，不知道嘴角有没有浮出一抹笑意，反正心里是在笑的。</p><p class="story-paragraph" data-source-key="2435:0">多绚终究是大意了。似乎早就怕她某天会做出什么一般，这间公寓里没有刀具，没有瓷器，没有玻璃制品，没有钝器，连镜子都是软的。</p><p class="story-paragraph" data-source-key="2437:0">看着窗外在狂风中乱飞的雪，志宇突然觉得这一切都太累了。</p><p class="story-paragraph" data-source-key="2439:0">不是为了赎罪，也不是为了解脱多绚，而是彻头彻尾的疲惫。爱、恨、报复、苟活下去的念头，这些曾经支撑她活下去的东西，让她持续痛苦的东西，在这一刻都变成了毫无意义的底噪。狗一样的人生，这个游戏真是太长了，长到她已经不想再看哪怕一个回合。</p><p class="story-paragraph" data-source-key="2441:0">多绚似乎在房间里昏睡过去了。</p><p class="story-paragraph" data-source-key="2443:0">浴室冰冷瓷砖地面的冷气渗进了骨缝，志宇坐在地上，那半个酒瓶的断裂处极不规整，边缘带着锯齿状的尖锐。</p><p class="story-paragraph" data-source-key="2445:0">她右手握紧瓶颈，对着白净的左手手腕猛地划拉了过去。</p><p class="story-paragraph" data-source-key="2447:0">碎玻璃却没有想象中那么快。</p><p class="story-paragraph" data-source-key="2449:0">玻璃破开皮肤的声音在她的感官里异常清晰。第一下不够深，手腕处传来灼烧般的剧痛，紧接着血流出来的湿热，皮肉翻开的冰冷。</p><p class="story-paragraph" data-source-key="2451:0">志宇咬紧了牙，没有松手，却已经快没有继续下去的力气了，身体好像比意志更留恋人世，深呼吸了好几次，重新振作精神，终于才又能手抖着拿起半截玻璃瓶，顺着已经存在的血肉模糊的缺口，再一次横向用力一划。</p><p class="story-paragraph" data-source-key="2453:0">那一秒，痛感达到了峰值，不敢弄出太大动静，志宇脖子上的筋暴起，大口大口地呼吸着，以此代替想大喊出声的冲动。好在痛苦随即变得麻木，滚烫粘稠的液体顺着伤口更多地涌了出来，流在白色的瓷砖上，很快就蔓延开。</p><p class="story-paragraph" data-source-key="2455:0">这样应该就可以了吧，只要再安静地过一会儿，就可以消失了。</p><p class="story-paragraph" data-source-key="2457:0">志宇靠在浴缸边缘，看着那些血。血流得很快，带走了她体内仅存的一点温度。视线开始像坏掉的信号一样，出现了大片黑色的噪点，耳鸣声越来越大，盖过了浴室里空旷的回响。</p><p class="story-paragraph" data-source-key="2459:0">视线开始涣散。</p><p class="story-paragraph" data-source-key="2461:0">这种感觉不坏，志宇心想。像是在慢慢沉入深海，那种冰冷粘稠的触感从指尖一路攀爬，最终温柔地没过了她的口鼻。经年累月的窒息感，在多绚面前不得不维持的卑微与渴望，都在这一刻逐渐退潮。取而代之的，是十年前那个傍晚，多绚家的客厅。</p><p class="story-paragraph" data-source-key="2463:0">那是崔志宇第一次觉得自己像个被放错了位置的昂贵花瓶。即便她才是出身优渥的大小姐，但在那个陌生的空间里，她却找不到可以落脚的归属感，局促地坐在沙发上，脊背挺得笔直，指尖无意识地摩挲着膝盖上的短裙布料。</p><p class="story-paragraph" data-source-key="2465:0">然后，门开了。</p><p class="story-paragraph" data-source-key="2467:0">是多绚带着一身明媚而略显叛逆的气息闯了进来。夕阳的光跳跃在她的发梢，那是志宇从未拥有过的生命力。多绚走近了些，就那样定定地盯着她看，眼神里满是少女不加掩饰的好奇。</p><p class="story-paragraph" data-source-key="2469:0">志宇有些生疏地站起身，手心微微冒汗，轻声问好。</p><p class="story-paragraph" data-source-key="2471:0">可少女根本没搭理她，只是在那一瞬间脸红了起来，然后转身跑走了。</p><p class="story-paragraph" data-source-key="2473:0">视线在变窄，光也在退。​</p><p class="story-paragraph" data-source-key="2475:0">志宇只看得见那个背影。十六岁的多绚，穿着校服，正跑向走廊尽头。​志宇试图伸手去抓住她的衣角。想让多绚停下来，求她回头，然后带自己走。</p><p class="story-paragraph" data-source-key="2477:0">​那是她生命中一切美好的起点，也是她所有罪恶的源头。</p><p class="story-paragraph" data-source-key="2479:0">​仿佛只要抓住了，这十年间的所有就都能一笔勾销。</p><p class="story-paragraph" data-source-key="2481:0">可她太虚弱了，眼前这段看起来近在咫尺的距离却怎么也缩短不了。</p><p class="story-paragraph dialogue" data-source-key="2483:0">“多绚……等等我。”</p><p class="story-paragraph" data-source-key="2485:0">虚弱地呢喃着，幻觉中的手臂在虚空中徒劳地伸展。想追上那个还没有开始恨她的多绚，想跟那个背影一起消失在走廊尽头的白光里。</p><p class="story-paragraph" data-source-key="2487:0">那样，她们就不必经历那一切了。</p><p class="story-paragraph" data-source-key="2489:0">可她追不上。无论她如何努力地向前探出身躯，那个明媚的幻影始终与她隔着一段生死的距离。</p><p class="story-paragraph" data-source-key="2491:0">就在她的灵魂即将触碰到那抹光亮的一刻，一股巨大的带着毁灭气息的，却极其真实的压力，突然死死扣住了她的左手腕。力道极其蛮横，五根手指几乎紧紧掐进她皮肉翻开的伤口里，指甲几乎要嵌进她的骨缝里。那是要把一个即将坠入悬崖的人强行拖拽上来的力气。</p><p class="story-paragraph" data-source-key="2493:0">不……</p><p class="story-paragraph" data-source-key="2495:0">一只无形的手这样拽住了她，拽住了她的死志，或许是她身体里属于多绚的意志吗？一如多绚的父亲自杀那天，多绚绝望而走投无路时，就是这样死死地扣住了志宇的手腕，用破碎的声音求她别走。</p><p class="story-paragraph" data-source-key="2497:0">……放开我。</p><p class="story-paragraph" data-source-key="2499:0">志宇张了张嘴，却发不出声音。她的手腕被攥得生疼，比亲手划开的伤口还要疼不知道多少倍，那种带着绝望和恨意的力道，跨越了时间，在空无一人的浴室里将她牢牢捕获。她想挣脱，然后像十年前那样逃掉，可她现在连动一根手指的力气都没有。</p><p class="story-paragraph" data-source-key="2501:0">无形的抓握越来越紧，紧到让她感到比死还绝望。原本以为死是最后的出口，可在那只手的控制下，才发现自己连走向解脱的权利都没有，好像她必须留在这具肮脏的躯壳里，去承受那个名为多绚的、永无止境的余生。</p><p class="story-paragraph" data-source-key="2503:0">志宇痛苦地皱起眉，指尖徒劳地抓挠着浴室冰冷的瓷砖地面。</p><p class="story-paragraph" data-source-key="2505:0">少女的幻影在白光中彻底消散了，通往清白的出路被永久封死。取而代之的，是被宿命强行留下的残忍的窒息感。身体深处那股不属于她的生命力，正强迫她快要停止的心脏重新搏动。</p><p class="story-paragraph" data-source-key="2512:0">多绚栽倒在床，迷迷糊糊睡着了不过20分钟，就被一种异样的寂静惊醒。</p><p class="story-paragraph" data-source-key="2514:0">她猛地坐起身，跑出卧室，酒精尚未散去的脑子在那一秒精准地捕捉到了危机。</p><p class="story-paragraph" data-source-key="2516:0">那瓶酒不见了。</p><p class="story-paragraph" data-source-key="2518:0">没有惊慌失措地四处乱撞。多绚只是沉着脸，快步走到浴室门口，看着那扇虚掩的门里透出灯光，眼神里闪过一丝意料之中的阴沉。</p><p class="story-paragraph dialogue" data-source-key="2520:0">“崔志宇，开门。”</p><p class="story-paragraph" data-source-key="2522:0">里面没有回应。</p><p class="story-paragraph" data-source-key="2524:0">多绚推开门，呼吸好像在那一秒被掐断了。</p><p class="story-paragraph" data-source-key="2526:0">浴室里没有预想中的挣扎声，只有一种死人般，令人耳鸣的寂静。</p><p class="story-paragraph" data-source-key="2528:0">志宇瘫在浴缸边上，身体折叠成一个极其不自然的弧度。她太瘦了，隔着湿透的白衬衫，能清楚地看到后背那一节节凸起的脊椎骨。</p><p class="story-paragraph" data-source-key="2530:0">而她的左手就浸在那滩红得发黑的液体里。</p><p class="story-paragraph" data-source-key="2532:0">最让多绚心惊的不是血，而是志宇的脸。那是多绚从未见过的、完全脱了相的灰白。她的眼皮半睁着，眼神已经散了，瞳孔里没有任何倒影。那双总是藏着愧疚、总是躲避多绚视线的眼睛，此时只是无光地、空洞地盯着地板上的某一个点了。</p><p class="story-paragraph" data-source-key="2534:0">她没有在动，也没有在哭。</p><p class="story-paragraph" data-source-key="2536:0">因为大量失血，志宇的胸口几乎看不出起伏。每隔很久，肩膀才会极其细微地抽动一下，发出一声极轻而干瘪的吸气声。</p><p class="story-paragraph" data-source-key="2538:0">青紫色的嘴唇微微张着，没有一丝热气。</p><p class="story-paragraph" data-source-key="2540:0">多绚站在门口，手还搭在门把手上，指尖不可自制地颤抖起来。原本还想把志宇拎起来愤怒地质问，你怎么敢死的，谁允许的。但看着眼前这个连骨头都快撑不住皮肉的，几乎彻底碎掉的志宇，她脑子里只剩下一个念头。</p><p class="story-paragraph" data-source-key="2542:0">她大步跨过那滩血迹，膝盖重重撞在冷硬地砖上，伸手死死扣住了志宇那个血流如注的手腕。又迅速扯下架子上的毛巾，紧紧勒住了志宇的上臂。</p><p class="story-paragraph" data-source-key="2544:0">手掌覆盖在那个裂口上，温热的液体像有生命一样，顺着她的虎口、指缝疯狂地往外钻，越是用力，那种温热滑腻却迅速变凉的感觉就越明显。或许她控制得了志宇的行动范围，控制得了志宇的一举一动，但就算她是神，也掌控不了志宇的死亡。</p><p class="story-paragraph" data-source-key="2546:0">这一次，志宇终于没有再甩开她了。或许是求生本能对靠近的热源的渴望，志宇像个破碎的玩偶一样，软绵绵地歪进了她怀里。</p><p class="story-paragraph dialogue" data-source-key="2548:0">“不准死。”</p><p class="story-paragraph" data-source-key="2550:0">多绚的声音很低，听起来依旧冷硬，但按住志宇伤口的左手却在剧烈地颤抖。看着志宇那张惨白的脸，心里搭建了十年的用来装满恨的宏伟建筑，在这一刻轰然坍塌。</p><p class="story-paragraph" data-source-key="2552:0">右手死死搂住志宇的肩膀，把她的脸贴在自己颈窝里，仿佛这样就能把自己的体温传过去了。多绚低下头，额头抵在志宇变凉的额头上。</p><p class="story-paragraph dialogue" data-source-key="2554:0">“别死……”</p><p class="story-paragraph" data-source-key="2556:0">声音听起来不像是从空气中传来的，更像直接贴在她骨头上震动的。志宇觉得自己在下坠，掉进一个没有底的深潭。</p><p class="story-paragraph" data-source-key="2558:0">感觉到自己被什么温热的东西包裹住了，不再是冰冷坚硬的瓷砖和浴缸，而是一个正在剧烈起伏的、急促震颤的怀抱。</p><p class="story-paragraph" data-source-key="2560:0">她想睁开眼看看，但眼皮沉得像灌了铅。她只能感觉到那双掐着她的手在发抖，抖得那么厉害，连带着她的身体也跟着颤抖。</p><p class="story-paragraph" data-source-key="2562:0">还没结束吗……</p><p class="story-paragraph" data-source-key="2564:0">志宇靠在多绚怀里，模糊地感受着她身上混合了酒精与恐惧的体温。她想闭上眼彻底沉入虚无的黑暗。但多绚抱得那么紧，紧到让她觉得，自己依然是这个世界上，多绚唯一能抓住的东西。</p><p class="story-paragraph" data-source-key="2575:0">凌晨，两人从医院回来。雪已经停了。</p><p class="story-paragraph" data-source-key="2577:0">志宇的面色在冷白的灯光下近乎透明，右手腕上缠着厚重的纱布，时刻提醒着她们几个小时前那场惨烈的自我了断。她脚步虚浮，每走一步都像是踩在浮云上，由于失血而带来的轻飘感让她整个人显得更加不像还活着。</p><p class="story-paragraph" data-source-key="2579:0">多绚走在她身后，在刚才的混乱中沾染上衣服的血迹已经干涸。她一言不发，神情隐匿在走廊的阴影里，只有还在轻轻发抖的左手，已经在医院用酒精洗手液仔细搓洗过，却好像还是清楚地残留着滑腻温热的触感，指甲几乎要掐进掌心的肉里。</p><p class="story-paragraph" data-source-key="2581:0">沉默着进了卧室，志宇熟练地走到床边，她垂着头，正准备像往常那样跪下、蜷缩在地毯上。</p><p class="story-paragraph dialogue" data-source-key="2583:0">“上去。”</p><p class="story-paragraph" data-source-key="2585:0">多绚的声音很低，疲惫到了极点，再没有了平时的凌厉。</p><p class="story-paragraph" data-source-key="2587:0">志宇的动作僵住了。她转过头看向多绚，眼神里不是受宠若惊，只是迟钝的困惑。她迟疑了片刻，才脱掉衣服，在那张宽大柔软的床的一侧躺下，长长的身体蜷缩成一小团，生怕惊扰了什么似的，又像是想把自己缩进虚无里。</p><p class="story-paragraph" data-source-key="2589:0">多绚也脱掉沾着血迹的衣服，关了灯，房间陷入的黑暗。</p><p class="story-paragraph" data-source-key="2591:0">志宇感觉到身后的床垫塌陷了下去。多绚躺在了她身后，没有预想中那样继续发酒疯，也没有发出没我允许不准死的威胁。</p><p class="story-paragraph" data-source-key="2593:0">多绚只是慢慢凑近，动作轻得不易察觉。最后，她将额头靠在志宇微微凸起的脊骨上。</p><p class="story-paragraph" data-source-key="2595:0">单纯的、脆弱的触碰。志宇感到多绚滚烫且不稳的呼吸，一下又一下打在皮肤上，体温偏低，所以那气息是烫人的。多绚抬起手，虚虚地搭在志宇腰侧的被子上，最终也没有卸下力气放稳，好像把她当成一个随时会破碎的气泡对待了。</p><p class="story-paragraph dialogue" data-source-key="2597:0">“崔志宇……”</p><p class="story-paragraph" data-source-key="2599:0">多绚的声音在黑暗中响起。</p><p class="story-paragraph dialogue" data-source-key="2601:0">“别再这样吓我了。”</p><p class="story-paragraph" data-source-key="2603:0">那是自重逢以来，志宇听过多绚最柔软也最无力的一句话。</p><p class="story-paragraph" data-source-key="2605:0">志宇依然背对着她，盯着窗外时不时闪烁的对面楼顶的几点红光。脑海里是一片望不到头的荒原。暂时还想不明白。在父亲忌日当天咒骂她、说她的存在是种诅咒的多绚，和此时这个贴在她背后一边发抖，一边求她活下去的多绚，究竟哪一个才是真的。</p><p class="story-paragraph" data-source-key="2607:0">死过一次的感觉太虚无了，虚无到志宇已经没有力气维持卑微的顺从。</p><p class="story-paragraph dialogue" data-source-key="2609:0">“……为什么救我？”</p><p class="story-paragraph" data-source-key="2611:0">如果不管她，一切不就都结束了吗？多绚可以彻底摆脱这个纠缠多年的怨恨，这个肮脏的累赘，可以回温哥华，或者去一个没有过去，也没有崔志宇存在痕迹的地方，重新开始。</p><p class="story-paragraph" data-source-key="2613:0">多绚想说，因为我还没折磨够，因为你欠我的还没还清。</p><p class="story-paragraph" data-source-key="2615:0">但最终，她没有回答，只是更用力地用额头抵着志宇的脊背，试图汲取那点微弱但仍然真实存在的体温。那不是委屈，而是极度后怕的生理反应。</p><p class="story-paragraph" data-source-key="2617:0">是啊……为什么呢。</p><p class="story-paragraph" data-source-key="2619:0">如果这一天，既是父亲的忌日，又成了崔志宇的忌日，那她在这个世界上还剩下什么？</p><p class="story-paragraph" data-source-key="2621:0">哪怕是恨，哪怕是折磨，只要崔志宇还活着，就还有个可以恨的对象，还有一个可以确认自己真实活着的坐标。如果崔志宇死了，那她这十年的咬牙切齿，所有的野心和筹码，都会在一瞬间变成最荒诞的笑话。</p><p class="story-paragraph" data-source-key="2623:0">不想让志宇死。本来只是想让志宇感到痛苦，可最后发现，当志宇真的快要从生命中消失时，痛得入骨的那个人，竟然是她自己。</p><p class="story-paragraph dialogue" data-source-key="2625:0">“睡觉吧。”</p><p class="story-paragraph" data-source-key="2627:0">多绚最终只是无力地吐出了这几个字。</p><p class="story-paragraph" data-source-key="2629:0">她伸出手，小心翼翼地、避开伤口地握住了志宇那只冰凉的手。志宇没有抽回。她闭上眼。在充满血腥气和疲惫的夜晚，她们像两具在荒芜的废墟中堆叠在一起的残骸，互相取暖。</p><p class="story-paragraph" data-source-key="2631:0">这一晚，志宇没有等到教训或惩戒，却等到了多绚在她背后流下的冰冷的，不知为何而流的眼泪。</p><p class="story-paragraph" data-source-key="2633:0">或许这才是最残忍的惩罚。她们谁也没法彻底解脱，谁也无法上岸，直到真正的死亡到来那天为止，都只能在爱恨交织的黑色深海里，拖着彼此支离破碎的灵魂，继续缓慢而痛苦地游下去。</p><p class="story-paragraph" data-source-key="2635:0">一起游下去。</p></div>
      </article>

      <article class="chapter" data-chapter="section-09">
        <header class="chapter-header"><span class="chapter-number">09</span><h2>Chapter 9</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="2638:0">即使脱离了生命危险，失血过多的虚弱还是让志宇无法在短期内提振精神，恢复如初。</p><p class="story-paragraph" data-source-key="2640:0">几乎整天都在睡，身体软绵绵地陷在柔软的床里，如果不主动去打扰她的睡眠，似乎就会像睡美人一样永远睡下去。在噩梦里伴随了十年的尖锐的鸣笛声、闪烁的警灯，还有一切让志宇睡不安稳的东西，好像都随着流出身体的血，流进了地漏，永远地消失了。比起生理上虚弱造成的嗜睡，更像是纯粹的补偿，把过去因为心不安、理不得而欠下的睡眠，趁着这股病气，一次性补回来。</p><p class="story-paragraph" data-source-key="2642:0">托这个的福，多绚索性把办公地点搬到了卧室对面的书房里，一步也不敢离开公寓，她连公司也不去了。除了几个必须亲自上线参加的会议，社交几乎能推就推，电话能不接就不接。显示器的荧光映在她眼底，神情冷淡且心不在焉。这会要开到什么时候。但凡有人在此刻没有眼力见地向她提问，就会暴露此刻的神游。每隔一会儿，目光就不受控制地飘向那道虚掩着的房门上。</p><p class="story-paragraph" data-source-key="2644:0">主要议程一结束，来不及听完收尾的场面话，多绚就匆匆下了线。为了精准监控伤口愈合的情况，多绚在手机里设置了一连串闹钟。这精确到分的照看，恐怕比医院里的护士认真多了吧。多绚自嘲地笑了笑。刚合上电脑，闹钟响起的动静就划破了书房里平静的空气。起身时膝盖撞到桌腿，也顾不上疼了，比起在意这点小事，她快步走了出去，轻轻推开卧室的门。</p><p class="story-paragraph" data-source-key="2646:0">虽是大白天，但卧室的窗帘紧闭，只开了床下暖黄色的灯带，床上的人影模糊。志宇缩在被子里，黑色的短发散乱在枕头上，衬得那张清俊的脸白得透明。多绚来到床边坐下，动作极轻地把几乎盖住志宇半张脸的被子往下掖了掖。呼吸太轻了，轻到如果不仔细盯着她肩头的起伏，就会产生那种让人心脏骤停的错觉。</p><p class="story-paragraph" data-source-key="2648:0">看来留下的心理阴影远比以为的深，多绚下意识探出的食指悬在半空，指尖控制不住微微颤抖。她屏住呼吸，慢慢凑过去，手指探到志宇的鼻尖下。</p><p class="story-paragraph" data-source-key="2650:0">细微但温热的气流，缓慢地拂过指间。</p><p class="story-paragraph" data-source-key="2652:0">嗯，有进有出，是好事。</p><p class="story-paragraph" data-source-key="2654:0">紧绷的脊背瞬间松懈了，她闭上眼，一边叹气，一边摇了摇头。</p><p class="story-paragraph" data-source-key="2656:0">你倒是睡得坦然得像个刚出生的婴儿……心惊胆战的事情倒是全留给了我，却已经没有再发火的心气。</p><p class="story-paragraph" data-source-key="2658:0">药箱就放在床头，不过医生嘱咐过，拆线前频繁打开纱布更换会容易引起二次创伤。道理是都明白的，多绚却总是对此不安心。与其说是担心伤口能不能好好恢复，倒不如说是她需要一个能来频繁查看志宇状态的借口。如果不是因为要来看看纱布下面有没有新的血迹渗出、摸摸志宇的手心是不是冷的，如果不是因为这些……似乎想不到其他什么可以理直气壮地来骚扰志宇睡眠的理由。</p><p class="story-paragraph" data-source-key="2660:0">要不要把人叫醒呢。盯着志宇沉睡的侧脸看了一会儿，最终还是没舍得。她伸出手，指尖探入被子里，避开患处，轻轻托起志宇缠着绷带的左手腕拿出了被子。包得厚实的纱布下，隐约能看见内层透出一点干涸的深褐色，是前天缝合时留下的旧血迹。</p><p class="story-paragraph dialogue" data-source-key="2662:0">“几点了……？”</p><p class="story-paragraph" data-source-key="2664:0">太专注于手上的动作，没注意到志宇已经醒来，多绚的手指顿了顿。</p><p class="story-paragraph dialogue" data-source-key="2667:0">“三点。吵醒你了？”</p><p class="story-paragraph" data-source-key="2669:0">略显僵硬地回了一句，多绚试图让语气听起来平常一些，手却还托着志宇的手腕没舍得立刻放回被子里去。</p><p class="story-paragraph dialogue" data-source-key="2671:0">“上午不是才看过……”</p><p class="story-paragraph dialogue" data-source-key="2673:0">“……是医生说的，要观察有没有红肿和渗血。”</p><p class="story-paragraph" data-source-key="2675:0">空气里透着一丝难以言喻的尴尬，这种尴尬源于今天清晨。</p><p class="story-paragraph" data-source-key="2677:0">大概是天还没亮透的时间，这两天都睡得不深的多绚听到身边人发出一声闷哼，身体似乎形成了条件反射般，还没等大脑清醒，手臂已经横跨过半张床探过去，摸索着将那个单薄虚弱的身体搂进了怀里。</p><p class="story-paragraph" data-source-key="2679:0">可等到晨光彻底亮起，多绚睁开眼时，却发现志宇早就醒了。志宇还在她怀里，没有挣扎着挪开，也没有像过去那样因为畏惧或者自觉不配而瑟缩，只是那样乖顺地靠在她怀里，睁着那双清澈得透明的狗狗眼，安安静静地盯着她看。眼神里没有害怕，也没有卑微的讨好，干净得像一张白纸。</p><p class="story-paragraph" data-source-key="2681:0">这又是闹哪出啊。</p><p class="story-paragraph" data-source-key="2683:0">很显然，人是自己要抱着的，推开也不是，显得太冷淡、太玩儿不起了，就这么抱着也很奇怪，她们什么时候是这么舒适亲密的关系了……比起自己的犹豫，志宇倒是显得无比坦然。该说不亏是鬼门关走过一遭的人吗，不仅像个婴儿那样爱睡觉，连看世界的方式都变成了婴儿的视角吗？</p><p class="story-paragraph" data-source-key="2685:0">多绚记得当时自己还没来得及收回抱着志宇而发麻的手臂，就听见对方开玩笑的语气，轻声说了一句能把她气晕过去的话。</p><p class="story-paragraph dialogue" data-source-key="2687:0">“I should&#x27;ve done it earlier.”</p><p class="story-paragraph" data-source-key="2689:0">什么？</p><p class="story-paragraph" data-source-key="2691:0">……疯了吗？</p><p class="story-paragraph" data-source-key="2693:0">脸色应该难看到了极点吧，多绚想。还残留在手上的血流走的滑腻触感、连日的担惊受怕、隔两个小时就要惊醒一次的神经衰弱……这家伙竟然还敢开这种厚脸皮的玩笑。是不是从此以后只要自己敢对她不好，就又要故技重施了。</p><p class="story-paragraph dialogue" data-source-key="2695:0">“说什么鬼话呢……”</p><p class="story-paragraph" data-source-key="2697:0">多绚冷着脸，生硬地抽回了手，翻身下床。看着志宇苍白的脸上略带笑意，明明心里隐隐作痛，说出口的话却带着冰渣。</p><p class="story-paragraph dialogue" data-source-key="2699:0">“有力气开这种玩笑，看来是死不了了。”</p><p class="story-paragraph dialogue" data-source-key="2701:0">“有力气就起来吃点东西，别指望我一直这么抱着你……”</p><p class="story-paragraph" data-source-key="2705:0">虽说那时候是真的想死，想切断这些病态的纠缠的心是真的，但如果那晚真的死了，就看不到多绚这副狼狈又真实的模样了。简单洗漱了一番的多绚，已经到厨房去了，外面远远传来锅碗瓢盆叮叮当当的声音。那个女人，真的会做饭吗？</p><p class="story-paragraph" data-source-key="2707:0">志宇想起刚才看到多绚眼睑下淡淡发青，心里泛起一阵酸胀。本是贱命一条，赌输了就什么都不剩，自己会解脱，可多绚会痛苦下去，但好在，赌赢了。甚至生出了某种卑劣的愉悦，不仅把那些压得人喘不过气的重担全部丢下了，还发现自己在这个女人心中竟然占据了如此分量……所以才能开那种玩笑吧，即使多绚反应冷淡，但那正说明她在意得不得了，不是吗？</p><p class="story-paragraph" data-source-key="2709:0">志宇心里反而越来越安定了。从此只需要作为崔志宇活下去就好，因为命是多绚捞回来的，所以应该说，只是作为金多绚的崔志宇活下去就好。</p><p class="story-paragraph dialogue" data-source-key="2713:0">“……是医生说的，要观察有没有红肿和渗血。”</p><p class="story-paragraph" data-source-key="2715:0">眼神心虚地错开了，落在那圈缠得厚实的纱布上。这副理直气壮又别扭的样子，让原本沉闷的空气都鲜活了不少。为了掩饰过于明显的心思而扯出医生的话，这样的多绚未免显得太可爱、太好懂了。或许还是贪恋早上那个突然抽走的怀抱吧，志宇突然很想抱抱这个专心守着她、连门都不敢出的女人，想再多感受一下多绚身上真实存在的体温，也想把脸埋进对方的颈窝里，多绚身上的香气是最让她安心的。</p><p class="story-paragraph" data-source-key="2717:0">可刚动了动身体，浑身不适的黏腻感就顺着脊背爬了上来。</p><p class="story-paragraph" data-source-key="2719:0">失血后的虚汗、积压了两三天的药味，还有那晚从浴室带出来的，仿佛擦不掉的血腥气……志宇是个爱干净的人，即便是在过去那段最落魄的当玩物的日子里，她也习惯把自己打理得清爽。</p><p class="story-paragraph" data-source-key="2721:0">现在这种状态，这么狼狈的样子……</p><p class="story-paragraph dialogue" data-source-key="2723:0">“多绚啊……”</p><p class="story-paragraph" data-source-key="2725:0">声音还带着沙哑，志宇试着动了动右手，勉强撑起上半身。</p><p class="story-paragraph dialogue" data-source-key="2727:0">“我想洗个澡。”</p><p class="story-paragraph" data-source-key="2729:0">听到洗澡两个字，多绚整个人肉眼可见地绷紧了。淌满血的浴室地板成了她这辈子的PTSD，而且前天才缝合的伤口也不能沾到水，下意识就想否决，可志宇看起来需要极了。</p><p class="story-paragraph dialogue" data-source-key="2731:0">“身上很不舒服……”</p><p class="story-paragraph" data-source-key="2733:0">最终，无辜的大眼睛里的坚持让她败下阵来。</p><p class="story-paragraph" data-source-key="2735:0">嗯……只要在旁边盯着就没事吧。</p><p class="story-paragraph" data-source-key="2743:0">浴室里，多绚正半跪在浴缸边，指尖反复探进热水里，确认着温度是否合适。应该不是因为蒸腾而起的雾气才让人感到燥热吧，只是放个洗澡水而已，但好像上次和志宇一起出现在主卧的浴室里，还是那晚……志宇的那晚的表情和眼神可真好啊，抛开了种种恨意，果然感受到的原始的吸引力才是最真实直白的。什么时候再来一次好了，但要怎么开口呢，至少应该等她先恢复了再说吧……明明不是该想那种事情的时候。多绚摇了摇头，试图把上次志宇跪在她两腿间的记忆清出脑海。</p><p class="story-paragraph dialogue" data-source-key="2745:0">“好了。”</p><p class="story-paragraph" data-source-key="2747:0">多绚站起身，转头看向靠在门口的志宇，目光下意识落在那只不方便的左手上。</p><p class="story-paragraph dialogue" data-source-key="2749:0">“我帮你……”</p><p class="story-paragraph dialogue" data-source-key="2751:0">“多绚。”</p><p class="story-paragraph" data-source-key="2753:0">志宇却轻声打断了她，嘴角勾起淡淡的弧度。</p><p class="story-paragraph dialogue" data-source-key="2755:0">“我可以自己来。右手还能动，没那么废。”</p><p class="story-paragraph" data-source-key="2757:0">如果是以前，多绚一定会冷笑一声，说着你全身上下哪里我没看过，然后强硬地按她的意思继续下去。但此刻，面对志宇平静但透着认真的眼睛，到了嘴边的充满掌控欲的话语却突然哑火了。</p><p class="story-paragraph" data-source-key="2759:0">她在那双眼睛里看到了“自己”。 不是在抗拒，只是在温和地声明，她是一个完整的、需要被尊重的人。</p><p class="story-paragraph dialogue" data-source-key="2761:0">“可是你的手不能沾水……”</p><p class="story-paragraph dialogue" data-source-key="2763:0">“我会注意的。我保证。好吗？”</p><p class="story-paragraph dialogue" data-source-key="2765:0">“那……好吧。”</p><p class="story-paragraph" data-source-key="2767:0">似乎终于开始学着收敛侵略性，多绚喉咙微动，把话咽了下去，走到门边，来到志宇面前，她有些局促地避开了视线，喉咙又干涩地滑动了一下。</p><p class="story-paragraph" data-source-key="2769:0">志宇就那样松松垮垮地靠在门框上，以至于视线与她齐平了。随意裹在身上的睡袍领口也因为她虚弱的站姿向一边撇开，露出大片白得近乎透明的皮肤，瘦削的锁骨凹陷，再往下，是轻轻起伏的隐约可见的胸口。然而她自己就像注意不到这一切有多色情一样。</p><p class="story-paragraph" data-source-key="2771:0">怎么回事，脑子好像真的不对劲了，干嘛对一个病号想法多得出奇。明明是个连走路都要扶墙的病号，信息素更是淡得闻不到，按理说，现在的崔志宇应该是一点吸引力都没有的。多绚的视线却不受控制地在志宇脸上、身上流连。病态的白，比10年前还明显的阴郁的易碎感，不得不承认，这是一种前所未有的危险吸引力。</p><p class="story-paragraph" data-source-key="2773:0">真是疯了。</p><p class="story-paragraph" data-source-key="2775:0">对着一个刚刚从鬼门关回来，连路都走不稳的人……</p><p class="story-paragraph" data-source-key="2777:0">不再仅仅是因为恨或占有欲，而是更深的，让她感到畏惧的情感。</p><p class="story-paragraph" data-source-key="2781:0">多绚赶紧把手背到身后，手指在志宇看不见的地方猛地攥紧。</p><p class="story-paragraph dialogue" data-source-key="2783:0">“怎么了？”</p><p class="story-paragraph" data-source-key="2785:0">察觉到多绚的不自然，志宇疑惑地眨了眨眼。</p><p class="story-paragraph dialogue" data-source-key="2787:0">“没什么。”</p><p class="story-paragraph dialogue" data-source-key="2789:0">“……我就在门外，有事叫我。”</p><p class="story-paragraph" data-source-key="2791:0">人已经走出浴室，手却还放在冰冷的金属门把上，犹豫着。她原本已经将房门带到了只剩一丝缝隙的位置，却怎么也无法完全关好。</p><p class="story-paragraph" data-source-key="2793:0">倒不是出于卑劣的窥伺欲，而是为了安全的考量。</p><p class="story-paragraph" data-source-key="2795:0">害怕只要自己一关门，里面的人就会再次无声无息地淹没在那片血红之中。后怕是一根勒进她皮肉里的细钢丝，只要志宇脱离她视线一秒，就会猛地收紧。所以最终也没能放心关上门，就僵持在门外，透过那道两指宽的缝隙，屏息凝神地注视着里面志宇的一举一动。</p><p class="story-paragraph" data-source-key="2797:0">浴室内的雾气尚未完全弥漫开来，志宇背对着门站立，身上披着的那件深色丝质开衫睡袍，材质轻软，松垮地挂在肩上，随着她右手解开系带的动作，正要脱下，志宇却微微侧过头，余光瞥见了那条微微翕动的门缝。</p><p class="story-paragraph" data-source-key="2799:0">就说没听到关门的声音呢。</p><p class="story-paragraph" data-source-key="2801:0">该说是太了解多绚了吗。强烈的掌控欲，在她干出伤害自己的事之后，变异成了病态的责任感，明知道这种偷看里不带什么情欲的轻浮，志宇还是感到无奈，想靠近却又怕碰碎什么的卑微与不安，像个哨兵一样笨拙地守在门口，这种行为发生在金多绚这个人身上，有一种荒谬的可爱。只是，多绚越是这样，就越是不想让她看到……</p><p class="story-paragraph" data-source-key="2803:0">她知道吗？</p><p class="story-paragraph" data-source-key="2805:0">好像不知道吧。被带回来这么久，志宇从来没有在多绚面前脱光过，反正也没有需要她脱光的时候。所以应该没有看到过吧，她背上的伤痕。</p><p class="story-paragraph" data-source-key="2808:0">多绚大概以为，她这几年经历的，仅是在权贵间流转、出卖色相的轻浮苦楚。但实际上发生过什么，又在她身上留下了什么，志宇不想让她知道，从前也就罢了，但现在这个把她当命一样守着的多绚……</p><p class="story-paragraph" data-source-key="2810:0">那是多久以前的事呢。父亲入狱后，允熙很快就变脸了，本来就一直记恨着她心里有多绚这件事，所以她过上猪狗不如生活的开端，允熙是第一个出手推动的。她被带到各种派对上，被允熙的狐朋狗友们当作一件可以随意亵渎的玩具，那一双双黏腻又无法逃避的手伸向她时，她的人性一点点裂开。</p><p class="story-paragraph" data-source-key="2812:0">后来，允熙玩腻了，像处理一袋垃圾一样，把她转手卖给了一个情绪不稳定的中年女Omega。那是灵魂彻底崩塌的时刻。那个女人有着极其扭曲的控制欲，每当她在外面受了气，老公的气、儿子的气，就会来到关她的那间昏暗潮湿的地下室，先是对她一顿诉苦、一顿骂，然后就用各种顺手能拿到的物件抽打她，什么都有，皮带、电源线、衣架，能抓到什么就往她背上招呼什么。</p><p class="story-paragraph" data-source-key="2814:0">记不清有多少次，她被要求趴在冰冷的地板上，听着身后那个女人打得卖力而发出的粗重呼吸和挥动物件的破风声。皮肉裂开的声音却很钝，痛到无法承受的时候，灵魂好像脱离身体，飘到天花板上，冷眼看着下面那个被打得缩成一团的自己。</p><p class="story-paragraph" data-source-key="2816:0">伤口在地狱一样的日子里反复裂开、发炎、抹药，最后形成了一条条凹凸不平、颜色深浅不一的疤痕。眼神也从最初的抗拒变为了死水般的麻木，以至于后来又几经转手，从豪宅到那个白色的疗养院，其实还松了一口气，至少在那里不用担心被打死。</p><p class="story-paragraph" data-source-key="2818:0">所以不确定多绚知道多少呢。怕被看到，不是怕多绚嫌弃，而是怕看到多绚眼中可能出现的会让她意志力崩塌的怜悯，或是……因为没能早点找到她而产生的对自己的怨恨。多绚这样骄傲的人，如果知道她曾经被像头畜生一样对待过，大概会真的疯。</p><p class="story-paragraph" data-source-key="2820:0">志宇转过了身，正对着那道门缝，正对着门背后多绚紧缩的瞳孔。</p><p class="story-paragraph" data-source-key="2822:0">被发现了吗。</p><p class="story-paragraph" data-source-key="2824:0">没有点破多绚的窥视，反而态度坦然，目光温和地隔着空气回望过去。志宇右手搭在腰间的系带上，动作轻缓得仿佛在拆昂贵的礼品。唇角在解开系带的那一刻轻轻地勾了一下，纵容又狡黠的弧度。还有心情笑。随着腰带的解开，深色的丝质睡袍顺着白皙的肩头滑落。</p><p class="story-paragraph" data-source-key="2826:0">丝绸划过皮肤的声音在安静的空气里异常清晰，光滑的布料向下坠落。</p><p class="story-paragraph" data-source-key="2828:0">身体毫无遮拦地暴露在多绚的视野里。没有因为赤裸而感到羞耻，相反，甚至为了让多绚看得更清楚，还微微挺了挺胸，像是故意的。因为温差，乳头轻微立着，不算大但漂亮的胸部随着呼吸起伏。病态的色气。原本清澈的眼里也蒙上了一层迷离的水汽，一动不动地盯着门缝外的多绚。</p><p class="story-paragraph" data-source-key="2830:0">本来脑海里就充斥着一堆不合时宜的想法的多绚，遭受了这种级别的视觉冲击，呼吸骤然一滞。</p><p class="story-paragraph" data-source-key="2832:0">好像确实从来没有好好看过志宇的身体。小时候总是很别扭，别扭地发泄欲望，别扭地不承认那是喜欢，只当是背着朴允熙和志宇偷情，还要防着被爸妈发现，所以总是急躁地速战速决，没那么从容的心态和场合，甚至衣服也不脱完……后来，后来当然更没有理由了，谁要看养的狗的身体啊。</p><p class="story-paragraph" data-source-key="2834:0">再说，一个alpha身材那么好是干什么……腰窄得仿佛她单手就能圈住，凹陷的弧度顺着紧致的小腹向下收紧，随即又在胯骨处舒展开。那种程度的清瘦下，臀部却依然有诱人的圆润曲线。</p><p class="story-paragraph" data-source-key="2836:0">忍不住视线再往下，虽然是软着的，但连那里也很好看……</p><p class="story-paragraph dialogue" data-source-key="2838:0">“还没看够吗？”</p><p class="story-paragraph" data-source-key="2840:0">浴室里传来声音，让多绚原本紧绷的肩膀抖了一下。</p><p class="story-paragraph" data-source-key="2842:0">再看下去真的会出事的。这种感觉对多绚来说太陌生了。习惯了在对方面前展现绝对的高姿态，可现在却被志宇用看胡闹小孩般的温柔包裹着，被抓包的窘迫让她的脸颊后知后觉地烧了起来。</p><p class="story-paragraph" data-source-key="2844:0">害羞？</p><p class="story-paragraph" data-source-key="2846:0">自尊心受挫？</p><p class="story-paragraph" data-source-key="2848:0">恼羞成怒？</p><p class="story-paragraph" data-source-key="2850:0">好像都不是。</p><p class="story-paragraph" data-source-key="2852:0">没敢再看下去，关上门的动作仓促地用力。清脆的闭合音在寂静的房间里格外响亮。多绚背靠着浴室门，闭上眼，脑子里是志宇的身体，啊不，是志宇刚才那个意味不明的微笑。她抬起手，有些烦躁地松了松衣领，刚才为了参加视频会议穿了衬衣，现在只觉得领口勒得呼吸不畅。</p><p class="story-paragraph" data-source-key="2854:0">真是个疯子。</p><p class="story-paragraph" data-source-key="2856:0">低声咒骂了一句，却在骂完之后，又不自觉地按了按自己嘭嘭直跳的心口。</p><p class="story-paragraph" data-source-key="2865:0">或许是因为精神高度紧绷后又陡然松懈，睡眠不佳、作息紊乱，多绚的发情期提前了。反正应该不是因为被那个病弱的alpha吸引的，多绚对此拒不承认。</p><p class="story-paragraph" data-source-key="2867:0">夜晚的房间里，空气开始变得粘稠。多绚今天已 裂缝。</p><p class="story-paragraph" data-source-key="2988:0">​多绚的吻变得越发缠绵而贪婪，小手钻到床单与志宇的头颅之间，也扣住志宇的后脑勺，舌头像要伸进志宇的喉咙里那样深深探索。而志宇仰着脖子，喉咙里溢出破碎的呻吟，不是因为痛苦，而是归位时的回响。</p><p class="story-paragraph" data-source-key="2990:0">她们终于变回了那个四手四脚的，完整的整体。</p><p class="story-paragraph" data-source-key="2992:0">志宇的右手下意识地环住多绚的腰，指尖因为极度的快感而陷进多绚温热的皮肤里，会抓伤多绚吗？或许会吧，但也不怕了。因为她就是多绚，多绚就是志宇啊。哪怕手心那些割裂的伤痕在隐隐作痛，也舍不得松开。她能感觉到多绚的身体也在轻轻颤抖，那不是因为畏惧，而是因为一切终于归位的满足感。</p><p class="story-paragraph" data-source-key="2994:0">​志宇睁开眼，正对上多绚向下看的视线。</p><p class="story-paragraph" data-source-key="2996:0">​在那对幽深的眼眸里，志宇清晰地看到了两个人的倒影，一个人的眼睛里怎么可能看见两个人的倒影呢？但就是看见了，看见她们紧紧相拥，发丝缠绕，连呼吸的频率都达到了神奇的同步。志宇肯定，多绚在这一刻也听到了肉体与精神严丝合缝连接的声音，如同深谷回响，沉重而笃定。她们终于不再是债主和罪人，主人和狗，而是两片残破但终于找回了彼此，宁愿烂在一起化成灰也绝不会再分开的灵魂。</p><p class="story-paragraph" data-source-key="2998:0">她再也不需要追寻过去的背影。​因为当她们睁开眼，看到的、吻到的、吞噬的，就是她们灵魂的全部，所有爱与罪孽唯一的终点。</p><p class="story-paragraph" data-source-key="3000:0">在推向顶峰的瞬间，多绚猛地收紧了手臂，紧紧搂住志宇的脖子，脊背紧绷成一张拉满的弓，随后在剧烈的震颤中颓然崩塌。无力支撑的身体瘫在志宇的身上，那张总是写满傲慢与恨意的脸，此刻深深地埋进志宇温热的颈窝里，喘息着，感受着志宇的脉搏疯狂跳动。</p><p class="story-paragraph" data-source-key="3002:0">​多绚那干燥而滚烫的唇瓣紧紧贴在了志宇的侧颈上，不再索求什么，只是那样死死地压在志宇搏动的颈动脉上。多绚在发抖。温热急促的鼻息打在她的皮肤上，每一个细小的触碰都像是在确认，确认这具身体里还有热血在流动、心脏还在有力跳动，确认这一度如死灰般苍白的皮肤上，仍有鲜活的温度。</p><p class="story-paragraph" data-source-key="3004:0">​​志宇忽然觉得，现在的多绚一点也不凶，反而有点可怜，就像一只在暴雨里被淋透了、好不容易才找到一个树洞钻进去躲雨的猫。</p><p class="story-paragraph" data-source-key="3006:0">​志宇的手慢慢抬起来，还有点没力气。她先是试探着碰了碰多绚汗湿的肩膀，怕惊动了这场温存，见对方没有躲开，反而往她颈窝里钻得更深了，才放心地把手覆在多绚的后脑勺上。</p><p class="story-paragraph" data-source-key="3008:0">​“没事的。”</p><p class="story-paragraph" data-source-key="3010:0">​志宇小声说着，嗓音因为刚才激烈的折腾还有些沙哑，但听起来格外温柔。她微微侧过脸，把同样干燥的唇瓣贴在多绚的鬓角上，轻轻蹭了一下。</p><p class="story-paragraph" data-source-key="3012:0">​“我在。”</p><p class="story-paragraph" data-source-key="3014:0">​她把手臂收得更紧了些，多绚急促呼吸着的身体在她怀里僵了一下，随后卸掉了所有力气，更加沉重地压在她身上，没有哭声，只有身体在极力克制中发出的细微颤动，直到从多绚眼眶里涌出的、带着悔恨和后怕的湿度将她们彻底浸透。</p><p class="story-paragraph" data-source-key="3016:0">​志宇感受着颈窝里的潮湿，多绚不是会轻易流眼泪的人，而这是她见过的第二次，也还是藏起来不让她看到。恍惚间，她又想起那个警灯闪烁的绝望夜晚，因为懦弱而挣开了那双手逃跑、把多绚独自丢在满目疮痍的废墟里整整十年的自己。</p><p class="story-paragraph" data-source-key="3018:0">心里那个从未停止奔跑的背影，</p><p class="story-paragraph" data-source-key="3020:0">终于在这一刻回头。</p><p class="story-paragraph" data-source-key="3030:0">窗外的风声似乎都消失了。</p><p class="story-paragraph" data-source-key="3032:0">情欲的余韵在寂静中悄然沉降，只剩下两人交叠的细微呼吸声。</p><p class="story-paragraph" data-source-key="3034:0">志宇趴在柔软的枕头上，被汗水浸湿的短发乱糟糟地翘着。月光落在她赤裸的背脊上。在那片曾经白瓷般无瑕的肌肤上，几道陈旧的伤痕交错而过，在月影下触目惊心。</p><p class="story-paragraph" data-source-key="3036:0">多绚侧身撑着头，指尖探过去，原本想去抚平志宇微皱的眉心，却在看到那些旧伤的瞬间顿住。</p><p class="story-paragraph" data-source-key="3038:0">那一刻，记忆里的画面和眼前的现实重叠。她想起十七岁的崔志宇，那时候的志宇是那样完整。可这十年，她不在的十年里，志宇到底经历了什么？不得而知，只看到丑陋的伤痕，记录了志宇在那些她不在的日子里，如何在泥淖中碾转求生。但不好说，毕竟自己也在志宇的手腕上留下了同样不可磨灭的痕迹。</p><p class="story-paragraph" data-source-key="3040:0">多绚鼻尖一阵发酸，苦涩的痛感从心口一直顶到喉咙。她用力闭了闭眼，才忍住了又要哭的冲动，才哭了，又哭像什么话啊。动作比刚才接吻时轻柔一万倍，缓慢地、一寸寸地吻过那些凸起的疤痕。</p><p class="story-paragraph" data-source-key="3042:0">志宇察觉到了背后柔软的触感，也早就感知到了多绚停留在伤痕上的视线，但却因为疲惫而疏于隐藏，现在想翻身却已经来不及了。</p><p class="story-paragraph dialogue" data-source-key="3044:0">“别看了……很难看。”</p><p class="story-paragraph dialogue" data-source-key="3046:0">“别动。”</p><p class="story-paragraph" data-source-key="3048:0">掌心贴了上去，覆盖在那片伤痕最密集的地方。多绚没有多说什么，只是安静温柔地抚摸着。被多绚指尖触碰过的地方，渐渐散发出柔和的暖意。太温存的触感，给了志宇一种前所未有的安宁。原本紧绷的肩膀在那声别动中慢慢放松下去。还是趴在枕头上，侧着头，看着多绚的脸。</p><p class="story-paragraph" data-source-key="3050:0">眼皮变得沉重，意识开始涣散。陷在多绚的温柔里，志宇迷迷糊糊地想，</p><p class="story-paragraph" data-source-key="3052:0">大概，今晚，真的不会再做噩梦了。</p></div>

      <article class="chapter" data-chapter="section-10">
        <header class="chapter-header"><span class="chapter-number">10</span><h2>Chapter 10</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="3055:0">五月的雨细密而绵长，好像已经习惯了这种无孔不入的湿润气候，只是在学院里短暂地在室外走走，志宇已经懒得打伞了，她拉起外套上的帽子，钻进雨中，赶往下一堂课的教学楼。</p><p class="story-paragraph dialogue" data-source-key="3057:0">“……斯宾诺莎认为，如果你认为自由意味着能够按照自己的意志行事，那么你可能误解了自由。真正的自由，是对必然性的深刻理解。”</p><p class="story-paragraph" data-source-key="3059:0">教授用马克笔敲击着白板上写得歪斜的Necessity.</p><p class="story-paragraph" data-source-key="3061:0">这门被排在周五下午的PHIL 101似乎让很多人精神涣散。由于是转学分项目的预科课程，这里的学生大多只有18、19岁，上课前抬眼环顾四周，都是些年轻却沉闷的面孔。已经28岁的志宇不想太显眼，习惯性坐在教室靠后的位置。原来的短发已经长长了些，垂落在脸侧，鼻梁上架着略显土气的黑框眼镜。她敲击键盘做笔记的动作很轻。</p><p class="story-paragraph" data-source-key="3063:0">调整一下屏幕的角度，藏在衣袖下的左手腕露了出来，白皙的皮肤上还留着变浅了一点的痕迹，已经褪成了浅粉色，像条虫。志宇拽了拽袖口，又把它藏了回去。想起之前多绚说过不止一次要带她去做激光，说是不想在完美的东西上看到会让她心惊肉跳的东西，但志宇每次都只是笑笑，温和地推脱了。似乎没有那么想抹掉它的存在。</p><p class="story-paragraph dialogue" data-source-key="3065:0">“……当你意识到某种结果是由于先前的因果必然导致的，就从被动的痛苦中解脱了，这就是自由。”</p><p class="story-paragraph" data-source-key="3067:0">志宇似懂非懂。</p><p class="story-paragraph" data-source-key="3071:0">本来是可以安逸地待在家里什么都不用干的，那也确实是志宇刚来温哥华时候的状态。整日做些养养花，遛遛狗的闲事，多绚陪她的时候很多，但也时常不在家。过去很多年都是在生存模式下度过，只能被动地顺从打击。在那个过程中她只是告诉自己接受，扛下去就行了，但没想到日子顺遂起来，在那样安静得能听到耳鸣的生活里，偶尔，过去的痛苦像潮汐一样反扑。</p><p class="story-paragraph" data-source-key="3073:0">而她的爱人显然不具备精神导师的功能。比起耐心地倾听开导，多绚的方式总是直接的，她更相信眼前冒着热气的肉体。每当发现志宇的精神有被过往侵蚀的迹象，多绚就不知疲倦地侵蚀她的身体。甚至说出要不我给你生个孩子你在家带孩子吧那种不着边际的话，把志宇惹得面红耳赤，刚才还缺乏神采的眼睛瞬间睁圆了。</p><p class="story-paragraph" data-source-key="3075:0">你、你怎么能随便说这种话。声音不自然地颤抖着，她看向多绚带着顽劣笑意的眼睛，脸上因为情欲而升起的红晕被这突然的、不知是开玩笑还是真心的话吓得褪去，志宇很快避开了多绚的注视。</p><p class="story-paragraph" data-source-key="3077:0">自己的人生活明白了吗，还孩子，像我这样的人……</p><p class="story-paragraph dialogue" data-source-key="3079:0">“才不是随便说的呢。再说，上次我妈还问……”</p><p class="story-paragraph" data-source-key="3081:0">见一提到母亲，志宇就一副更不自在的样子，多绚只能把到了嘴边的话咽回去。她上次去妈妈家里，不仅带回来一锅参鸡汤，还带回来了长辈的关切。虽然把志宇带来这边生活了这么长一段时间，但还没有带她去见过妈妈。尽管妈妈知道她们的情况，对过去已然看开的女人也没表示出什么反对，但似乎总觉得还没到合适的时机。这件事情上，或许妈妈的态度不是主要问题。不过，每次母亲做了什么好吃的带回来，志宇都吃得很香，说是很幸福的味道。志宇几乎不怎么提起自己的母亲，多绚只知道那个女人在崔家失势之后立刻就带上一大笔钱跑路了。</p><p class="story-paragraph" data-source-key="3083:0">本来只是想逗逗这个呆子的。多绚撇撇嘴，明明自己心中焦躁，却有些不耐烦地捏了一下志宇的脸颊肉。捏起来比在首尔的时候长了点肉，至少，这是件好事。</p><p class="story-paragraph dialogue" data-source-key="3085:0">“那算了。要管两个你这么麻烦的人，我真的会累死。”</p><p class="story-paragraph" data-source-key="3089:0">于是志宇开始看书了，像是寻找一个理由、一个终极答案。如果命运是荒诞的，顺从是否也具有某种悲剧性的意义。</p><p class="story-paragraph" data-source-key="3091:0">最后竟然久违地坐在了课堂上。</p><p class="story-paragraph" data-source-key="3093:0">外面很危险的，你这种家伙，去上几天学就会被小猫小狗叼走。多绚嘴上说着不满的话，但还是同意了志宇重返校园的愿望。再是美到想让人藏在家里的花，如果只能看着她在房子里枯萎，那也是没有意义的。</p><p class="story-paragraph" data-source-key="3102:0">迟到了半节课的女孩直接坐到了志宇旁边的空位上，落座时还故意往她肩膀上撞了一下，年轻且直白的侵略感，志宇对此并不陌生。这是另一门课小组作业的同学，一段时间以来，对志宇表现出了令人头疼的执着。并不认为自己有什么特别魅力的志宇，对年轻人来说似乎格外有吸引力，哪怕她什么也不做，或许就是因为什么也不做，这种Alpha太少见了。比起侵略性和傲慢，志宇身上只有如水般的平和。温润森林的气息按多绚的要求已经尽量藏起来了，但这种矜持似乎比明晃晃的存在更具诱惑力。</p><p class="story-paragraph" data-source-key="3104:0">过去长期被摧残了自尊而形成的软弱，让志宇在拒绝别人这件事上显得笨拙。但她把在学校里遇到的事都告诉了多绚，连同这些对她表现出兴趣的人们一起。比起在课上学了什么，多绚对这部分信息更关心，反应也很有趣，一边展现出我早就知道会变成这样的态度，一边又有点不爽。她对志宇很放心，只是不喜欢自己的人被别人打主意。但又感到虚荣心得到了满足，毕竟，这证明志宇确实很有魅力，而这样有魅力的人只会死心塌地地爱着她。被外人挑战的感觉激起了多绚久违的斗志，毕竟温哥华的日子太平稳，有这种事出现，也算一种情趣。</p><p class="story-paragraph" data-source-key="3106:0">女孩侧过头，温热的呼吸几乎要打在志宇的耳廓上，声音很低。</p><p class="story-paragraph" data-source-key="3108:0">&quot;Hey, I missed the first half. Can you send me your notes later?&quot;</p><p class="story-paragraph" data-source-key="3110:0">女孩的淡淡薄荷味信息素飘了过来，志宇的背僵了一下，犹豫着要不要挪到旁边的座位上去，但怎么看都太刻意了。但如果又带着别人的气息回去的话……她把领口往上拽了拽。锁骨上有一处红痕，是出门前多绚非要留下的，理由是得让学校里的小猫小狗知道这块肉是有主人的才行。啊，这是什么事啊，还不如直接标记省事呢，为什么Alpha不能被Omega标记呢，那样的话大家都会绕着她走了，多绚也会更有安全感。</p><p class="story-paragraph dialogue" data-source-key="3112:0">“Sure.”</p><p class="story-paragraph" data-source-key="3114:0">别说待会儿发了，现在就给你发，赶紧收下然后离我远一点吧，拜托。</p><p class="story-paragraph" data-source-key="3124:0">到下课时间之前，志宇就提前收拾好了东西。要是不动作快一点闪人，难免又要被对方拉着闲聊几句。后半堂课总觉得怪不自在，总感觉背后有一道视线盯着她，但当她疑神疑鬼地回过头，一切看起来都很正常。她背起包，女孩却几乎同时也离开了座位跟了上来，虽然不是自愿的，但两人一起走出了教室。</p><p class="story-paragraph" data-source-key="3126:0">走廊里充斥着下课后的嘈杂，还有身边那个问她接下来有什么安排的轻快声音。声音和气息的嘈杂中，志宇似乎敏锐地捕捉到了一丝熟悉的香气。不过，怎么可能……多绚说了今天会有重要的生意要谈，还说可能不回来吃晚饭了。</p><p class="story-paragraph" data-source-key="3128:0">在一众背着书包步履匆匆的年轻学生中，一副懒散的姿态靠在墙上的那个身影尤为明显。穿着宽大的深灰色连帽卫衣，棒球帽压得很低，那双多情的狐狸眼藏在阴影下。</p><p class="story-paragraph" data-source-key="3130:0">尽管是这样一副打扮，志宇也不会认不出来。原来课上感到的来自背后的目光，不是错觉啊。</p><p class="story-paragraph" data-source-key="3132:0">停下脚步愣住只是因为新鲜感。志宇只在11年前见过这样的多绚，一改平时成熟的形象，时间仿佛产生了奇妙的折叠，她感觉心脏像被温柔地抓挠了一下。突然被一种巨大的幻想击中，如果，如果一切悲剧都没有发生，此时的景象或许就是她们当初本应有的未来。至少这一刻，好像她不是格格不入的超龄学生了，多绚也不是又要看着公司又要管着她的大忙人，只是一个跨越了数年的荒芜，特意跑来接她下课的、有点顽劣的爱人。</p><p class="story-paragraph" data-source-key="3134:0">身边的同学也跟随志宇的动作停下，还在热切地发出邀请，we&#x27;re all heading to the pub tonight... you should come, it&#x27;ll be fun... 话语在志宇耳边迅速变得模糊而遥远。铺开的世界就那样开始收缩，缩小到只剩下那个从墙上直起身子、正朝着她不紧不慢走来的身影。</p><p class="story-paragraph" data-source-key="3136:0">见志宇不说话，女孩也顺着她的视线转过头去，声音戛然而止。多绚没有看志宇，而是先看向了僵住的女孩，明明脸上还挂着笑，却只让人感到周围的温度都降了5度。她自然地挤进了志宇和女孩之间，略显强势的干燥木头香气瞬间覆盖了那股淡淡的薄荷气息。手也自然地搭上了志宇的脖子，穿过已经长到能覆盖后颈的发丝，多绚温暖的掌心覆盖在敏感的腺体上，像确认抑制贴完好无损地贴着一样，指尖过于顽劣地在那片皮肤上摸来摸去。</p><p class="story-paragraph dialogue" data-source-key="3138:0">“My apologies.”多绚对女孩歪了歪头，语气轻快。“She&#x27;s not available tonight.”</p><p class="story-paragraph dialogue" data-source-key="3140:0">“... or any other night.”</p><p class="story-paragraph" data-source-key="3142:0">漫不经心，却比任何严正的告诫都要傲慢。志宇哭笑不得，眼前的爱人穿得像17岁，说出的话也像17岁一样幼稚，就这样让同学在尴尬中离场，多绚是只用来一次学校，她可是要天天来呢，课上抬头不见低头见的，刚想把这样的牢骚说出口，但又发现这不正是自己想要的吗，这不就是多绚出现在这里的目的吗。</p><p class="story-paragraph dialogue" data-source-key="3146:0">“怎么，舍不得那个小薄荷？”</p><p class="story-paragraph" data-source-key="3148:0">多绚抬起双臂亲昵地搂住志宇的脖子。志宇微微低头，配合着矮了几公分的多绚，环住她的腰。多绚又凑近了些，几乎是贴着志宇的嘴唇呢喃，我一会儿不盯着，你就快被小猫小狗叼走了。</p><p class="story-paragraph" data-source-key="3150:0">帽檐固执地横在两人之间，抵着志宇的额头，滑稽的障碍。以至于志宇轻笑出声。为什么多绚这么可爱，为了跑来学院宣示主权，不惜乔装打扮一番，和她高中那会儿好像也没什么区别，这确实是多绚会干的事。感到跨越时间的熟悉感，志宇心中满溢着酸胀的柔情。</p><p class="story-paragraph dialogue" data-source-key="3152:0">“不会的。”</p><p class="story-paragraph" data-source-key="3154:0">她抬起手，没有犹豫，也没有对于在大庭广众之下亲密的羞涩。以前绝对做不到的事，现在却因为是和多绚一起，所以自然无比。志宇捏住多绚的帽檐，轻轻摘掉了那碍事的帽子。唇瓣贴在一起。</p><p class="story-paragraph" data-source-key="3165:0">通常在听到车子驶入的动静时就会迫不及待摇着尾巴、在入户门背后蹲着随时准备扑向志宇大腿的小豆，此刻正弱小可怜地缩在客厅一角。连狗都能感受到的绝对威压，多绚的信息素毫不收敛地扩散在空气中，不仅是味道，更是不可逾越的屏障。小豆圆润黑亮的眼珠瞥向沙发上正以令狗费解的姿势叠在一起的两位主人，露出一点眼白的样子显得相当委屈，它呜咽了一声。如果转换成人可以听懂的语言，应该是在说，妈咪什么时候能带我去散步。</p><p class="story-paragraph" data-source-key="3167:0">背后的沙发皮质发出沉闷的被挤压声。多绚开车时那股劲头还没散。现在，快要冒出火苗的占有欲几乎要烧穿客厅。</p><p class="story-paragraph" data-source-key="3169:0">在学校走廊里公然吻自家Alpha似乎只是一道开胃菜，而正餐是在回家之后，所以在回程的路上，她把引擎踩得在车里都能听到轰鸣。随之而来的推背感让志宇不得不贴紧了椅背，虽然是在较为空旷的海滨公路上，她也忍不住咽了一口唾沫。</p><p class="story-paragraph" data-source-key="3171:0">直到车子停稳在家门口，志宇才松了一口气。这是栋依山而建的独栋住宅，远离市区的喧嚣，从客厅的落地窗望出去，能看到乔治亚海峡的一角，深蓝的海水缓慢地起伏。</p><p class="story-paragraph dialogue" data-source-key="3173:0">“想吃什么？冰箱里好像还有牛肉……”</p><p class="story-paragraph" data-source-key="3175:0">志宇一边脱下先前淋过雨的外套，一边询问多绚。“你说可能不回来吃晚饭了，就没提前买……”</p><p class="story-paragraph" data-source-key="3177:0">话还没说完，多绚就从背后贴了上来，双手环住志宇的腰，像只没长骨头的猫一样，不，猫本来就是液体。身高167公分的猫，带着一身室外的冷雨气息，整个人挂在了志宇的背上。</p><p class="story-paragraph dialogue" data-source-key="3179:0">“不吃。”</p><p class="story-paragraph" data-source-key="3181:0">任性的声音闷闷地从志宇颈窝里传来，多绚又在撒娇了。“不想吃那些。”</p><p class="story-paragraph" data-source-key="3183:0">小豆一如既往地跑来，但似乎被某种神秘力量吓得愣在原地不敢动。</p><p class="story-paragraph dialogue" data-source-key="3185:0">“啊，你瞪小豆了吧？”</p><p class="story-paragraph dialogue" data-source-key="3187:0">“不然让它扑你？”</p><p class="story-paragraph dialogue" data-source-key="3189:0">“干嘛跟狗狗过不去，真幼稚。”</p><p class="story-paragraph dialogue" data-source-key="3191:0">“我不管。”</p><p class="story-paragraph" data-source-key="3194:0">现在我不想让别的生物靠近你，狗也不行。</p><p class="story-paragraph" data-source-key="3198:0">志宇被从后面推着一步一步挪到沙发边，接着被按到在沙发上坐下。还想说些什么的声音在多绚的唇舌进攻间模糊了。多绚没理会，她侧过头，吻落在志宇的脖颈上。这截白皙的脖子天生就有让人想在上面留下痕迹的吸引力，多绚想在上面重重咬出属于自己的痕迹，但又不忍心真的咬。鼻尖蹭过薄薄的皮肤，温热的触碰和细小的气流带起一阵痒，志宇轻哼了一声。眼镜早就被多绚摘下，也不知道随手扔到哪儿去了，因为多绚总是这样，已经不小心压坏过两副眼镜了。好像不喜欢她戴眼镜一样，倒也不是因为看着土气，只是当志宇戴着眼镜，不是在看书就是在写作业，净做些让多绚感到受冷落的事。</p><p class="story-paragraph" data-source-ke       function updateProgress() { const element=mount.firstElementChild;if(!element)return;const start=element.offsetTop;const distance=Math.max(element.offsetHeight-innerHeight,1);progress.style.width=`${Math.max(0,Math.min(1,(scrollY-start)/distance))*100}%`; }
      function render(index,pushHash=true,scroll=true) {
        current=Math.max(0,Math.min(sectionIds.length-1,index));
        const id=sectionIds[current];
        mount.replaceChildren(document.getElementById(id).content.cloneNode(true));
        select.value=id;
        controls.prev.forEach(button=>button.disabled=current===0);
        controls.next.forEach(button=>button.disabled=current===sectionIds.length-1);
        document.getElementById('prev-label').textContent=current?sectionTitles[current-1]:'已经是序章';
        document.getElementById('next-label').textContent=current<sectionIds.length-1?sectionTitles[current+1]:'全文完';
        document.title=`Last Call · ${sectionTitles[current]}`;
        if(pushHash&&location.hash!==`#${id}`)history.pushState(null,'',`#${id}`);
        if(scroll)shell.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
        updateProgress();
      }
      function move(delta) { render(current+delta); }
      select.addEventListener('change',()=>render(sectionIds.indexOf(select.value)));
      controls.prev.forEach(button=>button.addEventListener('click',()=>move(-1)));
      controls.next.forEach(button=>button.addEventListener('click',()=>move(1)));
      addEventListener('popstate',()=>render(indexFromHash(),false,false));
      addEventListener('scroll',updateProgress,{passive:true});
      addEventListener('resize',updateProgress,{passive:true});
      render(indexFromHash(),false,false);
    })();
  </script>
</body>
</html>
