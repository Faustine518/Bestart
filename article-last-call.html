        <header class="chapter-header"><span class="chapter-number">序</span><h2>Foreword</h2></header>
        <div class="story-body"><p class="scene-break" data-source-key="4:0" aria-label="场景分隔">……</p><p class="story-paragraph foreword-text" data-source-key="5:0">有多久没有见过多绚了呢，本没想过会再见的。一些远得仿佛上辈子的回忆从脑海深处复苏，飞快闪过。崔志宇抬眼小心翼翼地看向面前这个女人的眼睛，多绚的眼睛曾经是这样的吗，她见过那双漂亮的桃花眼看着自己笑得弯起来的样子，也让那双眼睛红着流下过泪水。可现在看起来，里面什么情绪也没有，只有冰冷。</p><p class="scene-break" data-source-key="6:0" aria-label="场景分隔">……</p></div>
      </article>
    </template><template id="section-01">
      <article class="chapter" data-chapter="section-01">
        <header class="chapter-header"><span class="chapter-number">01</span><h2>Chapter 1</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="8:0">窗外是城市沸腾的霓虹灯海，光影透过巨大的落地玻璃在大理石地板上折射出斑驳的冷色，在这样的顶层公寓里，外面光亮与喧嚣也只剩一片死寂。</p><p class="story-paragraph" data-source-key="10:0">客厅只亮着一盏落地灯，昏黄的光晕在地板上拉出长长的阴影。</p><p class="story-paragraph" data-source-key="12:0">金多绚向后仰靠在沙发上，双眼微闭，感受着崔志宇指尖的力道。</p><p class="story-paragraph" data-source-key="14:0">为了今天那场发表会，她耗费了太多精力。拿下的那个项目，原本是父亲当年的宏图大志，终于走到这一步，害死父亲的崔家却早在几年前的一场政治风暴中彻底垮台，只剩下这个没用的崔大小姐，不过也已经和一条狗没什么区别了。</p><p class="story-paragraph" data-source-key="16:0">崔志宇跪在地毯上，动作熟练且卑微。她低着头，小心翼翼地双手握住金多绚纤细的小腿，沿着紧绷的肌肉线条缓慢地向上推移、揉按。</p><p class="story-paragraph" data-source-key="18:0">金多绚能感觉到，崔志宇的指尖比刚才带上了温度，呼吸也越来越重。</p><p class="story-paragraph" data-source-key="20:0">明明是个瘦弱得看起来随时都可能被折断的身体，欲望倒是像海一样深，自己也就是累了没力气收敛着信息素，就被这条狗敏锐地嗅到了。</p><p class="story-paragraph" data-source-key="22:0">崔志宇的指尖在触碰到金多绚膝盖内侧那块娇嫩的皮肤时，动作突兀地一滞，有些发烫的指腹不自觉地停留在那里，贪恋起那点细腻的触感，想继续往上试探，以至于原本机械的按摩变成了带有某种暗示意味的摩挲。</p><p class="story-paragraph dialogue" data-source-key="24:0">“在想什么？”</p><p class="story-paragraph" data-source-key="26:0">金多绚终于睁开眼，冷淡地问。</p><p class="story-paragraph" data-source-key="28:0">崔志宇猛地缩回手，低下头。</p><p class="story-paragraph dialogue" data-source-key="30:0">“……在想……您比以前……更漂亮了。”</p><p class="story-paragraph" data-source-key="32:0">从外面捞回来的野狗，放在家里好好养一阵子，也会得寸进尺起来。</p><p class="story-paragraph" data-source-key="34:0">金多绚发出一声冷笑。</p><p class="story-paragraph" data-source-key="36:0">她缓缓收回那条搭在崔志宇膝盖上的腿，顺势踩在了对方跪在地毯上的双腿之间那个位置，力道不大，但足以让身前这个软弱的Alpha浑身一紧。</p><p class="story-paragraph dialogue" data-source-key="38:0">“漂亮？”</p><p class="story-paragraph" data-source-key="40:0">金多绚微微前倾身体，刚进门时在玄关就急不可耐地解开的丝质衬衫领口敞开，露出凌厉的锁骨线条。</p><p class="story-paragraph dialogue" data-source-key="42:0">“这不是狗该说的话。”</p><p class="story-paragraph" data-source-key="44:0">崔志宇的眼眶发红，不敢看金多绚，只是卑微地俯下身，把脸贴在金多绚的膝盖上，像在认错，又像是在撒娇。这还是被带回来之后金多绚第一次允许她靠近，还以为可以趁对方防备松懈的状态，汲取一点她身上的温度……在那白色的地狱里待了太久，或者说早就失去了像人一样活着的权利，尽管极度渴望金多绚的气息和体温，但崔志宇已经习惯了把尊严磨成粉，吞下去。</p><p class="story-paragraph dialogue" data-source-key="46:0">“对不起……”</p><p class="story-paragraph dialogue" data-source-key="48:0">”我会好好做的……“</p><p class="story-paragraph" data-source-key="57:0">半个月前，金多绚雇的私家侦探终于带回来点有用的消息。</p><p class="story-paragraph" data-source-key="59:0">崔志宇还活着。失去了权力撑腰，空有一副好皮囊只会带来不幸，据说这些年她过得像狗一样，被卖来卖去，上一任主人对她腻了，便随意扔进了自家的产业里当赚钱工具。</p><p class="story-paragraph" data-source-key="61:0">幽静山谷中的疗养院，外墙是冷调的乳白，光洁的地面倒映着金多绚线条锐利的黑色西装。明面上，这里是一座无瑕的为达官贵人们提供精神疗愈的圣地，但金多绚很清楚，那些紧闭的雕花木门后，每一寸呼吸都带着明码标价的腐烂。</p><p class="story-paragraph" data-source-key="63:0">空气中弥漫着一种消毒水与白檀混合的怪异香气。</p><p class="story-paragraph dialogue" data-source-key="65:0">“实不相瞒，如果不是您来了，这位很快就要被送走了。”院长步履轻快地走在金多绚侧前方，时不时回头向金多绚介绍着，声音里透着生意人的精明。</p><p class="story-paragraph dialogue" data-source-key="67:0">“不爱说话，嘴也不甜，大多数客人都抱怨她像块木头。”</p><p class="story-paragraph" data-source-key="69:0">不能好好赚钱的工具是累赘，被送走……恐怕只会是被卖到更肮脏下贱的地方去吧。金多绚若有所思。</p><p class="story-paragraph" data-source-key="71:0">等这一天等了太久。不是为了救赎，而是想亲眼看看曾经那个高不可攀的崔志宇是如何烂在泥淖里的。</p><p class="story-paragraph dialogue" data-source-key="73:0">“不用废话。”</p><p class="story-paragraph" data-source-key="75:0">金多绚在一扇厚重的白色实木门前停住。门被无声推开。</p><p class="story-paragraph" data-source-key="77:0">房间里只开了一盏冷白色的射灯，垂直投射在房间中央。</p><p class="story-paragraph" data-source-key="79:0">崔志宇抱着膝盖蜷缩在房间的角落里，略显窄小的白色背心紧紧箍着她单薄的躯体，布料之下，两片肩胛骨随着不安的呼吸而起伏，仿佛随时会刺破那层苍白的皮肤。</p><p class="story-paragraph" data-source-key="81:0">听到有人靠近的脚步声，崔志宇的肩膀剧烈颤抖了一下。她没有收到今天有客人上门的通知，突然来的人会是谁呢，想起主管前几次都威胁说，再做不好，就把她卖到更糟糕的地方去，这一天终于来了吗。</p><p class="story-paragraph" data-source-key="83:0">她把头深深地埋进膝盖里。</p><p class="story-paragraph" data-source-key="85:0">金多绚走近了，居高临下地看向崔志宇修剪整齐的短发下遮不住的颈后，因为频繁注射抑制剂而发青的腺体。</p><p class="story-paragraph dialogue" data-source-key="87:0">“抬头。”</p><p class="story-paragraph" data-source-key="89:0">崔志宇的动作滞住了。这久违的声音太熟悉，瞬间穿透了她维持已久的麻木。小心翼翼地抬起头，那双一度波澜不惊的枯井般的眼睛里，炸裂出极度的惊恐和羞耻。</p><p class="story-paragraph" data-source-key="91:0">这狗一样的人生，要是没有人看见也就罢了，可偏偏……</p><p class="story-paragraph" data-source-key="93:0">她下意识地想要后退，想要逃进无边的阴影里，立刻找个地缝钻进去，甚至死在这一秒也行，倒不如说，死了更好。</p><p class="story-paragraph dialogue" data-source-key="95:0">“多绚……？”</p><p class="story-paragraph" data-source-key="97:0">倒是还认得自己啊。</p><p class="story-paragraph" data-source-key="99:0">从下方看上来的那双眼睛，被灯光照射得无法完全睁开，这样的崔志宇看起来落魄而迟滞，和记忆中那个人没有半分关系。</p><p class="story-paragraph" data-source-key="101:0">金多绚俯身，指尖缓缓划过崔志宇仰起的脖子，感受对方肌肤上那层忽然渗出的冷汗。</p><p class="story-paragraph dialogue" data-source-key="103:0">”客人的名字也是你能叫的吗？“</p><p class="story-paragraph" data-source-key="105:0">指尖移到崔志宇的后颈，狠狠按了一下。剧烈的疼痛让崔志宇立刻跪在了金多绚身前，十指用力抓挠地面，强忍着痛苦不吭声。</p><p class="story-paragraph dialogue" data-source-key="107:0">“开始吧。让我看看有没有说得那么差。”</p><p class="story-paragraph" data-source-key="109:0">崔志宇的脸白得像纸，整个人僵在原地，身体里每一根骨头都在拒绝。让她在金多绚面前展露这种卑贱的姿态，绝对比杀了她还要难受。</p><p class="story-paragraph dialogue" data-source-key="111:0">“对不起……”</p><p class="story-paragraph dialogue" data-source-key="113:0">“……我做不到。”</p><p class="story-paragraph" data-source-key="115:0">崔志宇哽咽着，额头重重磕在地板上，发出沉闷的声响。</p><p class="story-paragraph dialogue" data-source-key="117:0">”做不到？“</p><p class="story-paragraph" data-source-key="119:0">眼神一暗，金多绚猛地抓起崔志宇的头发提了起来，强迫她仰视自己。</p><p class="story-paragraph dialogue" data-source-key="121:0">“大小姐脾气还在呢？”</p><p class="story-paragraph dialogue" data-source-key="123:0">“我花钱买了你，院长可是正打算把你处理掉……”</p><p class="story-paragraph" data-source-key="125:0">金多绚蹲下，揪着崔志宇头发的手没有松开，她凑到崔志宇耳边低语。</p><p class="story-paragraph dialogue" data-source-key="127:0">“还是说，想去那种连怎么死的都不知道的地方吗？”</p><p class="story-paragraph" data-source-key="129:0">不知是认命还是绝望，崔志宇闭上眼，缓了一下才用很轻地声音回答了一声是。</p><p class="story-paragraph" data-source-key="131:0">有多久没有见过多绚了呢，本没想过会再见的。一些远得仿佛上辈子的回忆从脑海深处复苏，飞快闪过。崔志宇抬眼小心翼翼地看向面前这个女人的眼睛，多绚的眼睛曾经是这样的吗，她见过那双漂亮的桃花眼看着自己笑得弯起来的样子，也让那双眼睛红着流下过泪水。可现在看起来，里面什么情绪也没有，只有冰冷。</p><p class="story-paragraph" data-source-key="133:0">也是，人不会对一件可以随意买下的商品有多余的感情，客人付钱，她提供服务，是这里的规则。</p><p class="story-paragraph" data-source-key="135:0">可即便如此……</p><p class="story-paragraph" data-source-key="137:0">崔志宇咬咬牙，颤抖的指尖缓缓伸向金多绚的衬衫纽扣。</p><p class="story-paragraph" data-source-key="139:0">金多绚眸光一闪，手掌抬起，“啪”的一声脆响，拍开了崔志宇探来的手，起身坐到沙发上。声音低柔如丝，带着暧昧的命令。</p><p class="story-paragraph dialogue" data-source-key="141:0">“裤子脱了，好好玩自己。”</p><p class="story-paragraph dialogue" data-source-key="143:0">“就在我面前。”</p><p class="story-paragraph" data-source-key="145:0">崔志宇浑身一僵，强烈的羞耻如电流窜过脊背，向身体每个末端发散，喉结不安地滚动。勉强俯身拉下裤子，布料滑落至膝盖，露出白皙修长的腿。受到信息素刺激而半硬的alpha器官，茎身微微颤动，顶端已渗出晶莹的液体。</p><p class="story-paragraph" data-source-key="147:0">崔志宇在金多绚的腿前不远处跪坐下来。刚跪下就已经微微发红的双膝分开，右手探向腿间，她紧紧咬着下唇。刚出了冷汗的掌心包裹住敏感的发烫的柱身，缓慢上下滑动。青筋在指缝间跳动，每一次拉扯都挤出更多湿滑的液体，顺着柱身滑落。空气中逐渐弥漫着那股特殊的阴郁的气息。</p><p class="story-paragraph" data-source-key="149:0">真是，连信息素都是一股丧家之犬的味道……像森林被暴雨蹂躏后，断枝横陈、叶片被踩碎烂进泥浆。</p><p class="story-paragraph" data-source-key="151:0">金多绚懒懒倚在沙发里，双腿优雅伸展，交叠，脚尖轻轻悠闲地晃动着，目光却如猎手般，锁定那眼前崔志宇起伏的手势和渐渐绷紧的腹肌。呼吸变得急促，胸口起伏，让人把背心下摆撩起来叼在嘴里，当然也是金多绚的要求，无非是耍着花样羞辱崔志宇，却在对方的羞耻景象中获得了一丝观赏性。</p><p class="story-paragraph" data-source-key="153:0">喉咙也有些发干。</p><p class="story-paragraph" data-source-key="155:0">空气中弥漫着暧昧的湿润气息，金多绚的视线锁定在她绯红的脸颊上，崔志宇动作渐急，右手握得更紧，拇指反复碾压顶端，细腰不由自主向上挺起，喘息粗重，眼底浮起雾气。快感如浪潮堆积，眼尾也渗出晶莹的泪光，高潮边缘的酥麻已如潮水般涌来。</p><p class="story-paragraph dialogue" data-source-key="157:0">“不许。”</p><p class="story-paragraph" data-source-key="159:0">即将绝顶的快感被突然截断，悠闲翘着的腿放下来，丝袜包裹的脚掌缓缓移动，踩过崔志宇的大腿，然后精准踩上那胀硬的茎身。被足底狠狠压住，碾磨着跳动的青筋，死死封住想要释放的冲动。</p><p class="story-paragraph" data-source-key="161:0">崔志宇腰身猛挺，忍不住发出一声闷哼，被踩得很痛，强行不让释放的折磨也叫人崩溃，双手本能想护住下身，却被金多绚的目光钉在原地，不敢再动。脚趾灵活蹭着顶端，踩下，时轻时重，燃烧的欲望在足底抽搐，却始终悬在巅峰边缘，热液不断溢出，打湿了金多绚的足尖。</p><p class="story-paragraph dialogue" data-source-key="163:0">“就这样……忍着。”</p><p class="story-paragraph" data-source-key="166:0">金多绚勾起唇角，似乎很满意这样的折磨，脚下加重力道，看着崔志宇在煎熬中低下头。</p><p class="story-paragraph" data-source-key="168:0">足尖没有半分怜悯，始终维持着那种磨人的频率。崔志宇的理智在凉滑的摩擦下几乎要崩解了，她死死咬住下唇，试图吞下那声破碎的呜咽，但脊背却控制不住地起伏。</p><p class="story-paragraph" data-source-key="170:0">金多绚微微俯身，脚尖在那片狼藉上缓慢地划动。丝袜被液体浸透后，触感变得黏腻而湿滑，她讨厌这种湿漉漉的感觉，但也因为吸附力增加，触感变得更加敏锐，那根东西在自己脚下轻轻颤抖，好像在求饶，但她并不急着放过崔志宇。</p><p class="story-paragraph" data-source-key="172:0">包裹着丝袜的脚尖精准地陷进那尚未疲软的顶端缝隙里，顺着跳动的血管，一寸寸地向下碾压。崔志宇发出一声细碎的抽气，身体因本能的敏感而再度绷紧，下意识地想要推开那只掌控一切的脚，但想起对方刚才的话，只能收回手狠狠按在自己紧绷的大腿上，指尖陷入白嫩的皮肉。</p><p class="story-paragraph" data-source-key="174:0">金多绚的足底缓缓旋磨，时而重重踩下，将那处脆弱死死抵在坚硬的地板与足弓之间；时而又坏心思地用脚趾尖轻轻拨弄，激起阵阵残余的电流。崔志宇跪在原地，被迫承受着这种漫长如钝刀子割肉般的折磨。汗水顺着她的鬓角滑落，眼眶泛红，在快感与痛苦的反复横跳中，被彻底夺走了对身体的支配权，两种感受似乎神奇地融合了，不再觉得是单纯的痛苦，强行忍住的细碎的呜咽变成了渴望的喘息。</p><p class="story-paragraph dialogue" data-source-key="176:0">“挺享受嘛。”</p><p class="story-paragraph" data-source-key="178:0">金多绚轻笑一声，脚尖在那处跳动的顶端狠命一碾。</p><p class="story-paragraph" data-source-key="180:0">这一重重的刺激成了压死骆驼的最后一根稻草。崔志宇猛地仰起头，颈部的青筋因极度的紧绷而暴起。小腹一阵抽动，滚烫的浊液终究狼狈地射了出来，弄脏了金多绚的脚底和小腿。</p><p class="story-paragraph" data-source-key="182:0">所有力气在这一秒被抽离。再维持不住跪姿，崔志宇失神地瘫坐在冰凉的地板上，大口地喘着粗气，眼看着金多绚俯身拿起桌上准备好的毛巾，皱着眉头擦掉了身上自己弄上去的痕迹。任由那种混合了释放的快乐与被掌控的屈辱的余韵在体内疯狂冲刷，崔志宇的眼神空洞没有焦距。</p><p class="story-paragraph dialogue" data-source-key="184:0">“脑子也射出去了吗。”</p><p class="story-paragraph dialogue" data-source-key="186:0">”像个死人一样……真没用。”</p><p class="story-paragraph" data-source-key="188:0">金多绚把用过的毛巾朝崔志宇腿间随手一扔，盖住了她那根已经软下去的羞耻，眼神轻蔑。</p><p class="story-paragraph" data-source-key="190:0">而她还是低着头一言不发。</p><p class="story-paragraph" data-source-key="198:0">在梦里，那些画面泛着一层潮湿而模糊的毛边。</p><p class="story-paragraph" data-source-key="200:0">刚满十七岁的那个秋天，某个黄昏，空气里已经有了凉意，和陌生的家里厨房飘来的饭香。崔志宇在梦中垂下眼睫，视线里只有那盏暖黄色客厅灯。</p><p class="story-paragraph" data-source-key="202:0">梦里的感官是错乱的。她记得自己穿着那套私立女校有些束缚感的深蓝色西装制服，一整天下来胸口前的领带都没有乱过，百褶裙的边缘刮过膝盖，带起一阵细微的痒。放在大腿上的双手不安地绞紧手指，浑身透着一股连自己都能察觉到的、冷冰冰的违和感，像一件被强行安置在别人家里的易碎瓷器，不知道自己那个大忙人父亲又出了什么事，弃自己于不顾，只叫她暂时先到秘书家里住着。</p><p class="story-paragraph" data-source-key="205:0">金叔叔也有个女儿，和你差不多大，好好相处吧。父亲的声音在电话里显得模糊而遥远。</p><p class="story-paragraph" data-source-key="208:0">玄关传来了一阵毛躁的动静。</p><p class="story-paragraph dialogue" data-source-key="211:0">“我回来了。”</p><p class="story-paragraph" data-source-key="214:0">声音蛮横地劈开了客厅里的压抑。来人穿得松松垮垮的制服外套下是黑色卫衣，提到很高的裙子，故意多露出一截大腿，哪有让卷发的学校呢，却顶着一头波浪长发，仔细看，是不是还染了深沉的棕色。那就是普通高中学生的叛逆吗，崔志宇从未那样过。从少女脚上蹬下来的黑色匡威被随便踢落在地板上，挤开了自己摆放整齐的皮鞋，发出的闷响在梦里被无限放大。</p><p class="story-paragraph" data-source-key="217:0">那是她第一次见到多绚。挂在左肩的书包有些滑落，嘴里似乎还在漫不经心地嚼着口香糖，在远离崔志宇的沙发那边停下，直勾勾地看着她。</p><p class="story-paragraph" data-source-key="219:0">金叔叔似乎从书房出来说了什么，崔志宇记不清了，梦里的背景音总是失真。</p><p class="story-paragraph" data-source-key="222:0">她原本想出于礼貌对人笑笑，可还没来得及动作，就看到对面那个少女的脸色在灯影下发生了奇妙的变化。</p><p class="story-paragraph" data-source-key="225:0">白净的脸蛋好像在一瞬间变红了，那种红，从脖颈一路蔓延上去。</p><p class="story-paragraph dialogue" data-source-key="228:0">“……你好。”</p><p class="story-paragraph" data-source-key="231:0">崔志宇听见自己的声音，在安静的客厅里显得格外轻。</p><p class="story-paragraph" data-source-key="234:0">而金多绚甚至连个眼神都没再给她，动作僵硬地转过身，脚步重得把地板踩得咚咚响，几乎跑着躲进了房间。随之而来的，是那声震得梦境都在微微颤动的重响。</p><p class="story-paragraph dialogue" data-source-key="237:0">“砰！”</p><p class="story-paragraph" data-source-key="240:0">房门关上了。</p><p class="story-paragraph" data-source-key="243:0">梦里的她依旧站在原地，不知所措，直到那些暖黄色的灯光逐渐被浓重的雾气吞噬。</p></div>

      <article class="chapter" data-chapter="section-02">
        <header class="chapter-header"><span class="chapter-number">02</span><h2>Chapter 2</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="246:0">门虚掩着，留下一道不足两指宽的缝隙。</p><p class="story-paragraph" data-source-key="248:0">志宇跪在门后的阴影里，膝盖在地板上硌得生疼，双手也被反捆在背后，这些微小的痛楚已经是家常便饭了，比起这些，多绚剥夺了她发出任何声音的权利，甚至连信息素都被药物强行压制，憋得她眼底布满血丝。</p><p class="story-paragraph" data-source-key="250:0">多绚今天回来得很晚，一进门就找到她，把她推搡到主卧的衣帽间里，让她保持这个姿势不许动不许出声。志宇不明白，也不需要弄明白她这样要求的理由，反正……只要服从就好了，只要服从的话，打骂的折磨会减轻，许多痛苦都会迎刃而解。这是她近几年下来形成的习惯。</p><p class="story-paragraph" data-source-key="252:0">可是……好像远低估了多绚的残忍。</p><p class="story-paragraph" data-source-key="254:0">卧室里，灯光昏暗。多绚背对着门的方向，正被一个强壮的alpha揽在怀里。那个男人的手放肆地在多绚腰间游移。</p><p class="story-paragraph dialogue" data-source-key="256:0">“这种时候分心可不好。”男人的声音低沉，对任何一个同类来说都是极具侵略性的威胁，而志宇只能在门后静静跪着。</p><p class="story-paragraph" data-source-key="258:0">多绚发出一声轻笑，笑声钻过门缝，像飞来的毒针扎进志宇的鼓膜。只见她微微仰起头，似乎是故意调整了角度，以确保跪在暗处的志宇也能看清楚，对方在她颈侧反复吮吸吻过的画面。</p><p class="story-paragraph dialogue" data-source-key="260:0">“怎么会？”多绚的声音带着一种放松的慵懒，“合作谈得很愉快，我说过会让你尽兴。”</p><p class="story-paragraph" data-source-key="262:0">衣料摩擦声，身体倒在床垫上的闷响。</p><p class="story-paragraph" data-source-key="264:0">志宇咬紧牙关，指甲深深抠进手心。她的瞳孔由于极度的愤怒而颤抖，视线死死锁在那个男人按住多绚肩膀的手上。不敢想起来不代表忘记了，记忆是如此鲜明，那是曾经属于她的位置。多少个易感期无助的夜里，她不想见任何人，但总是拖着昏昏沉沉的身体找到多绚，那些夜晚，多绚热切的呼吸只属于她一个人。</p><p class="story-paragraph" data-source-key="266:0">想冲出去，想撕碎那个男人，想用最原始暴戾的方式把属于自己的人抢回身边。</p><p class="story-paragraph" data-source-key="268:0">可她不敢。也早就不属于她了。</p><p class="story-paragraph" data-source-key="270:0">敢弄出动静你就死定了。</p><p class="story-paragraph" data-source-key="272:0">这个除了软弱什么也不剩的躯体，不敢违抗多绚的命令，除了跪着用膝盖更生硬地挤压地板，以克制心中那团无用的怒火之外，别的什么也做不到。</p><p class="story-paragraph" data-source-key="274:0">数年的摧残像是一把无形的沉重锁链，牢牢扣住了她的手脚。那些尊严被一次又一次生生打碎的日子里，因为固执的反抗而招致的非人折磨，早已形成了肌肉记忆，让她在萌发冲动的瞬间，先一步产生了条件反射式的畏缩。</p><p class="story-paragraph" data-source-key="276:0">冲出去又能怎样，破坏了多绚的事，大概率会被直接丢出去，最后怎么死的都不知道。应该感恩才对，在多绚身边做一条卑贱的狗，即便从心理上来说是世界上最痛苦的事，但至少能活下去……要感激才行啊，崔志宇。</p><p class="story-paragraph" data-source-key="278:0">她弓着背，把身体缩起来，背后的旧伤在隐隐作痛，提醒着现在的自己只是一个连名字都不配拥有的玩物。</p><p class="story-paragraph" data-source-key="280:0">床铺上的动静逐渐变得剧烈。男人粗重的喘息，和多绚在那些撞击中破碎的、断断续续的呻吟。</p><p class="story-paragraph" data-source-key="282:0">多绚的目光越过男人的肩膀，精准地投向门后幽暗的阴影。</p><p class="story-paragraph" data-source-key="284:0">视线隔着虚空交汇。明明正做着那样火热的事，多绚的眼神却冷得像冰，里面似乎翻涌着一种让人心惊的快意，又像是在无声地挑衅。</p><p class="story-paragraph" data-source-key="286:0">眼泪毫无征兆地砸在地板上。</p><p class="story-paragraph" data-source-key="288:0">绝望的占有欲像一团火，在身体里熊熊燃烧，几乎烧焦了志宇的五脏六腑。看着多绚在别人身下起伏，听着那些曾经只为她发出的声音在陌生alpha怀里破碎，生理性的恶心和扭曲的兴奋同时冲刷着志宇的神智。</p><p class="story-paragraph" data-source-key="290:0">尽管腺体被压制，正在抑制贴下狠狠跳动，尽管恨不得立刻去死，但这最具卑劣的身体却在听到那些撩人的呻吟，闻到多绚由于动情而散发的浓郁信息素时，不可抑制地起了生理反应。</p><p class="story-paragraph" data-source-key="292:0">这种时候都能硬起来……</p><p class="story-paragraph" data-source-key="294:0">真是下贱得叫人绝望。</p><p class="story-paragraph" data-source-key="296:0">一边流泪，一边感到那股可耻的亢奋在骨髓里疯狂流窜。志宇弯下腰，额头紧紧抵着冰冷的木地板，贴着皮肤的寒意非但没能让她冷静，反而火上浇油般地激起了更深层的战栗。</p><p class="story-paragraph" data-source-key="298:0">这样的姿势让她大脑缺氧，衣帽间的空气仿佛被抽干，也因此感觉外面的声音渐渐小下去。头痛欲裂，眼眶也发胀生疼，但她不在乎。这样很好，总好过被迫去听那些残忍的动静，除了自己急促的心跳，志宇什么都听不见了。</p><p class="story-paragraph" data-source-key="300:0">不知过了多久，一切终于平息下来，讨厌的陌生气息远离了这个房间，志宇的听觉好像才渐渐恢复了。多绚似乎下了床，却没有过来查看她的死活，而是径直进了浴室。</p><p class="story-paragraph" data-source-key="302:0">温暖的水气从浴室中弥漫出来，磨砂玻璃门后传来的水声戛然而止。</p><p class="story-paragraph" data-source-key="304:0">听到多绚的声音模糊地远远响起，志宇才从深海般的窒息中惊醒。她忘了自己保持这个姿势多久，双腿早已失去知觉。猛地站起身，积聚在头部的血液迅速下流，瘦弱的身体控制不住地向旁边一踉跄，膝盖一软几乎又要跪下去，即便如此，也不敢让对方多等。</p><p class="story-paragraph" data-source-key="308:0">多绚赤着身子坐在大理石台上，湿漉漉的长发垂在胸前，遮住了刚才留下的红痕。看到脸色奇差的志宇，也没有过多在意，只是漫不经心地勾了勾手指。</p><p class="story-paragraph dialogue" data-source-key="310:0">“过来。”</p><p class="story-paragraph" data-source-key="312:0">志宇垂着头走过去，顺从地在多绚腿边跪下。她的眼睛还是红的，刚才在那扇门后积压的绝望的暴戾，此刻在狭小的浴室里浓缩成了令人窒息的卑微。一靠近就闻到了，闻到多绚身上沐浴露的香味，但在这股香气之下，敏锐的感官依然能捕捉到那一丝令人作呕的属于那个陌生alpha的残余。</p><p class="story-paragraph dialogue" data-source-key="314:0">“洗干净了，但还是觉得恶心。”</p><p class="story-paragraph" data-source-key="316:0">多绚垂下眼睫，修长的双腿微微分开，足尖抵在志宇单薄的肩膀上。</p><p class="story-paragraph dialogue" data-source-key="318:0">“帮我再清理一遍。”</p><p class="story-paragraph" data-source-key="320:0">志宇的脊背猛地一僵。好不容易压抑下去的战栗从尾椎骨直冲头顶。</p><p class="story-paragraph" data-source-key="322:0">这不仅仅是羞辱，多绚在残忍地玩弄她最后的尊严，要她用温热的舌尖，去一寸寸舔舐那个刚刚被别人占领过的领地。灵魂仿佛被彻底按进了泥泞里。</p><p class="story-paragraph" data-source-key="324:0">志宇颤抖着抬起头，求饶的视线撞进多绚那双冷漠又带着玩味的眼中。但她没有拒绝的权利，这就是她现在的处境。只是舔干净而已，没什么做不到的，一直都是这样做过来的不是吗。机械而麻木的表象之下，另一种黑暗的情绪正破土而出，被嫉妒的毒火灼烧着，志宇心中竟然生出了一种扭曲的渴望，想要覆盖掉那个人的气息和痕迹……用自己的气息和体温。</p><p class="story-paragraph" data-source-key="326:0">重新占领……即便是以最屈辱的方式。</p><p class="story-paragraph" data-source-key="328:0">不再有任何挣扎，她靠近，虔诚而卑微地吻了上去。</p><p class="story-paragraph" data-source-key="330:0">浴室里的温度持续攀升。志宇的舌尖划过多绚腿间的嫩肉，一直悬在半空虚浮无根的身体终于被这股熟悉的战栗缠绕。刚才和那个男人在床上时，只是机械地配合，发出恰到好处的喘息，即使在被另一双手拥抱又如何，眼里、脑海里全是门后那双破碎的眼眸。而现在，当志宇用绝望而偏执的狂热在她腿间深深浅浅地纠缠时，多绚的呼吸才终于乱了。</p><p class="story-paragraph" data-source-key="332:0">足尖因为快感而蜷缩，无力地踩在志宇的肩膀上。</p><p class="story-paragraph" data-source-key="334:0">恨又如何，是恨意撑过了她这十年，指引她再次找到志宇，所以才要给她这样残酷的惩罚。这种灭顶的快感，却也是只有志宇能给的，可她偏偏像个被抽空了灵魂的容器，对自己如同对其他所有人一般的麻木态度令多绚倒胃口，只有越让志宇感到嫉妒、愤怒，快感的波涛才翻涌得越厉害。</p><p class="story-paragraph" data-source-key="336:0">灵魂与肉体死死咬合的战栗在那一点爆发，瞬间击溃了她所有伪装，却不能让志宇发现。多绚仰起头，手指陷入黑色的发丝之间，死死按住志宇的后脑，不由分说地把她更深地压向自己，双腿本能地收紧。志宇感觉到她快要到极限了，即便耳朵被夹得生疼，呼吸也越来越困难，也没有停下，反而更卖力地动着舌尖，试图吞下对方所有细微的颤抖。</p><p class="story-paragraph dialogue" data-source-key="338:0">“崔志宇……”</p><p class="story-paragraph" data-source-key="340:0">还是叫出了那个名字，多绚感到一股剧烈的快意从脊椎窜起，是今晚第一次真实的高潮。她对身前这个人的恨和渴望都在这一刻拧成死结。</p><p class="story-paragraph" data-source-key="344:0">一切平息下来，志宇抬起头。</p><p class="story-paragraph" data-source-key="346:0">她的脸上沾满了晶莹的液体，黏腻地挂在鼻尖和嘴角，和还没干透的泪痕混在一起，显得狼藉又淫靡。那双一直死寂的眼睛里，似乎终于重新燃起了一点星火，那种阴沉且卑微的占有欲。</p><p class="story-paragraph" data-source-key="348:0">很好，至少好过一个空壳。多绚低头，俯视这张被被她弄乱的脸，心里涌出一股扭曲的满足。</p><p class="story-paragraph dialogue" data-source-key="350:0">“起来。”</p><p class="story-paragraph" data-source-key="352:0">在冰冷的瓷砖上跪了太久，志宇站起来时显得费力，膝盖发软，身子晃了一下才站稳。虽然此时坐在洗面台上的多绚比她矮了一些，志宇却依旧深深地垂着头，不敢看多绚那双被情欲浸润的眼睛。</p><p class="story-paragraph dialogue" data-source-key="354:0">“奖励你的。”</p><p class="story-paragraph" data-source-key="356:0">多绚冷不丁地伸手，拉下志宇的裤子，直接握住了她早已忍到极限、涨得生疼的欲望上，让她猝不及防地发出一声低吟。近期一直缺乏发泄，加上刚才极度的生理压抑，此刻多绚指尖那种带着报复性的揉搓，对她来说简直是灭顶的极刑，却也是最生猛的快感。</p><p class="story-paragraph" data-source-key="358:0">多绚的手心很烫，指甲偶尔故意刮蹭过顶端，引起茎身一阵阵抽动。志宇的呼吸乱了频率，每一次动作都让她不由自主地挺动着腰，试图追逐那股快要烧毁理智的潮涌。</p><p class="story-paragraph dialogue" data-source-key="360:0">“想要？”</p><p class="story-paragraph" data-source-key="362:0">多绚微微眯起那双狭长的狐狸眼，眼尾还带着潮红，恶作剧般地收紧了五指。</p><p class="story-paragraph dialogue" data-source-key="364:0">“想进来吗？”</p><p class="story-paragraph" data-source-key="366:0">口头上不放过她，手上的频率的也加快了。志宇忍不住皱眉，却又被那种如浪潮般袭来的快感折磨得双腿发软。只能勉强撑住洗面台的边缘，喘着粗气，眼睛里再次蒙上了一层生理性的水雾。心理极度的压抑和肉欲的释放交织在一起，意志在多绚的掌心里彻底碎成了粉末。</p><p class="story-paragraph dialogue" data-source-key="368:0">“不敢……”</p><p class="story-paragraph" data-source-key="370:0">因为做了一回好狗，所以得到了主人的施舍。按照多绚的规则乖乖听话，果然是正确的选择，即便……这种奖励从头到尾都是一场羞辱。</p><p class="story-paragraph dialogue" data-source-key="372:0">“真乖。”</p><p class="story-paragraph" data-source-key="374:0">多绚凑近她耳边，声音轻得像狐狸的尾巴尖划过心尖。</p><p class="story-paragraph" data-source-key="376:0">志宇死死闭上眼，喉咙里压抑着支离破碎的闷哼，眼角溢出一点生理性的泪水。忍耐到极限的痛苦的欲望终于在多绚手中彻底崩塌。一整晚积压的阴郁和几乎要把她烧干的妒火，都在这一刻决堤，化作一股滚烫而凶猛的热流，失控地喷溅而出，凌乱地射在那片冰冷的白瓷砖地上。</p><p class="story-paragraph" data-source-key="378:0">像是被抽干了最后一丝力气，志宇竟颓然地瘫倒在多绚脚边，胸口剧烈起伏，呼吸破碎不堪。</p><p class="story-paragraph dialogue" data-source-key="380:0">“废物……”</p><p class="story-paragraph" data-source-key="382:0">多绚看着脚下狼狈到了极点的人，面无表情地转身冲洗了手，拿过毛巾一根根擦干指缝。随手拧开了一旁的花洒，冰冷的水柱瞬间倾泻下来，发出一阵刺耳的哗啦声，隔着衣物，砸在志宇还没从高潮中缓过神来的汗湿的身体上。</p><p class="story-paragraph" data-source-key="384:0">被冷水激得浑身一颤，那具清瘦的身体蜷缩在地上发抖，看起来可怜又放荡。</p><p class="story-paragraph dialogue" data-source-key="386:0">“脏死了。”</p><p class="story-paragraph" data-source-key="388:0">语气重新恢复了那种高高在上的冰冷，那双勾人的狐狸眼此刻冷若冰霜，仿佛刚才那个主动伸手，甚至在那动情一刻叫出对方名字的女人完全不是她。多绚对此很确信，在那场混乱里，志宇绝对没有听见那声不该走漏的呢喃。</p><p class="story-paragraph dialogue" data-source-key="390:0">“洗干净再出来。”</p><p class="story-paragraph" data-source-key="392:0">话音落下，多绚跨过瘫在地上还没从余韵中缓过神来的志宇，径直推开了浴室的门。</p><p class="story-paragraph" data-source-key="394:0">偌大的空间里只剩下空旷、单调的水流声。志宇在冰冷的水流里无力地蜷缩起身体，瓷砖的寒意穿透布料和皮肤，渗进骨头，湿透的衣服冰冷地紧贴在身上，感觉体温正在被一点一点带走，冷得发抖，但不想动，不想起身，不想再出去面对那个已经烂掉的现实，只是任由冷水冲刷掉她身上的狼狈，也冲刷掉那点刚燃起来一点的又立刻被现实扑灭的火。</p><p class="story-paragraph" data-source-key="396:0">废物……</p><p class="story-paragraph" data-source-key="398:0">苍白的嘴唇微微颤动，她躺在地上轻声重复着。</p><p class="story-paragraph" data-source-key="400:0">耳边的水声越来越大，与记忆深处一场暴雨诡异地重叠……</p><p class="story-paragraph" data-source-key="406:0">那场雨下得毫无预兆，铅灰色的云层低低地压在学校上空。</p><p class="story-paragraph" data-source-key="408:0">身为议员千金的志宇，正站在私立女高的校门口的门廊下，看着泼水般的雨势微微皱眉。十分钟前她联系过父亲的司机，说是因为大雨，从国会那边过来接她放学的必经之路上发生了连环车祸，道路被封死，堵在好几个街区外动弹不得。</p><p class="story-paragraph" data-source-key="410:0">只能再等等。</p><p class="story-paragraph" data-source-key="412:0">多绚从学校搭公车穿了小半个城赶到志宇的学校门口时，约好的乐队的排练已经开始半个钟头了。她背着书包，手里撑着一把便利店临时买的透明长柄伞，在雨中急匆匆地前行，气息有些不匀。</p><p class="story-paragraph" data-source-key="414:0">为了来接这个没带伞的麻烦精，她不得不翘掉了今天下午乐队的合练，除了接受朋友们“鼓手都不来还合练什么啊”的抱怨，还得忍受妈妈在电话里那句别让志宇淋着的叮嘱。</p><p class="story-paragraph" data-source-key="416:0">搞什么啊，好像她这个亲女儿淋不淋雨就不重要似的。</p><p class="story-paragraph" data-source-key="418:0">又想起妈妈还叫她也学着像志宇姐姐一样，有收拾一点，就更气不打一处来。每天回家随意踢掉的鞋，第二天都会整整齐齐地出现在玄关，不用想都知道是谁的手笔。虽然是长了一张她喜欢的脸，但这性格真是太叫人无法忍受了，来别人家里挣表现，比自己更讨妈妈喜欢……多绚气得故意把其他鞋也都踢歪，果然看到志宇路过时又默默都摆正，当时多绚从沙发上跳起来，看着志宇弯腰时露出那截雪白的后颈，脸又红了，只能别扭地喊了一句，不要你管。</p><p class="story-paragraph dialogue" data-source-key="420:0">“啊，真是欠她的。”</p><p class="story-paragraph" data-source-key="422:0">多绚小声嘟囔着，鞋尖踢飞了一块小石子，毫不在意脚底溅起的雨水。她自己都没意识到，在看到那个站在门廊下，身影单薄得像一张纸的少女时，心底那点隐秘的雀跃，好像比落在地上的雨点还要密集。</p><p class="story-paragraph" data-source-key="424:0">深蓝色的西装制服，修身的线条衬得志宇愈发高挑清冷，领带打得严丝合缝，大小姐身上特有的不近人情的矜贵感，她就那样安静地站着。</p><p class="story-paragraph dialogue" data-source-key="426:0">“崔志宇！”</p><p class="story-paragraph" data-source-key="428:0">多绚没好气地喊了一声，大步跨上台阶。</p><p class="story-paragraph" data-source-key="430:0">志宇抬起头，那双冷冷清清的眼睛在看清来人的一瞬，泛起了一层极淡的涟漪。</p><p class="story-paragraph dialogue" data-source-key="432:0">“怎么是你？”</p><p class="story-paragraph dialogue" data-source-key="434:0">“我妈非让我来，连排练都翘了。”</p><p class="story-paragraph" data-source-key="436:0">她别扭地把伞往志宇面前一戳。</p><p class="story-paragraph dialogue" data-source-key="438:0">“别看了，就这一把伞。”</p><p class="story-paragraph" data-source-key="440:0">志宇没接话，只是轻轻抿了抿唇，微微低头，跨进了那把伞下的方寸之地。</p><p class="story-paragraph" data-source-key="442:0">多绚比志宇稍微矮三四厘米，有些好强地举高胳膊，伞面摇摇晃晃，雨声打在塑料伞面上，发出密集的噼啪声。明明举得吃力，又不肯认输，伞尖时不时戳到志宇打理得整齐的黑发上。</p><p class="story-paragraph dialogue" data-source-key="444:0">“哎呀，这伞真的太小了……”</p><p class="story-paragraph" data-source-key="446:0">一边小小声嘟囔着，一边下意识地往志宇身边贴了贴。她的肩膀结结实实地撞在了志宇的手臂上，肢体紧贴而产生的细微摩擦感隔着校服传了过来，惹得多绚心尖一颤。</p><p class="story-paragraph" data-source-key="448:0">志宇看着多绚因为举伞而绷得发白的手背，反复几次欲言又止之间，头顶又被戳了一下。</p><p class="story-paragraph dialogue" data-source-key="450:0">“我来吧。”</p><p class="story-paragraph" data-source-key="452:0">志宇伸出手接过伞柄，指尖不经意地擦过多绚的手背，后者像是被蛰了一下，忙缩回了手揣进校服兜里。</p><p class="story-paragraph" data-source-key="454:0">雨势没有减弱的迹象，风把雨丝吹斜，打在路人的裤脚。多绚一路上都在喋喋不休，从乐队那个容易破音的主唱，吐槽到今天那堂催眠指数拉满的数学课。</p><p class="story-paragraph dialogue" data-source-key="456:0">“你到底有没有在听啊？”</p><p class="story-paragraph" data-source-key="458:0">多绚转过头，对上志宇侧脸的线条。</p><p class="story-paragraph dialogue" data-source-key="460:0">“在听。”志宇回应得很轻，嗓音在雨声的侵袭下显得有些模糊。她看向视线尽头那个简陋的公交站牌，眉头不自觉地拧了起来。</p><p class="story-paragraph dialogue" data-source-key="462:0">“……我们要坐那个回去吗？”</p><p class="story-paragraph dialogue" data-source-key="464:0">“不然呢？指望你爸的直升机来接你？”</p><p class="story-paragraph" data-source-key="466:0">多绚嘴上不饶人，目光却在志宇那双写着局促的眼睛上扫过。</p><p class="story-paragraph" data-source-key="468:0">公交车带着一股潮湿的热浪靠站。</p><p class="story-paragraph dialogue" data-source-key="470:0">“……我没有那个卡。”</p><p class="story-paragraph" data-source-key="472:0">志宇站在台阶下，看着前面的人自然地刷卡上车，声音小得几乎被雨声盖过，出行都有司机接送，长这么大，连交通卡长什么都没见过。</p><p class="story-paragraph" data-source-key="474:0">多绚看着志宇那副难得一见的有些不安的窘态，侧过脸，嘴角忍不住翘了翘。</p><p class="story-paragraph" data-source-key="476:0">抓起志宇的细手腕，把人往车厢里轻轻一拽。</p><p class="story-paragraph dialogue" data-source-key="478:0">“两名。”</p><p class="story-paragraph" data-source-key="480:0">多绚对着司机知会了一声，手指夹着那张有点磨损了的交通卡，对着感应器利落一贴。</p><p class="story-paragraph dialogue" data-source-key="482:0">“嘀——”</p><p class="story-paragraph" data-source-key="484:0">随着清脆的提示音，多绚看向志宇，挑了挑眉，也没松手，就这样拉着志宇的手腕，在晃晃悠悠的车厢里熟练地往后走。</p><p class="story-paragraph" data-source-key="486:0">因为下雨，平时乘客不多的车厢里也人满为患，到处都是湿漉漉的雨伞和雨衣，车内的空气也让人感觉些许闷湿的不适。公车一个急刹，没站稳的志宇重心不稳地往前栽，眼看要撞上旁边的大叔，好在多绚眼疾手快，伸手撑在窗框上，把她圈在了自己和车窗之间。</p><p class="story-paragraph" data-source-key="488:0">多绚比志宇还矮了小半个头，一抬头，呼吸正好打在志宇那条系得一丝不苟的领带上。两人第一次靠得这样近，志宇身上那股被雨水冲淡后的冷香直往她鼻子里钻。</p><p class="story-paragraph" data-source-key="490:0">明明车厢里全是一股闷闷的潮气，志宇却好像怎么都不会被外界的混沌所沾染。</p><p class="story-paragraph" data-source-key="492:0">多绚有些不自然地清了清嗓子。</p><p class="story-paragraph dialogue" data-source-key="494:0">“抓紧我。”</p><p class="story-paragraph" data-source-key="496:0">志宇的手指局促地抓住了多绚校服外套的下摆，多绚低头瞥了一眼，本想笑话她像个小学生一样，视线却突然凝固了。深蓝色的制服，左侧肩膀几乎湿透，颜色深了一大块。多绚再看看自己，两人在雨里撑着伞步行了十分钟有余，自己的右肩依然干爽。</p><p class="story-paragraph" data-source-key="498:0">想起刚才在雨里，志宇没怎么说话，只是配合着她的步子走，没想过那把本来就不大的伞，原来大半都偏向了她这边。</p><p class="story-paragraph dialogue" data-source-key="500:0">“笨蛋……”</p><p class="story-paragraph" data-source-key="502:0">多绚咕哝了一句，语速很快，以此掩饰那股没来由的慌乱。她手上的力道稍微紧了点，有些生硬地把志宇往自己这边拽了拽，让两人的肩膀靠得更紧些。</p><p class="story-paragraph" data-source-key="504:0">志宇低头看向多绚，因为离得太近，两人的视线在狭窄拥挤的空间里避无可避地撞在一起。多绚那双平日里总是带着点挑衅的小狐狸一样的眼睛，此时却因为心虚而移开视线。</p><p class="story-paragraph dialogue" data-source-key="506:0">“……干嘛？”</p><p class="story-paragraph dialogue" data-source-key="508:0">“谢谢你来接我，多绚。”</p><p class="story-paragraph" data-source-key="510:0">志宇轻声说，声音落在多绚头顶。</p><p class="story-paragraph" data-source-key="512:0">她没再接话，只是有些烦躁地撇过脸，盯着窗外。玻璃上模糊的雨景倒映着她逐渐发烫的脸颊。维持着这种把人圈在怀里的姿势，肩靠着肩，多绚能感觉到志宇湿冷的肩头正在一点点吸走她的体温，但她没有躲开。</p></div>
      </article>

      <article class="chapter" data-chapter="section-03">
        <header class="chapter-header"><span class="chapter-number">03</span><h2>Chapter 3</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="516:0">傍晚，落日的余晖穿透落地窗，将卧室的地毯染上一层粘稠的橘红。窗外城市的轮廓在暮色中逐渐模糊，房间里静得只听到衣物摩擦的细微声响。</p><p class="story-paragraph" data-source-key="518:0">多绚坐在梳妆台前，镜子映出她冷淡而精致的面容。她颇有兴致地重新打理了长卷发，耳垂上那抹细碎的钻光随着她侧过脸的动作微微晃动。</p><p class="story-paragraph" data-source-key="520:0">志宇出现在卧室门口，脚步放得很轻。她敏锐地察觉到今天多绚有些不一样。比往常下班更早，对方难得的早归竟让她枯燥了一整天的心，生出一丝隐秘的喜悦。</p><p class="story-paragraph" data-source-key="522:0">多绚不在的时间里，志宇整日待在这套静得有些压抑的公寓，明明没有被限制公寓内的活动范围，却也默默地把自己的行动局限在那几个固定的地方。除了每到饭点送来外卖的人，志宇几乎也见不到别人。这种安静……好像连自己的存在都被世界遗忘了，虽然也确实如此。这本不是什么大不了的事，以前在疗养院的狭小隔间里度过了一个又一个无望的日夜，不都是这样过来的吗。但最近，应该说是自从被带到这里生活开始，志宇就不自觉地对多绚回家的声音产生了依赖。</p><p class="story-paragraph" data-source-key="524:0">即便今天回来得早，多绚却是一副大费周章还要再出门的派头。</p><p class="story-paragraph dialogue" data-source-key="526:0">“您要出去吗？”</p><p class="story-paragraph" data-source-key="528:0">志宇轻声开口问。</p><p class="story-paragraph dialogue" data-source-key="530:0">“啊，今晚有个聚会。去换衣服吧，”声音顿了顿。</p><p class="story-paragraph dialogue" data-source-key="532:0">“你跟我一起去。”</p><p class="story-paragraph" data-source-key="534:0">平淡得像在交代一件再寻常不过的事，志宇却愣在了原地。</p><p class="story-paragraph" data-source-key="536:0">懦弱的排斥感几乎是瞬间涌上心头。太久没有出现在那种灯红酒绿、需要虚与委蛇的场合，在那个圈子里，崔志宇这个存在，大概已经和死了好多年的人没什么区别。现在多绚要带她回去，无异于把一个已经腐烂、被社会性抹杀的影子，重新拉到刺眼的光灯下公开处刑。那种可能会被人指指点点，被当成某种谈资或背景板的预感，让她本能地感到呼吸困难。</p><p class="story-paragraph dialogue" data-source-key="538:0">“我……也要去吗？”</p><p class="story-paragraph" data-source-key="540:0">多绚只是通过镜子的反射，冷冷地瞥了志宇一眼。</p><p class="story-paragraph dialogue" data-source-key="542:0">“怕丢人？”</p><p class="story-paragraph" data-source-key="544:0">随口反问一句，语气里听不出什么情绪，但那不容反驳的压迫感让志宇不敢再顶嘴，既然多绚开了口，那就不是在商量。志宇垂下头，避开镜子里那道锐利的目光。</p><p class="story-paragraph" data-source-key="549:0">衣帽间里显眼的位置挂着一套深蓝色的西装，在灯光下泛着淡淡的属于昂贵织物的自然光泽，几乎瞬间就勾起了志宇脑海深处久远的记忆。已经多久没有穿过这样体面的衣服了呢 ，志宇想不起来。</p><p class="story-paragraph" data-source-key="551:0">等换好衣服出来时，多绚已经在玄关等她，手里把玩着车钥匙，见人来了，漫不经心地抬眼看去，呼吸却在那一刻有了细微的停滞。眼前的志宇清瘦、挺拔，走廊的灯光冷白，在那深海一样的蓝色上压出一层更为冷冽的质感，衬得她皮肤近乎透明的白。现在的志宇比起记忆中学生时代的样子要成熟许多，眉眼间带着那种阴郁的不安，更添一抹破碎后的沉静。</p><p class="story-paragraph" data-source-key="553:0">视线顺着志宇修长的双腿缓缓上移，掠过收窄的腰线，最后定格在领口。</p><p class="story-paragraph" data-source-key="555:0">她原本以为志宇已经从内到外都是废人一个了，不被当成人对待的日子过了太久，自然会连这种体面都忘得一干二净，可她颈间那个领带结打得相当漂亮，平整、紧实，仍透着过去那股严谨而傲慢的精英感。</p><p class="story-paragraph" data-source-key="557:0">不可否认，这还是她最想要的那个人。</p><p class="story-paragraph" data-source-key="559:0">多绚唇角微挑，慢慢地走上前，抬手温柔地抚上那条领带的纹理。指尖先是在领带顺滑的质感上玩味地滑动，顺着向上摸索，动作粘稠而缓慢，最后指腹不经意地擦过志宇修长的脖颈，在那片雪白的肌肤上停留了一秒。</p><p class="story-paragraph" data-source-key="561:0">志宇的喉咙动了动。仿佛看到喜欢的玩具终于被打扮成最令自己满意样子，多绚看她的眼神中是毫不掩饰的侵略性。难免被盯得有些不自在，手指下意识地蜷缩了一下，但她没有躲开。</p><p class="story-paragraph" data-source-key="563:0">多绚忽然凑近，鼻尖几乎贴上志宇的耳廓，温热的呼吸落在敏感的颈部皮肤上，引起一阵细碎的酥麻。</p><p class="story-paragraph dialogue" data-source-key="565:0">“领带打得很好。”</p><p class="story-paragraph" data-source-key="567:0">就像以前一样……</p><p class="story-paragraph" data-source-key="569:0">声音里缠绕着一丝色气。</p><p class="story-paragraph" data-source-key="571:0">感受着多绚指尖传来的温度，久违的仿佛被珍视的错觉，志宇感到一阵受宠若惊的眩晕。可很快，巨大的讽刺感就从心底翻涌上来。真是……可笑到了极点。明明已经沦落成了一条狗，可在穿上主人赏的衣服时，双手竟然还记得这种为了讨好社交场而练就的体面。志宇垂下眼睫，掩盖眼底那抹荒谬的自嘲。</p><p class="story-paragraph dialogue" data-source-key="573:0">“只要，不给您丢脸……”</p><p class="story-paragraph" data-source-key="575:0">心情尚可的多绚似乎并不在意志宇有些生硬的回答，只是将手掌顺势探到她的后颈，轻轻拍了拍，像在安抚一只顺从的宠物。她低下头，目光扫过志宇垂在身侧的左手上，袖口下露出一小截苍白的皮肤。</p><p class="story-paragraph" data-source-key="577:0">多绚皱了皱眉，精致的玩具可不能就这样带出去。</p><p class="story-paragraph dialogue" data-source-key="579:0">“衣帽间右边第三个抽屉，自己去挑一只搭的吧。”</p><p class="story-paragraph" data-source-key="581:0">志宇愣了一下，主卧的衣帽间里放满了多绚的个人物品，她还从未被允许独自去窥探过。</p><p class="story-paragraph dialogue" data-source-key="583:0">“……我去吗？”</p><p class="story-paragraph dialogue" data-source-key="585:0">“我已经换好鞋了。”多绚有些不耐烦地摆摆手，语气理所应当。</p><p class="story-paragraph dialogue" data-source-key="587:0">“动作快点，别让我等太久。”</p><p class="story-paragraph" data-source-key="592:0">空气中漂浮着一股冷冽的木质香，那是多绚身上常有的味道。志宇推开衣帽间的门，感应灯柔和地亮起，照亮了一排排剪裁考究的西装和长裙。视线在那几件质地轻盈的长裙上停留得久了些。她还从没见过多绚穿长裙的样子，但这并不妨碍在脑海中想象，被裁剪得极贴合身形的柔软材质，会勾勒出那个人冷硬外表下，最女人、也最诱人的曲线……</p><p class="story-paragraph" data-source-key="594:0">志宇侧过头，在侧面的全身镜里看到了自己。镜子里这个人真的是她自己吗？恍惚之间，久违的傲气与体面似乎在这一刻重新回到她身上。盯着镜子里的身影，指尖轻轻抚过袖口，一种诡异的情绪在胸腔里缓缓蒸腾，如果自己还是这样的人，如果没有在多绚面前沦为一条丧家之犬，如果当初……</p><p class="story-paragraph" data-source-key="596:0">种种想法带来的危险而隐秘的亢奋只停留了一瞬，接着就像潮水般迅速退散，志宇猛地垂下眼帘，不再看镜子里那个虚假的幻象。这简直是她这些年来产生过最荒谬最令人作呕的妄想。</p><p class="story-paragraph" data-source-key="598:0">她深吸一口气，强行压下那股令人不安的悸动，伸手拉开了右边第三个抽屉。</p><p class="story-paragraph" data-source-key="600:0">抽屉内壁贴着黑色天鹅绒，十几块名表在冷光下折射出冰冷的美感。指尖在那些名贵的皮革与金属间迟疑地划过，她试图寻找一块最不显眼的，却在抽屉最深处的角落，指尖触到了一个格格不入的冰冷硬物。</p><p class="story-paragraph" data-source-key="602:0">一个藏得很深的小相框，背面朝外，被几条真丝方巾隐隐约约地挡着。</p><p class="story-paragraph" data-source-key="604:0">鬼使神差地，志宇把它抽了出来，翻转。</p><p class="story-paragraph" data-source-key="606:0">那是一张边缘已经泛黄的拍立得。十年的光阴像一层薄雾，让影像呈现出褪色的青灰。</p><p class="story-paragraph" data-source-key="608:0">画面里的十六岁的多绚，脸颊还带着一点未褪的婴儿肥，笑得眼睛弯成了月牙。</p><p class="story-paragraph" data-source-key="610:0">是那晚。</p><p class="story-paragraph" data-source-key="612:0">志宇还记得，和多绚跳的那支舞……那时，尚未被定义的暧昧在夜风中悄无声息地滋长，又消散。</p><p class="story-paragraph" data-source-key="614:0">曲终，余韵还没散尽，但耐不住露台上的冷风，她推开玻璃门，两人一起回到室内。那时大厅里正闹成一团，大家三五成群拍照留念，嬉笑打闹，捕捉夜晚结束前最后的狂欢。</p><p class="story-paragraph" data-source-key="616:0">&quot;Say cheese, lovebirds!&quot;</p><p class="story-paragraph" data-source-key="618:0">多绚的好友正举着拍立得相机四处搜寻目标，一转身，正对上从露台回来的两人。快门按下的瞬间，灯光与笑容定格成永恒。</p><p class="story-paragraph" data-source-key="620:0">在那张成像里，志宇似乎还没来得及从刚才那支舞的氛围中抽离，眼神略显迟钝，透着被抓包后的呆。多绚却反应极快，她眉眼弯弯，笑容明艳得过分，一只手还徒劳地伸向前方，试图去够好友手中的相机，以阻拦这突如其来的抓拍。</p><p class="story-paragraph" data-source-key="622:0">指尖摩挲着冰凉的相框玻璃，志宇感到鼻尖一阵近乎窒息的酸涩。</p><p class="story-paragraph" data-source-key="624:0">这张拍立得从来没有到过她手上，没想到多绚竟然带着这张纸片去了温哥华，多年过去，又带回了首尔。在十年的流转中，竟然没被丢进碎纸机，也没被横跨太平洋的迁徙遗落在某个角落，而是被多绚妥帖地收在抽屉最深处，成了一个一直跟随着她，却不再被提起的旧梦。</p><p class="story-paragraph dialogue" data-source-key="626:0">“崔志宇，在里面睡着了吗？”</p><p class="story-paragraph" data-source-key="628:0">多绚催促的声音隔着走廊传过来。</p><p class="story-paragraph" data-source-key="630:0">拿着相框的手猛地一颤，志宇迅速将相框扣回原位，用方巾重新盖好，随手抓起一块银色表盘的腕表，深吸一口气，拼命压下胸腔里那股酸涩的震荡，快步走了出去。</p><p class="story-paragraph" data-source-key="632:0">推开门的一瞬间，她仿佛穿过了一层厚重的、灰蒙蒙的雾气。感应灯在身后悄然熄灭，眼前这条冷冰冰的走廊被夕阳落下前的最后一楼余光拉得很深。静得好像能听见并不存在的老式挂钟沉闷的滴答声，那声音与她此时狂跳的心的节奏重叠在一起。恍惚间，脚下冰冷坚硬的瓷砖触感消失了，取而代之的是一种略带弹性的、干燥而温暖的质地，泛着旧漆光泽的实木。</p><p class="story-paragraph" data-source-key="634:0">那段记忆的尽头，是那个在走廊里就开始叽叽喳喳讲个不停的少女。</p><p class="story-paragraph" data-source-key="639:0">&quot;...Right, that football guy, Liam. Yeah… I mean… He&#x27;s cute or whatever, sure, but he&#x27;s got that golden retriever energy, you know… kinda dorky when he smiles.”</p><p class="story-paragraph" data-source-key="641:0">多绚光着脚踩在木地板上，戴着降噪耳机，一手捏着手机，一手插在居家服的口袋里从房间里走出来，正兴致勃勃地和电话那头的死党说着下午的事。</p><p class="story-paragraph" data-source-key="643:0">&quot;We did a group project together and oh my god he literally leaned over and asked me how to spell &#x27;penguins.&#x27; Like, seriously?&quot;</p><p class="story-paragraph" data-source-key="646:0">多绚撇了撇嘴，语气里带着一种让人捉摸不透的轻快。</p><p class="story-paragraph" data-source-key="648:0">&quot;Ugh, he&#x27;s so annoying. He&#x27;s basically camping at my locker every single break.I can&#x27;t even get to my books…&quot;</p><p class="story-paragraph" data-source-key="650:0">转过墙角，冷不防撞上了一堵清冷的墙。</p><p class="story-paragraph" data-source-key="652:0">不知何时从图书馆回来了的志宇正站在饮水机旁，额前的碎发还带着外面的凉意，她手里握着的那杯冰水，冰块撞击玻璃的声音清脆悦耳。听着多绚那轻快的声音，心里像被投进了一枚小石子，泛起一圈抓不住的涟漪。是讨厌呢，还是在享受那种被喜欢的虚荣呢。这种模棱两可的信号，让志宇一向冷静的大脑出现了一秒钟的犹豫。</p><p class="story-paragraph" data-source-key="654:0">对上那张面无表情的脸，多绚还是吓得心跳漏了一拍，仓促地结束了通话，眼神有些闪躲。志宇看上去还是那副老样子，即使听到了那些话，明亮的眼眸也平静如深潭。</p><p class="story-paragraph" data-source-key="656:0">反正……大概也听不懂吧。多绚侥幸地想。</p><p class="story-paragraph dialogue" data-source-key="658:0">“我……我来拿可乐……”</p><p class="story-paragraph" data-source-key="660:0">志宇没回话，只是晃了晃手里的水杯，点点头示意，随后消失在走廊尽头。</p><p class="story-paragraph" data-source-key="662:0">以为她会像往常一样安静地待在房间，可多绚回去没多久，房门就被轻轻叩响了。</p><p class="story-paragraph" data-source-key="664:0">她正趴在床上，把笔电支在枕头堆里，调出了《天堂电影院》。那是她下周要交的作业，也是最让她头疼的文艺片。电脑传出影片开头那阵悠扬的弦乐声，屏幕中的一成不变的海景持续了好久，光是这样就几乎已经要让她受不了了，倒不如说此时响起的敲门声更好。</p><p class="story-paragraph dialogue" data-source-key="666:0">“进。”</p><p class="story-paragraph" data-source-key="668:0">门开了一条缝，志宇清冷的脸庞出现在暗光里。</p><p class="story-paragraph dialogue" data-source-key="670:0">“我电影鉴赏课的作业也是这部。”</p><p class="story-paragraph dialogue" data-source-key="672:0">“介意一起看吗？”</p><p class="story-paragraph" data-source-key="674:0">多绚愣了愣，来不及思考为什么对方知道她在看什么影片，为什么会巧到跟她有一样的作业，明明是连学制都完全不一样的学校。她第一时间想到的，是她房间里没有多余的椅子，也没有电视……两个人的话，只能挤在一起看这个并不大的电脑屏幕。</p><p class="story-paragraph dialogue" data-source-key="676:0">“喔……那坐地毯吧。”</p><p class="story-paragraph" data-source-key="678:0">有些局促地拍了拍床边的位置，多绚也跳下床，心里像揣了一只乱撞的幼鸟。</p><p class="story-paragraph" data-source-key="680:0">刚才在厨房里被突然出现的志宇吓了一跳，她甚至没敢抬眼细看。直到此刻两人靠得近了，多绚才惊觉，志宇并没有穿那身总是熨烫得板正笔挺、像一层得体的面具一般拒人于千里之外的校服。只是穿着一件宽大的白色运动薄外套，同样宽大的深蓝色的牛仔裤松松垮垮地堆在脚踝处。之前浑身上下那种精英式的紧绷感，在那一刻消散得无影无踪，取而代之的，只是一种透明的、带着清爽皂香的松弛感。志宇身上这种前所未见的有些少年气的柔软，让她呼吸微微一滞。</p><p class="story-paragraph" data-source-key="682:0">她们并肩坐在床边的地毯上，背靠着床沿。笔电就放在多绚曲起的大腿上，屏幕不大，两人的膝盖自然而然地挤在一起，稍微动一下就会隔着布料擦过去。多绚这下才后悔自己怎么穿了条短裤，大腿露出的皮肤在碰到那略带硬度的牛仔裤面料时，几乎要烧起来。</p><p class="story-paragraph" data-source-key="684:0">距离实在太近了。根本没法专心看屏幕，志宇身上清冽的洗发露香味，正顺着两人之间那点狭窄的缝隙，源源不断地飘过来。味道很淡，却似乎比任何香水都有存在感，勾得多绚心乱如麻，连呼吸都不敢太大声。</p><p class="story-paragraph" data-source-key="686:0">昏暗的室内只有屏幕发出的蓝白冷光。</p><p class="story-paragraph" data-source-key="688:0">电影的进度条缓慢推移，稍微走神就听不懂在讲什么的意大利语和音乐声在小小的卧室里流淌。多绚还是无法集中注意力，想随便找点话题来缓解自己的局促，可用余光偷偷地扫向身侧，志宇竟然看得相当专注，挺得笔直的脊背紧贴着床沿，带出生硬却又好看的线条。屏幕微弱的光影在志宇脸上跳动，将她侧脸的轮廓勾勒得深邃而清晰。</p><p class="story-paragraph" data-source-key="690:0">看着志宇那副旁若无人的样子，多绚心里莫名有点犯嘀咕。</p><p class="story-paragraph" data-source-key="692:0">她都快忘记怎么正常呼吸了，对方却仍是一副心如止水的平静。</p><p class="story-paragraph" data-source-key="694:0">电影里的老旧放映机发出咔哒咔哒的转动声。托托在雨中等待，咒骂这个讨厌的夏天什么时候才能结束。而多绚只想问，电影什么时候才能结束。</p><p class="story-paragraph" data-source-key="696:0">或许是为了看得更清楚些，志宇的身体不自觉地向中间歪了歪，比刚坐下时又凑近了不少，这下几乎是半边身子都贴了上来。那条牛仔裤粗粝的布料随着呼吸频率，在多绚光裸的膝头有一下没下地蹭着，像一种无声而缓慢的入侵，一阵阵的痒顺着多绚的膝盖往上爬，这种微妙的感觉扰得她浑身发紧。</p><p class="story-paragraph" data-source-key="698:0">志宇的视线始终盯着屏幕，神情清冷，像是完全没意识到自己的越界。</p><p class="story-paragraph" data-source-key="700:0">只是对多绚来说，这种若有似无的蹭比直接触碰还要命，整条腿都僵住了，甚至不敢换个姿势，也不好突然让志宇挪开点，只能任由那股粗粝的触感反复碾过她的感官。在嘈杂的意大利语中，多绚听见自己逐渐失控的心跳。</p><p class="story-paragraph dialogue" data-source-key="702:0">“这个讨厌的夏天什么时候才能结束？”</p><p class="story-paragraph dialogue" data-source-key="704:0">“在电影里早就结束了。”</p><p class="story-paragraph dialogue" data-source-key="705:0">“淡出，切到暴风雨，不是很好吗？”</p><p class="story-paragraph" data-source-key="707:0">雷声四起，倾盆大雨骤然落下。</p><p class="story-paragraph" data-source-key="709:0">托托躺在雨中，绝望又固执。爱莲娜毫无预兆地出现在雨幕里，雨水顺着他们的脸颊和身体流淌，那个吻急促、湿冷，却带着能灼伤人的热度。</p><p class="story-paragraph" data-source-key="711:0">房间里的空气仿佛被抽干了，多绚觉得胸口闷得发慌。</p><p class="story-paragraph" data-source-key="713:0">藏在袖子里的手下意识地抓紧了地毯上的绒毛，手心已经出了一层冷汗。电影里的雷雨声太大了，大到感觉那个吻仿佛就发生在自己耳边，却盖不住自己的心跳，多绚死死盯着屏幕，连脖子都不敢转一下，生怕一侧脸就会碰到志宇的呼吸。</p><p class="story-paragraph" data-source-key="715:0">而就在这时，志宇动了。</p><p class="story-paragraph" data-source-key="717:0">感觉身边人的气息逼近，那种平静但无法忽视的引力让多绚几乎屏住了呼吸，僵硬地转过脸，正好对上了志宇的眼睛。</p><p class="story-paragraph" data-source-key="719:0">昏暗的光线下，志宇的瞳孔显得漆黑而深邃。那是多绚第一次在那双向来冷静的眼睛里看到一种近乎深情的错觉，平和、专注，却有着让人缴械投降的吸引力，像是在无声地审判多绚那颗快要跳出胸腔的心。</p><p class="story-paragraph" data-source-key="721:0">她抓着地毯的手指在那一刻因为过度紧张而蜷缩起来。</p><p class="story-paragraph" data-source-key="723:0">电影里的雨声还在继续，可多绚耳边只剩志宇那平稳得有些残忍的呼吸声。</p><p class="story-paragraph" data-source-key="725:0">干嘛在这种时候……</p><p class="story-paragraph" data-source-key="727:0">多绚感到喉咙发紧，眼神闪烁。</p><p class="story-paragraph" data-source-key="729:0">是自己想的那样吗……</p><p class="story-paragraph" data-source-key="731:0">就在这一片死寂的对视中，志宇突然轻声开口。</p><p class="story-paragraph dialogue" data-source-key="733:0">“多绚。”</p><p class="story-paragraph" data-source-key="735:0">只是叫了她的名字，名字的主人却像被烫到了一样，猛地闭上了眼。</p><p class="story-paragraph" data-source-key="737:0">志宇伸出手，动作慢得像是在故意折磨多绚的神经。多绚感到一根略带凉意的指尖轻柔地划过自己的额角。那缕总是滑落在脸侧，有点碍事的碎发，被志宇耐心地拨开，轻轻别到了耳后，指腹不经意地擦过敏感的耳廓，带起一阵让多绚心惊肉跳的麻痒。</p><p class="story-paragraph" data-source-key="739:0">微凉的触感在她的耳根处若有似无地停留了一秒，随即便利落地撤走了。</p><p class="story-paragraph dialogue" data-source-key="741:0">“早点休息。”</p><p class="story-paragraph" data-source-key="743:0">志宇的声音很低，在那段动人的弦乐中显得格外克制。</p><p class="story-paragraph dialogue" data-source-key="745:0">“我明天还有数学考试。”</p><p class="story-paragraph" data-source-key="747:0">多绚呆呆地坐在地毯上，眼看着志宇起身，带上房门，彻底离开她的房间。</p><p class="story-paragraph" data-source-key="749:0">连电影都安静了下来，或者只是多绚听不见了，只剩一个人的房间里陷入了无边的寂静，坐在昏暗中，耳边还残留着那抹还未散去的、微凉却又灼人的触感。</p><p class="story-paragraph" data-source-key="751:0">……这个呆子，到底懂不懂那是什么气氛啊。</p></div>
      </article>

      <article class="chapter" data-chapter="section-04">
        <header class="chapter-header"><span class="chapter-number">04</span><h2>Chapter 4</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="755:0">上午的最后一堂课是心理学，教室里弥漫着一种让人昏昏欲睡的静谧。多绚盯着白板上那两个老师用马克笔潦草写上的单词，Cognitive Dissonance.</p><p class="story-paragraph dialogue" data-source-key="757:0">“当行为和自我认知发生冲突时，大脑会产生一种不适感。”老师转过身。</p><p class="story-paragraph" data-source-key="759:0">多绚听得并不认真，视线看回笔记本上那个刚才飞快地画出的概率树状图。直接开口问，成功率50%，但可能会自尊心原地爆炸，志宇大概会用那种看外星人的眼神看她；继续疯狂暗示，成功率10%，那个木头可能到月底都反应不过来；等志宇主动开口问，成功率0.000000001%……除非世界末日。多绚盯着最后那一串零，烦躁地在图上画了个叉。</p><p class="story-paragraph dialogue" data-source-key="761:0">“为了缓解这种不适，人们通常会强行给自己的非理性行为寻找一个逻辑出口。”</p><p class="story-paragraph" data-source-key="763:0">握着笔的手僵了一下。认知失调。自认为有着最引以为傲的清醒，现在却在为了一个莫名其妙的家伙浪费掉一节课的时间来想这种无聊的分析。这简直是对她智商的侮辱。明明志宇帮她整理头发的动作轻得像羽毛落下，可那个触感就像是该死地烙在了她的皮肤上，连续好几天都消不下去。</p><p class="story-paragraph" data-source-key="765:0">眼看返校季舞会就要到了。原本是她最得心应手的社交主场，原本只需要游刃有余地在邀请她的男孩子里挑一个最顺眼的走走过场，可现在……那张申请表还静静折在她的包里，脑子里全是那个穿着白色运动外套，在昏暗的雨声中平静审视她的面孔。</p><p class="story-paragraph" data-source-key="767:0">念不同的学校，也不顺路，交集被限制在两个窄小的刻度里，上学前的早餐，放学后的玄关。多绚特意比平时早起十五分钟，坐在餐桌前，一边心不在焉地往谷物麦片里倒牛奶，一边竖起耳朵听走廊里的动静。可当志宇拎着书包、穿着那身整洁得没有一丝褶皱的校服走出来时，多绚握着勺子的手指又会不由自主地收紧。</p><p class="story-paragraph dialogue" data-source-key="769:0">“那个……”</p><p class="story-paragraph" data-source-key="771:0">多绚盯着碗里的蓝莓，话明明已经到了舌尖，却在对上志宇那双清冷如常的眼睛时，又生生咽了回去。</p><p class="story-paragraph" data-source-key="773:0">志宇只是拉开椅子坐下，照常吃早餐，仿佛那天晚上的暧昧从未发生过。</p><p class="story-paragraph dialogue" data-source-key="775:0">“你要说什么？”</p><p class="story-paragraph" data-source-key="777:0">头也不抬一下，语气平静得让多绚怀疑之前的心跳失控是不是自己的幻觉。</p><p class="story-paragraph dialogue" data-source-key="779:0">“没、没什么……”</p><p class="story-paragraph" data-source-key="781:0">多绚有些挫败地低下头，舀了一大勺麦片塞进嘴里，嚼得清脆作响。</p><p class="story-paragraph" data-source-key="783:0">宛如佛祖一般雷打不动的淡然，让多绚觉得，如果自己现在开口邀请她去参加舞会，就跟在撞死冰山上的小鸟没什么区别，除了能换回一个疑惑的眼神，大概什么也得不到。</p><p class="story-paragraph" data-source-key="785:0">或许是走神得过于显眼，老师走下讲台。</p><p class="story-paragraph dialogue" data-source-key="787:0">“… if a subject receives a reward every single time they perform an action, the behavior is easily extinguished once the reward stops. But,”</p><p class="story-paragraph" data-source-key="789:0">老师敲了敲多绚的桌面，示意她接话。</p><p class="story-paragraph dialogue" data-source-key="791:0">“If the reward is unpredictable, like, say, someone waiting for a text from a crush, why is that behavior so much harder to quit?”</p><p class="story-paragraph" data-source-key="793:0">周围响起一阵细碎的笑声，坐在旁边的Chloe饶有趣味地看过来。</p><p class="story-paragraph" data-source-key="795:0">极力控制住翻白眼的念头，多绚抬起头，脸上挂着一抹无懈可击的礼貌微笑。</p><p class="story-paragraph" data-source-key="797:0">&quot;I&#x27;d say it&#x27;s intermittent reinforcement. When you get these random, unpredictable crumbs of positive feedback, like a look or just a tiny, subconscious gesture… It&#x27;s way more addictive than a steady reward.”</p><p class="story-paragraph" data-source-key="799:0">老师赞许地点了点头，继续走向下一排。</p><p class="story-paragraph" data-source-key="801:0">多绚脸上的笑容在对方走过的一瞬消失得干干净净。</p><p class="story-paragraph" data-source-key="803:0">崔志宇那样甚至连强化都算不上。那个帮她捋头发的动作，撑死只能算是一个没有预兆、随机掉落、也没有任何后续的彩蛋。可偏偏就是这个彩蛋，让她在这个心理游戏里像抛弃了理智似的，还想追加筹码。</p><p class="story-paragraph" data-source-key="805:0">早餐桌上的机会像指缝里的沙子一样溜走了。志宇临走前那个微妙的眼神，让多绚一整天都魂不守舍。午餐时间，Chloe也没打算放过她，端着餐盘一落座就凑过来。</p><p class="story-paragraph dialogue" data-source-key="807:0">“So who&#x27;s your Hoco date? That sports guy or the hottie from the other class who&#x27;s been obsessed with you like… forever?”</p><p class="story-paragraph" data-source-key="809:0">多绚戳着餐盘里的沙拉，脑子里全是志宇冷静的侧脸。支支吾吾了半天，最后在对方期待又探究的目光中自暴自弃地撂下了塑料叉子。</p><p class="story-paragraph" data-source-key="811:0">&quot;I don&#x27;t know, okay? Whatever. Maybe I&#x27;ll just go solo.&quot;</p><p class="story-paragraph dialogue" data-source-key="813:0">“Are you for real? Don&#x27;t tell me you&#x27;re waiting for some mysterious VIP...&quot;</p><p class="story-paragraph" data-source-key="815:0">调侃像针一样扎在多绚心上。她翻了个白眼，一边敷衍着，一边在心里咬牙切齿。没错，就是那样，在等一个万年不化的冰山，还得她亲自求着来参加舞会的大人物。</p><p class="story-paragraph" data-source-key="817:0">这种挫败感一直持续到晚上。当大人物出现在她房间门口时，多绚的自尊心防御机制已经到了崩溃的边缘。</p><p class="story-paragraph" data-source-key="819:0">突然说什么要借阅一本画册，穿着宽松的条纹睡衣的志宇此时正坦然地坐在多绚房间的地毯上，依旧背靠着床沿，但一双长腿却随意舒展着，慢条斯理地翻动着厚重的书页，指尖划过纸张的沙沙声在安静的房间里清晰可辨。看起来专注极了，可多绚知道，这家伙根本就是在等她开口。</p><p class="story-paragraph" data-source-key="821:0">多绚坐在书桌前，手里的圆珠笔已经快要把纸张戳破了。那张蓝白相间的申请表就压在她的课本下面，边缘露出一抹刺眼的亮色。盯着笔尖半天，像是终于下定了决心。</p><p class="story-paragraph dialogue" data-source-key="823:0">“那个，下周五我们学校有个舞会，要求带舞伴，烦死了……”</p><p class="story-paragraph" data-source-key="825:0">志宇翻过一页画册，头也没抬，语气平静。</p><p class="story-paragraph dialogue" data-source-key="827:0">“下周五，那你要开始找人了。”</p><p class="story-paragraph" data-source-key="829:0">剩下的话直接被噎在了嗓子眼，哽得她胸口生疼。猛地抬起头，漂亮的眼睛里像是有团无名火在烧，死死瞪着志宇波澜不惊的脸。</p><p class="story-paragraph" data-source-key="831:0">真不敢相信，话都暗示到这份上了，竟然还能面不改色地揣着明白装糊涂。多绚已经在心里把眼前这个家伙咒骂了一千遍。崔志宇，真是性格恶劣到没救了。亏她刚才还觉得这家伙认真看画册的脸好看，现在看来，这张脸分明就是专门生来克她的。</p><p class="story-paragraph dialogue" data-source-key="833:0">“找谁啊？”</p><p class="story-paragraph dialogue" data-source-key="835:0">“那个Liam呢？”</p><p class="story-paragraph" data-source-key="837:0">多绚愣住了。握着笔的手指猛地收紧。一直以为志宇这种典型的两耳不闻窗外事的性格，根本不会留意她那些琐碎的八卦。</p><p class="story-paragraph dialogue" data-source-key="839:0">“……谁让你偷听的。”</p><p class="story-paragraph" data-source-key="841:0">多绚的声音从牙缝里挤出来，耳根却不知是因为羞恼还是窘迫，攀上了一抹薄红。不敢再直视志宇那双清冷的眼睛，干脆把身体陷进椅子里。</p><p class="story-paragraph dialogue" data-source-key="843:0">“……男生都幼稚得要命。不带人去，又肯定会被那群家伙笑话。”脚尖在地板上轻轻一点，转椅便开始小幅度地左右晃动起来。</p><p class="story-paragraph" data-source-key="845:0">志宇停了一下，合上画册，“你可以不去。”</p><p class="story-paragraph dialogue" data-source-key="847:0">“怎么能不去？”多绚又愤愤地转过身，瞪着对方，激动的声音又逐渐小了下去。</p><p class="story-paragraph dialogue" data-source-key="849:0">“你就不能……就没点别的建议？”</p><p class="story-paragraph" data-source-key="851:0">志宇抬起头，视线扫过多绚正毫无章法地按动圆珠笔的手指，放在其他时候那种惹人心烦的“咔哒咔哒”的脆响，在此刻也只是让她的焦虑更直接地呈现在她眼前。这样的多绚很有趣也很可爱不是吗。</p><p class="story-paragraph" data-source-key="853:0">那双清澈无辜的大眼睛直视着多绚。</p><p class="story-paragraph dialogue" data-source-key="855:0">“你是想我陪你去吗？”</p><p class="story-paragraph" data-source-key="857:0">脸瞬间涨红了，多绚猛地转过身去，背对着志宇，语气生硬到了极点。</p><p class="story-paragraph dialogue" data-source-key="859:0">“谁、谁想你去了……只是看你每晚闷在家里，性格会变怪……“</p><p class="story-paragraph" data-source-key="861:0">虽然，已经很怪了。</p><p class="story-paragraph" data-source-key="863:0">看着她发红的耳根，志宇眼神里闪过一丝淡淡的笑意。</p><p class="story-paragraph" data-source-key="871:0">关于崔议员非法献金的指控在最近被撤销，舆论像退潮般散去，事态平息后，崔家门口那群像苍蝇一样的记者也终于撤离。志宇理所当然地搬了回去。等到多绚回家时，玄关处的空气冷寂得有些陌生。原本应该整齐摆在那里的皮鞋和白球鞋不见了。多绚轻轻推开客房的门，志宇带来的东西不多，甚至不需要大费周章地打包就离开了。</p><p class="story-paragraph" data-source-key="873:0">多绚把自己摔进沙发里，盯着天花板发呆。</p><p class="story-paragraph" data-source-key="875:0">她掏出手机，手指在Kakaotalk的界面上悬了很久。她们之间没有多少聊天记录，除了几条关于晚餐外卖的确认，几乎是一片空白。</p><p class="story-paragraph" data-source-key="877:0">多绚反复输入又删掉，发了一句：</p><p class="story-paragraph dialogue" data-source-key="879:0">“回去了？”</p><p class="story-paragraph" data-source-key="881:0">等了整整6分钟，手机才在掌心震动了一下。</p><p class="story-paragraph dialogue" data-source-key="883:0">“嗯，司机接我回来了。这段时间谢谢你的照顾。”</p><p class="story-paragraph" data-source-key="885:0">客气得让人牙痒。</p><p class="story-paragraph" data-source-key="887:0">多绚盯着照顾两个字，心口像被塞了一团浸水的棉花。她有一千句话想发过去。</p><p class="story-paragraph" data-source-key="889:0">是打算就这样消失吗？以后不要见了吗？签了名的申请表还作数吗？周五还来不来？</p><p class="story-paragraph" data-source-key="891:0">在输入框里打下，周五要来噢。</p><p class="story-paragraph" data-source-key="893:0">指尖在发送键上悬了半天，最终还是一个字一个字地删掉了。</p><p class="story-paragraph" data-source-key="895:0">……那种事情，谁在乎啊。</p><p class="story-paragraph" data-source-key="897:0">多绚咬着牙，手腕用力一甩，手机被她狠狠扔进了沙发的软垫深处。她整个人陷进没有开灯的客厅，快要被这种无声的烦躁淹没，沙发缝隙里却隐约传来了微弱的震动。</p><p class="story-paragraph" data-source-key="899:0">又憋着一口气，伸手把手机重新捞了回来。到底还是没忍住。</p><p class="story-paragraph" data-source-key="901:0">屏幕的冷光映在多绚的瞳孔里。原本紧紧绷着的肩膀在那一瞬间放松下去，那种一直拉扯着神经的焦灼感终于消失，被这短短一句话奇迹般地抚平了，她盯着这几个字看了好几遍，直到屏幕自动熄灭。</p><p class="story-paragraph dialogue" data-source-key="905:0">“周五晚上见。“</p><p class="story-paragraph" data-source-key="915:0">会场内的光线被压得很低，几道蓝紫色的氛围灯在黑亮的地面上折射出冷光。律动感极强的流行乐，清脆的吉他扫弦混合着轻快的鼓点，在挑高五米的空间里反复回荡。</p><p class="story-paragraph" data-source-key="917:0">多绚手里捏着一杯甜得发腻的果汁，入场流程已经快结束了，她还在等志宇出现。</p><p class="story-paragraph dialogue" data-source-key="919:0">“Okay, cut the crap. It&#x27;s basically 7:30.”Chloe推了推她的肩膀，眼神里满是掩饰不住的好奇和调侃。“Is this mystery date actually a real person? If it&#x27;s someone from outside, just tell me who.”</p><p class="story-paragraph" data-source-key="921:0">她故意拖长了音调，眼神在多绚脸上扫来扫去。</p><p class="story-paragraph dialogue" data-source-key="924:0">“Unless you&#x27;re hiding him because you&#x27;re gatekeeping hard?”</p><p class="story-paragraph dialogue" data-source-key="926:0">“Like I&#x27;d actually need to lie about a date. As if.”</p><p class="story-paragraph" data-source-key="928:0">多绚漫不经心地抿了一口果汁，目光却第无数次掠过大厅入口。</p><p class="story-paragraph" data-source-key="930:0">其实她心里也没底。昨天破天荒地收到志宇主动发来消息，竟然是询问关于舞会的Dress Code，那会儿她正忙着试裙子，随口回了句，或许帅气一点？我也不知道啦。反正那个身材那张脸，怎么穿都不会太离谱，倒是对志宇竟然会关心这个问题感到一些意外……好像突然，显得意外的慎重。</p><p class="story-paragraph" data-source-key="932:0">身边原本还在起哄的人突然噤声，目光越过多绚的肩膀，直勾勾地盯着入口处，嘴里的半截话也直接断了。</p><p class="story-paragraph" data-source-key="934:0">察觉到气氛不对，多绚也下意识地转过身。</p><p class="story-paragraph" data-source-key="936:0">到底还是迟到了，司机先送了父亲去应酬，才折回家接她出门。志宇推开沉重的玻璃门，有些局促地避让了一下迎面走过的两个男生。门廊处的冷白光从她身后打过来，勾勒出一个清瘦而利落的轮廓。</p><p class="story-paragraph" data-source-key="938:0">她站在人群边缘，那双像狗狗一样清澈的大眼睛里带着几分初入陌生领地的钝感，视线在攒动的人头和晃动的灯影里快速移动。略显迷茫的眼眸与她高挺利落的鼻梁和那张小得惊人的脸，组合出一种迷人的冲击力。</p><p class="story-paragraph" data-source-key="940:0">多绚隔着半个会场望向她，心脏在胸口里重重一跳。</p><p class="story-paragraph" data-source-key="942:0">志宇穿了深灰色的廓形西装，没有领带，白衬衫的领口微微敞开着，修长的脖颈、锁骨在阴影里若隐若现。依然是刚过下颌角的黑色短发，只是和平时去上学那种一丝不苟的整齐不同，今天显然专门打理过，发丝带着弧度微微向后定型，更显现出精致的侧脸。这种介于少女与少年之间的俊美，像是一道无形的屏障，将周遭那些喧嚣和混杂的香水味统统隔绝在了另一个世界。</p><p class="story-paragraph dialogue" data-source-key="944:0">“Wait, oh my god. Who&#x27;s that?””Chloe抓着多绚的胳膊，力道大得惊人，“Is she from another school? How have I never seen her? She&#x27;s insane!”</p><p class="story-paragraph" data-source-key="946:0">多绚没说话，只是盯着那个身影，刚被那杯过于甜腻的果汁浸润过的喉咙，似乎比刚才更干了。</p><p class="story-paragraph" data-source-key="948:0">就在那一秒，志宇原本在人群中略显无处安放的视线，穿过层层晃动的人影，终于找到了锚点一样，稳稳地落在了多绚脸上。</p><p class="story-paragraph" data-source-key="950:0">她的呼吸微不可察地滞了半秒。她见过多绚总是不好好穿校服的叛逆模样，衬衫领口永远少扣两颗扣子，下摆也不塞进裙子里，也习惯了她在家里穿着背心和短裤，光着脚跑来跑去的样子。</p><p class="story-paragraph" data-source-key="952:0">可此时眼前的多绚，深棕色长发卷成蓬松的大波浪，柔软地垂落在圆润的肩头，身穿一条黑色缎面的挂脖短裙，裁剪利落而轻盈，大片光洁的背部线条在发丝间若隐若现。材质在灯光下折射出如月色般的冷光，勾勒出她从未在意过的曼妙曲线。</p><p class="story-paragraph" data-source-key="954:0">没有理会周围已经开始的窃窃私语的女生，志宇径直穿过人群，停在多绚面前。她站得很近，近得多绚似乎能感到一缕被她带进室内的秋夜的凉意。因为穿了高跟鞋，多绚第一次与志宇视线几乎齐平，对方身上清冷的气息混着淡淡木质香扑面而来。</p><p class="story-paragraph" data-source-key="956:0">离得这么近，志宇才真切地看清了多绚今天的样子，画了比平时更明显的眼线，眼尾带着一抹天生的娇媚微微向上挑起。明明尚未褪去青涩，却像猫一样已经学会如何用眼神勾人……还真是小看这个在家里总是对她耍小脾气的丫头了。</p><p class="story-paragraph dialogue" data-source-key="958:0">“你来晚了。”</p><p class="story-paragraph" data-source-key="960:0">多绚率先开口，语气仍带点惯有的傲娇的挑剔，却掩不住声音里一丝细微的起伏。</p><p class="story-paragraph dialogue" data-source-key="962:0">“抱歉，路上有点堵。”</p><p class="story-paragraph" data-source-key="964:0">没有像往常那样迅速撤回对视的目光，那双清亮的眼睛在多绚脸上认真地扫过一圈，又低了低头，轻声问。</p><p class="story-paragraph dialogue" data-source-key="966:0">“我今天怎么样？”</p><p class="story-paragraph" data-source-key="968:0">没预料到志宇会问这种问题，难道是很在意她的看法吗？多绚盯着那双专注、倒映着自己影子的眼睛，半晌才找回自己的声音。她习惯性地扬起下巴，语速却有些乱。</p><p class="story-paragraph dialogue" data-source-key="970:0">“……勉强及格吧。”</p><p class="story-paragraph" data-source-key="972:0">像是如释重负般，志宇的唇角极浅地勾了一下。</p><p class="story-paragraph dialogue" data-source-key="974:0">“那就好。”</p><p class="story-paragraph" data-source-key="976:0">她低头看了一眼多绚手中快要被捏变形的纸杯，自然而然地伸手接了过来，指尖不经意滑过多绚的手背，带起一阵细碎的电流。</p><p class="story-paragraph dialogue" data-source-key="978:0">“……你朋友好像有很多话想问你。”</p><p class="story-paragraph" data-source-key="980:0">多绚顺着志宇的视线看过去，Chloe石化在三米开外，眼神在她和志宇之间疯狂拉丝，那种“你再不介绍我就要报警了”的压迫感扑面而来。</p><p class="story-paragraph" data-source-key="984:0">多绚在人群中像一团跳动的火焰，明媚而抢眼。她被朋友拉走去聊天，看起来一边游刃有余地应对着各种话题，一边却像有强迫症似的，每隔几秒就要往志宇这边瞟一眼，似乎生怕志宇会觉得无聊，下一秒就消失在人群里。</p><p class="story-paragraph" data-source-key="986:0">志宇没有动，只是安安静静地站在稍微靠后的阴影里观察着。</p><p class="story-paragraph" data-source-key="988:0">这就是多绚所处的环境吗。和她就读的女校截然相反。在那边，空气总是安静到有些压抑，连在走廊里走路的声音都会被放大。学校里都是些和她一样装模作样的权贵家的女儿们。而这里，震耳欲聋的节奏感，空气中浓郁交织的香水味，还有那些高昂且快速的英文笑谈。同龄人大多也都带着成熟的妆容，举手投足间都在努力模仿成年人的社交礼仪，那种迫切想要长大的生涩感充斥着整个大厅，对于习惯了安静的志宇来说，这一切都显得有些过载。</p><p class="story-paragraph" data-source-key="990:0">但她并不排斥，每当多绚的视线越过重重人影看过来时，那种温差就会被抚平。而多绚发现志宇一直没挪地方，几乎每次看过去都发现对方也定定地回看，心里那股隐秘的满足感快要溢出来了。</p><p class="story-paragraph" data-source-key="992:0">可很快，多绚就发现事情脱离了掌控。</p><p class="story-paragraph" data-source-key="994:0">显然，志宇那过于出色的外表，对于一些看腻了男同学的女孩们来说，简直是核弹级别的吸引力。多绚走开这一会儿时间里，就已经至少有三个女生，借着拿甜点的名义，往志宇那边绕了四五回了。</p><p class="story-paragraph" data-source-key="996:0">只是看看也就罢了，多绚倒是不介意这点事情。直到这种平衡被一个大大方方凑过去要志宇联系方式的学姐打破。</p><p class="story-paragraph" data-source-key="998:0">多绚本来正听着那段好像永远不会结束的八卦，结果余光扫到这一幕，心里的火苗噌地就蹿了上来。</p><p class="story-paragraph" data-source-key="1000:0">她甚至没等志宇反应，快步赶回去，直接挽住了志宇的手臂，整个人都顺势亲昵地贴了上去。志宇本来还在想如何婉拒对方，却被多绚这突如其来、实实在在的贴上来的柔软和体温分了神。那颗毛茸茸的小脑袋就靠在自己肩头，原本到了嘴边的礼貌拒绝也被空气中弥漫的奇妙占有欲给硬生生压了回去。</p><p class="story-paragraph" data-source-key="1002:0">深棕色的波浪长发轻柔地扫过志宇的西装布料，两人身上的香气在极近的距离下无声交织。多绚歪着头，对着学姐露出一个灿烂却没什么温度的笑容。</p><p class="story-paragraph dialogue" data-source-key="1004:0">“Actually she doesn&#x27;t speak much English, and her phone is literally dead anyway… she&#x27;s probably not the best person to chat with.”</p><p class="story-paragraph" data-source-key="1006:0">话音未落，多绚就抓起志宇的手腕，穿过人群，推开大厅另一侧的玻璃门，两人躲进露台。</p><p class="story-paragraph" data-source-key="1008:0">露台上风大，她们穿着都略显单薄。多绚有些脱力地靠在围栏边，看向志宇，昏暗的灯光混着月光，志宇在风里微微眯起眼睛，被风吹得微乱的细碎的黑发在额前晃动，似乎还没从刚才多绚那个蹩脚的借口里回过神，看上去有一种被忽然拽出来的毫无防备的顺从。多绚这才心虚地松开了一直牵着的手。</p><p class="story-paragraph dialogue" data-source-key="1010:0">“那人眼睛长在头顶上吧……”</p><p class="story-paragraph" data-source-key="1012:0">多绚翻了个白眼，缩了缩脖子，冷得打了个寒颤。志宇没接话，只是自然地脱下自己的西装外套，搭在多绚肩上。</p><p class="story-paragraph dialogue" data-source-key="1014:0">“你不冷吗？”多绚轻轻抓着西装的领口，吸了吸鼻子，声音小了下去。</p><p class="story-paragraph dialogue" data-source-key="1016:0">“不冷。”</p><p class="story-paragraph" data-source-key="1018:0">依旧惜字如金，眼底却含着一丝笑意。</p><p class="story-paragraph dialogue" data-source-key="1020:0">“但是，我手机什么时候坏的？”</p><p class="story-paragraph" data-source-key="1022:0">方才由于表现出过于明显的护食行为而产生的热度刚压下去，面对志宇坏心眼的追问，多绚的脸颊瞬间又烧了起来。</p><p class="story-paragraph dialogue" data-source-key="1024:0">“……刚才坏的。”</p><p class="story-paragraph dialogue" data-source-key="1026:0">“是吗……”</p><p class="story-paragraph dialogue" data-source-key="1028:0">“那说我英语不好又是怎么回事？”</p><p class="story-paragraph" data-source-key="1030:0">好好好最好了，多绚又想起那天自己讲电话被志宇听了个明明白白的糗事。怎么好像现在才突然意识到，那天晚上崔志宇是不是故意的，故意搅得她心神不宁，然后又若无其事地拍拍屁股回家住了，她却每天回家看到在玄关迎接自己的，只有自己踢乱的鞋……想到这些，心里就难免空落落的。</p><p class="story-paragraph dialogue" data-source-key="1032:0">“……你真的很烦。”</p><p class="story-paragraph" data-source-key="1034:0">是担心崔志宇被不认识的人纠缠会为难，才拉着她躲到外面来的……而现在多绚更想把眼前这个性格恶劣的人推回大厅，像块诱人的肉一样，直接丢进人堆里，干脆让她被那群如狼似虎的高年级学姐分而食之算了。</p><p class="story-paragraph" data-source-key="1036:0">但她随即又在心里否定了，崔志宇对她们来说根本没用。</p><p class="story-paragraph" data-source-key="1038:0">刚才在大厅里，她还听着朋友们在聊那些没完没了的八卦，谁分化了，谁跟谁搞在一起了……那种躁动和不安分，对多绚来说还有些遥远，可她盯着志宇的侧脸，若有所思。</p><p class="story-paragraph" data-source-key="1040:0">这家伙也有十七岁了吧，却一点要分化的迹象都没有。会成为什么呢？</p><p class="story-paragraph" data-source-key="1042:0">多绚趴在围栏上，看向正对着远处城市灯火出神的志宇。空气安静下来，室内飘出的鼓点声隔了一层厚重的玻璃，变得模糊而遥远。心底那股烦躁慢慢沉淀成了莫名的不确定，突然半开玩笑地开口。</p><p class="story-paragraph dialogue" data-source-key="1044:0">“你有想过自己会分化成什么吗？”</p><p class="story-paragraph" data-source-key="1046:0">志宇收回视线，有些意外地侧过头，“怎么突然问这个？”</p><p class="story-paragraph dialogue" data-source-key="1048:0">“没什么，就随便问问。想成为Alpha吗？”多绚踢了踢围栏边缘，没看她。</p><p class="story-paragraph dialogue" data-source-key="1050:0">“……父亲那样希望。”志宇沉默了一瞬，语气里没什么起伏。最近一次的体检报告，各项指标也确实是在往那个方向偏移。</p><p class="story-paragraph" data-source-key="1052:0">多绚的手指无意识地在冰冷的金属栏杆上摩擦着，压低了声音，像是自言自语。</p><p class="story-paragraph dialogue" data-source-key="1054:0">“那……要是真的成了Alpha，会想和什么样的人……交往？”</p><p class="story-paragraph" data-source-key="1056:0">原本只是侧过脸的志宇彻底转过身来。她没有立刻回答，只是在那片昏暗的光影里安静地看着多绚。眼神似乎太深沉专注，多绚被看得心尖发颤，那是跟她们一起挤在电脑的小屏幕前看电影那晚一样的眼神，那股不知死活的探究欲瞬间缩了回心底。</p><p class="story-paragraph" data-source-key="1058:0">直到多绚心虚地别过头，假装也去看远处的路灯，志宇才轻声吐出几个字。</p><p class="story-paragraph dialogue" data-source-key="1060:0">“我也不知道。”</p><p class="story-paragraph" data-source-key="1065:0">室内传来了低缓的音乐声，复古的颗粒感电吉他扫弦伴随着闷声的鼓点，一下又一下地敲在人心口，仿佛在这慵懒的段旋律里，时间可以被无限拉长。那是最后一支舞的信号。大厅里的灯光骤然暗了下去，只有几束细碎的光影偶尔掠过露台的门缝。</p><p class="story-paragraph" data-source-key="1067:0">把人邀请来舞会，一整晚却连一点舞都没跳，还躲在露台吹冷风……多绚低头盯着自己的鞋尖，裙摆在风里轻轻晃动，这种沉默有点磨人。</p><p class="story-paragraph dialogue" data-source-key="1069:0">“……你会跳吗？”</p><p class="story-paragraph dialogue" data-source-key="1071:0">“在学校修过礼仪课。”志宇平静地回答。</p><p class="story-paragraph" data-source-key="1073:0">多绚试探着伸出一只手，眼睛却固执地看向别处，语气带着一丝掩饰不住的僵硬。</p><p class="story-paragraph dialogue" data-source-key="1075:0">“那……既然都来了……”</p><p class="story-paragraph" data-source-key="1077:0">志宇沉默了片刻，往前走了一步，先稳稳地牵住了多绚伸出的那只手，靠近。近在咫尺的压迫感让多绚下意识屏住了呼吸，视线下移。志宇的衬衣领口松开了两颗扣子，透着一股和平时不同的随性。她的一只手顺势扶上多绚的腰侧，掌心的热度隔着裙子薄薄的布料，清晰地传了过去。多绚则把手搭在志宇肩上，指尖能清晰地感觉到衬衣下肩膀硬挺平直的骨骼线条。</p><p class="story-paragraph" data-source-key="1079:0">她们没有回到喧闹的舞池，就在这昏暗的露台一角，随着那舒缓得像潮汐的节奏缓缓起舞。</p><p class="story-paragraph" data-source-key="1081:0">志宇身上带着淡淡的、多绚再熟悉不过的沐浴露香气，为什么还是自己的沐浴露香味呢，明明回家住了却还买了一样的吗。</p><p class="story-paragraph" data-source-key="1083:0">这种话要怎么问得出口……</p><p class="story-paragraph" data-source-key="1085:0">从来没有贴得这么近过。多绚甚至感到两人紊乱的心跳正一下又一下地撞在一起，节奏快得离谱。自己的胸腔里的动静像是在打鼓，由于离得实在太近，她甚至担心志宇能直接听到那震耳欲聋的闷响。为了掩饰这股快要把她淹没的慌乱，她故意嘟囔着找茬。</p><p class="story-paragraph dialogue" data-source-key="1087:0">“你跳得好僵硬……”</p><p class="story-paragraph" data-source-key="1089:0">志宇没有反驳，只是微微收紧了手臂，将她往怀里带了带，声音低沉地擦过她的耳廓。</p><p class="story-paragraph dialogue" data-source-key="1091:0">“别说话，可能会踩到你。”</p><p class="story-paragraph" data-source-key="1093:0">多绚难得乖乖闭上嘴一次，她侧过脸，将发烫的脸颊轻轻贴在志宇的耳边。</p><p class="story-paragraph" data-source-key="1095:0">I don&#x27;t care how long it takes.</p><p class="story-paragraph" data-source-key="1096:0">As long as I&#x27;m with you, I&#x27;ve got a smile on my face.</p><p class="story-paragraph" data-source-key="1098:0">室内传出来的歌声听起来闷闷的，被露台的风吹得断断续续，却又刚好能听清那几句呢喃般的词句。缓慢的鼓点混在风里，一下又一下，不轻不重地敲在她们交错的呼吸上。这种节奏让周围的世界显得格外寂静，几乎抱在一起的身体也感觉不到冷了，整场舞会仿佛只剩她们这一个无人知晓的角落还在缓慢地摇曳。</p><p class="story-paragraph" data-source-key="1100:0">志宇忽然停下了脚步。</p><p class="story-paragraph" data-source-key="1102:0">多绚下意识地转过头，再一次撞进了那双深不见底的眼睛里。</p><p class="story-paragraph" data-source-key="1104:0">她正极其专注地凝视着多绚，眼神里藏着比此时的夜色还要浓的情绪，暗流涌动，专注到仿佛周遭的一切，那些喧嚣、关于未来的不确定，所有一切全都消失了，世界只剩下这个在自己怀里，发丝微乱、眼神闪烁的少女。</p><p class="story-paragraph" data-source-key="1106:0">气氛在那一瞬间紧绷到了极点。</p><p class="story-paragraph" data-source-key="1108:0">志宇微微低头，清冷的气息混着那股木质香近在咫尺，几乎占据了多绚的呼吸。多绚感觉到她的视线在自己的唇上停留了很漫长的一秒，心跳快得几乎要停摆，耳边只听见自己乱了节奏的呼吸。</p><p class="story-paragraph" data-source-key="1110:0">她下意识地闭上眼，睫毛轻轻颤动着，双手不由自主地抓紧了志宇背后的衬衣布料，指尖因为用力而发白，在黑暗中等待着那个即将到来的触碰，这种紧绷的期待让她的指尖都在发麻。</p><p class="story-paragraph" data-source-key="1112:0">然而，预想中的柔软并没有落下。</p><p class="story-paragraph" data-source-key="1114:0">志宇只是在离她鼻尖仅剩几毫米的地方停住了，随后发出一声极轻的叹息，顺势低头，将额头轻轻抵在了多绚的额头上。两人的呼吸几乎缠在一起，等来的却是一个克制的休止。</p><p class="story-paragraph" data-source-key="1116:0">志宇重新收拢双臂，把多绚抱得更紧了一些，像在确认什么，又像在强迫自己冷静下来。</p><p class="story-paragraph dialogue" data-source-key="1118:0">“风大了，回去吧。”</p><p class="story-paragraph" data-source-key="1120:0">低沉略带一丝沙哑的声音在多绚耳边响起，但她听得出来，那股熟悉的理智已经重新回到志宇的语气里。</p><p class="story-paragraph" data-source-key="1122:0">多绚睁开眼，有些发愣，原本已经烧到头顶的热度，因为暧昧戛然而止而迅速降温，心底不可抑制地泛起了一阵细密而酸涩的失落。</p></div>
