        <header class="chapter-header"><span class="chapter-number">05</span><h2>Chapter 5</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="1125:0">晚宴厅内的空气被暖气烘烤得有些发燥，巨大的水晶吊灯在头顶不知疲倦地颤动，将光线切割成无数细碎的冰冷，扎进每个人的瞳孔里。</p><p class="story-paragraph" data-source-key="1127:0">志宇在长廊的阴影边缘停下脚步，在光亮与黑暗暧昧交界的缝隙里，目光穿过那些衣着体面的人影，无声地攀附在多绚的背影上。多绚正侧着头，与一位老牌地产大亨交谈，她指尖捏着细长的香槟杯，暗金色的酒液随着她的笑意微微晃动。那种姿态是极柔和的，眼神却像裹在绸缎里的刀片，精准切开社交场上的虚伪。</p><p class="story-paragraph" data-source-key="1129:0">志宇看得有些失神。那是记忆中的多绚从未有过的练达。过去多绚笑起来时眉眼会弯成两道柔软的钩，藏不住的灵动与娇气总让志宇想起在暖阳下翻肚皮的猫。而现在，那种足以掌控全场的气魄，是多绚用长达十年的剥离与重组换来的，用秩序崩塌后的瓦砾一片片磨出来的锋芒。</p><p class="story-paragraph" data-source-key="1131:0">看着多绚被几位名媛簇拥着引向远处的休息区，志宇略微垂下眼睑，试图将自己藏进更深的阴影里。作为一个附属品重回权力中心的焦虑感像潮湿的苔藓，顺着脊椎向上生长。</p><p class="story-paragraph" data-source-key="1133:0">一股混杂着香水的浓烈威士忌酒气，突兀地刺破了她这点小心翼翼守着的静谧。</p><p class="story-paragraph dialogue" data-source-key="1135:0">“瞧瞧这是谁……”</p><p class="story-paragraph dialogue" data-source-key="1137:0">“崔大小姐？”</p><p class="story-paragraph" data-source-key="1139:0">饶有趣味却刻薄的语气，朴允熙端着酒杯慢悠悠地走近，华丽的暗红色长裙在她身上显得有些局促。朴家的颓势几乎肉眼可见，朴父的重病与兄长的平庸，正像白蚁一样啃噬着这个昔日财阀的根基。即便妆容精致依旧，允熙那双眼底还是透出一种强撑门面的焦灼。她盯着志宇的脸，那张依旧清冷、俊美，甚至因为常年幽闭而透出一种病态苍白的脸。</p><p class="story-paragraph" data-source-key="1141:0">一种扭曲的、想要通过践踏旧物来确认自己权威尚存的欲望，在心底疯狂滋生。</p><p class="story-paragraph dialogue" data-source-key="1143:0">“被哪个金主买走了？”</p><p class="story-paragraph" data-source-key="1145:0">允熙冷笑着刁难，手毫无征兆地伸了过来。</p><p class="story-paragraph" data-source-key="1147:0">志宇的瞳孔骤然收缩。她本该躲开的，Alpha的身体机能即便在常年的压抑下也留有敏锐，可在被触碰到脸颊的一瞬间，深入骨髓的软弱、过去为了所谓的家族利益而对这个女人服从的奴性，如同生锈的锁链一样捆住她的身体。</p><p class="story-paragraph" data-source-key="1149:0">冰冷、带着酒精黏腻感的指尖触到了志宇的脸颊，留下一道令人作呕的触感，像毒蛇爬过的黏液一样附着在她脸上。</p><p class="story-paragraph dialogue" data-source-key="1151:0">“当初你在我跟前跟条死狗一样……”</p><p class="story-paragraph" data-source-key="1153:0">允熙的手指在志宇的优越的下颌线上游走，声音压低，带着狂妄的快意。</p><p class="story-paragraph dialogue" data-source-key="1155:0">“现在跟了金多绚，腰都挺直了？”</p><p class="story-paragraph dialogue" data-source-key="1157:0">“怎么，那个秘书的女儿……真能给你重新当个人的错觉？”</p><p class="story-paragraph" data-source-key="1159:0">志宇没有动，也没有反驳。她只是静静地看着允熙，那双无论经过多少折磨好像都不会变浑浊的眼里没有愤怒，只有近乎荒凉的平静。在那些被当作玩物买卖的日子里，她早已学会如何将灵魂从躯壳中抽离。</p><p class="story-paragraph dialogue" data-source-key="1161:0">“朴小姐，你醉了。”志宇的声音很轻，没有任何起伏。</p><p class="story-paragraph dialogue" data-source-key="1163:0">“我没醉！”</p><p class="story-paragraph" data-source-key="1165:0">允熙被她这死水一般的反应激怒，伸手猛地攥住志宇的领带，用力向下一拽，强迫志宇低头。</p><p class="story-paragraph dialogue" data-source-key="1167:0">“你这种脏透了的东西，她也敢带出来显摆……”</p><p class="story-paragraph" data-source-key="1169:0">被迫低垂着颈部，领口骤然收紧，额角的青筋在白皙的皮肤下微微跳动，志宇眼底洇出一层生理性的水汽。</p><p class="story-paragraph dialogue" data-source-key="1173:0">“允熙小姐。”</p><p class="story-paragraph" data-source-key="1175:0">声音在两人身后响起打破了这僵局。多绚不知何时过来了。她站在光影交织的地方，没有疾言厉色，唇角甚至还挂着一丝恰到好处的社交微笑，但空气却像干燥的柴堆被点燃，透出令人窒息的灼热的压迫感。感受到那股气压的允熙，手指一僵，下意识松开了紧攥的领带。</p><p class="story-paragraph" data-source-key="1177:0">多绚缓步走上前，不紧不慢地抚平了志宇胸前那道被扯乱的褶皱，动作轻柔得像是在整理一件心爱的易碎品。</p><p class="story-paragraph dialogue" data-source-key="1179:0">“令尊身体欠安，我想允熙小姐现在的当务之急应该是回去好好守着家产，算一下还能撑多久。”多绚的声音温婉，每个字却都像冰冷的钉子，一颗一颗扎入允熙的耳里。</p><p class="story-paragraph dialogue" data-source-key="1181:0">“而不是在这里……”</p><p class="story-paragraph dialogue" data-source-key="1183:0">“纠缠我的人。”</p><p class="story-paragraph" data-source-key="1185:0">多绚向前一步，稍侧过身，用自己的身影彻底挡住了允熙心虚地瞟向志宇的目光。</p><p class="story-paragraph dialogue" data-source-key="1187:0">“趁我还没腾出手来把朴家的旧账一并清算。”多绚微微歪头，压低声音，眼里的寒意如针。</p><p class="story-paragraph dialogue" data-source-key="1189:0">“请不要在这个时候，让我改变主意。”</p><p class="story-paragraph" data-source-key="1191:0">允熙的脸色由红转白。在多绚绝对的上位者的气压面前，所有的虚张声势都像水中的泡沫一样破碎了。她咬着牙，死死盯着多绚，似乎还是在那双冷淡的、狐狸一般锐利的眼睛里看到了某种毁灭的预兆，最终只能狼狈地走开了。</p><p class="story-paragraph" data-source-key="1193:0">长廊重归寂静。多绚转过身，看着依旧低着头的志宇。她伸出手，指尖轻轻托起志宇的下颌，目光落在那片刚才被允熙碰过的皮肤上，那里印着一种令多绚极度不悦的、属于他人的气息。</p><p class="story-paragraph" data-source-key="1197:0">回程，车窗外不断后退的路灯光影规律地掠过。志宇紧握着方向盘，指节因为用力而泛着冷硬的白，多绚没有在宴会厅里惩罚她一时大意被允熙摸到的事，已是极大的体贴。可这种延迟降下的惩罚，反而比当众羞辱更让她感到煎熬。</p><p class="story-paragraph" data-source-key="1199:0">从刚才开始，她就感觉到身侧投来的视线。多绚陷在副驾驶柔软的真皮座椅里，透出几分慵懒，或许是今晚的几杯香槟让她散发着一种微醺而燥热的木质香气。那种视线不再是高高在上的审视，而是湿润的、带着浓重占有欲的探寻，顺着志宇紧绷的颈部线条一寸寸向上攀爬。</p><p class="story-paragraph dialogue" data-source-key="1201:0">“她碰了你的脸。”</p><p class="story-paragraph" data-source-key="1203:0">多绚轻声开口，声音在这窄小的空间里显得格外清晰。</p><p class="story-paragraph" data-source-key="1205:0">趁着等红灯停下的间隙，志宇转过头，撞见多绚略显迷离的桃花眼。在刚才社交场上撑起的精明外壳，在此时撤去了一半。</p><p class="story-paragraph dialogue" data-source-key="1207:0">“对不起，是我没躲开。”志宇低声回答。</p><p class="story-paragraph" data-source-key="1209:0">多绚没有立刻接话，右手手肘抵着车门，食指抵在唇边反复轻轻触碰着唇瓣，频率细碎而急促，在寂静的车厢里透出一种随时可能失控的焦躁，令人不安。她的目光仍在志宇那片被讨厌的人碰过的皮肤上流连，最后顺着车窗外闪烁的霓虹，投向前方变换了颜色的信号灯。</p><p class="story-paragraph dialogue" data-source-key="1211:0">“过了这个路口，靠边停车。”</p><p class="story-paragraph" data-source-key="1213:0">志宇一怔，还以为回家才会到来的惩罚看来要提前下达了，她握着方向盘的手指收紧，顺从地踩下油门。这辆哑光黑的轿跑悄无声息地滑入路边浓重的树影下，像一只通体漆黑的深海生物潜入暗流，引擎熄灭的瞬间，周遭的静谧像海水般倒灌进来，压得志宇连呼吸都不敢放开。</p><p class="story-paragraph dialogue" data-source-key="1215:0">“过来。”</p><p class="story-paragraph" data-source-key="1217:0">志宇迟疑了一秒，顺从地解开安全带，侧过身靠了过去。在这低矮且窄小的驾驶舱内，她不得不半悬着身体，长腿局促地抵在方向盘下方，膝盖抵着中控台的边缘生疼。原本以为会迎来一通冷漠的训斥，或许一个响亮的耳光，却没想到，慵懒地陷在副驾里的多绚，竟然抬起手，异常温柔地攀上了她的后颈。</p><p class="story-paragraph dialogue" data-source-key="1219:0">“志宇啊。”</p><p class="story-paragraph" data-source-key="1221:0">多绚仰着脸，酒后的气息甜美且危险。她没有端着主人的架子，指尖以一种诱导的频率轻轻摩挲志宇那截微凉的颈椎。</p><p class="story-paragraph dialogue" data-source-key="1223:0">“你在想什么？”多绚的声音极轻，呼吸几乎扑在志宇的鼻尖。</p><p class="story-paragraph dialogue" data-source-key="1225:0">“看到她的时候，在想以前那些……感情吗？”</p><p class="story-paragraph" data-source-key="1227:0">志宇的心剧烈跳动起来。她被迫维持着那个憋屈的姿势，目光紧紧锁在多绚近在咫尺的唇瓣上。多绚的神情在阴影里显得晦暗不明，那双平日里冷淡的眼眸此时略微眯起，透出偏执的审视，用不平等的掌控，去确认志宇灵魂深处是否有哪怕一丝一毫的游离。</p><p class="story-paragraph" data-source-key="1229:0">志宇心中泛起一阵荒谬的无力感，多绚怎么会问出这种话？她和那个女人之间，那场荒唐得实在不愿称之为旧情的过去，不过是父亲施加给她的无法拒绝的要求之一，是她信了“为家族前途”这种鬼话之后向现实低头的表演。她从未在朴允熙身上放过半点真心，甚至连那种由于生性软弱而产生的依附，都令她作呕。多绚对此应该再清楚不过，现在为何还……可那些软弱终究是她亲手种下的因，此时只能由她自己吞下这苦涩的果。</p><p class="story-paragraph" data-source-key="1231:0">志宇注视着她，眼神深邃得化不开。</p><p class="story-paragraph dialogue" data-source-key="1233:0">“没有。”</p><p class="story-paragraph" data-source-key="1235:0">那双眼睛在昏暗中闪烁着偏执而清亮的光，一向平稳的声音也在此刻微微发颤。</p><p class="story-paragraph dialogue" data-source-key="1237:0">“我只看得到您。”</p><p class="story-paragraph" data-source-key="1239:0">似乎终于听到了满意的答案，多绚眼底冰冷的防备悄然融化，露出一抹带着胜负欲的浅笑，她微微仰起下巴，手上用力，将志宇压得更近。</p><p class="story-paragraph dialogue" data-source-key="1241:0">“吻我。”</p><p class="story-paragraph" data-source-key="1243:0">这是命令，却又因为酒精的余温而听起来更像一个渴求确认的撒娇。</p><p class="story-paragraph" data-source-key="1245:0">志宇却僵住了。这是重逢后，多绚第一次向她索要亲吻。不是那种对宠物狗一样的触碰，也不是充满羞辱的惩罚，而只是一个吻。</p><p class="story-paragraph" data-source-key="1247:0">自卑的酸涩感冲上志宇的心头，她这样一个带着原罪和沦落痕迹的卑贱存在，根本不配。可与此同时，卑微的感激却又在心里疯狂蔓延，即便清醒地知道，或许多绚仅是因为受了允熙的刺激，又或许只是被酒精模糊了恨意的边界……但这种被对方需要的感觉，依旧让她感到一丝救赎。</p><p class="story-paragraph" data-source-key="1249:0">她小心翼翼地低下头，嘴唇碰触到多绚的瞬间，久违的“生而为人”的颤栗席卷了全身。她的吻很轻，很慢，几乎像对神一般虔诚而敬畏，那份掩埋在灵魂深处连她自己都不敢面对的情愫似乎微微动摇了。</p><p class="story-paragraph" data-source-key="1251:0">然而多绚并不满意这种带着试探与退缩的温柔。酒精让她的占有欲变得前所未有的强烈。表面上看，她似乎是这场博弈最后的赢家，将曾经不得不和人分享的崔志宇买回身边像玩物一样支配。可只有她自己知道，她必须确认，确认眼前的人不是出于畏惧，也不是因为那种可笑的赎罪才温顺地低头。</p><p class="story-paragraph" data-source-key="1253:0">她不需要虔诚，不需要敬畏，更不需要这种带着距离感的感激。</p><p class="story-paragraph" data-source-key="1255:0">纤细的手指死死扣住志宇的脑后，强迫对方更深地压向自己。呼吸纠缠，舌尖毫不犹豫地撬开志宇的唇缝，追逐着掠夺。积压了整晚的躁郁的侵略性，在这一刻彻底决堤。</p><p class="story-paragraph" data-source-key="1257:0">酒精的香气伴随着多绚那股干燥的木香在志宇的感官里横冲直撞。志宇被这股突如其来的强烈攻势激得有些眩晕，一只手下意识地死死撑在副驾座椅上，指尖深深陷进昂贵的皮质里。在这片粘稠的黑暗中，志宇另一只手凭着身体最原始的本能，缓缓扶上了多绚的后颈。掌心擦过颈侧细嫩的皮肤，她感受到多绚加速跳动的脉搏。</p><p class="story-paragraph" data-source-key="1259:0">而就在下一秒，指尖传来的触感发生了某种虚幻的错位。</p><p class="story-paragraph" data-source-key="1261:0">原本平滑细腻的皮肤，在志宇的指腹下诡异地扭曲、干枯。时间在这一瞬仿佛发生了剧烈的坍塌，将她的意识拽回十年前那个带着轻微血腥味的清晨。</p><p class="story-paragraph" data-source-key="1263:0">那种黏糊、阴冷的幻觉顺着指尖钻进骨缝，指腹摸到的不再是温热细嫩的皮肉，而是那个被她咬烂，还带着干涸血痂的伤口。从牙齿深处泛起的淡淡血腥气，跨越了整整十年，这一刻精准地在她的味蕾上复活，引得胃里一阵翻江倒海。</p><p class="story-paragraph" data-source-key="1265:0">视觉彻底错乱，眼前的多绚，与那个后颈上横着狰狞齿痕、脸色苍白如纸的十六岁少女重合在一起。</p><p class="story-paragraph" data-source-key="1267:0">​志宇瞳孔骤然涣散，嗓子里挤出一声破碎的呜咽，那种刻在骨子里的怯懦像毒药一样发作，手猛地往回一缩，她下意识就低头想往后躲。想逃开这个吻，逃开那张让她负罪到窒息的脸。</p><p class="story-paragraph" data-source-key="1269:0">​多绚敏锐地察觉到了这阵退缩。她太了解志宇了，深知志宇眼里泛起的破碎不是因为动情。</p><p class="story-paragraph" data-source-key="1271:0">心底那股被酒精催化的恨意猛然间烧得更旺，恨志宇习惯性的逃避，更恨时至今日，志宇竟然还是想缩回自责的壳里，用卑微的姿态躲避这场对峙。她不仅没有松手，反而更加用力地封住了志宇节奏乱掉的呼吸。</p><p class="story-paragraph" data-source-key="1273:0">在再次感受到退缩的刹那，多绚发狠地咬下去。</p><p class="story-paragraph dialogue" data-source-key="1275:0">“唔……！”</p><p class="story-paragraph" data-source-key="1277:0">​志宇喉间溢出一声短促的痛呼。尖锐的刺痛猛地贯穿了神经，温热的带着铁锈味的血液在两人的唇齿间猝然炸开。辛辣而真实的血腥气，硬生生将十年前那个阴冷绝望的早晨扯回了现实。</p><p class="story-paragraph" data-source-key="1279:0">​志宇的身体在她掌心下轻轻颤抖，好像在哭，但不管她是痛的还是怕的，多绚都没有停下。她卷动着舌尖，贪婪地舔吮志宇唇上渗出的鲜血，接着变本加厉地吻了下去。她要用鲜活而灼热的痛苦去挖空志宇脑海里那些阴冷的幻觉，把这个打算溺死在过去的深海的女人，强行拽出水面。</p><p class="story-paragraph" data-source-key="1281:0">嘴唇上的痛苦在多绚的持续掠夺中渐渐麻木，在窒息的边缘，志宇混乱的大脑却因这种极端的感官刺激而产生了一丝清明，她终于感受到了，多绚并不只是想要一个俯首称臣的玩物、一条打不还手的狗。</p><p class="story-paragraph dialogue" data-source-key="1283:0">“崔志宇……”</p><p class="story-paragraph" data-source-key="1285:0">多绚在唇齿缠绕的间隙发出一声低喃，声音听起来却比任何时候都清醒。</p><p class="story-paragraph dialogue" data-source-key="1287:0">“记住这种疼。”</p><p class="story-paragraph" data-source-key="1289:0">志宇垂下眼帘，看着多绚因为情动而微红的眼角，她曾以为这些年她们是在各自的岸上背道而驰，可直到这一刻才惊觉，她们似乎还被困在那片冰冷刺骨的水下，谁都没有上岸。</p><p class="story-paragraph" data-source-key="1291:0">多绚根本没打算放过她，甚至没打算放过自己。</p><p class="story-paragraph dialogue" data-source-key="1293:0">“是……多绚。”</p><p class="story-paragraph" data-source-key="1295:0">她终于回应了那个名字，声音里透着死而复生的颤抖的人性。</p><p class="story-paragraph" data-source-key="1298:0">​</p><p class="story-paragraph" data-source-key="1298:1">车子重新启动时，除了引擎的低鸣，车内又陷入了死一般的寂静。</p><p class="story-paragraph" data-source-key="1300:0">刚才被志宇的指尖抚过后颈时的触感，像一团散不去的阴冷雾气，仍然缠绕在多绚的皮肤上。那种颤抖，那种生理性的退缩……多绚太熟悉了。</p><p class="story-paragraph" data-source-key="1302:0">​那是在十年前那个被汗水、药味和血腥气浸透的清晨，她第一次在志宇那双清澈的眼睛里看到的颜色。</p><p class="story-paragraph" data-source-key="1308:0">首尔陷入了一场似乎没有尽头的秋雨，昏暗的天色让整栋宅邸都显得阴冷潮湿。</p><p class="story-paragraph" data-source-key="1310:0">多绚轻手轻脚地推门进来，手里还拎着那盒跑了大半个首尔才买到的草莓蛋糕。原本她们约好下午一起去店里的，这邀请还是志宇主动提的。志宇当时一脸认真地推介，说那是她吃过能打9.5分的草莓蛋糕，一定要带多绚去尝尝。多绚那时候还顺口反问了一句，既然那么好吃，为什么不给10分。</p><p class="story-paragraph" data-source-key="1312:0">志宇却晃晃脑袋，说些让人摸不着头脑的话，什么“那不是草莓蛋糕能达到的最大值”之类的怪论。多绚记得很清楚，说那话时，一向冷静的志宇难得地笑得像个小孩子，眼神里全是纯粹的期待。</p><p class="story-paragraph" data-source-key="1314:0">可志宇却失约了，甚至连消息都没回。</p><p class="story-paragraph dialogue" data-source-key="1316:0">“小姐身体抱恙，说是谁也不见，您看……。”刚才管家在客厅里为多绚端来热茶，面露难色地解释着。</p><p class="story-paragraph" data-source-key="1318:0">多绚心里犯嘀咕。那家伙看着清瘦弱不禁风，上次去接她放学明明淋了雨，最后却连轻微感冒都没有，倒是多绚自己回去就打了喷嚏。现在却病得连约好的事都放了鸽子，没头没脑地玩失踪。心里那股傲娇劲儿和莫名的焦躁撞在一起，好像非要亲眼看看这人是不是真的卧病在床才甘心。</p><p class="story-paragraph" data-source-key="1322:0">房间里没有开灯，空气中弥漫着如同暴雨前夕的低气压。淡淡的香氛中混着一缕药味，但那种没来由的带刺的压迫感，激得多绚裸露在外的颈部皮肤起了一层细小的疙瘩。</p><p class="story-paragraph dialogue" data-source-key="1324:0">“崔志宇，醒着吗？”</p><p class="story-paragraph" data-source-key="1326:0">远远看着那个缩成一团的背影，原本那点气消了大半，多绚的语气里带上了点无奈。</p><p class="story-paragraph dialogue" data-source-key="1328:0">“别装啦，你就是想让我买好亲自给你送来吧……”</p><p class="story-paragraph" data-source-key="1330:0">嗔怪的话语在看清床上的景象时戛然而止。志宇侧躺在床上，整个人蜷缩成一个冷硬的弧度。清瘦的指节死死抓着身下的床单，呼吸声很重，每一声都像是从胸腔深处强行挤压出。</p><p class="story-paragraph dialogue" data-source-key="1332:0">“怎么病成这样？”</p><p class="story-paragraph" data-source-key="1334:0">多绚放下盒子，急忙凑过去。她坐到床边，手背贴上志宇的额头，触感是一片惊人的烫，甚至被那热度烫得缩了一下手。不安的情绪迅速涌上心头，压过了刚才那点小脾气。这不像是普通的发烧。突然病得这么重，崔志宇的父母整天忙得不见人影，看起来也没有像在好好照顾。</p><p class="story-paragraph" data-source-key="1336:0">多绚闻不到空气中那股带着强烈苦涩和攻击性的Alpha信息素，只觉得房间里闷得难受，越是靠近，越感觉似乎有什么无形的重量像块石头一样死死压在心口，连呼吸都变得有些费劲。</p><p class="story-paragraph dialogue" data-source-key="1338:0">“崔志宇？”</p><p class="story-paragraph" data-source-key="1340:0">多绚俯下身凑近了些，鼻尖几乎抵上对方的脸廓。</p><p class="story-paragraph dialogue" data-source-key="1342:0">“多绚……”</p><p class="story-paragraph" data-source-key="1344:0">志宇的声音沙哑得厉害，带着一种孩子气的、从未有过的鼻音。那双一向清冷自律的眸子此时覆着薄薄的水雾，瞳孔深处跳动着一种多绚从未见过的迷乱的渴求。</p><p class="story-paragraph" data-source-key="1346:0">她从没见过这样的志宇，应该说，有人见过吗？</p><p class="story-paragraph" data-source-key="1348:0">多绚顺势跪坐在床沿，心里之前那点气早就消散了，她轻轻拨开几缕因为出汗而黏在志宇脸上的乱发，动作温柔得连自己都没察觉。</p><p class="story-paragraph dialogue" data-source-key="1350:0">“你看起来很难受……”</p><p class="story-paragraph" data-source-key="1352:0">也不知道这家伙有没有好好吃药，额头上连个降温贴都没有，再这么烧下去，怕不是要烧坏脑子。想到自己平时生病时，妈妈都会耐心地守在床边照顾，多绚便撑着床沿准备站起来，打算去弄条湿毛巾来。</p><p class="story-paragraph" data-source-key="1354:0">可就在她起身的瞬间，原本看着虚弱得连动都动不了的志宇，手却猛地探了出来拉住了她的手腕，又用上了力道，把本来就重心不稳的多绚拽向自己。还没等多绚反应过来，那只修长纤细的手臂绕过她的后颈，在肩头落下，抱得不紧，但也不容她有挣脱的余地。</p><p class="story-paragraph" data-source-key="1356:0">最初的拥抱似乎只是纯粹的依恋。</p><p class="story-paragraph" data-source-key="1358:0">志宇这种反常的粘人让多绚心跳漏了一拍。毫无防备的依赖，让多绚感到既陌生又新鲜，心底甚至隐约生出一股隐秘的满足感。她没想太多，只当对方是烧糊涂了在撒娇。多绚放软了身体，手掌在志宇汗湿的后背上轻轻安抚着。</p><p class="story-paragraph dialogue" data-source-key="1360:0">“没事了，我在……”</p><p class="story-paragraph" data-source-key="1362:0">却像是根本没听见，志宇只是把脸深深地埋进多绚的颈窝，在那处温软里充满依恋地反复蹭着，像小狗撒娇一样，多绚甚至能感觉到对方挺拔的鼻梁正紧紧抵在自己颈侧疯狂跳动的动脉上。</p><p class="story-paragraph" data-source-key="1364:0">不好，自己心跳这么快，又要被发现了……</p><p class="story-paragraph" data-source-key="1366:0">多绚有些窘迫地缩了缩脖子。</p><p class="story-paragraph" data-source-key="1368:0">志宇的呼吸越来越乱，鼻尖在多绚后颈那块细嫩的皮肤上反复流连，滚烫的吐息像细密的火星，撩拨着那处敏感的神经。Alpha的本能在叫嚣，驱使她去搜寻那个能让灵魂平息的腺体，可多绚身上只有干净清爽的沐浴露香味，属于普通人的气息，无论她如何寻找，也捕捉不到半点信息素的安抚。得不到救赎的躁动在体内横冲撞撞，烧得她眼眶通红。求而不得的饥渴让她的理智变成了一张薄纸，在欲望的火苗下化为灰烬。</p><p class="story-paragraph" data-source-key="1370:0">既然找不到出口，就只能死死地抓住眼前的一点温存。她怎么都舍不得放开怀中温暖柔软的身体，揽在多绚的腰上的双手逐渐收紧，力道大得像是要把人揉进自己的身体里，多绚被箍得整个人都贴在了志宇怀中，甚至能隔着薄薄的衣料感受到对方剧烈起伏的心跳。</p><p class="story-paragraph" data-source-key="1372:0">这已经不是一个单纯的拥抱了。干燥的嘴唇开始顺着颈侧向上磨蹭，每一下都带着湿热粘稠的吐息，最终停在多绚的耳根处，发出了一声混杂着痛苦与渴求的低喘。志宇的头偏了偏，唇瓣擦过多绚的侧脸。她缓缓抬起头，雾气弥漫的视线在多绚微启的唇瓣上停留了片刻。</p><p class="story-paragraph" data-source-key="1376:0">吻发生时，远不如那些文艺片里的情节来得浪漫。</p><p class="story-paragraph" data-source-key="1378:0">都不提之前舞会那晚绝佳的气氛了，那时志宇最后却还是退缩了。眼下这一刻，甚至连之前两人贴在一起看电影时的怦然心动都比不上……</p><p class="story-paragraph" data-source-key="1380:0">可多绚的心脏还是在这一秒狠狠停跳了一下。这是她的初吻，电影里那场雷雨仿佛还在耳边回响，可在那时的想象里，志宇至少应该是清醒的。</p><p class="story-paragraph" data-source-key="1382:0">不该是现在这样……看起来真的像烧坏了脑子。平时那个像木头一样克制冷淡、连过马路牵她手都要犹豫一下的崔志宇，怎么可能突然变得这么主动，甚至这么……直白且盲目地吻她。</p><p class="story-paragraph" data-source-key="1384:0">起初，志宇只是极轻地碰了碰她的唇，像一片没有重量的干燥的叶子落在水面，动作还带着少年人特有的生涩与小心，细碎的、试探性的触碰。可还没来得及细细感受，吻就被对方擅自加深了，变成一场带有高热温度的掠夺。</p><p class="story-paragraph" data-source-key="1386:0">志宇从未对她说过喜欢。</p><p class="story-paragraph" data-source-key="1388:0">脑子里乱成一团，她不知道眼前这个体温过高、双眼发红的人到底知不知道自己在做什么，更不知道之后会变成什么奇怪的关系……心里那股不安却在她睁眼看到那张近在咫尺的脸时被抚平了一半。</p><p class="story-paragraph" data-source-key="1390:0">那是崔志宇啊，是那个在初秋的傍晚，出现在她家客厅里，毫无预兆撞进她生命里的天降理想型。那时候就已经产生了直觉的预感……她逃不掉的。既然是这个人的话，哪怕现在她神智不清，哪怕这是一个错误的开始……</p><p class="story-paragraph" data-source-key="1392:0">多绚有些自暴自弃地顺从了这份失控。她轻轻闭上眼，睫毛颤得厉害，两条轻轻颤抖的手臂缓缓勾住了志宇的脖子，将自己更深地送进那个滚烫潮湿且充满侵略性的吻里。</p><p class="story-paragraph" data-source-key="1394:0">房间里只剩下两人交缠在一起、沉重而凌乱的呼吸。</p><p class="story-paragraph" data-source-key="1396:0">有力的舌尖撬开多绚唇齿的防守，那种侵略性是递增的。她感到志宇的呼吸越来越急促，而自己的呼吸却渐渐被抽走。温热的吐息扑在脸上，越来越无力招架。原本就收紧的环绕的手臂还在不断施压，明明已经没有可以挤压的空间了，却好像还觉得怎么都不够近。两个身体都是清瘦的，志宇更甚，力道却重得让她感到肋骨生疼。她开始感觉不对劲，试图推开紧贴在自己身上的滚烫的身体。</p><p class="story-paragraph dialogue" data-source-key="1398:0">“等一下……”</p><p class="story-paragraph dialogue" data-source-key="1400:0">“崔志宇……”</p><p class="story-paragraph" data-source-key="1402:0">已经听不见了。第一次易感期的洪流决堤，彻底冲毁了残存的理智。</p><p class="story-paragraph" data-source-key="1404:0">推不开，志宇的力量太大了，纤细的身体是如何爆发出这种力气的。那种压迫感让多绚感到了一种求生本能的畏惧。</p><p class="story-paragraph" data-source-key="1406:0">没有商量的余地，手探进衣服下摆，发烫的掌心顺着多绚的腰线向上，动作有些急促而粗鲁。多绚胡乱捶打，但怎么也推不开。志宇终于放过那对已经吻到过于发红的嘴唇，吻又落在多绚敏感的脖子，急促湿热的呼吸打在细嫩的皮肤上。</p><p class="story-paragraph" data-source-key="1408:0">烧糊涂的人没有停下的意思，明明是该由清醒的一方来叫停这场毫无心理准备的情事，多绚却晕乎乎的不受控制地全身发软，也阻止不了志宇伸进她衣服里作乱的手，被带着灼人温度的手触碰过的每一寸皮肤都像被羞耻和渴望的鞭子抽打过一般，令她难以承受，无助中，哭得身体都颤抖了起来。</p><p class="story-paragraph" data-source-key="1410:0">眼泪却没有得到怜惜。</p><p class="story-paragraph" data-source-key="1412:0">很快，那件白色的露肩毛衣被利落地向上推起，又或者说是被那双滚烫的手强行剥离，那是志宇在情欲笼罩下唯一残留的机械的秩序感。带着凉意的空气瞬间贴上皮肤，紧接着又是志宇发烫的掌心。多绚从未如此清晰地感受自己身体的轮廓，在志宇那双修长、指节分明的手下被一点点勾勒出来，被剥开的羞耻感和对未知的恐惧交织在一起，既想推开又无处依附的指尖深深地陷入了志宇的手臂皮肤里。</p><p class="story-paragraph" data-source-key="1414:0">志宇将多绚压在身下，动作透着一种冷静而绝对的独裁。多绚仰着头，看着志宇那双被情欲笼罩的眼，那里没有往常的克制，只有迷失的一心想要把她揉碎吞下的执拗。</p><p class="story-paragraph" data-source-key="1416:0">温热的唇齿顺着锁骨一路向下。是吻吗？还是对猎物的细细啃噬？志宇经过的每一处皮肤上都留下了淡淡的红痕。多绚感觉自己就像被肉食动物猛地扑倒在地、毫无挣扎余地的羊，正在这昏暗的房间里，被志宇一点一点、连皮带骨地吃掉。</p><p class="story-paragraph" data-source-key="1418:0">胸前猝然传来一阵细密的疼，志宇的齿尖没轻没重地在那处脆弱上反复磨过。身体不由自主地变得奇怪起来，明明这种粗鲁的对待让她感到难受更多，却又在锐利的痛感过去后，不可抗拒地转化成一种新奇而陌生的酥麻。</p><p class="story-paragraph dialogue" data-source-key="1420:0">“啊……”</p><p class="story-paragraph" data-source-key="1422:0">一声带着哭腔的轻喘从喉咙溢出，多绚原本抵在志宇肩头推拒的双手，不知何时已经卸了力，认命般地搭在了对方那颗埋在自己胸前的头上。</p><p class="story-paragraph" data-source-key="1424:0">听到这声微弱的动静，志宇的动作明显顿了顿。但仅有的一丝迟疑也很快就被更深层的本能吞没。没有任何商量的余地，手探入裙摆，顺着多绚紧绷的大腿探了上去，径直拨开那层已经略微潮湿的碍事的布料边缘，指尖带着一种生硬且侵略性的力道，强行向深处挤压探索。</p><p class="story-paragraph" data-source-key="1426:0">只是手指的试探，就已经艰难到了极点。</p><p class="story-paragraph" data-source-key="1428:0">多绚整个人都在剧烈发抖，不安和生理性的排斥让内里紧缩得厉害。志宇每往里探入一寸，都能感觉到那层柔软的内壁在死死抵御入侵，毫无经验的青涩让她强硬的进入变成折磨的拉锯。身体根本无法容纳这种程度的掠夺，更别提接纳志宇腿间正烧得发狂、急需发泄的欲望。被强行撑开的，带有撕裂感的恐惧让多绚几乎喘不上气，只能无助地仰起头，看着天花板上的阴影在眼前晃动。</p><p class="story-paragraph" data-source-key="1430:0">可对于此时的志宇来说，这种痛苦的阻碍反而成了催化剂，太想得到了，那种想要彻底占有的原始的念头，让她即便感觉到多绚的战栗，也依旧没有停下的意思。</p><p class="story-paragraph dialogue" data-source-key="1432:0">“疼……”</p><p class="story-paragraph dialogue" data-source-key="1434:0">“崔志宇……不要……”</p><p class="story-paragraph" data-source-key="1436:0">滚烫且生硬的东西死死抵在入口，不由分说地往里一点点挤压。从未体验过的要把身体生生劈开的撕裂感让多绚几乎窒息，她死死抓着志宇的后背，又是一波泪水涌上来在眼眶里打转，可干燥喉咙里连求救的声音都发不出来了。</p><p class="story-paragraph" data-source-key="1438:0">志宇突然停了下来。双臂撑在多绚身侧，微微俯身，轻轻吻去多绚睫毛上的泪水。动作温柔得几乎让人产生错觉，好像她依然是那个克制礼貌的崔志宇，而她们下身之间那场残忍的入侵没有发生。</p><p class="story-paragraph dialogue" data-source-key="1440:0">“多绚……多绚……”</p><p class="story-paragraph" data-source-key="1442:0">她的嗓音低沉沙哑，仿佛在深渊里反复呼唤唯一的救命稻草。多绚对上那双眼，除了欲望，竟还能看出几分求助般的绝望。她心底最后那点挣扎也彻底垮了。那双已经在志宇背上抓出数道血痕的手松开，无力地垂落在床单上，最终却还是抬起来，轻轻环住了对方的脖子。在剧痛与意识出走的边缘，被迫承受着如狂风暴雨般倾泻下来的情潮。</p><p class="story-paragraph" data-source-key="1444:0">感官在这一刻迎来暴乱，身体像一张被拉到极限随时会折断的弓。恍惚中，她看着志宇那张因为蒙着一层薄汗而显得愈发柔和的脸，脸上那双充满侵略意味的眼睛，心中满是荒诞的错觉。</p><p class="story-paragraph" data-source-key="1446:0">那个总是在气氛微妙时静静看着她，却连告白都说不出口的崔志宇，和现在这个满脸写着无助、却又全凭本能偏执地快要把她弄坏的崔志宇……</p><p class="story-paragraph" data-source-key="1448:0">真的……是同一个人吗？</p><p class="story-paragraph" data-source-key="1454:0">清晨的阳光并不温暖，冷硬地斜切过凌乱的地板，照在散落一地的衣服上。</p><p class="story-paragraph" data-source-key="1456:0">志宇睁开眼，视线里仍是熟悉的房间天花板，却又隐约觉得有什么东西变了。连日来如影随形的燥热与混沌一扫而空，取而代之的是一种久违的、近乎透明的清明感。视觉和听觉敏锐得惊人，每一次呼吸都顺畅得不可思议，仿佛整个人被从里到外重新洗涤了一遍，连指尖都透着分化后的轻盈。</p><p class="story-paragraph" data-source-key="1458:0">折磨了她数日的、近乎噩梦的高热，似乎终于平息。</p><p class="story-paragraph" data-source-key="1460:0">难道是因为那个梦吗？</p><p class="story-paragraph" data-source-key="1462:0">想到那些碎片般的梦境，志宇感到脸颊微微发烫。虽然模糊，但那几乎称得上真实的触感，多绚的体温……真是无法想象，自己竟然会对多绚产生那种程度的幻想。</p><p class="story-paragraph" data-source-key="1464:0">她盯着天花板，心跳慢了半拍，隐秘的情绪在此刻无所遁形。</p><p class="story-paragraph" data-source-key="1466:0">想起之前偶然听到多绚和朋友打电话时，自己心底泛起无端的、潮湿的嫉妒，所以那晚才非要借口作业之名，固执地挤在对方身边一起看，其实早就知道剧情不是吗，知道男女主会在那场雨中接吻，才故意那样扰乱多绚的心思不是吗。</p><p class="story-paragraph" data-source-key="1468:0">原来是喜欢多绚啊。</p><p class="story-paragraph" data-source-key="1470:0">这种认知在此时清爽的晨光中显得如此清晰。要是那时候吻上去，多绚会是什么反应呢？</p><p class="story-paragraph" data-source-key="1472:0">她缓缓坐起身，被子顺着肩膀滑落。本该只有自己的床上，却在身侧传来一丝极其细微的由于翻身而引起的摩擦声。</p><p class="story-paragraph" data-source-key="1474:0">志宇的心头猛地一紧，脖颈僵硬得像是生了锈，她迟钝地转过头，看向了床的另一侧。</p><p class="story-paragraph" data-source-key="1476:0">那里蜷缩着一个身影。</p><p class="story-paragraph" data-source-key="1478:0">那个身影背对着她，极度缺乏安全感地紧紧团缩在一起。被子松松垮垮地搭在腰际，在清晨冷硬的阳光下，少女裸露的肩头和背部显得苍白如纸，而上面分布着的那些刺眼的红痕，直刺志宇的瞳孔。</p><p class="story-paragraph" data-source-key="1480:0">呼吸在那一刻凝固，肺部的氧气仿佛被瞬间抽干。</p><p class="story-paragraph" data-source-key="1482:0">不，不可能……</p><p class="story-paragraph" data-source-key="1484:0">她死死盯着那个背影。那是少女特有的、纤细到让人心惊的骨架，深棕色的发丝凌乱地铺散在枕头上，几缕碎发被干涸的汗水或者泪水黏在颈侧。而最让她感到惊惧的，是那截白皙后颈上，一个清晰可见、甚至还带着干涸血迹的咬痕。</p><p class="story-paragraph" data-source-key="1486:0">强烈的眩晕感排山倒海般袭来，将她刚刚才获得的清明感撞得粉碎。无比希望这只是梦魇的延续，或者是高热烧坏了她的大脑。</p><p class="story-paragraph" data-source-key="1488:0">多绚现在应该在自己家里，应该在温暖的被窝里醒来，而不是这样赤裸且伤痕累累地躺在她的床上。</p><p class="story-paragraph" data-source-key="1490:0">志宇的视线颤抖着下移，落在了那条暴露在空气中纤细的左臂上。在那片由于过度用力而留下的淤青边缘，两颗并排的小痣静静地待在那里。</p><p class="story-paragraph" data-source-key="1492:0">所有的自欺欺人都在此刻坍塌。</p><p class="story-paragraph" data-source-key="1494:0">志宇只感到一种灭顶的寒意顺着脊椎骨一寸寸爬上来。原来那不是梦。疯狂的、不顾对方哭声的占有，如同要把那个脆弱的身体贯穿的深入和撞击……被她归类为高热幻觉的碎片，正带着刺骨的真实感，一幕幕在脑海中重组。</p><p class="story-paragraph" data-source-key="1496:0">竟然全都……是真的。</p><p class="story-paragraph" data-source-key="1498:0">她看向自己颤抖的双手，指缝间似乎还残留着多绚皮肤的温热。再看一眼地上那件被揉成一团、孤零零丢在床下的白色毛衣，从未有过的荒谬的迷茫将她笼罩。</p><p class="story-paragraph" data-source-key="1500:0">记忆是虚幻的，可那种摧毁一切的冲动却隐约还在身体深处翻涌。</p><p class="story-paragraph" data-source-key="1502:0">是她亲手造成的。</p><p class="story-paragraph" data-source-key="1504:0">哪怕胃里空无一物，那种极度的自我厌恶也让她胃里一阵翻江倒海。</p><p class="story-paragraph dialogue" data-source-key="1506:0">“多绚……”志宇颤抖的声音里透着卑微。</p><p class="story-paragraph" data-source-key="1508:0">多绚动了。由于牵动了身体的不适，她发出了一声极轻的、破碎的吸气声。她缓慢转过身来，眼睛微微红肿着，显然是很厉害地哭过。可在那双失神的眼中，不仅没有志宇预想的惊恐，竟然还浮现出了一丝终于放下心的希冀。</p><p class="story-paragraph" data-source-key="1510:0">在志宇因为惶恐而想要退缩，甚至想要落荒而逃的瞬间，多绚像一只受了伤却依然想寻求主人怀抱的猫，慢慢把缩成一小团的自己凑进志宇的怀里。凉凉的额头抵在志宇的锁骨，像在确认什么一般，在颈窝轻轻蹭了蹭，试图从这具清醒过来的身体上，捕捉到一丝暴虐褪去后、自己熟悉的清冷香气。</p><p class="story-paragraph dialogue" data-source-key="1512:0">“你好些了吗？”</p><p class="story-paragraph" data-source-key="1514:0">简单的关心却像一根烧红的长钉，狠狠刺进志宇的心脏。</p><p class="story-paragraph" data-source-key="1516:0">沉重的负罪感如凶猛的海啸在心中涌动，志宇整个人都在抑制不住地发抖。多绚因为受创而微微发热的体温贴着她的胸口，那种好像不管做了什么都会被原谅的包容，此刻却像一把最锋利的手术刀，一点一点剖开了她那层名为理智的尊严。</p><p class="story-paragraph dialogue" data-source-key="1518:0">“……我让司机送你回家。”</p><p class="story-paragraph" data-source-key="1520:0">志宇低声开口，眼神死死钉在某个虚空的角落。</p><p class="story-paragraph" data-source-key="1522:0">多绚怔了一下。她感觉到了志宇紧绷的脊背，也感觉到了彼此心中某种东西的碎裂。</p><p class="story-paragraph" data-source-key="1524:0">昨晚下了一夜的小雨已经停了，早上的空气冷得彻骨。</p></div>

      <article class="chapter" data-chapter="section-06">
        <header class="chapter-header"><span class="chapter-number">06</span><h2>Chapter 6</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="1527:0">温哥华初冬的阳光不炽热。史丹利公园的海堤步道延伸向远方，深蓝的海面反射着破碎的光线，海鸥贴着水面滑行而过，发出几声空旷的鸣叫。</p><p class="story-paragraph" data-source-key="1529:0">多绚终于得以换下紧绷的西装，只套了一件质地柔软的羊绒衫，陪那只大狗跑热了，脱下大衣抱在手里。</p><p class="story-paragraph" data-source-key="1531:0">回来这几天，她像一台精密运转的机器。那些老人嗅到了风声，视她大规模调动资本回首尔的行径为年轻继承人感情用事，指控她决策失误，却不料多绚在回程的飞机上，就算好了每个人背叛成本。</p><p class="story-paragraph dialogue" data-source-key="1533:0">“那孩子总是这么有精神。”</p><p class="story-paragraph" data-source-key="1535:0">母亲停下脚步，看着前方草坪上撒欢奔跑的金毛。Maple叼着一个沾满唾液和草屑的网球，摇晃着蓬松的尾巴，仿佛听懂两人在讲它一样，兴冲冲地从前方一路跑回来，在她们身前绕圈，脚爪踩在松软的草皮上，发出轻快的声响。</p><p class="story-paragraph" data-source-key="1537:0">多绚弯下腰，从Maple嘴里拿过球，湿漉漉的球蹭过她的手心，那双忠诚而清澈的眼睛让她一愣。她用力将球抛向远处，看着那团明亮的金色如射出的箭般跑远。</p><p class="story-paragraph dialogue" data-source-key="1539:0">“工作是做不完的，”</p><p class="story-paragraph" data-source-key="1541:0">母亲走到她身边，挽住她的手臂，她们在长椅上坐下。</p><p class="story-paragraph dialogue" data-source-key="1543:0">“难得天晴，这里的冬天，太阳是奢侈品。”</p><p class="story-paragraph" data-source-key="1545:0">远处的雪山尖顶在蓝天下显得圣洁，海风带来的是松针与微咸的海水气。一切都干净得让多绚感到陌生，明明人生大多数时候都在这里度过，心却好像跌落在万里之外那个如同荒诞插曲的地方。她在这里呼吸着纯净的氧气，大脑却在不听使唤，模拟着那股混沌而挣扎的湿润森林气息。</p><p class="scene-break" data-source-key="1547:0" aria-label="场景分隔">……</p><p class="story-paragraph" data-source-key="1549:0">都怪那个该死的吻。要是没有发生就好了。</p><p class="story-paragraph" data-source-key="1551:0">这趟走得突然，没跟首尔家里那条狗打招呼，本来也没想打招呼的。狗就是狗，在家静静等主人回家是本分。不过，等到回去，或许会发现狗已经跑丢了也说不定。</p><p class="story-paragraph dialogue" data-source-key="1553:0">“妈，我下周还会回去，不能多陪陪您……”</p><p class="story-paragraph" data-source-key="1555:0">多绚握住母亲温暖的手掌。</p><p class="story-paragraph dialogue" data-source-key="1557:0">“首尔啊。”</p><p class="story-paragraph" data-source-key="1559:0">母亲轻舒一口气。</p><p class="story-paragraph dialogue" data-source-key="1561:0">“当初你爸爸决定要回去的时候，这边的朋友都说他疯了。”</p><p class="story-paragraph dialogue" data-source-key="1563:0">“在大学里有个不错的工作，有不错的家庭。”</p><p class="story-paragraph dialogue" data-source-key="1565:0">“……还有这种一眼就能看到头的安稳日子。”</p><p class="story-paragraph" data-source-key="1567:0">多绚的手指微微一顿。</p><p class="story-paragraph dialogue" data-source-key="1569:0">“他说因为还有想做的事，因为那里有人需要他。”</p><p class="story-paragraph" data-source-key="1571:0">上了年纪的女人目光里是历经千帆后的平静，她拍了拍多绚的手背。</p><p class="story-paragraph dialogue" data-source-key="1573:0">“实在放不下的话……也别太累。”</p><p class="story-paragraph" data-source-key="1575:0">Maple又跑了回来，将球吐在多绚脚边，吐着舌头哈气，眼神里全是单纯的讨好与快乐。多绚伸出手，揉了揉大狗脖颈间厚实的毛，指尖没入柔软的毛发中，她没有说话。</p><p class="story-paragraph" data-source-key="1579:0">地方只是地方而已。</p><p class="story-paragraph" data-source-key="1581:0">多绚记得小时候父亲有时会牵着她的小手去海边散步，那个和善、博学的男人会难得地陷入长时间的沉默，静静地望向海平面。当他回过神来，会蹲下身，揉揉她的发顶，问她，女儿啊，想回爸爸长大的地方看看吗？幼小的女孩舍不得学校里的朋友、邻居家的狗，但又似乎觉得只要有爸爸妈妈的陪伴，那就哪里都一样，于是只是任性地晃着男人的手臂，满不在乎地回答。</p><p class="story-paragraph" data-source-key="1583:0">As long as you play with me more often!</p><p class="story-paragraph" data-source-key="1585:0">然而这个幼小的愿望也只是碎在了飞机的轰鸣声里。带花园的大房子成了照片里的背景，取而代之的是那座线条冷硬，透着压抑秩序的新建公寓。她要开始磕磕巴巴地学着用韩语生活，父亲也只是比过去更忙碌了而已。</p><p class="story-paragraph" data-source-key="1587:0">不过很快就长大成少女的多绚，也不会再总是需要缠着爸爸，十几岁的女孩子似乎都很难像小时候一样和爸爸很亲。多绚开始更在意自己在学校的社交，开始不好好穿制服，把领带扯歪、裙摆缩短，在周末与朋友在外疯玩到深夜。当她摸黑偷偷溜进家门，被那个时常忙得不见人影，却在此刻端起父亲架子的男人训斥几句时，多绚只是理直气壮地将他视作空气，扔下一句Whatever. You&#x27;re never here anyway. 然后理直气壮地回到自己的房间，砰地一声把门摔上。</p><p class="story-paragraph" data-source-key="1589:0">或许那样的生活会继续下去，或许父亲还是会选择那样的方式离开她和母亲，但如果没有崔志宇……她至少可以恨得轻松一点、单纯一点。</p><p class="story-paragraph" data-source-key="1591:0">那是她第一次见到那样的人。身为议员千金，志宇却有一双过于清澈的、总是带点水气的眼睛。她站在那里，什么也不用说，白皙的颈部在光线下几乎透明，浑身散发着需要被呵护的易碎感。</p><p class="story-paragraph" data-source-key="1593:0">大概也不是多单纯的喜欢吧，那是父亲的上司的女儿，抢走了父亲注意力的或许是工作，但如果能从那个连公共汽车都不会坐，鱼饼都会煎焦，不像活在现实里的女孩子身上抢回一点什么，也是一种胜利不是吗。</p><p class="story-paragraph" data-source-key="1595:0">后来多绚才意识到，她喜欢的那双楚楚动人的眼睛，不过是因为有点近视而已。而那种吸引她不断靠近的精致的易碎感，也成了反过来伤害她的利器。</p><p class="story-paragraph" data-source-key="1597:0">地方只是地方而已。</p><p class="story-paragraph" data-source-key="1599:0">但多绚从那时候开始真的有点讨厌首尔了。</p><p class="story-paragraph" data-source-key="1601:0">明明发生了那样的事，没有关心，没有道歉，来得悄无声息却异常坚决的是志宇的疏远。</p><p class="story-paragraph" data-source-key="1603:0">其实本来如果不是她非要一次又一次靠近，志宇也不会主动的不是吗。Kakaotalk停留在那个约好一起去吃蛋糕的下午，多绚问她出门了没，拨出电话的记录也一样。一想到那个清晨穿透皮肤的寒意，她也很难再开口说什么，反正是她非要在那天不听劝跑去那个房间的，反正是她没有在感知到事态即将失控之际狠下心推开的，反正……也没想要志宇负责什么的。</p><p class="story-paragraph" data-source-key="1605:0">那样滑稽的想法在多绚心里一闪而过，如果闹得很难看，最终只会把父亲也扯进来，让尴尬雪上加霜，那样的话，还不如全部打碎了吞进肚子里算了。</p><p class="story-paragraph" data-source-key="1607:0">但至少有一次，多绚翘了下午最后一节课，跑到志宇的学校门口，想问对方她们到底算什么。可她只是远远看见那个依旧挺拔的身影，身边多了一个人，穿着和志宇一样的制服，不认识的女孩子，过于亲昵地挽着那根她只敢在护食心切、火上心头的时候才敢挽住的手臂。两人一前一后上了一辆黑色豪车。</p><p class="story-paragraph" data-source-key="1609:0">那种画面毫不违和，好像本就该那样，就算发生过一次意外，但那根本不代表什么，只是她比较倒霉而已，理所当然地，志宇不会跟她这样一个父亲秘书的女儿产生什么，她的存在才是这里的唯一有违和感的。所以没能上前，脚步好像被固定在了那棵树下，只是，就那样看着。</p><p class="story-paragraph" data-source-key="1611:0">但为什么要再出现呢？为什么要推开她之后又带着那样可怜的神色来乞求原谅呢，连体面退出的最后一丝平静都要夺走，这也太不公平了不是吗？</p><p class="story-paragraph" data-source-key="1613:0">多绚不想找麻烦，可麻烦却像吃准了她的退让一样会自己找来。那辆豪车像个漆黑的幽灵一样跟了她一路，从学校门口到回家的半路上，多绚有很好的记忆力，第一时间就意识到车里的人是谁，来找她什么麻烦。</p><p class="story-paragraph" data-source-key="1615:0">想都不用想，大概就是崔志宇那个白痴不小心说漏嘴了吧，或者在别人的床上叫错了名字，害得她被嫉妒心极强又任性的财阀的女儿盯上，被堵在这块建筑工地背后的空地上，不得不听一些嗡嗡嗡的刺耳杂音。</p><p class="story-paragraph" data-source-key="1617:0">喂，死丫头，你是不是觉得自己很特别？</p><p class="story-paragraph" data-source-key="1619:0">你那个当狗一样的老爸，没教过你怎么看主人的眼色吗？</p><p class="story-paragraph" data-source-key="1621:0">你这种东西，得知道自己的分寸啊，妈的。</p><p class="story-paragraph" data-source-key="1623:0">啊，说了这么多伤人的话，给钱打发人滚蛋的情节却没有上演，电视里不都是那么演的吗？给你一笔钱，对我的人死心吧，这样的。为什么自己收到的，只有被按着跪在地上，一桶从头淋到脚的、混着建筑灰尘冰冷刺骨的脏水呢。巨大的冲击力让多绚不由地缩着脖子打了个颤。脏水瞬间灌进她的耳道，顺着头发流进眼睛，带着浓重的铁锈味和粉尘的粗砺的液体，模糊了她的视线。</p><p class="story-paragraph" data-source-key="1625:0">冰冷污浊，无法呼吸的感觉，其实和那天早上在志宇僵硬的怀里感到的软弱一模一样吧，朴允熙给的羞辱是肮脏但外在的，而志宇给她的，却是深入骨髓再也洗不掉的阴湿。</p><p class="story-paragraph dialogue" data-source-key="1627:0">“真可怜。”</p><p class="story-paragraph" data-source-key="1629:0">允熙蹲下身，用名牌包拍了拍多绚湿透的脸，像在拍打一只刚从下水道捞出来的狗。帮一身穷酸傲气的死丫头涤荡了一下穷酸的灵魂，趁有人发现之前赶紧离开这种肮脏下贱的地方才是，允熙满意地转身准备上车。她半个身子进了车里，又像忽然想起来什么似的停下了动作。</p><p class="story-paragraph dialogue" data-source-key="1631:0">“啊对了，”</p><p class="story-paragraph dialogue" data-source-key="1633:0">“她说你黏着她的样子，”</p><p class="story-paragraph dialogue" data-source-key="1635:0">“恶心得想吐。”</p><p class="story-paragraph" data-source-key="1637:0">车门砰一声关上了。</p><p class="story-paragraph" data-source-key="1641:0">朴家名下的一处高级公寓里，空气中弥漫着由于嫉妒而变得咄咄逼人的信息素。</p><p class="story-paragraph" data-source-key="1643:0">允熙躺在床上，侧身点了支烟，又翻身躺回去，长发在枕头上散开。刚刚经历了一场并不算温存的结合，目光漫不经心地扫过身边正在穿衣服的志宇，这个她好不容易等到分化的Alpha。</p><p class="story-paragraph" data-source-key="1645:0">从两年前她第一次见到志宇，就想着一定要把对方变成自己的所有物。也因此，学校里没人敢招惹志宇，谁不知道这是她看上的猎物呢，但怎么也想不到，竟被外面的丫头先下手了。</p><p class="story-paragraph" data-source-key="1647:0">她看着准备进浴室的志宇，依然是那副死样子，清澈、易碎，即使在她的床上，即使在身体上最亲密的时刻，躲闪的眼神透着那种抓不住的游离，好像她可以抓住志宇的身体，却从未拥有过半点对方的灵魂。</p><p class="story-paragraph" data-source-key="1649:0">这种游离让允熙感到愤怒。</p><p class="story-paragraph" data-source-key="1651:0">说到底，志宇喜不喜欢她根本不重要，反正那个为了前途连女儿都可以进贡的议员老爹自然会劝志宇顺从，但明明和她在一起，心里却藏着别人，甚至在她的身边、在睡梦中迷迷糊糊地叫了陌生女孩的名字，这口气她是无论如何也无法咽下的。</p><p class="story-paragraph dialogue" data-source-key="1653:0">“前几天，”</p><p class="story-paragraph dialogue" data-source-key="1655:0">“我见到你心心念念的‘多绚’了。”</p><p class="story-paragraph" data-source-key="1657:0">志宇开门的手猛地一僵。</p><p class="story-paragraph dialogue" data-source-key="1659:0">“在她学校附近的工地。”</p><p class="story-paragraph" data-source-key="1661:0">允熙饶有趣味地欣赏着志宇瞬间惨白的脸色，变本加厉。</p><p class="story-paragraph dialogue" data-source-key="1663:0">“臭丫头，骨头挺硬的。”</p><p class="story-paragraph dialogue" data-source-key="1665:0">“……你做了什么？”</p><p class="story-paragraph dialogue" data-source-key="1667:0">“没什么，泼了桶水而已，帮她洗洗一身穷酸傲气。”</p><p class="story-paragraph" data-source-key="1669:0">又想起多绚那种全程都不示弱的像小狼崽一样的眼神，允熙勾起唇角。</p><p class="story-paragraph dialogue" data-source-key="1671:0">“不过说真的，你眼光真差。那种死丫头，看着不心烦吗？”</p><p class="story-paragraph dialogue" data-source-key="1673:0">“我告诉她，你对她恶心得想吐，她那个表情啊，你真该看看。”</p><p class="story-paragraph" data-source-key="1675:0">即便是被按着跪在地上，两个膝盖都在粗糙的水泥地上磨破了皮，血流出来和地上的渣滓灰尘混在一起黏在伤口上，也没有变过的直勾勾地瞪着她的眼神，竟然在听到那句她随口瞎编的话时，几乎动摇了。</p><p class="story-paragraph" data-source-key="1677:0">啊……还真是个令人不爽到了极点的死丫头啊。</p><p class="story-paragraph" data-source-key="1679:0">教训多绚带来的亢奋让允熙感觉太阳穴一跳一跳的，还想着要怎么再绘声绘色地说点那天的细节，一抬眼，才发现刚刚还杵在浴室门口的志宇已经不见了踪影。</p><p class="story-paragraph dialogue" data-source-key="1681:0">“妈的……”</p><p class="story-paragraph dialogue" data-source-key="1683:0">“都去死好了。”</p><p class="story-paragraph" data-source-key="1688:0">奔跑从来不是志宇的长项，跑着跑着，肋骨下面钻出一股生硬的刺痛，每吸进一口深夜的冷气，发干的喉咙里就涌起一点细微的铁锈气。为什么强硬地伤害了多绚的身体，在这种需要派上用场的时候反而这样脆弱呢。成为Alpha到底给自己带来了什么，好像没有一件好事，只有令自己都感到恐惧到本能，和捆绑上家族利益的更沉重的期待。</p><p class="story-paragraph" data-source-key="1690:0">无法接受自己在多绚面前失控的样子，无法面对因为自己而破碎、而哭泣的多绚，所以才逃开了，说什么怕伤害多绚啊，其实只是因为自己无法忍受内心的煎熬罢了。真希望什么都没有发生啊，多绚是把心都剖开摊在她眼前的，而自己早已被太多东西捆住了，在父亲和允熙的泥潭里越陷越深的时候，多绚像光一样出现了，或许是唯一的光吧，所以贪婪地想要贴近，又生怕自己这个黑洞会把那点光吞噬殆尽，因为自己是个又不幸、又软弱的东西。</p><p class="story-paragraph" data-source-key="1692:0">可偏偏，偏偏……</p><p class="story-paragraph" data-source-key="1694:0">那孩子，是叫多绚吗？</p><p class="story-paragraph" data-source-key="1696:0">你适可而止吧。</p><p class="story-paragraph" data-source-key="1698:0">朴家才是崔家更上一层楼的梯子。以你这个性子，以后要来官场混，我就得站得更高才行。</p><p class="story-paragraph" data-source-key="1700:0">该死的理智和懦弱竟在那一刻达成和解。因为父亲需要我这样做，因为我需要一个稳定的Omega来度过易感期。所以顺从地走进了那个被安排好的良夜，那样就不用负责了，不用面对了。</p><p class="story-paragraph" data-source-key="1702:0">多绚拉开门时，过道里的感应灯正处于熄灭的边缘，微弱的光勾勒出志宇那张近乎透明的脸，呼吸因情绪过载、体力透支而变得的破碎，胸口起伏着，一只手扶在门框上，另一只手无力地垂在身侧，指尖微微颤抖，好像一副立刻就会倒下去的样子。</p><p class="story-paragraph dialogue" data-source-key="1704:0">“我……没有说过那种话。”</p><p class="story-paragraph" data-source-key="1706:0">除了苍白的辩解，别的什么也给不了。</p><p class="story-paragraph" data-source-key="1708:0">无法解释为什么在多绚最需要陪伴的时候选择了做缩头乌龟，无法解释朴允熙是怎么回事，更无法解释为什么在完成期待与保全自我的博弈中，第一个被舍弃的是多绚。</p><p class="story-paragraph dialogue" data-source-key="1710:0">“我还要再听你说一遍是吗？”</p><p class="story-paragraph dialogue" data-source-key="1712:0">“别搞笑了……”</p><p class="story-paragraph" data-source-key="1714:0">突然消失，突然出现，用那种可怜的样子，觉得只要解释两句，说对不起，这一切就能烟消云散吗。你是疯子吗？还是我是傻子？凭什么？</p><p class="story-paragraph" data-source-key="1716:0">多绚靠在门框上，居高临下地俯视这个很喜欢过的人。这一切不可笑吗，委屈和愤怒在胸腔里急剧膨胀，多想爆发啊，可在对上那双眼睛时，委屈和愤怒随着爆炸消失，炸开的灰烬下沉到心底，变成无话可说。</p><p class="story-paragraph" data-source-key="1718:0">犹豫一秒就会露出破绽，强撑起来的拒绝会在志宇抱上来的一瞬间土崩瓦解，但这不是多绚想要的，想推开，胡乱捶打着，明明想着把这个疯子关在门外就好了，两个人却踉踉跄跄地进了房间。幸好父母都还没回家……可又是在幸好什么？幸好不用向大人解释这是什么局面？还是幸好……这样就可以把人带进房间？</p><p class="story-paragraph" data-source-key="1720:0">房门关上，没有人去开灯，多绚被志宇的力量带着跌坐在床上，膝盖处的伤口隐隐作痛，被泥沙侵染，被污水浸泡过的痛感时刻提醒着她那天的屈辱。明明应该生气的，应该大骂都是因为你这个懦弱的狗东西，才让所有人都不幸，但偏偏心跳得很快。当志宇真的跪在她面前，仰起头，用那双泪水充盈而显得湿漉漉的眼睛望向她时，多绚再一次犹豫了。崔志宇的存在似乎是个无解的难题。</p><p class="story-paragraph dialogue" data-source-key="1722:0">“你闻起来像她。”</p><p class="story-paragraph dialogue" data-source-key="1724:0">“才从她床上下来？”</p><p class="story-paragraph dialogue" data-source-key="1726:0">“不满足？”</p><p class="story-paragraph dialogue" data-source-key="1728:0">“还是跟我做感觉更好？”</p><p class="story-paragraph" data-source-key="1730:0">不是的，不是因为那样……</p><p class="story-paragraph" data-source-key="1732:0">说不出合理解释的志宇，所有逻辑都建立在原始的直觉上，她跪在多绚的腿间，急切且笨拙地探索着。</p><p class="story-paragraph" data-source-key="1734:0">我不觉得恶心。如果那是真的，现在这样狂热的渴求又是什么呢？</p><p class="story-paragraph" data-source-key="1736:0">多绚仰起头，后脑抵在坚硬的墙壁上，根本不想看那样的画面，裙摆被推到小腹，内裤被那双手褪到膝盖，那个曾视为初雪一样一尘不染的脸正埋在自己腿间，那么拼命地讨好她。太可笑了，真是太可笑了，宁愿用这种方式证明自己、祈求原谅，也说不出那句她一直等的话。可她现在不需要了，反正一切都坏掉了不是吗？一切都在这一刻走向了畸形。</p><p class="story-paragraph" data-source-key="1738:0">不是难题，不是救赎，而是毒瘾啊。</p><p class="story-paragraph" data-source-key="1740:0">温热的呼吸和搅动的舌尖带起一波未平一波又起的刺激，多绚望着天花板，连喘息的力气都没有，只有眼底的一片荒芜。高潮的时候也死死咬着嘴唇一声不吭，指尖攥紧了被子也没有去扶志宇的头，小腹紧绷着，但下面的小口却不断涌出热液了。即使心里再怎么抗拒，身体还是代替她，做出了最诚实的反应。</p><p class="story-paragraph" data-source-key="1742:0">志宇在那片温热的潮湿中抬起头，多绚伸出手，指尖划过她沾着湿润的脸颊。</p><p class="story-paragraph dialogue" data-source-key="1744:0">“志宇啊，”</p><p class="story-paragraph dialogue" data-source-key="1746:0">“你也会帮她做这种事吗？”</p><p class="story-paragraph" data-source-key="1748:0">志宇将脸深深地埋进多绚的小腹，摇了摇头。</p><p class="story-paragraph" data-source-key="1755:0">穿着校队的连帽衫，身上总是一股止汗喷雾混合着草坪的味道，连笑起来的弧度都像是帅哥工业流水线上生产出来的Liam，第无数次不死心地在放学时跟上多绚。</p><p class="story-paragraph" data-source-key="1757:0">&quot;Hey, wanna grab some boba? My treat!&quot;</p><p class="story-paragraph" data-source-key="1759:0">&quot;Don&#x27;t you have practice?&quot;</p><p class="story-paragraph" data-source-key="1761:0">&quot;No practice today. Coach had to head out for some league meeting. So…”</p><p class="story-paragraph" data-source-key="1763:0">少年咧嘴一笑，露出整齐洁白的牙齿。看起来总是这么开心，好像真的没有任何烦恼，天大的事也不过就是训练时被教练吼两句，或许还有被她拒绝了不知道多少次吧。似乎没有任何阴影，完全暴露在阳光下的样子，第一次让她的心情有了变化，对方身上这种以前她完全不在意的透明的单纯，竟产生了莫名的吸引力。</p><p class="story-paragraph dialogue" data-source-key="1765:0">“Okay then.”</p><p class="story-paragraph dialogue" data-source-key="1767:0">“Wait, really? Awesome!” 男孩兴奋得几乎要原地蹦起来。</p><p class="story-paragraph" data-source-key="1769:0">自从那晚之后，生活似乎裂成了两半。总有一些夜晚是志宇的，不是多么浪漫的关系，冒着再被那个占有欲极强的允熙找麻烦的风险，也要拥抱被情欲烧昏头的志宇，明明没有信息素的安慰，只是因为这是一段彻底腐坏了的关系。</p><p class="story-paragraph" data-source-key="1771:0">汗湿的身体，潮湿的床单，破碎的呻吟，与其说是做爱，或许说是陷在绝望里的两个人拼命通过彼此的体温来确认自己的存在更恰当。还有志宇抱着她时，那双偏执得让她不敢逃开的眼睛，就像毒瘾发作一样，痛苦也只能选择渴望。崔志宇是拉着她一起坠落的重力。</p><p class="story-paragraph" data-source-key="1773:0">所以从Liam这样的男孩子身上找点正常人的感觉，也不是多坏的事吧。和他走在一起，多绚感觉自己又是一个寻常十六岁高中生了。</p><p class="story-paragraph" data-source-key="1775:0">奶茶店门口那块色彩明亮的招牌闪烁着，空气里弥漫着甜腻的黑糖味。</p><p class="story-paragraph" data-source-key="1777:0">Liam眉飞色舞地说着。</p><p class="story-paragraph dialogue" data-source-key="1779:0">“This silver sedan almost clipped me at the intersection. The guy speeded through the red light like he was in Fast and Furious or something…”</p><p class="story-paragraph" data-source-key="1781:0">多绚原本正咬着吸管，低头盯着地砖缝里的影子发呆。奶茶很甜，早知道要不另外加糖的了，明明是喜欢吃甜食的人，从什么时候开始觉得太甜的东西反而不适合了呢。</p><p class="story-paragraph" data-source-key="1783:0">本来也没在听的，可那超低级的语法错误完全令人无法忽视，像一根顽皮的羽毛扫过她紧绷的神经。</p><p class="story-paragraph" data-source-key="1785:0">&quot;Sped.&quot;</p><p class="story-paragraph" data-source-key="1787:0">多绚下意识开口，声音里有一丝自己都没察觉的轻快。</p><p class="story-paragraph" data-source-key="1789:0">&quot;Huh?&quot; Liam愣住了，举在半空比划超速的手势尴尬地僵在原位，眨巴着那双蓝色的大眼睛看向她。</p><p class="story-paragraph" data-source-key="1791:0">&quot;The past tense. Liam. Not &#x27;speeded&#x27;.&quot;</p><p class="story-paragraph" data-source-key="1793:0">多绚抬起头，看到对方揉着后脑勺傻笑，心里有什么微妙的感觉，好像变轻了，如果放在以前绝对不会有的感觉，绝对会想这怕不是个傻子吧，但这一秒，好像自己那被白天黑夜、清白羞耻生生分裂成两半的生活，竟然因为这个很蠢的错误，被奇妙地缝合了一点点。</p><p class="story-paragraph dialogue" data-source-key="1795:0">“呵……”</p><p class="story-paragraph" data-source-key="1797:0">很轻的笑声就那样从唇缝间溢了出来。多久没有这样轻松地笑出来过了呢，虽然很短促，却像在阳光下重新活过来了一点。</p><p class="story-paragraph" data-source-key="1799:0">&quot;Oh, right, right!&quot;</p><p class="story-paragraph" data-source-key="1801:0">Liam看着多绚的笑容，也跟着嘿嘿傻笑起来。</p><p class="story-paragraph" data-source-key="1803:0">&quot;See? That&#x27;s why we should hang out more. You&#x27;re like a walking dictionary, but way prettier.”</p><p class="story-paragraph" data-source-key="1805:0">多绚垂下眼睫，视线在那块印着可爱图案的奶茶店地毯上停留了两秒。她没有接话，只是轻轻抿了一下唇。原来自己还是可以被当做一个正常女孩来欣赏的吗？可惜这种欣赏是源于Liam的无知。他不知道她经历过的不堪，不知道她膝盖上还未全消的伤痕的来源，不知道此刻她校服裙摆下还残存着另一个女人的体温。</p><p class="story-paragraph" data-source-key="1807:0">如果知道……知道我是个什么样的人，陷在什么样的泥沼里，还会这样对我吗？那双会笑的蓝眼睛还会为我停留吗？</p><p class="story-paragraph" data-source-key="1809:0">啊……好不容易缝合起来一丁点的裂痕，好像又扩大了。</p><p class="story-paragraph" data-source-key="1811:0">和Liam在路口分开。初冬的街道有些冷，多绚低头拢了拢围巾。</p><p class="story-paragraph" data-source-key="1813:0">志宇站在转角，在多绚走过时拽住了她的手腕，吓得她一声惊叫，看清了那张比身后的墙皮还要苍白的脸之后，多绚松了一口气，压抑了许久的酸涩却翻涌上来，眼中却浮上几分疲惫。</p><p class="story-paragraph" data-source-key="1815:0">已经在这儿等了很久的志宇，刚才就看着多绚和那个高壮的男生有说有笑，看着多绚对他露出那种毫不设防的笑容。在短短几个月前，那样的笑容她也还能常见到，只是因为自己出现，多绚就会展露的小猫一样温软的笑颜，而现在，即使见面，也不会再在那张脸上看到那些轻松的神情了。</p><p class="story-paragraph" data-source-key="1817:0">好像……被偷走了只属于自己的东西，让她感到了前所未有的威胁。整个人被不安的情绪笼罩，比气温更低的寒意从志宇的指尖蔓延开。</p><p class="story-paragraph dialogue" data-source-key="1819:0">“多绚……”</p><p class="story-paragraph dialogue" data-source-key="1821:0">“那个人是谁？”</p><p class="story-paragraph" data-source-key="1823:0">荒谬至极，怎么有脸问这种问题？你在另一个女人床上的时候，把我丢在精神废墟里不闻不问的时候，我问过什么，管过什么，现在却跑来质问我的合理社交。既然只是易感期才来找我上床的关系，就不要操心这么多。</p><p class="story-paragraph dialogue" data-source-key="1825:0">“和你没关系。”</p><p class="story-paragraph" data-source-key="1827:0">多绚试图甩开手，志宇却不肯松开，拉拉拽拽之间，她看见了多绚藏在围巾下的、后颈上的抑制贴。</p><p class="story-paragraph dialogue" data-source-key="1829:0">“……你分化了？”</p><p class="story-paragraph dialogue" data-source-key="1831:0">“为什么不告诉我……？”</p><p class="story-paragraph dialogue" data-source-key="1833:0">“你让他碰你了……他标记你了吗？”</p><p class="story-paragraph" data-source-key="1835:0">颤抖着声音质问。这卑劣到了极点的样子，连自己都觉得可笑，明明先有了别人，却像个贪心的疯子，还要干涉多绚的自由。可多绚还是唯一的光，是在这世界上的最后一根救命稻草，如果连多绚也被别人抢走了，就真的要溺死在那个死气沉沉的泥潭里了。</p><p class="story-paragraph dialogue" data-source-key="1837:0">“你想听什么？”</p><p class="story-paragraph" data-source-key="1839:0">告诉她什么？告诉她那份连主治医生都啧啧称奇的检测报告吗？报告上冰冷地写着：腺体发育期受高浓度Alpha信息素强行介入，呈同化性改变。从那一刻起，多绚比谁都清楚，自己身上这股带着奶气的木头味，根本不是随机的，更不是什么巧合，而是崔志宇留下的诅咒。</p><p class="story-paragraph" data-source-key="1841:0">真是要疯了。因为这个软弱的混蛋……这个混蛋在还没懂得怎么爱她之前，就已经用那种蛮横的方式，在她的身体里留下了自己的印章，而她的身体，也在还没学会如何成为自己之前，就先适应了如何契合这个一次又一次伤害她的人。</p><p class="story-paragraph" data-source-key="1843:0">多绚眼里的光一点点熄灭，当着志宇的面，扯掉围巾，撕下抑制贴。</p><p class="story-paragraph dialogue" data-source-key="1845:0">“崔志宇，你凭什么问我这个？你有什么资格问……”</p><p class="story-paragraph" data-source-key="1847:0">难道要她承认，自己这辈子所有情欲和本能，都永远被困在了那个湿冷而疯狂的雨夜。</p><p class="story-paragraph dialogue" data-source-key="1849:0">“多绚……对不起……”</p><p class="story-paragraph" data-source-key="1851:0">志宇的脸血色尽失，清澈的眼睛里第一次露出了小狗感知到自己即将被抛弃般的恐慌。她死死扣住多绚的肩膀，额头抵在多绚的颈窝里。</p><p class="story-paragraph dialogue" data-source-key="1853:0">“多绚，别让他碰你……任何人都……求你。”</p><p class="story-paragraph dialogue" data-source-key="1855:0">“我受不了……我一想到他看你的眼神，我就要疯了。”</p><p class="story-paragraph dialogue" data-source-key="1857:0">“我会去跟父亲说的……我会处理好的……”</p><p class="story-paragraph dialogue" data-source-key="1859:0">“求你再等等我……”</p><p class="story-paragraph" data-source-key="1861:0">你凭什么摆出这副快要死掉的样子，求我不要抛弃你？如果早知道事情会变成这样，当初就不该靠近的，我们都被毁了，被毒瘾一样扭曲的爱绑架，一起坠入深渊，直到化成灰然后混在一起。</p><p class="story-paragraph" data-source-key="1863:0">多绚想推开她，可当志宇身上熟悉的气息笼罩过来时，感觉每一个细胞都在那气息的安抚下变得服帖了，才发现已经融进血肉的、天生被吸引的本能，依然在为这个混蛋心碎。</p></div>

      <article class="chapter" data-chapter="section-07">
        <header class="chapter-header"><span class="chapter-number">07</span><h2>Chapter 7</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="1866:0">多绚没回家的第三天，首尔在一场下透的雨后迎来了大降温。</p><p class="story-paragraph" data-source-key="1868:0">志宇站在客厅巨大的落地窗前，玻璃倒映出她苍白的脸，感受到巨大的空虚。雨水在外侧的玻璃上被大风吹得几乎呈横向流动，但她却不感觉冷，只是隐约的燥热，血管里像有细小的火星在攒动，那种熟悉的、令人坐立不安的躁动……偏偏是在这种空虚的时候。</p><p class="story-paragraph" data-source-key="1870:0">好像没有多少抑制剂储备了吧，多绚总嫌她易感期太频繁，心情好就释放点信息素随便糊弄一下，连糊弄都没心情的时候就叫她自己打抑制剂。所以这次志宇也只是轻驾就熟地拉开抽屉，取出一支抑制剂刺入手臂皮肤。针尖没入皮肤的瞬间，面无表情，连睫毛都没有颤动一下，盯着注射器上刻度的眼神也像一潭泛不起涟漪的死水。</p><p class="story-paragraph" data-source-key="1872:0">这样勉强熬到第五天，抽屉空了。</p><p class="story-paragraph" data-source-key="1874:0">药效消退后，顶层公寓比任何时候都更像一座透明的牢笼。没有手机，没有可以求助的访客，甚至连通往外界的门都设置了定向警报。</p><p class="story-paragraph" data-source-key="1876:0">志宇曾试图打开那扇通向露台的门，渴望呼吸到一点外面干燥的冷空气，但门一打开，急促且尖锐的警报声就骤然大作，刺耳的动静惊得她立刻把门拉回来关上。只是一条被豢养的、失去人身自由的狗而已，就连这具身体上的痛苦，也是属于多绚的资产，既然主人不在，就只能干熬下去。</p><p class="story-paragraph" data-source-key="1878:0">但易感期如同不可违抗的潮汐，失去药物压制后彻底失控。Alpha的本能在她瘦弱的躯体里横冲直撞，那股本该充满生机的、湿润森林的气息，也因为缺乏安抚而散发出苦涩的腐败感。志宇只觉得皮肤下仿佛有无数蚁虫在啃噬骨髓，每一根神经都在痉挛着叫嚣。</p><p class="story-paragraph" data-source-key="1880:0">自己竟这样离不开多绚。</p><p class="story-paragraph" data-source-key="1882:0">多绚一度抗拒的那个气息，却正是她最迫切的渴望。超越了生理欲望的平复，更是唯一能证明她与这个世界、与多绚之间，还存在某种血肉连接的证物。多绚的香气是一把干燥的火，能烧干深藏在她骨缝里的阴冷潮湿的罪恶感，哪怕只有一点也好，哪怕只有一点，只要是多绚给的，就算是致命毒素，身体也会当成救命解药一样毫无保留地吸收。</p><p class="story-paragraph" data-source-key="1884:0">她撑起身体，摇晃着走进浴室，拧开冷水。冰凉的水倾泻而下，志宇没有脱掉衣服，穿着单薄的黑色衬衫和长裤跌坐在花洒下。</p><p class="story-paragraph" data-source-key="1886:0">多绚明明不在。</p><p class="story-paragraph" data-source-key="1888:0">这种虐待一样的冷水澡，是多绚会对她做的事，美其名曰帮她降降温，实则欣赏她在寒冷与情欲双重夹击下，颤抖着身体，像落水狗一般狼狈又色情的模样。</p><p class="story-paragraph" data-source-key="1890:0">已经没有余力思考，为什么在本该寻求自救的时刻，选择了这种惩罚意味的处理方式。</p><p class="story-paragraph" data-source-key="1892:0">因为这是多绚会做的事，所以就做了。即便是痛苦，却是她唯一能抓住的有关多绚的投影。</p><p class="story-paragraph" data-source-key="1894:0">仿佛只要忍受同样的寒冷，就能假装那个居高临下冷眼旁观的人从未离开，好像下一秒就会又听到那个满含笑意却又丝毫不顾她死活的声音在浴室里回荡。</p><p class="story-paragraph dialogue" data-source-key="1896:0">“乖一点，我不喜欢发烫的东西，等你降温了，我再考虑要不要抱你。”</p><p class="story-paragraph" data-source-key="1898:0">湿透的布料变成了第二层皮肤，冰凉地紧紧束缚在身体上，湿漉漉地勾勒出单薄的肩头和脊椎骨节突起的轮廓。这种却温差没能抵消身体深处的燥热，反而像在烧得滚烫的铁块上浇了一瓢冷水，激出一团滚烫的蒸汽。</p><p class="story-paragraph" data-source-key="1900:0">脖颈白皙的皮肤在冷水的刺激下呈现出病态的红，纤细的指节死死掐在大腿上，指甲因为过度用力而发白。</p><p class="story-paragraph dialogue" data-source-key="1902:0">“嗯……”</p><p class="story-paragraph" data-source-key="1904:0">她低着头，任由水流冲刷着胀痛不已的后颈，水珠顺着脸颊和高挺的鼻梁滑入紧抿的唇缝，又随着破碎的呻吟流出来。</p><p class="story-paragraph" data-source-key="1906:0">因为寒冷，身体在不受控制地颤抖，又因为情欲，身体各处的肌肉都紧绷到了极限。</p><p class="story-paragraph" data-source-key="1908:0">已经变冷了，可以……抱我吗？</p><p class="story-paragraph" data-source-key="1910:0">湿透的裤子紧紧贴在腿间，每一次细微的挪动都引起布料摩擦，带起一阵粗糙的刺激。志宇瘫坐在瓷砖地上，双腿狼狈地分开。闭上眼，脑海中浮现出多绚的手，渴望那只手能顺着她湿透的腰线探下去，带着不耐烦的狠戾，用力扯开这层令人窒息的湿布。</p><p class="story-paragraph" data-source-key="1912:0">同时抬起被冷水冲得通红的右手，自己覆上腿间滚烫肿胀的器官上，幻想的画面里，此刻多绚就在眼前，用那种看垃圾一样的眼神俯视着她，然后伸出那只微凉但柔软的手，毫无怜悯地摸索进来。</p><p class="story-paragraph" data-source-key="1914:0">志宇死死握住了自己。</p><p class="story-paragraph dialogue" data-source-key="1916:0">“哈啊……多绚……”</p><p class="story-paragraph dialogue" data-source-key="1918:0">“求你……”</p><p class="story-paragraph" data-source-key="1920:0">喉咙里溢出断断续续的呼唤，带上了哭腔。顺着幻想中多绚那种略显粗暴的节奏，用力地上下撸动、揉捏。那种灼烧感，把她最后一点理智都煮沸了。虎口收紧，在那根已经充血到极限的茎身上蛮横地动作。每一次指节划过顶端那处已经泥泞不堪的敏感时，都带起一阵火烧般的电流，从脊椎最下面一节直冲大脑。</p><p class="story-paragraph" data-source-key="1922:0">想象着多绚用指甲恶意地刮弄前端溢出的液体，充满凌辱感的幻想像中毒一样叫人上瘾，在多绚面前，什么Alpha的骄傲，不值一提，她甚至总是渴望多绚能更用力一点，越是粗暴的对待，越是被需要的证明。</p><p class="story-paragraph" data-source-key="1924:0">纤细的腰肢失控地向上抬起，就在快感即将决堤的一刻，湿冷的空气中仿佛真的浮现出那股干燥的木头香气。</p><p class="story-paragraph dialogue" data-source-key="1926:0">“哈……”</p><p class="story-paragraph dialogue" data-source-key="1928:0">“多绚……”</p><p class="story-paragraph" data-source-key="1930:0">身体在冰冷的淋浴间里剧烈地弓起、痉挛，欲望在掌心里崩塌，灼热的浓稠液体喷溅在冰冷的瓷砖上，有几滴落在不断起伏的腹部，迅速被飞溅的水花冲散。</p><p class="story-paragraph" data-source-key="1932:0">浑身力气都卸掉，无力的手地垂在大腿边，指缝里还残留着未被冲净的粘稠，在冷水的冲刷下显得一片狼藉，水声嘈杂依旧，而志宇只是像个被玩坏的玩偶，低垂着头，放任自己更深地沉入并不幸福的余韵里。</p><p class="story-paragraph" data-source-key="1936:0">冷水带走了一时的燥热，却也带来了彻骨的寒颤。</p><p class="story-paragraph" data-source-key="1938:0">这天半夜，志宇开始发烧。当她迷迷糊糊醒来，视线变得扭曲重叠，只觉得头重脚轻、天旋地转，趁着还没有彻底晕过去，努力起身，虚弱地撞进多绚的卧室，胡乱扒掉身上湿透的衣服，一头栽倒在留有多绚的香气的大床上。</p><p class="story-paragraph" data-source-key="1940:0">在这个漫长得好像没有尽头的周期里，比生理上的折磨更让人绝望的，是不知道多绚去了哪里，是去处理生意，还是在某处拥抱别人？</p><p class="story-paragraph" data-source-key="1942:0">那天在车里的吻似乎暗示了什么，但却又好像什么也不是，果然多绚也后悔了吧。不过是被酒精和昔日情敌双重夹击，一时冲动的行为罢了，自己反而自作多情地以为她们之间真的还有什么。</p><p class="story-paragraph" data-source-key="1944:0">真是太敢想了，太厚颜无耻了，横在她们之间的深渊是多少嫉妒和情欲都填不满的。</p><p class="story-paragraph" data-source-key="1946:0">志宇曾无数次站在在深渊的边缘向下望去，雾气散开，似有万丈深的底部沉着的是一潭暗红的血，血腥气翻涌着升上来，让志宇感到毛骨悚然。</p><p class="story-paragraph" data-source-key="1948:0">永远无法忘记的那个夜晚，红蓝交替的警灯在巷子里闪烁，把周围雪白的墙壁也映成象征着危险的颜色，救护车和警车几乎堵住了半边路。警笛声和救护车的声音混杂在一起，震得她耳膜生疼。</p><p class="story-paragraph" data-source-key="1950:0">她什么也顾不上，是从家里直接跑过来的，没有拿外套，没有叫司机，穿着单薄的衣服在冬夜里跌跌撞撞地跑向那个她熟悉的地址。志宇喘着粗气，顾不上礼貌，伸手兀自拨开那些伸着脖子，低声议论的邻居们。</p><p class="story-paragraph dialogue" data-source-key="1952:0">“几楼的啊？”</p><p class="story-paragraph dialogue" data-source-key="1954:0">“不清楚呢，我刚回来。”</p><p class="story-paragraph dialogue" data-source-key="1956:0">“警察都来了啊。”</p><p class="story-paragraph" data-source-key="1958:0">闲言碎语像苍蝇一样在她的耳边飞舞，志宇顾不上那些，钻进人群后她停下脚步，呼吸急促而杂乱，她很快就看到了多绚。就站在那些进进出出的警察和医护人员人影中，脸色像纸一样惨白，还穿着校服。明明是寒冷的夜晚，几缕长发却似乎被冷汗打湿，贴在颊侧。</p><p class="story-paragraph" data-source-key="1960:0">她没有哭，也没有闹，只是那样僵硬地站着，眼神是死的，死死盯着被几个穿着制服的人抬出来的覆盖着一层白布的担架。白布边缘垂落下一只枯黄的男人的手，随着抬担架的人们的脚步，在空气中僵硬地晃动。</p><p class="story-paragraph" data-source-key="1962:0">志宇被吓得钉在原地不敢动，她哪里见过这种阵仗，因为跑来的体力透支和惊吓，手在发抖，掌心里也全是汗，她可又必须过去，因为多绚站在那里，是一个人。</p><p class="story-paragraph" data-source-key="1964:0">于是艰难地迈动脚步跑过去，志宇伸手抓住多绚的肩膀，声音哽咽。</p><p class="story-paragraph dialogue" data-source-key="1966:0">“……没事吧？给你打电话你怎么不接？”</p><p class="story-paragraph dialogue" data-source-key="1968:0">“发生什么事了……？”</p><p class="story-paragraph" data-source-key="1970:0">然而多绚只是目光木然地继续追踪着那个被抬上救护车的担架。</p><p class="story-paragraph dialogue" data-source-key="1972:0">“爸爸……”</p><p class="story-paragraph" data-source-key="1974:0">志宇想伸出手抚平多绚脸上几乎石化的麻木，但听到多绚的声音，手僵在了半空中。</p><p class="story-paragraph" data-source-key="1976:0">多绚僵硬地转过头，视线在看到志宇的瞬间稍微亮起了一点光亮。</p><p class="story-paragraph" data-source-key="1978:0">然而，下一秒，多绚身后背对着她们站立的警察合上了笔记本，对身边的同僚低声说：“现场没有他杀痕迹，绳索负重痕迹也吻合，是自杀。”</p><p class="story-paragraph dialogue" data-source-key="1980:0">“应该是最近那个受贿的案子，证据链很完整。”</p><p class="story-paragraph" data-source-key="1982:0">一瞬间，志宇的手猛地脱力，从多绚肩上滑落。她看着多绚，只觉得眼前这张熟悉的脸骤然变成了一场灭顶的灾难，而她们之间那条她正要试图修补的裂痕，正在以迅雷不及掩耳之势扩大、变深，如脚下坚实的大地开裂一般，顷刻间吞噬了她们之间拥有过的一切，以及那个她说好会去处理，还没来得及开口的……未来。</p><p class="story-paragraph" data-source-key="1984:0">她想起那个光线昏暗得不自然的午后，想起父亲紧缩的眉头，对她越发冷淡的眼神，以及问她和金家女儿断干净没有那令人浑身不自在的刺探。</p><p class="story-paragraph" data-source-key="1986:0">父亲书房里的阴影似乎是黑暗降临的预兆。志宇站在那条寂静的走廊里，隔着门听到了房间里父亲压低讲话的声音。中年男人低沉的话音并不真切，也不清晰，但那些破碎的词语……证据，毁掉，不能留下隐患……像冰冷粘稠的液体从书房的门与地板的缝隙中渗出来，从她的脚跟一路爬上脊椎。她不知道事情的全貌，不知道房间里书桌上厚重的信封里装的，足以送一个无辜的替罪羊进监狱的伪证。</p><p class="story-paragraph" data-source-key="1988:0">她什么都不知道，她只是感到了风雨欲来前的死寂。</p><p class="story-paragraph" data-source-key="1990:0">那是志宇第一次意识到，权力和贪欲是一柄随时会落下的铡刀，那么这把刀会落到谁的头上？她突然很恐慌。</p><p class="story-paragraph" data-source-key="1992:0">冲进房间拨打了多绚家的座机，无人接听，又打多绚的手机，漫长的盲音伴随着电流声，一下一下刺激着她的耳膜。</p><p class="story-paragraph" data-source-key="1994:0">不安在沉默中被无限放大，最后变成生理性的干呕。</p><p class="story-paragraph" data-source-key="1996:0">所以她夺门而出，跑来了。</p><p class="story-paragraph" data-source-key="1998:0">可她跑来干什么？</p><p class="story-paragraph" data-source-key="2000:0">警察的话隔着皮肉砸烂了志宇的肋骨，砸断了她的脊椎。</p><p class="story-paragraph" data-source-key="2002:0">被抬进救护车里的、盖着白布的、那只枯黄的手的主人，不是别人，正是被她的父亲亲手推入深渊的替罪羊，那个会对她露出温和微笑的金叔叔，多绚的父亲。</p><p class="story-paragraph" data-source-key="2004:0">而她怎么还能出现在这里？</p><p class="story-paragraph" data-source-key="2006:0">身上流淌的，是杀人犯的血。</p><p class="story-paragraph" data-source-key="2008:0">那个男人不惜一切往上爬，不惜把可靠的学弟推出去当替罪羊，把人逼上绝路自杀，是为了他保住自己的仕途，也是为了站到更高的位置，好为她这个没用的后人铺路。</p><p class="story-paragraph" data-source-key="2010:0">所以，她的血也是污浊的，灵魂也背负上害得多绚家破人亡的罪责。</p><p class="story-paragraph" data-source-key="2012:0">几个月前，她尚且是一个清白的人，至少那时候还有过喜欢多绚的资格，可现在，一步错，步步错，她变成了一个强奸了多绚感官、改写了多绚本能、又欠下对方一条至亲人命的渣滓。</p><p class="story-paragraph" data-source-key="2014:0">怎么还有脸站在多绚面前。志宇感觉自己是站在多绚父亲的血泊里，血水像硫酸一样腐蚀她的皮肉和骨头。</p><p class="story-paragraph dialogue" data-source-key="2016:0">“志宇……”</p><p class="story-paragraph" data-source-key="2018:0">多绚这才终于从巨大的震恸中回过神来，察觉到了一丝活人的气息，在志宇死一样的目光中，多绚的神情开始松动，开始显露出无助和不安了。</p><p class="story-paragraph" data-source-key="2020:0">而此刻，志宇只想逃走。</p><p class="story-paragraph" data-source-key="2022:0">可她刚后退一步，就被多绚死死抓住了手腕。多绚的力气大得惊人，像把这一刻活下去的希望全都寄托在志宇身上，连指甲都深深陷进她手腕细嫩的皮肤，望向她的眼里，满是支离破碎的请求。</p><p class="story-paragraph dialogue" data-source-key="2024:0">“别走……志宇，求你别走……”</p><p class="story-paragraph dialogue" data-source-key="2026:0">“陪陪我……”</p><p class="story-paragraph dialogue" data-source-key="2028:0">“我……很害怕……”</p><p class="story-paragraph" data-source-key="2030:0">那是她这辈子听过最卑微的祈求。</p><p class="story-paragraph" data-source-key="2032:0">可每在多绚眼前待一秒，巨大的背叛感就加倍地折磨她。受不了多绚这种毫无防备的渴求，这种时候被对方需要只是天大的讽刺，只会让她觉得自己卑鄙到了极点。</p><p class="story-paragraph" data-source-key="2034:0">志宇不敢再看那双写满依赖和剧痛的眼睛，那更像两个巨大的黑洞，随时要把她这满身的罪孽看穿，一想到多绚总会知道的，会知道是谁害死了她的爸爸，志宇就感觉浑身的血都被冰冻了。</p><p class="story-paragraph" data-source-key="2036:0">极度的恐惧覆盖了一切。</p><p class="story-paragraph" data-source-key="2038:0">不能留下。</p><p class="story-paragraph dialogue" data-source-key="2040:0">“不……不行……”</p><p class="story-paragraph" data-source-key="2042:0">以为自己在说话，可从志宇喉咙里挤出来的，只是毫无意义的杂音。</p><p class="story-paragraph" data-source-key="2044:0">她盯着两人交叠的手，多绚还死死抓着她的左手腕，五根手指像冰冷的铁箍，死死嵌进她的肉里，志宇却觉得那地方烫得冒烟，冰冷的触感像烧红的炭火一样灼烧，像在承受一种酷刑，让她无法再多忍受一秒。</p><p class="story-paragraph" data-source-key="2046:0">在多绚祈求的目光中，她用尽全身力气狠命甩开了多绚的手，明明是自己要逃，却显得像甩掉一条黏在手臂上的蛇。以至于多绚被这股蛮力带得身子向后一踉跄，脊背重重撞在警车门上，发出一声闷响。</p><p class="story-paragraph" data-source-key="2048:0">而志宇没有回头，哪怕只是回头看一眼，确认多绚有没有事，她都没有。只是转过身，一头扎进那群已经开始逐渐散去、事不关己的人堆里，夺路而逃。</p><p class="story-paragraph" data-source-key="2050:0">身后是响彻天际的警笛声的轰鸣，好像还有多绚越来越微弱的呼喊声，还有那些永远洗不干净的、嘈杂的窃窃私语。</p><p class="story-paragraph" data-source-key="2052:0">志宇比跑来时更拼命地逃离，直到那些声音全部变成了耳旁呼啸的风。</p><p class="story-paragraph" data-source-key="2057:0">志宇猛地缩了一下脖子，从这场纠缠了她十年的恐惧中回过神，迟钝地睁开眼，视线里没有红蓝的光，只有一片黑暗，身体上的痛苦是真实的。</p><p class="story-paragraph" data-source-key="2059:0">怕这种日子永远不会结束，更怕什么时候真的会结束，在半梦半醒的边缘，志宇甚至分不清哪一个才更残忍。已经好多天没有回来过的多绚，是不是终于厌倦了这场报复，觉得折磨她也无趣了，打算就这样悄无声息地将她遗弃在这个牢笼里，留她像一棵无人浇灌的植物，自行枯萎腐烂。</p><p class="story-paragraph" data-source-key="2061:0">混乱的意识开始涣散。</p><p class="story-paragraph" data-source-key="2063:0">铅灰色的海面一片死气沉沉，没有浪花，只有粘稠厚重的水体在迟钝地起伏，撞击到船体上发出阵阵令人胆寒的撞击声，每响一次，都敲在志宇脆弱的神经上。</p><p class="story-paragraph" data-source-key="2065:0">志宇坐在这艘窄小的木船里，多绚就在她对面，手里握着船桨，缓慢地划动黑色的水面。</p><p class="story-paragraph" data-source-key="2067:0">明知这是梦，志宇却害怕极了。</p><p class="story-paragraph" data-source-key="2069:0">我们这是要去哪里？</p><p class="story-paragraph" data-source-key="2071:0">想问话却发不出声音，在这个只有黑水的世界似乎只有自己被抽了真空，她望向多绚平静的脸，那种毛骨悚然的水声逐渐淡去，变成令人耳鸣的寂静，厚得像一堵墙，压迫着鼓膜。渐渐地，志宇只能听到自己的心脏在胸腔里垂死挣扎的搏动声。</p><p class="story-paragraph" data-source-key="2073:0">多绚伸出手，指腹带着干燥的木头香气，轻轻摩挲志宇汗湿的鬓角。</p><p class="story-paragraph dialogue" data-source-key="2075:0">“累了吗？”</p><p class="story-paragraph" data-source-key="2077:0">多绚问，没有情绪，声音也轻得像一缕掠过水面的死风。</p><p class="story-paragraph" data-source-key="2079:0">志宇顺从地跪过去，把头靠在多绚的膝头。只要多绚还愿意这样碰她，就算整个人已经在深渊里烂成一堆破碎的纤维，也还不算太糟。</p><p class="story-paragraph" data-source-key="2081:0">这样想着，船却忽然停在了一块礁石旁。极小的一块礁石，色泽深黑，像水面上一块隆起的腐肉。</p><p class="story-paragraph" data-source-key="2083:0">奇怪，明明刚才都没有看见的……</p><p class="story-paragraph dialogue" data-source-key="2085:0">“志宇啊，去那里坐着吧。”</p><p class="story-paragraph" data-source-key="2087:0">既然是多绚这样说了，志宇听话地起身，细瘦的手臂撑着晃晃悠悠的小船边缘，有些艰难地爬了上去。</p><p class="story-paragraph" data-source-key="2089:0">礁石表面冷得刺骨，踩上去的一瞬间，细小湿滑的青苔就像无数只冰凉的小手，突然长长，攀附上她的脚踝。潮湿而冰冷的触感，好像要把她永远拴在这块礁石上，吓得她立刻转过身去抓住多绚的手，可一转身，才发现小船已无声无息地荡开了。</p><p class="story-paragraph" data-source-key="2091:0">多绚依旧坐在船尾，平静地望着她，虚幻的声音从远处飘来。</p><p class="story-paragraph dialogue" data-source-key="2093:0">“你在这里等。”</p><p class="story-paragraph dialogue" data-source-key="2095:0">“等潮水涨上来，就清净了。”</p><p class="story-paragraph" data-source-key="2097:0">志宇愣在原地，本不该有风的水平却刮来一阵风，把她的短发吹乱。她看着多绚划着船桨离自己越来越远。</p><p class="story-paragraph" data-source-key="2099:0">你要去哪里？要丢下我了吗？</p><p class="story-paragraph" data-source-key="2101:0">却还是发不出声音，只是徒劳地张了张嘴。</p><p class="story-paragraph" data-source-key="2103:0">海水却开始上涨了。水体缓缓没过礁石，发出某种巨大的异常生物在黑暗中吞咽的动静，咕哝、咕哝，仿佛这水是有生命的。</p><p class="story-paragraph" data-source-key="2105:0">起初黏腻的液体只是没过了志宇的脚背，寒意直往骨头里钻。她甚至犹豫过一下要不要跳进这一片深不见底的黑色海里，追上那艘船，可只是惊恐地发现身体重得像一块生铁，水下的未知也令她恐惧、退缩。她失去了游动的本能，只能像一棵扎根在礁石上的枯草，眼睁睁看着铅灰色的液体一点一点吞噬她的小腿、膝盖，直到胸腔。</p><p class="story-paragraph" data-source-key="2107:0">多绚的船远去的速度极快，却没有半点水声，随着船身的起伏，迅速在志宇本就不算清晰的视野里缩小成一个遥不可及的点。</p><p class="story-paragraph" data-source-key="2109:0">多绚……</p><p class="story-paragraph" data-source-key="2111:0">多绚！</p><p class="story-paragraph" data-source-key="2113:0">想要大喊，干涩的喉咙里却只发出不完整的音节。</p><p class="story-paragraph" data-source-key="2115:0">水下巨大的压迫感几乎要挤碎她的肋骨，她拼命仰着头伸长了脖子大口大口地呼吸，可最后一点氧气也终于被粘稠的死水挤走。</p><p class="story-paragraph" data-source-key="2117:0">她最后一次望向多绚离去的方向，小船载着多绚，已经消失在了海平线的尽头。没有告别，没有迟疑，只将她一个人留在这块注定会被淹没的孤岛上等待死亡。</p><p class="story-paragraph" data-source-key="2119:0">粘稠、冰冷的黑水争先恐后地涌进她的口鼻，填满她卑微的渴求。</p><p class="story-paragraph" data-source-key="2123:0">志宇在这一瞬间惊醒来，被抛弃的恐惧席卷了全身，她太冷了，又太热了，她需要多绚，哪怕只是幻觉。恍惚间，迷离的视线扫过床另一边放着的一条多绚的睡裙。那是多绚上次出门前换下，随手留在床上的。</p><p class="story-paragraph" data-source-key="2125:0">冰凉的织物触碰到指尖的刹那，志宇发出一声细微的叹息。过了这么几天时间，上面一点点残留的香气的已经很淡了，但那是独属于多绚的味道。</p><p class="story-paragraph" data-source-key="2127:0">志宇将那件真丝睡裙紧紧贴在脸上，把鼻尖埋进柔软的织物里，似乎贴近的不单单是一条睡裙，而是多绚的身体。布料很快被顺着她短发滴下来的水珠和她身上的汗水打湿，在她充满眷恋的揉搓下产生了几道褶皱。</p><p class="story-paragraph dialogue" data-source-key="2129:0">“多绚……多绚……”</p><p class="story-paragraph" data-source-key="2131:0">一遍又一遍地低声呢喃着。</p><p class="story-paragraph" data-source-key="2133:0">早该如此坦诚的。</p><p class="story-paragraph" data-source-key="2135:0">早该承认，剥掉不得不赎罪的愧疚，和所谓的爱……自己不过是这世上最离不开多绚的寄生虫。过去要靠把那缕光也拖进自己的黑暗才能活下去，如今也一样，或许自己撑过这些年都没去死，就是因为，现在承受多绚的折磨才是生存的唯一意义。</p><p class="story-paragraph" data-source-key="2137:0">脑海里那些烧得滚烫的碎片，在无数个黑夜里拼凑、演算，推导过千万次自己和多绚的展开，却从未出现过皆大欢喜的结局。每一步棋都像上天开的玩笑一样，以最恶劣的方式落在棋盘上，能走到如今这个相互折磨的地步，或许已经是她们所能触及的最好结局了。</p><p class="story-paragraph" data-source-key="2139:0">如果多绚真的厌倦了，如果这场因恨而起的报复也终于耗尽了燃料，抵达了终点，如果……如果她连做一个用来发泄、用来践踏的垃圾都失去了利用价值。</p><p class="story-paragraph" data-source-key="2141:0">志宇把脸深深埋进已经染上自己的湿冷的睡裙里，颤抖着吸入那股混合了两人气息的味道。</p><p class="story-paragraph" data-source-key="2143:0">那也没关系……</p><p class="story-paragraph" data-source-key="2145:0">只需要找个角落，安静地死掉就好了。</p><p class="story-paragraph" data-source-key="2149:0">多绚推开公寓的门时，室内完全被浓郁且苦涩的Alpha信息素填满了。铺天盖地的潮气让她不禁眉头锁紧，跟随着气息的来源，推开主卧的房门时，眼前的景象让她呼吸一滞。</p><p class="story-paragraph" data-source-key="2151:0">志宇像一只受伤的幼兽，蜷缩在床边的地毯上。连续几天的易感期和发烧的折磨，已经让她显得憔悴不堪，脸色也是病态的潮红。</p><p class="story-paragraph" data-source-key="2153:0">志宇紧闭着眼，似乎没有注意到多绚回来了，鼻尖还埋在那条睡裙里，靠那点属于多绚的微弱的气息来对抗体内那一波又一波足以把人烧干的热潮。</p><p class="story-paragraph" data-source-key="2155:0">多绚走近，居高临下地踢了一下志宇的小腿，随后用脚尖踩着对方的腰强行将人翻转过来，那样子简直就像在路边查看一条不知是死是活的野狗。</p><p class="story-paragraph" data-source-key="2157:0">志宇有些迟缓地睁开眼，涣散的视线在昏暗中聚焦良久，才看清眼前的人。</p><p class="story-paragraph" data-source-key="2159:0">该说是庆幸呢，还是感激呢。多绚终于回来了，没有抛弃她，真是太好了。</p><p class="story-paragraph" data-source-key="2161:0">她却没有力气爬起来，也顾不上对被多绚撞见这种虚弱的场面而感到羞耻，反正自己再狼狈不堪的样子，多绚都见过了不是吗。</p><p class="story-paragraph" data-source-key="2163:0">我哪里也没去，我表现得好吗……？</p><p class="story-paragraph" data-source-key="2165:0">可以……得到一点奖赏吗？</p><p class="story-paragraph" data-source-key="2167:0">可以……抱抱我吗？</p><p class="story-paragraph" data-source-key="2169:0">那双平时总是清澈的眼里密布着由于生病和欲望而生出的血丝，眼神也因为高热而浑浊。就那样直勾勾地望着多绚，像被驯化了的畜生，在受尽苦难后，还眼巴巴地盯着主人的样子，卑微到了极点，也贪婪到了极点。</p><p class="story-paragraph dialogue" data-source-key="2171:0">“多绚……”</p><p class="story-paragraph dialogue" data-source-key="2173:0">“帮帮我……”</p><p class="story-paragraph" data-source-key="2175:0">多绚在志宇面前蹲下，垂眸看着这张写满了煎熬和渴望的脸。脑海里不可抑制地浮现出过去的景象，那时候的志宇，不也是在易感期这样执拗地纠缠她吗，只不过那时的志宇还不像一条快死的狗，还带着她特有的沉默的霸道，用滚烫的怀抱将她圈得死死的。</p><p class="story-paragraph" data-source-key="2177:0">而现在，志宇只是乖乖蜷缩在这可怜的一角了。甚至不敢爬上她的床，只敢抱着一件冰冷的衣服，卑微地等待她这不知何时才会降临的恩赐。</p><p class="story-paragraph" data-source-key="2179:0">多绚伸出手，指尖拂过志宇被汗水打湿的额头，轻轻抚摸对方由于高热而泛红的脸颊。</p><p class="story-paragraph dialogue" data-source-key="2181:0">“你真是……一点都没变。”</p><p class="story-paragraph" data-source-key="2183:0">多绚的声音很轻，听起来竟然有几分心疼。</p><p class="story-paragraph" data-source-key="2185:0">身体因为这样的触碰而颤抖了一下。志宇不禁抬起头，愣愣地看向多绚，在混沌的意识中，捕捉到多绚语气里一丝转瞬即逝的、对于过去的怀念。</p><p class="story-paragraph" data-source-key="2187:0">可是……那是怀念吗？</p><p class="story-paragraph" data-source-key="2189:0">志宇无力深究，只是本能地将脸深深地埋进多绚干燥的掌心，闭上眼，像在沙漠爬了两天终于找到水源的人，贪婪地汲取着那抹能给她安抚的香气。</p><p class="story-paragraph" data-source-key="2191:0">被志宇呼出的热气扑在手心，多绚的心理防线似乎又出现了一道细微的裂痕。</p><p class="story-paragraph" data-source-key="2193:0">太黏人的狗，令人厌恶。</p><p class="story-paragraph" data-source-key="2195:0">多绚冷下脸，刚才眼神里温柔的错觉荡然无存，她抽回了自己的手。从随身的包里翻出一个白色的小药瓶，是她在回来之前随手买来以备不时之需的。</p><p class="story-paragraph" data-source-key="2197:0">她将药瓶扔进了志宇怀里。</p><p class="story-paragraph dialogue" data-source-key="2199:0">“吃两片，滚出去。”</p><p class="story-paragraph" data-source-key="2201:0">多绚站起身，恢复了往日的冷漠。</p><p class="story-paragraph dialogue" data-source-key="2203:0">“还有，别弄脏我衣服。”</p><p class="story-paragraph" data-source-key="2205:0">话音落下，房间里一片死寂。</p><p class="story-paragraph" data-source-key="2207:0">药瓶砸在志宇抱在怀里的睡裙上，发出一声沉闷的轻响，然后又滚落到地毯上，干燥的药片在瓶子里互相碰撞，引起一阵细碎而空洞的沙沙声。</p><p class="story-paragraph" data-source-key="2209:0">志宇抱着睡裙的手慢慢松开了，她吃力地跪坐起来，低头看了看那个药瓶，捡起来，又抬头看了看多绚重新变得冷硬的面容。</p><p class="story-paragraph" data-source-key="2211:0">志宇攥着药瓶低下头，极轻地牵了牵嘴角，勾起一抹多绚看不见的自嘲的弧度。</p><p class="story-paragraph dialogue" data-source-key="2213:0">“……谢谢您。”</p><p class="story-paragraph" data-source-key="2215:0">多绚没有再看她一眼，径直走向浴室。很快，水声响起，隔绝了房间里残留的令人作呕的黏腻渴求。</p></div>
