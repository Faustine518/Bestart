      <article class="chapter" data-chapter="section-09">
        <header class="chapter-header"><span class="chapter-number">09</span><h2>Chapter 09</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="2078:0">临海的酒店，河览住的楼层也高，一整面落地窗摆在那里，拉开窗帘就能眺到蔚蓝色的大海和海面上伫立的白色大桥。住在风景好的地方心情就好，楼高望远，入夜甚至能见釜城灯火万千，就连落地飘窗上也覆手工羊绒毯，可以说是金宇宙思虑周全，换一句话来讲也算有钱任性 。</p><p class="story-paragraph" data-source-key="2079:0">进了房间河览就开始找那条领带。</p><p class="story-paragraph" data-source-key="2080:0">志宇在她面前向来很乖，亦步亦趋跟在后面，湿漉漉圆溜溜的眼睛追着河览的背影看，看不够。</p><p class="story-paragraph" data-source-key="2081:0">真的很像小狗，回头同志宇的撞上视线，河览还是这么觉得。</p><p class="story-paragraph" data-source-key="2082:0">盯着她看的Alpha就差一双在头顶耷拉下去的小狗耳朵，不知道为什么，总给河览一种不见的这一个月，崔志宇受惨了委屈的错觉。</p><p class="story-paragraph" data-source-key="2083:0">她回过神，心底一声嗤，但是崔志宇又能受什么委屈。</p><p class="story-paragraph" data-source-key="2084:0">她终于把那条领带找了出来。</p><p class="story-paragraph" data-source-key="2085:0">崔志宇的目光一开始追着河览看，到后面又追着河览手里的领带看。</p><p class="story-paragraph" data-source-key="2086:0">很漂亮的，深蓝色，她喜欢。</p><p class="story-paragraph" data-source-key="2087:0">拿在河览的手里，应该是河览给她买的，她更喜欢了。</p><p class="story-paragraph" data-source-key="2088:0">河览之前没给其他人系过这玩意儿，买到之后就临时抱佛脚去网上学，现今面对面帮崔志宇系，离得太近，志宇的呼吸细细碎碎扑她的耳尖，扑的她脸颊滚烫，揪着领带的手指打了几次滑，终于堪堪绕好第一步。</p><p class="story-paragraph" data-source-key="2089:0">“三次是什么?”她声音很细，几乎是气音，“你告诉我。”</p><p class="story-paragraph" data-source-key="2090:0">三次，多绚坦白时欲言又止的数字，让她来问崔志宇，她记得。</p><p class="story-paragraph" data-source-key="2091:0">轻飘飘的声音，落在志宇的耳朵里，宛若惊雷。</p><p class="story-paragraph" data-source-key="2092:0">大脑一片空白，志宇没有思考的余地，领带被轻轻地收紧，勒在她的颈下，好似索命。</p><p class="story-paragraph" data-source-key="2093:0">“多绚和姐姐是熟人，她说这个要我亲自来问姐姐才好。”</p><p class="story-paragraph" data-source-key="2094:0">河览的声音很轻：“姐姐，再骗我就不会原谅你了。”</p><p class="story-paragraph" data-source-key="2095:0">“试图接近你的次数。”志宇的声音很闷，“三次。”</p><p class="story-paragraph" data-source-key="2096:0">有预谋，见色起义，怎么讲都好。</p><p class="story-paragraph" data-source-key="2097:0">一开始的打算并非直接进公司，而是通过多绚咨询河览被包养的意愿，不出所料被拒绝了，这是第一次。</p><p class="story-paragraph" data-source-key="2098:0">志宇讲的很慢，视死如归，讲完偷偷抬眼看河览，对方也只是垂着眸子，专心致志地给自己打领带，动作很慢。</p><p class="story-paragraph" data-source-key="2099:0">“第二次是和我成为拍摄搭档……第三次呢？”</p><p class="story-paragraph" data-source-key="2100:0">河览的声音很轻，慢条斯理，她真的很聪明，第一次就给志宇打最难打的温莎结，手指绕着绸面上下翻飞，打的异常漂亮，熟的不像第一次。</p><p class="story-paragraph" data-source-key="2101:0">她轻轻地接着志宇的话头，也没有放过志宇的意思，河览有很多问题。</p><p class="story-paragraph" data-source-key="2102:0">但是说来奇怪，问出口的时候，没有愤怒，没有委屈，只是好奇。</p><p class="story-paragraph" data-source-key="2103:0">只是好奇面前这个人到底为自己做到了什么地步。</p><p class="scene-break" data-source-key="2104:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2105:0">“那个不是第二次。”</p><p class="story-paragraph" data-source-key="2106:0">有些艰难的，崔志宇开口否认。</p><p class="story-paragraph" data-source-key="2107:0">在那家公司里，柳河览的漂亮程度是第一列的，很多人觊觎她。拍摄邀约都被金多绚四两拨千斤地挡回去，挡不住的要么是经纪人强势，要么是老板亲自指摄。在崔志宇投出那份被金多绚伪造出的简历之前，她蹲过公司楼下的那家便利店。</p><p class="story-paragraph" data-source-key="2108:0">便利店里卖很便宜的便当和临期零食，有时候河览会在这里买。</p><p class="scene-break" data-source-key="2109:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2110:0">“我们在便利店里说过话。”</p><p class="story-paragraph" data-source-key="2111:0">声音越来越小，越说越觉得自己处心积虑，卑劣不堪。</p><p class="scene-break" data-source-key="2112:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2113:0">“不止一次。”</p><p class="story-paragraph" data-source-key="2114:0">崔志宇说。</p><p class="story-paragraph" data-source-key="2115:0">她这么一讲，柳河览突然想起来，在有一段时间，那个便利店靠窗的位置是会经常坐一个人。口罩鸭舌帽遮的严严实实，抱着电脑很忙的样子，电脑边上一杯不变的冰美式，听老板讲是被导师为难的大学生。</p><p class="story-paragraph" data-source-key="2116:0">原来这么早。</p><p class="story-paragraph" data-source-key="2117:0">试图讲过的话无非点头之交，甚至大大咧咧坐过对方旁侧。</p><p class="story-paragraph" data-source-key="2118:0">那时她好似已经半接受注定要在这个狗公司混到人生里最不见天日的时候了，偶尔也会和这位絮絮叨叨讲一些，委屈也好，难过也好，一股脑地讲，也没有指望这个过路人能够有一两句回应。</p><p class="story-paragraph" data-source-key="2119:0">她太苦了，那时候，苦到没有人可以说，没有人可以讲。苦到抓根稻草也觉得可以救命，但是那时候好像稻草都没有一根，所以她理所当然抓住过路人。</p><p class="story-paragraph" data-source-key="2120:0">“你很笨，那时候。”崔志宇慢慢地讲。</p><p class="story-paragraph" data-source-key="2121:0">“坐在我旁边，一股脑讲，明明都是很受不了的事情，偏偏还在笑。”</p><p class="scene-break" data-source-key="2122:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2123:0">“导演、给你打电话的爸妈、没有买到的饭团、片酬被克扣，还有那个吃死人的公司。都笑着讲。”</p><p class="story-paragraph" data-source-key="2124:0">她尤其不愿意想便利店里的那一段，讲话很慢，声音很轻，不敢抬头看柳河览，目光落在那条河览为她系上的，漂亮的领带上。</p><p class="story-paragraph" data-source-key="2125:0">真的是一条很漂亮领带，丝绸缎面，星轨烂漫，领夹端处缀着一颗碎碎的小钻，精巧又别致。</p><p class="story-paragraph" data-source-key="2126:0">柳河览应该会想问她那时候到底在想什么。</p><p class="story-paragraph" data-source-key="2127:0">在想什么？</p><p class="story-paragraph" data-source-key="2128:0">大抵会想，真是可怜，有够笨，一个路人也够她毫不设防交出真心。</p><p class="story-paragraph" data-source-key="2129:0">“所以有了第三次？”河览问。</p><p class="story-paragraph" data-source-key="2130:0">就像她想象里的那样，系好领带的崔志宇漂亮极了，浅色的大衣和衬衫，同深蓝色领带正好相衬。她系好领带，往后退两步，也很惊讶自己能够这么平静。</p><p class="story-paragraph" data-source-key="2131:0">“我那时候想不出来其他办法。”崔志宇闷闷讲，“我总不可能一直做你听众。”</p><p class="story-paragraph" data-source-key="2132:0">“换个人也会么？”</p><p class="scene-break" data-source-key="2133:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2134:0">“不会。”</p><p class="story-paragraph" data-source-key="2135:0">崔志宇很认真地讲话的时候，会很认真地蹙起眉头，两道眉撇蹙成一个可爱的八字，有一点像漫画里跑出来的小人。</p><p class="story-paragraph" data-source-key="2136:0">“志宇姐姐是很善良的人，不会舍得看见任何人受苦。”</p><p class="story-paragraph" data-source-key="2137:0">“但是真心只有一处。”崔志宇说，她在河览面前从来不善于表达，缄默温驯，被河览轻飘飘一句话噎的发急。</p><p class="story-paragraph" data-source-key="2138:0">又怎么可能看得见别人。可是见色起意这种事情太难以启齿，难道要真的将事情始末从头到尾细细讲出来么？</p><p class="story-paragraph" data-source-key="2139:0">太难堪了，太残忍了。</p><p class="story-paragraph" data-source-key="2140:0">多绚撑着腮在Dv面前笑着问你要不要救一救她这种话也讲不出来，只知道掐到时间点去等河览路过的每一天都煎熬。</p><p class="story-paragraph" data-source-key="2141:0">她不知该怎么拉近距离，只能干巴巴坐在那里当听众，脑海里晃着河览那双蒙着水雾的眼睛，后来眼一闭心一横投了假简历去做兼职从头做鸭，结果连场都做ntr片里沉睡的丈夫。</p><p class="story-paragraph" data-source-key="2142:0">任着旁边的Alpha和omega天操地射，叫塌屋顶，她卧在另一侧，阖眼装作死掉的猪，心里担心河览，火烧火燎，艰难万分。</p><p class="story-paragraph" data-source-key="2143:0">她讲到这里，讲不下去，喉咙骤地被噎住，再也发不出任何声响。</p><p class="story-paragraph" data-source-key="2144:0">嗤一声，柳河览笑出声，她觉得好荒唐。</p><p class="story-paragraph" data-source-key="2145:0">可她实在不忍再逼崔志宇，可怜巴巴的样子太惨，解释急了，眼睛里都蒙着一层薄薄的水雾。依稀记得多绚嘴巴里的志宇缄默骄傲漂亮，现在站在自己面前，衬衫被一丝不苟地扣到顶，深蓝色领带系的一丝不苟，好像只剩漂亮。</p><p class="story-paragraph" data-source-key="2146:0">——只是漂亮也够了。</p><p class="story-paragraph" data-source-key="2147:0">系住她的领带，就是独属于她的漂亮小狗。河览从小到大没什么能够属于自己的东西，现今多一只崔志宇，好也是她的，不好也是她的。</p><p class="story-paragraph" data-source-key="2148:0">是她的。</p><p class="story-paragraph" data-source-key="2149:0">真心只有一颗，心尖上最红最艳的一捧血，第一眼最漂亮最想怜惜的那个人。</p><p class="story-paragraph" data-source-key="2150:0">她很狭隘，很小气，太阳照过她一个人，便只准照她一人。</p><p class="story-paragraph" data-source-key="2151:0">要让一个没有受过偏心的人学会分享，是很没有道理的事情。</p><p class="story-paragraph" data-source-key="2152:0">曾经，前段时间，发自内心，河览真是这么想的。</p><p class="story-paragraph" data-source-key="2153:0">而这些是崔志宇知道的，懂得的。</p><p class="story-paragraph" data-source-key="2154:0">但是她还是紧张，呼吸轻轻地屏着，等河览给她下判决。</p><p class="story-paragraph" data-source-key="2155:0">“我可能会逃跑噢?”河览语调轻轻地讲，“我不喜欢带有目的接近我的人。”</p><p class="story-paragraph" data-source-key="2156:0">两个人中间隔着两步，距离微妙，进一步咫尺，退一步天涯。</p><p class="story-paragraph" data-source-key="2157:0">说话的时候还要拿手轻轻地捻崔志宇的耳垂。指尖不轻不重地揉着，饶有兴致地看对方一点一点，整个人红透。好奇怪，心知肚明地讲着把志宇姐姐架在火上烤的话，却又要做这么亲近的动作，她有点看不懂自己。不知道究竟是看不懂，还是不想懂。只是心脏痛，闷闷的，好像有什么东西在静静的裂开。</p><p class="story-paragraph" data-source-key="2158:0">剧组里的演员总讲河览有一种天生的恶趣味，但是这种恶趣味本人不自知，只是格外喜欢捉弄剧组里年龄最小的朋友。童星出道，长了一张很可爱的脸蛋的奈延经常被河览逗出局促的表情，有时候连Carmen也看不下去，走过来讲好啦好啦，吃饭了吃饭了。</p><p class="story-paragraph" data-source-key="2159:0">之前对这种恶劣的本性不自知，看到志宇的眼眶在一瞬间红透的刹那，她才后知后觉自己竟然是真的有。</p><p class="story-paragraph" data-source-key="2160:0">“如果你想的话。”</p><p class="story-paragraph" data-source-key="2161:0">她听见志宇讲。</p><p class="story-paragraph" data-source-key="2162:0">“我不会来见你。”</p><p class="story-paragraph" data-source-key="2163:0">很艰难的语气，一字一顿，每一步都似踩在刀尖上。谎言被剥离的刹那，审判接踵而至，做错事就要认罚，这是崔志宇的教养和认知。</p><p class="story-paragraph" data-source-key="2164:0">她顿了顿，慢吞吞地将情绪压下去，又慢慢地讲。</p><p class="story-paragraph" data-source-key="2165:0">“但是还是要跟我回一趟首尔。”</p><p class="story-paragraph" data-source-key="2166:0">河览偏了偏头，崔志宇垂着眸子盯她，好似要把她刻进骨子里。</p><p class="story-paragraph" data-source-key="2167:0">“我成年的时候，家里人给我送了一些礼物，想给你。”</p><p class="story-paragraph" data-source-key="2168:0">无非房子车子票子，恰好江原道那边还有些土地，全部办转让赠河览，不至于她远走高飞时被中途饿死。她不怕再也见不了河览，只怕对方吃不饱穿不暖，又把自己送到退无可退的绝境。其实也奇怪，讲这些的时候，脑子里竟然开始翻涌起其他的念头，绑架也好囚禁也好，要把河览关在自己身边才好。</p><p class="story-paragraph" data-source-key="2169:0">某种程度上来说她确实同郑伊安是一类，总会在该得体的时候想一些不得体的事情。</p><p class="story-paragraph" data-source-key="2170:0">十六岁时家里长辈赠她十分漂亮的鱼缸，缸里沉着各色各样的宝石，前些时日她还琢磨往缸里添水增养几条斗鱼，现今她也想把河览关起来做那些斗鱼养，漂亮剔透的宝石做沉底，河览被她囚在里面养到死才好。</p><p class="story-paragraph" data-source-key="2171:0">她不缺这些，钱是数字，五颜六色的宝石也没有意义，荣誉加身只算来日必经，拥有的东西够多了。</p><p class="story-paragraph" data-source-key="2172:0">——但是不够，她还想要一个柳河览。</p><p class="story-paragraph" data-source-key="2173:0">志宇轻轻地咬着牙想，手指轻轻拢成拳，阴沟测测想法在她颅内翻滚百八十遍，人快要碎了。可面上还要挤勉强微笑，扮无害做小狗她太擅长。有时候扮着扮着自己也快相信。</p><p class="story-paragraph" data-source-key="2174:0">教养同骤然起来的癫疯打架，最终志宇转念一想，觉得这样做河览也会不开心。</p><p class="story-paragraph" data-source-key="2175:0">于是那些疯透了的念头被她高高举起，想到就连血液都在沸腾的时候，又被不动声色轻轻放回角落。</p><p class="story-paragraph" data-source-key="2176:0">自由就好、温饱就好、活着就好。</p><p class="story-paragraph" data-source-key="2177:0">“如果目的只是想要和我做的话，好像也不用这么大费周章吧？我是很难得到的人吗？”</p><p class="story-paragraph" data-source-key="2178:0">“但是姐姐，你的话，想要的话，世界上还有你得不到的东西吗?”</p><p class="story-paragraph" data-source-key="2179:0">问题一个接着一个，问完河览自己都觉得好笑，明知故问，知道答案并非如此。可她偏偏要问，难听刻薄又直白，问一句心里的裂痛就深一点，句句都似刀，伤敌一千自损八百，在崔志宇难堪之前先把自己弄到体无完肤。</p><p class="story-paragraph" data-source-key="2180:0">偏偏她就是想。</p><p class="story-paragraph" data-source-key="2181:0">就是要看着崔志宇闭着眼睛，死死摇头，狼狈不堪。</p><p class="story-paragraph" data-source-key="2182:0">谁都别想好。</p><p class="story-paragraph" data-source-key="2183:0">可这个人是真的太傻了。</p><p class="story-paragraph" data-source-key="2184:0">什么都拥有的人闯情色场，只会多许多被人拿捏的把柄。</p><p class="story-paragraph" data-source-key="2185:0">就连公司里背着高利贷的那些人都有着自己的软肋，而崔志宇就这么赤条条的闯进来，她好像没有考虑过后果，甚至压根就没有思考过自己的前程和未来。</p><p class="story-paragraph" data-source-key="2186:0">河览没有想明白。如果只是想要在情色方面的来往，崔志宇这样的人，勾勾手指，应该不会有得不到的东西。</p><p class="story-paragraph" data-source-key="2187:0">她听说了那个混蛋老板为了自保把卢惟那送上了另一个Alpha的床上的传言，犹豫很久才给梁生发消息确认——她和梁生还保有联系。</p><p class="story-paragraph" data-source-key="2188:0">前不久公司被干垮，这个大叔被迫失业，但是好似没被生活的担子压倒半分，还是开朗又刻薄，在电话那头还是絮絮叨叨。</p><p class="story-paragraph" data-source-key="2189:0">“还好你被捞出去，不然像惟那那样，真的惨。”</p><p class="story-paragraph" data-source-key="2190:0">他说那个护短又记仇的经纪人蹲了老板三天，终于在破产清算的时候把这个狗东西暴打了一顿。但是无济于事，那个Alpha对惟那很感兴趣，已经把惟那关起来了，小猫小狗似地圈养着，联系方式也换了，谁都联系不上。</p><p class="story-paragraph" data-source-key="2191:0">用刻薄的语气讲这些事，梁生难免还是想叹气：“说起来也是有着不得已的理由才进公司的小孩，命途多舛噢。”</p><p class="story-paragraph" data-source-key="2192:0">他听上去很担心惟那，发自内心。</p><p class="story-paragraph" data-source-key="2193:0">在这种乱七八糟的环境里，真心和情谊都是最奇怪的东西。</p><p class="story-paragraph" data-source-key="2194:0">但是好似又只有那么一点点的真心和情谊掺和在里边，又会让人产生这个环境还不至于这么糟糕的错觉。</p><p class="story-paragraph" data-source-key="2195:0">那种又精明又混账的老板，如果那时候的崔志宇需要，只要多绚去提一嘴，把她五花大绑的送到崔志宇的床上这种事是那个人能够做出来的。</p><p class="story-paragraph" data-source-key="2196:0">“……我不是那样的人。”</p><p class="story-paragraph" data-source-key="2197:0">崔志宇轻轻地讲，声音有点哑了。</p><p class="story-paragraph" data-source-key="2198:0">“不是那样的人噢。”河览眯着眼睛，轻轻地复咬着她的字眼，有点狐狸的样子。手指沿着耳廓轻轻地往下滑，指尖勾过下巴，顺着下巴又抚到平滑修长的脖颈。</p><p class="story-paragraph" data-source-key="2199:0">“不是那样的人，但是会成为在片场上和我发生关系的拍摄搭档。”</p><p class="story-paragraph" data-source-key="2200:0">“不是那样的人，但是可以装作除了我就一无所有的志宇姐姐。”</p><p class="story-paragraph" data-source-key="2201:0">“不是那样的人，又在那种时候，一句句讲想和我结婚。”</p><p class="scene-break" data-source-key="2202:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2203:0">她一句句讲，慢条斯理，冷酷又残忍。</p><p class="story-paragraph" data-source-key="2204:0">“姐姐，你不是那样的人。”</p><p class="story-paragraph" data-source-key="2205:0">那样到底是哪样？那怕利用权柄把她当做彻头彻尾的玩物，都比此刻把所有的难堪摊开来看，把她吊起来凌迟要好很多。</p><p class="story-paragraph" data-source-key="2206:0">崔志宇提一句，她就可以驳十条，河览到现在才反应过来原来不是不愤怒，而是愤怒到了极致，愤怒到了连骨子里都在染着一股骇然又莫名的火气的时候。她说话的声音，原来可以这么轻。</p><p class="story-paragraph" data-source-key="2207:0">原来不是只有歇斯底里或者暴力才能够被称之为愤怒。</p><p class="story-paragraph" data-source-key="2208:0">不得不说崔志宇这样的人活着就是对很多人的不公平，太漂亮，太善良，太顺遂。但是命这种东西就是这样，兴许太顺遂，需要一点坎坷，所以崔志宇遇到了柳河览。</p><p class="story-paragraph" data-source-key="2209:0">可是她的命真的太好，就连柳河览也舍不得让她难过半分。眼圈一红，让河览趣味叠起，趣味一消，又觉得心脏钝钝的痛。</p><p class="story-paragraph" data-source-key="2210:0">二人缄缄默默对视，最终河览认输般长叹一口气。</p><p class="story-paragraph" data-source-key="2211:0">设想过崔志宇穷的揭不开锅，却不曾想从头到尾，天高海阔的自由，光明万丈的前路，全在这人一念之间。</p><p class="story-paragraph" data-source-key="2212:0">她目前有的，得到的，好似全都是从崔志宇指缝里边松松漏下的。</p><p class="story-paragraph" data-source-key="2213:0">这不公平。</p><p class="story-paragraph" data-source-key="2214:0">这种不对等太吃人了，只要崔志宇站在那儿，她们就会一直不对等。</p><p class="story-paragraph" data-source-key="2215:0">可崔志宇意识不到这种问题。</p><p class="story-paragraph" data-source-key="2216:0">她想得到房子车子票子，温饱自由富足，独独漏掉河览是一个活生生的人。</p><p class="story-paragraph" data-source-key="2217:0">活生生的人是不能当做小猫小狗来养的。</p><p class="story-paragraph" data-source-key="2218:0">嘴巴徒劳地张了张，除了是或者否的答案以外，崔志宇很绝望的发现自己竟然辩驳不出来任何字。笑盈盈摸着她的下巴的柳河览在这个瞬间离她好远，要说什么，要做什么呢?</p><p class="story-paragraph" data-source-key="2219:0">“如果河览没有办法继续待在我的身边了，一定要先和我回一次首尔。”</p><p class="story-paragraph" data-source-key="2220:0">她只能反复地，再把这句话讲出口。</p><p class="story-paragraph" data-source-key="2221:0">声音都是哑的，支离破碎，她没有想到自己会这么难过，好像自内而外都要碎成一片一片的，很难再拼起来。</p><p class="story-paragraph" data-source-key="2222:0">在离开首尔到达釜山之前，她已经将自己有的，能够给的东西做了全线的分割。</p><p class="story-paragraph" data-source-key="2223:0">一笔一笔的，该是柳河览的，该给柳河览的，她能够给的范围之内全数奉上，如果可以甚至还想搭一个自己。</p><p class="story-paragraph" data-source-key="2224:0">金主恩抽空陪她整理，哼哼嘲笑：“是真的在搭彩礼做嫁妆么。”</p><p class="story-paragraph" data-source-key="2225:0">小啾不安分，在她们的脚下跑来跑去，软软的耳朵被跑的翻过来，聪明毛乱飞。不似刚捡到那般怯生生，伊丽莎白圈摘了，神气活现的。小狗养好了也有开朗明媚的性子，打着响鼻，用嘴筒子拱蹭崔志宇的掌心撒娇。</p><p class="story-paragraph" data-source-key="2226:0">“我是真的很想让妈妈给江原道那边送柿子饼啊。”</p><p class="story-paragraph" data-source-key="2227:0">一份一份的转让协议在面前排成一列展开，崔志宇拿着钢笔垂首签字。字如其人，崔志宇漂亮，写出来的字也漂亮。</p><p class="story-paragraph" data-source-key="2228:0">不似龙飞凤舞，只是白纸黑字，规规整整，看上去说不出的乖。</p><p class="story-paragraph" data-source-key="2229:0">“我真的很想河览成为我的妻子。”</p><p class="story-paragraph" data-source-key="2230:0">她抿着嘴，声音也轻，不知是在对谁说。</p><p class="story-paragraph" data-source-key="2231:0">只是心知肚明终有掉皮时日，未曾想大解脱圆在釜山活跃，能够做的只有在那个刹那到来之前要赶到河览身边。如果赶不上，出了差池，兴许就是悔恨中过余生。</p><p class="story-paragraph" data-source-key="2232:0">志宇向来果决，不喜欢人生有憾。</p><p class="story-paragraph" data-source-key="2233:0">情绪波动有点大了，手不自觉发颤，她顿了好几次，呼吸平复，才慢慢接着往下说。</p><p class="story-paragraph" data-source-key="2234:0">“回首尔。”眼睑颤抖，说出来的话也抖，崔志宇很平静地讲，“我骗你，你有精神损失。”</p><p class="story-paragraph" data-source-key="2235:0">“要把你的精神补偿拿好。”她声音很轻，一字一句，唱睡前歌似地轻轻念，“我们结清。”</p><p class="story-paragraph" data-source-key="2236:0">用了结清这两个字，意味着一刀两断，很难很难才能够做出的决定，却又被她用轻飘飘的语气讲出来，恍然让河览有一种置身梦中的错觉。</p><p class="story-paragraph" data-source-key="2237:0">原来只属于她的崔志宇也可以用这种话来结清和买断两个人之间的关系吗？好可悲。</p><p class="story-paragraph" data-source-key="2238:0">哼哼笑一声，河览摇头，“姐姐，我不需要那些。”</p><p class="story-paragraph" data-source-key="2239:0">她声音也很轻，定定看志宇：“我不需要。”</p><p class="story-paragraph" data-source-key="2240:0">崔志宇的行事作风是这样，全心全意对某个人好，能力范围之内给到最多，给爱给的慷慨，满到快要溢出来。</p><p class="story-paragraph" data-source-key="2241:0">可是如若有朝一日想收回去呢？</p><p class="story-paragraph" data-source-key="2242:0">但是，总有些东西不是能够用那种东西能够了结的。</p><p class="story-paragraph" data-source-key="2243:0">她也不知道自己到底在纠结什么，一方面对志宇的占有欲极度膨胀，另一面却叫嚣着想要逃跑。没有愤怒，没有歇斯底里，甚至没有半句说出重话的冲动，她只是突然不知道该怎么面对崔志宇了。</p><p class="story-paragraph" data-source-key="2244:0">和志宇待在一起的时候很开心，是她这辈子前所未有的开心，也许今后也不会再有了。</p><p class="story-paragraph" data-source-key="2245:0">二二年侥幸从教堂纵火案里中脱逃，从警局做完笔录出来，打电话给家里的时候，有劫后余生的感觉。</p><p class="story-paragraph" data-source-key="2246:0">可是江原道的家太贫瘠，就算是那样危险的事情，母亲也只是在电话里草草地敷衍着讲那你下次一定要注意这种人噢——要远离危险的人，要学会辨别，要保护好自己。</p><p class="story-paragraph" data-source-key="2247:0">无论怎么样，还能够看到第二天的太阳，就是一件幸运的事情。最底层的人，生若蜉蝣，没有那么多的精力分出来给其他人。无论是夫妻之间，亦或者姐妹之间，横亘在亲情面前的永远都是比感情更为冰冷，更为现实的东西。</p><p class="story-paragraph" data-source-key="2248:0">柳河览理解，柳河览认同，柳河览接受。</p><p class="story-paragraph" data-source-key="2249:0">挂念这两个字对她来说太奢侈了，至少在遇到志宇之前就是这样的。在首尔活不下去的人有很多，每年都会有人从汉江上的那座大桥上一跃而下。</p><p class="story-paragraph" data-source-key="2250:0">看到新闻的时候河览总是会想，如果没有遇到志宇姐姐，自己说不定就是水里的浮尸一具，然后警方会草草结案，爸妈领着她的抚恤金回江原道，她变成新闻报纸上的版头或者豆腐块，挂两天就消失。。</p><p class="story-paragraph" data-source-key="2251:0">河娜按部就班读完大学找工作，下一代可能就不会像她们一样辛苦了。</p><p class="story-paragraph" data-source-key="2252:0">想来也可笑，原来活的不辛苦这种事情在某种程度上竟然会经历几代人的折腾。</p><p class="story-paragraph" data-source-key="2253:0">她又能怪什么？</p><p class="story-paragraph" data-source-key="2254:0">遇到了崔志宇，因为这个人会在乎自己、牵挂自己。如果自己死掉了，她也曾天真的认为着崔志宇会难过到死掉。</p><p class="story-paragraph" data-source-key="2255:0">正是因为这样所以稍微有了一点想要好好的活下去的希望，哪怕多拍一点那种片子也无所谓，是抱着这样的觉悟做下养好崔志宇的决定的。</p><p class="story-paragraph" data-source-key="2256:0">不止想把崔志宇养到毕业，她的想法太多太烂漫，想给崔志宇很多。</p><p class="story-paragraph" data-source-key="2257:0">至少其他人有的， 崔志宇要有，其他人没有的，崔志宇还是要有。</p><p class="story-paragraph" data-source-key="2258:0">所以讨厌镜头也去签下宇宙递过来的合约，就算几十年生活在曝光灯下也无所谓。</p><p class="story-paragraph" data-source-key="2259:0">她真的是抱着这样的念头在很认真很努力的学习和工作啊。</p><p class="story-paragraph" data-source-key="2260:0">这些话柳河览是讲不出口。</p><p class="story-paragraph" data-source-key="2261:0">她只是有些难过，垂着眼，不动声色地想。</p><p class="story-paragraph" data-source-key="2262:0">如果她想给予的东西，是崔志宇与生俱来就拥有的东西，她还可以给崔志宇什么？</p><p class="story-paragraph" data-source-key="2263:0">难道要将自己双手奉上么？可你到底想要什么？我又该给你什么？我又能给你什么？</p><p class="story-paragraph" data-source-key="2264:0">对于河览来讲，这是完全没有答案的问题。</p><p class="story-paragraph" data-source-key="2265:0">她半句都问不出口，只是很深，很深的看着崔志宇。</p><p class="story-paragraph" data-source-key="2266:0">目光太复杂，一半爱一半恨，爱的不完全，恨的不纯粹，一眼就把人都要拖进地狱。</p><p class="story-paragraph" data-source-key="2268:0">因为从前未经历过，所以给的也毫不留余地，愈爱愈觉得欠，越欠越觉得恨，爱太多欠太多恨太多，不知道怎么还，也不知道如何讨。</p><p class="story-paragraph" data-source-key="2269:0">“结清。”轻轻讲着崔志宇方才漏下来的字眼，河览只是吸着气，好平静，声音都不带颤：“原来是可以结清的啊。我们。”</p><p class="story-paragraph" data-source-key="2270:0">她生气的时候，会垮脸，脸色如同阴云堆聚，山雨欲来的阵仗，会让人不寒而栗。可是她这次没有垮脸，只是定定站在崔志宇对面，很平静，轻声再讲：“崔志宇，你怎么可以这么欺负我。”</p><p class="story-paragraph" data-source-key="2271:0">声音太轻了，人也太瘦了，一双清泠泠的眼睛望着崔志宇，倏然就让她再也讲不出任何可以反驳的话，意识到自己讲错话，又无从辩解，仓皇又狼狈。只能眼睁睁看着河览凑过来，一步，两步。两个人距离拉近，鼻尖抵住鼻尖，唇瓣被对方轻柔地蹭了蹭。</p><p class="story-paragraph" data-source-key="2272:0">崔志宇错愕抬眼，看到河览缓慢抬手，揭下颈后一直规整贴好的抑制贴。</p><p class="story-paragraph" data-source-key="2273:0">雪绒花的气息清苦，铺天盖地，兜头拢住她。</p><p class="story-paragraph" data-source-key="2274:0">“好啊，我们结清。”</p><p class="story-paragraph" data-source-key="2275:0">她听到柳河览这么讲。</p><p class="story-paragraph" data-source-key="2277:0">郑伊安出手大方，咖啡车一排好几辆，片场周围蹲点拍照的粉丝也帮正主安排逆应援。金主爸爸到场，金宇宙打电话给金多绚让去接，难得排个休息日还要被拉出来搬砖，金多绚满肚子怨气。但是她与郑伊安许久未见，见见无妨。</p><p class="story-paragraph" data-source-key="2278:0">片场挺大，工作人员多，各有各的忙。</p><p class="story-paragraph" data-source-key="2279:0">今日是男女主角补亲密戏份，两小孩叼着金宇宙给买的奶茶站在场边看戏拍。</p><p class="story-paragraph" data-source-key="2280:0">场务打板，人工降雨，磅礴的雨声更衬潮湿又沉重的心事，男的把女的收进伞下垂眸去吻她，两个人干柴烈火，难舍难分，好似爱过很多年。</p><p class="story-paragraph" data-source-key="2281:0">金多绚看半晌，啧一声，心里想太假了，不如换崔志宇和柳河览过来亲。</p><p class="story-paragraph" data-source-key="2282:0">但是她又一转念，总觉得那日柳河览的表情算不上太好，心知肚明大概是崔志宇挨巴掌的可能性比较大，心里一声叹，不知道该说什么好。</p><p class="story-paragraph" data-source-key="2283:0">谎言拆开难堪，偏偏崔志宇知道柳河览的途径，是难堪里的最难堪。</p><p class="story-paragraph" data-source-key="2284:0">郑伊安对这些东西从来不感兴趣，饶有兴致拍一张发kkt的聊天框里，小鸭头像很快就回复她，咋咋呼呼问怎么去釜山不带她玩儿。郑伊安还没有回复，小鸭头像又发消息过来，让伊安帮她要女演员的签名。</p><p class="story-paragraph" data-source-key="2285:0">伊安的手指动了动，轻飘飘地回了一个好。</p><p class="story-paragraph" data-source-key="2286:0">金多绚手插兜里，一转头看见了。</p><p class="story-paragraph" data-source-key="2287:0">“搞网恋啊。”她随口问。</p><p class="story-paragraph" data-source-key="2288:0">“养了个小狗，怪有意思。”郑伊安手机收起来，兴致缺缺往那边看两眼，预感崔志宇会在釜山留一段时间，只觉得头疼，“只是把她一只丢在首尔，估计这段时间要闹翻天。”</p><p class="story-paragraph" data-source-key="2289:0">“还是当个人养。”金多绚说。</p><p class="story-paragraph" data-source-key="2290:0">郑伊安抿嘴，只是笑，不说话。</p><p class="story-paragraph" data-source-key="2291:0">当个人养，给的东西就太多了，要爱要真心的，她哪里给得起。</p><p class="story-paragraph" data-source-key="2292:0">说来也怪，两个人年龄加起来离四十岁都太远，好似却在这个世上活过很多年。两个人聊来聊去，股票聊到最近的形势，聊到没有话语聊，多绚听见伊安轻轻地哂了一声。</p><p class="story-paragraph" data-source-key="2293:0">“姐姐这次应该要脱一层皮吧。”</p><p class="story-paragraph" data-source-key="2294:0">她没有看多绚，自说自话，慢吞吞的：“有时候我想不明白啊，明明是玩玩就好的事情。”</p><p class="story-paragraph" data-source-key="2295:0">怎么就偏偏要去较这个真心呢。</p><p class="story-paragraph" data-source-key="2296:0">明明圈子里包养金丝雀少爷小姐们的那么多，她没有听过哪位做到这个程度。</p><p class="story-paragraph" data-source-key="2297:0">谁知道呢？多绚在心里轻轻的想。</p><p class="story-paragraph" data-source-key="2298:0">崔志宇当初因为易感期憋晕在自己宿舍里的时候，上赶着想往她床上爬的omega多了去，比柳河览好看的有，比柳河览可怜的也有，成功的一个也没有。</p><p class="story-paragraph" data-source-key="2299:0">好似那时候的崔志宇最好，冷心冷肺冷情，眼里只有研发进程和实验数据，不会露出那么纠结又痛苦的表情。</p><p class="story-paragraph" data-source-key="2300:0">那样的崔志宇太难看了，多绚见到过一次，再也不想见第二次。</p><p class="story-paragraph" data-source-key="2301:0">可是谁又想见到现在？她说不出话，心里也钝钝的难受。并非所有人都似她和金宇宙，圆满不足，至少心知肚明。</p><p class="story-paragraph" data-source-key="2302:0">不知为何，她总觉得郑伊安现在拧眉回那位小狗的信息的模样像极了当初的崔志宇。想到这一点，就只觉得荒谬，荒谬至极。</p><p class="story-paragraph" data-source-key="2303:0">“伊安啊。”多绚听见自己的声音，闷闷的，轻飘飘的。</p><p class="story-paragraph" data-source-key="2304:0">金宇宙教她很多，真挚诚恳，温良恭俭让，硬生生将她天生恶劣的本性磨去一半，以至于再也起不了劝人始乱终弃的心思。可是她没办法劝伊安交真心出去。</p><p class="story-paragraph" data-source-key="2305:0">郑伊安的真心，是很珍贵、很脆弱的。</p><p class="story-paragraph" data-source-key="2306:0">金多绚很小声地讲：“你对那位好一点吧。”</p><p class="story-paragraph" data-source-key="2307:0">不要玩弄那个人，也不要让自己受伤。</p><p class="story-paragraph" data-source-key="2308:0">她想说很多很多话。</p><p class="story-paragraph" data-source-key="2309:0">但是话到嘴边，蓦地变做一声沉沉的叹气。金宇宙总是教她接受世间无常，万事万物难以圆满。但是她朋友不多，私心太重，只是发自内心，只想着从小玩到大的几个圆满一点，过好一点，不至于让她揪心。</p><p class="story-paragraph" data-source-key="2310:0">伊安的牙尖磨着吸管，侧眼睨过来，若有所思。</p><p class="story-paragraph" data-source-key="2311:0">奶茶很快见底，空杯子被伊安捏在手里，那头男女主角补完戏被经纪人领过来陪笑，多绚从小到不喜欢这些，眼见郑伊安从善如流堆出假笑，她懒得陪，转身就要走。</p><p class="story-paragraph" data-source-key="2312:0">离去时依稀还听到她们交谈的声音，郑伊安难得一次向娱乐圈里人开口，要那个女演员帮她签个名。</p><p class="story-paragraph" data-source-key="2313:0">脚下沙滩松软，她有一脚没一脚踩，手里松松捏着金宇宙给买的奶茶，整个人都似逃课出来玩的小朋友。</p><p class="story-paragraph" data-source-key="2314:0">真的好像要把她从头当小朋友养一次，宇宙给多绚搭的衣服五花八门，今日搭针织翻领和牛仔裤，本身是狐狸相，穿着学院派风格衣服更显得有文化。金宇宙原本在同金珉周讨论分镜，一抬眼看到金多绚蔫嗒嗒走过来，珉周会意，笔尖点了点平板，善解人意地讲：“还是去陪陪你家小朋友。”</p><p class="story-paragraph" data-source-key="2315:0">年长宇宙几岁，又是已婚，分手复合都经历过，过来人看有些事总是格外通透。</p><p class="story-paragraph" data-source-key="2316:0">“她不开心。”</p><p class="story-paragraph" data-source-key="2317:0">两人说话间，金多绚已经走到这边。金珉周收起平板和电脑离开，贴心给她们留够空间。</p><p class="story-paragraph" data-source-key="2318:0">手背被温热的手掌轻轻地拢住，多绚如梦初醒，回神看到金宇宙也望着她。悬起来的心脏重重放回胸腔，她重重出一口气。复杂的心绪潮水似的退去。</p><p class="story-paragraph" data-source-key="2319:0">只在当下，把宇宙姐姐的手抓住就可以了。</p><p class="story-paragraph" data-source-key="2320:0">她没有办法再想更多东西了。</p></div>

      <article class="chapter" data-chapter="section-10">
        <header class="chapter-header"><span class="chapter-number">10</span><h2>Chapter 10</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="2324:0">近黄昏，海面上一轮日头西下，湛蓝色天空逐渐被红霞浸透，夕光无限。海面宁静，航船归港，渔船上的灯光投进水里，被波光荡碎。天暗下来，盏盏灯火自港口向城市里蜿蜒，明灯万千倒映海面，好似将整个天幕打翻浸进幽蓝色深海。陆上灯火万家，海面浮光跃金。从高楼落地窗里往外眺，特别漂亮。</p><p class="story-paragraph" data-source-key="2325:0">太漂亮，晃的柳河览的眼睛一花，一瞬失神。陷在没有灯光的房间里眺到这些，有一种很微妙的失落感。但是她想不清楚这种失落感从何而来，心脏空下去一瞬，又被崔志宇重重一顶，模糊的思绪顷刻又被情欲溢满。</p><p class="story-paragraph" data-source-key="2326:0">衣服皱巴巴的被甩在地上，分不清是谁的了。</p><p class="story-paragraph" data-source-key="2327:0">心知肚明大抵算作最后一次，志宇弄的很凶，一次又一次，细细碎碎的贴住她的额头吻，掐着她的腰不放，每一次都恨不得整根顶进生殖腔。</p><p class="story-paragraph" data-source-key="2328:0">信息素不加收敛，克莱尔奥斯汀的香气咬着雪绒花的不放，没有开窗的房间，处处都是旖旎的气息。信息素暴烈的交缠，心脏裂痛，快感灭顶，攀顶刹那河览用尽全力，齿尖狠狠啮进崔志宇的颈侧。</p><p class="story-paragraph" data-source-key="2329:0">颈后腺体暴烈跳动，被omega释放信息素强制进入易感期的Alpha几乎快要被暴烈汹涌的本能兜头淹没。剧痛骤来，暴虐因子疯狂跳动，志宇收紧手臂，死死将河览抱进怀中。</p><p class="story-paragraph" data-source-key="2330:0">抱太紧，恨不得整个把她揉进骨子里。</p><p class="story-paragraph" data-source-key="2331:0">不敢松手，停不下来，怕松开就要万劫不复。</p><p class="story-paragraph" data-source-key="2332:0">过度剧烈的性事到头都是精疲力尽，换以往河览真会昏过去。只是这次，都到疲倦到抬一抬手指都费力的程度了，可是意识依旧很清醒。好似清楚自己在做什么，又不知道自己在做什么。</p><p class="story-paragraph" data-source-key="2333:0">撑起身子的时候手腕被崔志宇轻轻攥住。</p><p class="story-paragraph" data-source-key="2334:0">被强制性进入易感期的Alpha暴戾又脆弱，不说话，一双眼浸在黑里，死死的望着她。</p><p class="scene-break" data-source-key="2335:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2336:0">不要走。</p><p class="story-paragraph" data-source-key="2337:0">志宇的嘴巴动了动，声音也是嘶哑的。她甚至不敢用太大的力气，被河览轻轻掰开手的时候，手指徒劳地蜷缩了一下，只觉得彻底的，抓不住某些东西了。</p><p class="story-paragraph" data-source-key="2338:0">她不能再讲话，声音太哑，嗓子好似被砂纸重重揉过。</p><p class="story-paragraph" data-source-key="2339:0">河览不说话，被她急急起身，蓦地拽住抱进怀里。</p><p class="story-paragraph" data-source-key="2340:0">克莱尔奥斯汀的气息清甜明媚，此刻却因为崔志宇的情绪染上一层灰朽的气息。信息素最骗不了人，情绪好时气息明媚，情绪坏时就低钝下去。陷进志宇的怀抱里，鼻腔也被这样哀绝的气息充斥着，情动的几乎发自本能，她好像也再没力气挣开半分。</p><p class="story-paragraph" data-source-key="2341:0">她和崔志宇的信息素匹配度应该很高，柳河览扯着嘴，垂着头自嘲地笑了笑。</p><p class="story-paragraph" data-source-key="2342:0">大抵就是信息素匹配度太高了，恍然也让她有错觉——她们可以在某些时刻很作配。这么一想，错觉太盛，一时间没有挣扎力气。总觉得好似只要不动，时间滞住，她与崔志宇就可以一直这样纠缠下去，不死不休。</p><p class="story-paragraph" data-source-key="2343:0">——恨也好，爱也好，谁也别放过谁 。</p><p class="story-paragraph" data-source-key="2345:0">釜山的雪比首尔迟来，暖温带海洋气候，冬暖夏凉，温度恒定。正因如此，就算是落雪，也化的很快，除却深山之中能够赏到些许雪景，在釜山的大多数地方，其实是看不到雪的。</p><p class="story-paragraph" data-source-key="2346:0">一星凉意落在鼻尖，很快就化成湿漉漉的一片，河览有些茫然。</p><p class="story-paragraph" data-source-key="2347:0">今天是她最后一个镜头，拍完杀青。</p><p class="story-paragraph" data-source-key="2348:0">学生气十足的装扮，齐膝百褶裙和灰色针织衫，勾了眼线，更显得一双狗狗眼无辜。</p><p class="story-paragraph" data-source-key="2349:0">某种程度上来说就连角色都饱受金宇宙偏爱，一路惨淡却难得有好结局，捧着心上人的情信同对方遥相望。</p><p class="story-paragraph" data-source-key="2350:0">一镜到底，好似什么都说了，又好似什么都没说。</p><p class="story-paragraph" data-source-key="2351:0">金珉周拍板喊卡，率先鼓掌。</p><p class="story-paragraph" data-source-key="2352:0">Carmen怀里抱一束花，及时递上去，香气透入倦怠神经，河览一怔，后知后觉所有人都在围着自己欢呼，也配合着，扯出一个温驯腼腆的笑。</p><p class="story-paragraph" data-source-key="2353:0">她不开心。</p><p class="story-paragraph" data-source-key="2354:0">金多绚看出来了，心里无声叹口气。</p><p class="story-paragraph" data-source-key="2355:0">但是没有回头的可能，也没有叫停的余地了</p><p class="story-paragraph" data-source-key="2356:0">金珉周早让人将河览的样片剪好送金宇宙邮箱，年后上映的电视剧噱头不小，忠武路上的影帝影后赏脸坐镇，名编名导联袂制作。制作方要热度，投资方要收益，捧红柳河览某种程度上算顺水推舟。</p><p class="story-paragraph" data-source-key="2357:0">走到这一步，很难不说是柳河览运气好，又很难讲柳河览只是因为运气好。运气好，遇到垂怜，从那种地方走出来，又有人不计代价的铺路，是很多人羡慕不来的；不止运气好</p><p class="story-paragraph" data-source-key="2358:0">金多绚早联系好媒体做曝，通稿存了好几百篇，所有人都轻轻地憋着这一口气，吹出去就要把柳河览捧到台前。</p><p class="story-paragraph" data-source-key="2359:0">雪来的是时候，海边降雪本就罕见，柳河览清秀皮相，怀里一捧花开正盛，白雪衬美人，恰到好处，相得益彰。</p><p class="story-paragraph" data-source-key="2360:0">她茫然环顾的时候金多绚排的几个站哥站姐搁在角落里，长枪短炮一阵狂闪。</p><p class="story-paragraph" data-source-key="2361:0">拎出来全是顶流爱豆的知名站子，神图叠出，多绚刷推找人眼都快瞎掉 。</p><p class="story-paragraph" data-source-key="2362:0">毕竟志宇递过来的那张卡没上限，多绚花别人的钱不心疼，造势宣发全部给到最顶。</p><p class="story-paragraph" data-source-key="2363:0">一堆人围把河览围在中间，各有各的热闹，簇簇地凑做一团欢声笑语 ，一并裹住设想里的光明未来。</p><p class="story-paragraph" data-source-key="2364:0">崔志宇同郑伊安站在这片热闹的不远处，场上热闹，就衬的两个人身形萧索，愈发寂寥。</p><p class="story-paragraph" data-source-key="2365:0">下雪了天冷，海面上吹过来的风有些凛冽。</p><p class="story-paragraph" data-source-key="2366:0">伊安手里攥着一把棒棒糖，嘴里也含着一根。百般无聊。</p><p class="story-paragraph" data-source-key="2367:0">她以前有抽烟的习惯，从舅舅手里接过釜山这边的几条水路之后就戒掉了。</p><p class="story-paragraph" data-source-key="2368:0">其实釜山这边的主业远不止这些，只是水路宽阔，船只往来的业务广又复杂，便她练手。</p><p class="story-paragraph" data-source-key="2369:0">涉及到灰色产业的行当人心险恶，伊安在这种环境里长大，耳闻目睹，只知道这上面与她打交道的人大多都似她人面兽心，保不齐哪天烟里掺点东西递过来。她倒是不抽，只是口袋里随时备着，见崔志宇面色阴沉就笑嘻嘻地拿出来抛过去。烟盒连同打火机一同被崔志宇轻飘飘接住，她低眸看一眼，伊安还是笑嘻嘻：“抽两口，上头了就开心了。”</p><p class="story-paragraph" data-source-key="2370:0">“我不抽烟。”崔志宇轻声拒绝，“伤脑。”她不喜欢烟味道，从小就不喜欢。</p><p class="story-paragraph" data-source-key="2371:0">此刻烟盒连同打火机一并静静躺在手里，应该是蓄意订制，打火机面上雪绒花同一笼旺盛月季交缠生长，她偏头看郑伊安一眼，无声询问。</p><p class="story-paragraph" data-source-key="2372:0">郑伊安还是笑眯眯的：“送你的，喜欢么?新婚贺礼。”</p><p class="story-paragraph" data-source-key="2373:0">老牌东西，预约排了老半天。</p><p class="story-paragraph" data-source-key="2374:0">这种喊打喊杀的人缺德，嘴里从来憋不出好，为数不多一点爱好，戳人痛处，伤口撒盐。</p><p class="story-paragraph" data-source-key="2375:0">杀人诛心，不过如此。</p><p class="story-paragraph" data-source-key="2376:0">“结不了也没关系咯。”</p><p class="story-paragraph" data-source-key="2377:0">郑伊安轻飘飘地讲。她把手掌在崔志宇面前摊开，棒棒糖一把，口味也多，青柠的、草莓的、什锦的…各式各样。崔志宇随手拿起一根草莓的剥开塞进嘴里。腮帮子被圆球儿撑得鼓起来，劣质的果香刺激味蕾。齿尖触着坚硬的糖面重重一咬，甜得太冲，几乎渗进牙龈里。</p><p class="story-paragraph" data-source-key="2378:0">难吃死了。</p><p class="story-paragraph" data-source-key="2379:0">“选择很多，你想的话。”</p><p class="story-paragraph" data-source-key="2380:0">见她拿起棒棒糖，伊安眼底笑意深些，溜圆眼睛嗔黑 ，裹着发自内心的笑意和恶意，一眼见不到底。：“做猎犬这种活路我擅长，雪绒花气息的omega要多少有多少。”</p><p class="story-paragraph" data-source-key="2381:0">比柳河览好看的，比柳河览可怜的，比柳河览活泼的，比柳河览倔的，像柳河览的…</p><p class="story-paragraph" data-source-key="2382:0">五花八门，应有尽有。</p><p class="story-paragraph" data-source-key="2383:0">只要崔志宇想要，她都会去找来。</p><p class="story-paragraph" data-source-key="2384:0">郑伊安明晃晃地把志宇当做要好的朋友。</p><p class="story-paragraph" data-source-key="2385:0">朋友做到她这个份上也算个性，想崔志宇顺遂平安，又不觉得崔志宇合该为着某个人交出真心，狼狈不堪。那样很不崔志宇。</p><p class="story-paragraph" data-source-key="2386:0">崔生性冷，郑生张狂，都是圈内独一份。</p><p class="story-paragraph" data-source-key="2387:0">都是天性。</p><p class="story-paragraph" data-source-key="2388:0">她很贴心地补充：“如果你只是对拍情色片的感兴趣，我也可以帮你找一位从头再来。”</p><p class="story-paragraph" data-source-key="2389:0">崔志宇摇了摇头：“算了。”</p><p class="story-paragraph" data-source-key="2390:0">远远看上去，河览大概真的走向了好的未来吧，被大家簇拥着，以后会有更大更好的平台，好似就够了。</p><p class="story-paragraph" data-source-key="2391:0">是她贪心不足，反噬自身。</p><p class="story-paragraph" data-source-key="2392:0">“算啦?”郑伊安把糖果嚼碎，有些意外，侧头看她，“身边养个人热闹，都是小猫小狗，养谁不是养?”</p><p class="story-paragraph" data-source-key="2393:0">“你身边那位呢?”崔志宇问。</p><p class="story-paragraph" data-source-key="2394:0">这是伊安没有预料到的问题，来的陡然，猝地把她呛住。但是她竟然真的认真开始思考。活泼开朗善良率真，向日葵一样的小狗性格 ，应该不是崔志宇喜欢的那一款。</p><p class="story-paragraph" data-source-key="2395:0">“我还没养够啦。”她哼哼笑，“玩腻了就送给姐姐吧。”</p><p class="story-paragraph" data-source-key="2396:0">难不成真被柳河览刺激成omega过敏，应该不至于 。郑伊安心底吐槽，面上不显，眼尖瞅到一众人簇拥河览离开，手机嗡嗡震动起来，多绚发消息问她和志宇要不要来河览的杀青宴。工作忙死还要陪崔志宇在这里抑郁，还去杀青宴，郑伊安白眼翻上天，婉拒之前礼貌问问崔志宇：“你要去吗?”</p><p class="story-paragraph" data-source-key="2397:0">崔志宇抿了嘴不说话，郑伊安认输，摆摆手：“知道了知道了，不去。”</p><p class="story-paragraph" data-source-key="2398:0">她低头回复多绚，抬眼倒是看到柳河览回头看过来，不得不说确实漂亮，长发似海藻 ，被大肠发圈松松吊成脑后马尾 ，换回寻常便服，纤细瘦小 ，很容易勾起人的怜惜心。</p><p class="story-paragraph" data-source-key="2399:0">雪还在下，不知疲倦，永无止境。</p><p class="story-paragraph" data-source-key="2400:0">郑伊安嘴角勾起来，远远冲河览弯个要笑不笑的弧度。</p><p class="story-paragraph" data-source-key="2401:0">“走了。”崔志宇说，“还有事要忙。”</p><p class="story-paragraph" data-source-key="2402:0">确实太忙，缓和剂背靠政策，又有技术支撑，任谁看都是一块儿诱惑力巨大的饼。投标公司只多不少，光是釜山几家的评估就已经让人忙的够呛，纵然是志宇把工作时间压缩又压缩，几乎玩儿命，伊安帮忙，又审报告又看数据，专业不懂还得到处去问，忙的棱角磨平，满地找头，已经是活人微死的程度。</p><p class="story-paragraph" data-source-key="2403:0">她忙志宇更甚，一面协助评估团队，另一面同首尔那边的工作也远远的挂着。</p><p class="story-paragraph" data-source-key="2404:0">线上开会是常态，临床数据时好时坏，递到志宇手里还要再做拆解和分析。</p><p class="story-paragraph" data-source-key="2405:0">思维和精神紧绷，不敢松懈半分，以至于连借酒浇愁也是奢望。</p><p class="story-paragraph" data-source-key="2406:0">太清醒，关于河览的裂痛被她轻飘飘地堆在心脏上，无孔不入。</p><p class="story-paragraph" data-source-key="2407:0">原来把一个人从自己的生命里彻底剥离，是一件这么痛苦的事。</p><p class="story-paragraph" data-source-key="2408:0">可是她说不出口。</p><p class="story-paragraph" data-source-key="2409:0">痛苦到极致，好似连多见一面的勇气也没有。</p><p class="story-paragraph" data-source-key="2410:0">伊安欲言又止地看她，终于后知后觉好似方才玩笑开的太过，没有经历过情爱的人凑这种热闹，就算置身其中也似雾里看花。</p><p class="story-paragraph" data-source-key="2411:0">看不清楚，吃不明白，只觉得崔志宇站在那里，摇摇欲坠，好似下一秒就要倒过去。</p><p class="story-paragraph" data-source-key="2412:0">太痛苦，太沉默，经历的人似吞针滚火，相关联的看客又能好到哪里去?</p><p class="story-paragraph" data-source-key="2413:0">伊安攒着一口气，沉沉地叹出来。</p><p class="story-paragraph" data-source-key="2414:0">“走啦，先把你自己的事解决好吧。”</p><p class="story-paragraph" data-source-key="2416:0">娱乐圈似名利场，衣香鬓影是常态，推杯换盏是常态，应酬也是常态。</p><p class="story-paragraph" data-source-key="2417:0">这是躲不了的。</p><p class="story-paragraph" data-source-key="2418:0">宇宙对河览很好，唯独这种事情绕不过。杀青宴定在不远处一家网红餐厅，做釜山本地特色，烤肉好吃 ，海鲜也不错，临着港口就敢仗着食材新鲜，菜单一季一推，时兴又应季。</p><p class="story-paragraph" data-source-key="2419:0">Carmen忙着给柳河览的碟里堆好吃的，终于过了身材管控的时候，朴实的印尼人发自内心的觉得这位该多吃一点补一下了。</p><p class="story-paragraph" data-source-key="2420:0">去的基本上是年轻人，吃的多话也多，活力满满举着倒满的扎啤讲万岁啊！我们柳哈懵小姐终于杀青了。</p><p class="story-paragraph" data-source-key="2421:0">天知道金宇宙和金珉周两个人抓她的细节有多变态，半个月下来全剧组人好似脱了几层皮，相较二位以前最严苛的时候有过之无过及。</p><p class="story-paragraph" data-source-key="2422:0">气氛热闹，河览抓着酒杯，有些不知所措。</p><p class="story-paragraph" data-source-key="2423:0">她什么都说不出来，只是机械地举着杯子，随着大家的欢呼乖乖地仰头，一点点的把杯子里的啤酒喝干净了。</p><p class="story-paragraph" data-source-key="2424:0">好苦，不想喝，志宇姐姐在就好了。</p><p class="story-paragraph" data-source-key="2425:0">她闷闷地想。</p><p class="story-paragraph" data-source-key="2426:0">是志宇姐姐，不是崔志宇。</p><p class="story-paragraph" data-source-key="2427:0">她的小狗。</p><p class="story-paragraph" data-source-key="2428:0">再也找不到的志宇小狗。</p><p class="story-paragraph" data-source-key="2429:0">啤酒一杯一杯下肚，心事太重，被澄黄色的液体携裹着往下坠，坠的河览心脏沉沉。分明酒酣耳热，意识却无比清醒，鼻尖上萦绕着的月季花香挥之不去，克莱尔奥斯汀，种在阳台上的花，崔志宇的信息素。</p><p class="story-paragraph" data-source-key="2430:0">她昏昏沉沉，散了场被多绚架着，慢吞吞往保姆车里走。</p><p class="story-paragraph" data-source-key="2431:0">近凌晨的点，餐馆附近还是热闹，不夜天夜夜常有，热闹一片，没来由又让她觉得形单影只，分外寂寞。这种时候，人也是轻飘飘的，不知梦里梦外，如真似幻。</p><p class="story-paragraph" data-source-key="2432:0">她好像明白了为什么有人喜欢喝酒，可是酒好难喝，太苦了，心底涩涩的，想掉眼泪。</p><p class="story-paragraph" data-source-key="2433:0">迷迷糊糊地，听到了叹气声。</p><p class="story-paragraph" data-source-key="2434:0">多绚好像遇到了什么人，止了步，同对方交谈，河览脑袋垂着，整个人都无力。迷迷糊糊地往前扑，嗅到轻淡的白茶香气。那是志宇姐姐惯用的香水。</p><p class="story-paragraph" data-source-key="2435:0">应该是睡着了，做梦了，所以志宇姐姐回来了。</p><p class="story-paragraph" data-source-key="2436:0">她埋在对方怀里，小心翼翼吸了一口香，餍足又想落泪。</p><p class="story-paragraph" data-source-key="2437:0">老家那边的小狗们伶俐又护主，河览在很小的时候就很想养一只小狗，黑白毛色，眼睛圆溜溜亮晶晶，只有她，只爱她。</p><p class="story-paragraph" data-source-key="2438:0">小狗是世界上最忠心的动物，不会把她一个人丢在梦里。</p><p class="story-paragraph" data-source-key="2439:0">扑进怀里的人轻飘飘的，好像比离开首尔的时候更瘦，崔志宇接住她的时候心脏沉沉漏一拍。</p><p class="story-paragraph" data-source-key="2440:0">多绚叹气，不忍再看，索性别开眼。</p><p class="story-paragraph" data-source-key="2441:0">耳朵被轻轻地捻住，低头就看到河览亮晶晶水汪汪的眼睛，是真的噙着一包眼泪，碰一碰就要落下。</p><p class="story-paragraph" data-source-key="2442:0">她心都快碎了，不知所措，徒劳地收紧手臂把河览死死圈住，恨不得把她揉进自己骨子里。</p><p class="story-paragraph" data-source-key="2443:0">“被灌了很多酒。”多绚轻轻讲，“剧组里有人卖资历，没人知道她靠着你，会欺负她。”</p><p class="story-paragraph" data-source-key="2444:0">名利场都势利，只有导演和编剧的垂青不够，很多双眼睛不止盯柳河览，也悄悄探听柳河览背后，没有探到背后有人。那些轻飘微妙的恶意就藏不住，会在酒桌上肆无忌惮的跑出来。</p><p class="story-paragraph" data-source-key="2445:0">根深蒂固，这么多年向来如此。</p><p class="story-paragraph" data-source-key="2446:0">“对不起。”</p><p class="story-paragraph" data-source-key="2447:0">崔志宇的声音也轻轻，她好看不到哪里去，眼眶红透，眼下一片浅淡的青，好几天睡不好觉，又被暴烈的情绪折磨，说形容憔悴也不过分。</p><p class="story-paragraph" data-source-key="2448:0">肩上被雪浸的湿透，应该也是在外面站了许久，整个人看上去狼狈不堪。</p><p class="story-paragraph" data-source-key="2449:0">“和我说有什么用。”多绚叹息道。</p><p class="story-paragraph" data-source-key="2450:0">“是我不好。”好似真的变成了只会认错的机器，志宇的声音也是嘶哑的。</p><p class="story-paragraph" data-source-key="2451:0">耳朵被河览轻轻地捏着，对方好似还未意识到自己所处并非梦境，只觉得她的小狗好似终于舍得在梦中来见她一面，脑袋蹭了蹭她的肩膀，河览低低唔了一声：“好冷。”</p><p class="scene-break" data-source-key="2452:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2453:0">崔志宇垂着眸，鼻尖轻轻蹭了蹭她的发顶：“回去就不冷了。”</p><p class="story-paragraph" data-source-key="2454:0">她轻轻说，小声哄，万分珍重，万分小心。</p><p class="story-paragraph" data-source-key="2455:0">金多绚站在一旁，静静注视，不知为何，总觉得鼻尖发酸，好似也想落下眼泪。</p><p class="story-paragraph" data-source-key="2456:0">“先上车吧。”她滚动喉头，轻声讲。</p><p class="story-paragraph" data-source-key="2457:0">郑伊安倚在不远处等她们，领航员泊在她的身后，如同缄默固守的骑士。</p><p class="story-paragraph" data-source-key="2458:0">一路无话，司机在前侧开车，伊安坐副驾，百般无聊，伸手点开车载。</p><p class="story-paragraph" data-source-key="2459:0">过午夜，正是心事浓浓时，电台逢到点播高峰，播出时兴曲。</p><p class="story-paragraph" data-source-key="2460:0">沉沉歌声轻轻柔柔飘，粤语歌，男中音，调子柔长，多绚同港佬厮混许久，听出是陈奕迅。</p><p class="story-paragraph" data-source-key="2461:0">她支着腮，窗外路灯飞闪，晃花多绚眼睛，她手指轻轻敲，跟着节奏，默默在心底轻轻哼。</p><p class="story-paragraph" data-source-key="2463:0">蝴蝶记忆很短 留下什么恩怨</p><p class="story-paragraph" data-source-key="2465:0">回头像隔世一笑便算</p><p class="story-paragraph" data-source-key="2467:0">并未在一起亦无从离弃</p><p class="story-paragraph" data-source-key="2469:0">不用沦为伴侣 别寻是惹非</p><p class="story-paragraph" data-source-key="2471:0">车过广安里大桥，灯光明灭。</p><p class="story-paragraph" data-source-key="2472:0">河览这个人，性格安静，喝多了也安静，傻乎乎笑，抱着志宇不撒手。</p><p class="story-paragraph" data-source-key="2473:0">上车了闹好一会终于靠住志宇的肩膀消停片刻，只是睡不安稳，明晃晃的灯光晃过眼睛，河览本能蹙眉，哼哼两声。直到眼前被温热手掌轻轻覆住，刺眼光线被隔开，白茶香水的气息柔软地围住她，模糊悬吊的心骤地放下去，河览又昏昏睡过去。</p><p class="story-paragraph" data-source-key="2474:0">志宇抬手替她遮住眼睛，轻轻将她拢进怀里。</p><p class="story-paragraph" data-source-key="2475:0">这种低眉顺眼的样子哪里是郑伊安和金多绚见过的，两人透着后视镜无声对过一眼，都从对方脸上读到沉沉一声叹。</p><p class="story-paragraph" data-source-key="2476:0">领航员一路无声，轻巧飘过广安里，过午夜，车流较白日少下去许多，一望无际的宽阔桥面，灯光碎在海浪波涛里，潮浪拍打桥柱，声声绻绻，一下又一下。</p><p class="story-paragraph" data-source-key="2477:0">雪没有停，纷纷扬扬地往下落，好像永远不会停，下车的时候志宇把河览整个地裹进大衣里。</p><p class="story-paragraph" data-source-key="2478:0">河览真的太瘦，窝在浅灰色的大衣里面，小小的一只，像毛茸茸的小动物。</p><p class="story-paragraph" data-source-key="2479:0">伊安和多绚跟在两人身后，如同两棵浸进阴影里的树，沉默无声。</p><p class="story-paragraph" data-source-key="2480:0">电梯门打开，伊安还想跟进去，被多绚拉住，轻轻地摇了摇头。</p><p class="story-paragraph" data-source-key="2481:0">两个人需要时间独处，需要时间和解。甚至就算是只是道别，此生最后一面，也需要在只有彼此的空间里。</p><p class="story-paragraph" data-source-key="2482:0">伊安嗤一声，别头去看电梯层数跳动，从一跳到十九只是须臾，一生也是须臾，好似命中注定，也像身不由己。</p><p class="story-paragraph" data-source-key="2483:0">崔志宇遇到真爱身不由己，她与金多绚被迫做上爱情保安也是身不由己。</p><p class="story-paragraph" data-source-key="2484:0">她陪崔志宇在不远处淋一晚上雪，街灯明晃晃，两人就站在路灯下望着那个餐厅里边，透亮橱窗里灯光明亮，推杯换盏，欢声笑语。伊安怕冷，最讨厌冬天。</p><p class="story-paragraph" data-source-key="2485:0">因为小时候在冬天经历过被绑架，被吊在釜山的海面上吹了整整两个小时的冷风，太煎熬，在ICU里捱了整整两个周，被包成木乃伊，身上没有一块好肉。</p><p class="story-paragraph" data-source-key="2486:0">很难讲活到现在的郑伊安到底是人是鬼，但是如果站在崔志宇的身边，伊安就只是郑伊安。无论是人是鬼都是志宇姐姐为数不多的朋友，正是因为是朋友，如果就连她也不陪着崔志宇，雪这么大，她也不知道崔志宇应该怎么办了。</p><p class="story-paragraph" data-source-key="2487:0">冷意浸着，手脚被冻的发麻。几乎就要唤起藏在骨子里的幻痛。伊安闭了闭眼睛，仿若置身在九岁那年的海面之上，潮湿阴冷的痛意挥之不去，被她有意识藏住。又在这种寻常夜晚缓缓抽枝发芽，遍布血脉。</p><p class="story-paragraph" data-source-key="2488:0">多绚感知力敏锐，一眼察觉到伊安状态不对：“最近你有好好吃药吗?”</p><p class="story-paragraph" data-source-key="2489:0">“有吧。”</p><p class="story-paragraph" data-source-key="2490:0">伊安随口敷衍，藏在袖子里的手疼的发颤，但是她面上不显，从善如流扯出笑意，随手从兜里摸出巧克力递给多绚：“有时候忙忘了会少吃。”</p><p class="story-paragraph" data-source-key="2491:0">其实吃多吃少，吃与不吃，没有差别。</p><p class="story-paragraph" data-source-key="2492:0">芬兰产的牛奶巧克力，很精致的糖果包装，蓝金相间的铅箔纸精致又漂亮，不是什么大牌，但是适口。</p><p class="story-paragraph" data-source-key="2493:0">崔志宇买的。</p><p class="story-paragraph" data-source-key="2494:0">多绚咬着巧克力，声音含含糊糊的：“还是按时吃药。”</p><p class="story-paragraph" data-source-key="2495:0">“好。”伊安简短的答应她，转身向门口走去，“回啦。”</p><p class="story-paragraph" data-source-key="2496:0">她声音轻快，不再回头，痛意钻骨，几乎快要把她整个人都要锯裂开的痛楚，铺天盖地，汹涌而来。果然冬天是最讨厌的，冷意彻骨，就算独居的别墅里灯火通明，地暖把整个房子都烘的四季如春，桌上摆着从南半球运来的热带水果，可是一旦入冬，身体也好似回到了那些冷冰冰的时日。这几年回首尔，冬日里有志宇和多绚陪着，砭骨的痛感好久不来侵扰，久到她总觉得自己好似身心痊愈，除了手段狠点，做些见不得光的东西，也总和正常人无误。</p><p class="story-paragraph" data-source-key="2497:0">现今这种剧痛又汹涌而来，无声又剧烈，痛的她整个人都想蜷缩起来。</p><p class="story-paragraph" data-source-key="2498:0">拉开车门率先坐进去，车窗被敲了敲，郑伊安迟钝地抬了眼。</p><p class="story-paragraph" data-source-key="2499:0">她降下车窗，看到金多绚站在车外，还是欲言又止。</p><p class="story-paragraph" data-source-key="2500:0">她的眼睛同志宇一样，琥珀色，剔透又明媚。狐狸相，长得好，笑起来似须臾间花开的春天。</p><p class="story-paragraph" data-source-key="2501:0">只是现今这双眼忧心忡忡地望着郑伊安。</p><p class="story-paragraph" data-source-key="2502:0">一波未平一波又起，伊安突然觉得多绚好可怜，担心完这个担心那个。</p><p class="story-paragraph" data-source-key="2503:0">她摇摇头，示意多绚安心，车窗升起，伊安将座椅放平，整个人用尽力气地躺下去。</p><p class="story-paragraph" data-source-key="2504:0">司机从她十三岁起就跟着她，算一路看着她长大，知晓伊安这种时候不愿被人见到。不能多问 ，能够做的只能尽力把车开稳一点，开慢一点</p><p class="story-paragraph" data-source-key="2505:0">疼痛似潮水一样涌过来，一点一点，把她兜头淹没。郑伊安的手抬起来，费劲摸到旁侧置物框，捞出一板药。她闭着眼，抠出两粒药片塞进嘴里，然后咀嚼。很苦的东西，碎碎地填住舌尖齿间，苦意顺着喉口往下窜。她闭着眼睛，深深呼吸，任由药效泛起，疲倦席卷整个意识。</p><p class="story-paragraph" data-source-key="2506:0">好痛啊。</p><p class="story-paragraph" data-source-key="2507:0">意识昏昏的，动弹不得，身体僵直，换作以往只需要等待就好了。</p><p class="story-paragraph" data-source-key="2508:0">放空意识，任由药效和倦意浸泡，换做往日，脑海中应是一片死寂才对。</p><p class="story-paragraph" data-source-key="2509:0">只是这次不同，恍惚着她好似做着梦。</p><p class="story-paragraph" data-source-key="2510:0">崔志宇浅珀色的冷淡的眼睛，那只小狗掉成樱花色的头发，首尔纷纷扬扬的雪，釜山夜海里永不熄灭的灯塔，一望无际的广安里大桥，还有…</p><p class="story-paragraph" data-source-key="2511:0">眼睑颤动，伊安骤然挤出一声痛苦的呜咽。</p><p class="story-paragraph" data-source-key="2512:0">——电梯合拢，被吞没的崔志宇的背影。</p><p class="story-paragraph" data-source-key="2513:0">冬令时之后夜长昼短，以至于崔志宇醒过来的时候天还未亮，透过落地飘窗往外眺，夜幕下的海洋辽阔，灯塔不知疲倦照射，渔船出港，广安里大桥上车灯明亮，一辆接过一辆。床头手机嗡嗡震动，有短讯接进来，崔志宇没有心情捞起来看。她在沙发上躺了好一会儿，默默然撑起身子。河览第一次喝酒，喝多了就呼呼睡。</p><p class="story-paragraph" data-source-key="2514:0">志宇记得她应是完成了片场拍摄，杀青宴后应该择日就要回首尔。</p><p class="story-paragraph" data-source-key="2515:0">行李箱摊在地上，还没有收拾好。</p><p class="story-paragraph" data-source-key="2516:0">她把河览放到床上，热毛巾细致擦过手腕脚踝，帮着河览洗脸的时候对方咕咕哝哝地张手要抱，从上次她离开之后两个人再未好好说过话，志宇没办法拒绝她。俯身下去，又重重地将河览抱进怀里。</p><p class="story-paragraph" data-source-key="2517:0">事到如今，是她咎由自取，怪不得谁。</p><p class="story-paragraph" data-source-key="2518:0">“狗狗。”河览迷迷糊糊地讲梦话，不管不顾往她怀里钻，“志宇狗狗。”</p><p class="scene-break" data-source-key="2519:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2520:0">崔志宇垂着眼，眼眶涨的厉害，眼前水雾模糊，她低低咳一声，说不出话。</p><p class="story-paragraph" data-source-key="2521:0">可是河览真是仗着意识糊涂，不管不顾了。</p><p class="story-paragraph" data-source-key="2522:0">唇瓣贴住志宇的脖颈亲了又亲，好舍不得，整个人都被克莱尔奥斯汀的气息死死泡住才有半分实感，现实里远去的人在梦中去而复返，失而复得，好像碎掉的心脏的轻轻地被拼好，又在胸腔里短暂地跳动起来。</p><p class="story-paragraph" data-source-key="2523:0">“我想你。”</p><p class="story-paragraph" data-source-key="2524:0">她断断续续，低低钝钝。</p><p class="story-paragraph" data-source-key="2525:0">好想你。</p><p class="scene-break" data-source-key="2526:0" aria-label="场景分隔">……</p><p class="story-paragraph" data-source-key="2527:0">“汪。”</p><p class="story-paragraph" data-source-key="2528:0">崔志宇哑着嗓子，低低的，有一点笨。</p><p class="story-paragraph" data-source-key="2529:0">她学狗叫也不可爱，河览皱皱鼻子，脑袋往志宇的怀里蹭了蹭：“不可爱。姐姐。不可爱。”</p><p class="scene-break" data-source-key="2530:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2531:0">“好想你，好想你。”</p><p class="story-paragraph" data-source-key="2532:0">她翻来覆去，好似只会讲这句。压在舌尖上的情绪滚烫，清醒时刻不敢松懈半分。只有糊涂时才敢放松心绪，任由关于崔志宇的所有汹涌而来，把她铺天盖地兜头淹没。</p><p class="story-paragraph" data-source-key="2533:0">“酒好难喝。”</p><p class="scene-break" data-source-key="2534:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2535:0">“不喜欢演戏。”</p><p class="scene-break" data-source-key="2536:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2537:0">“他们欺负我。”</p><p class="story-paragraph" data-source-key="2538:0">酒精催话，河览絮絮叨叨地念，一股脑全部讲出来。</p><p class="story-paragraph" data-source-key="2539:0">“崔志宇也欺负我。”</p><p class="story-paragraph" data-source-key="2540:0">“崔志宇也是你的小狗。”志宇声音轻轻地念她，“志宇姐姐是你的小狗，小啾也是你的小狗，崔志宇也是你的小狗。”</p><p class="scene-break" data-source-key="2541:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2542:0">河览摇了摇头，含糊咕哝：“崔志宇不是。”</p><p class="story-paragraph" data-source-key="2543:0">“崔志宇是。”志宇学着她的语气反驳，可是不敢讲太大声，理不直气不壮，只是弱弱的，很固执，“是你的小狗。”</p><p class="story-paragraph" data-source-key="2544:0">只是你的小狗。</p><p class="story-paragraph" data-source-key="2545:0">河览有些困惑，舌头被酒精浸的发麻，讲不过崔志宇，只能皱着鼻子咕咕哝哝：“那只小狗太贵了，我养不起，她不愿意。”</p><p class="story-paragraph" data-source-key="2546:0">“…。”</p><p class="story-paragraph" data-source-key="2547:0">“她把我的小啾也养的好贵。”河览声音低低，语气迟迟，“小啾也不是我的小狗了。跟着我的日子很苦，小啾不愿意。”</p><p class="story-paragraph" data-source-key="2548:0">我没有小狗啦。</p><p class="story-paragraph" data-source-key="2549:0">她轻轻的，糊里糊涂的，这么想。有一点点难过，但是不知道为什么难过。</p><p class="story-paragraph" data-source-key="2550:0">没有小狗的人生过了十九年也是过了，翻年满二十，只要活着就要走更长的路，有小狗没小狗人生都会过下去，大不了以后自己买一只小狗，亲手养到大。</p><p class="story-paragraph" data-source-key="2551:0">不管什么都给到最好，好似这样就能确确凿凿地明了——小狗的一生只有她，小狗的一生只爱她。</p><p class="story-paragraph" data-source-key="2552:0">“小啾愿意。”崔志宇说，她声音很低，慢生生，一点一点缓缓讲，“小啾只是你的小狗。”</p><p class="story-paragraph" data-source-key="2553:0">末了，也在心底轻轻想。</p><p class="story-paragraph" data-source-key="2554:0">我也愿意。</p><p class="story-paragraph" data-source-key="2555:0">我好愿意做你的小狗，你要不要试试继续养养我看。</p><p class="story-paragraph" data-source-key="2556:0">她说不出口，只能低低地叹。</p><p class="story-paragraph" data-source-key="2557:0">夜好长，总觉得现在每分每秒都似从命运手里偷来。如果离别是注定，河览睁眼醒来还是满目怨憎苦痛。志宇的心脏柔软，吃不住这种刀剜似的目光。</p><p class="story-paragraph" data-source-key="2558:0">少年时陪金宇宙一同看电视剧，只觉真心荒谬，可笑又廉价。</p><p class="story-paragraph" data-source-key="2559:0">现今再吃一记当年回旋镖，实在不愿再见河览眼底的苍凉厌恶，不敢见，只想一想便觉得心口生疼。</p><p class="story-paragraph" data-source-key="2560:0">崔志宇最讨厌逃兵，又无处可选，只在柳河览面前一次次做自己最讨厌的人。</p><p class="story-paragraph" data-source-key="2561:0">走出酒店的时候，雪已经停了。</p><p class="story-paragraph" data-source-key="2562:0">天蒙蒙亮，地面湿漉漉的，空气积攒着一层薄薄的冷意。</p><p class="story-paragraph" data-source-key="2563:0">一夜未又好眠，以至于形容憔悴，糟糕形象总有人不嫌弃，角落里桑塔纳鸣笛两声，车窗降下，露出一张笑眯眯的男人的脸：“志宇小姐。”</p><p class="story-paragraph" data-source-key="2564:0">是Beta，长着很柔很俊的一张脸，应也是整夜在酒店门口蹲守。看到崔志宇困惑的目光，他柔声讲：“我们见过。”</p><p class="story-paragraph" data-source-key="2565:0">志宇记起来了，windsky生物科技的代表。应是前几日她们走访的最后一家，因为设备老旧没有通过初步筛查，评估团队离开的时候就是这个男人一路送着到门口，贴心为每个人送上名片。</p><p class="story-paragraph" data-source-key="2566:0">她想起来那张名片被她随手揣进大衣里，索性直接当着这位的面拿出来看，浅蓝色纸背，正面漆黑一片，亮银色条纹交织汇成十二芒星——神似大解脱圆的标志</p><p class="story-paragraph" data-source-key="2567:0">崔志宇的眼皮跳了跳，目光扫到角落里的名字上。</p><p class="story-paragraph" data-source-key="2568:0">李河率。</p><p class="story-paragraph" data-source-key="2569:0">她在拜托伊安调过二二年教堂纵火案的卷宗，看到组织者的那一栏里过这个名字。</p><p class="story-paragraph" data-source-key="2570:0">崔志宇把名片放下，男人依旧笑盈盈的看着她：“方便上车聊聊么?”</p><p class="story-paragraph" data-source-key="2571:0">好似有备而来，他慢吞吞，将手里的信封递给崔志宇。</p><p class="story-paragraph" data-source-key="2572:0">崔志宇垂眸，抽出信纸展开。</p><p class="story-paragraph" data-source-key="2573:0">白纸，印着烫金纹路，十二芒星跃然其上，每一个星角处都挂着灰暗的名字，总共挂了十一个，剩余一角的字体朱红，明晃晃地喇着崔志宇的眼睛。</p><p class="story-paragraph" data-source-key="2574:0">——柳河览。</p><p class="story-paragraph" data-source-key="2575:0">和她在那个废弃的教堂里看到的图案一模一样。</p><p class="story-paragraph" data-source-key="2576:0">河率依旧笑眯眯地看着她，他有一双很清澈的眼睛，明媚阳光，一眼能够望到底。</p><p class="story-paragraph" data-source-key="2577:0">很难想这种和气的人就是当年教堂纵火案的组织者之一，现在拿着条件站在崔志宇面前，吃定这位的软肋，便笃定崔志宇会心甘情愿，乖乖上车。</p><p class="story-paragraph" data-source-key="2578:0">这是一种势在必得的从容。</p><p class="story-paragraph" data-source-key="2579:0">后车门响动，崔志宇躬身坐进来，毫不犹豫。</p><p class="story-paragraph" data-source-key="2580:0">这在他意料之中——</p><p class="story-paragraph" data-source-key="2581:0">首尔那边丢过来的消息很荒谬，现在看过来，好似越荒谬的东西反而越接近真实。</p><p class="story-paragraph" data-source-key="2582:0">只是被后视镜照出来的眼睛冷冷的，很似冬天山里的结冰的溪流，冻的人瑟瑟发抖。</p><p class="story-paragraph" data-source-key="2583:0">“这算绑架吗?”</p><p class="story-paragraph" data-source-key="2584:0">“绑架志宇小姐的代价太大了。”李河率笑眯眯的，“我还是比较擅长邀请。”</p><p class="story-paragraph" data-source-key="2585:0">一面说，一面轻轻踩动油门：“走啦，谈谈就好啦。”</p><p class="story-paragraph" data-source-key="2586:0">他声音很轻：“志宇小姐也不希望河览小姐真的成为最后一个祭品吧?”</p><p class="story-paragraph" data-source-key="2587:0">轻飘飘的声音慢吞吞地吐着这种话，有一点刺耳。却在好似在骤然之间扼住了崔志宇的七寸。</p><p class="story-paragraph" data-source-key="2588:0">——只要捏住柳河览三个字，就能吃死崔志宇。</p><p class="story-paragraph" data-source-key="2589:0">是真的。</p><p class="story-paragraph" data-source-key="2590:0">李河率抬眼，毫不畏惧地同后视镜里投出来的那双眼相视。</p><p class="story-paragraph" data-source-key="2591:0">好漂亮一双眼，同他一样的浅珀色，冷的似结了两眼霜，浅浅地凝着一层怒气。</p><p class="story-paragraph" data-source-key="2592:0">崔家兄妹双生，都是一等一的貌美，这是他很早就知道的事情。</p><p class="story-paragraph" data-source-key="2593:0">桑塔纳来时无声，去时无声。如同一道轻巧的影子滑入薄薄的晨霭之中，消失不见。</p><p class="story-paragraph" data-source-key="2594:0">河览醒过来的时候，天光大亮。</p><p class="story-paragraph" data-source-key="2595:0">收拾好行李箱安静地靠在角落里，有人来过，沉默做好一切，又悄悄走了。</p><p class="story-paragraph" data-source-key="2596:0">她迟钝，发麻脑子转不过来，眨眨眼睛。</p><p class="story-paragraph" data-source-key="2597:0">也许知道谁来过，只是有一个声音在她脑海里轻轻地讲着，还是不要知道的好。</p><p class="story-paragraph" data-source-key="2598:0">不要心软，不要动摇，不要被欺骗。</p><p class="story-paragraph" data-source-key="2599:0">她支起身子，不远处桌子上放着一盅汤，应是掐准她醒过来的时间，汤温温热，清甜滋润，熨帖她被酒精折腾一夜的胃。</p><p class="story-paragraph" data-source-key="2600:0">柳河览慢吞吞，一勺勺，全喝完。</p><p class="story-paragraph" data-source-key="2601:0">Carmen给她发消息，后续行程不多，访谈拍照，多数是在釜山，大抵还要留一两周时间。</p><p class="story-paragraph" data-source-key="2602:0">她一目十行看完，没有回复，喝完汤，勺子轻轻放回白瓷盅。</p><p class="story-paragraph" data-source-key="2603:0">放在床头的领带不见了，大抵那人离去时也将她的礼物一并带走。</p><p class="story-paragraph" data-source-key="2604:0">告白的告字还未写完，一转眼已是告别。</p><p class="story-paragraph" data-source-key="2605:0">命运偏爱戏弄人，好生残忍。</p><p class="story-paragraph" data-source-key="2606:0">崔志宇消失的不动声色，但是偏生做不干净手脚，处处都留过她的痕迹。</p><p class="story-paragraph" data-source-key="2607:0">接下来的时日，她果然没在出现在柳河览身边，无论是拍摄、亦或者是访谈，那道孤独伫立的身影再也未出现过，这个人消失的毫无征兆，好似一滴水融入大海似地融进人群。</p><p class="story-paragraph" data-source-key="2608:0">多绚很少在她面前提崔志宇，给志宇发的消息都似石沉大海，再也未有回复。联系不上，多绚万分焦躁，联系郑伊安时才知崔志宇已失踪两周，两人去调酒店监控，发现她在那日凌晨上了一辆桑塔纳，车牌是假的，无从查证。</p><p class="story-paragraph" data-source-key="2609:0">这种事情多绚哪里敢和柳河览讲。</p><p class="story-paragraph" data-source-key="2610:0">郑伊安找她找到发疯，几乎快把釜山整座城市翻过一遍 ，高压状态下精神又崩溃一次，被五花大绑抬进医院里的特护病房。</p><p class="story-paragraph" data-source-key="2611:0">找不到志宇的感觉，好似又被吊回九岁那年的釜山海面上，冷风彻骨，幻痛到之前常吃的药片也压不住。</p><p class="story-paragraph" data-source-key="2612:0">糟糕的事不止崔志宇失踪一件。</p><p class="story-paragraph" data-source-key="2613:0">缓和剂数据泄露，调价政策推行受阻，郑议员在国会上遭受弹劾，冠岳山上的研究部多次遭受袭击，安保力量一加再加。好似一瞬之间腹背受敌。</p><p class="story-paragraph" data-source-key="2614:0">伊安困在病房里，烂额焦头。</p><p class="story-paragraph" data-source-key="2615:0">她同父亲通电话，对方好似不急，依旧沉沉稳稳音调，只讲让她养好身体。</p><p class="story-paragraph" data-source-key="2616:0">好似所有人都在对立的政党发起来的反扑里不约而同地选择了缄默和等待，到底在等待什么？</p><p class="story-paragraph" data-source-key="2617:0">伊安毕竟年轻，还未养成国会中那群老人似地有泰山崩于前而不改色的性格。</p><p class="story-paragraph" data-source-key="2618:0">没有找到志宇的时日里，她只觉得自己活成了一只热锅上的蚂蚁，度日如年，担心又煎熬。</p><p class="story-paragraph" data-source-key="2619:0">转机在金主恩终于将数据里的最后一点瑕疵剔除，依着之前的考察数据迅速地敲定厂商与生产线，首大牵头，背靠国会研究的药剂面世，许多东西须臾之间彻底反转，调价政策通过国会正式出台，新闻版面连报几天。伊安缩在病房里看新闻播报，看崔教授坐在办公室里面朝镜头背书，又见自己的父亲和崔志宇的父亲并肩走出国会，向来不和的议员们因为一桩政策握手言和，并肩作战，是大家喜闻乐见的happy ending。</p><p class="story-paragraph" data-source-key="2620:0">只是崔志宇不见了。</p><p class="story-paragraph" data-source-key="2621:0">伊安抬手按下遥控器关了电视，暴躁又难过。</p><p class="story-paragraph" data-source-key="2622:0">为什么所有人都默契地装作不知道志宇姐姐失踪了这件事？就连柳河览也在心安理得地接受着采访。</p><p class="story-paragraph" data-source-key="2623:0">伊安刷到过相关片段，容光焕发，光鲜万分。</p><p class="story-paragraph" data-source-key="2624:0">原来崔志宇离开了你也过得很好啊。</p><p class="story-paragraph" data-source-key="2625:0">她握着手机，又冷又硬地注视着屏幕。</p><p class="story-paragraph" data-source-key="2626:0">真替志宇姐姐难过。</p><p class="story-paragraph" data-source-key="2627:0">突兀蒸发，好似没有人记得她，没有人挂怀她，好似也没有人想念她。</p><p class="story-paragraph" data-source-key="2628:0">日子一天天就这么过。</p><p class="story-paragraph" data-source-key="2629:0">复活节过了，圣诞过了，一踵至快到年底。热闹的城市，逢节假日歌舞升平。</p><p class="story-paragraph" data-source-key="2630:0">港口入夜有烟花放，头几年伊安和志宇的圣诞节都在这里过，她喜欢热闹，志宇一直把她当做小孩子，专门差人包船到海面上放很多烟花。砰砰声响，烟花绚烂，不夜城上天不夜。</p><p class="story-paragraph" data-source-key="2631:0">崔志宇性格冷，只是在宠爱里长大，从小在爱里被泡大的人最懂怎么对人好。</p><p class="story-paragraph" data-source-key="2632:0">伊安闭了闭眼，一想到这些就只觉得充斥四肢的幻痛快要蔓延到心脏。</p><p class="story-paragraph" data-source-key="2633:0">她咬了咬牙，努力不去想。</p><p class="story-paragraph" data-source-key="2634:0">一整三个星期，她竭尽全力，动了手里所有的关系线去找，徒劳无功。只是习惯海港处年年热闹，今年依旧有人去放烟花。只是好奇怪，少了崔志宇放的，就显得整个海港格外冷清。伊安太讨厌冷清了，所以也打电话下去，让手底下人按着往几年的规格又在海面上放了一场同样盛大的烟花。</p><p class="story-paragraph" data-source-key="2635:0">那时候想的单纯，总觉得她和崔志宇这样的就该凑到一处，年年岁岁都在这里过。</p><p class="story-paragraph" data-source-key="2636:0">好日子没过几年就要落空，郑伊安扯扯嘴角，有点想笑，又不知道在笑什么，该笑什么。</p><p class="story-paragraph" data-source-key="2637:0">近新年的时候，伊安的病房里来了不速之客。</p><p class="story-paragraph" data-source-key="2638:0">从警察厅出来的人都有把衣服穿得一丝不苟的好习惯，志勋和志宇的脸蛋很像，兄妹两个差好几年，偏偏漂亮的好似双生。 大忙人抽空来釜山探监，坐在伊安床头慢条斯理帮她削苹果。这个人和伊安交情不深，自命不凡的样子伊安也不喜欢。志勋把苹果削好递给她，还是笑眯眯的样子：“不好奇吗？我突然过来。”</p><p class="story-paragraph" data-source-key="2639:0">能好奇什么？</p><p class="story-paragraph" data-source-key="2640:0">伊安搞不懂这个装货葫芦里卖的什么药，临近跨年，首尔的最上级单位开始下到地方上检查是很正常不过的事情。只是这种事情如果让崔志勋这号人物单来一趟她的病房，就显得格外诡异。</p><p class="story-paragraph" data-source-key="2641:0">难不成和崔志宇有关系？</p><p class="story-paragraph" data-source-key="2642:0">伊安骤然坐直，志勋还是慢吞吞的样子，笑眯眯地看着她：“再等几天吧。”</p><p class="story-paragraph" data-source-key="2643:0">前几天父亲收到了志宇发来的收网信号，那几位被他们一直盯着的议员终于有了动身去釜山的迹象，大解脱圆搞献祭的时候受惠对象必须在现场，这些信奉活祭的老男人们坚信着向神明献上的祭品越优秀自己的仕途就越顺遂，主意从柳河览打到了崔志宇的头上。</p><p class="story-paragraph" data-source-key="2644:0">索性将计就计，以身饲虎。</p><p class="story-paragraph" data-source-key="2645:0">但是这种事情危险又缜密，知道的人越少越好。</p><p class="story-paragraph" data-source-key="2646:0">志勋撑着腮，懒洋洋地看着从病床上猛然坐起的郑伊安。</p><p class="story-paragraph" data-source-key="2647:0">他没有细说，越接近收网时段，越不敢细讲。</p><p class="story-paragraph" data-source-key="2648:0">“整理一下啦。把自己身体养好点。”</p><p class="story-paragraph" data-source-key="2649:0">崔志宇传回来的证据确凿，足够扳倒国会里那几个混账。崔志勋心情很好，伸手拍拍郑伊安的脑袋：“收网的时候带你去看，你背地里那点人就别派出来了。持枪非法的，不要到时候老老少少釜山局子里一蹲一窝。”</p><p class="story-paragraph" data-source-key="2650:0">他懒得去捞。</p><p class="story-paragraph" data-source-key="2651:0">“崔志宇没给我放烟花，圣诞节。” 郑伊安咬着牙，声音闷闷的，很不爽。</p><p class="story-paragraph" data-source-key="2652:0">崔志勋笑盈盈地看着她，不知道在想什么。</p><p class="story-paragraph" data-source-key="2653:0">“跨年夜让她给你放。”一个娘胎里出来的人，说话方式也是惯有的轻言细语，“到时候你去现场接她，备好烟花，志宇亲自点火。”</p><p class="story-paragraph" data-source-key="2655:0">年末最后一天，整个剧组的拍摄完毕。</p><p class="story-paragraph" data-source-key="2656:0">宣发工作前期完成，河览终于快结束在釜山的逗留。多绚很早就替她订好回首尔的机票，次年头一天，新一年新的开始。离开江原道之后河览很少在其他的地方度过新年。但是这种时候在哪里都热闹，崔志宇很久没给她发消息，同剧组有alpha向她示好，被多绚和宇宙四两拨千斤地挡回去。</p><p class="story-paragraph" data-source-key="2657:0">这个人现在在哪里呢？在做什么呢？喜欢上其他的Omega了吗？</p><p class="story-paragraph" data-source-key="2658:0">拨弄着无名指上的戒指，河览漫不经心地想着。其实一开始想起崔志宇，心脏还是会痛的钝钝的，只是痛久了，习以为常。好似没有办法不想崔志宇，也没有办法不痛。</p><p class="story-paragraph" data-source-key="2659:0">杀青的那一夜的记忆太模糊，醒过来的时候总记得有人轻轻吻过她的额侧，好似幻象，碰一碰就要消失。</p><p class="story-paragraph" data-source-key="2660:0">为什么要消失。我又没有讲不要原谅你。</p><p class="story-paragraph" data-source-key="2661:0">Carmen一早的航班就飞回巴厘岛，多绚和宇宙有约会，珉周导演的那位也带着家里的小狗直奔釜山，年末处处都是圆满，就连许久没有联系的妹妹也给河览发来新年快乐。</p><p class="story-paragraph" data-source-key="2662:0">酒店近海港，入夜时就有人开始筹备烟花大会，中国来的老板自带风俗，大堂处的发财树上也被豪气挂上许多红包，见者有份，讨个来年的好彩头。</p><p class="story-paragraph" data-source-key="2663:0">河览一只手攥着那封红，一只手回复KKT上的消息。</p><p class="story-paragraph" data-source-key="2664:0">给河娜回复学业有成，衷心地赞美Carmen发过来的巴厘岛的晚霞漂亮，给多绚和宇宙打长长久久，最终停到崔志宇的那个聊天框。</p><p class="story-paragraph" data-source-key="2665:0">她们已经好久未互相发过消息。</p><p class="story-paragraph" data-source-key="2666:0">河览的手指动了动，编辑新年快乐，然后群发。</p><p class="story-paragraph" data-source-key="2667:0">崔志宇会看到吗？崔志宇会回复吗？会回复什么呢？</p><p class="story-paragraph" data-source-key="2668:0">河览垂着眼盯屏幕，漫不经心的，在心里轻轻地想。</p><p class="story-paragraph" data-source-key="2669:0">你在做什么？回首尔了吗？是不是又在实验室里没日没夜？好多问题想问，打在聊天框里，又被她一点点删掉。</p><p class="story-paragraph" data-source-key="2670:0">崔志宇没有读她的消息。</p><p class="story-paragraph" data-source-key="2671:0">河览攥着手机，从傍晚站到入夜。越入夜越热闹，酒店里入住的客人们都涌到海滩上，旧年近末，新年伊始，放烟花的跳舞的人都多，暗蓝色天幕上烟花五光十色，漂亮得不得了。</p><p class="story-paragraph" data-source-key="2672:0">河览一个人，手上也被过路小孩塞几根仙女棒，点上火举着很笨拙地笑，金奈延也下来看热闹，看到河览握着仙女棒的样子好漂亮，举着手机拍照下来发给她。</p><p class="story-paragraph" data-source-key="2673:0">小孩比她混娱乐圈混的早，很耐心教她编辑文案发ins，初露头角的新人需要在公众面前多亮相，河览很漂亮，这种照片发出去有优势。</p><p class="story-paragraph" data-source-key="2674:0">两个人一起在海滩上散步，近年末，天气好，月亮也圆的慷慨。说说笑笑时间近零点。</p><p class="story-paragraph" data-source-key="2675:0">这一代的年轻人仪式感重，齐刷刷地要开始倒数，</p><p class="story-paragraph" data-source-key="2676:0">新年钟声响时如果许愿能够实现吗？</p><p class="story-paragraph" data-source-key="2677:0">她用这个问题问金奈延。</p><p class="story-paragraph" data-source-key="2678:0">小孩儿皱皱鼻子，偏着脑袋思考，很真挚地讲心诚则灵吧。</p><p class="story-paragraph" data-source-key="2679:0">柳河览轻轻地噢了一声，没有继续说话了。</p><p class="story-paragraph" data-source-key="2680:0">好像没什么愿望。</p><p class="story-paragraph" data-source-key="2681:0">前几年想要温饱，昨年想要攒够违约金解约不拍那些东西，今年好似所有东西都实现了，人应该知足。</p><p class="story-paragraph" data-source-key="2682:0">但是贪心是本性，也许有愿望，卡在心里，难以启齿。</p><p class="story-paragraph" data-source-key="2683:0">“姐姐有愿望吗?”金奈延果然是小孩子，单纯又天真，“收视长虹还是明年大爆。”</p><p class="story-paragraph" data-source-key="2684:0">“我不知道啦。”河览慢吞吞地说。</p><p class="story-paragraph" data-source-key="2685:0">一面说着不知道，一面又在心里轻飘飘的想，崔志宇要天天开心。</p><p class="story-paragraph" data-source-key="2686:0">曾经做过朝不保夕的人，知道温饱可贵。只是崔志宇应该也不会沦落到吃不起饭的程度，在表达真心这一块上河览很笨拙的人。就算余生没有交集，崔志宇也要天天开心。</p><p class="story-paragraph" data-source-key="2687:0">两人有搭没搭的讲话，期间奈延把手机摸出来看，还有五分钟进零点。</p><p class="story-paragraph" data-source-key="2688:0">海滩上人已经很多了，攒攒人头凑做一堆，热闹又欢喜。</p><p class="story-paragraph" data-source-key="2689:0">天上烟花绚烂，海面映照一轮满月，旧年新年交替，人生也好似一年年就这么过去。</p><p class="story-paragraph" data-source-key="2690:0">大家聚在一起，时间一点点流向新年，不知是谁带头，大家异口同声，开始一下下倒数。</p><p class="story-paragraph" data-source-key="2691:0">“五…”</p><p class="story-paragraph" data-source-key="2692:0">柳河览同金奈延混在人群里，也开始在心里跟着轻轻地念数字。</p><p class="story-paragraph" data-source-key="2693:0">“四…”</p><p class="story-paragraph" data-source-key="2694:0">志宇姐姐在干什么呢?是不是也同某人站在热闹里，一起候着新年?</p><p class="story-paragraph" data-source-key="2695:0">“三…”</p><p class="story-paragraph" data-source-key="2696:0">柳河览轻轻地把眼睛闭上，温吞吞地，有些卑劣地想：如果志宇姐姐一直记得她就好了。</p><p class="story-paragraph" data-source-key="2697:0">“二…”</p><p class="story-paragraph" data-source-key="2698:0">临到点，她又摇摇头，还是觉得崔志宇天天开心就好。</p><p class="story-paragraph" data-source-key="2699:0">柳河览很善良，发自内心地想着，如果记得她不快乐，志宇把她忘记也没有关系。</p><p class="story-paragraph" data-source-key="2700:0">“一。”</p><p class="story-paragraph" data-source-key="2701:0">算了，不想那么多。</p><p class="story-paragraph" data-source-key="2702:0">——崔志宇要天天开心。</p><p class="story-paragraph" data-source-key="2704:0">旧年归零，新年伊始，巨大的欢呼声骤然从四面八方涌来，兜头将河览整个淹没。置身于这样庞大的热闹里，饶是密不透风的心事，大抵也可以稍微松懈半分。关于崔志宇的思念在这个刹那间汹涌，如同潮汐涨汛，把她整个人兜头浸没。</p><p class="story-paragraph" data-source-key="2705:0">手机在这个时候嗡嗡地震动起来，河览垂眸看了一眼，是多绚。</p><p class="story-paragraph" data-source-key="2706:0">她接起来电话，对方没有说话。</p><p class="story-paragraph" data-source-key="2707:0">在这种时候，多绚应该是不会和她打电话的，这种时候隆重又意义特殊，金多绚应该和金宇宙待在一起过二人世界才对。</p><p class="story-paragraph" data-source-key="2708:0">金多绚没有讲话，柳河览的心脏也一点点的沉了下去。</p><p class="story-paragraph" data-source-key="2709:0">隐约有了不祥的预感，这通电话关于崔志宇。</p><p class="story-paragraph" data-source-key="2710:0">她轻轻屏住呼吸，等不下去，正要开口询问的时候，多绚讲话了。</p><p class="story-paragraph" data-source-key="2711:0">这个人从来神定气闲，此刻讲话，有些六神无主，声音都是飘的。</p><p class="story-paragraph" data-source-key="2712:0">“我过来接你。”</p><p class="scene-break" data-source-key="2713:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2714:0">河览轻轻地咬着牙，听到多绚在那边吸气，再吸气，应该也是说不出来更完整的话了。耳边的声音突然变成了金宇宙的，两个人应该是一直在一处，金宇宙的声音也发颤，但是比多绚好一点，说得出来完整的话了。</p><p class="story-paragraph" data-source-key="2715:0">只是声音很轻，内容残忍。</p><p class="story-paragraph" data-source-key="2716:0">“河览，我们现在过来接你，去医院。”</p><p class="scene-break" data-source-key="2717:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2718:0">“志宇出事了，中了枪，现在在抢救，情况不好。”</p><p class="scene-break" data-source-key="2719:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2720:0">金宇宙的声音很轻，其实不是什么重话，只是敲得河览耳畔发响，眼前黑了又黑。她费好大劲，勉强稳住心神，嘴巴发颤，努力维持理智，不至于原地昏过去。</p><p class="story-paragraph" data-source-key="2721:0">她问不出话，只是听到宇宙在那边叹息。</p><p class="story-paragraph" data-source-key="2722:0">“你要做好，见她最后一面的，准备。”</p></div>
      </article>
