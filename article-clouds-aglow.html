      <article class="chapter" data-chapter="section-14">
        <header class="chapter-header"><span class="chapter-number">14</span><h2 data-source-key="3413:0">丢一口原纲的预制结局吧</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="3414:0">因为中途改纲的缘故，所以有一个伏笔一直没有派上用场。</p><p class="story-paragraph" data-source-key="3415:0">在原设定里是河览发现了志宇伪装身份之后暴怒，躲回江原道一别八年没有见面。</p><p class="story-paragraph" data-source-key="3416:0">是个bug，有办法圆，但是我实在舍不得让她们再经历任何撕心裂肺的别离了。</p><p class="story-paragraph" data-source-key="3417:0">去年七夕前提前写了原纲的结局，今天轻轻丢上来送给大家做下酒菜吧。</p><p class="story-paragraph" data-source-key="3418:0">很感谢你们这么喜欢蒸蒸，会有其他番外的。</p><p class="story-paragraph" data-source-key="3419:0">作为作者写下这一段话，我是怀着荣幸又受宠若惊的心情的。</p><p class="story-paragraph" data-source-key="3420:0">真的很感谢你们。【鞠躬】</p><p class="story-paragraph" data-source-key="3421:0">——</p><p class="story-paragraph" data-source-key="3423:0">崔志宇好像还是和年少时有点不一样了。</p><p class="story-paragraph" data-source-key="3424:0">迷迷糊糊地柳河览这么想。</p><p class="story-paragraph" data-source-key="3425:0">以前应该会小心翼翼地问自己可不可以然后再去做下一步的。但是现在好像不会问题了。冷然的含着眼泪的双眼就这么直勾勾地盯着自己。下面不含糊，几乎能够清晰地感受到那根玩意儿的抽离和顶入。她整个人都被泡在水里似的，快感和痛意交缠着似潮水般一波接一波地浇过来。</p><p class="story-paragraph" data-source-key="3426:0">她吃不住，不自觉地往后仰，喉头被崔志宇又舔又吸。色气黏糊的声音也似水声一般绞着她的耳畔。整个人就像置身于浪潮里颠簸，上上下下的漂浮感里能够抱紧的只有崔志宇。</p><p class="story-paragraph" data-source-key="3427:0">可是你在哭什么？</p><p class="story-paragraph" data-source-key="3428:0">迷乱的时候河览也在疑惑地想，鼻尖上弥漫着清苦的月季花香味。克莱尔奥斯汀的香气，直到现在她才知道的信息素的味道。</p><p class="story-paragraph" data-source-key="3429:0">狗东西当初没有和自己一直在一起的打算，不管是在镜头前还是那个老破小里都随时做着抽离的准备。</p><p class="story-paragraph" data-source-key="3430:0">可是现在好奇怪，明明睡到我了不是么？</p><p class="story-paragraph" data-source-key="3431:0">不受控制地，河览的手抚住了崔志宇的脸侧，掌心被滚下来的眼泪灼着。无端端好似也在她的心底烫出了洞。</p><p class="story-paragraph" data-source-key="3432:0">应该达到目的了吧崔志宇？</p><p class="story-paragraph" data-source-key="3433:0">装穷鬼骗我的人是你，让我一辈子忘不了的人是你，轻飘飘的像风一样的人是你，为什么和我做的时候掉眼泪的人还是你呢？</p><p class="story-paragraph" data-source-key="3434:0">她好多问题，到嘴边又变成了断断续续的呻吟和哭喘。</p><p class="story-paragraph" data-source-key="3435:0">崔志宇的体力好似很好，孽根恨不得顶到河览的生殖腔里去。</p><p class="story-paragraph" data-source-key="3436:0">被绞得太紧，吃的太深，几乎快把河览的小腹撑出浅浅的弧。她额头上沁着汗，面对面地望着河览，灭顶似的快感里眼泪扑簌簌地往下掉。被河览的手掌温柔地擦过，几乎快要控制不住地呜咽出声。</p><p class="story-paragraph" data-source-key="3437:0">只是因为太幸福了。</p><p class="story-paragraph" data-source-key="3438:0">河览，只是因为现在的这一刻对于我来讲，太幸福了。</p></div>
      </article>
    </template><template id="section-15">
      <article class="chapter" data-chapter="section-15">
        <header class="chapter-header"><span class="chapter-number">15</span><h2 data-source-key="3442:0">槲寄生下</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="3443:0">梁生圣诞节前接到电话，河览在那头礼貌问好。</p><p class="story-paragraph" data-source-key="3444:0">老人家本来对小孩风头正盛时宣布退圈一事火冒三丈，一转念听河览在那头讲志宇最近研出好吃甜品，一把年龄的人嗜甜毛病收不住，何况崔志宇这两年专心给河览做家庭煮夫，厨艺炉火纯青，甜品水平高到好似可以去请卖轮胎的过来评级，嘴里还在碎碎念叨河览恋爱脑，却很诚实地打开手机订票。</p><p class="story-paragraph" data-source-key="3445:0">韩铁不似港铁把旅客当做孙子，一顿车坐下来舒舒心心神清气爽，江原道的空气比首尔和釜山好，梁生总觉得干不动了辞职到这里来种土豆也是一个好归处。</p><p class="story-paragraph" data-source-key="3446:0">走到院前小啾先扑出来迎他，黑白毛色小狗被两口子养的滚胖溜圆，吭哧吭哧撒娇的样子格外讨喜，衔住他裤脚不放，撒泼打滚。不要到吃的不罢休的阵仗。梁生早有准备，裤兜里摸出来奶酪棒投喂，一抬眼见到志宇站在不远处，咧咧嘴，扯出来一个要笑不笑的表情。</p><p class="story-paragraph" data-source-key="3447:0">崔志宇这几年倒是不忙，名字挂在金家旗下一家生物科技做甩手CTO，除却必要出差基本居家办公，偶尔出远门去母校做客座教授。这几日确实得闲，一件羊绒开衫穿的懒懒，刚剪了短发，没有精心梳理的时候发尾乱翘，整个人看上去都像一只毛茸茸的小狗。</p><p class="story-paragraph" data-source-key="3448:0">只是这个人的身段瘦削过于，修身的衣服着在身上也有一种松垮的闲适——确实被前几年那场生死劫难折腾的太惨，整个人瘦似干柴，需要被藏起来好好养，想要命长就要少点劳心劳力。</p><p class="story-paragraph" data-source-key="3449:0">梁生瞥过崔志宇一眼，心底暗自思忖——这个人的这几年应该是没少让小河操心。</p><p class="story-paragraph" data-source-key="3450:0">毕竟这具身体被子弹两度贯穿，又饱受过酷刑。早已是伤痕累累，易碎到极致。</p><p class="story-paragraph" data-source-key="3451:0">这样的身体，一经风吹草动就是一场大病，会把河览折腾的很辛苦。</p><p class="story-paragraph" data-source-key="3452:0">可是他又知道，河览是不能失去志宇的。那些后知后觉的爱意决然又滚烫，好似沉寂许久的火山终于喷发。</p><p class="story-paragraph" data-source-key="3453:0">——河览经历过的失去太多，失而复得，也只想不择手段，不顾一切地抓紧对方。</p><p class="story-paragraph" data-source-key="3454:0">梁生理解她，可是理解的同时，又觉得河览太辛苦。他太明白照顾一个孱弱的人是何等的煎熬与心惊，正是因为明白，所以心疼愈发。崔志宇不觉梁生投过来的目光复杂，只是知道此时是院中白山茶和冬青树生长正盛，远道而来的梁生属于稀客，恰好她烘出新品，待客正好。</p><p class="story-paragraph" data-source-key="3455:0">她得闲时在家就去院子里浇花，花开太盛就剪下一筐搭在小啾背上。让它背出去转街送来往旅客。江原道除却发达的农业也有很优越的自然资源。这两年更是大力发展旅游资源，游客众多，背花出来送的边牧漂亮又聪明，一来二去混成一只小小网红狗。</p><p class="story-paragraph" data-source-key="3456:0">一人一狗混在家里的日子过得舒坦，闲适模样羡慕死梁生。走到廊下时梁生的鼻尖被一阵鲜甜的奶油香气扑住——先是奶油的鲜甜，后是柠檬的清香。是雪岳山脚的风过于诚实，糕点类的香气被路过檐下的风一卷就送到他跟前，捎带着挂在廊前的风铃也叮当作响。</p><p class="story-paragraph" data-source-key="3457:0">新焙的戚风卷住柠檬茶冻的口感新奇，崔志宇心血来潮做了柠檬奶油的抹面，一小块四四方方，鹅黄色奶油，组合住时味道恰好，不甜不腻。</p><p class="story-paragraph" data-source-key="3458:0">梁生嘴硬，一口又一口吃，嘴里还要念不如香港冰火两重天。</p><p class="story-paragraph" data-source-key="3459:0">崔志宇笑笑，没讲话。心里寻思下次这个老头来还是焙点面包夹黄油待客。她对梁生从来都很客气，只是不爱说话。</p><p class="story-paragraph" data-source-key="3460:0">确切讲她一直话少，难得几次啰嗦都落在河览身上。小老头健谈，无人陪话尴尬的要死，这时候就知道开始想念金多绚。</p><p class="story-paragraph" data-source-key="3461:0">健谈小孩天生一张能说会道的嘴，只可惜现在被金大导演吃得死死，早早被拎出国去度圣诞。依照多绚的计划应该是要环球绕一圈，在南极点跟金宇宙告白要名分。当初装大人的小孩熬几年真成大人，梁生某次同她寒暄，依稀记得多绚的圣诞愿望好似是今年同金宇宙交往的愿望迫切的不得了。</p><p class="story-paragraph" data-source-key="3462:0">只是想来也正常。</p><p class="story-paragraph" data-source-key="3463:0">一转眼多绚也快二十二，他依稀记得志宇要大一点，只是读书早又出成绩，年纪轻轻就胜过许多人奋斗好多年。河览这几年也算争气，长了一张各方资本都青睐的脸，用饭圈话术来讲叫做闪闪发光的二十代，志宇要是真的想躺河览大抵也养的起。</p><p class="story-paragraph" data-source-key="3464:0">梁生想到这里就好笑，腹诽自己真是发癫，一介牛马担心崔志宇这个万恶的资本主义会让柳河览饿肚子。</p><p class="story-paragraph" data-source-key="3465:0">一老一小坐在屋檐下的长廊处眺远处连绵不绝的雪山，河览在时院子里就热闹，河览不在时院子里缄默一片。好在当事人今日会推了下午拍摄早早赶回家，上午在片场摸监视器看到电子小狗面无表情蹲在角落，一个圆溜溜的狗脑袋朝着河览，好似一朵毛茸茸的小蘑菇。</p><p class="story-paragraph" data-source-key="3466:0">不知是闹起床气还是被梁生这个话痨轰的不舒心，心思发飘被一旁Carmen看到，走过来低声讲专心拍摄啊柳河览。</p><p class="story-paragraph" data-source-key="3467:0">Carmen是这样的，平时脾气好，工作时候不爱含糊，河览收回思绪，屏幕上的小狗还在恹恹趴着——志宇不开心。</p><p class="story-paragraph" data-source-key="3468:0">牵肠挂肚四个字有点奇妙，非要具象化，大抵就是她见不到崔志宇的时日，心里时时牵挂，好似一根看不见的线连在两人中間，在她的呼吸之间颤颤的晃动。</p><p class="story-paragraph" data-source-key="3469:0">真是没救，情饮水饱。</p><p class="story-paragraph" data-source-key="3470:0">梁生刻薄成习惯，用这句话刺崔志宇。</p><p class="story-paragraph" data-source-key="3471:0">他是真的看志宇刺眼，颇有一种老丈人看待女婿百般挑剔的心思。</p><p class="story-paragraph" data-source-key="3472:0">依稀记得当初在那座公司见到志宇的第一面：高挑、疏离、冷漠。</p><p class="story-paragraph" data-source-key="3473:0">办完这位的入职他还同隔壁桌同事咬耳朵吐槽不知是哪个omega会遭殃，这种长相和眼神的人好似那种上了头求饶也不会停的混蛋。混蛋偏偏生了一张漂亮到天怒人怨的脸，这张脸很适合去骗女人，不晓得以后又会骗得那个纯情小o为她卖身卖肾，心碎肠断。</p><p class="story-paragraph" data-source-key="3474:0">在办公室里做碎嘴公的时候是想不到天道好轮回这句话的。</p><p class="story-paragraph" data-source-key="3475:0">命运捉弄贱嘴佬的，插科打诨的时候没有防住一把回旋镖飞过来，家门口的白菜惨遭面瘫拱走。</p><p class="story-paragraph" data-source-key="3476:0">梁生想到这种事，就会忍不住郁闷。可是这个面瘫做的柠檬蛋糕很合他口味，他吃的很畅快；院子里的花开旺盛，小啾又长胖一圈，他看的心情也很好；崔志宇体贴，泡的茶是他独爱的大红袍。人也很懂礼貌，做什么都很得体——他挑不出来崔志宇的不好。</p><p class="story-paragraph" data-source-key="3477:0">硬要指摘也只能怪当初这位装穷卖傻骗过柳河览，把本来就拮据的小孩搞到差点跑来找他借钱，险些卖身——这个不好。</p><p class="story-paragraph" data-source-key="3478:0">但是这些事他一直没有和任何人讲。</p><p class="story-paragraph" data-source-key="3479:0">河览是自尊心很高的小孩，贸然讲出去又传回去，他认为河览听到后会受伤——更何况面前这位那些时间也没太好过。</p><p class="story-paragraph" data-source-key="3480:0">梁生与崔志宇交集不多，但是他和金多绚太熟，知晓崔志宇后来当初重伤又失忆，和河览的经历在某种程度上来说不亚于内陆某个台里暑假连播的偶像剧。</p><p class="story-paragraph" data-source-key="3481:0">他一向不会伤口撒盐，埋头苦吃戚风蛋糕，奶油和焙的柔软的蛋糕体被他咀嚼，咽下，心事重重，也伴糕点一并滚进肚子里。</p><p class="story-paragraph" data-source-key="3482:0">“其实我们在之前有过几面之缘。”</p><p class="story-paragraph" data-source-key="3483:0">突兀地，梁生开口讲。他寻思，总得像模像样训崔志宇几句话。河览家里的情况他知晓一点，妹妹和父母都不靠谱的情况下，他觉得总要有人站在河览的那一边。他把这句话讲出来，却没有在志宇的脸上看到半分意外。</p><p class="story-paragraph" data-source-key="3484:0">这个人好似把他所有的揣测和琢磨都收进眼底，只是以一种又温和又冷淡的态度在等待他的下文。</p><p class="story-paragraph" data-source-key="3485:0">他的眼皮子突兀一跳。</p><p class="story-paragraph" data-source-key="3486:0">梁生在被多绚招编进河览的工作室之前，一直同三教九流的人打交道，一双慧眼如炬，鲜有看走眼的时候。志宇对他这句话的反应太平淡，甚至眼皮子都沒有抬起来多看一下。</p><p class="story-paragraph" data-source-key="3487:0">依稀记得在河览和多绚的口中，这位恢复记忆的概率渺茫…只是..是真的什么都想不起来了吗。</p><p class="story-paragraph" data-source-key="3488:0">梁生垂眸，掩下翻涌神色，又换做那副大喇喇的贱嘴港佬模样。</p><p class="story-paragraph" data-source-key="3489:0">“她当初差点为你去卖身。”</p><p class="story-paragraph" data-source-key="3490:0">他讲这种话，心里也痛的钝钝，实在不愿意想当初河览惨兮兮的模样，只是好在现在已经苦尽甘来。绞尽脑汁，看到志宇终于抬眼，有些怔怔地看向他——她看上去很意外。</p><p class="story-paragraph" data-source-key="3491:0">这件事甚至连金多绚也不知道。</p><p class="story-paragraph" data-source-key="3492:0">这个人是站在崔志宇这边的，不知道那段时间河览过的有多苦。</p><p class="story-paragraph" data-source-key="3493:0">梁生突然有些后悔告诉了崔志宇这个。</p><p class="story-paragraph" data-source-key="3494:0">对于失去了记忆的人来讲，过去种种都似雾里看花。再提往事，多多少少有些突兀。这样的突兀大有一种不顾他人死活的失礼，但是他没办法忍住。</p><p class="story-paragraph" data-source-key="3495:0">那时河览的困惑和仿徨都太明显，是发自内心的纠结着要不要接下另一个尺度更大，报酬也更高昂的拍摄剧本。某种程度上来说一旦接受就是注定的不归路，梁生想想那时候都后怕。他没有出过意外，没法忘记小朋友当时皱着眉头苦巴巴的抱怨：“原来养一只小狗这么贵啊。”</p><p class="story-paragraph" data-source-key="3496:0">“养不下去要丢掉么?”他记得那时自己是这么问河览的，“你一个人都已经很辛苦了。”</p><p class="story-paragraph" data-source-key="3497:0">“……”</p><p class="story-paragraph" data-source-key="3498:0">“总不能丢下她吧。”河览皱着脸苦巴巴地讲，“她好可怜。”</p><p class="story-paragraph" data-source-key="3499:0">“你要对她好。”</p><p class="story-paragraph" data-source-key="3500:0">梁生说。</p><p class="story-paragraph" data-source-key="3501:0">在河览惊觉爱意之前，就已經做好了把自己沉进深渊然后不顾一切托举崔志宇的人生的准备。做这种事情不问前程的样子看上去傻乎乎的。可是正是因为她的傻里傻气，所以才会更担心那时候的崔志宇只是一张空有漂亮脸蛋的Alpha。</p><p class="story-paragraph" data-source-key="3502:0">他见过太多被骗的惨兮兮的omega，见到河览那个样子只觉得心惊肉跳。</p><p class="story-paragraph" data-source-key="3503:0">他是发自内心的，很怕河览被辜负。</p><p class="story-paragraph" data-source-key="3504:0">就算现在的河览可以不被物质困住，成为了很多人口里的young and rich，梁生还是忍不住希望河览过得好一点，再好一点。善良又笨拙的河览配得上全世界所有的好，这份好里，崔志宇给她的要独占一份百分之一百。</p><p class="story-paragraph" data-source-key="3505:0">他真是这样想的。崔志宇要对这个小苦瓜好一点，再好一点，做全世界对柳河览最好的人才可以。</p><p class="story-paragraph" data-source-key="3506:0">梁生骨子里固执又偏执，发自内心地觉得崔志宇必须这样做。</p><p class="story-paragraph" data-source-key="3507:0">“好。”</p><p class="story-paragraph" data-source-key="3508:0">他听到崔志宇出声答应。</p><p class="story-paragraph" data-source-key="3509:0">这个好字太单薄了。</p><p class="story-paragraph" data-source-key="3510:0">梁生还想说些什么，思路却被小啾突兀叼过来的一枝山茶打断。</p><p class="story-paragraph" data-source-key="3511:0">小狗不懂人类之间的感情翻涌，叼着月白色的花站在那里，尾巴晃悠悠的，眼睛湿漉漉亮晶晶，盯着梁生看，满眼的憨与真。</p><p class="story-paragraph" data-source-key="3512:0">梁生的喉头滚了滚，决定不再继续往下说，他垂眸看向小啾，伸手。</p><p class="story-paragraph" data-source-key="3513:0">得了信号，小啾的尾巴晃的更欢，衔着山茶迫不及待地地扑过来。那是一枝很漂亮的山茶，花型饱满，开的恰好，鹅黄色花蕊明艳，月白色花瓣柔软，</p><p class="story-paragraph" data-source-key="3514:0">那一定是小啾选了很久的，认为最漂亮的一朵山茶花。</p><p class="story-paragraph" data-source-key="3515:0">“小啾应该很喜欢你。”崔志宇说。</p><p class="story-paragraph" data-source-key="3516:0">真诚又热情的小狗遇到喜欢的人，会恨不得把自己认知的最好的东西叼出来眼巴巴奉上。梁生小心翼翼地托着那朵花，垂眸不语，不知道是在想什么。</p><p class="story-paragraph" data-source-key="3517:0">他想来想去，决定新春再上门，给小啾包一沓厚厚的压岁钱。</p><p class="story-paragraph" data-source-key="3518:0">衔过来的花被人好生对待，小狗开心，毛茸茸的尾巴摇着晃着，好似生命力特别蓬勃的一株狗尾绒。</p><p class="story-paragraph" data-source-key="3519:0">崔志宇垂着眸子，也看那朵被小狗噙过来的花。</p><p class="story-paragraph" data-source-key="3520:0">那场意外之后，十七岁之后的记忆消失殆尽，又被关于河览的所有一点点，一寸寸地填满。未曾想过在那段被遗忘的空白里，与河览一并经历过的，是让她活的这样辛苦的一段过往。</p><p class="story-paragraph" data-source-key="3521:0">她张了张嘴，觉得一个好字太单薄，想说一点更多的话。</p><p class="story-paragraph" data-source-key="3522:0">但是说不出来，什么话都讲不出来。情绪到了极致，原来也是词穷到了极致。心绪颤动，一个晃神，好似又看到最开始相遇时河览的眉目。</p><p class="story-paragraph" data-source-key="3523:0">——那是被她遗忘在记忆深处，却又发自本能的想要去爱护的人。</p><p class="story-paragraph" data-source-key="3524:0">她的情绪低落，兴致不高。</p><p class="story-paragraph" data-source-key="3525:0">被匆匆赶回来的河览看过一眼，一眼便知。</p><p class="story-paragraph" data-source-key="3526:0">晚餐后送走梁生，她回过头就看到志宇站在那里婚后这个人变得太好懂，心事全部写在脸上。一双珀色的眼定定地看着河览，湿漉漉的眼神看得河览心脏泛软，走过去又揉了揉志宇毛茸茸的脑袋。</p><p class="story-paragraph" data-source-key="3527:0">&quot;怎么不开心了？”</p><p class="story-paragraph" data-source-key="3528:0">志宇只是盯着她看，不说话。河览不追问，手指顺着志宇小狗翘起来的发尾往下，轻轻捻住薄薄的耳垂揉。</p><p class="story-paragraph" data-source-key="3529:0">“梁叔说了惹你不开心的话吗？”</p><p class="story-paragraph" data-source-key="3530:0">“没有。”</p><p class="story-paragraph" data-source-key="3531:0">耳垂被指尖捻得发烫，志宇声音很低。她甚至不知道该如何说，难道要质问河览那些被她遗忘过的曾经么?她不记得自己有过落魄到需要另一个人卖身救济的时候，偏偏长了一个转的很快的脑子，以前就问过其他人自己河览的过往，结合着梁生的支支吾吾，顷刻间推断出来应该是当初的自己一念之间欺骗过河览，以至于河览险些做出那种让自己万劫不复的决定。</p><p class="story-paragraph" data-source-key="3532:0">河览的过往很辛苦，她在那段时间也没有做好让河览轻松一点的角色。这些话，这些推断，她半句都问不出。薄弱的心脏被满怀的自责绞的发颤，眼睛水汪汪的，好像碰一碰就要掉眼泪。</p><p class="story-paragraph" data-source-key="3533:0">“你是不是有一段时间过的很辛苦。”</p><p class="story-paragraph" data-source-key="3534:0">柳河览手指上动作一顿，好像真的陷入了回忆。</p><p class="story-paragraph" data-source-key="3535:0">说到二十岁之后，就好像人生被重新启动了一次，事业顺得不得了，再也没有为填饱肚子这件事情发过愁。</p><p class="story-paragraph" data-source-key="3536:0">拮据到购买便利店的临期食品也要斟酌的日子现在离她太远，搬到济州岛上的父母也没有因为经济的问题再来骚扰过。河娜大学毕业后苦苦备考几年也上了公务员的岸，崔志宇也在身边。</p><p class="story-paragraph" data-source-key="3537:0">她好像过的太一帆风顺，以至于那些不好的经历都快被她下意识的忘干净。</p><p class="story-paragraph" data-source-key="3538:0">前二十年的辛苦经历在河览的记忆里就像一张张被模糊掉的黑白画像，已经不重要了。非要说的话，和志宇经历过的一切就是为数不多的鲜明色彩。</p><p class="story-paragraph" data-source-key="3539:0">“你在那时候是个很好的人。”</p><p class="story-paragraph" data-source-key="3540:0">河览终于放开志宇的耳垂，转而用手掌轻轻捧住志宇的脸颊。泫然欲泣的眼睛落在河览的眼里，光是看一看也快要心碎了。她对志宇想起过往的这件事没有执念，发自内心的认为人应该活在当下和未来。但是没有想过志宇好像真的伤心，轻轻地偏过头，讲话的声音浸着哑，她慢吞吞地讲：“好像，那时候的我让你，很辛苦。”</p><p class="story-paragraph" data-source-key="3541:0">这种话说出来，她就有一种呼吸困难的感觉。</p><p class="story-paragraph" data-source-key="3542:0">明明是当初的自己给河览造成了万分困扰，现今又从河览的嘴巴里听出来些怀念的意味。委屈与不安的情绪冲撞着她的神經，一时间情绪起伏过大，大到河览衣兜里的那枚监视器也发出了尖锐的鸣警声响。</p><p class="story-paragraph" data-source-key="3543:0">河览伸手将东西拿出来看，毛茸茸的小狗趴在屏幕里，盯着她掉眼泪。</p><p class="scene-break" data-source-key="3544:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3545:0">笨蛋。</p><p class="story-paragraph" data-source-key="3546:0">真的是。</p><p class="story-paragraph" data-source-key="3547:0">除了笨蛋已经想不出来其他的可以形容志宇的词语了。</p><p class="story-paragraph" data-source-key="3548:0">河览踮踮脚，凑身前去，浅浅地贴住志宇的颊侧啄了啄。</p><p class="story-paragraph" data-source-key="3549:0">bobo。</p><p class="story-paragraph" data-source-key="3550:0">情绪动荡的时候，只是浅浅的亲吻就能够迅速地牵引着志宇回到正轨上。因为失忆所致的缺憾太多，忘掉了过往的同时也为身体带来了不可逆的伤害，遗憾不止一处，被触发的时候，除却痛彻心扉的本能反应，随之腾升的就是剧烈的不安和自我厌弃。</p><p class="story-paragraph" data-source-key="3551:0">只是梁生兴许说者无心。</p><p class="story-paragraph" data-source-key="3552:0">不知者无罪，他不知道志宇到了这种程度。只是亲吻也够让那种无措的情绪更甚，颊侧贴过温软的触感，志宇迟钝地眨了眨眼，终于簌簌落下眼泪，眼泪滚烫，被河览不胜其烦地一次次擦掉。</p><p class="story-paragraph" data-source-key="3553:0">“好像真的让你很辛苦过。”</p><p class="story-paragraph" data-source-key="3554:0">掉眼泪的缘故，就连声音也带着嘶哑的鸣泣。</p><p class="story-paragraph" data-source-key="3555:0">这种阵仗也吓坏小啾，忙不迭从狗窝里翻滚出来 ，哒哒哒哒的朝这边跑过来。</p><p class="story-paragraph" data-source-key="3556:0">大胖狗連滾帶爬的樣子好似一團飛速滾動的黑白毛球，噗嚕嚕地滾到志宇的腳邊。</p><p class="story-paragraph" data-source-key="3557:0">所以说是笨蛋。</p><p class="scene-break" data-source-key="3558:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3559:0">兩個都是。</p><p class="story-paragraph" data-source-key="3560:0">河览在心里轻轻的叹息。</p><p class="story-paragraph" data-source-key="3561:0">大概梁生真的怕崔志宇对她太坏，很多事情只讲单面性，好心反而办坏事，催出崔志宇的自厌情绪，又要生出许多让她费尽心思要去安抚下的不安。“没有很辛苦，真的。&quot;</p><p class="story-paragraph" data-source-key="3562:0">她侧着脑袋，一点点，一下下地亲着志宇。从脸颊到嘴角，河览的安抚从来都是耐心，温柔。指腹輕輕地蹭著志宇的頰側，溫溫柔柔，噙住下巴輕柔地吻和咬。</p><p class="story-paragraph" data-source-key="3563:0">“沒有很辛苦。”她喃喃地講。是因為遇到你，才覺得這種看不到頭的人生有了一點可以讓我期待明天的盼頭。她不會講這這句話，只在心裡輕輕想。輕如鴻羽的念頭轉瞬即逝，垂眸視線就同志宇望過來是相撞。</p><p class="story-paragraph" data-source-key="3564:0">漂亮又澄澈的眼睛好似一幅黑白山水畫，是十八歲的柳河覽不敢肖想可以拥有的東西。痛苦的記憶早在和崔志宇一起度過的年年歲歲裡被拋之腦後，痛苦就是該被忘記的。</p><p class="story-paragraph" data-source-key="3565:0">用一種極其珍重的態度輕輕地摩挲著小狗的侧脸，没有来由会想起当初那双噙着眼泪望着自己的眼睛。</p><p class="story-paragraph" data-source-key="3566:0">志宇姐姐。</p><p class="story-paragraph" data-source-key="3567:0">她在心里轻轻地念着久违的称呼，沉下眼又同眼巴巴的人亲吻。想念在不经意的时候最甚，就算心知肚明着眼前的人依旧是崔志宇，可是不可避免的会想到当初窝在一起相依为命的人。</p><p class="story-paragraph" data-source-key="3568:0">不顾一切只为她的崔志宇，站在楼下眼巴巴的看着她的崔志宇，窝在便利店里撑着脸认认真真的听过她的所有苦恼和委屈的崔志宇。</p><p class="story-paragraph" data-source-key="3569:0">…好想你。</p><p class="scene-break" data-source-key="3570:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3571:0">好想你。</p><p class="story-paragraph" data-source-key="3572:0">这种安抚最奏效，志宇的眼泪很快就止住，情绪的余波牵扯出更多的奇怪的冲动，她也偏过头，在河览啄过来的时候，生涩地蹭了蹭河览的唇瓣。河览的动作顿了顿，迟钝地眨了眨眼睛，微微抬头，毫不犹豫地的回应。</p><p class="story-paragraph" data-source-key="3573:0">圣诞礼物么?</p><p class="story-paragraph" data-source-key="3574:0">被河览推到床上的时候，志宇迷迷糊糊地，这么想了。</p><p class="story-paragraph" data-source-key="3575:0">填了婚姻申告三年，却因为她的身体原因，两个人之间没有什么实质性的性生活。</p><p class="story-paragraph" data-source-key="3576:0">无论是属于Alpha的易感期亦或者是属于omega的发情期都只靠着单纯的接吻和临时标记度过，现今突兀这么一下，志宇心如擂鼓。颈后的隔离贴被撕掉之后，清冷柔软的气息温温柔柔兜头笼住她。身为omega的河览在这种时候本身应该是作为被动的承受方，此刻却面对面地跨坐在志宇身上，耳朵通红，红的不得了。</p><p class="story-paragraph" data-source-key="3577:0">圣诞礼物，开袋即食…</p><p class="story-paragraph" data-source-key="3578:0">志宇私底下看二次元本子，一霎時間脑子里飞过许多乱七八糟的词汇。她想的脸红，愧疚又委屈。</p><p class="story-paragraph" data-source-key="3579:0">明明发自内心的笃定着曾经的自己是个混蛋，诚诚恳恳做着检讨，但是看到这样子的河览就会忍不住的去想更多。</p><p class="story-paragraph" data-source-key="3580:0">想要更多，想做更多。</p><p class="story-paragraph" data-source-key="3581:0">心念杂乱，愧疚与自责顷刻间被其他的东西淹没，她觉得这样不好。</p><p class="story-paragraph" data-source-key="3582:0">可是河览好似下了某种决心要和她做。床头灯开着一盏，橘黄色灯光昏昏暗暗，不让她看得太清楚，也不至于让她什么都看不见。朦胧的灯光为河览镀过一层模糊又漂亮的轮廓。志宇看得直勾勾眼巴巴的，目光追着河览黏巴巴的看。</p><p class="story-paragraph" data-source-key="3583:0">真的很漂亮，真的好漂亮。</p><p class="story-paragraph" data-source-key="3584:0">纯白色的毛衣被小心地脱掉，志宇的力氣收的很厲害，小心翼翼，好似對待世界上最珍貴的東西。被内衣包裹的乳肉和平坦的小腹一览无余地露在志宇跟前。瘦的硌人的可憐的小河、窩在懷裡安靜地吻著她的河覽，跨坐在她身上居高臨下眺著她的妻子。零碎的记忆惊雷似地划过脑海，霎时间颅顶炸开一片刺裂的痛意。被纷至沓来的记忆碎片敲打，整个额前痛的好似快要裂开。可是关于河览的情和欲也拷打着她。折磨双重，没有一刻让她好过过半分，可是她现在顾不上这些。</p><p class="story-paragraph" data-source-key="3585:0">眼睛看得发直，太阳穴突突直跳。</p><p class="story-paragraph" data-source-key="3586:0">这是是迟来的新婚夜么?掉下眼泪就会让河览舍身奉上么?以后还要在河览的面前掉眼泪吗?</p><p class="story-paragraph" data-source-key="3587:0">乱七八糟的想法，伴随着不安与恐惧浅浅地浸过绷成一线的神经，一霎時間她竟什么都管不上，恶狠狠地仰首再度噙住柔软的唇瓣。雪绒花的气息扑入鼻尖，轻飘飘缠住蠢蠢欲动的克莱尔奥斯汀。</p><p class="story-paragraph" data-source-key="3588:0">河览的绝对坦诚就够让让心猿意马，她仰着脑袋同河览亲，掐住河览的掌心滚烫。躯体滚烫，贴的很紧。昏黄灯光投出床上一双纠缠的影子，衬得心血来潮时放在床头的檞寄生丛格外应景。因为拍摄的缘故，柳河览的头发被染成了灿金色，贴在汗湿又赤裸的脊背上，好似童话中闪闪发光的黄金藻。</p><p class="story-paragraph" data-source-key="3589:0">这样的河览好漂亮。</p><p class="story-paragraph" data-source-key="3590:0">灯光下的河览，跨在她身上的河览，只属于她的河览。</p><p class="story-paragraph" data-source-key="3591:0">这样的河览好漂亮。</p><p class="story-paragraph" data-source-key="3592:0">身子瘦成薄薄一片纸 ，偏偏肌肉也长得紧。没有多生半点赘肉，也没有到皮包骨头的硌人。抱在怀里是一种恰好的软。鸣警声断断续续的，早就超过了平时需要维稳的阈值。</p><p class="story-paragraph" data-source-key="3593:0">但是没有人管它们，没有人能够腾出空管这些。</p><p class="story-paragraph" data-source-key="3594:0">迟来的亲密久违而吃人神智，沉没的一瞬，皮包肉和，灭顶的剧痛与快感交叠着挟裹住志宇。她哼着声，将脑袋埋进河览的颈窝。被柔和的雪绒花气息铺天盖地的包裹，分明是记忆中的第一次，却自发又自主将自己送到最深。直到整根都被湿漉漉的柔软裹住，快感潮水似奔涌袭来。</p><p class="story-paragraph" data-source-key="3595:0">失神过一刻，却又忍不住想要更多。瘦削的手臂捞住怀中因为颠簸而摇摇欲坠的人，生理连同心理上的餍足一刻不停冲着志宇。</p><p class="story-paragraph" data-source-key="3596:0">停不下来，一刻也不愿意停下来。</p><p class="story-paragraph" data-source-key="3597:0">小啾哼哼唧唧，湿漉漉的狗狗眼瞥过床上缠死的一双人。小狗爪子吧嗒吧嗒，踩过木质的地板，懒洋洋地趴回自己狗窝。</p><p class="story-paragraph" data-source-key="3598:0">小狗不懂，趴在窝里，只看得到昏黄灯光映照下摇摇曳曳的影子，缠过又分开，分开又缠住，好似风中摇曳的一对并蒂莲花，疾风暴雨也没有办法分开半分。</p><p class="story-paragraph" data-source-key="3599:0">不愿意分开，不要分开。</p><p class="story-paragraph" data-source-key="3600:0">河览被快感冲的支离破碎的意识里只留下了这句话。</p><p class="story-paragraph" data-source-key="3601:0">是志宇弄的太狠太快，整根抽离又整个没入。一刻不停地亲她与咬她。</p><p class="story-paragraph" data-source-key="3602:0">陷入情绪上的动乱，被铺天盖地的嗜虐本能与性欲淹没，大概真的是做的上头红眼，把她抱的很紧，咬她咬的很痛。</p><p class="story-paragraph" data-source-key="3603:0">偏偏这种入骨入髓的痛楚久违，由着志宇施予，偏偏就让河览有了一种痛快。</p><p class="story-paragraph" data-source-key="3604:0">她的手指颤颤，轻轻地抚过志宇的眼尾，一点一点地描摹好看的眉眼。恍然却想起来当初还在首尔的时候，志宇站在楼下笑着看她。</p><p class="story-paragraph" data-source-key="3605:0">小狗呀。</p><p class="story-paragraph" data-source-key="3606:0">长着耳朵晃着尾巴的小狗，浸着醉意也写满了喜欢的情绪的眼睛。她想不得这些，鼻子发酸，垂眸又去亲亲志宇的眼睛。这双眼现今被快感浸的失神，沉在余韵里不能自拔。</p><p class="story-paragraph" data-source-key="3607:0">记忆缺失的混蛋就连怎么做爱都忘了，河览伸手拍了拍志宇小狗的脸蛋，在心里很轻的想：你以前才不会这么欺负我。</p><p class="story-paragraph" data-source-key="3608:0">她不愿意将忘记过去的崔志宇认做其他人，待在志宇的身边就觉得满足又开心，只是偶尔会被来自过去的思念一刻不停的侵蚀着，哪怕和志宇共度的那个过去辛苦又难过，她还是会很固执的想着。</p><p class="story-paragraph" data-source-key="3609:0">如果你能够想起来就好了。</p><p class="story-paragraph" data-source-key="3610:0">如果你想起来，会知道我很喜欢你，我很爱你，我想要你天天开心。</p><p class="story-paragraph" data-source-key="3611:0">志宇小狗也好，志宇姐姐也好。</p><p class="story-paragraph" data-source-key="3612:0">——我很爱你。</p><p class="story-paragraph" data-source-key="3613:0">高潮临界的时候，河览的大脑一片空白，被本能驱动的身体以同样的力度抱紧志宇，原来真的有这么一刻会这样渴望。想把志宇揉进骨子里，骨血相连，然后再也不要分开。</p><p class="story-paragraph" data-source-key="3614:0">体能很差的人来不起几次，筋疲力尽地交出全部。</p><p class="story-paragraph" data-source-key="3615:0">志宇的脑袋昏昏沉沉，还是隐隐作痛。伏在她的怀里同她赤裸相贴的河览也湿漉漉的。两个人做的滚烫又昏沉，眼皮子不争气的上下打架。</p><p class="story-paragraph" data-source-key="3616:0">“河览啊…。”</p><p class="story-paragraph" data-source-key="3617:0">陷入昏睡之前，猝然听到志宇轻轻声地叫她。柳河览钝钝抬眼，看到她的小狗依旧阖着眼，很轻很温柔的语气：“现在能够吃饱饭了吗?”</p><p class="story-paragraph" data-source-key="3618:0">不要饿肚子，要快乐，要顺遂。好似又一次听到这些喃喃又窃窃的声音，关于过去，关于崔志宇，被无数次的在她的耳边轻轻回响，汇成一句小声的叩问。</p><p class="story-paragraph" data-source-key="3619:0">——现在的河览快乐吗?</p><p class="story-paragraph" data-source-key="3620:0">呼吸在一霎時間滞住，河览有些迟钝地眨了眨眼。</p><p class="story-paragraph" data-source-key="3621:0">她后知后觉自己好像掉了眼泪。</p><p class="story-paragraph" data-source-key="3622:0">她不知道该怎么讲。</p><p class="story-paragraph" data-source-key="3623:0">情绪上涌，喉咙好像也被一块浸足水的海绵重重堵住，说不出来半句话。她不知道崔志宇问出这句话的缘由。到底是潜藏的执念作祟，亦或是遗忘的记忆卷土重来?她不敢多想，心脏却被这句轻飘飘的话重重提起，默然许久，手指才敢悄悄抬起来，轻轻揉平志宇蹙起的眉心。</p><p class="story-paragraph" data-source-key="3624:0">到底存着怎么样的心事，以至于就连这种时候都没有办法舒开眉头?</p><p class="story-paragraph" data-source-key="3625:0">精疲力尽的陷入着沉睡的小狗放任过往醒过一瞬，好似当初被志宇密不透风裹住的那枚旧茧在猝然之间裂开过一瞬，终于让河览窥见半分沉甸甸的心意、——关于她的心意。</p><p class="story-paragraph" data-source-key="3626:0">笨蛋。</p><p class="story-paragraph" data-source-key="3627:0">她叹息。</p><p class="story-paragraph" data-source-key="3628:0">思虑重重，胡思乱想到凌晨终于浅浅入睡，以至于第二日吊个黑眼圈吓崔志宇一跳。</p><p class="story-paragraph" data-source-key="3629:0">完全忘记昨晚意识模糊时脱口的呓语，只是用那双湿漉漉的眼巴巴地盯着她。太清澈的眼，完完整整地映着自己。河览愣了愣，笑一声：“早。”</p><p class="story-paragraph" data-source-key="3630:0">声音是哑的，分不清到底是哭的还是叫的。</p><p class="story-paragraph" data-source-key="3631:0">缠过半宿的代价就是一整日的疲倦和懒意上浮，揭过平安夜与圣诞，迎来好天气。</p><p class="story-paragraph" data-source-key="3632:0">下午Carmen到家里来做客，忙完最后一个拍摄合约，接踵而至的就是退，工作室已经在平台上发布声明。粉丝不舍，剪出河览近几年影映合集发到网上，又被Carmen刷到，理所当然带过来同她们一起看。</p><p class="story-paragraph" data-source-key="3633:0">笨拙又真心的收藏着河览在镜头前的一幕幕，从最近新爆的警匪題材倒流回最开始手捧情信面向镜头的那一幕。</p><p class="story-paragraph" data-source-key="3634:0">光影流转，好似时间无声倒流。</p><p class="story-paragraph" data-source-key="3635:0">志宇的目光轻轻顿在屏幕上，隔着手机同几年前的河览远远相望。</p><p class="story-paragraph" data-source-key="3636:0">“釜山?”</p><p class="story-paragraph" data-source-key="3637:0">“是釜山噢。”</p><p class="story-paragraph" data-source-key="3638:0">Carmen语气轻快地替河览回答。她不介意志宇不记得自己这个前经纪人，见到这双湿漉漉的眼睛就想起当初与志宇初见面时对方冷漠又无所谓的模样，想要合作的人是河览，片酬是多少也不关心，因为替河览遮镜头这种事挨了很多骂，本来以为是正义感爆棚的大学生，结果是被富养的小文鸟跑到片场上来玩cosplay。</p><p class="story-paragraph" data-source-key="3639:0">印尼人在吐槽这一块的天赋点拉满，心里弹幕飞闪，面上不显。</p><p class="story-paragraph" data-source-key="3640:0">目睹过河览因为志宇快要油尽灯枯的所有时日，也见过当初志宇毫不犹豫的签下那份苛刻的兼职条约的剎那。好在也像所有happy ending的故事里那样，相爱的人历经波折之后还是紧握住对方双手。Carmen发自内心的笃信着关于两个人的凛冬已经彻底散尽，接踵而至的是长明星河，白头天光。</p><p class="story-paragraph" data-source-key="3641:0">余光轻轻地瞥过旁侧脑袋挨着脑袋一并看视频的两个人，工作上面向来严格的印尼人在心里轻轻地祝愿：要幸福。</p><p class="story-paragraph" data-source-key="3642:0">你们一定要幸福。</p><p class="scene-break" data-source-key="3643:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3644:0">“好漂亮。”</p><p class="story-paragraph" data-source-key="3645:0">志宇钝钝的讲。</p><p class="story-paragraph" data-source-key="3646:0">手指轻轻戳着屏幕上的捧住情信的爱人，心脏也好似被一只看不见的手骤然揪紧。记忆空白出大片，已经记不得当初自己也曾熬过一段心神俱裂，也与河览置身同一片滩涂遥相望。</p><p class="story-paragraph" data-source-key="3647:0">“我就是很漂亮呀。”</p><p class="story-paragraph" data-source-key="3648:0">懒懒散散地靠在崔志宇的肩窝里，河览哼哼声地讲。Carmen看过一眼不忍直视地别过头，以前混情色片场的时候就觉得这两个人凑在一起其他人就要变成两个人的play中的其中一环，过了这么多年依旧难逃变成闪闪发光的电灯泡的命运。</p><p class="story-paragraph" data-source-key="3649:0">我很漂亮噢，崔志宇。</p><p class="story-paragraph" data-source-key="3650:0">轻轻地蹭过瘦削的肩骨，河览的声音也带着闷闷的笑。</p><p class="story-paragraph" data-source-key="3651:0">——所以你要好好对待我才行。</p><p class="story-paragraph" data-source-key="3652:0">不要欺负我、不要欺骗我。</p><p class="scene-break" data-source-key="3653:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3654:0">还有，要一直一直陪着我。</p><p class="story-paragraph" data-source-key="3655:0">她在心里轻轻地念着永远也不会对志宇说出口的话，小猫一样把自己整个依偎进对方的怀中。因为染发而变得有些毛茸茸的发顶在志宇的眼前晃动，后者迟钝地眨了眨眼，垂下眼眸，小心翼翼轻轻啄了一口。</p><p class="scene-break" data-source-key="3656:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3657:0">Carmen彻底闭上眼睛，突然觉得自己横在一边也太过刺眼，若非不是被留了一并用餐，她真想现在就起身做辞。</p><p class="story-paragraph" data-source-key="3658:0">应该是近了新年的缘故，来雪岳山作访的人格外多。</p><p class="story-paragraph" data-source-key="3659:0">求婚成功的金多绚与金宇宙从南极点携手归来，环游世界的途中捞到故人。</p><p class="story-paragraph" data-source-key="3660:0">许久不见，郑伊安也长大许多，一双眼沉沉，再也看不见少年时凌厉轻佻的笑意。听说这个人心血来潮养的那只小鸭不堪折磨跑路，郑伊安看上去也没有再找的念头。三个人一起约到海参崴去看了毛茸茸的萨摩耶马戏团，小狗吐着舌头在舞台与灯光里状态快乐的滚着游戏轮，满场掌声里金多绚听到郑伊安漫不经心发问：“她还好么?”</p><p class="story-paragraph" data-source-key="3661:0">已然不是少年者上位的模样，现今的郑伊安多了一份上位者特有的冷漠与平静，金多绚的目光下挪，瞥到这人轻轻颤抖的右手。心知肚明伊安口里的“她”究竟是谁，多绚轻轻地叹了一口气。</p><p class="story-paragraph" data-source-key="3662:0">要怎么告诉伊安志宇已经失忆的事实?平等的忘记了十七岁以后所有的人和事，忘记了河览，也忘记了伊安。</p><p class="story-paragraph" data-source-key="3663:0">依稀记得当初同志宇一并走过暗巷时见到的那个狼狈不堪的人——那个被满怀恶意地丢掉了止痛药，缩在角落里痛到蜷缩起来的小孩安静地蛰伏在金多绚的记忆里，又和现今平静的注视着她的郑伊安的眉目重叠了起来。</p><p class="story-paragraph" data-source-key="3664:0">现在再也不敢有人这么对她，过往和崔志宇一并深埋在见不得光的角落。埋得太深，以至于听到金多绚斟酌着字句娓娓道来崔志宇的近况，郑伊安也没有感觉到自己的情绪上有任何的波动。</p><p class="story-paragraph" data-source-key="3665:0">“志宇姐姐和那位还在一起么?”她轻飘飘的问。</p><p class="story-paragraph" data-source-key="3666:0">“还在一起。”金多绚回答她，顿了顿，很认真地补充，“很幸福。”</p><p class="story-paragraph" data-source-key="3667:0">很幸福啊。</p><p class="story-paragraph" data-source-key="3668:0">她不再多问，只是讲：“幸福就好。”</p><p class="story-paragraph" data-source-key="3669:0">人生漫漫，难免有憾。只是一份憾也好似命中在冥冥注定，竭力逃过志勋所有试图提起崔志宇的剎那，却难免又不自觉地在金多绚这里挨上轻飘飘的一刀。这一刀来的太轻，又割的太快。須臾間在她的心脏上划出不见底的口子，才让她豁然惊觉，原来自以为已是充沛血肉的器官还有这么一处空落落。</p><p class="story-paragraph" data-source-key="3670:0">那是一处没有办法填满，再也不会填满的地方。</p><p class="story-paragraph" data-source-key="3671:0">这种空落感在见到崔志宇的那一刻更明显。</p><p class="story-paragraph" data-source-key="3672:0">遗忘前尘的人不觉伊安僵硬异常，只当金多绚和金宇宙来做客时多带了一个不速之客。多绚向来聪明。适时为伊安找补，说是这位同恋爱对象吵架把对方吵到跑路，千里迢迢从北欧一路追到江原道。</p><p class="story-paragraph" data-source-key="3673:0">“所以跑到了江原道?”志宇眼睛眯起来，有些好奇的问。</p><p class="story-paragraph" data-source-key="3674:0">“不知道啊。”</p><p class="story-paragraph" data-source-key="3675:0">金多绚慢条斯理的。倒是有所耳闻奈延最近捡到了一个红头发的Alpha，并不清楚是不是卢惟那。她没有兴趣多去打听，柳河览和崔志宇也不是八卦的人。偷偷把伊安带上门的举动已经招了金宇宙一顿说，再搞点事怕是要被姐姐连打带踹丢出家门。多绚不乐意多管志宇和伊安以外的闲事，只是觉得年少时的挚友因为一东西有的没的的就此走散太过于遗憾。</p><p class="story-paragraph" data-source-key="3676:0">她体贴的为伊安和志宇留出独处的空间，追着胖乎乎的小啾往屋子里去了。</p><p class="story-paragraph" data-source-key="3677:0">庭前只剩下两个人面面相觑，伊安咳了咳，很别扭地讲：“花很漂亮。”</p><p class="story-paragraph" data-source-key="3678:0">花园里的山茶和蔷薇很漂亮，房屋下悬挂的风铃很漂亮，长长的回廊很漂亮，黑白相间的小啾很漂亮。</p><p class="scene-break" data-source-key="3679:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3680:0">好久不见的崔志宇也很漂亮。</p><p class="story-paragraph" data-source-key="3681:0">回归到十七岁之前的状态，也遗忘掉了许多后来的撕心裂肺，大抵也不记得当初那两枪穿身时的痛楚。</p><p class="story-paragraph" data-source-key="3682:0">可以的话，郑伊安的私心是志宇一辈子不要记起来这些。</p><p class="story-paragraph" data-source-key="3683:0">如果时光倒流，她宁愿崔志宇不要一把推开她。</p><p class="story-paragraph" data-source-key="3684:0">只是这个世界上从来没有后悔药，也不存在时光倒流，她只能轻轻地咬着后槽牙，在志宇投过来的温和的笑里扯出同从前无二的笑。</p><p class="story-paragraph" data-source-key="3685:0">——好久不见。</p><p class="story-paragraph" data-source-key="3686:0">她在心里轻轻地念。</p><p class="story-paragraph" data-source-key="3687:0">好久不见。</p><p class="story-paragraph" data-source-key="3688:0">人多时吃烤肉最好，坐在庭院里可以正眺不远处连绵的雪山。全球变暖的缘故，以至于到了年底也没有落下几场雪。碳火烧的正旺，肉也选的上好。新雇的住家阿姨在这一块儿好的让人挑不出刺，只是给心上人烤肉这种事情还得亲力亲为。一桌人各有各的忙，金多绚忙着往金宇宙盘里堆、志宇吃不了多少，靠在河览边上忙前忙后。热闹里衬得伊安这个外客形单影只，她倒是无所谓，往嘴里塞肉，大吃大嚼里装作什么都没有发生。</p><p class="story-paragraph" data-source-key="3689:0">十七岁的崔志宇，二十岁的崔志宇也在她的记忆里报复性的模糊了起来。现在的你就算知道我正在刻意的遗忘大概也无动于衷吧?</p><p class="story-paragraph" data-source-key="3690:0">只是没有想过志宇的性格被彻底软化，格外关注冷战和吵架这一类的事情。餐后河览和宇宙去讨论退圈前后的合约问题，金多绚熟练给小啾套上背套带去遛弯。偌大花园里只剩下崔志宇和郑伊安，两个人四双眼睛缄默对视，志宇噗嗤一声笑出来：“所以，真的有要把被你气跑的那位追回来的决心啊?”</p><p class="story-paragraph" data-source-key="3691:0">没有目的的乱转可不行啊。</p><p class="story-paragraph" data-source-key="3692:0">想说的是这句话。</p><p class="story-paragraph" data-source-key="3693:0">之前因为纠结着河览是否还介意着自己失忆这件事闹过不想干的别扭，赌气离家出走过好几天。等到被河览找到的时候发现对方真的被折腾到不轻，眼下堆着两抹惨淡的青，筋疲力尽又万分脆弱的样子。</p><p class="story-paragraph" data-source-key="3694:0">是因为看到过这样的河览，才会知道伤心欲绝究竟是什么模样。</p><p class="story-paragraph" data-source-key="3695:0">伊安这个样子不像是弄丢了心上人的样子啊。</p><p class="story-paragraph" data-source-key="3696:0">志宇在心里想。</p><p class="story-paragraph" data-source-key="3697:0">但是她不求答案，只是觉得两个人沉默静坐太不应当，绞尽脑汁想要找一点什么话题。伊安瞥了她一眼，垂眸自顾自去喝杯子里的饮料：“不知道。”</p><p class="story-paragraph" data-source-key="3698:0">她给出的答案也很干瘪瘪。</p><p class="story-paragraph" data-source-key="3699:0">卢惟那跑之前大骂她没有心，这一点让她很诧异，应该是很久以前就说好过的交易，自认为对卢惟那很好，不输以往崔志宇对自己的半分，但是不知道为什么。这位还是跑掉了。</p><p class="story-paragraph" data-source-key="3700:0">她顿了顿，很犹豫地讲：“我只是对她很好而已。”</p><p class="story-paragraph" data-source-key="3701:0">“对她很好?”崔志宇疑惑。</p><p class="story-paragraph" data-source-key="3702:0">“曾经有一个人，她对我也很好。”伊安的声音闷闷的，“记得我其实很喜欢热闹，每年在圣诞节的时候，会在釜山的港口给我放很多烟花。”</p><p class="story-paragraph" data-source-key="3703:0">其实不止这一桩好，崔志宇对她的好太多，经年累月里变成了化不开的心障，以至于她往后种种行事里都要染上旧年的影子。她讲这些，莫名又觉得心虚，小心翼翼地抬眼看崔志宇的反应，发现对方依旧以那种从容又平和的眼神注视着自己。</p><p class="story-paragraph" data-source-key="3704:0">心里一块大石头悄悄放下，伊安正准备舒一口气，突然听到崔志宇讲：“那个人一定很喜欢你。”</p><p class="scene-break" data-source-key="3705:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3706:0">握住饮料杯的手指不动声色的收紧，一霎時間宛如惊雷劈过心尖，伊安的脸色很难看。后知后觉自己大概是说错话，戳中了对方的伤心事，志宇发现自己的这个话题起的不应该，心里紧了紧。</p><p class="story-paragraph" data-source-key="3707:0">她补救似的又讲：“如果想到那个人伤心的话，就不要再想了。”</p><p class="story-paragraph" data-source-key="3708:0">目光太坦然，真的把伊安口里的那个人认做了其他人，这样的坦然让伊安后知后觉到了在海参崴就该感受到的惊裂。心脏在志宇的注视下一寸寸又不动声色地裂开，久违的幻痛后知后觉地蔓延四肢，一时间让她动弹不得。</p><p class="scene-break" data-source-key="3709:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3710:0">“不知道。”</p><p class="story-paragraph" data-source-key="3711:0">志宇听到伊安这样讲。</p><p class="story-paragraph" data-source-key="3712:0">好像除了不知道也讲不出来任何话语了，能够给予答案的人已经化做飞灰。从此关于志宇的一切全都是群山之中隐隐的回响，再也捞不到半分真切的答案。她有些茫然，声音也变得很轻。</p><p class="story-paragraph" data-source-key="3713:0">“没有相爱过。”</p><p class="story-paragraph" data-source-key="3715:0">她顿了顿，很深地看了崔志宇一眼，在心里轻轻地又讲一遍。</p><p class="story-paragraph" data-source-key="3716:0">——我们没有相爱过。</p><p class="story-paragraph" data-source-key="3717:0">所以没有遗憾，没有错过，只是姐姐擅自把我和那些痛苦的记忆一起忘记了，我有一点难过。</p><p class="story-paragraph" data-source-key="3718:0">…也仅仅只是，有一点难过。</p><p class="story-paragraph" data-source-key="3719:0">心事重重的人临困时只会下意识的落荒而逃，甚至没有等到多绚和宇宙一起。匆匆忙忙道别的伊安离去前再看过志宇一眼，发自内心笃定这是今生之中的最后一次见面。</p><p class="story-paragraph" data-source-key="3720:0">有的人告别无声，有的人恍然未觉。</p><p class="story-paragraph" data-source-key="3721:0">只是河览同宇宙商议完所有的事情，走到院子里的时候，发现志宇一个人坐在秋千上，很失落的样子。</p><p class="story-paragraph" data-source-key="3722:0">大概是在不知情的情况下讲错话，刺激到郑伊安，自己也没有很好过。</p><p class="story-paragraph" data-source-key="3723:0">河览在心里轻轻叹气，走过去，蹲下，仰着脑袋同志宇对视：“怎么不开心?”</p><p class="story-paragraph" data-source-key="3724:0">志宇垂眸，与河览清凌凌的眼睛对视，突然问：“所以河览原谅我了么?”</p><p class="story-paragraph" data-source-key="3725:0">一句话问的没头没尾，她怕河览茫然，很低很低地讲：“想不起来过去，忘记过你，欺骗过你…”</p><p class="story-paragraph" data-source-key="3726:0">一桩桩事，从她的嘴巴里念出来，莫名有一种自罚自厌的味道。不知道为何会起这样的情绪，只是在瞥到伊安那样的神色，后知后觉这位应是自己十七岁之后经历的某个故人。脑海里却一直有一个声音轻轻地告诉她：不要想起来。</p><p class="story-paragraph" data-source-key="3727:0">那种受伤的神色，唯独不愿意在河览的眼里看到。</p><p class="story-paragraph" data-source-key="3728:0">如果想不起来真的没有关系么?被忘记的过往里兴许还藏着需要河览原谅的事情，有太多太多需要想起来的理由。只是这几年里有医生下过论断，受损过的神经过于脆弱，若是贸然刺激，身体会不堪负荷。</p><p class="story-paragraph" data-source-key="3729:0">“姐姐在之前差点和我再也见不到了啊…”河览很轻很轻地讲，“现在的话，想不起来也没有关系。”</p><p class="story-paragraph" data-source-key="3730:0">手指极其温柔的，轻轻地摩挲着志宇的手背，说出这些话应该也要下决心。许多事在志宇的健康面前显得太小，她没有办法贸然做赌，再去承过一次失去崔志宇的代价。</p><p class="story-paragraph" data-source-key="3731:0">“没有过去，会有未来。”</p><p class="story-paragraph" data-source-key="3732:0">她这么讲，也这样想，发自内心，无比笃信。</p><p class="story-paragraph" data-source-key="3734:0">她们拥有的是无比珍惜彼此的当下，和可以一直在一起的未来。</p><p class="story-paragraph" data-source-key="3737:0">ps：在槲寄生下的人不能拒绝亲吻，敌人相遇要停战。圣诞节悬挂它代表了“生命中的金枝”，寓意幸福与丰饶。</p><p class="story-paragraph" data-source-key="3739:0">起稿是去年圣诞，拖拖延延到今年终于写完了。思考了很久还是决定用这样的名字。象征着幸福和爱情的槲寄生下，希望纠结的小孩释然，吃不饱饭的小孩温饱，一直经历幻痛的宝宝也能和跨过万水千山拉住自己错过的小鸭。最重要的是大家要幸福呀。</p><p class="story-paragraph" data-source-key="3741:0">看到这里的你要幸福，崔志宇和柳河览要幸福，郑伊安也要幸福。</p><p class="story-paragraph" data-source-key="3743:0">至于多绚和宇宙，两口子三年抱两一定要999999啊！！【仅限于这篇】</p><p class="story-paragraph" data-source-key="3745:0">走到现在四百多个订阅是我没有想到的，总觉得受宠若惊，写出了这么无趣的故事，但是很感激喜欢着这个故事的你们。</p><p class="story-paragraph" data-source-key="3747:0">一定要开心，一定要幸福啊。w</p></div>

  <script>
    (() => {
      const chapterIds=['section-01','section-02','section-03','section-04','section-05','section-06','section-07','section-08','section-09','section-10','section-11','section-12','section-14','section-15'], chapterTitles=['Chapter 01','Chapter 02','Chapter 03','Chapter 04','Chapter 05','Chapter 06','Chapter 07','Chapter 08','Chapter 09','Chapter 10','Chapter 11','Chapter 12','丢一口原纲的预制结局吧','槲寄生下'];
      const select=document.getElementById('chapter-select'), mount=document.getElementById('chapter-mount'), shell=document.getElementById('reader-shell');
      const prevTop=document.getElementById('prev-top'), nextTop=document.getElementById('next-top'), prevBottom=document.getElementById('prev-bottom'), nextBottom=document.getElementById('next-bottom');
      const prevLabel=document.getElementById('prev-label'), nextLabel=document.getElementById('next-label'), progress=document.getElementById('reading-progress');
      let currentIndex=0;
      function indexFromHash() { const value=location.hash.slice(1); const found=chapterIds.indexOf(value); return found < 0 ? 0 : found; }
      function updateButtons() {
        const atStart=currentIndex===0, atEnd=currentIndex===chapterIds.length-1;
        [prevTop,prevBottom].forEach(button=>button.disabled=atStart); [nextTop,nextBottom].forEach(button=>button.disabled=atEnd);
        prevLabel.textContent=atStart?'已经是第一章':chapterTitles[currentIndex-1]; nextLabel.textContent=atEnd?'全文完':chapterTitles[currentIndex+1];
      }
      function mountChapter(index, shouldScroll=false, replace=false) {
        currentIndex=Math.max(0,Math.min(index,chapterIds.length-1)); const id=chapterIds[currentIndex]; const template=document.getElementById(id);
        mount.replaceChildren(template.content.cloneNode(true)); select.value=id; updateButtons();
        document.title=`云蒸霞蔚 · ${chapterTitles[currentIndex]}`;
        const url=`#${id}`; if(replace) history.replaceState(null,'',url); else if(location.hash!==url) history.pushState(null,'',url);
        progress.style.width='0'; if(shouldScroll) shell.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
      }
      function move(delta) { mountChapter(currentIndex+delta,true); }
      select.addEventListener('change',()=>mountChapter(chapterIds.indexOf(select.value),true)); prevTop.addEventListener('click',()=>move(-1)); nextTop.addEventListener('click',()=>move(1)); prevBottom.addEventListener('click',()=>move(-1)); nextBottom.addEventListener('click',()=>move(1));
      addEventListener('popstate',()=>mountChapter(indexFromHash(),false,true));
      addEventListener('scroll',()=>{ const doc=document.documentElement; const max=doc.scrollHeight-innerHeight; progress.style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`; },{passive:true});
      mountChapter(indexFromHash(),false,true);
    })();
  </script>
