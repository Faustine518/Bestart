        <header class="chapter-header"><span class="chapter-number">01</span><h2>Chapter 01</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="4:0">崔志宇走进公司大楼的时候看到那个鼻青脸肿的Alpha很狼狈地从公司里走出来。擦肩而过的时候依稀嗅得到硝烟味，她垂着眼没有抬头看，她本性很冷漠，懒得去八卦。</p><p class="story-paragraph" data-source-key="5:0">首尔大学的医科生忙的要死，谁也想不到这种忙的要死的学生还能在百忙之中抽空接一份在色情影像公司的兼职。没有课和实验的时候就跑来公司三点一线的打卡上班。</p><p class="story-paragraph" data-source-key="6:0">知道的人不多，玩的好的朋友知道也很平淡地提醒你最好在拍摄过程中戴好口罩。</p><p class="story-paragraph" data-source-key="7:0">兼职拍片的总不可能一直做情色艺人吧？金主恩和她很平淡地讲这句话。说这句话的时候她们在实验室里用显微镜观察某个病变细胞分裂，金主恩蒙着口罩看不清楚表情，只是很冷地讲如果你真的这样我一辈子不会放过你。</p><p class="story-paragraph" data-source-key="8:0">手机响起来，铃声有一点突兀。柳河览这时候给她打电话过来，声音好懒，软绵绵又无奈：“过来救个场。”</p><p class="story-paragraph" data-source-key="9:0">还没挂电话经纪人的信息也发过来，言简意赅地讲有个河览的任务分到了你的头上。</p><p class="story-paragraph" data-source-key="10:0">眉梢跳了跳，崔志宇后知后觉刚才黑着脸和她擦肩而过的Alpha是柳河览在下一个片场上的搭档。</p><p class="story-paragraph" data-source-key="11:0">因为偷拍了某个omega所以被她那个漂亮的Alpha暴打一顿，这种事情传出来在业内的名声就毁了。</p><p class="story-paragraph" data-source-key="12:0">没有办法继续在这一行从业只能狼狈的辞职卷铺盖走人。走人之后积压的通告只能分给其他人，恰好柳河览就被分到了她的脑袋上。</p><p class="story-paragraph" data-source-key="13:0">救场这种东西是适用于她这种兼职的。公司不会捧这种不签长期约的，但是偏偏老天爷赏饭，送了一张漂亮的皮囊给她。</p><p class="story-paragraph" data-source-key="14:0">人事在签约的时候几次问她要不要变成长期约，毕竟是很难得的优质的漂亮的Alpha，如果全职下海的话过不了几年就会赚的盆满钵满。</p><p class="story-paragraph" data-source-key="15:0">她说的不算假话，毕竟崔志宇出片好看。</p><p class="story-paragraph" data-source-key="16:0">漂亮的皮囊和绵绵的柔软的情话被市场上的大部分omega受用。</p><p class="story-paragraph" data-source-key="17:0">只参加过一次拍摄，但是数据和销量不错，比起其他的Alpha算潜力股一枚。</p><p class="story-paragraph" data-source-key="18:0">崔志宇坐在对面，心不在焉，神飞天外。</p><p class="story-paragraph" data-source-key="19:0">公司算业内的翘楚，制片出片卡关比其他几家的严很多。</p><p class="story-paragraph" data-source-key="20:0">偌大一个公司，腾了两层楼作片场，密密麻麻的被隔音墙堆砌起来的房间宛若蜂巢。平时也习惯躺平等死的经纪人早在那个堆搭好的片场外面等她了。</p><p class="story-paragraph" data-source-key="21:0">剧本随着信息一起发给她，崔志宇一目十行地看了，记住了个大概。</p><p class="story-paragraph" data-source-key="22:0">剧情向的谈情说爱的，爱到最后也就是插进去然后机械地讲情话。</p><p class="story-paragraph" data-source-key="23:0">有一点不同的是剧本里 还下意识地皱着眉头。</p><p class="story-paragraph" data-source-key="44:0">比起镜头上的感官呈现好像更在意她的感受，私底下和朋友讲这件事也被笑着讲果然是大学生来兼职的呀。连绵又柔软的个性，就像三月初在首尔落下的淅淅沥沥的春雨一样。</p><p class="story-paragraph" data-source-key="45:0">在柳河览的心跳因为这样的形容莫名其妙地漏掉一拍之后，卢惟那这样就在不知情的情况下被轻飘飘地pass掉了。</p><p class="story-paragraph" data-source-key="46:0">开机前两个人做准备进入状态，崔志宇习惯有搭没搭和河览聊两句。比如说今天天气真好啊，月色很漂亮，你很好看。</p><p class="story-paragraph" data-source-key="47:0">有时候会开玩笑问河览喜欢什么味道的避孕套，她这方面很注重，总觉得相方的体液和自己的精液混在一起是很色情下流的事情，一般都会在事前备好几盒。</p><p class="story-paragraph" data-source-key="48:0">趴在后桌上问这种问题的崔志宇莫名让柳河览想起来了老家养着的那只眼巴巴的边牧，聪明伶俐的长相，眼白和瞳仁黑白分明，透着一种水汪汪的可爱。</p><p class="story-paragraph" data-source-key="49:0">她伸手屈指刮了刮对方挺翘的鼻梁，惯有的柔软的公式性的微笑：“喜欢你不戴。”</p><p class="story-paragraph" data-source-key="50:0">轻巧的亲昵换崔志宇僵在原地，愣了半晌，迟钝地眨了眨眼睛，耳根后知后觉泛起一片透红。</p><p class="story-paragraph" data-source-key="51:0">流程进的很顺畅，暧昧也好告白也好，不管是什么艺人都要在镜头面前呈现出自己最好的状态。文艺化的剧本注定露骨的镜头会少很多，崔志宇按着剧本和河览在淅淅沥沥的雨声里亲吻，柔软的缠绵的吻，手掌沿着衬衫往衣服里摸。</p><p class="story-paragraph" data-source-key="52:0">她的掌心里有一层薄薄的茧，粗糙的触感蹭过河览细腻的肌肤，下意识地便让河览低低低唔出声音。</p><p class="story-paragraph" data-source-key="53:0">她的声音细碎又颤巍，很轻很轻的一声又被唇舌间色情的水声淹下去。崔志宇的手掌顿在她的腰腹处浅浅的摩挲，一下又一下，分明没有什么进一步的动作，却是很奇怪，很奇怪地把河览的性欲勾起来了。</p><p class="story-paragraph" data-source-key="54:0">“可以吗？”</p><p class="story-paragraph" data-source-key="55:0">含含糊糊地她就听到崔志宇这么问她。剧本之外的台词，被崔志宇就这么轻飘飘地问出来。手指顺着河览瘦削的脊骨往上，指腹温柔地蹭过细腻的肌肤。被人为制造出来的雨声是白噪音，无限放大河览的每一寸感官。</p><p class="story-paragraph" data-source-key="56:0">崔志宇温柔地叼住她的唇瓣厮磨，时不时分开一点给她换气的余地，手指一点一点解开河览内衣的搭扣的时候，咔哒咔哒的声音也被放大了，轻飘飘地刺着河览的神经。</p><p class="story-paragraph" data-source-key="57:0">可以吗？</p><p class="story-paragraph" data-source-key="58:0">她被亲的头昏，听见崔志宇温柔的声音在耳膜里又问一遍。鬼使神差地点了点头。安稳又笃实的态度，一时间分不清楚这么细碎的亲吻着她的人到底是崔志宇，亦或是剧本中的那位老实的竹马。</p><p class="story-paragraph" data-source-key="59:0">她分不清楚，脑子里的思绪被挤压成一团乱糟糟的浆糊。勾住崔志宇的脖子把对方往自己的身前带了带，两个人距离拉近的时候她甚至嗅得到崔志宇身上的香气。介于茶香和花香之间的柔软的气息，是信息素的味道。</p><p class="story-paragraph" data-source-key="60:0">百褶裙被她的动作带得往上卷，皱巴巴地贴住腿根。好像还没有做什么就因为被乱七八糟的东西搞的狼狈不堪了。轻轻浅浅的香气勾住河览，内衣的搭扣被解开，松松垮垮地吊在她的肩膀上。</p><p class="story-paragraph" data-source-key="61:0">乳尖被崔志宇的手指轻轻地拧住，那算是河览身上最敏感的地方之一。</p><p class="story-paragraph" data-source-key="62:0">第一次合作的时候她告诉崔志宇这个的时候清楚地看到对方耳根泛红——分明资料上是年长她一岁的姐姐，可是对于这些事情的经验还是太少。</p><p class="story-paragraph" data-source-key="63:0">到了后面才有人告诉她其实那也是崔志宇的实质性的第一次。</p><p class="story-paragraph" data-source-key="64:0">在不知情的情况下，柳河览完成了崔志宇的性启蒙。</p><p class="story-paragraph" data-source-key="65:0">所以现在比第一次熟练很多了么？含含糊糊地想这个问题，本能性地挺腰把自己往对方的掌心里送。</p><p class="story-paragraph" data-source-key="66:0">在镜头面前完成情色的拍摄是很艰难的事情，饶是拿过青龙影后的那位中国籍演员在拍摄这种东西的时候也在完成了拍摄之后和搭档抱头痛哭。</p><p class="story-paragraph" data-source-key="67:0">某种程度上来说算得上是最难的拍摄之一吧？这种剧本。要性又不单单只要有性，要真情流露，要万般柔软，镜头前不止有性，还要有爱。</p><p class="story-paragraph" data-source-key="68:0">要有爱。</p><p class="story-paragraph" data-source-key="69:0">看到原始本的时候崔志宇就抓住这种微妙的点。眉梢挑了挑，经纪人适时地讲你如果学校里还有实验我就推掉。借口帮她找的很好，但是搭档是柳河览。</p><p class="story-paragraph" data-source-key="70:0">她的目光在柳河览三个字上面停顿片刻，关掉文档之后将手机放进背包里，转身和经纪人讲我出去买两盒套。</p><p class="story-paragraph" data-source-key="71:0">板正的人讲这种话莫名就有一种正气凛然的滑稽感。</p><p class="story-paragraph" data-source-key="72:0">避孕套在楼下的便利店里的货架上摆成一排，崔志宇眯着眼睛选了又选，没来由觉得可能柳河览会喜欢草莓味多一点。</p><p class="story-paragraph" data-source-key="73:0">其实做爱的时候草莓味还是玻尿酸的都不重要，但是崔志宇的骨子里有莫名其妙的仪式感。</p><p class="story-paragraph" data-source-key="74:0">她会觉得很重要。</p><p class="story-paragraph" data-source-key="75:0">剧本很重要，场地很重要，避孕套的味道很重要，柳河览的感受也很重要。</p><p class="story-paragraph" data-source-key="76:0">理所当然地将自己排在最末位，在场地里看到柳河览的时候自然而然地挑起眉梢打招呼。</p><p class="story-paragraph" data-source-key="77:0">她最重要。</p><p class="story-paragraph" data-source-key="78:0">剧本分成三幕，作者还是保守，仔细看下来才发现很多东西是层层递进顺利成章的。雨声是贯彻整个剧本的连线，在雨声里相爱也在雨声里做爱。初恋感很重的本子适合出道不久的新人，河览被选中是所有人的意料之内。</p><p class="story-paragraph" data-source-key="79:0">她本来就有一张长得就很像初恋的脸蛋。</p><p class="story-paragraph" data-source-key="80:0">导演喊出“卡”的时候柳河览的乳尖已经被崔志宇捻的发涨。情欲像潮水一样席卷上来就很难跌下去，崔志宇安抚性地咬了咬她的下唇，手指松开。没有转过去面朝导演，只是不动声色地将河览往自己的怀里带了带。</p><p class="story-paragraph" data-source-key="81:0">这是一种很绝对的圈守姿势，背对镜头替河览挡住了 ="story-paragraph" data-source-key="120:0">她们细细碎碎地在监视器前交流，两个人四双眼睛死死地盯住导演，横竖都是一句敢催你就死定了。</p><p class="story-paragraph" data-source-key="121:0">导演缩了缩脖子，决定不再说任何话。</p><p class="story-paragraph" data-source-key="122:0">现场的气氛再度归于安静，人造雨声淅淅沥沥，柔软又清晰。</p><p class="story-paragraph" data-source-key="123:0">体外的前戏绵长，等到崔志宇的手指迟疑地抵进甬道的时候。侵入感太明显，柳河览仰着脖子拼命地抑住骤然急促的呼吸，手指死死地抓住崔志宇的衬衫。</p><p class="story-paragraph" data-source-key="124:0">小腿绷的很紧，没有怎么经历过性事的身体还没有适应这种生理性的欢愉。甬道已经很湿了，崔志宇的手指抵进去，就被柔软的穴肉迫不及待地裹紧。湿润温暖的触感也像羽毛似的撩崔志宇的心脏，她恍然也分不清面前的人到底是河览亦或者河岚。</p><p class="story-paragraph" data-source-key="125:0">像兔子一样的河岚，深爱着知羽的河岚，亦或者被她的手指操进湿滑的甬道里，无助着绷紧了身体瑟瑟发抖的河览。</p><p class="story-paragraph" data-source-key="126:0">“你好可爱。”</p><p class="story-paragraph" data-source-key="127:0">突然的崔志宇就这么说了。她的眼睛也湿漉漉的，性器在裤裆里顶出来很高的帐篷。硬的烫的她有点受不了，但是语气还是很柔软，很认真的，发自内心的觉得河览很可爱。</p><p class="story-paragraph" data-source-key="128:0">手指在甬道里温柔地抽送，快感一点一点地堆叠起来，像要吞没河览的潮水又像天边柔软的烟霞。</p><p class="story-paragraph" data-source-key="129:0">河览有一点无助，下意识地环紧崔志宇，如同溺水之人抓住最后一根救命稻草那样。</p><p class="story-paragraph" data-source-key="130:0">当初公司丢给她的第一个本子是被同公司的漂亮前辈指奸，黑洞洞的摄像头就这么直晃晃地照着她的脸。经验丰富的前辈脾气很好，小声地安抚她又很专业地告诉场外镜头该对准哪里拍。有一种让她自己不是人的感觉，被当做物件摆设，只要按照要求叫出该有的声音做出导演想要的样子就好了。</p><p class="story-paragraph" data-source-key="131:0">第二次就和崔志宇遇见了。</p><p class="story-paragraph" data-source-key="132:0">第一次见面的时候崔志宇没有剪短头发，穿着舒适又松垮的长裤和卫衣，拉下口罩的时候露出了一张漂亮的脸蛋。初见就是在片场，前一秒握住手下一秒就要脱下衣服在镜头面前做亲密的事情。</p><p class="story-paragraph" data-source-key="133:0">崔志宇看上去没有柳河览紧张，拿着剧本和经纪人交流细节，讲到了什么，突然脑袋抬起来皱着眉头看了她一眼。</p><p class="story-paragraph" data-source-key="134:0">没有任何情绪的眼神，冰冷而无机质。</p><p class="story-paragraph" data-source-key="135:0">“比我小一岁么？”</p><p class="story-paragraph" data-source-key="136:0">柳河览突然听到她这么问了。</p><p class="story-paragraph" data-source-key="137:0">这种意义不明的问题。</p><p class="story-paragraph" data-source-key="138:0">她看到崔志宇似笑非笑地弯了一下嘴角，语气好轻，像叹息一样：“好辛苦。”</p><p class="story-paragraph" data-source-key="139:0">莫名其妙的问题和感慨之后就没有更多的交流，合作的时候场务丢给崔志宇棒球帽和口罩，漂亮的脸庞隐在帽檐下，霎时间就变成了一个粗暴的混蛋。</p><p lass="story-paragraph" data-source-key="160:0">公司为数不多的人性化就是会给初入圈子的情色演员配很护短的经纪人，因为职业的边缘性和敏感性很容易在外面受欺负，如果遇到不够强势的经纪人可能会出现很糟糕的，难以挽回的情况。</p><p class="story-paragraph" data-source-key="161:0">偏偏面前两个还是公司里最护短的。</p><p class="story-paragraph" data-source-key="162:0">叹了口气，导演抓过旁边的对讲机。</p><p class="story-paragraph" data-source-key="163:0">声音被电流杂音扰乱，模糊的cut声传过来。</p><p class="story-paragraph" data-source-key="164:0">场务迅速地拍板清场。</p><p class="story-paragraph" data-source-key="165:0">崔志宇的手指已经退出来了。</p><p class="story-paragraph" data-source-key="166:0">一手晶亮的黏湿滑腻，张开手指甚至能够看到指间牵连的晶莹的丝丝缕缕，在场灯的反照下泛出黏滑的光泽。</p><p class="story-paragraph" data-source-key="167:0">手指徒劳地屈了屈，崔志宇的耳根滚烫。</p><p class="story-paragraph" data-source-key="168:0">她还是悄悄地别开了视线。</p><p class="story-paragraph" data-source-key="169:0">助理适时地递过毛毯，她接过来展开，小心翼翼地把柳河览裹住。</p><p class="story-paragraph" data-source-key="170:0">被毛茸茸的毯子包裹住的河览有一点点像她养的小狗狗。眼睛圆溜溜又湿漉漉的，鼻头也红红的。没有从快感的余韵里反应过来，所以整个人看上去也呆呆的。</p><p class="story-paragraph" data-source-key="171:0">私心在格外泛滥的时候，人是不受控制的。她再次把柳河览护在了怀里。</p><p class="story-paragraph" data-source-key="172:0">动作太明显了，落在不远处的两位经纪人眼里。</p><p class="story-paragraph" data-source-key="173:0">不动声色地对视一眼，两位不约而同的叹了口气。</p><p class="story-paragraph" data-source-key="174:0">最后是崔志宇的经纪人打破沉默，扭头看着还没从工作台上下来的导演问流程。</p><p class="story-paragraph" data-source-key="175:0">分成三幕的剧本其实穿插了很多温馨的片段，纯爱到有一点不像爱情动作片。拍摄也被导演切割成三天，教室内一天外景一天，还有一天是在卧室的床上。</p><p class="story-paragraph" data-source-key="176:0">现在对于崔志宇和柳河览来说，难度最大的好像确实是那张卧室的床。</p><p class="story-paragraph" data-source-key="177:0">原定的计划推迟打乱，外景变成了拍摄的第二部分内容。</p><p class="story-paragraph" data-source-key="178:0">没有过分的亲密，只有风轻云淡的相处和堆叠的情话。其实对于情色艺人来讲是很困难的事情，因为背台词和代入情绪太麻烦了。</p><p class="story-paragraph" data-source-key="179:0">大家进入这行的话说是因为梦想的话那就太扯淡了，五花八门的原因里大多数是因为来钱快。而恰好有一个很世俗又很常始的认知：赚快钱的人一般都很懒。</p><p class="story-paragraph" data-source-key="180:0">拍色情片的人在演技方面的拙劣是情有可原的，可偏偏崔志宇很自然，自然地讲情话自然地做色情的事情。好像确实该说不愧是考上首大医学专业的高材生，漂亮的脸蛋和聪明的脑子。拥有这两项的人就拥有了世界上百分之九十九的宽容。</p><p class="story-paragraph" data-source-key="181:0">这样的人做什么都不会让人有不适的感觉。</p><p class="story-paragraph" data-source-key="182:0">Alpha的颈侧泛着浅淡的白茶香气，一时间有点让河览分不清楚这种浅淡的香气究竟源自于崔志宇的信息素亦或是她最钟爱的香水。只是这样的气息让她很安心，所以她下意识地把脑袋往崔志宇的颈窝里埋了埋。</p><p class="story-paragraph" data-source-key="183:0">纤细又修长的脖颈，靠近一点依稀见得肤层下蜿蜒的青色血管。无知无觉似地，崔志宇好像在毫无防备的状态下把自己最脆弱的地方暴露给柳河览了。</p><p class="story-paragraph" data-source-key="184:0">如果咬上去的话会怎么样呢？</p><p class="story-paragraph" data-source-key="185:0">状态还是浑浑噩噩的，柳河览突然冒出了这么危险的想法。</p><p class="story-paragraph" data-source-key="186:0">上次拍摄卢惟那用手指把她弄的很疼，血气方刚的Alpha不知道轻重，作为报复柳河览在摄像机移开的时候狠狠地咬了卢惟那的耳朵。长得像小猴子的漂亮Alpha捂住耳朵呜呜地叫，委屈地向赶到现场的经纪人告状说河览姐姐太凶了。</p><p class="story-paragraph" data-source-key="187:0">得到的是经纪人和场记都哈哈地笑，说那还不是你搞太凶了，活该。结果到了这次拍摄的时候就给她安排了一个很暴烈的Alpha，卢惟那的经纪人报复心强是圈内公认的。</p><p class="story-paragraph" data-source-key="188:0">还好那个Alpha被打走了，还好。</p><p class="story-paragraph" data-source-key="189:0">平整的牙齿一点一点地磕住细嫩的皮肉，迟迟顿顿地往里边陷。遵循着本能就这么咬上崔志宇的颈侧，又下意识地开始吮吸和亲吻的柳河览迷迷糊糊地想。</p><p class="story-paragraph" data-source-key="190:0">——还好来的人是志宇姐姐。</p><p class="story-paragraph" data-source-key="191:0">细密着上泛的疼痛倒是让崔志宇的瞳孔缩了缩，但是她还是没有松开环着柳河览的手。助理拿着消毒湿巾过来帮她把手上的黏腻擦干净。冷湿的触感把她迟钝的神经拉回现实，完成了工作大家已经陆陆续续在收工了。导演和两位经纪人私底下关系很好，已经约好了今天晚上的饭局。</p><p class="story-paragraph" data-source-key="192:0">助理离开的时候小声地告诉崔志宇柳河览的衣服放在隔壁的更衣室，摆明了要把空间留给她们两个人独处。</p><p class="story-paragraph" data-source-key="193:0">暧昧和怜惜的情绪太超过了，超过到了目睹的所有人都自然而然地认为这两真的有点什么。</p><p class="story-paragraph" data-source-key="194:0">她不否认，微微地朝着助理点了点脑袋，于是助理们也放心地走掉了。</p><p class="story-paragraph" data-source-key="195:0">“辛苦了。”</p><p class="story-paragraph" data-source-key="196:0">等到整个空间都只剩下两个人的时候，崔志宇才从喉咙里挤出含糊的安慰。脖颈被柳河览咬的太狠，已经留下了深刻的痕迹。牙印的周围泛着直白明了的艳红色。</p><p class="story-paragraph" data-source-key="197:0">那是很旖旎的痕迹，来自镜头之外，来自柳河览。</p><p class="story-paragraph" data-source-key="198:0">柳河览的脸埋在她的颈窝里，闷闷地讲：“不辛苦，命苦。”</p><p class="story-paragraph" data-source-key="199:0">指尖颤了颤，崔志宇徒劳地张了张嘴，什么都说不出口了。</p><p class="story-paragraph" data-source-key="200:0">落在下沉市场的工作中有除了挣快钱就只有万般不由己，她早就从经纪人的口中知道柳河览被骗着签了长期约的来龙去脉。</p><p class="story-paragraph" data-source-key="201:0">如果解约面临的价违约金，如果不解约的话，一直拖着没有业绩最后也只能落到挣不到钱没有饭吃的下场。</p><p class="story-paragraph" data-source-key="202:0">河览的皮囊太漂亮了，在虎狼环伺的地方，漂亮的脸蛋和很单纯的性格，构成的就是地狱本身。</p><p class="story-paragraph" data-source-key="203:0">她垂着眼，一点一点地亲柳河览的发顶，柔软又小心力度。窸窸窣窣的。</p><p class="story-paragraph" data-source-key="204:0">雨停了。</p><p class="story-paragraph" data-source-key="205:0">窗外的人造雨声因为工作结束也被停掉，空间落针可闻，工作人员离开的时候好像忘了两个主角还在场内。</p><p class="story-paragraph" data-source-key="206:0">干脆利落地关闭了电源。头顶的灯嚓的一声暗了下去，骤然她就看不清柳河览的表情。两个人都沉在了黑暗里，空气也安静下来了。</p><p class="story-paragraph" data-source-key="207:0">“……你还好吗？”柳河览突然问。</p><p class="story-paragraph" data-source-key="208:0">崔志宇犹豫了一下，还是点了点头：“还好，没有硬太厉害，可能过会儿就好。”</p><p class="story-paragraph" data-source-key="209:0">脖子上又挨一口，柳河览倒是笑出声：“好怕你憋成那方面的功能障碍。”</p><p class="story-paragraph" data-source-key="210:0">她的声音很轻，很柔软，带着笑，有一点顽劣：“姐姐如果硬不起来了，以后就没有人能够在镜头面前保护我了。”</p><p class="story-paragraph" data-source-key="211:0">这种挪揄带了些轻松的笑意，但是不好笑。</p><p class="story-paragraph" data-source-key="212:0">崔志宇的下巴抵住柳河览的额头，密不透风地将她抱在自己的怀里。</p><p class="story-paragraph" data-source-key="213:0">—我会一直保护你的。</p><p class="story-paragraph" data-source-key="214:0">她没有来由地想起了剧本里的那句台词。</p><p class="story-paragraph" data-source-key="215:0">操进去的时候知羽很真挚地看着河岚的眼睛说我会一直保护你的。</p><p class="story-paragraph" data-source-key="216:0">崔志宇迟钝地眨了眨眼睛，想起来当初在朋友家里看到河览的第一部作品的时候，被迫呈现在镜头面前的身体白皙且幼态，被摄像头捕捉到的眼眸嗔黑，蒙着一层薄薄的水雾。</p><p class="story-paragraph" data-source-key="217:0">她鬼使神差地就想到这句话了。</p><p class="story-paragraph" data-source-key="218:0">——我会一直保护你的。</p><p class="story-paragraph" data-source-key="219:0">这种话很常见，救赎向的小说里最多。</p><p class="story-paragraph" data-source-key="220:0">金主恩一直吐槽她说感觉她看这种小说的时候把脑子看坏掉了。知道她跑去签了情色公司的时候表情像见了鬼一样，哽了半晌才说崔志宇我看你的脑子是真的坏掉了。</p><p class="story-paragraph" data-source-key="221:0">“现在我和姐姐还在片场里。”</p><p class="story-paragraph" data-source-key="222:0">柳河览地接着讲。</p><p class="story-paragraph" data-source-key="223:0">她仰着头，细细碎碎地亲吻崔志宇的颈侧，声音很轻：“我继续做知羽姐姐的河岚，你要一直保护我，你不可以欺负我。”</p><p class="story-paragraph" data-source-key="224:0">她的声音真的很轻，落针可闻的空间里也是风吹一吹就散去的程度。手掌抚上崔志宇的后颈，如同殉死的羔羊似地把自己整个的献入对方的怀中。小腹再度贴上对方支棱着的性器的时候，河览觉得自己的耳根又不争气地烫了起来。</p><p class="story-paragraph" data-source-key="225:0">但是她还是哑着声音，一点一点地讲剧本之外的台词：“知羽姐姐对我做什么都可以。”</p><p class="story-paragraph" data-source-key="226:0">声音太轻，须臾之间，却是电光石火，宛若千钧。</p><p class="story-paragraph" data-source-key="227:0">河览的声音发涩，抖的太厉害，索性彻底把自己埋进崔志宇的怀里。只要不出这个房间就可以是崔知羽和柳河岚，崔知羽和柳河岚做什么都可以。</p><p class="story-paragraph" data-source-key="228:0">手掌颤颤巍巍地摸上崔志宇的性器，很笨拙的套弄。跳动的在掌心里膨胀着的器官和落在耳边逐渐加重的呼吸声都是崔志宇的。</p><p class="story-paragraph" data-source-key="229:0">志宇志宇志宇…</p><p class="story-paragraph" data-source-key="230:0">她在心里默念了好多次这个名字，湿漉漉的眸子抬起来，氤氲开水雾，小声地道：“知羽姐姐，只用手指的话不够，你要帮我。”</p><p class="story-paragraph" data-source-key="231:0">崔志宇的大脑一片空白，那是一种前所未有的体感。</p><p class="story-paragraph" data-source-key="232:0">分化成Alpha之后她也没怎么碰过自己的这个多出来的性器官。在学校里遇到易感期全靠请了假在宿舍里嗑抑制剂咬着牙熬。现在生理构造上类似于命根子一样被河览握在手里笨拙地撸动着。从根部到冠头，膨胀起来的快感，又愉悦又舒适又别扭，难怪有的Alpha会喜欢手冲。</p><p class="story-paragraph" data-source-key="233:0">呼吸加重的刹那志宇只觉得自己快要嘎巴一下死在那了。</p><p class="story-paragraph" data-source-key="234:0">“这么搞会上瘾的。”她的声音都在发颤。</p><p class="story-paragraph" data-source-key="235:0">没有办法推开河览，也没有力气推开河览。</p><p class="story-paragraph" data-source-key="236:0">“什么瘾？”</p><p class="story-paragraph" data-source-key="237:0">柳河览很耐心，声音很小地问她。手上一刻不停，眼睛在黑暗里注视着崔志宇。她的眼睛溜圆，沾染情欲，就变得湿漉漉的。崔志宇别过头不说话，良久喉咙深处挤出来弱弱的字眼：“性瘾。”</p><p class="story-paragraph" data-source-key="238:0">性瘾么？</p><p class="story-paragraph" data-source-key="239:0">到是很难从其他人口里听到的词汇，嗤地一声笑出来。柳河览垂着眼加快了手上的动作。隔着布料其实那根东西也不算烫手，只是有很微妙的心思，自己是脏兮兮黏糊糊的那崔志宇也休想干干净净离开片场。</p><p class="story-paragraph" data-source-key="240:0">“只是这个程度就要上瘾了吗？”她的声音里带了笑意，“那以后呢？会对其他人上瘾么？”</p><p class="story-paragraph" data-source-key="241:0">耳边的喘息声越来越重，崔志宇的身体绷的很紧。在高度紧张的情况下人是没有办法完全放松的，有一点恶劣地拉开对方的裤链又将那根玩意握住，在崔志宇的身体完全绷直的刹那手指毫不留情地堵住了顶端。</p><p class="story-paragraph" data-source-key="242:0">“要先回答我噢知羽nim，会对其他人上这方面的瘾吗？”</p><p class="story-paragraph" data-source-key="243:0">眨了眨眼，河览倒是迟钝地想起来崔志宇的未来其实可能也不止会有她这一个搭档。兼职的艺人多用于救场上面，而崔志宇又漂亮的过分，公司是不会放弃任何可以薅崔志宇的机会的。</p><p class="story-paragraph" data-source-key="244:0">想到这里河览有一点点泄气，报复性地又用力揉了揉那根性器的顶端，引出崔志宇一声低呼，又声音软软地警告她：“不可以的事情噢。”</p><p class="story-paragraph" data-source-key="245:0">不可以对其他人上瘾，也不可以说这种话。</p><p class="story-paragraph" data-source-key="246:0">崔知羽不可以，崔志宇也不可以。</p><p class="story-paragraph" data-source-key="247:0">话音落就发现崔志宇梏住自己的手臂又紧了一点，声音很小很小地反驳她：“可是河览，我是崔志宇呀。”</p><p class="story-paragraph" data-source-key="248:0">不是热忱的，单纯的崔知羽，不是爱着柳河岚的青梅竹马崔知羽。</p><p class="story-paragraph" data-source-key="249:0">而是崔志宇。</p><p class="story-paragraph" data-source-key="250:0">首尔大学里的学生崔志宇，这所色情公司的兼职艺人崔志宇，克制力极强又很懂礼貌的崔志宇，从小到大循规蹈矩，除了跑来拍色情片，从来没有做过任何的出格的事情的崔志宇。</p><p class="story-paragraph" data-source-key="251:0">手指颤抖地抚上河览的脸侧，小心地一点一点摸过对方的眉眼。拱进怀里的人柔软又温暖，裹着毛茸茸的毯子，就像小动物一样。</p><p class="story-paragraph" data-source-key="252:0">陷入黑暗的空间里做什么事都会被允许么？</p><p class="story-paragraph" data-source-key="253:0">已经被快感冲到僵滞的大脑迟钝地反问着自己这样的话，如果在这里就这么做了，在关着的镜头面前和搭起来的片场上这么做了。算什么呢？</p><p class="story-paragraph" data-source-key="254:0">明明就是彼此心知肚明的答案。</p><p class="story-paragraph" data-source-key="255:0">离开了镜头就不可能是崔知羽和柳河岚了。</p><p class="story-paragraph" data-source-key="256:0">“没有关系。姐姐。”</p><p class="story-paragraph" data-source-key="257:0">河览眨了眨眼睛，用很柔软的声音说这句话。</p><p class="story-paragraph" data-source-key="258:0">这种事关情色的制片公司向来注重信息素管制，Alpha会事先服用抑制剂，为了防止信息素这种东西造成其他方面的失控，甚至每一个参与拍摄的omega的脖子上，都会系上隔绝阈值很高的隔离带。</p><p class="story-paragraph" data-source-key="259:0">柳河览抬手，轻轻地将那根丝带从自己的颈间解开了。</p><p class="story-paragraph" data-source-key="260:0">窸窸窣窣的声音传来，崔志宇迟钝地眨了眨眼睛，按在在后颈上的手重了重力度，她乖顺地把头低下去。嘴巴被河览啄了啄，扑鼻而来的是雪绒花的清透香气。</p><p class="story-paragraph" data-source-key="261:0">——是河览的信息素。</p></div>
