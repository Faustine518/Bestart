着薄薄的红色。是羞的还是爽的？她好想问，那些话到嘴边又说不出口了。还是太轻浮了。</p><p class="story-paragraph" data-source-key="1049:0">Carmen偶尔也会给自己发其他的alpha的片作拍摄参考。卢维那的片子她也看过一点，染着漂亮的红色头发的alpha小朋友格外喜欢在镜头面前用黏糊糊的语气问姐姐舒服吗？边问边很粗暴的凿，到了后面志宇都快分不清楚被操的那个Omega到底是痛到受不住还是舒服到极致了。</p><p class="story-paragraph" data-source-key="1050:0">我把你弄痛了吗？</p><p class="story-paragraph" data-source-key="1051:0">会喜欢这样吗？</p><p class="story-paragraph" data-source-key="1052:0">这些问题都是她想问河览的。</p><p class="story-paragraph" data-source-key="1053:0">可是想到这些问题崔志宇的耳根也红了，问不出口，索性俯下身埋头苦干。停下来的间隙反复地问你要嫁给我么？你要做我的妻子吗？你要和我结婚么？她好似魔怔了，固执又认真地咬着这个点。脑子被交合的快感绞成一片浆糊，小腹处蓄着的火直挺挺地往下冲。</p><p class="story-paragraph" data-source-key="1054:0">这种阵仗太大了，恍然给了河览一种明天醒过来她就要被崔志宇拉去提交婚申告的错觉。</p><p class="story-paragraph" data-source-key="1055:0">她只是努力的，更努力地把志宇抱得更紧一点。</p><p class="story-paragraph" data-source-key="1056:0">一开始在明明讲着的安珍和清姬的故事的人，现在是问着自己要不要结婚的人。</p><p class="story-paragraph" data-source-key="1057:0">可是我是没有明天的人啊姐姐…</p><p class="story-paragraph" data-source-key="1058:0">她说不出话，声音被崔志宇顶的支离破碎，手徒劳地在崔志宇的脊背上抓出长长、浅红色的痕迹。</p><p class="story-paragraph" data-source-key="1059:0">痕迹不久后会消失的。</p><p class="story-paragraph" data-source-key="1060:0">她也是，不是么。</p><p class="story-paragraph" data-source-key="1061:0">一瞬即逝的念头被更猛烈的，关于感官上的潮水淹没。面前突兀地泛着白光，脑子里也一片空白。嘎吱嘎吱晃着的小床陷入了短暂的偃旗息鼓，她的手还贴在志宇的背上，无意识地挠了挠，又被对方捉下来送到唇边小心的亲吻。</p><p class="story-paragraph" data-source-key="1062:0">过于冗长的性事漫长到似没有尽头，以至于到了最后两个人都精疲力尽，坠入黑甜之前河览隐约觉得自己沉入了一片冰冷的海里，肺里的空气被水里挤压，透不过气似的。</p><p class="story-paragraph" data-source-key="1063:0">哗啦一声，有人就这么跳了下来。扑入鼻腔的是烂漫的蔷薇香气，清冽浅淡柔，并非她在崔志宇的颈间嗅到的那股浅淡的白茶香气。</p><p class="story-paragraph" data-source-key="1064:0">是克莱尔奥斯汀的味道，她所熟悉，却又在这个时刻倍感陌生的香气。</p><p class="story-paragraph" data-source-key="1065:0">柔软的明媚的蔷薇香，缱绻缠绵地绕住她。</p><p class="story-paragraph" data-source-key="1066:0">她被托着往上浮，破开水面见到天光的那一刹那，也看到了崔志宇的那双被眼泪泡红的眼睛——湿漉漉的透着光的眼睛，落下来的眼泪滚烫。烫的河览心脏骤然一缩。</p><p class="story-paragraph" data-source-key="1067:0">随即便是更深、更深的坠落感。</p><p class="story-paragraph" data-source-key="1068:0">她昏睡了过去。</p><p class="story-paragraph" data-source-key="1069:0">金宇宙的新公寓买在清潭洞，买的时候恰好在搞风水题材的本子，户型自然也选南北通透。客厅处嵌了巨大的落地玻璃，居高临下往下眺的，南山汉江首尔公园都能够尽数地收入眼中——这是只有站上高楼才能够见得到的漂亮景色。青山绿水被居高临下地收入眼中的漂亮须臾间让金多绚明白了崔志宇和金宇宙的顶层病从何而来，咂咂舌心里吐槽一句壕无人性，听到身后一声嗤笑，回头发现金宇宙倒是已经出来了。</p><p class="story-paragraph" data-source-key="1070:0">没有工作的时候宇宙习惯性睡到日上三竿，以前多绚过来找她的时候这个人基本都赖在窝里睡大觉，难得一次早起说明心里有事。</p><p class="story-paragraph" data-source-key="1071:0">“合同的事情搞定了？。”</p><p class="story-paragraph" data-source-key="1072:0">“比想象里要好搞一点。”</p><p class="story-paragraph" data-source-key="1073:0">金多绚将文件夹拿出来放到桌子上，顺手从果盘里捞个苹果吭哧吭哧啃，充沛的果酸与果汁在口腔里爆发，她眯起眼睛，“与其说是我去找老板谈，倒是他一大早就打电话把我叫过去了。”</p><p class="story-paragraph" data-source-key="1074:0">十九岁的小孩，脸上还有些婴儿肥没有消下去，脸颊被食物撑的鼓鼓的，整个人都散发着一种憨态的可爱：“倒是好奇宇宙姐姐到底给公司发了什么函，编剧X的名头这么大么？感觉老板都恨不得把河览洗干净打包送到你床上了。”</p><p class="story-paragraph" data-source-key="1075:0">“要真送到我床上就不还给你们了。”金宇宙的唇角往上，勾出个要笑不笑的弧度，话风骤然却转了，“倒是你，该把在这些公司染上的坏毛病改一改啊金多绚 。”</p><p class="story-paragraph" data-source-key="1076:0">“又不是一辈子要去搞那种灰色产业，张口床下闭口床上，最近是准备去找一个皮条客的工作作为消遣么？”</p><p class="story-paragraph" data-source-key="1077:0">“我觉得当一辈子经纪人也不错啦 。”金多绚嘟嘟囔囔的，“难道要学我爸我哥那样么？”</p><p class="story-paragraph" data-source-key="1078:0">明显不想继续这个话题了，金宇宙将文件夹拿过来放到一旁，转而抽出另一本薄薄的纸册丢过去：“看看。”</p><p class="story-paragraph" data-source-key="1079:0">啃完苹果，果核丢进垃圾桶里，金多绚擦了擦手才把这本纸册拿起来看。扉页漂亮干净，空无一字，只是简简单单的勾着云纹，翻开看是工整明朗的印刷体，时不时看得到金宇宙笔写的修改和注解。</p><p class="story-paragraph" data-source-key="1080:0">很轻很偏的叙事流，但是不算是当下时兴，明显是上了年份的东西，被翻阅过很多次，页边也轻轻地翘了起来。</p><p class="story-paragraph" data-source-key="1081:0">“以前怎么没看到这本？”</p><p class="story-paragraph" data-source-key="1082:0">“毕业那年写的，这几年没有相到合适的人，所以一直没有拿出来拍。”</p><p class="story-paragraph" data-source-key="1083:0">“现在有了？河览？直接抬女一？”</p><p class="story-paragraph" data-source-key="1084:0">“你在帮她撕资源么？”金宇宙嗤了一声，抽出笔在本上的某个名字处画了个圈，“漂亮，贫穷，一无所有，但是不是主角。适合现在的她。”</p><p class="story-paragraph" data-source-key="1085:0">重要的是贴合。</p><p class="story-paragraph" data-source-key="1086:0">其实很难讲第一次见到河览的感觉。</p><p class="story-paragraph" data-source-key="1087:0">漂亮是必然的，眼睛圆牙也齐整，骨相与皮囊的相得益彰，五官浓一点算是艳，浅一点是清淡。但是只有漂亮是不够的，干她这一行的漂亮皮囊放在眼前如同过江之鲫，圈内顶级皮囊晃在眼前的不计其数，多多少少会有一点审美疲劳落在身上 。</p><p class="story-paragraph" data-source-key="1088:0">不是没有见过那种倔强又可怜的小白花类型，只是确实是让宇宙觉得有些微妙的不一样了。</p><p class="story-paragraph" data-source-key="1089:0">发自骨子里的贫穷和即便是这样也要努力打直的脊背，没有来由地就让她认为找到了贴合剧本里的角色，自然而然的，也会发自内心地认为这张皮囊只拍情色片过于可惜。</p><p class="story-paragraph" data-source-key="1090:0">只是宇宙总觉得这位不适合混娱乐圈，家里太穷，没有依仗，很容易被欺负。很久以前业内有很漂亮的女演员在家里自杀了，满纸满页的控诉，看上去触目惊心。</p><p class="story-paragraph" data-source-key="1091:0">公司对外宣布是长时间的抑郁情绪所致的自戕，其实真实缘由到底为何，都是大家餐前酒后心照不宣避开的话题。</p><p class="story-paragraph" data-source-key="1092:0">被困于天价的违约金，又有着漂亮的皮囊，在那些奇怪的欲望面前，自由好像就变成了遥不可及之物。须臾间她好像明白了金多绚的急切，如果河览靠到志宇，觊觎她的目光就会少很多，如果河览脱离公司，没有了天价违约金的胁迫，自由也是唾手可得的东西。</p><p class="story-paragraph" data-source-key="1093:0">明明一开始还想和颜悦色地问一下河览想要做什么的。</p><p class="story-paragraph" data-source-key="1094:0">结果到最后也稀里糊涂的帮助对方做决定的程度。</p><p class="story-paragraph" data-source-key="1095:0">“我联系了珉周姐姐，她一直想导这个本子，带的组也是beta女性成员偏多一点，你应该放心多一点。”</p><p class="story-paragraph" data-source-key="1096:0">“跟我没关系啦。”金多绚摊了摊手，“我把河览的合同带过来了，宇宙姐姐的名头太厉害了，把老板吓到差点原地解约。河览不是我们这边的艺人了。”</p><p class="story-paragraph" data-source-key="1097:0">“是吗？”</p><p class="story-paragraph" data-source-key="1098:0">犹豫了一下，宇宙顺手抄起果盘里还剩的另一个苹果丢过去：“…短暂的，河览的合同会直接转移到我这里。”</p><p class="story-paragraph" data-source-key="1099:0">总觉得多绚一直在那种灰色的地方混日子不好，金宇宙犹豫着，逐字逐句斟酌，又轻轻问：“我没有带艺人的经验，你要过来继续带她么。工资可能没有你的零花钱高，但是比在那里好很多。”</p><p class="story-paragraph" data-source-key="1100:0">丢过去的苹果被金多绚轻轻地接住了，目光从苹果又转到金宇宙的脸上，金多绚无所谓地耸耸肩膀：“都是混日子啦。懒得辞职。”</p><p class="story-paragraph" data-source-key="1101:0">“是觉得你待在那里不好。”</p><p class="story-paragraph" data-source-key="1102:0">轻轻声地，金宇宙说。</p><p class="story-paragraph" data-source-key="1103:0">她和崔志宇一个性格，鲜少会有情绪过于直白外露的时候，只是担心是遮不住的。那种地方的可怜人太多，金多绚这样的性格，不适合长久的在那个地方混。</p><p class="story-paragraph" data-source-key="1104:0">金多绚挑着眉，苹果在手里抛了抛，脸上的笑收了。</p><p class="story-paragraph" data-source-key="1105:0">“在担心我吗？”</p><p class="story-paragraph" data-source-key="1106:0">金宇宙在这种骤然变冷的目光下坦诚地点了点头：“是的，我在担心你。”</p><p class="story-paragraph" data-source-key="1107:0">“也没必要担心我啦。 ”多绚把苹果轻轻放回去，眨了眨眼，做出一副俏皮又无辜的模样，“但是好的经纪人倒是真知道一位，姐姐愿意的话我把她推给姐姐。”</p><p class="story-paragraph" data-source-key="1108:0">河览从昏钝中醒过来的时候已经近中午了。好似做了很多冗杂的梦，醒过来的时候心脏在胸腔里怦怦的跳着，几乎快要喘不过气。腰疼腿软，身上却是出乎意料的干爽，房间已经被早起的另一位收拾整齐了。阳台上的洗衣机发出的轰鸣声传过来。</p><p class="story-paragraph" data-source-key="1109:0">绷紧的头皮在一瞬间又松下去了，就算身侧的床铺是空荡荡的也能够确定崔志宇没有离开，好奇怪的感觉，即失落又开心。</p><p class="story-paragraph" data-source-key="1110:0">她和志宇姐姐之间的牵扯好像更多了。</p><p class="story-paragraph" data-source-key="1111:0">河览还没有从思考中反应过来，崔志宇倒是很自然地端着碗推门而入了。</p><p class="story-paragraph" data-source-key="1112:0">看到河览睁开的眼睛她愣了愣，崔志宇地将手里的碗递过去。</p><p class="story-paragraph" data-source-key="1113:0">“熬了粥，买了一点小菜，要先填填肚子么？”</p><p class="story-paragraph" data-source-key="1114:0">浓稠温热的白粥粒粒分明，凑在河览的鼻尖下散着淳朴的粮食香气，肚子不争气地咕咕叫了起来，性事对于体能的消耗很大，饿是理所当然的感官。崔志宇同往日无异，颈侧甚至大喇喇地留着那些嫣红的淤痕，其实从颈侧到肩膀，甚至是脊背上都有河览留下来的痕迹，若是懂一点的人一定是恨不得扯个围巾把自己的这些痕迹遮的严严实实。可是志宇在这方面神经大条的不太像个正常人，只是敞亮昭然地站在河览面前，溜圆又漂亮的眼睛坦然地盯着她看，眼神自然无辜，干净透亮。</p><p class="story-paragraph" data-source-key="1115:0">啊…这个混蛋</p><p class="story-paragraph" data-source-key="1116:0">难道酒后乱性这种事情对成年人来说很正常吗？为什么要用这种眼神看我。</p><p class="story-paragraph" data-source-key="1117:0">为什么不害羞。</p><p class="story-paragraph" data-source-key="1118:0">河览自暴自弃地闭着眼睛，眼睛甚至都不敢往下看了。</p><p class="story-paragraph" data-source-key="1119:0">暴烈的交合带来的后果就是腰酸腿痛，还有身上的那些蔓延交错的痕迹。没有办法拒绝用湿漉漉的眼神看着自己的崔志宇所以就默认了这一切的发生，睡梦里甚至做好了这个人提着裤子跑路的准备没有想到的是醒过来还是能够看到崔志宇的身影。</p><p class="story-paragraph" data-source-key="1120:0">只是坦荡过度了，莫名让河览有一种巴掌扇不到她脸上的无力感。</p><p class="story-paragraph" data-source-key="1121:0">什么啊崔志宇，合格的Alpha在发生了一夜情之后不都应该手忙脚乱的解释这种事情发生了都是胡闹都是误会么？</p><p class="story-paragraph" data-source-key="1122:0">为什么半点慌乱都没有？</p><p class="story-paragraph" data-source-key="1123:0">这么一想河览觉得有点好笑，明明自己才是生理上吃亏的一方却迫切希望着对方能做提上裤子就走人的人渣。</p><p class="story-paragraph" data-source-key="1124:0">不知道为什么，她真的觉得崔志宇会把她拉去做婚姻申告。</p><p class="story-paragraph" data-source-key="1125:0">稍微把眼睛睁开一条缝，河览发现崔志宇还在那里，坦然的温柔地盯着自己，仿佛两个人之间什么都没有发生。</p><p class="story-paragraph" data-source-key="1126:0">但是明明就发生了不是么？</p><p class="story-paragraph" data-source-key="1127:0">洗的发白的棉T穿在这个人身上有一点突兀的失和感，意识到河览上下打量的眼神，崔志宇有些不自然地移开目光：“…我忘了带换洗的睡衣过来，你信吗。”</p><p class="story-paragraph" data-source-key="1128:0">“不是这个意思。”</p><p class="story-paragraph" data-source-key="1129:0">河览开口，发现声音也哑哑的，她斟酌了一下用词：“衣服太旧了，你穿上去，看着，有一点可怜。”</p><p class="story-paragraph" data-source-key="1130:0">“我本来就是很可怜的人。”崔志宇面不改色地接着她的话头继续讲，“你要多怜惜我一点。”</p><p class="story-paragraph" data-source-key="1131:0">又平静又坦然的语气，河览觉得自己拿她没办法了。</p><p class="story-paragraph" data-source-key="1132:0">有些挫败地叹了一口气，她还是开口：“姐姐你先转过去吧。”</p><p class="story-paragraph" data-source-key="1133:0">“再怎么怜惜你也得先让我把衣服穿上对不对？”</p><p class="story-paragraph" data-source-key="1134:0">其实这么讲也有一点奇怪，该做的事情都做了，好像坦然的在崔志宇面前穿衣服也不是不可以。算起来做的次数也不是这一次了。</p><p class="story-paragraph" data-source-key="1135:0">要看着也没关系。</p><p class="story-paragraph" data-source-key="1136:0">这么想着河览懒然地撑起了身子，薄薄的被子骤然从身上滑落，露出肌肤上斑驳的痕迹。大概是情动到不得了， 崔志宇在她身上的很多地方都留了痕迹，各色各样的吻痕刺到崔志宇的眼猛然地把眼神移开，厚脸皮的Alpha终于显出了不安的意向，颇为局促地背过了身子。</p><p class="story-paragraph" data-source-key="1137:0">“不看了么？”</p><p class="story-paragraph emphasis" data-source-key="1138:0">懒然的声音，一点点鼻音， 从身后传入耳朵里，调皮又憨气，带着笑。恍然好似又回到了在片场上的状态。</p><p class="story-paragraph emphasis" data-source-key="1139:0">可是明明不是在片场上呀。</p><p class="story-paragraph emphasis" data-source-key="1140:0">如果不在片场上的话 ，崔志宇在没有办法坦然地应对这样的调笑的。她的耳根红透，一下子说不出来任何话。</p><p class="story-paragraph emphasis" data-source-key="1141:0">河览总是在一些莫名其妙的地方有胜负欲，看到崔志宇的耳根红透就知道她好似又掰回一局。她心情大好，对着崔志宇落荒而逃的背影笑出声音。彻底放松下来的时候，就连呼吸之间都是彻头彻尾的轻松。在这个须臾没什么太多要担心的事情，吃泡面还是吃饭团不用考虑，不用考虑Stella会给自己发什么猎奇的本子，甚至不用想自己能不能活到明天。</p><p class="story-paragraph emphasis" data-source-key="1142:0">是好难得一次的好心情，可是就是这么难得的一次，河览却突然地想。</p><p class="story-paragraph emphasis" data-source-key="1143:0">如果时间一直停留在这里就好了。</p><p class="story-paragraph emphasis" data-source-key="1144:0">多吃一点苦也没有关系，喝泡面汤也没有关系，只要志宇一直留在这里和她相依为命，时间一直一直地停在这一刻就没有关系。</p><p class="story-paragraph emphasis" data-source-key="1145:0">只要志宇姐姐在就好了。</p><p class="story-paragraph" data-source-key="1146:0">志宇走出去的时候轻轻地带上了房间门，随手将手里的粥碗放在餐桌上。</p><p class="story-paragraph" data-source-key="1147:0">Carmen早上发过来的信息还静静地躺在手机里：因为河览的合约变动，接下来的所有拍摄都取消了。</p><p class="story-paragraph" data-source-key="1148:0">知羽和河岚的故事在没头没脑的地方戛然而止，分明在她意料之内。但是揪心感来的莫名其妙，彻底脱离了剧本和镜头，崔志宇就不是崔知羽了。</p><p class="story-paragraph" data-source-key="1149:0">随之而来的还有多绚的讯息：新的合约已经转到了编剧X名下的工作室里，宇宙姐姐拿出了自己压箱底的剧本，没过几日就要开始试镜和选角——剧本里的某一个角是为河览保留的，那是尘埃落定的事情，她会通过那个角色在荧幕上放出异彩，相关的通稿会直接和编剧X挂钩。</p><p class="story-paragraph" data-source-key="1150:0">就连志宇一直担心的母带和未释出的资源均以移送到宇宙的手里了，只是金宇宙似乎格外讨厌这种性质的影像，甚至没有多看一眼，直接把存着这些东西的磁盘卡带全部泡进了水里。</p><p class="story-paragraph" data-source-key="1151:0">而这意味着，河览不会再被过去的阴影威胁了。没有人知道她从何而来，以前是做什么的。那些她所恐惧的黑洞洞的镜头会成为捧着她向上走的梯级，上去一点，离自由就近一点。</p><p class="story-paragraph" data-source-key="1152:0">就算是一无所有的河览又怎么样呢？</p><p class="story-paragraph" data-source-key="1153:0">志宇盯着多绚发过来的消息轻飘飘地想</p><p class="story-paragraph" data-source-key="1154:0">——她也不会再是一无所有了的柳河览。</p><p class="story-paragraph" data-source-key="1155:0">好像可以离开了。</p><p class="story-paragraph" data-source-key="1156:0">她从多绚发过来的消息里剖析出来了这样的字眼，没来由地觉得好笑。</p><p class="story-paragraph" data-source-key="1157:0">执行力比她的想象力要快很多的多绚，动作快到让志宇有一点猝不及防。</p><p class="story-paragraph" data-source-key="1158:0">快到她还没有彻底地将柳河览融到自己的生命里，就要开始做道别的准备。</p><p class="story-paragraph" data-source-key="1159:0">要难过么？</p><p class="story-paragraph" data-source-key="1160:0">崔志宇眨了眨眼，后知后觉地开始想这个问题，她想不出来，心脏却持续的，细密地泛起了尖锐的疼痛。好似在决心去把河览带出来的时候，决心要自以为是地拯救河览的时候，甚至在对方坦诚的注视下点头的那一刹那，心脏就已经被扎下了隐秘的尖刺，一千根、一万根，锥心蚀骨，痛不欲生。</p><p class="story-paragraph" data-source-key="1161:0">可是她不知道这种“难过”是不是正确的。这是以前未曾体验过的东西。</p><p class="story-paragraph" data-source-key="1162:0">明明只是为数不多的交集，却在这些为数不多里产生了滚烫而疯狂的念头，就算那种念头汹涌又持续，到了极致的时候恨不得死在当下，可那不是长久的，甚至不是现实的，就在此刻以一种轻飘的姿态盘旋在她的脑子里——河览愿意成为我的妻子吗？</p><p class="story-paragraph" data-source-key="1163:0">她站在原地，垂着眼睛，手指无意识地收紧，掌心被手机边框烙出长长的痕迹。就算记得昨晚发生了什么，记得每一句从自己的嘴巴里说出来的那些话。就算身体的每一处地方都已经沾染上了雪绒花的气息，就算到现在这一刻也在见到河览的那一个刹那会有想要拥抱过去的冲动。</p><p class="story-paragraph" data-source-key="1164:0">然后呢？</p><p class="story-paragraph" data-source-key="1165:0">知羽和河岚已经无疾而终了，她和河览之间还有可以剩下的东西吗？</p><p class="story-paragraph" data-source-key="1166:0">崔志宇和柳河览之间还剩下什么？</p><p class="story-paragraph" data-source-key="1167:0">她不知道，也不敢知道。</p><p class="story-paragraph" data-source-key="1168:0">她抬指，轻轻选中消息，然后按下删除。</p><p class="story-paragraph" data-source-key="1169:0">熄屏的刹那她从漆黑的屏面上看到自己的倒影，还似往，镇定自若，云淡风轻。</p><p class="story-paragraph" data-source-key="1170:0">也没有什么大不了。</p><p class="story-paragraph" data-source-key="1171:0">崔志宇在心里对自己讲。</p><p class="story-paragraph" data-source-key="1172:0">会过去的。</p><p class="story-paragraph" data-source-key="1173:0">她闭上眼睛，很轻很轻的，在心里又想一遍。</p><p class="story-paragraph" data-source-key="1174:0">会过去的。</p></div>

      <article class="chapter" data-chapter="section-06">
        <header class="chapter-header"><span class="chapter-number">06</span><h2>Chapter 06</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="1179:0">曾经在妹妹的嘴里听到过一句很有意思的话，事物是具有连贯性的。被幸运砸中就会一桩事情接着一桩事情的幸运下去，被不幸砸中就会无穷无尽地做倒霉鬼。</p><p class="story-paragraph" data-source-key="1180:0">她是很倒霉的人，活得太倒霉太莫名其妙，以至于捡到崔志宇的很长一段时间，她所思考的就是自己的霉运会不会带给这只路边捡回来的小狗。</p><p class="story-paragraph" data-source-key="1181:0">小狗。</p><p class="story-paragraph" data-source-key="1182:0">已经习惯性地用这种话替代崔志宇三个字了。</p><p class="story-paragraph" data-source-key="1183:0">好似把小狗捡回家之后，很多事情就理所当然地顺当了起来。</p><p class="story-paragraph" data-source-key="1184:0">公司的人事打电话过来通知自己过去解约的时候语气也不是很好。也是因为连着打了几十通通电话也没有被接到的缘故。</p><p class="story-paragraph" data-source-key="1185:0">开了静音的手机偶尔也会信号失灵，更何况昨夜也没有空暇去接电话。</p><p class="story-paragraph" data-source-key="1186:0">手机在床头嗡嗡地震动了很多次，每次她伸手要去拿的时候就会被崔志宇以一种黏绵的态度将手腕攥住。到后面意识也被撩拨起来的情欲浸的模糊就更顾不得这些，直到穿好衣服拿起手机的时候河览才先想起来昨晚的未接来电——照着号码拨过去的时候听到对方在电话那头用很机车的语气讲，拜托小姐昨晚到底在做什么，怎么连自己的切身利益也不关心呀？</p><p class="story-paragraph" data-source-key="1187:0">河览愣怔了片刻。</p><p class="story-paragraph" data-source-key="1188:0">声音她认得，当时给她办入职报培训的大叔，香港来的beta，梳背头留络腮胡，说话韩语夹港话。很认真给她讲即要认命也不能太认命。</p><p class="story-paragraph" data-source-key="1189:0">大概也明白河览的脑子听不懂什么太委婉的阴阳怪气，人事先生还是放缓了语气让她去公司签东西，应该是走了狗屎运，老板亲自发了话要解她的约，她以后不用再拍色情片了。</p><p class="story-paragraph" data-source-key="1190:0">换句话来讲，她自由了。</p><p class="story-paragraph" data-source-key="1191:0">自由了。</p><p class="story-paragraph" data-source-key="1192:0">三个好简单的字，拼凑在一起却是前段时间一直忧心忡忡却又梦寐以求的东西。她猛地放下手机，那头还在讲话，乱七八糟的她也听不清楚了。</p><p class="story-paragraph" data-source-key="1193:0">脑子里反反复复回荡的只有那句话，她自由了。</p><p class="story-paragraph" data-source-key="1194:0">不用被黑洞洞的镜头照，不用被吼叫着摆出生涩又下流的姿势，不用明明很痛苦还要做出欢愉的模样，在一切彻底发生之前，命运似乎真的开始对她这种倒霉鬼有所垂怜，持续的敲击着她的倒霉大锤在这一个片刻移开了些许，终于舍得留给她片刻喘息的余地。</p><p class="story-paragraph" data-source-key="1195:0">“现在进行的那个也不用拍了吗？”</p><p class="story-paragraph" data-source-key="1196:0">她的脑子嗡嗡响，说出口的时，电话对面静默了一瞬。</p><p class="story-paragraph" data-source-key="1197:0">大概香港来的人骨子里都透着计较利益的精干，人事佬操一口不是很标准的首尔腔念她半天，喋喋不休，恨铁不成钢地问：“不是小姐，有情饮水饱啊？”</p><p class="story-paragraph" data-source-key="1198:0">合同解除了，该关心的是公司应付多少违约金，最终结算到银行卡里的金额款项能不能撑到你找下一份工作这些问题——而不是纠结和哪个漂亮的Alpha在片场上纠缠不休或者留意哪个没拍完的片。</p><p class="story-paragraph" data-source-key="1199:0">情绪激动，对方的声音也大起来，老手机收声不好，刺喇喇地刮河览耳膜。</p><p class="story-paragraph" data-source-key="1200:0">“我知道我知道。”河览把手机拿远一点，对着那头小声地讲：“你不要激动，我耳朵被刺的疼 。”</p><p class="story-paragraph" data-source-key="1201:0">她是个可怜鬼这种事整个人事办公室都知道，说出来那边就蓦地收声，有些说不出话。</p><p class="story-paragraph" data-source-key="1202:0">憋了半天就听到重重一声叹：“你知道个屁，你就是个笨小孩。”</p><p class="story-paragraph" data-source-key="1203:0">香港佬还真的拿笨小孩没办法，他还有一万个不放心。挂电话前好似也有很多话想讲，欲言又止半晌，恨恨又讲：“出来了少同那些拍片的Alpha搅做一堆，专职的脏兼职的又有多干净？干这行的不是懒就是笨，匆匆忙忙图来图去不就为个钱字。”</p><p class="story-paragraph" data-source-key="1204:0">不要与那样的，那些人搅在一起，会活很惨。</p><p class="story-paragraph" data-source-key="1205:0">实在不知道该怎么样用善良的措辞来讲这些事，只得又叹一声：“你尽快来，下午三点，老板变脸赛翻书的。一不留神小心他又反悔。”</p><p class="story-paragraph" data-source-key="1206:0">电话被挂断了。</p><p class="story-paragraph" data-source-key="1207:0">嘟嘟两声忙音，香港佬行事作风向来风火，过半百的年龄还是干精火旺。</p><p class="story-paragraph" data-source-key="1208:0">柳河览收起电话的时候没来由想起来当初也是他骂骂咧咧给自己办流程，风风火火的丢了工作牌转头就往下发培训通知，笑嘻嘻地叫她小孩转头就用她听不懂的港话骂骂咧咧。后面被Stella带着多同他讲了几次话才知道不是在骂自己。</p><p class="story-paragraph" data-source-key="1209:0">“在骂老板死全家扑街崽，这么小孩也下得去手骗来签这种合同。”</p><p class="story-paragraph" data-source-key="1210:0">大概也是很个性鲜明的一位，也只有这位香港佬没有去找崔志宇谈过兼职转正式的事情。在灰色行当里难得有这么一位旗帜明显的。大概也知道柳河览不解，Stella也与她解释：“得了一个女儿，三岁的时候病死了。”</p><p class="story-paragraph" data-source-key="1211:0">“如果活着，现在也有你这么大。”</p><p class="story-paragraph" data-source-key="1212:0">所有的善意都不是无缘无故的，恰又是因为这些无缘无故的善意，构成了很多阴差阳错的运气和莫名其妙的因果。只是当下所有人都置身于其中，谁也参不透。</p><p class="story-paragraph" data-source-key="1213:0">握着手机走出房间的时候河览一眼就看到志宇，又高又瘦的，短发胡乱地翘着边，穿着皱巴巴的衣服坐在桌子面前。听到声响就抬眼看过来，一双眼睛水汪汪的，好可爱。</p><p class="story-paragraph" data-source-key="1214:0">应该也收到了Carmen姐姐的通知吧？看上去好委屈的样子。在难过什么？</p><p class="story-paragraph" data-source-key="1215:0">乱七八糟的思绪冲着河览的脑袋，脑子被搅得乱糟糟的，嗡嗡的响。</p><p class="story-paragraph" data-source-key="1216:0">“吃饭？”细碎的声音从崔志宇的喉咙里挤出来。</p><p class="story-paragraph" data-source-key="1217:0">猛地回过了神，河览用力地拍了拍自己的脸颊。刺辣辣的疼和清脆的声响清晰地提示着一切经历并非梦境，意识到的时候，整个人又有一种很奇怪的，如梦初醒的幻灭感。</p><p class="story-paragraph" data-source-key="1218:0">粥被被崔志宇又热了一遍，散着米香气，碗被她连同筷子一并推到河览面前。目光在河览的脖颈上停了一瞬，烫着了似的，又很快挪开。端直的人窘迫的时候会有一种莫名其妙的可爱，小说里管这种东西叫做反差感。恶趣味泛起来，河览故意捧着碗往崔志宇的身边凑。眼见对方拼了命地往角落里缩，好似要拉开距离，但是湿漉漉的眼睛一直眼巴巴的看着自己。</p><p class="story-paragraph" data-source-key="1219:0">好像就在讲你靠我近一点吧。</p><p class="story-paragraph" data-source-key="1220:0">你靠我近一点吧，她无数次地在崔志宇浅珀色的眼里读到这句话。只是现在这种节骨眼上，又理所当然地将这句话剖析出来一种更深层的解读。</p><p class="story-paragraph" data-source-key="1221:0">——不要离开我。</p><p class="story-paragraph" data-source-key="1222:0">她想她大概是疯了，竟然会认为崔志宇这种人离不开自己。</p><p class="story-paragraph" data-source-key="1223:0">她竟然会认为这个世界上会有人离不开自己。</p><p class="story-paragraph" data-source-key="1224:0">有情饮水饱，到现在河览已经能很娴熟地讲这句话。一共接触到了三次，Stella看着剧本用绵软的声音轻飘飘地讲，香港佬在电话里恨铁不成钢地重重的念，还有想到崔志宇的时候脑子里蹦出来的这句话。</p><p class="story-paragraph" data-source-key="1225:0">河览认真地注视过来的样子太像猫了，距离太近，近到崔志宇退无可退。</p><p class="story-paragraph" data-source-key="1226:0">狼狈地用手掌撑住地板，薄瘦的脊背堪堪抵住陈旧的柜门。崔志宇的目光不受控制地往河览的嘴巴上瞥。在家的缘故没有化妆，薄薄的唇瓣也盈着一抹柔软的红——那是她的杰作。</p><p class="story-paragraph" data-source-key="1227:0">无止境的索取和凿弄，抽离之后还有精神层面上盘旋的快感挥之不去。她们没来由地口干舌燥起来。</p><p class="story-paragraph" data-source-key="1228:0">挥之不去的东西被称作习惯性，这种习惯性起的太早，第一次在片厂商看到河览的眼睛的时候就有的冲动。</p><p class="story-paragraph" data-source-key="1229:0">不管是这个刹那还是那个刹那，她都想轻柔地吻住河览——以一种柔软的态度和力气。</p><p class="story-paragraph" data-source-key="1230:0">如果讲Alpha对omega在生理上有着绝对的标记优势的话，omega对Alpha又有什么呢？志宇迟钝地眨着眼睛看着河览一点点靠近，退无可退，呼吸发紧。暴烈的情事之后身体好似会有一种食髓知味的本能，清冽又柔软的雪绒花香气萦绕在鼻尖，撩的崔志宇喉口发干。</p><p class="story-paragraph" data-source-key="1231:0">就连心神也被这种冲动狠狠地攥住，不受控制地俯身前去，唇瓣却突兀地被河览的手掌挡住。</p><p class="story-paragraph" data-source-key="1232:0">迟钝地眨了眨眼，崔志宇歪了歪脑袋。</p><p class="story-paragraph" data-source-key="1233:0">遵循本能的动作被河览的理智无情的截断。</p><p class="story-paragraph" data-source-key="1234:0">“不可以 。”她放软的声音，温柔的，耐心的对崔志宇讲到，“现在不可以。”</p><p class="story-paragraph" data-source-key="1235:0">再度发生亲密的动作是很危险的事情，如果前夜还可以用崔志宇的醉酒作为发生关系的理由，现在的接吻和接下来或许会发生的事情又能算得上什么？难道真的要去做婚姻申告么？她现在觉得崔志宇做不出来这样的事情。</p><p class="story-paragraph" data-source-key="1236:0">拼了命的爬到首尔大学的崔志宇怎么可能放任自己的心意到这种程度呢？</p><p class="story-paragraph" data-source-key="1237:0">被彻底标记的omega要经历一次伐骨洗髓的痛苦才能将一个Alpha的信息素从自己的身体里彻底洗掉。</p><p class="story-paragraph" data-source-key="1238:0">就算现在的药物已经在很大的程度上做出了改进，但是经历痛好似是必然的。</p><p class="story-paragraph" data-source-key="1239:0">她从小就怕痛。</p><p class="story-paragraph" data-source-key="1240:0">太痛了就不想活了。</p><p class="story-paragraph" data-source-key="1241:0">可是为什么要这么委屈的看着我呢？堪堪地维持着这种姿势，河览与崔志宇一瞬不瞬地对望着。那双小鹿一样的眼睛水汪汪的，被拒绝了本能性地泛着 潮意。盈盈润润的，看上去像吃不到肉骨头的小狗狗。</p><p class="story-paragraph" data-source-key="1242:0">温热的呼吸碎碎地拂着河览的掌心，一点痒，从皮肉往心底里钻。</p><p class="story-paragraph" data-source-key="1243:0">这种痒意具体又微妙，倏然让河览想起来崔志宇昨晚那双含着泪的眼睛。心底霎时间一软，手指松了些许，崔志宇得寸进尺地就这么凑了过来。</p><p class="story-paragraph" data-source-key="1244:0">额头被对方轻轻地抵住，这是人生中罕有的温情的时刻。</p><p class="story-paragraph" data-source-key="1245:0">她被崔志宇揽住肩膀小心地拥进怀里，唇瓣不小心蹭过对方的脖颈，柔软温和的触感激得崔志宇发颤。</p><p class="story-paragraph" data-source-key="1246:0">密匝又柔软的情绪带着暧昧的潮热在骤然间腾升起来，密不透风地包裹住她 。她压着声音，只觉得自己的声音也哑下去，喉咙似被砂纸磨了，说话都有些碎碎的沙意。好微妙的心态，在见到这个人的一刹那突然觉得什么都不重要了，成为过去也好，在将来的时日被忘记也没有关系。</p><p class="story-paragraph" data-source-key="1247:0">——她会记得。</p><p class="story-paragraph" data-source-key="1248:0">她会一直记得河览。</p><p class="story-paragraph" data-source-key="1249:0">好似在这些日子里，就这么被这个omega的气息浸进了骨子里，浸透了，就控制不住地产生了成瘾性——在她研究的那些数据和采样里，会有少部分的Alpha对omega产生成瘾性。那是从信息素到心理上的绝对臣服，违背生理，甚至悖逆本能。</p><p class="story-paragraph" data-source-key="1250:0">那是从身到心的完全性的依赖，从这种Alpha洗掉omega的信息素的困难程度甚至比洗掉一个被彻底标记的omega身上的信息素还要有难度。</p><p class="story-paragraph" data-source-key="1251:0">而现在河览就被她这样抱着，埋在她的颈间。</p><p class="story-paragraph" data-source-key="1252:0">距离这么近，近到她稍稍地只要低一低头，嘴巴就能碰到对方的发顶。就算是这样，崔志宇却没有半点再敢僭越的心思。她只是颤颤巍巍的。任由着河览整个人都埋进自己怀里。窝藏在脖颈后的腺体几乎是本能性地跳动起来，升腾的欲望冲击着薄弱的感官。</p><p class="story-paragraph" data-source-key="1253:0">志宇不动声色地深呼吸，轻轻浅浅地按住自己更多的旖旎心思。</p><p class="story-paragraph" data-source-key="1254:0">好似只要是这样就够了。</p><p class="story-paragraph" data-source-key="1255:0">鼻腔里还萦绕着雪绒花清浅的香气，是河览的信息素，独属于河览。</p><p class="story-paragraph" data-source-key="1256:0">依靠着肢体接触、甚至是交媾这种更深层次的肉体接触也没有办法得到的餍足竟在此刻涌现上来，心绪剧烈又轻飘的颤动的，崔志宇在这个刹那突然地，不受控制地冒出来了想法。</p><p class="story-paragraph" data-source-key="1257:0">——你要标记我么？</p><p class="story-paragraph" data-source-key="1258:0">嘶哑又柔软的声音从头顶飘进耳朵里，轻飘飘的像气球一样，河览骤然睁大了眼睛。</p><p class="story-paragraph" data-source-key="1259:0">崔志宇好似无所知觉，轻轻地清了嗓子，柔软又固执地又讲一遍。</p><p class="story-paragraph" data-source-key="1260:0">“河览啊，你要试着标记一下…”</p><p class="story-paragraph" data-source-key="1261:0">她以一种清淡的态度讲这一句话，压低的声音带着奇怪的蛊惑性。只是再度将“标记我”这种事情说出口的时候难得有些赧然。话到嘴边蓦地打了个转，再说出口声音都轻了：“标记我吧。”</p><p class="story-paragraph" data-source-key="1262:0">甚至没有用问句，也不是请求，只是心神骤转之间，突然有了一种微妙的冲动。</p><p class="story-paragraph" data-source-key="1263:0">——留下她的痕迹。</p><p class="story-paragraph" data-source-key="1264:0">留下河览的痕迹。</p><p class="story-paragraph" data-source-key="1265:0">疯狂的，堪称得上惊世骇俗的言论。</p><p class="story-paragraph" data-source-key="1266:0">河览的呼吸在一瞬滞住。鼻尖萦绕着柔软的，清冽的香气。不同于之前在崔志宇的脖颈间嗅到的白茶香，而是更为熟悉的月季香。分明是很清淡的味道，被河览嗅去，却恰似一滴水落入一汪被烧的滚烫的油锅里。Alpha释出的信息素柔和又清冽，几乎毫无半点侵略性可言。志宇以一种从容的姿态在河览面前释出了自己的信息素，坦诚的态度似用一把小刀将自己在河览的面前刷地一下尽数剖开。</p><p class="story-paragraph" data-source-key="1267:0">柔和明媚的月季香气扑盈着河览的鼻腔，思绪很快就被信息素挤的模模糊糊，河览终于想起来这是独属于克莱尔.奥斯汀的花香。</p><p class="story-paragraph" data-source-key="1268:0">是她在前夜的梦中所嗅到的香气，是崔志宇的信息素。</p><p class="story-paragraph" data-source-key="1269:0">——在过往崔志宇所受到的教育中，信息素是不可以对着爱人和亲人以外的人释放的。那是与名字一样具备效应的短咒，生于罗马的小孩们从分化之后，关于信息素这一项就被大人们严丝合缝地作为秘密保留了下来</p><p class="story-paragraph" data-source-key="1270:0">关于信息素的气息太好伪造。如果被别有用心的人知道了，也许就会造成不堪设想的后果。</p><p class="story-paragraph" data-source-key="1271:0">可算是勾引么？志宇的家教不会让她在人生里出现这样的词汇。</p><p class="story-paragraph" data-source-key="1272:0">——那算得上是爱么？</p><p class="story-paragraph" data-source-key="1273:0">她很笨拙，很小心地想着这样的问题。却又以一种难以自制的心态靠近着柳河览。皮相上乘的人露出这种眼巴巴的模样的时候总会让人心神恍惚。可怜兮兮的样子像一只小狗，固执又认真地盯着河览看。</p><p class="story-paragraph" data-source-key="1274:0">河览仓促地移开目光，耳根通红。</p><p class="story-paragraph" data-source-key="1275:0">勾引，赤裸裸的勾引。</p><p class="story-paragraph" data-source-key="1276:0">而这种勾引并非是在片场上有着白茶气息的知羽，而是崔志宇——像白月季一样漂亮的崔志宇，像克莱尔奥斯汀一样娇气的崔志宇，像崔知羽爱着柳河岚一样在意着柳河览的崔志宇。</p><p class="story-paragraph" data-source-key="1277:0">香港佬恨铁不成钢的声音还在耳旁响，有情饮水饱，不要被外面那群看上去很可怜的Alpha勾去心魂。</p><p class="story-paragraph" data-source-key="1278:0">可那是崔志宇——</p><p class="story-paragraph" data-source-key="1279:0">心底有声音弱弱地反驳，就算不说出来也发自内心的很认真的想，那是崔志宇，是志宇姐姐，是要在自己死后义无反顾的殉葬的，崔志宇。</p><p class="story-paragraph" data-source-key="1280:0">后知后觉地想到了丈夫这种词语。</p><p class="story-paragraph" data-source-key="1281:0">是，是丈夫吧。</p><p class="story-paragraph" data-source-key="1282:0">只是想一想也觉得就连心绪变得磕磕巴巴了。</p><p class="story-paragraph" data-source-key="1283:0">河览耳根通红，受了惊的小动物似地往志宇的怀里埋。突突兀兀的一团软撞进去，她伸手环住志宇的腰肢，抱紧点，就好似听得到对方脉搏激烈跳动的声音。</p><p class="story-paragraph" data-source-key="1284:0">“…等我回家。等一下可以么。”</p><p class="story-paragraph" data-source-key="1285:0">她声若蚊呐，小又不可闻。</p><p class="story-paragraph" data-source-key="1286:0">“等我回家…姐姐如果还愿意的话。…”</p><p class="story-paragraph" data-source-key="1287:0">她一字一句，有一点艰难地讲。</p><p class="story-paragraph" data-source-key="1288:0">——我们就一直在一起好不好。</p><p class="story-paragraph" data-source-key="1289:0">如果即将奔赴向自由，好似就应该把崔志宇连同这几段过去抛在脑后。就像那个叫梁生的港佬在电话里讲的那样，该考虑的是结算金额，剩下的钱够不够撑她在首尔找到下一份工作。而非现在这种像棉絮一样乱七八糟的填充着脑子的事情。</p><p class="story-paragraph" data-source-key="1290:0">可是她总觉得该说，要说，想说。</p><p class="story-paragraph" data-source-key="1291:0">就算摘取自由了，日后是在片场上不再见面的关系，可是她的知羽又会成为哪一位omega的庇佑者呢？还会用这么单薄的身体笨拙的为那些看上去很弱势的omega们遮挡镜头么？这么一想，总觉得崔志宇这个人身上有一点怜悯众生的神性，只是这种神性对于有占有欲的人来说很残忍，神爱众生。</p><p class="story-paragraph" data-source-key="1292:0">而她，柳河览，是被神明怜爱的众生之一么？</p><p class="story-paragraph" data-source-key="1293:0">恍惚着这样想，河览竟然生出了些莫名其妙的念头。</p><p class="story-paragraph" data-source-key="1294:0">——想把崔志宇藏起来，藏在谁也找不到的地方。</p><p class="story-paragraph" data-source-key="1295:0">她的脸皮并不似志宇那么厚，话说出来总觉得好烫嘴，脑袋在崔志宇的怀里越埋越低，毛茸茸的。就算是口头画饼也画的哆哆嗦嗦。惊惊惶惶的样子好似是吓到了，声音也在发颤，比起昨晚不管不顾吻上来的笨蛋好似两个人。</p><p class="story-paragraph" data-source-key="1296:0">——兔子。</p><p class="story-paragraph" data-source-key="1297:0">没来由，志宇突然想到了这种动物，耐痛性高，骨折也不会发出来半点惨叫的生物，有着软乎乎萌哒哒的外观，生气的时候会跺脚——她没有见过河览生气，但是还是觉得河览好可爱，害羞的时候会整个地埋进自己的怀里。</p><p class="story-paragraph" data-source-key="1298:0">她小心地抬手，轻轻地顺着河览的头发。</p><p class="story-paragraph" data-source-key="1299:0">“好。”她听见自己说，声音细细碎碎的，惊世骇俗的念头一个又一个，“等你回来。”</p><p class="story-paragraph" data-source-key="1300:0">交往也好，被标记也好，结婚也好。</p><p class="story-paragraph" data-source-key="1301:0">等到河览回来，无论什么要求都好，她都想答应，都想践行。</p><p class="story-paragraph" data-source-key="1302:0">大概是——疯了吧。</p><p class="story-paragraph" data-source-key="1303:0">与香港佬约的时间是下午三点，匆匆忙忙吃完饭化好妆，河览临出门的时候又被崔志宇叫住，从钱包里抽出来钞票递给河览，崔志宇的语气很认真：“打车去啦，直觉是对你很重要的事情，打车去。”</p><p class="story-paragraph" data-source-key="1304:0">圆润的，湿漉漉的眸子一瞬不瞬地盯住河览，浅珀色的眼透亮又干净。接下来要面对的事情一定是很好的事情，值得不用抠搜的计算或者去计较花销的时日，就算离家很近也要打着车飞奔过去的程度。</p><p class="story-paragraph" data-source-key="1305:0">河览眨了眨眼，接过钞票，在靠近的一刹那又轻轻啄上志宇的脸侧 。</p><p class="story-paragraph" data-source-key="1306:0">柔软又温热的触感传过来，志宇迟钝地眨了眨眼，后知后觉，耳根刷的一下，通红。</p><p class="story-paragraph" data-source-key="1307:0">“等你，等你回家。”她有些艰难的，涩声讲，“早点回来。”</p><p class="story-paragraph" data-source-key="1308:0">手机徒劳地震动着，金多绚还在发消息轰她——已经把自由还给河览了，耗了人情，绞尽脑汁，金宇宙松口给了角色，minju的团队进行拍摄。那是是宇宙姐姐在笔下最为偏爱的角色，甚至已经为河览注册好了工作室，开始物色专门的经纪人了。</p><p class="story-paragraph" data-source-key="1309:0">路够长，宇宙姐姐给的也够多。</p><p class="story-paragraph" data-source-key="1310:0">——甚至考虑到了江原道那边，原生家庭是很多明星的绊脚石。所以也一并用钱轻飘飘的砸断了。从此不会有人再向河览无穷无尽地索要着那些乱七八糟的费用，她赚的每一笔钱都归自己。</p><p class="story-paragraph" data-source-key="1311:0">金多绚讲了很多，絮絮絮叨，kkt里刷了一屏，却突兀地发过来一句语重心长的提醒。</p><p class="story-paragraph" data-source-key="1312:0">重要的是——你该和她分开了。</p><p class="story-paragraph" data-source-key="1313:0">从小一起长大的，一直笑嘻嘻的多绚用很严肃的语气发过来了这样的消息。</p><p class="story-paragraph" data-source-key="1314:0">陈旧的门嘎吱一声关掉了，河览的脚步声咚咚地在楼道里远去，志宇维持着方才的姿势站在原地，雪绒花的气息和洗发水的气息交杂地混陈在一起扑住她的鼻尖。</p><p class="story-paragraph" data-source-key="1315:0">崔志宇闭上眼睛，近乎贪婪地，深深地吸了一口气。</p><p class="story-paragraph" data-source-key="1316:0">于她而言算是失态又失礼的举动，可她也不知道该怎么样去再多的留下河览的痕迹了。</p><p class="story-paragraph" data-source-key="1317:0">手机再度震动起来，这次是金宇宙打来了电话。</p><p class="story-paragraph" data-source-key="1318:0">“帮你解决了一个大麻烦也不知道谢谢姐姐一下么？”</p><p class="story-paragraph" data-source-key="1319:0">带着熟稔的轻快和笑意的声音在电话那边响起来，金宇宙的声音很轻。</p><p class="story-paragraph" data-source-key="1320:0">“志宇啊，有空出来见一面吧。作为这次你向我的谢礼。”</p><p class="story-paragraph" data-source-key="1321:0">梁生于二零零七年离港，走的时候只背一个背包。他不差钱，只是香港算伤心地，三岁的女儿死在那里，老婆心灰意冷同他离婚，故土变做伤心地，人这种东西胆子小，逃离算得上是天性。</p><p class="story-paragraph" data-source-key="1322:0">离港许久还是听不惯韩文，柳河览来办公室找的时候梁生悠然取下耳机，王菲的歌他一直很喜欢，细软又空灵的唱腔，韩国佬学不来的东西。出乎办公室内所有人的意料，这次老板放人放的痛快，违约金也出乎意料的丰厚。</p><p class="story-paragraph" data-source-key="1323:0">公司里都在传这个懵懵懂懂的小姑娘应该傍上了什么不得了的人，竟然能让那个狡诈又无耻的铁公鸡忍痛拔毛放人。这个圈子里骗一个脸蛋好身材好的Omega进来不容易。</p><p class="story-paragraph" data-source-key="1324:0">倒是还好，小姑娘运气好，该说运气好吗？</p><p class="story-paragraph" data-source-key="1325:0">梁生沉沉地想，嘴里叼着没点燃的烟，利落地将那几张薄薄的解约书递过去。怕柳河览看不懂，于是又操着他那口不太纯的首尔话同她慢慢讲，看到柳河览蹙起来的眉头慢慢松下去，如释重负似地长叹一口气，一笔一划地在这些纸张的最末尾落下自己的名字了。</p><p class="story-paragraph" data-source-key="1326:0">离开的时候他还是叫住河览，脖子上的红色痕迹太明显，引过来公司里许多揣测的目光打量。</p><p class="story-paragraph" data-source-key="1327:0">叹了口气，梁生打开自己的钱包，抽出一摞轻轻地叠在那纸合同上：&quot;拿去买些好吃的。”他拧着眉头，样子拧巴却理直气壮：“也别想着拒绝之类的，只是看到你..&quot;</p><p class="story-paragraph" data-source-key="1328:0">只是看到你，就会想到我那个很早就死去的女儿。</p><p class="story-paragraph" data-source-key="1329:0">如果三岁的女儿能够活到现在也应是河览这般的年龄了吧？明媚又漂亮，如果活到这个年龄的话又是什么样子的呢？港人一生精明，难得恍惚一次。兴许他就不会离港，这个年龄了应该在苦恼小孩的就业问题了。</p><p class="story-paragraph" data-source-key="1330:0">好好的，小孩。</p><p class="story-paragraph" data-source-key="1331:0">他在心里想。</p><p class="story-paragraph" data-source-key="1332:0">想说的话还有很多，又不知道该怎么说，此生最后一面兴许如此，于是他动动嘴，很轻地用中文讲：“再见。”</p><p class="story-paragraph" data-source-key="1333:0">在这个地方一定，一定，再也不要见到你。</p><p class="story-paragraph" data-source-key="1334:0">自由了吗？</p><p class="story-paragraph" data-source-key="1335:0">走出公司的时候遇到了卢惟那，站在楼下的便利店买面包的时候看见了她，于是弯着眼睛冲她笑着打招呼了。</p><p class="story-paragraph" data-source-key="1336:0">河览点了点头，笃定着此生再也不会和这位少年气十足的alpha有半分交集，于是也轻轻地在心里说了一声再见。</p><p class="story-paragraph" data-source-key="1337:0">手里攥着厚厚的一摞钱，站在街边，太阳当头，晃的她眼花。</p><p class="story-paragraph" data-source-key="1338:0">影子在脚下拉很长，抬头发现崔志宇站在街对面等她。车流来往，轰鸣声充斥着河览的脑袋。</p><p class="story-paragraph" data-source-key="1339:0">偏了偏头，发现对方依旧带着笑望向自己——原来不是幻觉。</p><p class="story-paragraph" data-source-key="1340:0">河览后知后觉志宇其实很少笑，多数的时候面无表情，偶尔蹙着眉头做苦大仇深的模样。她慢吞吞地等街对面的指示灯亮起，走过去的时候手就自然而然地被对方拉住：“顺利吗？”</p><p class="story-paragraph" data-source-key="1341:0">“没有为难我。”河览晃了晃手里的一把钱，“香港大叔给的，让我拿去买一点好吃的庆祝一下。”</p><p class="story-paragraph" data-source-key="1342:0">“那有没有什么想吃的东西呢？”发轻的，柔软的声音，以一种温和的声音轻轻地回应着河览，手指挤入对方的指间不动声色地扣紧，余光瞥到河览攥住钞票的另一只手，没来由让志宇觉得身边的人就像一个小朋友就好了。</p><p class="story-paragraph" data-source-key="1343:0">如果真的是小朋友就好了，如果时光可以倒流的话，她一定会去江原道把河览带回首尔，好好地养在身边。</p><p class="story-paragraph" data-source-key="1344:0">“便当吧？”河览声音很轻地讲，“很多猪排炸鸡的那种，突然很想吃那个。”</p><p class="story-paragraph" data-source-key="1345:0">“吃便当就满足了吗？”志宇被她逗的笑起来，“只吃便当吗？”</p><p class="story-paragraph" data-source-key="1346:0">“吃最新鲜的！”河览细声细气地讲，中午吃的太少，还没有到晚饭的时候，肚子就已经饿的咕咕地叫了起来。依稀记得不远处有盒饭专卖店供上班族买，于是拉着志宇往那个方向走，“因为真的很饿啦！姐姐不饿吗？你中午也没怎么吃的样子。”碳水和热量就是快乐源泉，用手里的钞票换到橱窗里的自己想要的吃的，在街边随便找个长椅坐下埋头开始大快朵颐。志宇安静地坐在河览的身侧，看到身边这位狼吞虎咽的样子，不知道为什么，会觉得心脏酸酸重重的。</p><p class="story-paragraph" data-source-key="1347:0">她没有忍住抬手，轻轻地摸了摸河览的发顶。</p><p class="story-paragraph" data-source-key="1348:0">眷恋又柔软的力度，倒是让河览进食的动作顿了顿，好奇怪，憋闷在心里发泄不出去的情绪，竟然会因为吃到了新鲜的食物化作眼底盈动的泪意。活的太辛苦的时候没有这种崩溃的情绪，吃着快过期的紫菜包饭就着凉开水下咽的时候也没有这种情绪，反而在买到了一直想吃的东西，暂时地拿到了梦寐以求的自由之后，难过又崩溃的情绪才好似有了可供倾泻的余地。</p><p class="story-paragraph" data-source-key="1349:0">Stella在她走出公司的时候就给她推了新的名片——那位花大价钱买下自己合约的编辑nim，坐在弘大的冰室里撑着腮懒洋洋地看着自己的宇宙姐姐</p><p class="story-paragraph" data-source-key="1350:0">“恭喜自由，接下来会有新的挑战噢？”</p><p class="story-paragraph" data-source-key="1351:0">依旧是看上去笑盈盈的语气，未知背后等待着的又是什么？捉摸不透的东西啊。</p><p class="story-paragraph" data-source-key="1352:0">“说起来，还有想要做演员的心思么？”志宇的声音响起来，轻轻的，“还是想读书？从高中开始或者大学？”</p><p class="story-paragraph" data-source-key="1353:0">“不然姐姐好好读书以后和我结婚吧，我做姐姐的家庭主妇。”压下泪意用尽量轻松的语气讲出这句话，玩笑话，只是讲出去的时候总觉得崔志宇诡异地沉默过一瞬，声音更轻地回应她：“也不是不可以。”</p><p class="story-paragraph" data-source-key="1354:0">她顿了顿，很认真，一字一句地讲：“如果河览想这样做的话，我会努力养着河览的。”</p><p class="story-paragraph" data-source-key="1355:0">“现在去做婚姻申告也可以吗？”</p><p class="story-paragraph" data-source-key="1356:0">“就算是现在，立刻去做也可以。”</p><p class="story-paragraph" data-source-key="1357:0">噗嗤一声，河览笑了出来。吃东西吃到饱的餍足感懒洋洋地充斥着心脏和四肢，这种时候总觉得随口说出来的任何话都有一种轻飘飘的不真实感。笔直的安静地坐在一边等着自己的崔志宇，明明很认真的在一字一句的讲这种话，可是不知道为什么——不知道为什么。</p><p class="story-paragraph" data-source-key="1358:0">总觉在获取到自由的刹那之间，两个人的某种因果链也被一只看不见的手粗暴地扯断了。</p><p class="story-paragraph" data-source-key="1359:0">不是崔知羽和柳河岚，只是崔志宇和柳河览。</p><p class="story-paragraph" data-source-key="1360:0">脱离开了公司给的这样的那样的剧本，又可以以什么样的理由再度说着爱意亦或者是奢想着其他的，更多的东西呢？</p><p class="story-paragraph" data-source-key="1361:0">“我还是很怕镜头啦。”她垂眸看着饭盒里剩下的猪排，声音很轻地讲，“可能不适合做演员。”</p><p class="story-paragraph" data-source-key="1362:0">被黑洞洞的摄像头照着，会有一种难以言喻的羞耻感，就算穿着衣服也会发自本能地开始颤抖，在镜头面前被掰开腿或者摆出各种各样的姿态的阴影太重，大概真的真的，这辈子也不愿意面对任何的镜头了。</p><p class="story-paragraph" data-source-key="1363:0">不知道为什么会讲这些，也许只是因为旁边坐着的人是志宇姐姐。</p><p class="story-paragraph" data-source-key="1364:0">对于未知的未来还是很惶恐，河览垂着眸子，声音也很小：“走的时候让姐姐等我回家，为什么突然又跑过来找我了。”</p><p class="story-paragraph" data-source-key="1365:0">“怕你走丢了。”志宇说。</p><p class="story-paragraph" data-source-key="1366:0">没有回复金宇宙约见的消息，却在某个瞬间发自内心的想要看到河览。出于这样的心思，甚至连下午的实验也翘掉了。主恩好似说的没有错，真的像是彻头彻尾的悬尾实验，察觉到自己也被揪着尾巴倒挂到那种杠杆之上的时候，正是那些莫名其妙的思念浓厚的翻涌的刹那。</p><p class="story-paragraph" data-source-key="1367:0">顿了顿，志宇抿了抿嘴，涩声又讲：“……想见你。”</p><p class="story-paragraph" data-source-key="1368:0">声音太轻了，尾音都在晃晃悠悠的颤抖着，有一点点撒娇的模样。心脏在胸腔里徒劳而暴烈的砰砰地跳动着，崔志宇张了张嘴，想说话，好似又讲不出来任何更多的话了。</p><p class="story-paragraph" data-source-key="1369:0">“想见我呀？”</p><p class="story-paragraph" data-source-key="1370:0">河览也学她语气，轻轻声地反问。</p><p class="story-paragraph" data-source-key="1371:0">“想见你。”志宇说。</p><p class="story-paragraph" data-source-key="1372:0">以一种坦然的姿态讲这种话讲出来，是以前的人生里没有预想过的感觉。从小到大也只是按照家里的安排循规蹈矩地走着，没有偏离过人生的轨迹的半分。只是在看到柳河览的眼睛的时候，向来冷静的志宇也会忍不住轻轻地想。</p><p class="story-paragraph" data-source-key="1373:0">——如果一直能够这样下去就好了。</p><p class="story-paragraph" data-source-key="1374:0">哪怕真的过的很穷，肩并肩地坐在街道的长椅上分吃一份便当。她也认为流动的时间如果彻底地停在这个这个须臾就好了，无需顾虑，不疑有他。被太阳晒的暖洋洋的，脑子也昏昏沉沉的，就算是在这样的刹那，心脏也在胸腔里轻轻地跳动着。</p><p class="story-paragraph" data-source-key="1375:0">“所以。”她的声音很轻，“河览啊，要和我结婚吗？”</p><p class="story-paragraph" data-source-key="1376:0">一字一句，很轻很软的声音。两个人之间的肉体关系发生过不止一次，分明也只是一段时日，漫长的人生之中的须臾几瞬。</p><p class="story-paragraph" data-source-key="1377:0">可就算是这样，崔志宇也突然开始惶恐着那个没有河览的未来。</p><p class="story-paragraph" data-source-key="1378:0">贸然的话噎住河览，狼狈地咳嗽几声，她迟疑着抬头看去。</p><p class="story-paragraph" data-source-key="1379:0">崔志宇还是坐在她的身侧，端庄又笔直的坐姿，浅珀色的眼底全心全意地映着自己讶异的脸庞。</p><p class="story-paragraph" data-source-key="1380:0">“你认真的呀？”河览很轻地问，“真的想和我结婚吗？”</p><p class="story-paragraph" data-source-key="1381:0">两个不到二十岁的人坐在长椅上谈论婚嫁的场面古怪而荒诞，奇怪到路边路过的小狗听到也会停下来支着耳朵听一下。可是崔志宇无暇顾及这些，荒诞的真心在胸腔里徒劳的跳动着，咚咚地撞击着自己的心脏。她在河览的注视下局促地点了点头，觉得自己好可笑，会被河览拒绝吧。</p><p class="story-paragraph" data-source-key="1382:0">环游世界的时候在不同的场地围观过无数次求婚，多数都是深思熟虑之后的贸然一跪。我需要向河览单膝下跪么？需要让主恩帮我买很大的一束花和克拉数特别大的戒指过来么？志宇脑子里的胡思乱想挤作一团，总觉得太贸然太冒犯。</p><p class="story-paragraph" data-source-key="1383:0">耳边传来嗤的一声，河览拉开了手里的汽水罐。</p><p class="story-paragraph" data-source-key="1384:0">铝制的拉环被河览轻飘飘地捏在指间，垂着脑袋眯着眼睛看了半晌，河览方才抬头看向志宇。</p><p class="story-paragraph" data-source-key="1385:0">“可是姐姐，我现在只能给你这个噢？”</p><p class="story-paragraph" data-source-key="1386:0">就算获得了自由也不知道明天到底应该何去何从，所以就算是这样也要和我相依为命么？她用尽量无所谓的语气讲这种话，却是心如擂鼓。</p><p class="story-paragraph" data-source-key="1387:0">“就算是这样也要和我结婚么？”</p><p class="story-paragraph" data-source-key="1388:0">“嗯。”志宇听见自己讲，“想和你结婚。”</p><p class="story-paragraph" data-source-key="1389:0">有情饮水饱啊。河览在心里轻轻地叹息，突然又想到前几个小时她让崔志宇等着自己乖乖回家，对方困困顿顿的眼神好似小狗，柔软又乖顺地点头答应。</p><p class="story-paragraph" data-source-key="1390:0">——原来你真的想一直和我在一起啊。</p><p class="story-paragraph" data-source-key="1391:0">“手抬起来啦。”河览声音很轻地讲，“虽然现在是这个。”她顿了顿，有些赧然：“以后会换成其他的。”</p><p class="story-paragraph" data-source-key="1392:0">“其实这个也很好了。”</p><p class="story-paragraph" data-source-key="1393:0">志宇听她的话，乖乖地把手抬起来。拉罐环轻轻地穿过纤细的无名指贴住指根，微微的冷意沁着皮肤，心念动过一瞬，就很难回到最初的心态了。她垂着眼，看着河览的侧脸，一字一句，无比珍重地道，“是你就好了。”</p><p class="story-paragraph" data-source-key="1394:0">在这个当下也说不出来其他更真心的话了，只是说出这句话，也是心魂动荡的程度。</p><p class="story-paragraph" data-source-key="1395:0">如果主恩和多绚在这里，听到这种话应该觉得自己疯了吧？</p><p class="story-paragraph" data-source-key="1396:0">崔志宇的嘴角勾着笑，眼底也全是笑。</p><p class="story-paragraph" data-source-key="1397:0">被谎言铸就的高台终有崩塌的刹那，只是此时此刻，此情此景，河览是她唯一的，放在心上的妻子。</p><p class="story-paragraph" data-source-key="1398:0">“等到今年的初雪吧？”听到柳河览这么讲了。</p><p class="story-paragraph" data-source-key="1399:0">崔志宇偏了偏头，手被河览轻轻地攥住，对方也以一种极为认真的眼神与她相望，声音又细碎又轻飘：“如果等到今年首尔的第一场雪落下来的时候，姐姐还想和我结婚的话，我们就结婚吧。”</p></div>
