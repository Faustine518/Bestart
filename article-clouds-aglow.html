      <article class="chapter" data-chapter="section-11">
        <header class="chapter-header"><span class="chapter-number">11</span><h2>Chapter 11</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="2727:0">釜山一行凶险，出发之前就是所有人都知道的事实。</p><p class="story-paragraph" data-source-key="2728:0">志宇在出发前两天约志勋见面，兄妹两个平常往来不多，志勋参加工作之后就从老宅里搬出去，两个人各有各的方向，人生轨迹泾渭分明，此刻心平气和坐在一张桌两面，看上去似和和睦睦一家人。</p><p class="story-paragraph" data-source-key="2729:0">那时志宇已经被植入了定位用的电子芯片，故意留出消息任由潜伏在实验室的内鬼放出，被保密的核心研究人员泄出去一角，便似血肉气息吸引秃鹫围攻。只是志勋想不明白，为什么偏偏要赔上自己。他从来不多干涉志宇的决定，只知道有的事情敲定了就没有回转的余地。</p><p class="story-paragraph" data-source-key="2730:0">他有疑惑，当场就问，志宇没有讲话，只是垂着眸子，自顾自去噙一口盏中茶水。</p><p class="story-paragraph" data-source-key="2731:0">应该在害怕吧。</p><p class="story-paragraph" data-source-key="2732:0">志勋在心里轻轻地揣测。</p><p class="story-paragraph" data-source-key="2733:0">其实他想讲如果害怕就不要去了，很多人愿意为崔家做事，大不了废掉这个计划，从头再来。</p><p class="story-paragraph" data-source-key="2734:0">但是所有人都没有料到她什么也不怕。</p><p class="story-paragraph" data-source-key="2735:0">痛也不怕，死也不怕。</p><p class="story-paragraph" data-source-key="2736:0">抢救的红灯还未揭下，志勋的脑子也乱，去洗手间胡乱拘水抹了一把脸。没有想明白那时候志宇在想什么呢?那么乱的现场，两把装了消声器的手枪，她又是怎么察觉到然后一把推开郑伊安的?</p><p class="story-paragraph" data-source-key="2737:0">到底在想什么啊志宇。</p><p class="story-paragraph" data-source-key="2738:0">他真的想问这个问题了。</p><p class="story-paragraph" data-source-key="2739:0">为什么能够从容不迫的坐上那辆桑塔纳，为什么能够冷静的任由芯片植入体内，为什么一连受了三个星期的折磨，也能游刃有余配合他们做好很多事情。</p><p class="story-paragraph" data-source-key="2740:0">至少现在的崔志宇给不出答案了，抢救室灯火通明，从夜间九点到凌晨一点，四个小时时间，每分每秒都好似在同死神抢人。过来的时候妈妈让他带上了志宇从小到大的那个相册，本来是在收网之后准备交给河览的，现在还能交出去么?</p><p class="story-paragraph" data-source-key="2741:0">生与死的跟前，所有的一切都太过渺小。</p><p class="story-paragraph" data-source-key="2742:0">金宇宙的声音传到耳朵里的时候，志勋的眼睛迟钝地眨了眨，然后抬起头。</p><p class="story-paragraph" data-source-key="2743:0">“来了啊。”</p><p class="story-paragraph" data-source-key="2744:0">“来了。”</p><p class="story-paragraph" data-source-key="2745:0">金宇宙轻轻声地讲，侧开身，将河览让出来。</p><p class="story-paragraph" data-source-key="2746:0">很漂亮的脸蛋，好似符合许多人心底对初恋的印象，这就是柳河览，大解脱圆锁定的最后一个祭品，金宇宙的缪斯，初露头角的新人演员。</p><p class="story-paragraph" data-source-key="2747:0">志勋钝钝地看着河览，嘴角上扬，竭力做出不太失态的模样。</p><p class="story-paragraph" data-source-key="2748:0">——志宇深爱的人。</p><p class="story-paragraph" data-source-key="2749:0">“啊…。”</p><p class="story-paragraph" data-source-key="2750:0">他说不出来什么话了。</p><p class="story-paragraph" data-source-key="2751:0">志勋从小就不喜欢去医院，气氛太重，生离死别，每时每刻都在上演。</p><p class="story-paragraph" data-source-key="2752:0">志宇的相册就在车上放着，要去拿给河览么?他恍恍惚惚地想。</p><p class="story-paragraph" data-source-key="2753:0">抢救过程中已经报过一次心脏骤停，就算志勋做好了心理预期，但是好像还是难以接受。</p><p class="story-paragraph" data-source-key="2754:0">他接受不了，兴许河览也受不住，可是这种事情一旦发生就是所有人不得不去面对和接受的。</p><p class="story-paragraph" data-source-key="2755:0">这个世界上没有绝对的公平，只有生和死两项事物平等的对待所有人。</p><p class="story-paragraph" data-source-key="2756:0">“有东西交给你。”他的声音有一点颤，“河览啊，走得动的话，跟我来一下。”</p><p class="story-paragraph" data-source-key="2757:0">还是要把那本相册交给河览吧。</p><p class="story-paragraph" data-source-key="2758:0">志宇在来之前已经她有的所有东西全部转到河览名下了，不用担心此后河览的温饱和前路，但是如果、如果天人两隔，总要给对方留一点念想。</p><p class="story-paragraph" data-source-key="2759:0">郑伊安没有讲话，从跟到医院起她就把自己整个人都蜷缩在走廊的一角，熟悉的幻痛如同潮水似地再度蔓延四肢，她闷头不做声，咬着牙沉着眼，一项项将从自己路数里查到的各类东西全做整理，无论是走私货物亦或者那几个议员洗钱用的海外账户尽数提付，少年心性，玩命发疯，报复也是穷凶极恶不计后果。</p><p class="story-paragraph" data-source-key="2760:0">心脏很沉很沉地在胸腔里咚咚地撞着，手机拿不稳，坐也坐不稳。她整个人都在颤，满脑子全是崔志宇扑过来的那一刻。</p><p class="story-paragraph" data-source-key="2761:0">她不敢再多想，牙齿咬的很紧，眼前发黑，用尽全身力气点下发送。</p><p class="story-paragraph" data-source-key="2762:0">角落里咚的一声闷响，金多绚和金宇宙骤然回头看过去。</p><p class="story-paragraph" data-source-key="2763:0">——郑伊安也昏了过去。</p><p class="story-paragraph" data-source-key="2765:0">志勋和志宇长得很像，都承住父母眉眼里出萃的点，只是眉眼太过柔和漂亮，留着时兴的发型会少许多威慑力。志勋办案时还是好梳背头，一整个额头敞亮地露出来，一双丹凤眼凌厉又冷清，只是现在失魂落魄的，丧的不得了。</p><p class="story-paragraph" data-source-key="2766:0">从抢救室走到停车场，不过十多分钟时间，两个人并肩走，不说话。</p><p class="story-paragraph" data-source-key="2767:0">志勋大概知道妹妹在外面养了一个漂亮的omega，他讲不出来什么其他的话，只是走到自己的车旁，打开车门，拿出那本相册，递过去。</p><p class="story-paragraph" data-source-key="2768:0">“其实还该给你送柿子饼的。”他开口，有些艰涩地讲道。</p><p class="story-paragraph" data-source-key="2769:0">妈妈已经把柿子饼做好了，当初妈妈和爸爸结婚的时候，就是奶奶捧着做好的柿子饼送到了金家去的，一代又一代都是这样。崔家人好似是祖传的性冷和固执，认定了一个人，这辈子就只是这个人。</p><p class="story-paragraph" data-source-key="2770:0">无论受多大的阻碍，面临怎么样的困难，都只会是这个人。</p><p class="story-paragraph" data-source-key="2771:0">“但是我转念一想，这时候把柿子饼送过来好像不合适。”</p><p class="story-paragraph" data-source-key="2772:0">“小河还很年轻，如果因为一个人禁锢住自己的一生，我和妈妈认为，这样不好。”</p><p class="story-paragraph" data-source-key="2773:0">如果真的出现不幸中的不幸，就算是志宇也不会认为这样是这样好。</p><p class="story-paragraph" data-source-key="2774:0">还未结婚就成为某个人的未亡人，太残忍。</p><p class="story-paragraph" data-source-key="2776:0">这种话他说不出口，只是长叹着气，倚在车边，看柳河览垂着眸子，一页又一页地翻看那册相片。那是很规整的档制相册，翻开看全是崔志宇。每一张旁侧都贴心地写着备注，从粉妆玉琢的小团子到少年时期，一页页翻过，好似就旁观过崔志宇前十几年的人生。</p><p class="story-paragraph" data-source-key="2777:0">被妈妈训到瘪着嘴哭的志宇、跳芭蕾的时候把脚尖绷的很直的志宇、站在一片冰雪里面色冷然的志宇、捧着各色各样的奖杯的志宇…</p><p class="story-paragraph" data-source-key="2778:0">这是她没有见过的，没有了解过的崔志宇，翻到最后一页的时候柳河览却突然怔住。</p><p class="story-paragraph" data-source-key="2779:0">——是她和崔志宇。</p><p class="story-paragraph" data-source-key="2780:0">眼眶红红的，是那次刚刚哭过又被崔志宇抓过来拍照，两个人脸贴着脸对着镜头眯着眼笑，餍足又幸福。</p><p class="story-paragraph" data-source-key="2781:0">崔志宇的字写的很乖，笔触圆圆润润，落在旁侧，好简单一行字。</p><p class="story-paragraph" data-source-key="2782:0">“我和河览”</p><p class="story-paragraph" data-source-key="2783:0">河览迟钝的眨眨眼，手指抬起来，轻轻地碰一碰照片上崔志宇的笑脸。</p><p class="story-paragraph" data-source-key="2784:0">志勋讲不出话了。</p><p class="story-paragraph" data-source-key="2785:0">心脏被烦闷和担忧充斥着，无端端地就让他有了想要抽一支烟的冲动。他忍了又忍，长叹一口气。不忍心再将志宇的情况复述一遍，可是如果连柳河览都不能够知道崔志宇的情况，他又能去向谁说?</p><p class="story-paragraph" data-source-key="2786:0">“志宇中了两枪，你来之前已经医生就已经出来报了一次心脏骤停了。”</p><p class="story-paragraph" data-source-key="2787:0">他有些艰难地，慢吞吞地讲，每个字讲出来都似小刀，薄薄地剐着脆弱的神经。</p><p class="story-paragraph" data-source-key="2788:0">两枪，一枪穿肩，一枪过腹。</p><p class="story-paragraph" data-source-key="2789:0">脾脏破裂，大出血，连锁反应，引发了休克。</p><p class="story-paragraph" data-source-key="2790:0">这种情况下的抢救太棘手，醒得过来是运气，醒不过来是常态。</p><p class="story-paragraph" data-source-key="2791:0">河览没有接他的话，只是垂着眸子，定定地注视着那张照片。</p><p class="story-paragraph" data-source-key="2792:0">“…应该很痛吧。”</p><p class="story-paragraph" data-source-key="2793:0">她轻轻地讲。</p><p class="story-paragraph" data-source-key="2794:0">被子弹贯穿的那种痛楚，应该是常人不能忍受的。那时候的姐姐在想什么呢?只是轻轻地想着，心脏也开始钝钝的痛。</p><p class="story-paragraph" data-source-key="2795:0">神经绷的太紧，一时间已经察觉不到情绪的流淌或者变化了，头皮还在发麻，不知道该想什么，也不知道能想什么。</p><p class="story-paragraph" data-source-key="2796:0">我也好痛。</p><p class="story-paragraph" data-source-key="2797:0">她怔怔地，在心里轻轻说。</p><p class="story-paragraph" data-source-key="2798:0">志宇姐姐，我也好痛。</p><p class="story-paragraph" data-source-key="2799:0">金智慧凌晨三点抵釜，风尘仆仆，一行人杀到抢救室前走廊里，狭窄楼道再容不得多，志勋看到自家妈妈赶紧站起来，金女士眼风一扫，言简意赅：“回去再算你的帐。”</p><p class="story-paragraph" data-source-key="2800:0">一转头望向河览又挂出笑脸，和蔼慈祥。按道理来说久居上位的人，说话不怒自威，此刻拉过河览的手，掌心温热，轻轻熨着河览冰冷指尖。金女士头一撇又回头骂崔志勋：“不知道找件厚点的衣服过来吗？”</p><p class="story-paragraph" data-source-key="2801:0">崔志勋缩着脖子任老妈骂，知道金女士火气天大还要在河览面前做出长辈的和蔼模样十分不易。变脸这一块赛翻书，金智慧一转头面对河览又挂上笑脸，默然将身上外套脱下来把她裹住。</p><p class="story-paragraph" data-source-key="2802:0">这个小孩穿的太单薄，一件单衫，被楼道穿堂风吹的瑟瑟发抖。</p><p class="story-paragraph" data-source-key="2803:0">同行几个属下拎着吃食，金智慧接过打开，料想候在抢救室前的一堆人从前日到现今都肚子空空，总得吃饭，总得维持体力。</p><p class="story-paragraph" data-source-key="2804:0">抢救室里已经躺着一个，外面几个不能再倒了。</p><p class="story-paragraph" data-source-key="2805:0">金宇宙最后一个走过来，她从小就和这位姨妈亲，现今见到就快忍不住眼泪。不知道该怎么讲，总觉得自己任性，若非以一意孤行非要来釜山拍摄实景，崔志宇也就不会千里迢迢地追着柳河览来釜山，就不会躺在抢救室里生死未卜。</p><p class="story-paragraph" data-source-key="2806:0">她说不出话，只觉得自责和惶恐似浪头，一下又一下地兜头浇打着她。</p><p class="story-paragraph" data-source-key="2807:0">“不怪你。”看出来宇宙的难过，金智慧温声安慰，“不怪你。”</p><p class="story-paragraph" data-source-key="2808:0">怪不得任何人。</p><p class="story-paragraph" data-source-key="2809:0">抢救时间十个小时出头，一分一秒都很漫长，郑伊安很快醒过来，挂着水候在抢救室外，整个人的气压都沉沉的，好似周身也在下一场看不见的雨。</p><p class="story-paragraph" data-source-key="2810:0">抢救灯牌熄灭时所有人的目光都往门口看，先是挂口罩的医生出来，宣布结果暂时脱险。勉力从地底下抢回来一条命，医生也没有给众人松气余地：“失血量太大，会给多处器官造成缺血性的损伤，大脑尤其。”</p><p class="story-paragraph" data-source-key="2811:0">他抬眼，目光扫视过不约而同地屏住呼吸的众人：“病患可能会出现短时间的失忆现象。”</p><p class="story-paragraph" data-source-key="2812:0">不记得任何人，也不记得柳河览。</p><p class="story-paragraph" data-source-key="2813:0">“只是失忆么?”</p><p class="story-paragraph" data-source-key="2814:0">柳河览问，实在不知道该说什么了，被暴乱的情绪挤压着，每一分每一秒都是煎熬。</p><p class="story-paragraph" data-source-key="2815:0">…如果那天早上我醒过来，留住你，是不是这一切都不会发生?</p><p class="story-paragraph" data-source-key="2817:0">她胡思乱想，手腕被金宇宙轻轻地攥住，回头见到对方担忧神色，河览迟钝眨眨眼睛，眼泪骤然落下。</p><p class="story-paragraph" data-source-key="2818:0">“对不起。”</p><p class="story-paragraph" data-source-key="2819:0">她张口，好仓皇，除了道歉好像也说不出来什么话。可是对不起什么?到底对不起谁?</p><p class="story-paragraph" data-source-key="2820:0">“失忆是相对比较好的后遗。”戴着口罩的缘故，所以医生的声音听起来也闷闷的，“危险期没有过，还有72小时的观察期。”</p><p class="story-paragraph" data-source-key="2821:0">“除了下腹和肩上的枪伤，志宇小姐的左手指和肋骨均有不同程度的骨折，全部错过了最佳矫正时期，后期康复过程会很漫长，家属要做好心理预期。也许会陷入持续性昏迷。”</p><p class="story-paragraph" data-source-key="2822:0">他抬头，目光巡梭过在场所有人，最终落到金智慧身上，向她颔首：“志宇小姐的求生意志很强。”</p><p class="story-paragraph" data-source-key="2823:0">抢救结束，转ICU，留置观察，手术室门彻底打开，所有人默然让开。</p><p class="story-paragraph" data-source-key="2824:0">匆忙中河览看过志宇一眼，闭着眼睛，睫毛长长，在眼下投出一小片浅浅的影。脸上的血已经被擦干净了，好似只是躺在那里睡着了。</p><p class="story-paragraph" data-source-key="2825:0">她定定看，没忍住想最开始有人吐槽崔志宇属于在片场上睡眠质量很好的人。其实那时候应该也很累吧，顾实验室顾片场顾她，百忙之中抽空几头忙，忙来忙去好像也没什么好结果。</p><p class="story-paragraph" data-source-key="2826:0">应该就像小时候的河娜讲过的那样，她天生活该的命，所以抽不中意味着上学的带字的签，也留不住漂亮的崔志宇。</p><p class="story-paragraph" data-source-key="2827:0">可是。</p><p class="story-paragraph" data-source-key="2828:0">——是不是忘了对崔志宇来说比较好。</p><p class="story-paragraph" data-source-key="2829:0">在釜山见面之后，在这个人的眼底看到的就只有沉得化不开的痛苦，这种痛苦如影随形，浸在她的每一场噩梦里。</p><p class="story-paragraph" data-source-key="2830:0">好想逃跑啊。</p><p class="story-paragraph" data-source-key="2831:0">情绪崩溃的时候，满脑子都是这样仓皇的念头。</p><p class="story-paragraph" data-source-key="2832:0">好想逃跑，好想回家。</p><p class="story-paragraph" data-source-key="2833:0">可是逃跑也是无路可退，回家。</p><p class="story-paragraph" data-source-key="2834:0">她能回哪里去呢?</p><p class="story-paragraph" data-source-key="2835:0">她好像已经没有家了。</p><p class="story-paragraph" data-source-key="2837:0">时间在这种恍惚中倏然如飞逝，志勋手里的工作放不下，匆匆回了首尔。形势巨变，风起云涌，金智慧也没有办法在釜山停留太久时间。过不久新闻里报道国会中好几位议员引咎辞职，疑似那个高价售卖药剂公司的背后支持者。宇宙的新剧正式进入宣发期，金多绚买的站子陆续在推上曝河览的片场路透——脸蛋漂亮的过分，捧着情信望向镜头的时候像一只仓皇的小鹿。依照所有人的设想，剧还未播出，柳河览这个名字先有了热度，对于尚在起步的新人来说是极好的开端。</p><p class="story-paragraph" data-source-key="2838:0">医院里前来探看的人来人往，柳河览伫在其中，好似一缕默然的幽灵。</p><p class="story-paragraph" data-source-key="2839:0">新剧的宣发期她不得不随着剧组到处跑，去过京畿道，走过济州岛，再回江原道的时候甚至去了河娜的大学路演，某种程度上的衣锦还乡，离开的时候收到了河娜的短信。</p><p class="story-paragraph" data-source-key="2840:0">习惯用恶语伤人的妹妹这几年好似也被课业和生活磨平了棱角，混在人群里看她闪闪发亮，衷心讲她好漂亮，和以前完全不一样了。</p><p class="story-paragraph" data-source-key="2841:0">剧里的心上人也站在她的旁侧，瞥到短信，笑着讲我们河览一直很漂亮啊。</p><p class="story-paragraph" data-source-key="2842:0">—一直很漂亮吗?</p><p class="story-paragraph" data-source-key="2843:0">河览问。</p><p class="story-paragraph" data-source-key="2844:0">“一直很漂亮啊。”将入成年期的Alpha天生一双桃花眼，笑起来又凌厉又漂亮，“没有人告诉过河览么?河览长了一张容易让人一见钟情的脸蛋。”</p><p class="story-paragraph" data-source-key="2845:0">“所以河览啊。”因为拍摄结束就再也没有在其他地方有过多余的联系的搭档笑盈盈地望着她，“要给一个机会吗?”</p><p class="story-paragraph" data-source-key="2846:0">柳河览迟钝地眨了眨眼。</p><p class="story-paragraph" data-source-key="2847:0">做演员的皮相都是上乘，能够被金宇宙和金珉周选中的无论性别，皮囊这一块都是顶级。两人互动落到金多绚眼里着实刺眼，不爽咽一口气，她只能恶狠狠撇开脑袋。</p><p class="story-paragraph" data-source-key="2848:0">如果河览有新的开始你要怎么办呢?</p><p class="story-paragraph" data-source-key="2849:0">她在心里无声地问崔志宇。</p><p class="story-paragraph" data-source-key="2850:0">无知无觉地躺在病床上的人，躺到冰雪消融，春花开遍，一转眼又是夏季处，窝在一起在Dv上看到河览的时日已经过去整整一年。</p><p class="story-paragraph" data-source-key="2851:0">缓和剂从政策落地到生产上市已经完成全面的落地。项目彻底结束，金主恩终于有空来釜山看崔志宇。</p><p class="story-paragraph" data-source-key="2852:0">来时医院楼下山茶树枝繁叶茂，蝉鸣声簌簌，又是一年盛夏天。</p><p class="story-paragraph" data-source-key="2853:0">只是这个人无知无觉，应是经历许多，从身到心都是累到极致，所以能够心安理得在病床上躺那么久。</p><p class="story-paragraph" data-source-key="2855:0">郑伊安反而变成了经常去看崔志宇的人。</p><p class="story-paragraph" data-source-key="2856:0">新年一过，好似又快要长大一岁，兴许当初目睹志宇中枪的经历太惨烈，一连同原本轻狂的性格也稍稍沉下去些许。</p><p class="story-paragraph" data-source-key="2857:0">她是所有人里最舍得拿时间出来的人，病房里一坐一整天。</p><p class="story-paragraph" data-source-key="2858:0">金主恩过来的时候恰巧见到伊安倚在一旁陪护椅上处理工作，三月末时釜山这边的船运事务彻底交到伊安手里，兼顾学业又要兼顾家族，短短几个月人也累脱一层皮。</p><p class="story-paragraph" data-source-key="2859:0">金主恩与她不熟，首尔大学里见过几面，多绚只言片语中提到过，欲言又止侧过来看了很多眼。</p><p class="story-paragraph" data-source-key="2860:0">“…河览姐姐来过吗。”金主恩问。</p><p class="story-paragraph" data-source-key="2861:0">“谁知道。”郑伊安很平静地回答，“我在的时候她没有来过。”</p><p class="story-paragraph" data-source-key="2862:0">从icu转特护病房之后河览就被金宇宙带回首尔了，消沉了好一段时间。</p><p class="story-paragraph" data-source-key="2863:0">金智慧有时会约她去崔家的老宅里喝茶，上了年龄的人尤其看不得年轻人吊死在一棵树上，委婉劝过她很多次。</p><p class="story-paragraph" data-source-key="2864:0">崔志勋尤其看不惯这种行为，心里憋闷就跑到釜山来和志宇絮絮叨叨。</p><p class="story-paragraph" data-source-key="2865:0">兄妹两个前十几年泾渭分明，志勋却又在这种事情上单方面和志宇同仇敌忾。一面愤愤吐槽金女士胳膊肘向外拐，一面又心疼崔志宇，崔志勋憋闷的牙齿都快咬碎，刷娱记真看到河览的绯闻，火气一股脑往上冲，没来由就想把柳河览连同那个绯闻演员一并铐进局子里。</p><p class="story-paragraph" data-source-key="2866:0">——你真是养了一头小白眼狼啊。</p><p class="story-paragraph" data-source-key="2867:0">他伏在志宇耳边小声地咕哝——小河的绯闻都闹上了，你还要在这里睡多久呢。</p><p class="story-paragraph" data-source-key="2868:0">当初关押志宇的那个仓库已经废弃了，釜山这边的警察封锁现场的时候他也跟去看过一眼，堆灰地面上滚着废弃针管，墙角处堆着密密匝匝的名字，全是柳河览。</p><p class="story-paragraph" data-source-key="2869:0">触目惊心。</p><p class="story-paragraph" data-source-key="2870:0">针管里的药物残留化验出来是催发Alpha易感期的烈性药，应是志宇向他们发出收网信号不久之后就被注射了。李河率被审讯的时候也发自内心地感慨过崔志宇真是疯子啊，被那种药物持续折磨了那么久，竟然还能够维持清醒的意识到你们赶过来。</p><p class="story-paragraph" data-source-key="2871:0">应该说崔志宇足够聪明，硬生生在虎狼窝里同他们周旋，就算没有全身而退也确实熬到了那几位议员现身，大解脱圆教当初逃跑的那几位头目也在现场，残余势力连同几位背后支持的议员一网打尽，失去头领的教会做鸟兽散，至少短时间内，是没有人能够再卷土重来。</p><p class="story-paragraph" data-source-key="2873:0">志勋和妹妹不熟，但是骨血相同，只是一瞥那个写满河览名字的角落，志宇的心性动机便在顷刻之间了若指掌。大抵崔家人关于爱人的偏执骨子里独一份，若非最后一个名字不是柳河览，崔志宇哪里来的勇气舍去一切?</p><p class="story-paragraph" data-source-key="2874:0">好似有个柳河览横亘在里边，她确实是痛也不怕，死也不怕。</p><p class="story-paragraph" data-source-key="2875:0">他见过那片角落，就再也不愿劝河览另择良人。可崔家把他们都教的太好，志勋更不能把这些照片发给河览看。</p><p class="story-paragraph" data-source-key="2876:0">太年轻的人死在一棵树上是一件很残酷的事情，如果河览因此不幸福，志宇醒过来一定会怪他。</p><p class="story-paragraph" data-source-key="2877:0">“快醒过来啊。”</p><p class="story-paragraph" data-source-key="2878:0">崔志勋压低声音的讲。</p><p class="story-paragraph" data-source-key="2879:0">“哪怕忘记大家也没有关系，没有人会怪你的，快醒过来吧。”</p><p class="story-paragraph" data-source-key="2880:0">他低低念，伏在床边，整个人都似蜷缩起来的兽，无助又委屈。</p><p class="story-paragraph" data-source-key="2881:0">剧播时就是大热，影帝影后联袂，名编名导坐镇。过了宣发期河览终于空下来，不管做哪行都忙得要死，不知道为何越忙越会想起最开始和崔志宇在那处鸽子笼相依为命的时日。</p><p class="story-paragraph" data-source-key="2882:0">那时候好似没有事做，百般无聊在笼子里等崔志宇傍晚回来，煮拉面或者坐在一起吃饭团，光看对方脸都觉得餍足又感激。</p><p class="story-paragraph" data-source-key="2883:0">周旋名与利之间，好似许多事身不由己。代言和拍摄工作铺天盖地的飞过来，压得她透不过气。</p><p class="story-paragraph" data-source-key="2884:0">那位追求她的Alpha碰了一鼻子灰很快又有新目标，河览把这件事当笑话讲给崔志宇听。</p><p class="story-paragraph" data-source-key="2885:0">她终于能得空飞到釜山去守着崔志宇，金宇宙给她放了长假，贴心为她推掉许多工作。</p><p class="story-paragraph" data-source-key="2886:0">金智慧得闲时总乐意同她讲许多志宇小时候的事情。</p><p class="story-paragraph" data-source-key="2887:0">被惹哭的时候特别可爱、不爱吃蔬菜但是会在家里点夏威夷披萨、讨厌黏乎乎的夏天、喜欢泡菜炖…慢吞吞，桩桩件件，辅着那本厚重的相册，娓娓道来，如数家珍。</p><p class="story-paragraph" data-source-key="2888:0">“你小时候好淘气，阳台上的花也拽下来，不怕被妈妈骂么。”</p><p class="story-paragraph" data-source-key="2889:0">长期卧床，志宇的头发也长长些许，掩住苍白病气的面容。河览在这里待几日，好似习惯自说自话，病房里空气沉默流淌。</p><p class="story-paragraph" data-source-key="2890:0">依稀记得相册里有几张志宇十七岁在西伯利亚的留影，深黑色大衣长束发，少年人特有的张扬气概。矜贵又精致，眉眼凌厉又漂亮，好似能够穿透西伯利亚的重重风雪。</p><p class="story-paragraph" data-source-key="2891:0">柳河览忍不住伸出手指，细细描摹崔志宇的眉眼。</p><p class="story-paragraph" data-source-key="2892:0">指尖轻轻碰碰过阖着的眼，勾过挺拔的鼻梁，拂过凉软的唇瓣。她动作好小心，沉着心垂着眼，细细致致，好似在触最珍贵的宝物。</p><p class="story-paragraph" data-source-key="2893:0">相貌漂亮的Alpha柳河览见过不少了。</p><p class="story-paragraph" data-source-key="2894:0">可好奇怪，只有一个崔志宇，在她心里是全世界最漂亮。</p><p class="story-paragraph" data-source-key="2895:0">“什么时候醒过来呢?”</p><p class="story-paragraph" data-source-key="2896:0">她轻轻问。</p><p class="story-paragraph" data-source-key="2897:0">好多问题想问你。</p><p class="story-paragraph" data-source-key="2898:0">喜欢什么、讨厌什么、从小到大经历过什么、最喜欢的人是谁、最讨厌的人是谁、离开我的那段时间有没有天天开心。</p><p class="scene-break" data-source-key="2899:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="2900:0">还有、喜欢我吗?</p><p class="story-paragraph" data-source-key="2901:0">她在心里也问的轻轻声，手指温温柔柔，慢慢拨弄志宇已经长长的头发。</p><p class="story-paragraph" data-source-key="2902:0">醒过来，告诉我，好不好。</p><p class="story-paragraph" data-source-key="2903:0">她温吞吞地想，慢慢地讲。</p><p class="story-paragraph" data-source-key="2904:0">失去一次才恍然惊觉对方宝贵，被刻意压抑的情绪迟来，又似潮汐卷来，兜头浸没她。</p><p class="story-paragraph" data-source-key="2905:0">夏盛时伊安前往西伯利亚，志勋去机场送她。一路费尽脑汁讲许多笑话，以往郑伊安还会笑两下说你好没品，现在她真的变不爱笑，一路寡言少语，只是沉默看窗外风景。万里无云的晴天，开阔到一望无垠的未来，车窗外风景飞逝时伊安骤然想起去年初雪时同志宇一路坐车路过汉江江泮，后知后觉时间真快，一转眼又要匆匆道别。</p><p class="story-paragraph" data-source-key="2906:0">“她醒过来给我发消息。”</p><p class="story-paragraph" data-source-key="2907:0">然而她也只是言简意赅，登机前请求志勋。</p><p class="story-paragraph" data-source-key="2908:0">志勋看她一眼，欲言又止的：“真的等不到了?”</p><p class="story-paragraph" data-source-key="2909:0">等不到了。</p><p class="story-paragraph" data-source-key="2910:0">伊安耸耸肩，摆摆手，洒然转身。</p><p class="story-paragraph" data-source-key="2911:0">在医院里看到柳河览的时候就知道等不到了，也无需她等，崔志宇醒过来的第一眼想看到的人一定不是她</p><p class="story-paragraph" data-source-key="2912:0">总觉得就此欠下了崔志宇什么，还不清楚，谁知道。</p><p class="story-paragraph" data-source-key="2913:0">她靠在椅背上昏昏欲睡，熟悉又亲切的痛意充斥着四肢，梦里还是志宇姐姐站在雪地里望过来的眼睛，浅珀色，剔透又明媚，世界上最珍贵的两颗宝石。</p><p class="story-paragraph" data-source-key="2914:0">心事淡薄，转瞬即逝，抓不住，到底是什么?</p><p class="story-paragraph" data-source-key="2915:0">伊安想不明白这种骤然将心脏揪起来的痛意源自于何。想到崔志宇只是觉得遗憾，还是没能等到她醒过来。</p><p class="story-paragraph" data-source-key="2916:0">——没有讲出那句谢谢，也讲不出来更多的话，一生仿佛就要在这种亏欠里过。</p><p class="story-paragraph" data-source-key="2917:0">她的困惑太轻，离地三千米高的云层中转瞬即逝，又似一颗骤然坠入海底的流星，光彩夺目，只是海水太冷太深，神驰目眩之后便归于永远的沉寂。</p><p class="story-paragraph" data-source-key="2918:0">只是她未曾想，同时同刻的釜山，似有所惊动，崔志宇的眼睑颤动，缓缓睁开过一瞬。</p><p class="story-paragraph" data-source-key="2919:0">坠在昏昏沉沉的梦里，看所有事物都仿佛隔着一层模糊的毛玻璃。看不清楚，迷糊间只记得有人悄悄来看过自己，落下来的眼泪滚烫。好奇怪的感觉，就像生命某个密不可分的东西骤然与她断裂，剧烈疼痛猝然，骇得她骤然清醒过一瞬。</p><p class="story-paragraph" data-source-key="2920:0">好似什么东西豁然断裂，此生至亲挚友天各一方，虚虚无无地从她的指间簌簌落下，一捧流沙再也握不住。</p><p class="story-paragraph" data-source-key="2921:0">…到底是什么。</p><p class="story-paragraph" data-source-key="2922:0">她没有力气想太多，昏沉的意识须臾间被深厚的疲倦挟裹拖进更深的海里，眼皮沉沉阖上，再也见不得海面透下任何一丝光。</p><p class="story-paragraph" data-source-key="2923:0">周播剧迎来结局的时候，夏季也迎来了尾声。</p><p class="story-paragraph" data-source-key="2924:0">天各一方的结果不尽人意，抱憾结局太惨痛。</p><p class="story-paragraph" data-source-key="2925:0">河览手捧情信的定格拍摄果然惊艳到观众，终于从金宇宙的缪斯这个称号脱出，彻底有了自己的名字。</p><p class="story-paragraph" data-source-key="2926:0">喧喧嚷嚷的热闹与她没有关系，那个Alpha还是时时给她发信息。其他也有Alpha的示好信息也有，摄影师演员片场一面之缘的编剧导演，鱼龙混杂，真假错综，是以往的她想不到的。</p><p class="story-paragraph" data-source-key="2927:0">现今柳河览突兀消失，这个世界上大抵有无数的人记得她。</p><p class="story-paragraph" data-source-key="2928:0">名声大噪，工作只会忙上添忙，走机场时被摄像灯闪花眼睛时她猝然想起金珉周当初含笑讲那应该是她最后一次风平浪静过机场，其实她还是不喜欢热闹和镜头。</p><p class="story-paragraph" data-source-key="2929:0">当初咬着牙撑只是想挣片酬给崔志宇更多，现在猝然惊觉一切都是崔志宇给的。</p><p class="story-paragraph" data-source-key="2930:0">她只能好生攥着。把志宇给的一切都攥在手心里，好似就和她之间的联系千丝万缕，永远纠缠。</p><p class="story-paragraph" data-source-key="2931:0">收到志宇醒过来的消息，是个寻常午后。</p><p class="story-paragraph" data-source-key="2932:0">小啾赖在边上拱她掌心撒娇。</p><p class="story-paragraph" data-source-key="2933:0">小朋友已被崔教授养成胖狗一只，老人家爱屋及乌，就连狗窝也买一堆，一日一换。被河览接到釜山的时候只担心小狗跟着河览吃苦，买了一堆零食玩具先行空投到釜山。</p><p class="story-paragraph" data-source-key="2934:0">小狗被养的太娇纵，撒泼打滚也肆无忌惮。</p><p class="story-paragraph" data-source-key="2935:0">河览正钻小狗减肥食谱时金多绚的电话打过来，急急让她赶紧去疗养院一趟。</p><p class="story-paragraph" data-source-key="2936:0">——志宇醒了。</p><p class="story-paragraph" data-source-key="2937:0">被她设想过无数次的情形骤然上演，一时间有些猝不及防，晃神间掌心被小狗湿漉漉的鼻尖蹭过，河览下意识低头看。小狗憨真，不懂人类悲欢，溜圆眼睛望着河览，映她一张无措又迷茫的脸蛋。</p><p class="story-paragraph" data-source-key="2938:0">她迟迟赶往医院，病房外早围拢一堆人。</p><p class="story-paragraph" data-source-key="2939:0">大家都好懂礼貌，守在走廊里听医嘱。</p><p class="story-paragraph" data-source-key="2940:0">病患情绪稳定，体征稳定，记忆有部分缺失，不要吵不要叫，健康才是第一位。</p><p class="story-paragraph" data-source-key="2941:0">河览站在众亲友最末端，被多绚骤然拉一把，一下子到医生跟前。</p><p class="story-paragraph" data-source-key="2942:0">志勋伸着脖子眼巴巴的问那可以先让小河进去见一面吗?</p><p class="story-paragraph" data-source-key="2943:0">——志宇醒过来的第一眼得是河览啊!!</p><p class="story-paragraph" data-source-key="2944:0">两位被医生看白痴的眼神看，金宇宙靠在边上也嫌弃，一转眼看到河览还怔在原地，没奈何，也笑着轻轻推河览一把。</p><p class="story-paragraph" data-source-key="2945:0">“进去看看啦。”她轻声讲，“我们不急的。”</p><p class="story-paragraph" data-source-key="2946:0">病床已被护工体贴地摇起来，河览走进去的时候，一眼就看到半靠起来的志宇。头发长长了，脸色不好，长梦将醒，一双眼沉沉地敛着情绪，听到声响迟钝地抬眼看过来，目光落到河览身上。</p><p class="story-paragraph" data-source-key="2947:0">柳河览屏住呼吸，没来由想起相册里那几张十七岁。</p><p class="story-paragraph" data-source-key="2948:0">草草束在脑后的马尾，飞扬跋扈的漂亮，直白又明亮的目光。</p><p class="story-paragraph" data-source-key="2949:0">她歪歪脑袋，志宇也学她歪歪脑袋。</p><p class="story-paragraph" data-source-key="2950:0">大抵是不记得她了。</p><p class="story-paragraph" data-source-key="2951:0">河览呼一口气，心里有了预期，反而没有设想中那么难过。</p><p class="story-paragraph" data-source-key="2952:0">她往前走两步，志宇的眼神也随着她的动作动，好像狗狗，眼神巴巴地跟着她，看的河览心脏泛软。</p><p class="story-paragraph" data-source-key="2953:0">“你叫什么名字?”</p><p class="story-paragraph" data-source-key="2954:0">柳河览听见自己问，问出口的刹那自己也想笑。好老土的搭讪方式，崔志宇大概不会喜欢这样。可是问题太多，好想问，以前总是志宇向自己的方向走，现今因果置换，她不介意一步一步再回到爱人的身边。</p><p class="story-paragraph" data-source-key="2955:0">“崔志宇。”</p><p class="story-paragraph" data-source-key="2956:0">“喜欢什么?”</p><p class="story-paragraph" data-source-key="2957:0">“妈妈做的泡菜炖”</p><p class="story-paragraph" data-source-key="2958:0">“不喜欢什么?”</p><p class="story-paragraph" data-source-key="2959:0">“不喜欢蔬菜和黏糊糊的夏天。”</p><p class="story-paragraph" data-source-key="2960:0">这样子的崔志宇太乖，久了没有讲话，声音也是哑哑的，一点一点地讲话不容易，河览突然不忍心再继续问下去。</p><p class="story-paragraph" data-source-key="2961:0">来日方长，她想。</p><p class="story-paragraph" data-source-key="2962:0">可总有不得不问的问题，此刻要问，必须要问。</p><p class="story-paragraph" data-source-key="2963:0">关于崔志宇的爱和真心都随着心脏一起暴烈的跳动着，一刻也容不得她等。</p><p class="story-paragraph" data-source-key="2964:0">河览胆小，固执又偏执，错过一刻就再也没有错过更多的勇气，得不了想要的答案大不了就带着小啾回江原道。</p><p class="story-paragraph" data-source-key="2965:0">“我喜欢你，想和你结婚。”</p><p class="story-paragraph" data-source-key="2966:0">河览听见自己轻声讲。</p><p class="story-paragraph" data-source-key="2967:0">脸皮很薄的人，告白反而异常艰难，多说一点，耳根子就红一点，在这样的崔志宇面前剖陈真心，莫名有一点赧然，只是还是得硬着头皮继续讲。</p><p class="story-paragraph" data-source-key="2968:0">“你喜欢我吗?”</p><p class="story-paragraph" data-source-key="2969:0">你要不要再喜欢我一次。</p><p class="story-paragraph" data-source-key="2970:0">话音落，心如擂鼓，说完河览就很仓皇地移开眼睛，不敢再看崔志宇。</p><p class="story-paragraph" data-source-key="2971:0">正是因为不敢再看，所以看不到崔志宇眼底满心的欢喜和爱意，好似和缺失的记忆无关，一切只发自本能。</p><p class="story-paragraph" data-source-key="2973:0">“喜欢你。”压住笑，崔志宇轻声回应，“我愿意。”</p><p class="end-mark" data-source-key="2976:0">——END——</p></div>
      </article>

      <article class="chapter" data-chapter="section-12">
        <header class="chapter-header"><span class="chapter-number">12</span><h2>Chapter 12</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="2981:0">复健是一个漫长的过程。</p><p class="story-paragraph" data-source-key="2982:0">被子弹掏去半条命，志宇身体也不如从前。记忆丢到十七岁之前，十七岁的小孩闹腾，最听金智慧的话，心性骤然转做少年，性子也自然而然多些骄矜跋扈。</p><p class="story-paragraph" data-source-key="2983:0">那是金家人和崔家人捧在手心里，视定为继承人的天之骄子，千宠万宠的糖窝里长大，要什么给什么，要天上的星星也给摘下来。</p><p class="story-paragraph" data-source-key="2984:0">只是她也不需要天上的星星。</p><p class="story-paragraph" data-source-key="2985:0">柳河览陪在她身边，看她很紧，哄她似小孩。没有人这么对过崔志宇，她觉得很新奇，勉强在河览面前低眉顺眼做听话乖狗。崔家她吃惯的厨子也被金智慧丢去釜山伴大小姐康复，一天不重样地做营养餐，总有被吃得厌烦腻味的时候。</p><p class="story-paragraph" data-source-key="2986:0">河览有时候会在疗养院里的便利店抓到她。</p><p class="story-paragraph" data-source-key="2987:0">太瘦削，纯白色病号服穿在身上都似大一号，风一过吹的鼓鼓的。到底睡太久，曾经的漂亮身段瘦到挂不住衣服。瘦太过，脸颊肉彻底消下去，一层皮薄薄地裹着骨架子，整个人宛若地狱中爬回的艳鬼。</p><p class="story-paragraph" data-source-key="2988:0">河览看得心脏绞痛。</p><p class="story-paragraph" data-source-key="2989:0">崔志宇从前不爱吃这些，看到就要蹙眉头的程度。</p><p class="story-paragraph" data-source-key="2990:0">现在攥着高碳水的垃圾食品站在便利店的货架旁边看她。眼神湿漉漉的，有点像减肥期偷偷扒拉狗零食的小啾。</p><p class="story-paragraph" data-source-key="2991:0">河览走过去，把饭团从志宇的手里抽走，一转头拿下冰柜里的草莓牛奶。</p><p class="story-paragraph" data-source-key="2992:0">“喝这个好不好?”</p><p class="story-paragraph" data-source-key="2993:0">崔志宇眨巴眼睛看她。</p><p class="story-paragraph" data-source-key="2994:0">河览抿了抿嘴，轻轻讲：“这个可以喝一口，但是那个不行。”</p><p class="story-paragraph" data-source-key="2995:0">其实这些东西医生都不建议志宇吃，重伤初愈的身体受不得半点刺激，出不得半分差池。</p><p class="story-paragraph" data-source-key="2996:0">志宇的目光从草莓牛奶移到她的脸上，眼睛弯了弯，笑起来。</p><p class="story-paragraph" data-source-key="2997:0">“不吃也没有关系。”</p><p class="story-paragraph" data-source-key="2998:0">“我们回去吧。”</p><p class="story-paragraph" data-source-key="2999:0">她声音很轻，语调也俏皮。漂亮的眼睛一瞬不瞬地望着河览，满心满眼只有对方的身影。站在便利店里攥着饭团倒数着河览找过来的时间，被找到就乖乖地放下手里的东西跟她回去。</p><p class="story-paragraph" data-source-key="3000:0">同样的单方面的游戏志宇做过很多次，乐此不疲。</p><p class="story-paragraph" data-source-key="3001:0">不知为何，关于河览的记忆空白，只是有个声音在耳边讲——让她找到你，找到你，然后再也不离开她。</p><p class="story-paragraph" data-source-key="3002:0">轻轻声的，细细碎的，梦魇魔咒似的，一遍又一遍，疯狂又固执</p><p class="story-paragraph" data-source-key="3003:0">她松松地倚在货架上，看河览蹙着的眉头一点点松下去，心情也一分分好起来。</p><p class="story-paragraph" data-source-key="3004:0">其实身体还是不太好受，左手上还固定着矫正绷带，被折断的三根手指离恢复以往可以正常活动的水平还需要漫长的时间，被枪打出来的伤口在躯体上留下了永久的疤痕，神经受到的损伤不可逆转，天阴天晴伤口都会隐隐泛痛。</p><p class="story-paragraph" data-source-key="3005:0">十七岁的少年心性没有二十岁的隐忍，情绪涌出来藏不住，又不愿意在河览面前露出半分脆弱。</p><p class="story-paragraph" data-source-key="3006:0">索性就藏起来。</p><p class="story-paragraph" data-source-key="3007:0">一开始河览不知道这些</p><p class="story-paragraph" data-source-key="3008:0">她琢磨着，等志宇彻底恢复了她就带她回江原道。带回去养起来，养的白白胖胖的，再也不要让她消失到自己找不到。</p><p class="story-paragraph" data-source-key="3009:0">现在的工作真的很忙，但是报酬都很高，银行卡里已经积起了一笔厚厚的钱。</p><p class="story-paragraph" data-source-key="3010:0">大概是在以前的认知里算这辈子都挣不到的数额，若是以前河览会想大概真的会去超市把很多买不起的东西买到够。现在钱被她交给宇宙，委托宇宙和多绚帮她在雪岳山附近购房子。</p><p class="story-paragraph" data-source-key="3011:0">要有很漂亮的屋檐，天青时看远处山脉绵延，天雨时与志宇依偎着听雨声。院子要大，种一院子花，白月季，最好都种克莱尔奥斯汀。</p><p class="story-paragraph" data-source-key="3012:0">可是她转念一想，觉得只有克莱尔奥斯汀太单调，她的小狗应该不会很喜欢。</p><p class="story-paragraph" data-source-key="3013:0">——如果江原道太冷的话，其实济州岛也可以，釜山也可以。</p><p class="story-paragraph" data-source-key="3014:0">只要和志宇姐姐一直待在一起，去哪里都可以。</p><p class="story-paragraph" data-source-key="3015:0">好奇怪的感觉，想给崔志宇整个世界，想给崔志宇整个宇宙，想把自己给崔志宇。</p><p class="story-paragraph" data-source-key="3016:0">滚烫又明了的情感在她的胸腔里炙烤着那颗砰砰跳动的心脏，多望一望志宇好似就要溢出来。</p><p class="story-paragraph" data-source-key="3017:0">失而复得的人最可贵，脆弱的神经每时每刻都浸在过于亢奋的情绪里。绷的太紧，就连金宇宙也忍不住担心她。</p><p class="story-paragraph" data-source-key="3018:0">“你要休息一下呀。河览。”</p><p class="story-paragraph" data-source-key="3019:0">说这种话的时候河览还在查什么样的花种在院子里最好看，金达莱会衬克莱尔奥斯汀么?还是多种一点加百列?院子里要架一座秋千么?志宇好像喜欢坐在晃晃荡荡的地方玩。思量着这些东西，听到金宇宙的话又觉得有一点茫然。</p><p class="story-paragraph" data-source-key="3020:0">抬头的时候从对方的眼里看到了真真切切的担心。</p><p class="story-paragraph" data-source-key="3021:0">河览轻轻地讲：“我不觉得累呀。”</p><p class="story-paragraph" data-source-key="3022:0">只是脑内的那根弦绷得紧紧的，心脏时常作痛，闭上眼是崔志宇从抢救室被推出来的样子。劫后余生的狂喜和后怕时时冲刷着她，河览敛目，将手机上的界面退出去。</p><p class="story-paragraph" data-source-key="3023:0">她说：“我只是想一直和志宇姐姐在一起。”</p><p class="story-paragraph" data-source-key="3024:0">她讲这句话的时候，声音沙沙的，平静又理所当然的语气。</p><p class="story-paragraph" data-source-key="3025:0">失去过崔志宇，一次又一次，她再也没有更多的心力去承担失去的代价了。</p><p class="story-paragraph" data-source-key="3026:0">金宇宙眉心一跳，迟钝眨眨眼睛。</p><p class="story-paragraph" data-source-key="3027:0">志宇出事的那段时间，所有人的焦点和焦虑都放在病房里那位生死未卜的人身上。没有人注意到缩在角落里的河览。</p><p class="story-paragraph" data-source-key="3028:0">大抵真是咬牙又切齿，才慢吞吞地把已经破碎过一次的心脏拼好。</p><p class="story-paragraph" data-source-key="3029:0">让一个碎掉的人在某处孤零零地把自己拼好，本便是这个世界上最艰难，最辛苦的事情。</p><p class="story-paragraph" data-source-key="3030:0">她彻底讲不出来话了。</p><p class="story-paragraph" data-source-key="3031:0">闹绯闻的时候河览没有澄清，于是大多数人理所当然认为她会有新的开始。多绚郁闷，志勋愤懑。只有金智慧专门打电话来告诉宇宙，小河年轻，不吊死在志宇这棵树上是好事。</p><p class="story-paragraph" data-source-key="3032:0">金女士真心实意怜惜河览，发自内心视河览为疼爱的晚辈。</p><p class="story-paragraph" data-source-key="3033:0">“她过得很辛苦，很多事情是志宇在欺负她。”</p><p class="story-paragraph" data-source-key="3034:0">金智慧从来通情达理，开明善良，从主恩那里知晓江原道里那家人的嘴脸，也笑着同宇宙讲自己的打算。</p><p class="story-paragraph" data-source-key="3035:0">“如果真的和那位有了好结果，我也会去替河览向那家人讨要属于河览的柿子饼的。”</p><p class="story-paragraph" data-source-key="3036:0">话音落地，风轻云淡，某种程度上，到底是或者否，金女士不介意自己再多半个女儿。</p><p class="story-paragraph" data-source-key="3037:0">志宇出生的时候，作为母亲的金智慧做过白龙入怀的胎梦，预料到还未出世的小孩儿大抵以后会走上一条辛苦而不平凡的道路。</p><p class="story-paragraph" data-source-key="3038:0">怀着志宇的时候，只是发自内心的期盼着这个孩子明朗的未来，坦荡的人生。</p><p class="story-paragraph" data-source-key="3039:0">这是天底下所有父母的共同认知。</p><p class="story-paragraph" data-source-key="3040:0">是人之常情，理所当然。</p><p class="story-paragraph" data-source-key="3041:0">正是因为如此，所以爱屋及乌，对河览的偏爱明目张胆，明晃晃让所有人知道。</p><p class="story-paragraph" data-source-key="3042:0">只是这些事河览不知道。</p><p class="story-paragraph" data-source-key="3043:0">她不知道的东西太多，不知道有人满心盼她温饱和富足，不知道许多事是志宇心甘情愿，不知道写满她名字的角落。</p><p class="story-paragraph" data-source-key="3044:0">——她不知道，也没有人敢告诉她。</p><p class="story-paragraph" data-source-key="3045:0">被关在那个仓库的三个星期里，志宇受过肉体毒打，受过药物摧残，受过许多折磨，这些折磨被李河率在被审讯的过程中风轻云淡地讲出来，就连一旁负责记录的人也不忍8多听片刻。</p><p class="story-paragraph" data-source-key="3046:0">搞邪教的人丧心病狂，只是提到崔志宇的时候终于露出片刻无语和复杂。</p><p class="story-paragraph" data-source-key="3047:0">——疯子啊。</p><p class="story-paragraph" data-source-key="3048:0">注射在志宇身上的药物是windsky的最新型药剂，药性猛烈到足矣令世界上心性最坚定的人神智动摇。在注射过那种药物，身边又被丢过一个发情期中的omega的时候，保持理智是一件很困难的事情。</p><p class="story-paragraph" data-source-key="3049:0">就连omega也经过李河率的千挑万选，五官肖似柳河览，信息素接近雪绒花的气息。</p><p class="story-paragraph" data-source-key="3050:0">他的恶意太甚，见过志宇的心性坚定，就更好奇她的疯狂和堕落。</p><p class="story-paragraph" data-source-key="3051:0">把神坛上的人拉进脏污里边，本身就是普罗大众刻在本性里的恶趣味。</p><p class="story-paragraph" data-source-key="3052:0">但是他没有想到，这个世界上真的存在圣人，被药物刺激激发出骨血里潜藏的暴戾本性，却又能够生生硬硬地将这种欲望四平八稳地压回意识的最深处。</p><p class="story-paragraph" data-source-key="3053:0">——崔志宇的左手折了三根手指，全是在她被药物激没神智时由自己生生掰折。</p><p class="story-paragraph" data-source-key="3054:0">人体的自卫机制不会允许自身的摧残性行为，肉体感知到疼痛过载，大脑就会发出中止指令。</p><p class="story-paragraph" data-source-key="3055:0">但是真可怕啊，忤逆本能，违背躯体指令。</p><p class="story-paragraph" data-source-key="3056:0">十指连心，剧烈的疼痛压过药性一头，痛到身体都动不了半分，所以才能够足够清醒。</p><p class="story-paragraph" data-source-key="3057:0">被收押入狱的时候李河率还在轻飘飘地问是因为爱情吗?</p><p class="story-paragraph" data-source-key="3058:0">“不是啊。”</p><p class="story-paragraph" data-source-key="3059:0">志勋终于忍无可忍，打断他。</p><p class="story-paragraph" data-source-key="3060:0">是因为志宇温柔，是因为志宇善良，是因为志宇是世界上心性最坚定的人。知道被丢进来的omega无辜，所以宁可折损自己。</p><p class="story-paragraph" data-source-key="3061:0">——一直维持着这样的想法，直到看到那个角落。</p><p class="story-paragraph" data-source-key="3062:0">从现场被拍回的照片存在志勋的手机里，泛灰墙角叠着密密麻麻的字，不止几个，也不止几处。深深浅浅，重重摞摞地叠在一起，密密匝匝。只是一眼就看的志勋心脏暴跳，不敢再想那时志宇到底是抱着什么样的心绪缩在那里一点点地写着河览的名字。</p><p class="story-paragraph" data-source-key="3063:0">她就那样，一点点，一直写，直到河览的名字堆满那个角落。</p><p class="story-paragraph" data-source-key="3064:0">在这三周里，柳河览三个字好似就是志宇落在清醒世界的唯一锚点。被这两个字牵引着，因为肉体上的苦痛而游弋出离的灵魂才能短暂地在这痛苦的动荡中暂获一隅踏实。</p><p class="story-paragraph" data-source-key="3065:0">在看到河览的绯闻之后，极度愤怒的情况下，志勋把这张照片调出来给宇宙看。</p><p class="story-paragraph" data-source-key="3066:0">他甚至想直接冲去找河览，把这个拍在河览面前。</p><p class="story-paragraph" data-source-key="3067:0">想问问她怎么忍心，想问问她怎么敢。</p><p class="story-paragraph" data-source-key="3068:0">——可是金智慧把三个孩子都教的太好太善良。</p><p class="story-paragraph" data-source-key="3069:0">就算在宇宙面前说许多气话，志勋也只是咬着牙，把一口恶气狠狠咽下。</p><p class="story-paragraph" data-source-key="3070:0">如果河览真的在志宇的这棵树上吊死一辈子，又有谁能忍心眼睁睁看着?</p><p class="story-paragraph" data-source-key="3071:0">是志宇有的事情没有做对，欺她瞒她这么久，一切自发自主，哪怕分道扬镳，也是这个人咎由自取。</p><p class="story-paragraph" data-source-key="3072:0">在座各位，没有任何一个人有立场、有理由去向河览横加指责。</p><p class="story-paragraph" data-source-key="3073:0">可志勋还是太生气了，心里存着一万分不甘，后槽牙恨的快咬碎。</p><p class="story-paragraph" data-source-key="3074:0">崔志宇太缄默，沉沉的情绪落在河览身上就像轻飘飘的雪花落在鼻尖上。</p><p class="story-paragraph" data-source-key="3075:0">一触即化的雪从来不好捉摸，到底是真心是假意，外人哪里能够猜透。</p><p class="story-paragraph" data-source-key="3076:0">可是她一直这样，太了解她的人，看不下去，会觉得她过的太辛苦。</p><p class="story-paragraph" data-source-key="3077:0">——这些也是河览不知道的。</p><p class="story-paragraph" data-source-key="3078:0">从前不知道，现在也不知道。</p><p class="story-paragraph" data-source-key="3079:0">那时候她浸在自己的情绪里，无暇顾及外界纷扰。现今浸在自己的思绪里，满心都是自己的打算和琢磨。</p><p class="story-paragraph" data-source-key="3080:0">——想把崔志宇关起来。</p><p class="story-paragraph" data-source-key="3081:0">这才是她真正想着的，却难以对宇宙启齿的话。這種心绪太阴私，太丑陋，她讲不出口。</p><p class="story-paragraph" data-source-key="3082:0">——她想把志宇关在漂亮的园子和房子里，关在只有她知道的地方，关在她可以找到的地方，不至于让她一次次受睁开眼睛就看到身侧空荡荡的苦。缱绻痴缠，怨憎一会，梦里朦胧，无论是什么样的境况，每次醒过来的时候身旁都是空落落的一片，以至于到后来她甚至讨厌醒过来。</p><p class="story-paragraph" data-source-key="3083:0">梦中的志宇现实里的志宇都抽身走的毫不留恋，只留她一人在晨日徒劳又缓慢地收敛心绪。</p><p class="story-paragraph" data-source-key="3084:0">轻微又病态的心绪幽灵似地缠着她，喃喃地在耳边念着如果你那天早上醒过来——</p><p class="story-paragraph" data-source-key="3085:0">醒过来，拉住志宇，是不是就可以收获再也不失去这种选项?</p><p class="story-paragraph" data-source-key="3086:0">她控制不住自己，不愿意想这些，偏偏又忘不掉那天晚上接到的电话</p><p class="story-paragraph" data-source-key="3087:0">——原来在她无知无觉的时刻，崔志宇受了那么多折磨。</p><p class="story-paragraph" data-source-key="3088:0">放在桌下的手指屈了屈，河览不动声色地将指尖死死地掐进掌心里。</p><p class="story-paragraph" data-source-key="3089:0">金宇宙还是很担心她，通讯录里拣出一张名片推给她，让她得空去看看。</p><p class="story-paragraph" data-source-key="3090:0">——那是整个首尔最出名的心理诊室。</p><p class="story-paragraph" data-source-key="3091:0">“姐姐好像觉得我疯掉了?”</p><p class="story-paragraph" data-source-key="3092:0">河览轻轻问。</p><p class="story-paragraph" data-source-key="3093:0">可有的时候河览确实觉得自己疯掉了，四月份的时候过二十岁的生日，多绚和Carmen捧着蛋糕到她面前唱生日颂。宇宙和珉周笑盈盈地讲河览的话做什么都会很顺利的。熬过前十九年的暗无天日，荒芜的人生在二十岁迎来了精彩纷呈——命运慷慨，将前十几年掳走的好运又在二十岁时悉数奉还。</p><p class="story-paragraph" data-source-key="3094:0">积攒二十年的运气天降，就连曾经未知的前途都亮的照眼。</p><p class="story-paragraph" data-source-key="3095:0">金智慧女士托人打了招呼，现在圈内都知道她的来路，餐桌上再也无人敢怀着恶意催她喝酒。</p><p class="story-paragraph" data-source-key="3096:0">又是横空出世，又背靠崔家和金家，同时获得名编名导的青眼，是许多人艳羡，却又羡慕不来的运气。</p><p class="story-paragraph" data-source-key="3097:0">吹灭蜡烛的时候河览觉得好累。</p><p class="story-paragraph" data-source-key="3098:0">明明只在这个世界上过了二十年，却好像活了很久很久，过了很长很长的时间。</p><p class="story-paragraph" data-source-key="3099:0">久到她也觉得活着厌烦，如果志宇一直醒不过来，她去找她也无妨。</p><p class="story-paragraph" data-source-key="3100:0">名字叫做柳河览的演员人生贫瘠而荒芜，迄今也只觉得自己除了那只叫做志宇的小狗一无所有。</p><p class="story-paragraph" data-source-key="3101:0">心脏被迟钝的倦意轻轻地攥着，她垂眸笑笑，接过多绚递过来的餐刀开始分蛋糕。</p><p class="story-paragraph" data-source-key="3102:0">动物奶油和新鲜草莓搭成的蛋糕好吃，送在嘴里整个人都好似飘上云端。</p><p class="story-paragraph" data-source-key="3103:0">命运公正，报复性似的还她一切平安顺遂，又在她的平安顺遂里掳走一个崔志宇。</p><p class="story-paragraph" data-source-key="3104:0">吹灭蜡烛的时候河览闭上眼睛轻轻许愿，跨年的时候想着崔志宇天天开心，现在还是想崔志宇天天开心——其实应该也不算命运慷慨，是崔志宇大方过头，不惜送她锦绣人生。</p><p class="story-paragraph emphasis" data-source-key="3105:0">现在仔细想一想，她那时候大概是真的不想活了。</p><p class="story-paragraph" data-source-key="3106:0">被恹恹的情绪压着，整个人都像泡在冰冷的水里。脑子已经被冻到转不动任何内容了，但是偏偏活在镁光灯和镜头下，只能扯动嘴角露出机械的笑容。她甚至不知道该怎么去想起崔志宇。</p><p class="story-paragraph" data-source-key="3107:0">种在鸽子笼里的克莱尔奥斯汀愈发旺盛，金多绚雇人每日去浇花，五月份时花发第一枝，多绚将照片kkt上发给她。</p><p class="story-paragraph" data-source-key="3108:0">那时河览正在济州岛拍杂志封面，立在海崖边上，身后天海一色，祥云万里。</p><p class="story-paragraph" data-source-key="3109:0">月季花被养的极好，一改以往野蛮生长的散漫，骨朵儿和开着的花饱满而硕大，不似当初她从阳台上撷下送给志宇的那一朵。</p><p class="story-paragraph" data-source-key="3110:0">瘦瘦瘪瘪的小花其实已是阳台上开的最好的一朵，轻飘飘地被志宇捧在手里，好似就捧住了她的全世界。</p><p class="story-paragraph" data-source-key="3111:0">河览垂眸看屏幕，照片上的月季花蓬勃又漂亮，在济州岛的阳光照射下熠熠生辉。</p><p class="story-paragraph" data-source-key="3112:0">她没有办法不想崔志宇。</p><p class="story-paragraph" data-source-key="3113:0">靠在阳台上给月季花浇水的崔志宇，含着眼泪把她揽进怀里的崔志宇，夜市上吃着关东煮的崔志宇，相依为命的崔志宇…无知无觉间连同整个生命也被崔志宇填满，就算是不想起来，生命和人生里早已被这个人留下了无法抹灭的痕迹。</p><p class="story-paragraph" data-source-key="3114:0">把一个人从记忆里硬生生抹去，不亚于拆骨削肉。</p><p class="story-paragraph" data-source-key="3115:0">是崔志宇贸然闯入，留下一笔浓墨重彩，然后彻底消失。</p><p class="story-paragraph" data-source-key="3116:0">再度醒过来的志宇只有十七岁以前的记忆，粘她信任她，只是河览太清醒。不适时的清醒是一种很微妙的残酷——那朵属于她的克莱尔奥斯汀已经永远离开了。</p><p class="story-paragraph" data-source-key="3117:0">从此经历过的所有都变成她一个人私有，除她以外无人知晓。</p><p class="story-paragraph" data-source-key="3118:0">在釜山购到公寓，将小啾从首尔接到这里，熬着熬着，熬到了崔志宇醒过来，然后平静地接受她已经将自己全然忘记的事实。</p><p class="story-paragraph" data-source-key="3119:0">一路这么走过来，情绪在脑海里堆得沉重，一时之间云遮雾绕，甚至连同她自己也辨不清自己的心意。</p><p class="story-paragraph" data-source-key="3120:0">一时之间，不知道到底是把崔志宇彻底关起来好，还是自己消失的好。</p><p class="story-paragraph" data-source-key="3121:0">见不到是折磨，见到也是煎熬，可是如果崔志宇不记得了，她又凭什么要用自己经历过的这一段去锢住崔志宇的自由?</p><p class="story-paragraph" data-source-key="3122:0">这些话她问不出口，也不知该从何说起。</p><p class="story-paragraph" data-source-key="3123:0">被两种极端的想法拉扯，整个人都好似被架在火上翻烤。闭上眼睛是雾里看花的曾经，睁开眼是现在的志宇望向她的眼睛。</p><p class="story-paragraph" data-source-key="3124:0">被子弹贯穿过的躯体孱弱，因为失忆影响，一向引以为傲的高智商好似也折去大半。</p><p class="story-paragraph" data-source-key="3125:0">就连记忆力也受到损伤，记不住事、记忆断片时常发生。</p><p class="story-paragraph" data-source-key="3126:0">出事前的崔志宇漂亮又伶俐，耀眼似天上骄阳与明月，现今变成这样，自己也难以接受。</p><p class="story-paragraph" data-source-key="3127:0">她多数时候还是独立，配合复健，医生过来与她讲身体现况，她也会敛着眼很认真听。</p><p class="story-paragraph" data-source-key="3128:0">丢掉了转速很快的脑子，只是冷静又骄傲的本性还刻在骨子里，不至于让她在狼狈时失态过度。</p><p class="story-paragraph" data-source-key="3129:0">只是现今太狼狈，河览伴在她左右，见到她这样，会不会也怀念过一瞬曾经的那个崔志宇?</p><p class="story-paragraph" data-source-key="3130:0">微妙又晦涩的不安在志宇单薄的胸膛里翻滚着。</p><p class="story-paragraph" data-source-key="3131:0">她一面草草地在笔记本上记下不能够被忘记的事宜，一面又在心里轻轻地想：我是不是该放河览离开呢?</p><p class="story-paragraph" data-source-key="3132:0">二十岁的躯体伫留着十七岁的少年人的记忆和灵魂，不似后来一步三算的捉摸不透，没脑子的崔志宇坦诚许多，在多绚和志勋过来探望时将疑惑讲出。</p><p class="story-paragraph" data-source-key="3133:0">——她对河览有着发自本能的依赖和喜欢，愈是这样，愈发好奇当初究竟一同经历过什么。</p><p class="story-paragraph" data-source-key="3134:0">空白下去的记忆似一整面顽固伫立在跟前的墙，横断过去也阻断未来。</p><p class="story-paragraph" data-source-key="3135:0">崔志宇不纠结失去的记忆，只是好奇心太盛，太想知道这种发自本能的依赖从何而来。</p><p class="story-paragraph" data-source-key="3136:0">大概是问出来的姿态太坦然，多绚与志勋相视一眼，从彼此眼里读到复杂。</p><p class="story-paragraph" data-source-key="3137:0">一整个下午娓娓道来，许多事情多绚只知大概，讲不清楚，听上去也似隔过一层蒙蒙的毛边玻璃。</p><p class="story-paragraph" data-source-key="3138:0">她慢吞吞讲，提心吊胆，余光偷偷瞥着志宇的神色。</p><p class="story-paragraph" data-source-key="3139:0">只是出乎她的意料，这个人没有任何动容的表情，只是懒懒地撑着腮听，好似在听一个同自己完全无关的故事。</p><p class="story-paragraph" data-source-key="3140:0">太冷漠，置身事外，高高挂起。</p><p class="story-paragraph" data-source-key="3141:0">可她是当事人，桩桩件件均是亲身经历，自主选择。偏偏又成为局外人，忘记一切，就有了置身事外的从容不迫，就可以冷眼旁观一整段的是非曲折。</p><p class="story-paragraph" data-source-key="3142:0">志宇的失忆情况太复杂，一方面是伤口大出血引发的休克导致，另一方面，兴许也是离别和被关押的那段时间太痛苦，身体自卫机制启动，彻底阻断她想起来的可能性。</p><p class="story-paragraph" data-source-key="3143:0">贸然刺激志宇恢复记忆的行为太冒险，志勋也好，多绚也罢，谁都没有做出这个决定的胆子。</p><p class="story-paragraph" data-source-key="3144:0">谁也没有直接这样做的权利。</p><p class="story-paragraph" data-source-key="3145:0">“你把河览欺负的太惨了。”</p><p class="story-paragraph" data-source-key="3146:0">多绚讲。她不晓得那一面墙，也没有讲假话，期期瞒瞒骗到如今，莫名又去将自己弄成如今模样。河览太苦，跨年夜收获噩耗，小半年时间独自疗愈，现今被志宇完全忘记，吊在那里，不走煎熬，走也难过。</p><p class="story-paragraph" data-source-key="3147:0">“她可以走。”志宇很平静地讲，“待在我身边太辛苦。”</p><p class="story-paragraph" data-source-key="3148:0">“她能去哪。”金多绚嗤一声，“她早就亲缘断绝。”</p><p class="story-paragraph" data-source-key="3149:0">难道要回那个把她吃死的旧房子里么?金多绚想问。</p><p class="story-paragraph" data-source-key="3150:0">那她当初为了买断柳河览的亲缘下的威胁砸的钱算什么?</p><p class="story-paragraph" data-source-key="3151:0">志勋欲言又止的，看多绚一眼，看志宇一眼。</p><p class="story-paragraph" data-source-key="3152:0">他什么也没说，什么也说不出来。</p><p class="story-paragraph" data-source-key="3153:0">多绚在釜山这边还有事务接洽，坐了半个下午匆匆离开了，志勋晚一点走，临走前却被志宇突兀叫住：“真的没有什么要说的么?”</p><p class="story-paragraph" data-source-key="3154:0">崔志勋的眉头下意识地蹙起来。</p><p class="story-paragraph" data-source-key="3155:0">说什么好，说你为柳河览去拍三级片还是说你为她把自己搞成现在这种样子，还是讲你圣人病又犯害死别人一生。</p><p class="story-paragraph" data-source-key="3156:0">那面墙刻在他记忆里，太惨烈，给宇宙看过就再也不敢给任何人看。</p><p class="story-paragraph" data-source-key="3157:0">“你想我说什么。”崔志勋问。</p><p class="story-paragraph" data-source-key="3158:0">崔志宇眸子低垂，不知在想什么，片刻后突兀又问：“我依稀记得你有一个朋友在大学里做人体定位芯片的项目，现在做出来了吗?”</p><p class="story-paragraph" data-source-key="3159:0">“已经很成熟了。”</p><p class="story-paragraph" data-source-key="3160:0">现在你体内就有一枚。</p><p class="story-paragraph" data-source-key="3161:0">崔志勋没讲这句话，眉微微地皱着，等崔志宇下文。</p><p class="story-paragraph" data-source-key="3162:0">崔志宇也没有接着讲，好似是倦了。受过重伤的身体精力奇差，崔志勋了然，转身欲走时，身后传来崔志宇轻飘飘的声音。</p><p class="story-paragraph" data-source-key="3163:0">“我想要一枚。”</p><p class="story-paragraph" data-source-key="3164:0">崔志勋眉心暴跳，重重抬手按了按。前不久听宇宙讲河览精神状况堪忧，大有要把崔志宇绑回江原道的阵仗。</p><p class="story-paragraph" data-source-key="3165:0">现今轻飘飘一句话打进他耳朵里，顷刻间就让他明白崔志宇想做什么。</p><p class="story-paragraph" data-source-key="3166:0">他倒是想掉头去安慰金宇宙：说不定崔志宇愿意乐意，迫不及待要把自己整个献上。</p><p class="story-paragraph" data-source-key="3167:0">两个人之间算一个愿打一个愿挨，什么锅配什么盖，不该他们这些旁人多做操心。</p><p class="story-paragraph" data-source-key="3168:0">“还是把你身体养好再说吧。”</p><p class="story-paragraph" data-source-key="3169:0">喉头滚动，崔志勋牙缝里挤出这句话，狠狠的。</p><p class="story-paragraph" data-source-key="3170:0">河览傍晚才到疗养院。</p><p class="story-paragraph" data-source-key="3171:0">同金宇宙聊过一下午，确定了下半年大半拍摄和工作都会挪到釜山。刚出道就脱离首尔圈子并非好事，釜山太远，崔家和金家的手伸过来吃力，一个圈子里有一个圈子里的讲究。</p><p class="story-paragraph" data-source-key="3172:0">只是河览定了心，宇宙也不再好说什么。其实没有工作河览也不在意，她现在太乱，只想着把崔志宇好好地守住，离开也好不离开也罢，这种考量在现下不现实。</p><p class="story-paragraph" data-source-key="3173:0">是她太贪，想多看两眼崔志宇。</p><p class="story-paragraph" data-source-key="3174:0">是她放不下。</p><p class="story-paragraph" data-source-key="3175:0">某种程度上来讲是志宇让人放心，在她刻意减少去探望的次数的时候也配合着复健。到达病房的时候发现对方竟然很难得的没有昏睡——也没有躲去便利店。</p><p class="story-paragraph" data-source-key="3176:0">她只是乖乖窝在床前的长沙发上，手里松松捏住一本书，垂眸看的正入神。</p><p class="story-paragraph" data-source-key="3177:0">特护病房里的设备齐全，选了景观最好的一间，高楼大窗，透过巨大的落地玻璃可以眺到远处的海和连绵的山。</p><p class="story-paragraph" data-source-key="3178:0">天气晴朗，晚霞就漂亮。夕光透过窗玻璃投进房间，浸没志宇一半脸。</p><p class="story-paragraph" data-source-key="3179:0">半张脸在光下，半张脸藏进阴里，河览看不清楚崔志宇的表情。这便让河览心底产生了一种微妙的不安，她说不清那种不安到底是怎么来的。但是崔志宇只是靠在那里，很放松的姿势，懒洋洋的倚在沙发里翻那本书。听到她的动静下意识就抬眼看过来。</p><p class="story-paragraph" data-source-key="3180:0">在没有情绪的时候，志宇的眼睛冷冷的，剔透而无机制。只是一眼就把河览怔在原地。</p><p class="story-paragraph" data-source-key="3181:0">她的心事太重，被这样的眼神看着，莫名就有心虚的感觉。</p><p class="story-paragraph" data-source-key="3182:0">喉头滚了滚，河览看到志宇学她，歪了歪脑袋。</p><p class="story-paragraph" data-source-key="3183:0">冷冽和淡漠好似只是她在那一瞬产生的错觉，只是一个刹那，覆着志宇的冷冰冰的气场就迅速褪去，河览看着她将手里的书放下，眨了眨眼，眼里骤然盈满漂亮的笑意。</p><p class="story-paragraph" data-source-key="3184:0">凛冬散尽，春日骤来，猝然让她想起前几个月时在首尔，志宇也会用这样的眼神瞥着她。长得漂亮的人生了一双无辜的眼睛，只是软软地把她看着，就让她的心再也硬不起来分毫。</p><p class="story-paragraph" data-source-key="3185:0">“今天也一个人待在这里么?”河览问。</p><p class="story-paragraph" data-source-key="3186:0">“志勋哥和多绚来看过我，我问了一点问题。”崔志宇对她从来乖巧，有问必答。</p><p class="scene-break" data-source-key="3187:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3188:0">“关于我和你的过去。”</p><p class="story-paragraph" data-source-key="3189:0">河览的呼吸骤然滞住，未曾想她竭力逃避的话题会被面前的人用这么轻淡的语气提起。</p><p class="story-paragraph" data-source-key="3190:0">可是十七岁与二十岁的性格真的天差地别，二十岁的崔志宇困于心绪与自我厌恶，许多事情只觉得难堪难看，远不及少年时期的自己。失去三年的记忆，许多事情被多绚提起来都不像是自己会做的。</p><p class="story-paragraph" data-source-key="3191:0">可是就是做了，轻轻重重地摊开一片狼藉，摆在这个只有十七岁的心性的她的面前。</p><p class="story-paragraph" data-source-key="3192:0">原来不是世间所有的相爱都似童话，崔志宇太聪明，从旁观者立场幡然顿悟。</p><p class="story-paragraph" data-source-key="3193:0">那个驻留于过去的崔志宇和柳河览到底是什么关系呢?没有好好的接过吻，没有认真地确认过关系。没有告白，也没有鲜花。</p><p class="story-paragraph" data-source-key="3194:0">算佳偶天成亦或者怨侣一对?</p><p class="story-paragraph" data-source-key="3195:0">说佳偶天成不对，说怨侣也没有咬牙恨下对方的决心。</p><p class="story-paragraph" data-source-key="3196:0">她想不得这些，一想心脏就要开始裂痛，所以不愿意多想。</p><p class="scene-break" data-source-key="3197:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3198:0">“对不起。”</p><p class="story-paragraph" data-source-key="3199:0">河览突然听到崔志宇讲。</p><p class="story-paragraph" data-source-key="3200:0">她猝然怔住，不可置信，看过去。崔志宇只是靠在那里，微微地仰头看着她，珀色的眼坦然又明亮，在河览骇然的情绪里又真诚地讲出来：“是我把你欺负的很惨。”</p><p class="story-paragraph" data-source-key="3201:0">骗你许多，瞒你许多，不小心还把你期许的那个人弄丢掉，大抵你会怨我，你也可以怨我。只是初见太难堪，始于见色起意，还没有来得及收尾，二十岁的崔志宇就仓皇逃走，留了一地碎掉的回忆给她，还有一个摇摇欲坠的柳河览。</p><p class="story-paragraph" data-source-key="3202:0">——不要放走她。</p><p class="story-paragraph" data-source-key="3203:0">留存于意识里的声音死死叫嚣，环绕耳边，经久不息。叫得厉害，就连脑子也开始钝钝地痛。崔志宇甩了甩头，眼底噙着一层柔软又漂亮的笑意，还是望着柳河览。</p><p class="story-paragraph" data-source-key="3204:0">她声音轻轻地的，说出来的话又冷又薄，分外残忍：“姐姐如果想要离开——”</p><p class="story-paragraph" data-source-key="3205:0">话没有讲完，嘴巴却被河览颤抖的手掌捂住。</p><p class="story-paragraph" data-source-key="3206:0">“你不要这么讲。”</p><p class="story-paragraph" data-source-key="3207:0">漂亮的眼睛蒙上薄薄的水雾，夕光映衬下格外漂亮。</p><p class="story-paragraph" data-source-key="3208:0">志宇记得多绚讲自己是因为这双眼睛才义无反顾到河览身边的，她眨眨眼睛，说不出话，心脏泛起来的阵痛密密麻麻，万根针在扎。</p><p class="story-paragraph" data-source-key="3209:0">好似明白为何自己如此不顾一切，原来是因为这双眼睛。</p><p class="story-paragraph emphasis" data-source-key="3210:0">——在她昏昏沉沉的梦境里，无数次这样注视着自己的眼睛。</p><p class="story-paragraph" data-source-key="3211:0">柳河览的神经绷的太紧，轻轻挑动就要落下眼泪，只在遇到崔志宇之后泪腺就发达起来来。嗓子钝钝的疼，咽喉仿佛被砂纸重重揉过，被情绪推搡，被思绪揉捻，被崔志宇干净的目光摧折，以至于她声音也在发抖发哑，以至于她再也讲不出来半句话。</p><p class="story-paragraph" data-source-key="3212:0">如果连你……如果连你要将剩下的话讲出来，我就找不到留下来的理由了。</p><p class="story-paragraph" data-source-key="3213:0">“如果想要离开的话我是不会阻拦的，离开是姐姐的自由。”</p><p class="story-paragraph" data-source-key="3214:0">出乎她的意料的是，崔志宇的声音很平静。任由她捂住嘴巴，含含糊糊地讲出这句话。</p><p class="story-paragraph" data-source-key="3215:0">好似断头台上一把铡刀重重落下，提心吊胆许久终于迎来故事的ending。</p><p class="story-paragraph" data-source-key="3216:0">柳河览站都站不稳，说不出话，只是捂住崔志宇的嘴巴，眼泪掉的徒劳，已经收不住了。</p><p class="story-paragraph" data-source-key="3217:0">而崔志宇只是任由她的动作，嘴巴被捂住，眼睛蕴着沉沉的情绪，一瞬不瞬地盯着她看。</p><p class="story-paragraph" data-source-key="3218:0">是十七岁的崔志宇坦荡明亮，愿意放河览一条生路，天高海阔，永不相见。</p><p class="story-paragraph" data-source-key="3219:0">“我没有把话说完啊。”</p><p class="story-paragraph" data-source-key="3220:0">最终是二十岁的意识冲破樊笼，连同偏执情绪一起，铺天盖地吞没她的理智和教养。</p><p class="story-paragraph" data-source-key="3221:0">是她固执，是她偏执，是她顽劣，分明最想柳河览自由，却还想要同对方不死不休纠缠一生。</p><p class="story-paragraph" data-source-key="3222:0">真心和狠话都是不能含糊的，所以崔志宇轻轻地将柳河览的手拿下来了。</p><p class="story-paragraph" data-source-key="3223:0">松松地攥住对方的手腕，抱着如果她有抽离的念头就会毫不犹豫地握紧的决心。</p><p class="story-paragraph" data-source-key="3224:0">“离开是姐姐的自由，但是姐姐离开的话，我一定会找到姐姐，然后再也不放过你。”</p><p class="story-paragraph" data-source-key="3225:0">“这是崔志宇的选择。”</p><p class="story-paragraph" data-source-key="3226:0">确切说，大抵是十七岁的骄傲性格同二十岁的偏执本能达成一致，构成万全中的完全。</p><p class="story-paragraph" data-source-key="3227:0">逃掉哪里，追到哪里。</p><p class="story-paragraph" data-source-key="3228:0">全然泾渭分明，各凭本事。</p><p class="story-paragraph" data-source-key="3229:0">她的声音很轻，说话的语气也很轻，一双眼固执又深切地盯着柳河览看，眼里只有她，这辈子也只会有她。在这样的注视里，河览是说不了半分话。她说不出来，心底却很仓皇，轻轻地，无声问。</p><p class="story-paragraph" data-source-key="3230:0">那你呢?你要怎么办。</p><p class="story-paragraph" data-source-key="3231:0">她见过崔志宇真正的十七岁的照片，立在雪地上朝着镜头笑，漂亮又明媚。应是最飞扬与意气风发的年龄。其实按照崔志宇正常的人生来讲，没有遇到柳河览大概真的会少很多的不顺畅和痛苦。</p><p class="story-paragraph" data-source-key="3232:0">现今保着十七岁的意识醒过来，好似所拥有的都离她远去，除却一副伤痕累累的躯体和大片空白的记忆，她还剩什么…。</p><p class="story-paragraph" data-source-key="3233:0">你要怎么办呢………河览指尖发颤，无声又难过的想着。</p><p class="story-paragraph" data-source-key="3234:0">难道不记得了，就要被我倚仗着你的这点残存的、关于我的本能绑架一生吗?</p><p class="story-paragraph" data-source-key="3235:0">恶劣的生长环境却没有养成自私自利的习惯，归根结底是柳河览善良太过，不舍得绑死崔志宇，不忍心她耽误一生。</p><p class="story-paragraph" data-source-key="3236:0">想到难过处，河览连手腕都忍不住地颤，被崔志宇轻轻攥住，手指一点点收紧，是少年心态，少年心绪，话要认真又直白地讲出口，真心在胸腔里跳动着，明却又震耳欲聋，一下又一下，撼动的从来都是她自己。</p><p class="story-paragraph" data-source-key="3237:0">“我可能不如以前。”</p><p class="story-paragraph" data-source-key="3238:0">“但是现在医生讲了，我的复健情况很好，一切只会更好。”</p><p class="story-paragraph" data-source-key="3239:0">志宇的声音有一点低，只是很真诚地望向河览，轻轻地问：“可以稍微的，等我一下吗?”</p><p class="story-paragraph" data-source-key="3240:0">等我身体好一点，变得好一点。</p><p class="story-paragraph" data-source-key="3241:0">她说不完剩下的话，记忆有断片现象，常常忘记自己下一句话要讲什么。想的发急，手不自觉就要攥河览的手腕了，攥住了，握在手里边，眉心蹙的很紧。绞尽脑汁想自己到底要讲什么。</p><p class="story-paragraph" data-source-key="3242:0">偏偏是这种时候最无力。</p><p class="story-paragraph" data-source-key="3243:0">“对不起。”</p><p class="story-paragraph" data-source-key="3244:0">她只能仓皇地道歉。</p><p class="story-paragraph" data-source-key="3245:0">坚固到密不透风的壳好似也会因为坦诚的心绪露出一瞬裂缝，透过裂缝是被勉力维持着不要彻底坍塌的狼狈的内核。</p><p class="story-paragraph" data-source-key="3246:0">忘记自己到底要讲什么，变得更好然后呢?想不起来。</p><p class="story-paragraph" data-source-key="3247:0">在脑海里满打满算着膨胀着的关于未来的一星点雀跃又因为突如其来的断片被彻底击垮，真的不放过河览的话河览会痛苦么?医生说的明朗的未来好似在当下见不到。讲的话可以撤回么?</p><p class="story-paragraph" data-source-key="3248:0">暴乱的情绪突如其来，不知道该怎么讲的时候又想逃跑——只是在这个刹那被俯下身的柳河览重重地抱住了。</p><p class="story-paragraph" data-source-key="3249:0">雪绒花的气息轻淡，混着白茶香水的气息扑入她的鼻尖，一半掺杂一半，柳河览的信息素，她惯用的香水。</p><p class="story-paragraph" data-source-key="3250:0">“没关系。”</p><p class="story-paragraph" data-source-key="3251:0">柳河览的声音很闷，心脏快要被那只看不见的手捏碎。在她是记忆里，崔志宇还是那个在鸽子笼里打着视频会议神定气闲地分析数据的小狗，前途光明万丈，未来坦荡可期。当初连同现在骤然惊惶无措的样子重在一起叠做一个人，好似一具躯体里骤然生出两个不同的灵魂。</p><p class="story-paragraph" data-source-key="3252:0">可这两个灵魂偏偏同根同源，师出同门。</p><p class="story-paragraph" data-source-key="3253:0">失忆和人格分裂这种病症是两项病理，柳河览没有办法去琢磨扼杀当下的这个崔志宇换曾经的回来。</p><p class="story-paragraph" data-source-key="3254:0">她没有办法，如果能够做也不忍心。</p><p class="story-paragraph" data-source-key="3255:0">世界上只有一个崔志宇，无论来自过去亦或者站在当下，都只是活在她眼前的这个崔志宇。</p><p class="story-paragraph" data-source-key="3256:0">她只觉得好疼，说不出来的痛苦浸着她绷紧的神经，只能徒劳地收紧手臂把志宇死死地抱住：“没有关系的，没有关系的。”</p><p class="story-paragraph" data-source-key="3257:0">被矫正绷带固定住的左手不方便活动，志宇只好用右手将河览环在怀里轻轻拍背。她垂着眸子，只觉得怀中人太脆弱，瑟瑟地缩成一团。</p><p class="story-paragraph" data-source-key="3258:0">疗养院供的病号服太薄，很快就被温热眼泪浸透。</p><p class="story-paragraph" data-source-key="3259:0">——河览的痛苦从来都是没有声音的。</p><p class="story-paragraph" data-source-key="3260:0">柳河览很像那种长得绒绒的小兔子，有着很漂亮的外表，耐痛性很高，有着世界上最坚强的内心。可是人类哪是兔子，大抵一路走过来难过的事情遇见的太多，所以习以为常麻木，习以为常收敛声息，以至于现在掉眼泪也要咬紧牙关，静默却震耳欲聋。</p><p class="story-paragraph emphasis" data-source-key="3261:0">——忘记说什么也没有关系，忘记我也没有关系。</p><p class="story-paragraph" data-source-key="3262:0">就像年前在海边想的那样，只要志宇一直开心，平安顺遂。记得她也好，不记得她也罢。</p><p class="story-paragraph" data-source-key="3263:0">没有关系，没有关系。</p><p class="story-paragraph" data-source-key="3264:0">她的困惑和无助不知道同谁讲，梁生被多绚撬来工作室的时候和她简单聊过两句。混黑混白的港老阅历丰富，大起大落大悲经历过一遭，只感慨真系阴公。</p><p class="story-paragraph" data-source-key="3265:0">“阴公?”河览不解，困惑学他发音。</p><p class="story-paragraph" data-source-key="3266:0">“是讲小孩你很惨。”</p><p class="story-paragraph" data-source-key="3267:0">梁生手里还拎着给河览买的奶茶，一把年龄的人看着河览目光哀哀：“漂亮小孩怎么会有这么惨的时日。”</p><p class="story-paragraph" data-source-key="3268:0">老天不长眼。</p><p class="story-paragraph" data-source-key="3269:0">在那种扑街公司的时候穷到喝不了奶茶，现今有条件了奶茶里还要走糖，好不容易谈个对象结果现在人在釜山不人不鬼。早晓得就劝小孩断情绝欲搞事业，哪有现在衰样。</p><p class="story-paragraph" data-source-key="3270:0">金多绚从他背后路过，阴阳怪气也学他语气：“阴公啊，喝奶茶喝成高血脂。”</p><p class="story-paragraph" data-source-key="3271:0">可是对河览来讲，喝不上奶茶没有关系。小时候在江原道的时候最大的快乐是坐着化肥袋子顺着融化的雪水从高坡中滑下，长大一点到首尔，在九龙村只有隔板的单间经历分化的时候也想不到这些。</p><p class="story-paragraph" data-source-key="3272:0">当一个人的人生只剩下贫瘠和奔波的时候，是没有资格觉得惨和难过的。</p><p class="story-paragraph" data-source-key="3273:0">无论是梁生递过来的奶茶也好，还是水管里的自来水也罢，她都是这样过来的。</p><p class="story-paragraph" data-source-key="3274:0">曾经以为最害怕的时候是十七岁，随着分化踵临的是更恐怖的情潮热。首尔的冬夜最冷，她是在这种熬死人的过程里一分一秒数着过一整晚的。九龙村的房子太简陋，风把窗子吹的呼呼作响，所幸被当时一起打工的姐姐赛过一包隔离贴阻绝气息散开，只记得那天早上她天不亮就起来去最近的便利药店买抑制剂，腿是软的，心脏咚咚狂跳，好怕路上就窜出不怀好意的Alpha和beta。</p><p class="story-paragraph" data-source-key="3275:0">——那一年是首尔的omega受侵害率最高的一年。</p><p class="story-paragraph" data-source-key="3276:0">偏偏是那一年，身上所有的钱凑起来，也只够买一支最廉价的。</p><p class="story-paragraph" data-source-key="3277:0">这类药剂都太贵，那时候降价政策没有出来，许多omega的发情期都靠咬着牙硬熬。可是这种环境里她是没有勇气赌上片刻的。在药店里结账，抖着手把药剂推入体内的之后，情潮热随着肢体上的剧痛褪去，她惊魂未定，后知后觉心脏狂跳，一转头在旁侧镜子里看到自己的惨白脸色。</p><p class="story-paragraph" data-source-key="3278:0">就算在那时候也没有掉眼泪。</p><p class="story-paragraph" data-source-key="3279:0">打电话给家里讲下个月不会把打工赚到的钱打回来了，因为分化成了omega，需要钱买抑制贴，需要钱去租稍微安全一点的房子。</p><p class="story-paragraph" data-source-key="3280:0">分化成omega再回到江原道是待价而沽的商品，河览也在心里轻轻地想也许我也不会回来了。</p><p class="story-paragraph" data-source-key="3281:0">就算是那种时日，回想起来也不及此刻痛啊。</p><p class="story-paragraph" data-source-key="3282:0">她不怕再回到那种提心吊胆的时日，她只是怕回去之后再也见不到崔志宇。</p><p class="story-paragraph" data-source-key="3283:0">脊背被志宇的手掌轻轻地宽抚着，飘浮十几年的心脏沉沉坠下，好似才找到片刻归宿。</p><p class="story-paragraph" data-source-key="3284:0">只是她还是没有办法发出声音，背脊颤抖，眼泪汹涌，被对方一下又一下，缓慢安抚。</p><p class="story-paragraph" data-source-key="3285:0">天昏昏暗，海面日头终于西沉。</p><p class="story-paragraph" data-source-key="3286:0">她不记得自己在志宇的怀里伏了多久，哭了多久，起身的时候听到对方轻轻嘶气，大概把肩膀也压的发麻。</p><p class="story-paragraph" data-source-key="3287:0">“…笨蛋。”</p><p class="story-paragraph" data-source-key="3288:0">听到志宇这样讲了。</p><p class="story-paragraph" data-source-key="3289:0">搭在背上的手还是有下没下地轻轻拍打着她，就像很小很小的时候妈妈哄着自己入睡的时刻。</p><p class="story-paragraph" data-source-key="3290:0">“如果哭的话要哭出来声音呀。”她听见崔志宇说。</p><p class="story-paragraph" data-source-key="3291:0">好似因为失去记忆，许多东西变了，但是骨子里的许多本性依旧伫留，二十岁的崔志宇抽身走的不彻底，留下太多发自本能。</p><p class="story-paragraph" data-source-key="3292:0">“好难为情。”河览的声音闷闷的，“小时候哭太惨会被妈妈骂。”</p><p class="story-paragraph" data-source-key="3293:0">她不确定自己到底有没有被妈妈爱过，离家太久，妈妈的印象也在印象里模糊了。好像是夏天里会叫着她小狗给她讲故事的妈妈，田垄吹过的风，拍打着脊背的手，印象里为数不多的温柔地叫着她小狗的时候，许多许多的为数不多，构成她幻想里的许多许多。</p><p class="story-paragraph" data-source-key="3294:0">崔志宇的手一顿，眸子垂下去，不知道在想什么。</p><p class="story-paragraph" data-source-key="3295:0">“你可以哭。”</p><p class="story-paragraph" data-source-key="3296:0">沉默了很久，她轻轻地讲，眼睛眨了眨，有一点笨拙。</p><p class="story-paragraph" data-source-key="3297:0">“在我这里可以哭。”</p><p class="scene-break" data-source-key="3298:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3299:0">“哭很大声也没有关系。”</p><p class="scene-break" data-source-key="3300:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3301:0">“我不会离开你。”</p><p class="story-paragraph" data-source-key="3302:0">志宇抿抿嘴，慢吞吞地讲这句话。这句话大抵是从前的志宇不敢讲出来的，那时同河览之前瞒千瞒万，在一起的每一秒里，盘算的都是分开之后的每一刻。河览无从得知那时候的志宇到底怎么样，只是此时感觉太微妙，好似少年时期的爱人横跨千山万水，刷地一下将自己尽数剖陈。</p><p class="story-paragraph" data-source-key="3303:0">“……我永远也不会离开你。”</p><p class="story-paragraph" data-source-key="3304:0">她庄重又缓慢地又重复一遍，发自本能，出自真心。</p><p class="story-paragraph" data-source-key="3305:0">一片空白的记忆难以捕捉关于曾经的剪影，只是遵循内心的声嘶力竭，好似没有办法，挣不过，时时作祟的心绪太诡谲，疯狂让她不要错过。</p><p class="story-paragraph" data-source-key="3306:0">她没办法，不舍得，听天由命，稀里糊涂交出自己。</p><p class="story-paragraph" data-source-key="3307:0">轻轻声讲，志宇只觉得肩膀被河览的脑袋轻轻蹭过，压着哭了许久，河览的声音也很闷，崔志宇看不清她的表情。</p><p class="story-paragraph" data-source-key="3308:0">“不要骗我。”</p><p class="story-paragraph" data-source-key="3309:0">她声音很轻，最讨厌欺骗，偏偏是崔志宇。心脏已经被这个人折磨到了很脆弱的阶段，吃不住任何因为失去或者欺骗带来的痛苦了。</p><p class="story-paragraph" data-source-key="3310:0">咬紧牙关，还是下意识忍住哭声，河览声音很低，喃喃又讲一遍。</p><p class="story-paragraph" data-source-key="3311:0">“不准骗我。”</p><p class="story-paragraph" data-source-key="3313:0">等到志勋携着宇宙托她带给志宇的礼物再到釜山时已近十月末，临了出院的日子。九月份志宇的生日也在疗养院过，只是那时他公务在身，抽不出人，只记得妈妈从釜山回来之后心情很好。</p><p class="story-paragraph" data-source-key="3314:0">应该是复健的不错。</p><p class="story-paragraph" data-source-key="3315:0">去病房之前他先去问医生，得到肯定答案之后心里松一口气。</p><p class="story-paragraph" data-source-key="3316:0">抱着痊愈和恢复到曾经程度的崔志宇真的很可怕。</p><p class="story-paragraph" data-source-key="3317:0">大抵能从西伯利亚的那个特训班出来的人都算狠人，冰天雪地里训出一副精良体魄，痊愈速度相较常人已是很快。</p><p class="story-paragraph" data-source-key="3318:0">柳河览功不可没，片场疗养院两头跑。</p><p class="story-paragraph" data-source-key="3319:0">重塑病患痊愈信心算是不小难题，但是好似柳河览什么都不用做，站在那里，某个人大抵就有使不完的牛劲。</p><p class="story-paragraph" data-source-key="3320:0">记忆断片的现象基本没有了，创口拆线，接踵就是左手上的矫正绷带拆除。</p><p class="story-paragraph" data-source-key="3321:0">神经受到损伤，恢复进度大抵还是要慢很多，大抵这件事要河览陪着慢慢来。</p><p class="story-paragraph" data-source-key="3322:0">想着想着，崔志勋惊讶的发现，就连他好像也把柳河览归入崔志宇的未来了。</p><p class="story-paragraph" data-source-key="3323:0">这不合理。</p><p class="story-paragraph" data-source-key="3324:0">但是转念一想，时间过真快，盛夏时他站在病房口翻志宇的白眼，现今拎着宇宙交来的礼物站在门口，进一步尴尬退一步也尴尬。</p><p class="story-paragraph" data-source-key="3325:0">——两个不要脸的，光天化日的调什么情</p><p class="story-paragraph" data-source-key="3326:0">不知两口子这几个月到底怎么交流，倒是河览在宇宙面前开朗许多，妈妈也开始絮絮叨叨地念着开始准备柿子饼了，就连爸爸也开始过问到底要在哪里给志宇落新房子才好。</p><p class="story-paragraph" data-source-key="3327:0">好似所有人都背着他收到了好事将近的讯息，志勋心里堵死，想给郑伊安发消息吐槽。</p><p class="story-paragraph" data-source-key="3328:0">志宇体内的那枚定位芯片的权限移交上个月才完成，变笨的妹妹好像真的不知道这种东西意味着什么。</p><p class="story-paragraph" data-source-key="3329:0">寄于体内的芯片能够实时监测许多体征，心率视觉甚至激素分泌，监视权限如果尽数交付给某个人宛若将自己的软处尽数奉上，就要百分之百地确认这个人不会背叛自己。</p><p class="story-paragraph" data-source-key="3330:0">就算失去记忆也百分之百的恋爱脑，有一点奇葩。</p><p class="story-paragraph" data-source-key="3331:0">志勋在心里冷冷地吐槽。</p><p class="story-paragraph" data-source-key="3332:0">把权限从警视厅的系统里弄出来特别麻烦，花钱耗力，用于监视的机器也是从头定制，一整个不过手掌大小，摁开屏幕就能看到一只灰色小狗搁在里边蹦蹦跳跳。</p><p class="story-paragraph" data-source-key="3333:0">大概此刻心情极好，志勋垂着眸子看那只蹦蹦跳跳的小狗，再看两眼只觉得这东西快要冒粉色泡泡。</p><p class="story-paragraph" data-source-key="3334:0">他抬眼看到笑眯眯地把自己的下巴支到河览摊开的手掌上的志宇。</p><p class="story-paragraph" data-source-key="3335:0">养回来了一点肉，原本消瘦的脸颊逐渐红润，好似漂亮回十七岁，飞扬又跋扈。</p><p class="story-paragraph" data-source-key="3336:0">持靓行凶这种事情放到以前的崔志宇身上大抵这位不屑，但是丢掉记忆好似就丢掉了未来药剂学领域大拿的包袱，恰是十七岁的少年心性正好，意气风发又坦率干净，下巴被河览的手掌托着不够，一双眼湿漉漉眼巴巴地盯着河览，好似下秒头顶就要冒出柔软的狗狗耳朵。</p><p class="story-paragraph" data-source-key="3337:0">忘记一切都没忘给柳河览做狗。</p><p class="story-paragraph" data-source-key="3338:0">志勋在心里冷冷嗤声，眼睛都快看瞎掉，放下礼物扭头赶紧走掉。</p><p class="story-paragraph" data-source-key="3339:0">这两口子是不要脸的，浓情蜜意起来是顾不得外面还站着一只单身狗。</p><p class="story-paragraph" data-source-key="3340:0">宇宙和多绚站在楼下等他，见他灰溜溜出来，两个人四只眼睛全是明晃晃嘲笑。</p><p class="story-paragraph" data-source-key="3341:0">“所以到底是什么东西啊。”</p><p class="story-paragraph" data-source-key="3342:0">志勋忍不住问，宇宙托他带上去时神神秘秘的，不知到底在搞什么鬼。</p><p class="story-paragraph" data-source-key="3343:0">“监测设备～”宇宙眨眨眼，“可能没有你们警视厅植的那套芯片有用，但是应该也算首尔排在最前列的手环了。”</p><p class="story-paragraph" data-source-key="3344:0">四四方方一块表，拷在手腕上，心情好坏，天晴天阴，一看便知。</p><p class="story-paragraph" data-source-key="3345:0">“我靠。”崔志勋忍不住爆粗，“你就这么惯崔志宇。”</p><p class="story-paragraph" data-source-key="3346:0">“不是给志宇的。”金宇宙讲，“河览托我弄的。”</p><p class="story-paragraph" data-source-key="3347:0">有一个做这方面的公司请到金宇宙剧里的男主角代言，几人吐槽这种变态东西时恰好被河览听到，于是就请宇宙也帮她弄一块儿。</p><p class="story-paragraph" data-source-key="3348:0">崔志勋白眼快翻上天，一转头看见金多绚冲他举起手腕，四四方方一块表覆在手腕上，多绚语气也幽幽的：“效果确实很好。”</p><p class="story-paragraph" data-source-key="3349:0">至少有没有乖乖看新闻读报学习这种事情是瞒不住宇宙姐姐了。</p><p class="story-paragraph" data-source-key="3350:0">志勋这下彻底无语，心里想这年头真是够奇葩，怎么都到哪里都有人争相给对面做狗。</p><p class="story-paragraph" data-source-key="3351:0">只不过他还有问题要问：“所以志宇出院了之后是回首尔么?”</p><p class="story-paragraph" data-source-key="3352:0">还是留在釜山。</p><p class="story-paragraph" data-source-key="3353:0">总不可能跟着柳河览跑回江原道去。</p><p class="story-paragraph" data-source-key="3354:0">金宇宙似笑非笑，轻飘飘瞥他一眼：“你猜。”</p><p class="story-paragraph" data-source-key="3355:0">崔志勋：……</p><p class="story-paragraph" data-source-key="3356:0">搞什么，至少婚姻申告在首尔登记吧!!!崔志宇不会最基本的脑子都丢了吧!!</p><p class="story-paragraph" data-source-key="3357:0">不会真的跑去江原道结婚吧?</p><p class="story-paragraph" data-source-key="3358:0">不至于吧?</p><p class="story-paragraph" data-source-key="3360:0">托金宇宙购在江原道的住宅落地的时候，河览陪志宇办了出院。</p><p class="story-paragraph" data-source-key="3361:0">时间好似真的过很快，十一月中，天气预报釜山近期好似会落雪。</p><p class="story-paragraph" data-source-key="3362:0">志宇正常的跑跳也没问题了。</p><p class="story-paragraph" data-source-key="3363:0">头发长长了，脸颊上攒了些肉，没有刚醒过来那阵子憔悴了。</p><p class="story-paragraph" data-source-key="3364:0">金女士百忙之中日日抽空同家崽打视频，见到志宇模样就松一口气。</p><p class="story-paragraph" data-source-key="3365:0">河览坐在旁侧，也乖乖巧巧的跟金女士问好。</p><p class="story-paragraph" data-source-key="3366:0">“柿子饼快要好了。”</p><p class="story-paragraph" data-source-key="3367:0">金女士在笑着在那头讲，她顿了顿，目光从河览的脸上移到志宇的脸上，好似有许多话想说。</p><p class="story-paragraph" data-source-key="3368:0">但是最终讲出来也只有轻轻一句：“如果被志宇欺负了就回首尔找妈妈，妈妈会站在你这边的。”</p><p class="story-paragraph" data-source-key="3369:0">两个人并排坐在疗养院的长椅上，谁也不说话，手腕被志宇轻轻地攥在手里，心脏跳动，脉搏跳动。两个人的皮相都是顶级，漂亮到路人也忍不住驻足侧目，有小朋友路过也发自内心觉得她们般配，蹦蹦跳跳跑来讲你们一定要一直在一起噢。</p><p class="story-paragraph" data-source-key="3370:0">小孩儿童言无忌，一句话把柳河览搞的耳根通红，有些局促地咳了两声，倒是听到崔志宇很开心地笑。这个人有随身带糖果的习惯，拿出来就往小朋友手里塞，咧嘴笑起来的样子傻透了，河览等小朋友走了才轻声问：“很开心么?”</p><p class="story-paragraph" data-source-key="3371:0">“很开心呀。”志宇回过头同她相视，轻轻声讲，“我本来就是这么打算的。”</p><p class="story-paragraph" data-source-key="3372:0">下雪的时候给你堆雪人，春天和夏天给你写长长的信，说很多次我爱你，说到大家一起变成迟暮老人，去哪里都好，重要的是一直一直在一起。</p><p class="story-paragraph" data-source-key="3373:0">“我听多绚说，姐姐好像是看我的那种片子才想起来接近我的。”</p><p class="story-paragraph" data-source-key="3374:0">河览轻轻地讲，她这么说，有一点欺负崔志宇想不起来，只是这种荒唐的事情太让她憋屈，金多绚屈打成招，顶着一张藏狐脸巴巴帮志宇讲歪理：“能见色起意的都是真爱!”</p><p class="story-paragraph" data-source-key="3375:0">“我记不住了。”</p><p class="story-paragraph" data-source-key="3376:0">志宇很实诚，轻声讲。</p><p class="story-paragraph" data-source-key="3377:0">顿了顿，她又笑：“但是总觉得我和河览是命中注定的事情。”</p><p class="story-paragraph" data-source-key="3378:0">命中注定?柳河览偏了偏脑袋，有一点挪揄：“所以真的是看片看出来的命中注定吗?”</p><p class="story-paragraph" data-source-key="3379:0">“不是呀。”</p><p class="story-paragraph" data-source-key="3380:0">“无论在什么样的情形下见到河览，我都会不由自主地想要靠近你。”</p><p class="story-paragraph" data-source-key="3381:0">崔志宇轻轻地解释：“这件事是无解的。”</p><p class="story-paragraph" data-source-key="3382:0">我会爱上你，发自本能，发自本心，一而再，再而三。</p><p class="story-paragraph" data-source-key="3383:0">这是经过许多思量，反复校验，最终得出的绝对结论。</p><p class="story-paragraph" data-source-key="3384:0">不是柳河览不行，除开柳河览，大抵换做任何一个人来，也不行。</p><p class="story-paragraph" data-source-key="3385:0">答案暂时让河览满意，她选择放崔志宇一码，转而又讲以后：“我在雪岳山脚下买了房子。”</p><p class="story-paragraph" data-source-key="3386:0">崔志宇轻轻嗯了一声，黏巴巴地问：“河览想把我关在雪岳山脚下么?”</p><p class="story-paragraph" data-source-key="3387:0">河览不理她，自顾自又讲：“刚落地，许多装修还没好，有院子，小啾会喜欢，不知道你会不会喜欢。”</p><p class="story-paragraph" data-source-key="3388:0">她打算在院子里种许多花，搭漂亮的秋千，屋檐下挂风球和风铃，一整个开放式的厨房，听过金主恩讲崔志宇曾经想做甜品师，相关的设备也要一应俱全。</p><p class="story-paragraph" data-source-key="3389:0">尘埃落定，好似终于舍出半分心绪去斟酌未来，河览垂眸想了又想，一想到江原道那边还需时日，暂时只能委屈志宇住在她购在釜山的公寓里，有些憋闷。</p><p class="story-paragraph" data-source-key="3390:0">但是她很认真地讲：“我现在只能给你这么多，还要暂时住在釜山一段时日，你要委屈一下。”</p><p class="story-paragraph" data-source-key="3391:0">崔志宇乖乖地偏头，很真挚地讲：“已经很多了。”</p><p class="story-paragraph" data-source-key="3392:0">河览轻轻摇头，在心里说，不够。</p><p class="story-paragraph" data-source-key="3393:0">贪心不足是独属于人类的本性，是她太贪，好似只有全部身家尽数托付，连同自己一并奉上，那颗被虚虚悬挂的心脏才会短暂地落到地上，暂时地有些许安全感。</p><p class="story-paragraph" data-source-key="3394:0">“对了，这个。”</p><p class="story-paragraph" data-source-key="3395:0">打断她思绪的是崔志宇突兀递到面前的机器，类似于手机的机型，深灰色机壳，摁开只有屏幕里的小狗蹦蹦跳跳。</p><p class="story-paragraph" data-source-key="3396:0">“之前卧底的时候植入过数字芯片，托哥哥把权限弄出来，做了这个。”</p><p class="story-paragraph" data-source-key="3397:0">崔志宇声音很轻，她慢慢讲话，小狗也随她声音直起身子，隔着屏幕，眨巴眼睛看柳河览。</p><p class="story-paragraph" data-source-key="3398:0">“前不久做梦，梦到你拽我耳朵，叫我很多次小狗，我就在想，大概你真的想养一只小狗。”崔志宇慢吞吞的，慢条斯理地讲，“首尔有崔豆，釜山有小啾，我们有两只小狗。”</p><p class="story-paragraph" data-source-key="3399:0">“但是应该不是河览想要的那种小狗。”</p><p class="story-paragraph" data-source-key="3400:0">柳河览没有讲话，指尖戳着机器屏幕，看到屏幕上的小狗蹦蹦跳跳。灰色的毛茸茸的卡通小狗，琥珀色的眼睛，很像以前在学校时大家养的电子宠物。</p><p class="story-paragraph" data-source-key="3401:0">她听见崔志宇轻声讲：“我愿意。”</p><p class="story-paragraph" data-source-key="3402:0">愿意只做你的小狗，眼里只有你，全世界最爱你。</p><p class="story-paragraph" data-source-key="3403:0">河览没有讲话，手指一下又一下戳小狗。</p><p class="story-paragraph" data-source-key="3404:0">“还是先去把婚姻申告填了吧。”</p><p class="story-paragraph" data-source-key="3405:0">她没有抬头，声音很闷，耳根通红。</p><p class="story-paragraph" data-source-key="3406:0">“总要给小狗一个名分。”</p><p class="scene-break" data-source-key="3407:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="3408:0">“现在就去。”</p><p class="story-paragraph" data-source-key="3409:0">她轻声说。</p><p class="end-mark" data-source-key="3410:0">——真.END—</p></div>
      </article>
