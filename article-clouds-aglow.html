      <article class="chapter" data-chapter="section-07">
        <header class="chapter-header"><span class="chapter-number">07</span><h2>Chapter 07</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="1403:0">多绚没有想到等来的是崔志宇和柳河览交往和同居的消息。她从主恩的嘴巴里听到这个消息的时候几欲抓狂，总有一种自己被恶狠狠地戏弄了的感觉。按照金宇宙的建议辞去了那份灰色职业，老老实实地蹲在新注册的工作室领着工资混吃等死，Carmen也被挖过来了，出色的专业能力在那种公司显得过于埋没人才，宇宙姐姐面试之后收编进组，难得讲一句看样子在那个地方鬼混还不算是没有收获。</p><p class="story-paragraph" data-source-key="1404:0">只是这一点好，不用再做29岁的Stella，穿着休闲装和板鞋出现在河览面前的时候着实把对方吓一跳。没有化妆的金多绚的眉眼里甚至还有少年人未褪干净的雏态。</p><p class="story-paragraph" data-source-key="1405:0">被金宇宙拎到河览的面前的时候缩了缩脖子，没来由有一点心虚。在片场上踩着细高跟游刃有余的Stella和面前的金多绚好似是两个人，但是长相做不得假，声音更是。</p><p class="story-paragraph" data-source-key="1406:0">——严格的法律意义上来算，金多绚甚至只是刚刚跨入了成年人的门槛的，是年龄比柳河览还要小一点的朋友。</p><p class="story-paragraph" data-source-key="1407:0">“真正按照年龄来算的话我该叫你姐姐吧。”</p><p class="story-paragraph" data-source-key="1408:0">这种话说出来的时候她就看到河览把眼睛眯起来了，在镜头面前怯生生的兔子在这个须臾散播出来了一种很微妙的恐怖气场，好似是格外讨厌欺骗的人。她甚至让多绚产生了一种微妙的错觉，下一秒会被巴掌扇到脸上的错觉。</p><p class="story-paragraph" data-source-key="1409:0">吞了吞口水，多绚默默地在心里为志宇点了一根蜡，</p><p class="story-paragraph" data-source-key="1410:0">有着镜头恐惧症的河览却有一张实在美丽的脸，她带着河览去接拍的剧组面试，一向对演员苛刻的金珉周也难得放缓态度，温声询问如果她有下一部的作品的话，河览愿不愿意做她的女主角。</p><p class="story-paragraph" data-source-key="1411:0">在回工作室的路上多绚没有忍住问原因，明明那是很光明的前程。被作为X的宇宙姐姐和大导演金珉周联手往上捧，等待着的河览的就是一个大红大紫的前程。</p><p class="story-paragraph" data-source-key="1412:0">只是作为当事人的河览却表现的恹恹的，只是一页又一页地翻着宇宙递给她的最初的剧本——装作落魄的富二代和灰姑娘的爱情故事。前几年时兴的走向放到现在好似有些过时。剧本是前几年的，打印出来薄薄的一册，河览很聪明，台词记得很快，在围读剧本这种安排到来之前就先已经把自己的角色吃了大半，毕竟不是苦情的男女主，只是女主身旁同样贫穷的朋友而已。</p><p class="story-paragraph" data-source-key="1413:0">角色的经历与她的有一点贴合，所以理解起来就格外的快。金宇宙的笔墨和脑子都很好，走向也不算在套路之中，危墙之下的爱情故事，按照俗套一点的流程是要给HE的，男女主经历这样那样的波折后重归于好，生一堆小孩，小孩们又去经历各自的爱恨情仇。</p><p class="story-paragraph" data-source-key="1414:0">只是这本不一样，男主死于非命，女主远走高飞，一拍两散，生离死别，进而才是泾渭分明。</p><p class="story-paragraph" data-source-key="1415:0">打开了名为爱和谎言的潘多拉的盒子，查悉真相之后又能够轻飘飘的合上。一切经历便似镜花水月，如梦似幻，方又合了本子最开始的那个名字。</p><p class="story-paragraph" data-source-key="1416:0">云蒸霞蔚——只会在悬崖和山顶这种高危地带出现的自然奇观瑰丽而壮阔，远看便似云雾翻滚的壮丽仙境，过于漂亮的呈现总是有着一种致命的吸引力，只是等到一脚踏空的时候才的会幡然醒悟，醒悟的须臾同时也坠入了万劫不复的深渊。</p><p class="story-paragraph" data-source-key="1417:0">“我只是认为这种事有代价的。”</p><p class="story-paragraph" data-source-key="1418:0">很实诚地回答着多绚的问题，好似也是曾经经历过的那种阴影使然，河览放下剧本很轻地回复多绚：“虽然不知道代价是什么，但是我给不起。”</p><p class="story-paragraph" data-source-key="1419:0">这个人迄今为止也认为着自己的人生是贫瘠而静默的荒原，若有色彩，大抵也只是在某一瞬间沾染上眼泪的崔志宇的眼睛。熙熙攘攘，利来利往的事情往往都是拿你有的换你要的，上过一次当就会杜绝所有相关的陷阱，正是因为在首尔一无所有的柳河览，所以心知肚明着对这方面的事情要更加的小心谨慎。</p><p class="story-paragraph" data-source-key="1420:0">——也没见你对崔志宇有什么警惕心思。</p><p class="story-paragraph" data-source-key="1421:0">金多绚在心里嘀咕着，有些无言以对。</p><p class="story-paragraph" data-source-key="1422:0">她只能把这种事情和金主恩吐槽，没有想到对方听到后却露出很惊讶的表情：“你不知道吗？志宇姐姐真的在和她谈恋爱。”</p><p class="story-paragraph" data-source-key="1423:0">金主恩对这种性质的东西具有一种天然的迟钝感，看到金多绚错愕的表情后知后觉崔志宇好像是瞒着很多人做了这种惊天动地的事情。可是她倒是不觉得这有什么。</p><p class="story-paragraph" data-source-key="1424:0">“不过也蛮…让人惊讶的。”金主恩咕咕哝哝的，“志宇姐姐想和她结婚。”</p><p class="story-paragraph" data-source-key="1425:0">告诉金主恩这个打算的崔志宇没事人一样，垂着眼睛细致地观察着镜头下细胞的裂变和死亡，风轻云淡地讲：“首尔的第一场雪落下的时候主恩就可以接到我的请柬了。”</p><p class="story-paragraph" data-source-key="1426:0">不是说说而已，是发自内心，绝对真诚的要去和柳河览办婚姻申告的程度。</p><p class="story-paragraph" data-source-key="1427:0">昏头了，真的昏头了。</p><p class="story-paragraph" data-source-key="1428:0">柳河览的信息素难道是海洛因么？为什么真的就和得了失心疯一样不管不顾啊。</p><p class="story-paragraph" data-source-key="1429:0">“你们的新剧会在釜山开机吧？”金主恩问。</p><p class="story-paragraph" data-source-key="1430:0">倒是难得见到金宇宙这么大操大办，听到几个玩的好的小姐妹讲编剧X铺天盖地的发通稿要拍新剧，在釜山的海边实地拍摄，剧作家在街头遇到的灵感女神也会出演。</p><p class="story-paragraph" data-source-key="1431:0">这明摆着是想要把某个人捧起来的阵仗。</p><p class="story-paragraph" data-source-key="1432:0">毕竟是向来低调又苛刻的X，难得这么铺天盖地地发一次通稿。</p><p class="story-paragraph" data-source-key="1433:0">“信息素真的是海洛因么？”金主恩掰着手指头数了数，“一开始是你觉得她可怜，设局要志宇姐姐想办法捞她，然后是志宇姐姐，连宇宙姐姐也像是生了病似的这么搞。金主恩有些时候说话不过脑子：“现在好像真的我们要叫那位河览姐姐嫂子了呢。”</p><p class="story-paragraph" data-source-key="1434:0">倒是坦诚，让金多绚有些无言以对。</p><p class="story-paragraph" data-source-key="1435:0">她只能无可奈何地接受了崔志宇和柳河览交往的这种现实，多绚低头发消息给金宇宙通风报信。</p><p class="story-paragraph" data-source-key="1436:0">对方很快回复一个偷笑的表情，好像对这种发展了然于胸似的。</p><p class="story-paragraph" data-source-key="1437:0">不过说起来好像崔志宇一直也在回避和金宇宙见面这种事情。</p><p class="story-paragraph" data-source-key="1438:0">“所以去釜山拍摄也不是坏事。至少能分开一段时间，说不定就冷静下来了。”</p><p class="story-paragraph" data-source-key="1439:0">多绚听到主恩这么说。</p><p class="story-paragraph" data-source-key="1440:0">像她这种十七岁就进首尔大的学生不多，同龄人里几乎算得上是天才一样的存在了。高智所带来的早熟感倒是让金主恩显得格外的冷静而稳重，发自内心的希望崔志宇和柳河览能在感情这种事里有好结局，只是好像从目前的种种迹象来看都很无解。</p><p class="story-paragraph" data-source-key="1441:0">——毕竟是连最基本的坦诚也没有办法做到的崔志宇。</p><p class="story-paragraph" data-source-key="1442:0">短暂地分开一段时间，避开了朝夕相处，如果不是真心相爱的人大抵很快就会进入冷淡的周期。说不定在初雪，或者冬天来临之前就有惊无险的分开了。</p><p class="story-paragraph" data-source-key="1443:0">戳破谎言是一件很残忍的事情不是么，出于私心的话，金主恩不愿意崔志宇经历这样的残忍。</p><p class="story-paragraph" data-source-key="1444:0">从小就教导者她要诚实和坦率的崔志宇竟然会装做贫困的样子去接近着那个和她们不在一个阶级的柳河览——是悲剧啊。</p><p class="story-paragraph" data-source-key="1445:0">“说到这里，看到十九岁的金多绚的时候河览姐姐作何感想啊？”</p><p class="story-paragraph" data-source-key="1446:0">她突然就这么问了。还沉浸在崔志宇真的和柳河览有了情感方面的纠缠的诧异里，金多绚完全也没有多余的经历去思考金主恩突然问出这句话的缘由：“我感觉她下一秒就会把巴掌拍在我的脸上了，河览看上去是个很讨厌被欺骗的人，如果发现了被志宇姐姐这样骗是会冒火的。”</p><p class="story-paragraph" data-source-key="1447:0">金主恩噢了一声。</p><p class="story-paragraph" data-source-key="1448:0">这下不用有所期望了，一旦被发现的话，志宇姐姐就死定了。</p><p class="story-paragraph" data-source-key="1449:0">金宇宙的效率很高，拍定了一个本子，从演员的募集到投资也不过短短几个月，一转眼从夏中旬到秋尾，确定好了开机的时间是十二月末，掐指一算好似也是初雪踵临之后的日子了，但是要先过去做准备 ，到大抵十一月初就要过去。</p><p class="story-paragraph" data-source-key="1450:0">所以分别是迫在眉睫的事。</p><p class="story-paragraph" data-source-key="1451:0">河览和志宇讲这些的时候，意料之中地收获了一张苦苦地耷拉下去的脸蛋。确定了关系之后志宇就很黏她，一刻都离不开的程度。</p><p class="story-paragraph" data-source-key="1452:0">她蹙着八字眉的样子很可爱，委屈巴巴的样子也很可爱。如果不是那项关于药物研发的实验已经到了关键的阶段，崔志宇恨不得直接打包行李跟在河览后面追到釜山去。</p><p class="story-paragraph" data-source-key="1453:0">这种样子实在是太可爱了。</p><p class="story-paragraph" data-source-key="1454:0">河览没有忍住，凑前去亲了亲对方的脸颊。</p><p class="story-paragraph" data-source-key="1455:0">现在忙的要死，被宇宙姐姐临时加了很多课，从演技的打磨到形体和形象的管理应有尽有，每天都是累到灵魂出走的程度。换一个真心喜欢表演的人来可能欣喜若狂，但是河览没有这种感觉。</p><p class="story-paragraph" data-source-key="1456:0">她没有作为大红大紫的演员的梦想，也不是发自内心地热爱着演艺这种事情。只觉得面临的东西让她很累，打不起精神。硬着头皮去做好某件事的状态太明显了，很快就被金宇宙看出来，被温和地约谈了。</p><p class="story-paragraph" data-source-key="1457:0">出乎河览的意料，并没有斥责或者是强硬的要求，金宇宙对她很宽容，只是询问着为什么要去硬着头皮做。</p><p class="story-paragraph" data-source-key="1458:0">为什么呢？</p><p class="story-paragraph" data-source-key="1459:0">河览在心里轻轻地想。</p><p class="story-paragraph" data-source-key="1460:0">因为足够感激金宇宙出手把她捞出困境、因为片酬很高、因为某一次在橱窗里看到了一条她觉得很适合崔志宇的领带、因为在初雪到来之前想把套住小狗的汽水拉罐环换成一枚小小的钻戒。</p><p class="story-paragraph" data-source-key="1461:0">她想给崔志宇的东西有很多很多。</p><p class="story-paragraph" data-source-key="1462:0">正是因为这个，就算是未知的，不喜欢的前路，她也要闭着眼睛斗胆去走一走。</p><p class="story-paragraph" data-source-key="1463:0">“是好孩子啊。”</p><p class="story-paragraph" data-source-key="1464:0">没有生气，金宇宙笑了起来。她很平和，举手投足之间都是温柔而明朗的风韵，将面前的果汁推到河览身前，金宇宙的声音很轻，&quot;作为今天河览向我坦诚的交代，我也得拿出一点诚意才好啊。”</p><p class="story-paragraph" data-source-key="1465:0">她的目光落在玻璃杯里水面上晃荡开的涟漪上，一字一句，声音很轻：“我的愿望是希望你自由，快乐，富足。如果确实感到辛苦到没有办法继续下去的话，也不用有负担的。”</p><p class="story-paragraph" data-source-key="1466:0">“柳河览小姐在我的工作室里，是完全自由的存在。”</p><p class="story-paragraph" data-source-key="1467:0">说着这种话的金宇宙，语气懒洋洋的，阳光从半开的窗户中透进来，此时此刻，好似就连松松的堆在她的肩膀上的发丝都被镀上了一层温柔而柔软的光泽。</p><p class="story-paragraph" data-source-key="1468:0">柳河览张了张嘴，想说出些话，却发现自己什么都讲不出来了。</p><p class="story-paragraph" data-source-key="1469:0">前公司支付的违约金和这几年断断续续的积蓄加起来恰好够她买下那个小公寓，联系房东提出来要把房子买下来的时候对方也爽朗的答应了。</p><p class="story-paragraph" data-source-key="1470:0">才来首尔的时候用身上所有的钱租下的小房子也如同她想象的那样变成了可以安定的小窝。把房间钥匙拍给崔志宇的时候河览没有来由觉得自己也像韩剧里演的那些养着小姑娘的大叔了，哼哼地讲着：“姐姐不要去那个公司做兼职了。”</p><p class="story-paragraph" data-source-key="1471:0">这种话她终于可以硬气的说起来了。</p><p class="story-paragraph" data-source-key="1472:0">我可以拍正常的电视剧、我可以做赚钱的演员、我可以养你了。</p><p class="story-paragraph" data-source-key="1473:0">她讲这话的时候崔志宇正在照着手机上的教程给阳台上的月季花修枝，垂着眼睛小心翼翼的一点一点梳掉病枝和枯叶。做某件事就很容易全身心地投入的崔志宇好像没有听清楚她在讲什么，迟钝地眨了眨眼睛方才抬头，有些迷茫：“…河览在说什么？”</p><p class="story-paragraph" data-source-key="1474:0">真是的，这个人。</p><p class="story-paragraph" data-source-key="1475:0">河览走过去，让她把手摊开，挂着漂亮钥匙扣的钥匙轻轻地落在崔志宇的掌心里，她放轻声音，郑重又认真：“姐姐可以在首尔大安心的读书了。”</p><p class="story-paragraph" data-source-key="1476:0">崔志宇钝钝地看着她，被塞了钥匙，她下意识收拢手心，掌心被钥匙抵的生疼。</p><p class="story-paragraph" data-source-key="1477:0">总觉得这样的河览是闪闪发光的，志宇没有忍住，噗嗤一声，笑出来。脱离开恋人的滤来看眼睛亮晶晶的河览，说着这种话的时候就像一只毛茸茸的小狗，让人特别怜爱。</p><p class="story-paragraph" data-source-key="1478:0">没有忍住，她屈起手指轻轻地蹭了蹭河览的脸颊，动作有一点笨拙。在这种时候好像无论讲什么话都很多余，只是发自内心的认为着站在自己对面的河览很可爱，所以崔志宇倾身过去，轻轻地啄了啄河览的嘴角。</p><p class="story-paragraph" data-source-key="1479:0">“知道啦。没有接公司给的本子了。”</p><p class="story-paragraph" data-source-key="1480:0">她小声地解释着。</p><p class="story-paragraph" data-source-key="1481:0">实验已经进入了最关键的突破阶段，后续还有很多预料得到的复杂的情况，实在没有精力再去片场上客串沉睡的丈夫了。她敛着眸子，小心翼翼，靠近河览的时候声音很轻：“我听你的话的。”就算是抱着能过一天就过一天的心态，站在面前的，珍贵万分的柳河览，也是过了很多年以后也难以磨灭的记忆——我会一直记得你。</p><p class="story-paragraph" data-source-key="1482:0">崔志宇轻轻地，柔软地，在心里这么想着。</p><p class="story-paragraph" data-source-key="1483:0">最终她还是选择和金宇宙约了见面，两个人都不好甜，地点就约在了清潭洞的一家高级茶室。老板大学搁在中国学宋史，回来就得了中国病，马不停蹄就着家里的铺面开这一家茶室做消遣用。</p><p class="story-paragraph" data-source-key="1484:0">搞情怀的人做这些不计较成本，从设计到装修全依着阔绰两个字来，金丝楠木做茶案海中沉木做桌椅，就连窗棂雕花这些也请专业的匠人用最好的木材雕。乍眼一看确实是除了有钱就是有钱的阵仗</p><p class="story-paragraph" data-source-key="1485:0">只可惜老板懂得多，偏偏审美不行，钱哐哐地砸进去，装修的一眼到底，没什么内涵。</p><p class="story-paragraph" data-source-key="1486:0">被金宇宙嘲笑的时候只能硬着头皮吹大道至简。</p><p class="story-paragraph" data-source-key="1487:0">唯一一点看得出来价钱的是店里那个上了年份的黄铜香炉，年份久，面上锃锃一层亮。炉里袅袅往外冒香烟，很正的鹅梨帐中香。</p><p class="story-paragraph" data-source-key="1488:0">只是店里的茶确实好，来历不凡，一般的茶室确实搞不到——这方才是金宇宙愿意搁在这种地方喝茶的原因。</p><p class="story-paragraph" data-source-key="1489:0">这种不对外的店面需要预约，崔志宇撩开帘子走进去的时候就看见金宇宙懒懒散散地靠在红檀木椅上，面前一盏黑瓷捧住一汪盈盈的碧色，宛如春江倾入深盏之中。“你会赶时间啊。”门帘声响便知有客来，金宇宙没有抬头，声音懒洋洋的，“这家很难约到的。”</p><p class="story-paragraph" data-source-key="1490:0">“我在宇宙姐姐的眼里应该是比一盏茶还要珍贵的存在吧。”</p><p class="story-paragraph" data-source-key="1491:0">崔宇用轻淡的语气讲这句话。她是直接从学校里出来然后到这里的，穿着格子衬衫斜挂着背包，鸭舌帽的帽檐压的很低，幼态的打扮倒似不经事的学生。</p><p class="story-paragraph" data-source-key="1492:0">金宇宙没有崔教授骗小孩喝酒的恶趣味，和崔志宇和金多绚见面一般会体贴地帮她们点好饮料或者甜点。</p><p class="story-paragraph" data-source-key="1493:0">被捏成兔子的茶点盛在被塑成扁叶舟的瓷碟上面，小小的一枚，缀着两点红豆泥做的眼睛。小小巧巧的，看上去楚楚可怜。</p><p class="story-paragraph" data-source-key="1494:0">“多绚喜欢冰一点的，你不喜欢甜，所以给你点了这款。”金宇宙将茶点往志宇的面前推了推。出乎志宇的预料，宇宙姐姐并没有在河览相关的事情上面对她大做文章，只是懒散地点着可能会和她口味的甜点和饮料。</p><p class="story-paragraph" data-source-key="1495:0">服务员们端着盘子沉默地走进来又躬着身子退出去，门帘撩起来的时候撞的风铃响动，叮的一声。两个人以往聚头便是这样，各自坐在一方做着自己的事情，那时候读着大学的金宇宙会因为灵感堵塞苦恼的揪头发，冲刺学考的崔志宇也会因为魔王题型的难度露出要哭不哭的表情。</p><p class="story-paragraph" data-source-key="1496:0">只是现在两个人都在自己的领域里游刃有余，少年时的青涩感褪去，剩下的就只有四目相对的，无尽的沉默。</p><p class="story-paragraph" data-source-key="1497:0">“…谢谢。”崔志宇动动嘴皮子，很小声地讲。</p><p class="story-paragraph" data-source-key="1498:0">“你要谢我的地方多了。”金宇宙嗤笑一声 。</p><p class="story-paragraph" data-source-key="1499:0">其实说来很怪，两个人在物欲这方面的淡薄程度真的有一拼，只是一件事情上认了死理就是没有办法扭转的程度。她太了解这个看着长大的妹妹，见到对方用叉子切下小兔的耳朵送进口里，一点一点，蚕食似的，不慌不忙，吞噬殆尽。</p><p class="story-paragraph" data-source-key="1500:0">冷静，从容。</p><p class="story-paragraph" data-source-key="1501:0">这才有了一点金宇宙所认识的，崔志宇的样子。</p><p class="story-paragraph" data-source-key="1502:0">可是她只是太好奇，崔志宇这么冷静的人会贸然的进到那种公司里去做演员，如果真的遇到了不知死活的人，这种不雅影响甚至会变成别人试图拿捏她一生的把柄。圈子里有过富二代包色情片女演员的传闻，如果她真的想，也不必这么大费周章，只要物质条件和权柄达到了一定的程度，很多东西就是唾手可得的存在。</p><p class="story-paragraph" data-source-key="1503:0">“去哪种地方做爱到底是怎么想的。”</p><p class="story-paragraph" data-source-key="1504:0">问的很直白，只是想要崔志宇一个答案。从金多绚的口中知道这个人只是看了一眼成片就毫不犹豫地向公司投了自己的简历，难道柳河览的信息素真的是海洛因么？</p><p class="story-paragraph" data-source-key="1505:0">“没有想太多。”</p><p class="story-paragraph" data-source-key="1506:0">切割兔子的动作顿了顿，崔志宇垂着头，目光看着那只少了一只耳朵的可怜兔子。糯米做的外皮带着清清的甜味，蔓在舌尖上，就连心脏的跳动也舒缓几分。</p><p class="story-paragraph" data-source-key="1507:0">“太可怜了，不忍心。”</p><p class="story-paragraph" data-source-key="1508:0">“只是可怜？”</p><p class="story-paragraph" data-source-key="1509:0">撑着腮打断志宇的回答，金宇宙好奇心倒是起的浓厚，掐指一算她们相处时间也不过几个月左右，只是因为可怜就产生了对于灵魂方面的触及么？在她的认知里崔志宇并不是这样的人</p><p class="story-paragraph" data-source-key="1510:0">“不是。”</p><p class="story-paragraph" data-source-key="1511:0">崔志宇的眼睛终于抬起来了，浅珀色的漂亮的眼睛在阳光的照射下就像宝石，剔透又明媚。她不是会去事后回味的人。</p><p class="story-paragraph" data-source-key="1512:0">讲这些话的时候，河览的一切确似幻灯片似的一页页从面前翻过。含着泪的眼睛，亦或者趴在阳台上笑着看向她的时候。一幕幕在她的眼前构成血肉充沛的柳河览，到了嘴边，攒着的情绪又似突然泄去了所有的力气。</p><p class="story-paragraph" data-source-key="1513:0">她说不出来所以然。</p><p class="story-paragraph" data-source-key="1514:0">绝对的善良和坚强兴许是招徕怜惜的理由，但是爱是没有理由的。</p><p class="story-paragraph" data-source-key="1515:0">心脏跳动的须臾就能够在多巴胺和荷尔蒙的分泌下轻易地促成这样定义。</p><p class="story-paragraph" data-source-key="1516:0">瞬间的爱不需要理由，长久的爱不用理由。</p><p class="story-paragraph" data-source-key="1517:0">志宇的睫毛颤了颤，如梦初醒似的抬起眼。金宇宙还是懒懒地窝在茶桌对面，向她投以温柔而探究的眼神。</p><p class="story-paragraph" data-source-key="1518:0">她后知后觉的意识到了好似是“爱 ”</p><p class="story-paragraph" data-source-key="1519:0">她动了动嘴，却说不出口。这个字到底有多么难以启齿，意识到的就连手指也轻轻地颤动了起来。可是只是想一想柳河览，心脏也会被那种柔软的情愫轻轻地托着，就像躺在云层里一样。轻飘飘的，不真实的，却是沉沉地，坠坠的，拉着她的心脏和魂魄一起向着河览的方向。</p><p class="story-paragraph" data-source-key="1520:0">但是她说不出口。</p><p class="story-paragraph" data-source-key="1521:0">在耻于言爱的时代里，在第三人的面前坦然一瞬，就好似剖陈了自己全部的真心。</p><p class="story-paragraph" data-source-key="1522:0">金宇宙不急，只是倚在那里，懒洋洋的，没正形。</p><p class="story-paragraph" data-source-key="1523:0">两个人都不说话，气氛就重重地往下面坠。两个人的母亲是有血缘关系的姐妹，到了她们这一代，打小就在一块玩，活的也似亲生姐妹似的亲近。又确实不同于隔壁的金多绚，崔志宇身上更多的还是崔家的影子，清贵，骄傲，整个人都似一块散着寒气，又着实剔透的冰块儿——明明似一眼能望到底的模样，却总让人觉得这个人飘飘茫茫，万里以外。</p><p class="story-paragraph" data-source-key="1524:0">正是因为如此，一个柳河览的出现，才显得如此难得。</p><p class="story-paragraph" data-source-key="1525:0">“说起来实验进行的怎么样了？”她还是轻飘飘地扯开了话题。</p><p class="story-paragraph" data-source-key="1526:0">宇宙不是爱看新闻的人，但是最近也在各面的渠道里陆陆续续地听到了缓和剂这种东西的调价政策即将出台——那是针对omega在洗去Alpha的信息素时所产生的神经痛所研发的高价药剂，原本一直是某个跨境的药企垄断，价格居高不下。现在突兀推出来这一条提议，倒是颇有一种政党之间拉扯较劲，山雨欲来的风味。</p><p class="story-paragraph" data-source-key="1527:0">——偏偏这个政策的推行人是崔家的人，是崔志宇的父亲。</p><p class="story-paragraph" data-source-key="1528:0">宇宙依稀记得崔志宇的研究是这个方向，很早之前就在这个实验项目中了，自然就明白事已至此，崔志宇在这场牵牵扯扯里是脱不了关系。能够有风声流出来，大抵就是那项实验的进展已进出了成果，或者也是最高决策者的某种意向。</p><p class="story-paragraph" data-source-key="1529:0">“前期实验结束了。”崔志宇声音很轻地讲，“现在已经进入下一步了。”</p><p class="story-paragraph" data-source-key="1530:0">“那你要注意安全。”金宇宙突地，这么讲。毕竟身上有一半的血源自于财阀，纵然没有在权色场上汲汲营营，依照着圈内的那些风声，金宇宙大抵也能知道些片片碎碎的东西——被动到那块蛋糕的人急眼了。如果现在是一部电视剧，应已是进了高峰的前期，苦命小鸳鸯们在经历圆满的happy ending之前必然要经历些起伏壮阔，其实某种程度上来说，人的一生也似如此，各有各的辛苦，各过各的波澜。</p><p class="story-paragraph" data-source-key="1531:0">戏如人生，人生如戏，说来说去，不过如此。</p><p class="story-paragraph" data-source-key="1532:0">金宇宙学编导，写剧本，离合悲欢写多了，多有一种冷然的人性挂在身上。不爱多管闲事，所以格外清白。但是如果是崔志宇，作为姨母的女儿，作为自己唯一的，最珍惜的，最爱的妹妹，崔志宇。</p><p class="story-paragraph" data-source-key="1533:0">奇怪又浓烈的预感一直在心脏上空荡荡地回荡着。</p><p class="story-paragraph" data-source-key="1534:0">金宇宙抿了抿嘴，有些迟疑地建议：“河览去釜山拍戏的时候，你搬回汉南洞住吧。”</p><p class="story-paragraph" data-source-key="1536:0">十月底，秋末近冬初，按照往几年的日子，约莫再过二十天，首尔就会落下第一场雪。刮在脸上的风已经带了些许凛冽的意味了。出发去釜山的日子临到头，河览接到的安排也陆陆续续地多了起来。从形体到演技的磨炼并非一蹴而就，细细碎碎的休息时间里被Carmen和多绚带着去看各种各样的话剧和电影。两个人在带人这一方面经验丰富，只是Carmen以前带过崔志宇，零零散散地知道河览和志宇之间有一点事，向公司辞职之后就没有关注崔志宇的去向了，此刻倒是突兀想起来，问了一嘴。</p><p class="story-paragraph" data-source-key="1537:0">“说起来还和志宇有联系么？</p><p class="story-paragraph" data-source-key="1538:0">这种话是没有当着多绚问的，趁着带着河览溜出来买咖啡的当头就这么问了一嘴。</p><p class="story-paragraph" data-source-key="1539:0">也并非是挂念，只是在她带过这么多的兼职里，崔志宇算是个性最鲜明的一位。出众的皮相和顶尖的学历都算是万里挑一的程度，好似对拍片的报酬也不关心，有没有上映也不关心。整个人都是一种又淡又漠然的程度，不会轻易地同任何人交心，也不会让人靠近半点。</p><p class="story-paragraph" data-source-key="1540:0">离职之前依稀听得人事的那位讲河览这次倒是傍了不得了的人，只是这种事好又坏，没有人知道那位想要的到底是什么。</p><p class="story-paragraph" data-source-key="1541:0">——没有人知道河览将会付出的代价到底是什么。</p><p class="story-paragraph" data-source-key="1542:0">拿咖啡的手顿了顿，河览迟迟地，将眼皮子抬起来。</p><p class="story-paragraph" data-source-key="1543:0">Carmen站在那里看她，是以一种极其宁静和柔软的姿态，眉眼之间有些微探寻，但是不多。是纯粹的在担心她。没有恶意，也不是纯粹的善意。</p><p class="story-paragraph" data-source-key="1544:0">兴许人来人往的混久了，现在的她竟然能够琢磨到这一层。</p><p class="story-paragraph" data-source-key="1545:0">她若无其事，收手回去，垂眸喝一口咖啡。</p><p class="story-paragraph" data-source-key="1546:0">不喜欢苦，所以加很多糖，加很多奶。其实也不好喝，齁甜，到现在也吃不来那些所谓的味型。只是咖啡因确实好，一杯下去困意就没了，就有继续往前面走的精神了。</p><p class="story-paragraph" data-source-key="1547:0">没有等到下文，Carmen欲言又止的。</p><p class="story-paragraph" data-source-key="1548:0">她斟酌又斟酌，不知道说还是不说，耳边突然传来了一声哼哼唧唧，她下意识地低头去看，一声惊呼。</p><p class="story-paragraph" data-source-key="1549:0">柳河览听到声音，掀眼皮子，顺着Carmen的视线也看过去。</p><p class="story-paragraph" data-source-key="1550:0">——看到了一只瑟瑟发抖的小狗。</p><p class="story-paragraph" data-source-key="1552:0">从茶室里走出来的时候天已近傍晚，入秋入冬，天边晚霞少许多。灰蒙蒙的街道和天色都寡淡 ，金宇宙一路将她送巷口。安排的车与司机停在角落，她拉开门，躬身坐进去。</p><p class="story-paragraph" data-source-key="1553:0">手机嗡嗡震动，她看也不看，挂断，再震动，再挂断。</p><p class="story-paragraph" data-source-key="1554:0">司机是金家的，从小看着她与金宇宙长大，算半个长辈，后视镜里看到崔志宇垂着眼玩手机，料到她心情不好，也不多言。</p><p class="story-paragraph" data-source-key="1555:0">手机又震起来，颇有一种她不接就不罢休的阵仗。</p><p class="story-paragraph" data-source-key="1556:0">她捏了捏眉心，还是接了起来。</p><p class="story-paragraph" data-source-key="1557:0">郑伊安的声音在电话那头刺啦啦地炸开，大呼小叫的：“你怎么不接电话？？？”</p><p class="story-paragraph" data-source-key="1558:0">“是因为在和宇宙姐姐喝茶。”崔志宇说，她没有寒暄的习惯，开门见山地问郑伊安，“电话打这么急做什么，有什么要紧的事情么？”</p><p class="story-paragraph" data-source-key="1559:0">“没什么要紧的事情就不能骚扰你么？”郑伊安在电话那头大喇喇地，“多绚姐姐最近不理我，主恩姐姐忙着做实验，我想来想去，也只能骚扰你。”</p><p class="story-paragraph" data-source-key="1560:0">“我也忙。”崔志宇讲。</p><p class="story-paragraph" data-source-key="1561:0">“忙着谈恋爱么。”郑伊安在那一头嗤了一声。</p><p class="story-paragraph" data-source-key="1562:0">“有话就说。”</p><p class="story-paragraph" data-source-key="1563:0">崔志宇的脾气在圈子里算是公认的好，难得几次沉下语气讲话。但是郑伊安好似次次都算在雷区上面蹦迪。好似激怒崔家人算是郑家人的天赋，崔议员和郑议员见面的时候脸色都不会太好，作为郑议员的掌上明珠，郑伊安倒是没有遗传到她爹讨厌崔家人的个性，反而很喜欢崔志宇。</p><p class="story-paragraph" data-source-key="1564:0">“我这里有一点有趣的东西啦～”伊安的声音依旧很轻快，“你要看么？”</p><p class="story-paragraph" data-source-key="1565:0">崔志宇的眉心跳了跳，手机嗡的一声，弹消息过来，是一个文件。崔志宇点开看了看，眉头倒是逐渐拧起来——是她当初填给那个公司的简历。</p><p class="story-paragraph" data-source-key="1566:0">“哪来的？”</p><p class="story-paragraph" data-source-key="1567:0">“猜咯。”郑伊安笑嘻嘻的，“说真的啊，听说崔伯知道后脸气歪了——。”</p><p class="story-paragraph" data-source-key="1568:0">她刻意地吊着下半句等崔志宇接话，但是崔志宇没有买她的账。只是沉默。郑伊安等了很久，碰一鼻子湿漉漉的灰，嗤了一声。</p><p class="story-paragraph" data-source-key="1569:0">“已经清理干净了，你不用担心这些东西。”</p><p class="story-paragraph" data-source-key="1570:0">她也不管崔志宇有没有听，自顾自地轻飘飘地讲：“倒是崔伯竟然没有把你抓回去，由着你闹，也是奇怪 ”让她倍感奇怪的事情很多，柳河览的资料她也看过，只是一个略有姿色的情色片演员，怎么就把崔志宇骗得这么死心塌地？但是她又太懒，不愿意去琢磨。知晓崔志宇同她们这帮人不爱讲废话，一味地逗只会碰一鼻子灰。</p><p class="story-paragraph" data-source-key="1571:0">“你认真的？”</p><p class="story-paragraph" data-source-key="1572:0">郑伊安轻飘飘地，鼻尖里哼着声音，就这么试探性地问了。</p><p class="story-paragraph" data-source-key="1573:0">这次崔志宇没有沉默，低低地应了一声：“是。”</p><p class="story-paragraph" data-source-key="1574:0">伊安长长地噢——了一声：“那算你欠我人情咯？”</p><p class="story-paragraph" data-source-key="1575:0">电话被挂断了。</p><p class="story-paragraph" data-source-key="1576:0">崔志宇不喜欢和她多说话。</p><p class="story-paragraph" data-source-key="1577:0">郑伊安没有动，还是轻轻地捉着那部电话，认命似地叹口气。海边风大，潮水拍打海岸，潮潮的啸声很快掩过电话的忙音。</p><p class="story-paragraph" data-source-key="1578:0">说实话，有的时候还真想把崔志宇一起埋到水泥堆里去，成天垮着张死人脸，不知情还以为人均欠她几百万。在某种程度上来说崔家人同郑家人确实如水如火。</p><p class="story-paragraph" data-source-key="1579:0">崔家人性冷，郑家人仗义火热。</p><p class="story-paragraph" data-source-key="1580:0">火热过头，就养出一个心狠手辣的郑伊安。</p><p class="story-paragraph" data-source-key="1581:0">她看上去真的就同刚放学的学生崽没两样，板鞋休闲裤连帽衫，肩上斜斜地挎着包。好似放学路过，就是因为这种太过闲适的样子，倒是显得坑里那个被五花大绑的人分外可怜。确实太可怜了，被揍很惨，鼻青脸肿，牙齿脱了好几颗，半边身子都埋在水泥里，一旁还有人在吭哧吭哧地往那台搅拌机里加水泥粉。</p><p class="story-paragraph" data-source-key="1582:0">这种专做桥桩的工地最不缺就是水泥柱模，塞个人进去特容易。伊安慢条斯理，手机放回兜里，俯身下去，亲昵地拍了拍对方的脸蛋。她真的长了一张特别讨人喜欢的脸蛋，幼态，明媚，笑起来好似春风拂面，又礼貌又乖：“你没办法咯，怎么敢在这种节骨眼上用这个东西敲诈崔伯呀？”</p><p class="story-paragraph" data-source-key="1583:0">一口一个伯啊叔的，叫的亲昵又黏甜，礼貌的很。</p><p class="story-paragraph" data-source-key="1584:0">郑家教子有方，她在长辈面前礼貌，远近闻名。</p><p class="story-paragraph" data-source-key="1585:0">三流狗崽拿着崔志宇投色情片公司的简历原件过来敲崔家的竹杠这件事本来就很鬼，在缓和剂调价政策出台的时候搞这种事——真的是，天大的胆子啊。</p><p class="story-paragraph" data-source-key="1586:0">心知肚明着背后应该另有指使，郑伊安的眼睛又眯了起来。</p><p class="story-paragraph" data-source-key="1587:0">她施施然站回去。</p><p class="story-paragraph" data-source-key="1588:0">一旁水泥已经搅好一车，被手底下人吭哧吭哧推过来，但是只是堪堪停在她身侧，留半条生路或者是直接埋死也不过这位大小姐一句话。征询的目光落到郑伊安身上，她倒是嗤一声，笑着骂：“这个衰崽看过我的脸，知道我是谁，你想给我找堵呀？”</p><p class="story-paragraph" data-source-key="1589:0">这种事情脏，按照道理来说，让郑伊安这号人物莅临现场督工，委实过于纡尊降贵。</p><p class="story-paragraph" data-source-key="1590:0">她一句话，下面的人就理解，水泥哐哐地就往里面倒，这下是兜头没过了。这种地方灰尘大，几星灰溅到郑伊安的衣角，她倒是不在意，随手拍了拍，有人识趣递了把椅子过来，她就懒洋洋地坐下。一坐下，手边就递了个直筒玻璃杯过来，没有到法定的饮酒年龄，杯里也只是单纯的水果榨成汁，打眼一看休闲的似去度假，只是水泥坑边飞尘大，这边哐哐搅好一车倒下去，那边又马不停蹄继续搅。</p><p class="story-paragraph" data-source-key="1591:0">这杯东西是没法喝的。</p><p class="story-paragraph" data-source-key="1592:0">但是伊安不在意。</p><p class="story-paragraph" data-source-key="1593:0">她的眼睛还是懒懒洋洋地瞥着那汪子水泥浆，被浇很平，一开始还零零星星往上冒两气泡，到后面就不冒了。她的牙尖咬着吸管，磨了磨，手里的固态硬盘随手一抛，划了个弧线，也没到那汪粘稠的水泥浆里去了。这样一来，关于崔志宇在那个情色公司里的所有原件都被彻底销毁了，接下来的应该就是针对那家色情片制作公司的围剿和收购，这种事情该崔家出手去做，她没心思多管闲事。</p><p class="story-paragraph" data-source-key="1594:0">毕竟关于缓和剂的相关的法案和调价政策的出台算是两位议员难得达成一致的意见，偏生有人不长眼，总觉得势同水火的就是死仇见面——竟然拐弯抹角地拿着这种东西投诚给郑家。</p><p class="story-paragraph" data-source-key="1595:0">只惜没人搭线，七兜八转地落到伊安手里。截资料的人没敢看，全须全尾地打包过来，身后那个试图敲诈的狗崽被五花大绑地丢在地上，呜呜咽咽，嘴里塞着一团烂布，已经被打的说不出话了。这种人太蠢，不知天高地厚，伊安很小的时候就见过类似的。所以也笑盈盈地，在那位交资料过来的人面前做手势。</p><p class="story-paragraph" data-source-key="1596:0">——埋咯。</p><p class="story-paragraph" data-source-key="1597:0">这个工地没有罢工，是伊安叔伯名下的一家建筑公司，除了承做桥桩也接其他工程，不远处的工人们对这种情况视若无睹，埋头吭哧吭哧苦干，早就习惯工地里突兀出现的这波人。</p><p class="story-paragraph" data-source-key="1598:0">落于海崖之上的工址，除却喧天的噪音和灰尘，偏偏占了极佳的观景角。站的高，眺得到一望无际的海，腥咸又湿润的气息拂面，入眼天高海阔，从高处俯瞰，便是天幕之下一捧巨大的蓝湾。</p><p class="story-paragraph" data-source-key="1599:0">伊安把手机的前置摄像打开，眯眼咧嘴喀嚓闪一张自拍，好似真就过来纯观光。</p><p class="story-paragraph" data-source-key="1600:0">她背朝海，身后一望无际，面朝那根被竖起来的模具——柱子还有没成型，水泥填了一半的柱子，大家忙的不可开交，今天之内势必是要把这根水泥柱子浇成的。</p><p class="story-paragraph" data-source-key="1601:0">这么一看崔志宇命真好啊，活的伟光正，谈个恋爱一堆人擦屁股。</p><p class="story-paragraph" data-source-key="1602:0">只是想一想这种话，就发自内心地嫉妒的有点咬牙切齿了。</p><p class="story-paragraph" data-source-key="1603:0">但是郑伊安面上不露，依旧笑眯眯的，懒洋洋地靠在椅子里。</p><p class="story-paragraph" data-source-key="1604:0">这种柱子浇出来不能用，放到几十年前还能拉到釜山那边去沉海祭神，说起来前几年不也出过新闻么？沉没的船只和活生生的人，该不该说历史总是惊人的相似，明明是临海靠屿的国家，但是总会在船只航行上面出一点莫名其妙的，造成了后果的意外。</p><p class="story-paragraph" data-source-key="1605:0">吸管已经被咬的瘪瘪了的，郑伊安吐了吸管，也懒洋洋起身。</p><p class="story-paragraph" data-source-key="1606:0">建在海崖边上的工地，纵然是相对平缓的山地，走下去也要一段时间。行到半山腰的时候，依稀就见到起吊机吊着那根已经凝固的水泥柱子拉到了崖边，绷直的吊线与沉重的水泥柱桩，连同海边将落下去的红日，在伊安嗔黑色的眼底行成了一副吊诡的画，她饶有兴致，举起手机，咔嚓一声，又拍一张。</p><p class="story-paragraph" data-source-key="1607:0">车停在山腰处等她，司机百般无聊，眼见郑伊安晃晃悠悠下来，拉开后座门坐进去。他忙不迭将点好的奶茶递过去，郑伊安垂下眼扫一扫，笑：“我最近在控糖啦，大叔。”一面讲，一面还是笑盈盈地接过，工地上灰尘大，那杯果汁她也没喝两口，正口渴。一面喝奶茶 ，那头司机又轻飘飘递过来一个牛皮档案袋，郑伊安接过来，拆开看。</p><p class="story-paragraph" data-source-key="1608:0">郑家人做事要效率，早上随口讲的东西下午就能递到跟前，其实她对崔志宇惹了什么烂桃花，喜欢了什么人着实没什么大的好奇心，拆来象征性看了两眼，随手放到一旁，目光落到最后一页的时候，微妙地顿了顿：“大解脱圆？”</p><p class="story-paragraph" data-source-key="1609:0">这个名字她熟，是前几年在首尔盛极一时的邪教，最开始兴起的时候也只是打着各种旗号骗钱骗人，后面越玩越疯，概念从从花钱上天堂变作死亡才是解脱，玩聚众自杀。</p><p class="story-paragraph" data-source-key="1610:0">最严重的一起是废教堂纵火案，死了十一个，闹太大，警方介入，报道连着占一个星期的大版面，</p><p class="story-paragraph" data-source-key="1611:0">她捻着那张纸眯着眼看，深黑色的背面画着纯白的圆，圆内用墨线铺出异常规整的十二芒星，一星一角都用工整的字迹写着名字，其中十一个是某起恶性纵火案中的已死亡的受害人，剩下一角的名字——</p><p class="story-paragraph" data-source-key="1612:0">伊安轻轻地将那页纸揭起来，垂着眼，眼睛死死地盯着那个名字。</p><p class="story-paragraph" data-source-key="1613:0">她不笑了。</p><p class="story-paragraph" data-source-key="1615:0">等到崔志宇回到小公寓的时候，天已经完全黑下来了。</p><p class="story-paragraph" data-source-key="1616:0">金家的司机将她送到路口，她拉开车门下车，一瞬间又听到司机大叔的叹息。缄默本分，年过半百。她依稀记得小时候与宇宙姐姐一起央这位大叔开车带她们逃出首尔玩，那时候好似脑袋上还没这么多白发，不得不讲时间却似飞逝。崔志宇犹豫了一下，还是乖乖地同大叔道别。</p><p class="story-paragraph" data-source-key="1617:0">在所有人的眼里她一直很乖，不似多绚叛逆，没有伊安冷酷，所有小孩里最墨守成规的一位，结果做出来的事情最离经叛道，她轻轻地嗬了一口气。</p><p class="story-paragraph" data-source-key="1618:0">给河览的礼物在背包里轻飘飘地放着，让这位司机大叔把车开到商场里陪自己到处乱转的行为也算是重温童年。刷卡结账的时候大叔就在一旁目光沉沉地看，突兀讲小崔你这样太像拍电视剧了。</p><p class="story-paragraph" data-source-key="1619:0">“鬼怪，知道吗？你现在的样子有一点像那个喝醉酒因为心上人的告白让整个城市都开出春花的神明。”上了年龄的人用的比喻也抽象，逗得崔志宇忍不住笑。如果她是那位心软的神明的话河览应该就是她的新娘，只是有时候确实丧气，不是无所不能的神明，所以还是让河览在没有遇到她的时候受了很多幸苦。</p><p class="story-paragraph" data-source-key="1620:0">“我还以为大叔会讲我这次任性。”</p><p class="story-paragraph" data-source-key="1621:0">她哂笑，接过店员包装好的礼物塞进背包。除了时兴的最新款手机还有厚重的羊绒围巾，纵然是季节平和的釜山，在海边拍戏难免会受风吹，她怕河览生病。</p><p class="story-paragraph" data-source-key="1622:0">“是觉得小崔很在意那位啦，幸福就好咯。”</p><p class="story-paragraph" data-source-key="1623:0">但是总觉得同崔志宇这么小的小孩讲幸福太抽象，大叔也贴心地讲：“开心最好。”</p><p class="story-paragraph" data-source-key="1624:0">等到崔志宇回去的时候彻底天黑了。</p><p class="story-paragraph" data-source-key="1625:0">前些日子小区灯坏了。物业效率慢，到现在为止楼前还是沉沉一片黑。</p><p class="story-paragraph" data-source-key="1626:0">只是今日首尔天气好，难得见到圆月。一轮明亮亮的月亮刮在蓝绒绒的天上，崔志宇慢吞吞地一步步上楼，走过狭窄的楼道，拿出钥匙，开门。</p><p class="story-paragraph" data-source-key="1627:0">客厅里的灯是昏黄的，泛着淡淡的光，光和影一并从里边涌出来，轻柔地裹住她。她往里面走，脑子里还是郑伊安打的那通电话，心事重重，总觉得自己好似被一团不详的云兜头罩住，心脏里全是坠沉的不安。</p><p class="story-paragraph" data-source-key="1628:0">换鞋的时候脚边不慎碰到一团软，哼哼唧唧的——崔志宇低头看过去，黑白色的小狗儿，毛绒耳朵长嘴筒子，扎着个伊丽莎白圈，颇有一种滑稽的感觉。眼睛水汪汪的，被崔志宇不小心踢到也不叫，晃着小短腿哼哼唧唧地就往里边爬了爬，又乖又可怜地坐在那儿。</p><p class="story-paragraph" data-source-key="1629:0">崔志宇垂着眼，一人一狗对视半晌，等到河览匆匆走出来的时候，她又钝钝地抬眼看河览。</p><p class="story-paragraph" data-source-key="1630:0">“…”</p><p class="story-paragraph" data-source-key="1631:0">“什么呀。”</p><p class="story-paragraph" data-source-key="1632:0">懵懵的样子有一点可爱，河览噗嗤一声笑出来。她往前走两步，弯下腰轻轻地将小狗从地上捞起来，另一只手拉住崔志宇。放在三年前，甚至是放在一年前，这样的日子是她想也不敢想的。大抵人生之中好似真有守恒定律，衰又微盛，盛得过于顺风顺水，总给她些不真切的感觉。她心里不安，天大的不安，却又在见到崔志宇的那一刻，不安倏然消失，化作一种绵长又踏实感觉。好似倦鸟归巢，离舟泊岸，天宽地阔之间终于留得一隅让她稍作喘息。</p><p class="story-paragraph" data-source-key="1633:0">轻轻地回握住河览的手，崔志宇的目光还停在那只小狗儿身上，河览察觉到她目光，眨了眨眼，后知后觉忘了告诉志宇家中多了一个不速之客，有一点忐忑，怕崔志宇不喜欢。</p><p class="story-paragraph" data-source-key="1634:0">这么小的家伙在外面是活不下来的，钝钝地想着，河览迟迟开口：“..和Carmen姐姐买咖啡的时候看到的，怕活不下来。就…“</p><p class="story-paragraph" data-source-key="1635:0">她小心翼翼地讲着，倒是听到崔志宇噗嗤一声笑出来。</p><p class="story-paragraph" data-source-key="1636:0">她轻而易举地将小狗从河览的手里接过来，换成更娴熟的抱姿，小狗儿伏在怀里瑟瑟发抖，崔志宇放轻语气，慢慢地道：“所以我们善良的河览就给我这只小狗姐姐带了一个小伙伴回来呀？”</p><p class="story-paragraph" data-source-key="1637:0">手指轻轻地拢着小狗毛茸茸的头顶，她在撸狗这件事上颇有一种轻车熟路的感觉。小狗儿被摸得舒服，哼哼唧唧，也不发抖了。</p><p class="story-paragraph" data-source-key="1638:0">“给它一个名字啦。”崔志宇讲，“没有名字的话，以后跑丢了都不知道去哪里找。”</p><p class="story-paragraph" data-source-key="1639:0">倒是没有想到崔志宇的点在这里，河览眨了眨眼，听到崔志宇鼻尖轻轻地哼一声。类似于笑，类似于撒娇。她迟迟顿顿，没有反应过来，额头上附过一点柔软的冷意，崔志宇低头，轻轻地啄了啄她。</p><p class="story-paragraph" data-source-key="1640:0">“河览这种呆呆愣愣的样子，有一点可爱。”她实诚地讲，圆溜溜的眼睛湿漉漉的，和怀里的小狗一模一样。大抵也知道现在的河览脑子空空，想不出来东西，崔志宇闷闷笑：“叫小啾吧。”</p><p class="story-paragraph" data-source-key="1641:0">“小啾？“</p><p class="story-paragraph" data-source-key="1642:0">“本来是认为叫jiwoo好一点，但是让小狗直接用我的名字也不合适。”</p><p class="story-paragraph" data-source-key="1643:0">垂着眸子，她轻轻地将小狗放进河览怀里，“我不是真的小狗，虽然想像小狗一样，河览走到哪里，我就跟到哪里。”顿了顿，崔志宇慢慢地将上涌的情绪压下，不动声色地抚平，“小啾可以一直陪着你。”</p><p class="story-paragraph" data-source-key="1644:0">它可以一直陪着你，很久很久。</p><p class="story-paragraph" data-source-key="1645:0">她说不出来这种话，多说一点就要掉眼泪的程度。</p><p class="story-paragraph" data-source-key="1646:0">她被河览牵着，一起往客厅里走。其实这段时间的明里暗里，屋子里的那些陈旧的家具也被她换的差不多。原房东堆的杂物被地掉大多数，狭窄的空间登时就敞亮起来。</p><p class="story-paragraph" data-source-key="1647:0">绒布沙发崭新宽大，占据客厅小半空间，订的时候她就在想河览应该会喜欢这种宽宽大大的东西，以前的河览思虑过重的时候躺在沙发上就要睡过去——她总觉得，无论怎么样，我的河览至少要有一个好的睡眠吧？</p><p class="story-paragraph" data-source-key="1648:0">河览使了坏，过沙发的时候手腕用了力把志宇往下拽，于是两个人双双跌进沙发里。只是她忘了怀里还有一只小啾，小狗儿被吓得惊慌失措，挤出一声呜咽，夹着尾巴连滚带爬地从两个人身上跳下去了。</p><p class="story-paragraph" data-source-key="1649:0">“你这只小狗也要陪我很久呀。”</p><p class="story-paragraph" data-source-key="1650:0">趴在崔志宇的身上，河览用很轻的声音讲这句话。总觉得姐姐的那句话轻飘飘，语气轻飘飘，情绪却像浸了水的棉花，沉得让她惶恐。她讲不出这种惶恐缘由，只是察觉到志宇话里话外一层灰扑扑的丧气，不敢多问，只是害怕。</p><p class="story-paragraph" data-source-key="1651:0">她竟然想象不到没有崔志宇的日子该怎么过了。</p><p class="story-paragraph" data-source-key="1652:0">在过去十八年里一个人面临过所有风风雨雨的柳河览，在十九岁的时候在淋着雨的人生里遇到崔志宇，短暂地走过一段艳阳天气，如果突兀再将她推进暴雨里，她会觉得受不住。</p><p class="story-paragraph" data-source-key="1653:0">“你得陪着我呀。”</p><p class="story-paragraph" data-source-key="1654:0">她细细碎碎地，慢慢地讲着。声音放缓，大抵就可以压住骤然上涌的难过，她不敢抬头看崔志宇，自顾自地将脑袋埋在对方怀里。那句话太像告别，如果真的是告别该怎么办？不要在这个时候离开我啊。</p><p class="story-paragraph" data-source-key="1655:0">乱七八糟的想法一旦起来就收不住场，小狗呜呜咽咽哼哼的声音里，河览在心里轻轻地想着。</p><p class="story-paragraph" data-source-key="1656:0">—不要离开我啊。</p><p class="story-paragraph" data-source-key="1657:0">崔志宇沉着眼，好多话，在嘴里变换几度，说不出口。只是化作蓦地一声叹。</p><p class="story-paragraph" data-source-key="1658:0">“我也会一直陪着你。”——直到你不需要我的那天。</p><p class="story-paragraph" data-source-key="1659:0">她话语轻，轻如云烟，如遮如雾。两个人缄默又各怀心事，沉沉地在沙发上叠着。</p><p class="story-paragraph" data-source-key="1660:0">柳河览轻，压不疼崔志宇，新沙发回来了就一直喜欢这么趴她。偶尔给崔志宇错觉，好似养了一只黏人的小猫。她沉着眼，手指轻轻拢在河览的脑后，有一下没一下地往下梳。这样真的好像在给小猫顺毛，一下又一下，好似这样就能捋平沉沉的心事。</p><p class="story-paragraph" data-source-key="1661:0">可是她的心事太多太多了，一桩又一桩，心脏也好似被悬在秤杆的那一处吊着，审判之剑悬在头顶，明晃晃。</p><p class="story-paragraph" data-source-key="1662:0">“柳河览。”</p><p class="story-paragraph" data-source-key="1663:0">她突地开口，连名带姓的。</p><p class="story-paragraph" data-source-key="1664:0">离开前被宇宙语重心长地提醒着谎言总会被揭穿的时候这种俗语，心知肚明着这种必然的结局，避无可避，却又忍不住怀着侥幸的心思，一瞒再瞒 。</p><p class="story-paragraph" data-source-key="1665:0">可是迟早会有瞒不住的一天，这是她心知肚明的事实。放在最开始，也只是漫不经心地想着大不了挨对方恼羞成怒的两巴掌功成身退，现在，直到这句提醒从金宇宙的嘴巴里语重心长地冒出来的时候，她又才后知后觉——是她自己舍不得。</p><p class="story-paragraph" data-source-key="1666:0">崔志宇盯着天花板，声音很轻：“你会原谅欺骗过你的人么？”</p><p class="story-paragraph" data-source-key="1667:0">问这种话的时候，就能设想到答案，但是她还是心存侥幸。以往同哥哥在赌场的牌桌上见到红眼的赌徒，尚也不能理解就算输到一无所有还要继续下注的心态。在这个须臾却微妙的理解了那些人，一无所有的人好似总会竭尽全力着抓紧能够抓紧的东西，运气也好机会也罢。</p><p class="story-paragraph" data-source-key="1668:0">以往不理解的时候看不上，现今心脏在胸腔里剧烈跳动，过去瞧不上又不理解的情绪充斥着脏腑，她不动声色，呼吸放缓，轻一点，再轻一点。恍恍惚惚的，总觉得等待回答的过程漫长，就连情绪也被看不见的手攥紧了。房子老，年代久，天花板一角上渗了暗黄色的水痕，屋子里灯光不亮堂，水痕明晃晃的刺眼睛。崔志宇眯着眼睛看了一会儿，突兀又想，兴许也该趁着河览去釜山的时候，将这个小房子好好装修一下，彻底地换个模样。</p><p class="story-paragraph" data-source-key="1669:0">她问的问题，目的性太过明显，河览聪明，听出来了些许话，抓着崔志宇的衣角的手紧了紧，她不知道该怎么接。</p><p class="story-paragraph" data-source-key="1670:0">“如果有骗着我的事情，请一直骗下去吧。”</p><p class="story-paragraph" data-source-key="1671:0">她轻轻地讲这种话，属实也不知该怎么样给出最漂亮的答案。河览在崔志宇的面前一向坦诚，一览无余，恨不得把自己整个地剖开给她看。关于崔志宇的是那颗鲜活跳动着的真心，时时刻刻撞击胸膛，心脏跳动一下，爱意就溢出来一点。潮汐似的，来复又去。</p><p class="story-paragraph" data-source-key="1672:0">她听到志宇轻轻地叹了一口气，更笃定了自己的揣测，心却似绑了一块石头，沉沉的被拽了下去。河览一时间说不出来更多的话，只觉得闷，又闷又痛，喘不过气。</p><p class="story-paragraph" data-source-key="1673:0">为什么要有坦白的心思呢？如果此刻开口挽留的话，你会丢掉落荒而逃的想法吗？</p><p class="story-paragraph" data-source-key="1674:0">“笨蛋。”</p><p class="story-paragraph" data-source-key="1675:0">她听到崔志宇轻轻声地念。</p><p class="story-paragraph" data-source-key="1676:0">恍然好似经历了很多，不见天光的人生陡然间柳暗花明，只是过去太苦，养成偏执性格。只是一瞬间就会闪过很多不好的念头？到底是赌棍还是穷凶极恶的暴徒呢？其实不是首尔大学的学生也没关系啊，不骗下去了也没关系，坦白了也会原谅你啊。</p><p class="story-paragraph" data-source-key="1677:0">但是崔志宇只是闭着眼睛，松松地揽在在她的腰上的手，有下没下，轻轻地拍着她。</p><p class="story-paragraph" data-source-key="1678:0">在那一瞬间河览有错觉，她同崔志宇此刻分明离很近，心却相隔很远。</p><p class="story-paragraph" data-source-key="1679:0">“首尔应该快下雪了吧？”她听见崔志宇讲话。</p><p class="story-paragraph" data-source-key="1680:0">心事很重的人，声音很轻。这种事情其实到了后来河览才知道。那时候她太小，没见识，总觉得有情饮水饱，自己爱崔志宇更多，有勇气吃她一切的骗。骗也没关系，大不了一直拍戏，努力赚钱，纵是无底洞也有朝一日能够填平——只是未想过她习惯性把人想的不堪，又把志宇推远一步。</p><p class="story-paragraph" data-source-key="1681:0">河览悟出这一点是几年后，那时她已离首尔很远，小啾已经长很大，变做一只品相很好的边牧犬，一张狗脸，花色匀称，黑白分明。河览按着崔志宇的法子养它，把它养的很好，见人也不设防，嘤嘤叫，吭哧吭哧翻肚皮撒娇。</p><p class="story-paragraph" data-source-key="1682:0">她与小啾一起住在原州的乡下，住的地方有一处小院子，种满克莱尔奥斯汀。</p><p class="story-paragraph" data-source-key="1683:0">志宇把她们的小啾也训的很好。以至于后来小啾只爱河览，胜过爱它自己本身。</p><p class="story-paragraph" data-source-key="1684:0">只是现下的小啾还小，小狗不喜欢骤然沉下去的气氛，在角落里呜呜咽咽地哼出声响。河览伏在志宇身前听她的心跳声，脑子里被乱七八糟的设想塞满，眼眶通红。她不知道崔志宇的下一句会说什么，就不敢往下接话。</p><p class="story-paragraph" data-source-key="1685:0">她听见崔志宇笑。</p><p class="story-paragraph" data-source-key="1686:0">恍然间她的手被志宇捉住，无名指根骤然贴上一抹温存的冷意。</p><p class="story-paragraph" data-source-key="1687:0">“路过的时候在橱窗里看到了，觉得适合你。”志宇轻轻地讲，“我是首尔大的学生，货真价实，不会在这方面骗你。”</p><p class="story-paragraph" data-source-key="1688:0">她太聪明，近若妖鬼的神智，须臾间猜透河览。</p><p class="story-paragraph" data-source-key="1689:0">河览太善良，容易行差踏错，容易万劫不复。</p><p class="story-paragraph" data-source-key="1690:0">一面在心里叹，一面又忍不住庆幸，还好自己不是让河览万劫不复的人。但是这种庆幸窝囊且微妙，志宇讲不出口。替河览戴上了戒指，又不似前些时日那么张狂，这种事意义重大，她做的轻率，某种程度上来说算不礼貌。</p><p class="story-paragraph" data-source-key="1691:0">但是她总觉得时日短，河览动身去釜山的时日逼近，不给她有礼貌的机会。</p><p class="story-paragraph" data-source-key="1692:0">“求婚啊？”河览闷闷地问。</p><p class="story-paragraph" data-source-key="1693:0">指根被圈住，她不是很适应，但是也没想着取下来。</p><p class="story-paragraph" data-source-key="1694:0">天气预报她有看，近日一连杆的艳阳天气，八竿子打不到落雪的头上。依照气象台的预测，首尔应是十一月末迎来初雪。总觉得志宇后面那句话讲的咬牙切齿，河览噗嗤一声笑出来。</p><p class="story-paragraph" data-source-key="1695:0">她心事还是沉，笑起来又发自内心，原来开心与惴惴竟能同时存在，两种情绪合在一起，多少让她起了一点矛盾的快乐，感觉太微妙了，说不出，只是撑起身子坐起来，乖乖张手端详挂在指根的戒指。</p><p class="story-paragraph" data-source-key="1696:0">铂金材质，极简，戒面细细地镶着一圈小小的碎钻。</p><p class="story-paragraph" data-source-key="1697:0">柳河览的手好看，指瘦如削，无名指根托着一环细细碎碎的钻，宛若被一圈小小碎碎的晨星兜住。不便宜，也不是顶贵，中规中矩的价格。</p><p class="story-paragraph" data-source-key="1698:0">但是按照金多绚的性格，看到应该会大呼小叫嘲笑她消费降级。</p><p class="story-paragraph" data-source-key="1699:0">“适合你。”</p><p class="story-paragraph" data-source-key="1700:0">崔志讲，她替河览把戒指戴好，手指轻轻地剐过戒面，沿着河览的指腹往上勾了勾。又自然而然地将对方的整只手都捉进掌心里。</p><p class="story-paragraph" data-source-key="1701:0">她们都不说话了，自然而然地依偎在一处，如同极寒中默然取暖的两只小兽。成为演员需要进行的专业培训太多 ，抽空还要尽量熟悉发下来的剧本和角色。河览困得很，心防被戒指一圈，轻飘飘松下去，倦意涌上来，困的沉沉的。</p><p class="story-paragraph" data-source-key="1702:0">手被志宇轻飘飘地攥着，悬起来的心脏蓦然间似有了归处，变得踏实了起来。</p><p class="story-paragraph" data-source-key="1703:0">她屈了屈手指，指尖挠了挠志宇的掌心，很小声地说了一句话，志宇没有听清楚。她乖顺地低了低头，亲亲河览发顶，抚在河览背上的手还是有一下没一下轻轻拍，没有多问。只是听到河览低低咕哝两声。</p><p class="story-paragraph" data-source-key="1704:0">“你是什么样的人都没有关系。”</p><p class="story-paragraph" data-source-key="1705:0">河览是真的下了决心讲这句话，声音也轻，细细碎碎的，像一只小猫的爪子似的，轻轻地挠崔志宇的心脏。</p><p class="story-paragraph" data-source-key="1706:0">梁生恨恨的语气又响在耳侧，有情饮水饱。这句话真难听，用港腔念出来，有一种轻又重的感觉。世界上要情谊不要命的人挺多，河览混迹其中，也不觉有怪。她垂着眸子，声音很低，不敢念从梁生和多绚嘴里学到的那句话，只能很慢 、很温吞地讲。</p><p class="story-paragraph" data-source-key="1707:0">“你一直，一直在我身边就好了。”</p><p class="story-paragraph" data-source-key="1708:0">她声音很轻，眼睛阖着，轻似梦呓。志宇低低声应了声好，不敢再多说，怕再讲就有哭腔出来。</p><p class="story-paragraph" data-source-key="1710:0">时日过很快，一转眼进十一月十多日，光阴飞逝，近中旬。釜山的拍摄场地终于弄好，先是器材和剧组过去，金宇宙和金珉周也要过去。河览出发的日子也近了，志宇愈发忙。药剂的研发紧锣密鼓，好似被一只手无声息按下快进键，数据的整合和分析需要大量的时间和高度集中的精力，基本实验室一待一整日，两个人见面时间错开 ，那晚便都当做从未发生，两人均默契不再提。</p><p class="story-paragraph" data-source-key="1712:0">小啾归志宇管，白天被她装在太空舱里提去学校寄养给崔教授，实验室出来又背着狗去医院做复查，一人一狗，颇有一点凄凉。</p><p class="story-paragraph" data-source-key="1713:0">等到到了河览准备动身的时候，小啾的伊丽莎白圈已经撤下来了，小狗正在潦草期，耳朵里两簇飞起来的聪明毛，河览抱着它揉，捏着狗脸皱着鼻子嫌弃：“小啾变丑了。”</p><p class="story-paragraph" data-source-key="1714:0">小啾汪汪抗议起来，志宇从河览怀里把它解救出来放到地上：“等你回来就长好看了。”</p><p class="story-paragraph" data-source-key="1715:0">小狗子尾巴一甩，气哼哼地跑去房间床底下趴着了。</p><p class="story-paragraph" data-source-key="1716:0">河览长长地噢——了一声：“那要好久。”</p><p class="story-paragraph" data-source-key="1717:0">她盯着志宇，上目线，嗔黑色的眼与眼白分明，是一幅一望无际的黑山白水画。明朗、澄澈，一眼就看得到底——这里面只有崔志宇。</p><p class="story-paragraph" data-source-key="1718:0">泡在实验室里久了，劳累的愈发，志宇几乎是肉眼可见的瘦下去。愈发瘦，愈发漂亮，看上去就愈发的易碎。累的话也少，傍晚赶回来帮柳河览收拾行李，第二天又要赶回冠岳山上的那栋小楼。</p><p class="story-paragraph" data-source-key="1719:0">请假的时候姑母欲言又止的，应该是听到了什么风声，那双总是含着柔软笑意的眼睛里，头次被崔志宇读出来些许复杂的情绪。</p><p class="story-paragraph" data-source-key="1720:0">最终还是批了假。</p><p class="story-paragraph" data-source-key="1721:0">行李箱也是新买的，崔志宇让金主恩陪着去挑了很久，挑出来一款淡粉的。崭新又宽大的行李箱摊开摆在地上，一侧一水放叠好的换洗的衣物，崔志宇有强迫症，一件衣服当做一桩事似的做，叠的一丝不苟，棱角分明。</p><p class="story-paragraph" data-source-key="1722:0">那条新买给河览的羊绒围巾被她攥在手里，纠结又纠结，其实箱子里已经塞了几条，花色款式各样，大有一种要把整个衣柜都塞进河览的箱子里的阵仗。</p><p class="story-paragraph" data-source-key="1723:0">“已经有很多围巾啦。”</p><p class="story-paragraph" data-source-key="1724:0">河览嗤一声笑，那头崔志宇应一声，有些恹恹的。她有情绪，偏偏眼瞳的颜色太浅，有点心事一望无际。她把围巾叠了又叠，犹豫了一下，还是轻轻地把它放在一侧。</p><p class="story-paragraph" data-source-key="1725:0">“明天我戴这条走啦。不用放进箱子里。”</p><p class="story-paragraph" data-source-key="1726:0">河览曲起手指，轻轻地碰一碰志宇的颊侧：“不开心呀？”</p><p class="story-paragraph" data-source-key="1727:0">“不开心。”</p><p class="story-paragraph" data-source-key="1728:0">但是没有关系</p><p class="story-paragraph" data-source-key="1729:0">志宇轻声讲：“你拍完戏，早点回来。回来我就开心了。”</p><p class="story-paragraph" data-source-key="1730:0">话音落，唇瓣突兀叠上一层软，河览微微地抬头，啄住她唇瓣。她们接过很多次吻，镜头前生活中都有，两个人都是温吞的人，接吻也只是唇瓣相贴地啄一啄。</p><p class="story-paragraph" data-source-key="1731:0">除却那次志宇醉酒，其他的时日里，两个人是难得有这般漫长、缱绻的时刻。 河览好似亲不够，小鸟啄食似地，一下又一下。她没有闭眼，指尖轻柔地捻着志宇在猝然间涨红的耳垂，眼里噙着笑，灯光从头顶照下来，她的眼睛亮晶晶的。</p><p class="story-paragraph" data-source-key="1732:0">崔志宇不动，微微低头，让河览啄的舒服一点。</p><p class="story-paragraph" data-source-key="1733:0">维持了很久，却又很青涩的亲吻。其实不是没有做过露骨的事情，只是某种程度上来说镜头前后终有区别，清醒的时候再做那档子事莫名会爆羞耻心。唇瓣贴了又合，最后一下的时候河览齿尖用力，不轻不重往崔志宇嘴上嗑了痕迹。</p><p class="story-paragraph" data-source-key="1734:0">“要想我。”</p><p class="story-paragraph" data-source-key="1735:0">她哼着气，眼睛在灯光下亮晶晶，好像一只神气活现，趾高气扬的小猫。</p><p class="story-paragraph" data-source-key="1736:0">脱离了之前的职业，小猫被宇宙姐姐也养的很好，大家都怜惜她从前的经历，发自内心的爱护她。</p><p class="story-paragraph" data-source-key="1737:0">金多绚时不时给崔志宇发河览的照片：顶着书靠着墙站练仪态，拿着剧本撑着腮在楼下茶厅琢磨，累极倒在皮革沙发上呼呼大睡。各色各样的河览逐渐占满手机，鲜艳明亮，活蹦乱跳。</p><p class="story-paragraph" data-source-key="1738:0">实验室里忙太狠，崔志宇就会把手机里的这些照片调出来翻着看，看着看着就发自内心地笃定——她的河览会拥有一个很好很好的，富足而自由的未来。</p><p class="story-paragraph" data-source-key="1739:0">关于河览的初心是如此，从始至终，从未变过。</p><p class="story-paragraph" data-source-key="1740:0">察觉到崔志宇心不在焉，河览眨眨眼，声音重一点：“听到没有，要想我。”</p><p class="story-paragraph" data-source-key="1741:0">崔志宇猛然回过神，眨眨眼，乖乖点点头。</p><p class="story-paragraph" data-source-key="1743:0">金多绚在kkt上给河览发派车来接她去金浦机场的时间——她们一起从那里往釜山飞。金宇宙一开始搞工作就好似换个人，追速度讲效率，航班定的最早，寸秒寸金似的争时间。</p><p class="story-paragraph" data-source-key="1744:0">航班早，人起的更早，以至于河览在楼下见到金多绚时还懒洋洋地打着哈欠。首尔入冬就开始冷，她裹着那条羊绒围巾，整个人也穿的毛茸茸的，看上去好乖，像个精致又柔软的漂亮娃娃。</p><p class="story-paragraph" data-source-key="1745:0">就连外套上的羊角扣被工整地扣好，一丝不苟，一看就知出自某个人</p><p class="story-paragraph" data-source-key="1746:0">金多绚不想讲话，眼见河览手里大箱小包地下来，楼道里突地还转出个崔志宇。</p><p class="story-paragraph" data-source-key="1747:0">她压下想翻白眼的冲动，把头撇去一边了。</p><p class="story-paragraph" data-source-key="1748:0">有情人热恋期，应是难舍难分。</p><p class="story-paragraph" data-source-key="1749:0">多绚眼尖，没放过托住河览无名指根的那一环碎钻，心知肚明是谁人手笔，眼见崔志宇走到河览身边，她懒懒打个哈欠，也钻回车里，属实不想做电灯泡。</p><p class="story-paragraph" data-source-key="1750:0">出乎她的意料，没有任何的难舍难分，崔志宇只是伸手去，替河览将围巾往下掖一掖，轻轻地将翘起来的一边抚平了。</p><p class="story-paragraph" data-source-key="1751:0">“顾好自己。”</p><p class="story-paragraph" data-source-key="1752:0">她言简意赅，温吞柔软。</p><p class="story-paragraph" data-source-key="1753:0">多绚扒在车窗里看热闹，给金宇宙打着电话直播现况，等到河览也钻进车里的时候又匆忙挂断电话，手机震动一下，金宇宙又发三个捂嘴笑的黄豆过来。</p><p class="story-paragraph" data-source-key="1754:0">崔志宇立在原地，见那辆保姆车车门合上，开走了。</p><p class="story-paragraph" data-source-key="1755:0">凌晨近早，天气雾蒙蒙的，冷空气无声流动，颊侧被骤落下的冷意一激，崔志宇打了个激灵。</p><p class="story-paragraph" data-source-key="1756:0">她下意识伸手去接，簇簇一星绒，落到她的掌心，又被体温热做一滩水。</p><p class="story-paragraph" data-source-key="1758:0">——首尔下雪了。</p></div>
      </article>
    </template><template id="section-08">
      <article class="chapter" data-chapter="section-08">
        <header class="chapter-header"><span class="chapter-number">08</span><h2>Chapter 08</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="1763:0">无论是初雪亦或者只是单纯的性质的雪，在东亚文化圈中都具有非凡的意义。无论是电视剧亦或者是诗词歌赋等作品，哀思也好，情谊也好。一片茫茫然的白里面，雪能够代表的东西太多，太复杂，一句话说不完。</p><p class="story-paragraph" data-source-key="1764:0">落在掌心里的的雪簇簇成团，很快又化开，冷意蔓延，崔志宇手心收紧，小心攥住。</p><p class="story-paragraph" data-source-key="1765:0">保姆车的红眼灯在稀薄的晨雾中远去，她站在原地看了一会儿，转身上楼。</p><p class="story-paragraph" data-source-key="1766:0">小啾趴在门口，小狗好似察觉到别离，没有撵路的习惯，但是尾巴耷拉，发自内心的不开心。</p><p class="story-paragraph" data-source-key="1767:0">崔志宇弯腰下去，一把抱起小啾：“走啦。”</p><p class="story-paragraph" data-source-key="1768:0">她的声音轻轻的，不知是在对谁说：“接下来是很长、很长的一段时间啊。”</p><p class="story-paragraph" data-source-key="1769:0">从相逢起她就未经历过和柳河览的分离，所以在这一刻来临的刹那，也恍然有天大地大，无处可去的错觉。</p><p class="story-paragraph" data-source-key="1771:0">保姆车内暖气足，柳河览的围巾戴不住，上车解开了些，露出一段白皙的颈。</p><p class="story-paragraph" data-source-key="1772:0">金多绚歪在另一半假寐，虚虚睁眼偷睨，没有在颈处看到设想的痕迹。</p><p class="story-paragraph" data-source-key="1773:0">崔志宇比她想象里的要克制许多。</p><p class="story-paragraph" data-source-key="1774:0">车载广播固定频道，先是放天气预报再播新闻：首尔继早日初雪之后正式进入寒季，冰冷的播报声流淌在封闭的车厢内，偏生是个女主播，音色柔和，不近人情的机械音里又有那么些柔和的人味，听上去有一点点微妙。金多绚调整了一下姿势，闭着眼睛继续听。</p><p class="story-paragraph" data-source-key="1775:0">其实新闻这种东西来来回回无非几种，青瓦台有什么动向、国会通过了什么法案、新上任的总统又去哪个国家做了什么事、最近吵的火热的缓和剂调价政策之类的。金宇宙在家的时候会逼着金多绚多看点新闻，怕这个小孩鱼龙混杂的地方走的太多，以后大了丧失对事物的正确认知和判断的能力。</p><p class="story-paragraph" data-source-key="1776:0">多绚苦不堪言，金宇宙在这方面不吃她撒娇这一套。</p><p class="story-paragraph" data-source-key="1777:0">河览对这些东西兴致不高，只是在听到缓和剂调价这一块的时候耳朵支棱了一下。她是omega，对于这些东西几乎有着本能性的敏锐。omega有天生的构造缺陷，被Alpha彻底标记了之后就很难再有新的开始权利，因为彻底标记而导致了对方的信息素会在腺体里以一种永恒的形式滞留——一个Alpha可以很轻易地甩掉omega然后重新开始，但是omega们一旦被彻底标记，要洗去对方的信息素就要经历一遭抽骨扒皮似的痛楚，是一种生不如死的经历。</p><p class="story-paragraph" data-source-key="1778:0">针对于有着这种需求的omega们而研究生产的平价药物通常伴生巨大的副作用，使用过后对身体的损伤可谓不可逆转。经英方注资的生物科技公司在一九年研出药性缓和度更高的药剂，小批量的生产之后进一步吊高价格。只是吊的太高，高到有些匪夷所思的程度。</p><p class="story-paragraph" data-source-key="1779:0">再加上近些年经济下行，市场追逐挤占，生产平价药剂的小型药企倒了好几家。</p><p class="story-paragraph" data-source-key="1780:0">渐渐的，市面上也就只剩了这一种高价药剂，形成了一种垄断现象。</p><p class="story-paragraph" data-source-key="1781:0">现今突兀推出价格下调政策，不算坏事。</p><p class="story-paragraph" data-source-key="1782:0">在有些时刻，彻底标记在有些时刻并非omega所愿，但是每一个omega应该都需要可以昂首挺胸的，重新开始的机会——而这样的机会不应被那种药剂高昂的价格拦在门外。</p><p class="story-paragraph" data-source-key="1783:0">金多绚混的地方多，察言观色本事一流，自然看出河览对这则新闻感兴趣，稍稍坐正了身子。</p><p class="story-paragraph" data-source-key="1784:0">主推这个政策的崔议员行程百忙，抽出十分钟接记者专访，四两拨千斤地避开要害问题，只说执行贯彻，态度坚决。</p><p class="story-paragraph" data-source-key="1785:0">多绚在私底下也没怎么接触过这位叔伯，去崔志宇家里玩也是见对方家里的佣人比较多，只是父女两还是有相似的地方——话少头闷人犟，认准了死理撞南墙也不回头。</p><p class="story-paragraph" data-source-key="1786:0">崔志宇之于河览是如此，崔议员对于这个政策的推进和实施也是如此。</p><p class="story-paragraph" data-source-key="1787:0">只是崔志宇不介意在河览这里头破血流，崔议员在这件事上手腕铁血，万死不辞。</p><p class="story-paragraph" data-source-key="1788:0">老的小的凑在一起，任谁看都要感慨基因和遗传。</p><p class="story-paragraph" data-source-key="1789:0">金多绚在心里默默然翻白眼，依稀记得前些日子回家时听父亲在饭桌上提过一嘴，老头子年过半百还有为挚友操不完的心。缓和剂调价政策风声起来的时候就有死亡威胁往崔议员的邮箱里塞，他提到这些死亡威胁的邮件就火大，只是久居上位者不动声色，天大的火气也得四平八稳地落在地上。</p><p class="story-paragraph" data-source-key="1790:0">金多绚听老头子抱怨，心不在焉。</p><p class="story-paragraph" data-source-key="1791:0">老头话锋一转，问到崔志宇头上：“小崔也参与那个药剂的研发，她最近安全么？”</p><p class="story-paragraph" data-source-key="1792:0">轻飘飘问话却似当头棒喝，金多绚一个激灵，后之后觉反应过来，崔志宇和金主恩到底在搞什么惊天动地的大事。</p><p class="story-paragraph" data-source-key="1793:0">这么一想好似也确实不愧亲生父女。</p><p class="story-paragraph" data-source-key="1794:0">老与小的性子真似一块模子里刻出。</p><p class="story-paragraph" data-source-key="1795:0">没有让人安心的时刻，也没有令人省心的时候。</p><p class="story-paragraph" data-source-key="1796:0">可是她现在坐在此处，不知道崔志宇和河览究竟到了什么样的地步。有好好地告诉河览自己正在面临的东西吗？还是说依旧是那副什么都要自己面对，自己扛着的死样。柳河览就坐在旁侧，支棱耳朵，专心致志地听着新闻。金多绚沉沉地，咽下去一口叹。</p><p class="story-paragraph" data-source-key="1797:0">不敢多问，不能多问。</p><p class="story-paragraph" data-source-key="1798:0">事已至此，就连金多绚也惊觉自己好似是有许多事被崔志宇蒙在鼓里。但是她没办法。</p><p class="story-paragraph" data-source-key="1799:0">崔志宇这个人，缄默清冷，皮相好，性格好，从小到大招了很多人的喜欢。她好似一直都笑盈盈的，任着谁来也是那般和蔼可亲的模样。只是有时却也没来由让多绚产生一种微妙的错觉——这个人看似亲和，其实离所有人很远，一层柔软的边界似山似海般横在跟前，一头站着崔志宇，一头隔着大多数人。</p><p class="story-paragraph" data-source-key="1800:0">熙熙攘攘，人来人往，唯独只有崔志宇，置身其中，却又置身事外。</p><p class="story-paragraph" data-source-key="1801:0">可是有的事，有的东西，只有她去经历，她去面对，她去承受。</p><p class="story-paragraph" data-source-key="1802:0">旁的人没办法。</p><p class="story-paragraph" data-source-key="1803:0">换谁来都不合适，换谁来都不行。</p><p class="story-paragraph" data-source-key="1804:0">多绚轻轻地叹了一口气。她不是会让话落到地上的人，平日聚会也算是活跃气氛的那一帮子，只是现下这个时刻，情绪复杂，就不知道该说什么了。</p><p class="story-paragraph" data-source-key="1805:0">“以前才签那个公司的时候，我看过那个药剂。好贵的，那时候就在想，便宜一点就好了。”</p><p class="story-paragraph" data-source-key="1806:0">冷不丁的，听到河览突然地开口。</p><p class="story-paragraph" data-source-key="1807:0">这个人开口说话很自然，不突兀，尴尬到快要凝起来的空气不动声色地在车厢里流动起来，多绚打着哈哈，没有接话。</p><p class="story-paragraph" data-source-key="1808:0">河览会继续说下去的。</p><p class="story-paragraph" data-source-key="1809:0">这个事情她知道，梁生来托她帮忙的时候讲过。小小一个姑娘站在药店的玻璃柜台面前，柜台里几个型号的药剂，一支都买不起。</p><p class="story-paragraph" data-source-key="1810:0">港佬讲这些龙门阵绘声绘色，一瞬间，竟就让多绚真真切切地见到了那个站在柜台面前的柳河览。太拮据，眼里积着薄薄一层水雾。她总觉得还好不是崔志宇知道这些，她想不到崔志宇知道这些的表情。</p><p class="story-paragraph" data-source-key="1811:0">——小孩小，做这行太惨，你帮帮她。</p><p class="story-paragraph" data-source-key="1812:0">迄今多绚也记得这位这句话，过于恳切，过于真诚。可按道理不应该，在那种公司做人事的，可怜的可恨的见得太多，早应有一副铁石心肠。只是偏偏那天心软了一下，脑子里转了个念头出来，好似也只这么轻飘飘的一下——好似真的就扭转了河览的人生。</p><p class="story-paragraph" data-source-key="1813:0">当初买不起药剂的人现今也不用再为这种高昂的费用发愁了，确切一点讲，她好似不用再为任何事情发愁了。</p><p class="story-paragraph" data-source-key="1814:0">“是好事。”</p><p class="story-paragraph" data-source-key="1815:0">不知道该怎么接柳河览的话，多绚只能这么讲。距金浦机场还有一段时间的距离，她讷讷地，摸摸鼻子，又干巴巴地重复一遍。</p><p class="story-paragraph" data-source-key="1816:0">“是好事。”</p><p class="story-paragraph" data-source-key="1817:0">“是好事啊。”</p><p class="story-paragraph" data-source-key="1818:0">河览顺着金多绚的话头，轻轻地感慨一遍。两个人都不再讲话，车内空气静默，只剩新闻播报声冷冷流淌。两人百般无聊，各坐一边。车窗上攒了一层薄蒙蒙的雾气，扑扑朔朔，许多东西看不真切。</p><p class="story-paragraph" data-source-key="1819:0">“你是不是很讨厌别人骗你？。”突兀地多绚就这么问了，“上次知道我的假年龄脸都要黑死了，那时候是不是准备拍我巴掌了。”</p><p class="story-paragraph" data-source-key="1820:0">“是。”河览很坦诚，“我不喜欢说谎的人。”</p><p class="story-paragraph" data-source-key="1821:0">经历的欺骗太多，读书的时候抽中的空白签，其实两个都是；跑到首尔来又被无良老板骗着签下差点毁掉一辈子的合约；甚至险些被邪教徒的花言巧语骗到丢掉小命。好似人生中的每一处凄惨都和欺骗两个字息息相关，她没有办法不憎恶这种行为。</p><p class="story-paragraph" data-source-key="1822:0">“如果…”</p><p class="story-paragraph" data-source-key="1823:0">多绚突然有些后悔，这么问她。</p><p class="story-paragraph" data-source-key="1824:0">她不知道该怎么说下一句了。</p><p class="story-paragraph" data-source-key="1825:0">“是想说，如果骗我的人是志宇姐姐，是吧？”</p><p class="story-paragraph" data-source-key="1826:0">待在一起久了，好似真的会在某些方面产生和对方相似的特征。崔志宇聪明，洞察力近若妖鬼。柳河览有一学一，待在一起久了，直觉敏锐的惊人，豁然一下挑开多绚的欲言又止，把她所有的，不敢说的，不能说的，都亮堂堂地挑了出来。</p><p class="story-paragraph" data-source-key="1827:0">多绚说不出话，喉咙里似塞一块棉花。</p><p class="story-paragraph" data-source-key="1828:0">柳河览半张脸都被围巾拢住，只露了一双眼睛在外面，嗔黑明亮。</p><p class="story-paragraph" data-source-key="1829:0">金宇宙给她请的老师第一课就教河览怎么样把眼睛做到有神。做演员做偶像的眼睛最重要，一双眼含着情谊，水汪汪的，做出欲说又止的神态，便似无声胜有声。</p><p class="story-paragraph" data-source-key="1830:0">可是在这个当头，金多绚看不清河览藏在眼底的情绪了。</p><p class="story-paragraph" data-source-key="1831:0">“不知道。”河览很简短地回答她。</p><p class="story-paragraph" data-source-key="1832:0">她是真的不知道，有朝日一日高楼坍塌，谁又能风轻云淡抽身走。</p><p class="story-paragraph" data-source-key="1833:0">河览又在心里轻轻地想，可是我很爱她。</p><p class="story-paragraph" data-source-key="1834:0">爱到什么程度，有情饮水饱，放在心尖上供在神坛上，纵然是贫瘠而一无所有的人生，也想拼命地抓出一点什么留给志宇。可是她也不知道自己到底可以给志宇什么，她站在那里，神定气闲的，明明讲着自己很可怜这种话，可是好似什么都不缺。</p><p class="story-paragraph" data-source-key="1835:0">也只是因为这种奇怪又坦然的姿态，让河览在某些瞬间，会觉得自己的那些想法荒谬而不自量力，像轻飘飘的笑话。</p><p class="story-paragraph" data-source-key="1836:0">她又可以给崔志宇什么？</p><p class="story-paragraph" data-source-key="1837:0">可偏偏，她一无所有，又有奢想。</p><p class="story-paragraph" data-source-key="1838:0">崔志宇在有些时候实在缥缈，空中明月，海上阁楼，令人捉摸不住。她似众生，庸庸碌碌，普通到尘灰里，却总想在某个须臾攥紧月亮。</p><p class="story-paragraph" data-source-key="1839:0">河览不再讲话，垂着眸，不知在想什么。</p><p class="story-paragraph" data-source-key="1840:0">出发前几日她终于去之前在橱窗里相中许久的领带买下，一并订做领夹。</p><p class="story-paragraph" data-source-key="1841:0">深蓝色缎面，领背金线勾出连贯又漂亮的星轨，上好的绸质，柔软又轻滑。授课老师同她讲首尔大的学生都很忙，报告也似家常便饭，着正装应是时常需要。</p><p class="story-paragraph" data-source-key="1842:0">领带漂亮极了，付钱的时候她想着崔志宇系这领带的模样，应该也是漂亮极了。</p><p class="story-paragraph" data-source-key="1844:0">初雪落下，首尔正式进入了寒冷的季节。崔志宇抱着小啾先去崔教授的办公室，倒是没有想到在楼下遇到郑伊安。倒是因为天寒的缘故，也穿上了大衣围上了围巾。小啾不安分地在崔志宇的怀里拱了拱，恰好被郑伊安的视线撞上，轻飘飘一声笑：“崔豆吃醋么？”</p><p class="story-paragraph" data-source-key="1845:0">那是养在崔家老宅里的小泰迪犬，棕色的绒绒的毛，很乖巧。</p><p class="story-paragraph" data-source-key="1846:0">“不知道。”</p><p class="story-paragraph" data-source-key="1847:0">崔志宇按住不安分的小啾，听到郑伊安哼笑一声。</p><p class="story-paragraph" data-source-key="1848:0">“还是别带给崔豆看啦。”</p><p class="story-paragraph" data-source-key="1849:0">“狗老了，别刺激到了。”</p><p class="story-paragraph" data-source-key="1850:0">伊安长得太漂亮，眉目明亮，笑起来露两颗可爱的小虎牙，无辜又无害。旁的人其实很难将这种长相同心狠手辣四个字关联起来，但是郑伊安是。</p><p class="story-paragraph" data-source-key="1851:0">她很小就被送到釜山那边去养，在喊打喊杀的环境里长大，心软一点兴许就死无全尸。某种程度上来说，确实和崔志宇是两个世界的人。</p><p class="story-paragraph" data-source-key="1852:0">两个人能走到一起算是托金多绚的福，这个人天生大条，荤素不忌，三教九流的朋友遍布，脾气也好，难得是崔志宇亲近、郑伊安也喜欢的类型。</p><p class="story-paragraph" data-source-key="1853:0">“崔豆前不久才做了体检，很健康。”崔志宇蹙着眉头反驳。</p><p class="story-paragraph" data-source-key="1854:0">郑伊安又笑，也不说话了。</p><p class="story-paragraph" data-source-key="1855:0">两个人走一路，从一层楼坐电梯到十九楼，出门向右走到尽头，就是崔教授的办公室 。</p><p class="story-paragraph" data-source-key="1856:0">小啾对这个环境已经驾轻就熟，志宇将它放下，小狗就哼哼唧唧地钻进了自己的地盘里。</p><p class="story-paragraph" data-source-key="1857:0">崔教授来的比她们都早，正对着电脑屏幕上的临床结果沉思,对外宣称的进展奇慢的药剂其实已经进入了末阶段，只是临床的数值不理想，贸然推出去还有风险。</p><p class="story-paragraph" data-source-key="1858:0">伊安是代表郑议员过来关心进度的，志宇把小啾的东西放好，也站到崔教授那里去看。金主恩是来的最晚的，打着哈欠懒洋洋的样子。药剂的生产线也是问题，相关的问题太多了，但是已经上升到了她们几个搞研究的操心不了的局面了。唯一一个有点话语权的也不关心这个，伊安还是笑盈盈的，听金主恩讲完了大体的近况，就很慷慨地讲请大家吃早餐。</p><p class="story-paragraph" data-source-key="1859:0">崔教授的余光瞥到蹲在一旁专心给小啾放狗粮和饮用水的崔志宇身上，有些恨铁不成钢。</p><p class="story-paragraph" data-source-key="1860:0">她轻轻地叹了一口气。</p><p class="story-paragraph" data-source-key="1861:0">从志宇抱着小狗过来找她的时候就知道了某些风言风语并非空穴来风，只是志宇的性格太倔，被关进反省室几天也没有松口服软的意向，颇有她爹当年的风范。</p><p class="story-paragraph" data-source-key="1862:0">只是风口浪尖，在有的事情面前，两个人的事情就显得太小。</p><p class="story-paragraph" data-source-key="1863:0">虽然没有耽误实验进度，崔志宇的效率甚至比以前更甚。</p><p class="story-paragraph" data-source-key="1864:0">但是崔教授私底下旁敲侧击，从金主恩嘴巴里听到这小孩是真的打算和那位结婚的时候，还是免不了两眼一黑。</p><p class="story-paragraph" data-source-key="1865:0">这个小孩看上去轻淡，长了一张薄情寡义的脸蛋，偏生性子死犟，认准的事情八头牛拉不回来。</p><p class="story-paragraph" data-source-key="1866:0">崔教授无声叹气，话到嘴边，还是轻飘飘咽回去。</p><p class="story-paragraph" data-source-key="1867:0">小啾不知何时凑到她脚下，小狗好似正在磨牙期，轻轻衔住她裤脚。</p><p class="story-paragraph" data-source-key="1868:0">等到三个人一起从崔教授的办公室里出来的时候，太阳也悬在天上了。明晃晃的一轮，照的往下飘的雪花晶莹剔透，雪还在下，有下大的趋势。就连她们周围的常青树叶上也积出一层薄薄碎碎的雪，崔志宇撑开伞，余光瞥郑伊安：“送送你？”</p><p class="story-paragraph" data-source-key="1869:0">这个人从来都不喜欢让司机把车开进校园，每次都劳崔志宇一路陪她走到校门口。两个人性格差太多，通常一路上没有话，只是这次难得是崔志宇开口讲谢谢。</p><p class="story-paragraph" data-source-key="1870:0">寡言的人，不善于表达心意，只是确实发自内心地感激着伊安出手截断了那些东西。</p><p class="story-paragraph" data-source-key="1871:0">“担心崔伯知道打断你的腿呀？”伊安哼笑一声，随手指指前面的便利店，“那帮我买瓶草莓牛奶吧，好久没喝了，做谢礼。”</p><p class="story-paragraph" data-source-key="1872:0">“不担心这个。 ”崔志宇声音轻轻地讲。</p><p class="story-paragraph" data-source-key="1873:0">郑伊安摊摊手，洗耳恭听，崔志宇却不愿多讲，把伞塞进伊安手里，自己冒着雪进便利店了。她长得高，背打的笔直，身段好，雪天着灰色的燕尾式的大衣，走路看背影也有一种翩然的风度。郑伊安眯着眼睛看两眼，嗤一声笑出来。</p><p class="story-paragraph" data-source-key="1874:0">从小到大收到过情书无数封，偏偏崔志宇为的，只有一个柳河览。</p><p class="story-paragraph" data-source-key="1875:0">在普遍烂人的圈子里，这种事情讲出去就似天大的笑话。只是金多绚不会讲，郑伊安也不会多说。真心这种东西太难得了，某种程度上来说，应算作心头一捧最艳最鲜的血，一旦捧出去便再难生出第二次。</p><p class="story-paragraph" data-source-key="1876:0">一面觉得崔志宇这件事做的可笑，偏偏一面又发自内心觉得，若是有这两个人能有好结局，也不算太差。</p><p class="story-paragraph" data-source-key="1877:0">手机嗡嗡震，她懒懒散散，拿出来看，对面小鸭子头像一闪一闪的，给她拍了雪景。</p><p class="story-paragraph" data-source-key="1878:0">真是个话多的人啊，发消息也吵的叽叽喳喳的，这么旺盛的分享欲。</p><p class="story-paragraph" data-source-key="1879:0">伊安挑挑眉，顺势将手机收回去，已读不回。</p><p class="story-paragraph" data-source-key="1880:0">崔志宇提着一兜子零食从便利店里钻出来，加热好的草莓牛奶被她捏在手里，妥帖插上吸管。</p><p class="story-paragraph" data-source-key="1881:0">伊安衔着吸管，啜两口，工业糖精兑出来的草莓味，小时候有段时间很喜欢的味道。</p><p class="story-paragraph" data-source-key="1882:0">她只要一瓶草莓牛奶，崔志宇多买一大袋零食。</p><p class="story-paragraph" data-source-key="1883:0">郑伊安行事向来一码归一码，轻轻巧巧从崔志宇手里提过袋子：“下午方便翘实验么？”</p><p class="story-paragraph" data-source-key="1884:0">崔志宇：？</p><p class="story-paragraph" data-source-key="1885:0">郑伊安的牙尖磨着吸管，自顾自讲话：“这边剩下的东西简单吗，应该不是没你不可了，翘半天，带你去看个地方。”</p><p class="story-paragraph" data-source-key="1887:0">釜山，Busanpo，形状如甑的山和漂亮的海港。</p><p class="story-paragraph" data-source-key="1888:0">从机场到拍摄场地还有一小时车程，金宇宙安排的妥帖，早早派车来接。金珉周戴着墨镜靠在副驾等多绚和河览上车，工作风格严苛，私底下却是出奇的平易近人：“河览要珍惜这一次的机场经历呀。”</p><p class="story-paragraph" data-source-key="1889:0">她的语气闲闲，柔软似春棉：”以后走机场的时候大概会很热闹的。“</p><p class="story-paragraph" data-source-key="1890:0">金多绚听懂金珉周的意思，眸子低下去，拧开手里的饮料递给河览：“珉周姐姐和宇宙姐姐对你很有信心。”</p><p class="story-paragraph" data-source-key="1891:0">确实有信心，也的确算明目张胆的偏爱。</p><p class="story-paragraph" data-source-key="1892:0">在此之前，她没有听说过金珉周会做出亲自跟着哪趟车去接演员这种事情。</p><p class="story-paragraph" data-source-key="1893:0">“先好好休息一下吧。&quot;金珉周贴心地道，”接下来的几个月会很辛苦。“</p><p class="story-paragraph" data-source-key="1894:0">不算是着墨很重的角色，金宇宙捧人向来不在戏份上面堆砌，只是商榷分镜的时候，确实连开好几场大会，铁了心要把河览最漂亮的样子现在屏幕上。流媒体时代，网速一快，新旧交叠，要捧起来一个人容易，但是要捧到投资方一眼相中，观众念念不忘。势必从初亮相就要开始浓墨重彩。</p><p class="story-paragraph" data-source-key="1895:0">河览好似天赏这碗饭吃，一张脸蛋摆在那里，许多故事都够娓娓道来。</p><p class="story-paragraph" data-source-key="1896:0">多绚常年待在宇宙身边，耳濡目染，心知肚明这些，所以明白为何珉周格外青睐河览。但是她只是拿着手机，低头给崔志宇发消息。</p><p class="story-paragraph" data-source-key="1897:0">车开到金浦机场的时候她才后知后觉首尔飘了初雪，依照金主恩的说法，如果没有这个行程，志宇与河览应该是在去登记婚姻申告的路上了。其实某种程度上来说，人生漫漫，世事无常，许多东西的圆满亦或者不圆满，早就在冥冥之中自有注定。</p><p class="story-paragraph" data-source-key="1898:0">只是当下的金多绚不懂，太年轻，只是把手机竖起来，趁着河览把目光移向窗外的刹那偷偷拍一张，kkt上发给崔志宇。</p><p class="story-paragraph" data-source-key="1899:0">她一连给崔志宇发了很多条消息，都显示未读，好似这位今天真的很忙，忙到没空盯手机。</p><p class="story-paragraph" data-source-key="1900:0">“不过，说起来，最近不要乱跑哦。”金珉周突地，温和地提醒道，“这几个月的釜山有一点不安全。”</p><p class="story-paragraph" data-source-key="1901:0">多绚的眉心跳了跳。</p><p class="story-paragraph" data-source-key="1902:0">“有一个很奇怪的组织啦，会到处发传单，不是什么好东西。”知晓河览这个小孩最好骗，金珉周转头轻轻讲，“尤其是河览哦？发过来的传单不要乱接。”</p><p class="story-paragraph" data-source-key="1903:0">毕竟和金宇宙来的早一些，拉到的投资里面有釜山本地的企业，老板过来接洽的时候友好提醒了一下。</p><p class="story-paragraph" data-source-key="1904:0">前几年因为教堂纵火案被肃清出首尔的大解脱圆组织，好似最近又有在釜山隐隐复苏的姿态，三个月里已经发生了多起青少年自杀案件。偏偏这个组织的人行踪极其诡谲，又善于清理痕迹，地方报刊上都印上警惕传单的标语，都快闹到成新闻的地步。版面篇幅占据极大，也把地方上的官员们弄的苦不堪言。</p><p class="story-paragraph" data-source-key="1905:0">毕竟是釜山，临海靠港的地方，大韩民国面朝世界的另一张脸面。</p><p class="story-paragraph" data-source-key="1907:0">捷尼赛斯稳稳停在破教会门口。</p><p class="story-paragraph" data-source-key="1908:0">教会砖瓦破烂，天幕之下岌岌可危。荒废许久，墙壁发黄，依稀还有被火舌舔舐过的焦痕。二二年教堂恶性纵火事件影响巨大，时至今日痕迹也未消弭。</p><p class="story-paragraph" data-source-key="1909:0">火势太大，到后面是难以熄灭的程度，除却那十一位殉死者，火情太大，甚至一度波及到周边农户，造成了严重的财产损失。</p><p class="story-paragraph" data-source-key="1910:0">这类性质的组织其实在韩国并不少见，只是这次影响太过恶劣，已经算得上是恶性事件，所以事后教会也被拉了封条，加上新上任的总统有心打压这类性质的东西，至今日，首尔之内再无信奉大解脱圆教的民众。</p><p class="story-paragraph" data-source-key="1911:0">伊安先行下车，心情好，轻轻巧巧地帮崔志宇把后座车门拉开，礼貌的很，抬手帮她做遮。</p><p class="story-paragraph" data-source-key="1912:0">她还是笑眯眯的。</p><p class="story-paragraph" data-source-key="1913:0">这个人笑起来人畜无害，越人畜无害，越危险。崔志宇瞥过她一眼，不多话，抬腿往里边走。</p><p class="story-paragraph" data-source-key="1914:0">她当然知道这栋建筑，但是不知道伊安的葫芦里到底在卖什么药。</p><p class="story-paragraph" data-source-key="1915:0">经年辗转，推门刹那，灰气扑人。这个恶性事故发生之后，首尔的都市传说也多添一笔，说是月圆之夜，教堂里时常传来哭声，枉死之人的灵魂徘徊不去，反复受着煎熬。</p><p class="story-paragraph" data-source-key="1916:0">同类型事件蛮多——港城麻将桌外卖事件、珠市荔湾凶场，加上这起教会凶影，传的神乎其神，煞有其事。</p><p class="story-paragraph" data-source-key="1917:0">那年崔志宇和金主恩刚被家族选进项目，从只打生物竞赛的学生崽一跃成为背负重大责任的科研狗，压力大的快脱发，一直约着讲要来这座教堂探虚实。</p><p class="story-paragraph" data-source-key="1918:0">教会同装潢同一般教会无差异，诡异的是中间正倒吊的耶稣像，脑袋向下，被熏的发黑。对于天主教徒而言倒似莫大的大不敬，只可惜在场两位均无神论，伊安饶有兴致研究地上的十二芒星，志宇平平淡淡去瞥那尊倒吊像，心里只觉得这个教会的审美稀烂。</p><p class="story-paragraph" data-source-key="1919:0">警方还原的现场，此处雕像应是十二芒星的中心，当初那十一具受害者被发现的时候，均是以一种很诡异的姿势呈现，膝盖曲折，手腕被反绑在身后，肠胃里均有不同剂量的安定和氰化物。</p><p class="story-paragraph" data-source-key="1920:0">伊安摸出来那张从档案里抽出来的纸张，沿着雕像，慢慢对应。</p><p class="story-paragraph" data-source-key="1921:0">她这次把司机也带来做苦力，走一角，对方就提一桶水过来，用力地清理——和她揣测的没有错，搞这类事情的疯子尤其喜欢留难以磨灭的痕迹，每一处星角上都写着不同的名字，内外六角，严丝合缝，在地面构成一张密不透风的巨网。</p><p class="story-paragraph" data-source-key="1922:0">伊安不紧不慢，徐徐地走到最后一角。</p><p class="story-paragraph" data-source-key="1923:0">崔志宇蹙着眉头，看到伊安冲她招了招手：“过来看。”</p><p class="story-paragraph" data-source-key="1925:0">她踢开脚边的罐子走过去，目光顺着伊安的指向往地面上看，却在看到的那一瞬间，赫然似一道惊雷划过，她的心脏骤地一紧，浑身的血液都要被那三个字骇的凝固起来。</p><p class="story-paragraph" data-source-key="1926:0">“柳——河——览——”</p><p class="story-paragraph" data-source-key="1927:0">伊安慢吞吞地，拖长声音，念出了地上的名字。</p><p class="story-paragraph" data-source-key="1928:0">“是我想的那个河览吗?”</p><p class="story-paragraph" data-source-key="1929:0">明知故问，但是崔志宇没有接伊安的话头，她死死地盯着地面上的名字，心脏都快跳到喉口。终于明白那日趴在窗台上的河览为何会讲出来那样的话语，原来是真的有朝日一日，走到活不下去的边缘，走到了发自内心的认为着，死亡就是解脱的那一步。</p><p class="story-paragraph" data-source-key="1930:0">朱漆泼出来的字，落在地面上，触目惊心。</p><p class="story-paragraph" data-source-key="1932:0">她倏然就不敢继续往下想，到底那时候的河览有多无助呢?</p><p class="story-paragraph" data-source-key="1933:0">可是地面上泼血似的字就摆在她的面前，仿佛就是十七岁的河览站在那里，与她沉默相望。</p><p class="story-paragraph" data-source-key="1934:0">“要哭啦?”伊安问，这个人置身事外，神定气闲，手里那张陈旧的黄纸递给志宇，“但是你先不要哭，有其他的事情，听完了再哭。”</p><p class="story-paragraph" data-source-key="1935:0">从查出来了这张纸后她就往釜山那边去了，待了几日，到是查出来不少东西。</p><p class="story-paragraph" data-source-key="1936:0">重返境内的英国籍的领头人和重新在釜山活跃起来的教会组织，丝丝缕缕，不谋而合。这个领头人不但在那个跨境药企中占据相当大头的持股，同时和国会里的那几个反对调价政策的议员有着密切的有来往的痕迹，材料被首尔这边的警察厅那边有意识遮掩，用了些其他手段，伊安才拿到完整的资料，才得以厘清许多当年在警察的手里没有厘清的关系。</p><p class="story-paragraph" data-source-key="1937:0">“前段时间，釜山那边递消息回来，大解脱圆又有复苏迹象，我记得二二年逃出海关的那位领头人是英国籍吧?”她慢条斯理地将另一张入关记录叠在那封陈旧的纸上，一并递过去，“釜山那边有他的入境记录。你猜他是冲着谁去的？”</p><p class="story-paragraph" data-source-key="1938:0">就像杀人凶手完成凶案了之后会再度返回现场的癖好一样，当初因为缺了一角而不能构成完整的献祭，作为缺失的那一角，河览对于这个教会具有的诱惑力远超一般的年轻人。</p><p class="story-paragraph" data-source-key="1939:0">敌在暗处，不得不时时提防，处处小心。就像一直有人试图潜入实验室销毁那份极为关键的核心数据一样，伊安可以笃定地告诉崔志宇，在河览和多绚踏入釜山境内的刹那，一定会有阴魂不散的东西盯上柳河览。</p><p class="story-paragraph" data-source-key="1940:0">两桩事情并拢做一堆，颇有一种山雨欲来的感觉。</p><p class="story-paragraph" data-source-key="1941:0">从另一个角度来说，其实更像更像一场需要耐着性子去抽丝剥茧的硬仗。</p><p class="story-paragraph" data-source-key="1943:0">但是伊安什么都多的话都没有讲，她只是平静地看着志宇接过自己手里的那些东西，嘴角上弯，眼底却没有笑意。</p><p class="story-paragraph" data-source-key="1944:0">她很慷慨，崔志宇给她多买了一口袋零食，她自然要给出相应的匹配，在载着崔志宇过来的路上，郑家在釜山的安保力量已经联系到了金宇宙，大抵在短时间之内，是没有人可以从片场上带走柳河览的。</p><p class="story-paragraph" data-source-key="1945:0">这些她也不会讲。</p><p class="story-paragraph" data-source-key="1946:0">她的声音很轻，情绪也很轻，以往没有见过崔志宇的这般模样，伊安也觉得新奇：“我还以为你会觉得自己招惹了一个麻烦呢。”</p><p class="scene-break" data-source-key="1947:0" aria-label="场景分隔">……</p><p class="story-paragraph" data-source-key="1948:0">崔志宇的嘴巴张了张，没能说出任何话。</p><p class="story-paragraph" data-source-key="1949:0">她说不出话。</p><p class="story-paragraph" data-source-key="1950:0">被持续的、强烈的情绪冲击着，心脏好似比以往任何时候提到河览的过去的时候还要疼痛。就连手指也死死地掐进了掌心之中，力气太大，掐破了皮。松开的时候掌心赫然出现几弯惨白的弧。汹涌又暴烈的情绪被轻飘飘地咽下去，再度开口的时候，只觉喉口都弥着一股血气。</p><p class="story-paragraph" data-source-key="1951:0">“怎么可能会是麻烦呢。”她的声音很轻，支离破碎，“她没得选。”</p><p class="story-paragraph" data-source-key="1952:0">没得选的事情太多，万般身不由己铸成牢笼似的命运，铸成那个咬着牙坚持着活下来的，一步一步地走过来的河览。</p><p class="story-paragraph" data-source-key="1953:0">“很多事情都没得选。”伊安笑一声，“你没得选，我没得选，不是吗？”</p><p class="story-paragraph" data-source-key="1954:0">正是因为如此，就算金多绚没有刻意牵线搭桥，她们也能走拢一处，并非不是羡慕普通人平和的一生，如若抛却家世，似乎就失去大多数资本，如若捡起，身居高位，身在其中，命运这种东西，半点由不得人。</p><p class="story-paragraph" data-source-key="1955:0">但是话讲到这个程度，就到了说不下去的时候，两个人一前一后走出教会，发现雪下更大，黑土地上厚厚的覆住一层，像是心上经年堆砌，又持续不化的心事。</p><p class="story-paragraph" data-source-key="1956:0">伊安的手机一直在嗡嗡地震动着，志宇侧目看过去，到时见到这人娴熟地打开，读了消息，又漫不经心地放回去。</p><p class="story-paragraph" data-source-key="1957:0">“之前有人给我送了个alpha来。”她冲志宇笑笑，“红色头发，长得漂亮，性格也好，就留在身边了。”</p><p class="story-paragraph" data-source-key="1958:0">“你也是alpha吧。”</p><p class="story-paragraph" data-source-key="1959:0">“是啊。”伊安笑，“可能长得太像Omega了，所以送来的人误会了。”</p><p class="story-paragraph" data-source-key="1960:0">其实外界传的一直是郑伊安只对alpha感兴趣，同性恋中的同性恋。只是崔志宇实在对这些八卦不感兴趣，圈子里来往的人也就那几个从小一起长大的伴，也没人觉得她会对这些污七糟八的东西感兴趣。</p><p class="story-paragraph" data-source-key="1961:0">伊安也没准备告诉她，匆匆搪塞过。</p><p class="story-paragraph" data-source-key="1962:0">那家情色制片公司被清查的时候，老板为了自保，选了公司里最漂亮的alpha，把她五花大绑地送到了伊安常住的那个酒店房间里。只是见到的第一眼就觉得卢惟那太可怜，那么大一只，眼泪汪汪地缩在床上。没来由让她想起来小时候养过几天，又很早死掉的小白狗。</p><p class="story-paragraph" data-source-key="1963:0">那家公司惹到不该惹的，保不住，老板涉及的灰色领域太多，进去蹲是迟早的事情。伊安心知肚明这桩闹剧的结局，慷慨收下命运赠礼。</p><p class="story-paragraph" data-source-key="1964:0">只是聪明如她，偶尔也有懈怠，不会想命运馈赠早已在暗中标好筹码，只是在想，如果崔志宇都可以拥有柳河览，她过这么多年，一条长路漫漫看不到头，养一只小狗陪着又怎么样？</p><p class="story-paragraph" data-source-key="1965:0">....</p><p class="story-paragraph" data-source-key="1966:0">崔志宇讲：“挺活泼的。”</p><p class="story-paragraph" data-source-key="1967:0">她不知伊安手机对面是谁，只是觉得这个人生命力挺旺盛，只是发消息也吵出人山人海的错觉。</p><p class="story-paragraph" data-source-key="1968:0">“我还以为你的河览也会这么吵你。”伊安拉开车门坐进去。</p><p class="story-paragraph" data-source-key="1969:0">志宇的动作顿了顿，摇了摇头:“她不会给我发太多信息。”</p><p class="story-paragraph" data-source-key="1970:0">“那不知道你养来有什么用了。”伊安笑一声，晃晃手机，打开了对话框上是连片的拍过来的雪景，”釜山的海景很漂亮吧？如果是这只小狗在那里应该会给我分享一大堆。“</p><p class="story-paragraph" data-source-key="1971:0">不把人当做人的毛病一犯，任谁也想给这张漂亮冷漠的脸上甩上两巴掌，崔志宇不想理，低垂眸子，自顾自坐进车里。</p><p class="story-paragraph" data-source-key="1972:0">她总觉得郑伊安把这个人摆出来的时候，有点像小朋友炫耀自己心爱的玩具，其实是有一点孩子气的可爱的。她大抵知道伊安的过往，那种环境长大的小孩没有童年，活的很孤独。她是郑家养出来的一把最锋利的刀，行事作风如此，是生下来就是必须要如此，怪不得郑伊安，怨不得任何人。</p><p class="story-paragraph" data-source-key="1973:0">“河览知道你的身份吗？”伊安突然地问。</p><p class="story-paragraph" data-source-key="1974:0">崔志宇摇了摇头:&quot;我没有想好该怎么说。“</p><p class="story-paragraph" data-source-key="1975:0">话音落，看到伊安哼哼笑起来，好似赢了一场什么不得了的比拼似的。她在志宇面前极其放松，完全不设防的姿态，只是一个十七岁的小朋友：“那我比你强一点噢。”</p><p class="story-paragraph" data-source-key="1976:0">说到得意处，连腿也翘起来，斜依靠坐，没正形：“我的那只小狗知道我有很多很多钱。”</p><p class="story-paragraph" data-source-key="1977:0">志宇睨她一眼，伊安哼哼笑：“我们公平交易。”</p><p class="story-paragraph" data-source-key="1978:0">她给对方很多很多钱，对方给她很多很多爱。钱货两清，互不相欠。</p><p class="story-paragraph" data-source-key="1979:0">崔志宇的目光又收回去：”随你。“</p><p class="story-paragraph" data-source-key="1980:0">归程车开很快，窗外街景飞逝，雪下的大，整座首尔城都覆上一层茫茫的白衣。归途车道有一段靠着汉江，隔着如墨如洗的江面，远处冠岳山也隐约可见。崔志宇在首尔土生土长，坐车时鲜少留意窗外景象，但是她的思绪控制不了，忍不住想许多。</p><p class="story-paragraph" data-source-key="1981:0">釜山那边暗藏的危机或者是实验数据的保护和进度是需要留意和上心的，更多的思绪却是忍不住飘二二年。首尔这座城市里苟且求生的人太多，她不知道当初的河览究竟过着怎么样辛苦的日子。</p><p class="story-paragraph" data-source-key="1982:0">以至于这么苦，以至于这么瘦。</p><p class="story-paragraph" data-source-key="1983:0">“你该庆幸她遇到好心人租她房，要是住到九龙村里会更惨啦。“</p><p class="story-paragraph" data-source-key="1984:0">伊安不忘往她伤口上捅刀子：”九龙村知道吧，当初我记得你在网上看到这种地方的照片还有点震惊。“</p><p class="story-paragraph" data-source-key="1985:0">她眯着眼睛，慢条斯理回忆当初崔志宇的模样：“眼睛睁很大，有点不可思议，甚至怀疑这个地方是不是印度那边。”</p><p class="story-paragraph" data-source-key="1986:0">教堂纵火案中，一半的受害者出自九龙村，都是年轻人，过太穷，活不下去。</p><p class="story-paragraph" data-source-key="1987:0">毗邻江南社区的知名贫民窟，穷到出名，被电影取过景，也危险到臭名昭著。</p><p class="story-paragraph" data-source-key="1988:0">一句话几乎快要把崔志宇打成自闭症，就连眉头也死死地蹙起来了。</p><p class="story-paragraph" data-source-key="1989:0">郑伊安只是冷眼看着她。</p><p class="story-paragraph" data-source-key="1990:0">这个世界上命苦的人太多，她太了解崔志宇，圣人悲悯，神爱众生，路边受饿的流浪猫流浪狗都见不得，更何况一个活生生的人。只是崔志宇关于柳河览的心绪太复杂，说爱也不纯粹，说怜悯也不光鲜。就算是金多绚有意设套，那她接近柳河览，也算半个见色起意，一整个蓄谋已久。</p><p class="story-paragraph" data-source-key="1991:0">所以许多一开始没有说清的东西，到后面再想说开，也只会愈发难堪和不体面。</p><p class="story-paragraph" data-source-key="1992:0">只是时下需要揪心的东西不是这个，孰轻孰重，她相信崔志宇的心中也有一份掂量。但是柳河览在釜山挂着，在釜山一天，崔志宇就会担心一天。心里有牵挂，很难全心全意，这也是人之常情。</p><p class="story-paragraph" data-source-key="1993:0">”难道你的河览危险，你就要抛下这边的一切进度去釜山吗？“</p><p class="story-paragraph" data-source-key="1994:0">“项目，实验成果，崔教授，主恩姐姐，你不考虑一下她们么?”</p><p class="story-paragraph" data-source-key="1995:0">伊安设想到这个可能，脸色难免就变得难看。并非首尔这边的进度离了崔志宇不行，药物转向临床之后，虽有瑕疵，但是更需要考虑的就是生产线的跟进和核心数据的保全。盯着这一块的眼睛太多，民众关心，政党争斗，暗处还有那种组织的虎视眈眈。</p><p class="story-paragraph" data-source-key="1996:0">一连串发问，问来问去，还有一句问不出口。</p><p class="story-paragraph" data-source-key="1997:0">难道河览危险，你就不危险么?</p><p class="story-paragraph" data-source-key="1998:0">但是志宇没有说话，只是平静地看着郑伊安。</p><p class="story-paragraph" data-source-key="1999:0">瞳色太浅，在信任的人面前，就藏不住许多打算。</p><p class="story-paragraph" data-source-key="2000:0">伊安的眉头皱起来,后槽牙咬很紧，她知道自己劝不住崔志宇了。</p><p class="story-paragraph" data-source-key="2002:0">拍摄场地临着海，开机的时候选了一一处风景很漂亮的地方做开机仪式。河览被宇宙带在身边，站在人群里，摄影师对焦好了比OK的姿势，她也跟着人群做出弯弯笑眼，乖的要死。这次剧组的预算拉到满，拉到的投资给力，金宇宙自己也掏腰包，食宿顶格，一连十几天的前期准备，几乎快把河览喂胖一圈。</p><p class="story-paragraph" data-source-key="2003:0">焦心的是两个经纪人，吃太好，河览的脸上都多一点肉，金多绚去找金宇宙跳脚被一句没大没小打回来，Carmen也焦虑，跟在河览身后欲言又止，她实在说不出来少吃一点这种话。</p><p class="story-paragraph" data-source-key="2004:0">河览的戏基本集中在前期，基本到十二月中旬就可以收工杀青回家。</p><p class="story-paragraph" data-source-key="2005:0">釜山的气候较首尔温和，某种程度上来说也未完全进入冬季。</p><p class="story-paragraph" data-source-key="2006:0">金宇宙和金珉周都很疼爱河览，知晓她以往大概率也没有来过釜山，闲暇时亲自带着到处逛吃逛吃。</p><p class="story-paragraph" data-source-key="2007:0">若说宇宙是某种程度上的爱屋及乌，到金珉周眼里，确实是遇到了特别合眼缘的，她很喜欢河览，发自内心的欣赏，听过一星半点小孩的过往，又怜又爱，只恨不得把她当做半个女儿养。</p><p class="story-paragraph" data-source-key="2008:0">金多绚寸步不离地跟着，身后伊安丢过来的安保也混在人群里死死的跟着，大家都提心吊胆，知晓河览之前就险些被烧死在教堂里，担心她被掳走的程度更甚。</p><p class="story-paragraph" data-source-key="2009:0">开机之后就忙起来，珉周和宇宙都是片场内外两个人，越喜欢河览，要求的就越多，力求每一帧没一镜都拉到最顶。偏心的太过。总有其他演员不满，抱怨到金多绚这里，温和点的被多绚笑笑算了，脏一点的又被她四两拨千斤地怼回去。也有不长眼的把她当做刚入行的，使唤来使唤去，颇有一种在柳河览身上吃到的瘪要在多绚身上出气回来的感觉。</p><p class="story-paragraph" data-source-key="2010:0">金多绚这个人记仇，面上不显，心里列了个小本本，人还在釜山的片场，心已经飘回首尔的名利场，准备飞机落地就去找某社爆那几个艺人的黑料。</p><p class="story-paragraph" data-source-key="2011:0">她本来就算半路出家，横着走惯了，没受过这种鸟气。</p><p class="story-paragraph" data-source-key="2012:0">归根结底，某种程度上来说，多绚和伊安算一类人，只是不同的是从小到大她都有金宇宙勒着那根关于良知的绳子，不至于疯的太过，万劫不复。</p><p class="story-paragraph" data-source-key="2013:0">诚实在某种程度上来说算金多绚的美德，骗过河览一次，就没办法骗第二次。</p><p class="story-paragraph" data-source-key="2014:0">“其实你和志宇姐姐是熟人吧?”</p><p class="story-paragraph" data-source-key="2015:0">所以在片场休息的间隙里，被这样的问题打在头上，多绚一时间说不出来任何话。</p><p class="story-paragraph" data-source-key="2016:0">因为拍戏的需要，河览只是穿着最简单的白衬衫和格子裙，朴实又清纯的样子一瞬间让她骤然想起来片场上见到的第一面。眼睛清冷冷地，直勾勾地望着她。</p><p class="story-paragraph" data-source-key="2017:0">她在这样的河览面前说不出来任何谎话，喉头滚动又滚动，手机里还藏着志宇发过来的机票信息。</p><p class="story-paragraph" data-source-key="2018:0">缓和剂的生产线最终丢到社会上招标，釜山这边有三家生物科技参投，她没有想到志宇会打着过来调查技术支撑的名号跟着评选团队一起过来。</p><p class="story-paragraph" data-source-key="2019:0">郑伊安也来了，骂骂咧咧在她kkt上吐槽一晚上崔志宇脑子有病。</p><p class="story-paragraph" data-source-key="2020:0">拦不住，没办法，亦步亦趋陪着过来，只想崔志宇平平安安，莫出差池。</p><p class="story-paragraph" data-source-key="2021:0">多绚在河览的注视下很艰难地点了点头。</p><p class="story-paragraph" data-source-key="2022:0">河览了然，没有再多问，眸子垂下去，不知在想什么。</p><p class="story-paragraph" data-source-key="2023:0">她还有一场内容要补拍，很快场务就叫到她的名字，河览将腿上搭着的毯子轻轻放到一旁，多绚犹豫许久，还是讲：“三次。”</p><p class="story-paragraph" data-source-key="2024:0">河览轻轻地偏了偏头，等她的下文。</p><p class="story-paragraph" data-source-key="2025:0">多绚突然又觉得讲不出口，但是总觉得，这一场你瞒我瞒，她置身其中，算崔志宇的共犯。她总觉得，还是得在河览面前为崔志宇说点什么，做点什么。</p><p class="story-paragraph" data-source-key="2026:0">不然她会觉得良心不安。</p><p class="story-paragraph" data-source-key="2027:0">但是多绚还是说不出口。</p><p class="story-paragraph" data-source-key="2028:0">那点事在她的嘴里沉甸甸地压着，说不出来，咽不下去。她只好讲：“许多事她瞒你，是不知该怎么和你说。”</p><p class="story-paragraph" data-source-key="2029:0">柳河览还是看着她，多绚硬着头皮，只好又讲：“姐姐应该会来釜山，也许你直接问她，她应该也不敢瞒你。”</p><p class="story-paragraph" data-source-key="2030:0">剩下一句话确实不敢说了。</p><p class="story-paragraph" data-source-key="2031:0">她爱惨了你。</p><p class="story-paragraph" data-source-key="2032:0">这句话多绚没有证据，不敢乱讲，只在心里偷偷想。</p><p class="story-paragraph" data-source-key="2033:0">场记又在那边催，多绚还是觉得很多话词不达意，有些懊恼，叹一口气。总觉得坑惨崔志宇，又觉得她活该，抽不开身陷进来。又觉得自己也活该，策划帮凶样样都是，没一个可以算得上无辜。</p><p class="story-paragraph" data-source-key="2034:0">无辜的只有河览。</p><p class="story-paragraph" data-source-key="2035:0">“你不要跑，也不要躲她，她没有恶意。 ”</p><p class="story-paragraph" data-source-key="2036:0">她断断续续，艰难万分地讲。讲之后甚至不敢看柳河览，那栋谎言堆起的高楼堪堪塌下去一半，废墟惨不忍睹，她不忍直视。</p><p class="story-paragraph" data-source-key="2037:0">河览只是站在那里盯着她。</p><p class="story-paragraph" data-source-key="2038:0">这场补拍是在海边，做了清场，整个沙滩上只有剧组里的人忙忙碌碌。蓝天碧海一望无际的景，话题沉重，就连空气也静默。</p><p class="story-paragraph" data-source-key="2039:0">场记在那边提高声音，又喊了柳河览一次。</p><p class="story-paragraph" data-source-key="2041:0">从首尔飞到釜山五十分钟，订机票的时候愁死郑伊安。</p><p class="story-paragraph" data-source-key="2042:0">崔志宇的主动请缨出乎大多数人意料，风口浪尖上，她是同崔议员关系最密切的人，许多双眼睛盯着，肉眼可见的危险。</p><p class="story-paragraph" data-source-key="2043:0">没有人知道她贸然前往的真实缘由，交头接耳的全是虎父无犬子之类的中国谚语，知晓真相的伊安和主恩听的翻白眼，崔教授欲言又止，不知道该说什么，索性又给小啾多买一个狗窝。</p><p class="story-paragraph" data-source-key="2044:0">伊安好烦，kkt上同金多绚骂一晚上，第二天起来觉得机场随处都被埋了炸弹，差点把金主恩家里的私人机征出去飞。</p><p class="story-paragraph" data-source-key="2045:0">她是最焦虑的人，到了釜山也寸步不离地贴着崔志宇。</p><p class="story-paragraph" data-source-key="2046:0">三家公司的技术评估都不过关，光速否了就要拉着崔志宇回首尔。</p><p class="story-paragraph" data-source-key="2047:0">——但是没拉动。</p><p class="story-paragraph" data-source-key="2048:0">来了首尔肯定是要去某个剧组探班的，犟种长着恋爱脑八头牛都拉不回来，郑伊安无语死，给手下人发消息给剧组安排咖啡车，权当投资方的激情应援。她从来没有觉得崔志宇事情这么多过，更没有想到过这个人在面对柳河览之前甚至会产生一种类似于近乡情怯的情绪。</p><p class="story-paragraph" data-source-key="2049:0">她搞不明白崔志宇为什么要在去片场的车上频繁的照镜子整理衣着，喷香水之前还让郑伊安提意见。</p><p class="story-paragraph" data-source-key="2050:0">一整个花孔雀开屏的样子噎的郑伊安白眼直翻，同行另一名评估员搞不懂崔志宇这么紧张的缘故，很小声问郑伊安即将要去的剧组里是不是有志宇小姐喜欢的演员。</p><p class="story-paragraph" data-source-key="2051:0">虽然出生显赫，天赋惊人，但是归根结底，也是还在追星的年龄。在首尔排偶像签售的小孩儿们都是这样的，这位研究员家里也有追星族，表示很理解，特别理解。</p><p class="story-paragraph" data-source-key="2052:0">郑伊安的嘴角抖动，很无奈，很绝望。</p><p class="story-paragraph" data-source-key="2053:0">“是吧。”</p><p class="story-paragraph" data-source-key="2054:0">她的语气很淡地认，看着波澜不惊，人已经气走好一会了。</p><p class="story-paragraph" data-source-key="2055:0">在她们飞釜山之前，多绚也发意义不明的消息，支支吾吾讲好似说错话了。</p><p class="story-paragraph" data-source-key="2056:0">没头没脑的。</p><p class="story-paragraph" data-source-key="2057:0">郑伊安没有见过柳河览，但是发自内心地开始怀疑人生，好像跟柳河览沾上关系的人疑患失心疯，她待会见到柳河览这个人的时候是不是应该站远一点。</p><p class="story-paragraph" data-source-key="2058:0">说起来自己养的那只小狗好像和这位也是前同事，她是不是也有失心疯啊？</p><p class="story-paragraph" data-source-key="2059:0">算起来从十一月中旬到十二月中旬，也不过一个月的日子而已啊！?</p><p class="story-paragraph" data-source-key="2060:0">不过一个月没有见，只是想到柳河览，志宇就忍不住胆怯起来。</p><p class="story-paragraph" data-source-key="2061:0">去之前先同宇宙取得了联系，知晓河览大半戏份已经过完，再补几个镜头就完全杀青。今天算是没什么戏份的，但是确实剧组里腾不出来人看着河览，现场主角的拍摄任务很重，所以大概率会在酒店里休息。</p><p class="story-paragraph" data-source-key="2062:0">“你去看看她吧。”</p><p class="story-paragraph" data-source-key="2063:0">金宇宙对于志宇，向来了解又贴心，只是末了又体贴询问：“要过来换一下其他的衣服么，这次你应该不会穿那些太廉价的。”</p><p class="story-paragraph" data-source-key="2064:0">无论是生意场亦或者名利场，向来都是先敬罗衣后敬人，她此行为工作，剧组探望是顺便，没有时间再扮做其他模样。</p><p class="story-paragraph" data-source-key="2065:0">Loro Piana的大衣做工考究，搭着同品牌的衬衫，着在崔志宇身上，适得又适配。这算她的衣柜中最平价的一款，也算她选了又选。</p><p class="story-paragraph" data-source-key="2066:0">只是大衣衬着瘦削板正的身形，衬衫偏偏要开两颗扣子露修长的颈和颈下两弯伶伶的骨。难得一次骚包，看傻郑伊安，吓死郑伊安。郑伊安选择把她丢到酒店门口就一溜烟跑去现场慰问演员，反正酒店周围安保密布，她不担心崔志宇在这种地方被飞车党谋杀。</p><p class="story-paragraph" data-source-key="2067:0">只是崔志宇的屏开的太过，也有点吓到柳河览。</p><p class="story-paragraph" data-source-key="2068:0">之前就从多绚的支支吾吾里猜出来志宇也许并非那种缺材缺钱的小穷狗，毕竟有的些东西是被常年的富养浸进骨子里，穷人家的小孩哪来那种清贵又适得的气质?她早该从这些细枝末节看出端倪了。</p><p class="story-paragraph" data-source-key="2069:0">是她不自量力，小狗富贵，她竟然觉得自己养得起。</p><p class="story-paragraph" data-source-key="2070:0">崔志宇有一张生的很正的脸，衣服穿板正一点，她就有凛然不可侵犯的气场。穿的随性一点，好像随便往那儿一站，也是一种非常倜傥的漂亮。柳河览嘶了嘶气，站在酒店大堂里，人来人往，目光落在崔志宇开了两颗扣子的领口，柳河览还是觉得崔志宇差了一条领带。</p><p class="story-paragraph" data-source-key="2071:0">天大的事情也要回去说，于是她主动走上前，拉了拉崔志宇的袖口。</p><p class="story-paragraph" data-source-key="2072:0">“先跟我回房间吧。”柳河览声音很轻，语气很低，“有什么事回去再说。”</p><p class="story-paragraph" data-source-key="2073:0">瞒也好，骗也好，一桩一桩慢慢说清楚，说清楚后，才好从长计议。</p></div>
