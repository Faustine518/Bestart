      <article class="chapter" data-chapter="section-02">
        <header class="chapter-header"><span class="chapter-number">02</span><h2>Chapter 02</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="265:0">哗哗的水声落到耳朵里的时候，崔志宇如梦初醒似地回过神。</p><p class="story-paragraph" data-source-key="266:0">她半耷着眼睛去拿手机，金主恩好几条未读消息挂在屏幕上。</p><p class="story-paragraph" data-source-key="267:0">论文里的数据有差错，经过反复实验推导出了正确的，通过之后接踵而至的就是下一步，她算了算时间，大概是在五天后。五天后又要泡在实验室里两个月，很命苦的样子。</p><p class="story-paragraph" data-source-key="268:0">雪绒花的气息，清冽，甘苦，盘绕在鼻尖，久久挥之不去。</p><p class="story-paragraph" data-source-key="269:0">嘎吱一声，浴室的门开了，柳河览擦着头发走出来，很自然地问她要不要去洗一下。</p><p class="story-paragraph" data-source-key="270:0">她只穿了一件宽大的短袖，白色的，纯棉质，自上而下没过腿根，两条腿笔直又纤细。脑袋上顶着毛巾，头发湿漉漉的，眼睛也湿漉漉的。</p><p class="story-paragraph" data-source-key="271:0">崔志宇僵硬地点了点头，局促地移开目光，不敢再看。</p><p class="story-paragraph" data-source-key="272:0">她几乎是逃一样地撞进了浴室。</p><p class="story-paragraph" data-source-key="273:0">没有隔离带，没有镜头，也没有片场。陈旧的小区里的小小一笼，狭小的空间里就只剩下了崔志宇和柳河览。在片场推开柳河览的时候很狼狈的射了出来，裤子上面濡湿一大片，黏糊糊的。使坏的人得逞地笑，还是用温柔又无辜的语气问怎么办啊志宇，现在你也被我弄脏了。</p><p class="story-paragraph" data-source-key="274:0">她甚至连敬语都没有用。</p><p class="story-paragraph" data-source-key="275:0">拉闸断电之后片场上的浴室是不能用了。</p><p class="story-paragraph" data-source-key="276:0">崔志宇很狼狈的拿着纸巾擦裤裆上的狼藉，柳河览比她自然，在更衣室里摸黑换好衣服走出来，轻飘飘地问所以还有地方去吗。首大有宵禁么？你要不要去我家？</p><p class="story-paragraph" data-source-key="277:0">没有给崔志宇回复的时间，柳河览轻飘飘地替她做了决定：“那就去我家吧。”她用脚尖踢了踢崔志宇的小腿，很轻快地做安排：“先去洗澡换衣服，然后姐姐请我吃关东煮。”</p><p class="story-paragraph" data-source-key="278:0">热水哗啦啦地冲下来，落在志宇的脚边，溅起小小的水花。</p><p class="story-paragraph" data-source-key="279:0">她很僵硬地清理自己，雪绒花的味道挥之不去，分明只是一瞬的气息，却好似在她的身上留下了短时间内没有磨灭的痕迹。</p><p class="story-paragraph" data-source-key="280:0">在这行里信息素算是很隐私的东西，不是熟悉到了一定的程度是不会摘下来的。这是比下了镜头还在继续做的行为更为越界的东西。</p><p class="story-paragraph" data-source-key="281:0">Alpha可以用信息素强制omega进入发情期，可是当一个omega在Alpha面前将自己的信息素释出来的时候，反而让崔志宇搞不清楚柳河览到底在想什么</p><p class="story-paragraph" data-source-key="282:0">不管了。</p><p class="story-paragraph" data-source-key="283:0">她深吸一口气，甩了甩头，将那些乱七八糟的想法甩出了脑子。</p><p class="story-paragraph" data-source-key="284:0">柳河览租住在公司附近，老式的小区和典型的鸽子笼，不算很大的房子，胜在五脏俱全。阳台上放着各式各样的花盆，正值盛夏，正是这些植物蓬蓬勃勃生长的时候。</p><p class="story-paragraph" data-source-key="285:0">崔志宇从浴室走出来的时候正看见河览靠在阳台上给这些植物浇水，知名的不知名的花开成一片，她眨了眨眼睛，恍然的，莫名的有这种很奇怪的想法。</p><p class="story-paragraph" data-source-key="286:0">——如果时间一直停在这一刻就好了。</p><p class="story-paragraph" data-source-key="287:0">在后续的，持续的很长一段时间。崔志宇会轻飘飘的想这句话。</p><p class="story-paragraph" data-source-key="288:0">人在某些特定的点上是没有办法具有前瞻性的，时下与来日之间的泾渭分明，她没有办法预知未来。</p><p class="story-paragraph" data-source-key="289:0">现下的崔志宇只是觉得这一刻很好，提着水壶懒洋洋地靠在阳台上浇花的河览很漂亮，花也开的很漂亮，温热的风吹透狭小的空间，猝然之间给了她一种微妙的错觉。</p><p class="story-paragraph" data-source-key="290:0">相依为命。</p><p class="story-paragraph" data-source-key="291:0">她好像在这个时间点，在这种狭窄又破旧的空间里，和柳河览构成了相依为命的关系。</p><p class="story-paragraph" data-source-key="292:0">“一直住在这里么？”她问出声。</p><p class="story-paragraph" data-source-key="293:0">“啊，一直住在这里。”</p><p class="story-paragraph" data-source-key="294:0">河览没有回头，直到将水浇完，探手出去，从窗棂缠绕的藤蔓间轻飘飘地掐下一朵月季递给崔志宇：“房租便宜，我才来首尔的时候就租下了。身上所有的钱也只够租下这里。”花很好看，重重叠叠的花瓣叠出一整朵柔软的花，花心是浅淡的柠檬黄，有一点像晒多了太阳的样子。崔志宇垂着眼睛盯了很久，迟钝地，小心地将那朵花接过来，小心地捧住了。</p><p class="story-paragraph" data-source-key="295:0">“什么品种？”</p><p class="story-paragraph" data-source-key="296:0">“克莱尔奥斯汀。”柳河览用很轻快的声音回答她，“房东留下来的，只不过刚开始的时候很娇贵，蔫了很长一段时间，我还以为养不活了。”</p><p class="story-paragraph" data-source-key="297:0">歪了歪脑袋，崔志宇笨笨地讲：“养的很好。”</p><p class="story-paragraph" data-source-key="298:0">她不是善于言语的人，捧着花小心翼翼的样子逗笑柳河览。</p><p class="story-paragraph" data-source-key="299:0">“准备做成标本吗？这么小心地捧着。”</p><p class="story-paragraph" data-source-key="300:0">崔志宇眨眨眼睛：&quot;这是河览给我的第一个礼物。”</p><p class="story-paragraph" data-source-key="301:0">她的手掌摊平，柔软又温存的态度。小小的花以一种坦然的姿态呈在她的掌心。湿漉漉的发梢被风吹过晃起小小的弧度，浅珀色的眼睛透亮干净，一瞬不瞬地盯着河览。</p><p class="story-paragraph" data-source-key="302:0">“因为是你给我的礼物，所以要用很好的、很郑重的态度收起来。”</p><p class="story-paragraph" data-source-key="303:0">“收到哪里呢——？”柳河览用拉长的声音就这么问住崔志宇，略显迟钝地皱了皱眉，崔志宇小声开口：“柜子里。”</p><p class="story-paragraph" data-source-key="304:0">风干做成书签也好，裱进玻璃相框里做标本也好。因为是河览从窗棂的藤蔓上折下来送给她的花，所以不管怎么样也要好好的放好。</p><p class="story-paragraph" data-source-key="305:0">其实花有很多，河览把这一株很难伺候的月季顾的很好。她前几年来首尔闯荡，风雨飘摇的咬着牙熬过了几年，就算现在闯入了很奇怪的很糟糕的环境，她也把自己照顾的很好。</p><p class="story-paragraph" data-source-key="306:0">“说起来姐姐你呢？怎么想起来干这行了。”</p><p class="story-paragraph" data-source-key="307:0">轻飘飘地从矮凳上跳下来，河览也学崔志宇歪着脑袋的样子提问：“我是因为她们骗我说进公司可以做偶像所以就稀里糊涂的签了字，姐姐的皮囊很漂亮，也是这么被骗进来的吗？”</p><p class="story-paragraph" data-source-key="308:0">问题来的太突然，猝然让崔志宇的舌头打了结。</p><p class="story-paragraph" data-source-key="309:0">她迟疑了一下才说：“来钱快。”</p><p class="story-paragraph" data-source-key="310:0">小心翼翼的，很小声的这么讲了。底气有一点点不足，眼神也有一点点飘。</p><p class="story-paragraph" data-source-key="311:0">“哎？”柳河览很惊讶地问，“是遇到了什么困难么？”</p><p class="story-paragraph" data-source-key="312:0">嗡嗡的，手机震动了起来，金主恩发的消息，崔志宇不得不暂停对话拿起手机去看。原来是被通知实验推后了，因为有几个很关键的试剂目前整个首尔区是处于断货状态，需要从其他的地区采买。</p><p class="story-paragraph" data-source-key="313:0">她放下手机，眼前还是柳河览很惊讶的神色。河览好像不能接受这种很敷衍的理由，所以崔志宇就很认真地讲：“因为做实验的材料很贵，我家里穷，教授抠，不能让搭档一个人出钱。”</p><p class="story-paragraph" data-source-key="314:0">她语气真挚，表情也真挚，真挚到柳河览从这个人的脸上找不出一丝裂缝可言。</p><p class="story-paragraph" data-source-key="315:0">——原来是和她一样可怜的小苦瓜。</p><p class="story-paragraph" data-source-key="316:0">河览喔——了一声，不再追问下去。</p><p class="story-paragraph" data-source-key="317:0">闲闲聊聊的时候，最后一丝晚霞也氲入夜色。夜风带着些燥气，不知不觉，两个人的头发也干了大半。河览的肚子不适时地咕咕叫起来。</p><p class="story-paragraph" data-source-key="318:0">“嗤”一声，她听到崔志宇笑出来，“要出去吃么？”</p><p class="story-paragraph" data-source-key="319:0">“吃完了你还有钱买那些试剂么？”柳河览也忍不住笑出来。</p><p class="story-paragraph" data-source-key="320:0">“上次结算给的钱还剩很多。”崔志宇说。她把脑袋上顶着的毛巾拽下来，很自然地伸手，去攥住河览的手腕，“够你吃关东煮到饱。”</p><p class="story-paragraph" data-source-key="321:0">崔志宇沉着眼，很轻地又讲:“其他的，你想要吃的，都可以吃到饱。”</p><p class="story-paragraph" data-source-key="322:0">小区的旁边就是很热闹的商业区，商业区往下走一点便是小吃街。五花八门的摊贩聚在一起吆喝，崔志宇买东西不眨眼睛，花钱如流水，看的柳河览心惊胆战。</p><p class="story-paragraph" data-source-key="323:0">没多一会河览就感觉有一点吃不住。</p><p class="story-paragraph" data-source-key="324:0">章鱼丸子也很好吃，奶茶也很好喝，包括路边她多看了一眼但是没什么感觉的烤芝士崔志宇也买下来，看她咬两口就不想吃就自然而然接过来塞进自己嘴巴里。自然而然又自然过头，河览后知后觉发现自己已经被对方牢牢地牵住了，用十指相扣的方式。</p><p class="story-paragraph" data-source-key="325:0">她烫到似地移开眼光，心脏莫名其妙跳的有一点点快。</p><p class="story-paragraph" data-source-key="326:0">两个人都是漂亮的人,一路上都有经纪公司的星探过来递名片，有做演员的有进公司当练习生的，柳河览摆着手拒绝的时候崔志宇却拿着名片开始认真地看，比较之后摇了摇头，看上去有一点遗憾的样子。</p><p class="story-paragraph" data-source-key="327:0">其实她的皮囊做演员也没有差，话剧演员也好电视剧演员也好，说不定上了荧幕就火遍江南江北。柳河览的嘴巴里塞着章鱼丸子，余光偷偷地瞥崔志宇，有没有忍住想崔志宇如果是电视剧演员会演什么片？</p><p class="story-paragraph" data-source-key="328:0">她不觉得崔志宇是被拯救的女仆或者公主，她认为崔志宇应该是骑着白马提着宝剑冲到城堡里去解救女主角的王子。</p><p class="story-paragraph" data-source-key="329:0">“辞职吧？”突然地，河览就这么讲了。</p><p class="story-paragraph" data-source-key="330:0">她说出来这句话的时候自己都觉得惊讶，可是潜意识里就是这样认为的。首大的医科生再怎么样拮据也不应该被以这种形式被抬到屏幕上。崔志宇的皮囊太漂亮，这样的人拍出来很火的色情片是很常理之中的事情，但是片子火了人就毁了。</p><p class="story-paragraph" data-source-key="331:0">没有医院会录用做过色情片演员的医生，没有其他的选择，崔志宇这辈子可能都会被钉死在这条路上。</p><p class="story-paragraph" data-source-key="332:0">崔志宇的路很长，她不应该因为一时的拮据折在这里。</p><p class="story-paragraph" data-source-key="333:0">“辞职了，然后呢？”</p><p class="story-paragraph" data-source-key="334:0">崔志宇盯着柳河览，没什么表情，等着她说下文。</p><p class="story-paragraph" data-source-key="335:0">她突然觉得柳河览傻乎乎的，明明在片场上三两句话就能把自己堵的开不了口，现在又握着自己的手很认真地讲你辞职吧。自身难保的境地里还要考虑其他人的未来，这样的人活的很辛苦。可是她不希望柳河览辛苦。</p><p class="story-paragraph" data-source-key="336:0">她有一点点想柳河览自私一点。</p><p class="story-paragraph" data-source-key="337:0">柳河览眨了眨眼睛：“我养你。”</p><p class="story-paragraph" data-source-key="338:0">轻飘飘的三个字，柳河览说的好认真。她的手被崔志宇轻轻地握着，十指交扣的姿势，很真挚的抬头看着崔志宇。</p><p class="story-paragraph" data-source-key="339:0">她比崔志宇矮一点，两个人离很近，垫垫脚刚好能够啄到嘴巴的距离。</p><p class="story-paragraph" data-source-key="340:0">崔志宇移开目光，轻轻地咳了一声。</p><p class="story-paragraph" data-source-key="341:0">“前面好像有卖关东煮的。”她扯开话题，很轻很轻声地问柳河览，“去坐坐？喜欢炖萝卜还是溏心蛋？”</p><p class="story-paragraph" data-source-key="342:0">很明显的不想继续这种话题了，聪明一点的人应该听的出来。柳河览听出来了，但是她犯倔的时候是很固执的，分明是小兔子的长相，但是骨子里更像一头倔强的小驴子，面前一堵墙摆在那里，不撞个鼻青脸肿是不愿意回头的 。</p><p class="story-paragraph" data-source-key="343:0">“你不要干这个了好不好。”</p><p class="story-paragraph" data-source-key="344:0">她被崔志宇拉着往前走，突然就好小声的这么讲了。</p><p class="story-paragraph" data-source-key="345:0">我养的起你，你好好读书，以后才好光明正大的，顺遂的往下走。</p><p class="story-paragraph" data-source-key="346:0">“听过清姬的故事么？”突兀地崔志宇这么问她。</p><p class="story-paragraph" data-source-key="347:0">她们走到了关东煮的摊贩面前，昆布汤的香气飘出来，丝丝缕缕的，勾着鼻尖。各色食材被铁质的宫格隔开，崔志宇很认真地选着要吃的东西，眼睫往下垂，莫名便让柳河览在她脸上看到了一种诡异的悲悯。 她不知道这种悲悯的情绪从何而来，听到崔志宇这么问也本能的点头。忘了是在哪本书上看到的，但是也记得大致内容。</p><p class="story-paragraph" data-source-key="348:0">夜宿于旅店的年轻僧人安珍与老板清姬一见钟情，在发生了关系之后。已是佛祖遗弃之身的安珍对清姬产生了恐惧。扔下还会回来的诺言之后就头也不回地离清姬而去了。</p><p class="story-paragraph emphasis" data-source-key="349:0">“我希望你能够过的好一点。”崔志宇从老板手里接过碗，递给柳河览，“自私一点也没有关系。”她垂着眸子，看着茶色的汤底里边的影影绰绰，尽量用很平静的语气把话讲简单一点，“我不知道可以用什么来交换你的……善良。”</p><p class="story-paragraph" data-source-key="350:0">因偿果报，世间常理。通常也是拿有的换要的，只是崔志宇未曾想过有朝一日会有一种赤条条的善意摆在自己面前，看上去轻飘飘的，却是她无法伸手去坦然地接过来的东西——那是看上去一无所有的柳河览将自己的手掌摊开呈在她面前的东西。</p><p class="story-paragraph" data-source-key="351:0">在崔志宇的平静和柔软面前，河览突然发现自己什么话都说不出来了。她埋头往嘴里送了一块萝卜，萝卜应该在汤里泡了很久，吸足了汤汁，又炖得软烂，汁水在口腔里迸开的刹那她觉得眼睛里也蒙了一层薄薄的水雾——在她的意料之中，她被崔志宇拒绝了。</p><p class="story-paragraph" data-source-key="352:0">一无所有的人怎么可以轻易的对着另一个人泛滥善心？</p><p class="story-paragraph" data-source-key="353:0">可是难得一次的善心泛滥被崔志宇用轻飘飘的态度拒绝了。</p><p class="story-paragraph" data-source-key="354:0">难过的情绪上泛的太快，须臾间喉咙里似堵了一块浸足水的棉花。可是好奇怪，明明崔志宇也只是一个见面次数小于三的路人甲而已。她在崔志宇读高中考大学的时候就来首尔混了，住着老破小在各种各样的工作里摸爬滚打，像刺猬一样蜷缩起来牢牢地护住自己柔软的腹部，明明在遇见崔志宇之前的梦想是尽快攒够违约金解约离开那个烂公司，运气好的话攒钱把这个老破小买下来彻底做自己的家。可是怎么就，怎么就？筷子无意识地戳破碗里的竹枝丸，柳河览有些失魂落魄地想：怎么会在听到没钱两个字从崔志宇口中说出来的时候，她就会有想要把这个路人甲养在家里供到毕业的念头呢？</p><p class="story-paragraph" data-source-key="355:0">她想不出来原因，有一点烦躁，皱眉瘪嘴的样子看上去就像要哭了。</p><p class="story-paragraph" data-source-key="356:0">可是鬼使神差的她还是开口：“不然，不然和我一起住吧？</p><p class="story-paragraph" data-source-key="357:0">虽然房子很小，但是容得下两个人，不是么？</p><p class="story-paragraph" data-source-key="358:0">大学里的住宿费很贵，能省一笔是一笔。</p><p class="story-paragraph" data-source-key="359:0">河览的脑子里翻滚着很多念头，一点一点的挤出来，发现自己有无数的可以说服崔志宇的理由。可是到最后一句也说不出口，只是干巴巴的询问被她说出来的时候也很快，快到中途不小心咬了一下舌头，所以才打了一下结。</p><p class="story-paragraph" data-source-key="360:0">红着眼睛瘪着嘴的样子可怜巴巴的。</p><p class="story-paragraph" data-source-key="361:0">崔志宇没来由地这么想。</p><p class="story-paragraph" data-source-key="362:0">手机持续不停的震动，嗡嗡作响。</p><p class="story-paragraph" data-source-key="363:0">金主恩还在给她发消息，抱怨实验的延后，那个试剂过于稀少，就算是从济州岛和釜山那边采买也要等到十天以后才到。进度延迟对于这场实验来说不是好事。十天算是多出来的时间，崔志宇倒是可以自己安排——崔志宇低头下去，很快的在手机屏幕上打字，跟金主恩讲这十天自己不会回学校。准备事宜可以打视频开会议，有事没有多发邮件沟通。</p><p class="story-paragraph" data-source-key="364:0">金主恩：？</p><p class="story-paragraph" data-source-key="365:0">很快她就发消息过来，问崔志宇真是不是得了失心疯。</p><p class="story-paragraph" data-source-key="366:0">可能是吧，不是失心疯也是其他的病。</p><p class="story-paragraph" data-source-key="367:0">把手机放回衣兜里的时候崔志宇轻飘飘地想，好像从在朋友那里看到荧幕上的河览的时候她的人生就已经开始出现轻微的偏轨了。</p><p class="story-paragraph" data-source-key="368:0">她发现自己好像没有办法对河览心硬起来，只要河览露出那种委屈的样子她就会想到之前这个人在片里无助又瑟缩的样子，这种模样很容易让人起怜惜的心绪。会有不顾一切的想要保护她的冲动——雾蒙蒙的看着镜头的河览的的眼睛，和沉默着低头下去吃碗里的关东煮的河览，不管是什么样的河览她都不愿意见到对方失落和难过的模样。是怜惜吧？应该是骨子里的那种的悯弱的坏毛病又发作了。</p><p class="story-paragraph" data-source-key="369:0">只是不知道金主恩看到自己这个样子会怎么想。</p><p class="story-paragraph" data-source-key="370:0">她只记得金主恩知道自己签了色情艺人的兼职合同之后表情都快崩裂了。如果现在知道了她不回学校的原因可能也会露出比当初还要崩裂的表情。姿态高傲的崔志宇也会为了成全某个人的善心而去扮演一只无家可归的可怜小动物么？</p><p class="story-paragraph" data-source-key="371:0">她眨着眼，想到这句没有厘头的话语，笑出声音。转念一想小时候和朋友玩的时候讲说谎的人会吞一千根针。种下了一千根针的因就要偿还一万根针的果。如果因是此刻，果又在何处？轻飘飘的崔志宇就这么想。如果能够让河览露出没有那么失落的神色，哪怕是十万根，百万根，甚至是千万根针的果。</p><p class="story-paragraph" data-source-key="372:0">——她也可以接受吗？没有思考出真正的答案，却先一步地给出了答复。</p><p class="story-paragraph" data-source-key="373:0">“那就麻烦了。”</p><p class="story-paragraph" data-source-key="374:0">她很痛快地答应了。</p><p class="story-paragraph" data-source-key="375:0">大三，大四，离毕业还算遥遥无期。如果真心想麻烦的话可以麻烦河览很久。</p><p class="story-paragraph" data-source-key="376:0">崔志宇竟然能够想到这一句话，将笑不笑地弯了弯眼睛，没来由地想起来很小的时候在街头看到的可怜人。那时候是怎么做的来着？好像把自己身上所有钱都给对方了。可是首尔的冬天还是太冷，没过多久崔志宇就在听说了那个流浪的年轻女人冻死街头的事。尸体被抬走处理，她没有再路过过那个街道，路过就会想到那个女人接过钱的时候对自己发自内心真挚地说谢谢。</p><p class="story-paragraph" data-source-key="377:0">明明没过多久就会开春。</p><p class="story-paragraph" data-source-key="378:0">可是纵然是开春，可怜人也是救不完的，街头上流浪的小猫小狗很可怜，卖火柴的小女孩很可怜，无家可归的老人很可怜，冻死街头的女人很可怜，柳河览也很可怜。</p><p class="story-paragraph" data-source-key="379:0">她想到柳河览的时候思绪轻微地顿了顿，不动声色地调整了称谓。</p><p class="story-paragraph emphasis" data-source-key="380:0">我的柳河览也很可怜。</p><p class="story-paragraph" data-source-key="381:0">她用居高临下的姿态评判一切，怜悯一切，却又在被她可怜的对象眼里看到另外一种翻涌的情绪——柳河览好像在很小心的维护她的自尊心，担心她的前途。</p><p class="story-paragraph" data-source-key="382:0">她在无知无觉的情况下被柳河览怜惜了。</p><p class="story-paragraph" data-source-key="383:0">该怎么回应？</p><p class="story-paragraph" data-source-key="384:0">崔志宇的声音很低，可怜巴巴语气：“实验要推迟到十天以后，实验室这段时间不开放。以前一直可以在实验室的休息室里睡觉，但是这段时间不可以了。</p><p class="story-paragraph" data-source-key="385:0">她在柳河览的看过来的眼神里摆出令人怜悯的姿态，不是她擅长的，但是还是这么摆出来了。</p><p class="story-paragraph" data-source-key="386:0">没有想到这次对方竟然会答应，柳河览噎了一下，崔志宇伸手去帮她拍背。不同于在片场上的状态，私底下的河览的身上有一种很无害的气质，眼睛溜圆，眼神也湿漉漉的。气质干净的人身上有一种很微妙的柔韧感，这种柔韧感是很难得得东西，磨难千回百转，她亦也生生不息，兀自挺立。</p><p class="story-paragraph" data-source-key="387:0">崔志宇看的出神，总觉得心里分化出来了两个小鬼，一个垂眸悲悯众生地讲你要拖累柳河览了，另一个咧着嘴笑的好恶劣，尖锐地嘲笑崔志宇好像要走向设想之外的道路了。</p><p class="story-paragraph" data-source-key="388:0">某种程度上来说崔志宇是一个很矛盾的人。</p><p class="story-paragraph emphasis" data-source-key="389:0">她怜悯众生，力所能及拯救众生，又在牵扯建立之前避之不及的躲开</p><p class="story-paragraph" data-source-key="390:0">向来如此的风格，凭什么要因为柳河览有所变动呢？她钝钝地想。对啊，凭什么。</p><p class="story-paragraph" data-source-key="391:0">她没有办法给自己的行为找理由了，有的事情想到了就理所当然的做了，太顺理成章了，不似以往，不像自己了。</p><p class="story-paragraph" data-source-key="392:0">可是就算这样也这么做了。</p><p class="story-paragraph" data-source-key="393:0">湿漉漉的样子像被淋湿的小狗，没来由的柳河览就这么觉得。</p><p class="story-paragraph emphasis" data-source-key="394:0">明明自己也快到活不下去想跳楼的程度了，她还是觉得这只小狗很可怜。</p><p class="story-paragraph emphasis" data-source-key="395:0">头顶的灯明晃晃的照下来，脚边的影子被无声无息地拉长。</p><p class="story-paragraph emphasis" data-source-key="396:0">喉头动了动，咕噜一下，河览把食物咽下去了。</p><p class="story-paragraph" data-source-key="397:0">崔志宇盯着她，犹豫了片刻，侧身去找关东煮店的老板要了笔和纸。她在柳河览不解的目光下打开了自己的钱包，抽出一张银行卡。刷刷地将密码写在纸上，连同银行卡一起推过去。</p><p class="story-paragraph" data-source-key="398:0">——首尔大学的奖学金会打在这张卡上，情色公司给她结算的片酬也会打在这张卡上。</p><p class="story-paragraph" data-source-key="399:0">“…住宿费。”她声音很轻地，小声地讲，“不是很多，但是以后的日子拜托河览了。”</p><p class="story-paragraph" data-source-key="400:0">对于普通学生来讲，这几乎算得上是托上身家的交付。</p><p class="story-paragraph" data-source-key="401:0">薄薄的一张卡，被她用郑重的态度推过去。太庄重太沉重，恍然间就让她有了已经把整个的自己托付给了河览的错觉。分明只是单纯的，单向的钱货两清的交易而已。</p><p class="story-paragraph" data-source-key="402:0">“所以要搬出去？”</p><p class="story-paragraph" data-source-key="403:0">听到这件事的金主恩有一点不可置信地问到。</p><p class="story-paragraph" data-source-key="404:0">实验暂停的日子里，正常的课前课后依旧按部就班，崔志宇也没有依照她讲的那样任性到连学校里的课都不来上了。</p><p class="story-paragraph" data-source-key="405:0">在繁忙而巨大的课业压力面前住校其实是最好的选择。</p><p class="story-paragraph" data-source-key="406:0">况且崔志宇这个人本来就及其享受个人空间，几乎就是独来独往的性格。让金主恩陪着去退单人宿舍这种事情说出来都快跌破金主恩的眼镜。</p><p class="story-paragraph" data-source-key="407:0">她有点不知道该怎么办，索性打通了金多绚的电话。</p><p class="story-paragraph" data-source-key="408:0">对方倒是很快就赶过来了，明显是看热闹不嫌事大的性子，金多绚笑盈盈地讲看样子确实是有一点爱上了呢。</p><p class="story-paragraph" data-source-key="409:0">毕竟是作为柳河览的经纪人，充分见识过河览的貌美和善良，所以大度地对志宇的失心疯行为表示理解。</p><p class="story-paragraph" data-source-key="410:0">但是实则是崔志宇的发小，因为实在太无聊所以找了个假身份跑去这种公司做经纪人，倒是没有想到八面玲珑的性格很得公司领导的赏识，很快就有了自己单独带着的艺人——但是签下柳河览也只是意外。</p><p class="story-paragraph" data-source-key="411:0">性格太刚直的艺人是需要八面玲珑的经纪人兜底。被骗来签这种霸王条约的艺人很多，柳河览是最难搞定的一个。</p><p class="story-paragraph" data-source-key="412:0">多绚笑眯眯地应下了老板丢过来的任务，见到河览之前甚至在心里做过预想，威慑这些艺人的手段蛮多，浓缩起来不过哄拐骗吓四个字。她见得多，自然也蛮熟悉。</p><p class="story-paragraph" data-source-key="413:0">其实多绚不缺这一份工作带来的提成，只是觉得柳河览被合约骗的惨惨的。明明只以为是进公司做练习生，出不出道的之后再说。结果签下合同之后才发现是要去拍那种东西。就算是这样也以坦然的态度接受了现况，只是在片场上不自觉地陷入僵直状态的柳河览太可怜了，蒙着水雾也会对着多绚讲那我就尽快拍很多凑够违约金赶紧解约的样子也太可怜了。</p><p class="story-paragraph" data-source-key="414:0">太可怜又很坚强的小白花倒是让金多绚想到了崔志宇，恰好也是漂亮的青梅竹马，说不定看到河览会有奇怪的怜惜的心情。</p><p class="story-paragraph" data-source-key="415:0">游走在两个阶层之间的多绚在想到志宇的时候又很轻飘飘地想到了一个词语，叫做一念之间。</p><p class="story-paragraph" data-source-key="416:0">也许只是崔志宇的电光火石的一念之间，说不定这个可怜巴巴的柳河览可以过的好一点。</p><p class="story-paragraph" data-source-key="417:0">她笑眯眯地给易感期里的崔志宇放了那部没有流出去的影片之后又对着蹙着八字眉的竹马笑眯眯地讲怎么办啊，看上去好可怜的样子。</p><p class="story-paragraph" data-source-key="418:0">你要救救她吗？</p><p class="story-paragraph" data-source-key="419:0">圣人病也好骑士病也罢，悲天悯人的从小就在教堂里跳着芭蕾被神父和修女们捧在手心里的崔志宇有着世界上最善良的底色。</p><p class="story-paragraph" data-source-key="420:0">其实一开始也只是想着把这个人套进公司做柳河览的固搭熬到合约期结束而已。</p><p class="story-paragraph" data-source-key="421:0">现在——</p><p class="story-paragraph" data-source-key="422:0">金多绚还是笑眯眯的，手指撑着腮，漫不经心地看着金主恩见了鬼的表情。</p><p class="story-paragraph" data-source-key="423:0">她轻轻地在心里想。</p><p class="story-paragraph" data-source-key="424:0">如果知道引以为傲的女儿好像爱上了情色影片制作公司里的演员，甚至要搬去那种老破小的地方和别人同居——作为罪魁祸首的她大概会被自己的父亲还有那位崔议员打死吧。</p><p class="story-paragraph" data-source-key="425:0">毕竟本身就是很奇怪的事情。</p><p class="story-paragraph emphasis" data-source-key="426:0">若非金多绚的一时兴起，作为财阀和政世结合而诞下的产物，生于云端之上的崔志宇是没有接触到柳河览的机会的。</p><p class="story-paragraph" data-source-key="427:0">“喜欢的话就养成你一个人的就好了呀。”</p><p class="story-paragraph" data-source-key="428:0">多绚的思维从来简单而粗暴，某种程度上来说也算是干这一行搞出来了些奇怪的经验。倒是还记得老板跑来问她崔志宇的崔到底是哪个崔的时候的表情。全世界也只有崔志宇会这么坦荡地把自己的真实姓名写进简历里交进灰色产业的公司了。</p><p class="story-paragraph" data-source-key="429:0">“不是喜欢。”下意识地就这么反驳了。几乎是下意识地皱了皱眉头，崔志宇声音很小地补充了一句，“河览也……”</p><p class="story-paragraph" data-source-key="430:0">她顿了顿，声音很轻:“也不是我的。”</p><p class="story-paragraph" data-source-key="431:0">失态是一瞬间的事情，崔志宇很快地就恢复了常态。不知道该怎么解释这种奇怪的决定。只是很快地办理了退宿。</p><p class="story-paragraph" data-source-key="432:0">金主恩站在外面等她，看到两个人走出来，狭长的眼睛里也无言地，明晃晃的写着复杂的情绪，她和金多绚对视一眼，不约而同地从对方眼里读到了崔志宇疯了这句话。</p><p class="story-paragraph" data-source-key="433:0">“你还是买个烤箱带过去吧。”</p><p class="story-paragraph" data-source-key="434:0">破罐子破摔着 ，金主恩提出来这种建议。</p><p class="story-paragraph" data-source-key="435:0">崔志宇不爱吃甜食但是热爱梦色糕点师，小时候就有过离家出走去做糕点师的梦想。考上首大之前的暑假甚至真的跑去甜品店做学徒，还会心血来潮在为数不多的休息时间里满世界飞着到处收集那些极具当地风情的甜味食谱。</p><p class="story-paragraph" data-source-key="436:0">因为聪明执行力又强，做出来的东西大概好吃到开店都可以上当地推荐到程度。</p><p class="story-paragraph" data-source-key="437:0">学业也好抽着课空去研究的甜点也罢。</p><p class="story-paragraph" data-source-key="438:0">正是因为是崔志宇好像什么都能做到无懈可击的程度</p><p class="story-paragraph" data-source-key="439:0">课业压力太重的时候崔志宇会做各种各样的甜点投喂给金主恩解压，在柳河览出现之前这个东西一直就是金主恩独享的。</p><p class="story-paragraph" data-source-key="440:0">但是竟然，竟然。</p><p class="story-paragraph" data-source-key="441:0">金主恩想到上一次崔志宇垂着眼睛从完整的蛋糕上切出一角放进精致的包装盒里冻进冰箱，知道这是带给那个情色片场上的搭档的见面礼之后。</p><p class="story-paragraph" data-source-key="442:0">——说真的金主恩真的认为天塌就在一瞬间。</p><p class="story-paragraph" data-source-key="443:0">崔志宇的脑子里好像真的长了奇奇怪怪的东西，她是真的不想因为这个人的疯病发作然后从此断绝自己的口福。</p><p class="story-paragraph" data-source-key="444:0">生活够苦了。</p><p class="story-paragraph" data-source-key="445:0">金多绚的眼角抽了抽，在表情崩坏之前及时换上得体的微笑。</p><p class="story-paragraph" data-source-key="446:0">“那我买个烤箱送过来。”她的声音还是松松快快的，又漂亮又明朗。崔志宇的目光投过来，她也笑着，“搬家至少也需要乔迁礼吧。”</p><p class="story-paragraph" data-source-key="447:0">五脏俱全的鸽子笼难道能够容得下那种嵌入式烤箱吗？其实很想反问面前两个人这句话。但是崔志宇也只是轻轻地摇摇头拒绝了金多绚的提议，她的行李很简单，小小的一个箱子装满全部。</p><p class="story-paragraph" data-source-key="448:0">和河览约定好了办完退宿上完课就会折回小鸽子笼里一起吃饭，想到这里她的嘴角没有忍住往上弯了弯，难得提议:“你们要一起去吗，看看我住的地方。”</p><p class="story-paragraph" data-source-key="449:0">“我去会穿帮啦，河览很讨厌说谎的人的，知道你骗她一定会把你扇成猪头。”笑眯眯地，金多绚还是提醒道，“所以在河览面前一定要和我装不熟啦。是Stella不是你的多绚儿，一定要记清楚。”</p><p class="story-paragraph" data-source-key="450:0">她无视着身后的金主恩投过来的强烈的、怨念的眼神，勾着嘴角笑:“总之等到机会成熟的时候一定会登门拜访，但是不是现在。”</p><p class="story-paragraph" data-source-key="451:0">崔志宇不是很热情的性格，也没有强求别人的习惯。面对金多绚的提醒她只是松松地点了点头，很简单地讲那就在公司见吧Stella nim，希望下次见面的时候河览的身边已经没有其他乱七八糟的alpha了。</p><p class="story-paragraph" data-source-key="452:0">志宇说话的时候不管是语气或者是腔调都很轻柔，气定神闲的提过分的要求。看上去很温柔但是真的有一点也不顾他人的死活。这种理所当然的气态确实是崔志宇这种含着金汤匙出生的小孩独有，从出生到现在为止只要是她想要的甚至不需要勾勾手指，眼神多停留一秒就会有这样或者那样的人打着哈哈双手奉上。</p><p class="story-paragraph" data-source-key="453:0">她甚至不需要关注过程，所以可以把事情以理所当然的态度想过于简单。那份苛刻的合约里除却大额度的回扣甚至还有以片数作为结算的条款，如果真的按照崔志宇讲的那样去办，无片可拍的柳河览甚至会处于一种负收入的状态。活在众人的掌心之上的，站在象牙塔里的崔志宇，就算是奉行着普度众生的信念，其实还是看不到细枝末节。所以从另一个角度来看，这种柔软又直率的善良，更像是另一种高高在上的怜悯和施舍。</p><p class="story-paragraph" data-source-key="454:0">“河览要吃饭的啊大哥。”金多绚抓抓脑袋很苦恼地反驳，“不然让carmen姐姐多帮你接几个本子吧，你多去操几个omega，然后结算全部打到她的卡上。”</p><p class="story-paragraph" data-source-key="455:0">惊世骇俗的话就这么风轻云淡地从金多绚的嘴巴里蹦了出来。</p><p class="story-paragraph" data-source-key="456:0">金主恩只觉得自己的眼尾跳了跳，嘴角抽了抽，后知后觉金多绚在说什么混蛋话惊得就连太阳穴也突突跳动了起来。 她艰难地张张嘴巴，指指自己又看看崔志宇，一时间话都不知道该怎么说了。</p><p class="story-paragraph" data-source-key="457:0">但是崔志宇依旧气定神闲的，好似早就已经习惯了金多绚这样。</p><p class="story-paragraph" data-source-key="458:0">怎么办好绝望感觉这个世界都已经癫掉了。</p><p class="story-paragraph" data-source-key="459:0">“不是不可行。”让金主恩更绝望的话也出现了，崔志宇抱着手臂，很轻地蹙着她的八字眉思考，“但是好像精力会跟不上，课业会被耽误。”</p><p class="story-paragraph" data-source-key="460:0">啊c8这个狗崽子到底知道她在说什么吗？</p><p class="story-paragraph" data-source-key="461:0">脾气温良的主恩头一次感觉自己到了爆发的边缘，感觉再多听一秒下去她的巴掌就会随机刷新在崔志宇或者金多绚的脸上。所以她不得不开口打断:“我饿了。”</p><p class="story-paragraph" data-source-key="462:0">作为三人里面年龄最小的一位，主恩的很多东西自然都是被两位姐姐放在最首位的。深知崔志宇较真的性格可能真的会去找自己的经纪人多接片子，金多绚重重地翻了个白眼:“河览的工资我去想办法啦，你别想这件事的可行性。”</p><p class="story-paragraph emphasis" data-source-key="463:0">“所以现在最重要的事情是我先带主恩去吃饭。”</p><p class="story-paragraph" data-source-key="464:0">在事前就已经向公司的老板透露过崔志宇的来历，严肃讲过这个人在片场的所有拍摄不能流露出去半分。就算需要流入市场也不能露脸。需要注意的地方太多，能够做到的就只有少拍固搭，把量卡在可以控制的数量范围内。</p><p class="story-paragraph" data-source-key="465:0">如果真的多拍几部还是和不同的人还流到了网上，她甚至不敢想如果崔议员看到这种东西自己的死况会有多么凄惨。反正也只是很无趣才去做的工作干脆下次直接把工资卡变成柳河览的卡号好了。就这么胡思乱想着金多绚听到了崔志宇笑出声音，大概真的是是被逗到了好笑的点上，崔志宇的声音很轻:“我把奖学金结算的那张卡给河览了。”</p><p class="story-paragraph" data-source-key="466:0">大概某种意义上来说真的算是交付身家了。</p><p class="story-paragraph" data-source-key="467:0">这张卡金多绚知道，是崔志宇填表时候用的惯用卡号。无论是学术竞赛还是其他乱七八糟的比赛、心血来潮的跑出去做的乱七八糟的兼职的酬劳，只要有和崔志宇个人相关的流水都是在这张卡上。</p><p class="story-paragraph" data-source-key="468:0">她不缺钱，从小到大长辈们因为爱怜随手给的零花钱也一丝不苟地存在里面，很大的一笔数额，够柳河览好长一段时间躺的很平。</p><p class="story-paragraph" data-source-key="469:0">这应该是崔志宇身上的唯一一笔，和崔家没有任何关系的财产。</p><p class="story-paragraph" data-source-key="470:0">只是很轻飘飘的一句话，却同时让金多绚和金主恩愣在原地。</p><p class="story-paragraph" data-source-key="471:0">想过也许只是崔志宇的一时兴起，却没有想过这个人竟然会将这张意义非凡的卡交付出去。</p><p class="story-paragraph" data-source-key="472:0">预约的出租车到了，崔志宇轻轻地冲多绚晃了晃手，提着箱子钻进车里去了。</p><p class="story-paragraph" data-source-key="473:0">小车绝尘而去，留下两个呆若木鸡的人面面相觑。</p><p class="story-paragraph" data-source-key="474:0">良久金主恩才开口:“我觉得她真的疯了。”</p><p class="story-paragraph" data-source-key="475:0">金多绚无言以对，堆起来的笑一点点的垮下去，直到再也笑不出来。</p><p class="story-paragraph" data-source-key="476:0">明明是崔志宇介入了柳河览的因果，但是怎么回事呢，好像需要她去奔波的事情也开始变多了。</p><p class="story-paragraph" data-source-key="477:0">嘴巴动了动，明明想用很调侃的语气讲主恩啊好像要恭喜你有漂亮的嫂子了。</p><p class="story-paragraph" data-source-key="478:0">但是心脏沉沉地跳动着，她竟然说不出来任何话。</p><p class="story-paragraph" data-source-key="479:0">良久金多绚才听到自己的声音，轻轻的，又凝重又丧气:“可能是吧。”</p><p class="story-paragraph" data-source-key="480:0">她有一点后悔让崔志宇看到柳河览了。</p></div>
      </article>
    </template><template id="section-03">
      <article class="chapter" data-chapter="section-03">
        <header class="chapter-header"><span class="chapter-number">03</span><h2>Chapter 03</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="485:0">成长对于柳河览来讲是很残酷的命题。</p><p class="story-paragraph" data-source-key="486:0">离开江原道的时候父母的身影也变成了记忆里浅淡又模糊的剪影，家里人又打电话过来支支吾吾地讲妹妹上学需要学费了。揉了揉脑袋柳河览闷闷地讲知道了。</p><p class="story-paragraph" data-source-key="487:0">没有钱是很可悲的事情，从很小的时候她就知道这一点。</p><p class="story-paragraph" data-source-key="488:0">妹妹和她的读书问题最后只能用抽签这种事情解决，不甘心下地挖土豆的命运于是在月黑风高的时候提着小小的行囊离开了原州。签下一纸看上去万劫不复的合约，因为畏惧着那种事情所以在片场上僵直了身体，几次试镜都不通过，原本的经纪人也很无奈地放弃了自己。</p><p class="story-paragraph" data-source-key="489:0">Stella就这样笑盈盈地出现，用很柔软的语气告诉她河览啊，这样下去处境会更糟糕的。</p><p class="story-paragraph emphasis" data-source-key="490:0">涉及到情色影像出产的制作公司同时也经营着很多情色场所，立足于灰色产业链又靠着这样的产业发家的老板不像是做慈善的。如果失去了镜头前的利用价值甚至真的会沦落到去真正的情色场所出卖肉体过活，那样子才是真正的陷入了万劫不复的地狱。</p><p class="story-paragraph" data-source-key="491:0">就算是高楼林立的首尔也会有看不见光的臭水沟不是吗？明明是这么光鲜繁华的城市，却好像容不下任何一只在臭水沟里苟延残喘的老鼠。</p><p class="story-paragraph emphasis" data-source-key="492:0">好辛苦啊，活着这件事。</p><p class="story-paragraph" data-source-key="493:0">挂掉家人的电话叹息着讲我会尽快把学费打回来的，仰倒在沙发上有一点自暴自弃，崔志宇的脸轻轻淡淡地闪过脑海，柳河览闷闷地想好像要连累崔志宇又要和自己一起吃泡面了。</p><p class="story-paragraph" data-source-key="494:0">如果沦落到泡面都买不上的话就真的只有再去打一点零工吧。家里突兀地多出来一张嘴巴，好像真的日子会难过很多。这么一想，她又有一点佩服着那对穷困但是坚持不懈地把自己和妹妹拉扯到这么大的父母了。</p><p class="story-paragraph" data-source-key="495:0">柳河览靠在沙发上就这么算着银行卡里的余额，并不是数学很好的人，算着算着困意就泛起来了。除开妹妹的学费剩下的钱好像真的只能够吃饭团和泡面了。迷迷糊糊的想着这样的话，坠入昏昏沉沉的梦乡的时候柳河览竟然看到了崔志宇的脸——利落的短发衬出精致又漂亮的皮相。冷冰冰的眼神落到自己的身上突然又带上了柔软的笑意。长相漂亮的alpha走到哪里都受欢迎，就算是在片场上见过各种各样的漂亮的人，崔志宇也是其中最漂亮的。贫穷的人走到首尔大学这样的学校里应该很不容易吧。</p><p class="story-paragraph" data-source-key="496:0">她模模糊糊地想——崔志宇长得这么漂亮，走到首尔大的话，应该过的比她还要辛苦。穷人最忌讳的事情就是心软，可是听到崔志宇轻飘飘地讲出来没有钱的时候，河览又恍然地看到了那个咬着牙坐着大巴跑到首尔的自己。</p><p class="story-paragraph" data-source-key="497:0">到底是想拉崔志宇一把还是拉当初的那个自己一把呢？</p><p class="story-paragraph" data-source-key="498:0">如果时间可以倒流的话还会坐着大巴去首尔吗？因为没有后悔药，所以如果这种命题也格外残忍，如果抽中上学签的人是自己，可能在首尔颠沛流离面临这些的就是妹妹，如果没有签下那个合约，也不会在片场上遇到崔志宇。就算是有如果这样的命题，未知还是太多了啊。</p><p class="story-paragraph" data-source-key="499:0">世界上最残忍，最令人惶恐，最让人恐惧的性质，就是未知。</p><p class="story-paragraph" data-source-key="500:0">想着这样的问题也无知无觉地睡到了晚上，窗外的楼宇之间一栋一栋亮起了灯，橙黄色的暖色的灯光，从小小的窗口向外眺的时候。依稀也会产生万家灯火里有她一盏的错觉。柳河览从沙发上慢慢坐起来。睡姿歪斜的缘故，脖颈处也泛着酸酸的痛意，她抬手捏了捏。摸出手机看一眼，已过十八点了。</p><p class="story-paragraph" data-source-key="501:0">崔志宇应该也回来了吧。</p><p class="story-paragraph" data-source-key="502:0">是说今天去学校办了退宿就会回来的。</p><p class="story-paragraph emphasis" data-source-key="503:0">柳河览歪着脖子有些迟钝地想，但是到现在为止也没有响起敲门声。是因为自己睡着的缘故所以把崔志宇关在门外了吗？但是能够考上S.K.Y的高材生很聪明，应该不会傻乎乎地在门口等一下午吧？</p><p class="story-paragraph" data-source-key="504:0">很快河览就发现自己想多了，打开门的时候没有发现崔志宇的身影的时候她悄悄地松了一口气。莫名积攒起来的负罪感很快消弭一点。想着去便利店买一点方便面或者饭团之类的带回家做两个人的晚饭。走下楼的时候才发现崔志宇就在那根长长的石凳上坐着。她的坐姿很好，背打的笔直，身段颀长仪态也漂亮，就算是是穷的拿不出钱买材料的学生，骨子里始终有一种高高在上的气质。只是坐在这种地方就着路灯看手里的文献，专注的样子也是很好看的，但是没来由让给柳河览觉得这个样子的崔志宇可怜巴巴的。</p><p class="story-paragraph" data-source-key="505:0">——现在她要把这只可怜的小狗狗捡回家了。</p><p class="story-paragraph" data-source-key="506:0">想到这里，莫名其妙的，河览的心情变好了一点。不管是妹妹的学费还是那个好像用一辈子都还不完的天价违约金都可以在这个瞬间被她短暂地抛在脑后了。</p><p class="story-paragraph" data-source-key="507:0">在首尔一无所有的柳河览可以在崔志宇读大学的这几年短暂地拥有一只从路边捡回来的漂亮小狗，虽然她好像连养活自己都有一点困难，但是没什么关系啊。</p><p class="story-paragraph" data-source-key="508:0">她有了一个可以在这段时间里和她相依为命的崔志宇。</p><p class="story-paragraph" data-source-key="509:0">路灯从头顶投下来，把两个人的影子拉的很长。睫毛颤了颤，崔志宇后知后觉地抬起了脑袋。</p><p class="story-paragraph" data-source-key="510:0">好奇怪的…感觉。</p><p class="story-paragraph" data-source-key="511:0">明明只是穿着最简单棉质短袖的柳河览，没有化妆，头发散散地垂下来。只是用那双圆溜溜水汪汪的兔子眼睛看着自己，无辜又干净的眼神，就好像让她的心跳无端端地漏掉一拍。</p><p class="story-paragraph" data-source-key="512:0">看着自己的河览在想什么呢？我会给她添麻烦吗？合上书的时候崔志宇在心里想这些问题。这些是她以前不会考虑的，只是心跳的太快了，兴许是夏季热的缘故，甚至让她有了心脏快要从嗓子眼里蹦出来的错觉。</p><p class="story-paragraph" data-source-key="513:0">但是她也只是合上书，安安静静地从坐着到地方站起来了。</p><p class="story-paragraph" data-source-key="514:0">嘴巴张了张，并不知道该向着柳河览说什么。说谢谢吗？她偏着脑袋，有点迟钝地想。金主恩给她发消息讲就算是住在麻雀笼也要给室友挑见面礼，现在装着小小的项链的绒布盒子就在她外套里的安静的躺着。</p><p class="story-paragraph" data-source-key="515:0">河览会喜欢吗？</p><p class="story-paragraph" data-source-key="516:0">小小的银色的十字架，铂金材质，没有钻也没有水晶，比起专柜里的其他饰品已经是最朴实的一款了。崔志宇选了很久还是觉得这一款很适合河览。</p><p class="story-paragraph" data-source-key="517:0">她小时候被妈妈带到教堂去做祷告念圣经，双手合十着向天主念着祷词。买下十字架式的项链的时候，已经很久没有做过祈祷的崔志宇也会在心里轻轻地想主啊，我撒谎了，好像犯下了万劫不复的错误。</p><p class="story-paragraph emphasis" data-source-key="518:0">她单纯地想这句话，却没有被任何事物原谅的念头。只是在刷卡结账，坐在一边放空大脑等着店员将东西包装好双手奉上的时间里，崔志宇又很轻地想如果所谓的天主能够听到她的祈请，能否稍微稍微的垂怜一下柳河览。</p><p class="story-paragraph emphasis" data-source-key="519:0">让她温饱，让她自由，吃想吃的东西吃到肚子滚圆也没有关系，让柳河览去做自己想做的事吧。</p><p class="story-paragraph emphasis" data-source-key="520:0">——让柳河览去做自己想做的事情吧。</p><p class="story-paragraph" data-source-key="521:0">抬眼与那双溜圆的眼睛对视着的时候，崔志宇又轻轻地在心里重复了一遍这样的话。</p><p class="story-paragraph" data-source-key="522:0">她从来都是轻装从简的人，拎着小小的箱子跟在柳河览身后慢慢走上水泥砌起的台阶。狭窄的楼道隔音极差，偶尔还能听到电视里的金钟国的声音偷过铁质的门爽朗的钻进耳朵里。</p><p class="story-paragraph" data-source-key="523:0">忙着把崔志宇带回家就忘了到便利店买晚饭的事情，肚子也不合时宜地咕咕叫了起来。柳河览眨了眨眼，目光还没有来得及落到崔志宇的身上，就听到后者轻轻地叹了口气:“我带了晚饭过来。”</p><p class="story-paragraph" data-source-key="524:0">她晃了晃尾指上勾着的塑料袋:“紫菜包饭，河览喜欢吗？”</p><p class="story-paragraph" data-source-key="525:0">说是紫菜包饭但却裹着很新鲜的金枪鱼，鱼脂香气在嘴巴里爆开的时候河览发出了满足的喟叹。她腮帮子被撑得鼓鼓的，很餍足地吃着东西的河览很可爱，崔志宇就这么坐在一旁撑着自己的脸定定地看着。</p><p class="story-paragraph" data-source-key="526:0">好像选对了，她有一点庆幸地在心里想。河览看上去很喜欢这种。</p><p class="story-paragraph" data-source-key="527:0">“姐姐在外面等了很久吗？”突然就听到河览这么问了。</p><p class="story-paragraph" data-source-key="528:0">“没有等很久，下午有课，我上完课才过来的。”</p><p class="story-paragraph" data-source-key="529:0">崔志宇一边说着，一边把手边的水杯往河览面前推了推。明显不是实话，但是河览也没有追究到心思。埋头苦吃的时候只觉得崔志宇起身凑了过来，银色的链条和小小的十字吊坠突兀地晃在河览的面前。她偏了偏脑袋，听到崔志宇有一点发紧的声音:“……礼物。”</p><p class="story-paragraph" data-source-key="530:0">“礼物？”</p><p class="story-paragraph" data-source-key="531:0">河览偏了偏脑袋，哑然失笑。应该猜的到的，崔志宇是很讲礼的人。之前搭档的时候会给自己带好吃的点心，贸然入住也绝对不会空手上门。往嘴里再填了一口食物，她乖顺地把脑袋仰起，露出白皙的颈:“姐姐帮我戴上吧。”</p><p class="story-paragraph" data-source-key="532:0">没有说喜欢，也没有说谢谢，只是自然地讲着帮我戴上吧。仿佛这种事情已经在两个人之间发生了无数次。崔志宇咽了咽口水，小心翼翼地凑过去。离的太近，雪绒花的香气几乎快要扑入鼻腔，她不动声色地屏住呼吸，心如擂鼓，只觉得指尖也在轻轻地发颤。</p><p class="story-paragraph" data-source-key="533:0">距离太近，心跳的太快，会产生微妙的错觉。</p><p class="story-paragraph" data-source-key="534:0">分明更进一步的事情都在片场上做过，只是那些镜头挪开，私下的相处变成了河览和志宇，反而让崔志宇迷离了片刻。</p><p class="story-paragraph" data-source-key="535:0">算是相依为命吗？她有些奇怪地想这个词。如果靠前一点，把河览整个地抱进自己的怀里，她们好像也算是在这个须臾和片刻里相依为命了。</p><p class="story-paragraph" data-source-key="536:0">垂着眸子将搭扣很快地扣好，崔志宇迅速地拉开自己与河览的距离。</p><p class="story-paragraph" data-source-key="537:0">行李箱被她随意地靠在墙角，被昏黄的灯光下投拉出长长的剪影。狭小的空间摆不开太多的东西，不管是客厅还是那个小小的房间都是这样——只是被她硬生生地挤进来，容不下也要容得下了。</p><p class="story-paragraph" data-source-key="538:0">只是在一个恍然之间做出来的决定，好似就可以轻易地影响到接下来的所有路。</p><p class="story-paragraph" data-source-key="539:0">简单的晚餐过后，两个人自然而然地开始收拾桌子。将垃圾打包丢进垃圾桶，又将行李箱里的东西分门别类的归整进这处小小的空间，接下来面对的问题就有一点尴尬了。</p><p class="story-paragraph" data-source-key="540:0">“要一起睡吗？”</p><p class="story-paragraph" data-source-key="541:0">河览指着房间里的单人床就这么问了，也许是因为真枪实弹的做过的原因，她对崔志宇有一种几乎算得上是天然的依赖与信任。如果是卢维那出现在这里大概三分钟之类就会被河览连打带踹的赶出家门，是崔志宇的话就不一样了。</p><p class="story-paragraph" data-source-key="542:0">在镜头面前都没有对占她的便宜表现出来半分兴趣的崔志宇又怎么可能在私下想那些乱七八糟的东西？她百分之百的相信崔志宇。</p><p class="story-paragraph" data-source-key="543:0">坦然的态度呛住崔志宇。</p><p class="story-paragraph" data-source-key="544:0">她的目光在那张小床上顿了半晌，又小心地看了看面前的狭窄的沙发，突然有点庆幸还好在学校的时候一口回绝了金多绚要买烤箱的提议</p><p class="story-paragraph" data-source-key="545:0">鸽子笼好像确实太小了，小到装两个人也有一点困难。</p><p class="story-paragraph" data-source-key="546:0">可以换一个地方住吗？突兀地崔志宇冒出来这样的想法。冒出来了一瞬又很快地打消，她的圈子里不乏玩心重的朋友，在江北或者江南的别墅和高楼里圈养手里不宽裕的人，玩腻了就给一笔钱然后丢掉，偶尔在聚会上面提起来就像讲笑话一样。</p><p class="story-paragraph" data-source-key="547:0">如果是他们遇到河览会怎么样呢？</p><p class="story-paragraph" data-source-key="548:0">思维开始不受控制的发散，各色脸庞挤过崔志宇茫然的脑子，最终还是定格在那个于初春之中冻死在首尔街头的流浪女人身上。</p><p class="story-paragraph" data-source-key="549:0">河览会被冻死吗？那些被丢掉的，被圈养的…金丝雀们会被冻死吗。</p><p class="story-paragraph" data-source-key="550:0">她没有办法接受这样的结局，喉头滚了滚，回过神，崔志宇发现河览还是站在眼前，笑眯眯地看着她。</p><p class="story-paragraph" data-source-key="551:0">坦然的，明朗的，信任的眼神。</p><p class="story-paragraph" data-source-key="552:0">湿漉漉地看着崔志宇，就好像在说你一定不会伤害我这样的话。</p><p class="story-paragraph" data-source-key="553:0">莫名其妙的恐惧感骤然自下而上地猛地攫住她，身体轻微地晃了晃，崔志宇听见自己的声音轻飘飘的传进耳朵里。</p><p class="story-paragraph" data-source-key="554:0">“和alpha睡一张床很危险的。”</p><p class="story-paragraph" data-source-key="555:0">要多买一张床吗？或者她打地铺也可以。很多话堵在喉咙里说不出来半句，可是河览也只是自然地把头偏过来，很认真地讲:“但是姐姐不危险。”</p><p class="story-paragraph" data-source-key="556:0">崔志宇确实不具有危险性，就算是alpha最暴烈的易感期也只是自己冷静的打着抑制剂请着假在宿舍里度过了。选择拍摄题材的时候还被多绚轻飘飘地建议可以在那种Ntr向的色情片里扮演沉睡的丈夫，不觉得很有意思吗，相方和另一位都快做到天操地射的动静了，而相貌俊美的丈夫还是选择在一旁睡到地老天荒。想想这种画面就很好笑。</p><p class="story-paragraph" data-source-key="557:0">金多绚的提议极具可行性，和崔志宇的那位印尼籍的经纪人carmen一拍即合马上接了一种这个本子试水。</p><p class="story-paragraph" data-source-key="558:0">——结果没有想到她真的在片场上睡成死猪，穿着纯色的丝绸睡衣有着很漂亮的睡颜，隔壁的两位情色演员体位换了好几种也没有把她吵醒。</p><p class="story-paragraph" data-source-key="559:0">导演在场外抱怨还是睡的太沉了，有些很过分的台词都没有机会发挥出来。</p><p class="story-paragraph" data-source-key="560:0">carmen看着成片随口敷衍说确实睡太死了，刚做完实验就赶过来拍这种东西还是有一点累的。</p><p class="story-paragraph" data-source-key="561:0">柳河览当初听到这种传言的时候还觉得不可置信，但是拍这个片子的前辈和自己关系确实不错，私底下和她吐槽过这个兼职的好像真的不行，感觉做爱的声音对她来说就像AMSR还是现场版。</p><p class="story-paragraph" data-source-key="562:0">神奇的吐槽就这么轻飘飘地留在了柳河览的心里。</p><p class="story-paragraph" data-source-key="563:0">一开始也只是觉得好笑。</p><p class="story-paragraph" data-source-key="564:0">按道理来说alpha不会这样，因为第二性别的觉醒所以暴戾和侵入欲几乎就会构成一个alpha骨血里的本能。难道色情影片这个行业的Alpha稀缺到这种程度了么，就连有功能障碍的Alpha都能招进来。</p><p class="story-paragraph" data-source-key="565:0">志宇和河览见过的所有的Alpha都不同，这个人看上去没有危险性也没有侵略性。那些富有拍摄经验的前辈们总是急着把自己摆弄成各种利于拍摄的姿势。又会在自己陷入僵直的前一刻发出无奈的叹息然后放弃掉。</p><p class="story-paragraph" data-source-key="566:0">只有志宇会固执地用身躯去遮挡投射过来的镜头，会问自己可不可以，会用柔软又细碎的亲吻安抚自己极度不安的情绪。</p><p class="story-paragraph" data-source-key="567:0">所以是志宇的话就没有关系，就算对着自己产生了这种侵略欲也许也没有关系。</p><p class="story-paragraph" data-source-key="568:0">看出来了对方的犹豫，柳河览眨眨眼睛，嗔黑的溜圆的眼睛在一瞬间就湿漉漉地。看上去人畜无害的小白兔也会在某些时候变得狡黠起来。</p><p class="story-paragraph" data-source-key="569:0">——比如说在志宇面前的时候。</p><p class="story-paragraph" data-source-key="570:0">“知羽姐姐是不会伤害我的。”她竟然狡猾地用了“知羽”这样的称呼。知羽会坚决的保护着河岚不会受任何伤害，志宇也是一样的，“志宇姐姐也一样的。”</p><p class="story-paragraph" data-source-key="571:0">你会保护我的，不是吗？</p><p class="story-paragraph" data-source-key="572:0">崔志宇的目光闪了闪，不知道为什么，有了一种很莫名的难堪的感觉。</p><p class="story-paragraph" data-source-key="573:0">空气在一瞬间寂静下去，河览不着急，只是偏着脑袋，慢悠悠地等着崔志宇的回答。</p><p class="story-paragraph" data-source-key="574:0">如果姐姐选择在沙发上睡就从柜橱里搬出被子和枕头丢到沙发上，如果选择和自己睡一张床就把这些东西放到床上。就像崔志宇对她几乎算得上是绝对的尊重一样，她也绝对绝对地尊重着崔志宇的所有抉择。</p><p class="story-paragraph" data-source-key="575:0">两个人无声地僵持过很久，最终还是崔志宇叹息着败下阵来。</p><p class="story-paragraph" data-source-key="576:0">金主恩偶尔会吐槽崔志宇这种心软过度的人本质上还是有一种不把人当做人看的傲慢在身上，因为可怜就要无条件的满足对方所有的一切要求么？</p><p class="story-paragraph" data-source-key="577:0">“如果柳河览真的有一天说出来啊老板真该死啊这种话难道姐姐真的要动用自己所有的能力不择手段地让那个老板去死么？”</p><p class="story-paragraph" data-source-key="578:0">也许真的会啦——拖长着声音的金多绚笑眯眯地接过话头补充：“如果河览真的讲去吧崔志宇把我那个杀千刀的老板搞到再也不要出现在这个世界上。志宇姐姐一定会去做这件事的。”</p><p class="story-paragraph" data-source-key="579:0">没来由的崔志宇想起来这一段，突然好奇如果有朝一日河览真的对自己这么说了，她会按照金多绚的所说的那样去做么？可是没有人能够窥见未来，未来这种东西比未知还要抽象，所以放在当下，河览的要求好似仅仅只是睡一张床而已。</p><p class="story-paragraph" data-source-key="580:0">迟钝地眨了眨眼睛，崔志宇艰难地从喉咙里挤出声音。</p><p class="story-paragraph" data-source-key="581:0">太紧张的缘故，她只觉得自己的指尖也在轻微的抖动：“…今晚麻烦河览了。”</p><p class="story-paragraph" data-source-key="582:0">夜色沉沉，渐转深夜，纵是这样窗外还是有很热闹的声音。首尔这座城市某种意义上是没有给人们留出睡觉的余裕的。无论是便利店亦或者这样或者那样的健身房都彻夜通宵地开着，过了凌晨街道上就会有汽车轮胎轧过柏油路面的声音。住在远郊的人们需要起很早开几个小时的车进入首尔开始工作。</p><p class="story-paragraph emphasis" data-source-key="583:0">老式小区的建筑隔音差是通病，崔志宇被汽车的鸣笛声吵醒的时候天已经蒙蒙的亮了，喧嚣一夜的窗外终于在凌晨时分迎来短暂的沉寂。她试着动了动，发现手臂不知道什么时候已经被柳河览压住了。枕在她的手臂上陷入安稳的睡眠的河览在这种时候尤其像一只不设防的小动物。是就这样枕在自己的手臂上用着百分之百信任的姿势整个窝在自己的怀里的小动物河览吗？这样的河览是很珍贵的存在。</p><p class="story-paragraph emphasis" data-source-key="584:0">崔志宇垂着眼睛，在心里很轻的想着：是很珍贵，最珍贵的存在。</p><p class="story-paragraph" data-source-key="585:0">距离太近了，近到河览的呼吸细细碎碎地扑着她的脖子，扑着之前在片场上咬出来的淤伤上面。痒意在皮肤上蔓延开，心脏也像被羽毛搔刮着，一下又一下。</p><p class="story-paragraph" data-source-key="586:0">——在经由窗纱透进屋内的细细碎碎的天光里，崔志宇甚至看得清河览颊上的细小的绒毛。</p><p class="story-paragraph" data-source-key="587:0">河览会做梦么？梦到了什么呢？</p><p class="story-paragraph" data-source-key="588:0">志宇的睡眠很浅，甫一醒便再难进入梦乡。手臂被河览枕着，滞胀的麻感从小臂一路传到指尖，不是很好受的感觉。可是好奇怪，就在这个须臾，怀里被满满地塞了一个人进来，就好像连心脏也被装的满满的了。</p><p class="story-paragraph" data-source-key="589:0">如果醒过来的是知羽的话，看到河岚这样，大概会轻轻地亲一下河岚的眉侧吧。</p><p class="story-paragraph" data-source-key="590:0">崔志宇垂睫，鬼使神差，轻轻地将唇瓣贴到河览的颅顶。</p><p class="story-paragraph" data-source-key="591:0">十分十的小心，屏气息声，战战兢兢，怕河览醒过来，又希望河览醒过来。</p><p class="story-paragraph" data-source-key="592:0">如果关于知羽和河岚的拍摄没有结束的话，在结束之前她也一直可以做河览的知羽姐姐。不是么。她垂着睫就这么轻飘飘的想，目光落在河览颈间的十字架上，伶仃又精致的饰物就这样静静地垂悬在河览的颈间。</p><p class="story-paragraph" data-source-key="593:0">住在河览的房子里的我算是河览的所有物吗？</p><p class="story-paragraph" data-source-key="594:0">思维漫无目的地发散，竟然想到了这一句话。算得上是很荒谬的现实，并没有成为金多绚嘴里的把河览圈养成自己的所有物的存在，反倒是在这种狭窄的鸽子笼里变成了和河览同床共枕的人。</p><p class="story-paragraph" data-source-key="595:0">她闷闷地想着，有些羡慕那个一无所有的崔知羽。</p><p class="story-paragraph" data-source-key="596:0">可是如果是崔知羽的话是没有办法把河览拉出这种环境的不是么。</p><p class="story-paragraph" data-source-key="597:0">她好轻好轻地吁了一口气，心知肚明着好多事态已经脱离既定的轨迹开始发展。算是命运转动的齿轮亦或者是金多绚的一时兴起？</p><p class="story-paragraph" data-source-key="598:0">就算心知肚明当初给自己播放着那段色情影像的金多绚是在赌自己的一念之间，可是那时候的她太愚蠢了，愚蠢到真的以为只要出现在柳河览的身边，陪着她熬过漫长的合约期限，就算是对她的保护。</p><p class="story-paragraph emphasis" data-source-key="599:0">——结果自己好像也成为了片场上欺负河览的alpha。</p><p class="story-paragraph" data-source-key="600:0">从江原道坐着大巴车到首尔的河览在车窗外看过什么风景呢？有过一瞬间为着不可及的未来陷入神驰目眩的错觉吗？这么漫无边际的胡思乱想着，昏昏的睡意竟然再度席卷而来。安全感来的怪异，竟然能够战胜精准到如同上过发条的生物钟。好似也没有关系，不能翘掉的课在下午，就算放任自己一次睡过去又怎么样？</p><p class="story-paragraph" data-source-key="601:0">等到河览睁眼醒过来的时候，日上三杆。还在盛夏，首尔的温度不低，房间里已经积了薄薄的暑气。挂在墙上的风扇呼呼作响，徒劳地为狭小的房间里送着凉风。</p><p class="story-paragraph" data-source-key="602:0">日头太盛了，今天要给阳台上的花多浇一点水啊。</p><p class="story-paragraph" data-source-key="603:0">模模糊糊的想着这种事情，懒洋洋的，河览想翻一个身——但是却动弹不得。她后知后觉地想起来了床上还有另一个人，她正枕在崔志宇的臂弯之中，以一种绝对的信任的姿态，整个地被崔志宇抱在怀中。对方颈间浅淡的白茶香气扑入鼻腔，登地，河览只觉得自己的耳根刷一下，滚滚的烫了起来。</p><p class="story-paragraph" data-source-key="604:0">应该是红透了。</p><p class="story-paragraph" data-source-key="605:0">性格淘气的河览从小就有着世界上最糟糕的睡相，在小时候就因为在睡梦中把双胞胎妹妹踹下床这种事情被爸妈笑好几年。本来以为长大了之后会好一点，只是没有想到的是长大后竟然会失眠，闭上眼睛是alpha的拍摄搭档们走过来的身影，stella的带着笑的轻言细语，原州的田垄上的被风吹过会发出悉悉簌簌声响的玉米叶，还有这两年家里人打电话过来关切的询问。一桩又一桩的事情交织起来就像是密不透风的网格，牢牢地兜住她坠入安眠乡的可能。</p><p class="story-paragraph" data-source-key="606:0">算起来的话，这应该是她在首尔的时候为数不多的睡得安稳的时候。是因为崔志宇还是这股无时无刻环绕着自己的白茶香气呢？一无所有的人一旦有了可以依靠的存在好似会变得格外的脆弱。</p><p class="story-paragraph" data-source-key="607:0">意识到这一点的时候河览发现自己的眼眶里已经开始涌出酸胀的涩意了——仅仅只是因为意识到这样狭小的房间里有着崔志宇这样一个存在，就有忍不住掉眼泪的冲动。</p><p class="story-paragraph" data-source-key="608:0">哪怕分道扬镳是注定的事情也不重要了。崔志宇以后一定会成为一个很厉害的医生吧。穿着白色的外套戴着口罩在办公环境干净的医院里上班，光鲜的明朗的未来只是让河览想一想都会笑出来的程度。</p><p class="story-paragraph" data-source-key="609:0">如果不是一路人的话结伴走过这一段也是弥足珍贵的回忆。</p><p class="story-paragraph" data-source-key="610:0">就算以后交完违约金灰溜溜地回到江原道，也可以很自豪地告诉大家说我在首尔这种地方活下来了，首尔的医院里有一个很厉害的医生，她也被我好好地养到大学毕业了。</p><p class="story-paragraph" data-source-key="611:0">这么一想，她突然觉得自己也成为那种了不起的人了。</p><p class="story-paragraph" data-source-key="612:0">没有办法把当初签下合约的自己捞起来，但是也尽着自己的全力阻止崔志宇掉下去了。就像网上的那种烂烂的心灵鸡汤说的一样：自己淋过雨的人也会忍不住想去给别人撑一把伞。一开始看到的时候也只会觉得这样的说法有病到不轻，人与人之间是独立的个体，为什么要在另一个相同经历的人身上共感自己的苦难呢？好蠢的想法好蠢的做法——直到自己也成为了这样的蠢货。</p><p class="story-paragraph emphasis" data-source-key="613:0">成为了真正的医生的崔志宇会记得自己吗？记不得也没有关系。</p><p class="story-paragraph emphasis" data-source-key="614:0">不是一路人，但是一起走过一段路，仅仅是这样就够了。</p><p class="story-paragraph" data-source-key="615:0">崔志宇醒过来的时候看到的就是这样的，红着眼眶注视着她的河览。只是在床上面对面地躺着，平时总挂着笑意的眼里却有着一层蒙蒙的水雾。是自己做了什么错的事情吗？有些茫然地她这么想着。因为深度睡眠，长时间没有摄入水分，就连声音也带着轻微的哑意：“河览？”</p><p class="story-paragraph" data-source-key="616:0">无害又柔软的声音，须臾间牵动河览那根绷直的神经。她迟钝地眨眨眼睛，在崔志宇迷茫的眼神里，就这么猝不及防地掉下了眼泪。</p><p class="story-paragraph" data-source-key="617:0">应该是很丢脸的事情吧？来到首尔之后河览就没有哭过了。在甜品店做帮厨被烤盘烫到的时候没有哭过，深夜被不怀好意的alpha或者beta敲着门骚扰的时候也会用尽全力的用c8狗崽子这些乱七八糟的话胡乱的骂走。坐地铁的时候遇到宣传奇怪的宗教思想的大叔也只是咬着牙做出什么都不怕的样子赶走对方了。就连在片场上欺负被导演骂到劈头盖脸也是只是觉得是工作里的常态。如果活不下来就会变成首尔晨间或者夜间新闻的一则冰冷的消息吧？正是因为这样所以才要不择手段的活下去啊。</p><p class="story-paragraph" data-source-key="618:0">掉眼泪的话会被嘲笑吗？会被志宇姐姐嘲笑吗？她甚至都不敢去看崔志宇的表情了。</p><p class="story-paragraph" data-source-key="619:0">眼泪是很没有用的东西，小时候在土垄上摔跤然后掉着眼泪去找妈妈的时候得到的也只是冷冰冰的问为什么要从田里回来呢？明明还有很多东西没有做完不是吗？摔了跤就该继续爬起来做自己的事情呀？为什么要掉眼泪呢。</p><p class="story-paragraph" data-source-key="620:0">为什么要掉眼泪呢？志宇姐姐会问这句话吗？</p><p class="story-paragraph" data-source-key="621:0">她像鸵鸟一样埋住自己又不受控制着这么想，活的越可悲的人越憎恶眼泪，眼泪是脆弱的象征，脆弱是她们这种挣扎在生死线上的人不配拥有的东西啊。</p><p class="story-paragraph" data-source-key="622:0">头顶响起轻微的叹息声，她听到崔志宇在叹气，环在腰间的手臂紧了紧，她被志宇姐姐就这么揉进怀里抱紧了。什么都没有问，什么都没有说。只是像在片场上那样，把自己密不透风地揉进了怀里。</p><p class="story-paragraph" data-source-key="623:0">温热的眼泪蹭在棉质的睡衣上，很快就濡出一大片湿痕迹。好奇怪的感觉，蹭在睡衣上的眼泪好像也蹭在了自己的心脏上。沉闷的感觉，闷的崔志宇讲不出话，半句话也讲不出来。</p><p class="story-paragraph" data-source-key="624:0">是因为妹妹的学费还是其他的？喉咙里好似也有一块棉花堵着，沁的发疼。崔志宇连这种话也问不出口了。</p><p class="story-paragraph" data-source-key="625:0">就算是在很早之前就知道河览是个可怜小孩，家里有一个上学的妹妹，今年是读大学的年龄。可是就算是这样也成年了吧，自己有手有脚的为什么还要来拜托在首尔活不下去的姐姐呢？就算是身为sky的首尔大学里面也有半工半读的学生不是吗？</p><p class="story-paragraph" data-source-key="626:0">明明知道书也没有读完的姐姐已经过的够辛苦了，明明知道河览已经过的够辛苦了啊。为什么要让河览承受那么多，河览为什么要承受那么多。</p><p class="story-paragraph" data-source-key="627:0">只是想着这句单薄的话，崔志宇也觉得自己的眼眶开始发涨了。汹涌的泪意袭来，浸的她心口发痛，喉咙也痛。就连一句没有关系也说不出来了。她甚至都不清楚这种痛苦的情绪源自于什么，只觉得自己快要被这种痛苦的情绪撕烂了。不管是猛地冲上头顶的愤怒也好，还是骤然泛起的巨大的无力感也罢。</p><p class="story-paragraph" data-source-key="628:0">脑海里甚至还有一个声音反复地讲：告诉河览吧。告诉她你有很多很多的钱，告诉她只要你在身边就过的不会太辛苦。甚至她还在想，或者告诉河览吧，加入公司去做那种兼职不是因为经济上的拮据。</p><p class="story-paragraph" data-source-key="629:0">——因为崔志宇本身就是为了河览而去的。</p><p class="story-paragraph" data-source-key="630:0">原因只是你，只有你，只是想要到达你的身边而已。</p><p class="story-paragraph" data-source-key="631:0">可她还什么都没有说，只是下意识地她咬紧牙关，忍住掉下眼泪的冲动，收了手臂把河览更紧的抱进自己的怀里。</p><p class="story-paragraph" data-source-key="632:0">过强的同理心是很可怕的东西 ，哪怕对方什么都没有说，就已经让她肝胆俱颤了。从未体验过，甚至想象不到的人生就这样赤裸裸地摆在她的面前，摊成一片触目惊心的狼藉。志宇直到这一刻才发现原来河览真的很瘦，瘦削的身体被骨骼薄薄地撑起来，硌到发疼的程度。没有脂肪也没有肌肉，只是瘦，皮包骨头，瘦到令人心惊的程度。</p><p class="story-paragraph" data-source-key="633:0">金多绚递过来的资料上面呈现的惨淡的人生就在志宇的怀里用了这么单薄的形式具象化：原来河览面临的不止是那些黑漆漆的镜头。不管是妹妹的学费还是饥肠辘辘的时候好像都是她要面对的。</p><p class="story-paragraph" data-source-key="634:0">是她退无可退，退到悬崖边上摇摇欲坠也不得不去面对的东西。</p><p class="story-paragraph" data-source-key="635:0">无底洞一样的，来自于江原道的那些电话，好像就这样轻飘飘的噬掉了河览为数不多的生机。</p><p class="story-paragraph" data-source-key="636:0">志宇意识到这一点的时候心脏也被那只看不见的手彻底揪紧了。</p><p class="story-paragraph emphasis" data-source-key="637:0">这种刻骨的感受一直留存到了很多年以后志宇和多绚闲聊。</p><p class="story-paragraph emphasis" data-source-key="638:0">听到志宇讲起这段的多绚还是那副笑嘻嘻的样子 ，用轻飘飘的态度讲着如果那时候站在姐姐的位置上的人是我的话我只会认为把她身边的亲缘断干净才好，断到她无处可去不敢归乡的程度。孑然一人的情况下就是一人吃饱全家不饿了。</p><p class="story-paragraph emphasis" data-source-key="639:0">—是你太懦弱了，姐姐。</p><p class="story-paragraph emphasis" data-source-key="640:0">—明明在那时候可以把河览圈养成离开你就活不了的金丝雀吧。</p><p class="story-paragraph emphasis" data-source-key="641:0">—但是好像你到现在为止也觉得这样的做法是错误的，但是事实就是河览跑走了，跑到了你翻遍江原道也找不到的角落里。</p><p class="story-paragraph emphasis" data-source-key="642:0">就算找到了你也不会去见她的。你不敢。</p><p class="story-paragraph emphasis" data-source-key="643:0">这句话是多绚没有胆子说出口的。</p><p class="story-paragraph emphasis" data-source-key="644:0">就算是这样，二十七岁的金多绚还是比十九岁的金多绚直白很多：“付出了这么多还是一场空，志宇姐姐你这一段真的很丢脸。”</p><p class="story-paragraph emphasis" data-source-key="645:0">放到那堆玩咖的圈子里真的是会被笑上一万年的程度。</p><p class="story-paragraph emphasis" data-source-key="646:0">那家情色公司倒闭之后多绚才彻底从Stella的角色里抽离出来回归本体，只是好像带了点Stella的坏毛病，总用刻骨又刻薄的话将崔志宇的脸色一点一点地剐垮到再也挂不上半分笑意的时候才算达成自己的目标。</p><p class="story-paragraph emphasis" data-source-key="647:0">金主恩还是不习惯两个人高高在上的模式，皱着眉头打断讲说柳河览就说柳河览，真当自己是法外狂徒么。一直没有出声的崔志宇终于开口，声音很轻地讲那时候我是真的想杀她全家，她太苦了。</p><p class="story-paragraph emphasis" data-source-key="648:0">黑漆漆的瞳子里已经印不出来任何关于情绪的底色了，面前杯子里的茶水见底，崔志宇抬手给自己续上一盏，在金主恩骇然的目光里用清淡的语气继续讲：“其实现在想起来那时候，我还是想杀她全家。”</p><p class="story-paragraph emphasis" data-source-key="649:0">质朴纯粹，没有情绪也没有杀意，只是平淡地将自己的内心剖开露出最直白的恶性——以一种坦荡而垂直的态度</p><p class="story-paragraph" data-source-key="650:0">这种态度是现下的崔志宇做不到也想不到的东西。少年时期的崔志宇活在象牙塔里，还未洗去本性之中的那点稀薄的善意。所以在河览掉着眼泪的时候她只觉得手足无措，收紧手臂把河览抱的很紧也不够，眼泪掉下来也无知无觉。上泛的情绪如同潮水一般将她兜头吞没，潮汐褪去的刹那连同一些其他的东西也在她的无知无觉之间被彻底带走了。</p><p class="story-paragraph" data-source-key="651:0">情绪从泛滥到收敛是一个很冗长的过程，收住眼泪的河览后知后觉了一丝难堪，不过并没有持续多久，她发现志宇的眼眶也是红红的。</p><p class="story-paragraph" data-source-key="652:0">所以在自己哭泣的这么长的时间，志宇姐姐也在不声不响地掉着眼泪吗？</p><p class="story-paragraph" data-source-key="653:0">很笨地曲起手指去蹭志宇泛红的眼尾，分明睫上还挂着泪珠，河览还是没有忍住噗嗤一声笑出来。</p><p class="story-paragraph" data-source-key="654:0">原来姐姐是爱哭鬼。</p><p class="story-paragraph" data-source-key="655:0">“不要笑了呀…”有些难堪的，崔志宇从鼻腔里哼出微弱的哭音，“明明是河览哭的太有感染力了，光是看着河览这样我就觉得自己的心脏快要碎掉了。”</p><p class="story-paragraph" data-source-key="656:0">都是河览的错。</p><p class="story-paragraph" data-source-key="657:0">不可思议的坦诚的话从崔志宇的嘴巴里就这样轻飘飘地说出来了，好像还浸在情绪的潮汐里不能自拔。</p><p class="story-paragraph" data-source-key="658:0">她只是很乖地垂着眼睛让河览将眼角的湿痕勾走，闭上眼睛任由河览贴了唇瓣过来吻上眼睑。乖乖钝钝的模样好像一只笨拙的小狗。</p><p class="story-paragraph" data-source-key="659:0">嘴巴被温暖又湿润的触感轻轻地沁着，河览的心在此刻也软的一塌糊涂。</p><p class="story-paragraph" data-source-key="660:0">她没来由想到当初Stella看到那个青梅竹马的本子就就这么轻轻哼笑着讲原来是有情饮水饱呀？</p><p class="story-paragraph" data-source-key="661:0">有情饮水饱，她把这句话又在心里轻飘飘地过了一遍。</p><p class="story-paragraph" data-source-key="662:0">仅仅读完了初中，在十六岁的时候就失去了上学这种选项的河览也不太能够很好的理解这一句话。</p><p class="story-paragraph" data-source-key="663:0">只是崔志宇现在的样子很乖，如果身上所有的钱只够买一碗泡面的话，她大概会让给崔志宇吃。至于自己，有情饮水饱，就算只喝面汤也没有关系。</p><p class="story-paragraph" data-source-key="664:0">街头无家可归的流浪汉也会把找到的第一口吃的让给一直跟着自己的小狗不是么？志宇是自己捡回家的小狗，所以她也不会让志宇饿肚子。</p><p class="story-paragraph" data-source-key="665:0">因为知道饿肚子这件事有多么的令人难过，所以柳河览不会让崔志宇饿肚子。</p><p class="story-paragraph" data-source-key="666:0">从那张狭窄的单人床上挣扎起来已经是中午了，崔志宇趁着河览去洗漱的空当看了一眼手机。消息盒子已经堆到爆炸，Carmen的聊天框在最置顶，已经将第二幕的拍摄时间和地址发过来了，同时发过来的还有更新后的本子，她一目十行地看完，发现那些过于暧昧或者露骨的动作已经被不动声色的删掉了。多绚在这方面的行事向来很利落。</p><p class="story-paragraph" data-source-key="667:0">——在这时候手机也弹出来结算到账的消息。</p><p class="story-paragraph" data-source-key="668:0">Carmen的最后一条消息是这个本子公司的领导很看好，所以决定提前结算。</p><p class="story-paragraph" data-source-key="669:0">不算太多，也不算太少的金额。河览那边的数额应该是一样的，所以这笔钱够河览应付完妹妹的学费还能吃一段时间的好的东西。</p><p class="story-paragraph" data-source-key="670:0">洗漱间里传来了小小的欢呼声，崔志宇的嘴角不动声色往上勾一下。</p><p class="story-paragraph" data-source-key="671:0">金多绚也给她发了消息，有警告有哀嚎，间间断断地跟她讲怎么让河览不拍片还饿不死的主意，馊的好的都有。</p><p class="story-paragraph" data-source-key="672:0">大概是发现发过来的消息都是未读的状态，有点破防的多绚的最后一条消息是崔志宇你还是去多操几个omega养柳河览吧！！</p><p class="story-paragraph" data-source-key="673:0">崔志宇已读不回。</p><p class="story-paragraph" data-source-key="674:0">最后是金主恩发的消息，简洁地问她下午是不是要过来上课，要把河览带到首大这边么。好像经历了一晚上的思想斗争的主恩好像已经平静的接受了柳河览的存在。</p><p class="story-paragraph" data-source-key="675:0">——只要不要因为柳河览耽误实验进度就好了，如果实在担心河览被欺负也可以把河览带到我的宿舍里。但是姐姐要记得回学校上课。</p><p class="story-paragraph" data-source-key="676:0">就是因为一直都是单纯又认真的金主恩，所以才会格外受到志宇和多绚两个人的宠爱。</p><p class="story-paragraph" data-source-key="677:0">在键盘上敲敲打打回复主恩的时候，河览也回来了。上午哭的太厉害，就算用热水敷了很长时间的眼睛也无济于事，眼睛肿肿的样子有一点可爱。崔志宇眨眨眼睛，顺手竖起手机：“河览啊——就这样，不要动。”</p><p class="story-paragraph" data-source-key="678:0">拉长的声音带着她特别且惯有的柔软腔调，咔嚓一声响，河览的样子被她光明正大地存进了相册里。</p><p class="story-paragraph" data-source-key="679:0">说不清楚为什么要这么做，但是直觉这是一张很珍贵的照片，值得她一直留存在手机里的东西。</p><p class="story-paragraph" data-source-key="680:0">河览凑过来看志宇拍下的那张照片，瘪了瘪嘴：“好丑。”</p><p class="story-paragraph" data-source-key="681:0">“很可爱呀。”用很轻巧的语气讲这句话，好像也不满足只拍一张照片，她索性又把手机举起来，冲着河览眨眨眼睛，“要一起拍一张么？”</p><p class="story-paragraph" data-source-key="682:0">她其实并不喜欢拍照，就算对于自己的美貌有着清楚的认知也觉得留痕是一件很多余的事情。可是如果不在此刻留下河览的痕迹又该去哪里找呢？想要记住河览，记住河览留下的痕迹，记住河览的一切。</p><p class="story-paragraph" data-source-key="683:0">是抱着这样的念头吧？抱着这样的念头贴住河览的脸按下快门。志宇又在刹那间轻轻地想着：如果世界上的所有人都不记得河览了也没关系，只要这两张相片一直存在，她就会一直记得河览。</p><p class="story-paragraph" data-source-key="684:0">一个人的一生都有需要去回忆的东西，人靠回忆过活的动物。</p><p class="story-paragraph" data-source-key="685:0">“Stella姐姐刚才给我打了电话。”</p><p class="story-paragraph" data-source-key="686:0">突然的河览开口，其实声音还是有一点瓮声瓮气的，但是笑意藏不住。莫名其妙的好运突然地砸到了脑袋上，她有一点晕头转向。无论是提前结算的那一笔钱亦或是电话里带来的好消息都足以让她陷入一种心驰神炫的境地，是因为捡到了志宇姐姐所以运气也变好了么？还是倒霉久了会有一点点好运眷顾？河览发自内心的笑起来的时候，眼尾有一点点藏不住的稚气。</p><p class="story-paragraph" data-source-key="687:0">本质上也只是一个小孩子而已，想到这里崔志宇只觉得心里无端端塌陷下去一块，她知道柳河览要说的是什么消息——合同优化：减少影像的拍摄，更多的转到后期制作的间隙里去，配音也好视频剪辑也好，总比直面镜头要好很多了。</p><p class="story-paragraph" data-source-key="688:0">所以说河览运气好啊遇到我这么负责的经纪人。</p><p class="story-paragraph" data-source-key="689:0">邀功的时候多绚就这么碎碎念了。</p><p class="story-paragraph" data-source-key="690:0">——世界上还有哪个经纪人这么卖力的去老板面前给自己带的omega争这种人道权益啊。崔志宇你就跪下来向我磕头道谢吧！</p><p class="story-paragraph" data-source-key="691:0">无论是合同内容里的发展方向还是提成点数都有了明显而可观的变动，不用提心吊胆的因为在镜头面前表现不好就被扔到更为下流的场所里去苟活了，只是这一点就已经让河览足够高兴了。</p><p class="story-paragraph" data-source-key="692:0">但是不够。</p><p class="story-paragraph" data-source-key="693:0">崔志宇在心里轻轻地想。</p><p class="story-paragraph" data-source-key="694:0">不够。</p><p class="story-paragraph" data-source-key="695:0">她没有说话，只是听着河览叽叽喳喳地分享着这些好消息，突然也觉得心情莫名其妙的好，原来开心这种情绪也会传染。她把手机拿出来，突然倒是想起来柳河览手里还卡着个和自己的本子，放在合约优化的当口，拍也不是，不拍也不是。</p><p class="story-paragraph" data-source-key="696:0">金多绚大概也没有主动提起来这桩事，把选择权推到了自己身上。</p><p class="story-paragraph" data-source-key="697:0">如果临了到头换个omega过来也无所谓，人要有契约精神，总有一方要一拍到底。至于第三幕也可以想办法推掉，搭档不是河览她也没有去片场的必要。</p><p class="story-paragraph" data-source-key="698:0">胡乱的想着一些东西，精神也处于放松的状态，倒是没有想到的是柳河览先开口问：“姐姐还想继续拍那个本子么？”</p><p class="story-paragraph" data-source-key="699:0">“知羽和河岚？”</p><p class="story-paragraph" data-source-key="700:0">“知羽和河岚。”</p><p class="story-paragraph" data-source-key="701:0">崔志宇一时间不知道该怎么说，本来该她作为提问方向河览征询的，却没有想到被到将一军。心情很好的河览好像又恢复到了可以轻松地把她拿捏住的状态，往前凑了凑，两个人的距离自然而然地贴近了。</p><p class="story-paragraph" data-source-key="702:0">这次崔志宇没有躲。</p><p class="story-paragraph" data-source-key="703:0">她只是定定地看着河览，嗔黑色的眼底清亮地印着自己的身影。这个小孩儿狡黠笑起来的时候特别好看，又灵动又鲜亮，宛如须臾间花开的春天。</p><p class="story-paragraph" data-source-key="704:0">喉头滚了滚，崔志宇听到自己讲：“我都可以。”</p><p class="story-paragraph" data-source-key="705:0">只要是河览想去做的事情。</p><p class="story-paragraph" data-source-key="706:0">她都可以。</p></div>
      </article>
    </template><template id="section-04">
      <article class="chapter" data-chapter="section-04">
        <header class="chapter-header"><span class="chapter-number">04</span><h2>Chapter 04</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="711:0">位于冠岳山的研究部偌大，修了十九层楼。仿着昌平宫里的建筑用旱地拔葱式的修法。飞檐瓦角地藏在一望无垠的葱葱郁郁里面，乍眼看也以为只是一栋历悠久的高楼。</p><p class="story-paragraph" data-source-key="712:0">崔志宇斜挎着包，走进小高楼。俯身去打门禁，瞳孔识别过了，冰冷的机械音讲报出她的学号和姓名。</p><p class="story-paragraph" data-source-key="713:0">透明的门栏板吱呀一声打开，她走进去。</p><p class="story-paragraph" data-source-key="714:0">金主恩早她一步到，懒懒散散地靠在大厅的沙发上看全英文的书。听到脚步声抬头瞥她一眼，随即也跟着起身。</p><p class="story-paragraph" data-source-key="715:0">这节课主讲的教授研究方向多数都是行为实验技术，实验室坐落在十六楼，坐电梯上去。两个人一路没说话，但是这种时候不说话反而是常态。金主恩不算喜欢说话的人。</p><p class="story-paragraph" data-source-key="716:0">抢这个教授的课的人不多，实验室里的人寥寥无几。教授比崔志宇和金主恩到的更早。端庄而明朗的女人，容貌同崔志宇有些相似。</p><p class="story-paragraph" data-source-key="717:0">崔家的人好似都长着一张看起来格外善良的脸蛋，也因为这种善良又漂亮的脸蛋，所以看上去脾气格外的不错。</p><p class="story-paragraph" data-source-key="718:0">——会让人有种好相处的错觉。</p><p class="story-paragraph" data-source-key="719:0">按照辈分的话，志宇应该叫这位崔教授一声姑姑。但是。她也只是极其礼貌地同崔教授颔首，与金主恩一起走到教室的角落里去了</p><p class="story-paragraph" data-source-key="720:0">崔教授尤其关心晚辈，趁着课前走到崔志宇的桌前要寒暄。主恩特别怕这种，站起来就要去上厕所。离开之前手腕被崔志宇轻轻地握住，动弹不得。</p><p class="story-paragraph" data-source-key="721:0">她僵硬地坐下，看到崔教授柔和的笑脸，比起讲课和做实验时更为轻柔的声音，问着很温柔的问题：“听宿管那边的老师说你办了退宿。”</p><p class="story-paragraph" data-source-key="722:0">握住自己的手不动声色地紧了紧，金主恩咽了咽口水多，听到崔志宇在风轻云淡地讲：“最近汉江的风景不错，我住到那边去了。”</p><p class="story-paragraph" data-source-key="723:0">说起来那个毗邻汉江的平层还是崔教授送她的升学礼物。</p><p class="story-paragraph" data-source-key="724:0">崔志宇从来不缺乏物质上的东西，也确实有着想要在哪里就可以在哪里的资本，这种资本是旁人羡慕不来的。</p><p class="story-paragraph" data-source-key="725:0">从小金主恩就和崔志宇一起受着教导，说谎要吞一千根针。</p><p class="story-paragraph" data-source-key="726:0">如果真的要吞下一千根针的话大概崔志宇现在应该已经穿肠烂肚了吧，明明在金主恩的印象里崔志宇不是喜欢撒谎的人。因为河览现在也可以不动声色的找到搪塞家人的办法了。</p><p class="story-paragraph" data-source-key="727:0">好在上课铃声很及时地响起来，没有再多问，崔教授重新回到了讲台上。</p><p class="story-paragraph" data-source-key="728:0">拽住自己的手腕的那只手若无其事地松开，金主恩下意识地清了清嗓子，纠结了一下。从期刊上撕下一页相对空白的纸刷刷地写字。</p><p class="story-paragraph" data-source-key="729:0">【没带嫂子过来？】</p><p class="story-paragraph" data-source-key="730:0">崔志宇瞥过来，目光在嫂子两个字上顿了一瞬。她觉得金多绚把金主恩教坏了，但是也没有反驳。</p><p class="story-paragraph" data-source-key="731:0">崔志宇只是默然地抽出笔，在纸上刷刷地写。</p><p class="story-paragraph" data-source-key="732:0">【她等我回家】</p><p class="story-paragraph" data-source-key="733:0">写到家的时候崔志宇的笔尖轻微地顿了顿，摇了摇头没来由想起河览眼巴巴的样子。简陋破旧的地方能够称之为家么？但是河览在那里。</p><p class="story-paragraph" data-source-key="734:0">她还是把家这个字写上去了。</p><p class="story-paragraph" data-source-key="735:0">金主恩长长地喔——了一声。</p><p class="story-paragraph" data-source-key="736:0">位于十六层的高楼，从窗口往外眺，眼底就能收尽整个冠岳山的绿意。</p><p class="story-paragraph" data-source-key="737:0">“嫂子喜欢吃西瓜么？”</p><p class="story-paragraph" data-source-key="738:0">突兀地金主恩就这么讲了，她声音很小，用很轻快的语气。比起金多绚的咒天骂地，年龄小一点的主恩好像更快地接受了柳河览的存在，甚至还连带接受了柳河览和崔志宇之间不存在的关系。</p><p class="story-paragraph" data-source-key="739:0">“怎么就叫上嫂子了？”</p><p class="story-paragraph" data-source-key="740:0">“如果不是嫂子的话，河览太可怜了。”金主恩将那本期刊翻到某一页推给崔志宇，密密匝匝的字母叠构成学术论文，行外人眼里的晦涩难懂对于金主恩来讲却是家常便饭。这种业内研究抑郁相相关病症的经典试验到到现在为止也依旧被无数个实验室进行着——尾巴被倒挂在平滑的杠杆上的小白鼠，崔志宇知道这个，悬尾试验：受众主体为动物的试验里会有很多不近人情的残酷性。</p><p class="story-paragraph" data-source-key="741:0">把小白鼠的尾巴固定在杠杆上，让它倒悬在空中，通过观测受体挣扎的程度用以记录和对比抑郁程度。</p><p class="story-paragraph" data-source-key="742:0">剧烈的挣扎的、没有剧烈挣扎的，放弃挣扎的形成对照。时间久了剧烈挣扎的会变成放弃挣扎的，放弃挣扎的也许已经死了。</p><p class="story-paragraph" data-source-key="743:0">只是时间问题而已。</p><p class="story-paragraph" data-source-key="744:0">金主恩的手指轻轻地顿在那张巨大的扉页上，她掀眼皮子看崔志宇，一瞬不瞬，轻声又问：“我觉得河览像这只小白鼠。”</p><p class="story-paragraph" data-source-key="745:0">她的声音很小：“可是你要怎么把河览从杠杆上放下来呢。”</p><p class="story-paragraph" data-source-key="746:0">好像真的在很认真地思考这种问题，金主恩手指曲起来很轻地摩挲自己的下巴。余光瞥到志宇抿紧了嘴巴。柔和的表情在顷刻间就冷峻下来。</p><p class="story-paragraph" data-source-key="747:0">这好像是恼怒的前兆了。</p><p class="story-paragraph" data-source-key="748:0">金主恩于是及时地将期刊从崔志宇的面前抽走：“先上课吧。 ”</p><p class="story-paragraph" data-source-key="749:0">她向来知趣，深浅得当。崔志宇不愿意听下去，她就不会再多讲一句。</p><p class="story-paragraph" data-source-key="750:0">打但是就算从杠杆上放下来了，之前受到的伤害和胆战心惊也已经构成无法磨灭的回忆。如果说之前被倒挂在杠杆上是因为身不由己的经历，现在突然出现像救世主一样的崔志宇对于河览来说算什么呢。</p><p class="story-paragraph" data-source-key="751:0">就算此刻是真心实意，发自内心，从选择说谎的那一刻起，一切的一切都是将这根杠杆无限加高的筹码。</p><p class="story-paragraph" data-source-key="752:0">而在姐姐为了河览喜怒形于色的刹那大概也成了挂在杠杆的另一边的小白鼠吧。</p><p class="story-paragraph" data-source-key="753:0">金主恩将期刊合上收进抽屉里，教室里的人多起来，上课铃响，崔教授开始用那种柔软的语调上课。</p><p class="story-paragraph" data-source-key="754:0">所以又该怎么把崔志宇从杠杆上也放下来？她是倒着的还是正着的？</p><p class="story-paragraph" data-source-key="755:0">她只是这么想了。</p><p class="story-paragraph" data-source-key="756:0">耳边突兀地传来一声叹息，崔志宇骤然推了一张纸条过来，让她帮一个忙。</p><p class="story-paragraph" data-source-key="757:0">金多绚卷着改好的剧本撩开冷饮店门帘的时候，那位已经在那里等她了。提前按照多绚的喜好点了加很多冰的饮料。很漂亮的美人皮相，头发海藻似的，又黑又浓密。美人多情这句话传神，目光落在金多绚身上也笑盈盈的，柔软又明媚：“来了？”</p><p class="story-paragraph" data-source-key="758:0">把约见的地址选在弘大最热闹的网红店这种事情本身就满怀恶意，金多绚不喜欢太热闹的地方。闹腾过头了心脏受不住。见到对方也没什么好气，改好的剧本重重往对方面前一摔：“自己的本子自己审 ，搞不清楚你到底在想什么。”</p><p class="story-paragraph" data-source-key="759:0">她字字句句都像牙缝里挤出来，咬牙切齿，火气滔天：“宇宙姐姐。”</p><p class="story-paragraph" data-source-key="760:0">不管是已读不回的崔志宇也好，还是突兀地给她发消息要见面看本子的金宇宙也好。</p><p class="story-paragraph" data-source-key="761:0">两个从小传绯闻传到大的神经病在金多绚眼里没一个好东西。</p><p class="story-paragraph" data-source-key="762:0">明明是本子一投出来就让无数公司和艺人抢破头的存在，偏偏要写个纯爱流丢到情色制作公司里。</p><p class="story-paragraph" data-source-key="763:0">对方笑眯眯的，一点也不恼：“知羽的这个角色我写的很成功呀。我很喜欢这么勇敢的知羽nim的。”</p><p class="story-paragraph" data-source-key="764:0">“而且呀，而且。”轻柔的语气，意味深长，金宇宙的声音里带着轻俏的笑意，乍一听宛如情人之间的撒娇噫语，“编剧X写的东西再怎么样质量也不会差吧。多绚的火气为什么这么大？”</p><p class="story-paragraph" data-source-key="765:0">“冲着崔志宇去的吧你。”</p><p class="story-paragraph" data-source-key="766:0">忍无可忍地翻了个白眼，金多绚埋头泄愤一样大吸一口杯子里的饮料。用着29岁的Stella的身份做着打发无聊时间的灰色工作的金多绚归根结底也只是一个不到二十代的成年人。草莓的香气和着凛冽的冰意在口腔里爆开，恰似三伏下一剂慰心的良药，稍稍地降下了她的一点点火气：“知羽知羽知羽，这个发音用脚想也是知道是姐姐在搞谁的恶作剧。”</p><p class="story-paragraph" data-source-key="767:0">嚼着草莓与冰块的多绚难得有了一点小孩子气。</p><p class="story-paragraph" data-source-key="768:0">比起崔志宇的冷漠还是金宇宙的恶趣味更让人摸不着头脑不是么，毕竟在剧本里用谐音这种东西就已经够让人头皮发麻了</p><p class="story-paragraph" data-source-key="769:0">金宇宙笑眯眯的，没有否认也没有承认：“所以这个故事志宇喜欢么？”</p><p class="story-paragraph" data-source-key="770:0">她说话的语气也轻飘飘的，风轻云淡的声音落到金多绚的耳朵里似挑衅。</p><p class="story-paragraph" data-source-key="771:0">“你喜欢么？”</p><p class="story-paragraph" data-source-key="772:0">金宇宙的剧本基本都是投给正规的影视制作公司的。</p><p class="story-paragraph" data-source-key="773:0">这个人懒，出的本少，只是写的东西好，一出就爆。</p><p class="story-paragraph" data-source-key="774:0">突兀投了一本到给这种情色制作公司，多少似包饺子喂猪。</p><p class="story-paragraph" data-source-key="775:0">只是剧本写的确实好，寄过来的文字稿，封面贴心地落了“X”签字。</p><p class="story-paragraph" data-source-key="776:0">制作部本着能火的东西不嫖白不嫖，抓耳挠腮选了河览做受方，Alpha的筛选标准按照以往，皮相漂亮器大活好——河岚的脸蛋只能是柳河览，知羽可以是任何一张漂亮的脸蛋。</p><p class="story-paragraph" data-source-key="777:0">这是公司的立场，——可以说是从定人这一步开始就已经完全的违背了金宇宙的意图了。</p><p class="story-paragraph" data-source-key="778:0">她也不恼怒，抓过金多绚丢过来的本子翻两页看，发现情色部分的东西全部被红笔做了删减字符，反而符合了丢本子过去的初心。嘴角弯了弯，那头金多绚抓了抓脑袋，托特包里翻出一整个u盘啪地一下丢到宇宙面前。</p><p class="story-paragraph" data-source-key="779:0">“第一幕啦。”她的语气硬邦邦的，“是母片，剪辑的痕迹很少，但是志宇姐姐的脸模糊化处理了。”</p><p class="story-paragraph" data-source-key="780:0">玻璃杯里的饮料很快见底，金宇宙唤来服务员又给金多绚点一份桃子沙冰。时兴节气里用水果做的冰饮最新鲜。这头她垂着眼拿着笔一点点改第二幕的细节，那头金多绚百般无聊，突兀又问：“你怎么知道河览？”</p><p class="story-paragraph" data-source-key="781:0">她和金宇宙讲崔志宇看片起意，发失心疯进去拍片这件事是当做笑话讲的，没有提过柳河览，她记得很清楚。</p><p class="story-paragraph" data-source-key="782:0">笔顿了顿，金宇宙抬眼：“河岚？”</p><p class="story-paragraph" data-source-key="783:0">“喏，河岚。”金多绚把剧本里的河岚两个字指给金宇宙看，翻到最后一页是公司做的演员表，知羽对应着崔志宇的名字。</p><p class="story-paragraph" data-source-key="784:0">河岚——金宇宙的眉梢跳了跳。</p><p class="story-paragraph" data-source-key="785:0">“河览呀。”她的声音倒是如常，“柳河览这个名字我之前没有听过。”</p><p class="story-paragraph" data-source-key="786:0">但是河岚两个字却是很有意思，译作中字体是河边蒙蒙的雾气用韩语来讲好似也是转瞬即逝的生命。活一天也要作一万年，或者说是朝闻道夕死可矣。</p><p class="story-paragraph" data-source-key="787:0">想了半天也不知道该怎么样给金多绚解释，宇宙索性直接问她多绚啊你知道蜉蝣么。</p><p class="story-paragraph" data-source-key="788:0">意料之中的茫然的眼神，金宇宙于是很耐心地继续解释：“是一种虫子，只能活一天。”</p><p class="story-paragraph" data-source-key="789:0">“一天的时间好短。”金多绚咂嘴嫌弃，“寓意不好。”</p><p class="story-paragraph" data-source-key="790:0">“朝闻道，夕死可矣。”金宇宙说，“我倒是觉得，是一种很壮烈，很坚强的生命。”</p><p class="story-paragraph" data-source-key="791:0">乱七八糟的，带有很强烈的文学和哲学性质的东西确实是金多绚不喜欢的，她不感兴趣，拿着手里的小勺子挑刨冰里的桃子粒吃。金宇宙对于她一向很宽容，不感兴趣的东西一律不继续讲，埋头刷刷地改了几笔，突兀又听金多绚讲：“河览确实是看上去只能活一天的人。”</p><p class="story-paragraph" data-source-key="792:0">金宇宙的笔尖顿了顿，抬头又去看金多绚。</p><p class="story-paragraph" data-source-key="793:0">多绚很专注地对付着眼前的甜点，咀嚼食物的模样像只仓鼠。</p><p class="story-paragraph" data-source-key="794:0">这样子的多绚很可爱，讲话含糊不清的，难得的多了一点孩子气。</p><p class="story-paragraph" data-source-key="795:0">其实一开始她进那种公司的时候金宇宙就不赞同，总觉得那个地方的高度太低，可怜人太多，接触久了自己也会变得很可怜。</p><p class="story-paragraph" data-source-key="796:0">长此以往待下去连带着性格也会被软化。</p><p class="story-paragraph" data-source-key="797:0">“是很可怜的人，一开始在那种女仆主题店做兼职打工。签合约的时候也只是以为自己被正规的娱乐公司看上了出道的可能性。”金多绚就这么风轻云淡地讲了，就算是耿耿于怀着崔志宇因为这个人跑去跟着一起住老破小的事情。</p><p class="story-paragraph" data-source-key="798:0">但是多绚在金宇宙面前从来都是很诚实的小孩：“第一次上片场的时候河览才知道要做的是那些事。 ”</p><p class="story-paragraph" data-source-key="799:0">“……”</p><p class="story-paragraph" data-source-key="800:0">金宇宙的眼睛眯了起来。</p><p class="story-paragraph" data-source-key="801:0">“拍那种片子的导演多数是beta或者性无能的Alpha。”金多绚的声音很闷，“见的太多了，所以见怪不怪。”</p><p class="story-paragraph" data-source-key="802:0">只是那时候的河览太可怜了，不知道该怎么做也没人叫她。明明只是个刚分化的omega就遇到了最粗暴的Alpha，眼睛里蒙蒙的一层水雾，要哭不哭的。被黑洞洞的镜头怼着脸拍的时候身体就僵直了，导演也不在意这些，只是一个劲的让她叫大声点喘用力点。</p><p class="story-paragraph" data-source-key="803:0">就算是这样也要不顾一切的活下去，就算是一天也要活下去。</p><p class="story-paragraph" data-source-key="804:0">“所以认为她该多活几天？”宇宙接着多绚的话头往下讲，“所以去赌了志宇的一念之间，又想通过我的剧本，甚至是想带到我的面前来，给她更多的活路么？”</p><p class="story-paragraph" data-source-key="805:0">“想活到什么程度？青龙影后这样的程度够吗？还是实现去夏威夷度假自由？或者说是到自己本身就能成为富起来的第一代的存在？”</p><p class="story-paragraph" data-source-key="806:0">“要活成什么样，你才会觉得这个人不可怜呢？”</p><p class="story-paragraph" data-source-key="807:0">金多绚的喉头滚动了一下，难得地有些茫然了。</p><p class="story-paragraph" data-source-key="808:0">金宇宙揉了揉眉心，声音难得沉下去：“但是多绚啊，就算是生命短暂如同蜉蝣，也有选择自己的活法的权利。”</p><p class="story-paragraph" data-source-key="809:0">她的声音很轻：“你，或者说志宇，你们真的可以替她做决定吗？”</p><p class="story-paragraph" data-source-key="810:0">你有没有问过她自由了以后想怎么活。</p><p class="story-paragraph" data-source-key="811:0">“就像志宇最喜欢的是梦色糕点师，梦想是成为这个世界上最好的甜点厨子。你厌憎过度的热闹一样，就算在这家隔音很棒的冷饮店，也会因为街道上的声音蹙起眉头。河览呢？喜欢什么？讨厌什么？想要选择的是什么？想要做什么？你们真的知道吗？”</p><p class="story-paragraph" data-source-key="812:0">就算这种行为是很宠爱的，无法拒绝的两个妹妹做出来的。脾气温和如金宇宙，也难免在金多绚面前沉下眉目。</p><p class="story-paragraph" data-source-key="813:0">“多绚呀。”她的语气还是很温和，柔软，明亮。带着笑意，却没有给予多绚任何可以反驳的余地，“这件事你们真的做错了。”</p><p class="story-paragraph" data-source-key="814:0">金多绚在来之前就给河览发了消息让她过来。</p><p class="story-paragraph" data-source-key="815:0">如果金宇宙最开始投在情色公司的本子是冲着崔志宇去的。</p><p class="story-paragraph" data-source-key="816:0">出自于金多绚的角度，出自于她的认知，甚至是出自于她的一厢情愿，不如让金宇宙和河览见一面吧。</p><p class="story-paragraph" data-source-key="817:0">——如果是业内大名鼎鼎的编剧X愿意捧的人，公司是没有理由不放手的。</p><p class="story-paragraph" data-source-key="818:0">而且，通过金宇宙，不是更合理么。在娱乐圈里人脉很广的编剧X在三级片里看到了适合作为自己笔下某一角的脸比崔志宇贸然地去交一笔违约金把河览带走合理多了。不突兀且顺理成章，是她能够想到的把崔志宇摘出去的最好的办法，哪怕代价是把宇宙姐姐拖到这种事情里。</p><p class="story-paragraph" data-source-key="819:0">…真的做错了么？金多绚两眼发直，有点迟钝地想。</p><p class="story-paragraph" data-source-key="820:0">可是河览太可怜了，不这么做的话，她也不知道该怎么办了。</p><p class="story-paragraph" data-source-key="821:0">哐啷一声风铃响，声音清脆，打断两人之间的谈话。</p><p class="story-paragraph" data-source-key="822:0">金宇宙直回身子，面上挂着惯有而柔软的笑意：“Stella，你的蜉蝣来了。”</p><p class="story-paragraph" data-source-key="823:0">下课的时候手机嗡嗡地振动了两下，崔志宇拿出来看了一眼。是金多绚发过来的，简单明了的OK手势。</p><p class="story-paragraph" data-source-key="824:0">事情成了。</p><p class="story-paragraph" data-source-key="825:0">金主恩知道来龙去脉，凑过来看一眼，好奇地问：“宇宙姐姐看中河览了？”</p><p class="story-paragraph" data-source-key="826:0">“不知道。”崔志宇把手机收起来，把桌面上的东西整理干净：“可能是吧。”</p><p class="story-paragraph" data-source-key="827:0">作为能出爆本的编剧，X对于演员的挑剔在圈内算是人尽皆知。</p><p class="story-paragraph" data-source-key="828:0">不清楚到底是真的满意了河览还是看在金多绚的面子上点了头。 但是如果能够塞进金宇宙的组里跑个龙套，一步一步慢慢往上走，大概也许可以走出一点可乘之机。</p><p class="story-paragraph" data-source-key="829:0">崔志宇把教科书装进挎包，敛了眸子开始思考：其实按照最开始的打算也只是到这一步，优化河览的合约，找到金宇宙蹭个顺水人情，一点一点慢慢把河览捧起来——只要河览彻底脱离那种糟糕的环境她就可以功成身退了。</p><p class="story-paragraph" data-source-key="830:0">宇宙姐姐的资源很好，就算是只是看在多绚的份上，也不会亏待河览半点。</p><p class="story-paragraph" data-source-key="831:0">因为河览足够漂亮，足够聪明，足够善良。</p><p class="story-paragraph" data-source-key="832:0">志宇有这个自信。</p><p class="story-paragraph" data-source-key="833:0">只有被捧的越高，河览离那些灰败就会越远，离的越远，也许就会越自由。举步维艰的时候都能够活下来的人送一把风一定会不顾一切的往上走的。这是趋利性，藏于骨血里的，所有人类抹灭不去的劣根。</p><p class="story-paragraph" data-source-key="834:0">在某种时候人也会有贪心的时候不是么？</p><p class="story-paragraph" data-source-key="835:0">不满足于好转的现况，偶尔也会期待一下河览在真正的屏幕上的样子。漂亮的皮囊如果困于情色也是对那张脸蛋的糟蹋。</p><p class="story-paragraph" data-source-key="836:0">崔志宇想到这里没来由觉得好笑，要怎么办好，只是金宇宙点了点头的程度，她就忍不住在想河览在那些演员颁奖礼的红毯上捧起奖杯的样子了。</p><p class="story-paragraph" data-source-key="837:0">那是一个明光万丈，无限可期的未来。</p><p class="story-paragraph" data-source-key="838:0">可对于崔志宇而言，这个未来明明就是很远很远的，不可及，甚至不可触碰的以后。</p><p class="story-paragraph" data-source-key="839:0">哪怕 ，这个未来里不会有她的身影。</p><p class="story-paragraph" data-source-key="840:0">在河览落下眼泪之前，崔志宇的设是想一步一步慢慢来。</p><p class="story-paragraph" data-source-key="841:0">解决掉这种合约，找到能够让柳河览在首尔立足的路。</p><p class="story-paragraph" data-source-key="842:0">在这个过程中她可以一直陪着河览，陪到河览的生命里就算没有崔志宇这个人的存在也可以过的很好的程度就好了——只是河览落下来的眼泪面前，她突然觉得自己好像失去了耐心。细水长流的计划不适合现在的困苦，要先把河览从这种困苦的环境里捞出来。</p><p class="story-paragraph" data-source-key="843:0">这种苦难太要命了，是她等不了的东西，一刻也等不了。</p><p class="story-paragraph" data-source-key="844:0">等崔志宇回到那个小区的时候已经很晚了。</p><p class="story-paragraph" data-source-key="845:0">崔教授临时起意，约了晚饭。金主恩溜的飞快，留着崔志宇在这里，在崔教授关切又温柔的眼神里挤出僵硬的笑意。崔家人的亲缘感淡薄，除却必要的聚会几乎不会在私下里碰头。</p><p class="story-paragraph" data-source-key="846:0">只是崔教授在学术这个方面对于崔志宇尤其关注，大概是知道了实验室里因为材料的缺乏而搁置的事情。</p><p class="story-paragraph" data-source-key="847:0">至于到底崔志宇到底是住在汉南洞的别墅群里还是汉江边上的平层里，不重要。</p><p class="story-paragraph" data-source-key="848:0">崔志宇从来都不喜欢这些。只是架不住长辈的邀约。况且对方某种程度上来说算得上是最疼爱自己的姑姑。</p><p class="story-paragraph" data-source-key="849:0">只是等到她结束晚餐，婉拒了姑姑开车送自己回汉江边那个房子提议，注视着那辆黑色轿车从视线里彻底消失的时候。崔志宇的肩膀轻轻地松动了一下，彻底放松下来的时候她只觉得整个人都垮塌了下去。</p><p class="story-paragraph" data-source-key="850:0">长长地出了一口气，她没来由又想起河览。</p><p class="story-paragraph" data-source-key="851:0">在做什么呢？河览。</p><p class="story-paragraph" data-source-key="852:0">她垂着眼轻轻地想。</p><p class="story-paragraph" data-source-key="853:0">在给那株月季花浇水么？还是在沙发上研究剧本？或者又在算她那一点少的可怜的银行存款？还是已经被惊喜冲昏了脑袋？</p><p class="story-paragraph" data-source-key="854:0">无论那笔合同上的违约金还是多余的可以结算给河览的钱都拜托多绚去操作了，很快的话河览的账户里应该也不止那笔少的可怜的钱了。</p><p class="story-paragraph" data-source-key="855:0">今天倒是委托金主恩帮忙向河览的家里以资助的形式打了一笔款项——无论是购买肥料的钱亦或者那个没有谋面的妹妹的学费都包含在里面了。</p><p class="story-paragraph" data-source-key="856:0">如果问起来就说中奖了，具体是什么奖项她让金主恩自己想，果然收获了对方嘴巴瘪起来快要哭的表情。</p><p class="story-paragraph" data-source-key="857:0">这下好了。</p><p class="story-paragraph emphasis" data-source-key="858:0">她呼出一口气，轻飘飘地想。</p><p class="story-paragraph emphasis" data-source-key="859:0">主恩也要陪我吞下一千根针了。</p><p class="story-paragraph" data-source-key="860:0">怎么会有一穷就要穷一辈子的人生呢？极度疲倦的时候思维就会不受控制地发散很多，天马行空的想象胡乱挤压着她的脑子，冒出许多纷纷纭纭的不受控制的想法。</p><p class="story-paragraph" data-source-key="861:0">是因为生了河览，生了一个这么漂亮又善良的女儿，所以把这辈子的运气都耗尽了么？</p><p class="story-paragraph" data-source-key="862:0">她想到这里，没有忍住轻轻地嗤一声。</p><p class="story-paragraph" data-source-key="863:0">又有哪家人可以把女儿养的这么单纯呢，明明她的河览可以少受很多苦的 。</p><p class="story-paragraph" data-source-key="864:0">吐出一口浊气，她在须臾间没来由很想念河览。</p><p class="story-paragraph" data-source-key="865:0">没有见过几次面却做尽了亲密的事情的河览，眼睛亮晶晶地讲要养她的河览。</p><p class="story-paragraph" data-source-key="866:0">离她很远又很近的河览。</p><p class="story-paragraph" data-source-key="867:0">崔志宇的身子轻轻地晃了晃，很快又站定。</p><p class="story-paragraph" data-source-key="868:0">或许是因为前期的实验顺利，晚餐的时候姑姑的兴致很高，开了中国那边的酒，做的精致，小小一坛，褐瓷红绸，揭开那一绸红还有一圈厚厚的封泥，拍开便是浓烈的酒香。</p><p class="story-paragraph" data-source-key="869:0">姑姑饶有趣味地讲要不然志宇也喝一点吧，你可以喝酒的。</p><p class="story-paragraph" data-source-key="870:0">你已经是大人了。</p><p class="story-paragraph" data-source-key="871:0">小小的一盏酒落在舌尖上的时候是烫辣的触感，骤然回口又有一星子甜。粮食的醇香区别于清酒单薄的味道，过于醇过于厚。姑姑却很喜欢，很轻松地同志宇讲这是江南那边的女儿红酿法。</p><p class="story-paragraph" data-source-key="872:0">江南区的江南？</p><p class="story-paragraph" data-source-key="873:0">不是的。</p><p class="story-paragraph" data-source-key="874:0">姑姑轻声讲：“是江南地带。”</p><p class="story-paragraph" data-source-key="875:0">相传中国的江南人家得了女儿，便要用上好的粮食酿上一坛醇香浓烈的酒。窖藏到女儿出嫁做人妇，这酒便能从窖中见的天日。</p><p class="story-paragraph" data-source-key="876:0">崔志宇喝不惯这样的味道，想到这个故事的时候，却觉得那时候一口饮下去的东西翻出了无穷的后劲。</p><p class="story-paragraph" data-source-key="877:0">她也要为河览埋下这一坛酒么？埋江原道的玉米酒还是选一瓶上好的清酒呢？</p><p class="story-paragraph" data-source-key="878:0">如果日后河览功成名就，她又该捧出怎样的祝贺聊表真心呢？</p><p class="story-paragraph" data-source-key="879:0">——夜风凉凉地吹过来，崔志宇只是在楼下站着，抬头怔怔地望向那一盏灯。昏黄色的灯光柔软而明媚，是没有办法于汉江畔处林立的高楼和绚烂的。夜风中捎带着很多东西，有电视的声音，食物的香气…纷杂的要素是前所未有的体验，立在昏黄的路灯下等着领口处的酒气散干净的时日也许也是人生里的初次和最后次。</p><p class="story-paragraph" data-source-key="880:0">可是就是当下，走几步就要见到面的距离里，她也不受控制的，很思念河览。</p><p class="scene-break" data-source-key="881:0" aria-label="场景分隔">…</p><p class="story-paragraph" data-source-key="882:0">我想见你。</p><p class="story-paragraph" data-source-key="883:0">她轻轻地这么想。</p><p class="story-paragraph" data-source-key="884:0">好想见你。</p><p class="story-paragraph" data-source-key="885:0">手机嗡嗡地震动起来，骤然把河览从昏沉中拉醒过来。她朦胧地揉揉眼睛。好运来的太突然，一时间把她冲的不知所措。坐在冷饮店里笑盈盈地向着自己抛出橄榄枝的编剧X完全不介意她的前嫌。被她视为天价的违约金好像也只是对方一句话的事情。</p><p class="story-paragraph" data-source-key="886:0">好像高不可攀的自由就这样被轻飘飘的捧到了她的面前，有一点像海市蜃楼，好像碰一碰就会消散的梦一样。</p><p class="story-paragraph" data-source-key="887:0">偶尔也做过这样的梦，被路过公司的星探看中脸蛋然后被不计代价的挖走，从此摆脱这种没有止境的噩梦。并不是没有这种经历，只是向着她提出来这一点的要帮她付违约金的大叔们都不怀好意，肉身债偿，明码标价，答应了就是真正的堕入地狱。</p><p class="story-paragraph" data-source-key="888:0">——从还能够见到天光的环境直接坠下另一个没有边际的牢笼。</p><p class="story-paragraph" data-source-key="889:0">所以是梦么？那位叫做X的姐姐看向自己的时候眼睛里全都是柔软的笑意，明朗坦然干净，发自内心地希望自己幸福。与其说是她在发自内心地希望自己幸福，不如讲好似在透过自己看另一个人。</p><p class="story-paragraph" data-source-key="890:0">所以她和X的某一位长得很像么？在看谁呢？有些困惑的思考着这个问题，河览恍惚着接起来了电话。</p><p class="story-paragraph" data-source-key="891:0">电话那头没有声音，只有长久的静默。</p><p class="story-paragraph" data-source-key="892:0">模模糊糊地听到了那头的风声，电话对面的人没有说话，呼吸声也很轻。</p><p class="story-paragraph" data-source-key="893:0">河览睡眼朦胧地把手机拿下来看了一眼，是志宇姐姐。颅内的那根线骤然绷紧，在回家的路上出了什么事么？</p><p class="story-paragraph" data-source-key="894:0">她猛地担心起来，胡思乱想，想到不太好的东西，莫名就觉得心胆俱裂。</p><p class="story-paragraph" data-source-key="895:0">好像从冠岳区到这边还是太远了，路上很危险，漂亮的Alpha走在路上也很危险。</p><p class="story-paragraph" data-source-key="896:0">她应该去接志宇姐姐回家的。*</p><p class="story-paragraph" data-source-key="897:0">心神滞住的刹那，就连临头的喜悦也被消失无踪，整体腾升而上的是巨大的恐慌，兜头吞没住她</p><p class="story-paragraph" data-source-key="898:0">她动了动嘴巴，感觉自己快要挤不出话。</p><p class="story-paragraph" data-source-key="899:0">“河览？”</p><p class="story-paragraph" data-source-key="900:0">电话那头的崔志宇声音很轻，带着清浅的笑意。</p><p class="story-paragraph" data-source-key="901:0">她听上去心情很好，轻巧的声音淹没在风声里，有一点说不出的愉悦。</p><p class="story-paragraph" data-source-key="902:0">悬着的心倏然就放下了。</p><p class="story-paragraph" data-source-key="903:0">河览重重地叹了口气，也小声地讲：“我在。”</p><p class="story-paragraph" data-source-key="904:0">怕崔志宇听不清楚，她清了清嗓子，又说了一声：“我在。”</p><p class="story-paragraph" data-source-key="905:0">崔志宇又笑起来。</p><p class="story-paragraph" data-source-key="906:0">今天的姐姐好像很开心，有些迟钝地，河览发现了这个点。</p><p class="story-paragraph" data-source-key="907:0">其实每次见到崔志宇的时候她都觉得对方不开心，整个人闷闷的，就像被朦胧的雾气兜头罩住，让人捉摸不清。</p><p class="story-paragraph" data-source-key="908:0">“到窗户边上来一下吧，河览。”</p><p class="story-paragraph" data-source-key="909:0">握着手机，只是说出来了第一句，按照平日里的习惯，崔志宇就说不出来第二句了。</p><p class="story-paragraph" data-source-key="910:0">所以说酒精确实在某种程度上来说是好东西，酒撞怂人胆，一口酒下去，矜持者放浪，内敛者坦率。对着心血管健康恶意极强的物质偏偏又有着浇人心魄的神奇效果。所以说很神奇不是么？虽然心魄被腾升的酒气烤着，可是思念也被飘飘然的心思放大，宛如一根尖锐的细针，骤然挑破些许隐秘的念想。</p><p class="story-paragraph" data-source-key="911:0">也许这种念想存在的时间长久，从她见到河览的第一眼就有。</p><p class="story-paragraph" data-source-key="912:0">“今天教授请喝了酒，我身上有酒气，不好闻。”</p><p class="story-paragraph" data-source-key="913:0">电流的刺啦声里，崔志宇的声音又轻又模糊，轻飘飘的声音和态度却让柳河览的心脏在胸腔里咚咚地跳动起来了，她握着手机，几乎是跑到那扇窗边。</p><p class="story-paragraph" data-source-key="914:0">恰巧风止，克莱尔奥斯汀的香气扑鼻，推窗而望时恰巧见到崔志宇抬眼，两个人遥遥相视，心脏无端端便似狠狠塌陷下一块。</p><p class="story-paragraph" data-source-key="915:0">“但是不知道为什么啊。”</p><p class="story-paragraph" data-source-key="916:0">沾染了酒气的声音一字一句地转到河览的耳朵里，很轻，似如童话故事里的床头精灵喃喃细语，稍有不慎便要被这些话引诱哄骗，直至万劫不复。</p><p class="story-paragraph" data-source-key="917:0">可是河览只是定定地看着，见到崔志宇眯着眼睛柔软地冲她笑，手机在掌心里捂的发烫，她也舍不得松开半分。</p><p class="story-paragraph" data-source-key="918:0">“我想见到你，河览。”</p><p class="story-paragraph" data-source-key="919:0">不顾一切也想见你，万劫不复也想见你。</p></div>
      </article>
    </template><template id="section-05">
      <article class="chapter" data-chapter="section-05">
        <header class="chapter-header"><span class="chapter-number">05</span><h2>Chapter 05</h2></header>
        <div class="story-body"><p class="story-paragraph" data-source-key="924:0">没有什么可以拥有的东西。</p><p class="story-paragraph" data-source-key="925:0">河览对自己定义是这样的。</p><p class="story-paragraph" data-source-key="926:0">出生的时候和双胞胎妹妹挤在一个摇篮里，长大一点了睡一个房间，上学的时候短暂地拥有过一个崭新的书包，用旧了然后就出现在妹妹的肩膀上。</p><p class="story-paragraph" data-source-key="927:0">在首尔搭地铁的时候会有乱七八糟的邪教徒过来传教，偶尔发过来传单河览也会看一眼。在痛苦和挣扎里求生的人太多了，信教好像就能够短暂地从苦海中挣脱半晌。</p><p class="story-paragraph" data-source-key="928:0">鬼使神差地她跟着那个人去了所谓的教会，足尖抵进门槛的时候莫名其妙地打了个冷战，后面她想可能是所谓的神明见不得她太辛苦所以把她从那个地方拉了回来。</p><p class="story-paragraph" data-source-key="929:0">落荒而逃之后第二天她在手机里刷到新闻，那个信奉着死亡即超脱的教会发生了一场蓄意的火灾，现场掘出了十一具焦黑扭曲的尸体。</p><p class="story-paragraph" data-source-key="930:0">在香港，首尔，或者说是在任何一座繁华的城市里，好像人命如同蝼蚁，无声息的死去或者腐烂是常事。</p><p class="story-paragraph" data-source-key="931:0">所以要活下去。</p><p class="story-paragraph" data-source-key="932:0">如果就此死亡的话也太悲催。她后知后觉的意识到了这件事。</p><p class="story-paragraph" data-source-key="933:0">如果昨天死在那场火里</p><p class="story-paragraph" data-source-key="934:0">没有人会记得她，没有人会想念她，也没有人会寻找她。</p><p class="story-paragraph" data-source-key="935:0">可能爸爸妈妈会打电话来问一下吧，认领尸首之后会多问一句有没有遗产结算，可以折成现金一起邮回江原道的老家。</p><p class="story-paragraph" data-source-key="936:0">河览想到这一段没有忍住噗嗤笑出来，近了秋日的首尔依旧刮着暖风，空气里是缱绻的柔软的暖意，她半趴在阳台上，看着崔志宇。</p><p class="story-paragraph" data-source-key="937:0">酒精的缘故，崔志宇的眼睛也亮晶晶的，明亮的柔软的一瞬不瞬地盯着自己看，恍然让河览有了要是能够这样一辈子就好了。</p><p class="story-paragraph" data-source-key="938:0">一无所有的河览短暂的拥有了一只小狗，留着短头发长着圆溜溜的眼睛，是首尔大学里读书，是很厉害的人。</p><p class="story-paragraph" data-source-key="939:0">在漫画电影或者电视剧里这样的场景应该是很浪漫的素材吧？</p><p class="story-paragraph" data-source-key="940:0">柔软的绕着窗棂开遍的克莱尔奥斯汀和楼下眨着眼睛和她对望的漂亮小狗 。崔志宇的眼睛铺着细碎的光，一瞬不瞬地望着自己的时候河览总觉得自己该说一点什么了。</p><p class="story-paragraph" data-source-key="941:0">就算是贫穷，一无所有，无处可去。</p><p class="story-paragraph" data-source-key="942:0">就算是这样，也可以在这样的氛围里说话不是么？</p><p class="story-paragraph" data-source-key="943:0">心脏被柔软的情绪浸透，河览的语言能力却被生活磨的贫瘠而简陋。</p><p class="story-paragraph" data-source-key="944:0">她想不出来什么应景的话，绞尽脑汁想了很久，电话没有被崔志宇挂断，于是她也学志宇弯着眼睛，对着那部老旧的手机一字一句轻轻地讲：“志宇呀？”</p><p class="story-paragraph" data-source-key="945:0">“嗯？”</p><p class="story-paragraph" data-source-key="946:0">河览听见自己的声音，笑着的，笨拙的，一字一句，十足十的真心。</p><p class="story-paragraph" data-source-key="947:0">“我死了以后，遗物都给你好不好。你帮我好好保管。记得我、想念我。”</p><p class="story-paragraph" data-source-key="948:0">还有找到我。</p><p class="story-paragraph" data-source-key="949:0">她轻轻的在心里想。</p><p class="story-paragraph" data-source-key="950:0">因为你会记得我，你会想念我，你会找到我。</p><p class="story-paragraph" data-source-key="951:0">因为是发自内心的这样认为着的河览，所以觉得即便是死在这一刻也没有关系了。</p><p class="story-paragraph" data-source-key="952:0">因为你出现了。</p><p class="story-paragraph" data-source-key="953:0">因为你。</p><p class="story-paragraph" data-source-key="954:0">尾指不着痕迹地颤了颤，崔志宇微微地抬了抬下巴。笑盈盈地趴在阳台上看着她的河览像小猫。尾巴晃呀晃的挠的人心痒，明明是这么可爱的模样却用毫不在意的语气讲这么让人伤心的话。</p><p class="story-paragraph" data-source-key="955:0">应该今天是有好消息的、应该开心的呀？被金宇宙和金多绚欺负了么？</p><p class="story-paragraph" data-source-key="956:0">明明看着自己的河览在笑，为什么她的眼睛却在哭呢？</p><p class="story-paragraph" data-source-key="957:0">“要我做你的未亡人么？”</p><p class="story-paragraph" data-source-key="958:0">静默过一瞬，她涩然地开口。竟从自己的声音里听出了半分哑意，好似是某种情绪压抑到了极致，电话那头的呼吸很重，崔志宇的声音却很轻。</p><p class="story-paragraph" data-source-key="959:0">“那得先结婚才行呀。”</p><p class="story-paragraph" data-source-key="960:0">她轻轻地讲。</p><p class="story-paragraph" data-source-key="961:0">好像真的被酒腌透了，说话也带上了轻飘黏糊的意味。被无限放大的情绪和感官骤然似浪潮翻涌过来吞没志宇。仿佛这一刻柳河览真的在她眼前死掉了，倏然之间变作天地之间的孤魂一缕，成为她再也抓不住的东西。</p><p class="story-paragraph" data-source-key="962:0">只是这样简单的想一想，就觉得好似胸腔里的心脏也被骤然挑出，在刀尖上血淋淋的跳。铺天盖地的痛从心室里骤然蔓延，霎时间便让志宇几乎快要落下眼泪。</p><p class="story-paragraph" data-source-key="963:0">如果你死了我还记得你的话，我也变成你的遗物了。</p><p class="story-paragraph" data-source-key="964:0">崔志宇昏昏然又固执的这么想。明明想说很多话，千言万语下，到了嘴边就成了轻飘飘的叹息。可是有些话是一定要说的，一定要做的。如果清醒过来大概就不会说出这种孤注一掷的话了不是么？</p><p class="story-paragraph" data-source-key="965:0">“河览啊。”</p><p class="story-paragraph" data-source-key="966:0">崔志宇的声音很轻，轻似初春时山间化涧的那一层薄冰，碰一碰就会支离破碎。</p><p class="story-paragraph" data-source-key="967:0">拒绝也好，怎么样都好，要说出口的。</p><p class="story-paragraph" data-source-key="968:0">“你要成为我的妻子吗？”</p><p class="story-paragraph" data-source-key="969:0">电话那头是缄默，模模糊糊的她看到河览略微地睁大着眼睛看向她了，在讶异还是觉得自己奇怪呢？如果有这么一个瞬间就好了，苦于材料费不得不下海的穷学生和被骗着签下合约的情色片演员相依为命过几年就可以理所当然的不死不休一辈子。</p><p class="story-paragraph" data-source-key="970:0">你要答应我吗？</p><p class="story-paragraph" data-source-key="971:0">你要和我结婚么？</p><p class="story-paragraph" data-source-key="972:0">成为崔志宇的妻子河览，一辈子就这么相依为命下去。死后也埋在一起，就算追到黄泉比良坂也要一起投胎转世的程度。如果真的成为了未亡人，到了未亡人的程度，一方离开另一方也会活不下去的不是么？</p><p class="story-paragraph" data-source-key="973:0">“你不要死掉。”</p><p class="story-paragraph" data-source-key="974:0">她很认真地，一字一句的讲。</p><p class="story-paragraph" data-source-key="975:0">并不是擅长掏心剖肺的人，只是讲几句单薄的话就用尽全身的力气了。就算是酒精催化也是寡言又骄傲的人，说不出来更多的话了，心绪翻涌，到了嘴边也只剩干巴巴的翻来覆去的两句话。</p><p class="story-paragraph" data-source-key="976:0">“噗嗤。”</p><p class="story-paragraph" data-source-key="977:0">电话那头传来了河览的笑声。</p><p class="story-paragraph" data-source-key="978:0">模糊的声音断断续续地撞进她的耳朵里，大概是那部手机太烂了，有一点听不清对方的声音。</p><p class="story-paragraph" data-source-key="979:0">电话被挂断了。</p><p class="story-paragraph" data-source-key="980:0">拒绝了么？还是觉得这种话太唐突了…</p><p class="story-paragraph" data-source-key="981:0">可是贸然求婚这种事情就是很突兀啊。</p><p class="story-paragraph" data-source-key="982:0">河览觉得被冒犯掉挂了电话也是很正常的事情吧!!</p><p class="story-paragraph" data-source-key="983:0">酒劲翻滚，崔志宇有一点站不住了，余光瞥到那张石凳子，她于是又坐下去。陈酒性烈，一气饮下的后劲尤其。翻涌的醉意让她有一点昏昏沉沉，恍然间就连鼻尖也拂过雪绒花清浅的香气了。</p><p class="story-paragraph" data-source-key="984:0">“以前是真的有活不下去的时候啊。”</p><p class="story-paragraph" data-source-key="985:0">叹息一般的声音倏然就从面前传来了，清晰的声线同耳畔模糊遥远的声音重叠，脸颊被冰冷的手掌轻柔地捧住抬起来，崔志宇迷茫的睁着眼睛，从河览的眼睛里看到了自己。天已经完全黑下来了，昏黄的灯光自头顶投下，太温柔太昏暗，为河览的身形镀上一层浅浅的光晕。</p><p class="story-paragraph" data-source-key="986:0">所以酒气不散掉的话真的准备在楼下坐一整晚吗？笨蛋崔志宇。</p><p class="story-paragraph" data-source-key="987:0">迷茫的望向她的眼神让河览的心软的一塌糊涂，喝多了糊糊涂涂地讲着要结婚之类的醉话是认真的么。想到那种固执粘稠的语气河览也忍不住笑出声音了。</p><p class="story-paragraph" data-source-key="988:0">崔志宇并不是趁着醉意装疯的类型啊，这么贸然大胆的讲出来就不怕她真的一口答应下来么？</p><p class="story-paragraph" data-source-key="989:0">一觉睡醒然后发现多了一个拖累会不会慌慌张张的讲不算不算那是酒后说的糊涂话啊？</p><p class="story-paragraph" data-source-key="990:0">笨蛋崔志宇，明明自己在学业和生活里也挣扎的很辛苦。</p><p class="story-paragraph" data-source-key="991:0">就这么轻轻地又想了一遍，河览却总觉得自己也可以趁着这个笨蛋糊涂的时候做一点更糊涂的事情。</p><p class="story-paragraph" data-source-key="992:0">志宇确实是喝多了，柔软又温热的触感沁着河览的指尖。乖巧柔软的崔志宇不多见，湿漉漉的眼睛茫然地看着她，模样可爱又委屈。河览俯下身子，贴住崔志宇的额头：“要我做姐姐的妻子呀？姐姐真的打算做我的未亡人么？”</p><p class="story-paragraph" data-source-key="993:0">她拉长声音，语气柔软，带着轻快的笑意：“如果是的话，姐姐就是我留下来的活着的遗物啦。”</p><p class="story-paragraph" data-source-key="994:0">“可是做了我的妻子不是应该好好的活下去么。”</p><p class="story-paragraph" data-source-key="995:0">就这么被崔志宇咕咕哝哝地反驳了。</p><p class="story-paragraph" data-source-key="996:0">“我会殉情的，你不知道么。”</p><p class="story-paragraph emphasis" data-source-key="997:0">“如果妻子死了，作为丈夫的我会活不下去的。”</p><p class="story-paragraph" data-source-key="998:0">细细碎碎的，泛着软的嘀咕翻来覆去，眼泪不受控制，扑簌簌地就这么在河览面前落下来了。这样的崔志宇好少见，圆溜溜的眼睛就这么固执地看着河览，噙着一层薄薄的眼泪，看上去漂亮又易碎。耳垂被河览轻柔地捻住，揉捏。很快就泛起一层浅淡的红。这样的捻揉，无端端便让两人之间多了些促狭与狎昵的意味。无害和柔软的质感轻飘飘地戳着柳河览的心脏，鼻尖轻轻地蹭了蹭崔志宇的鼻尖，以一种十足十的怜惜的态度。</p><p class="story-paragraph" data-source-key="999:0">“关于生和死的事情不要胡乱的讲啊。志宇姐姐。如果真的死掉了，在下面看到你的身影，我也会很难过的。”手指轻轻地蹭过志宇的耳畔，河览也只觉得太烫了，崔志宇滚烫的眼泪和如同洪水似的铺面而来的情感兜头把她淹没。</p><p class="story-paragraph" data-source-key="1000:0">太厚太重太沉，是崔志宇给予她的，独有的一份——是她曾经不曾尝过的，没有经历过的东西。</p><p class="story-paragraph" data-source-key="1001:0">鬼使神差地跟着那个人走到教会门口想的是就算是这样死去了也没关系了，直到现在看到崔志宇的眼泪才后之后觉的心有余悸了起来。</p><p class="story-paragraph" data-source-key="1002:0">如果死在那个时候，遗物还有银行卡里的微薄的存款会化作冰冷的现金流回江原道。至于遗体怎么处置也是不得而知的事情，田垄上的一捧肥亦或化作灰烬被随意地扬在天地之间？唯唯诺诺地在电话里问着有没有多余的存款可以汇一点给家里么的父母在她踏足首尔之后好似就变成了贪得无厌的怪物。</p><p class="story-paragraph" data-source-key="1003:0">就算知道了她分化成omega有没有多余的担心，只是很兴奋地在电话里讲分化成omega真是太好了啊，omega会嫁的很好。</p><p class="story-paragraph" data-source-key="1004:0">挂掉电话的时候就河览就觉得身体里好像有什么东西破碎掉了。</p><p class="story-paragraph" data-source-key="1005:0">可是江原道的亲缘是没有办法彻底割舍掉的，彻底割舍了她在这个世界上就真的什么东西都剩不下了。</p><p class="story-paragraph" data-source-key="1006:0">直到现在，此刻，这一秒。</p><p class="story-paragraph" data-source-key="1007:0">她意识到了也许有别的东西可以留下来。</p><p class="story-paragraph" data-source-key="1008:0">这种想法很自私么？很自私吧。</p><p class="story-paragraph" data-source-key="1009:0">朝暮一瞬的蜉蝣也会在羽化死亡的刹那拼尽全力地留下自己的后代，就算这辈子这样倒霉了，可以还是…还是会想着如果有这么一个人，能够在某个刹那出现，然后单纯的爱过她一瞬间就好了。</p><p class="story-paragraph" data-source-key="1010:0">只是这样的想着喉口也似被堵过一块棉花，柔软粗糙的剐擦着扁桃处薄弱的血肉。</p><p class="story-paragraph" data-source-key="1011:0">嗓子也疼的发堵，河览也觉得自己快要掉眼泪了。</p><p class="story-paragraph" data-source-key="1012:0">遇到崔志宇这个爱哭鬼之后好像就被传染了，眼泪格外的多，是因为泪腺出问题了么？</p><p class="story-paragraph" data-source-key="1013:0">如果在此刻吻下去算什么？知羽和河岚？亦或者柳河览和崔志宇？</p><p class="story-paragraph" data-source-key="1014:0">有的人喝了酒之后就会陷入断片状态，第二天醒过来的时候什么也不会记得。崔志宇会记得么？</p><p class="story-paragraph" data-source-key="1015:0">其实不记得也没关系，不记得的话装作什么事也没有发生过就好了。</p><p class="story-paragraph" data-source-key="1016:0">唇瓣颤颤巍巍地贴住崔志宇的嘴巴，脱离了镜头之后，就显得青涩而绵长。</p><p class="story-paragraph emphasis" data-source-key="1017:0">如果这也算做回应的话，捻着崔志宇的耳垂的指尖轻柔地松开，转而覆上那双沾满泪水的，红肿的眼睛。</p><p class="story-paragraph" data-source-key="1018:0">柳河览在心里轻轻地想 。</p><p class="story-paragraph" data-source-key="1019:0">如果在此刻成为志宇姐姐的妻子的话，我愿意。</p><p class="story-paragraph" data-source-key="1020:0">夜已经沉了，雾蒙蒙的天上单薄地挂着几颗星子。高楼林立的城市不似乡下空气清新，看得到星星的天气就是极好的天气。首尔过半夜的街道也热闹，熙攘来往的人群，更衬得狭小的出租屋内流动的空气愈发黏稠。</p><p class="story-paragraph" data-source-key="1021:0">隔离带和衣物被胡乱的丢在地上缠作一团。</p><p class="story-paragraph" data-source-key="1022:0">但是没人顾得上它们。狭窄的单人床不堪重负似地发出吱呀吱呀的声音，伏于上方的身躯瘦削而纤细——不只是单纯的瘦，背脊上覆着一层薄薄的肌肉，漂亮的脊线随着每一次的动作舒展和收缩，昏黄的灯光下呈出了一种不像话的漂亮。</p><p class="story-paragraph" data-source-key="1023:0">若是再仔细看，就能看到这具躯体下覆着的另一具：白皙孱瘦，一丝不挂。小腿几乎快同手臂一样瘦了，堪堪地挂住上位者的腰肢，颤颤巍巍的晃。</p><p class="story-paragraph" data-source-key="1024:0">河览被志宇大开大合的凿顶激的发抖。</p><p class="story-paragraph" data-source-key="1025:0">连绵的如同潮水一般的快感冲激的有些受不住，颤栗着收紧腿挂在志宇身上，又被陌生又连绵的快感冲击着，就连平日里小心翼翼收敛着的信息素也不受控制地往外疯窜</p><p class="story-paragraph" data-source-key="1026:0">整个房间都是铺天盖地的清苦的气息。</p><p class="story-paragraph" data-source-key="1027:0">河览的手指深深地陷进对方精瘦的脊背，
