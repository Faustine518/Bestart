<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d15">
  <meta name="description" content="Bestart — 芬兰寂静雪夜中的同人文库。">
  <title>Bestart — A Library in the Polar Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #080d15;
      --night-blue: #0c1624;
      --snow: #dce7ef;
      --snow-muted: #8d9aa7;
      --warm: #fcd34d;
      --warm-soft: #ffe9a6;
      --ink: #e9edf0;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Cormorant Garamond", "Noto Serif SC", serif;
      background:
        radial-gradient(circle at 50% 42%, rgba(24, 43, 64, .38), transparent 31%),
        linear-gradient(180deg, #090f19 0%, var(--night-blue) 52%, var(--night) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .52;
      background:
        linear-gradient(115deg, transparent 30%, rgba(156, 183, 204, .025) 50%, transparent 70%),
        radial-gradient(ellipse at 50% 115%, rgba(194, 217, 230, .08), transparent 45%);
      animation: sky-breathe 12s ease-in-out infinite alternate;
    }

    .site-header {
      position: fixed;
      z-index: 10;
      top: clamp(1.4rem, 4vw, 3rem);
      left: clamp(1.4rem, 5vw, 4.5rem);
      display: flex;
      align-items: baseline;
      gap: .8rem;
      letter-spacing: .18em;
    }

    .brand {
      margin: 0;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      font-weight: 500;
      text-transform: uppercase;
    }

    .brand-note {
      color: var(--snow-muted);
      font: 300 .68rem/1 "Noto Serif SC", serif;
      letter-spacing: .26em;
    }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 6rem 1.5rem 2rem;
    }

    .snowfield,
    .snowfield::after {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .snowflake {
      position: absolute;
      top: -5vh;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      opacity: var(--opacity);
      background: var(--snow);
      filter: blur(var(--blur));
      animation: snowfall var(--duration) linear var(--delay) infinite;
    }

    .horizon {
      position: absolute;
      z-index: -1;
      right: 0;
      bottom: 0;
      left: 0;
      height: 28vh;
      opacity: .45;
      background:
        linear-gradient(178deg, transparent 0 42%, rgba(173, 195, 208, .055) 43% 45%, transparent 46%),
        radial-gradient(ellipse at 50% 100%, rgba(193, 213, 224, .12), transparent 56%);
      clip-path: polygon(0 40%, 17% 34%, 34% 44%, 52% 32%, 70% 43%, 86% 35%, 100% 41%, 100% 100%, 0 100%);
    }

    .installation {
      position: relative;
      display: grid;
      justify-items: center;
      width: min(92vw, 760px);
      transform: translateY(2vh);
    }

    .lamp-button {
      position: relative;
      z-index: 3;
      width: 122px;
      height: 338px;
      padding: 0;
      border: 0;
      color: inherit;
      cursor: pointer;
      background: none;
      -webkit-tap-highlight-color: transparent;
    }

    .lamp-button:focus-visible {
      outline: 1px solid rgba(252, 211, 77, .72);
      outline-offset: 12px;
      border-radius: 60px 60px 8px 8px;
    }

    .lamp-cap {
      position: absolute;
      top: 0;
      left: 50%;
      width: 82px;
      height: 14px;
      border-radius: 50% 50% 3px 3px;
      background: linear-gradient(90deg, #111923, #26313a 52%, #0b1118);
      transform: translateX(-50%);
      box-shadow: 0 5px 8px rgba(0, 0, 0, .6);
    }

    .lamp-cap::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 38px;
      height: 15px;
      border-radius: 50% 50% 0 0;
      background: #17212b;
      transform: translateX(-50%);
    }

    .lamp-head {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 64px;
      height: 68px;
      overflow: hidden;
      border: 4px solid #18212a;
      border-top-width: 6px;
      border-radius: 4px 4px 18px 18px;
      background: rgba(47, 56, 62, .22);
      transform: translateX(-50%);
      transition: background 1.1s ease, box-shadow 1.1s ease, filter 1.1s ease;
    }

    .lamp-head::before,
    .lamp-head::after {
      content: "";
      position: absolute;
      top: -8px;
      width: 4px;
      height: 80px;
      background: #171f27;
    }

    .lamp-head::before { left: 14px; transform: rotate(-8deg); }
    .lamp-head::after { right: 14px; transform: rotate(8deg); }

    .lamp-neck {
      position: absolute;
      top: 76px;
      left: 50%;
      width: 12px;
      height: 28px;
      border-radius: 3px;
      background: linear-gradient(90deg, #0b1118, #26313a, #0a1016);
      transform: translateX(-50%);
    }

    .lamp-pole {
      position: absolute;
      top: 98px;
      bottom: 20px;
      left: 50%;
      width: 8px;
      border-radius: 5px;
      background: linear-gradient(90deg, #080d12, #303b43 48%, #10171d);
      transform: translateX(-50%);
      box-shadow: 5px 0 12px rgba(0, 0, 0, .3);
    }

    .lamp-base {
      position: absolute;
      bottom: 8px;
      left: 50%;
      width: 62px;
      height: 16px;
      border-radius: 50% 50% 4px 4px;
      background: linear-gradient(90deg, #070b10, #263139, #080d12);
      transform: translateX(-50%);
    }

    .lamp-base::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 9px;
      width: 30px;
      height: 20px;
      border-radius: 5px 5px 0 0;
      background: #151e25;
      transform: translateX(-50%);
    }

    .light-cone {
      position: absolute;
      z-index: 1;
      top: 42px;
      left: 50%;
      width: min(72vw, 520px);
      height: 370px;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(180deg, rgba(255, 223, 123, .17), rgba(252, 211, 77, .025) 70%, transparent);
      filter: blur(12px);
      clip-path: polygon(45% 0, 55% 0, 96% 100%, 4% 100%);
      transform: translateX(-50%) scale(.55, .75);
      transform-origin: 50% 0;
      transition: opacity 1.2s ease, transform 1.8s var(--ease-out);
    }

    .toc {
      position: relative;
      z-index: 4;
      min-height: 88px;
      margin-top: -8px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(12px);
      transition:
        opacity 1.5s ease .25s,
        filter 1.5s ease .25s,
        transform 1.5s var(--ease-out) .25s;
    }

    .toc-label {
      margin: 0 0 .75rem;
      color: rgba(255, 235, 174, .46);
      font-size: .65rem;
      letter-spacing: .42em;
      text-transform: uppercase;
    }

    .story-link {
      position: relative;
      display: inline-block;
      padding: .65rem 1rem;
      color: var(--warm-soft);
      font: 300 clamp(1.05rem, 2.5vw, 1.35rem)/1.5 "Noto Serif SC", "Cormorant Garamond", serif;
      letter-spacing: .13em;
      text-decoration: none;
      text-shadow: 0 0 18px rgba(252, 211, 77, .24);
      transition: color .35s ease, text-shadow .35s ease;
    }

    .story-link::after {
      content: "";
      position: absolute;
      right: 1rem;
      bottom: .35rem;
      left: 1rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(252, 211, 77, .58), transparent);
      transform: scaleX(0);
      transition: transform .6s var(--ease-out);
    }

    .story-link:hover,
    .story-link:focus-visible {
      color: #fff7d6;
      text-shadow: 0 0 24px rgba(252, 211, 77, .42);
      outline: none;
    }

    .story-link:hover::after,
    .story-link:focus-visible::after { transform: scaleX(1); }

    .story-link.mist-exit {
      animation: mist-away 1.1s var(--ease-out) forwards;
      pointer-events: none;
    }

    .instruction {
      position: fixed;
      z-index: 8;
      right: 0;
      bottom: clamp(1.4rem, 4vw, 2.5rem);
      left: 0;
      margin: 0;
      color: rgba(192, 207, 218, .48);
      font: 300 .66rem/1.6 "Noto Serif SC", serif;
      letter-spacing: .32em;
      text-align: center;
      transition: opacity .7s ease, transform .7s ease;
    }

    .installation.is-lit .lamp-head {
      background: radial-gradient(circle at 50% 42%, #fffbd6 0 8%, #ffe690 22%, #eab844 64%, rgba(232, 168, 45, .34) 100%);
      box-shadow:
        0 0 18px 5px rgba(252, 211, 77, .65),
        0 0 55px 18px rgba(252, 211, 77, .28),
        0 0 110px 35px rgba(245, 158, 11, .13);
      filter: drop-shadow(0 0 12px rgba(252, 211, 77, .9));
      animation: lamp-breathe 4.8s ease-in-out 1.1s infinite;
    }

    .installation.is-lit .light-cone {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .installation.is-lit .toc {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
      pointer-events: auto;
    }

    body.lit .instruction { opacity: 0; transform: translateY(7px); }

    @keyframes snowfall {
      from { transform: translate3d(0, -5vh, 0) rotate(0deg); }
      55% { transform: translate3d(var(--drift), 53vh, 0) rotate(130deg); }
      to { transform: translate3d(calc(var(--drift) * -.35), 110vh, 0) rotate(260deg); }
    }

    @keyframes lamp-breathe {
      0%, 100% { filter: brightness(.98) drop-shadow(0 0 11px rgba(252, 211, 77, .82)); }
      50% { filter: brightness(1.08) drop-shadow(0 0 17px rgba(252, 211, 77, 1)); }
    }

    @keyframes mist-away {
      0% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); letter-spacing: .13em; }
      45% { opacity: .62; filter: blur(3px); }
      100% { opacity: 0; filter: blur(9px); transform: translateY(-10px) scale(1.035); letter-spacing: .2em; }
    }

    @keyframes sky-breathe { to { opacity: .78; } }

    @media (max-height: 640px) {
      .installation { transform: translateY(4vh) scale(.86); }
      .toc { margin-top: -26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
      .snowflake { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header" aria-label="Bestart">
    <h1 class="brand">Bestart</h1>
    <span class="brand-note">极夜文库</span>
  </header>

  <main class="scene">
    <div class="snowfield" aria-hidden="true"></div>
    <div class="horizon" aria-hidden="true"></div>

    <section class="installation" aria-label="点亮路灯以打开文库">
      <div class="light-cone" aria-hidden="true"></div>

      <button class="lamp-button" type="button" aria-label="点亮路灯" aria-pressed="false">
        <span class="lamp-cap" aria-hidden="true"></span>
        <span class="lamp-head" aria-hidden="true"></span>
        <span class="lamp-neck" aria-hidden="true"></span>
        <span class="lamp-pole" aria-hidden="true"></span>
        <span class="lamp-base" aria-hidden="true"></span>
      </button>

      <nav class="toc" aria-label="文章目录" aria-hidden="true">
        <p class="toc-label">In the lamplight · 01</p>
        <!-- 将 href 替换为你的真实文章地址 -->
        <a class="story-link" href="bruise-war.html">淤青战争 <span aria-hidden="true">|</span> The Bruise War</a>
      </nav>
    </section>
  </main>

  <p class="instruction">点击灯火 · ENTER THE LIGHT</p>

  <script>
    (() => {
      const snowfield = document.querySelector('.snowfield');
      const installation = document.querySelector('.installation');
      const lamp = document.querySelector('.lamp-button');
      const toc = document.querySelector('.toc');
      const storyLink = document.querySelector('.story-link');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // A restrained, randomized snowfield: generated once, animated entirely by CSS.
      if (!reduceMotion) {
        const fragment = document.createDocumentFragment();
        const flakeCount = Math.min(44, Math.max(26, Math.round(window.innerWidth / 32)));

        for (let i = 0; i < flakeCount; i += 1) {
          const flake = document.createElement('i');
          const size = (Math.random() * 2.2 + .7).toFixed(2);
          flake.className = 'snowflake';
          flake.style.left = `${(Math.random() * 100).toFixed(2)}%`;
          flake.style.setProperty('--size', `${size}px`);
          flake.style.setProperty('--opacity', (Math.random() * .46 + .18).toFixed(2));
          flake.style.setProperty('--blur', `${(Math.random() * .8).toFixed(2)}px`);
          flake.style.setProperty('--drift', `${(Math.random() * 54 - 27).toFixed(1)}px`);
          flake.style.setProperty('--duration', `${(Math.random() * 10 + 13).toFixed(1)}s`);
          flake.style.setProperty('--delay', `${(Math.random() * -22).toFixed(1)}s`);
          fragment.appendChild(flake);
        }
        snowfield.appendChild(fragment);
      }

      lamp.addEventListener('click', () => {
        if (installation.classList.contains('is-lit')) return;

        installation.classList.add('is-lit');
        document.body.classList.add('lit');
        lamp.setAttribute('aria-pressed', 'true');
        lamp.setAttribute('aria-label', '路灯已点亮');
        toc.setAttribute('aria-hidden', 'false');
      });

      storyLink.addEventListener('click', (event) => {
        event.preventDefault();
        if (storyLink.classList.contains('mist-exit')) return;

        const destination = storyLink.href;
        storyLink.classList.add('mist-exit');
        storyLink.setAttribute('aria-disabled', 'true');

        window.setTimeout(() => {
          window.location.href = destination;
        }, reduceMotion ? 30 : 1100);
      });
    })();
  </script>
</body>
</html>
