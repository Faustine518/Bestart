      <div class="chapter-copy"><aside class="author-note"><span>Notes</span><p>《边缘》凑崎纱夏个人番外</p></aside><p class="story-paragraph">凑崎很不喜欢在纽约搭车，有顺风车她也不爱坐，除非是迫不得已。</p><p class="story-paragraph">反正学校里就有地铁站，去哪里都很方便，再来是家也离学校不远，她是来拿硕士学位的，不像本科生那样还有寝室分配。</p><p class="story-paragraph">凑崎不缺钱，于是便不花时间在申请宿舍上，借了指导教授的名号顺利地找到了靠谱的中介，而如果是从租来的公寓出发，跨过三四条街也一样能到校园，更没有必要奢侈地靠着计程车出行。</p><p class="story-paragraph">至于还有什么客观原因吗？似乎没有了。</p><p class="story-paragraph">纽约汽车的方向盘靠左，和东京那边不一样，凑崎在这样一种悄无声息的记号里再次确认自己被丢下，又或者是被抛弃。</p><p class="story-paragraph">像是谁手中断了线的风筝，也像被人搁在角落以后便不屑一顾的一袋垃圾。</p><p class="story-paragraph">那些被家人们簇拥着来注册新学期的同学们看上去绝不可能有她这么悲伤，就算是那些受制于机票价格而孤身来到这里的留学生也一样，他们都比她幸福。</p><p class="story-paragraph">凑崎很羡慕他们，而她唯一的希望寄托在那通永远无法接起的电话上。她有时倔强地去拨打南的号码，想着也许哪一天妈妈就会再叫一次她的名字，像从前的她们还在一起时那样温柔地哄她一次，却总是毫无意外地听见关机的提示声。</p><p class="story-paragraph">很难感受到悲伤——凑崎身处空旷的原野，涌向她的情感替换成无边无际的孤苦。</p><p class="story-paragraph">原先那些旺盛的生命力像无人看管的杂草，是被炽热的爱情烧着了以后一丝一毫也不剩的灰烬。</p><p class="story-paragraph">凑崎原先的气话真的一语成谶，即便她在超负荷地加速成长，即便她已经比同龄人懂事太多，也依然拦不住妈妈的决心。</p><p class="story-paragraph">而如若南走了，她又要去哪里才能找回她？</p><p class="story-paragraph">她很怕南不要她了，怕她悄无声息地离开。</p><p class="story-paragraph">每半个月发来一次的电子邮件能割断凑崎心里悬着巨石的那条绳子，她在那一堆文字里寻找着南存在过的痕迹，在传到手上的照片里见着她有些憔悴却依然美丽的面容。</p><p class="story-paragraph">可新生的恐惧不到一天又会再度升起，周而复始地折磨她的尊严和勇气。</p><p class="story-paragraph">南在她的脑海里开始变得模糊不清，凑崎分明是如此地想要抓住她，却终究敌不过时间伟大又恐怖的力量。</p><p class="story-paragraph">妈妈正在从她的记忆里逃逸，凑崎想用文字去记录她和南曾经经历过的一切，还是无法阻止这用沙子堆出来的城堡一点点地在她指缝中碎灭。</p><p class="story-paragraph">凑崎开始怀疑她和南之间那所谓看似坚不可摧的关系，原先幼稚的结论在现在再也站不住脚，她已经亲眼见证了一个人逐渐将另一个人淡忘的过程，她便是那样慢慢地磨平了心里对亲生父母的追思，而她曾以为被养母强行剥夺掉那份爱情以后便能和她享有长久的不离不弃，却又在这样辽阔的世界里再次看清了虚虚实实的真相。</p><p class="story-paragraph">永远——</p><p class="story-paragraph">凑崎终于觉得这样的字眼只有可能出现在小说里某些打动人心的桥段之中，她那可笑的承诺不过是在洪流的蹂躏底下掀不起一丝波澜的挣扎。</p><p class="story-paragraph">她渐渐地想不起南的声音，就算是妈妈在梦里与她再度重逢，她也无法听见她说话。</p><p class="story-paragraph">凑崎在潮湿的眼泪之中醒来，捏着手腕确认薄弱又依旧存在着的心跳，不明白自己为何在如此汹涌的疼痛侵袭下还活着。</p><p class="story-paragraph">她想也许她本身就是这样无耻，才能接连在失去挚爱之人的悲伤中苟且偷生。</p><p class="story-paragraph">对南的爱到底是否是真的——还是因为年轻又不肯服输的好胜心，再加上想要独占她美丽母亲的欲望共同作用下产生的冲动？</p><p class="story-paragraph">凑崎无法想明白这个问题，没有人教她，她的那段初恋不过是没有回音的故事，建立在南的怜悯之上。</p><p class="story-paragraph">很难说这究竟是好是坏，凑崎因此从不将两情相悦又不得已分开的浪漫模式套在自己身上，诞生在主人公之间那样的热烈又赤诚的爱意不属于她，她连一蹶不振的理由都没有。</p><p class="story-paragraph">而如果说凑崎也需要对什么负责，那就是对被南从悬崖旁边救回来的、属于她自己的生命而负责。</p><p class="story-paragraph">可摸索着在疼痛中前进实在是太难，好好地爱自己也实在是太难，她这半生以来几乎都是为了南而活，哪怕是要做出改变、想颠覆这个现状的源动力也是出于对妈妈的感激。</p><p class="story-paragraph">但凑崎已经别无他法——凡事都要善始善终，这个道理正是南教给她的，所以她用了最简单粗暴的方法，安静地割舍了多余的思想空间，等着有什么可能出现却也有可能不出现的东西降临。</p><p class="story-paragraph">凑崎几乎有很长一段时间是在死亡周围徘徊，虽说有朋友，但疲于应付复杂的社交关系，她将大部分时间扎根于莎士比亚的十四行诗与古典时期的希腊悲剧之中，像是吃饭一样从里面汲取养料——反正她也没有什么办法好好规律地饮食，作息因为失眠而被打乱，不得不去买褪黑素，凑崎甚至好几次动了吃安眠药的念头，但她一个人住，担心睡得太久会误了事。</p><p class="story-paragraph">女孩的视线掉在那么多外文写出的铅字里，读书也比在东京时更认真，每天忙得几乎不歇气，用全部的力气和难懂的笔法硬杠。她很少去买纸质版的软装书，这依然也是当初的习惯作祟，有想要读的著作，她不是去图书馆借就是在因特网上找电子版，长时间对着数码屏幕，眼睛慢慢也出了点问题，再加上要熬夜写论文，她不得已买了副防蓝光的眼镜戴着。凑崎的神经紧绷得像是一根细弦，又脆弱，却又坚韧，她感觉身体被打碎而重新建立的痛感是真实存在的，她所吸进肺部的气体也因此有所区别，万物的颜色有时在混沌之中变得更鲜艳，有时又变得更浅薄。</p><p class="story-paragraph">意识在濒临恍惚之际便将经历过的日子也拉得特别长，而人总归是要有信仰才能在这世上生存，无论卑劣高贵——凑崎也不知道她那时浑浑噩噩地在黑暗之中抓住了什么，也许她本来就比自己想象中的还要坚强，或者说是更加冷酷，总而言之她平安无事地活到了那年冬天，还颇为成熟地给南发邮件，以冷静又看不出异常的语气让妈妈加油，哪怕她已经要撑不下去了，要在南先一步以前放弃了。</p><p class="story-paragraph">在平安夜到来的一周以前，可能是出于同情亦或是其他的情愫，班上从伦敦来的 Arno，还有几个平时凑崎印象里和他玩在一起的朋友问她：要不要共同体验一次西方正宗的新年。她犹豫了一会还是答应了，在采购时跟着他们去了大型超市，还看到被人们挂在墙上的红绿流苏装饰，以及竖在入口的那么几颗规模超常的圣诞树。</p><p class="story-paragraph">凑崎在这时想起了她的家，她不知道南在这个新年里会不会像她一样孤独，于是她结账的时候买了两个苹果，想将妈妈的那一份一起吃了。</p><p class="story-paragraph">十二月末的冬季降下了大雪，也许是临海的缘故，恼人的疾风不偏不倚地对着临港地带吹，纽约作为美国东北部首当其冲的悲惨角色，向来要承蒙极端气候带来的乱象，气象局提前一周就开始预警，电视新闻也在轮流播放各个州的受灾情况，但凑崎没有料到风雪最盛的那么几天正好落在圣诞节，她是真的这次雪灾中亲身体会到什么叫作寸步难行，原本订好的聚会也因此取消。</p><p class="story-paragraph">她已经结课了，无处可去，便窝在床上，闲下来时那阵突兀的痛感又在变本加厉地苏醒，她无人倾诉，像记日记那样写她的经历，美化了一切措辞和修饰，重读全篇时发现自己使用日语的能力已经不如曾经娴熟，就连说话的口音也不可避免地有些细小的改变。</p><p class="story-paragraph">凑崎慌了神，她怕她曾经那些宝贵的坚持也要逐渐消失不见，这对一个生活在过去的人而言实在是最痛苦不过的事。</p><p class="story-paragraph">她在 YouTube 上找了些动漫来看，一个人在风雪交加的夜晚对着发光的手机屏幕又哭又笑，其实耳朵却像被人关闭了一样，什么声音也听不见。</p><p class="story-paragraph">她似乎又回到了揭发真相的那个时候，回到了她小时候生病的时候，而这次没有人来救她。</p><p class="story-paragraph">凑崎也不看书了，灵魂好像在渐渐从她身体中流走，直到什么时候只留下一具空壳。</p><p class="story-paragraph">她没有在意哪天是平安夜，哪天又是圣诞节，如此情况维持到真正的新年前夜，她凌晨时迷迷糊糊地被紧攥着的手机震醒。</p><p class="story-paragraph">凑崎原先的觉没有这么浅，现在却这样轻易地就被提示声吵得不得安宁，女孩在半梦半醒之间看到几行小字，那是用日语写的。</p><p class="story-paragraph">除了妈妈似乎没人记得了，就连她自己也不记得今天是她以前那样翘首以盼的生日。</p><p class="story-paragraph">她想强行赶走像暖风一样拥住她的困意，可还是没能做到，第二天醒来时手机已经自动关机了，她怕昨天的祝福只是自己的梦，都没来得及洗漱也要先给它充上电。凑崎最后像个傻瓜似地看着那条简讯痛哭，一直到指尖也因为头脑充血而震颤发麻。</p><p class="story-paragraph">她的心里有一块结成的痂如同冰块一样碎裂了，这才意识到自己这么久以来其实一直都在埋怨南。</p><p class="story-paragraph">那是某种和爱一起在她脑海里滋生的恨，它几乎将她身体的所有感官都封存在几年前的那个夏天，将她关在了和妈妈开始这一切的第一个夜晚。</p><p class="story-paragraph">原来即使是那样不舍得忘记的一天，也离她那么远了。</p><p class="story-paragraph">凑崎瘦了太多，从体重秤上来看起码是掉了五六公斤，少女时期那点有肉的感觉完全消失了，她腰臀的比例本身就好，瘦下来便越发显得身姿纤细曼妙，五官和面孔几乎换了一幅更有攻击性的，她看着镜子里的自己，不禁伸手去摸她那还看得到原先影子的面庞，这是时间和伤痛共同在她身上作用的结果，换种角度去看的话，也许正是妈妈给了她这样的变化。</p><p class="story-paragraph">她成为这样终究是受到了南的影响，而现在的她却又是脱离了妈妈为自己存在的人格。</p><p class="story-paragraph">她与这个陌生的人静默无言地相视了一会，不知道她是自己体内突生的异变，还是原本就被她埋在心里却有意识藏起来的本我。</p><p class="story-paragraph">凑崎花了点时间接受这个事实，接受了二十三岁的开端。</p><p class="story-paragraph">放晴的初日，她加入了街区的铲雪大队，久违的暖阳拂过她裸露在外的皮肤。</p><p class="story-paragraph">而那以为彻底成了尘土的心愿里终于出现了还没有被完全扑灭的火星，它们像被温度渐渐融化成的雪水，再一次弥漫成那样清晰明了的光点。</p><p class="story-paragraph">凑崎像个伤后复健的病人，正在重新建立起与这个世界的联系，并且练习着如何其他鲜活的东西打交道。</p><p class="story-paragraph">她这次没有再将希望寄托在任何人身上。</p><p class="story-paragraph">可能是一直在与文学过招，复苏的情绪像是干涸的河床里再次涌进来的浪潮，和她奇思妙想的灵感一齐喷薄而出。</p><p class="story-paragraph">第一个学年的上半学期沉默寡言的女孩子慢慢地在学院里成了焦点——毕竟优秀的人太多，凑崎还没有到那样闪闪发光的程度，她只是将快要没办法完全控制得了的新生力量灌注在学术论战里，获得了和几门课的教授越发熟稔的好处，还抽了时间跑到经济学院组织的公开演讲上聆听大众的声音，新一年感恩节的舞会她也没缺席。</p><p class="story-paragraph">凑崎在这里找到了诠释自己的新方法，也许是和颠覆太大的社会环境有关，但一切确实与之前不同了，她没想到自己其实这么爱和人相识，也没想到她在交朋友的方面上有着异禀的天赋。</p><p class="story-paragraph">女孩子没有再一门心思地成天往图书馆里跑，可能是性格的原因，凑崎和那群住在曼哈顿城区的纽约人更为交好，她偶尔会和他们一起去听音乐剧，也一次次在酒吧里尝过了莫吉托和百利甜的味道，还有哪天碰到了很盛大的月食，她被以举行庆祝典礼为由的同窗抹了一脸奶油。</p><p class="story-paragraph">凑崎的天性正被纽约特殊的磁场一点点解放，包括在南身边一直沉睡着的叛逆心，但她始终没有玩得太过火，有喊她一起抽叶子的白人朋友，而她在心里重新翻出了伯利恒的名字。这便是她拒绝的理由：凑崎同他们游刃有余地周旋，以漂亮圆滑的理由推脱了某种程度上的堕落。</p><p class="story-paragraph">又因为交流时将英语说得太好，本地人会用的俚语被她玩着转，长相也这样锐利迷人。</p><p class="story-paragraph">在被越来越多朋友调侃是不是当地人以后，凑崎还真的顺水推舟了一把，出于爱尝新鲜的好奇心预约了理发师，直接将头发染成了淡金色的。</p><p class="story-paragraph">在将近有半年的时间里，她只要带了妆出门，就一定会被初见的人当作是美国人，对此她既觉得无奈又好笑，却有加无已地继续贪玩，从不进行多余的解释——哪怕是那个大她两岁的前男友在一开始与她相识时也被蒙在鼓里。</p><p class="story-paragraph">Ryan 是等到他们认识的几个星期以后才知道她从小在太平洋西岸长大，而凑崎的日语口语依旧停留在不太好的态势之下，当她开口想用家乡的语言来自证时，Ryan 显然是不相信这番说辞。</p><p class="story-paragraph">他用湛蓝的眼睛饶有兴味地瞧着凑崎，不过也很有绅士风度地没再刁难她。</p><p class="story-paragraph">Ryan 的长相还不错，头发是偏棕的，个子也高，他算收敛，没有直接伸了长腿到凑崎眼前。</p><p class="story-paragraph">凑崎感觉 Ryan 是要去做什么正式的事：他穿着黑色的皮鞋，她的装扮倒有些和他不太搭调，但这并不影响她的好心情。</p><p class="story-paragraph">彼时他们正待在采光很好的咖啡厅里，店里放着调子悠扬的蓝调音乐，Ryan 十指交叉，半个身子陷进了钻石绒铺就的靠背椅里。</p><p class="story-paragraph">除了一杯黑咖啡，他面前还摆着一碟肉桂卷，可 Ryan 似乎对浓缩饮料不怎么感兴趣，他没喝几口，倒是三两下地将点心全部吃了。</p><p class="story-paragraph">凑崎知道很多美国人都嗜甜，但她还是没有亲身去体验，再来是担心一大早吃蛋糕会血糖飙升，她只向服务员要了一片煎蛋吐司。</p><p class="story-paragraph">和 Ryan 定下的时间太早，靠街边的玻璃透着流动的朝阳，受夏令时影响的城市被唤醒，白昼散发着真实的、如同牛奶一样的光芒。</p><p class="story-paragraph">Ryan 穿着纯白色的短衫，没有任何布料可以遮住臂上柔软的细毛，袖管才够到他肘部，而他的腮边还长了些新生的青茬——那天他们在酒吧里相遇时他还没剃胡子，如果不是看到他手指上的纹身，凑崎差点就要以为自己弄错了约会对象。</p><p class="story-paragraph">这才是和 Ryan 的第二次见面，凑崎不太明白自己为何要答应他出来，和陌生人在酒吧里交换联系方式也不太像是她的作风，虽然以前也不是没有这种情况出现，但就算对方之后再打来电话邀约，她也都毫不例外地一一回绝了。</p><p class="story-paragraph">凑崎想也许是他们两人之间有什么肉眼无法观测到的氛围加持，这便是即使 Ryan 莫名其妙地将她约在红砖瓦街道的一家咖啡厅共度早餐时光，她也依然也是好好地打扮了才应约的原因。</p><p class="story-paragraph dialogue">“无聊吗？”Ryan 抬起眸子问她，说话间他浓密的睫毛因身体转动的幅度被投下了阴影。“如果无聊的话…”凑崎用刀叉切开被烤得焦脆的面包，她在笑，却没起抬头。</p><p class="story-paragraph">女孩子好像完全不在意会不会浪费整个白天，语气跃动着轻松的调子，眼里闪着狡黠又自在的光影。</p><p class="story-paragraph dialogue">“我会自己走的。”</p><p class="story-paragraph">要去的地方不远，凑崎和 Ryan 一起穿过了两条街就到了。巴洛克式风格的建筑应该是天主教教徒做礼拜的地方，它的屋顶上铸着十字架，几个圆形的高柱上端好像搽了一层能发出油光的釉彩颜料。</p><p class="story-paragraph">她有设想过他要带自己去哪，却还是没料到目的地是教堂。</p><p class="story-paragraph">Ryan 是唱诗班的青年教徒，而凑崎和那些前来祷告的人们站在一起，圣歌被吟唱以后那些带着能量的声波在教堂拱形的穹顶冲撞，这样的物理结构让如此进行着的仪式更让人懂得庄严的含义。</p><p class="story-paragraph">她等着 Ryan 结束这一切，在分别时和他约定会将自己的学生证带给他看，那上面可明明白白地写着她是交换生，而 Ryan 也和她一起笑。</p><p class="story-paragraph">两个年轻人从教堂里走出来的那一刻，鸽子正盘旋着绕过天使的石雕塑像。</p><p class="story-paragraph">Ryan 和她是一个学校的——常去那家酒吧的学生几乎都是他们学校的，Ryan 在看到她学生证时便揭露了谜底，他是同校艺术学院音乐系的学生，比她大了几届，是从欧洲留学回来继续修博士学位的天才，自然也是个怪人，这也许是艺术家与生俱来的秉性，Ryan 做事有自己的一套风格，他对她的追求也是如此，那些怪异却又充满魅力的手段很合凑崎的胃口。</p><p class="story-paragraph">他甚至带着她坐在摩托车的后座上绕着布鲁克林大桥飞驰，一路还很不要命地劝她欣赏一些哈德逊河沿岸的风景。</p><p class="story-paragraph">这真的是学音乐的人吗？</p><p class="story-paragraph">凑崎不可置否，可他又会在两个人的声音都被模糊得听也听不清的时候为她唱奇异恩典。</p><p class="story-paragraph">一切似乎都在变好。</p><p class="story-paragraph">凑崎没有谈过恋爱，仅存的那一段爱只是近乎痴狂的崇拜与仰慕，南像她的救世主，她等着妈妈的垂怜与亲近，将身体和灵魂都交付给了她，又在妈妈投向她的眼神之中猜测她会不会怀抱着和自己一样的感情，甚至多此一举地从她毫无暗示意义的话语里推敲也许是被刻意藏起来的心意。</p><p class="story-paragraph">南将她的爱糟蹋得一团稀烂，只留给她一个隐约的印象，她依稀记得那样狂热的执念为她带来了什么样的感受，那是想要与南一起振翅而飞，甚至是恨不得要和她一起在缠绵时死去的愿望。</p><p class="story-paragraph">她是想独占南的，这是凑崎所能体会到的、最深的一种情愫：独占她的妈妈，独占她心爱的人。</p><p class="story-paragraph">如果这样一种不愿意与人共同分享某个人的欲望其实就是爱情的开端，那么她是否对 Ryan 也抱有同样的感情，而总有一天，这样的爱也会达到她对南的那个程度吗？</p><p class="story-paragraph">她不知道双方共同享有的爱情究竟是什么样子的，只出于本能地认为它或许不坏。凑崎很怀念她和妈妈超出母女关系以后做出的出格事，在她和南能牵手、能接吻，能像恋人一样做爱的时候，她感觉得到甜蜜，那样的甜蜜让她的生命都有了质量，即便它也为她带来了如此深刻的苦痛。</p><p class="story-paragraph">男孩真心的追求让她看到了她和南之间从未存在过的东西。</p><p class="story-paragraph">是不是她一直以来都弄错了呢？</p><p class="story-paragraph">也许正如她所想，她对南的爱情不过也是海市蜃楼那样飘渺，连一段爱情应该有的样子也没有。</p><p class="story-paragraph">凑崎对 Ryan 的示好并不是无动于衷，她喜欢他不按常理出牌的风趣，喜欢他看起来有安全感又能让人依靠的样子，喜欢他准确地说出她的心事的果断。</p><p class="story-paragraph">一直以来总让她去寻找未来适合一起生活的人是南，凑崎不知道怎么提才能保护自己已经所剩无几的尊严，她给南写电子邮件，想问妈妈自己能不能交男朋友，打了一堆字以后又全部删掉了，不免觉得自己好笑。</p><p class="story-paragraph">她都偷偷染了头发、偷偷去过酒吧，也是个成年人了，怎么做事还总像个小孩那样征求着妈妈的意见呢？</p><p class="story-paragraph">她也怕妈妈笑话她的承诺真的是幼稚的，因为她正捧着一些支离破碎的爱打算交给别人，而她知道自己的希望实在是太沉重了，她担心妈妈会不要它。</p><p class="story-paragraph">她的生活已经出现转机了，她尝到了像是一个正常人该有的情绪——而现在只剩依然那团像废墟一样的感情生活等待她的重建。</p><p class="story-paragraph">她是不是也应该勇敢一点，像做其他事情一样毫无芥蒂地打开心扉。</p><p class="story-paragraph">也许以此情形和 Ryan 坠入爱河，她就能重新地好好生活，再不给妈妈那样无望的负担了。</p><p class="story-paragraph">凑崎想 Ryan 真是个疯子，而她也是，所以她最后做了个像疯子一样的决定，她接受了 Ryan 的吻，以及他眼里那点散漫又确实存在的爱意。</p><p class="story-paragraph">凑崎是单身，她没有必要对任何人负责，在纽约生活的第二年：从初夏到早冬的这几个月，Ryan 跨过了她那段不存在的初恋，理所当然地成了她的爱人。</p><p class="story-paragraph">Ryan 很有趣，他读大学那时是在比利时学的音乐，也会一些法语和荷兰语，他会专门模仿欧洲人说话的语调逗凑崎笑，Ryan 发的小舌音很像清晨刷牙时吐出第一口水的声音，有时也能蹦出几句浪漫的情话。</p><p class="story-paragraph">他遵着凑崎的习惯，按了日语发音喊她的名字。</p><p class="story-paragraph">Sana，他会叫她 Sana，两人独处时，Ryan 偶尔也会肉麻地称她为 Sweetie。</p><p class="story-paragraph">她不太会恋爱，但 Ryan 没有给她压力。</p><p class="story-paragraph">凑崎再也不用刻意去推敲什么，她没必要像以前那样在一堆虚实的幻境里揣测，因为 Ryan 会对她表白。</p><p class="story-paragraph">她在他身边终于有了能放松的机会。</p><p class="story-paragraph">凑崎努力地从有南的回忆之中逃离，为了不让自己亏心，也为了在从没有人教过她的恋爱里学到东西，她向 Ryan 支付了她所能偿给他的心意——</p><p class="story-paragraph">小女生应该有的表情，以及她生命里本来就存在着的，那点自由的天性。</p><p class="story-paragraph">Ryan 的身材很好，却又不是那么魁梧，瘦瘦高高的，不免总透露着一点虚弱的贵族气质，凑崎被他抱在怀里的时候能闻到他身上干燥的皮革香味，好像 Ryan 是从某个遥远国度来的人，如果不是凑崎去过他在纽约的家，她还不会就此善罢甘休地放弃打听他的故乡，就像他当时不停地求着凑崎和他说日语那样。</p><p class="story-paragraph">她穿着背心和他躺在一起，闻他胸口散发出来的味道，被他开始变硬的胡子扎得有些疼——在他们忘情接吻的时候。</p><p class="story-paragraph">凑崎和他撒娇，问过他那阵香味的来源，Ryan 环着她，他总没办法抵抗她娇滴滴的样子，所以 Ryan 会在她耳边诚实地说那是香水，还去浴室拿了银色的瓶子给她看，凑崎发现瓶口沾着的味道真的和她男朋友身上的一致。</p><p class="story-paragraph">Ryan 又掀开被子，亲昵地抱住她。</p><p class="story-paragraph dialogue">“宝贝，”他眷恋地亲亲她脖颈的皮肤，亲得凑崎有些痒了：“有人和你说过吗，你身上的味道更好闻。”</p><p class="story-paragraph">他的女友没有向他透露过任何与曾经恋情有关的消息，每到这时她只会牵牵他那只很大的手掌，然后弯着她那对好似情蛊的眼睛，再以暧昧的回答略过这个问题。</p><p class="story-paragraph">对凑崎而言——她是第一次这样近距离去观察男人的手，所以她扳着他的拇指，兴致盎然地观察他明晰的掌纹。</p><p class="story-paragraph">因为练琴的缘故，Ryan 的指节处有薄薄的茧。</p><p class="story-paragraph">凑崎发现他们有不同，比如生理结构上，Ryan 的胸膛显然比她的结实有力，喉结也很突出明显，最能辨别两人区别的那一点是 Ryan 有阴茎而她没有，凑崎想到自己居然拿这一点和 Ryan 作比较，她又会忍不住笑自己。</p><p class="story-paragraph">而他们抛开那一切又简直是再相像不过，Ryan 会在空闲时去逛美术馆，他喜欢光着脚走路，同样会喝咖啡来消除脸部的水肿，顺便清清他被甜品腻得很难好好唱歌的嗓子，他也需要自己独处，在凑崎和 Ryan 在一起的那些为数不多的时光里，他一样会有那么音讯全无的几天。</p><p class="story-paragraph">Ryan 很喜欢这个愿意理解他的女朋友。</p><p class="story-paragraph">凑崎和他一样，他们共同享有着其他人难以冲破距离的孤独，却又被当作光芒万丈的星星。</p><p class="story-paragraph">她从他这里汲取了养料，但那绝不是她成长的唯一原因，从 Ryan 认识凑崎的第一天起，她眼中就闪烁着和那张绝艳的面容很不相称的光芒，那像是清醒又炽热的心愿，它让她蜕变得很快。</p><p class="story-paragraph">如果能帮到凑崎，Ryan 很荣幸能做这样的角色，作为情侣，两个人也没有理由相处得不好。</p><p class="story-paragraph">Ryan 跟着她参加过学校的晚会，他以前很不屑参加这些浮于表面的典礼，他在欧洲就已经受够了那些繁冗的老套礼节，却能够拉着凑崎的手，看她在舞池里拖曳出优雅又华丽的步伐，将曾经的偏见都统统推翻。Ryan 陪她一起逛过纽约的公园，他给她买冰淇淋，欣赏她那样天真干净的笑容，也破天荒地在安静的图书馆戴着耳机听古典乐，偷瞄凑崎翻书时紧皱着眉头而认真又有魅力的模样。</p><p class="story-paragraph">要是他会画画就好了，Ryan 想，那他最杰出的画作一定是以凑崎为原型的人像。</p><p class="story-paragraph">他最后带她去了自己家。</p><p class="story-paragraph">凑崎跟着他参观了他在曼哈顿下城区的公寓，也会在心里赞叹这种程度的房子完全能证明他是个富人，不过根据 Ryan 的说法，电梯房是家人给他买的。关于亲戚，Ryan 说得很少，而且每当他主动提到时，表情似乎都不大高兴，凑崎不会多问他。</p><p class="story-paragraph">她也从没有在 Ryan 的面前提起过她的妈妈。</p><p class="story-paragraph">她希望自己不要对他不公。</p><p class="story-paragraph">两人兴致正盛时 Ryan 会给她拉小提琴，这是他从布鲁塞尔的手工作坊里淘回来的，金属琴弦发出的声音极其好听，音色绵长又动人，油漆也涂得漂亮，他为她拉响的曲子几乎都是巴赫，当然也有其他的，凑崎喜欢听那首帕格尼尼写的狩猎，Ryan 微微曲着的鬓发真的让他看起来像极了一个才华横溢的天使。</p><p class="story-paragraph">她扑到 Ryan 怀里，神色娇俏地让他举起自己，这对有一米八几的他而言简直是轻而易举就能做到的事，然后凑崎和他一起赤足在客厅跳舞，最后和他躺上同一张床。</p><p class="story-paragraph">虽然肌肤亲密地相贴过，也交换过很多次缠绵的吻，哪怕不眠的灵魂无声无息地对着对方喃喃细语、早就坦诚相待过，但肉体并未跟着这样的节奏快进到那一步。</p><p class="story-paragraph">做爱好像应该是情侣之间水到渠成的事，可她的男朋友信天主教，就算 Ryan 明明在音乐的那一方面很有自己的主见，却依然恪守着拒绝婚前性行为这样严格的规则，他每周日甚至要在教堂行礼吟唱，出生时也经历过圣水的洗礼，纹身的内容还是经文。</p><p class="story-paragraph">凑崎怕他为难，说既然这样就不要一起睡了，她还特意查了查这种行为到底算不算是罪，但得到的结果总是众说纷纭，有说算的，有说不算的，而 Ryan 又一副很委屈的样子给她吹耳边风，说他很明白那些训诫，表现出的态度好像是只要抱着她他就能开心，Ryan 坚决地说自己一定不会做出那些事，一方面是遵守教条，另一方面又是为了尊重她。</p><p class="story-paragraph">无可避免地会遇见尴尬的情况，凑崎在他勃起的时候能感觉到那根有力的东西隔着两层柔软的布料卡在她臀缝中间，顶端翘起来的形状完全无法被忽视，Ryan 往往比她更早发现自己身体的异常，他会和她说抱歉，然后努力地哄她睡觉，或者和她聊聊别的事情压下色情的想法。</p><p class="story-paragraph">凑崎想能不能帮帮 Ryan 的忙，比如用别的方法让他舒服一下，但是 Ryan 总是温柔又不容她置疑地拒绝了如此提议。</p><p class="story-paragraph dialogue">“Sana，别诱惑我犯罪，”他一面说着这样的话，一面又像在极力克制自己不要和她接吻：“有谁能对你的身体做到浅尝辄止吗？”</p><p class="story-paragraph dialogue">“倒是你，”Ryan 知道她的身体也会有反应，他睁着那双无辜的、又像蓝宝石一样的眼睛：“如果你想要的话…”男友的体贴反而让她有些做贼心虚。</p><p class="story-paragraph">凑崎摇摇头打断了他，她明白让 Ryan 做到这一步已经是强人所难，再来她也一样，虽然身体一定会做叛徒，但她并不想。</p><p class="story-paragraph">她曾可笑地答应过南——这样一个又傻又笨的诺言被她一人记到了现在。</p><p class="story-paragraph">可怜的年轻人，可怜的多情种。</p><p class="story-paragraph">他们是同类，孤独地在阳光游走的屋檐底下惺惺相惜，无处安放的爱暂且以彼此作为载体而得到休憩。</p><p class="story-paragraph dialogue">“Ryan，”凑崎念他的名字，在他长出胡须的下巴上亲了亲：“我没事。”</p><p class="story-paragraph">两个人的幼稚之举在上帝眼里看来会不会是傻瓜呢？</p><p class="story-paragraph">凑崎闭了眼睛，她偎在 Ryan 的怀里，只想这样好好地睡一觉。</p><p class="story-paragraph">她知道他们一定会分开的。</p><p class="story-paragraph">Ryan 不会为了她远渡重洋去日本，而她也绝对不可能留在纽约，即使是这样，在和 Ryan 在一起的时候，她的心偶尔也会被一种迷乱又愉悦的满足感填充着。</p><p class="story-paragraph">凑崎不后悔。</p><p class="story-paragraph">Ryan 对她不赖，她在最后的时光里履行着自己属于女友的职责，她能逗他玩，因为她的确是出于本能的欣赏而喜欢他。</p><p class="story-paragraph">可是有一部分只和南在一起才能调动出来的感官一直在沉睡。</p><p class="story-paragraph">凑崎在黑暗里凝视着 Ryan 的眉眼，她试图寻找到她爱南时爱得快要死去的疯狂，她甚至为了妈妈在重新努力地体会属于正常人应该有的心动，却意识到自己或许一辈子都无法挣脱那个被南附加在身上的枷锁。</p><p class="story-paragraph dialogue">“给我唱歌好不好？”女孩在即将进入梦乡的时候许下了心愿。</p><p class="story-paragraph">那些又痛苦又甜蜜的心悸没有在这段爱情里升起。</p><p class="story-paragraph dialogue">“我喜欢听你唱歌…”</p><p class="story-paragraph">它们永远、永远地追着妈妈去了。</p><p class="story-paragraph">边缘</p><p class="story-paragraph">FelixFelicis_PN</p></div>

        <h2 id="heading-chapter-29">边缘</h2>
        <p class="chapter-subtitle">伯利恒之星 下</p>
      </header>
      <div class="chapter-copy"><aside class="author-note"><span>Notes</span><p>(See the end of the chapter for notes.)</p></aside><p class="story-paragraph">Ryan 有抽烟的习惯，他觉得自己像美国老兵的做派会带坏凑崎。</p><p class="story-paragraph">他最爱在便利店买软装的 WINSTON，而凑崎总在他吞吐烟雾的时候恶劣地跨在他身上亲他，为的是阻止他呼吸，直到两个人都被烟草弥漫的气味呛到咳嗽。</p><p class="story-paragraph">她偶尔会体贴地为他抢过燃到一半的香烟。</p><p class="story-paragraph">凑崎穿着吊带的睡裙，白皙的肩膀露在外面，她抽烟的样子能被框进油画里，她是他高贵又不可亵玩的女神，是赐人恩惠的维纳斯。</p><p class="story-paragraph">Ryan 见她扬着下巴吁出尼古丁含量过高的烟雾，便抬手帮她整理头发，好让她粉红色的耳垂也被他看见，凑崎不躲，眯着眼睛轻蔑地笑，她将烟蒂掐灭在专门用来打包罐装星巴克咖啡饮料的纸盒上，丝毫没在意火星有没有将它烧出一个小洞。</p><p class="story-paragraph dialogue">“对嗓子不好。”她从不明说她是在关心他的职业生涯，总以胡闹为理由提前结束恶作剧，紧接着也和他一样，在他每周都做一次清洁而不染丝毫尘灰的瓷砖上赤脚走路。凑崎给脚趾涂了指甲油，她修长的小腿随着带有轻佻意味的动作而变得更漂亮，Ryan 捉住她的脚踝，让她坐在自己身上，她柔软丰满的屁股磨蹭着他的大腿，尽管 Ryan 不知道这个小恶魔到底是有意还是无意，但他总会不出意料地将裤裆那个地方顶出个帐篷。</p><p class="story-paragraph dialogue">“Ryan 又硬了。”</p><p class="story-paragraph">虽然凑崎脸上因害臊而起的潮红很像雨后涌出的新露，不过她已经学会了怎么调戏他，笑起来时温热的鼻息也扑在他脸上。</p><p class="story-paragraph dialogue">“可我们不能做坏事。”</p><p class="story-paragraph">然后这个爱玩文字游戏的女孩为他背起旧约，创世纪的每一篇她都像是教徒一样记得清楚。</p><p class="story-paragraph">凑崎用手指扫过他胸口，在说出口的话里面混杂了一些他从未听过的、一定有暗喻夹杂在其中的诗句。</p><p class="story-paragraph">她懂的可比他多得多，Ryan 有时真的想看看她鬼马的脑袋里到底装了什么。</p><p class="story-paragraph">他为她折服，凑崎是他见过的第一朵已经绽放了却不知花期何时终止的玫瑰，她潜入了他迷梦的深处，Ryan在她身上找到了某些艺术品该有的、类似于本源一样纯粹的东西，那种特质很难用语言概括，他想说不定以凑崎的水平是能做到的，但是他不行。凑崎的眼睛在乍看之下和琥珀有着极为相近的颜色，她的目光像用蜂蜜酿成的酒，而 Ryan 醉倒在她花瓣一样的双唇之中。</p><p class="story-paragraph">她每次都能将他的名字念得像是蛊惑人心的咒语一样好听，他心甘情愿地被这个精灵一样的女孩子牵进泛着金光的午后，和她一起坠入美妙的夜晚。</p><p class="story-paragraph">他们的浪漫行为不过是在暗处燃过又终将消失的火焰而已。</p><p class="story-paragraph">Ryan 清楚，凑崎也清楚。</p><p class="story-paragraph">她再次拥有了一段某天会迎来告别的恋情。</p><p class="story-paragraph">哪怕是再浅薄的相处，人与人之间也会产生感情，凑崎便也和 Ryan 在牌桌上博弈，暂时装出他们会一直相恋的假象。</p><p class="story-paragraph">对南的坦率太难以动摇。</p><p class="story-paragraph">命运为她织了一张网，回应她的永远是残酷的真心。</p><p class="story-paragraph">这不是靠承认与否就能轻易回避的问题，她在和 Ryan 交往时也一直不自觉地追逐着南——</p><p class="story-paragraph">没有人告诉她究竟怎么办。</p><p class="story-paragraph">她分明是按妈妈教给她的那样忍痛离开了东京，却始终找不到独活的方法。</p><p class="story-paragraph">从确认到那种难以骗过自己的心意以后，无法向任何人蒙混过关的内疚出现了。</p><p class="story-paragraph">分明的负罪感紧随着那些缺失的情绪一同赶来，而凑崎要为这次没能成功卡紧的齿轮道歉。</p><p class="story-paragraph">她为自己长大的缘故而变得不再那么害怕离别，但她要对曾经冲动的那个决策而负责。</p><p class="story-paragraph">凑崎没有优柔寡断太久，她主动和 Ryan 提了分手。</p><p class="story-paragraph">Ryan 没有生气，他也许比她豁达得多，又有可能是早看出来她的戒备心，最后只出于好奇而问了她原因。</p><p class="story-paragraph">凑崎轻轻弯着眉，她在脑海思索了理由，却受制于言多必失的道理。</p><p class="story-paragraph">如果这段感情时时刻刻都要沾上妈妈存在的影子，那么她是否再也不能献出纯粹的喜欢——还是说那本来就不存在？</p><p class="story-paragraph">怎么说呢？</p><p class="story-paragraph">说不能忘记过去，不管怎么努力都失败了。</p><p class="story-paragraph">凑崎不愿意让他伤心，也不愿意再自私地让他帮忙分担自己的伤痛。</p><p class="story-paragraph">她少见地在 Ryan 面前陷入沉默。说已经习惯听妈妈的话去做任何事。</p><p class="story-paragraph dialogue">“我们也许更适合做朋友…”</p><p class="story-paragraph">说没有办法再造出仅能存在一次的真心了，不能将它化虚为实。</p><p class="story-paragraph">她的求救没有人能听到。</p><p class="story-paragraph">那个可耻的秘密在凑崎心里转了一个弯，再一次被她埋了起来。</p><p class="story-paragraph">凑崎轻轻地和 Ryan 道了句对不起，最后摸了摸他长得已有些扎手的胡子。</p><p class="story-paragraph">她的心浮现了一种隐隐约约的剧痛。</p><p class="story-paragraph">如果这种错误关系的解决方法也可以复刻，要是妈妈也和她一样，早点断了她的那份念想该多好。</p><p class="story-paragraph">凑崎已经饱尝这种爱而不得的滋味，她不想要 Ryan 也和她一起。</p><p class="story-paragraph">她是由衷地感谢他，也是由衷地喜欢他。</p><p class="story-paragraph">应该理智一点才是，这样便不必经历再一次和珍惜之人变得陌生的体验…</p><p class="story-paragraph">但一切止步于此。</p><p class="story-paragraph">在此后凑崎再也没有去过他的家，而想要在偌大的校园里制造相遇的巧合也是难事。</p><p class="story-paragraph">她很少碰见 Ryan 了。</p><p class="story-paragraph">凑崎在图书馆时偶尔会不自主地依了习惯坐到 Ryan 曾经陪她一起的那个座位上自习，她以前还要在看完书以后将那个头发乱糟糟又在她身边睡着的男生叫醒，现在也不用了。</p><p class="story-paragraph">所有在她生命里出现过的人都会带来一些很难消磨的痕迹。</p><p class="story-paragraph">有很美好的，比如 Ryan 牵着她带她体验过提琴手的感觉，凑崎那时为自己拉出了第一个圆滑的音而高兴——同样有很苦闷的，比如 Ryan 惹了她生气又总是不和她道歉的固执，她不喜欢 Ryan 在那个时候表现出来的痞相。</p><p class="story-paragraph">如何与一个人相知相恋或者是如何与他分别，也许这都是需要学习的。</p><p class="story-paragraph">生命中所有人的离去都是那样惨烈，亲生父母一声不吭地走了，而就连南也狠心地将她抛弃在这里。</p><p class="story-paragraph">凑崎第一次有了机会去咀嚼这种鲜活却没那么痛苦的孤独。</p><p class="story-paragraph">怅然若失的不舍倒让她的心绪跟着某些奇妙的改变一起换成了稍显安宁的自在。</p><p class="story-paragraph">她很高兴自己在某些方面上做得比妈妈好，至少她没有表现得太过怯弱。如果不是碰上考试的话，凑崎本来还打算再做点什么事情，最后却只是将 Ryan 留下来的那包香烟抽完了，因为烟草的味道太浓烈，她有几次都被白色的雾气绕得晕晕乎乎的。</p><p class="story-paragraph">金色太容易暴露发梢的分叉，凑崎还听了经验人士的建议，跑去理发店换了种颜色。</p><p class="story-paragraph">她真的很想重新开始，却并不知道要将时间拨回哪一天。</p><p class="story-paragraph">刚好到了年末，紧随而来凑崎留在美国的最后一个生日，为了不让它重现去年的寒酸，她努力地打起了精神，邀请了学院里的朋友，甚至包括两个平时会和她聊天的邻居，还有 Ryan。</p><p class="story-paragraph">她不大确定他会不会应约而来，但还是出于礼貌给他发了一条简讯。</p><p class="story-paragraph">Ryan 是第三个敲门的人，他抱着个包装精美的礼盒，红色的卡纸上系了被扎成蝴蝶结的红色丝带。</p><p class="story-paragraph">他当着她的面拆开了方形的盒子，这里装着他们第一次在酒吧见面时他请她喝的酒，Chivas 18，凑崎和他都喜欢这瓶酒的口感以及那股若隐若现的太妃糖甜味。</p><p class="story-paragraph">Ryan 来之前还特意刮了胡子，凑崎和他贴面的时候没有被弄痛。</p><p class="story-paragraph">他在入口处掸了掸身上没弄干净的雪花以后才将围巾和大衣都取下来挂在凑崎家的衣帽架上，顺便发现那里已经有了其他几件衣服。</p><p class="story-paragraph">Ryan 本以为提早出发好截断暴风雪带来恶劣堵车的决定没有出错，但显然有人比他来得更早。</p><p class="story-paragraph">他的视线重新回到凑崎身上，女孩的头发已经染成了棕栗色。</p><p class="story-paragraph">他们相视无言，好像是一对很久未见过的老朋友，刚刚结束了刺激又漫长的冒险——而不是一对已经分了手的男女朋友。</p><p class="story-paragraph">Ryan 上前一步，他无视了其他人，单手抬起凑崎的下巴。</p><p class="story-paragraph dialogue">“我能吻你吗？”他发自内心地赞美她面颊上近乎是流光溢彩的美貌，那晃得他挪不开眼：“你今天很迷人。”</p><p class="story-paragraph">窗外寒风侵袭，它并不能影响室内的温暖，烛光落在凑崎的眼睛里，她身上飘散着少女的甜香，也许是她烘焙饼干时不小心沾上白糖以后散发出来的香味，然后她笑了，弯着眼睛时那样诱人的笑。</p><p class="story-paragraph dialogue">“先说好了，Ryan…”凑崎的后半句话说出来时他们的双唇已经碰在了一起。</p><p class="story-paragraph dialogue">“最后一次…”</p><p class="story-paragraph">Ryan 发觉她踮着脚，却依然含糊不清地和他提要求。</p><p class="story-paragraph">他带着笑亲了亲凑崎的嘴角，松开了她。</p><p class="story-paragraph dialogue">“有冰块吗？”Ryan 重新拿起被他放在桌上的威士忌。</p><p class="story-paragraph dialogue">“有，在厨房，”凑崎回答他，发现了 Ryan 准备的混酒器：“麻烦你了。”“不用和我客气，宝贝。”他又在她头顶上吻了一下，还为她带了礼物，看形状应该是黑胶唱片。</p><p class="story-paragraph dialogue">“生日快乐。”</p><p class="story-paragraph">Ryan 进了里间，他打开冰箱，叮呤哐啷地在冰冻层找方块模具。</p><p class="story-paragraph">凑崎凝望着 Ryan 的背影，她想自己以后再也没有机会去听 Ryan 用小提琴演奏的曲子了。</p><p class="story-paragraph">她最后一次站在岔路口那里悄悄地注视着 Ryan，在心里和他好好地说了再见，然后选择了来时走的那一条路。</p><p class="story-paragraph">她是爱上母亲的罪人。</p><p class="story-paragraph dialogue">——所有在她生命里出现过的人都会带来一些很难消磨的痕迹。</p><p class="story-paragraph">有很苦闷的，比如南即使到现在也还在折磨她，妈妈用那点聪颖的心思骗取了她那么多天真的爱，却没有为此留下一点回音，只狠心让她一人苦苦地在这里徘徊。</p><p class="story-paragraph">当然也有很美好的，比如在她和南额头相抵时，两人眼底里熊熊燃烧着的情欲、以及她们共同享有的那份罪孽。</p><p class="story-paragraph">二十四岁到来的那一晚，她许了个这么些年来几乎是从没有变过的愿望。</p><p class="story-paragraph">凑崎放肆地喝得不省人事。</p><p class="story-paragraph">她在酒精带来的迷蒙醉意之中漂泊，一下觉得自己变成了十七八岁的样子。</p><p class="story-paragraph">那个时候她是那样无所畏惧，整个世界里也只有妈妈一个人。</p><p class="story-paragraph">她在激烈的欢爱时牢牢地抓住了南的那双手，在亲密的喃喃耳语之中和她交换了她梦寐以求的心意。</p><p class="story-paragraph">凑崎捧着她的脸，感觉自己是在哭，她身处逆着光影的暗处，不舍得放开这点令人眷恋的温度，她怕自己一松手南就消失了，所以她一遍一遍地和她接吻，却依然在尖锐的矛盾之中感受到钻心剜骨的疼痛。</p><p class="story-paragraph">理智是那样坚定地为她推送南近乎是绝情的回绝，直觉又催促她在妈妈动摇的目光里找到那点不一样的欺瞒，在她出格的诱惑之中发觉横贯于她们二人间不齿的愿望。</p><p class="story-paragraph">她始终毫无保留地让南啜饮她灵魂里的勇气，真真正正地和她融为了一体。</p><p class="story-paragraph">身体正在分裂成两个。</p><p class="story-paragraph">有一个是以前的，面貌与身体都是亲生父母交付给她的，凑崎那时在她漂亮的养母怀里分享难得的温柔与爱，像是吮吸了南的乳汁一样长大了，纯洁又直白的色欲萦绕在她本该干净的少女时期——</p><p class="story-paragraph">而有一个又是现在的，哪怕她重新经历过崭新的人生，烙在她脑海里的、新宿那个承载了她和妈妈欢爱的小家，还有她们肉体碰撞在一起的画面也像是无法消弭的诅咒。禁忌关系将本该毫无牵连的血脉连在了一起。</p><p class="story-paragraph">凑崎想她是不是早就在以前那样疯狂的性爱之中染上了妈妈的基因，从而真正成为了她的女儿。</p><p class="story-paragraph">她的生命究竟是谁给予的？</p><p class="story-paragraph">凑崎醒来的时候久违地感受到宿醉的头疼，胃里一片翻江倒海的恶心，她想吐，但是因为什么都没吃，也只能扶着瓷砖干呕。</p><p class="story-paragraph">她没有马上整理那因为聚会乱成一团糟的残局，反而先开始大刀阔斧地开始计划半年以后回国的事情。</p><p class="story-paragraph">凑崎在很努力地过好自己的生活。</p><p class="story-paragraph">虽然她没什么理论学业要做了，该看的文献也提早看完，可剩下的那么几节课依然没有落下。</p><p class="story-paragraph">答辩到来之前的所有上午她都会花很大精力在自己研究的课题上面。</p><p class="story-paragraph">凑崎现在有开展科研的权力，主攻的方向是古典文学。</p><p class="story-paragraph">她在特别忘我的时刻也会失神的恍惚，认为自己终于有了几分像南工作时该有的样子。</p><p class="story-paragraph">凑崎以前好奇她边喝咖啡边看卷宗的模样，甚至还偷偷尝试过，给自己泡了一杯浓缩饮料，结果不仅没尝到甜头，也没处理好包装袋，在做垃圾分类的时候被妈妈发现了。</p><p class="story-paragraph">那时她还被南小小地凶了一顿——妈妈说这样她就长不高了。</p><p class="story-paragraph">这个可怕的传闻类似于打雷天露着肚子睡觉就会被雷公抢走肚脐眼一样恐怖，凑崎乖乖听了话，也是直到自己的身高超过南以后才有了喝咖啡的习惯。</p><p class="story-paragraph">她一直在踩着妈妈的步子往前走，但毕竟不是南的亲生女儿，相貌和性格怎么去模仿也没有用。</p><p class="story-paragraph">凑崎学不来南的隐忍克制。</p><p class="story-paragraph">她没有办法抛下可耻的欲望，也不能阻止自己的爱情死而复生。</p><p class="story-paragraph">答辩的过程很精彩，凑崎因为长相算得上是学校里的风云人物，再加上她是来自日本的缘故，声名继续借着这个时机在学校里远扬。</p><p class="story-paragraph">不过当事人并不在意这些，她刻苦读书这么多天终于换来了该得的清闲。</p><p class="story-paragraph">留学生结束最重要的任务以后就有了大把时间。</p><p class="story-paragraph">指不定是哪个猴年马月才能再来纽约了，凑崎抓紧机会去博物馆看她有兴趣的展出，还图方便去华尔街参观了一通，她以前总是走马观花地过来体验氛围，这次特意走到哪个咖啡馆里坐着喝了下午茶。</p><p class="story-paragraph">凑崎很喜欢在下地铁以后再待在站台听街头艺人拉一拉手风琴，她偏爱时报广场那一带的音乐。整个五月她几乎都在纽约的交通网络里穿梭。</p><p class="story-paragraph">凑崎碰到好天气的话会去跑步，尤其是接近黄昏时分的那阵子，能赶上路上行人最多的时候。</p><p class="story-paragraph">其实凑崎本来是不怎么喜欢跑步的——因为读中学时被体育老师纠正了很久的跑姿，有些不太愉快的过往，甚至还被妈妈忍俊不禁地笑过，没想到来了纽约以后的哪天她竟像蜕皮一样克服了心理阴影。</p><p class="story-paragraph">进入夏季以后北半球的天黑得晚了，可能是在日本也常常见得到海的缘故，她因此喜欢有水的地方，于是总在布鲁克林大桥附近转悠，这一般是要先穿过曼哈顿下城区才能做到的事，来回地赶路会费很大力气，但这点问题拦不住她。</p><p class="story-paragraph">凑崎好奇自己能不能跟着某条河流漂回家，不过这边靠近大西洋，她得先因机缘巧合不在路上就被鲨鱼吃掉，才能平安见到妈妈。</p><p class="story-paragraph">夕阳落在伊斯特河上的景致特别漂亮，凑崎倚在栏杆上观望衰败的日光，它如同花朵一样在昏黄的布景之中枯萎。</p><p class="story-paragraph">她被养出某种文学生应该有的多愁善感，每次都很想等到星光洒进河堤两边覆盖的细沙漩涡以后再走，但学校附近有几条街犯罪率奇高，甚至有教授被抢劫的传闻在校园里疯传，凑崎只能赶在伸手不见五指之前回去。</p><p class="story-paragraph">她经过 Kat&#x27;z Delicatessen 时会买一个烟熏牛肉的三明治补充体力，如果晚餐以后还饿就再吃半片芝士——但为了控制体重她几乎从来不会履行后一种做法。</p><p class="story-paragraph">凑崎洗完热水澡要再在窗台上站一会，拂向上岛的风总是温和而不同于夏日一贯的暴烈。</p><p class="story-paragraph">她买了安好唱针的 CD 机，但听的音乐不全都是古典那一流派的，她比较熟悉家里的音碟，一般机器放到倒数两首时凑崎就会锁上大门门回卧室，将身体交给床铺。</p><p class="story-paragraph">她看书看到困意来袭，也不管笔记是不是已经做得乱七八糟便倾斜身子去按掉床头的灯光开关，然后安静地等待第二天的到来。</p><p class="story-paragraph">如果失眠她就将计就计地喝一点酒——反正一宿不睡也没关系，她现在这个状态到参加工作以前都算得上是半个自由之身，作息也随意安排。</p><p class="story-paragraph">她对着天花板发呆，想念南的时候会很不着调地翻出那本霍乱时期的爱情来看，那是西语翻成英文的译本。</p><p class="story-paragraph">拉美文学不在她攻读的范畴之内，可这么有名的作品她不会错过。</p><p class="story-paragraph">以前她读到弗洛伦蒂诺最后那句“一生一世”的忠贞表白时总会笑，虽然现在也一样。</p><p class="story-paragraph">凑崎分几次看完了这本小说，果不其然地又小声骂了脏话，却在结尾页轻轻折了个角。</p><p class="story-paragraph">日复一日的循环规律并不让她感到无聊，这其中唯一的变数是妈妈。</p><p class="story-paragraph">凑崎知道妈妈的身体在痊愈，从戒毒所发来的饮食计划也看得出南的情况有所好转。南给她发邮件的次数多了，甚至打过一次她的电话，可惜的是凑崎习惯在睡觉时关手机，并没有如愿接起——那毕竟是凌晨两三点。</p><p class="story-paragraph">凑崎耐着性子没有回应她，她只是无声地对着她笑，表情却又像是要落下眼泪。</p><p class="story-paragraph">她用手指轻轻摩挲她心爱的那张、被存在屏幕里的脸庞。</p><p class="story-paragraph">日本的天气肯定也逐渐转暖，南的衣服减成了薄薄的一件，照片里的她气色愈发地好了，凑崎在她露出来的脖颈周围见到那条项链。</p><p class="story-paragraph">南是她万能的许愿机，她从小就那样深深地相信她。</p><p class="story-paragraph">她和她说的最后一句话是再见，她便也等着她们再见的那天到来。</p><p class="story-paragraph">如果妈妈也和她抱有一样的心情…</p><p class="story-paragraph">那么她们一定会重逢的。</p><p class="story-paragraph">就像印象派画家莫奈笔触表达的那样，她在这里被五彩的颜料重新塑造了一番，从她身上抖落的碎片被埋进了异乡的土地里，而凑崎并不会怀念那部分的自己。</p><p class="story-paragraph">在纽约经历的、深沉又美丽的时日走到了尽头。</p><p class="story-paragraph">凑崎没有带太多东西回国，她买到用作弥补房子里存在的小问题的家具都留着没动，有一部分书被她拿到跳蚤市场去卖了，反正校园里要学习的人总是不见少。</p><p class="story-paragraph">行李箱她塞满了两个，其中还有专门给妈妈带的礼物。</p><p class="story-paragraph">凑崎这次并不想太狼狈地在大阪拖着负累东走西逛，极有先见之明地将其中一个打包邮寄回了东京。</p><p class="story-paragraph">她订了全日空的机票，从纽约到关西，大概又是十二个小时的路程。</p><p class="story-paragraph">飞机在高高的平流层里飞行的时候，有说日语的空乘来为她倒了橙汁。</p><p class="story-paragraph">她记不太清她当年第一次来美国时究竟有没有喝口味一样的饮料了，却知趣地停止了回忆。</p><p class="story-paragraph">凑崎闭上眼睛，知道自己正在向妈妈靠近。</p><p class="story-paragraph">在不着边际的幻想里，她从没有和南分开过。</p><p class="story-paragraph">凑崎守护那一段得不到回音的爱情，甚至偶尔也分不清自己和南是不是也在纽约享受了这样浪漫的过往。</p><p class="story-paragraph">她能想象出南的神态，想象她弯着眉毛纵容自己的样子。</p><p class="story-paragraph">想象她和她在中央公园一起买来面包糠去喂麻雀，想象她们跑到时代广场上，和她跳那支她教给她的华尔兹。又或者是想象她们在哪个暗幕低垂的星夜无视所有人的眼光，像一对真正的恋人那样坠入爱河。</p><p class="story-paragraph">凑崎一直枕着南的臂弯，她就陷在她的眼睛里做梦。</p><p class="story-paragraph">唯一一颗从银河错轨而来的星星——</p><p class="story-paragraph">窗外那片蔚蓝的颜色正在高频率地闪动，而她永远不会追究这里到底是海洋还是天空。</p><aside class="author-note"><span>Notes</span><p>《边缘》凑崎纱夏个人番外</p></aside></div>

  <script>
    (() => {
      const chapterIds = ["chapter-01","chapter-02","chapter-03","chapter-04","chapter-05","chapter-06","chapter-07","chapter-08","chapter-09","chapter-10","chapter-11","chapter-12","chapter-13","chapter-14","chapter-15","chapter-16","chapter-17","chapter-18","chapter-19","chapter-20","chapter-21","chapter-22","chapter-23","chapter-24","chapter-25","chapter-26","chapter-27","chapter-28","chapter-29"];
      const stage = document.getElementById('chapter-stage');
      const select = document.getElementById('chapter-select');
      const controls = {
        previous: [document.getElementById('top-previous'), document.getElementById('previous-chapter')],
        next: [document.getElementById('top-next'), document.getElementById('next-chapter')]
      };
      const progress = document.getElementById('chapter-progress');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let current = Math.max(0, chapterIds.indexOf(location.hash.slice(1)));

      function showChapter(index, updateHistory = true) {
        current = Math.min(Math.max(index, 0), chapterIds.length - 1);
        const id = chapterIds[current];
        const source = document.getElementById(`template-${id}`);
        stage.replaceChildren(source.content.cloneNode(true));
        select.value = id;
        controls.previous.forEach(button => button.disabled = current === 0);
        controls.next.forEach(button => button.disabled = current === chapterIds.length - 1);
        progress.textContent = `${current + 1} / ${chapterIds.length}`;
        document.title = `${select.options[select.selectedIndex].text} · 边缘`;
        if (updateHistory) history.replaceState(null, '', `#${id}`);
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
      }

      select.addEventListener('change', () => showChapter(chapterIds.indexOf(select.value)));
      controls.previous.forEach(button => button.addEventListener('click', () => showChapter(current - 1)));
      controls.next.forEach(button => button.addEventListener('click', () => showChapter(current + 1)));
      addEventListener('hashchange', () => {
        const index = chapterIds.indexOf(location.hash.slice(1));
        if (index >= 0) showChapter(index, false);
      });
      showChapter(current, false);
    })();
  </script>
