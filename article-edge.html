<template id="template-chapter-11"><section class="chapter" aria-labelledby="heading-chapter-11">
      <header class="chapter-heading">
        <span>CHAPTER 11</span>
        <h2 id="heading-chapter-11">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">只要一把防弹背心穿在身上，矢浦就会产生一种错觉。</p><p class="story-paragraph">说不准他会先窒息身亡。</p><p class="story-paragraph">如果要公平公正地来谈，这不完全是防弹背心的错。</p><p class="story-paragraph">他和另外四个伙伴，在这辆不起眼的车里躲了快一个星期。</p><p class="story-paragraph">不起眼到什么地步…</p><p class="story-paragraph">最常见的面包车，挡风玻璃上积了一层垢，刷了白色涂漆的车身褪成了银灰色，四个轮胎无一例外地都瘪掉了，可能是被人偷偷放了气，或者是被什么东西扎破的。它停在这里，活像是一堆该拉去汽车报废厂处理掉的破铜烂铁。密封空间内的气体闻起来有股腐烂的酸臭味，矢浦感觉自己是个负责腌制泡菜的大厨。</p><p class="story-paragraph">肯定有个兄弟得了脚气病，他这么猜。</p><p class="story-paragraph">矢浦隶属东京警视厅搜查一课，负责缉毒，交手的凶嫌几乎都是人类犯罪史上最心狠手辣的那一类人。这次的任务和传进东京的新型毒品挂钩。带人去他负责的辖区酒吧内例行检查的时候，警视凭着从业十几年的直觉嗅出了不寻常的气息。</p><p class="story-paragraph">没错，他果然从包厢里的年轻人身上抓出了一包白色的粉子，藏在那人裤子的屁股兜里，矢浦和他打了一架才拿到手。</p><p class="story-paragraph">这是日本警方第一次和伯利恒打交道——吗？</p><p class="story-paragraph">被抓的那个年轻人奋力地拍着审讯室的桌子，吼得脖子上的青筋暴起。</p><p class="story-paragraph">在吸食者口口声声的争辩中，矢浦才知道，似乎不是。</p><p class="story-paragraph">他们借来了国内相关的犯罪档案记录，又找人拿了先前东京都厅法院审的案子，把近几年来和毒品牵连的官司，以及和精神药物牵连的官司全部复盘了一遍。</p><p class="story-paragraph">功夫不负有心人，在几个晚上加班加点的高强度工作下，他终于发现了蛛丝马迹。</p><p class="story-paragraph">有一个审了两次的案子，卷宗上出现了“伯利恒”。为了保护被告人的身份，庭审记录隐去了他的名字，矢浦是警察才查到抓捕犯人归案的过程，知道他叫福田英夫。</p><p class="story-paragraph">检方起诉原罪名是勾结境外势力，非法走私毒品。</p><p class="story-paragraph">法院改判了，最后的结论让他皱眉，扭转了局面的材料竟是伯利恒作为精神药品的书面报告。</p><p class="story-paragraph">矢浦觉得很可笑，成瘾性这么强，怎么可能不是毒品？</p><p class="story-paragraph">只是没有先例让他们拾人牙慧罢了。</p><p class="story-paragraph">无独有偶，东京都内其他辖区的警部也陆续上报了几起吸食伯利恒的治安案件。</p><p class="story-paragraph">不能再用看待精神药品的眼光去应对它的存在，被抓的倒霉鬼数量就不少，还藏在水里的估计更多。</p><p class="story-paragraph">一个屋子里只要出现一只蟑螂。——所以，蟑螂窝在哪？</p><p class="story-paragraph">手上的信息提供了福田英夫这个靶子，警视在本子上记了一笔。</p><p class="story-paragraph">长年累月的贩毒经验不是摆设，敌人的手段见长，阴毒的损招一个接一个地出，矢浦是无法暴露在阳光底下以身涉险的，他只得从特设现场资料班借来个游走在灰色地带的线人。</p><p class="story-paragraph">这线人喜欢喝菊正宗牌的清酒，落得个“菊正宗”的外号，白方都这么称呼他。</p><p class="story-paragraph">如果福田真的在贩毒，要靠他打进那个团伙。</p><p class="story-paragraph">伯利恒在东京流通不到两年，简单地进行一番逻辑推理，就能得出他们缺人手的结论。</p><p class="story-paragraph">锁孔匹配了对应的钥匙，完全正确的推断。</p><p class="story-paragraph">没费多大力气，菊正宗就混上个小弟的位子。</p><p class="story-paragraph dialogue">“博多和丸子。”</p><p class="story-paragraph">这是线人潜入以后交给矢浦的情报，他们是和福田地位不相上下的另外两个同谋。</p><p class="story-paragraph">什么奇奇怪怪的绰号，警官很无奈。</p><p class="story-paragraph">连福田英夫也给自己取了个“捕虫器”的名字，混迹在购买伯利恒的买主中。</p><p class="story-paragraph dialogue">“你不一样地叫我叫‘菊正宗’，品味又好到哪里去？”菊正宗在话筒的另一边抱怨着“菊正宗”。</p><p class="story-paragraph">矢浦狡辩：“你认证了这个名字。”</p><p class="story-paragraph dialogue">“别血口喷人，我没同意过。”菊正宗不满地控诉他。“你到底是哪边的？”不想就这个问题讨论过多，矢浦打住了对方滔滔不绝的幻想：“好好干，有什么情况马上告诉我。”</p><p class="story-paragraph">矢浦听说博多是个异常谨慎的人，他只和福田英夫还有丸子单独见面。</p><p class="story-paragraph">菊正宗作为团体里的角色，负责端茶送水，以至于到今天也没看过博多的脸。</p><p class="story-paragraph">他们撒网大半年了，之前有过的好几次收缴行动都被迫中断。</p><p class="story-paragraph">有博多这样的人。</p><p class="story-paragraph">他在伯利恒那方显然是充当了智囊角色，发现事情有一点不对劲就撤得没影。</p><p class="story-paragraph">而且自今年二月份起，博多就鲜少露面。</p><p class="story-paragraph">一定是听到风吹草动，矢浦想，所以准备跑了。</p><p class="story-paragraph">本来是打算把三个主犯全抓住，但福田不知从哪，弄来一笔金额高得离谱的大单子。</p><p class="story-paragraph">上级要求他们必须先截住订单，伯利恒的名字在东京传得越远，被荼毒的失足之人就会越多。</p><p class="story-paragraph">今天可以收网了，就算博多迟迟未现身，也要先把能抓的抓进监狱。</p><p class="story-paragraph">只要让剩下的人松口招供，再拿到证据，矢浦会想办法逮着他的。</p><p class="story-paragraph">面包车停在福田约买家见面的地点楼下，菊正宗还有三个打手作为毒枭的保镖为他们放风。</p><p class="story-paragraph">福田，丸子，包括菊正宗在内的小喽啰，再加上两名买家，里面一共八个人。</p><p class="story-paragraph">踩点的时候，线人发现了一个像是天赐的机关，他立马联系了警视。</p><p class="story-paragraph">矢浦现在死死盯着这栋砖红色公寓楼的第五层。</p><p class="story-paragraph">只有一个窗口装了帘百叶窗。</p><p class="story-paragraph">菊正宗一旦抓到交易双方都开始放松警惕的马脚，就会把这个消息传出来。信号是来回开合叶片三次。</p><p class="story-paragraph">两短一长。</p><p class="story-paragraph">矢浦的心要跳出喉咙了。</p><p class="story-paragraph">确保福田和买家都进到房间去之后，整个下午他已经连续好几次看走眼。</p><p class="story-paragraph">过度紧张的缘故。咔。虽然离得很远，但是他好像真的听见了铝合金的叶片碰在一起的声音。</p><p class="story-paragraph dialogue">——短。</p><p class="story-paragraph">又是自己弄错了吗？矢浦咽了下口水。</p><p class="story-paragraph">靠近窗户的那个影子，手上的动作没停。</p><p class="story-paragraph dialogue">——长。</p><p class="story-paragraph">那么，是里面的人不小心拉到了窗帘，还是菊正宗告诉他们是时候进去了？</p><p class="story-paragraph dialogue">——短。</p><p class="story-paragraph dialogue">“走。”他扬手，拉开车门。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph dialogue">“圈起来的地方是还有问题的，麻烦你把任务往下分。”南给板仓翻了一下还是半成品的总结。</p><p class="story-paragraph dialogue">“辛苦了。”他接过来，在折好的页面上作了待处理的标记。</p><p class="story-paragraph dialogue">“急着要吗？”南不太安心，按时限来算，她有两个星期的进度没整理完：“这个月还没结束。”</p><p class="story-paragraph dialogue">“是没结束，”上司说起话来有股理所应当的魄力：“不过我有更急的事情分给你。”</p><p class="story-paragraph">按顺位来看，月度总结无疑是永远排在最末尾的那件公务。</p><p class="story-paragraph">南站在一边，等着下文。</p><p class="story-paragraph dialogue">“神木上星期和我请假，”板仓停下了手上的动作，看着女律师：“他直接把去年攒的假全用了。”</p><p class="story-paragraph dialogue">“所以呢？”南的语气把他弄得有点尴尬。</p><p class="story-paragraph dialogue">“福田，这个姓没忘吧。”板仓绕过了下属的问题，直奔主题。</p><p class="story-paragraph dialogue">“没忘，”她没走这个台阶下：“别兜圈子。”</p><p class="story-paragraph">和板仓关系还不错，南才敢这样对着顶头上司讲话。</p><p class="story-paragraph dialogue">“雄一先生的弟弟出事了。”板仓顿住，名井南这么聪明，说到这里应该就能知道了。</p><p class="story-paragraph dialogue">“讲清楚什么事。”她确实差不多猜了个七八分。</p><p class="story-paragraph dialogue">“他指明要神木救命，”板仓耸耸肩膀：“但你刚刚知道神木来不了。”</p><p class="story-paragraph">南没接话，要听板仓把核心矛盾讲出来。“交易被抓了现行。”他也是前天才知道这个消息的。</p><p class="story-paragraph dialogue">“又走了老路。”审判结果出来那天的预测应验，她不觉得有多意外。</p><p class="story-paragraph dialogue">“嗯，恐怕出狱没多久就开始做了。”板仓转着他的手机。</p><p class="story-paragraph dialogue">“我不会代替神木的。”南觉得她的上司有点固执。</p><p class="story-paragraph dialogue">“你说不接贩毒的案子，”他抓了个诡辩的突破点：“没说不接杀人的案子。”</p><p class="story-paragraph">闹出了人命，南终于抬了一次眼：“见血了？”</p><p class="story-paragraph">板仓把自己的情报全盘托出：“有个警察的线人牺牲了。”</p><p class="story-paragraph dialogue">“杀人的是…”她没说完。</p><p class="story-paragraph dialogue">“福田本人，”板仓拉开抽屉，把照片甩在桌上，南凑过去看：“小口径的老式左轮手枪，六发子弹全部打空。”</p><p class="story-paragraph">律师好像不是不感兴趣的样子，板仓发现她很专注。</p><p class="story-paragraph dialogue">“光是这点就不好在法庭上扳倒别人，”南挑眉：“要置对方死地再逃跑，对手肯定会这么攻击的。”</p><p class="story-paragraph dialogue">“公安提供的证据，检方没多久也会开始行动，我们只能就故意杀人罪和非法持枪罪上做文章，”板仓把自己的观点告诉南：“试一试如何，我不要你给他洗脱贩毒的罪名，那已经是板上钉钉的事实。”</p><p class="story-paragraph dialogue">“你做事不是讲公平公正，”南笑话他：“为了让我接这个案子，连这个原则都不要了。”</p><p class="story-paragraph dialogue">“如果我真的不要原则，你会接吗？”板仓反问她。</p><p class="story-paragraph dialogue">“他是因为毒品才杀人的，”南讲出了板仓想要听的话：“你说呢？”</p><p class="story-paragraph dialogue">“所以，你是恨毒品，”他直直地对着南说：“对吧？”</p><p class="story-paragraph">对方没回应，是默认了。</p><p class="story-paragraph dialogue">“一共死了三个人，一个线人，一个打手，”板仓的手指轻敲办公桌：“还有一个毒贩。”</p><p class="story-paragraph dialogue">“两败俱伤，只能说警察险胜。”这评价被板仓以小幅度的摇头否决。</p><p class="story-paragraph dialogue">“险胜都算不上，”他补充：“跑走了一个。”</p><p class="story-paragraph">南的态度终于有所松动。</p><p class="story-paragraph">她还想问，板仓感觉抓住了比赛里的一张好牌：“敏感的案子，线人的名字都会被抹掉，我无权告诉一个不参与进来的局外人。”</p><p class="story-paragraph dialogue">“随便你。”她撇下眼帘，好像毫不在意。“我真不知道你是怎么想的。”板仓往后仰，坐着的转椅发出“吱呀”一声。</p><p class="story-paragraph dialogue">“为什么一再挑战我的底线，我也不知道你怎么想的。”她不甘示弱，回击的话比以前狠：“我们律所只有我和神木两个人吗？”</p><p class="story-paragraph">板仓拿出前辈的样子来说教了：“我觉得你的底线，只是胆小的借口。”</p><p class="story-paragraph dialogue">“不用你来评价我。”南冷冷地回应。</p><p class="story-paragraph dialogue">“我手下的律师，不听我的指挥，这说得通吗？”他把声音提高了一点：“那么多案子，就算是按标准的分配也要轮到你，但我全部排给了别人。”</p><p class="story-paragraph dialogue">“谢谢你。”名井南的态度把板仓恼惹毛了。</p><p class="story-paragraph dialogue">“你必须要给我一个理由，”他压着脾气：“这不是常规的贩毒案，还有个没被抓住的，你要是真的如此憎恨那群人，为什么一点忙也不肯帮？”</p><p class="story-paragraph dialogue">“继续往下说的话，”南没有彻底拒绝，她开了条件：“我会考虑。”</p><p class="story-paragraph">不能再让步了，双方对峙的选择都很坚决。</p><p class="story-paragraph dialogue">“除了福田以外的人，关系网都理得很清楚，”想到南这样的反应来之不易，还是板仓先屈服：“他有两个同伴，一个叫丸子的已经被击毙了，她的日本真名是水野彩可。”</p><p class="story-paragraph dialogue">“女性，而且…”南听到有点意外：“她还有别的名字吗？”</p><p class="story-paragraph dialogue">“不是日本人，好像是英夫在美国念书时交往的对象，拿了化学专业的博士学位，”板仓的言外之意尤为明显：“制毒和贩毒都是同一拨人。”</p><p class="story-paragraph dialogue">“还没抓到的那个？”南继续问。</p><p class="story-paragraph dialogue">“那个人叫博多，听说他的职业特殊，所以藏得很隐蔽。”他简要地概括了一下：“现在还是不知道身份。”</p><p class="story-paragraph dialogue">“那边想来场博弈。”板仓放慢了语速：“利用一种类似于囚徒困境的心理。”</p><p class="story-paragraph dialogue">“向我们抛了橄榄枝。”南锐利的眼神落在板仓身上，后者摆手：“我没收好处。”</p><p class="story-paragraph">她简单地“嗯”了一声，也觉得老板不至于冷漠到无动于衷，完全不接受警方的提议：“所以你想怎么做？”</p><p class="story-paragraph dialogue">“娇生惯养的瘾君子，”他琢磨着客户的心态：“和哥哥感情也不错，很好操控。”</p><p class="story-paragraph dialogue">“主动招供可能会遭报复。”南眸子里跳动着晦涩难辨的情绪。</p><p class="story-paragraph dialogue">“是的。”板仓的声音听起来没什么波澜，她不动声色地抿了抿唇。</p><p class="story-paragraph">没有切肤之痛的亲身经历，怎么能对那群法外狂徒的狠毒心肠感同身受？“他还有亲人。”南慢慢地陈述这个事实。</p><p class="story-paragraph dialogue">“我知道。”不管后面的话题会如何进行，板仓打了个响指，他已经说得够多：“到此为止，我的部分结束了。”</p><p class="story-paragraph">冷冰冰的数字，在那之前明明还是活生生的人。</p><p class="story-paragraph">只要不是轰动全社会的案件，为了保护被告最后的人身权利，凶手的真名不会向外界公布。</p><p class="story-paragraph">南觉得好不公平，痛苦的人仍在落泪，这可笑的法律条令居然成了一条纯白的布绸子，把杀人者手上的鲜血擦得干干净净。</p><p class="story-paragraph">和毒贩扯上边的凶案，死者的无辜亲属可能永远也不会知道真相，不会知道坏家伙究竟是谁。</p><p class="story-paragraph">有权有势的人也许能顺藤摸瓜，打探到仇人的姓名，但无依无靠的人怎么办。</p><p class="story-paragraph">遭遇了无数次的梦魇。</p><p class="story-paragraph">南想起了纱夏，每到这个时候，她都恨不得把过去撕得干干净净。</p><p class="story-paragraph">可要是真的撕得干干净净了，修正了那个历史奇点，她和女孩的相遇都将不复存在。</p><p class="story-paragraph">是这样，她才成为了纱夏的妈妈，才和纱夏相爱了。</p><p class="story-paragraph">今天又会有其他受害人去承受纱夏经历过的痛苦。</p><p class="story-paragraph">她的父亲至少付出了代价，如今长眠在遥远的地底，指不定都早已前往另一个世界了。</p><p class="story-paragraph">但是那个叫博多的人，还没得到应有的惩罚。</p><p class="story-paragraph">气力正一点点地从南的身体里逃逸出去。</p><p class="story-paragraph">她这次又要做一个残忍的知情者，仅仅是袖手旁观吗？</p><p class="story-paragraph dialogue">“要和警察打配合，除了你，我本来不放心把这个案子交给任何人，”板仓没理南的反应，自顾自地往下说：“你要接着拒绝，当然没问题。我现在也开始想，你这么怕，可能根本没能力胜任这个官司。”</p><p class="story-paragraph">南把门掩上退出去，板仓最后的话还盘旋在她的脑海里。</p><p class="story-paragraph dialogue">“既然你靠不住，”男人定定地看着她：“我会为他辩护。”</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">应该没空闲时间去打理形象。</p><p class="story-paragraph">南坐在玻璃隔板的外面，视线平稳地降临在被告的身上。</p><p class="story-paragraph">福田英夫胡子拉碴，头发也乱蓬蓬，硬剪下来可以直接做鸟窝。他的小臂上有溃烂的印记，是吸毒给健康皮肤带来的损伤。</p><p class="story-paragraph">南进出看守所的次数多得数不清，这却是她第一次坐在毒贩的面前。</p><p class="story-paragraph">女儿给她的那条项链挂在她的脖子上，现在好像在发烫。南紧了紧握住文件的手指，她从纱夏那里拿到了一点勇气。</p><p class="story-paragraph dialogue">“福田先生，我们开始吧。”她把报告夹搁在木制的桌子上。</p><p class="story-paragraph">那人没有反应。</p><p class="story-paragraph">重案嫌疑人的探望时间是有限制的，可南算有耐心，她在等面前这个失魂落魄的家伙缓过神来。</p><p class="story-paragraph dialogue">“我以后会怎么样？”英夫终于开口说话了，音色和他本人一样年轻，却还是掩不住浓浓的疲态。</p><p class="story-paragraph dialogue">“走向基本敲定了，还想有转机的话，要取决于您的证词。”南实话实说，作为律师，英夫面临的指控算得上很严重。</p><p class="story-paragraph dialogue">“我的证词。”他垂下头，喉咙有点嘶哑，吐出来的词发出杂音，像藏了条蛇信子在嗓子里。</p><p class="story-paragraph dialogue">“没用了，彩可也已经…”英夫的脸上浮现了悲怮的神情，在怀念逝去的爱人。</p><p class="story-paragraph dialogue">“您的哥哥还在等着您。”南知道他们兄弟二人是相依为命的关系，年轻人好像有因此被打动。</p><p class="story-paragraph">他的身子稍微往律师那边倾斜了一点。</p><p class="story-paragraph dialogue">“我们要争取到一个最小的损失，如果您没忘记的话，应该知道里面的生活并不舒服，”英夫已经被关过两年，南的用词很直接：“而且在里面还会被迫戒毒。”</p><p class="story-paragraph dialogue">“我研究过法律，”他看起来满不在乎：“像我这种情况，再做过分一点就可以杀头了，能活下来就算不错的。”</p><p class="story-paragraph dialogue">“您现在待在最里面的房间里，”律师用了个比喻的方法让英夫了解情况：“也许我可以帮忙开两扇门，虽然不至于完全出来，但空气总没有那么闷。”</p><p class="story-paragraph dialogue">“比如说？”他动了动眼皮。</p><p class="story-paragraph dialogue">“还是有很大几率能够减少服刑时间的。”南没骗他，就现在的情况来看，只要英夫肯说出博多的真实身份和藏身地点，就能实现这个目的。</p><p class="story-paragraph">他安静地沉默了一会儿。</p><p class="story-paragraph dialogue">“需要支付什么代价？”小毒枭的想法很务实。</p><p class="story-paragraph dialogue">“用代价这个词不准确，”南帮他修正表达：“是请您帮忙。”</p><p class="story-paragraph dialogue">“我还能帮忙，”英夫嘴角勾起一个自嘲的笑：“什么忙？”“只要提供博多的真名。”南凭着记忆说出这个代号的时候，发现英夫的眼睛微微地张大了一点。</p><p class="story-paragraph dialogue">“警察都没问出来的东西，”英夫摇了摇头，意识到对方是要他招供，终于露出点狡猾的阴毒：“你还想套我的话？”</p><p class="story-paragraph dialogue">“不抓住机会，门就会关上，”南早知道他不会这么容易妥协：“如果博多自己露馅，被警察发现了，您还要承担包庇的罪名。”</p><p class="story-paragraph">她的停顿吸引了英夫的注意力：“万一他在逃时杀了什么人，要担心的问题可就没现在这么好解决了。”</p><p class="story-paragraph dialogue">“你只是在假设，想要我害怕。”英夫还坚持着没松懈。</p><p class="story-paragraph">南把带来的文件翻开，她从里面抽了张纸，通过玻璃板底下的缝隙递给英夫：“您还没看过证据目录吧。”</p><p class="story-paragraph">英夫接过，眯着眼浏览起来。</p><p class="story-paragraph dialogue">“我有检察院的朋友，特意要来的，”有检察院朋友的人其实是板仓，南厚脸皮地把人情揽到自己身上：“您发现哪里不对劲了吗？”</p><p class="story-paragraph dialogue">“哪里？”他不知道，上面写的词语也没有错别字。</p><p class="story-paragraph dialogue">“福田先生，您连大本营都被端了，”南冷静地阐明她的观点：“不觉得他们收集到的证据实在是太少了吗？”</p><p class="story-paragraph">英夫这才发现，目录上只列出了五行小字。</p><p class="story-paragraph">警察要是找到了他的据点，应该会发现更多证据才是。</p><p class="story-paragraph">这上面写的，大部分还是从他被抓的现场里搜出的东西。</p><p class="story-paragraph">交易的地点、使用的枪械、装在车里的毒品。</p><p class="story-paragraph">还有他长时间吸食毒品，以及贩卖毒品的证据。</p><p class="story-paragraph dialogue">“连我都清楚您还在制毒，他们会被蒙在鼓里？”她逐字逐句地对福田说：“这上面却一点都没有写，而且材料已经提交给法院了。”</p><p class="story-paragraph dialogue">“你什么意思？”</p><p class="story-paragraph">终于咬钩了，南想。</p><p class="story-paragraph dialogue">“他们知道您制毒，但把证据藏起来了，要杀我们一个措手不及，”律师把经验都告诉了英夫：“这招他们爱用。”</p><p class="story-paragraph dialogue">“换言之，如果他们也已经知道博多的真实身份了，是想在裁判上当作杀手锏，所以才选择隐去这些证据的话，”她发现英夫的手在发抖：“在法庭里搬出来，您还坚持说不知道博多是谁，可真的是跳进黄河都洗不清了。”“你在撒谎，”他虽然这么说，但无疑是慌张了：“如果他们知道了，警察怎么可能昨天还来问我？”</p><p class="story-paragraph dialogue">“福田先生，警察是警察，检察院是检察院，我们偶尔交流一下而已，并不共享情报，”她晃了晃手中的纸张：“能拿到证据目录也只是靠交际关系。”</p><p class="story-paragraph">南是在说谎，但英夫看不出来。</p><p class="story-paragraph">既贩毒又杀人的凶徒，已经是严重影响公共治安的定时炸弹了。</p><p class="story-paragraph">甚至还留了个逃犯…</p><p class="story-paragraph">所有人都会齐心协力把它拆除。</p><p class="story-paragraph dialogue">“检察院大多数情况下只想把官司打得漂亮，他们不会管那么多的，您可能不知道，”看出他对这些并不了解，于是南乘胜追击：“这些人喜欢到最后关头才把证据拿出来，被告越害怕，他们就越开心。”</p><p class="story-paragraph dialogue">“你说的都是假设。”英夫复述了一遍，情绪却有点起伏，好像是想让自己镇定下来。</p><p class="story-paragraph dialogue">“我不知道您为何这么一意孤行，是确信博多是个厉害的角色，完全不会被警察发现呢…”南觉得她离游说成功的胜利只差一点点，不能轻易放弃：“还是认为他会在外面接应您？”</p><p class="story-paragraph">答案是后一个，英夫投来了个很诡异的表情。</p><p class="story-paragraph dialogue">“律师应该为被告人保守秘密。”这是神木告诉他的，英夫现在把它拿出来。他要名井南遵守职业道德。</p><p class="story-paragraph dialogue">“我是和您站在一边的，我做的一切，是为了减轻您的处罚，”她没有退缩：“您要清楚，一旦警察知道了博多是谁，或者博多被您的哪个手下告发了，您就要承担本可以摆脱掉的负累，不觉得很亏吗？”</p><p class="story-paragraph dialogue">“还不需要提供藏身处，只是一个名字，在开庭前告诉警察，我就可以拿去对薄公堂，说您的认错态度良好，”南极尽所能地在动摇英夫的意志力，她用了激将法：“都说做生意的人头脑精明，我好像没在您身上看到。”</p><p class="story-paragraph dialogue">“现在可不可以申请换律师？”英夫面色阴沉：“把我原先的那个律师叫过来。”</p><p class="story-paragraph dialogue">“不行，”南笑眯眯的：“您说的是神木堂律师吧？很抱歉，他来不了。”</p><p class="story-paragraph">英夫显然有点惊讶：“你知道他？”</p><p class="story-paragraph dialogue">“我和他是一个律所的，”南对被告说：“照理说，四年以前我和您就该见面，那个案子是分给我的，但是神木律师揽过去了，所以这次我替他来。”</p><p class="story-paragraph dialogue">“我不知道你叫什么，没人告诉我你和他是同事。”英夫在听到“四年前”这几个字的时候的反应耐人寻味：“为什么他没来？”</p><p class="story-paragraph dialogue">“他休假去了。”客户问的问题，南向来都是一一回答的。</p><p class="story-paragraph dialogue">“休假？”英夫的眉头一下就皱起来：“什么时候开始休假的？”“休假一周了，”板仓告诉她了，南不知道英夫为何这么关心神木堂，但还是应了这个话题：“还说为了图清净，把手机都关了。”</p><p class="story-paragraph">南刚说完，就被英夫吓了一大跳。</p><p class="story-paragraph">对方突然把眼睛瞪得很大，因睡眠不足产生的红血丝充斥着他的眼白，让这个情景很可怖。</p><p class="story-paragraph dialogue">“休假。”英夫骨碌碌地转着眼珠，话是从紧闭牙关的齿缝中钻出来的。</p><p class="story-paragraph">南没反应过来。</p><p class="story-paragraph dialogue">“把手机关了…”他的皮肤因愤怒涨成猪肝色，动作变僵硬了，看起来像癫痫发作的病人。</p><p class="story-paragraph">她不太明白英夫说的话是什么意思。</p><p class="story-paragraph">犯毒瘾了吗？</p><p class="story-paragraph">南的手心因紧张在出汗，她退离了座位，靠后站着。</p><p class="story-paragraph">他活像从地狱里爬出的怪物。</p><p class="story-paragraph dialogue">“是为了躲我！”</p><p class="story-paragraph">英夫用拳头锤那块夹在两人中间的玻璃板，巨大的噪音和从他嘴里溢出来的低吼让值班的人匆匆赶来。</p><p class="story-paragraph dialogue">“竟敢出尔反尔…”</p><p class="story-paragraph">警卫想把英夫按住，但年轻人使出来的蛮力让他都趔趄地往后退了几步。</p><p class="story-paragraph">吸毒的副作用让英夫很难控制自己的情绪，他的精神变得很脆弱。</p><p class="story-paragraph">可能是意识到再不说就没机会了，他和名井南对视了一眼。</p><p class="story-paragraph dialogue">“博多…”南听清了英夫的话，尽管那些词模糊不清。</p><p class="story-paragraph">她脊背上的汗毛都竖起来了，感觉血液一下子从头凉到脚。</p><p class="story-paragraph">英夫脸上挂着阴森森的诡笑，南不寒而栗，恐惧的幼虫爬上了她的身体。</p><p class="story-paragraph dialogue">“如你所见，他把我丢下了。”</p><p class="story-paragraph">在毒贩子流露出的恨意里，她知道今天的到访的目的已经达到了。</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">电话是名井南打来的，她的老板为此停下了手头的工作。</p><p class="story-paragraph">律师最终还是决定接过这个任务，板仓有点意外，他当时真准备自己去的。所以，说是名井单枪匹马上阵不准确，板仓在后面为她撑着腰。</p><p class="story-paragraph">证据目录是板仓拿到手的，用名号做担保，他还在看守所那里争取到了更多谈判时间。</p><p class="story-paragraph">检方的确是像南说的那样，抹掉了一些已知的证据，想让裁判打得更有戏剧性。</p><p class="story-paragraph">判事也是人，再怎么公正无私，不免会被一些合法的技巧蒙住眼睛，作出相对冲动的判断。</p><p class="story-paragraph">但博多的身份并不在那些已知的证据中，他们真的不知道藏起来的毒贩究竟是谁。</p><p class="story-paragraph">南和板仓合力生出一计，干脆就去诈诈英夫，关键时刻，双方肯定都要为自己的利益争得头破血流，说不定能挑拨离间。</p><p class="story-paragraph">按照预期的设想，南这时打电话，她应该已经会见完英夫，在回来的路上了。</p><p class="story-paragraph dialogue">“喂？”女人的语气很严肃，板仓还没来得及回应，她紧接着抛了一句话。</p><p class="story-paragraph dialogue">“你身边有没有人？”</p><p class="story-paragraph">板仓扫了一眼空荡荡的办公室，只有空气净化器开着，把室内绿植的叶子吹得上下飘动：“没有。”</p><p class="story-paragraph dialogue">“无论我说什么，你都只要回答是或者不是，不要多说别的话，”南再次提醒他：“不要问我问题，也不要表现得很惊讶。”</p><p class="story-paragraph dialogue">“好。”从板仓的口里端端正正地蹦出一个字，这阵仗不同寻常，他乖乖照办。</p><p class="story-paragraph dialogue">“我知道博多是谁了。”她把那个让自己至今都没反应过来的消息告诉了上司。</p><p class="story-paragraph dialogue">“嗯。”板仓就知道她一定能做到的。</p><p class="story-paragraph">他极力阻止自己的问句出口，等名井南公布答案。</p><p class="story-paragraph dialogue">“博多，”真相窜出去的时候，南的头皮发麻：“是我们事务所的神木律师。”</p><p class="story-paragraph dialogue">“什…？”这个回音如雷贯耳。</p><p class="story-paragraph">他想起南的嘱托，硬生生闭上了嘴。</p><p class="story-paragraph">板仓的呼吸急促起来，一时间忘了讲话。</p><p class="story-paragraph dialogue">“打完电话以后，你检查一下办公室有没有什么很难清洁到的缝隙，”南在警告他，通话可能会被监听：“我出来就联系了警方，他们现在已经知道了。”</p><p class="story-paragraph dialogue">“好。”短短的音节，她知道板仓肯定有很多问题想问。</p><p class="story-paragraph dialogue">“进去周旋了很久，我估计福田很早就开始打算盘，应该是在纠结招不招，”南回想着面见时的所有细节：“和我说的意思，可能是神木堂在出事之前和他约定过要拉他一把的，但是对方食言了。”“明白。”板仓尽量让自己看起来是在处理普通的公务一样。</p><p class="story-paragraph dialogue">“说神木已经休假了一星期，他就忍不住了。”英夫像凶兽那样冲过来的画面还印在她的视网膜上，南抬手抚弄了一下纱夏的那颗绿松石。</p><p class="story-paragraph dialogue">“辛苦了。”板仓说了句别的话，可能是察觉到了下属声音里不自然的颤抖。</p><p class="story-paragraph dialogue">“应该早点发现的，”南在车里，一直回忆着不对劲的地方：“现在想起来有很奇怪的事情，去年夏天神木来过我的办公室，我记得当时很热，但是他穿的长袖，和我说他感冒怕冷。”</p><p class="story-paragraph dialogue">“我也看到很多次。”板仓尽量用语义不明显的句子回答她，意思是他也见过神木做的这些不合时宜的举动。</p><p class="story-paragraph dialogue">“我在福田的手臂上发现很多明显的溃疡。”南极尽所能地翻动起她的记忆：“而且从去年开始，就没看过神木把手臂露出来。”</p><p class="story-paragraph">她突然有种很不祥的预感。</p><p class="story-paragraph">神木那天的出现很突兀，所以南总记得那时存在什么违和的东西。</p><p class="story-paragraph">对方和她谈了关于纱夏的事。</p><p class="story-paragraph">南越来越怕，之前从没细想，只以为神木在没事找事。</p><p class="story-paragraph">现在她才后知后觉，问纱夏在读几年级，就是变相地在打探女儿的年龄。</p><p class="story-paragraph">不会有那么巧的…南抓紧手机，定了定心神，要解决的事情还有很多，不能为无根据的疑窦花费太多精力。</p><p class="story-paragraph dialogue">“英夫两年前出狱以后，神木还和他单独联系过，”南作出推断：“要不然也不会和他同流合污。”</p><p class="story-paragraph dialogue">“我不知道。”律师私底下会干嘛，板仓鞭长莫及，他没办法管住每一个人，更何况下班之后大家都是各干各的。</p><p class="story-paragraph dialogue">“去年年末总结财务出问题了，”南在和板仓确认：“是不是他？”</p><p class="story-paragraph dialogue">“嗯，”板仓想起神木还和他担保过，说他短期融资一下周转不灵，不过等收假回来就能填上这个漏洞，看来这个钱是要不回来了：“是的。”</p><p class="story-paragraph dialogue">“警察那边动作应该不会太大，现在只能由你去联系一下他了，”他们得走一步看一步，不能打草惊蛇：“不知道神木身边还有没有给他帮忙的人。”</p><p class="story-paragraph dialogue">“好。”板仓应了。</p><p class="story-paragraph dialogue">“最后一个问题。”南深吸了一口气，她在祈祷这个答案不要是肯定。</p><p class="story-paragraph dialogue">“神木知不知道是我接的案子？”</p><p class="story-paragraph dialogue">“我想应该知道。”板仓的心沉底了。福田雄一先是单独联系的神木堂，问律师可不可以再帮他弟弟一次。</p><p class="story-paragraph">被神木拒绝了，他才来事务所求援。</p><p class="story-paragraph">如果神木最初就虎视眈眈地盯着那个要接下案子的人，想必已经从被告哥哥那里得知了消息。</p><p class="story-paragraph">神木的败诉率连连走高，板仓没太当回事。</p><p class="story-paragraph">谁能料到，危险竟然就藏在眼皮子下面。</p><p class="story-paragraph">他把名井南害惨了。</p><p class="story-paragraph">板仓在挂断前听到南给自己的最后一句留言。</p><p class="story-paragraph dialogue">“小心一点。”</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph">下了很大的雨，纱夏的袜子因主人不小心踩了几个水坑而变潮，弄得她不舒服。</p><p class="story-paragraph">没闲工夫回寝室换了，她看了眼时间，离上课不差几分钟。</p><p class="story-paragraph">今天是周五，上午满课，不过纱夏吃完中饭以后就能收拾东西走人。</p><p class="story-paragraph">休息日必须要和南在一起。</p><p class="story-paragraph">她把手机放回口袋里。</p><p class="story-paragraph">和妈妈把话摊明讲了以后，情况变好了很多。</p><p class="story-paragraph">南虽然还在犹豫，可她越来越宽容，听到纱夏藏不住的表白时，偶尔会用浅笑来应答。</p><p class="story-paragraph">妈妈向她敞开心扉了，即便只有一点点。</p><p class="story-paragraph">纱夏扣紧了女人的手，心脏因这种喜悦而剧烈地跳动着。</p><p class="story-paragraph">家完全变成两人的爱巢，出门的次数减到无穷小，行动被局限在床笫之间。</p><p class="story-paragraph">纱夏觉得以后都不用穿衣服，方便随时随地都可能发生的欢爱无障碍地进行。</p><p class="story-paragraph">她喜欢把妈妈抱在怀里操她，不过说实话，只要是和南做，她什么姿势都喜欢。</p><p class="story-paragraph">但面对面才能把女人的模样尽收眼底，纱夏要好好地看着她。</p><p class="story-paragraph">少女炽烈如火焰一般的情 ph">她搂着妈妈，翻身滚进被子里，包了两圈往边上躺。</p><p class="story-paragraph">像被裹成了粽子。</p><p class="story-paragraph dialogue">“一定要这样吗？”南在抱怨，这样睡觉有点挤。</p><p class="story-paragraph dialogue">“还不是妈妈把那边弄湿了，会感冒的。”纱夏觉得还好，她反正喜欢抱着妈妈，这正中她的下怀。</p><p class="story-paragraph">谁知道南用膝盖挤进了纱夏两腿间的缝隙，她们没人穿衣服，女孩大腿的皮肤滑溜得不行，南一下就顶到了底。</p><p class="story-paragraph dialogue">“如果是这样的话，”妈妈膝盖上微凸出来的那块骨头硬硬的，把纱夏磨得小声哼哼：“纱夏想不想要？”</p><p class="story-paragraph">她用手阻止南，顺便还把被子稍微松了松，两具身体没再贴得那么近了。</p><p class="story-paragraph">光是进入妈妈的身体她就有反应了，怎么经得起撩拨？</p><p class="story-paragraph">纱夏自我警告，想着不能这么荒淫无度。</p><p class="story-paragraph">被女儿拒绝，南其实有点意外。</p><p class="story-paragraph">纱夏的小花穴明明也胆怯又贪心地往外吐着水。</p><p class="story-paragraph dialogue">“明天还有时间，”女孩的解释让南挑眉：“你上班辛苦。”</p><p class="story-paragraph">纱夏的说辞类似亡羊补牢的转圜。南有点无奈，如果女儿真的心疼自己，还这么放肆地和她做到深更半夜？</p><p class="story-paragraph">不过…</p><p class="story-paragraph">虽然迟了点，但年轻人竟也为她克制了那些冲动。</p><p class="story-paragraph">南能看出来，纱夏是真的很喜欢她。</p><p class="story-paragraph dialogue">“那再过来一点。”南在乖乖靠近的女儿嘴上亲了一下，她很安分地躺好，额头抵住了女孩的肩膀，姿势是准备入睡了。</p><p class="story-paragraph dialogue">“纱夏要是谈恋爱的话，应该是很体贴对方的那类人吧。”纱夏发现妈妈喜欢这样试探她，虽然依旧有点恼，但这次她也算是控制住了情绪，语气无异地回答了南。</p><p class="story-paragraph dialogue">“可能吧。”她告诉妈妈，声音挺小的。</p><p class="story-paragraph">为了缓解一下过分索求带来的酸痛感，纱夏在给南揉腰。</p><p class="story-paragraph">她施下的力道不大，有耐心地按了很久。</p><p class="story-paragraph">不想这么快就把和南在一起的一天过完，纱夏睁着也有些迷瞪的双眼。</p><p class="story-paragraph">她还想看一会儿妈妈。</p><p class="story-paragraph">南好像睡着了，弯眉难得地松弛着。</p><p class="story-paragraph">她看起来很安心。</p><p class="story-paragraph">女孩是怕被听到，才又轻轻地添了一句话。</p><p class="story-paragraph dialogue">“和你谈恋爱好不好？”</p><p class="story-paragraph">她虔诚地吻了吻南的头发，目光落在了她送给对方的那条项链上。</p><p class="story-paragraph">不管妈妈怎么说…</p><p class="story-paragraph">纱夏很清楚，她们都是属于彼此的。</p><p class="story-paragraph">这样的日子越过越少。</p><p class="story-paragraph">虽然妈妈前几天才给自己打了个电话，要她这周别回家，说最近工作量骤增，回来了也没时间陪她。</p><p class="story-paragraph">但纱夏不会管那么多，再等半年就要和她分开了，要不是论文答辩的日子迟迟未到，她恨不得每时每刻都和南在一起。</p><p class="story-paragraph">所以，家是一定要回的，妈妈要怪她就怪吧。纱夏还在去教室的路上。</p><p class=       <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">纱夏会听她的话，乖乖地留在学校吗？</p><p class="story-paragraph">名井南不确定。</p><p class="story-paragraph">不敢告诉女儿不让她回家的真正原因，南只得随意抛了个破绽百出的理由。</p><p class="story-paragraph">神木和自己是十来年的同事，肯定早已把她的住址摸得一清二楚。</p><p class="story-paragraph">照现在这个情况来看，纱夏待在寝室显然是更加安全的，至少那里人多眼杂，进出公寓楼还有专人看守。不像她现在住的小区，消防通道的楼梯拐角全部用的声控灯，只要动静稍微小一点，就可以安稳地被黑暗护在怀里。</p><p class="story-paragraph">要是想藏，轻松得很。</p><p class="story-paragraph">南现在每天一到家，就要先把能躲人的地方全部检查一遍。神木正被通缉，照他那个睥睨众生又自命不凡的高傲心性，南相信他不会贸然出手。</p><p class="story-paragraph">可这不是长久之计，如果对方迟迟未伏法，依旧在外逃亡，她还要骗纱夏多久？</p><p class="story-paragraph">应该把神木是毒贩子的真相全盘托出的，至少先和纱夏推诚布公…</p><p class="story-paragraph">但南做不到。</p><p class="story-paragraph dialogue">——神木不一定会来报复自己，这个人可能压根就不想和她耗，也许都已经找好帮手，准备偷渡出境了，南这样聊以自慰。</p><p class="story-paragraph">当然，被抓到了更好。</p><p class="story-paragraph">南翻开资料，离下场裁判开始剩下两个星期不到，要再梳理一遍庭审可能遭遇到的情况。</p><p class="story-paragraph">她在白纸上写了几行小字，猜测检方可能会把它们拿出来作为攻击的论据。</p><p class="story-paragraph">先是非法持有枪械的罪名，福田用的武器是 6.5 口径的左轮手枪，对应的六枚碎裂弹壳全部在现场找到。</p><p class="story-paragraph">被告没有持枪资格证，还使用手枪射击，无疑是非法的。</p><p class="story-paragraph">如果要深究，南得想办法溯源这把左轮枪，找到供应商，从那边作突破口。</p><p class="story-paragraph">手机屏幕亮了，她看一眼，是纱夏打来的。</p><p class="story-paragraph">她暂停了刚开始没多久的公务。</p><p class="story-paragraph">南合理猜测，这个时候给自己打电话，估计女儿还是想在周末和她见面。</p><p class="story-paragraph">要不要约纱夏在学校里吃个饭，顺便趁这个机会说明不让她回家的真正缘由？</p><p class="story-paragraph">这样的话，女儿肯定会担心她的安危，搞不好还想要回来一起住。</p><p class="story-paragraph">南在脑子里捋了好几遍说辞，结果思忖的时间太长，没接到这个电话。</p><p class="story-paragraph">虽然还没想好怎么应对，但她得回拨过去，南解锁了屏幕暗下去的手机。</p><p class="story-paragraph">未接来电那闪出“女儿”的备注是亮红色的，她还没来得及按，纱夏的电话立马又进来了。</p><p class="story-paragraph">南有点惊讶，是什么急事吗，她把听筒搁在耳边。</p><p class="story-paragraph">那一边很安静，只有静默的呼吸声。</p><p class="story-paragraph">南先开口：“找我什么事？”</p><p class="story-paragraph">没回应。她放下手机，通话的计时秒表已经开始跳动，的确是已经连接上了没错。</p><p class="story-paragraph dialogue">“纱夏？”她叫了女儿的名字。</p><p class="story-paragraph">传来了很明显的吸气声。</p><p class="story-paragraph">她意识到一件事。南突然惊醒，对方喘息的力度很重。这绝不是她女儿能发出来的声音。</p><p class="story-paragraph">不是纱夏，谁在电话的哪一边？“纱夏的妈妈。”说话的人语气好生硬：“是我啊。”</p><p class="story-paragraph dialogue">“你为何…”南猛地从椅子上站起来，她握住手机的手骤然失去了温度。</p><p class="story-paragraph">现在在用纱夏手机的人…</p><p class="story-paragraph dialogue">“看来你们关系还不错，”她听见神木洋洋得意地在那头宣告：“纱夏还在你名字后面加了一颗爱心。”</p><p class="story-paragraph dialogue">“纱夏的手机怎么会在你那里？”南的大脑泛起纯白的恐惧，电流如尖刀那样刺进脊髓，麻痹了她的神经末梢。</p><p class="story-paragraph dialogue">“名井律师脑袋瓜子不灵了吗？”神木干笑了两声：“纱夏的手机为什么在我这里，那当然是因为…”</p><p class="story-paragraph">他停顿了，好像在扭头看身边的人。</p><p class="story-paragraph dialogue">“她就在我边上啊。”</p><p class="story-paragraph dialogue">“别耍花招。”南控制着她的情绪，不让紧张和恐慌泄露给对方。</p><p class="story-paragraph">手指在发抖。</p><p class="story-paragraph dialogue">“你还没把我的身份和纱夏说吧，”神木的话是问句，但言语间的嚣张气焰表达出他的深信不疑：“当然不敢说，怕她问毒贩子的事，怕她知道你那个亲爱的爸爸，对不对？”</p><p class="story-paragraph">南哑了哑嗓子，没法讲出话来。</p><p class="story-paragraph">从得知神木是博多之后，她就开始担心…</p><p class="story-paragraph">最糟糕的事还是发生了。</p><p class="story-paragraph dialogue">“明明是母女情深啊。”神木抓了她的把柄：“却瞒着天大的秘密。”</p><p class="story-paragraph dialogue">“闭嘴。”南紧咬下唇。</p><p class="story-paragraph dialogue">“你要是不这么爱管闲事，继续像以前一样躲起来该多好，”神木的语气变得狠戾：“我还能放你一马。”“你要干什么？”她真的很后悔接下了这个案子，后悔把博多的身份揭开。</p><p class="story-paragraph dialogue">“反省一下自己是不是对她不好，名井南，怎么过了十多年，她还是这么在意亲生父母的死啊，”博多知道她的过去了，南闭上眼睛，心脏被厉鬼的利爪攥住：“我随口提了一嘴，说查案的时候知晓了一点内幕，她就主动赴约了。”</p><p class="story-paragraph">南抬手，落在自己的胸口前，那里好像有一股原生的疼痛在撕扯她的灵魂。</p><p class="story-paragraph">她只想着怎么切断纱夏通往危险的道路，却没料到女儿会自发地寻找起真相。</p><p class="story-paragraph">可是，真的吗…？</p><p class="story-paragraph">纱夏…会这样吗？</p><p class="story-paragraph dialogue">“如果你不来，”毒枭继续说了下去：“你可怜的女儿，就要沾上你父亲沾过的东西喽。”</p><p class="story-paragraph">这句话踩中了她禁区的地雷。</p><p class="story-paragraph dialogue">“你现在在哪？”南收拾起包，那双手把办公桌上的杂物碰得乱七八糟，刚刚还在用的圆珠笔“啪嗒”一声滚到地上。</p><p class="story-paragraph dialogue">“在哪！”</p><p class="story-paragraph dialogue">“名井律师，念在我们多年同事的情谊，我才和你做交易，别不知好歹，”神木特别会这一招：“要是被我发现你叫了警察，或者向你女儿的同学求助…”</p><p class="story-paragraph dialogue">“你父亲是做这个的，知道我们的规矩吧？”</p><p class="story-paragraph">南的眼眶不受控制地发酸，好像被发硬的毛绒布揩过一遍。</p><p class="story-paragraph">原来，她从来就没有摆脱过…</p><p class="story-paragraph dialogue">“我来找你，”南在案件薄上乱撕了一小张形状歪曲的纸条：“告诉我地址。”</p><p class="story-paragraph">字迹潦草得难以辨认，她刚写完，电话就被果断地挂掉了。</p><p class="story-paragraph">纱夏…</p><p class="story-paragraph">南点开那个定位软件。</p><p class="story-paragraph">另一个光标闪烁的位置，和神木给她的地址完全重合。</p><p class="story-paragraph">不是复制电话卡，神木真的拿着纱夏的手机。</p><p class="story-paragraph">南用座机内线拨了个号码。</p><p class="story-paragraph dialogue">“喂？”她打给了板仓。“是南吗？”板仓听到律师的声音抖得很厉害，好像发生了什么很不好的事：“怎么…”</p><p class="story-paragraph dialogue">“神木，”南逐字蹦出这句话：“他联系我了。”</p><p class="story-paragraph">板仓没想到神木真的会这么不留情面：“什么时候的事？他说什么了？”</p><p class="story-paragraph dialogue">“他用我女儿的手机，”南在哽咽：“给我打了电话，要我去见他。”</p><p class="story-paragraph dialogue">“纱夏的手机？他把纱夏怎么了吗？”板仓像挨了一棍子，天灵盖被敲得发响。</p><p class="story-paragraph dialogue">“他说纱夏在他旁边…”这会有什么样的后果，南根本不敢想。</p><p class="story-paragraph">板仓只能强迫自己去理智思考，在这个时候要稳住南的心智：“会不会是给你设的局，等你去跳？”</p><p class="story-paragraph dialogue">“有可能，但万一是真的…”凡事要做最坏的打算，绝不能让纱夏染上毒瘾，南翻开柜子里的一个小盒：“我去找他。”</p><p class="story-paragraph dialogue">“不行，太危险了，”板仓叫停她：“稳妥起见，先去你女儿的大学确认一下，或者报警…”</p><p class="story-paragraph dialogue">“他连纱夏的手机都拿到了，纱夏不可能主动把手机给他！”她崩溃地打断了板仓，想起神木口中的威胁：“这说明神木能接近纱夏，就算是在骗我也好，我得去一趟。”</p><p class="story-paragraph dialogue">“你疯了吗？他是要讹你，绝不可以，”板仓厉声喝止南：“你不能应约！”</p><p class="story-paragraph dialogue">“警察也想抓他，我刚好去拖延时间，”南下定决心，她一刻也不能再等，必须亲眼确认纱夏在不在神木身边：“神木也懂法，他不会做太过分的事情。”</p><p class="story-paragraph">找到了，南把那个像袖扣一样的微型录音器抓在手里，她以前收集证词时，常用这个做辅助。</p><p class="story-paragraph dialogue">“他懂法…”板仓急得无语：“他现在是陌路狂徒了，你指望他做什么理智的事情？”</p><p class="story-paragraph dialogue">“神木说一定要见我，要不然会让纱夏也染上…”南把博多的诅咒原封不动地告诉了板仓，可是“毒瘾”这个词，她依然讲不出来。</p><p class="story-paragraph dialogue">“你冷静一点，我们还不知道纱夏的位置…”板仓想劝劝她：“他想骗你单独去找他，他的目标是你。”</p><p class="story-paragraph dialogue">“主动权现在给他占了，无论纱夏在哪，我都没法安心。”</p><p class="story-paragraph">南不知道神木为何拿到了女儿的手机。</p><p class="story-paragraph">一想到对方可能会把歹毒的人留在纱夏身边，她就无比胆寒。</p><p class="story-paragraph dialogue">“像你所说，如果他的目标是我，见到我就能放过纱夏，”板仓竟从南的语气里听到轻松的意味：“我倒是求之不得。”</p><p class="story-paragraph">阻止不了。“神木为什么这么针对你？”板仓想起她对毒品的态度， 难道神木是觉得南挡了他生财和逃命的路吗？</p><p class="story-paragraph">南没回答。</p><p class="story-paragraph dialogue">“我的手机和纱夏的手机绑定了同一个定位软件，神木应该不知道，”她按了按录音器顶端的按钮，后者立即亮起了红色的信号灯：“手机我留在办公室，麻烦你马上来拿。”</p><p class="story-paragraph dialogue">“万一纱夏的手机没电，我怎么找到你？”板仓觉得她无疑是在送死：“万一神木把纱夏的手机关了怎么办？”</p><p class="story-paragraph dialogue">“我女儿睡前有把手机充满电的习惯，现在还早…”南回忆起纱夏的小举动，她其实根本没底，也不知道怎么解决板仓提出来的问题，可是不能再磨蹭了：“一个半小时以后我还没联系你，你再报警。”</p><p class="story-paragraph dialogue">“南，”板仓在和她谈条件：“一个小时。”</p><p class="story-paragraph dialogue">“一个半小时，”她的眼泪在往下掉，尽力让声音显得无异：“那里离这车程不远。”</p><p class="story-paragraph dialogue">“只能减十五分钟。”板仓不能再妥协。</p><p class="story-paragraph dialogue">“好，在之前别报警…”南的低声下气让他愣住了：“求你了。”</p><p class="story-paragraph">不剩太多时间，她把电话归位，男人的声音被收束在米白色的听筒里。</p><p class="story-paragraph">将手机的解锁密码取消，顺手带上了车钥匙和写了地址的纸条以后，南匆匆地开门出去。</p><p class="story-paragraph">奈未坐在外面，她好像听见律师发脾气了…</p><p class="story-paragraph">好难得出现这种情况，发生了什么惹怒名井南的事情吗？</p><p class="story-paragraph dialogue">“名井律师…您这是？”助手站起来，因为南好像要离开这里。</p><p class="story-paragraph dialogue">“有急事。”她甩下这么一句话，把手机递给奈未：“板仓先生来拿，一定要亲手交给他。”</p><p class="story-paragraph">奈未接住，神情有些犹豫：“可是待会有个面见，客户十点就要到了。”</p><p class="story-paragraph dialogue">“帮我取消。”</p><p class="story-paragraph">南说这句话的时候，脚已经跨出门廊。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">驶进市郊，南用了汽车内置的导航系统，机械的提示音带着她往偏僻的小径上开。</p><p class="story-paragraph">南七停八拐，绕了很大一圈，最后停在这栋完工的建筑前。无人之境，废弃的大楼，神木大概也是因为贩毒才能找到这样的地方。还在下雨，车窗玻璃被水滴砸得隆隆响，她把雨刷器关掉了。</p><p class="story-paragraph">水泥砌起的楼房中间断开，生锈的钢筋咬碎石块，在无边的空间里狰狞生长。录音器被南别在了内衣上，她从车里出来，没有雨伞，外套一下就被浇成深色，额间的碎发湿漉漉地黏紧她的皮肤。</p><p class="story-paragraph">揣在口袋里的那把防身小刀，原本是在办公室里被她用来裁纸的。</p><p class="story-paragraph">除此之外，南什么都没带。</p><p class="story-paragraph">潮气在脚踝处开始蔓延，携了凝好的水雾，缠着她的小腿继续爬。</p><p class="story-paragraph">神木在最高的那层，他待在向外探出的平台上，懒洋洋地靠住灰色的石砖，咧开嘴对着她笑。</p><p class="story-paragraph">纱夏…</p><p class="story-paragraph">南死死咬着牙齿，拼命地向上苍祷告。</p><p class="story-paragraph">她的女儿不要有事。</p><p class="story-paragraph">用什么来换都好…</p><p class="story-paragraph">往里走，她汲拉的脚步在地面上留下了很容易消失的水迹。</p><p class="story-paragraph">南沿着螺旋的半成品楼梯拾级而上，有几块松动的台阶彼此间留了小缝隙，被踢到时，抖落的细小碎粒直直坠到了底，荡出回声。</p><p class="story-paragraph dialogue">“小心点，名井律师，”她听见神木扯着嗓子调笑她：“上来之前别摔死了。”</p><p class="story-paragraph">楼房的主体结构已经落成，头顶上的天花板被浇筑好。</p><p class="story-paragraph">南踏上最后一阶楼梯。</p><p class="story-paragraph">西南角摆了好几个用木头条钉好的烂箱子，上面罩了层吸灰的旧布，已经黑得分不清原本的颜色了。</p><p class="story-paragraph">这层空无一物，没设护栏。</p><p class="story-paragraph">正中间搁着一把椅子，有捆粗麻绳被放置在座位上，明显就是用来绑架的道具。</p><p class="story-paragraph">神木就贴着它站住，他脚边摆了一个很大的行李提包。</p><p class="story-paragraph">男人穿的短袖，南在他手臂上看到了和英夫手上相同的溃疡。</p><p class="story-paragraph dialogue">“纱夏在哪？”她问出口，来这里就是为证实纱夏的安危。</p><p class="story-paragraph">神木轻蔑地往地上啐了一口，他在上衣里掏什么东西。</p><p class="story-paragraph">摸到之后，他对着南使了个眼色。</p><p class="story-paragraph dialogue">“在这。”神木晃了晃那个套了玫瑰金色壳子的手机。那个壳子…是她和纱夏一起逛街时买给女儿的。“你也太蠢了，”神木毫不遮掩眼底的不屑：“早知道这么轻松就能把你骗出来，我连你女儿的手机都懒得偷。”</p><p class="story-paragraph">南没管神木对自己的评价。</p><p class="story-paragraph">纱夏不在这里，她松了口气，没之前那么紧张了。</p><p class="story-paragraph dialogue">“别高兴得太早，还有人盯着你女儿呢。”神木很开心地看到南因为这句话再次胆怯起来：“想她平安无事，就不要轻举妄动。”</p><p class="story-paragraph dialogue">“大毒枭的女儿，应该很懂我的手段。”抓住名井南的把柄，他爽快得不行。</p><p class="story-paragraph dialogue">“你还知道什么？”南冷声询问面前的男人。</p><p class="story-paragraph dialogue">“知道什么？”神木笑呵呵的。</p><p class="story-paragraph dialogue">“我知道你父亲是个和我一样的毒贩子…”这些话几乎要把南的鼓膜穿透：“还知道你父亲把你养女的父母都杀了。”</p><p class="story-paragraph dialogue">“谁告诉你的…”她感觉好像有滚烫的鲜血从耳朵里涌出来。</p><p class="story-paragraph dialogue">“我们的缘分，”神木那双三角眼上挑，笑得很促狭：“我说事务所里有个很烦人的婊子，结果听到你的名字，就有人应了。”</p><p class="story-paragraph dialogue">“清清楚楚，全日本也没几个姓名井的，”神木站在原地，却让南倒退了好几步：“早就觉得你藏了什么秘密没说，我还以为是你哪个老相好吸毒呢。”</p><p class="story-paragraph dialogue">“你查了我父亲的案子。”南恶心得想吐，她的胃在痉挛，把酸苦的汁液推到了喉咙。</p><p class="story-paragraph dialogue">“完全正确，虽然被告的名字抹掉了，但我算了一下你女儿的年龄。”神木公布了他的调查结果。</p><p class="story-paragraph dialogue">“被你父亲杀掉的那对夫妻，是你女儿的亲生父母吧。”</p><p class="story-paragraph">墨菲定律应验，南的选择押中了最坏的赌注。</p><p class="story-paragraph">在会见英夫的时候，她就觉得对方说话有股关西腔。</p><p class="story-paragraph">虽然英夫常年生活在美国，再加上定居东京这么久，口音已经变得很浅，但故乡在关西的南一下就听出来了。</p><p class="story-paragraph">英夫是目前贩卖伯利恒的头目没错，可两年时间不到，后者就在日本这么流行。她怀疑还有更大的一只手在背后推波助澜。</p><p class="story-paragraph">万一英夫是关西人，万一真的有狠角色在帮他。</p><p class="story-paragraph">就怕藏起来的人…认识她的父亲。这个圈子真的不算大，有心人去拨弄两下，沉底的过往就浮上水面。</p><p class="story-paragraph dialogue">“把仇家带在身边的这招太高明了，我要好好学学，”神木把纱夏的手机抛上抛下，他怜悯地看着哑口无言的南：“你没什么要说的吗？”</p><p class="story-paragraph">咄人的实情是烙了火的金属。</p><p class="story-paragraph">纱夏的绝望和眼泪，是她将真相藏了十四年也无法心安理得支付的苦痛。</p><p class="story-paragraph">提醒得真是时候，她都快忘了…</p><p class="story-paragraph">女孩纯洁干净的爱意，怎么能接受呢？</p><p class="story-paragraph">这是杀害她双亲才换来的幸福啊。</p><p class="story-paragraph">美梦这么快就付之一炬，烈焰在天际燃烧，她最后的乐园发出即将坍塌的哀嚎。</p><p class="story-paragraph">长满倒钩的长鞭将她的皮一寸寸地剥了下来。</p><p class="story-paragraph dialogue">“够了。”南垂下了眼睛，唇角被心碎的引力拉出了一个笑容。</p><p class="story-paragraph">神木其实等着看名井落败。</p><p class="story-paragraph">他摩挲着下巴，没料到名井的这个应答，于是打了个像信号那样的响指。</p><p class="story-paragraph dialogue">“名井律师真是惜字如金，既然你没有要说的…”</p><p class="story-paragraph">背后有悉悉索索的脚步声，南像被踩着尾巴的猫一样应声回头。</p><p class="story-paragraph">是神木的同伙，她反应过来。但是，被沉甸甸的铁铊拴在赎罪的杆子上，南根本躲不开。</p><p class="story-paragraph">自头顶袭来了猛烈的钝痛，舌根被击得发麻，鼻腔传来了针刺一样的负压感。如果这里有两个人…是不是能说明纱夏那边是相对安全的？</p><p class="story-paragraph">南在失去意识之际想起了那几个木箱子。</p><p class="story-paragraph">恐怕对方在里面蹲了很久。“那就听我说吧。”她在昏过去以前，听见了神木的话。</p><p class="story-paragraph">南的膝盖重重地砸下去，殷红的液体将玫瑰花开在了地上。神木对她身后的人眨了眨眼睛。</p><p class="story-paragraph dialogue">“谢谢，耽误了你的时间。”</p><p class="story-paragraph dialogue">“你以前和我抱怨她的时候，我还以为她很聪明。” 龙之介掏了一根香烟点燃，他看着倒在地上的女人。龙之介的言外之意是，这女的没脑子。</p><p class="story-paragraph dialogue">“你可能没办法理解，人都是有弱点的，”神木笑得后槽牙都出来了：“你看到她表情没，我第一次见她露这种表情。”</p><p class="story-paragraph dialogue">“没看到。”他仔细地观察名井南的脸。</p><p class="story-paragraph">女人好像是睡着了一样。</p><p class="story-paragraph dialogue">“母爱有这么伟大吗，”神木伸起了懒腰：“为了女儿连命都不要了。”</p><p class="story-paragraph dialogue">“不过，”打完哈欠，他顺便又补了一句：“有东西比死还可怕。”</p><p class="story-paragraph">神木蹲下去，轻轻拍了一下名井的脸，好像觉得她能听见自己讲话：“你也知道那是什么东西吧？”</p><p class="story-paragraph dialogue">“你要操她？”身材真正点，长得也漂亮。</p><p class="story-paragraph dialogue">“放屁，”看龙之介盯得眼睛发直，神木有点无奈：“你想上的话，就快点。”</p><p class="story-paragraph dialogue">“算了，耽误时间，得把小命赔了，”他鼻子里喷出一团烟气：“你还不跑？”</p><p class="story-paragraph dialogue">“谁说我要跑了？”神木把名井从地上拉起来，将她推在椅子上。</p><p class="story-paragraph">神木摸到女人头上渗出来的血液，对方后脑勺的头发被他抓得胶在了一起。</p><p class="story-paragraph">他从那个软榻榻的旅行包里拿了两支针管，龙之介心下了然。</p><p class="story-paragraph dialogue">“这么讨厌她，”他调侃博多：“看不出来，你比我还狠。”</p><p class="story-paragraph dialogue">“做人要狠一点才行，”神木像想起什么，扭过头问龙之介：“你身上有枪吧。”</p><p class="story-paragraph dialogue">“有。”龙之介回答。</p><p class="story-paragraph dialogue">“可以给我吗？”他的手伸过去：“你回去路上也不会碰到什么人，就当给我的饯别礼物。”</p><p class="story-paragraph">厚脸皮，龙之介想，还管人讨礼物。</p><p class="story-paragraph dialogue">“行，”他把 6.5 口径的左轮交给博多：“但只有一发子弹了。”</p><p class="story-paragraph dialogue">“刚好。”神木的眼神忽明忽暗。</p><p class="story-paragraph">帮手的动作停滞了，他很快就明白了“饯别”的另一层含义。</p><p class="story-paragraph">龙之介回过神来，他以过来人的身份告诫了博多一句。</p><p class="story-paragraph dialogue">“会很痛的。”</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">纱夏上课的时候发现手机不见了。</p><p class="story-paragraph dialogue">“刚刚那个撞到我的人，”她想起那个小插曲，赶紧告诉美沙：“好像是个小偷。”</p><p class="story-paragraph dialogue">“你丢了什么东西吗？”美沙小声地询问，因为老师就在她们正前方。</p><p class="story-paragraph dialogue">“手机。”纱夏摸了好几遍口袋，包都翻了个底朝天，没找到它的踪影。</p><p class="story-paragraph">她在路上还用手机看过时间，不可能是没带出门。</p><p class="story-paragraph">在浅草寺抽的签…</p><p class="story-paragraph">这也太准了，她咂舌，不只是提示，这相当于成功地预知了未来。</p><p class="story-paragraph">抽签抽了快四个多月了，纱夏都把这茬事搁到遗忘的浅滩去了，没想到居然在这个时候成真。</p><p class="story-paragraph dialogue">“美沙，下课借我手机可以吗，”她今晚要回家，得和妈妈提前报备：“我要打个电话。”</p><p class="story-paragraph dialogue">“没问题，不过手机被偷…”美沙闭上了嘴，老师走到她身侧来了。</p><p class="story-paragraph">要不要看看监控呢？纱夏知道朋友想说什么。</p><p class="story-paragraph">她的手机有密码，锁屏状态下只能给一个人打电话，那是被设为紧急联系人的名井南。</p><p class="story-paragraph">比起这些，纱夏比较在意里面存着的东西。</p><p class="story-paragraph">有和南一起拍的照片，还有两人偶尔腻腻歪歪的聊天记录。</p><p class="story-paragraph">下载了互相绑定就能看到对方位置的软件。</p><p class="story-paragraph">手机在纱夏心里的价值还是很高的。</p><p class="story-paragraph">先通知南，那之后她再去找找吧。</p><p class="story-paragraph">纱夏刚看到翻开的书页，就猝不及防地接了个问题。</p><p class="story-paragraph">老师叫了她的名字：“凑崎同学，你来分析一下这句话里‘月色’的意象。”</p><p class="story-paragraph">这堂课是学诗歌鉴赏技巧的，比起低年级的同类课程，难度要高了好几个档次，问题不那么好答。</p><p class="story-paragraph">幸好在课外读过这首诗，纱夏还算是勉强应付过去了。</p><p class="story-paragraph">捱到下课铃响，她这位热情的老师还在讲台上手舞足蹈，估计是在为逝去的诗人打抱不平。</p><p class="story-paragraph dialogue">“好了，今天就到这里。”拖堂的人终于开始收拾起教案和电脑。纱夏也把书塞进包里，她和美沙准备往下一个教室移动。</p><p class="story-paragraph">从座位上起身，女孩接过了朋友递来的手机。</p><p class="story-paragraph">对那串数字早就烂熟于心了，她拨了南的号码。</p><p class="story-paragraph">电话马上就被接起，速度快得让纱夏惊讶。</p><p class="story-paragraph dialogue">“喂？是哪位？”</p><p class="story-paragraph">她听见一个男人的声音。</p><p class="story-paragraph">按错了吗？</p><p class="story-paragraph">纱夏仔细检查了一遍，没有。</p><p class="story-paragraph dialogue">“这是…”她发现对面不是本人，所以就没叫妈妈了：“名井南的手机吗？”</p><p class="story-paragraph dialogue">“是纱夏吗？”声音又有点耳熟，而且他马上自报家门了：“我是板仓本治。”</p><p class="story-paragraph dialogue">“板仓叔叔？”纱夏想起来了，是妈妈事务所的老板。</p><p class="story-paragraph dialogue">“你现在在哪？”对方的语气很焦灼，这让纱夏觉得奇怪。</p><p class="story-paragraph dialogue">“我现在在学校，”女孩一五一十地回答：“我妈妈怎么没接电话呢？”</p><p class="story-paragraph dialogue">“待会儿有没有事？”板仓叔叔好像在另一边处理什么文件，他劈里啪啦按键盘打字的声音很清晰。</p><p class="story-paragraph dialogue">“我还有一节课要上。”下一节课是专门学怎么写论文的。</p><p class="story-paragraph dialogue">“和老师请个假，你先去你们学校的正大门，”板仓语气凝重地指挥她：“会有警察来接你。”</p><p class="story-paragraph dialogue">“发生什么了？”纱夏愣住了，她不知道为什么警察会和自己联系在一起。</p><p class="story-paragraph">难道手机丢了一节课，就被捡到警察局去了吗？</p><p class="story-paragraph">也不用这么夸张吧，掉了个手机，还有警察来接。</p><p class="story-paragraph">而且板仓叔叔怎么也这么说，他又不知道自己手机被偷了。</p><p class="story-paragraph dialogue">“我们见面了再告诉你详细情况，”板仓尽量用简短的语句回答她：“你出来的时候，一定要走人多的地方，不要走小道。”</p><p class="story-paragraph">现在刚下课，从教室里鱼贯而出的学生挤在一起，放眼望去没几条称得上是“小道”的存在。</p><p class="story-paragraph dialogue">“好，可是我的手机不见了，现在在用我同学的。”纱夏偏过头，看着有些好奇的美沙：“怎么联系叔叔你呢？”“纱夏来过事务所，还知道大概位置吗？”</p><p class="story-paragraph dialogue">“嗯，知道的。”她和南去过好多次了。</p><p class="story-paragraph dialogue">“ </p><p class="story-paragraph dialogue">“你是说，吸毒，贩毒，再加上做出这种伤天害理的事…”南气得嘴唇发白：“全是因为工作上遇到了挫折？”</p><p class="story-paragraph dialogue">“别把自己看得那么高贵，我还不至于那么脆弱。”他转了个身。</p><p class="story-paragraph">类似玻璃制品撞在一起的清脆响声，南坐直了身体。</p><p class="story-paragraph">恐惧让南看清了神木那张扭曲的脸。</p><p class="story-paragraph dialogue">“你要是亲自尝过它的味道，就知道我为什么这么喜欢它了。”</p><p class="story-paragraph">他的手上拿着注射器。</p><p class="story-paragraph dialogue">“你想干吗！”南开始挣扎起来，但绳子绑得很死。</p><p class="story-paragraph dialogue">“毒枭的女儿没吸过毒怎么行，”他走到南的身侧：“我给你准备了好东西。”</p><p class="story-paragraph dialogue">“不要碰我！”她在和神木抓住她双手的力气对抗。</p><p class="story-paragraph">她用了全身的劲，拿腿去蹬神木，把男人踢得吃痛喊出声。</p><p class="story-paragraph dialogue">“别他妈乱动。”神木踏了椅子一脚，南被踹到了地上。</p><p class="story-paragraph">她的额角再一次被磕出了伤口，血液却被泪水冲得没了痕迹。“识货点，婊子。”他找不准南的血管，对方还在竭尽所能地反抗。</p><p class="story-paragraph dialogue">“离我远点…”南叫出来的声音越来越小，她要没有力气了：“离我远点…”</p><p class="story-paragraph">强弩之末罢了，神木用脚把她的手踩住。</p><p class="story-paragraph">好像听到了指节碎裂的声音。</p><p class="story-paragraph">埋在女人白皙皮肤里的青筋是那么漂亮，他都忍不住心动了。</p><p class="story-paragraph dialogue">“名井律师，好好享受吧，纯度最高的伯利恒，打一针能让你爽得再也离不开它。”</p><p class="story-paragraph dialogue">“不行！”南转动起被男人牢牢压住的手腕：“做了这种事情，你一辈子也回不到法律界！”</p><p class="story-paragraph dialogue">“对，”神木很痛快地承认：“所以我要你和我一样。”</p><p class="story-paragraph">来救救我…纱夏…</p><p class="story-paragraph">她的眼睛里盘踞了密密麻麻的情绪，那是深不见底的心死。</p><p class="story-paragraph">舌头被南咬得鲜血直流，顺着她嘴角往下滑。</p><p class="story-paragraph dialogue">“放过我…”南求饶的声音不像人能发出来的。</p><p class="story-paragraph">她不能成为一个废人。</p><p class="story-paragraph">和纱夏还会有以后…她答应过的。</p><p class="story-paragraph">之前食言那么多次了，她的小女孩总是容忍她。好不容易熬到现在…</p><p class="story-paragraph">她还要等女孩从美国回来。</p><p class="story-paragraph">纱夏…你在我身边吗？</p><p class="story-paragraph">南想躲，却是无处可逃。</p><p class="story-paragraph">力量悬殊太大了。</p><p class="story-paragraph">冰凉的物什靠住手腕。心悸和无力感混合在一起快要将她杀死。</p><p class="story-paragraph">尖锐的针头刺破了南的皮肤，内容物从针筒里被推进了血液。</p><p class="story-paragraph">一点一点的…</p><p class="story-paragraph">直到栓塞紧得无法再前进半分。她的身体在抽筋，神木把针管拔出来。</p><p class="story-paragraph">名井南会沦       <div class="chapter-copy"><aside class="author-note"><span>Notes</span><p>《边缘》名井南个人番外</p></aside><p class="story-paragraph">天气很好。南抬起头，晴空的颜色像浅海。“小南。”爸爸在叫她。云彩又是被卷起来的浪花，澄澈干净。“来和妈妈说再见了。”指尖明明探入了灿阳的领域，却触不到一点温度。如果…</p><p class="story-paragraph">她看到躺着的母亲，女人的表情是这么安宁。死亡难道是件很幸福的事吗？南的手指轻轻从妈妈的眉根上方掠过。自母亲患病以来，那两条秀气的眉毛总因疼痛拧成川字型的。女孩在妈妈眉心处抚弄了一小会，好像是为了确认逝者从此以后再也不会被病魔折磨。父亲流泪了，泪水垂直地坠在女人的面庞上，那两滴水珠子似乎是从永不会醒来的躯壳里涌出来的。妈妈是不是还活着？她也为离开我们而心碎，所以哭了…南被父亲牵住，男人带了薄茧的指节摩挲着她的手背。爸爸说过，妈妈生病了，是很严重的病。</p><p class="story-paragraph">南问他，怎么才能治好妈妈？</p><p class="story-paragraph">她不要妈妈每天都喝那么苦的药，不要妈妈身上插满用来治疗的管子，不要妈妈只能躺在床上。“爸爸也不知道，“他的声音是那么悲恸，一米八几的身子跪在她面前，搂着女孩，肩膀也在颤抖：“对不起。”为了保护妈妈，爸爸做了好多事情，为什么要道歉？才不是爸爸的错。</p><p class="story-paragraph">南从医院一路跟到了这里。</p><p class="story-paragraph">她很害怕，就像她每次等着妈妈从阵痛中苏醒那样害怕。妈妈再也不会给她讲睡前故事了，而现在，她似乎也要失去爸爸了。明明三个人都在这里，但那些幸福的回忆好像越来越模糊，缩成了像蚂蚁一样细小的沙粒。</p><p class="story-paragraph">他们一起拐了三折，妈妈就要被送进走廊尽头的那个大房间去了。南才反应过来，追着那个装了滑轮的小床跑。她的妈妈还在上面。</p><p class="story-paragraph">以后，是不是再也见不到了…</p><p class="story-paragraph">她好后悔刚刚没听爸爸的话，没好好地和妈妈告别。黄铜色金属做成的门，关上的时候发出了轰鸣的巨响，震得南脑袋晕晕的。“妈妈，”南的心被妈妈的离去撕得裂开，她能流出来的血不多，因为那颗心现在也只有一点点大。</p><p class="story-paragraph dialogue">“再见…”</p><p class="story-paragraph">她谁也怪不了。</p><p class="story-paragraph">南不知道时间的尺度该怎么划，她才上小学，还没学会数分钟的秒数。过了好久好久，可能是一个小时，也可能是好几个小时，有个穿制服的叔叔捧了个盒子出来。她听不懂他们讲的话，只看到了爸爸接过那个方形的黑匣。“妈妈呢？”南被男人领着出去，她扭头看那个紧闭的大门：“我们不等妈妈吗？”</p><p class="story-paragraph">妈妈进去了，为什么还没出来？</p><p class="story-paragraph dialogue">“妈妈和我们一起，”爸爸走得很快，好像一刻都不愿再在这里待下去：“我们要回家了。”她怎么没看到妈妈？南的视线在转了一圈以后，才落在那个叔叔交给爸爸的东西上。明明是看上去超级轻的盒子，爸爸却用单手死死地抱住了它…南突然就弄清楚了，爸爸不会丢下妈妈。他那么爱她。所以，妈妈是和他们一起回家的。南拉紧了父亲的手。她想起了家附近的那座公园。在妈妈没有生病的时候，他们一家三口总要玩旋转木马，有时她被爸爸抱着，有时她又坐在妈妈的怀里。他们挨得那么近，就像永远都不会分开一样。</p><p class="story-paragraph">如果…</p><p class="story-paragraph">妈妈还陪着她的话。</p><p class="story-paragraph">今天的天气真好，她好想和妈妈再去玩一次。</p><p class="story-paragraph">爸爸变得沉默寡言，南体谅他。母亲就留下了那么几张黑白彩色的照片，还有写着她名字的病历单，这堆看起来无用处的废纸也被男人好好地收起来了。南收到的关心不再是陪伴，反而是换成了富足的物质生活。爸爸为了分散注意力，现在拼了命的工作。那些需要妈妈教的事，都是南靠着自己学会的。家里只有她一个人需要用卫生巾，她就一个人去买。没时间打理头发，南干脆剪了个齐耳的学生头。为了讨父亲开心，她和家里的保姆学了烹饪，有机会就为晚归的他准备饭菜。</p><p class="story-paragraph">以及，和爸爸一样，南也把心思寄托在其他的事情上，于是她发了狠地学习。无论分到哪个班，老师都喜欢她。喜欢得紧。这个学生既勤奋又聪明，还不爱出风头。</p><p class="story-paragraph">好在再没遇上什么挫折。南把舞蹈当作爱好，尽管最后因为繁忙的学业只得将其搁置，她还是靠了芭蕾度过了很长一段的孤独日子。竟然也算是健康地长大了。</p><p class="story-paragraph">在国中时期她交了不少好朋友。</p><p class="story-paragraph">南的初恋是个女孩，和她截然不同的性格，张扬跋扈，不服管教。在校门口被执勤的名井抓了好几次，对方一点想改的意思都没有。“同学，下次要是再迟到，我就要…”对南的警告熟视无睹，她好像根本不在意这位铁面无私的学生干部说什么。“和我一起吃饭？”“什么？”南看着不良少女脸红到了耳根，不明白她的意思。</p><p class="story-paragraph">只要南一戴着袖章，女孩就要在她面前晃来晃去。明明能在铃响之前跨进校门，对方硬是要慢腾腾地挪到她的视线里，好像是故意要给南登记上一样。</p><p class="story-paragraph dialogue">“又迟到了，你今天还化妆，不知道校规严禁…”南落笔要写下她的名字。女孩递过来一盒从便利店里买来的牛奶，还有用塑料袋装着的、热好的三明治。“上次说要请你一起吃饭，结果被你拒绝了，”她笑着，有什么东西一路蔓到了南的心底：“名井会长赏个脸，你还没吃东西吧？”</p><p class="story-paragraph">以此为契机开始交往，一段很干净的校园恋爱。偷偷勾着手散步，在无人的角落里接吻，休息时会溜到教学楼的天台。她喜欢把头枕在南的大腿上，还喜欢亲南的下巴，在做完这一切以后她才再去望天空，用手指勾勒云朵的形状。“小南不怕被老师抓住？”学生会会长居然陪自己翘了一节班主任的课，她有点不好意思。“你不是在这里吗？”因得了南的回答而高兴，她伸手搂住年级第一露在校服外的那截脖颈。南含着笑，低下头和爱人交换了绵长的气息。</p><p class="story-paragraph">可惜还是分手了。在南读大一的时候，无休止的猜忌和争吵成了这段爱情的主旋律，异地将两人的距离拉得越来越远。</p><p class="story-paragraph">初恋是在电话里和自己告别的。</p><p class="story-paragraph">陪伴在彼此身边两年有余，一同经历的喜怒哀乐多得数不胜数。她听到爱人在另一头泣不成声，心被狠狠地揪住。</p><p class="story-paragraph">回忆的攻势猛烈到了不真实的程度，南在道路交错的迷宫里踱步，最后停在两人第一次互相确认心意的那天。</p><p class="story-paragraph">女孩把她拉到樱花树底下，给出的理由幼稚得让现在的南轻笑了一声。“小南就像四月盛开的樱花一样漂亮。”“所以，小南可不可以和我在一起？”她怕南理解错了：“我对你的喜欢不止是朋友间的。”南对这句话熟得不能再熟，她几乎是同时和曾经的自己一起开口。“我也是。”还是一样心动，却已经走不下去了。</p><p class="story-paragraph">她的睫羽在颤抖，视线垂得很低。裂隙难以修复，拾起来也只会重蹈覆辙，失去心爱之人的风险痛得扎人骨头，她再也不愿意承担。好像没从父亲那里遗传到他的深情。不能当面和她好好分手，南很内疚。</p><p class="story-paragraph">母亲的突兀离去，成了她越不过的坎。</p><p class="story-paragraph">南光裸地站在家里的落地镜前，一遍又一遍打量着这具身体。</p><p class="story-paragraph dialogue">——没有人是要依附另一个人才能活着的。</p><p class="story-paragraph dialogue">——身外之物没有一件是真的属于她的，没有一样是她能带得走的。</p><p class="story-paragraph">就像妈妈一样…迟早会离她而去。</p><p class="story-paragraph">南相当有自知之明，她知道自己接收和传达爱意的方式都有问题，在恋爱里遇到的矛盾解决得不够好，导致几段感情都无疾而终。有躺上床说过情话的这种人存在，南还是无法把真心实意都交付给对方。</p><p class="story-paragraph">幸而这些插曲也没妨碍她把大学生活过好。高中毕业那年，她的考试成绩好得随便给哪所名牌大学寄过去都能被录取。南最后还是把大学的选址定在了关西，那是离家不远的地方，以便能经常回去探望父亲。可南学的是法律专业，忙得不亦乐乎，没能做到预期设想的那样，只有长假才得闲。</p><p class="story-paragraph">她从小到大对自己要求严惯了，就算人家再怎么懒散地呆在寝室打游戏，或者成天只晓得往心斋桥那边跑，南也雷打不动地按定好的作息来，奖学金就这样全给她一个人拿光。</p><p class="story-paragraph">玩乐也没落下，无论是哪次和朋友去酒吧消遣，南都能赢到最多的搭讪。</p><p class="story-paragraph">她不缺钱用，没有要乱花的地方。自己就能赚到外快先不说，父亲每个月还给她一笔一笔地汇款，金额的数量高到令人咂舌。“爸爸，”南在银行查了一下自己那几张卡的余额，处事一向有条不紊的她也惊得没话说：“我用不着买房…”男人在电话那头乐呵呵地笑了几声，对此没有给出明确的解释。南的抗议他也不管，依然照做不误，坚持给她弄了个金库出来，逼得女儿束手就范。</p><p class="story-paragraph">所以，南不敢让同龄人知晓自己持有的资产总额，要是不小心披露出了数字，她会被别人怀疑抢了银行。爸爸是物流公司的高管之一，南知道父亲的产业盈利丰厚，却总觉得没夸张到这个地步。</p><p class="story-paragraph dialogue">“咣当”。</p><p class="story-paragraph">什么东西砸到地上，发出的噪音把南吓了一跳，她往楼下跑，是书房那边闹出来的动静。</p><p class="story-paragraph">好像是父亲弄的，碎了一地的白瓷片零散地躺在木地板上。平时男人练书道时作镇纸用的兔子样工艺品消失了，想必四分五裂的就是它。他喘着粗气，很恼火的样子。南极少看到父亲被惹怒。怕爸爸踩到碎片受伤，她拿了扫帚和撮箕去收拾残局。“爸爸，”南有点担心：“你没事吧？”“没事，”父亲按着太阳穴回复她：“工作上出了点小差池。”男人也有更年期的，南想着，她凑过去拥抱了爸爸。提供的线索太少。不知道这是骤变发生前的预警，南把他情绪的阴晴不定归咎于公务的繁忙。</p><p class="story-paragraph">大学最后一个假期结束，她拉着箱子回学校，走之前和父亲在庭院里作了约定。约好毕业那天，他们会在校园里相遇，爸爸要亲自给她戴上学士帽。</p><p class="story-paragraph">大阪比故乡更早地迎来夏天，五月里所有事项都到了收尾的环节。</p><p class="story-paragraph">南做好了论文答辩，实习期的优秀表现也基本敲定了她的工作合同。</p><p class="story-paragraph">钟叔叔给她打了个电话。</p><p class="story-paragraph">父亲的这位法律顾问给南提供了很多学习上的建议。她接起来，想好好地谢谢叔叔，比如说…回家一起吃个饭什么的。</p><p class="story-paragraph">这顿饭永远没得到兑现。“小南，”南等来的不是记忆里的那个父亲：“你爸爸出事了。”</p><p class="story-paragraph dialogue">“你不打算和我说你做了什么吗？”她眼睛通红，抓住的那张纸已经烂得不成样子。</p><p class="story-paragraph">南把从钟叔叔那里拿到的文件看了又看，甚至能一字不差地背出来，却怎么都不能把被告的名字和这个男人联系在一起。</p><p class="story-paragraph dialogue">“爸爸，告诉我这不是你做的。”她摇头，连到另一头的话筒要握不稳。</p><p class="story-paragraph">她的父亲隔着审讯室的玻璃，安静地坐在里面。</p><p class="story-paragraph">一句否认的话都没有。</p><p class="story-paragraph dialogue">“你怎么能…”</p><p class="story-paragraph">对别人痛下杀手…</p><p class="story-paragraph dialogue">“回答我！”南几乎要死去了。</p><p class="story-paragraph">是梦吗？</p><p class="story-paragraph">她的爸爸怎么会走到这种路上去？</p><p class="story-paragraph dialogue">“你都做了什么，”眼泪让她看不清罪名：“你都做了什么啊！”</p><p class="story-paragraph dialogue">“我的资产会被彻查，”爸爸只是这样回答她：“不过大部分已经转到你的名下了。”</p><p class="story-paragraph">所以…早早地准备好了。</p><p class="story-paragraph">就连这一步都算到了，为何会…</p><p class="story-paragraph">父亲的目光陌生得要命。</p><p class="story-paragraph dialogue">“我太想你妈妈了。”</p><p class="story-paragraph">这些话把南的梦敲得稀里哗啦，落了一地。</p><p class="story-paragraph dialogue">“要是妈妈知道了，”南的胸膛剧烈地起伏，句子断断续续地从她嘴里溢出来：“她知道…你变成这个样子…”</p><p class="story-paragraph">该有多伤心。</p><p class="story-paragraph dialogue">“我很快就会过去陪她。”男人向女儿道歉，他的手掌印在玻璃上，用了很大的力气，肉红色的纹理都压成了惨白色。</p><p class="story-paragraph">但南没再像小时候那样贴手心上去。“对不起，要让你独自承担这些。”</p><p class="story-paragraph">爸爸…</p><p class="story-paragraph">爸爸…</p><p class="story-paragraph">可不可以别走，可不可以留下来…</p><p class="story-paragraph">如果你走了，我真的就要一个人了。</p><p class="story-paragraph">可是，南知道不行，她学了四年的法律，她清楚得不得了。等着父亲的是最严厉的处罚。</p><p class="story-paragraph">吸毒、贩毒、洗钱、杀人。</p><p class="story-paragraph">他用消音手枪击毙了目击到交易现场的一对年轻夫妇。</p><p class="story-paragraph">为什么会这么残忍？</p><p class="story-paragraph">毒品把那个忍下丧妻之痛的男人毁得片甲不留。</p><p class="story-paragraph">南哭泣的力度重到快要窒息，灵魂的悲鸣简直让她失聪。</p><p class="story-paragraph dialogue">“你要照顾好自己，”爸爸在对她说最后的话：“以后也要找个对你好的人，不要受委屈。”</p><p class="story-paragraph dialogue">“小南，再见了。”狱警要把她爸爸带走了，她怔怔地流泪，不知道以何种说辞向父亲告别。</p><p class="story-paragraph dialogue">“再见。”好像只能说这句话了。</p><p class="story-paragraph dialogue">“爸爸，”南站起来，她拼命地想记住父亲的样子，但是男人已经转过身去了。</p><p class="story-paragraph dialogue">“再见。”</p></div>

        <h2 id="heading-chapter-14">边缘</h2>

      <div class="chapter-copy"><aside class="author-note"><span>Notes</span><p>(See the end of the chapter for notes.)</p></aside><p class="story-paragraph">南想过自杀，活着再没什么意义了，如今只剩她孤零零一人。</p><p class="story-paragraph">到这个地步了，南觉得她和死人也没什么区别。</p><p class="story-paragraph">对爸爸的话，她竟然有点心驰神往。</p><p class="story-paragraph dialogue">——毒品能让她见到魂牵梦萦的人吗？</p><p class="story-paragraph">回过神来的时候，南狠狠甩了自己一个耳光。</p><p class="story-paragraph">某个晚上她又喝醉了，靠酒精自我麻痹成了她的习惯。</p><p class="story-paragraph">南撑着身子挪到洗手台，拿凉水泼了一把脸。</p><p class="story-paragraph">水珠把她的头发弄乱了，南想去照镜子，顺便把它们拨回原位。</p><p class="story-paragraph">她勉力睁着眼睛，突然像是被雷电击中那样抻直了背。</p><p class="story-paragraph">南发了疯一般地凑到前面去。</p><p class="story-paragraph">镜子里倒映出的…</p><p class="story-paragraph">她的眼泪哗啦啦地流个不停。</p><p class="story-paragraph">南用手指去摸像是被锁在另一个世界里的那张面容。</p><p class="story-paragraph">爸爸…妈妈…</p><p class="story-paragraph">我好想你们…</p><p class="story-paragraph">如果父母还在南身上留下了什么难以磨灭的印记…</p><p class="story-paragraph">那就是她的这张脸。</p><p class="story-paragraph">南一直不信命。</p><p class="story-paragraph">要是命运真的对人仁慈，为何上天将她生命里一切美好的事物都剥得分崩离析？</p><p class="story-paragraph">她还不能就这样死掉，还不知道死亡以后会遇到什么东西。</p><p class="story-paragraph">是真的会团聚，还是灵魂在熄灭的那一刻就化作了袅袅烟尘散得无影无踪？</p><p class="story-paragraph">万一再也不能和父母相遇…</p><p class="story-paragraph">她就要永远地把他们忘记了。不能就这样放手了。</p><p class="story-paragraph dialogue">“创伤后应激障碍，”院长把结果摆在南的面前：“每周会有心理医生按时来给她治疗，但你要想把她接走还需要再等一等，她没办法去到一个新的环境。”</p><p class="story-paragraph">要是能补偿她。</p><p class="story-paragraph">要是能救下她支离破碎的童年，不让她重蹈自己的覆辙…</p><p class="story-paragraph">孩子。</p><p class="story-paragraph">南把那个叫凑崎纱夏的女孩视作救命稻草，死死地揪住了她。</p><p class="story-paragraph">这个杂乱无章的烂摊子，她本可以请钟叔叔帮忙。</p><p class="story-paragraph">南否决了。</p><p class="story-paragraph">法院那边还需要他作辩护人，将纱夏收为养女的手续也是钟叔叔全权负责的，到了新去处说不定还得动用钟叔叔的关系，不能太麻烦他了。</p><p class="story-paragraph">南打起十二分的精神，趁这个时候按父亲的遗嘱着手执掌起整个家。</p><p class="story-paragraph dialogue">——只有她一个人的家。</p><p class="story-paragraph">她学的法，那些难懂的名词不需要找人为她解释。</p><p class="story-paragraph">但南还是没能一次性处理完，她总因心绞痛而不得不叫停进度。</p><p class="story-paragraph">保姆辞退了，南找搬家公司来打包家具，当总工站在她面前，问她要把这些大大小小的包裹拉到哪去时，南只甩了个词。</p><p class="story-paragraph dialogue">“回收站。”</p><p class="story-paragraph">她牵过纱夏的时候，老宅已经卖掉，相当于以物换物地得来了东京都新宿区的一间复式楼。</p><p class="story-paragraph">南没哭，她的眼泪好像会在今后所有的日子里缺席。</p><p class="story-paragraph dialogue">“小南，好好保重，这么远一口气是开不过去的，路上要歇一下脚，”钟叔叔在南为那个小女孩系上安全带以后为她许下了承诺：“如果有什么我能帮得上忙的地方，尽管开口。”</p><p class="story-paragraph">南随身携带的行李只有常穿的衣服，除此之外，她就在钱包夹里放了妈妈的相片。</p><p class="story-paragraph">那是父亲锁在箱子里的宝物。</p><p class="story-paragraph">南在整理的时候，以为里面装着的会是什么重要的文件，她摸出爸爸留下来的钥匙，无预兆地看到十几年前就离开的女人。印在照片纸上的眉眼依然如初，一点褪色的迹象都看不出来。</p><p class="story-paragraph">妈妈。</p><p class="story-paragraph">她喃喃自语。</p><p class="story-paragraph">我会成为一个好妈妈的。</p><p class="story-paragraph dialogue">“谢谢。”南回应着男人的善举。</p><p class="story-paragraph dialogue">“钟叔叔，”她把车窗摇上来，和父亲的朋友挥手：“以后有机会回来，我再请您吃饭。”</p><p class="story-paragraph">是假的，要对钟叔叔食言了。</p><p class="story-paragraph">南踩下油门。</p><p class="story-paragraph">她这次要告别的人，实在是太多了。</p><p class="story-paragraph">还会有再度重逢的那一天吗？</p><p class="story-paragraph">一定要让小孩痊愈，南没有留任何退路，不打算考虑失败。</p><p class="story-paragraph">东京已交付的房子是靠近繁华商圈的新宿区，这是她破天荒地推翻自己喜好所造成的结果。</p><p class="story-paragraph">南也好久没这么近地体会到人间烟火的滋味了。</p><p class="story-paragraph">住在热闹的地方，等女儿好起来…</p><p class="story-paragraph">就可以多带她出去玩。</p><p class="story-paragraph">所以南没马上就去找工作，她需要弄清楚新生活的节奏。</p><p class="story-paragraph">公寓楼一共有几层，室内的装潢摆设是什么样的，逃生出口在哪，怎么划分她和女孩的房间…</p><p class="story-paragraph">便利店的位置要摸清楚，有哪些一到夜间就会变得偏僻昏暗的小径她也记好了。</p><p class="story-paragraph">南为女儿的心理咨询找好了附近医院的大夫。</p><p class="story-paragraph">她没把父亲的车留下来，开到目的地以后就卖了，换了一辆新的轿车作代步工具。</p><p class="story-paragraph">车牌一开始就是东京都内的。</p><p class="story-paragraph">知道了小女孩的口味，她爱吃什么菜。</p><p class="story-paragraph">为了陪女儿聊天，也知道她爱看什么书。</p><p class="story-paragraph">纱夏问出口第一句话她还记得。“你是好人吗？”</p><p class="story-paragraph dialogue">——我不是，我是坏人的女儿。</p><p class="story-paragraph">南没说出来。</p><p class="story-paragraph">她只能耐心地等待女孩的病情好转。</p><p class="story-paragraph">而这不是件容易的事情。</p><p class="story-paragraph">警觉性增高。</p><p class="story-paragraph">晚上睡觉的时候纱夏使劲地往自己怀里钻，打雷天她发抖得最厉害，南要伸手去捂女儿的耳朵。</p><p class="story-paragraph">小小的身体出了层薄汗，是被吓出来的。</p><p class="story-paragraph">回避和麻木。</p><p class="story-paragraph">十岁已经到了能辩是非的年纪了，纱夏的记忆却因沾了血而破碎不堪。</p><p class="story-paragraph">南不敢提，她小心翼翼地绕过了那两个女孩再也不愿碰的名字。</p><p class="story-paragraph">除非纱夏主动说，南不会让她去回忆有关亲生父母的一切。</p><p class="story-paragraph">创伤性再体验症状的反复出现。</p><p class="story-paragraph">纱夏好像常陷入梦魇，看眼睛就能看出来，她又被恐怖的场景攥住了。</p><p class="story-paragraph">会不会看到血从父母身体里涌出来？</p><p class="story-paragraph">南有种错觉，好像女孩的瞳孔变成了鲜红色。</p><p class="story-paragraph">不怕。</p><p class="story-paragraph">她对着纱夏不厌其烦地强调自己的存在。</p><p class="story-paragraph">我就在你身边，你不会再遇到这种事情了。</p><p class="story-paragraph">黏人，而且是一天比一天更黏她。</p><p class="story-paragraph">才跟着自己到了新家的纱夏在刚开始的两周还怕生，一过了那个阶段就开始依赖她。</p><p class="story-paragraph">南觉得纱夏是她长出来的小尾巴。</p><p class="story-paragraph">除开惊恐发作，女儿在大部分时间里都很乖。</p><p class="story-paragraph">她防御机制的刺极快地为南收了起来。曾经应该是在一个很幸福家庭里长大的吧。</p><p class="story-paragraph">女儿越是这样懂事，南对毒品的憎恶情绪就越发的高涨。</p><p class="story-paragraph">她甚至恨起了自己的父亲，恨他居然会对那种东西投降。</p><p class="story-paragraph">她好想揪住爸爸的领子去问。</p><p class="story-paragraph">也失去了妈妈…</p><p class="story-paragraph">你怎么能将受过的痛苦原原本本地复刻出来，再移植到另一个无辜人的身上。</p><p class="story-paragraph">不过噩梦到此为止。</p><p class="story-paragraph">没事了…</p><p class="story-paragraph">她拥抱纱夏，终于感受到女儿以同样力度揽住她背部的手臂。</p><p class="story-paragraph">没事了…</p><p class="story-paragraph">南是幸运的，至少还得了这弥补过失的机会，又遇见了这么乖巧的配合者。</p><p class="story-paragraph">好像是经历了一场灭世的灾难，成了劫后余生的幸存者。</p><p class="story-paragraph">在这辈子走到尽头之前，南终于也有了一个永久牵挂的生命要去守护。</p><p class="story-paragraph">没有人比南要爱纱夏。</p><p class="story-paragraph">也没有人比她更加希望纱夏永远幸福。</p><p class="story-paragraph">南甚至比纱夏本人还要更期待那天的到来。</p><p class="story-paragraph">可种种秘密的催化效用比想象中的还要强，难言的情愫顺着她和纱夏密不可分的相伴相依越爬越远。</p><p class="story-paragraph">爱因此成为陡生的变故。</p><p class="story-paragraph">年深月久的安定感让南的嗅觉失灵了，她嗅不到分离的气味。</p><p class="story-paragraph">曾几何时，那是她最为熟悉的一种味道。</p><p class="story-paragraph">纱夏一天天长大，她那颗愚蠢而又软弱的心萌生了某种恐惧的情绪。</p><p class="story-paragraph">女儿马上要飞走了。</p><p class="story-paragraph">南没能忍住。</p><p class="story-paragraph">她只奉行不置一词的沉默，在恍惚中颤巍巍地伸出了手，折断了纱夏的翅膀。当南再次睁开眼时，她和女儿已经走到了峭壁边缘。</p><p class="story-paragraph">南短暂地惊醒了，她思考过要不要逃。</p><p class="story-paragraph">可就连她也慢慢分不清了。</p><p class="story-paragraph">分不清纱夏究竟是在求饶，还是在邀请。</p><p class="story-paragraph">女儿甜腻的嗓音和蛊人的桃花眼在情事里运用得越来越熟练。</p><p class="story-paragraph">是纱夏来诱惑她的。</p><p class="story-paragraph">小狐狸那沾满露水、湿得不成样子的花朵去蹭南的手指，翘起来的乳尖还要主动送给她吃。</p><p class="story-paragraph">妈妈。</p><p class="story-paragraph">这个称呼让南失控。</p><p class="story-paragraph">她不知道纱夏是怎么把天真和色情这两种矛盾的差极连在一起。</p><p class="story-paragraph">是与生俱来的天赋？</p><p class="story-paragraph">南压根拒绝不了女儿。</p><p class="story-paragraph">经不住她的软磨硬泡，她也把自己给纱夏了。</p><p class="story-paragraph">碰上过很厉害的床伴，南是食髓知味的凡人，她早就知道性有多美妙。</p><p class="story-paragraph">可是纱夏太不按常理出牌了。</p><p class="story-paragraph">那种故意的技巧看起来了无章法，居然比以前遇到的一切花招都管用。</p><p class="story-paragraph">南抵抗不了，她为女孩心动的次数已经多得数不清。</p><p class="story-paragraph">纱夏喜欢给她口。</p><p class="story-paragraph">女儿的鼻子又高，经常把她拱得神志不清。</p><p class="story-paragraph">边舔边咬的，就像小狗那样，叼着她的小核用牙齿磨。</p><p class="story-paragraph">太过分…</p><p class="story-paragraph">南舒服得把纱夏的头发都扯断几根。</p><p class="story-paragraph">不会让她休息，女儿真是要极尽所能地折腾她。</p><p class="story-paragraph">年轻人好像对身体能承受的刺激没有一个清醒的认知，纱夏把她弄到顶峰之后还不停下。“纱夏…不要…”南要往后躲，可女儿在退路那拦住了她：“不要了…”</p><p class="story-paragraph">不管甬道有没有开始收缩，纱夏还要坚持不懈地往里进。</p><p class="story-paragraph">南绷住了脚背，一波一波涌起的情潮将她淹在蜜罐子里面。</p><p class="story-paragraph">她被女儿玩喷了好多次。</p><p class="story-paragraph">每次都会把纱夏弄脏，南看到那点亮晶晶的水渍沾在她的脸蛋上。</p><p class="story-paragraph">她想给女儿擦掉那点色情的印记，可纱夏一点都不在乎。</p><p class="story-paragraph dialogue">“妈妈好漂亮，”女儿黏糊糊地亲上来，手指又不知好歹地插进了她的身体里：“我还想要…”</p><p class="story-paragraph">从女儿这里听到了用来夸情人的话，南羞得要晕过去了。</p><p class="story-paragraph dialogue">“油嘴滑舌。”她用手指刮蹭着纱夏的鼻梁。</p><p class="story-paragraph">结果女儿笑眯眯地到她耳朵旁边补了一句话。</p><p class="story-paragraph dialogue">“有更好的说法，”没有白上学，纱夏吻在南的下巴：“妈妈可以夸我舌灿生花。”</p><p class="story-paragraph">纱夏不管南是不是才潮吹过，再次尝起了她的味道。</p><p class="story-paragraph">恶劣的行径没完没了。</p><p class="story-paragraph">女儿怎么这么喜欢亲她的…</p><p class="story-paragraph dialogue">“稍微…”南被快感堵得无端地断句：“克制一下…”</p><p class="story-paragraph">纱夏埋在她腿里摇头，鼻翼掀得她脆弱的花瓣不停翕动。</p><p class="story-paragraph">南要虚脱了。</p><p class="story-paragraph">她在想自己有哪里得罪了女儿。</p><p class="story-paragraph dialogue">“你是不是…背着我偷吃…”南嗓子都哑了，可抱怨就这样戛然而止。</p><p class="story-paragraph">两片阴唇都被女儿含住。</p><p class="story-paragraph">纱夏的舌头压下来，有点微糙的小颗粒从上滑到下。</p><p class="story-paragraph">才高潮的敏感身体又被牵到了极点。</p><p class="story-paragraph">纱夏乖乖地往上窜，将她揽住了。</p><p class="story-paragraph dialogue">“我没有。”女儿在回答自己刚刚的那个问题。南埋在纱夏的胸前，她没力气了，再不想讲话。</p><p class="story-paragraph dialogue">“我只喜欢你。”年下热情得要了她的命。</p><p class="story-paragraph">每次都搞成这样，南有点紧张。</p><p class="story-paragraph">她要做一下心理准备。</p><p class="story-paragraph">南捏捏纱夏的耳垂：“你要体谅我。”</p><p class="story-paragraph dialogue">“怎么体谅？”女儿不知道她在讲什么。</p><p class="story-paragraph">纱夏的眼睛圆溜溜的，她认真地看着她。</p><p class="story-paragraph">南想说我身体没你的好，经不起你这么弄。</p><p class="story-paragraph">算了。</p><p class="story-paragraph">南闭上眼睛。</p><p class="story-paragraph">她没有拒绝纱夏的吻。</p><p class="story-paragraph">南情不自禁地、热烈地回应着女儿。</p><p class="story-paragraph">没阻止如此的爱继续生长，她也不想阻止。</p><p class="story-paragraph">爱难道是错的吗？</p><p class="story-paragraph">南怕那个藏起来的真相被揭开。</p><p class="story-paragraph">越是靠近纱夏，她就越怕。</p><p class="story-paragraph">南总做噩梦，梦里的纱夏是那天晚上的小人鱼。</p><p class="story-paragraph">是将她搂在怀里的，明明是那样死死地搂住了她…</p><p class="story-paragraph">南却也怎么阻止不了女儿化成泡沫消失。</p><p class="story-paragraph dialogue">——她为他离开了亲人。</p><p class="story-paragraph">纱夏何尝又不是以另一种理由为她离开了亲生父母？</p><p class="story-paragraph">从上天那里偷来的日子，南夹在缝隙里苟延残喘。</p><p class="story-paragraph">纱夏一点都不知道。</p><p class="story-paragraph">她以为自己闪躲的理由只是两人间的年龄和关系。如果真是那样就好了。</p><p class="story-paragraph">如果她们只是一对普通的情侣，没背负这样残忍的过去…</p><p class="story-paragraph">年龄又怎会是问题？</p><p class="story-paragraph">她好不容易才碰到这么爱的一个人。</p><p class="story-paragraph">南捂着女儿的嘴巴。</p><p class="story-paragraph">她先一步补足了纱夏要说的句子。</p><p class="story-paragraph dialogue">——说不定我会死在你前面。</p><p class="story-paragraph">傻瓜。</p><p class="story-paragraph">还有…</p><p class="story-paragraph dialogue">“我爱你。”</p><p class="story-paragraph">傻瓜。</p><p class="story-paragraph">她的眼泪逃出来了。</p><p class="story-paragraph">南无奈地推演了一次如此结局。</p><p class="story-paragraph">要是纱夏的混帐话在某天成真，她想自己一定会毫不犹豫地追着女儿去的。</p><p class="story-paragraph">不知道纱夏从哪里变出了这么多坚定的念头，南劝也劝不动了。</p><p class="story-paragraph">爸爸，我偿清了你的罪吗？</p><p class="story-paragraph">这个问句被抛在了虚无的黑洞上空，没了回音。</p><p class="story-paragraph">她的父亲已经离开很久了。</p><p class="story-paragraph">如果…</p><p class="story-paragraph">纱夏也觉得我做得好的话，是不是代表我有资格了？</p><p class="story-paragraph">南抓着那颗绿松石。</p><p class="story-paragraph">她心爱的人是多么有勇气啊…</p><p class="story-paragraph">纱夏等了她那么多次，她也是该等她回来的。</p><p class="story-paragraph">阻止流通伯利恒的主犯外逃，是南作出的最后一个决定。她要用这个举动来回报纱夏。</p><p class="story-paragraph">可惩罚果然还是来了。</p><p class="story-paragraph">虽然迟，但那它终归降临了。</p><p class="story-paragraph">神木说得对，是她咎由自取。</p><p class="story-paragraph">南从未赢过那点怯弱，她从不寄信赖于那些看似宽容的伪善。</p><p class="story-paragraph">当纱夏知道幕后凶手就是她父亲的时候，也会原谅她吗？</p><p class="story-paragraph">她不相信。</p><p class="story-paragraph">然而很快就转到了今天。</p><p class="story-paragraph">南此刻已别无选择。</p><p class="story-paragraph">录音器开着，伯利恒要打到身体里来了。</p><p class="story-paragraph">怎么才能让纱夏知道，对她的爱不是谎局？</p><p class="story-paragraph">一切的起点是她。</p><p class="story-paragraph">如果没爱上纱夏就好了。</p><p class="story-paragraph">你曾经有中过箭吗？</p><p class="story-paragraph">它能从远处将你击中，贯穿你的血肉。</p><p class="story-paragraph">那是一种远射兵器，接近七十厘米长的利刃。</p><p class="story-paragraph">南就这样，放任这支箭羽蚕食她的生命。</p><p class="story-paragraph">她从女儿那里拿到了缓解疼痛的麻醉毒药，抹在伤口周围。</p><p class="story-paragraph">同纱夏相爱的日子太幸福。</p><p class="story-paragraph">南慢慢地忘记了…</p><p class="story-paragraph">就好像，她从出生那天就带了这支箭来到人间。</p><p class="story-paragraph">她和它共生十来年，一同守着无言的秘密。</p><p class="story-paragraph">而现在它被连根拔起。</p><p class="story-paragraph">凶器已成为了止血的工具，如今又为她带来了离心的疼痛。她不用再担心，哪一天会被无预兆地揭穿谎言。</p><p class="story-paragraph">也不用再插着箭活下去了。</p><p class="story-paragraph">可为什么，那份疼痛又从凝固的变成了流动的。</p><p class="story-paragraph">针管扎进静脉，南尝到了很浓烈的金属味道。</p><p class="story-paragraph">眼前的一切都开始扭曲，她好像在往下掉，周身的景象拉出一个又一个变化的漩涡。</p><p class="story-paragraph">光怪陆离。</p><p class="story-paragraph">有一些圆圈飘在天上。</p><p class="story-paragraph">这是她一直在告别的人生。</p><p class="story-paragraph">南与所有她深深想念着的人再见了。</p><p class="story-paragraph">伯利恒让她看到了她的星星。</p><p class="story-paragraph">和所有人都不一样的那个人也站在里面。</p><p class="story-paragraph">凑崎纱夏…</p><p class="story-paragraph">她的养女、她的爱人。</p><p class="story-paragraph">最后，她们落在同一个空间里。</p><p class="story-paragraph">女孩走到她跟前。</p><p class="story-paragraph dialogue">“妈妈，”纱夏在对自己笑，又小声地问她：“等我很久了吗？”</p><p class="story-paragraph">南鼻子好酸，她险些哭了，可最后也只是摇摇头。</p><p class="story-paragraph">她的口型一目了然。</p><p class="story-paragraph">没有。</p><p class="story-paragraph">你果然就在我身边，纱夏。</p><p class="story-paragraph">所以，你现在是来救我的，对不对？</p><p class="story-paragraph">她好像没穿衣服。</p><p class="story-paragraph">南在女儿的爱抚下高潮了一次又一次，她觉得自己要融化了。</p><p class="story-paragraph">这回，她一点也没觉得累。纱夏把她的指尖拢住。</p><p class="story-paragraph">南发现了一件很有意思的事。</p><p class="story-paragraph">她的眼前本来出现了好多飞散的泡沫，但当纱夏触碰到自己的时候，那些泡沫就又消失不见了。</p><p class="story-paragraph">原来…</p><p class="story-paragraph">南终于恍悟。</p><p class="story-paragraph">原来她才是人鱼。</p><p class="story-paragraph">得不到纱夏的爱，在天亮的时候她就会死去。</p><p class="story-paragraph">南捧住纱夏的脸。</p><p class="story-paragraph">如果…</p><p class="story-paragraph">时间就可以停驻，留住下一个要走的人。</p><p class="story-paragraph">南希望…</p><p class="story-paragraph">她不要再和纱夏告别了。</p><aside class="author-note"><span>Notes</span><p>《边缘》名井南个人番外</p></aside></div>
