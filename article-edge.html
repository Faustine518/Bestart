      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">不知道身处哪个半球，也不知道现下到了什么季节。南从没来过这里，她好像坐在空旷河谷附近的草地上，有溪水潺潺地从她身边绕了个弯走了。三个人都在，南被围在中间，她抱着膝盖，抬头专心地凝望夜空里那颗最明亮的星星。</p><p class="story-paragraph">满盈的银月。</p><p class="story-paragraph">光华选了一条看不见的路径，悉数流向她的眼底。</p><p class="story-paragraph">南似乎很放松，她难得遇上这么安宁的休憩时光。</p><p class="story-paragraph">不过，除了她以外，其他人看起来都忧心忡忡的。</p><p class="story-paragraph">父母好像在担心自家女儿的处境。</p><p class="story-paragraph dialogue">“小南，”男人先开口了：“最近过得怎样？”</p><p class="story-paragraph">很久没有人叫她“小南”了，这句问候将南的思绪拉了回来。</p><p class="story-paragraph dialogue">“爸爸…”她没有回答，只是看一眼父亲，目光转瞬又往下落。男人厚实的手掌上沾了血点，猩红色的纹路汇在一起成了几条狰狞可怖的血蟒。以前用来遮羞的布料被大火烧得一干二净。所以南没有惊慌，也没有逃跑，她就坐在那里，任凭这些爬行动物缠上她的小腿。</p><p class="story-paragraph dialogue">“爸爸，”南的手指在拨弄柔软的草根：“当时为什么要吸毒呢？”这个问题她已经问过了，可是男人还是很耐心地回答了她。“为了看到你的妈妈。”父亲的视线越过南，停在女儿身侧的女人身上。</p><p class="story-paragraph">南想起她注射伯利恒以后随之出现的人。</p><p class="story-paragraph">那时的纱夏，眉眼里是藏也藏不住的爱意。</p><p class="story-paragraph">父亲看了南的表情，对情况明了了大半：“相信了？”“嗯。”她轻声回答，算是认同。</p><p class="story-paragraph dialogue">“是那个小女孩吗？”爸爸问她：“姓凑崎的女孩？”</p><p class="story-paragraph dialogue">“爸爸也知道吗？”南有些意外。</p><p class="story-paragraph">父亲是怎么弄清楚她的心的…</p><p class="story-paragraph dialogue">“当然知道。”男人拍拍她的脑袋。</p><p class="story-paragraph dialogue">“你做得很好，”父亲表扬她：“真的很坚强，很勇敢，像你妈妈一样。”</p><p class="story-paragraph dialogue">“别把功劳都揽在我身上，”妈妈不同意了：“小南这一点跟谁都不像，她比我们都厉害。”</p><p class="story-paragraph">可能是好难等来了一句认可，还是来自父母的。除了纱夏，这是她曾经最亲近的人了。长久以来的孤独，无处安放的胆怯终于有了地方发泄。</p><p class="story-paragraph">南一下泣不成声，她已经好久没有肆意任性的权利。</p><p class="story-paragraph">妈妈顺着衣服褶皱的纹理轻抚女儿的背，也不打断她的痛哭。“你看你，又把小南弄得伤心了。”女人有点愠色。“小南，看——”</p><p class="story-paragraph">父亲给她做鬼脸，存在于孩提时代的记忆，好像已经和这个男人不太搭了，但南还是很给面子地捧了个场，她尽力停止了抽泣。</p><p class="story-paragraph">爸爸妈妈轮流抱了她一下。</p><p class="story-paragraph dialogue">“爸爸，”南依然在哽咽，想问问父亲有没有什么办法可以摆脱这个困境，毕竟他是有经验的人：“你有没有什么办法…”</p><p class="story-paragraph">男人和南的母亲对视了一眼，都知道女儿想问怎么才能戒毒。</p><p class="story-paragraph">他的回答简明扼要：“只能努力忍忍。”</p><p class="story-paragraph dialogue">“但是真的好疼。”南逮着个机会撒娇，她红着眼睛，往身后的臂弯里躺，被母亲拢住了。</p><p class="story-paragraph dialogue">“是很疼。”父亲好像也觉得可惜：“所以爸爸也没撑过去。”“爸爸都撑不过去。”她丧气了，在盘算成功的几率到底有多大。</p><p class="story-paragraph">南扁了扁嘴，自领养纱夏以来，这种淘气的表情就再没在她的脸上出现过。</p><p class="story-paragraph dialogue">“你身边不是还有那个孩子吗？”妈妈环着她：“那个姓凑崎的女孩，叫什么来着？”</p><p class="story-paragraph dialogue">“纱夏。”这么几天，南好像总在说纱夏的名字。</p><p class="story-paragraph dialogue">“你很喜欢她，”爸爸言语间有点戏谑的意思：“我们小南现在是在和她谈恋爱吗？”</p><p class="story-paragraph dialogue">“爸爸…”被这样调侃，南害羞了，她弯起指节，轻轻锤了一下父亲的肩膀。</p><p class="story-paragraph dialogue">“小南不好意思了，”妈妈也被逗笑了：“你少说两句。”</p><p class="story-paragraph dialogue">“好，”父亲乐呵呵的：“如果身边有人陪着的话，就不要怕了。”</p><p class="story-paragraph dialogue">“我当时没陪着你吗？”南有点不高兴。</p><p class="story-paragraph">男人好像变得窘迫了些，不好意思说出他爱妻子胜过女儿，只好通过挠头来掩饰这种尴尬。</p><p class="story-paragraph dialogue">“我是说很爱的人，”父亲摸摸她的脸，看到南的表情更不好了，知道自己肯定得罪了女儿：“我当然爱你，但我对你的爱是建立在对你妈妈的爱之上的。”</p><p class="story-paragraph">还不是不够爱我。她暗自翻了个白眼给爸爸。</p><p class="story-paragraph dialogue">“你们都爱着对方…”父亲的话没说完，南就插嘴了。</p><p class="story-paragraph dialogue">“那是以前，我不知道她还会不会这么想。” 她说着话，叹了口气。</p><p class="story-paragraph dialogue">“怎么会？小南这么优秀。”妈妈的声音从身后传过来。</p><p class="story-paragraph">南不自信地摇摇头：“她生我气了。”</p><p class="story-paragraph">可能是太了解女儿了，他们都知道这是南确信某件事情以后常用的态度。</p><p class="story-paragraph dialogue">“你还没问她，怎么知道她是不是真的生你气了？”妈妈还想安慰女儿。</p><p class="story-paragraph dialogue">“她都不来看我了，”南的情绪颓唐：“我生病了，她也不见我。”</p><p class="story-paragraph">一时间大家都有些沉默。</p><p class="story-paragraph dialogue">“是她太过分了，”父亲作势撸起袖子：“我帮你教训她。”</p><p class="story-paragraph dialogue">“不，”南拦住了爸爸：“你别欺负人。”</p><p class="story-paragraph">望向如青春期男孩一样吃瘪的男人，他的妻子扑哧一声笑了出来。“小南不得了了，这么护短，”父亲声音闷闷的：“连爸爸都凶。”</p><p class="story-paragraph dialogue">“你忘记了吗？”南想起是爸爸犯下的罪行，心里堵得慌：“为什么会变成这样？”</p><p class="story-paragraph">她父亲很局促地坐着，手都不知道往哪里放了。</p><p class="story-paragraph">女人扫一眼张皇的丈夫：“你真是…”</p><p class="story-paragraph dialogue">“小南教出来的孩子，”妈妈帮忙把南的头发拨好，摸到了女儿的头上那一道触目惊心的口子，她心疼极了：“性格应该也像你，不会把一切都怪到你身上的。”</p><p class="story-paragraph dialogue">“我不知道，”南的眼睛里又蓄了泪水：“我真的不知道。”</p><p class="story-paragraph">可能是看女儿真的疲倦得不行。</p><p class="story-paragraph dialogue">“如果很辛苦的话，”妈妈指了给她最后的那条路：“就来找我们吧。”</p><p class="story-paragraph">妈妈…</p><p class="story-paragraph">南反握了她的手。</p><p class="story-paragraph">这个地方好像启动了什么开关，靠近边沿的景色开始缓慢地收束。</p><p class="story-paragraph">这好像也是一个好的方法。</p><p class="story-paragraph">她在动摇。</p><p class="story-paragraph">不用纠结纱夏怎么才能原谅她的问题，也不用再经历毒瘾发作时生不如死的折磨。</p><p class="story-paragraph dialogue">“妈妈。”她忍不住轻唤自己的母亲。</p><p class="story-paragraph">这个词脱口而出的那个瞬间，南记起了自己的身份。</p><p class="story-paragraph">几乎是同时，她的耳朵里听到了另外一声更为稚嫩的呼唤，也是“妈妈”。</p><p class="story-paragraph">南哑了嗓子，松开母亲的手。</p><p class="story-paragraph">她突然想不起自己是怎么来的这里，好像只有梦才会没头没尾的。</p><p class="story-paragraph dialogue">“妈妈，”女孩的声音好像是从天边传过来的：“你什么时候回家？”</p><p class="story-paragraph">刚刚还在怕的，怕自己回去也得不到纱夏的原谅。</p><p class="story-paragraph">一切担心的前提都源于她的贪婪。</p><p class="story-paragraph">如果不再盼望有资格享有这样动人的爱。最初，她选择成为女孩的妈妈…</p><p class="story-paragraph">也只是一心想让纱夏幸福而已。</p><p class="story-paragraph">父母都露出副了然的样子。</p><p class="story-paragraph dialogue">“要走了？”妈妈看着女儿坐起身子。</p><p class="story-paragraph dialogue">“嗯。”南拉出了一个笑容，她仔细地打量父母的脸，多少年了，这两人是她想梦都梦不见的。</p><p class="story-paragraph dialogue">“妈妈，”她好不容易碰上一次，又要急匆匆地往前赶了：“我现在也是妈妈了，再不回去的话…”</p><p class="story-paragraph">纱夏该等急了。</p><p class="story-paragraph dialogue">“不用和我们解释的，”妈妈亲昵地用额头碰了碰她的女儿：“去吧。”</p><p class="story-paragraph dialogue">“小南。”在醒来以前，她听到父亲最后说的一句话。</p><p class="story-paragraph dialogue">“你要知道，我和你妈妈都为你骄傲。”</p><p class="story-paragraph">南侧着脸，面容的轮廓有一半隐在了静谧的影子里。</p><p class="story-paragraph">她在看窗外盛开的早樱。</p><p class="story-paragraph">这间房在五楼，医院附近栽的几排树有长得稍高点的，所以不用刻意俯身就能见着那片连成线的花海岸。</p><p class="story-paragraph">指尖轻轻扒着窗沿，南感觉到初夏的风在这个世界的缝隙里肆意穿行。</p><p class="story-paragraph">呼吸好像也一点点融进了舒服的温度里去。</p><p class="story-paragraph">昨晚叫铃木护士给自己打了安定，效果还不错，不仅没有做噩梦，还见到了父母。</p><p class="story-paragraph">南起床时，发现枕巾被自己的眼泪弄湿了。</p><p class="story-paragraph">现在她坐在靠窗边的椅子上，在回忆昨天与纱夏的偶遇。</p><p class="story-paragraph">南有一点后悔…</p><p class="story-paragraph">应该看看她的。</p><p class="story-paragraph">女儿一句话都没答，她也不知道纱夏这些天到底过得如何。</p><p class="story-paragraph">以往对方是一受委屈就要可怜兮兮地往她怀里钻。像小狗一样粘人的女孩，习惯把头埋进她的颈窝，还要从喉咙里发出几声腻歪的气音，哼哼唧唧地要她哄。</p><p class="story-paragraph">这次把女儿惹得伤心的人成了自己，连哭鼻子了都不愿意和她拥抱。南目光平视前方，她发了会呆。</p><p class="story-paragraph">等到眼眶都有点发酸了，才滴溜溜地转转眼睛。——差点忘了件事。女人欠身按了呼叫铃，护士昨晚嘱咐她醒来就叫她。</p><p class="story-paragraph dialogue">“名井小姐，”铃木在一分钟之内就拉开了病房的门：“早上好。”</p><p class="story-paragraph dialogue">“您也是，”南礼貌地应答：“早上好。”</p><p class="story-paragraph dialogue">“身体没有不舒服吧？”铃木需要确认病人在使用镇静剂以后的健康状况。</p><p class="story-paragraph">医务人员还给她带了东西。</p><p class="story-paragraph">谷崎润一郎的细雪。</p><p class="story-paragraph dialogue">“还不错，”南从她手上接过那本小说，向她笑笑：“谢谢。”</p><p class="story-paragraph dialogue">“没事的，您要是有想看的书，以后我帮您找，”护士顺便提了一句：“早餐待会儿就有人送给您。”</p><p class="story-paragraph dialogue">“好的。”南没马上翻开，她准备去洗漱。</p><p class="story-paragraph">护士还没走，好像有什么要说的。</p><p class="story-paragraph dialogue">“怎么了？”南转过来，整个身子都面向铃木。</p><p class="story-paragraph dialogue">“您戴着的项链，”终于看到了它的全貌，护士用手在胸前比划了一下：“没弄好。”</p><p class="story-paragraph">南循声低头，眼睛睁大了。</p><p class="story-paragraph">她抬手去摸。</p><p class="story-paragraph">原来靠住后颈的环扣被衣服挡住了，所以她才一直没发现…</p><p class="story-paragraph">纱夏送给自己的礼物。</p><p class="story-paragraph">那条穿着女孩生辰石的项链…</p><p class="story-paragraph">不知何时又挂在了她的脖子上。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">纱夏在想，自己似乎活在了这个世界之外。</p><p class="story-paragraph">她身处南所在的病房，已经坐了很久。</p><p class="story-paragraph">在这个窗帘密闭的地方，一丝光都透不进来。好在眼睛早就适应了这份黑暗。</p><p class="story-paragraph">纱夏能看清楚妈妈。</p><p class="story-paragraph">女孩不敢弄出太大动静，她连呼吸都克制着，生怕扰了南的安宁。</p><p class="story-paragraph">她愿意变成一只猫头鹰，或者，一只小猫也可以，以一言概之，就是那种夜视能力很强的动物。</p><p class="story-paragraph">纱夏久久地凝视着南的睡颜，好像要在这种漫长的描摹里弥补自己的缺席。</p><p class="story-paragraph">不过才三个星期而已，妈妈真的瘦了很多。</p><p class="story-paragraph">肉眼可见的瘦了下去。</p><p class="story-paragraph">本来是匀称纤细的手臂，现在看了骇人。</p><p class="story-paragraph">医院的菜肯定不合南的口味。</p><p class="story-paragraph">等你回家，就给你做你最喜欢吃的…</p><p class="story-paragraph">纱夏小声地自言自语，在计划怎么把病人喂胖。她轻轻勾着南的小指，在和妈妈约定。</p><p class="story-paragraph">不能牵她的手，因为骨折的小夹板依然没有拆掉。</p><p class="story-paragraph">真的就像设想的那般…</p><p class="story-paragraph">当南在她触手可及的范围内，纵使是有再多埋怨，她一句也不想说了。</p><p class="story-paragraph">妈妈的身上好像有魔力。</p><p class="story-paragraph">牛顿发现的那个定律起了效果，纱夏觉得自己就是树上的那颗苹果，总要直直地坠向南。</p><p class="story-paragraph">这种引力是她无法抗拒的。</p><p class="story-paragraph">女孩畏畏缩缩地伸手，在长久的停顿里，还是抚上了妈妈的面庞。</p><p class="story-paragraph">像是对待脆弱的玻璃制品，纱夏怕太用力就会把南碰碎。</p><p class="story-paragraph">这世上竟真有…</p><p class="story-paragraph">怎么看也看不厌的、怎么吻也吻不腻的人存在。</p><p class="story-paragraph">她凑过去，睫羽像振翅的蝴蝶一样抖个不停。</p><p class="story-paragraph">少女柔软的双唇在南的侧脸上碰了一下。</p><p class="story-paragraph">纱夏在恍惚中产生了错觉。在这样酣畅淋漓的爱里面，她的心就快要从胸口飞出来了。</p><p class="story-paragraph">好像又提前成熟了一点点，女孩也不顾伤口还在流血，就擅自作下了决定。</p><p class="story-paragraph">论无辜…</p><p class="story-paragraph">一个爱上了母亲的人，能无辜到哪里去？</p><p class="story-paragraph">两人既然是共犯，她怎么可以不陪妈妈一起受罪？</p><p class="story-paragraph">纱夏是接近五点才走的，早班电车又在和煦的日光底下恢复运转了。</p><p class="story-paragraph">女孩饿了一晚上肚子，妈妈说的饭店都没开门，所以路过二十四小时营业便利店的时候，她买了三明治。</p><p class="story-paragraph">本来想打电话给板仓叔叔的，可是这个时间很尴尬，纱夏编辑了短信，大概意思是想知道庭审作证需要准备的东西，还顺便问了一嘴，问妈妈身边是不是没人照顾。</p><p class="story-paragraph">她一到家就栽在床上，睡醒起来已经错过了午饭。</p><p class="story-paragraph">纱夏去书房找南工作记事用的便利贴，其实作为学生的她于情于理都要备上更多这种东西…</p><p class="story-paragraph">不过上了大学以来，她假期在家的时候就没什么机会读书了。</p><p class="story-paragraph">纱夏天天和妈妈黏在一起，像涂了胶，怎么分也分不开。</p><p class="story-paragraph">两人好像在交换彼此的生活，说得更确切点，就是更用力地把本就融在一起的日子搅得越发紧了。</p><p class="story-paragraph">别说学习，连驾照这种不能不拿的东西，都是女孩在上学期间考回来的。</p><p class="story-paragraph">纱夏其实不甚在意，她担心的是南在自己身上花时间太多，但妈妈听了她这种忧虑的话总是摇头。</p><p class="story-paragraph">女人带着她往床上倒。</p><p class="story-paragraph dialogue">“你再说一遍，”妈妈的鼻尖抵住了她的耳朵，她身上的香味驳杂着热量：“你刚刚说什么？”</p><p class="story-paragraph dialogue">“我说，”南那只体温稍低一点的手伸进来揉她的胸乳，纱夏被捏得说话也断断续续的：“会…耽搁你的…”</p><p class="story-paragraph dialogue">“不耽搁。”南亲亲她的眉毛，又亲她的眼睛。</p><p class="story-paragraph">女孩被妈妈弄得面红耳赤。</p><p class="story-paragraph dialogue">“劳逸结合。”</p><p class="story-paragraph">她好像和南一起掉进了一个不见底的深渊。</p><p class="story-paragraph">直到现在，两人还在往下坠。等自己降到最末端，恐怕要落得个尘埃都不剩的下场。</p><p class="story-paragraph">她拉开抽屉，手机恰巧响了。</p><p class="story-paragraph dialogue">“纱夏，”板仓叔叔之前给她的电话没被接起，女孩当时正在睡觉，现在他又打了一个：“你和你同学明天下午有空吗？我想的是和你们见个面。”</p><p class="story-paragraph dialogue">“可以叫美沙单独去吗，我明天下午没时间。”女孩看到她要找的东西。</p><p class="story-paragraph">蓝色便签纸上还有妈妈娟秀的字迹，好像和南曾经接的案子有关，上面写的法律术语她看不太懂。</p><p class="story-paragraph">纱夏撕了这页下来，把它贴在桌上。</p><p class="story-paragraph dialogue">“那你什么时候可以…？”</p><p class="story-paragraph">女孩接着的话让他有点惊讶。</p><p class="story-paragraph dialogue">“我去问我妈妈。”纱夏的语气里听不出什么抗拒的意思。</p><p class="story-paragraph dialogue">“那好。”板仓后半句话没说。——你不介意就行。</p><p class="story-paragraph dialogue">“关于你问的事，”他顺便回答女孩：“你妈妈是让奈未回去了。”</p><p class="story-paragraph">果然…</p><p class="story-paragraph dialogue">“嗯，”纱夏应了：“这段时间麻烦叔叔和奈未阿姨了。”</p><p class="story-paragraph">女孩的态度完全转了弯，联想起昨天下午在病房门口见过她，板仓差不多猜到个大概。</p><p class="story-paragraph">她应该已经和南见了面。</p><p class="story-paragraph">纱夏没说话了。</p><p class="story-paragraph dialogue">“还有什么事吗？”板仓问她。</p><p class="story-paragraph dialogue">“没有了。”</p><p class="story-paragraph">女孩让叔叔先挂了电话。</p><p class="story-paragraph">接下来…</p><p class="story-paragraph">她拿了支笔，把要做的事一件件地往便利贴上写。</p><p class="story-paragraph">需要给一些无关紧要的行程安排结尾。</p><p class="story-paragraph">纱夏在家里找了一面没什么装饰物的空墙。写好的纸条像在她面前列队的士兵，等待女孩进行检阅。</p><p class="story-paragraph">做完一件…她就摘掉一个。</p><p class="story-paragraph">什么都有。</p><p class="story-paragraph">比如去超市买点东西填上冰箱里空缺的位置，纱夏特意查了一下刚手术没多久的病人吃什么可以好得更快。</p><p class="story-paragraph">比如要重新过一遍自己的论文，留给她的时间不多，只剩四天了。</p><p class="story-paragraph">比如拿上家里的备用钥匙，把妈妈的车从医院开回来。</p><p class="story-paragraph">比如叮嘱自己一日按时吃三餐的要求，这是南的嘱托。</p><p class="story-paragraph">还有类似拍毕业照、给家里打扫一遍卫生的这种琐碎小事。</p><p class="story-paragraph">她的视线一点点扫过去。</p><p class="story-paragraph">靠近最后的那张便利贴上写了个人名。</p><p class="story-paragraph dialogue">“服部教授”。</p><p class="story-paragraph">紧跟在这个名字后面的那个词是“留学”。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">裁判的日子定下了，板仓说是下个星期四的上午十点开庭。</p><p class="story-paragraph">南把手机放在一边充电，她闲来无事，《细雪》也要读到结尾了。</p><p class="story-paragraph">第一次看这本小说的时候还在读国中，她仅花了一周就将它翻完。</p><p class="story-paragraph">后劲不小，和书名一样，像白米似的雪花在读者的心里簌簌地落了很久。</p><p class="story-paragraph">恰逢冬日，南整个十二月都没缓过神来，清冽又哀伤的结局氛围着实让她被忧思俘获了。</p><p class="story-paragraph">她那年读书，《细雪》的封面好像还不是这样。</p><p class="story-paragraph">如今它的出版社换了，精装版也成了平装版的。</p><p class="story-paragraph">诚然，书没以前好翻，厚厚的壳子拿在手里也不舒服。</p><p class="story-paragraph">但南生病了，哪也去不了，她不愁没时间，甚至比小时候还要有耐心。</p><p class="story-paragraph">快读会糟蹋掉这本书的。</p><p class="story-paragraph">她很专心。一方面是本身就记得部分情节，看得认真，南着急去和曾经的记忆作对比，想知道自己有没有记岔的地方。</p><p class="story-paragraph">另一方面是季节也起到了辅助的作用，和缓的叙事笔调能安抚她这么久以来不太好的情绪。</p><p class="story-paragraph">快要吃晚饭了。</p><p class="story-paragraph">南停不下来，她读到这一句的时候想着读完就按铃，结果目光马上又跳到了下一行。</p><p class="story-paragraph">这么反复了几次，连南也忍不住笑自己。</p><p class="story-paragraph">她大概掂量了未读书页的厚度，打算一鼓作气看完。</p><p class="story-paragraph">在要结束的关头，南听见门被拉开了。</p><p class="story-paragraph">估计是她磨蹭太久，铃木给她送饭来了。</p><p class="story-paragraph dialogue">“稍等我一下，”她还没见来人就出声：“还有最后两段。”</p><p class="story-paragraph">对方也挺平和地听了南的请求，身体虚掩在墙体后，脚步没再挪过。</p><p class="story-paragraph dialogue">“谢谢您给我找来这本书，”她有些欣喜地合上封面，再次读完，她很满足：“我以前看…”</p><p class="story-paragraph dialogue">“谷崎润一郎先生的，”文学专业生透过妈妈手指的缝隙，窥到了小说的名字：“细雪。”</p><p class="story-paragraph">她轻描淡写地补了一句：“我也很喜欢这本。”</p><p class="story-paragraph dialogue">“你…”</p><p class="story-paragraph">如鲠在喉。</p><p class="story-paragraph">南怔怔地定住了，她看到纱夏走到自己面前。</p><p class="story-paragraph">女孩把晚餐提在手上。</p><p class="story-paragraph dialogue">“几天不见，”纱夏的声音是无起伏的平淡：“你功力退步了。”</p><p class="story-paragraph">南一时间光顾着惊喜，这种惊喜里面掺了很多庆幸，她喜得差点掉了眼泪。</p><p class="story-paragraph">为了不让女儿有负担，女人自发地将泪光的亮度调得暗了点。</p><p class="story-paragraph">纱夏还在站着。</p><p class="story-paragraph">她指指病床边的椅子，女儿很听话地坐下来。</p><p class="story-paragraph">南眨眨眼，她喜欢的人生得一副这么好的皮相。</p><p class="story-paragraph">女孩的鼻梁本就高挺，唇形也漂亮，今天还不知出自什么心态化了全妆。一靠近就能闻到…</p><p class="story-paragraph">纱夏好像喷了她最常用的那支香水。</p><p class="story-paragraph">可能是看到自己的视线毫不收敛地盯着她，纱夏俯身靠了过来。</p><p class="story-paragraph">她们两人间的距离缩短了不少。</p><p class="story-paragraph">南苍白的双颊因为少女的动作有了点血色。</p><p class="story-paragraph dialogue">“才答辩完，”纱夏解释了她大张旗鼓的原因，把视线所及范围内看起来最像是折叠桌的东西打开，支在了她的病床上：“用了你的口红和粉底。”</p><p class="story-paragraph">还能用她的东西…</p><p class="story-paragraph">是不是还没嫌她讨厌呢？</p><p class="story-paragraph dialogue">“答得怎么样？”南推测女儿应该很辛苦：“你到了多久了？”</p><p class="story-paragraph">纱夏没回答，只是当着她的面把餐盒打开。</p><p class="story-paragraph dialogue">“这是医院的饭吗？”她小心翼翼地看纱夏的眼色，稍微坐起来了一点。</p><p class="story-paragraph">里面装的都是她最喜欢吃的东西，米饭也被弄成糊状的，好嚼。</p><p class="story-paragraph">女儿一直没回答，南明显在紧张，她下意识地拉住了被角。</p><p class="story-paragraph dialogue">“答得很好，”纱夏撇下目光，没去看她：“十分钟以前到的，饭是从家里带来的。”</p><p class="story-paragraph dialogue">“谢谢。”她道谢的声音很小，自觉十分狼狈。纱夏没叫她一声妈妈。</p><p class="story-paragraph">南很委屈，但知道是她理亏，没再说。</p><p class="story-paragraph">女人伸了左手要去拿纱夏带来的餐具，对方递给她。</p><p class="story-paragraph">平时喝粥的时候还好，她只要用勺子。</p><p class="story-paragraph">不过，现在分得清清楚楚的小格里有好几种菜。</p><p class="story-paragraph">左手本来就不是南的惯用手，她还要来回地在筷子和勺子之间切换，好几次拿不稳餐具。</p><p class="story-paragraph">纱夏就在旁边看着，一点忙都不帮。</p><p class="story-paragraph">本来以为女儿来看她了就是好事，可是…</p><p class="story-paragraph">她表情冷漠得好像是个陌生人。女儿无视了自己的困境，半个身子靠在椅背上。</p><p class="story-paragraph">南眼里的泪水越攒越多，把眼前的一切都糊得看不清了。</p><p class="story-paragraph">出了重影，她夹着的蔬菜不小心又掉了进去。</p><p class="story-paragraph">汤汁溅到了病号服上。</p><p class="story-paragraph">南听见女儿叹了口气。</p><p class="story-paragraph dialogue">“我喂你。”纱夏不由分说地夺走了那两支竹筷。</p><p class="story-paragraph dialogue">“张嘴。”女孩亲自给她夹了东西送过来，南听话地吃了一口。</p><p class="story-paragraph dialogue">“多嚼几下，”纱夏低下了头，在扒弄下一个要喂给自己的食物：“好消化一点。”</p><p class="story-paragraph">南能察觉到女孩憋着火气。</p><p class="story-paragraph">说实话，她能理解纱夏的厌恶、能理解纱夏的疏远。</p><p class="story-paragraph">可是南不太懂，女儿为何这么生气呢？</p><p class="story-paragraph dialogue">“我知道。”南好像透过这样的时光看到了她们以前相处的日子，话里轻轻的自嘲被女儿听了去。</p><p class="story-paragraph dialogue">“你知道…”纱夏一下子变得很凶，好像她的尾巴刚刚被踩了一脚。</p><p class="story-paragraph">女孩两条好看的眉毛拧在一起：“你什么都不知道。”</p><p class="story-paragraph dialogue">“嗯，”她说得没错，南干脆答应了，垂着眼睛，一副逆来顺受的样子：“我什么都不知道。”</p><p class="story-paragraph dialogue">“你现在是在和我装可怜吗？”纱夏的情绪阴晴不定，一会儿好一会儿坏的。</p><p class="story-paragraph">没有…</p><p class="story-paragraph">南听得清清楚楚，这种尖刻的句子在她身上戳了个伤口。</p><p class="story-paragraph">但她要压着声线的颤抖，纱夏已经觉得她在装可怜了，再开口是哭腔的话，女孩会更加这么以为的。</p><p class="story-paragraph">悲戚的痛意好像要把南给淹没了，可她还是决定先和女儿道歉。</p><p class="story-paragraph dialogue">“对不起。”她轻轻摇头，躲开了女儿送到她嘴边的肉丸。</p><p class="story-paragraph">纱夏突兀地松开了筷子。</p><p class="story-paragraph dialogue">“啪嗒”一声落在空旷的病房里特别响，震得南耳膜疼。</p><p class="story-paragraph dialogue">“你在为什么道歉？”接吻的时候，纱夏睁着眼睛，南的牙齿闭不上，女孩粗暴地勾着了她的舌头。</p><p class="story-paragraph">南阖了眼帘，她不想去深究那双跳着怒气的琥珀色眸子主人此刻的心情。</p><p class="story-paragraph">泪水顺了她耷拉下去的眼角往外跑了。</p><p class="story-paragraph dialogue">“为这个道歉？”女孩松了她，南猜测自己嘴上也有她的口红。</p><p class="story-paragraph dialogue">“还是，”纱夏的五指从南的衣摆下面伸进来，把她的乳房抓在手里捏，一直捏到她脸红：“为这个道歉？”</p><p class="story-paragraph">女儿在强调她们间见不得人的关系。</p><p class="story-paragraph dialogue">“判事问我们，”一个字一个字几乎都是从牙缝里挤出来的：“要不说我们早做过爱了，让他自己想？”</p><p class="story-paragraph">南觉得女儿来，就是先给她吃了颗糖，然后毫不留情地扇了她一耳光。</p><p class="story-paragraph">她连反抗都不想了。</p><p class="story-paragraph">要是羞辱她能让纱夏爽快点…</p><p class="story-paragraph dialogue">“如果你觉得可以，”南没什么力气，她的妥协听上去很虚弱：“就说吧。”</p><p class="story-paragraph">话音刚落，纱夏的手一下就抽出来。</p><p class="story-paragraph">女儿好像很痛苦地捂着心口。</p><p class="story-paragraph">她哭得比自己还伤心。</p><p class="story-paragraph dialogue">“纱夏…”南被纱夏的动作吓到了。</p><p class="story-paragraph">她下一秒就被死死地抱住。</p><p class="story-paragraph">纱夏的怀抱这么温暖，暖得她眼泪就像化冰那样掉。</p><p class="story-paragraph">女孩用的力度很大，似乎是恨不得把自己嵌进她的骨肉里去。</p><p class="story-paragraph">纱夏一直在叫她。</p><p class="story-paragraph dialogue">“妈妈，妈妈，妈妈…”每句呼唤都灌注了再难一见的深情。</p><p class="story-paragraph dialogue">“你别这样…”女孩的头埋在她的身上，因为哭得很凶，声音也模模糊糊的：“别这样好不好…”</p><p class="story-paragraph">她开始也不明白，为何见到那个睡觉的妈妈她心疼，但眼前这个能吃能动的活人却能让她这么生气。</p><p class="story-paragraph">后来她发现了原因。</p><p class="story-paragraph">两人的角色就像对调了…妈妈越是卑微和消极，原来那个闪闪发光的律师好像就离她越远。</p><p class="story-paragraph">一想到她都决定背叛自己的亲生父母，南还是这种颓丧的样子。</p><p class="story-paragraph">怒气就一路通到了天灵盖。</p><p class="story-paragraph">可是…刚刚的口无遮拦，好像起到了反作用。</p><p class="story-paragraph">你应该打我啊，纱夏想，我说了这种混账话，你为什么也要答应？</p><p class="story-paragraph">怎么舍得？</p><p class="story-paragraph">坠落到这里就是底了吧？</p><p class="story-paragraph">到这里，就再不用面对至暗时刻了吧？</p><p class="story-paragraph">纱夏好怕原来的那个南再也不会出现了。</p><p class="story-paragraph">不管以什么身份出现，她其实只想和妈妈在一起。</p><p class="story-paragraph">虽然好不容易求得个能当恋人的机会…</p><p class="story-paragraph">可是如果放弃了它，就能回到原来的生活。</p><p class="story-paragraph">好像也不是不行。</p><p class="story-paragraph dialogue">“能当名井南的女儿。”纱夏做梦也没想到，妈妈的全名要被她用在这个时刻，可是她别无选择。</p><p class="story-paragraph">女孩打算把她未痊愈的伤口先拆掉，剪开自己的血肉，将妈妈包扎好。</p><p class="story-paragraph dialogue">“我很开心。”</p><p class="story-paragraph">南以为自己听错了。</p><p class="story-paragraph">反应过来以后，她几近窒息。</p><p class="story-paragraph">她好像等纱夏的这句原谅等了一个世纪，这下终于等到了，又觉得不真实。</p><p class="story-paragraph">纱夏的宽容和善良，是她算了这么久都没算到的、不在她计划里的唯一偏差。</p><p class="story-paragraph dialogue">“我从来都没有怪过你。”</p><p class="story-paragraph">原来赠予对方的爱，是真的能被收到…</p><p class="story-paragraph">南不知何以为报，她只好撑起伤痕累累的灵魂，用还没熄灭的热情把这个拥抱熔铸得更滚烫了一点。</p><p class="story-paragraph dialogue">“妈妈。”女孩想要她听得清清楚楚，于是又重复了一遍。纱夏音调里殽杂的血与泪把两人围在了真空里。</p><p class="story-paragraph dialogue">“我不怪你。”</p></div>

      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph dialogue">“不会掉下去吗？”南觉得女儿离自己实在有点远，况且单人床本来就小。</p><p class="story-paragraph">要是纱夏再往后退，背都该抵在床的边沿上了。</p><p class="story-paragraph dialogue">“会挤到你的。”女孩侧躺，头和妈妈的落在了同一个羽毛枕上。</p><p class="story-paragraph dialogue">“不挤到我就会挤到你。”南与她对视。女孩有点狼狈，眼睛都肿了。</p><p class="story-paragraph">其实两人这下不分伯仲，也说不出谁更窘迫一点。</p><p class="story-paragraph">想起纱夏边哭边喂自己吃饭，她还是忍不住轻笑出声。</p><p class="story-paragraph">不知妈妈此举是出于什么心态，纱夏只好问她。</p><p class="story-paragraph dialogue">“为什么笑？”她嗓子有点哑。</p><p class="story-paragraph">很谢谢你而已。南轻声在心底说，可是她只是收敛了表情里的笑容，没回答。</p><p class="story-paragraph">左手还扎着针，南依然拉住了纱夏。</p><p class="story-paragraph dialogue">“不会挤到我的，”她宽慰女儿：“靠过来一点。”</p><p class="story-paragraph dialogue">“你身上的伤，”纱夏还在担心：“会弄疼你。”“不疼。”趁女儿纠结磨蹭的当儿，南干脆主动过去了，她身体移动的时候发出悉悉索索的声音，纱夏怕妈妈在这个时候扯到什么地方，只好听了她的意思。</p><p class="story-paragraph">南往下躺了一点点，窝在了女儿的怀里。</p><p class="story-paragraph">被纱夏抱住了以后，她才安心些。“在家的时候都做了什么？”南把眼睛闭上，想和女儿聊点轻松的话题。</p><p class="story-paragraph dialogue">“前几天去买了东西，没吃的了，”纱夏用下巴顶着妈妈的发旋，南很温顺地靠着她：“家里有点乱，打扫了卫生。”</p><p class="story-paragraph">女孩由于放松的缘故，眼角也松弛地耷拉了下来：“不用担心不适应，和你住院以前没区别。”</p><p class="story-paragraph dialogue">“你也有点家里的主人样子了。”南闷闷地笑，和缓的语调柔软万分。</p><p class="story-paragraph dialogue">“我什么时候没有，”纱夏听了却有点不满，那种撒娇的嗔样再次显了出来：“你下班回来我哪天没给你做饭？”</p><p class="story-paragraph dialogue">“谢谢。”南承认了，小声地道谢，这句话不知怎地让女孩鼻酸。</p><p class="story-paragraph dialogue">“别说谢谢了，我愿意的，” 纱夏用手环着妈妈，掌心贴向了她的肩胛骨，瘦得硌人：“又不是你逼我的，我就想做饭给你吃。”</p><p class="story-paragraph">南眼里蒙蒙的雾气由于这个姿势没被纱夏看见，她的双唇开合几次才接着问下去。</p><p class="story-paragraph dialogue">“你自己呢，有没有照顾好自己？”</p><p class="story-paragraph">被问到的人有点心虚。</p><p class="story-paragraph dialogue">“嗯，”纱夏把妈妈抱得紧了点：“照顾好了。”</p><p class="story-paragraph">怀里的人闻声挣了她的手臂。</p><p class="story-paragraph dialogue">“真的？”南打量着女儿的脸，被纱夏哭晕的妆现下已经拿湿巾拭得没痕迹了。</p><p class="story-paragraph">她一下也分不清这种憔悴是来自于两人对峙时产生的悲伤，还是来自于自己这些天的缺席，以及真相对纱夏带来的打击。</p><p class="story-paragraph">抑或是三者都有…</p><p class="story-paragraph dialogue">“真的，”女儿长长的睫毛因为眨眼而闪了两下，她还用鼻尖来蹭南，给出的理由挺能让人信服：“要是没照顾好，今天肯定要缺席答辩了。”</p><p class="story-paragraph dialogue">“答辩还顺利吗？”又想起这件事情来了，南还不知道下文。</p><p class="story-paragraph dialogue">“很好，被老师表扬了。”这是真话，服部教授那么爱苛责别人，却没怎么刁难她。</p><p class="story-paragraph">对了，说到这个…</p><p class="story-paragraph">纱夏去掏自己的口袋，发现手机被压在身下的裤兜里，她还抱着南，只好用了种很扭曲的姿势把它拿在手上。</p><p class="story-paragraph">她解锁屏幕，浅色的光扑在了纱夏的脸颊上。“天气很热，过了这个时间就穿不了了，”她好像找到了要找的东西，把手机摆给南看：“所以托朋友帮我…”</p><p class="story-paragraph">南没听完，她已经看到了。</p><p class="story-paragraph">照片里的女孩子穿了身属于大学生的制服，半袖的黑色布料衬得她手臂更加细白，就连戴了帽子以后投下来的阴影，也遮不掉她从小就有的、存在于眼里的点点光迹。</p><p class="story-paragraph">原来是纱夏穿了学士服，特意给她拍了照片。</p><p class="story-paragraph">南盯着这张相片看了很久。</p><p class="story-paragraph">她的女儿真的长大了。</p><p class="story-paragraph dialogue">“和我想得差不多，”南缓了缓才开口，纱夏看到妈妈的眼泪顺着躺下的轨迹一路流向鬓角：“很漂亮。”</p><p class="story-paragraph">纱夏喉咙里压抑着哭泣的前奏，她按灭了手机屏幕。</p><p class="story-paragraph dialogue">“本来想直接穿到你面前的，”纱夏想起这个好笑的念头，她希望逗妈妈开心：“是不是太夸张？”</p><p class="story-paragraph">南只是摇头，她讲不出一个字，全数被哽咽堵住。</p><p class="story-paragraph">不夸张。</p><p class="story-paragraph">纱夏要看妈妈的口型才能知道她想说的话。</p><p class="story-paragraph dialogue">“你要赶快好起来，”她在擦南脸上爬满的泪水：“到时候再陪我去学校拍一张。”</p><p class="story-paragraph">好起来…</p><p class="story-paragraph dialogue">“我会等你好起来。”</p><p class="story-paragraph">别等我了，南很想直截了当地告诉她。</p><p class="story-paragraph">她闻到女孩身上那种花一样清新馥郁的味道。</p><p class="story-paragraph">少女正走到绽开得最美的那个瞬间。</p><p class="story-paragraph">何必把时间…</p><p class="story-paragraph">都耗在我身上？</p><p class="story-paragraph">再这样下去，她好害怕纱夏会为她过早地凋落。</p><p class="story-paragraph">南往女儿的怀里靠。</p><p class="story-paragraph">她真的不想重蹈覆辙了。害了自己无所谓，会不会害了纱夏？</p><p class="story-paragraph">她这个母亲做的真是不够格。</p><p class="story-paragraph">南第一次为自己的脆弱意志感到绝望。</p><p class="story-paragraph">可是习惯了十来年的陪伴，习惯身旁有人。</p><p class="story-paragraph">那种怎么熄也熄不灭的贪心在求着纱夏为她留下。</p><p class="story-paragraph">女孩的体温是这么暖和，这么舒心…</p><p class="story-paragraph">纱夏她都戒不了，更何况是戒毒？</p><p class="story-paragraph">妈妈沉默了，纱夏想她肯定又在害怕。</p><p class="story-paragraph dialogue">“我不知道你是怎么想的。”女孩拉着她的手，动作很轻，怕扎进去的针会弄疼她，然后用脸去蹭妈妈的指节。</p><p class="story-paragraph dialogue">“现在的我才是真的，我说不生气了，就是不生气了。”</p><p class="story-paragraph dialogue">“我是你的女儿。”纱夏说话的语速很慢，好像是刻意要强调：“我们是一家人，有什么是不能一起面对的？”</p><p class="story-paragraph">一家人…</p><p class="story-paragraph">纱夏，南描摹她的眉毛。</p><p class="story-paragraph">女儿好像真的是无所畏惧。</p><p class="story-paragraph">即使明了如此情况，也不退缩。</p><p class="story-paragraph">她太阳穴周围的皮肤下有根管状的神经好像被什么东西胶住了，藏在脑袋里突突地跳，牵出一阵明显的刺痛感。</p><p class="story-paragraph">南不得不停止对二人关系的深究，她暂时不愿意去细细思考这些头疼的问题。</p><p class="story-paragraph">万千繁复的思绪最终只化作一声应答。</p><p class="story-paragraph dialogue">“你是不是…”女孩观察着她的一举一动，觉得妈妈好像在克制什么忍而不发的东西：“还有什么没告诉我的？”</p><p class="story-paragraph">南沉吟半响，之后还是摇摇头。</p><p class="story-paragraph dialogue">“没了。”</p><p class="story-paragraph dialogue">“骗子。”纱夏把她抱得更紧。除了情感问题以外，南心安理得。</p><p class="story-paragraph">她觉得女儿应该看不出自己的心思，这下反而觉得纳闷。</p><p class="story-paragraph dialogue">“怎么骗你了？”</p><p class="story-paragraph dialogue">“他们说…”她小心地将得来的消息说给南听：“你的戒断反应很严重。”</p><p class="story-paragraph">原来是这个，南哑然。</p><p class="story-paragraph">纱夏看了她无言的样子，知道这就是真的。</p><p class="story-paragraph dialogue">“你看，”女孩有点后怕，语气里全是忧心的焦虑：“这么重要的事，你都不告诉我。”</p><p class="story-paragraph dialogue">“一下忘记了。”南没辩驳。</p><p class="story-paragraph dialogue">“怎么能忘记？”纱夏急得出了哭腔。</p><p class="story-paragraph">妈妈这种不冷不热的态度让她很担心。</p><p class="story-paragraph">万一南还遇到更严重的事，也选择不说…</p><p class="story-paragraph">那该怎么办？</p><p class="story-paragraph">自己刚刚说的那番话又有什么用呢？</p><p class="story-paragraph dialogue">“真的，”不想让纱夏再生气了，南贴着她的鬓发：“看到你来了开心，就忘了。”</p><p class="story-paragraph">纱夏知道那不是轻易就能忍住的疼痛。</p><p class="story-paragraph">妈妈还是被强迫的…</p><p class="story-paragraph">纱夏光是靠想象，就觉得难以承受了。</p><p class="story-paragraph">密密麻麻生长在女孩心房里的那种东西名为后悔，它们就像长了尖牙利齿的凶兽，把她逼到了绝路。</p><p class="story-paragraph">要是她当时找到了妈妈该多好…</p><p class="story-paragraph">要是能救下妈妈，该多好…</p><p class="story-paragraph">她怎舍得让南独自担着这一切？</p><p class="story-paragraph">病人的神色又这么淡然。</p><p class="story-paragraph">女孩的念头兜兜转转久了。</p><p class="story-paragraph dialogue">“受不受得了？”她轻轻地问她。“没关系，”南似乎不甚在意，反过来宽慰心疼她的纱夏：“医生会给我吃药。”</p><p class="story-paragraph">女儿的表情写满了不相信。</p><p class="story-paragraph dialogue">“真的没关系，”南捏捏她的耳朵：“你看我像有事吗？”</p><p class="story-paragraph dialogue">“像。”纱夏是故意这么说的。</p><p class="story-paragraph">南有点无奈。</p><p class="story-paragraph dialogue">“总需要过程的。”她垂下眸子，掩住了自己的情绪。</p><p class="story-paragraph">女孩把妈妈的脸摆正。</p><p class="story-paragraph dialogue">“我不要你告诉我所有的事，”碍着病人的身体状况，纱夏只能软声细语地恳求她：“但是有的事，像这种…”</p><p class="story-paragraph dialogue">“我知道了，”南打断了她，点点头，“以后不会的。”</p><p class="story-paragraph">怕女孩不肯罢休，她动了那只骨折了的手，颤颤地伸了小拇指出来。</p><p class="story-paragraph">纱夏盯着她，眼眶一点点地变红，面前的这幅景象竟逐渐朦胧了。</p><p class="story-paragraph dialogue">“不是要和我约定吗，”南笑笑：“怎么愣着？”</p><p class="story-paragraph">她反应过来，也搭了自己的在上面，象征性地勾了勾。</p><p class="story-paragraph dialogue">“快放下去。”纱夏怕妈妈的手又疼。</p><p class="story-paragraph">面前的这个女人真的从未露过破绽，就连仅有的那几次也是难得求来的…</p><p class="story-paragraph">不能从她嘴里逼问出什么。</p><p class="story-paragraph">妈妈的心事到底埋得有多深？十二年前的秘密都能瞒得天衣无缝。</p><p class="story-paragraph">她真的知道了吗？</p><p class="story-paragraph">纱夏不可置否，可她除了顺着南的意思，再没什么别的办法。</p><p class="story-paragraph">不能控制妈妈的想法。</p><p class="story-paragraph">纱夏抱着她，却总有种错觉。</p><p class="story-paragraph">这是一种很难察觉的、很不详的预感。</p><p class="story-paragraph">就好像总有一天，总有分别的一天。</p><p class="story-paragraph">妈妈可能什么话都不说，就那样走了。她的心好像被刀子剜去了一片，疼得发紧。</p><p class="story-paragraph dialogue">“妈妈。”纱夏放软了语调。</p><p class="story-paragraph">你别离开我。</p><p class="story-paragraph">她仔仔细细地凝视南，眼里噙满悲伤的爱意。</p><p class="story-paragraph">我只有你了。</p><p class="story-paragraph dialogue">“怎么了？”南一直都被这样叫，她很快就顺着习惯的记忆应了女儿。</p><p class="story-paragraph dialogue">“没有，”纱夏什么都没说，她的语气里浮现了隐隐约约的痴缠丝线，眷恋地绕着南打转：“就是想叫叫你。”</p><p class="story-paragraph">如果实在要走…</p><p class="story-paragraph">给我留下什么信号，好让我能找到你。</p><p class="story-paragraph dialogue">“幼稚。”南毫不掩饰地说她，却在女孩的眸子里抓到本不该属于她的那份执拗。</p><p class="story-paragraph">还是那么倔。</p><p class="story-paragraph">和她的逃避相比，纱夏好像追着她跑，完全不落下风。</p><p class="story-paragraph dialogue">“差不多了，”南缓缓地开口：“你要开车回家，再晚点不安全。”</p><p class="story-paragraph dialogue">“要 label="小节 3"><span>03</span></div><p class="story-paragraph">如果不出意外，在通往大人的那条路上，每个小孩都会对沿途风景做个畅想。</p><p class="story-paragraph">碰到天马行空的鬼点子胡乱生长的时刻，不做点不像话的事反会成为缺憾。</p><p class="story-paragraph">纱夏却没能如愿以偿。</p><p class="story-paragraph">以她那个性子，要是能得这样一个机会该多好啊。</p><p class="story-paragraph">普通孩子生命里璀璨生辉的时日，反是她人生里最黯淡无光的那个部分。</p><p class="story-paragraph">到现在，纱夏放肆的梦境在别人眼里看来也显得中规中矩。</p><p class="story-paragraph">工作会是体面的，薪资能抵上城市中心的一套房，最好还可以包下台车。</p><p class="story-paragraph">和爱人安稳地度过这一生便好。</p><p class="story-paragraph">其实从某种意义上来说，这种渴求又是人世间难存的奢侈。</p><p class="story-paragraph">可是，再小点的时候她没敢想，那个梦想居然也完成了一点点。</p><p class="story-paragraph">大学还没毕业，她就能用轿车代步了…</p><p class="story-paragraph">为了等人，纱夏此刻坐在妈妈的座驾上。和听到录音的那一天相比，车里的装饰一点没变。</p><p class="story-paragraph">那当然。</p><p class="story-paragraph">除了她要做司机才上车以外，又没人动过它们。</p><p class="story-paragraph">有个挂饰坠在后视镜的支架上，是玻璃质地的五角星。</p><p class="story-paragraph">南不爱在车里摆东西，这还是纱夏挑回来硬要挂在这里的。</p><p class="story-paragraph">毕竟她是家里的第二个女主人，做出的决策还是举足轻重。</p><p class="story-paragraph">纱夏怪妈妈，说她怎么也不嫌车上空空荡荡，冷清得慌，于是干脆自己动手，送了南一个。</p><p class="story-paragraph">南在接到这份礼物的时候微不可闻地皱了下眉头，小动作被女孩看到了。</p><p class="story-paragraph">纱夏以为妈妈的意思是嫌弃，但对方还是接过了它，串了绳子，就这样将星星留了下来。</p><p class="story-paragraph">当时随便买的，只想作临时的挂件用，等妈妈哪天开窍了，自然会择一个更漂亮的代替它。</p><p class="story-paragraph">这么多年过去了，霸占南后视镜这个位置的五角星还在。</p><p class="story-paragraph">女孩盯着它发呆，思绪也飘得远了。</p><p class="story-paragraph">她现在是有点紧张，所以才一遍遍地在这个再熟悉不过的地方找些物什去发散思绪。</p><p class="story-paragraph">今天出门的时候，纱夏又从墙上撕了张便利贴下来。</p><p class="story-paragraph">比起她作下决定的那天，有黏性的纸条再不剩多少。</p><p class="story-paragraph">赶在妈妈回来以前…</p><p class="story-paragraph">纱夏把着方向盘，纤长的食指一下下地轻敲它。</p><p class="story-paragraph">美沙一如既往地守约，离定好的时间还差一刻钟，她看到同学出现在道路的尽头。</p><p class="story-paragraph">提前打好招呼了，也告诉了对方车牌号和车型。</p><p class="story-paragraph">靠边暂停的车就这一辆，她三两步就走过来。</p><p class="story-paragraph dialogue">“早上好，”美沙拉开车门做的第一件事是和朋友打招呼：“纱夏。”</p><p class="story-paragraph dialogue">“早上好。”女孩也这样回应，往日里甜腻腻的上扬尾音却是不见了。</p><p class="story-paragraph">同学一扣好安全带就转过头看驾驶座的人，很关切她的样子：“这几天还好吗？”</p><p class="story-paragraph">她们上次见面是论文答辩那一天，之后纱夏就没怎么在学校露过面了。纱夏抬手去启动车辆，她眯了眯眼：“还不错。”</p><p class="story-paragraph">美沙打量了一下里面的装潢，很整洁。</p><p class="story-paragraph">轿跑车车座和纯黑的车身同颜色，没什么皮革的刺鼻气味，就算有，也都被薰衣草袋散出来的清香冲散了，挂吉祥物的后视镜下悬了个水晶吊坠。</p><p class="story-paragraph">后排座位空间小得可以忽略不计，靠后窗的平台上也没放什么东西，估计是怕遮挡视野。</p><p class="story-paragraph dialogue">“车是你妈妈的？”美沙问她，虽然没什么东西能象征主人的身份，但这种级别的跑车显然是不容易租到的，而且纱夏怎么会为了一次接送大费周章地忙活这种事情。</p><p class="story-paragraph">美沙得到了女孩肯定的答复。</p><p class="story-paragraph dialogue">“没想到阿姨会开这种车。”她在回忆同学那位…养母的长相，得出这么个结论。</p><p class="story-paragraph">她撞见过纱夏和一个漂亮女人在校园里散步。</p><p class="story-paragraph">差点就以为这两人是在谈恋爱了。</p><p class="story-paragraph">当她叫出纱夏的名字的时候，女孩的脸一下就红了个彻底，还慌慌张张地把十指相扣的手松开。</p><p class="story-paragraph">倒是身旁的那人不紧不慢地又牵起她。</p><p class="story-paragraph">艺术部的学姐吗？</p><p class="story-paragraph dialogue">“纱夏，”那个女人先开口了，她的声音很好听：“是你认识的人？”</p><p class="story-paragraph dialogue">“是…”美沙自认和纱夏在班上是关系好的，却不知怎地从朋友支吾的语气里听出了心虚的意思，好像不想打招呼似的。</p><p class="story-paragraph dialogue">“不介绍一下？”</p><p class="story-paragraph">纱夏照做了，那女人显然更有魄力。</p><p class="story-paragraph dialogue">“这是美沙，”纱夏侧过头在和那个看起来很像是恋人的姐姐解释：“和我一个学院的朋友。”</p><p class="story-paragraph">女孩拉拉身边人的衣袖，又对着美沙说话。</p><p class="story-paragraph dialogue">“我妈妈。”</p><p class="story-paragraph">可能是看她有点吃惊，纱夏的妈妈主动和她自我介绍。</p><p class="story-paragraph dialogue">“你好，敝姓名井。”女人礼貌地朝美沙点头，她的气质温文尔雅的，显得很不真实。</p><p class="story-paragraph dialogue">“纱夏平时在学校表现怎么样？”虽然后面这句话完全就是家长才问得出来的。</p><p class="story-paragraph dialogue">“她表现一直都很好…”美沙把称呼卡在喉咙里，顿了一下还是没说出来。</p><p class="story-paragraph dialogue">“那就好。”女人弯着眼睛笑笑，估计也是猜到了她的窘迫，很适时地给了个台阶让她下：“既然你和纱夏同辈，就叫我阿姨吧。”</p><p class="story-paragraph dialogue">“你以为她会开什么车？”</p><p class="story-paragraph">纱夏有点好奇地问朋友，美沙的回忆被打断。</p><p class="story-paragraph">前个星期她和那位叫作板仓的律师见过面，为了出庭作证，美沙也了解了案情。</p><p class="story-paragraph">完整地听了一遍那段录音，一时间难以接受身边亲密的朋友竟然遭遇了这些事。</p><p class="story-paragraph">难怪纱夏这么久电话不接，学校也不来了。</p><p class="story-paragraph">她不敢问女孩的心情。</p><p class="story-paragraph">但论文答辩那天纱夏再次出现了，还托自己拍了照。</p><p class="story-paragraph">美沙问起原因，她从纱夏的嘴里听到了“要给妈妈看”的答复。</p><p class="story-paragraph">反正是类似这样的话。</p><p class="story-paragraph">美沙猜测，纱夏应该没在生名井阿姨的气，要不然也不会和自己一起参加这次庭审。</p><p class="story-paragraph">她决定讲点轻松的话题，接着“车型”继续说了下去。</p><p class="story-paragraph dialogue">“普通的轿车，”她想了想：“或者是越野车，轮子很大的那种。”</p><p class="story-paragraph dialogue">“为什么？”纱夏顺了话问。</p><p class="story-paragraph dialogue">“看起来是个性格稳妥的人。”</p><p class="story-paragraph dialogue">“还有这种说法，”纱夏挑起了眉毛，有点好奇：“那你觉得买跑车是什么性格？”</p><p class="story-paragraph dialogue">“我说出来你别怪我。”想讲的那个词可褒可贬，美沙怕纱夏不高兴。</p><p class="story-paragraph dialogue">“你说嘛，”还能有什么，纱夏打开转向灯要拐弯了：“我哪有那么小气。”</p><p class="story-paragraph dialogue">“闷骚。”</p><p class="story-paragraph">纱夏终于笑了，她白白的牙齿露在外面，好像很满意这个形容。</p><p class="story-paragraph dialogue">“阿姨真是这样的？”轮到美沙奇怪了。“差不多。”她想起妈妈那外冷内热的性子，拿闷骚这个词来形容再形象不过。</p><p class="story-paragraph">简单明了。</p><p class="story-paragraph">导航已经把路线标得很清楚了，沿着地图上涂红的线条前进就好。</p><p class="story-paragraph">东京地方裁判所和高等裁判所共用同一座大楼，不堵车的话，离学校的距离能用时间度量。</p><p class="story-paragraph">大概有一刻钟那么远。</p><p class="story-paragraph">纱夏一眼就望到了那栋米白色的建筑，虽然南常进出这里，但她正儿八经上楼的次数不多。</p><p class="story-paragraph">南很少在裁判的日子叫纱夏来等她，女孩也没见过她打官司。</p><p class="story-paragraph">律师手上案子最多的那会，她还在念中学，两个人都没什么空。</p><p class="story-paragraph">南比她还累，工作应酬连轴转个没停。</p><p class="story-paragraph">妈妈从来不是爱炫耀的人，自然也不存在想要特意出风头给她看的时候。</p><p class="story-paragraph">要是自己实在是来了…</p><p class="story-paragraph">法律机构对面是日比谷公园，她想打发时间就去里面呆着。</p><p class="story-paragraph">纱夏习惯在喷泉广场附近转悠，她累了会坐在靠近树底的柳条椅上。</p><p class="story-paragraph">默契使然，两人最后总会在那里相见，手机没电了也不用怕。</p><p class="story-paragraph">纱夏清楚划好的停车位在霞关一丁目，她多往后头开了一条街。</p><p class="story-paragraph">幸好来得早，平日里空当稀缺的地，现下只零零散散地停稳了几辆车，确实没什么人。</p><p class="story-paragraph">她们没对着东京地裁的大门，需要绕一圈才能看见那堵写了“裁判所”三个汉字的青灰色石墙。</p><p class="story-paragraph">几颗高大的、她叫不出名字的绿树整整齐齐地被蓝天环住，飘带样的云朵穿过叶片的间隙。</p><p class="story-paragraph dialogue">“我和我朋友已经到了，”纱夏打了律师的电话，被告是坐警车被押送过来的，板仓会陪妈妈一起，按开庭时间来看，他们估计早到了：“要进来吗？”</p><p class="story-paragraph dialogue">“嗯，”男人停顿了一下，好像受人之托，再问了纱夏一个问题：“车停好了吗？”</p><p class="story-paragraph dialogue">“停在后门。”纱夏回答叔叔，她猜应该是妈妈在旁边说话。</p><p class="story-paragraph dialogue">“走那边也可以进，我们就在一楼。”</p><p class="story-paragraph">法院前门常有不满裁判结果前来抗议的人，他们拿褐色纸板做底，简单地用红笔写几句话，就完成了能举在手里挥舞的那种牌子的制作，抗议内容无非是“还我清白！”、“失职失责！”此类极为相像的句子。后边的情况稍微好些。</p><p class="story-paragraph">纱夏放下手机，同美沙并行地踏上了大理石砌的台阶。</p><p class="story-paragraph">和车辆的数目成正比，大厅也比较空旷。</p><p class="story-paragraph">她看到些提着公文包走来走去、神情严肃的人，不是律师就是检察官。</p><p class="story-paragraph">纱夏猜测，随便从里面抽个人出来，都能把六法全书背个滚瓜烂熟。</p><p class="story-paragraph">就像她妈妈一样…</p><p class="story-paragraph">名井南身边围了五六个穿上正装的男人，有那么几个人很明显不习惯西装革履的打扮，看起来很不自在，中间站了个留络腮胡的叔叔拿着电话在干什么。</p><p class="story-paragraph">纱夏认出当时那个录她口供的警察，好像是叫矢浦的。</p><p class="story-paragraph">她没怎么搭理这群人，只是朝板仓问了个好，视线没有一瞬停留，就落在南的身上。</p><p class="story-paragraph">这么多天，纱夏终于看到南脱掉病号服的样子了。</p><p class="story-paragraph">这件黑衬衫挺合身，南虽然瘦了点，但她的肩膀还是撑起了衣服的棱角。</p><p class="story-paragraph">女人用妆盖住了生病导致的倦容，这制式同她每次出门工作的样子很相似。</p><p class="story-paragraph">纱夏硬生生地克制下要上去拥抱妈妈的念头，只能借目光去触碰她。</p><p class="story-paragraph">她上下左右地仔细瞧着南，生怕看漏了哪个地方。</p><p class="story-paragraph">女孩发现妈妈的手被一件衣服罩着。</p><p class="story-paragraph">纱夏记得南骨折的指节并没有痊愈，她上前一步扯开那灰色的布料，一下愣住了。</p><p class="story-paragraph">妈妈手背上的针眼和青紫都还在，反光的银色金属几乎要贴着她的皮肤。</p><p class="story-paragraph">这竟是为了遮手铐用的。</p><p class="story-paragraph">她沉默一会，觉得这劳什子东西扎她眼睛。</p><p class="story-paragraph dialogue">“不能取掉吗？”女孩小声地问：“你又不是坏人。”</p><p class="story-paragraph">南了解她，纱夏的哭腔露得不够明显，足以被她发现了。</p><p class="story-paragraph">知道女儿是在为她抱不平，她的眼神不自觉地变得温柔。</p><p class="story-paragraph">南的行动受限，连摸摸纱夏的发丝都不行。“走个程序而已，”她细声对女儿说话，借此安抚小朋友的情绪：“不要紧的。”</p><p class="story-paragraph">妈妈是这样波澜不惊。</p><p class="story-paragraph dialogue">“和叔叔们打过招呼没有？”南抖抖手腕，被拷上的双手再次埋进衣服下面。</p><p class="story-paragraph">纱夏还想再看看，可是南要她讲礼貌…</p><p class="story-paragraph">她忍下委屈，深呼吸两下，才一个个地朝他们点头：“叔叔好。”</p><p class="story-paragraph">板仓在旁边惊得说不出话，南果然有一套，估计只有她才能治小女孩这性子。</p><p class="story-paragraph dialogue">“小岛检察官已经到了，”那个络腮胡男人挂断电话，站得远还没发现，现在靠近了能看见他耳朵边那点微微卷起的须毛：“现在上去候场吧，不要谈论案件内容。”</p><p class="story-paragraph">板仓站在靠电梯楼层按钮的那边。</p><p class="story-paragraph dialogue">“想采访一下你的想法。”南和他并肩走在一起，纱夏在后面听到他们讲话：“心情还好吗？”</p><p class="story-paragraph dialogue">“还行，”被问到的人是南，她停顿两秒，打趣道：“希望两个星期以后不要再出现在这里。”</p><p class="story-paragraph dialogue">“放心，我不会让这个案子被高裁的那群人审的，”板仓笑了，眼角的皱纹都折起：“保证一次就无罪。”</p><p class="story-paragraph">两人毕竟都是学法律的，纱夏想插嘴都插不上，只能从叔叔说的最后那句话里听出他十足的把握。</p><p class="story-paragraph">希望如此。</p><p class="story-paragraph">七拐八弯地才走到法庭的正门，木制门上嵌的两个金属把手都有点掉漆了，铜色的曲柄露了出来。</p><p class="story-paragraph dialogue">“这个案子不会公开审理，证人也不能旁听，”板仓指指刚刚提示他们时间的那位男士，对着纱夏说话：“正雄先生负责引导你们入场。”</p><p class="story-paragraph">女孩应了。</p><p class="story-paragraph dialogue">“那我和你妈妈先走，”律师接过了看护南的工作，他把罩着女人手上的衣服撤掉了：“开庭程序要开始了，判事得先确认被告身份。”</p><p class="story-paragraph">妈妈就要进去了吗？</p><p class="story-paragraph">纱夏已经被吓出了后遗症。</p><p class="story-paragraph">现在只要一和南暂别，她就会很担心再也见不到妈妈。</p><p class="story-paragraph">恐惧是掉进清水的墨滴，随着涟漪越荡越开。</p><p class="story-paragraph">纱夏看看手机上的时间，发现离开庭确实不剩多久了。在女人的背影融进那道门之前，她又下意识地出声喊了南。</p><p class="story-paragraph dialogue">“妈妈。”女孩说话时声音有点轻微的颤抖，她很不安。</p><p class="story-paragraph">南没回头，脚步停下了。</p><p class="story-paragraph">纱夏不知道说什么，只是觉得不能就这样让妈妈进去。</p><p class="story-paragraph">静默的时间不短，周围的人都没打断她们，好像是许可了女孩在此时做出的任性举动。</p><p class="story-paragraph">她在苦恼，恍惚中好像听见了南的轻笑。</p><p class="story-paragraph">妈妈偏了偏脑袋，迎着某束从透明窗子射进来的微光望了过来。</p><p class="story-paragraph dialogue">“可以让我和我女儿说几句话吗？”南眨眨眼。</p><p class="story-paragraph">板仓知趣地躲进法庭回避了，正雄先生领着剩下的几个证人往拐角处走。</p><p class="story-paragraph dialogue">“纱夏。”南唤了女儿的名字。</p><p class="story-paragraph">纱夏两步就走到妈妈面前，她努力想要扯出一个笑容，可是眼泪已经先一步掉下来。</p><p class="story-paragraph">南没有马上接下去，她只是端详着纱夏的这张脸。</p><p class="story-paragraph">昨天几乎是一夜未眠。</p><p class="story-paragraph">就那样…</p><p class="story-paragraph">翻来覆去地想。</p><p class="story-paragraph dialogue">“我第一次见到你的时候，”女人似乎是在自言自语，她笑着，用手在腰身那比划了一下：“你只有这么小，好像被风吹一下就要跑了。”</p><p class="story-paragraph dialogue">“好像也没过多久。”南抬头，望着比她还高上一点的纱夏。</p><p class="story-paragraph">她的目光越过女孩的发顶，有什么水盈盈的东西在那双亮黑的眸子里跳跃。</p><p class="story-paragraph dialogue">“你怎么就长这么大了？”</p><p class="story-paragraph">纱夏忍不住，手落在南的腰上，将妈妈拉近了一点。</p><p class="story-paragraph dialogue">“别害怕，更不要担心我，”南的双手必须同时抬起来，她用指背将纱夏的眼泪擦掉：“法律是最公平的，所以你就说你真正看到的。”</p><p class="story-paragraph dialogue">“听录音也是一样，”她的语气里透出不容拒绝的意思，一定要纱夏答应她：“好不好？”</p><p class="story-paragraph">女孩的脑袋埋到妈妈的肩膀里，她把南搂得很紧，呜咽着点头。这种力道压得南心痛，从纱夏的怀里挣脱了出来，她稍微踮了脚，将女儿不听话的头发拨到了耳后。</p><p class="story-paragraph dialogue">“我要进去了。”</p><p class="story-paragraph">纱夏看她倒退一步，离自己远了。</p><p class="story-paragraph">今天过去以后、审判结束以后…</p><p class="story-paragraph">妈妈应该再也不用那么辛苦了吧？</p><p class="story-paragraph">她感觉南现在很放松。</p><p class="story-paragraph">好像她即将面对的这场裁判…</p><p class="story-paragraph">只是作为律师以来她那漫长职业生涯里最小、最普通，最寻常的那一个。</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">美沙的顺序在纱夏之后。</p><p class="story-paragraph">那扇门是牢牢关上的，她记得它每次打开关闭时发出的“嘎吱”声响。</p><p class="story-paragraph">过去十分钟了，朋友是所有证人里进去的最久的一个。</p><p class="story-paragraph">她有一点想笑自己。</p><p class="story-paragraph">在论文答辩时焦心地等待了一轮还不够，现在还要主动找罪受。</p><p class="story-paragraph">秒不再是默数一次就完成计时的短单位，它被拉得很长。</p><p class="story-paragraph">美沙想起爱因斯坦老爷子提出的相对论，似乎也认可了这个自己一知半解的科学定律。</p><p class="story-paragraph">直到纱夏从另外一扇门出来。</p><p class="story-paragraph">美沙的观点总不变，从认识女孩的第一天起，她就这么看待她。</p><p class="story-paragraph">纱夏的那束灵魂带了滚烫的温度，靠得近了甚至能洇得人出汗。</p><p class="story-paragraph">干净又勇敢。</p><p class="story-paragraph">有无数个画面在她眼前闪烁。</p><p class="story-paragraph">像电影里的慢镜头那样，一帧帧图像不停地跳。</p><p class="story-paragraph">在上一帧里，她似乎还能看见十八岁的纱夏在寝室里读诗。</p><p class="story-paragraph">女孩倚着窗户，眼睫一下下地闪动。遇到天气好的日子，灿阳带来的软金会镀在她微微翘起的发尾上。</p><p class="story-paragraph">少女的奇思妙想能让所有人唇角含笑。</p><p class="story-paragraph">下一帧又跳到了现在。</p><p class="story-paragraph">这是美沙唯一一次在她脸上看到这种悲伤的表情。</p><p class="story-paragraph">藏得好深，朋友是什么时候学会这样哭泣的？</p><p class="story-paragraph">此时环绕在纱夏身边的是无边无际的幽幽长夜。</p><p class="story-paragraph">女孩的目光深不见底，叩得旁观者的心也随之隆隆发响。</p><p class="story-paragraph">虽然一开始听不太清纱夏在说什么，但她重复的次数实在太多。</p><p class="story-paragraph">双唇每碰一下就磕在一起发颤的音节组合成词语，又变得很好辨认。</p><p class="story-paragraph dialogue">“妈妈”。</p><p class="story-paragraph">美沙微微一愣。</p><p class="story-paragraph">来时的路上她就发现纱夏变沉默了好多。</p><p class="story-paragraph">只有在遇见名井阿姨的时候，纱夏才把原来那点热情小心翼翼地捧了出来。</p><p class="story-paragraph">眼睛流露出来的感情是最骗不了人的了，对待妈妈时温柔的爱好像是女孩的本能。</p><p class="story-paragraph">纱夏的唇抿得死紧，眉头蹙成了一个结。</p><p class="story-paragraph">她似乎是独自一人被关进了冰天雪地的冬日，周身的温度很低。</p><p class="story-paragraph">被割裂的透明碎块躲到纱夏眼睛里去了。</p><p class="story-paragraph">全都是旁观者完全读不懂的情绪。</p><p class="story-paragraph">很复杂，那些满满当当的痛楚能刺得人发疼。</p><p class="story-paragraph">美沙想过去搀一下朋友，可是正雄先生不由分说地要让她进场了。</p><p class="story-paragraph">现在这个情况，需要有人陪她才行…</p><p class="story-paragraph">她有点害怕。</p><p class="story-paragraph">伊卡洛斯太莽撞，为逃离禁锢他的岛屿盘桓得太久了，离太阳那么近，才被熔断了翅膀。</p><p class="story-paragraph">古往今来的例子证实了一个论点，越无畏越单纯的人越容易被地狱的烈炎吞没。纱夏单薄的肩膀抖得很厉害，她的背上好像张开了一对属于天使的残缺羽翼。</p><p class="story-paragraph">美沙觉得她不会坠落，只是…</p><p class="story-paragraph">从空无一人的旁听席间隙里踱步往下，她的脚步踩住正中间的宽缝，荡出的回声在安静的议事厅里格外明显。</p><p class="story-paragraph">她担心纱夏要飞到一个谁也见不着的地方去了。</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph">思绪弹跳得越来越快，像子弹球，在展开的无垠空间里肆意蹦射。</p><p class="story-paragraph">纱夏什么都捉不住。</p><p class="story-paragraph">胸口的气息悬得太紧，怎么放也放不下。</p><p class="story-paragraph">里面一刻再呆不了了，法务工作者用电脑整理出来的证词很快就摆到她面前。</p><p class="story-paragraph">纱夏看了两眼签了个名确认以后就走了，反正妈妈也要被警车押回医院，她们碰不了面。</p><p class="story-paragraph">她不知道要去哪，只是下意识地沿着穿行的车流驶过的方向追。</p><p class="story-paragraph">女孩的脚步颤巍巍的，等反应过来的时候，她发觉自己居然已经狼狈地跑了起来。</p><p class="story-paragraph">能听到心跳声，全身的关节都在嘎吱作响。</p><p class="story-paragraph">好不容易下定决心，还是没有想象中的自在，有股几近碎裂的痛感在她的骨头里肆意穿行。</p><p class="story-paragraph">南坐在被告席上。</p><p class="story-paragraph">她看得清清楚楚，原本应该是律师的妈妈双手被拴在一起，垂着头，前面摆了个名牌，写着个大大的“被告”。</p><p class="story-paragraph">在此之前，纱夏从没有和妈妈在法庭上见过面。</p><p class="story-paragraph">第一次是这样的。</p><p class="story-paragraph">名井南可是律师。</p><p class="story-paragraph">她怎么能是犯罪嫌疑人…</p><p class="story-paragraph">为了一份物证，能赶最晚的航班飞到最南边的九州岛去。</p><p class="story-paragraph">为了把每件经手的案子摸得清清楚楚，受了那么多委屈。</p><p class="story-paragraph">南不是国选律师，是事务所需要付费才能请的律师，但是国家的国选律师人手不够，需要他们的人又多，所以妈妈每个月都要额外接三四个吃力不讨好的案子。碰上过瞧不起女性的被告，碰上过败诉以后会威胁律师的原告。</p><p class="story-paragraph">纱夏担心得要死，反而是那个处在风暴中心的人来安慰她，告诉她“妈妈没事。”</p><p class="story-paragraph">对不起，纱夏在向谁乞求原谅。</p><p class="story-paragraph">投来的那些目光里闪烁出各种各样的情绪，化成场会发光的箭雨，尖利的责难似乎一起融在了里面，身上的甲胄形同虚设。</p><p class="story-paragraph">在眼前掠过的东西，是白而细碎的幻影。</p><p class="story-paragraph">对不起南，她保护不了妈妈。</p><p class="story-paragraph">南那一身伤是在寻她的时候惹出来的，即便到了如此关头还挡在她的前面。</p><p class="story-paragraph">在法庭上，被告为证人拦住了刁钻的提问，为证人提出抗议。</p><p class="story-paragraph">妈妈和检察官针锋相对，好像是以律师的身份出现在这里的。</p><p class="story-paragraph">纱夏知道，南一直行使的沉默权是为了自己而丢掉。</p><p class="story-paragraph">对不起亲生父母，不能为他们报仇，因为唯一和凶手扯在一起的人是名井南。</p><p class="story-paragraph">如果没有南，她就要永远地停在那段阴暗无光的时日里了。</p><p class="story-paragraph">绝对不能忘记妈妈的恩情。</p><p class="story-paragraph">必须要救她。</p><p class="story-paragraph">选择了南，就意味着放弃了另一边。</p><p class="story-paragraph">什么惩罚在等她，纱夏暂时不想去猜。</p><p class="story-paragraph">她如今的愿望只是和妈妈相爱而已。</p><p class="story-paragraph">南的身上有其他任何人都无法与之比肩的美，单拎出来也能成为傲慢的资本。</p><p class="story-paragraph">她最爱看妈妈服软了。</p><p class="story-paragraph">爱看这个由凡人巧夺天工做出的人儿像小鱼一样，和自己落入同一场大雨，和自己掉进同一片汪洋。</p><p class="story-paragraph">这辈子除了南以外她谁都不要了，哪怕是一无所有也可以毫不在乎。</p><p class="story-paragraph">都已经这么知足，为何还是不肯放过她？</p><p class="story-paragraph">所有人都逼着她承认，要她承认妈妈撒下的谎。多少是真的，多少是假的？</p><p class="story-paragraph">分不清是否成了谎言的真心话，猜不透那些甜蜜里带刺的亲吻。</p><p class="story-paragraph">世俗容不下她的爱。</p><p class="story-paragraph">仇恨容不下她的爱。</p><p class="story-paragraph">南说，法律是最公平公正的了…</p><p class="story-paragraph">可为什么这里也容不下她的爱？</p><p class="story-paragraph">难道是她爱得还不够赤诚，还不够资格吗？</p><p class="story-paragraph">纱夏的心空荡荡的，寂寥得很，一个人都没有。</p><p class="story-paragraph">记忆是由女孩亲自拾缀挑选的。</p><p class="story-paragraph">大学生学了个文绉绉的科目，人脑的容量总是有限，放完了专业知识和生活技能以外再不剩多少空间。</p><p class="story-paragraph">零散的片段明明是那么好记，可纱夏偏不，和妈妈共同度过的分分秒秒，她都不愿意忘记。</p><p class="story-paragraph">知难而进，女孩丢了简单的差事不干，反而刻意去回想她们那些长段的相处，好在一个人的时候拿来反复地看。</p><p class="story-paragraph">纱夏承认自己在某些方面不是个乖孩子，她贪心。</p><p class="story-paragraph">这种事情…</p><p class="story-paragraph">因为不愿意失去第二次，得了手就再不想松，更别提将收到的爱还回去。</p><p class="story-paragraph">她踩到落在地上的树叶，脚底立即传来嘎吱的一声响。</p><p class="story-paragraph">不知不觉，又踱步到了这里。</p><p class="story-paragraph">附近的长方形草坪似乎被跑者当成了天然的训练场，三两成群穿着打扮清凉的人一前一后地贴着女孩的身侧跑远了。</p><p class="story-paragraph">喷泉是用三个垒起的圆建好的，它们一个包着一个。最中间的还在往外喷细小的水柱。</p><p class="story-paragraph">纱夏坐在了木椅上。</p><p class="story-paragraph">她的神情是悲伤久了以后麻木的艰涩。</p><p class="story-paragraph">时间接近正午，女孩选择躲进树荫的决策是正确的。</p><p class="story-paragraph">她还是不知道后排的植物是什么，只是觉得它们和做成圣诞树的冷杉很相似，不过叶片的部分看起来更厚重，会给人一种它很怕热的感觉…</p><p class="story-paragraph">树是不会怕热的。</p><p class="story-paragraph">纱夏仰起脖子，从枝桠间滑落的灿阳掉在了她身上。</p><p class="story-paragraph">她不自觉地又想起那些记忆，就算和南混在一起的时日里也出现了带血色的过往，但在这时她总归不后悔。</p><p class="story-paragraph">她真的很珍惜这个家。</p><p class="story-paragraph">这个来之不易的家。</p><p class="story-paragraph">怎么看，名井南都是上帝送给她的珍宝。</p><p class="story-paragraph">是在她跌得浑身是伤，拆开包装以后得到的最好礼物。</p><p class="story-paragraph">女孩摊开手掌，发现那些破碎的纹路被薄汗沾得痕迹清晰，她想起班上有些同学懂这些，什么爱情线、事业线。</p><p class="story-paragraph">纱夏有点不太相信身体上的记号能成为整个命运的缩影，于是便盯着它们思考，不过最后还是放弃了。</p><p class="story-paragraph">她找不到爱情线在哪。</p><p class="story-paragraph">女孩的手指没入阴影里去，那束存在的暖意没有很快地褪却。</p><p class="story-paragraph">东京的鸽子都不怕人，哪里落下一只长满白羽的大鸟，它在女孩的脚边跳了两下，顷刻间又飞走了，振翅时带来阵微不可闻的气流。</p><p class="story-paragraph">要是能永远在一起就好了。</p><p class="story-paragraph">纱夏闭上眼睛。</p><p class="story-paragraph">女孩有经验，可是无论怎么做准备，那种疼痛还没落在身上就已经让她害怕。</p><p class="story-paragraph">什么时候…</p><p class="story-paragraph">南会从她的生命里彻底消失呢？</p><p class="story-paragraph">可能就是下一个瞬间，可能要到很久很久的未来。</p><p class="story-paragraph">如果，一切能重新来过。</p><p class="story-paragraph">从远处一路穿行来的热风轻拂她的发丝。</p><p class="story-paragraph">被这些事磋磨得最擅长等待。纱夏被暖洋洋的阳光抱在怀里，她几乎要睡着了。</p><p class="story-paragraph">也许妈妈在一切都结束以后…</p><p class="story-paragraph">就会接她回家。</p></div>

        <h2 id="heading-chapter-20">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">纱夏从椅子上起来的时候有点晕眩。饿着肚子的缘故，星阵样的黑斑在她眼前徐徐展开，过了一会才蔓延成片地消失不见。</p><p class="story-paragraph">车子差点熄火，表盘指针往低了的数字那偏，纱夏回医院之前顺便去了趟加油站。</p><p class="story-paragraph">她现在已经习惯沾了消毒水的空气。</p><p class="story-paragraph">女孩没看见那两个总守着不走的警察，她拉开门，发现妈妈待在靠窗的椅子上。南将双手垂得低低的，只给进来的人留了个背影。她似乎在望着外面发呆，几乎是窥不见肩膀在因呼吸轻颤。</p><p class="story-paragraph">太阳已经转到那边去了，白昼还没被熄灭，光线为南勾出的轮廓和阴影都很完美。</p><p class="story-paragraph">她好像是尊用玉石雕成的塑像。</p><p class="story-paragraph">被拥进怀里的时候，南闻到了女儿身上的味道。</p><p class="story-paragraph">纱夏从外面回来，估计是才走进来没多久，身上带了阳光的温度，暖烘烘的，蹭得南也软和地舒服起来。</p><p class="story-paragraph">女孩像毛茸茸的小动物，服帖地依着她，可爱得紧。</p><p class="story-paragraph dialogue">“外面那些警察去哪了？”纱夏先发问。</p><p class="story-paragraph">南端端正正地转了过去，想回答女儿。</p><p class="story-paragraph">由于身高的缘故，纱夏只能压低身子来抱她，姿势显得扭曲，女孩把膝盖窝得弯弯的。</p><p class="story-paragraph dialogue">“解除警备了。”南使了点力气让纱夏坐在自己腿上。</p><p class="story-paragraph">女孩好像有点惊讶，她眼睛有一瞬瞪大了些。南感觉到年轻人纤细的腰肢在发劲，是反抗她的意思，纱夏落下来的重量只有一点点。</p><p class="story-paragraph">洗澡的时候趁乱摸她就不收敛。</p><p class="story-paragraph dialogue">“坐好。”南耐心地哄女儿。</p><p class="story-paragraph">纱夏受制于南环在她腰际的手，挣脱的时候不小心扒到妈妈骨折的指节就糟了。</p><p class="story-paragraph">南等女儿坐下来才察觉。</p><p class="story-paragraph">纱夏这周来看她的时候没过穿修身的衣服。</p><p class="story-paragraph">她微微皱了眉头，有一阵愣神。</p><p class="story-paragraph">怎么…南抬起头，目光在女孩的脸上梭巡。竟这样瘦了？</p><p class="story-paragraph">纱夏实在是太过漂亮，漂亮里绝对是带了娇媚的。桃花眼的尾端轻巧地上扬，镶了点点碎钻一样的灵动。</p><p class="story-paragraph">眨一下就有一尾鱼钻进她心里的湖面。</p><p class="story-paragraph">鼻梁的线条从侧面看上去锋利又高挺，唇珠饱满得能激起人想要和她接吻的念想，那张嘴像被醇酒泡过的玫瑰花瓣。</p><p class="story-paragraph">得迷倒多少人呢？南想。</p><p class="story-paragraph">说不定早有一群人追着纱夏了。</p><p class="story-paragraph">女儿在她面前，眼神却是这样澄澄澈澈的，一点杂质都不带，和她那张脸的营造出的氛围倒有点不搭。</p><p class="story-paragraph">纱夏眼珠的颜色浅，迎着光看过来时，南总觉得里面装的是两颗发光的玻璃弹球。</p><p class="story-paragraph">天际那端金黄色的云朵…</p><p class="story-paragraph">这种类似暮色降临的气息，究竟是怎么在她的小女孩身上出现的？</p><p class="story-paragraph">她和纱夏对视，那双瞳孔里映出的热切与悲伤，像数万支箭羽一样朝着这边射来，可以刺穿她的灵魂。</p><p class="story-paragraph dialogue">“纱夏。”南的心被揪得疼。</p><p class="story-paragraph dialogue">“嗯，”女儿没有迟疑，乖乖地应了她：“怎么了？”南仔细地看，发现纱夏眼里起了雾。是层薄薄的泪膜。疲倦的尾音和不服帖的发梢是一样遮不住的。南沉默一会。“累吗？”她轻轻问。</p><p class="story-paragraph">时间滴答滴答地转。</p><p class="story-paragraph dialogue">“累。”女孩的嗓音比以往哑，听起来更迷人。</p><p class="story-paragraph">南嘴唇嗫嚅了两下。</p><p class="story-paragraph">纱夏没舍得再看她的这副表情。</p><p class="story-paragraph dialogue">“骗你的，”她凑近了，小心地拥着妈妈的肩膀：“不累。”</p><p class="story-paragraph">南漆黑的眸子湿漉漉的。</p><p class="story-paragraph">没什么能指控她的东西，先前模糊的罪证都被录音推翻。为了动摇证人，检察官在庭审上打出了感情牌。他问了纱夏，是否还记得父母死亡时的样子。</p><p class="story-paragraph">南清楚地看到女儿的身子晃了一下。这个问题是她始料不及的。她环顾四周，所有人脸上的麻木都显得如此可憎。</p><p class="story-paragraph">有把重得骇人的砍刀往下劈砍，难以翻越的天堑横她们的世界之间。</p><p class="story-paragraph">南是律师，至少曾经是…她在法庭上抗议，请求原告修改问题。</p><p class="story-paragraph">还是太迟。</p><p class="story-paragraph">说出去的话就是淬毒的刃。</p><p class="story-paragraph">抗议来得太迟、真相来得太迟，道歉也来得太迟。</p><p class="story-paragraph">纱夏的宽容没因此滞涩，它反倒比任何事物都降临得更快。</p><p class="story-paragraph">南不愿意纱夏再流血了，女儿却正是在她的自私下被磨出一身伤口。</p><p class="story-paragraph">她希望纱夏别这么懂事，要怪她就怪吧。</p><p class="story-paragraph dialogue">“你可以生气。”南给了女儿闹脾气的权利。</p><p class="story-paragraph">女儿朝她笑笑。</p><p class="story-paragraph">十二月出生的人，明亮得像冬季飘落的纯白皓雪。</p><p class="story-paragraph dialogue">“之前说了的，”纱夏的五官里已经显出了隐蔽的攻击性，她依然对自己保持了柔和的样子：“不生气了。”“坏事不是你做的，”女孩撇下了目光，又怕表达不出心意，那道视线再次抬了起来：“我知道的。”</p><p class="story-paragraph">有的时候，南可以很正经地告诉外人，说纱夏不是她的亲生女儿。</p><p class="story-paragraph">原因像先前的那样。</p><p class="story-paragraph">眼睛颜色有别，鼻子形状不一样，嘴巴轮廓也很好区分。</p><p class="story-paragraph">可是，有的时候，连南自己也有些怀疑。</p><p class="story-paragraph">纱夏是不是真的由她生出来的，是她的骨肉变作的人。</p><p class="story-paragraph">可能在一起生活太久了。女孩捡了她性格里那点有好有坏的东西去学，某些地方简直同她如出一辙地相似。</p><p class="story-paragraph">纱夏变得和她一样能忍。</p><p class="story-paragraph">甚至…比她还能忍。</p><p class="story-paragraph">于此之外，女儿还多出点她没有的勇敢。</p><p class="story-paragraph">很浓烈很厚重的感情…不该在这个年龄段的人身上出现。</p><p class="story-paragraph">纱夏的这份爱远比曾经燃烧得更甚。</p><p class="story-paragraph">一般人担不起的。炽然下的迷乱和决心是发光的耀星，能把南的天空照亮。除了她，再没人担得起纱夏的喜欢。</p><p class="story-paragraph">她注视着妈妈。南的眉像天鹅翅膀上排列紧密的细羽。</p><p class="story-paragraph">这份美是在月光底下一点点凝出来的。</p><p class="story-paragraph">女孩的喉咙里有什么东西在飞舞。</p><p class="story-paragraph">她胆怯地在南的嘴巴上啄了一下，很快又退开。</p><p class="story-paragraph">有干净的肥皂泡泡飘过。</p><p class="story-paragraph">五彩光纹在脆弱的曲面上缓慢移动，照出了她们这四年间最难以启齿的秘密。</p><p class="story-paragraph">南拉住了纱夏。</p><p class="story-paragraph">她将眼睛闭上，手环了女孩的脖子，处在高位的人被往下拉。纱夏没反应过来，她们的嘴唇几乎是以碰撞的力度磕在了一起。</p><p class="story-paragraph">女孩想往后退，看看妈妈疼不疼。</p><p class="story-paragraph">南没让她跑，露了牙齿咬住她的下唇。</p><p class="story-paragraph dialogue">“纱夏，”她轻轻唤女儿的名字，手向对方的腰间揽：“别躲…”</p><p class="story-paragraph">一触即发的吸引力迷得双方都昏了头，不知道谁先伸了舌头出来。</p><p class="story-paragraph">流动的气息缓和了，在安静的室内，只能听见两人的呼吸纠缠。</p><p class="story-paragraph">纱夏口腔里清新又年轻的甜香让这个吻变得很烫。</p><p class="story-paragraph">属于少年的荷尔蒙像席卷而来的浪潮，将南裹在里面。</p><p class="story-paragraph">那样的温度好像是从指尖晕开，无阻拦地、放肆地爬上了她的耳垂，染得南脸颊绯红。</p><p class="story-paragraph">女孩先移开，她小口小口地喘气，大而亮的眼睛闪来闪去。</p><p class="story-paragraph">南在一片朦胧里望见纱夏的眼睫轻飘飘地颤，不堪重负似的，挂了早春初晨的露水。</p><p class="story-paragraph">纱夏动了动她那双漂亮的腿。</p><p class="story-paragraph">她朝里挪，把南抱住了，下巴压在妈妈的肩膀上。</p><p class="story-paragraph">风从窗沿的缝隙里扫过。</p><p class="story-paragraph">那声音似流沙陷落，快将女孩的心跳掩得听不见了。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">南已经睡下。</p><p class="story-paragraph">今天中午纱夏和妈妈一起吃了医院的饭。</p><p class="story-paragraph">主食是处理过的、烧熟的北极贝寿司。</p><p class="story-paragraph">高蛋白食物对刚痊愈的病人而言有些难消化，护士只让南吃两个。</p><p class="story-paragraph">纱夏面对剩下的那堆米饭傻了眼。</p><p class="story-paragraph dialogue">“我吃不完…”女孩口齿不清地抱怨，因为妈妈把它们全部夹给自己了。</p><p class="story-paragraph dialogue">“必须吃完。”南用淡淡的口吻命令纱夏，她坐在一旁安静地喝汤。过了饭点，一次性勺子都没了，南只能捧着碗，用嘴贴着它的弧线边沿。</p><p class="story-paragraph dialogue">“太干了，”纱夏望一眼妈妈，语气软软的：“我也要喝那个。”拗不过她撒娇，南将装了浅蜊和豆芽的碗递过去。</p><p class="story-paragraph">纱夏给它转了个圈，唇对准了妈妈落嘴的地方。</p><p class="story-paragraph">南的眉心跳了一下。</p><p class="story-paragraph">女儿意有所指地抬了头，目光温柔地来舔她的脸颊。</p><p class="story-paragraph">没露明显的痕迹，南径自转移了视线。</p><p class="story-paragraph">女人藏在头发里的耳垂有点发烫。</p><p class="story-paragraph">她在心底叹了口气，有点懊恼。</p><p class="story-paragraph">做了那么多次，这个时候还装什么纯情。</p><p class="story-paragraph">也不小了，都三十好几了，之前又不是没谈过恋爱…</p><p class="story-paragraph">怎么现在在女儿面前就像个情窦初开的中学生一样？</p><p class="story-paragraph">看到妈妈沉默不语，纱夏结束了那点放肆的举动，睫毛又摆了下去。</p><p class="story-paragraph">时钟跨过三点，饭吃完了，午觉前为了消食，她和南在走廊里散了会步。</p><p class="story-paragraph dialogue">“我可能要出去一趟，”女孩只拉了一层纱帘，全部合上未免太闷了一点：“你醒来记得给我打电话。”</p><p class="story-paragraph">光线不刺眼。</p><p class="story-paragraph">现在妈妈终于不用打针，纱夏在南左手的手背上吻了一下。</p><p class="story-paragraph">医院饭菜的口味也凑合，总归也没她亲自做的好吃。</p><p class="story-paragraph">纱夏拿了包，要回去给南准备晚餐。</p><p class="story-paragraph">装在保温饭盒里的话…</p><p class="story-paragraph">应该能放很久。</p><p class="story-paragraph">怕吵到妈妈，她轻掩了门退出去。</p><p class="story-paragraph dialogue">“叔叔，”女孩打了个电话给板仓：“庭审结果一周就能出来吗？”</p><p class="story-paragraph">律师在那边给了肯定的回答：“我联系了法院，他们说没什么有争议的地方。”纱夏顿了一会。</p><p class="story-paragraph dialogue">“不用在意，肯定是无罪，”猜出了女孩的忧虑，板仓马上出言安慰她：“等你妈妈身体好点，就该办出院手续了。”</p><p class="story-paragraph">听了这话纱夏放心了些，她巴不得早点把南接回去。</p><p class="story-paragraph">在医院睡觉实在太遭罪了，床也是小小的一张。</p><p class="story-paragraph dialogue">“我等会去问问医生。”</p><p class="story-paragraph">刚好，铃木护士就在护士站值班。</p><p class="story-paragraph">想起这位阿姨给妈妈洗过澡，纱夏觉得有点别扭。</p><p class="story-paragraph">她挂了电话就走到台子边，轻咳了两声想引起护士的注意。</p><p class="story-paragraph dialogue">“您好。”铃木应声抬头，和她打招呼。</p><p class="story-paragraph">名井小姐的女儿是来问她病人什么时候能出院的。</p><p class="story-paragraph dialogue">“如果实在是想的话，”看纱夏的表情，护士猜测要是有出院的表能填，她下一秒就会签字：“现在已经可以了。”</p><p class="story-paragraph dialogue">“不过…”铃木话里有话。</p><p class="story-paragraph dialogue">“不过什么？”女孩反应很快。</p><p class="story-paragraph dialogue">“名井小姐，”护士有点担忧：“她这个情况，出院以后要去戒毒所。”</p><p class="story-paragraph">戒毒所。</p><p class="story-paragraph">纱夏的心惶惶然地往无边夜色里沉了下去。</p><p class="story-paragraph dialogue">“在家可以吗？”她的问句显得紧张。</p><p class="story-paragraph">铃木的表情不轻松，她在资料夹里找什么东西。</p><p class="story-paragraph">纱夏看到那里面装了很多零零散散的宣传单，她瞥见了“运动康复”这几个字。</p><p class="story-paragraph">铃木抽了张纸出来，把它递给女孩。</p><p class="story-paragraph">自戒中心。</p><p class="story-paragraph">纱夏的脸黑了下去。</p><p class="story-paragraph dialogue">“在山梨县那边，”铃木告诉她：“离富士山很近，应该是日本数一数二的戒毒所了，和我们医院有合作。”纱夏想把这张纸推回去，但护士合上了夹子。</p><p class="story-paragraph dialogue">“先拿着，”铃木没接：“说不定有用，和你妈妈商量一下。”</p><p class="story-paragraph">宣传单被强行塞进了女孩的右手里。</p><p class="story-paragraph">以为对方要离开了，谁知道她的脚步又回旋到自己身边。</p><p class="story-paragraph dialogue">“她现在可以吃番茄酱吗？”纱夏问她。</p><p class="story-paragraph dialogue">“番茄酱？”</p><p class="story-paragraph">护士对这种东西不感冒，她重复了一遍。</p><p class="story-paragraph dialogue">“可以的，”铃木点头，给出了可参考的建议：“控制量就好。”</p><p class="story-paragraph">五楼不高，懒得等电梯了，女孩走路下楼。</p><p class="story-paragraph">在靠近一楼的那个拐角时她手机响了。</p><p class="story-paragraph">纱夏按亮了屏幕，是桃打来的。</p><p class="story-paragraph">高中同学在名古屋读书，两人偶尔会在寒暑假约出来见面吃饭。</p><p class="story-paragraph">她接起，朋友的声音卷了微弱的哔波电流到达女孩耳边。</p><p class="story-paragraph dialogue">“怎么给我打电话？”</p><p class="story-paragraph dialogue">“我的实习结束了，”桃在那头好像伸了个懒腰：“等几天就回东京。”</p><p class="story-paragraph dialogue">“这么快吗？”纱夏有点意外，她已经快和学校生活彻底脱节，总觉得论文答辩完没多久，还不至于就拿到聘书。</p><p class="story-paragraph dialogue">“我开始得早，你呢，”桃也很关心她：“留学的事应该也弄得差不多了吧？”</p><p class="story-paragraph dialogue">“差不多了。”纱夏的喉咙有点含混，不过很难察觉到。</p><p class="story-paragraph dialogue">“那就好，”朋友没在意，她好像在那边找什么东西：“什么时候去美国？”</p><p class="story-paragraph dialogue">“早着呢。”女孩自顾自地笑了。</p><p class="story-paragraph dialogue">“下个月能和我们班几个人一起聚一聚吗？”原来是这样的事情，桃还解释一句：“有人派我来邀请你。”</p><p class="story-paragraph dialogue">“我下个月事情有点多，”她想起了妈妈，决定委婉地拒绝：“可能来不了。”</p><p class="story-paragraph dialogue">“只是吃餐饭，”桃觉得可惜：“和我们平时出来那样。”“家里出了事情。”纱夏轻轻地说，一般用这种理由就能阻断别人的邀约。</p><p class="story-paragraph">对面尴尬地沉默了两秒，桃再开口时有点小心翼翼的：“还好吗？”</p><p class="story-paragraph dialogue">“没事的，”纱夏还没走出医院大门：“但是大概率没办法过来。”</p><p class="story-paragraph">桃这才听出对方的语调里的确掺了不少落寞。</p><p class="story-paragraph">她们认识七年了，纱夏从没这样说过话。</p><p class="story-paragraph dialogue">“如果有什么需要帮忙的，”桃想了想，最后也只能这样应答：“可以和我聊聊。”“好。”纱夏不打算实施，脑子里装了太多事情，要爆炸了，倾给对方也无济于事。</p><p class="story-paragraph">尽管如此，她还是礼貌地道了谢。</p><p class="story-paragraph">纱夏望见了洗手间，她觉得自己可以进去一趟。</p><p class="story-paragraph dialogue">“桃，”女孩要挂电话了：“你还有要说的吗？”</p><p class="story-paragraph dialogue">“没了。”桃知道朋友也许是在忙。</p><p class="story-paragraph dialogue">“等他们定好日期，”她补了句话：“我能再联系你吗？”</p><p class="story-paragraph">纱夏“嗯”了声，等着对面先挂断，再把手机放回了口袋。</p><p class="story-paragraph">她推开装了雪白色门的无人隔间。</p><p class="story-paragraph">戒毒所的宣传单被纱夏撕得粉碎。</p><p class="story-paragraph">她将那些带了毛边的纸片冲进了下水道里。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">纱夏刚走没多久，铃木就遇了差事。</p><p class="story-paragraph">报警的信号灯飙红，还有很扎耳朵的蜂鸣依着那阵节奏响。</p><p class="story-paragraph">这层楼有个上了年纪的老头，平时佝偻着背，走路就颤巍巍的，不知怎么家人没看住，这回他不小心摔了玻璃做的瓷杯，脚还在碎片上踩了一下，划了好几道口子。</p><p class="story-paragraph">护士进门就被那几个血印吓了一跳。</p><p class="story-paragraph">好在没有特别深的伤口，她干脆在病房里作了临时清创的工作。</p><p class="story-paragraph">取出残片的时候，姓中田的病人疼得嘶牙咧嘴的，他牙齿已经缺了好几颗，讲话时有点漏气，像少了扇叶的风箱在那呜呜响。</p><p class="story-paragraph">铃木安抚了受伤老人的情绪，保姆在旁边也很愧疚的样子，她出去上了个厕所，没成想回来就看到这幅场景。</p><p class="story-paragraph">护士的白衣服被弄脏了，猩红的血痕张牙舞爪地蔓延开，有点可怖。</p><p class="story-paragraph">她刚坐回原位，手臂还没从袖子里脱出来。</p><p class="story-paragraph">铃声又响了。</p><p class="story-paragraph">早就习惯这样的工作强度，铃木再次套上那件脏的外套。</p><p class="story-paragraph">这次是…她看一眼对应的房间号。</p><p class="story-paragraph">护士在口袋里摸着了用硬锡纸包好的药片。</p><p class="story-paragraph">铃木要照顾名井小姐，上次她开了一盒美沙酮，这种药要拿到总是很麻烦。以备万一，护士都是随身带着它。</p><p class="story-paragraph">映出来的光线是微微弱弱的，里面的窗帘还没拉开。她希望名井小姐是为了别的事找她，比如想看书…</p><p class="story-paragraph">护士在门口就听到南的呻吟。</p><p class="story-paragraph">瘾上来了…</p><p class="story-paragraph">病人的眉头因痛苦蹙在一起，她眨眼的动作一下比一下用力，好像在用所有的忍耐力去阻止自己的求救。</p><p class="story-paragraph">铃木伸手去摸名井小姐的额头。</p><p class="story-paragraph">她体温有点偏高，还抖得厉害，整个身子和过了水一样，贴着前胸的衣服都被洇得些许透明。</p><p class="story-paragraph">病人蜷缩起整个上半身，自发地折叠起来。</p><p class="story-paragraph">她的眼里全是泪水，浮现出悲伤和自弃的感情，嘴唇哆嗦着。</p><p class="story-paragraph dialogue">“好疼…”南似乎是个海难的溺水者，只能通过大口大口地喘息来维持生命：“难受…疼…”</p><p class="story-paragraph dialogue">“名井小姐，”铃木蹲下去，反握住病人冷得没有温度的手，试图和她沟通：“现在是戒断阶段的正常反应。”</p><p class="story-paragraph">南的整张脸都变得通红。</p><p class="story-paragraph">从额头上掉了两滴汗下来，水珠穿过了眉毛，变作眼泪一样的液体。</p><p class="story-paragraph dialogue">“好疼…”南用了很大的力气：“救救我…”</p><p class="story-paragraph dialogue">“给我吃药好不好？”名井小姐说话声音小小的：“我吃了药…就不痛了…就舒服了…”“您再忍一下，这次吃了药，下次会更疼。”</p><p class="story-paragraph">不是不可以，为了清醒地参加庭审，名井小姐这两天都没怎么碰过安慰剂，按理来说是能吃一点的。</p><p class="story-paragraph">可是，戒毒毕竟是一个过程，一昧地满足病人的要求只能让情况变坏。</p><p class="story-paragraph">瘾还没戒掉，名井小姐就要先依赖上美沙酮了。</p><p class="story-paragraph dialogue">“给我吃药…”南在摇头，她过滤了那些真正为她好的话，那双眼睛哪里还有一点点尊严：“给我吃药…求你…求你给我吃一点…”</p><p class="story-paragraph">护士正要张嘴，听得另一道声音在背后响了。</p><p class="story-paragraph">铃木回过头去。</p><p class="story-paragraph">是站在原地发愣的纱夏。</p><p class="story-paragraph">女孩在慌乱之下随便就把手里提着的东西搁在地上。</p><p class="story-paragraph">纱夏就是见不得南哭。</p><p class="story-paragraph">她一个趔趄跪在了床边，眼睛红通通的。</p><p class="story-paragraph">妈妈的头发被汗黏成一缕缕的，乱七八糟地贴在额头上。</p><p class="story-paragraph">女孩想求助，她转头看护士，在那件衣服上瞧见了刺目的血迹。</p><p class="story-paragraph dialogue">“她怎么了？”纱夏拉了一下被子，没在妈妈身上看到什么伤口。</p><p class="story-paragraph">难道…</p><p class="story-paragraph dialogue">“纱夏…”南抓住她，好像女儿是她的救命稻草，她的自尊被蚂蚁啃噬的剧痛弄得彻底没了踪影。</p><p class="story-paragraph dialogue">“你帮妈妈求求阿姨，”纱夏第一次在南的眼里瞧到这样深的迷惘，她的瞳孔里好像钻进了什么不清不楚的东西：“你帮帮妈妈…”</p><p class="story-paragraph">她当着铃木护士的面开始讨好女儿。</p><p class="story-paragraph dialogue">“纱夏…”南勉强支起身子，用嘴巴去碰她的下颌线，呼吸毫无规律，乱得根本捉不住：“帮帮妈妈…”</p><p class="story-paragraph">纱夏被亲得脸颊泛红。</p><p class="story-paragraph">和痛苦的喘息冗杂在一起的是沉默，恐惧如同海绵，把其他的声音吸得没了踪迹。</p><p class="story-paragraph">两滴滚圆的泪水从女孩的眼眶里掉了出来。</p><p class="story-paragraph">纱夏总是听话的。“给她一点点吧，”名井小姐女儿的声音蒙上了一层布，是从很远很远的地方传过来的：“我喂给她。”</p><p class="story-paragraph">铃木从口袋里翻出那片铝箔做的药板，用指甲划开了一个小口，往手心里倒了一颗白色的圆片。</p><p class="story-paragraph dialogue">“口服，”她告诉纱夏：“吃完以后没过多久可能会困。”</p><p class="story-paragraph">女孩接了过来，南的视线有点着迷地跟了那片药跑。</p><p class="story-paragraph">纱夏踩掉她的那双鞋，翻身往床上躺。</p><p class="story-paragraph">护士退了出去，她和名井小姐的女儿说了有异常情况再叫她。</p><p class="story-paragraph dialogue">“纱夏…”南虽然还在因阵痛发颤，但看向女儿的时候含了好多柔情：“你对我真好。”</p><p class="story-paragraph">她什么时候会这么直截了当地和自己说话？</p><p class="story-paragraph">纱夏的眼睛藏在浓密漂亮的睫毛投下的阴影里，其中的那点光像蜡烛火苗被吹熄一样地灭了。</p><p class="story-paragraph">南伸了舌头出来，要咬女儿手指夹着的那片药。纱夏无济于事地挣扎了一下。</p><p class="story-paragraph">没用。</p><p class="story-paragraph">女孩的手腕往回躲，南就追着它去。</p><p class="story-paragraph">都发生了什么？</p><p class="story-paragraph">妈妈怎么会变成这个样子？</p><p class="story-paragraph">纱夏再退不得半分，南抓了她的小臂。</p><p class="story-paragraph">女人用嘴含住了那片能让她舒服的药。</p><p class="story-paragraph">她连水都不要喝，直接吞了下去。</p><p class="story-paragraph">南闭上了眼睛，她往纱夏的怀里钻。</p><p class="story-paragraph">妈妈脸颊上的泪水蹭到了她，纱夏恍惚间觉得有阵滚烫的腐蚀疼痛印在了她的皮肤上。</p><p class="story-paragraph dialogue">“妈妈…”她捧着南的脸，想知道妈妈还看不看得见她。</p><p class="story-paragraph">女人的瞳孔里浊浊的一片，混乱的根源在那里肆意地生长。</p><p class="story-paragraph">南好像很幸福，她的嘴角带了笑。</p><p class="story-paragraph">妈妈现在蜷在她的怀里，纱夏却从未觉得她们间的距离有这么远。南在被什么东西夺走，正从她的身边被夺走。</p><p class="story-paragraph">被神木堂夺走，被那个叫作伯利恒的毒品夺走，被美沙酮夺走。</p><p class="story-paragraph">这场分崩离析的解体…</p><p class="story-paragraph">如何阻止？</p><p class="story-paragraph dialogue">“我爱你，”女孩知道南可能什么都听不见：“妈妈，我爱你。”</p><p class="story-paragraph">妈妈很累，经历了这么多，她是该休息一下了。</p><p class="story-paragraph">嘴里全是泪水的咸湿味道，纱夏将许诺都给了她。</p><p class="story-paragraph dialogue">“我爱你，”女孩吻南的嘴巴，额头抵着她：“你变成什么样我都爱你。”</p><p class="story-paragraph">南不反抗，也不回应。</p><p class="story-paragraph">她不知道自己怎么才能留下妈妈。</p><p class="story-paragraph dialogue">“等我们回去，”纱夏把南搂得紧紧的，几乎是泣不成声：“我们回去就戒掉。”</p><p class="story-paragraph">女孩泪流满面，摇摇头换了个称呼。</p><p class="story-paragraph">反正妈妈听不见。</p><p class="story-paragraph dialogue">“名井南，”纱夏念她的名字：“名井南。”</p><p class="story-paragraph dialogue">“我爱你。”</p><p class="story-paragraph">女孩摩挲着南耳边那搓柔软的细发，室内的光线很暗，她其实看不太清妈妈的样子：“我特别特别爱你。”</p><p class="story-paragraph">纱夏牵妈妈来摸自己的脸，南的面容被她的泪水晕得模糊难辨。</p><p class="story-paragraph">给妈妈做好的饭，只能等她醒来再吃了。</p></div>
