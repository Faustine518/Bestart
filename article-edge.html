      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">晨间的春雨到现在还没停过。</p><p class="story-paragraph">恐惧渗到纱夏的骨头里，她小腿那绵密的有机质里仿佛是长出了一棵刺。</p><p class="story-paragraph">脚踩在棉花上，要站不稳了。</p><p class="story-paragraph">和板仓叔叔见了面，对方二话没说就带着她往医院去。为什么，说是要等她妈妈…</p><p class="story-paragraph">捱了一个世纪那么久，却没等来好消息。</p><p class="story-paragraph">从救护车里托出来了两张担架床，先下来的罩着白布。</p><p class="story-paragraph">有人死了？</p><p class="story-paragraph">脑袋里好像有什么东西碎断了，纱夏木着往前挪了两步，嘴唇惊得没了颜色。</p><p class="story-paragraph">她张了张口，哑住了，半点声音都发不出来。</p><p class="story-paragraph">里面还有个人。</p><p class="story-paragraph">就算是化成灰了，女孩也不会认不出她来。“妈妈！”纱夏冲过去，像一头暴起的野兽，发了疯似地往前挤。</p><p class="story-paragraph">南的额头上全是血，她就那样睡着，两只眼睛闭得死死的。</p><p class="story-paragraph">好像永远不会醒过来了。这个念头把纱夏生命里唯一的力量都抽走了。“放开我！”有人拦她，她又打了谁一拳。</p><p class="story-paragraph">不知道。</p><p class="story-paragraph dialogue">“让我过去！”</p><p class="story-paragraph">近在咫尺的距离。</p><p class="story-paragraph">前不久南还窝在她怀里，抬了手来抚弄她的眉毛。</p><p class="story-paragraph">妈妈的表情不该是这样的。</p><p class="story-paragraph">至少抱一下她…</p><p class="story-paragraph dialogue">“她是我妈妈！”从纱夏嘴里溢出来的吼声没人听得懂，但所有人都被她撕心裂肺的痛震慑到了。“谁做的？”她步子踉跄，险些跪在地上，被板仓眼疾手快地扶住了。纱夏眼睛红得要滴血，她想去摸妈妈的脸，但是全身都控制不住地哆嗦打颤。</p><p class="story-paragraph">干了的血痕蹭到了手指，却染不脏她的指尖。妈妈从没这么狼狈过，平日里打理得一丝不苟的头发居然被血块凝出了死结。</p><p class="story-paragraph">纱夏碰到了南的皮肤。</p><p class="story-paragraph">好冷，冷得她心底发寒。“你怎么了…”她的牙齿磕碰在一起，吐出的词句都在发抖，好像是坠入冰洞的低温症病人。</p><p class="story-paragraph">这件衣服本来就是红色的吗？如果不是，难道全都是妈妈的血…</p><p class="story-paragraph dialogue">“到底，”她哭得好厉害，夹杂着因呼吸过度导致的干呕声，这种感染力把板仓的眼泪也牵出来了：“是谁这样对你…”</p><p class="story-paragraph">没人回答她。</p><p class="story-paragraph">来了护士把折叠的滑轮打开，南被往医院里面推。</p><p class="story-paragraph">纱夏追着进去。</p><p class="story-paragraph">好像被谁在场外按下了静音键。无边的寂静，就这样延伸下去的沉默。世界还在转动，她一瞬间什么都听不见了。</p><p class="story-paragraph">一切事物投射出的影子全部消失，无法承受的伤痛排山倒海地侵袭而来。</p><p class="story-paragraph">和南叠在一起的，还有十四年前，已经快要淡去的，那两具没有生命的躯体…</p><p class="story-paragraph">亲生父母也是一声不响地就离开了，她不能再失去…</p><p class="story-paragraph">急救室的灯箱亮了。</p><p class="story-paragraph">纱夏濒临缺氧的绝境，她的四肢几乎无法动弹。做好消毒工作的那个医生从里面打开感应门。</p><p class="story-paragraph">对方像站住的毒蛇，绿色的手术服晃得她的鼻子又酸又涩。“家属在哪？”若不仔细听就听不见，女孩的声音虚弱得到了一种程度：“我。”“大量注射致幻药物造成了亚急性心肌炎，患者的状态很差。”</p><p class="story-paragraph">注射致幻药物…纱夏以为自己幻听了。</p><p class="story-paragraph">她的脸色堪比死人：“什么？”“而且在注射以前就受了很重的伤，尤其是脑部，”医生冷静的陈述像刀，对着她的要害一下接一下地捅：“来签手术告知，我们会尽力抢救…”</p><p class="story-paragraph">纱夏扫了一眼那张惨白的纸，突然怒不可遏。“不会有事！”</p><p class="story-paragraph">承担死亡风险的手术告知。</p><p class="story-paragraph">这是说…妈妈有可能会死。她牙齿都要咬碎了。</p><p class="story-paragraph">女孩一把扯住了对方的领子，医生是个高高大大的男性，都被纱夏拉得趔趄几步：“她不会有事！”</p><p class="story-paragraph">不能有事…</p><p class="story-paragraph">哪里冲来个男人分开了他们。</p><p class="story-paragraph dialogue">“纱夏，理智一点，”板仓把原子笔往她手里递，可是纱夏根本握不住它：“先签字，你妈妈还在里面。”</p><p class="story-paragraph">名井南在等她。</p><p class="story-paragraph">她咬着舌头，恨不得把头朝墙那边撞，强迫自己清醒过来。</p><p class="story-paragraph">眼泪扑簌簌地往下跌。</p><p class="story-paragraph">胡乱地抓住这支笔，纱夏从没写过这么丑的字，在外人看来这就是一堆没拼好的笔画，乱七八糟，还不如学龄前儿童的字漂亮。</p><p class="story-paragraph">那扇门又关上了。</p><p class="story-paragraph">纱夏觉得自己快要撑不住了。</p><p class="story-paragraph">她用手把脸捂住，却恍惚地透过指间的缝隙窥到了持镰刀的黑衣人。</p><p class="story-paragraph">惊怖如闪电般撕裂了天空，把她吓得定在原地。</p><p class="story-paragraph">这是来带走妈妈的吗？</p><p class="story-paragraph">纱夏的身形虚晃了一下，她眼前发晕。</p><p class="story-paragraph">如今女孩好像是站在幻象的边界，想和死神求情。</p><p class="story-paragraph">换我来，她在对谁祈求，把妈妈留下。</p><p class="story-paragraph">反正没了南，她也活不了。</p><p class="story-paragraph">刚刚拉架的男人还站在旁边，他看表，在考虑是不是该叫停受害人家属的悲恸。</p><p class="story-paragraph dialogue">“您是凑崎纱夏？”矢浦把证件掏给纱夏看，很有耐心地等着对方的理睬。</p><p class="story-paragraph">好像是个警察，她眼睛疼得厉害，瞧不很清楚。纱夏靠着墙才不至于往下跌，她轻轻地点头。“请您配合，需要确认一下身份。”</p><p class="story-paragraph">才发现，警官拿着什么藏在身后。她的注意力马上就被吸引了。</p><p class="story-paragraph">那是…名井南的提包。</p><p class="story-paragraph">不知道哪来的力气，纱夏去抢，矢浦没反应过来，物什就被对方用蛮力夺走。</p><p class="story-paragraph">妈妈很疼吧？南的那些伤口似乎全部长在了她身上。要是真长在她身上该多好。</p><p class="story-paragraph">有什么东西给她的灵魂开了个大洞，在今天结束以后，好像会落下无法根治的顽疾。</p><p class="story-paragraph">她痛得快死过去了。</p><p class="story-paragraph">矢浦望一下板仓，后者闭眼点头，告诉警官不必再撕开残忍的话题。</p><p class="story-paragraph">套了塑封的驾驶证、串在一起的钥匙、开封了的餐巾纸，还有褐色的，印了花纹的钱包。</p><p class="story-paragraph">纱夏一样样地掏出来看。</p><p class="story-paragraph">南的钱夹里放着她们的照片。</p><p class="story-paragraph">她记得自己和妈妈在自助拍照的亭子里接过吻。</p><p class="story-paragraph">因为交缠的气息太过炽热，心照不宣的暗示把两人的耳垂都染红了。</p><p class="story-paragraph">她凝视着照片里的南，觉得那些约定美好得像世间最引人向往的梦境。</p><p class="story-paragraph">酸楚的痛觉没能得到补偿，依然在张牙舞爪，要继续摧毁她的希望。</p><p class="story-paragraph">有什么东西掉出来，它骨碌地滚到了女孩的脚边，发出“啪嗒”的脆响，躺在了地上。</p><p class="story-paragraph">那是个御守，纱夏觉得它很眼熟。</p><p class="story-paragraph">上面印着烟花的图案，还缀了两个字。</p><p class="story-paragraph">平安。</p><p class="story-paragraph">她喉头一甜，从嗓子里吐出口血。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph dialogue">“您是代理律师？”见到板仓的第一眼，矢浦就往对方身后张望，可只来了他一个人：“家属的那台手机可以拿回去了。”</p><p class="story-paragraph dialogue">“她女儿还在医院，您给我吧。”板仓回答，他以律师的身份替昏迷中的南接到了法院的传票，也对警察在电话里说的东西很恼火，态度不怎么好。</p><p class="story-paragraph">矢浦走到门口招呼了一下，有个警卫给他拿了叠厚纸，好像是什么东西的复印件。</p><p class="story-paragraph">他接过，头朝着那边扬，小弟乖乖带上门出去了。</p><p class="story-paragraph dialogue">“名井南被传唤成嫌疑人，”板仓还没坐下就发问了：“这像话吗？”</p><p class="story-paragraph dialogue">“所以要我们向您提供案情说明。”矢浦把那摞纸搁在桌上。</p><p class="story-paragraph">板仓的声音闷闷的：“她是受害者。”</p><p class="story-paragraph dialogue">“我们做了勘察，也有分析专家到场，”警官描述起当时的情况：“案发现场的国道最近施工，下雨天的脚印和车胎印全部失效，附近也没有摄像头，缺少线索指明第三者的存在。”</p><p class="story-paragraph dialogue">“所以在场的只有两个人？”律师听出言外之意。</p><p class="story-paragraph dialogue">“对，博多的脑袋被开了个大洞。”矢浦可能看对方是个男的，把尸检结果和照片都往他面前摆。</p><p class="story-paragraph">尸体的样子很狰狞，颅骨被击碎了。</p><p class="story-paragraph">神木还完好的一只眼窝陷了下去。</p><p class="story-paragraph">以这样的身份见到同事的惨死，板仓不知如何应答。</p><p class="story-paragraph dialogue">“额头上那个不完整的印子看到了吗，”矢浦给他指：“是近距离开枪留下的焦圈。”</p><p class="story-paragraph dialogue">“用的枪，”板仓像踩了电门，他抬起头：“什么枪？”</p><p class="story-paragraph dialogue">“左轮。”矢浦翻出了那张照片。</p><p class="story-paragraph">黑色的老式手枪——</p><p class="story-paragraph dialogue">“6.5 口径的？”板仓想起英夫杀人时用的那把枪械，矢浦明白他的意思，毕竟是他捉拿英夫归案的。</p><p class="story-paragraph dialogue">“是的，”矢浦将它又收了起来：“我们把两个人的外套都脱下来了，做了射击残留物鉴定，嫌疑人的衣服测出了硝烟反应，枪上也有她的指纹。”</p><p class="story-paragraph">板仓的心一沉。</p><p class="story-paragraph">南会不会真的起杀心？</p><p class="story-paragraph">他在思考这件事的可能性，又觉得不太可能。</p><p class="story-paragraph dialogue">“在她口袋里还找到了这个。”矢浦没做主观性评论，继续让板仓了解目前的处境。律师瞥了一眼就笑出了声。</p><p class="story-paragraph dialogue">“您见过哪个弱女子可以用裁纸刀捅死一个成人体格的男性歹徒吗？”他眼光犀利：“这最多只是防身用的。”</p><p class="story-paragraph dialogue">“可能一开始是这样的，”矢浦的目光很平静，他在回忆这么些年见过的所有惨剧：“吸毒之后产生的幻觉很强烈，中间也许发生了什么改变了她的想法。”</p><p class="story-paragraph dialogue">“您是说？”板仓觉得对方的意有所指。</p><p class="story-paragraph dialogue">“死者的内裤上，”这个事情目前还只有警方知道：“有精液。”</p><p class="story-paragraph">椅子脚敲在粗糙的地面发出噪音。</p><p class="story-paragraph">板仓站起来，他的拳头砸在桌上，指节一下就红了。</p><p class="story-paragraph dialogue">“他干什么了？”</p><p class="story-paragraph">想到了南一身伤的样子…如果神木那家伙真的还在这种情况下做出禽兽不如的事…</p><p class="story-paragraph dialogue">“警部？”外面的人是怕出现什么情况，把门打开了：“怎么？”</p><p class="story-paragraph dialogue">“没事。”矢浦挥手表示没有麻烦。</p><p class="story-paragraph dialogue">“我们和医院那边联系过，刚好手术之后也做了检查，至少性器官没有被…”</p><p class="story-paragraph dialogue">“非自愿的性行为，”板仓气得发抖，直接打断对方：“如果发生了，就叫强奸。”</p><p class="story-paragraph dialogue">“所以您知道她受了什么侮辱，而且比起强奸，或者说强奸未遂，另一个人有故意杀人罪的嫌疑，”矢浦显得更加理智：“博多的包里装了很多现金，还有换了名的假身份证件。”</p><p class="story-paragraph">矢浦没说完，板仓自己补全了警官的意思。</p><p class="story-paragraph dialogue">——死者不像是要自杀的人。</p><p class="story-paragraph">检方是在推测名井会因为仇恨做出冲动的事情。</p><p class="story-paragraph">双方有过肢体冲突的痕迹很明显，再加上可能受到了性骚扰…</p><p class="story-paragraph">板仓抹了把脸。</p><p class="story-paragraph">在他眼里实属无稽之谈的罪名，去到法庭上就是有依有据的论点。</p><p class="story-paragraph">要说神木是故意营造了这种假象，也不是不可能。</p><p class="story-paragraph">可这种主张没有立足的支柱，板仓要找到证据。而且，还得准备应付最坏的情况，万一南真的杀了人…</p><p class="story-paragraph dialogue">“如果您还有什么疑问，可以现在问我。”矢浦把那叠文件递给他，果然是案情报告书，不过板仓没在警察面前翻。</p><p class="story-paragraph dialogue">“需要移交看守所吗？”板仓担心南的身体会受不了。“考虑到嫌疑人的情况，就不对她进行刑事拘留了。”</p><p class="story-paragraph">不进行拘留，他苦笑。她现在应该进重症监护室的，可是不行。南从加护病房被移到了单人病房，至少有两三个警察轮班守在门口。</p><p class="story-paragraph">只准进一个人探望，例外就是护士和医生，必须要有人来检查患者的身体情况。</p><p class="story-paragraph">手术虽然比较成功，但病人高烧不退，昏昏沉沉地没醒过来。</p><p class="story-paragraph">证据很充分，南刚好也失去意识，从立案到传唤只要了两天时间，当事人没有行动能力，板仓揽过了为下属辩护的责任。</p><p class="story-paragraph">他离开医院以后没回去过，为了这场官司，板仓在法事机构里周转，脱不开身。</p><p class="story-paragraph">本来要找奈未去看看南的情况，但对方说纱夏硬是要亲自陪着她妈妈，怎么劝也不肯走，搞得她一点用武之地都没有。</p><p class="story-paragraph">他想起那天纱夏在手术室门口呕血的那一幕，只觉得胆战心惊。</p><p class="story-paragraph">简单地算一下，女孩也已经快要四十八小时没合眼了。</p><p class="story-paragraph">纱夏不能再这样透支身体，得赶快和她说明情况。</p><p class="story-paragraph dialogue">“我知道了，”板仓应下，还有件事情要做，他伸出手：“那台手机…”</p><p class="story-paragraph">警官记得，他从上衣口袋掏出了纱夏的移动电话。</p><p class="story-paragraph dialogue">“谢谢。”</p><p class="story-paragraph">通话记录和短信应该都被复制了，不知道是谁还贴心地给手机充满了电，板仓把它收好以后准备告辞：“就这些了。”</p><p class="story-paragraph">没想到律师不打算继续将话题开展下去，矢浦闪身让意图十分明显的板仓离开，他希望自己能尽到警察的义务。</p><p class="story-paragraph dialogue">“之后还有需要的话，可以给我打电话。”</p><p class="story-paragraph">从警察局出来，板仓按灭了屏幕，觉得没必要再主动联系警部。</p><p class="story-paragraph">东京的春天回温很慢，今年的樱花都还没开好，四月份的风刮得板仓脸颊抽抽的疼。</p><p class="story-paragraph">他想抽烟，步子迈得飞快，恨不得学个瞬间转移的功夫，一秒钟坐进车里。</p><p class="story-paragraph">钥匙和火柴盒是一起摸出来的，板仓打开车门的时候嘴里已经叼了支香烟。</p><p class="story-paragraph">车里的照明光线不是很亮，他眯着眼睛浏览拿到手的文件。</p><p class="story-paragraph">被告的证词由于南的昏迷依旧是一片空白。</p><p class="story-paragraph">板仓记得很清楚，南是接了神木用纱夏手机打来的电话才走的。</p><p class="story-paragraph">中了这个陷阱的损失可谓是万分惨重，他胸口堵了团气发不出来。</p><p class="story-paragraph">烟灰落在他裤子上，火星烧着了板仓的手指。</p><p class="story-paragraph">他的视线停在某句话上。</p><p class="story-paragraph">对这条结论，板仓有个疑问。</p><p class="story-paragraph">女孩的手机在案发现场被捡到，这表明神木的的确确偷走了纱夏的东西。</p><p class="story-paragraph">他拨了南的电话，现在是纱夏在用它，因为女孩自己的被当作证物提交了。</p><p class="story-paragraph dialogue">“板仓叔叔。”那头的声音听起来很疲惫。</p><p class="story-paragraph dialogue">“纱夏，”他开口先关心了下属的情况：“你妈妈怎么样了？”</p><p class="story-paragraph">纱夏沉默一会：“还在发烧。”</p><p class="story-paragraph dialogue">“辛苦你了。”</p><p class="story-paragraph">出言安慰她以后，板仓直奔主题：“我有个事想问问，警察有找你聊过关于手机的事情吗？”</p><p class="story-paragraph dialogue">“有，”他听了对方哑得快不行的声线，决定待会不管怎么说都要让纱夏去休息一下：“问了我手机是怎么不见的。”</p><p class="story-paragraph dialogue">“你是怎么回答的？”板仓看到文件上记录的证词。</p><p class="story-paragraph dialogue">“我说被偷了。”可能想到南为此以身涉险，她说话有点带了哭腔的颤抖。</p><p class="story-paragraph dialogue">“知道小偷是谁吗？”书面材料也没有清晰地写出来，板仓觉得这里是个突破点。</p><p class="story-paragraph">是纱夏没回答，还是警察没问？</p><p class="story-paragraph">女孩肯定见过她妈妈的同事，神木贴身偷盗要冒着被认出来的风险，再说那时他已经被警方通缉了。</p><p class="story-paragraph">去大学里偷手机、再打电话给南、马上跑到废弃大楼里等她应约…</p><p class="story-paragraph">这一切真的是神木独自完成的吗？</p><p class="story-paragraph dialogue">“我不知道。”纱夏好像很懊恼。</p><p class="story-paragraph dialogue">“那个人，”他在提示女孩：“看起来是神木堂吗？”</p><p class="story-paragraph">这名字简直让纱夏怒火中烧，她有努力思考，却怎么都觉得不像。</p><p class="story-paragraph">女孩停顿的时间很长，让板仓知道这是纱夏第一次回答这个问题。</p><p class="story-paragraph dialogue">“应该不是，我听到了声音，”两天的不眠不休磨损了记忆，纱夏现在也不敢确定，具体的细节早就丢失了，她只敢说出最明显的特征：“他…腔调很奇怪，好像不是本地人。”</p><p class="story-paragraph">看来是自己押对了。</p><p class="story-paragraph">对没有嫌疑的证人，警方也无法强制询问，所以他们是想当然地就把偷窃的罪名安在了神木身上，压根就没接着发散下去。</p><p class="story-paragraph">如果能证明小偷是别人，那手机是如何被神木拿到的？</p><p class="story-paragraph">摸清楚交接的过程，说不定就能还原更真实的现场。</p><p class="story-paragraph dialogue">“我现在过来一趟。”</p><p class="story-paragraph">虽然还有一大截没抽完，但他急着按灭烟头，把汽车座椅的皮革烫出个黑点。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">南的病房在五楼最东边的这条走廊上。医院清洁工作做得好，地板砖一尘不染的，板仓没等电梯，走的安全通道上来，有点气喘。看来是上了年纪了，他埋怨自己。</p><p class="story-paragraph">灰白色好像能吸收噪音，这里一片死寂，板仓控制着皮鞋落地的力度，怕脚步声太响吵到别人。</p><p class="story-paragraph">不用再问纱夏南的房间号码了，有两个警察站在门口的那间就是，他上前，毫不意外地被拦住。</p><p class="story-paragraph dialogue">“里面已经有人了。”更高一点的那个男人先说话，可能是在空调房里待久了，他的嗓音被干燥的环境闹得喑哑。</p><p class="story-paragraph dialogue">“我是嫌疑人的代理律师，要和家属谈一下。”板仓把律师徽章和拿到的案情报告书给他验明身份，警察稍微翻了两下，和对面的同伴使了个眼色，另一个人拉开了门。他往里走，警察贴心地将推拉门又关上了。</p><p class="story-paragraph">南…</p><p class="story-paragraph">想起是自己硬要她接下这个案子的，板仓不自觉地攥住了拳头。</p><p class="story-paragraph">病人的头上缠了纱布，看厚度至少绕了两圈。</p><p class="story-paragraph">南面无血色，烧一直没退，也在出汗，有时她的嘴唇嗡动，不知在呓语些什么，但声音很模糊，好像是从很远的地方传过来的，凑近听也听不清楚。</p><p class="story-paragraph">女人左手手背上扎了针，另一端连着透明的输液瓶，挂在银色的金属架子上。</p><p class="story-paragraph">应该是维持机体运作的营养液。</p><p class="story-paragraph">纱夏坐在床的右边，她本来想握住妈妈的右手，但南那只手的小拇指也骨折了，装了小夹板固定，她怕弄疼南。</p><p class="story-paragraph">女孩在一点一点给妈妈把那些渗出来的汗水擦掉。</p><p class="story-paragraph">自己进来的声音应该很大，但纱夏连头都没有回。</p><p class="story-paragraph dialogue">“纱夏。”他唤女孩的名字，对方才望过来，却没舍得离开南的身边。</p><p class="story-paragraph">一句“还好吗？”都问不出来。</p><p class="story-paragraph">状态不能再差了…</p><p class="story-paragraph">纱夏的眼睛里生出的红血丝多到了触目惊心的地步，黑眼圈重得像挨了揍。</p><p class="story-paragraph dialogue">“你学校那边…”想起大学生还没有放假，板仓怕她学业受影响。</p><p class="story-paragraph dialogue">“联系了，”纱夏很快就把头扭回了原位，她注视着妈妈，虽然南一点要转醒的趋势都没有：“论文答辩那天过去就好。”</p><p class="story-paragraph dialogue">“我打电话叫你奈未阿姨来了，她现在在路上，”板仓把公文包搁在房间内的另一张椅子上：“你今天回去休息一下。”</p><p class="story-paragraph dialogue">“我没事。”女孩气若游丝，全靠话语的意思表示她的坚定：“我得陪她。”</p><p class="story-paragraph dialogue">“回去睡一下觉。”板仓劝她。</p><p class="story-paragraph dialogue">“她不在家我睡不着，”纱夏根本不在乎： “这里也可以睡。”</p><p class="story-paragraph dialogue">“睡在哪？” 律师环顾了室内的摆设，没看见哪里能给人躺下。</p><p class="story-paragraph">纱夏没说话，他从无言中明白了身下的凳子就是女孩口里那个“能睡的地方”。居然就这样枯坐了两天…</p><p class="story-paragraph">板仓叹了口气。</p><p class="story-paragraph dialogue">“你吃东西了吗？”</p><p class="story-paragraph dialogue">“吃了的。”纱夏的回答一点可信度都没有，他的视线落在女孩身侧。</p><p class="story-paragraph">完全没人动的盒饭孤零零地摆在一边。</p><p class="story-paragraph">他张腿迈过去，从塑料袋里拿起那碗封都没开的鳗鱼盖饭。</p><p class="story-paragraph dialogue">“这是吃了吗？”板仓又急又怕，他两下就把塑料膜拆开，掰了筷子拿着饭往纱夏手上塞。“我不饿。”纱夏眼皮都没抬一下。</p><p class="story-paragraph">行，比牛还倔。</p><p class="story-paragraph">不能再让纱夏有个什么三长两短了，南醒过来要是看到她女儿的这副鬼样子，得骂死自己。</p><p class="story-paragraph dialogue">“你妈妈知道你半死不活就开心了？”板仓知道南是纱夏的弱点，既然女孩这么在乎她，索性就用激将法：“饭也不吃觉也不睡，你是超人吗？”</p><p class="story-paragraph">纱夏沉默了，不想顶嘴。</p><p class="story-paragraph">自己只是没怎么睡觉，和妈妈比起来，她哪有南一半疼？</p><p class="story-paragraph">可以的话，她倒是真的很想有那么疼，至少可以切身地体会到南的痛楚。</p><p class="story-paragraph">而不是像现在这样。</p><p class="story-paragraph">只能眼睁睁地看着南痉挛发作…</p><p class="story-paragraph">妈妈挣扎得很厉害的时候，纱夏也必须要死死压住她扎针的那只手。</p><p class="story-paragraph">但还是有血珠溢出来了。</p><p class="story-paragraph">南为何这么痛苦？</p><p class="story-paragraph">纱夏按传唤铃，护士给南打了一管又一管镇静剂。</p><p class="story-paragraph">她还没有冷冰冰的液体有用。</p><p class="story-paragraph">住院的费用甚至也是从南的信用卡上划掉的。</p><p class="story-paragraph">仅此一件事情在她的能力范围内了。</p><p class="story-paragraph">守着南，纱夏绝不会走。“成年人还耍小孩子脾气，一点责任感都没有，你妈妈没好好教过你？”</p><p class="story-paragraph">板仓也是有孩子的人，纱夏完全把他当空气，不凶一点不行：“自己都照顾不好的人，还想保护谁？”</p><p class="story-paragraph dialogue">“和我妈妈没关系，”纱夏敬语都没用了，板仓叔叔的话让她很生气：“我没有别的办法。”</p><p class="story-paragraph dialogue">“你说外人来你不放心，但你这就是明摆着要我处理，”板仓想起那一箩筐烂事就头疼：“名井南现在还面临着杀人指控，万一你倒下去了，谁给她定夺之后的事？”</p><p class="story-paragraph">他看女孩的脸色青一阵白一阵：“你是要全权交给我？”</p><p class="story-paragraph dialogue">“杀人…指控？”板仓有种鸡同鸭讲的无力感，纱夏好像只抓到了这个词：“她杀谁了？”</p><p class="story-paragraph dialogue">“神木堂。”</p><p class="story-paragraph">女孩下意识地抬手捂住了胸口，这个回答让她替妈妈委屈。</p><p class="story-paragraph">为什么指控南杀人？她妈妈都差点死了。</p><p class="story-paragraph dialogue">“肯定是弄错了…肯定是他们弄错了，”纱夏跪在板仓面前，语无伦次：“她睡都睡不好…”</p><p class="story-paragraph">南脑袋上的伤口缝了好多针，线还没拆，口子深得她不敢再看第二次。</p><p class="story-paragraph dialogue">“我妈妈痛成这样了…”</p><p class="story-paragraph">命都是捡回来的，她怎么会杀人？</p><p class="story-paragraph">南这么能忍的性子，昏迷时都要辗转反侧地呻吟。</p><p class="story-paragraph">纱夏恨死了自己的弱小，感觉自己像是被人摁在地上痛殴，一点还手之力都没有。</p><p class="story-paragraph">她想把神木碎尸万段。</p><p class="story-paragraph">明明是他…把妈妈害成这样的。</p><p class="story-paragraph">板仓蹲下去，他去把女孩扶起来，纱夏肩膀硌得他疼，板仓才发现她瘦得吓人，好像灵魂都从身体里飞出去了。</p><p class="story-paragraph dialogue">“我也觉得是弄错了，”他庆幸自己是律师，如果南是清白的，自己一定可以用法律为她夺来个公正的结果：“所以我们不能再错了，我需要你帮我，你也不能有事。”</p><p class="story-paragraph dialogue">“怎么做？”纱夏眼里的决绝把他的心扎得好疼。</p><p class="story-paragraph">好像说要她死她都愿意似的。</p><p class="story-paragraph dialogue">“你先吃饭，”板仓再次把鳗鱼盒饭递给纱夏：“鳗鱼冷掉了会很腥。”女孩用筷子乱扒了几口，眼泪全部和白米饭混在一起，现在给她吃什么估计都尝不出味道。</p><p class="story-paragraph">有胜于无，好歹是在吃。</p><p class="story-paragraph">板仓开心太早，一半都还没吃完，纱夏就停住了。</p><p class="story-paragraph dialogue">“怎么做？”一样的问句，她真的很想知道答案。</p><p class="story-paragraph dialogue">“不吃了吗？”</p><p class="story-paragraph dialogue">“吃饱了。”纱夏拿了盖子罩着它。</p><p class="story-paragraph">板仓从口袋里掏出女孩的手机：“这个先给你。”</p><p class="story-paragraph">都是因为她的手机，再后悔也没有用了。</p><p class="story-paragraph">她眼睛一下又红了。</p><p class="story-paragraph">为什么当时没有一发现就给妈妈打电话？</p><p class="story-paragraph">只要告诉妈妈她还好，只要用一句话就能弥补的过失…</p><p class="story-paragraph">女人怎么会躺在病床上？</p><p class="story-paragraph">板仓抓住纱夏，蛮横地把手机按在她手心上。</p><p class="story-paragraph dialogue">“既然发生了，就放它过去，”这是至理名言，如果所有的精力都放在埋怨曾经上，就没人能接着往下走了：“重要的是以后。”</p><p class="story-paragraph">纱夏解锁手机，桌面是两人的合照，她掉了一滴眼泪，很快地抬手将它拭去了。</p><p class="story-paragraph">拖了这么久才和女孩解释，板仓决定给她指出最明显的矛盾，他舔了食指，飞快地把案情报告书翻到了那一页，转给纱夏看。</p><p class="story-paragraph dialogue">“检方会拿这一点来攻击我们。”纱夏看到那一行字。</p><p class="story-paragraph dialogue">——案发现场无其他证据表明除嫌疑人及被害者以外的第三者存在。</p><p class="story-paragraph dialogue">“你妈妈的指纹留在了枪上，衣服也有硝烟反应，说明开枪的时候，弹壳是朝着她的方向飞出去的，这是很有利的论据。”</p><p class="story-paragraph dialogue">“可是…”看纱夏欲言又止的样子，板仓就明白她已经知道了。</p><p class="story-paragraph dialogue">“偷我手机的人不是神木堂，”女孩的脑袋转得比他想象得要快：“如果我的手机被警察捡到，就说明那个小偷和他见过面。”</p><p class="story-paragraph">虽然不一定是在案发现场见面，但至少能证明神木不是单人作案。如果在南醒来以后，她能证实神木的同犯来过那栋大楼，纱夏的证词就有用了。</p><p class="story-paragraph">板仓是要纱夏当证人：“你要把手机被偷的这件事情完整地还原出来。”</p><p class="story-paragraph dialogue">“我们学校教学楼门口有监控摄像头，”纱夏强调：“当时我本来也想去查一下的，才过去两天，应该还保存着。”</p><p class="story-paragraph dialogue">“好，一般都放在安保室吧？”他看到纱夏点头：“我会找人去拷一份。”</p><p class="story-paragraph">板仓想把那叠报告书拿走，但纱夏没松手。</p><p class="story-paragraph dialogue">“我可以看一下吗？”女孩问：“我想知道发生了什么。”</p><p class="story-paragraph">上面会写性骚扰的事，纱夏知道的话…</p><p class="story-paragraph">对方的眼神让板仓心软了，他只好同意，于是女孩坐在凳子上，慢慢地翻起了文件。</p><p class="story-paragraph">他刚刚已经粗略地看过一遍，这会儿没挤在纱夏身边。</p><p class="story-paragraph">等奈未来了他就开车把南的女儿送回家。</p><p class="story-paragraph">他在考虑之后的计划。</p><p class="story-paragraph dialogue">“裁纸刀…”板仓听到纱夏念了这个词。</p><p class="story-paragraph">他记得警察说那是在南的口袋里找到的。</p><p class="story-paragraph dialogue">“怎么了？”板仓下意识地问。</p><p class="story-paragraph dialogue">“我妈妈是作了准备才去的，”纱夏在思忖，虽然她困得厉害，全身上下到处都疼，但是想到和南有关的事情又能很快地清醒过来：“她一直都很聪明。”</p><p class="story-paragraph">什么意思？</p><p class="story-paragraph">少女“蹭”地起身，她步子不太稳，绕到点滴液的那个方向拿了个布袋。</p><p class="story-paragraph">纱夏掏了南的内衣出来，好像是怕男人偷看，她转头。</p><p class="story-paragraph">非礼勿视，板仓连忙往其他地方瞟。还是有一点点被…是黑色的。看不出来啊，他想，南居然也会穿这种花边…</p><p class="story-paragraph">悉悉索索的声音停止了，女孩走到他面前，板仓看到她手里躺了个什么东西。</p><p class="story-paragraph">他瞪大了眼睛，像是发现了宝藏。板仓用食指和拇指将它捻起来。</p><p class="story-paragraph dialogue">——绿豆大小的窃听器。</p><p class="story-paragraph dialogue">“警察知道吗？”他小心地把它收好。</p><p class="story-paragraph dialogue">“不知道，做完手术以后护士抱出来的，”纱夏否认：“贴身衣服，所以他们没怎么仔细检查。”</p><p class="story-paragraph dialogue">“居然被你发现了，”他终于露出了个稍微轻松点的笑：“做得好。”</p><p class="story-paragraph">纱夏快频率地眨了眨眼，能发现是因为她对南的每一件内衣都很熟悉，这里突然多出个从没见过的东西，女孩一眼就看出来这是别上去的。</p><p class="story-paragraph">不过她不知道这是做什么用的，也还没和警察说，想着妈妈醒来了自然会告诉她。</p><p class="story-paragraph">如果是什么重要的东西，交给警察万一拿不回了怎么办？</p><p class="story-paragraph">于是纱夏好好地收着了。</p><p class="story-paragraph dialogue">“所以这是…”她有在猜测，南以前和自己讲过爱用的巧招，纱夏听妈妈的话总听得很认真：“类似窃听器的那种东西吗？”</p><p class="story-paragraph dialogue">“是的，”板仓不愁没事做了：“你妈妈的车钥匙在你这里吗？”</p><p class="story-paragraph dialogue">“在，”纱夏从南的提包里翻出来递给板仓：“不过警察也拿去用了，他们已经搜了一遍，没找到什么东西。”</p><p class="story-paragraph dialogue">“这么小的窃听器，如果没有转发器很容易丢失信号，”在那个鸟不拉屎的地方，板仓猜到南会把转发器安在哪里：“证据目录上没写这种东西，他们估计是没发现。”</p><p class="story-paragraph dialogue">“在我妈妈的车里？”她好像见过那个长得像路由器的电子产品，但纱夏平时对这些东西没什么兴趣，从不会过问。</p><p class="story-paragraph dialogue">“对，待会我把你送回家，再…”</p><p class="story-paragraph">她打断了叔叔：“我和你一起去。”</p><p class="story-paragraph">板仓在犹豫，纱夏该休息了，而且他不确定南从什么时候开始使用窃听器的。</p><p class="story-paragraph">万一录音的内容会刺激到女孩…</p><p class="story-paragraph">门被敲响，高个子警察拉开门，问他们这人是谁叫来的。</p><p class="story-paragraph">奈未已经到了。</p><p class="story-paragraph dialogue">“我知道车现在停在哪，而且我听完录音就回家，”纱夏让步了：“我保证。”</p><p class="story-paragraph">既然都这么说了…“好，”板仓答应了：“那带上你的东西，我们走。”</p><p class="story-paragraph">怕南不舒服，他让警察再把门关上，要奈未在外面等一等，门开着会让冷气灌进来。</p><p class="story-paragraph">女孩把她妈妈的提包拿上了。</p><p class="story-paragraph">纱夏没马上走，她好像还有话要和南说，板仓想自己是不是要回避一下，但当事人好像不在意，她直接对着南开口。</p><p class="story-paragraph dialogue">“妈妈，”看到南，纱夏嘴里吐出的话又断断续续的，她疼得厉害：“我等会就回来。”</p><p class="story-paragraph dialogue">“我会加油的，”她的眼泪还是跑出来了：“所以你也要加油醒过来…”</p><p class="story-paragraph dialogue">“我等你，”纱夏的手指摩挲着南的脸：“无论多久。”</p><p class="story-paragraph">板仓愣住了。</p><p class="story-paragraph">他突然知道纱夏的反应为何如此超乎寻常，也好像隐约明白了南为什么因一个电话就丢了理智。</p><p class="story-paragraph">他看见女孩俯下身，那个吻不偏不倚地…</p><p class="story-paragraph">落了在她妈妈的嘴唇上。</p></div>

        <h2 id="heading-chapter-16">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">消毒水把她鼻腔里的毛细血管都削薄了。</p><p class="story-paragraph">调低亮度的白炽灯还是晃得人睁不开眼，南的脑子里好像装了堆沉甸甸的石子，摇一下就嘎吱作响。她喉咙和吞了一嘴玻璃渣子似的在淌血。</p><p class="story-paragraph">南只能发出气音，双唇干到起皮，刚想说话就裂开了。</p><p class="story-paragraph">她下意识地伸舌头去舔，尝不出什么味道，只觉得那里流出来了点液体。</p><p class="story-paragraph">兴许是听到南的声音和昏睡时发出的不同，床边半趴着的那个身影马上就坐直了身体。</p><p class="story-paragraph">南只能抓到一个名字。“纱夏？”她迷迷糊糊的，看得不够清楚。</p><p class="story-paragraph">意识的丝线绕了一圈，在她的女孩身上打了个结。</p><p class="story-paragraph dialogue">“名井律师，”这个声音很耳熟：“您醒来了！”原来是奈未。</p><p class="story-paragraph dialogue">“我…”嗓子哑得厉害，她得用上气力才能提高音量。</p><p class="story-paragraph dialogue">“您先别说话，”助手按了呼叫铃：“我叫人过来。”</p><p class="story-paragraph">护士站很快就作出了反应，病人身份特殊，所以分配了专人照料，奈未见了熟悉的看护，对方手里拿了补液瓶。“打完了吗？”护士往里面张望。</p><p class="story-paragraph">没要奈未要求，她就主动退出去找主治医生。</p><p class="story-paragraph">南盯着天花板发呆。落在视网膜上的图像还有不规则的交叠，她眨眨干涩的眼睛，那些影子的分身才慢慢合在了一起。</p><p class="story-paragraph">记忆没有服帖地待在各自的位置上，几个零碎的片段没按顺序摆好。</p><p class="story-paragraph">像早些年午夜电视闪出来的雪花屏幕。</p><p class="story-paragraph">南没有精力去整理了，她就让自己漂泊在那堆杂乱的画面中。</p><p class="story-paragraph">门又被打开了，她的余光里出现了白色的袍子。通过脚步声判断，好像不止一个人。“名井小姐，”有谁在对她说话：“听得到我的声音吗？”</p><p class="story-paragraph">南轻轻嗯了一声。“如果头部能移动的话，麻烦您稍微侧一下脑袋。”对方挪了一下凳子，她感觉有阵人走动时带来的微风拂了过来。</p><p class="story-paragraph">南听话地将头往边上偏，看到个瘦小的中年男人坐在她身边。</p><p class="story-paragraph">他有点谢顶，戴了幅黑框眼睛，小胡子撇得很整齐。“我现在对您做个检查，可能要麻烦您开口说话，”那位先生从上衣口袋里掏了支笔出来，他摊开了本子：“如果哪里不舒服，我们随时停下。”</p><p class="story-paragraph dialogue">“您叫什么名字？”这是最基本的问题，确认患者能否认知自我身份。</p><p class="story-paragraph dialogue">“名井南。”她不会忘记的。幸好室内还算安静，才听得清南讲话。他把回应记录在白纸上。“今年多大了？”</p><p class="story-paragraph dialogue">“三十四岁。”和登记的出身年份相合，他身子往后倾斜，要给病人足够的空间打量身处的环境。</p><p class="story-paragraph dialogue">“您认为我们现在是在哪？”</p><p class="story-paragraph">南稍微思考了一下：“医院吗？”</p><p class="story-paragraph">看来是答对了，来人抿嘴，伸了几根手指在她面前晃：“这是几？”</p><p class="story-paragraph">食指、中指、无名指。</p><p class="story-paragraph dialogue">“三。”她回答。</p><p class="story-paragraph dialogue">“这个呢？”对方摊开了手掌。“五。”</p><p class="story-paragraph">现成的道具也有，医生拿了搁在桌上的东西摆给南看：“知道这是什么吗？”</p><p class="story-paragraph">是个长方体，上面嵌了按钮。</p><p class="story-paragraph dialogue">“遥控器。”南还是认得的。</p><p class="story-paragraph dialogue">“算清醒状态了，”他扭头对着一旁的奈未作结论：“下午去给头部做个扫描。”</p><p class="story-paragraph">医生起身，他接过了护士递过来的吊瓶，绕过病床，亲自给南换了瓶水。</p><p class="story-paragraph dialogue">“有些需要告知您的事，”男人站着，表情有点严肃：“到今天已经是您住院的第十三天，长时间卧床，等您有力气了要稍微走动一下。”</p><p class="story-paragraph">不用说南也知道，她再这样睡下去肌肉都得萎缩。</p><p class="story-paragraph dialogue">“还有，”他停顿了几秒，在犹豫要不要说，最后还是开口：“您现在是戒断毒品的初期阶段。”</p><p class="story-paragraph">毒品…</p><p class="story-paragraph">拼图还原了一块，南的心直直地往谷底坠，她想抬起手看看那个针眼在哪里。</p><p class="story-paragraph">动不了。她发现小拇指上绑了两块小夹子。原来是骨折了。</p><p class="story-paragraph">自己现在是染上毒瘾了吗？她有点呆。为什么没什么感觉呢？“清醒状态下发作会很痛苦，”医生显然是见识过：“您如果受不了一定不要死撑着，和身边的人说。”</p><p class="story-paragraph dialogue">“好。”南的鼻子有点酸，她没敢问怎么才能治好毒瘾。</p><p class="story-paragraph">还管治不治得好…</p><p class="story-paragraph">她想起了父亲的结局。</p><p class="story-paragraph">要是不落得那个下场就好了。</p><p class="story-paragraph dialogue">“拿一点口服补液给她。”医生吩咐护士，他结束了问诊，自己也往外走，病房里又只剩下奈未和南两个人了。</p><p class="story-paragraph dialogue">“我女儿。”经医生这么一提醒，南想起了神木，也想起了纱夏。</p><p class="story-paragraph">毒贩子和她说的话里有暗示，告诉了她了纱夏是安全的，但南还是不放心：“她在哪？”</p><p class="story-paragraph">奈未的目光好像有点闪躲，南没来得及辨认，助手就转过身去了。</p><p class="story-paragraph dialogue">“纱夏这两天在准备论文答辩，前两天还来看了您，”这个解释听上去还很合理的，女孩确实要毕业了：“她还和我说您醒来了就告诉她。”</p><p class="story-paragraph">听起来纱夏好像还不知道…</p><p class="story-paragraph dialogue">“嗯，”南垂下了眸子，她现在平躺在床上：“奈未，可不可以扶我起来一下？”</p><p class="story-paragraph dialogue">“会不会太勉强您…”她看到律师摇了摇头，只好两步走到她身边，手从南的腋下穿过去，施了点力气让对方攀着她坐直了身子。</p><p class="story-paragraph">病人发出了吃痛的吸气声，奈未放缓了动作。</p><p class="story-paragraph dialogue">“您没事吧？”</p><p class="story-paragraph">有点没劲，稍微缓了一下南才舒服些。</p><p class="story-paragraph dialogue">“我的手机还在吗？”喘过气来以后她问这个问题。</p><p class="story-paragraph dialogue">“在的，”奈未的视线落在房间里的另一张小圆桌上：“可是您要不要再休息会？”</p><p class="story-paragraph dialogue">“没事，”南松开了抱住对方后背的手：“可以帮我拿过来吗？”</p><p class="story-paragraph">律师的态度很坚决，奈未只能照办，刚把手机递给南，护士就又进来了。</p><p class="story-paragraph">两人的交谈是围绕着怎么使用补液的话题而展开的，南没怎么听她们的对话，她解锁了手机。</p><p class="story-paragraph">有堆垃圾短信，还有一些没备注名字的号码打来的未接来电，她没仔细看，晃了一眼就点开通讯录。南拨了女儿的号码。</p><p class="story-paragraph">响了一轮，却没人接听。</p><p class="story-paragraph">是在有事吗？</p><p class="story-paragraph">她不知道接下来怎么办。</p><p class="story-paragraph">对了…南打开那个定位软件，想看看纱夏在哪。</p><p class="story-paragraph">可是…为什么？只有她一个人的图标孤零零地闪着光。</p><p class="story-paragraph">女孩和她说了，绑定了以后，什么时候都能看到对方的位置。南用的是单手，她漫无目的地在这个界面上划来划去，不小心拉开了侧栏。</p><p class="story-paragraph">暂无绑定用户。</p><p class="story-paragraph dialogue">“奈未…”她慌了神，习惯性地用右手撑了一下身体，痛得要往下跌。“名井律师！”奈未还在看补液包装上的日文，被南吓了一跳，幸好把她扶住了。“我的衣服…”她扯着了奈未的袖子：“能不能帮我…”</p><p class="story-paragraph">南在助手给自己的那个袋子里翻出了纱夏送她的那条项链。</p><p class="story-paragraph">还有…</p><p class="story-paragraph">窃听器不见了。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">板仓拉开医院入口的玻璃门，他的大衣竟然因为走路的速度被气流撑得鼓起。</p><p class="story-paragraph">南醒了。可是…</p><p class="story-paragraph">也许她根本不想醒过来面对这一切。</p><p class="story-paragraph">他支开奈未，移步靠近了南的病床，千言万语在胸膛里翻腾，却什么话都说不出口。</p><p class="story-paragraph">板仓想让她打自己一顿，但是对方也只是就那样安静地坐着。</p><p class="story-paragraph">无论作什么补救…在南的眼里那大抵都是最轻贱的野草。</p><p class="story-paragraph">板仓闭了眼，在这两个星期，南凄厉又绝望的求饶声就盘踞在他的耳蜗里。</p><p class="story-paragraph">没有画面，只剩声音的地狱…“你现在，”他肤色偏黑，眼圈红得不够明显，但音调是哽咽的：“感觉还好吗？”</p><p class="story-paragraph dialogue">“还行。”听不出南的心情，也不知道是不是真的还行。</p><p class="story-paragraph dialogue">“和警方谈过了吗？”板仓坐在椅子上，打算问问他的下属皆客户对情况的了解度。</p><p class="story-paragraph dialogue">“嗯。”她阖眼，仿佛觉得醒着会看到可怖的人：“听说我是杀人犯。”</p><p class="story-paragraph dialogue">“你怎么说的？”板仓担心南在这种精神状态下可能会作出消极抵抗。</p><p class="story-paragraph dialogue">“我说不是我。”听到这个答案他终于放下心。</p><p class="story-paragraph">好在是同行，知道证词有多重要，也不会贸然应答。</p><p class="story-paragraph dialogue">“这就好了，”他吸了口气：“不必要说的都没说吧？”</p><p class="story-paragraph dialogue">“没有…”</p><p class="story-paragraph">南的嘴角浮了一丝自嘲的笑：“可是我不记得了，也许我真的杀了人。”</p><p class="story-paragraph">她屈了屈那只没受伤的手，好像在上面看到了血。</p><p class="story-paragraph">黏糊糊的，属于别人的血。</p><p class="story-paragraph dialogue">“你没有…”板仓被她这种神情扎痛了：“不要这么说，你是受害者。”</p><p class="story-paragraph dialogue">“我是清白的吗？”南在反问。</p><p class="story-paragraph dialogue">“当然。”他的声音不自觉地放大，却从南的眼睛里读到了绝望。</p><p class="story-paragraph">被套话了。板仓突然反应过来。</p><p class="story-paragraph dialogue">“你很肯定，”眼泪从她的脸颊上滚了下来：“连我都不记得了，你却这么肯定。”</p><p class="story-paragraph dialogue">“决定性证据…”南攥着被单，她头疼得眼睛发花：“在你手上吗？”</p><p class="story-paragraph dialogue">“提交法院了，”板仓不敢看她：“作为最关键的证物。”</p><p class="story-paragraph">南没心力再聊了，她的意识又开始溃散。</p><p class="story-paragraph">在昏过去之前，要抓紧时间问到答案。</p><p class="story-paragraph">尽管她怕得要死。</p><p class="story-paragraph dialogue">“还有谁知道？”</p><p class="story-paragraph">这种痛苦…板仓被她弄得心酸。“法院的人和我。”他想瞒一下。</p><p class="story-paragraph dialogue">“那纱夏…”南念她女儿的名字都念不顺了，吐出这两个音节的疼痛感好像把她刺得清醒点了：“为什么不接我电话？”</p><p class="story-paragraph">打了好多个。南安慰自己，可能是没看到。</p><p class="story-paragraph">在不知道拨第几个的时候，她猝然听见了忙音。</p><p class="story-paragraph">被掐断了…</p><p class="story-paragraph">她为什么藏起来不让我找到？南问这句话的声音轻得让人听不见了。</p><p class="story-paragraph">她颤抖地伸手去够什么东西，想给板仓看她女儿的态度，却握不稳它，那个套了壳子的手机又掉在床上。</p><p class="story-paragraph">医院的墙壁是冰凉的白雪颜色，板仓觉得冷。</p><p class="story-paragraph">他以前只当南是个什么都不怕的女人，忘记了她根本也是肉做的，那颗心是一样的，是温热的，跳动的。也会有软肋。他的律师何时这样低声下气过。</p><p class="story-paragraph dialogue">“还有纱夏。”瞒不过了，纱夏在车里和他一起听完了所有的录音。</p><p class="story-paragraph">他在想，一个普通人的心到底能接受多少苦痛呢？</p><p class="story-paragraph">南哭得上不来气。</p><p class="story-paragraph">她胡乱地抬手擦眼泪，白色的病号服都给沾湿了。</p><p class="story-paragraph">连一句辩解的话都没办法说，连道歉都还没有补上…</p><p class="story-paragraph">她还能在昏睡中逃跑，可是她的小女孩…</p><p class="story-paragraph">纱夏身边一个人都没有。</p><p class="story-paragraph">女儿有多爱自己…那把刀就以多强的力度往回扎。</p><p class="story-paragraph">该多痛…</p><p class="story-paragraph dialogue">“她现在…”南右手骨折了，她蜷着指节，竟用了这只手拉住了板仓：“还好吗？”</p><p class="story-paragraph dialogue">“你应该担心自己，”板仓去给她扯纸巾，病人脑袋本来就受了伤，再这样情绪起伏很容易出事：“给她点时间。”</p><p class="story-paragraph">好在南的车就停在医院。板仓一开始只是兴奋，他如愿以偿地找到了转发器。</p><p class="story-paragraph">录音是杀手锏。</p><p class="story-paragraph">他却越听越心惊，等发觉那段话里的秘密时已经晚了。</p><p class="story-paragraph">谁都没想到南藏了一件这么严重的事没说。他想阻拦的，可是不行。“纱夏，到此为…”板仓要去按停止键，被南的女儿死死地拦住了。</p><p class="story-paragraph">听到枪响的那一刻，纱夏晕过去了。</p><p class="story-paragraph">好在南的车就停在医院…</p><p class="story-paragraph">板仓抱着女孩，发了疯一样地跑。</p><p class="story-paragraph">他用肩膀撞开大门，一个不小心就跪在了地上。</p><p class="story-paragraph">但是护住了纱夏。</p><p class="story-paragraph dialogue">“帮帮…”喉咙好像被堵住了。</p><p class="story-paragraph">众人不是被他的声音吸引过来的，反是为他奇异的姿势驻足。</p><p class="story-paragraph">两个人都倒了。</p><p class="story-paragraph">板仓没办法，自责心促使他叫了太太来照顾纱夏。</p><p class="story-paragraph">南的父亲…</p><p class="story-paragraph">早知道这就是她对毒品讳莫如深的理由，早知她背负着这样的过去…</p><p class="story-paragraph">低血糖导致了纱夏的昏睡，等她体力恢复好了就能醒来。</p><p class="story-paragraph dialogue">“妈妈…”她在梦境里呓语，水珠落在白色的枕巾上，又在翻身的时候被无意地蹭得没了踪迹。</p><p class="story-paragraph">板仓怔怔地站在床边。</p><p class="story-paragraph">纱夏要找的人是南…还是她的亲生母亲？</p><p class="story-paragraph">男人抬起了眼皮，这个漂亮的女孩就像罚站一样矗在原地。</p><p class="story-paragraph">她在门口守了很久了。</p><p class="story-paragraph">兴许是对这个在里面坐了两天的，并且也是病人女儿的家属很有印象。即使里面已经有人看护了，警察也起了怜心，想放她进去。</p><p class="story-paragraph">他的手刚刚放到门上，就听见对方的声音。</p><p class="story-paragraph dialogue">“不用，”纱夏盯着那扇小小的玻璃窗：“我该走了。”</p><p class="story-paragraph">她倒退了几步。</p><p class="story-paragraph">一直萦绕在心头的疑惑。</p><p class="story-paragraph">南为何收养她？</p><p class="story-paragraph">就像长大了以后，纱夏也猜不出个究竟的问题。</p><p class="story-paragraph">关于南到底爱不爱她的问题…</p><p class="story-paragraph">这个谜底其实很简单。</p><p class="story-paragraph">不是吗？</p><p class="story-paragraph dialogue">“我要问你一件事情。”板仓看着南，虽然女人身上再没有流血的口子，但她此时几乎是鲜血淋漓的模样。</p><p class="story-paragraph dialogue">“你说吧。”南什么时候不忍，忍了这么久，斧头落在她身上都一声不吭地挺过来了。</p><p class="story-paragraph">再也骗不了人，所以无所谓了。</p><p class="story-paragraph dialogue">“纱夏知道你受伤以后很难过，”还吐血了，板仓隐去了这句话：“她守了你两天两夜。”</p><p class="story-paragraph">何德何能…</p><p class="story-paragraph">她何德何能…</p><p class="story-paragraph">上天为何把折磨她和纱夏当成了一场有趣的游戏？</p><p class="story-paragraph dialogue">“你和你女儿，”那个吻如今完完全全地被板仓记着：“到底是什么关系？”</p><p class="story-paragraph">这个问题让南惨笑出声，她想起了纱夏的那个承诺。</p><p class="story-paragraph">如今什么光都照不亮她黑漆漆的瞳仁了。</p><p class="story-paragraph dialogue">“以前…”南用了个正确的时间副词。</p><p class="story-paragraph">她第一次这么诚实。</p><p class="story-paragraph dialogue">“纱夏是我的爱人。”</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">她把手机关了一天，谁都没联系。纱夏睡在家里，她躲进了被子。</p><p class="story-paragraph">这里是为了什么而存在的？</p><p class="story-paragraph">地板好像都是谎话的辞藻拼起来的积木。</p><p class="story-paragraph">踩上去好像会陷落，会摔死。</p><p class="story-paragraph">她仅仅是刚晓得了这事的真相，而南呢？</p><p class="story-paragraph">十二年？</p><p class="story-paragraph">纱夏的大脑停摆，简单的加减她都得不出完美的结果。</p><p class="story-paragraph">女孩掰着指头去算，她遇见妈妈的时候是十岁。</p><p class="story-paragraph">现在刚满二十二岁。</p><p class="story-paragraph">十二年…</p><p class="story-paragraph">真的是十二年。</p><p class="story-paragraph">她们在一起的每一天…</p><p class="story-paragraph">南对此都是一清二楚的。</p><p class="story-paragraph">如果不发生这些，她还要继续骗自己多久？</p><p class="story-paragraph">既然一早就知晓这一切…</p><p class="story-paragraph">纱夏终于知道妈妈眼睛里摸不透的情绪是什么了。</p><p class="story-paragraph">是胆小、是恐惧，是…内疚。</p><p class="story-paragraph">不敢轻易承诺的原因，是因为南从没把她们的未来当作一个可实施的计划考虑。</p><p class="story-paragraph">南教了她好多事，教她怎么相信别人、教她怎么保护自己、教她怎么认真处事…</p><p class="story-paragraph">甚至亲自上阵，教会了她怎么爱。</p><p class="story-paragraph">这是也你教给我的吗？</p><p class="story-paragraph">妈妈。</p><p class="story-paragraph">知道我爱你的时候，你很爽快吗？为何要让我爱上你？</p><p class="story-paragraph">南是和自己有血仇之人的女儿。</p><p class="story-paragraph">天大的笑话。</p><p class="story-paragraph">纱夏一阵心绞痛，疼得蜷成了一团。</p><p class="story-paragraph">存在就是错误的。</p><p class="story-paragraph">她的存在。</p><p class="story-paragraph">如果当时也和父母一起死了，没有苟活下来该多好？</p><p class="story-paragraph">至少这份责难不是她带给南的，她也不用带着对亲生父母的愧意这样挣扎。</p><p class="story-paragraph">不能骂谁，也不能怪谁。</p><p class="story-paragraph">若南虐待她、欺负她、打她，她就能理直气壮地将爱转变成恨。</p><p class="story-paragraph">可是不行。</p><p class="story-paragraph">南不仅没有这样，还视她为己出，把一切最好的东西都捧到她面前。</p><p class="story-paragraph">纱夏若是要她摘天上的月亮，她也能为自己去试一试。</p><p class="story-paragraph">恨不能恨。</p><p class="story-paragraph">她很想去问妈妈。</p><p class="story-paragraph">你有没有爱过我？</p><p class="story-paragraph">哪怕是一瞬间…</p><p class="story-paragraph">不觉得是亏欠我，而是发自内心地爱我。</p><p class="story-paragraph">这些问题的答案，纱夏没办法去讨要。</p><p class="story-paragraph">板仓给她留了语音讯息。</p><p class="story-paragraph">怕他担心，纱夏在出院的时候就给叔叔打过电话了，和他说了自己要先回家整理一下东西。</p><p class="story-paragraph">在听留言以前…</p><p class="story-paragraph">纱夏打开了定位软件。</p><p class="story-paragraph">南手机的位置一直停在医院。等她醒过来，也没必要再用了。</p><p class="story-paragraph">纱夏的眼泪爬了一脸，连按住妈妈发光的那个名字都难。</p><p class="story-paragraph dialogue">‘Mina’</p><p class="story-paragraph">她把南从列表里删除了。</p><p class="story-paragraph">纱夏做完这些，才点那条两分钟左右时长的消息，将听筒靠在耳边。</p><p class="story-paragraph">板仓叔叔说妈妈还好，头上的纱布卸了，线也拆掉了，医生说，如果恢复得好，长好了头发以后就看不出留下的疤痕。</p><p class="story-paragraph">最后一句话，他要纱夏考虑一下裁判结束以后戒毒的事。“你妈妈现在没醒来，暂时用药物控制，”板仓停顿：“医生建议等外伤好了以后，就要移到戒毒所。”</p><p class="story-paragraph">戒毒…</p><p class="story-paragraph">纱夏还没想得那么远。</p><p class="story-paragraph">怎么上法庭作证，怎么再次面对那段难堪的过去对她而言都是想要逃避的怖事。</p><p class="story-paragraph">女孩都快忘了南在进到医院之前经历了什么。</p><p class="story-paragraph">那个偷她手机、侮辱她妈妈的混蛋。</p><p class="story-paragraph">还有给南注射毒品的神木。</p><p class="story-paragraph">她埋在那段棉纺织成的布料堆里，只是颤抖。</p><p class="story-paragraph">没声音。</p><p class="story-paragraph">不知道是什么让她更崩溃。</p><p class="story-paragraph">是妈妈温吞又磨人的欺骗…</p><p class="story-paragraph">还是她为了一个与自己有关的谎言就中了圈套，落得个若涉渊水的处境。</p><p class="story-paragraph">两份标靶不一的疼痛要撕裂纱夏的心脏了，灵魂好像对半切开。</p><p class="story-paragraph">卧室的窗帘被她拉得很紧，女孩还能在枕头上嗅到南的发香味。</p><p class="story-paragraph">她没有别的地方可以去，要是把妈妈弄丢了…</p><p class="story-paragraph">纱夏做梦的次数越来越频繁。</p><p class="story-paragraph">她梦到南倒在地上，梦到她惊恐地尖叫，梦到她念自己的名字。再来就像那段录音原原本本记下来的那样。</p><p class="story-paragraph">梦到南求自己救她。</p><p class="story-paragraph">和真正发生了的情节那样，在梦里，纱夏每次也都会迟一步。</p><p class="story-paragraph">不过有些细小的更改。</p><p class="story-paragraph">等她赶来的时候，妈妈已经没有呼吸了。</p><p class="story-paragraph">纱夏怕极了，为了不见到南的绝境，她就坐在黑暗里发怵。</p><p class="story-paragraph">不跌进梦里，就不会看着南死去。</p><p class="story-paragraph">透过帘子拉不拢的缝隙窥到日月轮番换位的爬坡。</p><p class="story-paragraph">什么时候是醒着的，什么时候又睡着了？</p><p class="story-paragraph">女孩开始分不太清梦和现实的交界。</p><p class="story-paragraph">痛觉起不到辨识的作用。</p><p class="story-paragraph">因为纱夏在梦里也会疼，疼得一抽一抽的，好像有东西在消耗她的生命，在吞没她的活力。</p><p class="story-paragraph">那是和现实生活中遇见过的，没什么两样的疼痛。</p><p class="story-paragraph">纱夏醒着，能像个活人一样感受到饥渴的时候，也一步都不想往外走。</p><p class="story-paragraph">她就吃放在房间里的桶装曲奇，渴了挪到洗手间，打开水龙头对着喝。</p><p class="story-paragraph">纱夏偶尔能从心跳的疼痛里获取一丝慰藉，好像从这种扭曲的共同坠落中找到了快意。</p><p class="story-paragraph">自己现在也是病人了。</p><p class="story-paragraph">这样…她就能和南一起痛了。</p><p class="story-paragraph">丢了时间流动的参照物，如果不是打开了手机瞧见日期跳动的数差，她不知道自己就这样浑浑噩噩地过了快一个星期。</p><p class="story-paragraph">饼干她吃完了，虽然本来也没剩多少，但纱夏的食欲很差，吃不了几块。</p><p class="story-paragraph">可是…</p><p class="story-paragraph">想起板仓叔叔的教训，纱夏不知哪来的劲，硬是吊了口气打开了房门。</p><p class="story-paragraph">上午十点。出太阳了，在黑暗里呆久了以后反而不太适应这份强光，她眯了一会儿眼才睁开。</p><p class="story-paragraph">光束从窗户的格子里射进来，女孩赤脚走在地上，踏上发亮的木地板，脚窝觉着暖洋洋的。</p><p class="story-paragraph">纱夏拉开冰箱门。</p><p class="story-paragraph">果不其然，她在里面看到开封了的、用夹子夹好的燕麦，还有冷藏的牛奶。</p><p class="story-paragraph">她在厨房里拿了个碗，往里面倒了一点粗粮，正要接着加东西。</p><p class="story-paragraph dialogue">“就吃这个？”</p><p class="story-paragraph">这声音是…</p><p class="story-paragraph">纱夏猛地回过头。</p><p class="story-paragraph">她看到南倚在墙壁上，斜着脑袋望向自己。</p><p class="story-paragraph">女人穿了一件薄衬衫，袖子挽了起来，露了纤长漂亮的胳膊在外面。</p><p class="story-paragraph">南的脸上一点血渍都没有，睁着明亮亮的眼睛，眸子里盛了玻璃冰块一样澄澈的笑意。</p><p class="story-paragraph">妈妈…</p><p class="story-paragraph">这才是她的表情，永远不急不慢的。</p><p class="story-paragraph dialogue">“和你说了不能直接喝冷的，”南没管发愣的女儿，绕到她身旁，从这人手里接过那盒牛奶：“你肠胃本来就不好，万一生病了怎么办？”</p><p class="story-paragraph">我已经生病了。</p><p class="story-paragraph">她有点无奈，却不愿意为了自己的事浪费她们两交谈的时间，也不愿意让南担心。</p><p class="story-paragraph">纱夏想抱住妈妈撒娇，像以前一样赖皮找借口，说这样方便。</p><p class="story-paragraph dialogue">“好。”所以这次她一口答应，好像觉得这就是南所希冀看到的。</p><p class="story-paragraph dialogue">“以后一定不会了。”</p><p class="story-paragraph">这样的应答似乎让妈妈有点惊讶。</p><p class="story-paragraph">南的笑容很清浅，她转身要去拿装牛奶的玻璃杯，纱夏伸手把她抓住了。</p><p class="story-paragraph dialogue">“怎么了？”妈妈挑起了眉毛，迎上她的视线。</p><p class="story-paragraph">你…爱我吗？纱夏没出声，在南的眼神里找这个问题的答案。</p><p class="story-paragraph">但她从未曾参透妈妈的真正想法，又怎能在这时顿悟她的心意。</p><p class="story-paragraph">这是一个无解的命题。</p><p class="story-paragraph">倒映在南瞳孔里的情感不清不楚，甚至比之前看到的还要模糊。</p><p class="story-paragraph">纱夏往前走了一步，想抓到个破绽。</p><p class="story-paragraph">哗啦——</p><p class="story-paragraph">倾斜的角度太大，被冻得发硬的谷物从撕开的包装袋里撒出来。</p><p class="story-paragraph">她像突然惊醒，看到了被自己倒了一地的麦片。</p><p class="story-paragraph">牛奶还好端端地放在桌上。</p><p class="story-paragraph">南不见了。</p><p class="story-paragraph">这是真的吗？</p><p class="story-paragraph">她神情木讷，继续做着手上的事情。</p><p class="story-paragraph">女孩听着器皿一点点被盛满的声音——</p><p class="story-paragraph">直到冰牛奶的高度盖过了麦片。</p><p class="story-paragraph">妈妈没有回来。</p><p class="story-paragraph">原来是她看错了。</p></div>

        <h2 id="heading-chapter-17">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">傍晚时分，病房里的窗户被打开了点缝，有暖洋洋的微风溜了进来。</p><p class="story-paragraph">已经等了半小时了。输液袋的滴速被调慢，点滴往下落的动静好像是囚牢里的犯人被处决凌迟以后溅起的血。</p><p class="story-paragraph dialogue">“她不来了吗？”南在沉默里发问。</p><p class="story-paragraph">托板仓和女儿说了，想在今天见面聊聊案子的事。</p><p class="story-paragraph dialogue">“我给她发了消息，如果她没收到…”律师话里话外的意思都是肯定。</p><p class="story-paragraph">南凝望着自己的指尖，她微微拢了眉。</p><p class="story-paragraph">纱夏不想见到她。</p><p class="story-paragraph">早知如此，还不如不抛出邀请，也不用这么直截了当地接住她的拒绝。</p><p class="story-paragraph">一直以来都是她借母亲的身份之便在强人所难。</p><p class="story-paragraph">所以南能理解纱夏。</p><p class="story-paragraph dialogue">“我们先说吧。”女人的神色很疲倦，她偏头看了看金黄色的天空，再迟点就要到晚上了：“别耽误你时间。”</p><p class="story-paragraph">在开始之前，板仓还想再劝劝南。</p><p class="story-paragraph dialogue">“你确定你要去庭审吗？”他不太放心，病人的身体还没恢复好。</p><p class="story-paragraph dialogue">“确定。”南知道检方也要放一次录音，肯定要拿以前发生的事来动摇女儿。</p><p class="story-paragraph">就算再不堪，也不能让纱夏一个人面对。</p><p class="story-paragraph">由她造成的后果，必须要她亲自摆平。</p><p class="story-paragraph dialogue">“证人不会全程旁听，但被告没有意外情况不能休息，”板仓听护士说南这两天已经犯过一次毒瘾，好像疼得很厉害，疼得身体都抻不直，打了针才安定下来：“长时间的审判，你还是别出席了。”</p><p class="story-paragraph dialogue">“我会去的。”斩钉截铁的语气。</p><p class="story-paragraph">板仓有时怀疑南和纱夏是不是亲母女，连脾气一模一样的倔。</p><p class="story-paragraph">以这种关系相处的恋人…</p><p class="story-paragraph">他回忆起南以纱夏作借口缺席的一切应酬。</p><p class="story-paragraph">板仓总觉得是她们母女感情好，但是现在想来又感觉哪里怪怪的。</p><p class="story-paragraph">原来那都是忙里偷闲的借口。</p><p class="story-paragraph">南要和小情人私会。可在纱夏还小的时候，律师也经常为了女儿拒绝酒局。</p><p class="story-paragraph">所以，到底是什么时候…</p><p class="story-paragraph dialogue">“你和纱夏，”没仔细思考，男人直接把这个问题问出来了：“发展到什么地步了？”</p><p class="story-paragraph">南刚打开医生调的葡萄糖溶液喝了一口，听了这话被呛得不轻。</p><p class="story-paragraph dialogue">“咳…”她接过板仓递来的纸巾，耳朵被闹得有点红。</p><p class="story-paragraph dialogue">“不好意思，我不问了。”</p><p class="story-paragraph">太不礼貌了，板仓反应过来以后也有点窘迫。</p><p class="story-paragraph dialogue">“流程和你给…我的那个文件写得差不多吧？”南又轻咳了几下才缓好神，她避开了老板的问话。</p><p class="story-paragraph dialogue">“差不多的，你都看完了吗？”板仓怕她最近精神不好，没看得那么仔细：“需不需要我再和你解释？”</p><p class="story-paragraph dialogue">“五个证人，”南提起这个，报告书上没写明姓名，她知道女儿肯定是其中一个：“还有哪些人？”</p><p class="story-paragraph dialogue">“纱夏说她手机被偷的时候有个同学在身边，”板仓有点小心地把南的女儿和这件连锁事件的开端连在了一起：“我看了监控，确实是这样。”</p><p class="story-paragraph">纱夏是手机被窃的当事人，但被告亲属和朋友的证言可信度也许会被质疑。</p><p class="story-paragraph dialogue">“这样。”南的手指搁在白纸上摩挲。</p><p class="story-paragraph">女孩的朋友也可以帮忙作证。</p><p class="story-paragraph">这是好事，她却笑不出来。</p><p class="story-paragraph">不仅没能骗过纱夏，还要又让一个人来观摩她的耻。</p><p class="story-paragraph">南四年来是第一次这么清醒。</p><p class="story-paragraph">察觉到对方情绪低落，板仓连忙转移话题。</p><p class="story-paragraph dialogue">“有个警察，”他把南想知道的和盘托出：“是第一批赶到案发现场的人之一，负责证实当时的情况。”</p><p class="story-paragraph dialogue">“听起来好像不是和我们一边的。”南觉得警方那边肯定要反复强调她有嫌疑。</p><p class="story-paragraph">板仓在翻手上的文件：“不管别人，反正我们不能输。”</p><p class="story-paragraph dialogue">“打算怎么为我辩护，”面对着这个律政界曾经的风云人物，南忍不住调侃他：“可以让我无罪释放吗？”</p><p class="story-paragraph dialogue">“当然。”板仓的口吻云淡风轻，就好像这个问题要是“你可以用两条腿走路吗？”才能理所应当地回应出的“当然”。“另外那个在场的男人说了一句‘会很痛’，”他指了指那条被整理出来的文字：“你那个时候晕过去了，这很显然是对神木讲的话。”</p><p class="story-paragraph">而且…</p><p class="story-paragraph dialogue">“‘我绝对不会站上被告的席位’，”律师一字一句地念出来，不屑地嗤笑出声：“还真是高傲。”</p><p class="story-paragraph dialogue">“我知道的，”南在被问询证词的时候听到了警方的那份拷贝资料：“要全部靠录音吗？”</p><p class="story-paragraph">神木确实是有很强的自杀倾向。</p><p class="story-paragraph">说起这个…</p><p class="story-paragraph">南的思绪一下飘远了。</p><p class="story-paragraph">死了也挺好的，不用再人不人鬼不鬼地活着。</p><p class="story-paragraph">她想起了毒瘾发作时那阵能磨碎骨头的痒，痒到她想跪着开口求人给她点什么东西…</p><p class="story-paragraph">护士给自己打了美沙酮。</p><p class="story-paragraph">尽管医生早就警告过，这种药如果控制不好用量就是另一种毒品，但她真的忍不住。</p><p class="story-paragraph">变成了原来最看不起的人…</p><p class="story-paragraph">能为一时的快感抛弃自尊的人。</p><p class="story-paragraph">录音的最后一段还有神木暧昧的喘息声，这也被女儿听见了吧。</p><p class="story-paragraph">疑似性骚扰、猥亵…</p><p class="story-paragraph">身体的报告单子没有显示性侵留下的痕迹，但纱夏要是觉得她脏了、嫌弃她了…</p><p class="story-paragraph">也没办法。</p><p class="story-paragraph">她自己都嫌弃自己，还有什么资格要求女孩继续对她的身体抱有纯真的热情呢。</p><p class="story-paragraph">南释然地笑笑。</p><p class="story-paragraph">女儿不来也好，不用看她这个样子。</p><p class="story-paragraph dialogue">“会好起来的，”板仓无法忽视南眼里的悲哀，他能做的也只有安慰下属：“先把这一关跨过去。”</p><p class="story-paragraph">南没说话。</p><p class="story-paragraph dialogue">“除了录音，”律师在掏口袋，给她看手机：“一共五个证人，我刚刚只说了三个。”“我还以为你不想说剩下的人是谁。”女人叹了口气，话题又回到正轨。</p><p class="story-paragraph">板仓点开的照片是张合照，两个男人都剃光了头发，身型骨瘦嶙峋，但面色挺红润。</p><p class="story-paragraph">她盯着照片看了一会。</p><p class="story-paragraph dialogue">“这是…”南好像猜到了。</p><p class="story-paragraph dialogue">“主动吸食伯利恒的瘾君子，”板仓把手机塞回去：“也是主动戒毒的人。”</p><p class="story-paragraph dialogue">“你是怎么找到他们的？”她有点好奇。</p><p class="story-paragraph">戒毒所人这么多，无论是吸食海洛因还是大麻的都有…</p><p class="story-paragraph">再加上有些人患了艾滋，要这么明确地揪出吸食新型毒品的人无异于海底捞针。</p><p class="story-paragraph dialogue">“忘了吗？”他想起伯利恒的主犯，说这话时有点愧意：“你还有个客户。”</p><p class="story-paragraph dialogue">“福田英夫，”南恍悟，终于有了些律师的样子，还很关心后续的发展：“现在这个案子给谁了？”</p><p class="story-paragraph dialogue">“斋藤。”板仓淡然自若的态度把南逗得稍微开心了点。</p><p class="story-paragraph">她知道这两人关系也很好，看来是动了私交。</p><p class="story-paragraph dialogue">“你利用斋藤律师，”南抓着了老板的尾巴，板仓很少插手别人的案子的，但这次他一而再再而三地破例：“是不是看了福田英夫的自白？”</p><p class="story-paragraph">供货商都被抓了，客户还能找不到？</p><p class="story-paragraph dialogue">“你别管，”他挥挥手：“反正说明了一下情况，只要他们描述吸食伯利恒以后的感觉就好了。”</p><p class="story-paragraph dialogue">“真的有用吗？”南不可置否：“吸毒的人证词效力…”</p><p class="story-paragraph dialogue">“总不可能抓个人现吸，”板仓打断她：“再加上录音里你一句话都没说的客观事实，会有用的。”</p><p class="story-paragraph">吸食低纯度的伯利恒都会在短时间内动弹不得，何况是高纯度的。</p><p class="story-paragraph">被迫注射毒品的女人还身负重伤，在这种情况下若要控诉南是杀手…</p><p class="story-paragraph">实在是太不合逻辑了。</p><p class="story-paragraph dialogue">“费了很大力气吧。”又找证人，又要游说，还天天管她的事…</p><p class="story-paragraph">南的歉意让板仓无端地烦躁起来。</p><p class="story-paragraph dialogue">“是很多，”他回答，因利乘便地抛了句话：“所以你欠我人情。”“你知道的，”女人在自弃，她隐去了另一个主体：“我不一定戒得掉。”</p><p class="story-paragraph">就连学生时代那么认真对待的法律也要离她而去了。</p><p class="story-paragraph dialogue">“我也许没办法再当你的律师了。”</p><p class="story-paragraph dialogue">“工作的问题，”板仓知道这事的起因也有他的一份过失，而且他的过失占比还不少：“我是老板，你走你留我说了算。”</p><p class="story-paragraph">南张张嘴，她有点鼻酸。</p><p class="story-paragraph">要是犯了毒瘾，她还能做什么呢？</p><p class="story-paragraph">已经体会过一次了。</p><p class="story-paragraph">挺得了这次，还有下次，下下次。</p><p class="story-paragraph">又能撑多久？</p><p class="story-paragraph dialogue">“想要报答我，”板仓低头再检查还有什么要和南报备的：“就不要再说丧气话了。”</p><p class="story-paragraph">她垂了眼帘。</p><p class="story-paragraph">是啊，还有纱夏要管。</p><p class="story-paragraph">虽然对方可能不愿意再把她当妈妈了…</p><p class="story-paragraph">可是，纱夏如果过得不好，她死也不会瞑目。</p><p class="story-paragraph">两个人就这样默然坐着，谁都没说话。</p><p class="story-paragraph">不知道过了多久，可能只是好几分钟以后，病房入口那突然有点细碎的声响，板仓离门近，他下意识地看了一眼。</p><p class="story-paragraph">南发现男人的眼睛睁大了一点点。</p><p class="story-paragraph">好像有谁在那边。</p><p class="story-paragraph dialogue">“有人来了吗？”南问出声，她不自禁地坐直了身体，眼里的希望一点点地又燃了起来。</p><p class="story-paragraph">会是…</p><p class="story-paragraph">女人就像孩童一样局促。</p><p class="story-paragraph">板仓眨眨眼，他很快把头偏了回来：“没人，外面的警察不小心弄的。”</p><p class="story-paragraph">南躺了下去，刚刚亮起来的眸子没了生气。“关于你个人权利受损的方面，我们可以做点文章。”这是最后一件要说的事了，板仓摸着自己的后颈，转了转脖子。</p><p class="story-paragraph dialogue">“我的个人权利…”南想不太出来，她现在脑子动得不是很快，是用药的后遗症。</p><p class="story-paragraph dialogue">“做完脑部手术以后要进重症监护室的，”板仓提醒她：“那群人说你情况稳定，就一直把你关在这里。”</p><p class="story-paragraph dialogue">“医生也这么觉得？”南显然是知道答案的。</p><p class="story-paragraph dialogue">“没有，瞎编的而已，”板仓把文件合上：“昏了十三天才醒，这是情况稳定吗？”</p><p class="story-paragraph">她笑了笑，态度模棱两可，不过肯定也赞同地方用点小伎俩转移庭审的重心。</p><p class="story-paragraph dialogue">“开庭时间快到了，立案到现在过了三个星期，”板仓打开了电子日历：“等法院传票下来我会通知你。”</p><p class="story-paragraph dialogue">“好，”老板已经站起来了，南知道他今天在这里呆了很久，该回去了：“那到时候联系我。”</p><p class="story-paragraph dialogue">“嗯，”板仓拿上包：“真的不用奈未来陪你吗？”</p><p class="story-paragraph dialogue">“我已经可以走路了，”南拒绝了：“还有护士，不用麻烦别人。”</p><p class="story-paragraph">虽然很想再同南说点什么，但是…</p><p class="story-paragraph dialogue">“好，那你照顾好自己，”他往外走，和南道别：“有什么困难找医生，或者给我打电话。”</p><p class="story-paragraph">女孩刚刚在门口，为了阻止他出声，把头摇得像波浪鼓一样。</p><p class="story-paragraph">板仓安慰自己，还没过多久，说不定现在出去…</p><p class="story-paragraph">他还可以碰见纱夏。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">南可以不吃流食了，但她没什么胃口。</p><p class="story-paragraph">她按了传唤铃把护士叫来，说想喝粥，没过多久有人就端了碗，餐具全是一次性的，用完就能扔。</p><p class="story-paragraph">奈未三四天以前被她支回去了。</p><p class="story-paragraph">南用的借口很简单——这是她的工作助手，不是私人生活助手。</p><p class="story-paragraph">奈未没有义务像个佣人那样伺候她。</p><p class="story-paragraph">能下床走动的话，就不需要别人照顾了。</p><p class="story-paragraph">昨天是让护士给她洗的澡。</p><p class="story-paragraph">南也没请看护，她很清楚，要是自己有个三长两短，外面的警察会先紧张。少添点麻烦吧，已经够乱了。</p><p class="story-paragraph">她用勺子把熬得烂糊的粥往嘴里送，今天厨师好像把火力控制得很。</p><p class="story-paragraph">医院的餐食难得有合心意的，所以病人吃得还算满足。</p><p class="story-paragraph">天气终于开始转暖，不过没驱走南身上的寒意。</p><p class="story-paragraph">现在天还亮着，一旦进入夜晚…</p><p class="story-paragraph">毒瘾和精神上的恐惧会轮番地侵袭她。</p><p class="story-paragraph">不知道发作的时间，更不知道下一次要迎接多少痛苦。</p><p class="story-paragraph">真的是一个人在河里摸着石头走路。</p><p class="story-paragraph">她把最后一口粥扒进嘴里，掉了滴泪。</p><p class="story-paragraph">纱夏现在还会等她回来吗？</p><p class="story-paragraph">碗被南摆在一边，她瞥见桌上搁着的那条项链。</p><p class="story-paragraph">女孩送她的生日礼物。</p><p class="story-paragraph">因为要做各种扫描，没办法戴金属饰品，摘来摘去反而容易弄掉。</p><p class="story-paragraph">现在倒是没那么多检查等着南了，但她的手又受了伤，扣不上扣子。</p><p class="story-paragraph">这是纱夏送她的项链，南不想让别人为自己戴上。</p><p class="story-paragraph">那颗绿松石好像在宣誓一种难以名状的诀别。</p><p class="story-paragraph">南越想越伤心，干脆偏过头不再看。</p><p class="story-paragraph">她透过窗子发现，真的快到晚上了。</p><p class="story-paragraph">记起自己今天还没出去活动，才吃了饭就窝在床上。</p><p class="story-paragraph">南决定下去走走。</p><p class="story-paragraph">她往左边绕，吊瓶和拖鞋都在那边。</p><p class="story-paragraph">女人坐了一会儿，等到腿有点劲了才起身，她膝盖上的伤口虽然好得差不多，却还是有点疼。</p><p class="story-paragraph dialogue">“名井小姐…”晚饭时间，留班的警察只剩一个，是个年轻些的：“您要去哪？”</p><p class="story-paragraph dialogue">“出来透气。”南扶着自己的点滴架。外面的空气好像和里面的没什么两样。</p><p class="story-paragraph">嫌疑人单独出去。虽然她看上去一点都不危险，年轻警官还是不太放心。加之他也觉得南可怜，便自告奋勇地起身：“介意我陪您吗？”</p><p class="story-paragraph">是怕她跑。</p><p class="story-paragraph">南有点无奈，但明白这是对方的职责。</p><p class="story-paragraph">万一毒瘾又发作了，还有个人能帮她叫医生。</p><p class="story-paragraph">她轻轻摇头表示无所谓，允许警察跟着自己。</p><p class="story-paragraph">小年轻从她手里接过了装了轮子的点滴架，为了不让吊瓶不小心脱落，这位警察把它固定得更死了些。</p><p class="story-paragraph">这层楼人不是很多，她这几天有精力就会闲逛。</p><p class="story-paragraph">现在很安静，大多房间的门都是掩上的。</p><p class="story-paragraph">南就这样拖着步子，从那边逛到这边，又绕原路回去。</p><p class="story-paragraph">在大家都休息的当，放眼望过去什么都没有，到处是空荡荡的，几间掩了门的房间偶尔传出一两声机械滴答的响。</p><p class="story-paragraph">可是…很奇怪。</p><p class="story-paragraph">她总觉得有人在看着她。</p><p class="story-paragraph">那种目光没有攻击性，反而很温柔。</p><p class="story-paragraph">是想要把她裹起来的那种…</p><p class="story-paragraph">和水浪一般柔软的眼神。</p><p class="story-paragraph">对方的脚步声很轻。</p><p class="story-paragraph">这好像是她很了解，很了解的人。</p><p class="story-paragraph">连她身边的警察都没发现，是自己听错了吗？</p><p class="story-paragraph">南不觉得怕，她甚至刻意走到这层楼最偏僻的走廊。</p><p class="story-paragraph">为了确定不是幻觉，她在拐角的时候停顿了。</p><p class="story-paragraph dialogue">“嗒”。鞋跟急停在地上撞出的声响。</p><p class="story-paragraph">她的眼圈几乎是一瞬间就红了。</p><p class="story-paragraph dialogue">“抱歉，”南开腔了，她对着警察微笑，是那种谁都无法拒绝的笑容：“我突然有点渴，能麻烦您帮我拿水杯来吗？”</p><p class="story-paragraph">男生有点发愣，又意识到自己的目光很冒犯，忙撇下眼睛。</p><p class="story-paragraph dialogue">“在靠床头的柜子上。”她望着对方的背影加了一句。</p><p class="story-paragraph">支开了警察。现在就只剩她一个人。</p><p class="story-paragraph">或者…是两个人。</p><p class="story-paragraph">虽然无法触碰对方，但她们之间的距离很近。</p><p class="story-paragraph">在静谧的空间里，即使是被药物麻痹了的听觉也能认出来。</p><p class="story-paragraph">呼吸声是她再熟悉不过的、无数个夜晚和自己的呼吸交缠在一起的。</p><p class="story-paragraph">藏起来，又不敢露面的女孩。</p><p class="story-paragraph">是纱夏追到了这里。</p><p class="story-paragraph">她想回头，但硬生生忍住了。</p><p class="story-paragraph">南想过好多次。</p><p class="story-paragraph">如果给她一个机会，要怎么和纱夏解释。</p><p class="story-paragraph">她在脑海里写了个像剧本一样的东西，开头总删删改改，想了这么多天，南现在也只能问出一句话。</p><p class="story-paragraph dialogue">“吃饭了吗？”</p><p class="story-paragraph">她听见身后那人的呼吸声停顿了一瞬。</p><p class="story-paragraph dialogue">“如果没吃的话，”南吩咐女儿，那一线的眼泪却是掉个没停：“在附近的便利店买点吃的。”</p><p class="story-paragraph">纱夏肠胃总有点问题，不按时吃饭就会出毛病。</p><p class="story-paragraph">没人回答。</p><p class="story-paragraph">南知道女儿还在。</p><p class="story-paragraph dialogue">“论文答辩要好好准备，”她攥着拳头，在推翻自己以前设想的所有话语——所有能洗脱自己罪名的话语：“这可是大事。”</p><p class="story-paragraph dialogue">“如果可以的话，能让我看看穿学士服的样子吗？”</p><p class="story-paragraph">南记起了父亲和自己告别的那天，她总觉得很可惜，当时连一张照片都没带给爸爸。</p><p class="story-paragraph">她不愿意让纱夏体会到和她一样孤单的情感了，可是…</p><p class="story-paragraph dialogue">“不想的话，也没关系。”</p><p class="story-paragraph">她又把纱夏惹哭了，南听到女孩隐忍的抽泣声。</p><p class="story-paragraph">对不起，纱夏。</p><p class="story-paragraph">我让你很为难吧？</p><p class="story-paragraph">南没有再说话。</p><p class="story-paragraph">能再等到纱夏来这里看她，对她而言就是礼物了。</p><p class="story-paragraph">她虔诚的梦好像起了效，上天是真的听了她的心意，把幻境次次出现的女孩送到了她的面前。</p><p class="story-paragraph">已经足够…</p><p class="story-paragraph">急匆匆的步子往这边赶，大抵是那个年轻警察。</p><p class="story-paragraph dialogue">“您…”他被南的眼泪吓住，但在对方打出的手势下将“怎么了”憋了回去。</p><p class="story-paragraph">年轻男生有点束手无策，他拿着南的水杯站在原地。</p><p class="story-paragraph">还有无数要说的话，是化在了她的心里…</p><p class="story-paragraph">南不要再这样折磨她的女孩了。</p><p class="story-paragraph dialogue">“很晚了。”</p><p class="story-paragraph">好不容易等到对方吭声，警察放下心来，他以为是南是讲给自己听的，便伸手去搀她。</p><p class="story-paragraph dialogue">“早点休息吧。”</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">纱夏在嘴里含了颗薄荷糖，她极有耐心地等它越融越小。</p><p class="story-paragraph">确认不会在浴室里因为低血糖昏倒第二次，她把自己剥得精光，站在花洒底下冲了个澡。</p><p class="story-paragraph">前不久，妈妈给她打电话了。虽然在那一头的人有可能是奈未阿姨，有可能是板仓叔叔，也有可能是护士。</p><p class="story-paragraph">但直觉告诉她，是南。</p><p class="story-paragraph">如何验证？</p><p class="story-paragraph">她大拇指按了红色的挂断键，手机便再没有响起过。</p><p class="story-paragraph">纱夏从板仓叔叔那得知了南苏醒的消息，他劝自己见见妈妈。</p><p class="story-paragraph">见了又能说什么呢？</p><p class="story-paragraph">要南和自己道歉？</p><p class="story-paragraph">就凭南十二年来对自己的悉心照料…</p><p class="story-paragraph">她都没资格讨要这个道歉。</p><p class="story-paragraph">可是，她父母就白白死去了吗？</p><p class="story-paragraph">纱夏摸不清楚其中的缘由，只知道习惯的力量真的很强大。</p><p class="story-paragraph">她下意识地就把南那天出现的告诫当作圣旨一样听着，也学乖了，在吃的上面再没亏待过自己。</p><p class="story-paragraph">好像时光倒流，那个身上没有伤口的女人才是她真正的妈妈。</p><p class="story-paragraph">这一切也都没有发生过。</p><p class="story-paragraph">纱夏权当南是出了趟远门，等她结束了公务就会回家的。</p><p class="story-paragraph">所以就像以前一样…</p><p class="story-paragraph">她开始自己照顾自己，给家里做了小小的清洁，前不久被她弄得乱七八糟的卧室终于有了能落脚的地方。</p><p class="story-paragraph">纱夏不再全身都痛。</p><p class="story-paragraph">眼睛、胃、小腿，这些由于过度使用或是由于主人照顾不周导致的毛病都平息下去，被安抚好了。</p><p class="story-paragraph">只有心脏…</p><p class="story-paragraph">女孩依然会心绞痛。</p><p class="story-paragraph">她觉得奇怪，上生物课有学过，心血管疾病的大多诱因和先天体质挂钩。</p><p class="story-paragraph">自己的身体一向都没什么问题，怎么年纪轻轻就得了个长辈们才可能患上的病呢？</p><p class="story-paragraph">是矫情吗？可是那又是真的痛，痛起来能折腾得她嘴唇乌青。</p><p class="story-paragraph">不过她还是想忍忍。</p><p class="story-paragraph">妈妈出差回来了可不能看到她这副病怏怏的模样。</p><p class="story-paragraph">终于。</p><p class="story-paragraph">最后一个梦境也被狠狠击碎，板仓叔叔给她发了消息，说妈妈想在明天和自己见一面，顺便谈谈作证有关的事项。</p><p class="story-paragraph">纱夏自嘲地笑笑。</p><p class="story-paragraph">她再一次核对了日历上写着的年份。</p><p class="story-paragraph">不是八年前，不是五年前，不是三年前。</p><p class="story-paragraph">是现在。</p><p class="story-paragraph">一切事情都变得越来越残忍的现在。</p><p class="story-paragraph">医院里躺着的人才是真正的南。</p><p class="story-paragraph">纱夏手心里唯一握着的硬币上写了南对她的爱。</p><p class="story-paragraph">她把硬币的反面翻过来。</p><p class="story-paragraph">女儿。</p><p class="story-paragraph">如果自己不是她的女儿，如果自己的父母不死——</p><p class="story-paragraph">这个前提再一次把她的心踩得粉碎。</p><p class="story-paragraph">像南这样的天上星，怎能伸手给她抓住？</p><p class="story-paragraph">纱夏再不能细想，她结束了思绪无休止的漫游，拿浴巾把水珠擦干。</p><p class="story-paragraph">南的幻觉只出现了一次，却足够让她心惊。</p><p class="story-paragraph">妈妈要是知道，自己这么糟蹋身体…</p><p class="story-paragraph">她会伤心的。</p><p class="story-paragraph">纱夏决定在板仓叔叔约的这一天去趟医院，但她不是去见南。</p><p class="story-paragraph">不过女孩没反应过来，等她坐上电车才发现这条路是往妈妈在的地方开。明明家门口也有医院，她还是选了远路。</p><p class="story-paragraph">女孩没折返，抱着来都来了的心态，轻车熟路地挂上号。</p><p class="story-paragraph">她前不久还帮南办过住院手续。</p><p class="story-paragraph">这下轮到她了。</p><p class="story-paragraph">纱夏坐在心内科诊室外面的椅子上，等着医生叫自己的名字。</p><p class="story-paragraph dialogue">“您今年二十二岁？”听了症状描述，医生显然有点吃惊：“确定以前没有隐疾？”</p><p class="story-paragraph dialogue">“没有。”纱夏摇头。</p><p class="story-paragraph dialogue">“家族遗传呢，有没有心脏本身有问题的亲人？”</p><p class="story-paragraph">亲人…</p><p class="story-paragraph">父母离开的时候，她还没来得及问这些。</p><p class="story-paragraph">她又摇头：“没有。”</p><p class="story-paragraph dialogue">“最近情绪波动很大吗？”看了纱夏的黑眼圈，她情绪也挺低落，医生只好作出最后的判断：“是遇到什么烦心事？”</p><p class="story-paragraph">岂止是烦心事…</p><p class="story-paragraph">天都塌下来了。</p><p class="story-paragraph dialogue">“应该是吧。”她承认。</p><p class="story-paragraph dialogue">“可能是供血不足导致的心肌缺氧，”医生写了几张药方：“您年龄小，还没到很严重的程度，不过…”</p><p class="story-paragraph">纱夏看到医生写的药名。</p><p class="story-paragraph dialogue">——硝酸甘油片。</p><p class="story-paragraph dialogue">“最好去做个 X 光，看看有没有病灶。”他还要接着写检查的单子，被女孩拒绝了。</p><p class="story-paragraph">开药也要花南的钱，检查也是。</p><p class="story-paragraph">既然能缓解，就先这样用着吧。</p><p class="story-paragraph dialogue">“没事的，”纱夏想走了，她打算去拿个药就回家：“我先吃药。”</p><p class="story-paragraph">女孩退出来，走楼梯下去。还没到一楼，下了两层，纱夏看到安全通道上写的数字五，她迷迷糊糊的。</p><p class="story-paragraph">双腿违背了主人的意志，又或许…这才是女孩真正的意愿。</p><p class="story-paragraph">纱夏发现自己竟走到了南的病房门口。</p><p class="story-paragraph">换了几班警察了，里面还有个认识她的人。</p><p class="story-paragraph">板仓进去之前和他吩咐过，见了女孩直接放她进来。</p><p class="story-paragraph">她是亲属，也是证人。</p><p class="story-paragraph">纱夏没反应过来，警察当着她的面把门拉开了。</p><p class="story-paragraph">幸好是降噪的设计，声响不大。</p><p class="story-paragraph">她猝不及防和板仓叔叔对视了一眼。</p><p class="story-paragraph">再来，她逃也似地跑了。</p><p class="story-paragraph">要是没看到南，就可以继续假装妈妈还没回来。</p><p class="story-paragraph">知道了，也假装不知情。</p><p class="story-paragraph">南不正是这样做的吗？</p><p class="story-paragraph">女孩到了目的地，配药间在最底层，她交了钱，从医师手里接了药。</p><p class="story-paragraph">纱夏用的是妈妈的信用卡，在输密码的时候又想起来，那串数字是自己的生日。</p><p class="story-paragraph">她把药片的包装盒丢了，揣了小瓶在兜里。</p><p class="story-paragraph">漫无目的地逛了这么久。</p><p class="story-paragraph">该走了。</p><p class="story-paragraph">纱夏却迟迟没法离开医院。</p><p class="story-paragraph">她在楼下绕了一个又一个圈，还是低估了自己对南的想念。</p><p class="story-paragraph">这么多天一直把妈妈挂在心尖上。</p><p class="story-paragraph">难道就这样又回去？</p><p class="story-paragraph">这下妈妈好不容易醒来了…</p><p class="story-paragraph">纱夏改变了主意。远远地看一眼。</p><p class="story-paragraph">就一眼…</p><p class="story-paragraph">确认妈妈好些了再走。</p><p class="story-paragraph">她又了上楼，这次站得老远，离病房的距离宽到可以来场跑步比赛。</p><p class="story-paragraph">晚饭时间到了，两个警察下去了一个，有人往妈妈的房间里递了吃的。</p><p class="story-paragraph">她今天会出来吗？</p><p class="story-paragraph">妈妈恢复得怎样，她能下床走路了吗？</p><p class="story-paragraph">伤口都好全了吗？</p><p class="story-paragraph">毒瘾…有发作过吗？</p><p class="story-paragraph">居然有这么多问题要问。</p><p class="story-paragraph">纱夏把手插在口袋里。</p><p class="story-paragraph">她有点紧张，摸到了那个小药瓶。</p><p class="story-paragraph">为缓解这种情绪，女孩的视线从左扫到右。</p><p class="story-paragraph">正当她愁着怎么打发时间的时候，一直关切着的那扇门开了。</p><p class="story-paragraph">世界好像都静止了，她看不到其他的东西，只是踮着脚张望。</p><p class="story-paragraph">先出来的是点滴架…</p><p class="story-paragraph">然后就是。</p><p class="story-paragraph">妈妈。</p><p class="story-paragraph">纱夏不敢认。</p><p class="story-paragraph">她瘦了好多，背也挺不直，两条腿好像随时都要站不住。</p><p class="story-paragraph">而且…怎么只有妈妈一个人出来了？</p><p class="story-paragraph">纱夏不自觉地往前走了两步，她看到守门的警察和妈妈交谈了两句，从她手里接过了架子。</p><p class="story-paragraph">南走路的速度很慢，慢到纱夏想起那个穿高跟鞋小跑都不怎么喘的女人。</p><p class="story-paragraph">这真是同一个人吗？她脑子空空如也，心像抹布一样被拧成一团。</p><p class="story-paragraph">纱夏跟在后面，路过已经空了的病房，她偷偷溜进去看了一眼。</p><p class="story-paragraph">好像只剩下南的东西了。</p><p class="story-paragraph">奈未阿姨在哪？</p><p class="story-paragraph">这些天，难道都是妈妈一个人撑过来的吗？</p><p class="story-paragraph">她心下一惊，正要准备出去，发现南从走廊尽头折返。</p><p class="story-paragraph">纱夏瞧见了妈妈的脸。</p><p class="story-paragraph">南好像从神坛上跌落的天使，翅膀也被折断了。</p><p class="story-paragraph">那张脸上一点生气都没有。</p><p class="story-paragraph">受了多少罪…痛了多久…</p><p class="story-paragraph">纱夏觉得自己不可救药，都这样了，她还是觉得妈妈好美。</p><p class="story-paragraph">美得令她心碎。</p><p class="story-paragraph">女孩往后退，在南经过门口的时候躲在墙壁后面。</p><p class="story-paragraph">她希望南进来，又不希望她进来。</p><p class="story-paragraph">如果自己能和妈妈打个照面，她肯定一点气都生不起来了。</p><p class="story-paragraph">纱夏恨不得立马冲出去把她抱得死死的，让她再也不要离开自己。</p><p class="story-paragraph">但妈妈没有回来，她好像打算接着走走。</p><p class="story-paragraph">南的身影至少离她有二十来米，纱夏才闪出来。</p><p class="story-paragraph">说好只见一眼的，她见了不知多少眼。</p><p class="story-paragraph">真的好舍不得…</p><p class="story-paragraph">她无法控制自己。</p><p class="story-paragraph">纱夏尽力憋住了喘气的声音，憋住了左胸底下泛出的痛意，她怔怔地追着南的背影。</p><p class="story-paragraph">来回走了三圈，妈妈停下了。</p><p class="story-paragraph">女孩的鞋不小心碰出了声音。她慌张地回头，发现身后竟是个死胡同。</p><p class="story-paragraph dialogue">“在靠床头的柜子上。”</p><p class="story-paragraph">南把警察支走。</p><p class="story-paragraph">是什么时候的莽撞举动被妈妈发现了？</p><p class="story-paragraph">纱夏很怕妈妈调转身体过来找她，她在心里盘算着要怎么逃脱。</p><p class="story-paragraph dialogue">“吃饭了吗？”</p><p class="story-paragraph">这句话一下就把纱夏击溃了。</p><p class="story-paragraph">是真的，南的声音，不是那个假的。</p><p class="story-paragraph">本以为哭了这么多天以后，再没这么容易落泪。</p><p class="story-paragraph">好在她练了好的本领，死死咬了嘴没出声。</p><p class="story-paragraph">妈妈只要她做好自己的事。</p><p class="story-paragraph">纱夏被钉在原地动弹不得，她真的很想往前走，但此刻却一点力气都没有。</p><p class="story-paragraph">下一秒就要晕厥了，是为了再听南对自己说话，她才醒着。</p><p class="story-paragraph">学士服…学士服…</p><p class="story-paragraph">是妈妈承诺她的事情。</p><p class="story-paragraph">都什么时候了，纱夏无声地摇头，你多为自己考虑考虑…</p><p class="story-paragraph">后面的话她都听不清，血液的过快流速蒙了她的耳朵。</p><p class="story-paragraph">顾不上南有没有走远，纱夏靠着墙壁滑下去。</p><p class="story-paragraph">从口袋里翻出那瓶药，药丸哗啦哗啦地响，女孩抖得连纸都撕不开。</p><p class="story-paragraph">纱夏使劲用手指在上面戳了个洞，倒出几粒也没看，仰头就吃了。</p><p class="story-paragraph">似乎好些了。</p><p class="story-paragraph">吃了药就缓解的疼痛，是说明她是真的出问题了。</p><p class="story-paragraph">可是没关系，她不在乎。</p><p class="story-paragraph">骗不了自己，来医院才不是为她自己。如果南不在这里，她就算哪天病发身亡也不想出门。</p><p class="story-paragraph">妈妈，纱夏想说。</p><p class="story-paragraph">好神奇。</p><p class="story-paragraph">你知道吗？</p><p class="story-paragraph">我前几天看到你了…</p><p class="story-paragraph">看到你什么事都没有，看到你对我笑，听到你教训我。</p><p class="story-paragraph">前几天你就要我好好吃饭。</p><p class="story-paragraph dialogue">——为什么能传这么远？</p><p class="story-paragraph">纱夏在悲泣，嘴里发出小动物受伤一样的哼哧声。</p><p class="story-paragraph">你的心意为何在今天没到来之前…</p><p class="story-paragraph">就到达了我的身边？</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">铃木今天过得还算好，她是医院的护士长。</p><p class="story-paragraph">以往她照料过重症患人，多是年纪大的老人，铃木晚上都不敢睡得太死，生怕听不到别人叫她。</p><p class="story-paragraph">自己是要救人的。</p><p class="story-paragraph">不过三个星期以前来了个女人，护士被分来管她。</p><p class="story-paragraph">平时在同一个区里工作的同僚们嘴上都说着羡慕，说这下铃木只要安心守好刚下来的病人，不用再担心分身乏术。</p><p class="story-paragraph">但铃木知道，她接下来要照顾的病患是有杀人嫌疑的凶犯。</p><p class="story-paragraph">听说有家属的担保，再加上伤重，警方也没有给嫌疑人铐上手铐。</p><p class="story-paragraph">说不害怕是不可能的。</p><p class="story-paragraph">铃木第一次见这阵仗，病房门口守了两个真的警察，她端着点滴瓶进去，心跳快得能打鼓，像个贼。</p><p class="story-paragraph">她看到床旁边坐了个魂不守舍的年轻女孩。</p><p class="story-paragraph">再然后，就是那个病人。</p><p class="story-paragraph">铃木先是检查了她的身份牌，和病历单上写的一样。——名井南。</p><p class="story-paragraph">她接着就望到这个名字的主人。</p><p class="story-paragraph">可能是闭了眼的缘故，出乎意料的，病人的长相一点都不似铃木想象的那般锋利凶狠。</p><p class="story-paragraph">却是很温润。</p><p class="story-paragraph">与这种平静的气质毫不相称的一点，是对方身上不知从何来的忧愁氛围。</p><p class="story-paragraph">铃木想象了一下名井小姐苏醒以后的样子。</p><p class="story-paragraph">她没见过，但是仿佛能提前预知到…</p><p class="story-paragraph">那种又孤独，又寂寞的样子。</p><p class="story-paragraph">护士从警方那里略听来了点小道消息，名井小姐是位很厉害的律师。</p><p class="story-paragraph">似乎是被迫注射了毒品、被威胁，所以杀了人。</p><p class="story-paragraph">那个寸步不离守着名井小姐的人，是她的女儿。</p><p class="story-paragraph">铃木没怎么和她讲过话，她看得出对方完全不想闲聊，两人间短短的交谈，全部发生在病人房间仪器报警的情况下。</p><p class="story-paragraph">女孩是真心地为名井小姐悲伤。</p><p class="story-paragraph">铃木暗自思忖。</p><p class="story-paragraph">真正的坏人，怎么会和自己的孩子拥有这么深厚的亲情呢？</p><p class="story-paragraph">不过，护士从哪一天开始起…</p><p class="story-paragraph">突然就再没看见过那个女孩了。</p><p class="story-paragraph">来了另一个年龄和自己相当的女性，对方也不像家属那样了无生气，一开始就自报家门。</p><p class="story-paragraph">原来是名井小姐在律所的助手。</p><p class="story-paragraph">她没开始那么胆小，同时也越来越好奇，病人的性子究竟是什么样的。</p><p class="story-paragraph">铃木有记事的习惯，或者说这其实是工作上的要求。</p><p class="story-paragraph">大概是在名井小姐女儿离开后的第十一天，她第一次看见病人的那双眼睛。</p><p class="story-paragraph">铃木照料过绝症患者，在这个并未身患绝症的女人眼里，竟流露出了和那些绝症患者相差无几的情愫。好几次，铃木都撞见她偷偷擦眼泪的场面。</p><p class="story-paragraph">名井小姐的眼神结了层霜。</p><p class="story-paragraph">如果说她完全不想活下去，事实又不是这样，她在很积极地配合治疗。</p><p class="story-paragraph">病人身体机能还在慢慢恢复，吃进去的流食都能呕出来。</p><p class="story-paragraph">但她还是在吃，皱着眉头也要咽下去。</p><p class="story-paragraph">这种矛盾的出现有理由，铃木能想到的最合理解释只有一个。</p><p class="story-paragraph">她有放不下的牵挂。</p><p class="story-paragraph">是能和绝望抗衡的牵挂，甚至是和死亡抗衡的牵挂。</p><p class="story-paragraph">铃木最近就没什么事了，她多往名井小姐的病房跑，偶尔陪女人聊聊天。</p><p class="story-paragraph">一个人在这里，生了这么重的病。</p><p class="story-paragraph">在助手被劝回去以后，平时也都没有人来看望…</p><p class="story-paragraph">太可怜了。</p><p class="story-paragraph">名井小姐性子很温和，即使不用多说几句话…</p><p class="story-paragraph">和她接触得越来越深，铃木觉得名井小姐不像是会杀人的样子。</p><p class="story-paragraph">她很安静，醒来的时候大多数时间也是发呆，能下床走路的话就会去外面转一转。</p><p class="story-paragraph">只不过…</p><p class="story-paragraph">再温柔的人，也受不住毒瘾发作的痛。</p><p class="story-paragraph">报警器在夜间疯狂嗡鸣，等铃木赶来的时候，发现病床旁边已经站了个男人。</p><p class="story-paragraph">守班的警察隐约听到嫌疑人的呼救，所以冲进来按了铃。</p><p class="story-paragraph">名井小姐疼得很厉害，她在床上挣扎，护士很担心这么剧烈的翻身会让病人才恢复的伤势加重。</p><p class="story-paragraph dialogue">“求求你…”她连敬语都没说：“给我一点…”</p><p class="story-paragraph">她把头埋在枕头里，好像想咬着那块布料阻止自己说出这样的话，但是没办法。</p><p class="story-paragraph">不过几秒钟的功夫，女人就投降了。</p><p class="story-paragraph dialogue">“我知道你有，”病人的声音很虚弱：“安定…海洛因的代替品…随便什么…”“求求你给我…”</p><p class="story-paragraph">铃木按医院的规定，给名井小姐打了一针阿片药。</p><p class="story-paragraph">对方好像得到了点快慰，慢慢睡去了。</p><p class="story-paragraph">病人毒瘾发作的时候是凌晨，铃木回了休息室以后稍微眯了眼，醒过来的时候也还早，八点不到。</p><p class="story-paragraph">怕名井小姐尴尬，护士觉得她是有自尊心的人。</p><p class="story-paragraph">那样的一幕被谁看了都不好受，她因此不想和病人打照面。</p><p class="story-paragraph">猜测对方应该还在睡觉，铃木想进去确认她的情况。</p><p class="story-paragraph">没想到名井小姐已经醒了，窗帘也被她拉开。</p><p class="story-paragraph">女人借着晨曦的微光在看书。</p><p class="story-paragraph">铃木什么都没带，两手空空，找不到任何借口，接了对方投来的视线，反而有点心虚的尴尬。</p><p class="story-paragraph dialogue">“您在看什么？”她只好没话找话。</p><p class="story-paragraph">对方稍微拢了书页，把封面亮给她看——</p><p class="story-paragraph">《芥川龙之介短篇小说集》。</p><p class="story-paragraph dialogue">“从架子上拿的吗？”铃木顺水推舟地问她，护士也看过这本书，确切地说就是名井小姐手上拿着的这本。</p><p class="story-paragraph">医院每层楼都有公用书架，铃木闲下来转换心情的时候会去找喜欢的小说。</p><p class="story-paragraph dialogue">“嗯，散步的时候顺手拿了。”女人再次翻开那本小册。</p><p class="story-paragraph dialogue">“您在看哪一篇？”护士有些好奇。</p><p class="story-paragraph dialogue">“尾生之信，”名井小姐稍微停顿了一下，唇角浮出和缓的笑意，她这句解释好像不是说给护士听的，只是单纯说出来而已：“我女儿喜欢这篇。”</p><p class="story-paragraph dialogue">“您的女儿，”护士想起了那个孩子，于是说点她的记忆给名井小姐听：“长得像您一样漂亮。”</p><p class="story-paragraph">病人突然沉默了，铃木只当她是在专心看书，补了一句：“您身体刚恢复不久，一定记得休息。”</p><p class="story-paragraph dialogue">“您也见过我女儿？”名井小姐的视线落在书页上，却不像是在读的样子。</p><p class="story-paragraph dialogue">“见过，之前她担心您出事，还要和我们吵架，”护士印象很深，名井小姐一开始疼，女孩就要发火：“不过…”</p><p class="story-paragraph">怕刺激到病人，铃木没再说下去。为什么之后就没来了？</p><p class="story-paragraph dialogue">“给您添麻烦了。”病人好像是在笑她女儿纯真的幼稚，语气里流露了几分松弛的缱绻之意。</p><p class="story-paragraph dialogue">“不要紧的，我想她也是在意您，”铃木也是妈妈：“您女儿叫什么名字？我没听她提起过。”</p><p class="story-paragraph dialogue">“她叫纱夏。”护士想夸这个名字起得好。</p><p class="story-paragraph">她看到名井小姐把书合上了。</p><p class="story-paragraph dialogue">“可以帮我洗个澡吗？”这个请求让她有些意外，虽然这是她该做的工作：“昨天出了一身汗，有点难受。”</p><p class="story-paragraph dialogue">“好，”铃木退出去给她准备毛巾，对方的身体状况不好，只能接受床浴：“您躺在床上就好，稍等我一下。”</p><p class="story-paragraph">护士接了水，还拿了瓶标签为百分之五十浓度的乙醚放在旁边。</p><p class="story-paragraph">她用言语提示名井小姐按所说的那样翻身。</p><p class="story-paragraph">铃木知道她的年龄，三字打头了…</p><p class="story-paragraph">身体却挑不出什么瑕疵。</p><p class="story-paragraph">她轻轻地给名井小姐擦了擦那处。</p><p class="story-paragraph">女人的私处保养得很好，颜色是少女一样的粉，两瓣细肉就那样紧紧地闭着，像里面会有珍珠的那种贝壳。</p><p class="story-paragraph">小腹上一点妊娠纹都没有。</p><p class="story-paragraph">乳首也是嫣红的，好像缺失了哺乳的经历。</p><p class="story-paragraph">她只要看一眼就能明白了，名井小姐没有生过孩子。</p><p class="story-paragraph">联系起她看到的那位名叫纱夏的女孩，好像也有二十来岁，再回忆起名井小姐的年龄。</p><p class="story-paragraph">差点就要问了。</p><p class="story-paragraph">您的女儿应该不是亲生的吧？</p><p class="story-paragraph">不过她知趣，没问出口。</p><p class="story-paragraph">铃木先用温水擦了一遍名井小姐的身子，再拿酒精帮病人在几处关节那消了毒。</p><p class="story-paragraph dialogue">“我去问问现在能不能吃早餐。”说完这话她就出去了。</p><p class="story-paragraph">护士是挺想再见见纱夏，她之前戴了有色眼镜来看这两人的。</p><p class="story-paragraph">现在和名井小姐相处久了，铃木也不再持以前的观点了。没想到那一天很快就来了，刚好是在她给名井小姐洗完澡的第二天。</p><p class="story-paragraph">她再一次见到了纱夏。</p><p class="story-paragraph">护士照惯帮忙查了一下房， 今天她迟了点，因为名井小姐托她帮了个忙。</p><p class="story-paragraph">铃木给楼层的房间熄了灯，病房还是挺多，她一个一个地敲门去问询，走到最后一条走廊的时候已经过了快有一小时。</p><p class="story-paragraph">走廊的灯被调得很暗，她隐隐约约地窥到个身影。</p><p class="story-paragraph">护士被吓了一跳，这个点了，拐角处居然有个靠着墙壁颤抖的人。</p><p class="story-paragraph dialogue">“您在这里做什么？”铃木小心地绕过去，因为能看出对方是个女性，而且医
