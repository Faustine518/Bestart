        <h2 id="heading-chapter-21">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">空气里有杂音，午夜间闪烁的电视机屏幕下的细碎雪花似乎在这个房间里飘落。</p><p class="story-paragraph">女儿的那双手指节分明，透白的皮肤底下埋了青色的纹路。</p><p class="story-paragraph">果皮转成了几个绕在一起的圈圈，没断。</p><p class="story-paragraph">纱夏在给南削苹果。</p><p class="story-paragraph dialogue">“是不是很厉害？”女孩没抬头，动作却不停。</p><p class="story-paragraph">南依然沉默，呼吸声怎么听都像是阵短促的叹息。</p><p class="story-paragraph">纱夏不急着讨要妈妈的回答。</p><p class="story-paragraph">女孩用手包了它的底，小刀没在里面切了两下。</p><p class="story-paragraph">被金属尖尖戳着的那一份小心地凑近了妈妈的嘴边。</p><p class="story-paragraph">南开始没反应，但是对方一定要她吃，坚持举了半天都不放下。</p><p class="story-paragraph">她垂了眼睛，咬了一小口。</p><p class="story-paragraph">纱夏不依不饶地，冰凉的硬块抵着她的嘴唇，有种强迫的意味。</p><p class="story-paragraph">南忽然一阵没由来的烦躁。</p><p class="story-paragraph dialogue">“我没胃口。”她将头偏过去。</p><p class="story-paragraph">为了控制要爆发的情绪，南闭着嘴，脸颊两侧浮现了点咬牙才会显出来的轮廓。</p><p class="story-paragraph">她求人的样子到底是有多下贱？</p><p class="story-paragraph">比起糟糕的意志力…</p><p class="story-paragraph">南无法原谅纱夏看到她犯瘾以后生出的怜悯。</p><p class="story-paragraph">小孩不晓得她的心思。</p><p class="story-paragraph">妈妈刚刚出了很多汗，现在应该不舒服，嘴唇有点不自然地泛白。</p><p class="story-paragraph">趁南再次昏睡，纱夏去找卖水果的店，用了自己的钱，给她挑了几个看起来颜色鲜艳的。</p><p class="story-paragraph">纱夏不放弃，仍旧好言好语地劝：“吃一点吧。”</p><p class="story-paragraph">女儿偏偏戳到了她的痛处。“我说了我不吃。”</p><p class="story-paragraph">南的音量提高了很多，她推开了纱夏。</p><p class="story-paragraph">用的劲似乎太大了。</p><p class="story-paragraph">纱夏好像短暂地愣了两秒，就连南自己也没反应过来。</p><p class="story-paragraph">那柄插着水果的刀被碰掉，它撞在了地上，发出“叮当”一声。</p><p class="story-paragraph">没来得及担心女儿有没有受伤。</p><p class="story-paragraph">南怔怔地看纱夏把弄脏了的苹果放进嘴里，看她咀嚼，看她咽下去。</p><p class="story-paragraph dialogue">“确实不好吃。”女孩垂了眼睛，她低声下气的，找了个自圆其说的理由。</p><p class="story-paragraph">女儿把刚削好的苹果和那圈毫无断裂预兆的果皮丢进了垃圾桶里。</p><p class="story-paragraph dialogue">“不想吃就不吃了。”</p><p class="story-paragraph">南的肺里装了在燃烧的木炭，好像每呼吸一次就有黑灰色粉末喷出来。</p><p class="story-paragraph">纱夏凑近了，她没有迎上去，反而下意识地往后躲。</p><p class="story-paragraph">女孩悬在空中的手在发颤，她不可置信地盯着自己指尖看。</p><p class="story-paragraph">是有脏东西吗…</p><p class="story-paragraph">为什么妈妈不要她碰？</p><p class="story-paragraph dialogue">“你…”她漂亮的嘴唇在发抖，眼圈很快地红了：“是不想看到我？”</p><p class="story-paragraph">不是这样的…</p><p class="story-paragraph">南被施了什么咒术，她哑了口，眼睫蓄了液体，和坏掉的水龙头阀门似的。</p><p class="story-paragraph">我只是…</p><p class="story-paragraph">为什么说不出解释？</p><p class="story-paragraph">泪水压在她的眼底滚来滚去，就是没落出来。</p><p class="story-paragraph">记忆里以小孩子模样出现的女儿总信任她，总不怎么怕她。</p><p class="story-paragraph">可是纱夏现在在她面前露怯了。</p><p class="story-paragraph">女儿无辜的眼神像雨夜里被抛弃的家养狗，皮毛被淋得湿漉漉的。南想抓住纱夏，但她的右手还没有痊愈，在犹豫的间隙里，女儿已经缩了回去。</p><p class="story-paragraph">纱夏的眉毛上结了层霜。</p><p class="story-paragraph">想着要给南吃第一口，她还没尝，捧着要送给妈妈的。</p><p class="story-paragraph">苹果明明很甜，甜得她喉头发苦。</p><p class="story-paragraph">如果妈妈是因为自己在才这么烦躁…</p><p class="story-paragraph">她走就是了。</p><p class="story-paragraph">纱夏侧过身在袋子里悉悉索索地翻什么东西。</p><p class="story-paragraph">她一声不吭，小心地把饭盒摆到南面前。</p><p class="story-paragraph">椅脚被拉响了，是女孩站了起来。</p><p class="story-paragraph dialogue">“我在外面，”纱夏好像犯了错，视线也畏畏缩缩的，她的眼睫闪个不停，不敢看南：“有事的话叫我。”</p><p class="story-paragraph">别走…</p><p class="story-paragraph">南攥住了被子，被纱夏离开时的落寞背影刺得半个字吐不出来。</p><p class="story-paragraph">她伤了女儿的心…</p><p class="story-paragraph">知道纱夏也很痛苦，还这样…</p><p class="story-paragraph">她盯着墙壁发呆。</p><p class="story-paragraph">雪白的颜色，什么都不会在上面留下痕迹。</p><p class="story-paragraph">明明从始至终都不舍得让纱夏受委屈的，她却越来越控制不了自己那点阴晴不定的情绪了。</p><p class="story-paragraph">怎么配得上女儿对自己的好？</p><p class="story-paragraph">天要黑了，缩在墙角的夕阳走不进来。 初夏阳光的那点温度都丢了，显得冷清凄惶。</p><p class="story-paragraph">没什么食欲，安慰剂的副作用比想象中严重很多。</p><p class="story-paragraph">南头晕得厉害，腹部左下方很不舒服，那里好像是胃，湿软的器官壁沿长了藤蔓的倒钩，疼得她直冒冷汗，不停地抽气。</p><p class="story-paragraph">她紧紧抓了那双筷子，等着阵痛从身体里消失。</p><p class="story-paragraph">不想吃任何东西，但是女儿给她做了。盒子里装的是蛋包饭。</p><p class="story-paragraph">击垮南的是看起来有些可爱的小心思。</p><p class="story-paragraph">纱夏淋了层番茄酱在上面。</p><p class="story-paragraph">她都能想象女儿准备晚饭的样子。</p><p class="story-paragraph">被这样干净的爱保护着。</p><p class="story-paragraph">记得她所有的喜好…</p><p class="story-paragraph">喜欢什么，讨厌什么。</p><p class="story-paragraph">能做到这个份上…</p><p class="story-paragraph">如果能回到从前，日复一日的光阴就任它流淌。</p><p class="story-paragraph">都在一起这么久了，能跳过所谓的七年之痒。</p><p class="story-paragraph">拿到了纱夏的勇气。</p><p class="story-paragraph">和她这样继续相爱下去，等女儿回来以后。</p><p class="story-paragraph">一直相爱到死…</p><p class="story-paragraph">南吃不出味道，鼻子和嘴的感官是连在一起的，一边因眼泪被阻塞失灵，另一边就也陷入当机的状态。</p><p class="story-paragraph">理所应当，命运安排给所有正常人的路。</p><p class="story-paragraph">纱夏也要走的。</p><p class="story-paragraph">读书工作，结婚生子。</p><p class="story-paragraph">看不到彻底脱瘾的希望，如今她的生命一半都陷进黑洞里。</p><p class="story-paragraph">还能给纱夏带来什么…</p><p class="story-paragraph">是一段没头没尾的恋爱，还是一具被药拖垮了的身体？</p><p class="story-paragraph">她拆了颗薄荷糖，那也是女儿特意放进来的。</p><p class="story-paragraph">南闭了眼睛，被沾湿的漆黑睫毛贴在眼睑下面。</p><p class="story-paragraph">这么好的孩子被拴在她身边太可惜。</p><p class="story-paragraph">她走进盥洗室已经是一会以后的事了。想整理仪容。纱夏最喜欢缠着自己说妈妈漂亮。</p><p class="story-paragraph">她对着镜子，不可置否。</p><p class="story-paragraph">漂亮吗？南苦笑了一下。</p><p class="story-paragraph">在玻璃光面里的女人也跟着扬起了嘴角。</p><p class="story-paragraph">卧蚕上有明显的青黑色，有些显老了。</p><p class="story-paragraph">流泪的原因，生出的细纹被肿起来的眼皮遮住了。</p><p class="story-paragraph">尽管位于后脑勺的疤痕拆线以后剃掉的头发不多，而且她都去过庭审了…</p><p class="story-paragraph">南还是担心会显得滑稽。</p><p class="story-paragraph">她微微低了头，好在没有多明显，看不出来。</p><p class="story-paragraph">可是…南皱起眉。</p><p class="story-paragraph">她有白头发了。</p><p class="story-paragraph">不希望纱夏嫌弃这点年龄的象征，南用搁在一旁的梳子顺了几下，将银白的细丝藏进了更深的地方。</p><p class="story-paragraph">要是能化妆就好了，会更好看。</p><p class="story-paragraph">她摇摇头，想笑自己，没必要这么大费周章。</p><p class="story-paragraph">所幸身体已经恢复得差不多，面颊上原先那点红晕也给面子地现了身影。</p><p class="story-paragraph">外面的世界涂了层浓黑的颜料，室内的灯接二连三地亮起。</p><p class="story-paragraph">南拉开门出去，倚着墙靠的那个影子马上就站直了。</p><p class="story-paragraph">白光蒙蒙地拢住纱夏。</p><p class="story-paragraph">她的轮廓被晕得特别柔和，好像西方世界的某幅油画里走出来的、专门施人恩惠的天使。</p><p class="story-paragraph">南照惯例进行饭后散步，没理她。</p><p class="story-paragraph">纱夏可能是担心，安静地跟在后面，速度和她保持得一模一样。</p><p class="story-paragraph">妈妈快的话她就快，慢的话，她脚步也会变得慢。</p><p class="story-paragraph">女人漆黑的发像泼墨般自然流泻，颈后露出的皮肤被衬得更白。</p><p class="story-paragraph">纱夏的目光没法离开妈妈，她好像要把南的身形都刻进眼睛。静谧的洪波一点点占据了两人踏足的地方。</p><p class="story-paragraph">纱夏一般都是在九点左右回家，南经过护士站的时候望见了那个时间显示屏，红色的信号灯告诉她现在是晚上七点。</p><p class="story-paragraph">她踱步至病房门口，女儿也停下来了。</p><p class="story-paragraph">当家长这么久，南真的拉不下脸皮为自己像三岁小孩一样的幼稚行为道歉。</p><p class="story-paragraph">可如果自己不说话，纱夏肯定还要守着。</p><p class="story-paragraph">女儿在望不到尽头的爱里强撑，连丝毫的怨言都没有。</p><p class="story-paragraph">纱夏显然没想到妈妈会突然转过身来。</p><p class="story-paragraph">她像一只被吓到的小鹿，先前因为难过耷拉下去的双眼立刻瞪得水灵灵的滚圆。</p><p class="story-paragraph">为了不和妈妈对视，纱夏马上又低了头。</p><p class="story-paragraph">没做错任何事，女儿谨小慎微的举措让南很不是滋味。</p><p class="story-paragraph">她往前走了几步，手捧住了纱夏的脸。</p><p class="story-paragraph">女孩脸颊上的肉被南用掌心往里挤，她的嘴巴因此噘了起来，整个人看上去都懵懵的，宝石一样漂亮的眼珠子慌张地转了几轮，轻盈的睫毛也在上下翻动。</p><p class="story-paragraph dialogue">“不是要你罚站，”南的语气也听不出喜怒：“进来吧。”</p><p class="story-paragraph">南松了她，先一步走到里面。</p><p class="story-paragraph">纱夏在门口犹豫了一会，还是决定听妈妈的。</p><p class="story-paragraph">女孩随手将门关上了。</p><p class="story-paragraph">灯被按灭。</p><p class="story-paragraph">没顾得上回头，她一下什么都看不见了。</p><p class="story-paragraph">纱夏没有任何准备就被突兀地扔进了黑暗里，僵在那没动。</p><p class="story-paragraph">始作俑者同样看不清，她被绸缎样光滑的墨色蒙了眼睛，依了纱夏呼吸的动静才转到她身边。</p><p class="story-paragraph">南伸手抱住了女儿。</p><p class="story-paragraph">她叹了口气，声音好像关在毛玻璃里，沙沙的。</p><p class="story-paragraph dialogue">“对不起。”得到如此说法在纱夏的意料之外。</p><p class="story-paragraph">被南赶走以后，她不过就缩在没人看见的地方哭了一会。</p><p class="story-paragraph">说委屈…谈不上。</p><p class="story-paragraph">好像也可以理解妈妈的心情，纱夏没想讨要这个道歉。</p><p class="story-paragraph">女儿没说话，南开始紧张了。</p><p class="story-paragraph">她不该发脾气的。</p><p class="story-paragraph">南抬手去摸纱夏的脸，从她英挺的眉毛一路摸到有好看形状的嘴唇。</p><p class="story-paragraph dialogue">“不高兴了？”她说这话时不像母亲，反而像谁的妻子。</p><p class="story-paragraph dialogue">“没有。”纱夏在想事情，一下惊醒，反应过来自己不该沉默。</p><p class="story-paragraph dialogue">“真的？”南主动在女儿肩窝那蹭了两下，她平稳清浅的呼吸扑在对方身上。</p><p class="story-paragraph dialogue">“真的。”纱夏为了强调，垂着的那支手牵了妈妈，轻轻地捏了一下，顺便将南揽进了怀里。</p><p class="story-paragraph">南松了口气，她抬头看纱夏。</p><p class="story-paragraph">离得近，女儿眼里跳动的光点好像两盏灯，悬在辽阔又宁静的湖面上。</p><p class="story-paragraph">还能在少女的眉目间找到点年轻人应有的青涩幼稚。</p><p class="story-paragraph">只不过那种神态现下躲起来了，要不是南熟悉纱夏的样貌，肯定寻不见。</p><p class="story-paragraph">她希望女儿能慢点长大。</p><p class="story-paragraph">要想这样做的话…</p><p class="story-paragraph dialogue">“我出院以后要去哪？”南轻声问她。</p><p class="story-paragraph">自己这个状态只能给纱夏添麻烦。</p><p class="story-paragraph">女儿的呼吸声像一下就蹿高了的火苗。</p><p class="story-paragraph dialogue">“你想去哪？”她再开口的时候身体都在发抖。</p><p class="story-paragraph dialogue">“不是有地方，”南自嘲的语气里泄露出疲惫：“专门给我这种人…”</p><p class="story-paragraph">妈妈在说戒毒所…</p><p class="story-paragraph dialogue">“哪种人？”纱夏抱她的力气变得大了，直接打断了她：“你是哪种人？”她不会让妈妈一个人去的，不会让她一个人被关在里面。</p><p class="story-paragraph dialogue">“不去，”纱夏的头埋在她肩膀上不住地摇：“我们回家。”</p><p class="story-paragraph">女儿的侧脸那里一片冰冰凉凉的水痕，是眼泪。</p><p class="story-paragraph dialogue">“别说傻话，”南心里的发条被拧得很紧：“你也看到了。”</p><p class="story-paragraph">女儿的喉咙里有极力压制的呜咽，摆明了是还想和自己回旋。</p><p class="story-paragraph">南果断地抛下一个不知是更伤谁的事实，她截了纱夏剩下的愿望。</p><p class="story-paragraph dialogue">“你马上要到国外念书了。”</p><p class="story-paragraph">这句话是陈述句，纱夏应声松开了她。</p><p class="story-paragraph">她的目光划过南的脸庞，好像含了千言万语要对妈妈说。</p><p class="story-paragraph">纱夏眨巴着那双雾蒙蒙的大眼睛，眼底蛰伏的情绪让南胸口发痛。</p><p class="story-paragraph">她只是沉默，当作没看见。</p><p class="story-paragraph">南靠着纱夏，鼻子很酸。</p><p class="story-paragraph">十二年的厚重岁月在此刻发了光。</p><p class="story-paragraph">纱夏还是爱她。</p><p class="story-paragraph dialogue">“在家几个月而已，”女孩对南露出个显得悲伤却又温暖的笑：“你不可以陪我吗？”</p><p class="story-paragraph dialogue">“就我们两个，”她在燃烧那点可怜的尊严乞求妈妈：就我们…”</p><p class="story-paragraph">纱夏实在是忍不住了，她未完的话被堵在胸口里，替代品是模糊的抽噎。</p><p class="story-paragraph">好像可以不遗憾了…</p><p class="story-paragraph">能走到这里，总归是圆满的。</p><p class="story-paragraph">纱夏乍看像混血儿一样迷人深邃的眸子里噙满了真心。</p><p class="story-paragraph">有遥远的环形星云在那边闪耀，那是照亮南无望生命的源头。</p><p class="story-paragraph">她却好像再也碰不到了。</p><p class="story-paragraph">女儿到现在还不明白。</p><p class="story-paragraph">从头到尾，其实都是她陪着自己。南“嗯”了一声，算是答应了纱夏的请求。</p><p class="story-paragraph">她压了所有的筹码。</p><p class="story-paragraph">手里的底牌是看了又看。</p><p class="story-paragraph">打出去就有可能赢回快要消失不见的未来…</p><p class="story-paragraph">还真是不舍得丢掉它。</p><p class="story-paragraph">鲜血为养料，眼泪为水源。</p><p class="story-paragraph">南也是第一次看到。</p><p class="story-paragraph">从残垣断壁里生出的花…</p><p class="story-paragraph">在败谢以前，竟能开得如此夺目动人。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">板仓知道南在今天出院，他抽空来找她。</p><p class="story-paragraph">病人肯定不至于急得一大早就走，他还特意挑了上午的时间。</p><p class="story-paragraph">一审结果出来了，毫无意外是无罪的判决。</p><p class="story-paragraph">虽然南说文书寄给她就行，但到了这种日子，板仓认为还是有必要去一趟。</p><p class="story-paragraph">男人带了些补品，他本来要亲自去选，糟糕的生活常识却给爱人嘲笑了一番，老婆说这东西要是给身子弱的病人吃了，好不容易出院的名井律师得再住进去。</p><p class="story-paragraph">板仓悻悻地退下了，要送给下属的礼物都是妻子挑的，他希望能尽到心意。</p><p class="story-paragraph">没告诉南，本是要给她一个出其不意的惊喜…</p><p class="story-paragraph">板仓很有气势地拉开了门，问候的话还没说出口，就恨不得现在钻进地缝里消失。</p><p class="story-paragraph">南坐在床上，这位难得有什么丰富表情的律师在笑。</p><p class="story-paragraph">不是那种笑意只在嘴角，却没进到眼睛里的笑。</p><p class="story-paragraph">是真心实意的…</p><p class="story-paragraph">如果仅仅是这样也就算了，板仓再定睛。</p><p class="story-paragraph">和她盖着同一床被子的人是纱夏。</p><p class="story-paragraph">由南亲自承认过的…这下要怎么称呼？</p><p class="story-paragraph">空气似乎凝住了，两位工作同事在对视之后都不约而同地沉默。</p><p class="story-paragraph dialogue">“叔叔好。”南的女儿和他打招呼了。</p><p class="story-paragraph dialogue">“上午好，纱夏。”他和女孩问好，看到两人牵在一起的手，视线马上移开。</p><p class="story-paragraph">南的神态有点生硬，她轻咳了一声，警告老板不要乱讲话。</p><p class="story-paragraph">板仓捏了把汗，选择缄默不语，将礼物放到旁边。</p><p class="story-paragraph">他正儿八经地穿了西装，褶皱很难抹平，所以没坐下。</p><p class="story-paragraph dialogue">“怎么还带这么多东西？”南先打破这种有些尴尬的局面，她的视线落在板仓带进来的包装礼盒上。</p><p class="story-paragraph dialogue">“很久没来看你了，”板仓的来意很明显：“一点心意而已。”</p><p class="story-paragraph">为了防止南继续推辞，他紧接着开口：“在路上还担心来了碰不到你。”</p><p class="story-paragraph">南弯起眼睛：“再晚点就真的碰不到了。”</p><p class="story-paragraph dialogue">“怎么？”板仓问下属。</p><p class="story-paragraph dialogue">“我们打算九点十五走。”纱夏在为她解释，女孩按亮了手机屏幕，看一眼时间。</p><p class="story-paragraph">果然，只剩下十分钟。</p><p class="story-paragraph">男人咂舌，没想到南真的这么赶。</p><p class="story-paragraph">看来他运气还行，没扑空。</p><p class="story-paragraph">既然都准备离开，板仓不好厚脸皮跟着南走，可有些话也不方便给在场的纱夏听。</p><p class="story-paragraph">他在犹疑，想单独和南谈谈的意向被她捕捉到了。</p><p class="story-paragraph dialogue">“纱夏，”她偏过去嘱咐女儿：“你先去车上好不好？”</p><p class="story-paragraph dialogue">“不好。”纱夏皱起鼻子摇了摇头。</p><p class="story-paragraph">南被拒绝，表情里闪过微微的惊讶。</p><p class="story-paragraph dialogue">“你不知道车停在哪，”小朋友的睫毛缀了灿阳的金光：“我就在门口等你。”</p><p class="story-paragraph">和另一个知道她们关系的人共处一室，南的定力显然不比从前，她眼里闪动的爱意都溢出来，要遮不住了。</p><p class="story-paragraph">南赶快不再看她。“好。”她放掉了女儿的手，让对方起来。</p><p class="story-paragraph">纱夏掀开盖在两人身上的被子，转到一边去穿鞋。</p><p class="story-paragraph">板仓喊了女孩的名字，在她要走之前将那堆七七八八的东西硬塞给她，还略带歉意地说有些重了。</p><p class="story-paragraph">不过纱夏并不这么认为，她没有抱怨，只笑意盈盈地接过。</p><p class="story-paragraph">少女的唇角含了一个吻，那个弧度折起的间隙里盛满浅色的蜜。</p><p class="story-paragraph">她身上绽放的气息像缓慢到来的灼灼夏日，却卷起阵不属于炎热时节的馥郁花香。</p><p class="story-paragraph">确认纱夏消失在门外，男人才调侃下属。</p><p class="story-paragraph dialogue">“在恋爱？”</p><p class="story-paragraph dialogue">“没有。”南定了定神，很快就恢复到从容不迫的样子。</p><p class="story-paragraph">不过她脸上的温度没褪掉，双颊还是粉色的。</p><p class="story-paragraph">南上次口口声声说她们已是曾经的爱人，于是板仓毫无提防心地冒失闯进来。</p><p class="story-paragraph">信了她这句话的人才是蠢到家了。</p><p class="story-paragraph">被纱夏这么纯粹热烈的爱包裹着…</p><p class="story-paragraph">真有人能忍住不回应吗？</p><p class="story-paragraph">板仓挺愿意就这个话题劝劝她，不要再嘴硬下去。</p><p class="story-paragraph">可南是纱夏的母亲…</p><p class="story-paragraph">作为外人，不身处对方进退两难的僵局，没有资格指手画脚。</p><p class="story-paragraph dialogue">“之后的打算考虑好了吗？”他转移了话题，在公文包里翻什么东西。</p><p class="story-paragraph dialogue">“嗯，”南想起和女儿讨论出的结果：“会去戒毒中心。”</p><p class="story-paragraph dialogue">“什么时候去？”找到了，板仓将那个文件夹抽出来。</p><p class="story-paragraph dialogue">“晚点吧，”南淡淡地道了句：“先在家待着。”</p><p class="story-paragraph">听闻此话的男人扬起了脑袋，他看着情绪没什么起伏的南，忍不住皱了眉头。</p><p class="story-paragraph dialogue">“在家…”板仓在怀疑她的决定：“要多久？”</p><p class="story-paragraph">南的眉睫投下了深深的暗影，女儿要留学的事板仓知道：“我想把纱夏送过去再治疗。”“你女儿在美国不是也要租房吗，要不让她早点住过去，”板仓提了建议：“这样你也可以快些开始…”</p><p class="story-paragraph">他停顿了，从表情看，好像同事不是这个意思。</p><p class="story-paragraph dialogue">“送她…”律师推敲了一下南的措辞里藏着的逻辑。</p><p class="story-paragraph dialogue">“你不会是…”板仓点出了她的想法，有些着急：“要陪她去纽约？”</p><p class="story-paragraph">不否认，就是肯定了。</p><p class="story-paragraph">南没说话。</p><p class="story-paragraph">她很清楚，自己的身体就是个定时炸弹。</p><p class="story-paragraph">可女儿要在外面待这么久，还是第一次出远门。</p><p class="story-paragraph">若不去看纱夏以后两年在什么地方生活…</p><p class="story-paragraph">哪里又放得下心？</p><p class="story-paragraph dialogue">“你在想什么？”板仓这次为南的案子接触了不少有瘾的人，清楚这情势算得上严峻：“越拖到后面就越难戒。”</p><p class="story-paragraph">南没反驳，只是自顾自地说起另一件事：“有一年我说要和你请假，还记得吗？”</p><p class="story-paragraph">对方云里雾里。</p><p class="story-paragraph">她意识到是自己强人所难，补充了细节：“后来我反悔的那次。”</p><p class="story-paragraph">这么一讲，板仓才勉强找着了些记忆。</p><p class="story-paragraph dialogue">“有点印象。”男人点头。</p><p class="story-paragraph">南很少找理由不来上班，破天荒和他讨了不短的假期，自己也答应了。</p><p class="story-paragraph">结果没多久她又说不要休假了。</p><p class="story-paragraph">南不是出尔反尔的人，那时板仓觉得奇怪。</p><p class="story-paragraph">但这事实在过去太久，也没造成什么不好的后果，他早记不太清具体情况。</p><p class="story-paragraph dialogue">“那年纱夏毕业，”南脸庞的线条格外柔软：“我想带她去外面玩的。”</p><p class="story-paragraph">板仓那张嘴一时间打开又闭上。</p><p class="story-paragraph">原来是这样。</p><p class="story-paragraph">没休假就表示没去成，南这个大忙人也许又遇上什么事了。今年赶巧碰上纱夏读完大学…</p><p class="story-paragraph">他知道了，语气还是放软了：“你想补给纱夏？”</p><p class="story-paragraph dialogue">“不是。”</p><p class="story-paragraph">南的眼角出现了带笑的弧度，声音温得好似用手捧出的一掬泉。</p><p class="story-paragraph dialogue">“是她补给我。”</p><p class="story-paragraph">板仓不再有异议，也不再追究南是不是搞反了角色。</p><p class="story-paragraph dialogue">“和纱夏说了吗？”他觉得另一个当事人也要晓得才行。</p><p class="story-paragraph dialogue">“说了的。”</p><p class="story-paragraph">女儿帮她办手续，戒毒所要南住进去的具体日期，必须要和纱夏报备才行。</p><p class="story-paragraph">既然纱夏也知情，板仓没责怪她了。</p><p class="story-paragraph">他这下注意到南手上的夹板拆了，它上次出庭时还在。</p><p class="story-paragraph">对方跟着视线低头。</p><p class="story-paragraph dialogue">“差不多好了，”南告诉板仓医生对她的嘱咐：“只是不能提重东西。”</p><p class="story-paragraph dialogue">“你身体恢复得还不错，”女人的脸色不差，板仓好歹还是松了口气：“在家也要好好休养。”</p><p class="story-paragraph dialogue">“我知道的。”她应下，接过老板递来的东西。</p><p class="story-paragraph">褐色的文件袋，南从开口的缝隙里看见了那叠薄文书。</p><p class="story-paragraph">一审的无罪判决。</p><p class="story-paragraph">好像还装了什么东西，她听见有个小物件擦过纸张的声响，是金属发出来的…</p><p class="story-paragraph">女人稍微倾斜了信封，旋即愣了一下。</p><p class="story-paragraph">她低头，律师徽章掉进了手心。</p><p class="story-paragraph dialogue">“上次那群警察把你办公室弄得乱七八糟，”板仓有点抱歉，看南摩挲着徽章正中间那个褪色的天秤图案：“我不好翻，就带了这个过来。”</p><p class="story-paragraph">她将泛银光的圆片又放了进去，没再看：“麻烦你了。”</p><p class="story-paragraph dialogue">“有时间可以回去整理一下，我用备用钥匙上了锁。”“谢谢，”南还想说什么话：“我可能…”</p><p class="story-paragraph dialogue">“你没有刑事犯罪的记录，”板仓出言安慰她：“等你戒掉毒瘾，继续来事务所做律师就好，其他什么都不用担心。”</p><p class="story-paragraph">南不敢说好，不敢答应。</p><p class="story-paragraph">她真希望这样的愿景能得以实现。</p><p class="story-paragraph dialogue">“谢谢。”</p><p class="story-paragraph">她出来的时候没遇见铃木护士，却和那位谢了顶的主治医生打了照面，他们寒暄地握了手。</p><p class="story-paragraph">南和板仓一起走进这个时段人少得不太正常的电梯。</p><p class="story-paragraph">她穿了件薄点的亚麻色长衫，黑色的提包被挎在肘间。</p><p class="story-paragraph">嘴巴的颜色有些浅了，南依习惯涂上了口红。</p><p class="story-paragraph">不是这些天第一次走出医院。</p><p class="story-paragraph">裁判审理的那天她去过法庭。</p><p class="story-paragraph">可意义不同，心境自然也无法相比。</p><p class="story-paragraph">今天…</p><p class="story-paragraph">南看到女儿空着手在玻璃门后面等她。</p><p class="story-paragraph">是和纱夏一起回家的日子。</p><p class="story-paragraph dialogue">“我以为你们还要聊一会。”纱夏站到她身侧。</p><p class="story-paragraph dialogue">“等很久了？”南牵过女孩。</p><p class="story-paragraph dialogue">“没有。”纱夏回答她。</p><p class="story-paragraph">板仓叔叔站在妈妈身边高高大大的，他们的氛围看上去很搭。</p><p class="story-paragraph">她犹豫了两秒，手指挤进了南的指缝。</p><p class="story-paragraph">板仓的车没和纱夏停在一起，他要绕到另一边去。</p><p class="story-paragraph">这正好是他所希望的。</p><p class="story-paragraph">巴不得赶紧走，纱夏和护食似地护着南，肉麻得他鸡皮疙瘩都起来了。“有什么帮得上忙的尽管联系。”知道南在东京的朋友不算多，有的那么几个可能还都是事务所的同事，他的诺言很慷慨。</p><p class="story-paragraph dialogue">“你事情多，”南委婉地拒绝他：“以后不要再操心了。”</p><p class="story-paragraph">板仓没理，他径直望向南的女儿：“你妈妈不联系我的话，你联系我。”</p><p class="story-paragraph">女孩倒没点头，只应了声，她礼貌地谢过板仓叔叔，目送他走了以后才动。</p><p class="story-paragraph">纱夏帮妈妈拉了车门，她接着打开驾驶座，坐上属于南的那个位置。</p><p class="story-paragraph">南可是第一次看这情景，她觉得很新奇。</p><p class="story-paragraph dialogue">“还是我开回家？”靠纱夏打点方方面面的琐事，南怕辛苦她。</p><p class="story-paragraph dialogue">“不相信我？”女儿有模有样地起步，方向盘都在她手上牢牢把着了，南再怎么说也没法将它夺过来，只好又坐了回去。</p><p class="story-paragraph">算了，万一驾驶的时候她不舒服了怎么办？</p><p class="story-paragraph">她转念想想，主动放弃了。</p><p class="story-paragraph">南乖乖靠在座位上，不由自主地侧了头盯着女儿看。</p><p class="story-paragraph">她没意识到自己的视线有多直白，弄得女孩半张脸都有点热。</p><p class="story-paragraph dialogue">“要不睡一下，”纱夏有点忐忑，独自开车或者接美沙的时候她都不紧张，妈妈坐在边上，不知怎的，她倒是有种被检视的错觉：“到了我叫你。”</p><p class="story-paragraph">南挑起眉，这句话她以前常说——对早上被自己喊醒抱上车以后还犯瞌睡虫的女儿说。</p><p class="story-paragraph">没想到她有天也能听到…</p><p class="story-paragraph">从没在自己的车上享受过这样的待遇，南倒真想尝试看看。</p><p class="story-paragraph">她动了动身子，在找舒服的姿势。</p><p class="story-paragraph dialogue">“那我睡了？”没想到南这么好说话，还没解释堵车可能会费时间，她就用余光瞥见妈妈闭好了眼睛。</p><p class="story-paragraph dialogue">“好。”纱夏之后都没再出声，她连换挡的力道都很轻。</p><p class="story-paragraph">车里开了空调，温度定在二十六，有出风口对着妈妈，扇叶往下打也会朝南吹。</p><p class="story-paragraph">纱夏在等红绿灯的间隙扭过去拿了毯子，把它披在妈妈身上。</p><p class="story-paragraph">南没有动，她好像就睡着了，纤长的睫毛偶尔轻颤一下，眉头没有像毒瘾发作时那样紧紧拧在一起，呼吸声很平稳。不过三十来分钟的路，她竟做了个梦。</p><p class="story-paragraph">接到了大官司，案子马上要审了，关键时刻南找不到审案的法庭在哪。</p><p class="story-paragraph">门上的数字牌号不断地变换，她听见自己的高跟鞋踩在地板上发出尖锐的声响。</p><p class="story-paragraph">南想要拉一个路人问问，才发现平日人满为患的大楼空空如也。</p><p class="story-paragraph">阴冷的湿气绕着脊背往上爬，暗处好像躲着什么东西哼哧哼哧地喘气。</p><p class="story-paragraph">脑海里划过了神木堂的那张脸，她有些害怕，倒退了往后走。</p><p class="story-paragraph">黑暗里浮现了两只眼睛，南差点惊叫出声。</p><p class="story-paragraph">下一秒她就被什么东西扑倒，肩膀抵在了冷冰冰的墙上。</p><p class="story-paragraph">南不敢看，她尽全力地反抗，手和脚却怎么都使不上劲，像抽了骨头以后只剩了软绵绵的肉。</p><p class="story-paragraph">那东西身上全是毛，散发着热量。</p><p class="story-paragraph">但它来回弄了这么久，好像只是要和她玩，用的力气也小，没有要伤害她的意思。</p><p class="story-paragraph">南缓缓地睁了眼。</p><p class="story-paragraph">原来是只很大的白狗。</p><p class="story-paragraph">它在南面前摇尾巴，见她理自己了，高兴得连兽耳都竖起来晃，还凑近了舔她。</p><p class="story-paragraph dialogue">“痒…”被又湿又热的舌头碰，南缩了脖子躲，憋不了笑。</p><p class="story-paragraph">这下她是真的醒过来了。</p><p class="story-paragraph">纱夏和她之间隔了层毯子，作乱的人就是她。</p><p class="story-paragraph">女儿一直伏在耳边亲自己。</p><p class="story-paragraph">叫醒服务也太热情了，南被吻得一脸口水。</p><p class="story-paragraph">只是夸张手法。</p><p class="story-paragraph">见她醒了，女儿的吻转移到了她的嘴唇，探了舌头进来。</p><p class="story-paragraph">纱夏的吻总是很甜的，甜得南忍不住和她多亲几下。</p><p class="story-paragraph">不过刚刚还在睡觉，南眼皮很重，被吻得晕乎乎的，不小心将细毛吸进了鼻子里。</p><p class="story-paragraph">她当机立断地用手撑住纱夏的肩膀，头偏过去，打了一个小小的喷嚏。怕妈妈感冒，纱夏挡在空调的出风口前面。</p><p class="story-paragraph dialogue">“睡得还好吗？”</p><p class="story-paragraph dialogue">“睡得好。”南不打算告诉女儿自己做了个梦。</p><p class="story-paragraph">还梦到你了。</p><p class="story-paragraph">想起那只狗，她觉得那就是纱夏。</p><p class="story-paragraph">如果直截了当地和女儿说她是小狗，纱夏肯定会和她闹情绪的。</p><p class="story-paragraph">女孩跟着南笑，没有任何意义的幼稚举动。</p><p class="story-paragraph">妈妈开心她就开心。</p><p class="story-paragraph">纱夏眼睫上架起了色彩分明的霓虹：“到家了。”</p><p class="story-paragraph dialogue">“嗯。”南伸手捏女儿的鼻子。</p><p class="story-paragraph">记得很清楚，由自己领回家时那个坐在副驾驶座上沉默不语的女孩。</p><p class="story-paragraph">谢谢你…</p><p class="story-paragraph">她的心软绵绵地化成一滩水。</p><p class="story-paragraph">来接我回家。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">以前南从不觉得自己恋床，没想到一躺进熟悉的被窝以后就丢了戒心。</p><p class="story-paragraph">一觉过了下午，窗帘都没必要继续拉上了，原先透的光都转成了夜间的暗影，一点也不刺眼。</p><p class="story-paragraph">睡了得有三四个小时，她的力气恢复得很好。</p><p class="story-paragraph">女人将被子翻到一边再起身，她简单地铺了两下床以后扯开了罩在落地窗上的布。</p><p class="story-paragraph">虽然发生的事可谓是为她带来了翻天覆地的变化，但南不得不承认，东京还按照它一如既往的规律行进。</p><p class="story-paragraph">上万块碎片组成的拼图，缺她一人无伤大雅。</p><p class="story-paragraph">噪音被厚重的透明板隔绝了，城市的夜景伏在她脚下，流动的车光灯像海里的鱼。</p><p class="story-paragraph">海底的世界庞然又安静。</p><p class="story-paragraph">其实令南惊讶的远不止于此，刚进家门她就说过了。家具摆设丝毫未动，衣柜里的服饰也按她的习惯挂在原位。</p><p class="story-paragraph">南有种只出门几天的错觉。</p><p class="story-paragraph">尽管只是穿着睡裙，大腿光裸着，南也没觉得很冷，毕竟进入夏天以后气温还在升。</p><p class="story-paragraph">她坐在乳白色的大理石台上，双手捧着膝盖，眉眼间透出的气质倒干净得有几分小孩的样子。</p><p class="story-paragraph">真好…</p><p class="story-paragraph">纱夏还能再陪她一会。</p><p class="story-paragraph">南在发呆，她生病以后就经常发呆，所以期间听到了乐音也没在意。</p><p class="story-paragraph">吃完安慰剂以后她各路妖魔鬼怪都见过了，这下南更加以为是自己又产生了什么飘渺的幻觉。</p><p class="story-paragraph">可是…</p><p class="story-paragraph">好像真是家里的音响发出的声音，南的耳朵捉到了她完全不熟悉的旋律。</p><p class="story-paragraph">节拍和韵律都很好，每个音符都清晰可辨。</p><p class="story-paragraph">卡点的节奏像华尔兹，不够复杂的圆舞曲。</p><p class="story-paragraph">她喜欢听古典音乐没错，虽然厉害，也不至于每首都熟稔于心，更没强到能幻想出一支从没听过的曲子。</p><p class="story-paragraph">难道自己吸毒以后成了艺术家，能编曲了？</p><p class="story-paragraph">南猜了个大概，她压下门把手。</p><p class="story-paragraph">纱夏坐在沙发上，看样子是刚洗了澡，挂在脖子那的毛巾垂了两端下来。</p><p class="story-paragraph">女儿换了套显得居家的衣服，上半身是颜色温和的棉质短袖，她穿了五分裤，露在外面的小腿线条很漂亮，皮肤水水润润的，透出健康的粉色。</p><p class="story-paragraph">女孩的头发没完全干，但也差不多了，她晃晃脑袋，南觉得水珠都撇到了她脸上来——</p><p class="story-paragraph">其实没有，只不过沐浴露和洗发水混在一起的香味很清新，是没有腥气的雨后土壤，南被葱郁的青草和长势茂盛的松木环着。</p><p class="story-paragraph">纱夏把家里那个音碟机开了，里面正转着唱片。</p><p class="story-paragraph">果然是她放的…</p><p class="story-paragraph">南看女儿张了双手，是拥抱的邀请。</p><p class="story-paragraph">她顺从地坐到纱夏的膝盖上，帮她擦起了头发。“没吵到你吧？”女儿领了好意，搂上她的腰。</p><p class="story-paragraph dialogue">“没有。”</p><p class="story-paragraph">女孩手掌的温度很暖和，南挂的空挡，乳房没有被内衣裹着，对方的眼神让她心跳不由自主地有些加速。</p><p class="story-paragraph">纱夏歪过脑袋想碰碰妈妈，一下意识到头发是湿的，还是坐着没动。</p><p class="story-paragraph dialogue">“去了音像店？”南掌管家里的一切唱片，确认正在放的这张不是自己买回来的。</p><p class="story-paragraph dialogue">“前几天。”纱夏的眼里躺着轮弯月，有点得意：“医生要我多陪你做你喜欢的事，要满足你的爱好。”</p><p class="story-paragraph dialogue">“你觉得我喜欢做什么事？”南一下来了兴致。</p><p class="story-paragraph">女儿头朝那边扬：“喜欢听这种音乐。”</p><p class="story-paragraph">南心情很好地笑笑：“还有吗？”</p><p class="story-paragraph dialogue">“喜欢看书。”要不是自己学了文学，在阅读量上不可能追过妈妈。</p><p class="story-paragraph dialogue">“读书费眼睛，”纱夏补充一句：“你想看什么告诉我，我讲给你听。”</p><p class="story-paragraph dialogue">“这么好，”南打趣道：“什么都可以？”</p><p class="story-paragraph dialogue">“嗯，家里没有的书都可以，”怕牛皮吹过了，女孩又改了口：“太偏的不行。”</p><p class="story-paragraph">南等着纱夏继续说，女儿的头发不会再淌水了，她停了手上的动作。</p><p class="story-paragraph dialogue">“喜欢窝在家里。”妈妈比她的同龄人还宅，逛街什么的都是提前列好清单才出去，住在新宿这么方便的地方，实在是太浪费了。</p><p class="story-paragraph">这算什么爱好…</p><p class="story-paragraph">南有点无奈。</p><p class="story-paragraph dialogue">“喜欢吃的东西有很多，”纱夏轻轻掰指头，好像在数：“我都做给你吃。”</p><p class="story-paragraph dialogue">“吃那么多会长胖的。”南被女儿可爱到了。</p><p class="story-paragraph dialogue">“就是要长胖，”纱夏破天荒地捏了妈妈的脸颊肉，为她证明：“你太瘦了。”</p><p class="story-paragraph">还有什么呢？</p><p class="story-paragraph">好像也没了。</p><p class="story-paragraph">妈妈工作那么忙，闲下来一般也就做这些，偶尔会捣弄香水香薰这种东西，但两人都靠聊天度过大多数时间。她们说话说得多，纱夏总爱分享自己的生活，南就一直做她的倾听者。</p><p class="story-paragraph">她从小跟着南长大，那些习惯都被对方摸得很清楚了。</p><p class="story-paragraph">纱夏当然也想听南说她的事，尤其想知道二十二岁以前的南经历过什么。</p><p class="story-paragraph">不过妈妈几乎从不主动聊起，她也就不过问。</p><p class="story-paragraph">既然已经知道了难言之隐…</p><p class="story-paragraph dialogue">“妈妈还有喜欢做的事吗？”她提问的方法有些谨慎，就算南不愿意告诉她，也不至于特别尴尬：“我不知道的。”</p><p class="story-paragraph">纱夏偷偷观察南的沉默。</p><p class="story-paragraph">对方好像不是不想答，只是在等什么东西。</p><p class="story-paragraph">女孩的直觉没错。</p><p class="story-paragraph">南在光线不足的客厅里肆无忌惮地盯着纱夏看。</p><p class="story-paragraph">西洋音乐有魔力，给女儿镀了层英伦贵族的装点。</p><p class="story-paragraph">坐在纱夏并拢的腿上，南的屁股贴着少女的皮肤，中间只隔着一层遮羞的内裤。</p><p class="story-paragraph">和女儿之间竟能产生如此致命的吸力，真不知是该哭还是该笑。</p><p class="story-paragraph">纱夏这张男女通杀的脸，还有她爱自己爱得对一切都不管不顾了的疯狂…</p><p class="story-paragraph">她的存在就足让南血液里迸发出一阵不详的躁动。</p><p class="story-paragraph dialogue">“当然有。”她起来，尾音上扬，手拉着女儿，把对方也拽动了。</p><p class="story-paragraph dialogue">“什么？”女孩不明白其中原因，还是听话地站直了身体。</p><p class="story-paragraph">录进这张碟里的大抵都是华尔兹，总算播到了南熟悉的那首。</p><p class="story-paragraph">不想将剩下的日子潦草地过完。</p><p class="story-paragraph">想留住纱夏不谙世事的表情，想让幸福的光辉永远停在她的脸上。</p><p class="story-paragraph">终局到来之前，这具残破的身体要是能讨纱夏欢心，要她做什么都愿意。</p><p class="story-paragraph dialogue">“陪我跳完这支舞。”她将手搭上了女儿的腰。</p><p class="story-paragraph">南的眼里滚动了旖旎不清的情愫，眸子里明灭的光点不停地闪，好像濒临失控的漩涡。“我就告诉你。”</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">碟还没放完，纱夏懒得关了，音乐毫不吝啬地在客厅响。</p><p class="story-paragraph">她抱着妈妈倒退了走，跌跌撞撞地开了主卧的门。</p><p class="story-paragraph">南求欢的信号很明显，她要女儿专心，自己却伸了舌头去舔她喉头那块不明显的软骨。</p><p class="story-paragraph dialogue">“妈妈喜欢跳舞？”纱夏的手撑在南耳朵两侧，猜到了她在上一轮留下来的答案。</p><p class="story-paragraph">与自己从社团里学到的三脚猫功夫有别。</p><p class="story-paragraph">妈妈能把最简单的舞步跳得优雅动人，基本功应该很好，和她这个门外汉显然不在同一个水平。</p><p class="story-paragraph dialogue">“答对了，”她夸女儿聪明：“不过很久没跳了。”</p><p class="story-paragraph">纱夏的爱意毫不掩饰地露出来：“好看。”</p><p class="story-paragraph dialogue">“哪里好看？”南懒懒地笑，不等对方回答就自己撩开睡裙下摆，牵       <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">五月里的一场美梦。</p><p class="story-paragraph">南赤裸地沐浴在夜晚编好的幻境里，浑身散发着炫目的美。</p><p class="story-paragraph">她的腿被架起来，臀瓣已经让纱夏揉得发热，下面那张嘴水光潋潋的。</p><p class="story-paragraph">被摧山搅海的快意折磨得不剩半分颜面，她竟从中寻到了某种隐秘的瘾头。</p><p class="story-paragraph">南脸颊上绯红的一片，全身泛起情潮带来的颜色，眸子里荡漾的月影被颤如蝶翼的睫毛遮住了。</p><p class="story-paragraph">半条命都给了女儿，在她那只手里捏着，南一句像样的话也说不出，细软的哭喊都变得高亢。</p><p class="story-paragraph">纱夏目不转睛地盯着她看。</p><p class="story-paragraph">和天使一样干净又不可亵渎的脸蛋有区别，妈妈的小穴有最贪心的脾性，总好生地伺候着她，绞紧了手指就要往里吞。</p><p class="story-paragraph">女孩在南汗湿的鬓角那亲了亲，眼里有执迷不悟的痴嗔。</p><p class="story-paragraph">纱夏年少懵懂时，心里就只有妈妈了。</p><p class="story-paragraph">要她苟活，撤回这覆水难收的爱…</p><p class="story-paragraph">比同生共死更痛。</p><p class="story-paragraph">凛然不可犯的妈妈也成了尘世间的凡人。</p><p class="story-paragraph">会为肉欲折服，甘愿在她的面前卖力地扭腰。</p><p class="story-paragraph">也会露出这样淫荡的表情，被她玩到高潮。</p><p class="story-paragraph">纱夏由衷地感谢潘多拉的盒子被谁图了贪玩之心打开。南是从神坛上跌落。</p><p class="story-paragraph">她每陨灭一寸，就离女孩更近。</p><p class="story-paragraph">这星星迟早掉进她手心。</p><p class="story-paragraph">南已经是副沉溺于爱欲中的样子，她搂着女儿的脖子，再无暇思考任何与情爱无关的琐事，自然忽略了她眼里闪烁的危险信号。</p><p class="story-paragraph">纱夏还在用甜言蜜语软声哄她。</p><p class="story-paragraph">女孩黏黏腻腻的声线好似烤融的棉花糖。</p><p class="story-paragraph dialogue">“妈妈…”纱夏掐着她敏感的腰侧，纤纤五指一下又改换了轻柔的力道：“舒服吗？”</p><p class="story-paragraph">南差点摇头求饶，这人在她身上作威作福还不够。</p><p class="story-paragraph">简直是胡搅蛮缠。</p><p class="story-paragraph">被女儿逼得哭了，她飞红的眼角挂了泪珠。</p><p class="story-paragraph">南的手落在纱夏光洁的肩膀上，几次都忍不住要抓她，可又怕弄疼女儿，好歹还是憋了回去。</p><p class="story-paragraph">即使是这样，她还是温顺地满足了纱夏的愿望，喑哑的嗓断续地吐出个词来。</p><p class="story-paragraph dialogue">“舒服…”</p><p class="story-paragraph">花瓣被吻进了南的嘴里。</p><p class="story-paragraph">少女的气息都是芬芳沁甜的，比那些争艳的万紫千红好闻了不知多少倍。</p><p class="story-paragraph">她闭了眼睛，和女儿吻得忘我，舌头缠在一起的水声啧啧。</p><p class="story-paragraph">上下两张嘴同时被侵犯，饶是南再厉害也敌不过纱夏这样的索求。</p><p class="story-paragraph">她喉间发出呜呜的泣声示弱，腰身挺动的速度放缓了。</p><p class="story-paragraph">女儿松了她。</p><p class="story-paragraph">这世间还存着像纱夏一样温柔的玫瑰吗？</p><p class="story-paragraph">在她面前将刺都摘了，只把最美的那部分给她。</p><p class="story-paragraph">纱夏的眉梢眼尾勾起的风情万种。</p><p class="story-paragraph">那样无邪地唤着她妈妈的女孩，竟能在床上将她弄得颠三倒四的。她的身体是这么喜欢纱夏，半点谎都撒不了。</p><p class="story-paragraph">被操得发红的小穴还不知耻地迎合她，要女儿的手指继续插在里面捣她的花心。</p><p class="story-paragraph">受不了纱夏那样摄人心魄的美，南没有嘴硬的余地。</p><p class="story-paragraph">她将头埋在女儿的肩窝里，舔吻起纱夏线条优越的锁骨，心满意足地换来了对方更猛烈的动作。</p><p class="story-paragraph">一声比一声要娇的喘息再明显不过地昭示着南要高潮了。</p><p class="story-paragraph">虽然看不到她的表情，但纱夏敏锐地察觉到妈妈那处细微的变化，甬道又开始用不小的力气咬人，湿软内壁的褶皱变本加厉地贴紧她。</p><p class="story-paragraph">纱夏起了坏心思，她全部抽出来，手指顺着那发抖的缝隙探。</p><p class="story-paragraph">妈妈股间那两片又滑又软的嫩肉依依不舍地挽留她，可怜兮兮地要她爱抚。</p><p class="story-paragraph">纱夏没心软，她弯起指节，依了自己的心情乱压，另一只手将妈妈的臀打得发颤。</p><p class="story-paragraph">女儿毫无规律可循的欺侮将南的音调都拔高了，她嘴里含混不清地念纱夏的名字，尊严全无地求她。</p><p class="story-paragraph">南没再矜持，理智彻底地熄灭。</p><p class="story-paragraph">在女儿炽热的视线底下明目张胆地压了她的手，南摆好屁股就往下坐。</p><p class="story-paragraph">纱夏觉得自己在下面像某个工具。</p><p class="story-paragraph">不过她不在意这些，妈妈想怎么用她就怎么用。</p><p class="story-paragraph">南的身子轻轻地颠簸起落，就像在纱夏怀里冲浪一样，那对兔子也依着动作晃来晃去。</p><p class="story-paragraph">女孩凑过去，在妈妈坚挺的乳头上咬了一口。</p><p class="story-paragraph">她故意让南害臊，温暖的口腔包住了妈妈的整个乳晕。</p><p class="story-paragraph">女孩含吮着嫣红的首部，它被咬得肿了，像是给顽劣孩童逮着的糖球。</p><p class="story-paragraph">南被她吃得又痛又痒。</p><p class="story-paragraph">纱夏的舌头细致地扫过上面用来分泌乳汁的小孔，喉咙里发出吞咽的动静。</p><p class="story-paragraph">娇娇嫩嫩的酥胸不经逗，又或者是以此身份做着这样的事实在太羞耻，南有想推开她的念头，但纱夏不让她跑，手不容置疑地锁在她腰间。</p><p class="story-paragraph">填了水的池子只进不出，决堤的快感要冲破最后一层防线，她连脚趾都微微蜷着。</p><p class="story-paragraph">少女软软地叫她妈妈，一声一声的。赤诚的汹涌爱意坦白地露给她。</p><p class="story-paragraph">纱夏映入月光里的那半张脸漂亮得像画，爱琴海的万顷碧波在她瞳孔里起伏。</p><p class="story-paragraph">女孩宛若雕塑一样瓷白的皮肤浮起了剔透的粉，唇边是她没有克制动作幅度以后流出来的涎水。</p><p class="story-paragraph">纱夏是她最纯洁的爱神。</p><p class="story-paragraph">是刚被她哺乳过，脸颊上还沾了奶渍的孩子。</p><p class="story-paragraph">南彻底失守，她哆嗦着抽噎，力气全施在纱夏的胳膊上。</p><p class="story-paragraph">还是没舍得挠她，女儿的手臂上只留下了她红色的指印。</p><p class="story-paragraph">纱夏虚揽着妈妈，轻吻她的头发。</p><p class="story-paragraph">南整个人偎着她，攀上顶峰以后没了劲，竟在这温柔的举动里迷糊地打起了盹。</p><p class="story-paragraph">她在半梦半醒间感觉到女儿挪开了手，下意识地拉住了她。</p><p class="story-paragraph dialogue">“要去哪？”南小声地问纱夏。</p><p class="story-paragraph dialogue">“哪里都不去。”她只是想翻身，没料到对方这么紧张：“妈妈睡一会我们再吃饭。”</p><p class="story-paragraph">经这么一提醒南才想起她午觉以后就进了夜晚。</p><p class="story-paragraph">纱夏也陪她，两人干脆错过了晚餐。</p><p class="story-paragraph">今日已经断续地睡了不长时间，南是真的想和困意作斗争的。</p><p class="story-paragraph">但她的眼皮又无可奈何地变沉了。</p><p class="story-paragraph dialogue">“十五分钟以后叫我…”南给自己定了个时间，尾音全部黏在一起。</p><p class="story-paragraph dialogue">“好。”女儿在她耳朵上亲了亲。</p><p class="story-paragraph">纱夏没有手表，她本就不打算在一刻钟以后准时喊醒妈妈。</p><p class="story-paragraph">如此果断地应下，也是因为她在敲自己的小算盘。</p><p class="story-paragraph">南毫无防备地入眠，不知女儿还在痴痴地看她。</p><p class="story-paragraph">什么声音都被隔绝在外。</p><p class="story-paragraph">她在等南睡着。</p><p class="story-paragraph">妈妈深深浅浅的呼吸落在她耳边，逐渐平缓了。纱夏试探地抚上她的肌肤，而南没有因为这样的动静苏醒。</p><p class="story-paragraph">女孩有种做坏事的怯意，失控的行为却由不得她所剩无几的理性操控。</p><p class="story-paragraph">纱夏被蒙了心智，鬼使神差的，她的手指转向了南的股间。</p><p class="story-paragraph">那里还残留着情事的痕迹。</p><p class="story-paragraph">纱夏摸到那片粘腻的水液。</p><p class="story-paragraph">那是她弄出来的，和妈妈做爱的人是她。</p><p class="story-paragraph">心跳得很快，纱夏出汗了。</p><p class="story-paragraph">她的指尖沾上南的体温以后才往回抽。</p><p class="story-paragraph">手沿着自己的小腹往下滑，女孩将湿透了的短裤拨到一边去。</p><p class="story-paragraph">纱夏并起刚刚用的那几根手指，没有犹豫，急不可耐地去玩那颗怯生生探出头来的小肉芽。</p><p class="story-paragraph">粗糙的涩麻快意立刻从尾椎骨升起。</p><p class="story-paragraph">纱夏很小心，咬着嘴巴不让喘息声泄出来。</p><p class="story-paragraph">少女的阴蒂完完全全地挺立，胆小地发着颤，想要人好好疼爱一番。</p><p class="story-paragraph">同龄的人也许会想着爱慕的男生自慰，但纱夏性幻想的对象就躺在她身边。</p><p class="story-paragraph">女孩早就情动了，又熟悉自己身体的敏感点，摸了两下就进入状态了。</p><p class="story-paragraph">妈妈…</p><p class="story-paragraph">她没说话，只能通过口型看出那点羞于道人的放纵。</p><p class="story-paragraph">妈妈…</p><p class="story-paragraph">养了她十二年的南是蛊惑她冲破枷锁的源头。</p><p class="story-paragraph">如此卑劣无耻的行径，纱夏却一反常态地沉迷其中，手上的速度甚至不自觉地加快。</p><p class="story-paragraph">她贪恋地瞧着妈妈的睡颜，几乎仅仅是想用眼神就将南掠进身体里。</p><p class="story-paragraph">女孩的脸憋得通红，雪白的屁股轻轻地跟着揉搓的节奏耸动。</p><p class="story-paragraph">满室寂然和爱欲的呼吸交织在一起，被如水的月色化开。</p><p class="story-paragraph">这世界静得出奇，仿佛只剩她们两人独活。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">其实和以前的生活也是差不多的，细小的区别只在于那么几点。</p><p class="story-paragraph">对南而言，造成最大影响的那个变化是她不再要上班了。</p><p class="story-paragraph">至少现在这段时间不用。</p><p class="story-paragraph">她一下享有了曾希冀已久的闲暇，这情形可以类比那些突然得到大把财富的穷人。</p><p class="story-paragraph">南有些手足无措，不知将它们花在哪些事上。</p><p class="story-paragraph">幸好纱夏兑现了承诺，给了她一个去处。</p><p class="story-paragraph">要是她想，南可以将自己丢进女儿的怀抱。</p><p class="story-paragraph">纱夏平日里就爱说俏皮话逗她笑，讲话也不乏味。</p><p class="story-paragraph">听学文学的人讲故事比看书轻松了不少。</p><p class="story-paragraph">女儿脑子装的东西都叫南一愣一愣的，她对自己几乎是有求必应，著名的书作都能道出个大概。</p><p class="story-paragraph">南扭头看纱夏，有点探究的意味。</p><p class="story-paragraph">女孩觉得奇怪，停下来眨眨眼。</p><p class="story-paragraph dialogue">“怎么了？”她询问的视线对着妈妈。</p><p class="story-paragraph dialogue">“我发现你很适合当老师，”南点点她的额头：“以后正好也留在大学里做研究。”</p><p class="story-paragraph">女儿的身体好像短短地僵硬了一秒，但那点有迹可循的异常很快就消失了，似乎只是南的错觉。</p><p class="story-paragraph dialogue">“为什么这么说？”纱夏顺了句子的意思问她。</p><p class="story-paragraph dialogue">“学生会喜欢你。”连看都没看到女儿以后的样子，南却很肯定。</p><p class="story-paragraph dialogue">“学到不少东西。”她的语速逐渐慢了下来，对纱夏笑笑。</p><p class="story-paragraph dialogue">“难怪教授要你去国外读书。”</p><p class="story-paragraph">知道女儿舍不得离开自己，南的那颗心为自己说出这样残忍的话而感到钝痛。</p><p class="story-paragraph">纱夏没说话，将她揽得更紧了些。</p><p class="story-paragraph">南总在自我警告。</p><p class="story-paragraph">不能沉沦进这样平静的假象。她偶尔会觉得天空像一个巨大的漏斗，只要闭上眼便能听见振聋发聩的倒计时。</p><p class="story-paragraph">每驶过一秒，就有粒沙追着这样的动静从玻璃的空隙间滑落。</p><p class="story-paragraph">多想抛弃一切后果，不管不顾地和纱夏住在这间房子里。</p><p class="story-paragraph">纵情声色，哪里都不去。</p><p class="story-paragraph">她真的乐意这样做，到时候能顺理成章地因为滥用药物陷入绝境。</p><p class="story-paragraph">迎来最坏的结局也不要紧，再不用面对这些。</p><p class="story-paragraph">对她而言是轻松的解脱。</p><p class="story-paragraph">可是，自甘堕落的下场远不止于此。</p><p class="story-paragraph">皮肤会像她父亲一样、像所有吸毒的人那样溃烂，变得一点都不好看。</p><p class="story-paragraph">脾气越来越坏，万一在犯瘾的时候凶了女儿…</p><p class="story-paragraph">纱夏会讨厌她的。</p><p class="story-paragraph">南还是想体面一些。</p><p class="story-paragraph">自己的人生已是无足轻重，她不能让女儿的未来也搭在上面。</p><p class="story-paragraph">南摩挲纱夏的眉骨，眼神变得幽深。</p><p class="story-paragraph">至少…</p><p class="story-paragraph">在女儿离开之前，她必须要打起精神来。</p><p class="story-paragraph">清醒的时间多一点点的话，她们就能再创造些好的回忆了。</p><p class="story-paragraph">纱夏抓了她的手。</p><p class="story-paragraph dialogue">“现在才知道，”女儿的语调上扬，轻巧地转移了话题，换成副邀功的样子：“不夸夸我？”</p><p class="story-paragraph dialogue">“我女儿很优秀，”南的眼角因这个温柔的动作浮起了点细纹：“可以吗？”</p><p class="story-paragraph dialogue">“可以，”纱夏在她脸上亲了一下：“反正是你教得好。”</p><p class="story-paragraph dialogue">“我也没教你什么。”南想起自己常因应酬失去陪伴纱夏的机会，有些抱歉。</p><p class="story-paragraph">可女儿摇摇头，她将眼睛瞪得圆溜溜的，极力反对这句话。</p><p class="story-paragraph dialogue">“都是你教的。”“以偏概全，”南因此哑然失笑：“哪有那么多东西能学？”</p><p class="story-paragraph dialogue">“就是有。”纱夏用鼻子来碰她。</p><p class="story-paragraph dialogue">“好，”南不和女儿争，换了个更舒服的姿势躺好：“你说有就有。”</p><p class="story-paragraph dialogue">“妈妈不信我。”</p><p class="story-paragraph">纱夏不依不饶地要她接受这份感谢，故意挠她的痒，害得南蜷起身子躲。</p><p class="story-paragraph">她想按住纱夏，但对方一定要讨个说法。</p><p class="story-paragraph dialogue">“信…”南的语气都因为带笑显得不够严肃了。</p><p class="story-paragraph dialogue">“这还差不多。”女儿乖乖放过她。</p><p class="story-paragraph">南的脸被闹得有点红。</p><p class="story-paragraph">她牵着纱夏刚刚捣乱的手，轻轻掰她的指节，作势惩罚女儿的调皮。</p><p class="story-paragraph">纱夏的眼里跳动着狡黠的光芒。</p><p class="story-paragraph dialogue">“别太用力，”女儿暧昧地调笑她，意有所指：“万一坏了…”</p><p class="story-paragraph">纱夏吃痛地嘶了一声，南反其道行之，看她没那么嚣张以后才松开。</p><p class="story-paragraph dialogue">“坏了就坏了，”南去摸纱夏的上唇，眼神里有点故意为之的轻蔑：“反正还有这里。”</p><p class="story-paragraph">女儿咬住她的指尖，身子倾倒着压下来。</p><p class="story-paragraph dialogue">“妈妈要不要试试哪个更好用？”纱夏开始不安分地挑她的衣服。</p><p class="story-paragraph dialogue">“不方便，”南笑吟吟地摇头，截了她的动作：“生理期。”</p><p class="story-paragraph">女儿的表情不太好，不过是在体贴她。</p><p class="story-paragraph dialogue">“又提前了，”纱夏显得忧心忡忡，才松下去的眉拧成了结：“是因为吃药？”</p><p class="story-paragraph dialogue">“普通的感冒药也有副作用。”女儿那紧张样让南有点想笑。</p><p class="story-paragraph dialogue">“还有没有哪里不舒服？”纱夏小心地将她拥着。</p><p class="story-paragraph dialogue">“没有了。”南吻吻女儿的眼睛。</p><p class="story-paragraph dialogue">“如果有就要说，”纱夏没那么容易上当：“不能憋着。”</p><p class="story-paragraph">她答应下来，波澜不惊地骗女儿：“我会和医生沟通的。”纱夏像想起什么一样，起身拿了手机。</p><p class="story-paragraph dialogue">“一个星期以后，”她在检查复诊的时间：“我到时陪你。”</p><p class="story-paragraph dialogue">“不用，”南拒绝了，拿着病历去家隔壁的医院而已，走个十来分钟就能到，她还没病到一碰就碎的程度，不必纱夏费心费力：“你有事的话就去学校。”</p><p class="story-paragraph dialogue">“好，”纱夏没有夸下海口，她如今还不至于完全空闲：“那没事再一起。”</p><p class="story-paragraph">女儿这么些天是难得出门，但亟待毕业的学生依然需要处理杂务。</p><p class="story-paragraph">纱夏前段时间为非作歹的请假事迹已经惹怒了几个老师。</p><p class="story-paragraph">女儿有时会被一个电话叫走，但担心她在家发作，基本上不到半日就能赶回来。</p><p class="story-paragraph">尽管如此，南仍旧觉得有些难熬。</p><p class="story-paragraph">纱夏在大学寄宿的那些工作日她倒没这样过。</p><p class="story-paragraph">人一忙起来，精力就要被分散。</p><p class="story-paragraph">那时律师也辛苦，对女儿的思念自然也不那么多。</p><p class="story-paragraph">南自律了二十多年，突然成了无所事事的特权者，倒变得比以往脆弱了些。</p><p class="story-paragraph">不想让女儿对此有所顾忌。</p><p class="story-paragraph">如此期待她回家的愿望，南也不会表现出来。</p><p class="story-paragraph">可纱夏像读了她的心一样。</p><p class="story-paragraph">女儿总共就出去了那么几次，每次都要给她带点什么东西，变着法子为她准备惊喜。</p><p class="story-paragraph">上回南一拉开门就被那大阵仗吓到了。</p><p class="story-paragraph">纱夏捧着束能将脸都遮住的玫瑰站在她面前。</p><p class="story-paragraph">给别人来干就是很不合时宜的荒唐行为——送刚出院的病人玫瑰花——谁能做得出这样的傻事？</p><p class="story-paragraph">可放在纱夏身上，就是那么理所当然。</p><p class="story-paragraph">南觉得好玩，女儿想逗自己高兴的小孩子模样是讨人欢心得很。</p><p class="story-paragraph">纱夏隔着那捧花吻她，又将玫瑰塞进她手里。</p><p class="story-paragraph">她已经很久没接到过花了。刚刚还自在的南转瞬就变得有些无措。</p><p class="story-paragraph">她抱着这用褐色礼品纸捆好的花束站在原地。</p><p class="story-paragraph dialogue">“会坏掉吗？”南细细地看这些拥有饱满色泽的花瓣，觉得这么美的东西谢了未免也太可惜。</p><p class="story-paragraph dialogue">“先放在花瓶里面，”女孩将包扔到一边：“到时做成干花就好。”</p><p class="story-paragraph dialogue">“不用特意做干花了。”南突然冒出这么一句。</p><p class="story-paragraph">圈住她的纱夏愣了会，她们刚刚还在聊看病的事。</p><p class="story-paragraph">女孩很快就反应过来。</p><p class="story-paragraph dialogue">“妈妈不是怕坏吗？”纱夏扭过头吻她鼻梁上的痣：“干花能放很久。”</p><p class="story-paragraph dialogue">“顺其自然也很好。”南勉力笑笑，语气是难察觉到的落寞。</p><p class="story-paragraph">做成干花的玫瑰也是死的，她不想讲出来扫了女儿的兴。</p><p class="story-paragraph">与其剥夺鲜花的生命供自己观赏，不如就这样让它们按自己的节奏凋谢。</p><p class="story-paragraph dialogue">“好。”女儿在她耳边低低地说话：“听你的。”</p><p class="story-paragraph dialogue">“喜欢你才送你的，”纱夏好像参透了她的想法，捏捏她的手：“不要有负担。”</p><p class="story-paragraph dialogue">“谢谢。”南温顺地蹭蹭她，领了她的好意。</p><p class="story-paragraph dialogue">“下次给你买多肉，”纱夏的下巴抵在她肩头：“那个可以用来养。”</p><p class="story-paragraph">养一株活物…</p><p class="story-paragraph">是浪费。</p><p class="story-paragraph">戒毒所能带这种东西进去吗？</p><p class="story-paragraph">在她走了以后，生命力再顽强的多肉缺了人照料…</p><p class="story-paragraph">也难逃一死。</p><p class="story-paragraph">她想象了一下，植物绿色的茎叶在窗台上慢慢蜷缩枯萎的样子。</p><p class="story-paragraph">南的心里突然就空荡荡的，找不到地方落脚。</p><p class="story-paragraph">她没拦住鼻头的酸涩。</p><p class="story-paragraph">怎么变得这样多愁善感了？等反应过来的时候，她才发现自己的肩膀已经开始发抖。</p><p class="story-paragraph">听到了呜咽声，纱夏慌张地将她的身子转过去。</p><p class="story-paragraph">南的眼泪烫得女孩发怵。</p><p class="story-paragraph dialogue">“怎么了…”纱夏被她的泪水熏红了眼眶：“不舒服？”</p><p class="story-paragraph dialogue">“没事…”南埋在女儿胸口摇头，她控制着说话的腔调，那些断续的停顿却不是她想就能止住的：“可能是…吃药…影响心情…”</p><p class="story-paragraph">纱夏在哄她，她体贴地安慰自己。</p><p class="story-paragraph">女儿吻掉她的眼泪，五指叉开为她梳顺发丝的动作也很轻。</p><p class="story-paragraph">是那么想多陪纱夏一下，可她们终究无法殊途同归。</p><p class="story-paragraph">孤零零的，就那样被放在家里，独自死去的多肉。</p><p class="story-paragraph">南垂下去的手抓紧了女儿的衣摆。</p><p class="story-paragraph">她不知怎地想起了纱夏。</p><p class="story-paragraph">想起每次被她丢下以后，独自等她也没有丝毫怨言的…</p><p class="story-paragraph">她孤零零的女儿。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">南的情绪起伏比以前要大。</p><p class="story-paragraph">她皮肤白，流眼泪的痕迹还算明显，破绽一下就让纱夏抓住了。</p><p class="story-paragraph">虽知道这是无可避免的，女孩还是不希望妈妈伤心。</p><p class="story-paragraph">南性子闷，纱夏不想情况恶化下去。</p><p class="story-paragraph">妈妈之前明明是那么爱读书。</p><p class="story-paragraph">她现在却连书房都去得少了，要看什么都是叫自己讲来听的。</p><p class="story-paragraph">纱夏知道这和她生病脱不了干系。</p><p class="story-paragraph">在等她回家的时候，妈妈会孤单吗？</p><p class="story-paragraph">家里没养任何东西，宠物就别说了，用来装点环境的小盆栽都没有。妈妈没对它们表现过明显的兴趣，要摸清她的取向有很大难度。</p><p class="story-paragraph">就此展开过一次话题…</p><p class="story-paragraph">纱夏再三犹豫，还是给南买了一盆虹之玉。</p><p class="story-paragraph">卖花的老板说这种多肉被太阳光晒久了以后就会变色，青绿的叶会逐渐转成玉红。</p><p class="story-paragraph">纱夏觉得这是植物回馈主人的小心思，应该能打动妈妈。</p><p class="story-paragraph">她照例急着走，没在花卉市场停留多久。</p><p class="story-paragraph">下午出了太阳，纱夏到家的时候额头上都沁出了汗珠。</p><p class="story-paragraph">再等几天就可以开空调了。</p><p class="story-paragraph">南从她手里将盆栽接过去的时候面无表情，纱夏谨慎地在旁边观察她的反应。</p><p class="story-paragraph">妈妈的沉默叫她有些忐忑，她怕对方要她拿去退掉。</p><p class="story-paragraph dialogue">“只要浇水就好吗？”女孩听到南这样问自己。</p><p class="story-paragraph">纱夏应声，松了口气，心里的石头跟着落地了。</p><p class="story-paragraph">妈妈抱着那个陶瓷花盆，神情很认真。</p><p class="story-paragraph">纱夏不知南在想什么，她看得久了，竟在妈妈眼里找到点惘然的意味。</p><p class="story-paragraph">这目光像是刺一样扎在她身上，扎得她猛一疼。</p><p class="story-paragraph">纱夏的太阳穴开始突突地跳。</p><p class="story-paragraph">她不愿再想，抬起头环顾四周，在找能放它的地方。</p><p class="story-paragraph dialogue">“摆在那吧。”纱夏指指那张黑桃木做的桌子，上面还有以前去京都时从手艺人那淘来的孤品，包括一只点了半边眼睛的达摩。</p><p class="story-paragraph">靠近窗台的位置，照得到光。</p><p class="story-paragraph">她又从妈妈手里拿了那盆虹之玉，轻轻地搁在上面。</p><p class="story-paragraph">家里能有点生气，还多了个东西陪妈妈一起等她回家。</p><p class="story-paragraph">纱夏没将这目的公之于众。</p><p class="story-paragraph dialogue">——幼稚。妈妈肯定会这么说她。</p><p class="story-paragraph">纱夏耳朵里好像听到了妈妈温和的纵容语调。</p><p class="story-paragraph">她觉得自己买虹之玉回来是正确的举措。</p><p class="story-paragraph">这间屋子里有什么在腐烂破败，臭味被草木的清香盖住了。</p><p class="story-paragraph">妈妈没有表现出特别热衷的样子，但纱夏每次想浇水时都发现那土壤是湿润的。</p><p class="story-paragraph">她用手抚摸那几片支起来的叶子。</p><p class="story-paragraph">希望的光点划出来的轨迹在纱夏眼里忽闪忽现，蜿蜿蜒蜒地行进。</p><p class="story-paragraph">它的确一天比一天长得好了。</p><p class="story-paragraph">她的脸没入了阴影之中，侧面的轮廓被浸润得失真。</p><p class="story-paragraph">纱夏是按医嘱给药的，前半个月还不能减量，每天都要喂给南吃。</p><p class="story-paragraph">就算是吃药，毒瘾依然毫无预兆地侵袭她妈妈的身体。</p><p class="story-paragraph">那些原本平静的时刻…</p><p class="story-paragraph">南在她的怀里出汗发抖。</p><p class="story-paragraph">妈妈脸上是热的，双手却又是失温的冰凉，她疼得紧紧咬着牙齿。</p><p class="story-paragraph">南吸气的声音像无形的利刃，一刀一刀地割破了女孩的皮肤。</p><p class="story-paragraph">纱夏多希望这些阵痛都转移到她身上。</p><p class="story-paragraph">显然是不可能的，现代医学并未发达到这种地步。</p><p class="story-paragraph">没有长期的吸毒史，南发作周期和同类病人比起来算长的了，按规律来看…</p><p class="story-paragraph">她平均三天左右犯一次瘾。</p><p class="story-paragraph">但是当时注射的那针太猛，戒断药物的功效都没那么顶用。</p><p class="story-paragraph">让妈妈产生依赖心的毒品叫作伯利恒。</p><p class="story-paragraph">伯利恒。</p><p class="story-paragraph">纱夏一辈子都不会忘记这个名字。</p><p class="story-paragraph">妈妈甚至已经开始药物成瘾了，她脱毒所要经受的痛是常人无法想象的。喂给南美沙酮以后，病人还是会抽筋。</p><p class="story-paragraph">纱夏能感觉到妈妈的疼痛没有那么快就褪去，但毕竟是安慰剂，它好歹还是有点效果。</p><p class="story-paragraph">南的脉搏在吃药以后总要变慢。</p><p class="story-paragraph">她的呼吸受药效抑制，浅得吓人。</p><p class="story-paragraph">妈妈的脸上会晕开抹诡异的红晕，给人一种她很快乐的错觉。</p><p class="story-paragraph">也许她真的很快乐…</p><p class="story-paragraph">至少吃药比强撑着等待阵痛消失要舒服得多。</p><p class="story-paragraph">纱夏怕得要命。</p><p class="story-paragraph">伤害妈妈的人是她吗？</p><p class="story-paragraph">她想停下这样冷血的动作，却不得不接着留在南身边。</p><p class="story-paragraph">美沙酮的镇静效果很强，医生要她在观察病人服药以后的反应。</p><p class="story-paragraph">纱夏轻轻翻开她颤动着的眼皮。</p><p class="story-paragraph">能看见南的瞳孔因为口服可以当作毒品的药物以后缩小了，变得比以往尖细。</p><p class="story-paragraph">这样做究竟是救妈妈，还是在一点点杀死她？</p><p class="story-paragraph">她不知道。</p><p class="story-paragraph">必须要等着妈妈平静下来，要确保没有过量服药的危险发生。</p><p class="story-paragraph">纱夏在参加一场不知何时结束的长跑比赛。</p><p class="story-paragraph">目前看来…</p><p class="story-paragraph">她暂时赢过了那些可怖的东西。</p><p class="story-paragraph">医生开了能和美沙酮复合使用，专门用来强效阵痛的西米替丁。</p><p class="story-paragraph">怕妈妈会在舒缓中爱上那种快感，纱夏没敢拿。</p><p class="story-paragraph">那几盒未开封的药被她放进上了锁的抽屉里，包装盒也纹丝不动。</p><p class="story-paragraph">清醒需要花费的时长视妈妈的身体情况而定。</p><p class="story-paragraph">有时候她吃了药再休息一小会就能好，有时候她又要昏昏沉沉地睡上不久。纱夏还不知道药物能给南带来什么副作用，那是因人而异的。</p><p class="story-paragraph">她能做的事很少，就是尽量寸步不离地守着妈妈。</p><p class="story-paragraph">有什么在破土而出。</p><p class="story-paragraph">失去至爱之人的恐惧扎根盘踞在她的灵魂深处，那源头现在又汲取她的绝望做养料，在无边的暗处肆意生长。</p><p class="story-paragraph">纱夏的眼泪落在南的脸颊上。</p><p class="story-paragraph">她真的已经…</p><p class="story-paragraph">毫无办法。</p><p class="story-paragraph">好像也和妈妈一样吸了毒。</p><p class="story-paragraph">也许是接吻的时候她咬破了南的嘴唇，那血液渗进了她的舌头。</p><p class="story-paragraph">妈妈害她产生幻觉，害她有了瘾。</p><p class="story-paragraph">可她没有美沙酮替代以南为诱因的瘾。</p><p class="story-paragraph">那药对她而言是不存在的。</p><p class="story-paragraph">她的病甚至比南还要重。</p><p class="story-paragraph">因为纱夏唯一的安慰剂是妈妈，是世上独一无二的人。</p><p class="story-paragraph">她会和南做爱。</p><p class="story-paragraph">开启性事的契机草率得可笑，全凭感觉。</p><p class="story-paragraph">在她讲完某本书的结局以后，在妈妈从阵痛中苏醒以后。</p><p class="story-paragraph">抑或是其他的、在对视之下两人同时被情欲的藤蔓牢牢抓住的那个时刻。</p><p class="story-paragraph">南常常一言不发地吻过来，纱夏很自觉地将自己的衣服扒得一干二净。</p><p class="story-paragraph">她们在床上不着寸缕地发疯。</p><p class="story-paragraph">所有体液都混在一起，男女间最激烈的交媾也不过如此。</p><p class="story-paragraph">丢在地上的卫生纸沾了淫靡的气味，逐渐回温的夏日将它们晕开。</p><p class="story-paragraph">最致命的催情剂像厚重的精油浮层那样高高飘起，封住了逃跑的出口。再多呆一秒，谁也活不了了。</p><p class="story-paragraph">这究竟是贪图享乐的鱼水之欢，还是为争出谁爱谁更多的缠斗？</p><p class="story-paragraph">纱夏在撞破那些加在她身上的注解，在摧毁围困她的囚笼。</p><p class="story-paragraph">那些世道间最正统的规矩，她也曾好好地遵守过，甚至全都身体力行地验证了一遍。</p><p class="story-paragraph">却换来如此结局。</p><p class="story-paragraph">纱夏还是按时给药，按剂量给药。</p><p class="story-paragraph">她对妈妈从不怠慢丝毫。</p><p class="story-paragraph">纱夏一定要她好起来，一定要她变回原来的那个南。</p><p class="story-paragraph">妈妈犯毒瘾时失控的样子，她照单全收地吞进了肚子里。</p><p class="story-paragraph">纱夏还在等，等她的计划落成。</p><p class="story-paragraph">妈妈知道以后，也许会发火。</p><p class="story-paragraph">可女孩还抱有一点侥幸心。</p><p class="story-paragraph">妈妈对她很宽容，撞破她自慰也不生气，还好心地满足了她想被填满的愿望。</p><p class="story-paragraph">就连所有人都无法接受的、例如一个大逆不道的女儿爱上母亲的这种事。</p><p class="story-paragraph">南也原谅了她。</p><p class="story-paragraph">那么，她为了留下来而耍的那点任性的花招。</p><p class="story-paragraph">南也没有理由不原谅她。</p><p class="story-paragraph">反正她下定决心了。</p><p class="story-paragraph">如果象征末日的爱从一开始就沾了血腥气，兜转着也逃不脱往无尽的深渊里坠的命运。</p><p class="story-paragraph">那她就永远陪着妈妈。</p></div>

<template id="template-chapter-23"><section class="chapter" aria-labelledby="heading-chapter-23">

        <h2 id="heading-chapter-23">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">南的睡眠本来就浅，有时竟能赶在夏日彻底天亮以前醒转。</p><p class="story-paragraph">拉好的隔光窗帘也难挡晨曦。</p><p class="story-paragraph">南在这张床上以同样的躺姿见过日出的样子，她想象在此刻升至半空的薄云，起初是纯白的，又在周而复始的飘行之中染上那点稻麦色的淡金。</p><p class="story-paragraph">与这种静谧的安宁同时存在的是女儿平稳的呼吸。</p><p class="story-paragraph">南低头，身旁窝着的人还陷在梦境里，没有要醒来的迹象。</p><p class="story-paragraph">纱夏又不像她那样被磨得不剩什么瞌睡，的确是能多休息一会。</p><p class="story-paragraph">女儿沉睡的样子看起来很听话。</p><p class="story-paragraph">这并不是说她醒着就叛逆乖张了。</p><p class="story-paragraph">只是…</p><p class="story-paragraph">南现在有点怕她。</p><p class="story-paragraph">在纱夏面无表情的时候，她总下意识地将女儿外貌的张扬特点移植到她的性格上。</p><p class="story-paragraph">她酣然地睡着，眉宇间便没有凌厉的进犯气息，像少不更事的模样。</p><p class="story-paragraph">为寻得她童真的这面而欢喜，南的眸子里勾起了带笑的弧度。</p><p class="story-paragraph">已经不止一两个人旁侧敲击地问过她纱夏是不是混血儿了。</p><p class="story-paragraph">南也好奇，自从女儿的五官长开以后，她的这种体会就更深。</p><p class="story-paragraph">单看纱夏的鼻子和眼睛，显然不是照东亚人的标准生的，倒像从西半球某个地方飘洋过海来到日本的异族人才有的锋利线条。</p><p class="story-paragraph">南尤其爱吻女儿的鼻梁，高而直的轮廓在纱夏身上，类比于某种让她可以一眼在人群中认出对方来的印记。</p><p class="story-paragraph">可并不是随意抛给纱夏一副粗糙的骨相就结束了，造物主还别出心裁地为她修饰细节，将细腻柔软的纹理覆在她的唇瓣上。</p><p class="story-paragraph">纱夏细长的睫毛曲卷分明，下面掩着那双眼睛。</p><p class="story-paragraph">她虹膜的颜色按画家最精巧的比例调好，所以全然不生硬刻板，那道目光仿佛是会流动的，冒着热气的松脂。</p><p class="story-paragraph">女儿雪白的侧颈上留了她的吻痕，一路蔓延到肩膀，皮肤泛了粉嫩的光泽，好像一捏就能出水。她头发被压在身下，发梢蜷了起来，小巧的耳朵对着南，全部露在外面。</p><p class="story-paragraph">曼妙的曲线紧紧挨着她，不知给她尝过多少次的诱人身体是赤裸的。</p><p class="story-paragraph">纱夏薄红的乳尖没有勃起，在幅度小的动作之间很可爱地蹭她的手臂。</p><p class="story-paragraph">南有点想低头将它含进嘴里，又疑心这行为将扰了她的清梦，于是作罢了。</p><p class="story-paragraph">女儿的足弓还贴了她的小腿，舒服的温度在那一片小地方晕开。</p><p class="story-paragraph">南很爱和纱夏肌肤相亲的感觉，这让她能体会到拥有对方的实感。</p><p class="story-paragraph">这说到底是她开始焦虑的原因。</p><p class="story-paragraph">担心那快要喷发出来的感情会在心跳反复的锤击之下暴露给对方，却无法阻止自己朝她靠近。</p><p class="story-paragraph">好像爱得太用力了。</p><p class="story-paragraph">她们寻着那点失控的恍惚，将手放在了对方的脖子上。</p><p class="story-paragraph">灵魂因即将窒息的危险暴起了青筋，疯狂的快意在能类比于地狱的边境落脚。</p><p class="story-paragraph">南已无心力管束这些情愫。</p><p class="story-paragraph">漂浮在这个破碎的、只进不退的通道里，露出一点喜欢纱夏的马脚大概也不要紧…</p><p class="story-paragraph">生活在一起的这些年年岁岁将两人的相性养得服帖，懂得为彼此让出一条温驯的道来。</p><p class="story-paragraph">几乎不争吵。</p><p class="story-paragraph">要说每日都毫无波澜地过来了，倒也不至于。</p><p class="story-paragraph">女儿昨天接了课题任务，研究的主题围绕着一本小说里出现的什么写作手法。</p><p class="story-paragraph">她没去学校，是和后辈远程连线，靠电脑解决问题的。</p><p class="story-paragraph">南好几次叫她稍微休息一下，长时间对着电子屏幕对视力不好，对方装模做样地眯了三秒眼睛以后就开始撒娇，想蒙混过关。</p><p class="story-paragraph">纱夏正是为照顾自己才落下这么多待办的事情，她自然不好说什么。</p><p class="story-paragraph">南问了女儿那是什么故事，想知道她有没有读过那本书。</p><p class="story-paragraph">答案是很果断的否定，优秀的文学部学生能拿到和她们学校出版社合作作者的手稿，这小说还没赶得上印刷发售。</p><p class="story-paragraph">对作品一无所知，也帮不上忙。好在身体没有不舒服，她清醒地在女儿身边坐着，能陪她一会。</p><p class="story-paragraph">纱夏很领情，拍拍大腿要她跨上来。</p><p class="story-paragraph">毕竟连线的视频好端端开着，南还是拒绝了。</p><p class="story-paragraph">女儿撇撇嘴，好像因为这个举动闷闷不乐的。</p><p class="story-paragraph">可南就在纱夏触手可及的范围之内，对方时不时就要探过来亲她。</p><p class="story-paragraph">虽然完全摸不清撩人的吻什么时候降落，但南依然体贴地配合小年下的动作。</p><p class="story-paragraph">只要那双唇靠近，她就温顺地回应，在愈演愈烈之前又主动将嘴巴移开。</p><p class="story-paragraph dialogue">“专心一点。”南想示威，但怕声音太大被收音效果好的麦克风听到。</p><p class="story-paragraph">效率降低了纱夏会更辛苦。</p><p class="story-paragraph dialogue">“没关系，”女儿打断了她，还目不转睛地盯着自己，尾音调皮地往外跳，带着热气钻进耳朵：“劳逸结合。”</p><p class="story-paragraph">南愣了一下，意识到自己和纱夏像是校园情侣那样调情，脸倏然有点发烫。</p><p class="story-paragraph">读书那会也不至于事事都顺着恋人，一刻都不想离开对方。</p><p class="story-paragraph">纱夏在忙也想粘着她，都不嫌腻得慌。</p><p class="story-paragraph">这肯定和年龄没什么关系，她曾经交往过的人几乎都是比她稍大些的，没什么明显的征兆预示她有喜欢弟弟或者妹妹类型的倾向。</p><p class="story-paragraph">看来她这下只是…</p><p class="story-paragraph">单纯地坠入了爱河而已。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">女儿准备晚餐的时候南去洗了澡。</p><p class="story-paragraph">吃完饭都过了八点，她穿着深紫色的睡裙斜躺在沙发上。</p><p class="story-paragraph">电视开了，南让它在那放，就做背景音，等女儿从浴室里出来了再说。</p><p class="story-paragraph">家里的香氛还没用完，南翻出支来检查标签，想看是什么气味的，还没来得及浏览那几行小字，就想到纱夏皮肤上的味道已经足够好闻。</p><p class="story-paragraph">女儿的发质不太好，总要抹精油，还得用一堆洗护用品…</p><p class="story-paragraph">这么多香气杂在一起估计能把人熏得头晕。南将刚刚拿出来透风的蜡烛再次塞回去了。</p><p class="story-paragraph">这个决定真是明智的。</p><p class="story-paragraph">纱夏吹干了头发，坐下来的时候带来一阵干燥的暖意。</p><p class="story-paragraph">东京总不如北方地区湿润，怕她不舒服，南去摸女儿的脸，感觉出她擦了乳液，才放心地收回去。</p><p class="story-paragraph">不过这举动好像容易被对方误会，纱夏也许以为她要开启一个吻，所以将她抓住了。</p><p class="story-paragraph">力道很温柔，却是不能反抗的。</p><p class="story-paragraph">南闭了眼，她感觉女儿和那些簇拥着她的香味同时啄了啄她的唇角，而后对方就松了她，摆弄起遥控器来。</p><p class="story-paragraph">运气似乎不太好，奇迹体验播到一半开始放广告了，能免费观看的频道在这个时段又几乎没什么吸引人的东西。</p><p class="story-paragraph">纱夏转了一轮，富士电视台的广告主角从牛奶饮料跟着变成了寿司。</p><p class="story-paragraph">南用指腹蹭蹭女儿眼睛下的卧蚕。</p><p class="story-paragraph dialogue">“今天辛苦了，”她提了个建议：“要不早点休息？”</p><p class="story-paragraph dialogue">“我…”女儿转转眼珠，好像突然又改变了主意：“那我先上床。”</p><p class="story-paragraph">茶几的颜色没再被电视机屏幕的光线闪得扑朔迷离，纱夏按灭了电源。</p><p class="story-paragraph">南求之不得，她站起来转向洗手间，做完睡前的准备工作，才趿拉着拖鞋进卧室。</p><p class="story-paragraph">纱夏敷好了面膜。</p><p class="story-paragraph">南见她将那团黏糊糊的美容纸撕下来，揉成球以后抛向了最近的那个垃圾桶。</p><p class="story-paragraph">女儿的手臂暗示她藏在里面的柔软身躯又是光裸着的。</p><p class="story-paragraph">没来得及躺进来，纱夏就主动掀开被子。</p><p class="story-paragraph">少女散发甜香的身体和她抱了个满怀。</p><p class="story-paragraph dialogue">“怎么不穿衣服？”南帮纱夏拍拍还留在脸上没匀好的精华液，语气里的调笑意味很明显。</p><p class="story-paragraph dialogue">“热。”纱夏又凑近了一点。</p><p class="story-paragraph dialogue">“我去开空调。”</p><p class="story-paragraph">可能是自己故意煞风景的样子实在是讨厌极了，女儿带了点报仇的狠劲咬了她一口。南不逗她了。</p><p class="story-paragraph">她在黑暗里准确地捉到女儿。</p><p class="story-paragraph">躺上床时，嘴的职责就不再是说话，而是接吻。</p><p class="story-paragraph">她们的唇瓣很快就贴在一起厮摩。</p><p class="story-paragraph">南像含着一片薄荷叶，牙膏里的甜味剂成分似乎没那么快就散去，舌头尝起来是轻甜的。</p><p class="story-paragraph">有股携带烧灼感的清凉气息点燃了脆弱不堪的黏膜，它穿过鼻腔，然后和纱夏的呼吸混在了一起。</p><p class="story-paragraph">南用掌心去拢女儿娇娇挺起的乳珠，那两点正跟着纱夏摆动的腰肢调皮地乱跳，还反客为主地蹭得她发痒。</p><p class="story-paragraph">她自然不会叫没穿衣服的人捣蛋。</p><p class="story-paragraph">南蛮横地将女儿的乳尖卡在指缝里。</p><p class="story-paragraph">也许是胸前的刺激使纱夏分神，她的喉咙飘出了甜腻的哼声。</p><p class="story-paragraph">南轻舔过她的上颚。</p><p class="story-paragraph">几乎是同一瞬间纱夏便落败了。</p><p class="story-paragraph">她发着颤躲开，胸前的乳肉被妈妈抓住。</p><p class="story-paragraph">像被逮着的兔子，要被狩猎者饱餐一顿的猎物。</p><p class="story-paragraph">南衔住了那颗小樱桃，舌头灵巧地卷起它。</p><p class="story-paragraph">红肿的乳头马上就背叛了纱夏，将那点幸福的快感全部传给了主人，逼得女孩在妈妈的攻势之下节节败退。</p><p class="story-paragraph">纱夏的脖子往后高高地扬起，南虽知道这只是她的意识沉在享乐以后无意识做的反应，但还是很配合地揽住了少女的肩。</p><p class="story-paragraph">她撑在上方，手指在描摹女孩肩胛骨的线条。</p><p class="story-paragraph">脆弱的、不堪一击的…</p><p class="story-paragraph">她意志不坚，经不起诱惑，才轻易地被迷倒了。</p><p class="story-paragraph">最不堪的恶，岁月里频频侵扰她神智的执念。</p><p class="story-paragraph">她爱她的女儿，这是覆水难收的事实。</p><p class="story-paragraph">临阵脱逃…南撩开睡裙的褶摆，借了腹部那点力气支起了身体，顺利地将它脱了下来。</p><p class="story-paragraph">不会临阵脱逃。夏夜里穿的衣服本就轻薄，在南手中，半身裙很快就被叠成条勉强能派上用场的带子。</p><p class="story-paragraph">她扣住纱夏的后脑勺。</p><p class="story-paragraph">南将左侧的头发挽到了耳后，柔顺披散的青丝倾在宛若玉瓷样的肌肤上，晃得人挪不开眼。</p><p class="story-paragraph dialogue">“别动。”她以温柔的爱意安抚了女儿的情绪。</p><p class="story-paragraph">南满意地见到纱夏乖巧地配合，她用光滑的绸布夺走了女儿的视觉，轻轻地将两端合在一起，打了个松垮的结。</p><p class="story-paragraph">纱夏什么都瞧不见了，她怕妈妈走，又被那件衣服上的香味钓住。</p><p class="story-paragraph">两边都不舍得放，女孩像小狗打洞一样，鼻子去拱留有妈妈体温的衣服，将头埋在里面不停地嗅，环了她脖颈的手还用了力。</p><p class="story-paragraph">可爱的举动引得南低低笑了声。</p><p class="story-paragraph">好像是妈妈喑哑的嗓音让纱夏心动，她勉强地抬高身子，但看也看不见，吻触到了南的侧脸。</p><p class="story-paragraph">纱夏想显得游刃有余，及时发出啵的一声，给人一种她不是奔着妈妈的嘴去的错觉。</p><p class="story-paragraph">南不拆穿她，轻松地挤进了纱夏双腿之间的缝隙。</p><p class="story-paragraph">她的宝贝已经长成了有成熟韵味的女人，身体是一颗泛着香甜气息又汁水四溢的莓果。</p><p class="story-paragraph">只知贪欢逐乐的小穴很期待接下要发生的事，南还嫌不够乱，添手指去点火。</p><p class="story-paragraph">纱夏湿得狼狈，妈妈才碰到自己，她就忍不住嘤咛一声。</p><p class="story-paragraph">没一点办法维持自在的表象，南的视线能解构她。</p><p class="story-paragraph">纱夏好想飞快地扯下那条软布，好想知道妈妈在她看不见的地方是怎么凝望她的。</p><p class="story-paragraph">可是不行，好不容易得来的机会…</p><p class="story-paragraph">若是直视妈妈的双眼，她便会失了全部勇气。</p><p class="story-paragraph">南见纱夏抿着嘴，听到她的呼吸深了。</p><p class="story-paragraph">女儿是想要什么，以至于如此紧张呢？</p><p class="story-paragraph">南有点担心那是不是自己无法许下承诺的愿望。“纱夏，”她想转移话题，浅浅的笑音让女孩半边身子都软了：“不想和妈妈做？”</p><p class="story-paragraph dialogue">“不是…”女儿的否认细如蚊呐。</p><p class="story-paragraph">南以为到这便是止。</p><p class="story-paragraph">她打算结束这氛围，却看纱夏垂在身体两侧的手不安地伸展开，很快又握紧。</p><p class="story-paragraph">南愣住了。</p><p class="story-paragraph">女儿的声音好轻，轻到这词弹跳了两下以后便隐没了，再不见丝毫踪影。</p><p class="story-paragraph">若不是从小就习惯别人这样叫她，南差点要错过这个瞬间。</p><p class="story-paragraph">平片假名打乱顺序胡乱拼凑在一起，其实是没什么意义的。</p><p class="story-paragraph">她的名字从纱夏的嘴里吐出来的场景罕之又罕。</p><p class="story-paragraph">明明该是陌生的体验，南却觉得熟悉。</p><p class="story-paragraph">好像在纠缠时她们早以互相唤过对方千千万万遍。</p><p class="story-paragraph">那颗心惊扰了夜的静寂。</p><p class="story-paragraph">似乎有烟花在胸腔里一朵一朵的绽开，炸得南几乎听不见任何东西。</p><p class="story-paragraph">如此态度在她身上其实更像喜不自胜的强硬，像她人生中都少见的那点不知所措。</p><p class="story-paragraph">却吓到了纱夏。</p><p class="story-paragraph">她反应过来以后，才意识到自己似乎沉默得太久。</p><p class="story-paragraph">南自觉这行为太幼稚，但那声软绵绵的叫唤实在是太好听，即使是她的心性也没能招架住。</p><p class="story-paragraph">两人就像在对峙。</p><p class="story-paragraph">女孩用牙齿咬着下唇，好像很窘迫，急得要哭了。</p><p class="story-paragraph">鼓起全部的力气叫了妈妈的名字…</p><p class="story-paragraph">但似乎还不到时候。</p><p class="story-paragraph">害怕妈妈被这出格的举动吓住。</p><p class="story-paragraph">纱夏改了口型，要将称呼调回原点，却听见南的声音。</p><p class="story-paragraph">牙齿微微合拢，气流穿过齿间的缝隙，发出像毒蛇吐信的嘶嘶声响，但马上被赶来的饱满元音填上，然后是和妈妈相交的重合音节。</p><p class="story-paragraph">那在日语里读作“七”。</p><p class="story-paragraph">两人的名字接踵掉进了这场情事里，又像叹息一样消逝在黑夜之中。</p><p class="story-paragraph">妈妈的声调好像同平时没什么区别。</p><p class="story-paragraph">南离她远了。</p><p class="story-paragraph">纱夏伸手想探她在哪，小心地凭借皮肤散发出的那点温热轨迹去找她，却摸了个空。</p><p class="story-paragraph">女孩的指尖因无处安放的仓皇发麻。</p><p class="story-paragraph dialogue">“妈妈…”她才试着喊南，声音就被激得陡然升高。</p><p class="story-paragraph">南捏住了她的屁股，臀瓣间的肉芽被这霸道的力拉扯，薄薄的皮肉受不了这样粗暴的对待。</p><p class="story-paragraph">那颗花蒂很快就充血肿胀，瑟缩着挺起来，落到了温暖湿润的口腔里去。</p><p class="story-paragraph">妈妈在亲她。</p><p class="story-paragraph">确切地来说是在吃掉她。</p><p class="story-paragraph">纱夏像遭电击一样发着抖，腿被迫搭在南的肩膀上，下半身悬空，快感的源头从这里席卷而来，带动了流泻的呻吟。</p><p class="story-paragraph">南的名字对她而言都太复杂，纱夏像刚刚学会说话的婴儿，大脑完全当机，只知道循着本能，哭喊着声讨那个罪魁祸首。</p><p class="story-paragraph">人在极度欢愉的时候会接到同等量级的恐惧，那是感觉自己要在灭顶的快感中死去的恐惧。</p><p class="story-paragraph">心跳的节奏紊乱，随意走错一步就会迎来猝亡，在无尽的缠绵里化成齑粉。</p><p class="story-paragraph">她啜泣着，几乎次次都是失声地叫出来。</p><p class="story-paragraph">纱夏大腿内侧娇嫩的皮肤也被濡湿了，晶亮的汗水混在其中。</p><p class="story-paragraph">女儿的味道萦绕在南的鼻尖，这种淫靡的气味沾得她浑身都是，好像将她标记成了纱夏的所属物。</p><p class="story-paragraph">可谁又是谁的所属物？</p><p class="story-paragraph">亚当是抽了肋骨，夏娃才得以在世界中诞生。</p><p class="story-paragraph">她的女儿，和她生命盘旋在一起的纱夏。是她的骨中之骨，肉中之肉。</p><p class="story-paragraph">身体接纳不了如此强烈的刺激，失去视觉令纱夏敏感异常。</p><p class="story-paragraph">她夹紧了妈妈的头，腰像抵死那样高高地顶起来。</p><p class="story-paragraph">南不知道自己是不是犯瘾了，或者可以说这种感觉和犯瘾很相似。</p><p class="story-paragraph">她的太阳穴通通地跳动。</p><p class="story-paragraph">全身每一条血管都在暴乱。</p><p class="story-paragraph dialogue">——如此不快又令人欢欣的暴乱。</p><p class="story-paragraph">女儿嘴里的呼救让人一度分不清那究竟是痛苦还是幸福的象征。</p><p class="story-paragraph dialogue">“妈妈…”她爽得几乎分不清东南西北，灵魂要被这激荡猛烈的力量冲出身体之外：“好喜欢…妈妈…”</p><p class="story-paragraph">纱夏的臀晃得厉害，这让她腿心最隐秘的地方看起来更加可口。</p><p class="story-paragraph">南用舌面去顶那幼小的花蕊，紧接着将周围的皮肤都一视同仁地含住了。</p><p class="story-paragraph">从四面八方涌来的吸力让这个小家伙快乐得要命。</p><p class="story-paragraph">纱夏的脊背绷得笔直，脑子抓到什么词就往外抛。</p><p class="story-paragraph dialogue">“妈妈…哈啊…要去了…”被单被女儿抓得皱皱巴巴的，她肩膀压在床上：“要去了…”</p><p class="story-paragraph">顶峰来得又快又猛。</p><p class="story-paragraph">纱夏恍惚间觉得她要完了，她的身体一辈子也忘不了妈妈。</p><p class="story-paragraph">小嘴开合的幅度猛地一下变得大，里面好像想咬住什么，穴肉在不知饕足地剧烈收缩。</p><p class="story-paragraph">南体贴地喂给她两根指头，立马就被绞紧。</p><p class="story-paragraph">女儿蜷在她的怀里高潮了。</p><p class="story-paragraph">纱夏的头发乱糟糟的，额角也被汗浸湿。</p><p class="story-paragraph">南还未解开那条缠着她的布料。</p><p class="story-paragraph">若从未提前侵入对方的世界线，就能消除等价的苦痛。</p><p class="story-paragraph">只将凑崎纱夏和名井南的相遇寄托在那些偶然的时刻里。</p><p class="story-paragraph">两个不曾有过交集的陌生人，甚至连名带姓都未曾知晓。偶然在同一个站台等电车，或是去到同一家小餐厅前后挨着点一份章鱼烧。</p><p class="story-paragraph">大阪城公园前的绿坪擦肩而过，穿越心斋桥的汹涌人潮时无意对视那么一眼。</p><p class="story-paragraph">南有时真的会想象这些俗不可耐的情节。</p><p class="story-paragraph">就好像她和纱夏只是一对最平凡的恋人。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">妈妈已经起床了，身边的枕头因弹性恢复成没人躺过的样子。</p><p class="story-paragraph">被子的边沿都被南好好地折了进去，可能是怕她感冒。</p><p class="story-paragraph">纱夏费了好大力才顶开眼皮，她支起身子，靠在床头缓了一会才彻底清醒。</p><p class="story-paragraph">嗓子里火烧火燎的渴，她穿了凉拖鞋走到客厅给自己倒了半杯冷水，咕噜咕噜地就喝下去。</p><p class="story-paragraph">没看到妈妈，倒是墙上的摆钟告诉她已经下午三点。</p><p class="story-paragraph">医生说要南多休息。</p><p class="story-paragraph">照理说美沙酮的副作用应该明显。</p><p class="story-paragraph">嗜睡…</p><p class="story-paragraph">除开第一天回家和服药以后短暂的昏迷以外，纱夏发现南好像没受影响，反而还有点失眠。</p><p class="story-paragraph">她那点小心思一直都有，缠着妈妈睡觉是她最直白的目的。</p><p class="story-paragraph">不过南还是以长辈的身份任她胡闹，最多只将就着依她上床的时间躺好，到了该醒的时候还是会轻手轻脚地离开。</p><p class="story-paragraph">女孩见书房那扇门是关着的，猜到妈妈在里面。</p><p class="story-paragraph">纱夏试探地压下把手，一点噪音都没发出来。</p><p class="story-paragraph">这是她小时候怕打扰妈妈工作练出的本领。</p><p class="story-paragraph">就像往常一样…</p><p class="story-paragraph">南端坐在那里，她瘦削的肩膀勉强撑起了衣服。</p><p class="story-paragraph">妈妈似乎很专心，书页随她手上的动作一张一张地翻过去。</p><p class="story-paragraph">这场景很好，同样也很美。</p><p class="story-paragraph">午间的阳光不如晨时的有朝气了，却依然温柔和煦，透过它能看到细小的毛绒丝线和尘埃样的絮状物飘起来。</p><p class="story-paragraph">找哪天给家里做个大扫除吧？</p><p class="story-paragraph">纱夏这么想着，从后面抱住了妈妈。</p><p class="story-paragraph">南没被她吓到。</p><p class="story-paragraph dialogue">“什么时候醒来的？”她还在看那本貌似很难对付的大部头著作。</p><p class="story-paragraph dialogue">“才醒。”纱夏的视线也跟着妈妈一起降落在那几行字上。</p><p class="story-paragraph">这几句话她读起来也拗口。</p><p class="story-paragraph dialogue">——代理人丧失对占有物事实上的支配。</p><p class="story-paragraph">页脚的注解标得很详细了，是民法法典。</p><p class="story-paragraph">妈妈曾将它包括其他基本法典放在书架上束之高阁，纱夏从没见她正儿八经地在她面前读过…</p><p class="story-paragraph">南需要多放松，纱夏担心她的精神又因复杂的文字紧张起来。</p><p class="story-paragraph dialogue">“妈妈，”女孩用温热的掌心捂住了她的眼睛：“到休息时间了。”</p><p class="story-paragraph">南顺从地合上了书，将它搁在一边，不这样做纱夏不可能放过她。</p><p class="story-paragraph dialogue">“不要紧，”她轻轻拉下女儿的手，温和道：“闲不住找点事干而已。”</p><p class="story-paragraph dialogue">“可是我在家。”纱夏强调自己的存在感，一副气鼓鼓的样子，腮帮子嘟起，转了个圈就坐到妈妈的腿上。</p><p class="story-paragraph dialogue">“看你睡得那么香，”南捏捏她软乎乎的脸：“没忍心叫你。”</p><p class="story-paragraph dialogue">“我不用睡多久的，”纱夏装可怜，眼睛睁得圆溜溜的：“我想陪你。”</p><p class="story-paragraph dialogue">“好，”南没和她争：“下次。”</p><p class="story-paragraph">看女儿又要索吻，她先下手为强，将纱夏亲得气喘吁吁的。</p><p class="story-paragraph dialogue">“你们晚饭约在哪？”</p><p class="story-paragraph">纱夏差点忘记这茬，她不想去了。</p><p class="story-paragraph">要不是桃第二次打来电话时，妈妈刚好在她旁边，她才不会同意。</p><p class="story-paragraph">纱夏想蒙混过关，告诉南没什么事，还是被她问出来了。“和朋友出去聚聚，”妈妈要她赴约：“总呆在家里会闷坏的。”</p><p class="story-paragraph dialogue">“我们不是有去散步吗，”纱夏想耍赖：“也没有…”</p><p class="story-paragraph dialogue">“不是这个意思，”南弹了弹她的额头：“你要常接触同龄人，多和他们交流。”</p><p class="story-paragraph">纱夏还打算反驳的，但对方由不得她辩解，毕业以后直接进入社会的同学都走在她前面了，南对纱夏说就算学点经验也是好的。</p><p class="story-paragraph">没办法，妈妈只要摆起家长式的面孔就离她很远，百般无奈下她只好应了。</p><p class="story-paragraph dialogue">“去池袋那边的水产店，”纱夏回答：“气氛好。”</p><p class="story-paragraph dialogue">“好，”南摸摸女儿的头发：“如果玩得晚要注意安全。”</p><p class="story-paragraph dialogue">“会尽早回来的，但是可能要喝酒，”纱夏将她搂紧了些：“到时候我自己睡。”</p><p class="story-paragraph dialogue">“一起睡也没关系，”南忍俊不禁，牵了女儿的手：“少喝点，要记得吃东西垫垫肚子。”</p><p class="story-paragraph">纱夏早知道这些了，她答应下来。</p><p class="story-paragraph">比起那先饭桌上的未知因素来说，女孩提前开始为衣装烦恼。</p><p class="story-paragraph">只和南在家里待着，两人也总不知收敛…</p><p class="story-paragraph">这个季节能穿的低领衣服没一件挡得住妈妈在她脖子上留下的暧昧印迹，要是被中学同学们见了，肯定免不了一顿严刑逼供。</p><p class="story-paragraph">好在还有为这顿饭做准备的意思在里面，这几天妈妈避开了明显的地方。</p><p class="story-paragraph">先前的印子没那么快全部消除，唯一值得庆幸的是淡化了不少。</p><p class="story-paragraph">她的肤色和南相去不远，只好借用妈妈的化妆品…</p><p class="story-paragraph">南以休息的缘由被赶回了房间，她见纱夏咚咚咚快步地走进来。</p><p class="story-paragraph dialogue">“我的遮瑕留在学校了。”女孩边旋开瓶盖边和妈妈解释。</p><p class="story-paragraph">南“嗯”了声，她对这些无所谓，只好奇纱夏想挡的东西。</p><p class="story-paragraph">她看了两眼就知道了，所以对着女儿好整以暇地笑。</p><p class="story-paragraph">纱夏被妈妈弄得有点莫名的羞赧。</p><p class="story-paragraph">南放下抱胸的手臂，还从桌上其他的瓶瓶罐罐里挑了几支摆好。</p><p class="story-paragraph dialogue">“坐好，”没等纱夏反驳，妈妈就自然地将她手里的遮瑕膏接过：“我帮你。”纱夏身后就是床，南拖了化妆台前的椅子，能和她平视。</p><p class="story-paragraph">妈妈将肉色的乳霜挤到手指上，女孩努力地伸长脖子，好让她方便涂。</p><p class="story-paragraph">膏体是凉的。</p><p class="story-paragraph">纱夏被南极轻的力度搔得痒。</p><p class="story-paragraph">她能笑出来，就可以掩饰那阵莫名的失落。</p><p class="story-paragraph">纱夏也拿那几个印子头疼，但想到妈妈曾经还故意作弄她。</p><p class="story-paragraph">她们本该是玩伴，不会像现在这样，一人要帮忙修补恶作剧的残局。</p><p class="story-paragraph dialogue">“先去换衣服，”南遮到最后的阶段，停了手中的动作：“化完妆再穿容易花。”</p><p class="story-paragraph dialogue">“好，”纱夏凑过去吻了吻妈妈的脸：“我等下告诉你晚上吃什么。”</p><p class="story-paragraph dialogue">“我从冰箱里随便拿点东西热就好了。”南的提议被女孩以摇头废止。</p><p class="story-paragraph">她没多说，要准备妈妈的晚餐，还要喂她吃药。</p><p class="story-paragraph">由于喝酒的缘故也不打算开车，新宿去池袋搭电车大约二十来分钟，为了不迟到，也没多长时间磨蹭了。</p><p class="story-paragraph">女孩想穿得简单些，回到房间以后挑了牛仔面料的三分裤，上身套进了白色的印花 T 恤。</p><p class="story-paragraph">她对着镜子按步骤上了妆，检查眼影有没有太明显的不对称。</p><p class="story-paragraph">妈妈给她涂好的遮瑕也确实将所有吻痕都挡住了。</p><p class="story-paragraph">纱夏从很久没背过的帆布包里掏出一把拇指大小的银色钥匙，将抽屉上挂着的锁打开。</p><p class="story-paragraph">她折了一次锡箔纸板，有一粒药丸因此落进了她手心。</p><p class="story-paragraph">纱夏照原路关上它。</p><p class="story-paragraph">南喜欢吃牛肉。</p><p class="story-paragraph">她做了咖喱，按标准减了马铃薯的量，虽然浇了烧烫的汁凉得没那么快，但女孩还是装了盘就放进电饭煲里，拨亮了保温按钮。</p><p class="story-paragraph">南在用手机看新闻，听到卧室门打开的声音，便抬头去找这来人。</p><p class="story-paragraph">她一时间竟忘了说话。</p><p class="story-paragraph">那双含笑潋滟的眼月牙一样弯，离她近了。“好不好看？”女儿半跪了下来，话里任性与娇憨的分寸捏得很好。</p><p class="story-paragraph dialogue">“好看。”南望纱夏望得着迷，便将这真心话告诉了她。</p><p class="story-paragraph">纱夏侧过身笑，得了她的表扬似乎很得意。</p><p class="story-paragraph">女儿拿着水杯，南心下了然，是该吃药了。</p><p class="story-paragraph">南现下已慢慢学会克制这种冲动。</p><p class="story-paragraph">纱夏迟早会喂给她的…</p><p class="story-paragraph">她要忍住。</p><p class="story-paragraph">女儿摊开的右手里躺着那粒小小的白色药片。</p><p class="story-paragraph">南抿了一小口水，闭着眼将它咽下了。</p><p class="story-paragraph">纱夏扶着她往下倒。</p><p class="story-paragraph">南没有犯瘾，她身体的情况还算正常，所以这药效发作非常快。</p><p class="story-paragraph">短短几分钟，妈妈的牙齿就开始发颤了。</p><p class="story-paragraph">纱夏握着南变得冰凉的手，感觉她的体温在下降。</p><p class="story-paragraph">她将被子轻轻盖在妈妈身上，用手背去试她发红的脸颊。</p><p class="story-paragraph">药物在南的身体里发生生化反应，因快感而特有的迷醉表情次再出现了。</p><p class="story-paragraph">这足以让纱夏心碎。</p><p class="story-paragraph">女孩席地而坐，将南的手贴在脸上。</p><p class="story-paragraph dialogue">“妈妈，”纱夏叫她：“没事的。”</p><p class="story-paragraph">她反复地说这句话，就像妈妈曾在她惊恐发作的时候安慰她的那样。</p><p class="story-paragraph dialogue">“没事了，”纱夏努力让语调叫人安心，不管妈妈听不听得到：“会没事的。”</p><p class="story-paragraph">屋子外的风景快要变换了，黄昏也再次逼近。</p><p class="story-paragraph">纱夏摩挲着妈妈的眉毛。</p><p class="story-paragraph">她很想将那点不平整的微褶消除。</p><p class="story-paragraph">夏季深红的夕阳像鲜血一样漫了进来。她等了好久。</p><p class="story-paragraph">可能也没多久，但每到这时候，都分外难熬。</p><p class="story-paragraph">只有妈妈再次睁开眼睛的时候她才放心。</p><p class="story-paragraph dialogue">“怎么哭了？”这是南清醒以后说的第一句话，她的嗓子有些哑了。</p><p class="story-paragraph">她难掩疲倦的神色，双瞳里闪烁的光点是微弱的亮度。</p><p class="story-paragraph">纱夏如梦初醒，意识到眼泪沾上了妈妈的手指，想偏头擦掉。</p><p class="story-paragraph dialogue">“哭了就不好看了，”南双手捧住了她的脸，不让她躲，嘴角牵起一个看起来勉强的笑容：“不哭了。”</p><p class="story-paragraph">女孩点头。</p><p class="story-paragraph">她柔软的发丝在妈妈手心里磨蹭。</p><p class="story-paragraph dialogue">“我给你添麻烦了。”南轻轻地道歉：“对不起。”</p><p class="story-paragraph dialogue">“不麻烦…”纱夏从喉咙里挤出几段模糊的声音：“不会麻烦…”</p><p class="story-paragraph dialogue">“傻瓜，”南用指腹揩掉女儿的眼泪：“再哭妆都要花了。”</p><p class="story-paragraph">纱夏不知道怎么证明自己的心意，要做的就是听南的话，她拼命地止住眼泪。</p><p class="story-paragraph dialogue">“我做了咖喱，”女孩吸吸鼻子：“你饿了要去吃。”</p><p class="story-paragraph dialogue">“嗯，”南的身子朝着纱夏那里挪，她尽力支起身子，在纱夏漂亮的下颌线上落了一个吻：“谢谢纱夏。”</p><p class="story-paragraph dialogue">“不用谢。”女儿一板一眼地回应她，南笑了一声。</p><p class="story-paragraph dialogue">“快去吧，”她对纱夏说：“别耽误时间了。”</p><p class="story-paragraph">女儿乖巧地站起来，将盖在她身上的被子拍了两下，弄得更平整了些。</p><p class="story-paragraph dialogue">“那我走了，”纱夏很认真地看着她，她似乎很看重后面这个承诺：“我会早点回来的。”</p><p class="story-paragraph dialogue">“玩得开心。”南眯起眼睛，温顺地点头。</p><p class="story-paragraph dialogue">“好，”纱夏说这话的语气就像她小时候出门上课一样：“拜拜。”</p><p class="story-paragraph dialogue">“拜拜。”南也像送小时候的纱夏离家那样回应她。</p><p class="story-paragraph">她过了一会听见家里的大门关上的闷响。</p><p class="story-paragraph">南还要再休息一下才站得起来。她的肌肉胀得发疼，嘴巴里也泛起了苦味。</p><p class="story-paragraph">这些副作用她没有告诉女儿。</p><p class="story-paragraph">记忆力在衰退，反应速度也不如从前了。</p><p class="story-paragraph">她怕再也理不清那些繁杂的法务条令。</p><p class="story-paragraph">南低下头看脖子那挂着的项链，笑容还是压过了鼻头的酸涩。</p><p class="story-paragraph">不用去假设其他的可能性，在这世上已经发生过的相遇无法逆转。</p><p class="story-paragraph">她带着纱夏生活，带着她长大。</p><p class="story-paragraph">南微微垂了眼帘，捏着那颗小小的石头。</p><p class="story-paragraph">这就是她们命运相交的结局。</p><p class="story-paragraph">能和纱夏做一对不平凡的恋人…</p><p class="story-paragraph">也很幸福。</p></div>
