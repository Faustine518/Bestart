<template id="template-chapter-24"><section class="chapter" aria-labelledby="heading-chapter-24">
      <header class="chapter-heading">
        <span>CHAPTER 24</span>
        <h2 id="heading-chapter-24">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">池袋站靠东边方向的出口正对着一条很大的马路，纱夏弄不清，也许这里还有什么很大的汽车站，她每次经过都能看见几辆并行的小巴士。</p><p class="story-paragraph">电车站的建筑物墙体上挂了幅广告牌，高高地悬离了地面，那图像每隔六七秒就切换一次。</p><p class="story-paragraph">晚霞的颜色已经渐渐消失了，女孩的影子被荧幕投出的光线映在斑马线上，成了淡黑的一小团，像是被化开的墨滴。</p><p class="story-paragraph">附近有家很大的乐器行，起码占了好几个店铺门面，人车穿行的嘈杂声响也掩不掉透明玻璃后的击键乐音。在路边遇见两三个站在一起又背了布包的青年自然是不奇怪的，纱夏能一目了然地认出形状易辨的软袋里装了吉他。</p><p class="story-paragraph">夹在动漫周边音像店和电子游戏厅之间的是四丁目的十字路口，零星地栽了几棵用途不明的小型冷杉。相较那些在极寒高纬度地区的松木而言，生长在温带的浅绿色针叶显然更加柔软幼弱。</p><p class="story-paragraph">不是休息日，碰上下班高峰期了，纱夏在来时搭电车就被挤得够呛，路上攒动的人头丝毫不见少，她出了汗，但几个大门敞开的商场将冷气无保留地吹到了室外，就没那么热了。</p><p class="story-paragraph">已经到这个点，依然有顾客从街角的星巴克里端着美式出来，让人不禁纳闷他们这个社会到底有多少朝五晚九的工作者。</p><p class="story-paragraph">现代科技帮了很大的忙，认路从不是她擅长的技巧，但地图还算管用，再加上几家热门商场都坐落池袋，旅游建设规划得好，路牌上的标识都写得清清楚楚了。</p><p class="story-paragraph">纱夏穿了带跟的鞋，衬得她身子秀颀挺拔。</p><p class="story-paragraph">瘦高的人步子轻快，五分钟不到就走到几百米开外的地方。</p><p class="story-paragraph">这家水产店的招牌上画了深蓝色的波浪，能和隔壁的拉面区别开，顺便告诉路人老板是做海鲜生意的。</p><p class="story-paragraph">亮红的“二十四小时营业”的巨大标识被贴在醒目的地方，门梁上挂了刚好一拳宽的卷帘布，公开了电话就是承诺能提供外送服务的意思，住得远照样能订购这家店的产品。</p><p class="story-paragraph">纱夏拉开推拉门才发现里面不大，桌子只摆了几张。</p><p class="story-paragraph">没有空余座位，视觉上不免接到紧迫的压力，用来烤牡蛎的铁网就架在食客面前，装了通风管道也不能如愿以偿地吸除所有的飘散的油烟，这袅绕的雾气又将纱夏熏得有点头晕。</p><p class="story-paragraph">好在空调开得足够猛，勉强挽救了局面。</p><p class="story-paragraph">能在繁华的地段经营小店都算是件厉害得不得了的事了，她用逻辑推理能猜出味道应该不至于让人失望，便不再多抱怨。</p><p class="story-paragraph">前脚刚往里踏进一步，纱夏就听见靠墙角的方向传来了熟悉的声音。</p><p class="story-paragraph">有人在叫她的名字。</p><p class="story-paragraph">要等的同学还没来齐，显然有空缺的地方需要迟到的朋友来填，加上她一共有七人围了这窄桌坐下，却还空着三把椅子。</p><p class="story-paragraph">纱夏扯开了离她最近的那个。</p><p class="story-paragraph">菜单在手中传递，聊天话题由没轮到的人开启。</p><p class="story-paragraph">斜对面的江田和她打招呼，尴尬的是纱夏起先差点没认出这位同窗。好在能用声音辨人，露馅以前才准确地喊出了他的全名。</p><p class="story-paragraph">大概是过度用眼带来的近视，江田的鼻梁上架了幅黑边镜框。</p><p class="story-paragraph">虽然他的打扮算得上是规规矩矩的，但比起中学刚结束的那段时间，这位男同学实在是长胖不少，少年时期周正得能算得上是瓜子脸的脸型消失不见了，取而代之的则是由脂肪补足的下颌线和几乎挤得看不出原型的双眼皮。</p><p class="story-paragraph dialogue">“好久不见。”他先说。</p><p class="story-paragraph">此言不虚，能想得起来最近的一次见面都是距现在四年之久的毕业旅行，纱夏对他最深刻的印象大抵也是这人玩得一手好歌牌。</p><p class="story-paragraph">大家都怕他带来碾压性的残局，在爱知的时候江田就负责唱诗。</p><p class="story-paragraph">纱夏以同样的话语作回答，她笑着说好久不见，尽量不让这像鹦鹉学舌似的重复。</p><p class="story-paragraph">桃刚好放下手头的事，将套了透明塑封的册子传给左边的人。</p><p class="story-paragraph">纱夏的视线随着转过去，也看到那个像是新剪了板寸头的男孩子。</p><p class="story-paragraph">太阳穴往后被谁剃出了一圈突兀的淡白色痕迹，好像有才长出来没多久的头发。</p><p class="story-paragraph">这个体育生发型让他看上去像个击球手，还是能在甲子园参加了比赛的那种。</p><p class="story-paragraph">他们的目光有过短暂的交汇。</p><p class="story-paragraph">阳太没什么变化，身材似乎更好了，手臂的肌肉线条像是被训练过的，很结实。</p><p class="story-paragraph">曾经让太阳晒黑的皮肤泛着健康的小麦色光泽，两道锋利的眉毛使得他埋在底下的双眼散发着有魄力的光芒。</p><p class="story-paragraph">只是望向纱夏的时候，阳太的眼里微微浮现了类似惶遽的情感，好像不知这视线要往哪里放。</p><p class="story-paragraph">他张嘴要说什么，也没彻底讲出口，只朝纱夏点头示意就翻起了手头上的东西，借以点菜的名义避开直截了当的对谈。</p><p class="story-paragraph dialogue">“坐电车来的？”桃问她。</p><p class="story-paragraph dialogue">“嗯。”纱夏在这间隙偏头，将肩挎的细带漆皮小包取下。</p><p class="story-paragraph">身体的倾斜让色泽干净的黑发泄落于她雪白的脖颈。</p><p class="story-paragraph dialogue">“堵车吗？”</p><p class="story-paragraph">突兀的问句在长桌的尽头响起，纱夏顺着望过去，见那说话的人对自己眨了眨眼，她将听筒靠在耳朵上，没办法抽身：“不着急，你们注意安全。”</p><p class="story-paragraph">杏子挂断了电话，说是森川打来的。</p><p class="story-paragraph">他带了女朋友一起，出发有点晚了。迟到的理由通过杏子转达，在座的朋友也都接受了。</p><p class="story-paragraph dialogue">“已经不是女朋友了。”阳太接话。</p><p class="story-paragraph">他和森川关系好是人尽皆知的事，此言一出便立马被注目眼光所视。</p><p class="story-paragraph">但阳太在笑，他露出洁白整齐的牙齿，预兆这宣布的事是好消息。</p><p class="story-paragraph">纱夏最先反应过来。</p><p class="story-paragraph">可她没主动提，只通过那故意压得低又充满悬念的声音验证了猜想。</p><p class="story-paragraph">今晚预留的节目…</p><p class="story-paragraph">纱夏转着面前的杯子，里面是服务员给她倒的玄米茶。</p><p class="story-paragraph">估计没一会就有好酒喝了。</p><p class="story-paragraph">店里装的音响好像是松下牌的，摆在储酒柜的柜顶，在放新世纪的电子爵士乐，除了纱夏，不知还有谁将注意力集中在这些如此微不足道的细节上。</p><p class="story-paragraph">原来有高中同学要结婚了。</p><p class="story-paragraph">结婚…</p><p class="story-paragraph">这离她本还有十万八千里之远的恼事，像搭了星际宇宙间最快的一班列车飞驰到她眼前。</p><p class="story-paragraph">她快二十三岁了。</p><p class="story-paragraph">可如果实在不想嫁人…妈妈应该不会再逼迫她。</p><p class="story-paragraph">纱夏眨眼的小动作几不可闻。</p><p class="story-paragraph">她没怎么说话，在此终于有种不该属于少女性子里的沉默寡言绕着她。</p><p class="story-paragraph">纱夏想起了和南在黑暗静默里无声的凝望。</p><p class="story-paragraph">那是对什么可怖之物的低头妥协，是心照不宣的投降。</p><p class="story-paragraph">双方都在这场你追我赶的游戏里丢弃所有身份，不知疲倦地玩乐。</p><p class="story-paragraph">她想起了和南的第一次接吻，做爱，还有后面的很多次。</p><p class="story-paragraph">想起她们缠在一起的肉体，想起妈妈柔滑纤细的手指滑过她皮肤的触感，想起她们也交换过无数秒共存于这世上的呼吸。</p><p class="story-paragraph">好像有无数种声音混在一起，却又是她身体擅自违背主人意志发出的。是体内有东西作响。</p><p class="story-paragraph">脉搏似乎就在耳边狂跳不止，创造出源源不断的动能牵住她那颗脆弱的心脏。</p><p class="story-paragraph">若是有天要作出什么抉择。</p><p class="story-paragraph">比如一定要和谁永远度过这一生，要以签下那样神圣的契约做媒。</p><p class="story-paragraph">纱夏只想嫁给妈妈。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">阳太知道他做得不好，森川要他也把恋人带来的。</p><p class="story-paragraph">可是他反悔了。</p><p class="story-paragraph">确切地说，是在得知凑崎也会来的那天才反悔的。</p><p class="story-paragraph">阳太和懂事的女友撒了谎，骗她同学聚会因种种不可抗力因素取消了。</p><p class="story-paragraph">所以如今算是在犯什么傻…</p><p class="story-paragraph">他不太明白自己的心思，只为跑来见一见曾经最喜欢的人吗？</p><p class="story-paragraph">凑崎自毕业以后就再没和他碰过面了。</p><p class="story-paragraph">其实完全能够主动去约她，但男生那点自尊和骄傲已经透支到了究极的地步，他最多抓住节假日的机会，编辑显得自然的祝福贺语，再往还以同学身份相处的凑崎的 LINE 账号上发送几条。</p><p class="story-paragraph">旁侧敲击地从相熟的共同朋友那打听到她在哪里读书，学的是什么专业，想再想往深了的方向探索，也没有多的门路了。</p><p class="story-paragraph">凑崎对他而言很像读过很多遍的书上的某一页，想翻过去也容易，但注脚的数字永远也无法从记忆里抹掉。</p><p class="story-paragraph">那一页还有空余未被填满，却无法再写字了。</p><p class="story-paragraph">多一笔也不行。</p><p class="story-paragraph">阳太晚上喝了不少，喝到他手指关节的皮肤都微微地发热。</p><p class="story-paragraph">大学里参加联谊的次数多了，酒量靠练，也慢慢地上来了。</p><p class="story-paragraph">脑子还算清醒，肢体动作依然能保持稳定。</p><p class="story-paragraph">眼睛离不开凑崎。</p><p class="story-paragraph">他觉得那马上也要姓森川的女孩坐在她身边未免也太失算。酒精撬开了因多年不见而生的疏远，包括凑崎的表情。</p><p class="story-paragraph">她脸上浮现了酒醉之人特有的酡红。</p><p class="story-paragraph">很美。</p><p class="story-paragraph">存在于今夜最美的人。</p><p class="story-paragraph">鲜甜香气像打翻玻璃杯后流淌的液体，顺着重力沿她臂弯的弧线滴落。</p><p class="story-paragraph">翘起的眼尾在女孩不自知的时刻将她的面容修饰得惑人。</p><p class="story-paragraph">暖调灯光中和了凑崎酒红的眼影，附在她皮肤表面的亮片一星一点地现出痕迹。</p><p class="story-paragraph">比起中学时代的她而言…</p><p class="story-paragraph">凑崎好像正被某种奇异的特质环抱着。</p><p class="story-paragraph">那是秘密，秘密将她裹得光彩动人。</p><p class="story-paragraph">这种具象化的魅力为她的每一个动作都蒙上层梦幻的影。</p><p class="story-paragraph">凑崎就是这样的人，不需要多言也能重新点燃让他痴迷成狂的火把。</p><p class="story-paragraph">入夏的东京夜晚闷热，肆意的大笑让那汗珠更加嚣张地从脊背上滚落。</p><p class="story-paragraph">阳太弄脏了衣服，却不觉得可惜。</p><p class="story-paragraph">凑崎好像很开心。</p><p class="story-paragraph">也不知是不是酒精的缘故，她笑起来的样子还是敲得他几乎要眩晕。</p><p class="story-paragraph">总记得她留下来的背影。</p><p class="story-paragraph">记得她在教室里将头发扎起，露出好看的颈子。</p><p class="story-paragraph">薄薄的衣料遮不住的肩胛骨的线条、宽大的衣摆随着风吹来的踪影在她身侧飘浮摇曳。</p><p class="story-paragraph">凑崎现在正站在他的身边，被云朵打磨成浮石般的月亮所洒下的星芒笼罩。</p><p class="story-paragraph">阳太看她这样子像找不到身体支点的学步者，他知道女孩今晚喝了不少，所以猜到她那双脚应该就像踩在棉花上一样。</p><p class="story-paragraph">怕凑崎一不留神就着这散漫的姿势摔倒，阳太终于在最危险的时候扶住了她的肩膀。</p><p class="story-paragraph">那是很轻巧的一幅骨架，少女皮肤的热量透过穿的那件短袖渗进了阳太的手掌。他闻到凑崎身体的味道了，甜蜜的，混杂着酒的香气以后变得妩媚。</p><p class="story-paragraph dialogue">“谢谢。”她轻轻地转过头，弯起的眼睛里没有戒心，高挺的鼻子几乎是贴着他的胸膛。</p><p class="story-paragraph">阳太感觉到她呼出来的热气，挠得他心头发痒。</p><p class="story-paragraph">如果凑崎没有主动站离一步，他不愿意就此松开揽住她的手臂。</p><p class="story-paragraph dialogue">“今晚我还有点事…”她的意图原来是提早离场。</p><p class="story-paragraph">凑崎抱歉地以笑来赔罪，眼角往下垂：“可能要…先走了。”</p><p class="story-paragraph dialogue">“好不容易见一次。”杏子也喝得脸红，但词句还能连贯地吐出来。</p><p class="story-paragraph">好像是猜到了年轻女孩可能的去向，她借着醉意调侃凑崎。</p><p class="story-paragraph dialogue">“约了人？”</p><p class="story-paragraph">这句脱口而出的话明显暗示男友的存在，阳太刚好也很在意这个问题的答案。</p><p class="story-paragraph">凑崎摇摇脑袋，她掏了手机，大概看在时间。</p><p class="story-paragraph">阳太用身高优势瞥到了屏幕，现在还不到午夜，刚过十一点。</p><p class="story-paragraph dialogue">“桃知道，”她的语气有点飘忽：“我…”</p><p class="story-paragraph">后半句话被平井接了过去，她好像能担保凑崎确实有不方便说的原因要离开了。</p><p class="story-paragraph">女孩安静地往后退了一步。</p><p class="story-paragraph">不再方便做出挽留，他们原定的计划是继续待在池袋。</p><p class="story-paragraph">阳太已经兴味缺缺，因为凑崎已经说出再见，她马上就要转过身去了。</p><p class="story-paragraph">谢天谢地。</p><p class="story-paragraph">平井喊了她一声。</p><p class="story-paragraph">要不然凑崎就又要留给阳太一个背影。</p><p class="story-paragraph">她显然是不放心已经连路都走不好了的人。</p><p class="story-paragraph">平井拉住她的胳膊，以凑崎轻易就被拽得踉跄一下为理由执意要送她。</p><p class="story-paragraph">但阳太听见她的婉拒。</p><p class="story-paragraph dialogue">“我搭车，不麻烦…”凑崎牵着平井的手左右晃，将她逗笑了：“到时你又要…”说话都不连贯了，莫名其妙的停顿很可爱，也不忘体谅别人。</p><p class="story-paragraph dialogue">“一个人，”凑崎撅起嘴巴：“不安全…”</p><p class="story-paragraph">他的保护欲被激到了顶点。</p><p class="story-paragraph">阳太用小跑填补了三人之间拉开的距离，无视了背后善意的口哨声，凑崎醉眼朦胧的，大概也分不清其中含义。</p><p class="story-paragraph">阳太不想给凑崎发现他急切的心意，努力放慢了语速，说想要陪她们一起。</p><p class="story-paragraph">他也不知道这意味着什么。</p><p class="story-paragraph">阳太想再和凑崎相处一会，尽管凑崎这个状态也说不了几句话，他们同样没什么可聊的。</p><p class="story-paragraph">他看一眼平井，露出像小时候忐忑地等家长意见似的表情。</p><p class="story-paragraph dialogue">“阳太君也说要送你，”好在平井没多想，她凑近了女孩的耳朵和她说话，希望凑崎看在男生来了的份上就不要再担心她了：“怎么样？”</p><p class="story-paragraph">好像是被弄得痒了，女孩缩着脖子要躲，喉咙里挤出甜腻的哼哼，眉毛也可怜兮兮地缩着。</p><p class="story-paragraph">可惜的是她浑身软绵绵的，没劲。</p><p class="story-paragraph">最后凑崎被他们两合力塞进了出租车。</p><p class="story-paragraph">平井陪着她坐后面，阳太待在副驾驶上。</p><p class="story-paragraph">凑崎企图降下车窗再向朋友们挥手的，不过那有点傻，出于安全考虑也不好，她被按回了座位。</p><p class="story-paragraph">司机正在等乘客的指令。</p><p class="story-paragraph">阳太转过去，对着靠了垫子半阖眼帘的凑崎说话：“去什么地方？”</p><p class="story-paragraph">女孩口里吐出来的地址含含混混的，听不太清楚，平井只好让司机先往新宿的方向开。</p><p class="story-paragraph">阳太看到后视镜里的凑崎，她好像很喜欢和别人有肢体接触，现下乖乖地抱住了平井的手臂，整个身子都蹭了过去。</p><p class="story-paragraph">纠缠好几个回合，终于得到了确切的小区名字。</p><p class="story-paragraph">车朝着神乐坂那边驶，阳太才知道凑崎原来住在富人区。</p><p class="story-paragraph dialogue">“家里有人吗？”是平井在问她。</p><p class="story-paragraph">凑崎的答复是肯定。“我妈妈在…”</p><p class="story-paragraph">她声调娇得能滴出水来，让人不禁怀疑究竟有没这样去叫“妈妈”的必要。</p><p class="story-paragraph">又或者是她喝醉了以后喊谁都是这副样子。</p><p class="story-paragraph">凑崎身上的香味填满了整辆车的全部空隙。</p><p class="story-paragraph">他的胃囊深处在发烫，一下一下地翻滚绞紧，就连小腹的肌肉都忍不住绷住了。</p><p class="story-paragraph">幸好阳太坐在前排，黑暗里也看不出脸上颜色的变化。</p><p class="story-paragraph">在后座的动静几乎彻底消失以前，他悄悄地回了头去看。</p><p class="story-paragraph">平井还睁着眼睛。</p><p class="story-paragraph">她举起一根食指放在手边，示意阳太不要太大声讲话，以免吵到凑崎。</p><p class="story-paragraph">车里偶尔传出司机拨动转向灯按钮的声音，除此之外便没有其他的响动。</p><p class="story-paragraph">冷气穿过空调扇叶的缝隙。</p><p class="story-paragraph">很安静…</p><p class="story-paragraph">喜欢了一整个学生时代的女孩正靠在平井的肩膀上，她睡着了。</p><p class="story-paragraph">形形色色的建筑和车辆接连不断地出现、消失再出现，如此循环往复，在他视觉的可视范围之内闪动。</p><p class="story-paragraph">那些置于橱窗里的灯光被拉出明灭的踪迹。</p><p class="story-paragraph">阳太觉得他就像车尾的流线那样，在默然中越行越远。</p><p class="story-paragraph">而后他的耳畔出现了本不该存在于此处的猎猎风声。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">手机接到女儿的短信时她刚好在洗澡。</p><p class="story-paragraph">四十分钟以前纱夏就说要回家了，现在却连人影都没见着。</p><p class="story-paragraph">南下意识打开了以前用的那个软件，她看到空无一物的操作界面时差点没反应过来。</p><p class="story-paragraph">女儿在和她和解之后没有哪次出去过这么长时间，她也很少忐忑不安地等着纱夏回家。</p><p class="story-paragraph">都快忘了，她们好像已经解除绑定很久了。</p><p class="story-paragraph">南拨了纱夏的号码，但对方没有接。也许正和朋友聊得开心。</p><p class="story-paragraph">女儿好不容易能轻松地玩一次，不用费尽心思来照顾她…</p><p class="story-paragraph">忙音没来得及响，她掐断了通话。</p><p class="story-paragraph">不知道做什么。</p><p class="story-paragraph">这么晚了也不再适合读书，南有点局促，手不自觉地放在膝盖上。</p><p class="story-paragraph">那是不是要先去睡觉了？</p><p class="story-paragraph">就这样等着纱夏，好像也不会让她开心。</p><p class="story-paragraph">女儿总半开玩笑地说她睡眠不足。</p><p class="story-paragraph">如果真的想少添麻烦，她应该听纱夏的话，早点上床。</p><p class="story-paragraph">南将客厅的灯熄了，留了厨房和玄关的两盏。</p><p class="story-paragraph">她烧了开水。</p><p class="story-paragraph">那些瓶瓶罐罐的保健品都放在茶几下叠好的纸盒子里，南蹲下去将最大的那个抽了出来。</p><p class="story-paragraph">有纱夏每次都强迫她喝的姜黄颗粒。</p><p class="story-paragraph">虽然味道确实不怎么样，但她亲身验过，只要前一个晚上咬着牙吞下去了，第二天醒来就不会有那么难受。</p><p class="story-paragraph">专门用来解酒还是很有效的。</p><p class="story-paragraph">她将白瓷碗淌了个干净，撕开分装好的小袋。</p><p class="story-paragraph">熟悉的味道再次被滚烫的温度唤醒，随着水位上升的趋势浮了起来。</p><p class="story-paragraph">南忍不住皱了眉头，不过她倒有点想看纱夏喝这个的表情。</p><p class="story-paragraph">女儿只要尝过一次，大概就能理解她的心态了。</p><p class="story-paragraph">撕开了的包装纸被南扔进了垃圾桶，可她像突然想起什么似地停下了动作。</p><p class="story-paragraph">如果没记错，今天是星期二…</p><p class="story-paragraph">南通过解锁手机屏幕应证了自己的想法。</p><p class="story-paragraph">完全把垃圾分类这事抛到了脑后。</p><p class="story-paragraph">明天有车来收可燃物，家里堆的卫生纸和一堆杂七杂八的包装盒都该拿去扔掉。南不觉得恼，可以说这点闲事正中了她的下怀。</p><p class="story-paragraph">她刻意放慢了速度，甚至拿出了最严肃的架势，很认真地按标准处理那些能够回收的废品。</p><p class="story-paragraph">可是透明的垃圾袋都封好两个了，纱夏还没到家。</p><p class="story-paragraph">她不打算再这样与未知僵持下去。</p><p class="story-paragraph">因为碰过垃圾，南用肥皂里里外外地洗了两轮手。</p><p class="story-paragraph">她偶尔也会自我怀疑这是不是强迫症的前兆。</p><p class="story-paragraph">南轻笑一声，移开了目光，将水龙头的把手拧回原位。</p><p class="story-paragraph">她最后想去检查一遍门是不是被自己习惯性地落了锁，万一纱夏被关在外面可就不好。</p><p class="story-paragraph">怕桌上摆着的药冷了，南路过的时候又掺了点热水进去。</p><p class="story-paragraph">还没放下那个透明的细颈壶，她就听见门外有什么东西在响，好像是脚步声，但又不可能是一个人发出来的。</p><p class="story-paragraph">很拖沓很沉闷的动静，重重地敲在地板上。</p><p class="story-paragraph">然后门铃被谁按了一下，有点显老的电波声刺啦刺啦地传到她耳边。</p><p class="story-paragraph">南不需要再通过猫眼看来人是谁。</p><p class="story-paragraph">她知道纱夏是好孩子，是最守信用，最听话的好孩子。</p><p class="story-paragraph">女儿从来不会食言。</p><p class="story-paragraph">她说会早点回家，就不必再揣测其他答案。</p><p class="story-paragraph">女儿好像认定了有个人在家里等她，南刚开了门，就被她抱得死死的。</p><p class="story-paragraph dialogue">“妈妈…”纱夏几乎是扑在她身上，重量也全部压过来，毛茸茸的脑袋一个劲地蹭她，和软泥似的往下掉，抱都抱不住。</p><p class="story-paragraph">南洗了澡，衣服穿得凉快，胳膊露在外面，裙摆又短，只堪堪地遮到大腿根。</p><p class="story-paragraph">纱夏再这样不管不顾地摸下去就糟了，还站着两个外人。</p><p class="story-paragraph">她及时伸手揽过了女儿的肩，好让她安分些。</p><p class="story-paragraph">纱夏和平井关系好，毕业以后也会约在一起见面，南偶尔去接女儿，自然是见过她，不过只能说是单方面的——她坐在车里，单方面地见过平井，而对方对她一无所知。</p><p class="story-paragraph">这也能解释为何女儿的朋友表情那么惊讶。</p><p class="story-paragraph">南对此已经习惯了，每每向纱夏的同龄人介绍自己的身份，她都要收获一张表情夸张的脸，还有一句磕磕绊绊的“阿姨好”。</p><p class="story-paragraph">就连第一次告诉纱夏，她不也花了一段时间才学会好好地叫她妈妈。</p><p class="story-paragraph">情况一目了然，纱夏喝多了，平井和那个高高大大的男生是来送她的。</p><p class="story-paragraph">楼道里的声控灯还没灭，南莫名地觉得这男孩面熟，却一下没想起在哪见过。</p><p class="story-paragraph">她道了谢，其间虽然要一直应付纱夏捣乱的动作，还是记得履行长辈的职责。</p><p class="story-paragraph">南本想掏腰包为他们的回程提供路费，但平井坚持坐电车走，说现在还能赶得上。</p><p class="story-paragraph">纱夏勉强地从她的胸口抬起头，声音因如此姿势而变得闷闷的。</p><p class="story-paragraph dialogue">“要走…了吗？”她好像轻轻地打了个酒嗝。</p><p class="story-paragraph dialogue">“要走了，”平井故作嫌弃，也不管纱夏听不听得懂她的意思：“你早点休息。”</p><p class="story-paragraph">纱夏很用力地点头，发丝甚至都随着晃动的幅度跳跃：“你也…要…休息…”</p><p class="story-paragraph dialogue">“谢谢…你们送我…”纱夏还举起手，她像分不清方向的傻瓜，对着空气摆了两下。</p><p class="story-paragraph">南被女儿喝醉了的样子逗得眉眼弯弯，显然不止她一人这么想，平井也咧了嘴角笑。</p><p class="story-paragraph">刚刚一直没说话的男生同样开口了，他对着女儿讲话。</p><p class="story-paragraph dialogue">“不用谢。”</p><p class="story-paragraph">撇开曾听见过这声音的可能性不谈。</p><p class="story-paragraph">假装镇静的语气和异常的情愫又怎么可能逃得过她的耳朵？</p><p class="story-paragraph">南定睛看他。</p><p class="story-paragraph">跟女儿聚会的同学和当年毕业旅行的朋友是同一拨人…</p><p class="story-paragraph">她才反应过来，终于记得了这人的来历。</p><p class="story-paragraph">女儿现在像吊饰一样挂在她身上，类似于特大号的那种毛绒小熊玩偶，蹦蹦跳跳还会说话的那种。</p><p class="story-paragraph">纱夏本来就比她高一点，要不是膝盖都因失了力气屈起来，不至于才够到她的肩膀。南做了件很幼稚的事情。</p><p class="story-paragraph">她搂住了女儿的腰，手扣在纱夏的胯间，将她虚抱在怀里。</p><p class="story-paragraph dialogue">“再晚会误了车，”她看着平井，的确是出于关心的考量才赶人：“在路上注意安全。”</p><p class="story-paragraph">纱夏的同学很有教养地点了头。</p><p class="story-paragraph dialogue">“走吧。”平井率先背对他们，再次按亮了楼道的灯。</p><p class="story-paragraph">男生也朝南微微颔首，他没马上动，只是还在看着纱夏。</p><p class="story-paragraph">女儿没领他的情，头依然埋在她胸口。</p><p class="story-paragraph">南以下位的视线直视他，语气淡淡地道了句“走好”。</p><p class="story-paragraph">那个男孩的脸色似乎变得有些僵硬。</p><p class="story-paragraph">他倒退一步，高大的身躯最终还是转了过去。</p><p class="story-paragraph">南一直到确认电梯开始下行了才关门。</p><p class="story-paragraph">移动得很艰难，因为纱夏仍在不依不挠地纠缠她，上锁的声音在女儿耳朵里可能像是什么信号，让她像是条件反射一样地送来好多个吻。</p><p class="story-paragraph">女儿是真的喝了很多，能闻到让人尝了也头晕的酒香在她们的齿间流转。</p><p class="story-paragraph">纱夏的气息一点都不稳，所以吻得直白又肉麻。</p><p class="story-paragraph">她认为没必要这么用力接吻，但还是容忍了女儿。</p><p class="story-paragraph">南感觉上唇被她亲肿了。</p><p class="story-paragraph">两个人像仇敌见面，不由分说地扭打在一起，丁零当啷地撞了一路，趁战火没蔓延上床榻，南及时咬了纱夏一口，她才呜呜地避开。</p><p class="story-paragraph">不知道女儿是在装可怜还是真的委屈，眼睛里竟然闪出了晶莹的泪光。</p><p class="story-paragraph dialogue">“你不要我…亲…”纱夏皱起眉头：“你讨…厌我…”</p><p class="story-paragraph">南还在喘气，听了这话不由得又笑了。</p><p class="story-paragraph">小丫头。</p><p class="story-paragraph dialogue">“你还…笑…”女儿那娇气的样子简直叫她的心都化了，纱夏挥着她压根没捏紧的拳头轻轻捶她，像是在抱怨：“不要…唔…”南在她嘴巴上蜻蜓点水地落了一个吻。</p><p class="story-paragraph">她退开，看到纱夏扑闪了两下睫毛。</p><p class="story-paragraph">女儿的眼里都是迷离的醉意，但安静了。</p><p class="story-paragraph">南试着从她的腿上站起来。</p><p class="story-paragraph">纱夏规规矩矩地放了手，乖乖地坐在那里任她摆布。</p><p class="story-paragraph">怎么会有这么讨人喜欢的孩子存在？</p><p class="story-paragraph">无比信任她，从小到大都如此。</p><p class="story-paragraph">包括堕落，也一样是追了她的脚步…</p><p class="story-paragraph">心脏的腔室像是被灌入了一股如水流般绵长温润的悲哀，堵得她微微地发疼。</p><p class="story-paragraph">南收回了视线，她去端了醒酒汤过来。</p><p class="story-paragraph dialogue">“这是…什么？”女儿凑近了闻，好像忘记了这是她以前专门泡来摧残人的。</p><p class="story-paragraph">南没解释，只将碗捧到她嘴边，另一只手去抚纱夏的脖子，摩挲着她颈后柔软的发根。</p><p class="story-paragraph">女儿喝了一口，表情就迅速地变了，她好像使了力气，南感觉她想跑走或者是吐掉，但她可没那么仁慈，硬是压着纱夏，直到确认她全部咽下去才松开。</p><p class="story-paragraph dialogue">“苦…”女儿伸出了舌头，五官都皱在了一起。</p><p class="story-paragraph">小朋友要她安慰，南以亲吻她的脸颊做奖励。</p><p class="story-paragraph dialogue">“听话。”她拨好女儿的头发，又吻了她的鼻子：“等一下就不苦了。”</p><p class="story-paragraph">纱夏还没从那味道里缓过神来，整个人懵懵的，眼神很空洞，也不知到底听进去没有。</p><p class="story-paragraph">该睡觉了。</p><p class="story-paragraph">南看她这迷糊劲，不忍多折磨她。</p><p class="story-paragraph">她去洗手间给纱夏挤了牙膏，顺带拿上了两个杯子。</p><p class="story-paragraph">女儿听话地待在原地，她好像真的很困，趁这小功夫竟然还打起了盹。</p><p class="story-paragraph dialogue">“纱夏，”南说话的声音引起了醉酒之人的注意：“来刷牙。”</p><p class="story-paragraph">纱夏应了，她张了嘴。南刚让牙刷碰到她的舌头，纱夏就啊呜地咬住小杆，想往回抽已经来不及了，任凭南再怎么挪，都动不了半分。</p><p class="story-paragraph">她被弄得又气又笑，纱夏的妆还好好的没花，这么漂亮的小孩在和她耍酒疯，都舍不得动用家长身份凶她。</p><p class="story-paragraph dialogue">“那你自己刷。”南干脆松开，不陪着她闹。</p><p class="story-paragraph">这招很有用，女儿看她不买账就主动降低了标准，选择自给自足。</p><p class="story-paragraph">纱夏停下来的时候南递装了水的杯子给她，让她漱一下口再吐水到空杯里去。</p><p class="story-paragraph dialogue">“玩得开心吗？”闲着也是闲着，她还是忍不住问问女儿今天发生的事。</p><p class="story-paragraph">大概是开心的，要不然纱夏怎么会喝这么多酒？</p><p class="story-paragraph">女儿的表情显得很满足，南也放下心来。</p><p class="story-paragraph">好歹还是达到目的了。</p><p class="story-paragraph dialogue">“聊了什么？”她看纱夏弯着脖子换了一轮水。</p><p class="story-paragraph">女儿攥着牙刷，在酒精的压力之下努力思考，动作也猝然中断了。</p><p class="story-paragraph dialogue">“好多…”她有点苦恼，似乎不知道选哪个讲出来。</p><p class="story-paragraph">忽然想到了。</p><p class="story-paragraph">南看她圆溜溜的眼睛闪着光，听到纱夏给出她最想说的答案。</p><p class="story-paragraph">没有太意外。</p><p class="story-paragraph">当年她读完大学也有同龄的朋友马上就要举办婚礼的。</p><p class="story-paragraph">请柬都寄过来了，只可惜她遇上了事，没机会去现场。</p><p class="story-paragraph">其实比起这些与她本人无关的婚期，南更在意女儿。</p><p class="story-paragraph">纱夏一颦一笑都顾盼生辉的动人，好像光是想起这事就能和同学感同身受。</p><p class="story-paragraph dialogue">“这么高兴？”南用指尖撇干净留在纱夏嘴边的泡沫。</p><p class="story-paragraph dialogue">“高兴…”她表示赞成：“能和喜欢…的人…”</p><p class="story-paragraph">纱夏停顿了。</p><p class="story-paragraph">她好像不知该不该讲，似乎还有一点点清醒的理智在抓着她。那样胆怯的眼神猛烈地叩击着南。</p><p class="story-paragraph dialogue">“很好…”女儿的话说得格外轻，她省略了最关键的词。</p><p class="story-paragraph">怎会不知纱夏在想什么…</p><p class="story-paragraph">南低着头沉默，对此不置一词。</p><p class="story-paragraph">她有那么一瞬间觉得自己的喉头发紧。</p><p class="story-paragraph">好在纱夏也不再说话了，只在结束了刷牙的所有流程之后叫了她。</p><p class="story-paragraph">南从鼻子里哼出一声，她准备去把废水倒掉。</p><p class="story-paragraph dialogue">“你以前…”要不是纱夏还是醉醺醺的，眼神也一点都不清明，南真怀疑她的酒已经醒了：“是不是…谈…过恋爱？”</p><p class="story-paragraph">南扭过头，观察她的表情。</p><p class="story-paragraph">纱夏好像又出于本能地在害怕她的闪躲，嘴唇嗫嚅了两下。</p><p class="story-paragraph">都说醉酒的人是最诚实的，女儿下意识的畏缩像一把尖利的刀具刮开了她的胸口。</p><p class="story-paragraph dialogue">“嗯。”南实话实说。</p><p class="story-paragraph">纱夏好像早笃定了这个答案。</p><p class="story-paragraph dialogue">“几…次？”女儿的重点显然在这里。</p><p class="story-paragraph">南不打算瞒她。</p><p class="story-paragraph dialogue">“五次。”</p><p class="story-paragraph">她听见纱夏的咂舌声。</p><p class="story-paragraph">女儿瞪大了眼睛，那里面写满了惊愕，好像在处理耳朵刚刚接到的信息。</p><p class="story-paragraph">纱夏摊开了手掌，一个一个点过去。</p><p class="story-paragraph dialogue">“五次…”她的表情显得很挫败：“这么多…”</p><p class="story-paragraph dialogue">“所以才…”纱夏垂头丧气的，嘴里还在嘟嘟囔囔什么，她没听清。</p><p class="story-paragraph">南故技重施。</p><p class="story-paragraph">她亲了亲女儿的嘴巴，叫停了这种无意义的行为。“去洗脸，”南搀着她起来：“把妆卸了就睡觉。”</p><p class="story-paragraph">纱夏看起来很快就没事了。</p><p class="story-paragraph">不过喝醉的人脾气总难猜，道理放在女儿身上也一样。</p><p class="story-paragraph">不知又挠到她的哪根神经，纱夏开始还好端端地跟她走到镜子前，等要洗的时候又反悔了。</p><p class="story-paragraph dialogue">“不…”女儿在赖皮，仗着身高优势躲她。</p><p class="story-paragraph dialogue">“乖，”南好言好语地哄她，但论撒娇她真比不过纱夏，而且女儿又把头埋在她肩膀上了，南只好通过客观事实的角度入手，想再劝她一下：“不卸妆对皮肤不好。”</p><p class="story-paragraph dialogue">“不要…”</p><p class="story-paragraph">没想到纱夏的语气和即将要哭了一样。</p><p class="story-paragraph">她被女儿吓到了。</p><p class="story-paragraph dialogue">“我帮你卸，”南扶着纱夏，感觉对方的头发都垂到了她的衣服里去：“很快的。”</p><p class="story-paragraph">纱夏的头还是摇得和波浪鼓一样。</p><p class="story-paragraph dialogue">“卸了就…”她断断续续地说：“不好…看…”</p><p class="story-paragraph">南退了一步，又上前将纱夏的脸捧住，假装在端详。</p><p class="story-paragraph">其实根本就不用再看，女儿的所有表情她都记得。</p><p class="story-paragraph">着迷于这张脸。</p><p class="story-paragraph">包括拥有了这张脸的主人，以及她的那束灵魂。</p><p class="story-paragraph dialogue">“好看，”南无比认真，一次性解决了全部追问：“卸了妆也漂亮。”</p><p class="story-paragraph dialogue">“是最…漂亮的吗…”女儿问她，看得出来她还是不够自信：“和他们比…”</p><p class="story-paragraph dialogue">“和谁？”南不知道她要拿谁当假想敌。</p><p class="story-paragraph dialogue">“你…以前…”纱夏支支吾吾的：“喜欢的…”</p><p class="story-paragraph">南不知说什么好了，她怎么想都没料到女儿在担心这个。</p><p class="story-paragraph">她有点无奈，又想笑，手上的动作还没停，给化妆棉沾了水。</p><p class="story-paragraph">趁纱夏还在发愣，南将她口红的颜色揩了下来。好像需要证明她是真心实意地爱着纱夏的全部，爱她所有的样子。</p><p class="story-paragraph">南搂过女儿的脖子，踮起脚亲她。</p><p class="story-paragraph">她们的鼻息相闻。</p><p class="story-paragraph">两人的呼吸像是活着的，有生命的，熟悉彼此间的默契通性，将不够明亮的暗室搅出一圈圈荡漾的光纹。</p><p class="story-paragraph">南退离她。</p><p class="story-paragraph">纱夏真的醉得不轻。</p><p class="story-paragraph dialogue">“很漂亮，最漂亮。”</p><p class="story-paragraph">那些想来的确是被自己吝惜的赞美之词，她应该好好说给纱夏听的：“也很优秀。”</p><p class="story-paragraph">南手上的力气变小了，她一点点地将那粉从纱夏的脸上擦掉。</p><p class="story-paragraph">她希望那些一直囚缚着她的思绪也能被如此简单地除去。</p><p class="story-paragraph">南也想像女儿一样喝醉，第二天醒来当这一切全没有发生过。</p><p class="story-paragraph">可惜的是，她今夜终究还是滴酒未沾。</p><p class="story-paragraph">南是个多么优秀的辩手，面对女儿她却总要一而再再而三地思考。</p><p class="story-paragraph">她兜兜转转了很久也没能说出话，她只想起父亲与母亲共同出现的那个梦境。</p><p class="story-paragraph">关于那个梦，她还依稀地记得一些。</p><p class="story-paragraph">那块沾上颜色的棉花拭到女儿的额角。</p><p class="story-paragraph">南没看纱夏的眼睛。</p><p class="story-paragraph">她好想将全宇宙最亮的明星捧到女儿眼前…</p><p class="story-paragraph">可如果那颗星星已经提前降落了。</p><p class="story-paragraph">不仅提前降落，还偏偏落在她的身边，她又该怎么办呢？</p><p class="story-paragraph dialogue">“我一直…”</p><p class="story-paragraph">她的心脏被这样沉甸甸又无处释放的爱拧得震颤不已。</p><p class="story-paragraph dialogue">“都为你骄傲。”</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">纱夏没有醉成这样过，她是第一次体会到宿醉的威力。</p><p class="story-paragraph">头好晕。</p><p class="story-paragraph">不止如此，喉咙也像是被胶黏住了一样，渴得要命。</p><p class="story-paragraph">她习惯性地往左边靠，却扑了个空。</p><p class="story-paragraph">妈妈没和她躺在一起。</p><p class="story-paragraph">纱夏在偏头时看到了枕套上的花纹，才发现这是她的床。</p><p class="story-paragraph">她这是…</p><p class="story-paragraph">在自己的房间里。</p><p class="story-paragraph">女孩用胳膊支起身，被子顺着她身体倾斜的幅度往下滑。</p><p class="story-paragraph">她没穿衣服。</p><p class="story-paragraph">昨晚和妈妈做了吗？</p><p class="story-paragraph">想不起来了，她只记得被平井和阳太送回了家，然后妈妈在睡觉之前拽着她把妆卸了。</p><p class="story-paragraph">实在是太累了，也太困了，后面的那段记忆是完全缺失的状态。</p><p class="story-paragraph">纱夏摸到床头的手机，她按亮了屏幕。</p><p class="story-paragraph">有未接来电，好像还有好几个，但女孩还没来得及仔细看，大拇指就不小心先碰到了解锁键。</p><p class="story-paragraph">指纹密码立刻起效，系统弹出的消息一瞬间被清空。</p><p class="story-paragraph">纱夏打算等会再处理那些杂七杂八的事，她看了时间，现在已经十点了。</p><p class="story-paragraph">难怪妈妈不在。</p><p class="story-paragraph">要一个不恋床又醒来的人赖着好几个小时不走真是一件很不讲理的事。</p><p class="story-paragraph">她从翻身起来，没什么力气。</p><p class="story-paragraph">不是想象中衣服裤子胡乱地丢了一地的混乱场景。</p><p class="story-paragraph">女孩赤着脚走路，她随便套了件大码的短袖在身上。</p><p class="story-paragraph">纱夏的腿本来就长，比例又匀称好看。夏天穿这种宽松的衣服很方便，几乎是能将她身材的全部优点都现在外面。</p><p class="story-paragraph">只不过没口袋装东西，纱夏只能拿着手机。</p><p class="story-paragraph">南不在客厅，女孩猜到她的去处。</p><p class="story-paragraph">纱夏洗漱完以后直奔厨房，果不其然，妈妈就坐在餐桌旁摆着的椅子上。</p><p class="story-paragraph">早饭准备好了。</p><p class="story-paragraph">女孩看到熟透了的鲑鱼，以及切开了的半个柠檬。</p><p class="story-paragraph">妈妈好像花了很长时间准备了早餐，大概动用了烤箱，一想到这纱夏便再次确认她是真的睡了很久。</p><p class="story-paragraph">她现在正读着小开本的书，书的封皮上印着什么图案。</p><p class="story-paragraph">有可能是潮骚，又或者是斜阳。</p><p class="story-paragraph">纱夏不太确定，南将书本摊得很平，是卷起来握着的，扉页的一半都被遮住了。</p><p class="story-paragraph">女孩本想说声早，但这时间显然不允许如此不合乎逻辑的话语出现。</p><p class="story-paragraph">妈妈也在沉默，气氛好像有点隐约的尴尬。</p><p class="story-paragraph">纱夏先拖开椅子坐下去，将手机搁在桌上。</p><p class="story-paragraph">在给鱼肉浇柠檬汁之前她先喝了一大杯水，才感觉嗓子好受了点。</p><p class="story-paragraph dialogue">“我开动了…”纱夏握着筷子。</p><p class="story-paragraph dialogue">“吃吧。”对方往后翻了一页，眼睛没离开书本，语气也很平淡。</p><p class="story-paragraph">这样的回应让女孩有些忐忑，她偷偷使眼色看南。</p><p class="story-paragraph">妈妈的黑眼圈好重，似乎是没睡好。</p><p class="story-paragraph">是不是昨晚吵着她了…</p><p class="story-paragraph">纱夏开始内疚，她低头望着白瓷的圆盘。</p><p class="story-paragraph">鱼肉都被撕碎了，用筷子也不麻烦。</p><p class="story-paragraph">女孩慢条斯理地嚼，平时尝起来酸味有点过度的柠檬抵消掉了酒精滞留在脑内的艰涩麻木。</p><p class="story-paragraph">纱夏觉得她比刚刚清醒一些。</p><p class="story-paragraph">背后的窗子被谁开了个小缝。还能是谁呢…纱夏可不记得自己做过这个动作。</p><p class="story-paragraph">偶尔有点温热的风透过这间隙拂上她的脊背。</p><p class="story-paragraph">如果说樱花树是在春天苏醒，那么万物都会在夏季以最真挚热烈的生命力回馈上天的恩泽。</p><p class="story-paragraph">东京也不再总是蒙着层霭霭的薄雾。</p><p class="story-paragraph">也许有成群的飞鸟盘旋着绕过湛蓝的天空，她总会在千代田区看到的大只乌鸦说不定也混在那支迁徙的队伍里。</p><p class="story-paragraph">纱夏的心跳慢慢和缓下来。</p><p class="story-paragraph">这氛围好像还是和原先那样没有区别，想来也只是她太过敏感了，竟担心起子虚乌有的小事来。</p><p class="story-paragraph">白色的窗帘偶尔荡高，偶尔又停摆。</p><p class="story-paragraph">这要看风的心情了，总而言之那是纱夏不可控制的事。</p><p class="story-paragraph">手机忽然嗡嗡地鸣叫起来，纱夏是将它的背面扣着，屏幕朝下地摆在桌上。</p><p class="story-paragraph">如此震动声便因此变得异常地响亮，将她抖了个措手不及。</p><p class="story-paragraph">纱夏想起那几个未接来电，恐怕是谁急着要找她，连着不停地给她来电。</p><p class="story-paragraph">惬意的用餐时间被打断，女孩有点不太高兴。</p><p class="story-paragraph dialogue">“怎么不接？”妈妈没抬头。</p><p class="story-paragraph">本来想蒙混过关的，纱夏碍着她的面子才拿起手机。</p><p class="story-paragraph dialogue">“吃完饭再…”</p><p class="story-paragraph">她突兀地停住了——在看到来电人的名字以后。</p><p class="story-paragraph">纱夏抿着嘴，她的手指悬在那个红色的按钮上，却又迟迟没按下去。</p><p class="story-paragraph">犹豫得太久了，妈妈还在这里。</p><p class="story-paragraph">纱夏锁了两次屏，生硬地将那电话挂断。</p><p class="story-paragraph">她不敢去看南，低下头继续吃饭，可对面那人不肯善罢甘休，紧接着又打了个电话进来。</p><p class="story-paragraph">女孩这次反应速度快了些，她拨了静音按钮，装作没看到。</p><p class="story-paragraph dialogue">“骚扰电话？”南的这句话可算是给她解了围。纱夏忙不迭地点头，强烈表示她在大清早接到无良商家的轮番轰炸也是苦不堪言的。</p><p class="story-paragraph">南轻轻笑了一声。</p><p class="story-paragraph">纱夏看她合上了书。</p><p class="story-paragraph">原来那既不是潮骚，也不是斜阳，而是银河铁道之夜，她高中的时候读过的一本小说。</p><p class="story-paragraph dialogue">“给我。”妈妈朝她伸了手。</p><p class="story-paragraph">纱夏不由得坐直了身子。</p><p class="story-paragraph dialogue">“没关系。”她后悔没穿有口袋的裤子出来，不然也就不会像现在这样，只能将手机紧紧攥着。</p><p class="story-paragraph dialogue">“好像很难缠，”南似乎想帮她的忙：“真的没关系？”</p><p class="story-paragraph dialogue">“真的。”纱夏点头：“我会屏蔽来电。”</p><p class="story-paragraph">在她手掌底下发光的那几个字，赫然是服部这个姓氏。</p><p class="story-paragraph">妈妈好像信了。</p><p class="story-paragraph">她收回了压迫感极强的眼神，纱夏暂时松了口气。</p><p class="story-paragraph dialogue">“屏蔽来电。”南重复这个短语，好像是第一次听说这样先进的手机功能。</p><p class="story-paragraph dialogue">“就是加入黑名…”纱夏想给她解释。</p><p class="story-paragraph dialogue">“知道。”南的食指有一下没一下地敲着桌子，那声音像炸弹爆炸前的倒计时。</p><p class="story-paragraph">她的后半句话好像意味深长：“我不傻。”</p><p class="story-paragraph">纱夏的呼吸猛地一下变急促了，刚刚放下的心又悬到嗓子眼。</p><p class="story-paragraph dialogue">“不过你好像不这么认为，”妈妈眯起眼睛看她：“是不是？”</p><p class="story-paragraph">女孩的额角因紧张而渗出了汗。</p><p class="story-paragraph">有阵寒意沿着脖颈往上方攀爬，在那一小块区域激起了鸡皮疙瘩。</p><p class="story-paragraph">妈妈应该不知道才对。</p><p class="story-paragraph">放弃留学，档案还在学院审批的的这件事，她从没和南提起过。</p><p class="story-paragraph">除非…</p><p class="story-paragraph">唯一能想到露出破绽的时间只有昨晚，可恨的是她真的一点印象都没有了。“纱夏。”这一声将她从最后的侥幸里拖出来，她直直地对上了南的眼睛。</p><p class="story-paragraph">妈妈曾在意乱情迷的时候轻声唤过她。</p><p class="story-paragraph">她们相依为命的无数个夜晚以名字为载体互相安抚。</p><p class="story-paragraph">纱夏还不知道妈妈也能用这样冷酷的声音叫她。</p><p class="story-paragraph dialogue">“你学会撒谎了。”</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph">从女儿表情崩塌的速度来看，南没有错怪她。</p><p class="story-paragraph">一整晚都没睡，她现在很困。</p><p class="story-paragraph">身体已经疲倦得快要停机，大脑却还在求片刻的清醒。</p><p class="story-paragraph">该早点发现的，早点发现纱夏异常的源头，而不是通过她昨晚那点模棱两可的实话里去推理…</p><p class="story-paragraph">纱夏每每想蒙混过关时使用的不自然语气，再加上望向她时那莫名其妙又显得心虚的闪躲。</p><p class="story-paragraph dialogue">“我和你老师说了要撤回你的申请，”南将服部教授的要求原原本本地告诉了女儿：“你去学校签字。”</p><p class="story-paragraph">女儿放下了筷子。</p><p class="story-paragraph dialogue">“不去。”纱夏有心和她犟。</p><p class="story-paragraph dialogue">“为什么不去？”</p><p class="story-paragraph">她生硬又冷漠的语气让女儿退缩了，南看得出她在努力不露怯。</p><p class="story-paragraph">纱夏深吸了一口气，似乎是在平复情绪。</p><p class="story-paragraph dialogue">“我不会走的。”女儿重申她的观点。</p><p class="story-paragraph dialogue">“纱夏，”南放慢了语速：“我教过你做事要分清主次。”</p><p class="story-paragraph">纱夏也许早就料到会有对簿公堂的这一天，所以将那些措辞都准备好了。</p><p class="story-paragraph dialogue">“没什么比你重要。”</p><p class="story-paragraph">南猜过纱夏的理由，想到女儿十有八九就是为了自己才留下。</p><p class="story-paragraph">可当亲耳听到的时候，南还是觉得她的心就像流沙一样碎灭了。</p><p class="story-paragraph">她摇头。南知道纱夏现在听不进她的话，但她还是要试一试。</p><p class="story-paragraph dialogue">“你，”南一字一句地说：“你的未来比我重要。”</p><p class="story-paragraph">果然——</p><p class="story-paragraph dialogue">“你相信我，”女儿抓住了她的手，她的声音在发抖：“我留下来也…”</p><p class="story-paragraph dialogue">“你有没有想过学院为什么会拖延你那一纸申请？”南打断了她。</p><p class="story-paragraph dialogue">“缺席一场普通的考试也会影响个人征信的社会，你以为这个程度的违约不会对你的人生带来任何后果？”</p><p class="story-paragraph dialogue">“我知道，”南分明看到纱夏的眼眶红了：“我知道…我能处理好。”</p><p class="story-paragraph dialogue">“好，”她顺了女儿的话说：“那你告诉我你打算怎么处理。”</p><p class="story-paragraph dialogue">“我去找工作，”纱夏天真得可笑：“拿到学位证以后。”</p><p class="story-paragraph dialogue">“没有工期，”南松了她的手：“和那些转正的毕业生比，你的竞争力在哪？”</p><p class="story-paragraph dialogue">“我的绩点，还有比赛证书，”女儿的确考虑了这些问题，却依然不够成熟：“夏天的假期可以再用来实习，我已经在投简历了。”</p><p class="story-paragraph dialogue">“那我们就来探讨实现它的可能性。”南的身子往后靠。</p><p class="story-paragraph dialogue">“能找到什么工作，工作环境好不好，薪资和待遇，包括保险，”她一个一个地数：“人家深思熟虑半年才做下的决定，你还有多少时间？”</p><p class="story-paragraph dialogue">“你应该知道在我们国家跳槽有多难，”南绝不能把女儿往火坑里推：“这样轻率的判断没人能承担。”</p><p class="story-paragraph dialogue">“至少我不会后悔。”纱夏红着眼睛，好像一心往墙上撞。</p><p class="story-paragraph dialogue">“那我呢？”南问她。</p><p class="story-paragraph">一切问题的核心都源于此…</p><p class="story-paragraph">如果她没染上毒瘾就好了。</p><p class="story-paragraph dialogue">“是不是每发作一次，你就要为我离岗回家？”</p><p class="story-paragraph">女儿哑然，半个字都说不出口。</p><p class="story-paragraph dialogue">“这样的生活，”南陈述的事实残酷却又真实：“你能坚持多久？”</p><p class="story-paragraph dialogue">“那就等你好了，”纱夏垂着头，将手攥得很紧：“我再去工作。”</p><p class="story-paragraph">南闭上眼睛。“我现在不能接案子了，没有工资，”她再开口时语气很平淡：“在新宿生活的开销很大。”</p><p class="story-paragraph dialogue">“还是说，”南定定地看着女儿，她竟然笑了，为下面这个荒谬的提议感到可悲：“你想要用我父亲留下来的那些钱？”</p><p class="story-paragraph">纱夏掉了眼泪，但南没有替她擦。</p><p class="story-paragraph dialogue">“你不能逼我…”女儿抽噎着回答她：“做我不想做的事。”</p><p class="story-paragraph dialogue">“我可以，”南重新拿到了家长的权威：“只要法律也认可你是我的女儿，我就有必要对你负责。”</p><p class="story-paragraph dialogue">“对我负责，”纱夏的眼泪就像雨点一样往下落，她不停地重复这句话：“对我负责…”</p><p class="story-paragraph">女儿的眼神哀伤又真切，南的心几乎要被割裂了。</p><p class="story-paragraph dialogue">“你不知道我爱你吗？”</p><p class="story-paragraph">好想抱一抱纱夏，可她被从天而降的利剑钉在原地，动弹不得半分。</p><p class="story-paragraph">她是纱夏的母亲。</p><p class="story-paragraph">南僵硬地坐着，身子挺得笔直，捏着的拳头松了又握。</p><p class="story-paragraph">手心留下了醒目的指甲痕。</p><p class="story-paragraph dialogue">“这不是你为我抛弃原则的理由，”南感觉她在流血：“纱夏，每个人都应该有底线，如果能轻易地丢掉一次，就会有下一次。”</p><p class="story-paragraph">叫她亲手斩断这感情，这疼痛简直超越了毒瘾发作的等级。</p><p class="story-paragraph dialogue">“是我害了你。”</p><p class="story-paragraph">纱夏好像最怕听到这句话。</p><p class="story-paragraph dialogue">“不是…”女儿拼命地否定：“不是的。”</p><p class="story-paragraph dialogue">“我喜欢你，你不喜欢我，”纱夏把所有错都往自己身上揽：“都是我一厢情愿，跟你没关系。”</p><p class="story-paragraph">南不愿意再兜着圈子和她谈这个了，她中断了这个循环往复的辩题。</p><p class="story-paragraph dialogue">“我马上就去自戒中心，”彻夜未眠就是为了作下这个决定：“你到时安心去读书。”</p><p class="story-paragraph dialogue">“别去…”纱夏话都说不清楚了，她竟跪在她面前：“求你别去…”</p><p class="story-paragraph dialogue">“有专业的医生，也有专业的计划，”南终于还是抬手去摸女儿的脸，虽然对方的眼泪怎么止也止不住：“还是说你不相信我？”“那里的人都很凶，”纱夏扯着她的衣服：“你需要我…”</p><p class="story-paragraph dialogue">“这只是你的一面之词。”</p><p class="story-paragraph">南不再给她机会。</p><p class="story-paragraph">她从未曾讲过如此无情的话，如今上天却要逼着对她最爱的人说。</p><p class="story-paragraph dialogue">“在认识你之前，我一直都是一个人。”她用了心血才将后半句话说完整。</p><p class="story-paragraph dialogue">“离开你了也一样。”</p><p class="story-paragraph">女儿不敢置信地盯着她，眼里的光闪动得厉害。</p><p class="story-paragraph">仿佛只要南再吹一口气，那点希望就会彻底消失了。</p><p class="story-paragraph dialogue">“纱夏。”她几乎要被如此的反作用力碾成粉末。</p><p class="story-paragraph dialogue">“让我走吧。”</p><p class="story-paragraph">纱夏好像真的力竭了。</p><p class="story-paragraph">她颓然地松了手，无声的眼泪不停地往外冒。</p><p class="story-paragraph dialogue">“还有吗…”</p><p class="story-paragraph">女儿的嗓子喑哑得怖人：“除了这个…你还有没有要告诉我的？”</p><p class="story-paragraph">南仔仔细细地看着纱夏的脸。</p><p class="story-paragraph">眉毛，鼻子，嘴巴，眼睛，还有藏在头发里的耳朵。</p><p class="story-paragraph">这是凑崎纱夏。</p><p class="story-paragraph">她的目光在女儿的脸上停留了几秒钟，然后又用了几秒钟在心里叫她。</p><p class="story-paragraph">我爱你。</p><p class="story-paragraph">然后南摇摇头，低垂了眼帘。</p><p class="story-paragraph dialogue">“没有了。”</p><p class="story-paragraph">边缘</p><p class="story-paragraph">FelixFelicis_PN</p></div>

        <p class="chapter-subtitle">尘埃</p>
      </header>
      <div class="chapter-copy"><p class="story-paragraph dialogue">——</p><p class="story-paragraph">妈妈讨厌拥挤的地方。</p><p class="story-paragraph">真可惜，家门口楼下不远刚好又踩到了几个有名的景点，歌舞伎町和新宿这一带繁华的商铺为络绎不绝的游客提供了来来往往的理由。</p><p class="story-paragraph">只是多亏了东京有其他可以避开人流的去处，纱夏跟着她出门的次数才没因此受影响。</p><p class="story-paragraph">逛街虽然是大事，也逐渐成了头等难题。</p><p class="story-paragraph">有解决的方法，按计划买东西就好了。</p><p class="story-paragraph">采购方式的目的性强，除开必备的生活用品和厨房食材，妈妈有个雷打不动的地方要去。</p><p class="story-paragraph">东京都的中央区。</p><p class="story-paragraph">南特地开车到这里来，是因为山野乐器的总店开在银座。</p><p class="story-paragraph">纱夏从没有一次性见过这么多小提琴，它们就和服饰店里的上衣一样，挂满了店铺朝北的那面墙壁。</p><p class="story-paragraph">妈妈怕她丢了还是怎么的，一直牵着她的手。</p><p class="story-paragraph">纱夏就这样跟着南走，她们在高高的货架间穿梭。</p><p class="story-paragraph">然后妈妈停住了，女孩看她在一堆写满了英文的盒子里挑挑选选。</p><p class="story-paragraph">不像黑胶唱片那样轻便，七八年以前的音乐专辑和现在的不一样，都是拿特别厚的塑料壳封着的。</p><p class="story-paragraph">妈妈纤细的手指在翻动那些唱片的时候显得特别灵巧，清脆的碰撞声一下接一下地响起。</p><p class="story-paragraph">是怎么在看上去一模一样的盒子里准确地找到自己想要的那个呢？</p><p class="story-paragraph">这是困扰纱夏的一个问题，当然那时她还小，不明白唱片是按流派和唱片公司分好的。</p><p class="story-paragraph">求着妈妈买回来的巧克力也没有多吸引人了，纱夏一回家跑就到那个拆了的纸袋旁边看。</p><p class="story-paragraph">她小小的身子蹲在旁边。</p><p class="story-paragraph">如果说，除了那堆冗杂的公务之外，妈妈还会有什么兴趣爱好的话…</p><p class="story-paragraph">那这里一定就是突破点。不是说想投机取巧地讨好妈妈，纱夏是真的很好奇她喜欢什么。</p><p class="story-paragraph">她老是黏着妈妈，又不想要妈妈嫌她烦，每次找到一个能聊下去的话题她都很开心，但那些都是关于她自己的。</p><p class="story-paragraph">要是能更了解妈妈就好了。</p><p class="story-paragraph dialogue">“纱夏也想听？”南靠过来，她半跪着，肩膀与纱夏的脑袋平行。</p><p class="story-paragraph">女孩忙不迭地点头，闻到了妈妈身上有的那股味道。</p><p class="story-paragraph">温和又干净。</p><p class="story-paragraph">纱夏忍不住偷看她，南的视线都落在那些唱片上，几缕没挽好的发丝垂了下来，遮了她的侧脸。</p><p class="story-paragraph">她想帮妈妈弄好，但是觉得妈妈这样也很漂亮，于是就又低下去。</p><p class="story-paragraph">纱夏和南在一起住了不久了，见妈妈没有拦她的意思，胆子便大起来，伸手去拿放在最上面的 CD。</p><p class="story-paragraph">被塑膜纸封好的。</p><p class="story-paragraph">女孩很仔细地读印着的英文，封面上还有谁用油画的笔触展现出样貌的青年。</p><p class="story-paragraph">他的头发是白色的，还微微卷曲着。</p><p class="story-paragraph">纱夏锁定了那个看起来最像是人名的单词，拼读的大致方法她都学过。</p><p class="story-paragraph">女孩默念了几遍没出声，她在尝试怎么样念更正确。</p><p class="story-paragraph dialogue">“莫…”</p><p class="story-paragraph">她似乎很惊喜，像突然见到了某个分开已久的朋友那样，认定了这位几个世纪以前的天才音乐家就是她的旧友。</p><p class="story-paragraph dialogue">“莫扎特！”</p><p class="story-paragraph">妈妈被这样的语气逗笑了。</p><p class="story-paragraph dialogue">“厉害，”南表扬了她：“纱夏也知道莫扎特。”</p><p class="story-paragraph dialogue">“知道，”纱夏很骄傲的样子：“木下老师告诉我的。”</p><p class="story-paragraph">妈妈不问她木下老师是谁，因为妈妈记得她讲过的话，知道她音乐老师的姓氏，不用再重复一遍。</p><p class="story-paragraph dialogue">“听过吗？”南起身，音响就摆在客厅里，她拿起遥控器之后将 DVD 的电源启动了。</p><p class="story-paragraph dialogue">“听过几次。”纱夏想起老师在音乐教室里放的音乐。她没有喜欢，也谈不上讨厌，只觉得一首实在是太长了，没有特别好记的旋律——连歌词都没有，耳朵一脱离乐声，就完全将曲子忘得一干二净了。</p><p class="story-paragraph dialogue">“你来选一张，”妈妈把权力交给了她：“我们一起听。”</p><p class="story-paragraph">影碟机的仓门打开了，南在等她，这架势叫纱夏有点紧张。</p><p class="story-paragraph dialogue">“都是莫扎特的吗？”她拉开袋子的提手。</p><p class="story-paragraph">里面足足有七张唱片呢。</p><p class="story-paragraph dialogue">“不是，”南笑着否认：“也有其他人的。”</p><p class="story-paragraph dialogue">“哪一张是你最喜欢的？”</p><p class="story-paragraph">纱夏希望能直接听那张，就算古典音乐和她之间实在不来电，她也要为了妈妈多放几次。</p><p class="story-paragraph">可是…</p><p class="story-paragraph dialogue">“都很喜欢。”</p><p class="story-paragraph">这个答案一下就难住了女孩，她有些束手无策。</p><p class="story-paragraph">刚刚的计划泡汤了。</p><p class="story-paragraph">纱夏踌躇了短短的一小会儿，想到妈妈被自己晾在一边，还是尽最快的速度挑好。</p><p class="story-paragraph dialogue">“为什么选它？”妈妈接过去，女孩也没从她的动作里看出什么别的意味。</p><p class="story-paragraph">纱夏担心自己做错了。</p><p class="story-paragraph">但妈妈说了，她都很喜欢。</p><p class="story-paragraph dialogue">“这里是照片，”纱夏指指封面上的图案，这张专辑在她眼里的特别之处呼之欲出：“其他的都是画的。”</p><p class="story-paragraph">南弯起眉，好像完全满意这样一个特别的解释。</p><p class="story-paragraph">她用指甲沿着开封线轻轻划了一下，将打好小孔的薄带简单地撕掉了。</p><p class="story-paragraph">纱夏在一旁好奇地等着，这一切对她来说都很新颖。</p><p class="story-paragraph">圆盘卡在沟槽里，妈妈按了按发着光的小钮，唱片就被吞进去读盘了。</p><p class="story-paragraph">和想象的不同，也和她之前听过的宏伟乐曲不一样。</p><p class="story-paragraph">从音响里淌出来的乐符就是最干净的琴键声，没有花里胡哨的弦乐，也没有乍一听刺耳的铜管存在。她想那大概是黑白的琴键吧，也就是用钢琴敲出来的声音。</p><p class="story-paragraph">纱夏干脆乖乖地坐在地板上，双手抱着膝盖。</p><p class="story-paragraph">能感觉到，一段像音阶一样的构造被演奏家重复两次，然后就转进下一个新的音阶。</p><p class="story-paragraph">有种很奇异的魔力让纱夏安静下来了。</p><p class="story-paragraph dialogue">“听到了吗？”妈妈好像一个考官。</p><p class="story-paragraph">女孩被打断，愣愣地注视着南，看到她似笑非笑的表情。</p><p class="story-paragraph">她发觉妈妈话里有话。</p><p class="story-paragraph">纱夏竖起耳朵。</p><p class="story-paragraph">可她是第一次听，被旋律吸引了，除此之外再没捉到别的东西。</p><p class="story-paragraph dialogue">“什么？”纱夏还是忍不住问，稚嫩的声线被衬得空灵。</p><p class="story-paragraph">南仍旧没有说，卖关子似的，只轻轻转了两下旋钮，将声音调大了些。</p><p class="story-paragraph">不属于乐器的声音，低低的、像男人刻意压住嗓子以后发出的哼唱一闪而过。</p><p class="story-paragraph">纱夏坐直了身体。</p><p class="story-paragraph">她的眼睛圆溜溜的，不停地眨巴。</p><p class="story-paragraph">纱夏怕自己听错，又屏息等了一会，直到确认这钢琴家是在边弹边唱，才和妈妈求证。</p><p class="story-paragraph">她总以为这种高级点的音乐在录制的时候会特别严格。</p><p class="story-paragraph dialogue">“还可以这样…”</p><p class="story-paragraph dialogue">“嗯，”南见怪不怪的反应让纱夏觉得自己的惊讶很丢脸：“可以。”</p><p class="story-paragraph">妈妈把音量调回了正常范围，她一下又听不到那声音了。</p><p class="story-paragraph dialogue">“喜欢？”南好像一眼就看穿了她的心思。</p><p class="story-paragraph">纱夏当然没必要否认，果断地说喜欢。</p><p class="story-paragraph">妈妈喜欢古典音乐。</p><p class="story-paragraph">所以纱夏会为了她更喜欢。</p><p class="story-paragraph dialogue">——很汹涌的雨。</p><p class="story-paragraph">大块大块的云朵占据了天空的领地。</p><p class="story-paragraph">雨点细长，它们紧密地降落下来，也像白茫茫的丝线，穿过了无数个透明的针眼，然后将世界的天空与地面缝在了一起。</p><p class="story-paragraph">乱糟糟的，好像一锅煮沸的粥。</p><p class="story-paragraph">纱夏从学校出来，她已有将近一刻钟都停留在原地。</p><p class="story-paragraph">作为司机，也没办法开门看看情况。</p><p class="story-paragraph">前面发生了什么交通事故，所以中山道陷入了全线堵死的僵局。</p><p class="story-paragraph">年轻人的反应速度快，技术也不错，但纱夏怕自己分心，总本着稳妥的考虑出发，从不在开车的时候听音乐。</p><p class="story-paragraph">如果不是堵成这样，大概也不会打开车里的电台。</p><p class="story-paragraph">文京区的这几条大路算得上是东京的主要干线，如果真有汽车相撞，现在的主播员肯定不停地轮放着要大家小心出行的警告。</p><p class="story-paragraph">女孩想要将收音信号调到交通频道，也正好趁这时机摸个底，搞清楚大概还要等多长时间才能移动。</p><p class="story-paragraph">纱夏犹豫了一下还是又掏出手机。</p><p class="story-paragraph">是舍近求远的多此一举，但她不舍得切断正在播的曲子。</p><p class="story-paragraph">奥迪的车载音响有一骑绝尘的音质，生产商可能是为了赞美它，于是在靠近发声源的地方装了个半圆形的小盘，上面印着 BANG&amp;OLUFSEN，这就是最大功臣的名字。</p><p class="story-paragraph">先进设备有自动记忆的功能，妈妈爱听的古典音乐电台的数字被锁定，荧黄色的光在仪表盘的左侧定格。</p><p class="story-paragraph">流泻的乐声从网格的小眼之中掉落。</p><p class="story-paragraph">巴赫的平均律，在五线谱里穿梭的音符遵循了斐波那契数列一样严谨的规律。</p><p class="story-paragraph">在空调能大肆发挥作用的闷热雨天，这些元素组合在一起总有种冷酷的精确感。</p><p class="story-paragraph">每个声部的特点都被展露出来了，除了钢琴击键的清脆声响，还有很明显的信号能让她判断出演奏家是古尔德。</p><p class="story-paragraph">妈妈以前教她的。</p><p class="story-paragraph">其实不缺老师，但纱夏从南那里学到的东西更多。她还是有种爱屋及乌的小心思。</p><p class="story-paragraph">不管怎样，妈妈都是她爱慕了十二年的人。</p><p class="story-paragraph">南频频在如此琐碎的细节里现身。</p><p class="story-paragraph">好像无论纱夏身处何地，她都会陪着她。</p><p class="story-paragraph">她有很久没主动去想小时候的事了。</p><p class="story-paragraph">不是忘了。</p><p class="story-paragraph">如果有机会，她当然也很想忘记。</p><p class="story-paragraph">可怎么才能做到呢？</p><p class="story-paragraph">一点细枝末节的事情都会让她想起南。</p><p class="story-paragraph">被安静的节拍和滚过的音符裹挟在回忆之中，纱夏闻到了皮革座位散发出来的味道。</p><p class="story-paragraph">如果能回到过去，哪怕是得知了妈妈无论何时都会无可避免地背负那些愧疚…</p><p class="story-paragraph">她也想沉默地重新经历那伤痛一次，再见一次那些虚无的幻影。</p><p class="story-paragraph">带着现有的记忆，会不会更爱她一点？</p><p class="story-paragraph">可时间永远前进着，只要这个世界没有被卷进哪场科幻电影，就要继续往下走。</p><p class="story-paragraph">她不知道自己为什么在哭。</p><p class="story-paragraph">也许糟糕的天气和看不到尽头的车流都是罪魁祸首。</p><p class="story-paragraph">纱夏不要巧克力了，她也不要漂亮的衣服。</p><p class="story-paragraph">她只是忽然很委屈。</p><p class="story-paragraph">为不知道怎么使用特权向妈妈撒泼委屈。</p><p class="story-paragraph">为妈妈就这样不要她了委屈。</p><p class="story-paragraph">为回不了家委屈。</p><p class="story-paragraph">水滴正以一种很强悍的力道拍击玻璃，织出了像雾一样的帘子。</p><p class="story-paragraph">似乎只有躲在车里才是安全的，因为周遭的建筑物好像迅速地在这帷幕里解体，再看不太清。</p><p class="story-paragraph">那些砖瓦又或许是在泪水之中融化。好像全世界都在跟她那个小小的愿望作对。</p><p class="story-paragraph">纱夏只是想再和妈妈多待一会。</p><p class="story-paragraph">如果南也走了，哪里又才是她的家呢？</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">今晚是纱夏最后一次喂妈妈吃药。</p><p class="story-paragraph">卧室的灯被提早熄灭，她在黑暗之中握着她的手。</p><p class="story-paragraph">这同样动作纱夏已经重复了很多次，但她还是永远无法逃脱如此恐惧。</p><p class="story-paragraph">尤其是当南的指尖变得一片冰凉的时候。</p><p class="story-paragraph">她想显得勇敢一些，努力地保持镇定。</p><p class="story-paragraph">纱夏没有松开妈妈。</p><p class="story-paragraph">白天里经历的那场雨不知什么时候才停。</p><p class="story-paragraph">纱夏明明换上了新的短袖，棉质的布料从衣柜里取出来以后的确是干燥的没错，她却觉得有一小片浅浅的湿痕绕着肩头打转。</p><p class="story-paragraph">也许是她的心正在下雨。</p><p class="story-paragraph">眼前晕出了氤氲的迷蒙，南沉静的脸庞在这种修饰之下看上去格外柔和。</p><p class="story-paragraph">从眉毛到下巴，那些镌刻了阴影的弧度无一不美。</p><p class="story-paragraph">纱夏恍然中觉得妈妈在这十二年来从未变过。</p><p class="story-paragraph">经历吃药以前那阵钻心剜骨的疼痛的人好像不是南，她只是单纯地睡着了而已。</p><p class="story-paragraph">医生说病人的抵抗力会下降，于是纱夏便仔仔细细地给她掖好被角。</p><p class="story-paragraph">她不要妈妈感冒。</p><p class="story-paragraph">没有必要再次叫醒受药效影响以后昏迷的南，守到妈妈的呼吸平稳了，纱夏掩门退了出去。</p><p class="story-paragraph">九点了。</p><p class="story-paragraph">妈妈很少睡这么早，纱夏知道她有这样做的理由。</p><p class="story-paragraph">她看到那个漆黑的四轮箱靠墙放着，它的金属徽标倒映了天花板吊顶圆灯的光芒，好像一只发亮的眼睛。纱夏想不通为何装上了冬天的衣服以后，妈妈的行李都只有那么少。</p><p class="story-paragraph">少到用一个箱子就全部装完了。</p><p class="story-paragraph">女孩试着打开再重新检查一遍。</p><p class="story-paragraph">能在春夏交替之际穿的衣服也可以在秋冬轮转的时节派上用场，被妈妈叠成方形的有，被揉成卷的也有。</p><p class="story-paragraph">比起这些不耗空间的薄衣服而言，占地方的是两件大衣。</p><p class="story-paragraph">棕色的和黑色的，都是呢子布，她捏在手心还有点微微的刺人。</p><p class="story-paragraph">纱夏抓着那边边角角出神。</p><p class="story-paragraph">她在回想妈妈穿这件衣服的样子。</p><p class="story-paragraph">几乎都是冬天。</p><p class="story-paragraph">南和她在边境近似无垠的柔软雪地上踱步，那些飘飞的晶莹碎片翩翩地落在她的肩头，很快绽成水雾变的白花。</p><p class="story-paragraph">会忘记吗？</p><p class="story-paragraph">忘记妈妈眉眼底下荡漾出的笑，忘记她们缠绵时倾入彼此耳畔间的低语。</p><p class="story-paragraph">纱夏没想到熔铸了无数爱意的拥抱和亲吻竟是如此易碎。</p><p class="story-paragraph">除了妈妈以外，见证了它们曾经存在的人也只剩自己一个。</p><p class="story-paragraph">纱夏没来得及细嚼慢咽这段失败单恋所带来的后遗症。</p><p class="story-paragraph">又来了，她现在有种什么都感觉不到的麻木。</p><p class="story-paragraph">只在偶尔的时候，想起即将和妈妈迎来分别，她的胸口才会划过一道若有若无的钝痛。</p><p class="story-paragraph">纱夏都不知道这种矛盾的源头从何而生，也不知自己为什么会这样。</p><p class="story-paragraph">说实话，可能她比自己想象的要冷血，因为已经历了一次那噩梦，南的离去对她而言也只是在血肉模糊的地方狠狠地踩上几脚而已。</p><p class="story-paragraph">说不定很快就能恢复的，纱夏这样安慰自己。</p><p class="story-paragraph">她只觉得遗憾。</p><p class="story-paragraph">遗憾除开那些刻板的嘱咐以外，妈妈没再和她说几句额外的话。</p><p class="story-paragraph">她只是公事公办地告诉了自己处理杂务的流程，还有所有信用卡的密码是多少，包括公文材料和能当作公民身份证用的文件放在哪…</p><p class="story-paragraph">南对她本身好像已经没了多的兴趣，似乎只在意她有没有和学院的老师谈妥，得知自己会按原计划出国才露出稍微安心一点的表情。</p><p class="story-paragraph">看来她是真的做错了。</p><p class="story-paragraph">因为做错了，妈妈才这么急着走。</p><p class="story-paragraph">就连当初信誓旦旦地说好了要一起去毕业旅行，南也不再答应她了。</p><p class="story-paragraph">想来也是。</p><p class="story-paragraph">是她不遵守诺言在先，怎么能怪妈妈呢？</p><p class="story-paragraph">纱夏用手背擦掉了那滴险些就要弄脏那件大衣的滚烫眼泪。</p><p class="story-paragraph">她仔仔细细地将它重新叠了一遍，又按妈妈的习惯放回原位，再合上那拉链锁。</p><p class="story-paragraph">纱夏也决定去睡觉了。</p><p class="story-paragraph">到山梨县的路途算不上长的，但每次在出城时候都会被堵死。</p><p class="story-paragraph">这是她这么些年来生活在东京的经验。</p><p class="story-paragraph">少说也要花费两三个小时。</p><p class="story-paragraph">想到这舟车劳顿的滋味不好受，纱夏起先说要送她。</p><p class="story-paragraph">可妈妈决定搭普通的长途汽车，那是专门往戒毒所开的，每天有两班。</p><p class="story-paragraph">女孩不要心爱的人就坐着那样的大巴走了，她想叫私人座驾。</p><p class="story-paragraph">就算不亲自去，好歹也能更放心些。</p><p class="story-paragraph">这样的提议通通被拒绝了。</p><p class="story-paragraph">纱夏疑心再这样无谓地坚持下去只会更讨妈妈生厌，她兜兜转转了一阵子，最终向南让步了。</p><p class="story-paragraph">她必须让步，在这个家里做主的人从不是她。</p><p class="story-paragraph">明天一大早就会有司机来接妈妈。</p><p class="story-paragraph">纱夏洗漱完又过去了半小时，她直接回了自己的房间。</p><p class="story-paragraph">客厅留的最后一盏灯明明也被拉掉了，入睡却不如设想中的那么简单。她不停地闭眼，尝试着催眠那点活跃的神经，当然于事无补，与之对应的另一个动作便是不停地睁眼。</p><p class="story-paragraph">纱夏好一阵子盯着黑暗的某一处发呆，她望着某一处久了，就自发地将目光移到下一个地方。</p><p class="story-paragraph">闹钟定了三四个也不放心，她时不时就抬手去够手机。</p><p class="story-paragraph">屏幕上显示的时间便为此不停地流逝，一个个短小的间隙逐渐填去了本就不宽裕的残局。</p><p class="story-paragraph">指针过了零点，已经是第二天的凌晨了。</p><p class="story-paragraph">纱夏又开始害怕，害怕这个时候睡着早上就起不来。</p><p class="story-paragraph">她担心妈妈叫都不叫她就走了，担心再睁眼的时候家里空荡荡的，真的只剩她一个人了。</p><p class="story-paragraph">纱夏反复地调整闹钟的音量，像精神衰弱似地不停地按那个加号按钮。</p><p class="story-paragraph">才确认完又要确认。</p><p class="story-paragraph">还是睡不着。</p><p class="story-paragraph">她口渴极了，心悸得慌，好几次坐起身又躺下，手掌和脚心都在冒莫名其妙的汗。</p><p class="story-paragraph">纱夏将头埋进枕头里深呼吸，这种挤压的窒息感也没能让她放松下来。</p><p class="story-paragraph">可以肯定不是惊恐发作，那点病南早就陪着她治好了。</p><p class="story-paragraph">正是因为恢复得太好了，纱夏甚至都不太记得这伤痛还有留下什么痕迹。</p><p class="story-paragraph">可是她不好受。</p><p class="story-paragraph">纱夏知道妈妈马上要从她的生活里离开了。</p><p class="story-paragraph">她在清醒的时候经历着的疼痛堪比一刀刀落在身体上的凌迟，这折磨痛得让人几乎要叫出声来。</p><p class="story-paragraph">纱夏再也忍不住了。</p><p class="story-paragraph">她果断地翻身，赤脚就踩在地上，踩得木地板吱呀吱呀地响。</p><p class="story-paragraph">女孩子走路已经是摇摇晃晃的，她马上就要因这不稳的惯性压下门把手，却还是停住了。</p><p class="story-paragraph">纱夏脑海里突然闪过了一个很可怖的念头。</p><p class="story-paragraph">她还没思考因果，心底的想法便被房门上的锁闩插着的钥匙串暴露得一干二净。</p><p class="story-paragraph">要是…</p><p class="story-paragraph">能把妈妈关起来就好了。就这样和她一起留在家里…</p><p class="story-paragraph">恶魔好像在她耳边低语，催促她赶快动手。</p><p class="story-paragraph">只要扭一下那柄银色的金属钥匙…</p><p class="story-paragraph">纱夏听到锁舌弹出来的声音。</p><p class="story-paragraph">这动静像一记耳光，在黑夜里将她抽得脑子耳朵都一齐嗡鸣地响。</p><p class="story-paragraph">纱夏有些后怕地去转它，却怎么也握不住小小的门把。</p><p class="story-paragraph">她一个劲地和那锁斗智斗勇，试了好几次都没打开。</p><p class="story-paragraph">花了很长很长的时间。</p><p class="story-paragraph">纱夏的精神力被这行径耗到了底，她咬着嘴巴避免自己发出噪音。</p><p class="story-paragraph">喂南喝药的那个水杯还摆在旁边，妈妈也好端端地躺在床上。</p><p class="story-paragraph">看到这一幕她才稍微放心点。</p><p class="story-paragraph">纱夏怕她害了妈妈，她不敢再在里面待了。</p><p class="story-paragraph">她自我安慰着，告诉自己应该要做出什么事情来证明她已经长大了。</p><p class="story-paragraph">比如半夜不再在睡不着的时候惊扰妈妈。</p><p class="story-paragraph">她要放她走。</p><p class="story-paragraph">纱夏再次上床时紧紧地攥着手机。</p><p class="story-paragraph">好像只有这个姿势才能让她稍微拿回一点安全感。</p><p class="story-paragraph">幸好南不知道她那些自私的念头。</p><p class="story-paragraph">纱夏希望她能一直做妈妈心里的好孩子。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">天气很好，昨日瓢泼的大雨在这种衬托下显得像是她虚假的幻觉。</p><p class="story-paragraph">早餐是吐司和热牛奶。</p><p class="story-paragraph">还有另一种搭配。</p><p class="story-paragraph">纱夏知道妈妈不能摄入咖啡因，她只给自己冲了杯美式。黑咖啡消除水肿的效果好像不怎么强，她的眼袋还是肿得和灯泡一样。纱夏一直在偷看妈妈。</p><p class="story-paragraph">南最近好像有点怕冷，所以没换上短袖。</p><p class="story-paragraph">米白色的衬衫料子很薄，纽扣规规矩矩地系到了最上面的那一粒。</p><p class="story-paragraph">她明明是想和妈妈聊天的，可是平时能找到俏皮话的脑子已经转不动了。</p><p class="story-paragraph">全部的心思都集中起来，纱夏竖起耳朵听着妈妈手机发出来的一切动静。</p><p class="story-paragraph">任何提示音都能让她紧张。</p><p class="story-paragraph">妈妈现在大概是在看新闻吧，纱夏知道这是她的习惯。</p><p class="story-paragraph">南划动屏幕时面无表情，她觉得妈妈说不定已经收到了司机催她出发的短信，只是还在等她吃完早餐。</p><p class="story-paragraph">纱夏慢吞吞地嚼那片颜色烤得深了的面包，她不知道这有没有办法拖延南的行程。</p><p class="story-paragraph">可是除此之外她还能耍些什么花招呢？</p><p class="story-paragraph">纱夏垂着眼睛，心不在焉的态度让那些面包屑落了一桌子。</p><p class="story-paragraph">可能要再等很久，她才能再和妈妈一起吃饭。</p><p class="story-paragraph">她以前能一个人守在家里，是因为她知道不管等多久，南都会回来。</p><p class="story-paragraph">纱夏不清楚，如果南再也不回来了…</p><p class="story-paragraph">她还能不能有勇气等下去。</p><p class="story-paragraph">在如此念头闪现于纱夏脑海的时候，南刚好接起了电话。</p><p class="story-paragraph">妈妈口中零碎的应答让女孩停下了手上的动作。</p><p class="story-paragraph">纱夏恍惚地只听见一些只言片语，可她残存的推理能力已经判断不出来这究竟意味着什么。</p><p class="story-paragraph">直到妈妈拉动了椅子，纱夏心里那点最害怕的预想才得以应验。</p><p class="story-paragraph dialogue">“你慢慢吃。”南说了这句话以后就往客厅走。</p><p class="story-paragraph">纱夏知道她是要去拿行李箱。</p><p class="story-paragraph">女孩胡乱地将面包往嘴里塞，她险些噎住，咽了两口咖啡就追着南出去。</p><p class="story-paragraph">轮子好像是在她的心脏上碾过。她手足无措地站在客厅。</p><p class="story-paragraph">那盆长势很好的虹之玉还放在原先的地方，全然不知道自己被抛弃了。</p><p class="story-paragraph dialogue">“你…”纱夏的脑子木木的：“不带上它吗？”</p><p class="story-paragraph">南随着她的视线去追，知道了她指的是什么。</p><p class="story-paragraph">妈妈摇了摇头，语气好像有些惋惜。</p><p class="story-paragraph dialogue">“不带了。”</p><p class="story-paragraph">纱夏很后悔问了这个问题，她不知怎地从南嘴里听出了另一层意思。</p><p class="story-paragraph">就好像如果换了主语，妈妈的回答也是一样。</p><p class="story-paragraph">那我呢？</p><p class="story-paragraph">纱夏想向妈妈求救，但她发不出一点声音。</p><p class="story-paragraph">你是不是也不要我了？</p><p class="story-paragraph">女孩不知道怎么宣泄胸口里那些委屈。</p><p class="story-paragraph">她没再说话，只生硬地从妈妈手里夺了行李箱的伸缩杆。</p><p class="story-paragraph">纱夏沉闷地转过身，先一步走到玄关换鞋。</p><p class="story-paragraph">她听见妈妈也跟了上来，却赌气地没有马上回头。</p><p class="story-paragraph">纱夏起来的时候，南还在屈着身子系鞋带。</p><p class="story-paragraph">那是一双黑色的运动鞋。</p><p class="story-paragraph">想来也是，妈妈在那样的地方大概没机会穿高跟鞋了。</p><p class="story-paragraph">纱夏发着呆。</p><p class="story-paragraph">她的眼眶突然很酸，觉得妈妈衣服底下透出来的蝴蝶骨是那么漂亮，又那么纤弱。</p><p class="story-paragraph">她握都握不住。</p><p class="story-paragraph">小时候是怎么觉得妈妈有那么厉害的呢？</p><p class="story-paragraph">纱夏愣愣地看着妈妈伸手将她翻起的衣领理得服帖。</p><p class="story-paragraph">明明南站直了也没她高。门廊上挂着写了名井姓氏的牌子。</p><p class="story-paragraph">纱夏觉得就算妈妈再也不住在这里了，她也不会换掉它。</p><p class="story-paragraph dialogue">“带了钥匙吗？”南扶着门把，在等她确认的答复。</p><p class="story-paragraph dialogue">“嗯。”纱夏从喉咙里挤出一声。</p><p class="story-paragraph">妈妈也会舍不得吗？</p><p class="story-paragraph">舍不得这个她们一起住了十二年的家。</p><p class="story-paragraph">纱夏不知道妈妈的想法，南只是用那极轻的力道掩上了这扇实木门。</p><p class="story-paragraph dialogue">“走吧。”</p><p class="story-paragraph">直到这个时候，纱夏还是不肯相信她和南要就这样分别。</p><p class="story-paragraph">一切都没有实感。</p><p class="story-paragraph">她们平静地走进电梯，再平静地按下到达一层的按钮，平静地走出小区的大门，平静地与保安问好。</p><p class="story-paragraph">难道不应该更特殊一些吗？</p><p class="story-paragraph">纱夏努力地在周身的景色里寻找那点不同于往日的异常。</p><p class="story-paragraph">可是鸟儿飞翔的轨迹如一，花朵盛开的方向也未曾改变。</p><p class="story-paragraph">就连在路边的行人也只是继承了工作日的传统，行色匆匆地提着公文包在她眼前经过。</p><p class="story-paragraph">纱夏不想这样。</p><p class="story-paragraph">如果这是重逢之前她和南的最后一面，她祈求上天至少发生点什么事情让她记住这样的一个日子，让它能与其他无关紧要的烦琐小事有明显的不同。</p><p class="story-paragraph">可是没有。</p><p class="story-paragraph">走到大巴车的跟前时没有，司机从她的手里接过行李箱时也没有。</p><p class="story-paragraph">这是一个平凡的日子，平凡到她可以从已经历的二十年的人生里随便挑出一天代替的那种平凡。</p><p class="story-paragraph">纱夏想问这是不是搞错了。</p><p class="story-paragraph">妈妈陪了她这么久，她们经历了那么多…</p><p class="story-paragraph">怎么一个电话就让她离开了呢？“纱夏。”</p><p class="story-paragraph">这分明又是南在叫她。</p><p class="story-paragraph">纱夏才发现司机不知在何时上了车，下一个要上去的人就是妈妈了。</p><p class="story-paragraph">她开始后悔了，也想不通自己怎么会浪费这么多宝贵的时间。</p><p class="story-paragraph">明明还有好多好多话想和妈妈说。</p><p class="story-paragraph dialogue">“妈妈…”纱夏用了很大的力气去阻拦落下来的眼泪，可它们还是忤逆了她的意志，不受控制地往下坠落。</p><p class="story-paragraph">女孩像想起什么一样，翻起自己的口袋。</p><p class="story-paragraph">果不其然…</p><p class="story-paragraph">纱夏掏出了妈妈的车钥匙。</p><p class="story-paragraph dialogue">“你看，”这对她来说简直就是救命稻草：“我也可以送你…”</p><p class="story-paragraph dialogue">“你和他们说，”纱夏牵着妈妈：“就说我送…”</p><p class="story-paragraph dialogue">“纱夏。”妈妈打断了她。</p><p class="story-paragraph">女孩不停地摇头，她不想要南接着往下说了。</p><p class="story-paragraph dialogue">“照顾好自己。”</p><p class="story-paragraph">泪水几乎覆在了她的脸上。</p><p class="story-paragraph dialogue">“好好学习，”南只是缓缓地将手从她手里抽了出来：“该花钱的地方也不要省着。”</p><p class="story-paragraph">纱夏很清楚这些话就大概是南道别之际唯一的嘱托，挽留她的心愿却怎么都说不出口。</p><p class="story-paragraph">她连抱都不敢抱妈妈了，只拉着她的衣角。</p><p class="story-paragraph">她已经比南高了，这姿势是真的有些滑稽可笑。</p><p class="story-paragraph dialogue">“你…”纱夏的嘴唇发着抖，她好怕妈妈听不清她讲话：“你也要…”</p><p class="story-paragraph">她做不到连贯地将心意告诉妈妈。</p><p class="story-paragraph">南脖子上还环着那条项链，纱夏光是看它就已经泣不成声。</p><p class="story-paragraph">她大口大口地喘着气，可妈妈还愿意等她说下去。</p><p class="story-paragraph">纱夏狠狠地咬着舌尖，她强迫自己不要再因为啜泣发抖。“谢谢…”</p><p class="story-paragraph">她希望即使自己不说全，南也能知道她的意思。</p><p class="story-paragraph">谢谢你把我养大。</p><p class="story-paragraph">也许这心意传达到了。</p><p class="story-paragraph">妈妈凑近了她，轻轻地和她拥抱在一起。</p><p class="story-paragraph">纱夏的泪水将贴近南侧脸的那些鬓发全都蹭湿了。</p><p class="story-paragraph">她感觉到妈妈的下巴抵在她的肩膀上，感觉到她呼吸的热气一点点喷在她的锁骨上。</p><p class="story-paragraph">南倒退了一步，她眨了眨眼。</p><p class="story-paragraph dialogue">“不用谢。”</p><p class="story-paragraph">妈妈明明是对她微笑，纱夏却在此刻知道她终于站在了自己触不可及的地方。</p><p class="story-paragraph dialogue">“纱夏，”她是第一次在南脸上看到如此表情：“再见。”</p><p class="story-paragraph">女孩张了张嘴，声带中涌动的气流好像尖锐的匕首，能割开她的喉咙。</p><p class="story-paragraph dialogue">“再见…”</p><p class="story-paragraph">妈妈一步步踩上车里的台阶。</p><p class="story-paragraph">南也许是特意挑了靠近她那边的窗户，坐到座位上以后才对她挥了挥手。</p><p class="story-paragraph">隔着玻璃听不见南的声音，纱夏就连她说话的口型也瞧不太清了。</p><p class="story-paragraph">女孩其实很少去回忆她和妈妈第一次见面的场景，究其原因是她根本记不得。</p><p class="story-paragraph">那是个什么日子呢？</p><p class="story-paragraph">纱夏怔怔地想。</p><p class="story-paragraph">那时的天气也像今天这样吗？</p><p class="story-paragraph">汽车在靠近十字路口的尽头转了个弯。</p><p class="story-paragraph">纱夏踉跄着脚步。</p><p class="story-paragraph">她抬手想将眼泪擦得干净些，却再也没有看见那辆越驶越远的大巴。</p><p class="story-paragraph dialogue">——在去纽约之前，纱夏打算出租这套公寓。</p><p class="story-paragraph">这决策是纱夏自己定下的，即使还想再和南商量，她也没有办法联系妈妈了。</p><p class="story-paragraph">南待的自戒中心强制与外界切断了交流。</p><p class="story-paragraph">听说以前还没这么严格的，但慢慢有老奸巨猾的人混进来了。</p><p class="story-paragraph">暗地里呼朋引伴的情况实在是太多，有瘾君子刚住满一年出去就又找了毒友，几乎没有一点挣扎便开始复吸。</p><p class="story-paragraph">被迫染毒的例子少，就算存在南这样无辜的人，定下的规矩也不可能轻易地为她改变。</p><p class="story-paragraph">纱夏只能从院方定时发来的邮件里获悉妈妈的境况。</p><p class="story-paragraph">偶尔会有南的照片。</p><p class="story-paragraph">纱夏把这些电子数据都好好地保存在手机里，想她的时候就会翻出来看。</p><p class="story-paragraph">以周为单位的饮食计划和用药计划也会原原本本地告诉她。</p><p class="story-paragraph">纱夏知道他们还给妈妈安排了专门的心理医生。</p><p class="story-paragraph">她很高兴见到有人陪着妈妈，很高兴南不用再尝到孤单的滋味。</p><p class="story-paragraph">纱夏同样也不想要妈妈回家的时候收获那些落满灰尘的家具。</p><p class="story-paragraph">她查到了电话，最近的地产中介设在新宿三丁目，离家不远。</p><p class="story-paragraph">女孩填好网上的表格申请就关闭了页面。</p><p class="story-paragraph">对方的办事效率也快，没过几天就有人登门拜访，说是公司职员，特意来检查一下房屋的情况。</p><p class="story-paragraph">那人一进门就递了名片给纱夏。</p><p class="story-paragraph">她撇了一眼，是位姓千岛的先生。</p><p class="story-paragraph">他的西服熨得整整齐齐，一板一眼地系上了灰色条纹的领带，皮鞋擦得程亮，怕弄脏了地板，还带了鞋套。</p><p class="story-paragraph">千岛先生拿出了可以伸缩的长尺，纱夏看着他用那东西在墙壁上敲敲打打，她想这是为了测量面积。</p><p class="story-paragraph">尽管女孩早就知道这里是黄金地段，可中介公司为她开出的租金实在是太高了。</p><p class="story-paragraph">虽然里面已经包括了介绍和物业的费用，但纱夏还是不免担心大部分人都会被如此高昂的数字吓倒。</p><p class="story-paragraph dialogue">“您可以划定区域，”千岛用很常见的技巧给她提议：“租客只能使用您指定的房间。”纱夏若有所思地点点头。</p><p class="story-paragraph">她试着将书房和妈妈的卧室门掩上，对方便从这简单的动作里意会了。</p><p class="story-paragraph">白纸上已经记录了那么几个数据，千岛先生在做加减法。</p><p class="story-paragraph">他重新按了计算器，接着给出了纱夏还算满意的价格，至少数字没有之前那么恐怖了。</p><p class="story-paragraph">千岛看出这女孩年轻。</p><p class="story-paragraph dialogue">“不用太担心，”他出言安慰她：“这套房的位置好，条件也不错，价格高点很正常。”</p><p class="story-paragraph">纱夏不置可否，价格再低些她也无所谓。</p><p class="story-paragraph">本意并不是赚钱，女孩只想找个人帮忙看管一下它。</p><p class="story-paragraph">差不多说好了。</p><p class="story-paragraph dialogue">“那就定了，”千岛先生递给她一张印了铅字，但还有空白需要填的合同：“我们会为您投放租房的广告。”</p><p class="story-paragraph">他还有个请求。</p><p class="story-paragraph dialogue">“房屋产权的证书还有登记人的证件可以劳烦您让我检查一下吗？”</p><p class="story-paragraph">纱夏想起南的话，成功地在电视柜底下的抽屉里找到了写有房产契约证的小本。</p><p class="story-paragraph">还有妈妈放在家里的驾照。</p><p class="story-paragraph">千岛先生微笑着点头，接了过去。</p><p class="story-paragraph">男人翻开扉页，他看了几眼，又直接往后翻。</p><p class="story-paragraph dialogue">“房产证是没问题的，”千岛再开口时语气有些疑惑，好像纱夏弄错了某一个步骤：“身份证明不行。”</p><p class="story-paragraph dialogue">“不能用驾照吗？”</p><p class="story-paragraph">纱夏开始盘算南还留了什么证件在家里。</p><p class="story-paragraph">妈妈出国的次数还算多，也许能找到她的护照…</p><p class="story-paragraph dialogue">“可以的，”千岛表示肯定：“但名字不对。”</p><p class="story-paragraph">还没来得及等纱夏问出口。</p><p class="story-paragraph dialogue">“您是叫凑崎纱夏？”男人先确认了一遍。</p><p class="story-paragraph dialogue">“是的。”纱夏回答得很果断。千岛先生不知怎么地眯着眼在看妈妈的驾驶证上的小字，然后将它交还给了纱夏。</p><p class="story-paragraph dialogue">“我需要您的证件，”他在向不明情况的女孩解释：“您给我的是名井小姐的。”</p><p class="story-paragraph">纱夏挑了挑眉毛。</p><p class="story-paragraph dialogue">“这房子是她的。”</p><p class="story-paragraph">千岛摇摇头。</p><p class="story-paragraph dialogue">“已经过户给您了。”</p><p class="story-paragraph">他特意将那本子翻过来指给纱夏看。</p><p class="story-paragraph">女孩睁大了眼睛。</p><p class="story-paragraph">左下角最新的红戳清清楚楚地写上了日期，它告诉纱夏这改动发生在一年以前。</p><p class="story-paragraph">第一行的空栏上印着几个汉字，那是法律认证的房屋主人。</p><p class="story-paragraph">可那不是名井南。</p><p class="story-paragraph">纱夏突然哭了，将千岛先生吓了一跳。</p><p class="story-paragraph dialogue">“抱歉…”</p><p class="story-paragraph">纱夏哽咽着，从面色显得有些尴尬的男人手里拿回了那本房产证。</p><p class="story-paragraph">她临时改变了主意。</p><p class="story-paragraph">纱夏一连对着他鞠了好几个躬，腰都快压弯了。</p><p class="story-paragraph">不想出租了。</p><p class="story-paragraph">她将着个想法原原本本地告诉了对方。</p><p class="story-paragraph">千岛先生也不怪她，只稍微停顿了一下：“您没事吧？”</p><p class="story-paragraph dialogue">“没事。”女孩擦了擦掉出来的眼泪，她在钱包里抽出几张能支付服务费的现金。</p><p class="story-paragraph">那肯定够了，甚至还多了零头。</p><p class="story-paragraph">但纱夏认为这是她出尔反尔以后应该支付的代价，如果她不做，就会被谁惩罚。</p><p class="story-paragraph">她将他送到电梯口。</p><p class="story-paragraph">纱夏回到家里将那些文件一股脑地倒了出来。她从来都没有翻过它们，所以直到现在才发觉这个事实。</p><p class="story-paragraph">纱夏后知后觉地在这些有法律效力的证件里找到了叫人心安的东西。</p><p class="story-paragraph">只要这个房子没有住进新的人，只要不将屋子的所有权交给一个外人…</p><p class="story-paragraph">女孩捡起住民票，她努力地在泪眼婆娑之中辨别那些字迹。</p><p class="story-paragraph">纱夏的手抖得甚至捏不稳这一纸老旧的证明。</p><p class="story-paragraph">她终于也找到了某种意义上的永恒。</p><p class="story-paragraph">即使所有人都不知道，即使再没有人记得了。</p><p class="story-paragraph">只要她们都好好地活着，那么就算此生再也不能相见…</p><p class="story-paragraph">名井南和凑崎纱夏的名字也会在这样一个地方亲密地相连…</p><p class="story-paragraph">永永远远地挨在一起。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">在飞机翻过日界线的时候，纱夏回到了来时的前一天。</p><p class="story-paragraph">她是孤身一人飞越太平洋辽阔的海面。</p><p class="story-paragraph">过往的人生和她与南相连的通道已经在这瞬间消亡。</p><p class="story-paragraph">可纱夏不知道。</p><p class="story-paragraph">她睡着了，安安静静地蜷在自己的座位上。</p><p class="story-paragraph">点点碎光从悬离地面千里的云层之间渗了进来，不偏不倚地落在女孩轻颤的睫毛上。</p><p class="story-paragraph">每颗星星坠落的时候都会留下痕迹。</p><p class="story-paragraph">也许纱夏已经在过去的某个时刻和她曾待过的那片天空说了再见。</p></div>

<template id="template-chapter-26"><section class="chapter" aria-labelledby="heading-chapter-26">
