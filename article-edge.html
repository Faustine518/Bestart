        <span>CHAPTER 26</span>
        <h2 id="heading-chapter-26">边缘</h2>
        <p class="chapter-subtitle">泡沫</p>
      </header>
      <div class="chapter-copy"><p class="story-paragraph dialogue">——</p><p class="story-paragraph">芒草变了颜色。</p><p class="story-paragraph">从这个角度望过去就能看到，那些及腰高的草木植物整齐划一地换了一幅面貌。</p><p class="story-paragraph">翠绿的细叶跟着岁月转圜，最后像是变成了金灿灿，却又不那么漂亮的干瘪稻麦梢。</p><p class="story-paragraph">中部地区随了名字里那点规律走，四季的轮换在这里显得平庸又无趣。</p><p class="story-paragraph">容易感知到的炎热与寒冷尚且都在该来时候慢半拍，更何况是在几乎察觉不到什么变化的九月。</p><p class="story-paragraph">日历上的某一页被划去将近一半的数字，这才勉强为稍降的气温做了铺垫。</p><p class="story-paragraph">入秋了。</p><p class="story-paragraph">客观条件已经不允许南只穿单薄的衬衣。</p><p class="story-paragraph">她也听话，一直都遵了护士的意见，到了室外就会带上开襟毛衣，再不济也会将它好生地搭在肩上。</p><p class="story-paragraph">南没必要还将自己的身体当作年轻人一样翻来倒去地折腾，不服软只会感冒，惹得一身麻烦的事端。</p><p class="story-paragraph">她从未在夜露没有彻底消散的清晨出过门。</p><p class="story-paragraph">南很聪明，总会特意选那些能见到太阳的日子才离开房间，走得远了甚至还会冒汗。</p><p class="story-paragraph">说是行为繁杂又琐碎的行程也压根算不上。</p><p class="story-paragraph">毕竟在这里的空间有限，南只能简单地散个步，她退而求其次地将它安排进了日常活动。</p><p class="story-paragraph">按低标准，也往好听了的方向讲，算得上是低强度的有氧运动。</p><p class="story-paragraph">但南知道这还远远不够。</p><p class="story-paragraph">她其实很担心自己身材走形，三十几岁，基础代谢怎么说也不如青年时期了。</p><p class="story-paragraph">不光是静坐的时长已经达到了人生中最高的巅峰，摄入的热量还一点也没少。</p><p class="story-paragraph">一日三餐按时落到她的胃里边，盘子里偶尔还会出现天妇罗。</p><p class="story-paragraph">滚着面粉炸过的猪肉得有多少卡路里？</p><p class="story-paragraph">南总要捏着筷子迟疑。</p><p class="story-paragraph">她在心里估算了三个头尾相连的数字，很想叫负责伙食的厨师在下次稍微手下留情些，可事已至此，出于礼貌也不好浪费别人辛辛苦苦准备的饭菜。最终南还是硬着头皮全部吃下去，不过事实倒让她吃了一惊。</p><p class="story-paragraph">体重并不像预想的那样一发不可收拾，每月按例做的身体检查写得清清楚楚了，她是长胖了点，但只有那么几斤肉，看不大出来。</p><p class="story-paragraph">最常规的血压也被划进了当中范围，各项身体指标还正常。</p><p class="story-paragraph">她住进来就要满三个月了，得到的检查结果也总是相差无几的。</p><p class="story-paragraph">专门照顾南的护工姓渡边，年纪和她差不多一般大，但身材娇娇小小的，比她矮上不少。</p><p class="story-paragraph">她的头发为工作的方便特意剪到齐耳的位置，看得出做事的动作也很干净利落。</p><p class="story-paragraph">两人会聊天，女护工也算得上是她在这里的半个朋友了。</p><p class="story-paragraph">南知道渡边是她丈夫的姓，而她家里的小孩才上国中一年级，南看过他的照片，长得有几分像妈妈，是挺精神的一个男孩。</p><p class="story-paragraph">都是母亲的女人在某些方面上特别有共同话题。</p><p class="story-paragraph">很少有家属会认认真真地给每一封病人的健康报告发送回信的，而弄清楚最近出现的例外正是南的女儿之后，渡边一下就猜出那个叫作“凑崎纱夏”的人不是她的亲生孩子。</p><p class="story-paragraph">毕竟过目电子邮件的这件事也算在她的职责里，就算纱夏已经将境况写得足够简略，但她在纽约读大学的事实多多少少都会透露出来。</p><p class="story-paragraph">南本来也不打算隐瞒什么，承认得很果断。</p><p class="story-paragraph">渡边小姐有时会给她拍照片，虽然南大多数情况下总会拒绝，但女护工似乎也是出于好心才帮她，说她的女儿也许会想看看她过得怎么样。</p><p class="story-paragraph">南只愿意为了纱夏妥协，可一想到照片是要给女儿看的，她又会紧张自己是不是不够漂亮了。</p><p class="story-paragraph">好在渡边小姐也不觉得她花时间打扮是件奇怪的事，会耐心地等她。</p><p class="story-paragraph">南担心这样实在是太麻烦别人，再加上她是为了心爱的人大费周章地闹腾，心虚得很，也怕这种不自然的害羞被发现，每次只匆匆涂了口红就坐好。</p><p class="story-paragraph">反正怎么都没有最好的效果。</p><p class="story-paragraph">南是真的发现她老了，她都快记不起自己大学刚刚毕业的那会儿是长什么样子了。</p><p class="story-paragraph">她猜只有那个时候的她才配得上现在的纱夏。</p><p class="story-paragraph">渡边让她自己挑一张照片发给女儿，几张也可以。</p><p class="story-paragraph">南对后续工作没什么兴致。其实都差不多丑，她看着被毒品折磨得人不人鬼不鬼的自己，觉得再多瞄它们两眼都是煎熬。</p><p class="story-paragraph">南有的时候会想笑，等她年纪再大些，进了养老院以后，她大概也是这样一板一眼地坐着，拍照给女儿看，可她转念又记起，等她八十岁，纱夏肯定也是一头的白发了。</p><p class="story-paragraph">她认为这样很有趣，却又怎么想也想不到女儿以后的长相。</p><p class="story-paragraph">果然是为人母的心性使然，就连纱夏从小小的孩子长成现在这么大，南都一时半会儿都没反应过来。</p><p class="story-paragraph">女儿寄来的信里慢慢也会有照片，不过她从不露脸，南几乎将女儿写的东西都一字一句地背会了。</p><p class="story-paragraph">她的记忆力虽然不如从前，但法律打下的基本功牢得可怕。</p><p class="story-paragraph">很多事她想忘都忘不了。</p><p class="story-paragraph">医生会按时给她提供白色粉末，那大概是种很厉害的药，渡边护士会守在她身边看她吸食。</p><p class="story-paragraph">南偶尔会在最爽快的时候恍惚地听见纱夏用一种很哀伤的语调同她讲话，内容大概是信里写的那么几句，翻来覆去地倒，意思是要她坚持下去。</p><p class="story-paragraph">但她被药效控制着，挣扎的力度微乎其微。</p><p class="story-paragraph">南知道她马上就要开始戒断治疗了，院方吝啬起来，用塑料袋装好的粉末一天比一天少。</p><p class="story-paragraph">瘾带来的痛不欲生终于又一次现身了，她珍惜起吸食毒品的机会。</p><p class="story-paragraph">南逐渐切身地明白为何父亲不惜一切代价也要拿到它们。</p><p class="story-paragraph">毒品在她眼里已经不再是可怖的恶魔化身，而是能让她幸福的好家伙。</p><p class="story-paragraph">南终于失去了评判他的资格。</p><p class="story-paragraph">她也不知道自己吸毒究竟是为了追寻身体被抛上云端的快乐，还是仅仅为了和那个被她亲手赶走的女儿在幻境里肆无忌惮地相爱。</p><p class="story-paragraph">南有时觉得她对纱夏的爱一文不值，有时又觉得她爱女儿爱到被宇宙流放了也无所谓。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">全身都被汗水浸湿。</p><p class="story-paragraph">被固定在隔离房间的大床上，南的手和腿都被死死地捆着，她挨着软绵绵的棉絮才不至于在剧烈的挣扎中弄伤自己。</p><p class="story-paragraph">留在她手腕上的勒痕很明显，它们在细嫩的皮肤上更扎眼，像弯弯曲曲盘起身子的毒蛇。</p><p class="story-paragraph">南手臂上被贴了一个又一个小圆片，它们金属的端头被覆上层薄膜，另一侧还连着两三台仪器，是为了确认她心率正常才装的。</p><p class="story-paragraph">现在那机械正疯狂地报警，哔啵声刺耳又紧密。</p><p class="story-paragraph">好像有无数小虫在血管里蠕动，从南的脑袋爬到脚趾，它们要用尖牙利齿嚼碎她。</p><p class="story-paragraph">如果没有戴着防护牙套，她真的很有可能为了缓解这种剧烈的疼痛而自残。</p><p class="story-paragraph">事实上她正在这样做，好在防护工具全都起到了作用。</p><p class="story-paragraph">它们虽然保护了南的身体，却让毒瘾发作的剧痛完完全全地降临在她身上。</p><p class="story-paragraph">南用舌头顶着套住上颚的塑料，她的咬肌紧紧地绷住。</p><p class="story-paragraph">她现在真的像一头雌兽，口水也从嘴角里溢出来，喉咙中发出的求救模糊不清。</p><p class="story-paragraph">南感觉她的双腿中有热流往外涌，也许是失禁了，但她觉得那是内脏融化以后变成的血。</p><p class="story-paragraph">这是她今天遭受的第一次禁断反应。</p><p class="story-paragraph">南将全部的希望都寄托在站在床头的渡边护士。</p><p class="story-paragraph">她双眼发黑，快要什么都看不见了，只能在钝化的朦胧影子中找到那个熟悉的身影。</p><p class="story-paragraph dialogue">“我要…”南想念她将粉末吸进身体里的感觉，她想念她浮游在一片虚无海洋之中的快意，她承认她就是离不开那些东西，也承认她需要它们，哪怕吸到死她也乐在其中。</p><p class="story-paragraph dialogue">“让我吸…”</p><p class="story-paragraph">另一阵新起的剧痛激得她失声地尖叫，碰撞的力度已经很强了，她开合的嘴边已经有了淡淡的血色，恐怕是柔软的口腔被坚硬的物什撞出了细细小小的伤口。</p><p class="story-paragraph dialogue">“给我…”她哑着嗓子喊，终于意识到尊严在欲望面前不值一提：“求求你…给我…”</p><p class="story-paragraph dialogue">“你是在…杀人…”南觉得自己丝毫没有夸大其词。</p><p class="story-paragraph">对方越是无动于衷，她的恨意就越发高涨。</p><p class="story-paragraph">南将女儿的名字也一并划在里面。</p><p class="story-paragraph">她决定等她在这里住满最短的一年期限就马上离开。</p><p class="story-paragraph">在法律界认识了那么多客户，刑事犯罪里的那群人里也有很多背景不清不楚的。</p><p class="story-paragraph">南不相信她弄不到。大麻，冰毒，海洛因，或者伯利恒也好，她无所谓，只要能让她舒服，什么都好。</p><p class="story-paragraph">所有人都见死不救，只有神木，以及父亲才是和她一边的。</p><p class="story-paragraph">她甘愿投降，目光涣散，几乎要失去焦点。</p><p class="story-paragraph">南竟然有点想念神木。</p><p class="story-paragraph">如今的她已经不是第一次碰毒品的小小雏鸟了，要是能再拿到纯度那么高的伯利恒，她绝对不会不识货，肯定会慢慢地打到身体里去，享受它们被推到体内每一个角落的感觉。</p><p class="story-paragraph">纱夏也不能来救她，纱夏会和这群人一样做加害者，让她独自在这里饱受折磨。</p><p class="story-paragraph">南打心眼里愿意再被神木绑起来扎一针。</p><p class="story-paragraph">她觉得他才是她的救世主，是他带领她尝到这种美妙的感觉，那是她目前的人生里最有滋有味的刺激，她尝过以后才知道其他的一切都不算什么。</p><p class="story-paragraph">神木那副嘴脸好像在南的记忆里变得稍微英俊了些，她想如果那个男人没死，她干脆就和他一起打针打到死，要她付出什么代价都好。</p><p class="story-paragraph">渡边护士还在用冷静的语调说话，她也许在叫她，但这根本无法安抚南一丝一毫，而且对方后面的那些话她根本听不清，她甚至未加细细分辨便将嘴里恶毒的诅咒都抛了出去，她同样也不清楚自己在说什么。</p><p class="story-paragraph">只有几个断断续续的词飘到了她的耳朵里。</p><p class="story-paragraph dialogue">“Setsu…”</p><p class="story-paragraph">是雪吗？</p><p class="story-paragraph">奇怪，怎么突然说雪呢？</p><p class="story-paragraph">她故乡的雪和东京的雪都非常漂亮，可南不记得她在这个冬季见过那些飘飞的白花。</p><p class="story-paragraph">山梨县的阴天特别多，但她知道雪一般是和晴天一前一后来的，这也许是中部地区迟迟未见雪影的原因。</p><p class="story-paragraph dialogue">“我…同学。”</p><p class="story-paragraph">南盯着天花板的眼睛已经开始翻白了。</p><p class="story-paragraph">她的脑海里有一点点意识存留着，自发地沿了这些讯号一样的提示开始思考。</p><p class="story-paragraph">她的同学…</p><p class="story-paragraph">离开关西以后，南就再也没有和老同学见过面了。</p><p class="story-paragraph">她对他们的记忆全部停留在她抽空去学校拿毕业证书的时候，那天她没遇见的人她都想不起来了。南很后悔。</p><p class="story-paragraph">她其实很珍惜每一个人的，为何到最后都与他们断了联系呢？</p><p class="story-paragraph dialogue">“圣诞。”</p><p class="story-paragraph">南想起前几天刚过了圣诞节。</p><p class="story-paragraph">西洋节日传到日本来也慢慢受年轻人欢迎。</p><p class="story-paragraph">南还在平安夜到来的加持之下吃了一颗苹果。</p><p class="story-paragraph dialogue">“纽约下雪了…”</p><p class="story-paragraph">她动了动手指，眼泪顺着她眨眼的动作落到了枕头上。</p><p class="story-paragraph dialogue">“曼哈顿上城区每天都堵得水泄不通，我和同学一起去买了礼物。”</p><p class="story-paragraph">当然南脸上早就被分不清是汗水还是泪水的液体占领了。</p><p class="story-paragraph dialogue">“圣诞…”</p><p class="story-paragraph">理智没有来得及回笼，体力已经撑不住了。</p><p class="story-paragraph">南直接晕了过去。</p><p class="story-paragraph">再次醒来的时候，那些冰冷的、像机关一样的东西终于弹开了。</p><p class="story-paragraph">床单也被换了，南察觉到她穿的裤子是新的。</p><p class="story-paragraph">她侧过身，脖子和背都应此举做出应激反应，酸得要命。</p><p class="story-paragraph">南适才闷哼出一声，苏醒的事实就立马被正在记录数据的渡边护士发现了。</p><p class="story-paragraph dialogue">“您还好吗？”对方给她倒了温水，装在深红色的保温杯里，南接过来，她知道每到这个时候都不能逞强，嗓子也确实不舒服。</p><p class="story-paragraph dialogue">“还好。”果不其然，前几个音节都是沙哑的，南清了清喉咙，又温吞吞地喝了几口水，护工喂来了一颗柠檬味的水果硬糖，南将它含在嘴里，闭了会眼睛才睁开，瞳孔终于恢复了几分清明。</p><p class="story-paragraph">南顺着扶渡边的方向，慢慢地坐起身。</p><p class="story-paragraph dialogue">“我去给您拿晚餐来，”她将立式的饭桌支起：“今晚吃生姜猪肉。”</p><p class="story-paragraph">她作势要走，南从发呆的状态中缓过来。</p><p class="story-paragraph dialogue">“几点了？”她问护士。独立房间有一个小小的电子钟，但是是放在靠窗的小台子上的，南不想走到那边去，她猜自己很可能一起身就会栽倒在地上。</p><p class="story-paragraph dialogue">“快到八点了。”</p><p class="story-paragraph">南闻言抬眼看她。</p><p class="story-paragraph">她想起她特意拜托的事，南怕对方因为她刚刚犯瘾，将全部心思都花在照顾她的事上，以至于把她说的话都抛之脑后了。</p><p class="story-paragraph dialogue">“您…”南又不知道怎么开口。</p><p class="story-paragraph">她想起自己一醒来就突兀地指挥渡边小姐忙着忙那，心里过意不去，于是摇摇头。</p><p class="story-paragraph dialogue">“没事了。”</p><p class="story-paragraph">反正还早，晚点再说也是一样的。</p><p class="story-paragraph">对方没有马上掩门离开，她似乎在南的沉默里找到了反常的原因。</p><p class="story-paragraph dialogue">“不用担心，”护士朝她微笑：“我给您女儿发了邮件。”</p><p class="story-paragraph">南垂在一边的手不动声色地紧了紧，她的眉毛好像因此有了点活泼的生机，终于动两下。</p><p class="story-paragraph">她听到锁舌弹回原位的声音，在等今晚的菜肴时，南看起了床边的日历。</p><p class="story-paragraph">南将它拿在手上，认真地数了数。</p><p class="story-paragraph">再等几天她就要翻页了。</p><p class="story-paragraph">她希望纱夏能买个蛋糕吃，今天可是她二十三岁的生日。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">这样的眼见之境大概是梦吧。</p><p class="story-paragraph">南木木地站着，手不知放该在哪里。</p><p class="story-paragraph">她很想闭上眼睛，后者却一直死死地、像是违抗了主人意志那样睁着。</p><p class="story-paragraph">眼球涩得发疼，南几乎是要流出泪来。</p><p class="story-paragraph">纱夏背对着她，一丝不挂地骑在谁的身上。</p><p class="story-paragraph">少女光裸的身躯染上了情欲的粉红，南很熟悉女儿的肌肤在翻云覆雨的情事中经历的一切变化。</p><p class="story-paragraph">她看到她腰肢后侧浅浅凹进去的两个小涡，动人的，永远像是淌了美酒一样等她品尝。纱夏在主动往下坐。</p><p class="story-paragraph">南听见女儿一下又一下地撞击着那取悦她的源头以后发出来的水声，她臀瓣的那两片软肉在激烈地弹动。</p><p class="story-paragraph">纱夏大概是要高潮了，尾音的调子又媚又娇，腰使了力气，刻意地套弄起身下的那根东西。</p><p class="story-paragraph">是谁？</p><p class="story-paragraph">哪怕她清楚女儿如今是远在大洋的彼岸，有种很幼稚却又可笑的嫉妒仍叫她几欲从里到外全盘碎裂。</p><p class="story-paragraph">南快要发狂了，她的心里像是燃起了一团火。</p><p class="story-paragraph">她很少如此失态，甚至要咬着后槽牙克制着情绪，脖子上的筋都隐隐约约地现了痕迹。</p><p class="story-paragraph">南拼尽力气去碰她，可还没触到纱夏的肩膀，那只手又停在空气中，再前进不得半分。</p><p class="story-paragraph">她越过女儿起起伏伏的身形，终于看清了纱夏是跨坐在谁的身上。</p><p class="story-paragraph dialogue">“妈妈…”</p><p class="story-paragraph">那张脸明明是她的，却陌生得让人心生胆寒。</p><p class="story-paragraph">南的眼睛眨都没眨一下。</p><p class="story-paragraph">是她在用手指奸淫她的女儿。</p><p class="story-paragraph">而纱夏也很乖很听话地将它们都吞了下去。</p><p class="story-paragraph">南眼睁睁地瞧着并起的手指消失在女儿张开的腿心中，没过一会就被湿漉漉地吐出来。</p><p class="story-paragraph">她知道它们去了哪里。</p><p class="story-paragraph">南有种错觉，好像手指正被温暖的肉壁紧紧地吮吸着。</p><p class="story-paragraph">纱夏的内里又软又热，娇秘的地方嫩得让人心生爱怜，小小的花穴需要被她喂饱以后才能不饿。</p><p class="story-paragraph">南在靠着深呼吸缓和过快的心跳，她要强行清醒过来，又根本无法抵抗女儿的诱惑。</p><p class="story-paragraph">少女喘出来的叫声就像插入的动作一样激烈，她似乎已经是欲仙欲死般地沉浸在背德的快乐里，完全忽视了她的存在。</p><p class="story-paragraph">南只好本能地往后退，却在这时直直地对上了女儿身下之人的眼睛。</p><p class="story-paragraph">以第三者的姿态偷窥的秘密被发现了。</p><p class="story-paragraph">她努力地摇头，可纱夏还在刺激她的耳膜和视觉，如此拖泥带水的否认没有任何说服力。恐怕她的灵魂早早地便自知埋藏在她心底的愿望是有多卑劣，蹩脚的谎言一下就被拆穿。</p><p class="story-paragraph">对方挑衅地回望她。</p><p class="story-paragraph">南明白那是自己胜券在握时才会露出来的表情，她没反应过来，只感觉腰上莫名又突兀地加了些重量。</p><p class="story-paragraph">不知在何时调换了位置，南躺在床上，她也因此看见了纱夏的脸。</p><p class="story-paragraph">女儿微微张着娇艳欲滴的红唇，横生的情欲将她锋利的眼神搅荡成几圈零零落落的水波，原本轮廓分明的面庞也在粉红的氤氲之下变得又媚又柔。</p><p class="story-paragraph">手指这下得到了梦寐已久的触觉，南的理智也在溃散的边缘。</p><p class="story-paragraph">不能再这样…</p><p class="story-paragraph">她想自证，证明她并不像自己所说的那样下流，南靠着抽离手腕来中止一场快要分出胜负的战事，却被女儿发现了。</p><p class="story-paragraph">纱夏不想她走。</p><p class="story-paragraph">积蓄的快感亟待爆发的机会，小孩在关键时刻被打断，看样子很不好受。</p><p class="story-paragraph dialogue">“妈妈…”女儿不满地抬高了腰，将她扣住，前前后后晃着屁股去对准她刚刚拔出去的手指：“进来…”</p><p class="story-paragraph">南想退离的意志也不坚定，才再次陷入了那样湿热的一片地方。</p><p class="story-paragraph">纱夏跟着发出一声满足的吸气声，她的脖子往后仰，鼻尖上滚过汗珠，乌黑的发丝也在身体剧烈的跃动之下轻摆。</p><p class="story-paragraph">女儿很美，南望着她失神。</p><p class="story-paragraph">纱夏双颊晕红，桃花眼有些懒散地眯着，尾稍那端轻轻地挑起，</p><p class="story-paragraph dialogue">“讨厌…”女儿带着小情人才有的嗔意对她撒娇，可估计是被刮蹭到里面哪个不能碰的地方，突然咬紧了她，后半句话被音调转高的呻吟截住。</p><p class="story-paragraph">立在一切对错之外，被这纷纷扰扰的世俗排挤开来。</p><p class="story-paragraph">南看到她迷迷蒙蒙地在唇角边噙起一个甜蜜的笑。</p><p class="story-paragraph">女儿真的也因这件事而感到幸福。</p><p class="story-paragraph">南突然像是着了魔，心一下变得柔软万分。</p><p class="story-paragraph">她正视着纱夏那双饱含爱意的眸子，终于忍不住支起身，勾住女儿的脖子，顺势啄了啄她的嘴唇。</p><p class="story-paragraph">纱夏好像也很期待她的靠近，她不太能继续撑下去了，结合处传来的快感一直在胁迫她，威逼利诱地骗她束手就擒。</p><p class="story-paragraph">南用指尖沿着纱夏小腹绷着的肌肉线条游移，引得女儿像是被她欺负了一样地扁起了嘴。</p><p class="story-paragraph">她还没停，依然往下摸，南拨开被花汁濡湿的耻毛，毫不留情地揪住好色的蜜豆，它颤巍巍地在她指尖的碾磨之下发抖，还在更骄傲地挺起身子宣示自己的存在。</p><p class="story-paragraph dialogue">“不要…”纱夏受不了这样暴戾的对待，她低垂着眼睛，可怜兮兮地求饶：“不要捏…”</p><p class="story-paragraph">南并未采纳这样的请求，她施了点轻巧的力气，叫女儿又舒服又难受地拼命摇头。</p><p class="story-paragraph">纱夏坐直了身躲，没想到这一挣扎反倒是让南进得更深。</p><p class="story-paragraph">女儿的腰已经彻底软掉了，她将所有重量都压在她身上，倒也省了南一次又一次要将她捞回来的事。</p><p class="story-paragraph dialogue">“纱夏这么急？”南调侃她。</p><p class="story-paragraph dialogue">“呜…会坏的…”女儿下意识地来挠她的背，好在南穿了衣服，始作俑者的指甲也是修剪得干干净净的，才没觉得痛：“妈妈…被弄坏了…”</p><p class="story-paragraph dialogue">“不会坏的，”南低声哄她，她亲亲纱夏的下巴，攻势一下变得凶猛：“别怕…”</p><p class="story-paragraph">纱夏遭到两面夹击，紧紧地抱着她，惊叫着，双腿打着颤，合都合不拢了。</p><p class="story-paragraph dialogue">“妈妈…”她呜咽起来，好像希望南能放过自己：“妈妈…啊啊…”</p><p class="story-paragraph">纱夏可能的确是坏掉了，她下面像潮吹一样流着水，喷了她一手。</p><p class="story-paragraph">她这个样子总让南觉得自己占有了她的全部。</p><p class="story-paragraph">南真的已经爱她的女儿爱到无法自拔，她甚至一时间也分不清自己究竟是在哭还是笑。</p><p class="story-paragraph">女儿攀着她的肩膀，靠在她身上喘气。</p><p class="story-paragraph">南知道她们的体温缓慢却又真实地融为一体。</p><p class="story-paragraph">可是女儿偏过头来了。</p><p class="story-paragraph">纱夏也许是被泪水的温度烫伤，她在沉默中一点点吻去了她脸颊上那些不清不楚的水痕。</p><p class="story-paragraph">最终她们鼻尖相抵，女儿在安全距离内停住。</p><p class="story-paragraph">南没有避开纱夏，她主动凑上前去亲亲她的嘴，确认女儿不反抗才加深这个吻。</p><p class="story-paragraph">纱夏很安静地回应她。南搂住女儿的腰，心脏沉沉地往下陷。</p><p class="story-paragraph">某些惶惶然的情愫总在这个时候升起，如影随形地跟着她，她怎么逃也逃不脱。</p><p class="story-paragraph">南察觉到了微妙的违和感，同样也意识到有哪里不对。</p><p class="story-paragraph">腰间的那只手明明是纱夏的。</p><p class="story-paragraph">女儿为什么在发抖…</p><p class="story-paragraph">她为什么这么不安又胆怯呢？</p><p class="story-paragraph">南睁开了眼睛，一瞬间便慌了神。</p><p class="story-paragraph">她急急忙忙地拉开两人的距离，定睛细细看她，不可置信地发现怀里的纱夏竟是小时候的模样，眉眼间的稚气未脱。</p><p class="story-paragraph">南僵硬地维持着这个姿势。</p><p class="story-paragraph">她的心脏好像被扎出了一个孔，这疼痛叫南连气都换不上来。</p><p class="story-paragraph">她到底都做了什么…</p><p class="story-paragraph">她到底…</p><p class="story-paragraph">南很害怕。</p><p class="story-paragraph">她紧紧地将纱夏揽着，想暂时忘记她们后来发生的故事。</p><p class="story-paragraph">南吻吻她的头发，她真的在模仿以前的自己，她在和女儿说晚安，尽量让那语气显得毫无异常。</p><p class="story-paragraph">可她与纱夏亲密无间的迤逦的画面又一直反复地在眼前闪回。</p><p class="story-paragraph">她简直是这个世界上最无耻的妈妈。</p><p class="story-paragraph">南尝到了自己眼泪的味道，她嘴唇哆哆嗦嗦地发颤。</p><p class="story-paragraph">她不愿意要那无耻的念想彻彻底底地渗透进她们共同度过的那些年年岁岁，不想让自己肮脏的梦境玷污了那个小小的人儿。</p><p class="story-paragraph">可二十几岁的纱夏正在和这个天真稚嫩的孩子融为一体。</p><p class="story-paragraph">到了最后，就连南也没办法将她们彻底分开了。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">来年春天的时候，南的身体已经好了很多。彼时她已经和女儿分开一年有余，大约四五百个日夜。</p><p class="story-paragraph">就好像人类的血肉也能随着自然规律再次生出绿色的枝叶，有才新抽的小芽顺着她肢体的末梢攀爬。</p><p class="story-paragraph">南不知道是什么促使着她硬撑下去的，其实每挺过来一轮，她都担心下一轮要坚持不住了。</p><p class="story-paragraph">她干脆一次又一次地捱。</p><p class="story-paragraph">有的时候想着纱夏，有的时候想着早早离开她的父母，有的时候又痛得脑子一片空白，什么人都抓不到。</p><p class="story-paragraph">可没想到这痛苦还真就被她捱到了头。</p><p class="story-paragraph">她开始用空闲的时间读书了，不过戒毒所的情况和她当时在医院遇到的一样，能借到的全是畅销榜单上有名的那么几本，大众文学的质量参差不齐，当然里面还有被她大学教授大肆吹捧过的“厚黑学”和“货币经济学”的科普文丛，恐怕是为那些想要改过自新的吸毒者准备的。</p><p class="story-paragraph">南对这些东西兴味缺缺。</p><p class="story-paragraph">哪天渡边护士像读了她的心一样，突然给她带来了个白色的 kindle，只需要一只手就捧得下的那种尺寸，说是儿子当时跟风买来的，但放回家里又根本没用过，想着要物尽其责她就问他要了，由不得南拒绝。</p><p class="story-paragraph">她算得上是优等生，做什么都上手很快，哪怕之前没接触过这东西，南捣鼓了两下就知道怎么用亚马逊账号了，下载电子书这种小事也是信手拈来的轻松。</p><p class="story-paragraph">南不想做女儿眼里的老古板，也暗暗下定了决心，等她休息好了，一定也要学学年轻人的风潮。</p><p class="story-paragraph">后面她犯瘾时慢慢地没那么痛了，却也并没有像自己所想象的那样，刚满一年过了七月就迫不及待地收拾行李离开。</p><p class="story-paragraph">于是她靠着能打发时间的耐心，又在这里呆上一会儿。</p><p class="story-paragraph">说得更直白和伤人些，其实南是没有马上回家的借口。</p><p class="story-paragraph">在戒毒所里还更热闹些。</p><p class="story-paragraph">纱夏将她的意思表达得很清楚了，她在拿到学位证书以前都不会再回日本。</p><p class="story-paragraph">女儿是要给她省钱，她强调来回的机票都不便宜，跟着导师发表论文还要耗资金，能节约一点是一点。</p><p class="story-paragraph">渡边护士在给她念这段话的时候，南想起当时她激纱夏用的那套说辞。</p><p class="story-paragraph">纱夏哪里可能会性情大变呢？</p><p class="story-paragraph">她再了解不过她的女儿，从小到大都不铺张浪费的女儿，小时候给她的钱她永远也花不完，最大的开销全都是用来给她买礼物的。</p><p class="story-paragraph">能解释此情此景的理由只有一个。南知道她伤害了纱夏，女儿是那样小心翼翼地把真心捧给她看，她还是亲手将它摔碎了。</p><p class="story-paragraph">南做梦的次数越来越多，她其实不是一个常做梦的人，睡眠质量本身就不好，在梦到女儿之后便更容易醒得早。</p><p class="story-paragraph">她没陪女儿去美国，靠着纱夏发回来的照片也拼接不出特别真实的影像。</p><p class="story-paragraph">南有时会在梦里看见女儿一个人孤孤单单的样子，那些梦都发生在她们新宿的那个家里。</p><p class="story-paragraph">她尝试着去抱纱夏，她很想和女儿说她从来都不是真心要走，她比任何人都想要陪她，可每次她都会在碰到女儿之前醒来。</p><p class="story-paragraph">南不知怎么证明她对纱夏的爱，她曾经有过期待：说不定女儿会提前回来、来戒毒所接她回家，所以她就一直将纱夏送她的项链好好地戴在身上。</p><p class="story-paragraph">有一回南好不容易摘了它，却发现有小一段链条的颜色变暗了。</p><p class="story-paragraph">她想也许是她痛起来的时候出了太多汗，不小心弄脏它了。</p><p class="story-paragraph">南有点紧张，借来了酒精棉片，细心地擦了几下，让它恢复原有的亮泽以后才放下心来。</p><p class="story-paragraph">随着时间推移过去，南确认自己的身体再没有出现戒断反应了。</p><p class="story-paragraph">渡边护士恭喜了她，看出她打算走了，跟她说如果有机会再来这里玩可以去她家住，毕竟山梨县的白桃酒很有名，值得人特意尝一次。</p><p class="story-paragraph">尽管南觉得可能性不大，却还是应了下来。</p><p class="story-paragraph">她表现好，在出院手续落实之前提早拿到了被“暂时”看管的手机。</p><p class="story-paragraph">太久没开过机的缘故，和亮起的屏幕同时弹出来的提示要南重新调整日期。</p><p class="story-paragraph">好在这么些天她都是数着日子过的，也根本没有忘记这些。</p><p class="story-paragraph">花了一些时间，也许是接到了通讯商的信号，一年半之内收到的所有短信同时涌进来，她的手机震个没完，各种应用的推送毫不吝啬地跳个不停。</p><p class="story-paragraph">南急忙开了静音，大概花了五分钟左右那阵余波才逐渐平息下去。</p><p class="story-paragraph">有以前客户发来的拜年短信，还有按季度划走她信用卡费用交钱的账单，手机话费也包括在里面，除此之外，充斥着她信箱的东西大多也都是垃圾广告和彩票中奖的虚假信息。</p><p class="story-paragraph">没什么情真意切的祝福。</p><p class="story-paragraph">南早有准备，看到这幅萧瑟之境她也不失落，反正除了纱夏，她在东京本来就是孤独一人。</p><p class="story-paragraph">她翻开未接来电的列表，入目都是红通通的数字组合，最近的一通电话也停在两个月以前，她的重点不在于此，但手机能存下的实在有限，翻到底了记录也只显示到最近半年。</p><p class="story-paragraph">南不死心，直接拨了女儿日本的号码。</p><p class="story-paragraph">另一头传来了不在服务区的忙音。</p><p class="story-paragraph">她前阵子让渡边护士告诉了纱夏她就要出院了，女儿在回信时同时给了她一串陌生的数字，南想那就是她在纽约用的电话号码，她拿到手只花了一会儿就背得滚瓜烂熟。</p><p class="story-paragraph">南这一着急，都没提前发条短信问女儿方不方便，她做好了这通电话石沉大海的心理准备。</p><p class="story-paragraph">可当关机的应答声响起来的时候，她还是险些连手机都拿不稳。</p><p class="story-paragraph">南希望这一通没接起来的电话提示永远不会让女儿知道。</p><p class="story-paragraph">她在脑海里搜索着女儿的邮箱地址。</p><p class="story-paragraph">怎么犯了这样的低级错误呢？</p><p class="story-paragraph">纱夏应该睡下了，而头顶的这片天空不过刚刚经历了午后。</p><p class="story-paragraph">她甚至忘了十几个小时的时差。</p><p class="story-paragraph">南回了东京。</p><p class="story-paragraph">这个季节的雨水尤为多，不是好应付的和风细雨，而是动不动就能泼湿全身的倾盆暴雨。</p><p class="story-paragraph">南不意外，她走进了离家最近的 711 便利店，却没有买伞，只是用健康证上登记的年龄和身上的零钱换来了一包烟。</p><p class="story-paragraph">家里连打火机都没有，她可能要用灶台点燃烟草。</p><p class="story-paragraph">南拖着箱子，轮子划过去的噪音被淅淅沥沥的雨声盖过，水滴已经将她的头发打湿成一缕一缕的，漆黑的几撮贴在额头上。</p><p class="story-paragraph">她拿出来的门禁卡已经消了磁，怎么刷也刷不开大锁，报警声引来了门卫，保安已经换了一拨，那高个子男人看她的眼神有些狐疑，若不是听到她准确地报出门牌号，也担心她感冒，肯定还要好生刁难她一番。</p><p class="story-paragraph">南在楼道的拐角将电闸拉开，上面积了一层灰，弄脏了她的手指。</p><p class="story-paragraph">她想这里真的已经很久没有人住过了。</p><p class="story-paragraph">南甚至开始担心她会不会也打不开家门，她仔仔细细地检查那把银色的钥匙，确认没有拿错才插进去。</p><p class="story-paragraph">锁舌发出了嘎吱的响声，好像不堪重负似的。南用了点力气，好不容易拧开了最后的那道栓。</p><p class="story-paragraph">她想也许改天需要找人上门换一把锁，或者用什么东西润滑一下有些年久失修的芯条。</p><p class="story-paragraph">没有哪个人跑出来应她，也没有谁对她说欢迎回家。</p><p class="story-paragraph">南顺手把门关上，刚走了几步就被扬起的灰尘呛到咳嗽。</p><p class="story-paragraph">那盆摆在窗台上的虹之玉已经枯死了。</p><p class="story-paragraph">清扫的工作太费体力，南只收拾了客厅，纱夏的房间一地的灰也没来得及弄干净。</p><p class="story-paragraph">南简单地换了被单，进入梦乡的时候已经没有多余的力气了。</p><p class="story-paragraph">她和一群看不见的微生物相安无事地睡在一起。</p><p class="story-paragraph">南躺在女儿的床上，她在这张床上做了一个梦。</p><p class="story-paragraph">纱夏还在家里，她就坐在沙发上等她。</p><p class="story-paragraph">南知道这是假的，现实是因为女儿根本没有在那个夏天等到她。</p><p class="story-paragraph">南只希望自己不要再提前醒过来了。</p><p class="story-paragraph">她做了这么多次这个梦才如愿以偿。</p><p class="story-paragraph">南小心地将女儿抱在怀里，和她说她终于回家了。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">这个夏天很热，东京以往都没这么闷的。</p><p class="story-paragraph">也许是遇到了什么诡异的季风。</p><p class="story-paragraph">南希望隔几天可以迎来一场浇灭窒息热潮的阵雨。</p><p class="story-paragraph">她怀疑空调的显示屏是不是出问题了。</p><p class="story-paragraph">明明将那个数字降到了二十三，南还是在流汗。</p><p class="story-paragraph">她用鞋跟踩着地板，转轮的办公椅听话地往后退。</p><p class="story-paragraph">南去摸窗户，刚刚碰到玻璃就立刻缩了回去，室外的温度几乎可以烫着她的指尖。</p><p class="story-paragraph">应该好好珍惜还有冷气的时光。</p><p class="story-paragraph">她不相信太阳下山了以后还会有那么强的威力，打算晚点再出去。南估摸着那时再走过没有空调覆盖着的区域也能稍微好受一点。</p><p class="story-paragraph">她熟悉从办公室到停车场的路线，因为她回到了自己供职接近十五年的事务所。</p><p class="story-paragraph">南干起了老本行，不过她现在接的官司都很小，无论是金额还是案子的严重程度再不比以前。</p><p class="story-paragraph">这是南阻止自己继续为板仓添麻烦的下下策。</p><p class="story-paragraph">她离开司法界以后造成的一切空白一时半会都填不上了，当初好不容易爬上去的位置也拱手让了人。</p><p class="story-paragraph">可南不介意，她知道老板对她已经算得上是仁至义尽。</p><p class="story-paragraph">尽管是这样，还是有不少碎嘴的人说她的闲话。</p><p class="story-paragraph">事务所进来了很多新面孔，有不认识她的自然会将舆论带向不好的地方。</p><p class="story-paragraph">但前后辈互相尊敬的规则在职业圈子里都适用，更何况南曾经接手过的案子也多，资料全都好好地记着，有心人只需要动动手指就能查到她原来厉害到什么程度，所以那些潜规则的八卦没激起多大水花，话题没过多久也都销声匿迹了。</p><p class="story-paragraph">其实如此两面三刀的言论也根本伤害不到如今的南，她只是担心会给板仓招坏名声。</p><p class="story-paragraph">最开始她联系老板也只是出于礼貌地要说一声自己痊愈了，如果方便的话再请他吃个饭，至少也是为了感谢他那些天伸出的援手，可没想到对方接到消息就火急火燎地跑到家里来看她，还带上了亲属。</p><p class="story-paragraph">南过着足不出户的生活有段时间，她手忙脚乱地化了个简单的妆，才换好正式点的衣服，一家三口就按响了门铃。</p><p class="story-paragraph">板仓的儿子长得与他一般高，也听话，见面规规矩矩地和她打了个招呼说了阿姨好，他太太的样子也没多大变化，倒是板仓本人，脸上添了点皱纹，白头发可能也多了些。</p><p class="story-paragraph">南本来只是想问问板仓有没有熟悉的人介绍，她可以不当律师，做个负责幕后的法律顾问也行。</p><p class="story-paragraph">可对方的家人来了，只聊工作上的事未免太不礼貌，南打算晚点再和板仓商量，不过这男人显然是没安好心，南顾忌着他太太和孩子都在场才特意不提公事，可板仓反而借了妻儿的面子，半句话不离希望她重回事务所的邀请。</p><p class="story-paragraph">南有点骑虎难下了，她假借着思考的借口权衡了利弊以后还是接受了。</p><p class="story-paragraph">至少她有工作了就可以养活自己，不会给女儿弄出什么乱子来。</p><p class="story-paragraph">南重新捡起来这工作，她要学的东西也有很多。</p><p class="story-paragraph">东京都厅的法务查询网站弄了套新系统，她适应了一个星期才习惯。</p><p class="story-paragraph">有些要更新资料的证件，光是不同尺寸的照片她都拍了好几版，整理好了放在家里以备不时之需。她去大西町的日本银行办了一堆乱七八糟的手续，顺便用电话号码和纱夏以前转账时留下的信息查到了她在美国的卡号，汇了点钱过去。</p><p class="story-paragraph">南怕弄错，刻意多确认了几遍开户人的姓氏是不是凑崎。</p><p class="story-paragraph">毕竟这个姓在日本也少见，她想应该不会有第二个凑崎纱夏在纽约读书了。</p><p class="story-paragraph">她发了封邮件告诉女儿，同时也不明白自己为什么不直接用更直白的方式联络纱夏。</p><p class="story-paragraph">那个没拨通的电话再也没打出去，和她的真心话一起埋在了被手机系统自动清除掉的记录里。</p><p class="story-paragraph">南将希望寄托在了女儿身上，可纱夏这回依然乖乖地听了话，顺着她的意思，将心照不宣的胆怯换成了两人间不用明说也能会意的默契。</p><p class="story-paragraph">邮件女儿按部就班地回复了。</p><p class="story-paragraph">纱夏说收到了钱，但她的财力还有余，不用她再破费，而且回程的机票已经买了，时间定在八月中旬，但她抵达的目的地不是位于东京的成田机场，而是本州岛最西边的大阪。</p><p class="story-paragraph">这也是为何南在没有高额的跨洋电话费作借口时依然逃避联系她。</p><p class="story-paragraph">事实上她也有好几次要打电话给纱夏，却在拨出去的前一刻将那串熟悉的数字一点点清空了。</p><p class="story-paragraph">女儿重回故地的理由让南放弃了找她。</p><p class="story-paragraph">纱夏说她想一个人去看看爸爸妈妈，她说她来了东京以后就把他们忘在那边了。</p><p class="story-paragraph">这小丫头第一次这么不懂事，连什么时候回家都没告诉她。</p><p class="story-paragraph">南只好等。</p><p class="story-paragraph">她不是真的觉得热到忍无可忍了，紧张才是真正的罪魁祸首。</p><p class="story-paragraph">原来的客户都不怎么待见她了，南没接到过大案子，也没有加班的理由了。</p><p class="story-paragraph">她刻意拖着下班时间不走，也只是担心女儿找不到她而已。</p><p class="story-paragraph">南真的换了把门锁，她还没来得及给纱夏钥匙。</p><p class="story-paragraph">她想女儿一定会来的。</p><p class="story-paragraph">今天已经是她踏上日本国土的第五天了。</p><p class="story-paragraph">就算她今天没回来，还有第六天，第七天或者是第八天。</p><p class="story-paragraph">门在五点的时候被敲开了，南还期待了一下。进来的人是奈未。</p><p class="story-paragraph">这位助理还是毫不犹豫就在南复职的时候选择为她做事。</p><p class="story-paragraph">她沏了杯苦荞茶，左手拿了个档案袋。</p><p class="story-paragraph">南朝她点头，她熟悉工作伙伴露出的真诚笑容。</p><p class="story-paragraph">奈未将纸杯推给她，密封的棕色信封也交了过来，南瞥了一眼，猜到是前几天被起诉侵害他人名誉权的客户按约定寄给她的。</p><p class="story-paragraph">她用银柄的拆信刀割开了对方拿火漆封上的口，不由得感叹这个留着小胡子的男人很有一套英国维多利亚时期的行事风格。</p><p class="story-paragraph">奈未还想解释两句，可敲门声打断了她的话。</p><p class="story-paragraph">助理露出个稍带歉意的表情，她退出去的时候顺手关上了最里间这扇装了毛玻璃的小门。</p><p class="story-paragraph">南有事做了，她翻开文件，发现里面放了一沓厚纸，最顶上的两页是她客户的自白书。</p><p class="story-paragraph">她稍微读了两句，就感觉有一股浓厚的西洋翻译腔扑面而来，定睛再看看，居然还有能被轻松挑出来的语法错误。</p><p class="story-paragraph">反正是复印件，南直接用铅笔在上面做了记号。</p><p class="story-paragraph">她听见外头有声音响，不过手头的案子吸引了她的注意力。</p><p class="story-paragraph">如果有人来找聊官司，那奈未会在会客室和他谈谈预约的事项。</p><p class="story-paragraph">南是在她听到了几声模模糊糊的笑以后才觉得不对的。</p><p class="story-paragraph">她皱了眉头，放下笔的时候将那声音捉得更清楚。</p><p class="story-paragraph">南看着门把手被压下去。</p><p class="story-paragraph">她总感觉有两个人影交叠在一起，却一下分不清这是不是幻觉。</p><p class="story-paragraph">南害怕这是假的。</p><p class="story-paragraph">这两年来她心心念念地想着女儿，却只有在吸毒和做梦的时候才能见上她一眼。</p><p class="story-paragraph">她有的时候连纱夏的声音都记不清了。</p><p class="story-paragraph">南心里好像有什么东西跳得越来越快，要和那个呼之欲出的答案一样破壳而出了。</p><p class="story-paragraph dialogue">“名井律师，”奈未的声音在她还没露脸的时候就透过越开越大的门缝传了进来：“您看看是谁…”南盼着见到她，却不知出于什么心态将头低了下去。</p><p class="story-paragraph">她想躲起来，藏在桌子底下或者直接消失空气里。</p><p class="story-paragraph">南清晰地听到那人的呼吸声。</p><p class="story-paragraph">纱夏在说话，也许她是在叫奈未出去，南听不清，但她的助理确实离开了，南听到门被关上的声音。</p><p class="story-paragraph">她觉得纱夏说话也有一股从美洲那边带来的奇怪口音，听起来就像她刚刚读的那封自白信上写的东西一样别扭。</p><p class="story-paragraph">真的是纱夏来看她了吗？</p><p class="story-paragraph">南抬起头，她想问问纱夏一个人在美国过得好不好，有没有被人欺负，却什么都没说出来。</p><p class="story-paragraph">她也不知道这次她伸出手去，纱夏会不会还是化成烟一样的灰烬消失在她面前。</p><p class="story-paragraph">女儿的开场白没有任何累赘。</p><p class="story-paragraph">那些失而复得的情绪一路杀到她的咽喉，震得她下巴发麻。</p><p class="story-paragraph">南很久没有听到这个称呼了，她差点没反应过来这声“妈妈”是在叫她。</p><p class="story-paragraph">事实上南在三十分钟以前还做过最坏的预想。</p><p class="story-paragraph">她以为纱夏也要像她的父母一样…</p><p class="story-paragraph">再也不回来了。</p><p class="story-paragraph">南在一片泪眼朦胧里根本看不清女儿到底是胖了还是瘦了。</p><p class="story-paragraph">她只是知道有个人站在门口。</p><p class="story-paragraph">而上天也终于奖赏了她一次，让她与告别过的人重逢了。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">南上车的时候还没彻底调整好情绪，但她心里依然留了作为长辈要有的尊严。</p><p class="story-paragraph">纱夏带来的一大袋子东西搁在副驾驶座位上，她绕到后面去放行李了。</p><p class="story-paragraph">南在车里听到女儿关上后备箱的声音，伸手将快要掉出来的眼泪擦得没了痕迹。</p><p class="story-paragraph">和她离得这么近，南才彻彻底底地看清她。</p><p class="story-paragraph">女儿几乎从不在发回来的照片里出镜，所以南就以为纱夏还和刚刚走的时候一样青涩。她幻想过女儿给她写邮件的样子，总把十几岁那个小孩一板一眼坐在桌子前认真读书的形象移植过去，可当纱夏真正回来的时候，她觉得她想象中的女儿和现实中的这个又被彻底地割裂开了。</p><p class="story-paragraph">纱夏的妆化得很熟练，彩色的眼影也一样驾驭得很好，扑在鼻翼上的闪粉是点睛之笔，她几乎将五官那点侵略性的优势完完全全地现了出来。</p><p class="story-paragraph">女儿打了耳洞，靠近下颌线的位置悬了一轮漂亮的月环。</p><p class="story-paragraph">纱夏侧脸对着她，南很好奇女儿的另一只耳朵底下会不会也垂着一个同样造型的坠饰，但她的目光无暇去追逐未知的领域。</p><p class="story-paragraph">女儿穿着露肩的短裙，肩颈的弧线一览无余，也还是很白，肌肤像琼玉一样细嫩，可头发不再是纯黑的了，换成了另一种颜色，浅栗的发丝刚好盖在她肩胛骨终止的细微凸起之上。</p><p class="story-paragraph">她皮肤上的甜香变得烈了。</p><p class="story-paragraph">南觉得纱夏用了香水，一定是喷在后颈的那部分正被主人的体温引诱着往外飘散。</p><p class="story-paragraph">她有些心猿意马，却不得不承认纱夏现在在她眼里真是辛辣又迷人的玫瑰，就连她拿在手上也会被软刺扎出血珠。</p><p class="story-paragraph">如此念头让南有点恍措。</p><p class="story-paragraph">她直白的目光也许太招摇了，上了车以后也一直沉默，等她回过神来的时候才发现纱夏已经偏了头，目光也不闪躲。</p><p class="story-paragraph">原来是星星…</p><p class="story-paragraph">女儿左耳底下挂着的吊坠荡来荡去，像猫爪子一样在南心上挠了两下。</p><p class="story-paragraph">她很少夸奖别人，可纱夏真的出落得美丽妩媚。</p><p class="story-paragraph">这迹象叫南暗叹不已，她拿到手的这宝物好像永远都在成长。</p><p class="story-paragraph">南不知女儿还能耀眼到何种程度，她想见过纱夏这样子的人都不可能不为她心动。</p><p class="story-paragraph">当事人先说话了。</p><p class="story-paragraph dialogue">“我来开？”</p><p class="story-paragraph">南看着她的唇瓣一开一合，心跳得很快，她不由自主地想着纱夏用这张嘴和她说过的情话，在高潮的时候咬着她耳朵喘出来又甜又腻的呼吸。</p><p class="story-paragraph">南突然有点想念那个纱夏，尽管她知道她们是同一个人。</p><p class="story-paragraph">她这会发觉自己已经看不透她了，纱夏的眼里浮着一层很陌生的笑意，脸上也并没有任何能表明心情的讯息。南甚至不知道女儿对她们的再见持什么态度。</p><p class="story-paragraph">她紧了紧方向盘，用行动和她表明不必麻烦。</p><p class="story-paragraph">车里有些莫名又尴尬的安静。</p><p class="story-paragraph">女儿低垂着脑袋看手机，南也不知道和她聊些什么。</p><p class="story-paragraph">她努力地搜索着可能存在于她们两人之间的共同话题。</p><p class="story-paragraph">南将纱夏发来的邮件都记得牢牢的。</p><p class="story-paragraph">要说出某件具体的事在何时发生，恐怕她比女儿弄得更清楚。</p><p class="story-paragraph dialogue">“大阪那边…”她决定从最近的事问起：“怎么样？”</p><p class="story-paragraph">这时车子已经开上了市内的高速环线，南打开了转向灯，她的左手边应该是国立图书馆，不过被围墙挡住了。</p><p class="story-paragraph">纱夏没有犹豫就给出了回答。</p><p class="story-paragraph">她轻轻应了一声，意思大概是还不错。</p><p class="story-paragraph">南等着她讲一些所见所闻，可女儿没有接着补充，这个话题也就戛然而止了。</p><p class="story-paragraph">她们两很少为彼此创造出令人不快的沉默，当下显然是个例外。</p><p class="story-paragraph">纱夏好像也察觉到她是在没话找话，于是伸手将车里的音响打开了。</p><p class="story-paragraph">女儿做了指甲，也许这可以证明纱夏没有女朋友…</p><p class="story-paragraph">她脸上一热，赶紧断了这种奇奇怪怪的联想。</p><p class="story-paragraph">南不知道怎么说服自己纱夏是单身，她自我安慰着，至少女儿在发回来的邮件里从来没有提过这方面，可她又老是去胡思乱想。</p><p class="story-paragraph">就算没有女朋友，说不定也有男朋友。</p><p class="story-paragraph">女儿会不会也打扮成这样和恋人约会呢？</p><p class="story-paragraph">和同龄人恋爱只怕舒心得多，在纽约与谁坠入爱河也比在东京浪漫些。</p><p class="story-paragraph">南因为出差去过美国，她觉得中央公园的麻雀可比横滨出现的鸽子更适合出现在文艺片里。</p><p class="story-paragraph">其他母亲在看到女儿的时候也会想这样的事吗？</p><p class="story-paragraph">南不置可否。收音机在放李斯特改编的贝多芬，她也不知道原曲是什么，只不过这么几天电台都在放，报幕员一直在强调，所以南也记住了。</p><p class="story-paragraph">回来了就好…</p><p class="story-paragraph">南逼迫自己转移注意力，又重复了一遍。</p><p class="story-paragraph">回来了就好。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">到家的时候额外早，纱夏将那个放在脚边的纸袋子提着，不要她拿。</p><p class="story-paragraph">行李箱也是女儿一个人拖着，南想帮忙都被拒绝了。</p><p class="story-paragraph">好在地下停车场的电梯直通家门，用不了走多远。</p><p class="story-paragraph">纱夏也穿了带跟的凉鞋，比她稍微高一点，南听到她放在挎肩小包里的手机一直在响，问纱夏要不要紧，女儿摇摇头，对她笑了一下。</p><p class="story-paragraph dialogue">“先回家。”</p><p class="story-paragraph">正是这个笑让南再无暇去关心其他的，她两只手都有空，按下了电梯里的楼层按钮。</p><p class="story-paragraph">小孩还是恋旧的。</p><p class="story-paragraph">纱夏见到门牌时放慢了脚步，行李箱的轮子跟着划出了节奏一致的声音。</p><p class="story-paragraph">南将钥匙递给女儿，对方立刻会意，松了只手去接。</p><p class="story-paragraph">她顺势将行李箱牵了过来。</p><p class="story-paragraph">南在这时发现了很奇怪的事情，趁着她愣住的一会，女儿已经开了门。</p><p class="story-paragraph">纱夏没有马上进去，在玄关停留了一会，南还沉浸在困惑之中，忘记和她说“欢迎回来”了。</p><p class="story-paragraph">不过她没有来得及在意这些，女儿还了钥匙给她开始低头换拖鞋，南怕她看不到，给纱夏指了指那双新买的。</p><p class="story-paragraph">旧的发了霉，早在她半年回来以前丢掉了。</p><p class="story-paragraph">纱夏带回来的纸袋里装的东西是简单的食材，她正亲力亲为地打开冰箱往里面塞。</p><p class="story-paragraph dialogue">“我把箱子放到你房间里去。”南对着她的背影说话，纱夏没回头，不过肯定听到了。</p><p class="story-paragraph">南急着验证自己的想法。二十二寸的拉杆箱，她只用单手也能轻易地让它悬空。</p><p class="story-paragraph">南将箱子拖到女儿的房间：没有密码锁。</p><p class="story-paragraph">她知道怎么整理乱七八糟的东西，将事物归档是她最拿手的技能。</p><p class="story-paragraph">可如果…</p><p class="story-paragraph">她拿到的是一个空箱子呢？</p><p class="story-paragraph">南还没来得及琢磨这是什么意思，就听到女儿的脚步声。</p><p class="story-paragraph">再将它及时回归原貌是不可能了，南只希望纱夏不要因为她擅自翻她行李而生气。</p><p class="story-paragraph dialogue">“东西我放在冰箱里了，”女儿跨过被剖腹的箱子，直径走到了衣柜前：“买了几盒鱼油，你记得吃。”</p><p class="story-paragraph dialogue">“好…”南见纱夏拉开门，不明白她要做什么。</p><p class="story-paragraph dialogue">“你没带衣服回来吗？”她指指空无一物的箱子，语气有些心虚地弱了下去：“我可以帮你叠一下。”</p><p class="story-paragraph">纱夏摇摇头，像是弄清了什么交接的地方出现了问题。</p><p class="story-paragraph dialogue">“我发的邮件，”她转过来问她：“妈妈没收到吗？”</p><p class="story-paragraph dialogue">“什么时候…”</p><p class="story-paragraph">南问她，下意识地去摸口袋。</p><p class="story-paragraph dialogue">“下午发的，”纱夏阻止了她掏手机的动作：“猜你可能没来得及看。”</p><p class="story-paragraph">女儿之后说的话让南头脑发空，她顿了顿，好像在分析它的真假。</p><p class="story-paragraph">她在东京都尚且只有一个去处，女儿离了这里又能去哪呢？</p><p class="story-paragraph dialogue">“什么？”南又问了一遍，她觉得自己要站不住了。</p><p class="story-paragraph">她还想给纱夏准备晚餐，一个星期以前冰箱里就只放着纱夏最喜欢吃的东西了。</p><p class="story-paragraph dialogue">“我以后住在学校那边，”纱夏不厌其烦地重复：“可能不常回来了。”</p><p class="story-paragraph dialogue">“租了房？”南想出了一个最可能的原因。</p><p class="story-paragraph dialogue">“差不多，”女儿边说边挑了几件长袖：“学校配的公寓。”</p><p class="story-paragraph dialogue">“今天就住过去吗？”</p><p class="story-paragraph">原来纱夏在见她之前就已经去了那边，可她什么都不知道。不对，不能这样说。</p><p class="story-paragraph">纱夏告诉了她，只怪她没有检查邮件而已。</p><p class="story-paragraph dialogue">“晚上有联谊会，”女儿直起身回答了她，她好像有些累，撑着腰休息了一会：“我不去不好。”</p><p class="story-paragraph">南感谢她没有说得太直白。</p><p class="story-paragraph">她敏锐地发现纱夏要搬出去住的事和她在学校读书时寄宿的性质不同，可又没彻底反应过来女儿离开家的这件事代表着什么。</p><p class="story-paragraph">南觉得有点可惜。</p><p class="story-paragraph">怕女儿不愿意和她睡，她才特地将两间房的床褥都换了一遍，每天也都会打扫卫生。</p><p class="story-paragraph">早知道这样就不特意用柔顺剂洗一遍了。</p><p class="story-paragraph">南看着条纹图案的被套，有种将它们都浪费掉的罪恶感。</p><p class="story-paragraph dialogue">“我来吧，”南想从女儿手里接过差事：“你去外面休息一下。”</p><p class="story-paragraph dialogue">“妈妈能帮我找一下驾照吗，”纱夏有别的事要求她：“还有我的保险卡。”</p><p class="story-paragraph">只要先不和纱夏共处一室就好，南正求找个借口走。</p><p class="story-paragraph">她关上女儿的房间门，退回了客厅。</p><p class="story-paragraph">纱夏的东西南整理得好好的，她轻易地就找到了她想要的那两本证件。</p><p class="story-paragraph">她想问问纱夏还记不记得那个诺言。</p><p class="story-paragraph">南将胸口戴着的项链挑了出来，让它待在显眼的地方，想了想却又将它藏进去，她重复这个动作好几次都没下定决心到底如何是好，就在她犹豫的时候，纱夏开门了。</p><p class="story-paragraph">女儿的动作比她想象中的还快，南手忙脚乱地将项链塞了回原位，好在纱夏没发现她的异常。</p><p class="story-paragraph dialogue">“谢谢，”女儿将她递过去的那几张卡纸收了起来，她还有事相求：“有些冬天的衣服装不下了，到时候能麻烦妈妈帮我送过来吗？”</p><p class="story-paragraph">她停顿了一下：“或者我再回来一趟。”</p><p class="story-paragraph">南巴不得再和纱夏见面，于是忙不迭地应下来。</p><p class="story-paragraph">她将自己的钥匙给了女儿。</p><p class="story-paragraph dialogue">“家里换了锁，你要是想来拿东西也可以自己来。”纱夏攥着那把钥匙，她牵了牵南的手，最后凑过来拥抱了她。</p><p class="story-paragraph">南希望纱夏永远都别松开她了，可到了时候，她放手的速度却比女儿更快。</p><p class="story-paragraph">女儿是真的很赶时间，她都没有来得及坐一会儿。</p><p class="story-paragraph dialogue">“我走了，”纱夏开了门，她动作利落地换了鞋：“不用送下去。”</p><p class="story-paragraph dialogue">“我听奈未阿姨说你工作也忙，”女儿还有要叮嘱她的事：“不要和以前一样不注意休息。”</p><p class="story-paragraph dialogue">“放心。”南在门被关上之前突然想起还有什么话没和女儿说，又叫了她。</p><p class="story-paragraph">她抓着门把，力道用得很大，以至于骨节都泛着苍白的颜色。</p><p class="story-paragraph dialogue">“偶尔也可以过来玩。”</p><p class="story-paragraph">纱夏转过头，楼道里映进来的夕阳扑在她脸上。</p><p class="story-paragraph">南依稀在这样的角度里看到了小时候的女儿。</p><p class="story-paragraph">她带着纱夏一起生活的往日像走马灯一样出现，画面最后停在她们第一次相遇的那一天。</p><p class="story-paragraph">她领养纱夏的那天下着很大的雨，到现在南都好像能听到雨滴敲打车窗玻璃的声音。</p><p class="story-paragraph">她也记得那个胆怯的小女孩，而她带着她一起来到了这里。</p><p class="story-paragraph">南曾无数次目送她离开家。</p><p class="story-paragraph">她就当纱夏要去学校上一堂很久很久的课，却不知道她还会不会再回来。</p><p class="story-paragraph">南差点忘了她和纱夏相差的时间不再是拨动表盘、跨过时区就能追回来的了。</p><p class="story-paragraph">女儿长大了。</p><p class="story-paragraph">而她想她的时间就和新宿的这间房子一样，永远地停在了她和纱夏分开的那个夏天。</p></div>

        <p class="chapter-subtitle">交界</p>
      </header>
      <div class="chapter-copy"><aside class="author-note"><span>Notes</span><p>(See the end of the chapter for notes.)</p></aside><p class="story-paragraph dialogue">——</p><p class="story-paragraph">刚要出教室就有人叫了她。</p><p class="story-paragraph">对方一口一个凑崎老师地喊，喊得她都有点绷不住脸。</p><p class="story-paragraph">她才脱离人生的上个阶段，不过比来上课的学生大上个五六岁而已，要建立起尊严可不容易。</p><p class="story-paragraph">幸好架在鼻梁上的眼镜帮忙遮了还没有完全消失的小孩子心性。</p><p class="story-paragraph">那个女孩没她高，见凑崎回了头反倒有些支支吾吾，无端地涨红了脸，显出些慌张。</p><p class="story-paragraph">在纽约读书的那么两年有白人朋友开过凑崎的玩笑，说她只要面无表情就像是会欺负弱小的不良，她对此观点持保留意见，却又在照镜子的时候不得不承认自己的这个样子确实有点凶。</p><p class="story-paragraph">担心冰冷的金属框架将自己与学生之间的距离拉得太远，她果断地摘了眼镜，眉毛也提前一步软化下来。</p><p class="story-paragraph">学生开场就自我介绍了一番，告诉凑崎用姓称呼她就好。香取一直不敢看她，低垂着头，但眼神好歹有了可以锁定的地方——她攥着手上的那叠纸。</p><p class="story-paragraph dialogue">“您有时间吗？”</p><p class="story-paragraph">怯生生的问话方法差不多就能看出学生的性格，让内向的孩子先打招呼很不容易。</p><p class="story-paragraph">凑崎本想先应下来，但香取太笼统的概括叫她也拿不准主意，老师的牛皮不能吹得太过，凑崎也只好先问问她。</p><p class="story-paragraph dialogue">“什么事？”</p><p class="story-paragraph">对方将东西递给她。</p><p class="story-paragraph">凑崎换了只手提包，过肩的头发有些挡视线，她转动手腕将它们拨到一边去，顺便接过学生一开始就视作宝贝的那本册子。</p><p class="story-paragraph">封面上印着鲜明的标题，她翻页的动作因此微微一顿。</p><p class="story-paragraph dialogue">“我是戏剧社的成员…”学生还在说话，但凑崎眼尖，看到空栏里只有一项没填。</p><p class="story-paragraph">她挑挑眉，已将对方的意图猜出个七八分，没急着继续纠结。</p><p class="story-paragraph">凑崎用手指夹住这本随意装订的复印纸，稍微掂量了一下剧本的厚度。</p><p class="story-paragraph">香取停下了，她的等待中有很容易就能被发现的紧张，那是自然，既然请求已经全部说完，那么便只需要静候着老师的回话，而凑崎也恰巧在这时抬起视线。</p><p class="story-paragraph">课间来来往往的人很多，走廊上也挤得水泄不通，她们堵在门口。</p><p class="story-paragraph dialogue">“阿吾！”有从教室里跑出来的学生差点撞到香取，凑崎及时伸手揽住她，将她拉到身边。</p><p class="story-paragraph">对方很轻，她不费什么力气就让学生和自己比肩站着，还听到一声调低音量的道谢。</p><p class="story-paragraph">凑崎刚想摇头说不用客气，刚出来的男生就看到了这两人。</p><p class="story-paragraph dialogue">“老师…”鹿丸叫她的声音显然就不如那声“阿吾”亲热了。</p><p class="story-paragraph">保健员大概是才收拾好东西，他手上拎着两个包，有一个很明显是女孩背的。</p><p class="story-paragraph">凑崎偏过头。</p><p class="story-paragraph">在联谊的时候她就和学生会干部打过交道，知道鹿丸是个有趣的男孩，他们认识两三个月了，凑崎倒是第一次挖掘出他如此绅士的这面。</p><p class="story-paragraph dialogue">“你也是戏剧社的？”她带着狡黠的笑意，视线依然锁定在策划书上。</p><p class="story-paragraph">鹿丸露了心虚，挥手否认，只是将挎包绕了一个很大的弧度，背带“啪嗒“一声打在他肩上。</p><p class="story-paragraph">凑崎没说话，她的确并未看到男生的名字出现在名单上，但鹿丸大概是不觉得这种证据只能起到越描越黑的作用，还煞有介事地找了个事实佐明。</p><p class="story-paragraph dialogue">“我就是来打杂跑腿的，”他指指香取吾：“负责人在这。”</p><p class="story-paragraph dialogue">“凑崎老师…”香取没有鹿丸这样淡然自若，她还是试探地叫叫她，之后要说什么没了下文。</p><p class="story-paragraph">她合上写得清楚又明了的剧本，没有马上给出答复。</p><p class="story-paragraph dialogue">“为什么找我？”</p><p class="story-paragraph">陷入沉默的氛围有些尴尬，凑崎才发现自己的语气可能带着生人勿进的刻板，好在鹿丸先一步打破寂静，为她解了围。</p><p class="story-paragraph dialogue">“我出的主意，”他朝着香取使了个眼色：“我们都觉得这个题材找您更好交流。”</p><p class="story-paragraph">和凑崎估计的没错，年龄真的能让学生放下对她的提防心，虽然随之而来的也有麻烦——比如莫名其妙出现在讲台的告白信，或者是她那几乎不怎么造访的办公室里多出一盒无人认领的爱心巧克力：她一律当没看见处理了——但总体上而言还算好的。</p><p class="story-paragraph dialogue">“您不是说您的研究方向是比较文学吗，”凑崎没料到她在第一堂课时自报家门的那些肤浅功绩倒真的被面前这个女生记下来了，香取给的理由叫人很难拒绝：“我想您也许会对西方戏剧有更深刻的理解…”好像也没必要打消学生跃跃欲试的热情，总之这种对艺术演绎的心愿是值得肯定的，凑崎又扫过剧本的译名，她微微眯起了眼睛，将它交还给香取，怕对方误会，还特意补上一句：“晚会是在年末？”</p><p class="story-paragraph dialogue">“嗯，”香取战战兢兢地接来台本：“还有一个半月…”</p><p class="story-paragraph">她声音逐渐小了，看起来果然是弄错了凑崎的想法，不过老师还这样站着，没有要立刻走掉的意思。</p><p class="story-paragraph dialogue">“不需要我签字？”凑崎好整以暇地抛出问题，懵懵的学生才如梦初醒地去找文件。</p><p class="story-paragraph">这回材料放在鹿丸背来的那个包里，香取将对折的公文纸摊开送到凑崎手下。</p><p class="story-paragraph">她总是随身带着印了名字的刻章，四个汉字在她挪了方形的器物以后便浮了出来。</p><p class="story-paragraph">凑崎被问了是喜欢看电子版的书还是纸质版的书，她当然猜到对方是要给她发改编的剧本，不想麻烦她，很懂人情地说了一句“电子版的”。</p><p class="story-paragraph">凑崎顺便留了电子邮件和手机号码，香取又将刚刚退回来的剧本还给她，说虽然不是完整的改编版，但拿在手头也可以翻翻梗概。</p><p class="story-paragraph">她乘着老师的便利，没怎么推辞就收下了。</p><p class="story-paragraph">凑崎走下台阶时才发现自己的侧腰有点疼，可能是昨晚没睡好，再加上穿高跟鞋的缘故，她中午打算回去休息一趟。</p><p class="story-paragraph">不久前下了点雨，鼻子却闻不到泥土的腥气。</p><p class="story-paragraph">学院研究部的外廊是照着西方审美观设计的，工匠用大理石凿好细细密密的精致花纹以后才砌好圆弧型的穹顶，和她读书那会好像又有了点区别。</p><p class="story-paragraph">低垂枝桠上攀着的绿叶折射着落下来的日光，凑崎待在里面也看不真切。</p><p class="story-paragraph">她每次看到这些濒临凋谢的枯木都会不由自主地停下脚步，心里推敲着这也许是残了好几个季度的樱树。</p><p class="story-paragraph">她已经有两年没见过故乡的樱花了。</p><p class="story-paragraph">老师住的地方离留学生宿舍很近，就在追分附近的向丘一丁目，她从文学部的大楼出发，在中途又经过食堂，停下来吃了顿拉面，进餐途中香取如期地将戏剧改编后的完整版发进了她的邮箱。</p><p class="story-paragraph">天气转凉了，但凑崎还耐得住冷，她在纽约的冬天遇到过雪灾，那时和邻里的人们一起拿着铲子费了几个小时才在房门口挖出一条道来。</p><p class="story-paragraph">下午的课是在四点以后，她还有很长的闲暇空余可以消磨。</p><p class="story-paragraph">凑崎拧开门锁，两下就踩掉了鞋，刚进玄关手机就突然响了，她按亮屏幕，下意识就要接起，但来电人的名字又叫她转移了手中的动作。</p><p class="story-paragraph">凑崎将包和嗡鸣的电子产品一视同仁地丢在桌上，不管它是怎么抖个不停也没理睬对方，她径直走到冰箱前，慢条斯理地拉开柜门拿了个小纸盒。</p><p class="story-paragraph">昨晚备课忘记注意时间了，要带日本文学专业的高年级学生，她翻到自己喜欢的小说家，没忍住多看了几眼，不留神就到了凌晨。</p><p class="story-paragraph">凑崎滴了舒缓疲劳的药水，一个仰躺以后舒舒服服地倒在沙发上。</p><p class="story-paragraph">还不至于就这样睡着了，她在闭目休息。</p><p class="story-paragraph">冰冻以后的薄荷制剂会带来一种类似于眼里着火的错觉，有隐没了形状的火苗在她黑漆漆的瞳孔里生长——那铃声也是一簇恼人的烈火，凑崎虽然没睁眼，却觉得无边的暗幕、她阖上的眼帘之中同样有些微微弱弱的光亮在另一端忽闪忽闪地飘动。</p><p class="story-paragraph">这期间不依不挠的来电人恐怕是有耐心地等到了通话接通的最后一下才挂断，那阵铃声起码响了半分钟。</p><p class="story-paragraph">无来由的涟漪就此销声匿迹，沉沉的碎影掉在她被小窗透进来的光线照亮的半张脸上。</p><p class="story-paragraph">凑崎也不知道维持这样的姿势多久了，困意真的也无预兆地来了。</p><p class="story-paragraph">她一只手捏着那个被体温洇得温暖的小瓶子，另一只手将堆在沙发上的风衣扯了盖好，顺势躲进了没那么刺眼的阴影里。</p><p class="story-paragraph">怕醒来以后很难让头发回归原貌，凑崎撑起身，找了一个稍微漂亮些的姿势，她的脑袋还没倒回原位，沉寂了一阵子的手机再次发出不那么悦耳的鸣叫。</p><p class="story-paragraph">无规律的音符在已然没什么波澜的精神世界里轻轻地戳刺软掉的流质，叫凑崎平白无故地折损了困意，她有点恼，窝着去蹭不存在的怀抱。</p><p class="story-paragraph">凑崎还没有很清醒，掩着嘴打了个没什么声音的哈欠，磨了一会还是不情不愿地起来，也不管是不是转寒的季节，她赤脚走过去够手机，接通了就将听筒搁在耳边。</p><p class="story-paragraph">现在还有谁会这样亲昵地叫她名字呢？</p><p class="story-paragraph">那些新认识的学生固然不敢，才搞好关系的同事目前和她也没有到多熟悉的份上。</p><p class="story-paragraph">学生时代的同学会、走得近的朋友会，亲人也会。</p><p class="story-paragraph">她在这世上有也只有唯一的那个、没有半点血缘关系的母亲。</p><p class="story-paragraph">南的语调仍然没有变过，半空半实的，而凑崎没有去听她讲什么。</p><p class="story-paragraph dialogue">“刚刚在忙，”她再次打开冰箱门，封条的磁力好像一下就变大了，凑崎用了点劲才拉动：“找我吗？”</p><p class="story-paragraph">对面的声音突兀地停顿了，她猜大概是自己的打断很不礼貌。</p><p class="story-paragraph dialogue">“那我晚点再…”凑崎抬手按了按太阳穴，将药水放回了冰箱又关上：“我等下有课。”</p><p class="story-paragraph">妈妈听出她不想兜圈子。</p><p class="story-paragraph dialogue">“你冬天的衣服我都收好了，”南识趣地接过话：“天气冷，我给你送过来。”</p><p class="story-paragraph dialogue">“现在还不用，”凑崎不认为她在撒谎，如今她既没穿袜子也没穿鞋，光脚站着，手也还是暖的：“等几天我自己去家里拿。”</p><p class="story-paragraph dialogue">“方便些，你不用去挤电车了。”妈妈坚持着最初的想法，她沉默了一会，紧接着补上一句征询请求的问题。</p><p class="story-paragraph dialogue">“到时候要不要一起在你学校附近吃个饭？”</p><p class="story-paragraph">凑崎没回答，反而是找了个借口脱身。她虽然没有直白地说出拒绝，但意思八九不离十。</p><p class="story-paragraph">最近她也确实有很多要负责的杂事，比如——</p><p class="story-paragraph dialogue">“社团有学生找我做指导老师，”凑崎端起桌上的曲柄水杯喝了一口，不小心吃到了漂在最上面的香草叶：“我要给她们改剧本。”</p><p class="story-paragraph">她想已经可以了，最后和南说见面拿衣服的时间由她来定。</p><p class="story-paragraph">妈妈没有什么支持或者反对的意见，在那边只“嗯”了一声，凑崎没有听得很清楚。</p><p class="story-paragraph">南的声音像是失了真，经过一个未知的空间里传到女孩耳边。</p><p class="story-paragraph dialogue">“忙完了就联系我，”妈妈没有异议：“千万别冻感冒了。”</p><p class="story-paragraph">凑崎想那些爱去酒吧抽叶子的美国同学肯定需要这样一个善解人意的家长。</p><p class="story-paragraph">她抿住嘴唇。</p><p class="story-paragraph">凑崎不知怎么地从这话里察觉到南那懦弱的母性，这同样让妈妈的形象在她记忆中变得愈发温柔。</p><p class="story-paragraph">女孩盯着包外面露出了一角的剧本出神，几个尖锐又互相对抗的念头在脑海里打着架。</p><p class="story-paragraph">她握着听筒的手松了又紧。</p><p class="story-paragraph dialogue">“别花钱了。”凑崎突然没头没脑地冒出一句话来：“在家吃吧。”</p><p class="story-paragraph dialogue">——要和女儿一起吃顿晚饭，名井本来决定就带点冰箱里现成的食材，反正装的也都是纱夏爱吃的，但转念一想她又反悔了，认为那不够新鲜。</p><p class="story-paragraph">为此她又一大早特意开车横跨了两座大桥到丰州市场去选菜，这种临时起意的决策很不合她缜密的行事作风。她们这几个月联系很少，唯一的交集是离现在快要有一个季度之久的中秋，她在节日前夕让女儿回家一趟，哪知道纱夏作为新上任的老师，又要跟着学生去京都调查民俗情况，脚都歇不了。</p><p class="story-paragraph">名井也只好在匆忙的会面中将买来的月见团子塞给纱夏，叮嘱她要早点吃掉，要不就会过期了。</p><p class="story-paragraph">纱夏不是习惯挑挑拣拣的人，她总相信她做什么给她吃，女儿都不会讨厌的。</p><p class="story-paragraph">名井只想弄得热闹些，两个人在家吃饭也能显得开开心心的。</p><p class="story-paragraph">她无法照原样复刻出曾经的生活，却总记得好好准备这些琐事。</p><p class="story-paragraph">纱夏才入职没多久，生活费也不要她的，名井怕她省着花钱，一个人住在外面，她担心女儿吃不好穿不好，总想逮着机会就好点宠她。</p><p class="story-paragraph">纱夏喜欢吃河豚，女儿和她一样，都是关西人，以前的习惯太难更改，带到东京也没抹掉。</p><p class="story-paragraph">她提前问了纱夏有没有边炉锅，得到了肯定的答案就坚定了做什锦火锅的决心。</p><p class="story-paragraph">难度不大，买好原料就万事大吉。</p><p class="story-paragraph">名井特意嘱咐帮忙去骨的师傅将肉处理得干净些，这对每天接上千百个订单的专业人士来说还是太大惊小怪了，但她还是本着以防万一的心态。</p><p class="story-paragraph">她还不嫌麻烦地多要了几个冰袋，怕河豚肉放一整天变质，暖风空调都没敢开。</p><p class="story-paragraph">名井本来也只打算和女儿吃个晚饭，不是说她不想再和纱夏多待一会——女儿没有主动说，她自然不好厚着脸皮去打扰她。</p><p class="story-paragraph">她没想到纱夏特意问了她在这个下午有没有空，还说想要她帮个忙，不过没告诉她具体是要做什么。</p><p class="story-paragraph">名井翻了自己的日历表以后逞能地答应下来，她那天其实有个客户，想着能速战速决，可实际情况又不尽如人意。</p><p class="story-paragraph">应付完预约的谈判已经花了很长的时间，她急着走，这个案子又马虎不得，于是名井只好努力将心思拉回正轨，强迫自己默读文件上的那些条目，让律师的职业道德不至于在坐立不安的等待之中彻底崩塌。</p><p class="story-paragraph">名井出发的时候还特意看了一眼表，希望能赶得及。</p><p class="story-paragraph">今年还不够冷，往常到了十二月中旬就会下雪，而现在快新年了，天空也依然阴霾地沉睡着。</p><p class="story-paragraph">她驱车出来，从挡风玻璃望过去，其中浮着那些连成一片又没有生机的雾霭云朵。</p><p class="story-paragraph">去纱夏学校的路名井很熟悉。</p><p class="story-paragraph">工作日不是上下班高峰时期的也会遇上堵车，好几次她都打算在电车站附近弃车再转乘公共交通，但考虑到后座堆着的那些包裹又作罢了。好在刚过了大手町情况被缓解不少，名井踩着油门继续让车子行驶，她本来想在去学校之前先去纱夏住的地方放好东西，但现下她已经迟到了，再给女儿打电话都没人接。</p><p class="story-paragraph">名井没有钥匙，只好先按着女儿给她的教室位置去找人，她将车停在本乡邮局的门口，朝东走几分钟过了马路看到纱夏读书的学校——名井在脑海里把“读书”换成了“教书”，想了一会儿觉得这种行为没什么必要。</p><p class="story-paragraph">她提着包进了侧门，这边靠近图书馆别馆，法学院的教学楼也和它挨在一起。</p><p class="story-paragraph">以前女儿和她散步的时候也走到过这里，纱夏半开玩笑地说如果妈妈是她的校友就好了，那她肯定也会经常出现在这栋楼里。</p><p class="story-paragraph">名井沿着路牌走，记忆像受惊以后逃窜的小兽，踏着蹄子朝哪里狂奔，女儿和她的脚步大概在此会不经意地重合，她想不出纱夏独当一面的样子，哪怕是她已经成为了老师，以后或许又要担起人生的其他职责，女儿在她这里永远是可以不用长大的小孩。</p><p class="story-paragraph">名井在偌大的校园里转了十分钟，她催促自己走快一点，又也不好踩着高跟鞋跑步。</p><p class="story-paragraph">在经过赤门的时候她碰到了很多空闲的学生，有孩子立着布告牌，名井没来得及思考，她远远地望过去勉强看清个大概，好像是和拳击社有关的信息，图片上印着两幅颜色不同的手套。</p><p class="story-paragraph">走进文学院的那条长廊，名井就不敢太用力了，就连鞋跟在瓷砖上敲出来的声音也轻了不少。</p><p class="story-paragraph">女儿的教室在三楼。</p><p class="story-paragraph">她以前都是在外面等纱夏，很少光明正大地进来，不过门牌的标号一目了然，她很快就找到了女儿说的那间。</p><p class="story-paragraph">教室的门设计得古朴，像是梯形和长方形拼接在一起的橡木门，不是按压式扶手，而是方便推拉的嵌入门把。</p><p class="story-paragraph">名井这才意识到这不是什么小场面——她有点紧张，急忙打开手机前置摄像头检查了仪容。</p><p class="story-paragraph">那个客户救了她一命，如果不是要谈判，她肯定懒得把妆化得又全又好，本来以为这样能不显老，但从事务所出来急急忙忙的，这身衣服也太过正式了。</p><p class="story-paragraph">她自我嫌弃一番，觉得自己看起来像是学校管理院的某个主任。</p><p class="story-paragraph">名井想起什么似的，倏一下低了头，果然发现律师徽章还别在领子上没取，连忙将它后面的别针摘了，又丢进手提包里。</p><p class="story-paragraph">她不想让自己站在门口张望的身形太过显眼，小心地绕过菱形的透明玻璃，在这时又看到拼接色块的长瓦上有张贴着的纸。</p><p class="story-paragraph">是课表。</p><p class="story-paragraph">名井仔细地读它，果不其然地发现此时此刻对应的空格里写了纱夏的姓。这么年轻就来高等学府教书的老师少之又少，名井莫名地有些骄傲。</p><p class="story-paragraph">她何必在女儿看不见的地方也装出一副无动于衷的样子，因此也不觉得自己这样幼稚，甚至不禁伸手去碰被挡板隔开了的印刷铅字。</p><p class="story-paragraph">这堂课是日本文学系开的，好像和古典风格有关的选修拓展课。</p><p class="story-paragraph">纱夏有和她说过要她进去，但女儿已经开始了五十分钟了，如果她从眼前的门进去，第一个见着的恐怕就是讲台和黑板，会打断纱夏的课堂。</p><p class="story-paragraph">名井想看看除了正门有没有其他的出入口，却发现这个教室的另一扇门被上了锁。</p><p class="story-paragraph">她踌躇了半天，又没到下课的时间，只好试探地踮踮脚去看教室里的情况，可没想到待在里面的学生看起来不像是有老师在场应该有的状态，还有的人没安分地坐在座位上，全部簇拥在教室最前面的那两排座椅边，围成了不太好窥视的圆圈。</p><p class="story-paragraph">她觉得奇怪，好像又在影影绰绰之中看到了纱夏。</p><p class="story-paragraph">虽然不明白发生了什么，但名井幸运地确认了自己现在拥有可以进去的机会，并没人注意这边。</p><p class="story-paragraph">她拉开了门缝，隔音效果很好的木板马上将消失的声音全数归还。</p><p class="story-paragraph dialogue">“松风犹似唤侬…”</p><p class="story-paragraph">里面的人话没说完就戛然而止，其原因要怪罪给那扇看起来正常却在开合时暴露缺点的橡木门。</p><p class="story-paragraph">学生们的目光几乎都齐刷刷地往不速之客的身上射，只有中间那个人例外。</p><p class="story-paragraph">有个按方向来看是面对着名井坐的男生急忙将被分散的注意力拉回来，但是已经迟了，离他最近的人出手掀翻了桌面上的一张纸牌。</p><p class="story-paragraph dialogue">“老师…”其中有个学生喊停，暂时中断了他们正做着的事。</p><p class="story-paragraph">被叫到的人转头的动作在名井眼里看来像是被慢放的镜头。</p><p class="story-paragraph">名井不动神色地定住了心弦，没在众目睽睽之下退缩。</p><p class="story-paragraph">她知道自己迟疑得越久就越尴尬，纱夏先给了面子，当作没看见她似地叫同学们继续。</p><p class="story-paragraph">站在最左边的女生听了话，低下头在手中的牌里翻翻找找了一阵，依了自己的职责唱出句诗来——</p><p class="story-paragraph dialogue">“长…”</p><p class="story-paragraph">第一个字出来时两人就都出手了，他们几乎是一瞬间就按在同一张牌上。</p><p class="story-paragraph">名井此时也走到女儿身边，不过没有和纱夏离得特别近，两人间保持着距离。僵持不下的这一幕很快被切断，是女儿没有犹豫多久便先松开了手，很有风范地将这一分让给了对方。</p><p class="story-paragraph">名井眯着眼，不自觉地抱胸站着，竞技歌牌是她以前有空的时候陪女儿玩过的游戏，但纱夏的实力显然在认真学了五六年古典文学以后得到了飞涨。</p><p class="story-paragraph">她放水与否都不会对战局有什么影响：这边的牌阵只剩三张了，纱夏不用费什么力气就能赢。</p><p class="story-paragraph">和南预想得一模一样，不出几回合，那男生就发出声惨兮兮的哀叫，和牌认输了。</p><p class="story-paragraph">不止败者一人沮丧，名井发现围在他们身边的其他人也都一副闷闷不乐的样子。</p><p class="story-paragraph dialogue">“凑崎老师，不要啊…”另外一个男生在一旁也苦着脸，又像只是在打趣地抱怨：“可怜可怜我们吧，结课作业已经很多了…”</p><p class="story-paragraph dialogue">“不是说学得不错吗？”女儿笑眯眯地反问，对学生的求饶不为所动，无视掉了此起彼伏的叹息。</p><p class="story-paragraph">以前没发现纱夏这么坏心眼，会挑擅长的优势当笑面虎了。</p><p class="story-paragraph">名井感觉女儿上道特别快，这种口气分明和那些爱耍花招折磨学生的老师没有任何区别。</p><p class="story-paragraph">她想笑，没再管事。</p><p class="story-paragraph">名井反正是来听纱夏讲课的，于是便借机仰头往后面的空座看，盘算着等会坐在哪。</p><p class="story-paragraph">这间教室很大，她可以占着靠后的位置。</p><p class="story-paragraph">名井以为已经结束了的纸牌游戏其实并没有就此落幕，而当她注意到女儿的目光时已经晚了。</p><p class="story-paragraph dialogue">“大家多多少少都知道名人战吧？”纱夏的视线在她身上停留了几秒就像蜻蜓点水那样跳开：“最出名的好像是将棋，每年都有。”</p><p class="story-paragraph dialogue">“不过我不教棋术，”女儿没让学生回到原位，她伸手将摊在桌上的纸牌聚拢：“今天没有上理论课，也是想和你们一起展现一场漂亮的对局。”</p><p class="story-paragraph dialogue">“达不到预想的效果也没关系，”纱夏话里有话：“我还请了外援。”</p><p class="story-paragraph">本来吵吵嚷嚷的学生又都不约而同地安静下来，随着老师的意思去看她，但谁都没有凑崎那么明目张胆，也不敢用这样肆无忌惮的眼神去打量一个陌生人。</p><p class="story-paragraph">纱夏的表情很玩味，她用食指轻轻敲着桌面。</p><p class="story-paragraph">名井的确和她的女儿心有灵犀，只稍这么对视一眼就知道下一个参赛的顺序应该轮到了自己。</p><p class="story-paragraph">纱夏站起来，要把外面的位置留给她。</p><p class="story-paragraph">名井今天穿了高跟鞋，这下差不多能和女儿平行而视。“请吧。”</p><p class="story-paragraph">纱夏的语调似笑非笑，曾经望向她时只有甜蜜情意的那双眸子里翻滚着她一人特别着迷的暗涌。</p><p class="story-paragraph dialogue">“前辈。”</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">女儿笃定了她会听话地配合，反正她打电话时就开诚布公地早早给出了提示，名井想原来纱夏口中的“帮忙”就是要她陪玩一轮歌牌。</p><p class="story-paragraph">在酒局上晚来的人都该自觉地自罚三杯，何况她是明知有学生在场还迟到了将近一节课。</p><p class="story-paragraph">名井对这种不成文的礼节谙熟于心。</p><p class="story-paragraph">刚好是课间休息，纱夏放学生们出去透气，可只有少部分人作鸟兽散，还有剩下的孩子也许是出于好奇的心理留在原地，饶有兴趣地继续观察她们之间的气氛。</p><p class="story-paragraph">名井忽视了那些打量的眼光，她琢磨着是不是要在十五分钟的背诵时间内匀出机会和女儿打个招呼，又觉得对方好像懒得和她表现地亲近。</p><p class="story-paragraph">牌阵已经好好地摆了六排，名井和和歌打交道有好些年了，单论背诵，她也确实是纱夏的前辈。</p><p class="story-paragraph">记东西是她的强项，可她没有因此掉以轻心。</p><p class="story-paragraph">服用精神安定药物的疾病史已经过了好一段时间，但难以磨灭的副作用不是光靠自我安慰就能彻底无视的。</p><p class="story-paragraph">场上有三张绝字牌，她猜自己现在反应力肯定胜不过纱夏，便算好了可能失掉的分数，主动减少了多余记忆的负担。</p><p class="story-paragraph">名井听到凑崎和她的学生聊天，知道选出来的裁判姓伊织，这学生很负责任地掐着表注意时间，几次都准点让人进入下一个阶段。</p><p class="story-paragraph dialogue">“现在可以空挥练习了。”</p><p class="story-paragraph">纱夏已经打了几局，手感还不错，她象征性地摆了两下抢牌的动作以后就端端正正地坐好。</p><p class="story-paragraph">名井相反，她很久没和人对阵了，手法不免生疏，她没有太多的准备机会，两分钟的空隙转瞬便过完，伊织很适时地唱起了象征着开始的序歌。</p><p class="story-paragraph dialogue">“难波渡津花，寒冬暗沉寂。”“今时将逢春，花开映波津。”</p><p class="story-paragraph dialogue">“难波渡津花…”第二遍序歌是竞技前的最后提示，名井还真是很少走一套这么严格的流程：“花开映波津。”</p><p class="story-paragraph">场地受限，谁都没办法跪在榻榻米上，不过规则总该好好遵守，名井只能别扭地将手垂在身侧。第一分，她不想防御，仔细地听着裁判念出口的诗，而不知运气之神究竟是眷顾了谁，这首诗在纱夏的牌阵里，可惜位置很不好，最靠近女儿，还摆在最左边。</p><p class="story-paragraph">名井没反应过来，可纱夏的速度不再是小打小闹的，假名才出来两个，她便飞快地将写着“暮色满京都”的纸牌扫出了竞技线。</p><p class="story-paragraph">名井在心里暗叹了一声，真有点叫苦不迭的负担感。</p><p class="story-paragraph">女儿现在可是专门学这个的，她想她可能会输得很彻底。</p><p class="story-paragraph">遇到开局就失利的情况，她努力没表现出不满的表情，沉默着等待下一轮机会。</p><p class="story-paragraph">不想败得太难看，名井怕自己分心，忍着没去看女儿。</p><p class="story-paragraph dialogue">“人间多愁苦。”</p><p class="story-paragraph">这次她也及时动了，和女儿重重地撞在一起。</p><p class="story-paragraph">在交锋时刻，名井还差点为了纱夏卸掉的指甲走神，好在她有好胜心，迅速收敛了心绪，快一步按住底下的那张卡纸，将它从自己的牌阵里清了出去。</p><p class="story-paragraph">她也不知道为什么围在旁边的学生看得这么津津有味，都屏着呼吸看她们交手——是字面意义上的交手，因为抢牌的缘故，两人的手背经常碰出清脆的响声。</p><p class="story-paragraph">分数没有被拉得太开，名井猜测是惯用手的问题。</p><p class="story-paragraph">女儿是右撇子，从小到大也一直是用右手玩歌牌的，就在刚刚她观摩纱夏和那个男生的战局时，女儿也是用的右手。</p><p class="story-paragraph">轮到和她对阵的时候纱夏换了左手。</p><p class="story-paragraph">年轻人小脑发达，名井还以为女儿是善用左右开弓的把戏，但后来发现纱夏的这个异常行为大概只是为了拿到第一分而冲动作下的决策。</p><p class="story-paragraph">名井在后面察觉到纱夏的动作被生疏的负累拖慢，女儿也比开局时显得稍微冲动了一些。</p><p class="story-paragraph dialogue">“相思难从…”</p><p class="story-paragraph">伊织念了某首没有出现在牌阵里的诗，名井没动，一旦在此时抢牌就会造成空牌误触的失分情况，可纱夏居然伸手碰掉了写着“原上采春芽，只为献君尝”的那张牌。</p><p class="story-paragraph">裁判同样发现了不对，她眯着眼仔细地审查了一会，最后笑着说凑崎老师丢分了，她故意挑了前四个音节重合的两句诗，达不到友牌的标准，怎么抢都会误触，何况她念的那首诗都没出现在牌阵里。</p><p class="story-paragraph">伊织只为了整蛊她们，看谁先上当，纱夏要是再有耐心点听到后面就不会犯错了。</p><p class="story-paragraph">恐怕是所有学生都等着上位者失误，裁判也不例外。“前辈，”伊织跟着女儿一起这样叫她：“您可以送一张牌给凑崎老师。”</p><p class="story-paragraph">名井也乐得让纱夏再和自己周旋一阵。</p><p class="story-paragraph">她绷着脸上的肌肉不让自己笑得太猖狂，纱夏和她重逢这么久，她还是第一次重新在她脸上看到那样显得不甘又俏皮的、属于她在自己面前时毫无防备心的童真。</p><p class="story-paragraph">哪怕它仅仅就那样转瞬即逝。</p><p class="story-paragraph">也算是托纱夏的福才打出了一场不怎么丢人的模范赛，她顺水推舟地靠着女儿失误才勉勉强强地维持了大概持平的战局，在自己的牌阵里选了一张递给纱夏。</p><p class="story-paragraph">伊织惩罚完老师以后也要按规则补全这诗句。</p><p class="story-paragraph dialogue">“相思难从愿，不惜下黄泉。”</p><p class="story-paragraph dialogue">“昨夜相逢后。”</p><p class="story-paragraph">她一直念到了最后。</p><p class="story-paragraph dialogue">“依依恋世间。”</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">教室里的人一点点走空了，有几个并肩地女生很礼貌地和女儿点头说了再见。</p><p class="story-paragraph">名井就按自己的想法一直坐在靠后的位置，并联的冷光灯垂下碎片一样锋利的细芒。</p><p class="story-paragraph">天空是逐渐地黑了下去，不突兀也不缓慢。</p><p class="story-paragraph">冬天向来是这副景象，而太过刺眼的光线在此时渲染着精妙的谬误感，让她站在理性与感情的汇合处似的。</p><p class="story-paragraph">她有些累了，也不知去向哪，只是就着惯性的力量凝望着她女儿。</p><p class="story-paragraph">纱夏还坐在讲台上叠那副她带来的牌，她可能是要按顺序排好，那要花上不少时间。</p><p class="story-paragraph">名井输了，她没有仔细数输了几分。</p><p class="story-paragraph">她其实也从未认真琢磨过那些得失功过，尤其是在女儿面前。</p><p class="story-paragraph">名井以前也竟不晓得自己的心还有如此宽容又乐于释怀的特质。</p><p class="story-paragraph">讲台那边传来的一切动静都在空旷的教室里有了鲜活的回音，那回音好像也有生命，名井试图从声音的质感、长短来感受纱夏的心情，而女儿只是将并在一起的纸牌急促地敲成首尾对齐的和睦之景以后便停了下来，不给她多余的线索去探寻。</p><p class="story-paragraph">纱夏站起来，名井也学她。她按灭了开关，让天花板上接近一半的白炽灯都和自己一样也好好休息，走路的速度在松弛环境里不自觉地变得慢慢悠悠。</p><p class="story-paragraph">拖长的步伐很好被发觉，女儿抬头时顺手拔掉了插在电源接口上的数据线。</p><p class="story-paragraph dialogue">“有没有落下的东西？”</p><p class="story-paragraph">这是她们今天见面时第一句只讲给对方听的话，没有别人在场。</p><p class="story-paragraph">纱夏还陷在那种认真时才有的氛围里，她也许只是顺势接过了老师的责任，眉毛仍轻轻地蹙着，神情里掺着些迷人的严肃。</p><p class="story-paragraph">以前名井半开玩笑地逗她说要想有一副大人的样子是不能靠装的，这下她便哑口无言了。</p><p class="story-paragraph">她摇摇头，悄然攥住了手。</p><p class="story-paragraph">从教室出来的时候过了六点，整栋楼的室内似乎都是暖烘烘的，流通于走廊间的风很显然是人造的，普通棉织布料散发着柔和又亲近的气息拂面而来。</p><p class="story-paragraph">名井感觉她的脸被一些受到负离子影响以后漂浮着的细小纤维挠得有些痒，可当她想要稍微认真地去找这些不那么显眼的茸毛时，这群始作俑者就好像是读了她的心一样，不约而同地隐匿了身形。</p><p class="story-paragraph">校园里与她们擦肩而过的大部分是学生，闹哄哄地聚作一团是去吃饭，名井跟在女儿身边垂眉敛色的，她不停地去看她露在袖子外面的那截手掌，好像那样柔软温热的触觉也是吸她视线的磁铁。</p><p class="story-paragraph">口里哈出的气有了形状，干燥的料峭寒意一点点包围了她。</p><p class="story-paragraph">名井想起纱夏有很多冬天的衣服都还在她车上，她担心她冷，心里不安，却又不知道现在出做什么行为才不叫逾矩。</p><p class="story-paragraph">那些易碎的流光剪影渐渐地被无言的缄默取代，名井很害怕她们如此的时光就要这样无止境地积累下去，直到哪天超出原先亲密无间的日子总和。</p><p class="story-paragraph">在经过赤门时名井看到了那张熟悉的海报——她这次和印着拳套的彩色打印纸离得极近，终于验证了自己的猜想，社团好像都在为临近的晚会作宣传了，有视力好的孩子找到了女儿，和她打招呼，细声细气地说凑崎老师好。</p><p class="story-paragraph">她们在聊什么呢？</p><p class="story-paragraph">女儿变化的口型像是加了密，声音还没传到她耳边就被扭曲的痛感吞没。</p><p class="story-paragraph">名井也不敢惹出嚣扰，主动藏起自己满心的爱欲，像披着影子的人穿梭于这夹缝中去偷窥纱夏在后辈面前被削弱了锋芒的神态。</p><p class="story-paragraph">她突然记起纱夏曾和她说起过她是某个社团的指导老师，于是又借着模模糊糊的光以及稍远些的距离想看清这个女孩是从哪里走过来的，但时间不够了，当女儿的眼睑被光线投射在漂亮睫羽之下的阴影覆盖时，名井看到纱夏眼底闪动着最接近于脆弱的柔软就和融冰似的梦一样，在聚光的透镜之下，不消分秒便幻灭得无影无踪。</p><p class="story-paragraph">女儿对面的学生也循着老师的目光一齐看她。</p><p class="story-paragraph">名井的表情有些失态的狼狈，她心虚地后退了一步。</p><p class="story-paragraph">她想拥有一种能够快进人生的神力，好将她所遇见的这样一个尴尬境遇直接略过。名井第一次不知怎么和纱夏的学生自我介绍，交错的复杂情绪让此时此刻变得分外难熬。</p><p class="story-paragraph">女儿也许是感受到了她的难堪，大概是怀抱着泛滥成灾的善心，放软了语调轻轻和她说了一句“走了”。</p><p class="story-paragraph">可能是看她像没听见似地僵着不动，纱夏干脆上前一步牵过她。</p><p class="story-paragraph">不是紧紧地十指相扣，就是最简单的掌心贴着掌心。</p><p class="story-paragraph">她一面加快了碎步的速度去和纱夏并肩，又一面在心底埋怨自己刚刚不该站得太远，以至于她如今举手投足之中隐隐若现的慌张都太明显，像个才弄懂爱为何物的懵懂雏儿，或者也可以说是像陷入了爱情忧思的怀春少女，哪里还有半点母亲该有的样子。</p><p class="story-paragraph">纱夏的手真的比她的要凉一些，名井怪自己没尽责，再也没松开女儿，在等红绿灯时也牵着她，肌理的纹路有记忆，相贴源头滋生的熟稔促使着名井反客为主地摊平了手掌，将纱夏反握住。</p><p class="story-paragraph">名井和女儿说过相当于调情的俏皮话，要知道这可和她一直以来在纱夏眼中建立起的正经形象大相径庭，一旦玩得过火就会被说是为长不尊。</p><p class="story-paragraph">可她喜欢看小孩眼里不遮不掩的稚嫩的爱意，也愿意将她袒露的性欲与渴求毫不犹豫地吞吃入腹，她献出身体给纱夏做药引，才稍微压下了谁也控制不了的热潮，没让她们两人纷纷在抵死的缠绵之中灰飞烟灭。</p><p class="story-paragraph">宛若情侣那样消弭一切间隙的欢爱在进入尾声时总要替换成以拥抱为载体的温存。</p><p class="story-paragraph">少女有着纤细骨感的脚踝和她的靠在一起，却要稍微低头才能亲到她的耳朵，她和女儿比比手的大小，发觉现实很矛盾。</p><p class="story-paragraph">毛茸茸的小狗比她高，但伸在她面前又努力撑直的指头却又不如她的长，名井忍不住弯起的眼睛和发出的嗤笑都意味不明，而纱夏当然天真地以最色情的想法去揣度她的思维。</p><p class="story-paragraph">年下含混的说话方式总夹杂着一些带着困顿意味的鼻音，她半是撒娇半是认真地解释道这是标准尺寸。</p><p class="story-paragraph">女儿让梭巡的吻降落，双唇裹挟着呼吸的热量游走在她后颈的皮肤，激得她转缓的心跳又一次疯疯癫癫地往云层攀爬。</p><p class="story-paragraph">名井将自己的体温分享给了纱夏，而对方当时自称是“标准尺寸”的手在她耐心的摩挲之下终于慢慢地暖和了起来。</p><p class="story-paragraph">因信号灯变绿而以动代静的人群踏在柏油马路上的脚步声被汽车待机时引擎发出的轰鸣响声盖过。离停车的地方不远了，她琢磨着也许能和纱夏聊点什么。</p><p class="story-paragraph dialogue">“那个学生也是戏剧社的吗？”她偏过头，哪里料得见自己竟然又生出一阵恍神来。</p><p class="story-paragraph">光是看女儿漂亮的睫毛因主人思考的模样扑跃，她就要无可自拔地沉醉在纱夏俊美的容颜里。</p><p class="story-paragraph">女儿扎了辫子，细长的脖颈笔直纤细，从她喉咙里飘出来的应答声好像在色欲的暗示边沿游离，那个圆润的音节被她吐得性感又好听，名井忍不住好奇这种变化产生的缘故会不会和她在纽约生活了那么久有关。</p><p class="story-paragraph">她曾用那双不是画家的眼睛去想象女儿在异国街头独行的样子，可没有习来高深的笔触与技巧，那副画作因此也没有完成，画的背景永远是白纸最粗糙的原样，连剪裁失误的毛边都没有被处理干净，她在正中间扑了一滩乱七八糟的颜料上去——没有具象的框架，没有清晰的人形。</p><p class="story-paragraph">现在名井可以不用那么害怕了，她还有很长的时间和她相处，即使再也不能原原本本地回到那段时光，她也总归是为自己再次打开了纱夏的话匣子而高兴。</p><p class="story-paragraph">名井确认了女儿依旧承认她的母亲身份，胆子也大了些，她知道纱夏不是那样不懂知恩图报的孩子，于是恶劣地想着自己又要利用女儿的善良来骗取同情。</p><p class="story-paragraph">她也没有办法，现如今她只想和纱夏更亲近一点，也不再深究那束情感的源头是否沾染了世人讳莫如深的罪孽。</p><p class="story-paragraph dialogue">“这次演什么？”名井好奇更新换代的社团在没有了小美人鱼以后还能不能取得惊人的战果，但她相信纱夏的眼光，既然是女儿选的剧本，质量也不会差到哪里去。</p><p class="story-paragraph">可纱夏似乎不是很想说，她一整天都没什么明显情绪变化的五官终于有点松动。</p><p class="story-paragraph">女儿眉心的中点向下垂，而末梢往上抬的习惯还没改，那时她每次为难时的微表情，名井不知她在纠结什么，她不想让这个话题如同转瞬间就被投入湖底的石子一样没了声息，本来是想耐心地等着纱夏告诉她答案，但女儿一反常态地没有接话。</p><p class="story-paragraph">末了纱夏微微地摇头，长得越来越像狐狸似的那对眼睛轻轻地眯了眯。</p><p class="story-paragraph dialogue">“妈妈不会想知道的。”</p><p class="story-paragraph">她唇角噙起的笑意让名井本能地感觉到危险——这副面孔出乎意料地适合摆出些诱人的表情。</p><p class="story-paragraph">这句话好像也能对答名井想要提出的一切问题，她的精神像是接到了某种药物带来的摧残一样，竟真实地尝到了妒火的滋味，名井乱成一片的脑海里一下填满了猜疑。</p><p class="story-paragraph">她想可能是那种吸毒以后才有的幻觉复苏了，揆情度理地相信是纱夏谙熟了某种叫女人越来越有魅力的秘密。</p><p class="story-paragraph">名井想让她过度发达的想象力及时悬崖勒马，又不免无妄地猜测那秘密恐怕是一场她不曾知晓的爱情。</p><p class="story-paragraph">她越是看到纱夏的变化，便越想将眼前这个迷人的孩子占为己有。可女儿现在不是她一个人的了，她已经不是了，也许两年前还是的，但是就是她亲手让纱夏接起了其他的身份，她现在是别人的同僚，也会是她教过的学生眼里亦师亦友的伙伴。</p><p class="story-paragraph">名井感觉她胸口闷得发紧，可能是穿的高领毛衣开口的位置没有拨对。</p><p class="story-paragraph">她抬起左手想调整这样别扭的穿着，但因为工作要见异性的原因，无名指上还戴着那枚能作为回绝理由的戒指，钻石镶底的银色金属有几次钩到毛衣线头，本来简单的动作也变得拖泥带水，她又刻意和自己赌气似的，怎么也不肯松开女儿，到最后干脆直接放弃了挣扎，任凭胸腔里的愤懑到处乱爬，这情况直到她们都坐回车里才好转。</p><p class="story-paragraph">名井今天本来正是要和纱夏在她住的楼下见面，不过是她失约在先。</p><p class="story-paragraph">她没有再多此一举地问女儿地址，发动轿车系上安全带以后就往那个方向开。</p><p class="story-paragraph">上一个问题根本没有得到回答，这次的回避不再是纱夏以前那种犯了坏事时会有的沉默，而是直截了当地表明她的态度。</p><p class="story-paragraph">女儿大概是已经摸清了规律：即使她什么都不告诉她，她也不能拿她怎样。</p><p class="story-paragraph">纱夏按着她的预期长大，而她安排了她一部分的人生。</p><p class="story-paragraph">女儿唯一因她而起的忤逆也是被她修正的，除此之外她不仅没有为她带来一丁点儿的麻烦，还将一切都做得无可指摘。</p><p class="story-paragraph">在她做下错误决定的那天起，名井就失掉了自己的绝对权威。</p><p class="story-paragraph">她对此无可奈何，在沉默中凝视着前车的尾灯。</p><p class="story-paragraph">只要两分钟就开到女儿住的街区了，但纱夏说这附近最近的那个停车场就在她刚刚停的那个邮局。</p><p class="story-paragraph">名井想起自己穿的高跟鞋，心里打了退堂鼓。</p><p class="story-paragraph">她现在有些累了，回去还要做饭，不想再折损多的体力。</p><p class="story-paragraph">有经验的司机会在没那么拥挤的丁目里找空隙停车，名井这么些年碰到过比这还棘手的路面情况，她一次性打死了方向盘，降下窗户去看在黑夜里没那么清晰的后视镜，</p><p class="story-paragraph">最后她以一个很诡异的角度成功倒进了狭窄逼仄的角落里，停得很好，可副驾驶的门却没办法打开，那边靠着居民楼的墙。</p><p class="story-paragraph">名井先下车，她知道纱夏会在她走之后从驾驶座上跳下来，便去后座拿东西。</p><p class="story-paragraph">偶有摩托车驶过的小道里，塑料袋揉在一起发出的悉索声音变得有些刺耳。</p><p class="story-paragraph">文京区有好几所大学，名井想这一带的人大概也都捡了与文人相似的习惯，生活气息浓厚的居民楼附近没有城市中心的热闹，不过想到纱夏在这里能过得稍微清闲些，她安心不少。到了年末，家家户户亮灯的时间也是越来越早了，名井想赶快上楼，她整理得太忘乎所以，整个身子几乎又都钻进了车里，往后退时也没怎么注意后面，便毫无防备地踩到了什么柔软的，会动、还会发出惊叫的东西。</p><p class="story-paragraph">名井想控制身体的重心，但她已经失去了平衡，光是想着自己可能要在这里上演一段平地跌倒的喜剧情节，她就已经窘得不愿意接受事实，认命似地不再挣扎，还灵光乍现地计算了一下她这个年纪摔一次跤大概需要缓多久才能从伤筋动骨的创伤中恢复健康。</p><p class="story-paragraph">预想的疼痛和尴尬的情况都没有如期而至，女儿虽然表现出了一副被吓到的样子，但年轻人反应速度了得，她的衣服被纱夏眼疾手快地扯住，两个人的身体倾斜的方向跟着调转。</p><p class="story-paragraph">纱夏揽着她的腰，名井察觉到她的肩膀也在暗暗地使劲，帮忙挡住了她危险的动作，她想偏过脑袋去，但此刻侧脸已经和纱夏亲昵地贴在了一起。</p><p class="story-paragraph">女儿好像没有马上意识到这个姿势极其暧昧，不自在的人是南，纱夏的两只胳膊在她小腹之上交叠，她身体散发着的熟悉香味还在往她鼻子里钻。</p><p class="story-paragraph">少女的体温唤起了她对她那阵无比接近于本能的依赖——母亲该对女儿有这样深刻的眷恋之情吗？</p><p class="story-paragraph">名井犹豫着要不要借着这个机会多赖一会，最后还是清了清嗓子，好像她真是被冷风吹得不怎么舒服。</p><p class="story-paragraph">纱夏应声松了她，名井才解脱了桎梏，继续伸直了胳膊去做着搬运的工作。</p><p class="story-paragraph">她面上的温度有些烫，将第一批撑得塑料袋鼓胀的衣服塞给女儿的时候说了句“谢谢”，这声谢是对她今晚所做的一切行为说的，总之女儿不客气地接下了，她是个体贴的孩子，还从她手里多匀了一包提好。</p><p class="story-paragraph dialogue">“我有这么多衣服吗？”纱夏进电梯的时候回头问她，名井也知道这行李的数量可观得有些吓人。</p><p class="story-paragraph">她这里两袋，女儿那里三袋。</p><p class="story-paragraph dialogue">“我给你新买了几件，你等会看看合不合适，”她边给出合理的解释边看纱夏按下写了数字七的楼层按钮：“还有一些吃的。”</p><p class="story-paragraph">女儿闻言便试探性地提起右手拎着的黑色纸袋晃了晃，好像在确认那里面装的真的不是衣服。</p><p class="story-paragraph">名井乐于见着她天真浪漫的模样。</p><p class="story-paragraph">一层楼有四户，纱夏让她先出了电梯，但南是客人，不知道该往哪边走，直到女儿先转身朝左，她才跟在她身后。</p><p class="story-paragraph">纱夏住的这间房离安全通道有点距离，虽然近几年没什么烈性地震，但名井还是多留了个心眼。</p><p class="story-paragraph">女儿将提着的物什都换到了同一只手上，她在包里翻着钥匙。</p><p class="story-paragraph">那把抛光得有些过度的银色小锁被纱夏拧开，木质门发出了轻微的嘎吱声响，锁舌已经收回了，纱夏也知道，她很快地拉开了它，示意让她先进去。屋子里很暗，走廊的感应灯也照不进来。</p><p class="story-paragraph">女儿将玄关处的暖黄灯拧亮了，名井借着光源看到纱夏指着的那双拖鞋。</p><p class="story-paragraph">她很快地将因为才放在地上而瘪下去的袋子提起来，那里面装着她们的晚饭。</p><p class="story-paragraph">名井想起自己的装扮不适合下厨，她回头去看刚刚合上门的女儿。</p><p class="story-paragraph dialogue">“纱夏，”她叫了她：“你有皮筋吗？”</p><p class="story-paragraph">答案是肯定的，女儿没有停顿，抖抖手腕将她绑着的那个取了。</p><p class="story-paragraph">她头发一瞬间倾落下来，靠近发根的颜色逐渐地褪了，长了些原有的柔软黑发，但靠近发尾的位置仍旧留着染烫的痕迹，垂肩的末梢曲着一个精美的弧度，很像弯月，天使在其中淘气地穿梭，又将爱神赐予的箭矢搭在柔软又如细韧弓弦似的发丝之上。</p><p class="story-paragraph">而她这个拥有着母亲身份的心脏便在一瞬间就被这种难以言喻的力度贯穿。</p><p class="story-paragraph">名井接过发圈时觉得自己发呆的样子肯定已经都被纱夏看见了，她不知作何感想，竟有些后悔和女儿约在家里吃饭了。</p><p class="story-paragraph">她总忍不住看她。</p><p class="story-paragraph">纱夏叉开十指将头发梳得整齐了些，这个动作没有持续多久——她紧接着去摸耳朵。</p><p class="story-paragraph">名井一开始还不明白女儿的用意，直到看见她取下左边雪花形状的那个耳钉后才慢半拍地反应过来。</p><p class="story-paragraph dialogue">“别摘…”</p><p class="story-paragraph">她条件反射地就拦住了女儿，纱夏挑挑眉毛，可能是被她有些严肃的表情吓到了，她偏过头，似乎是想看，但那个角度显然是看不到的。</p><p class="story-paragraph dialogue">“出血了吗？”纱夏问道，将头发挽到了耳后，离名井也更近了，好像是要她帮她检查一下。</p><p class="story-paragraph">名井自然不好意思直截了当地在这样的氛围之中将真实想法说出来，她在脑海里努力地寻找一个可以自圆其说的论点。</p><p class="story-paragraph">但纱夏好像等得太久，有些不耐烦了，再来她也确实担心出血，不敢用手摸。</p><p class="story-paragraph">名井看出女儿想去照镜子，她又不希望她取掉耳钉，只好出了下策。</p><p class="story-paragraph dialogue">“你戴着漂亮。”名井一字一字地说出来，想要赋予这句话最平淡的意味。</p><p class="story-paragraph">纱夏愣了愣，随即被逗笑了。</p><p class="story-paragraph">女儿眼尾上挑的样子让名井后知后觉地羞赧起来。她夸赞的力度太强了，像是一句无意又笨拙的表白。</p><p class="story-paragraph">纱夏好像在此时起了玩心，她们两方才就离得够近，逼仄的玄关没什么空间了，名井背后就是鞋柜，女儿害她退也退不得。</p><p class="story-paragraph">纱夏双手撑在台子上，一点都不介意继续在这样一副场面里火上浇油，倾斜了身体往她所在的方向倒。</p><p class="story-paragraph">她挺拔的鼻尖几乎要和她的相触，空气里藏着一点就炸的火星，两人融化在一起的呼吸也逐渐开始同频。</p><p class="story-paragraph">名井想低头，但纱夏的眼睛里藏着某种猎人与猎物共有的特质，那样强的吸力叫她挪不开视线，陷在那双荡漾着危险漩涡的眼睛里。</p><p class="story-paragraph">纱夏恰巧在此时停住了。</p><p class="story-paragraph">她用手穿过她散落头发的间隙，轻轻地捉住了她耳垂。</p><p class="story-paragraph">女儿捻得名井半边身子发麻，她耳后那一片柔软皮肤都在充血之下泛出了异样的颜色。</p><p class="story-paragraph">她还没来得及为自己露陷的反应找借口，几乎是那之后片刻的功夫，纱夏就体贴地稍稍退离了一些，这样顺畅的动作让名井生出一种她是无意为之的错觉。</p><p class="story-paragraph dialogue">“妈妈喜欢的话也可以去打一个。”女儿用的轻快语气也使她分不清这究竟是不是真心的建议。</p><p class="story-paragraph">她希望女儿是打算放过她，名井想提着她买的那一袋子新鲜河豚去厨房——它现在可怜兮兮地掉在地板上。</p><p class="story-paragraph">哪知道纱夏侧过脸对了她，她那副能惊艳所有人的容貌让名井挪不开眼。</p><p class="story-paragraph">女儿耳后的头发还好好地别着，鼻梁被光线打出了一条精致的阴影，锋利线条又在如此衬托之下显得万分惹眼。</p><p class="story-paragraph">这强行要她记起当她和纱夏接吻时究竟是发生了多少次碰撞事故。</p><p class="story-paragraph">女儿唇角此时含着的笑也是香甜的。</p><p class="story-paragraph dialogue">“既然妈妈想看，”纱夏没看她，却准确地将那枚耳钉投进了她掌心：“就帮我戴得更漂亮一点吧？”</p><p class="story-paragraph dialogue">“我还有几对。”女儿的言下之意是她想做什么都可以，这种明面上周全又懂事的考虑却越来越让名井有种被当众揭发做了坏事的亏心。</p><p class="story-paragraph">她进退维谷，无可奈何地遂了女儿，小心地将针穿过了她的耳洞，又将耳扣别在后面。</p><p class="story-paragraph dialogue">“好了，”她眼神闪躲地救起快要毁灭的晚餐原料，想起了自己还有家长能够动用的命令，便赶快给纱夏布置任务：“你去把衣服叠了。”</p><p class="story-paragraph">纱夏本来也是要做这件事，女儿和她指了一下厨房的方向就趿拉着棉拖鞋朝着里屋的房间走，名井也在透明的玻璃推拉门之后看到了两个灶台。“那几件新的别放进去，”名井对着她的背影讲话：“等吃完饭试一试。”</p><p class="story-paragraph">客厅的窗帘不知道处于何种原因拉上了，这也许就是刚刚进门特别暗的原因，她想着先准备晚餐，参观住所的事可以暂且放一放，也没有多管。</p><p class="story-paragraph">被打磨抛光的圆桌是象牙白的颜色，就摆在厨房的对面，桌子很大，看来纱夏也会将它当办公桌用，插着电源的笔记本放在上面，名井找出碗筷和边炉锅以后担心吃饭时惹出的油渍会弄脏女儿的电脑，便拖来一张椅子，想要转移它的阵地。</p><p class="story-paragraph">在抬起这台电子产品的时候，名井发现合上的屏幕和镶着键盘的底部间还夹了些纸。</p><p class="story-paragraph">这是女儿的习惯，名井说她好多次了：不要随手放一些重要的资料，要不然到时找也找不到。</p><p class="story-paragraph">但纱夏一直不怎么在意，还嘴硬说这样方便。</p><p class="story-paragraph">这期间名井竖着耳朵听卧室那边的动静，不管怎么说，偷偷翻女儿的私人物品是不对的，但是她也有作为母亲的好奇心。</p><p class="story-paragraph">女儿青春期时对她没有防备，可她和现在纱夏又已经不能像从前那样毫无芥蒂地交流了。</p><p class="story-paragraph">为了主动创造聊天的契机——名井在心里朝着女儿说了一句对不起，她稍微地掀起合盖，将里面的东西抽了出来。</p><p class="story-paragraph">没什么叫人特别惊喜的，名井不知怎么也松了口气。</p><p class="story-paragraph">她怕她一不小心看到什么连自己都接受不了的东西——好在不是，这只是纱夏备课用的教材，电子版打印出来的《英国文学简史》，封面左下角是纱夏手写的名字。</p><p class="story-paragraph">名井得到了有用的信息，她待会儿可以问问纱夏平时会带什么课，遇到的学生又是怎样的。</p><p class="story-paragraph">她往后翻了翻，想看看这本复印书是不是完整的，却发现后半部分和前面没有一点关系，而是某场悲剧的原文选段。</p><p class="story-paragraph">名井见了内容，眉心不住地一跳，才看出手上的册子其实是单独分开装订的两本复印件。</p><p class="story-paragraph">她用拇指划开了它们交界的缝隙，在扉页处看见了十几个人的名字。</p><p class="story-paragraph">题头告诉她这些人都是戏剧社一年级的社员。</p><p class="story-paragraph">名井将它的封面合上。</p><p class="story-paragraph">她想起了那个问纱夏的问题，而现在她得到了解答。</p><p class="story-paragraph">名井没有出声，悄悄地默念了一遍这个音译过来的外文，手指在印着“俄狄浦斯”的片假名上摩挲了两下。</p><p class="story-paragraph dialogue">——南今晚和她一起吃了火锅。</p><p class="story-paragraph">女儿好像是饿了，筷子几乎都没怎么停过。</p><p class="story-paragraph">南在纱夏低下头的时候会压着目光瞥她，她已经许久没有和女儿一起吃饭了。</p><p class="story-paragraph">摆在桌子中间的热锅腾腾地升起了雾气，而纱夏藏在那一边，她的五官在这样的氛围中显得柔和又沉静。</p><p class="story-paragraph">唯一违和的地方是她身上正式的西装，和烟火味这样重的这个小家格格不入。</p><p class="story-paragraph">这餐饭吃得很安静，除了最开始的那句“我开动了”和女儿被问到“好不好吃”以后肯定的回答，就只剩下碗筷碰在一起以后发出来丁零当啷的声音，还有被烧开的汤咕噜咕噜冒泡泡的响动。</p><p class="story-paragraph">纱夏很多习惯没有改，还是会埋着头喝汤，吃饭也会下意识地端着碗，她仍是不知道怎么和这个既陌生又熟悉的女儿亲近，只希望弄得还不错的晚餐可以为她在纱夏心里加点分。</p><p class="story-paragraph">她收起了肆无忌惮的打量眼神，也没有像自己想象的那样问女儿她所好奇的事。</p><p class="story-paragraph">残局是纱夏收拾的，她将碗筷都摆回洗碗池，两个人就是这点好，吃饭以后要做的清洁的工作不会很辛苦费力——就算她们吃的是大餐。</p><p class="story-paragraph">她没有洗碗，因为南主动提要求让纱夏带着她参观这个家，她认为屋子里出现过的清洁痕迹变相证明了女儿也有此想法。</p><p class="story-paragraph">纱夏路过茶几的时候顺手拿了两颗草莓糖，分了她一颗。</p><p class="story-paragraph">南跟着女儿一个房间又一个房间的转，这里不大，只有一间卧室，然后再是浴室厨房。</p><p class="story-paragraph">刚好睡下一个人的小床，同尺码同款式的拖鞋只有几双，摆在盥洗室里漱口杯和牙刷也只有一套。</p><p class="story-paragraph">纱夏是独居，南有些可耻地放了心，她知道这样不对，又从另一个角度开导自己：房子的面积小一点也好，她对此深有体会。</p><p class="story-paragraph">南很不喜欢每次回家时都胆战心惊地去检查床底下有没有人。</p><p class="story-paragraph">她从一个房间到另一个房间的时候都依依不舍的，也不愿意走。</p><p class="story-paragraph">虽然知道这种可能性很小，但南还是隐隐约约地担心，怕女儿下次就不会邀请她来这里作客了，毕竟如果不是她找理由主动联系纱夏，纱夏也不会找她。</p><p class="story-paragraph">南摸到了一点窍门，如果女儿还是对她不冷不淡的话，那么她便多关心她几次。</p><p class="story-paragraph">她参观的速度很慢，纱夏也耐心地等她，等她转了一圈又到了那个光线被遮挡着的客厅，女儿说那是她最偏爱的地方——从客厅往外搭出去的一个小平台，她可以在那里晒衣服，纱夏终于拉开几乎半天都罩着推拉门的厚窗帘，又将扣好的锁打开。</p><p class="story-paragraph">女儿从漆黑的高空中向下俯望，南也跟着她一起。纱夏住在七楼，无论是旁边亮着光的中国料理店招牌，还是寺庙屋顶的瓦片都不怎么清楚。</p><p class="story-paragraph">南眯起眼睛，她抬起目光，又平视着环顾了一圈这周围的环境，若有所思似地，最后用手指了指东南方向，那地方延伸过去的路线被墙壁挡住了，但南还是在说“你的学校在那边”，她的语气很笃定，像个知道压轴题如何注解的自负之人。</p><p class="story-paragraph">女儿算是默认。</p><p class="story-paragraph dialogue">“妈妈好厉害，”纱夏手肘撑在干净的铁栏杆上，用掌心托着下巴，好像是在笑：“我住了很久以后才发现的。”</p><p class="story-paragraph">南猜此言不虚，女儿的方向感一直不怎么强。</p><p class="story-paragraph">她心底泛起了一阵温暖的情意，伸了手去摸纱夏因为夜风缘故而轻轻拂动的头发。</p><p class="story-paragraph">女儿上身的衣物仍旧穿得单薄，南忍不住皱了眉头，夜晚潮气重，露水又凉，她也有其他要纱夏做的事。</p><p class="story-paragraph dialogue">“进去吧，”南帮纱夏拢了拢衣领，转而将手搭在她肩上，放软了语气：“试试新衣服合不合身。”</p><p class="story-paragraph">女儿已经挑出来那三件羊绒毛衣，折好了放在床头，吊牌都没有剪掉，支棱着从层叠的布料里探出来，显得有些乱。</p><p class="story-paragraph">南从靠窗的那边走过去，顺手拉好了帘子，她将最上面的那件抛在印着条纹的被子上。</p><p class="story-paragraph">不想冒犯女儿，她打算要纱夏选出来合适的，自己就坐在沙发上坐着等她，可靠近卧室门的纱夏边脱掉亚麻色的大衣边关上了出口，南还在犹豫，纱夏便拉起了衣摆，她有些慌张地移开目光，和被罚了站的木头人士兵一样，等着那阵悉悉索索的声音停下以后还没有马上回头。</p><p class="story-paragraph dialogue">“妈妈不帮我参考一下吗？”女儿撒娇的本领反倒在她们分别的这些日子里见长，南将这一切归功于纱夏狡猾的少女天性，她实在是想不出拒绝的理由。</p><p class="story-paragraph">纱夏穿着那件宽大的开襟毛衣乖乖站着，一点不自然的表现都没有，反而是她——心虚使得她脸上那张故作正派的面具慢慢裂开了口子。</p><p class="story-paragraph">南拗不过，认命似地轻轻叹了口气。</p><p class="story-paragraph">她听了导购的话，所以这衣服不是按她的审美标准挑的，但女儿穿着还算好看。</p><p class="story-paragraph dialogue">“还不错，比较好搭裤子，”南拉拉她的衣摆，有些不确认纱夏会不会喜欢这种款式：“你觉得呢？”</p><p class="story-paragraph">纱夏低头装模做样地看了一会。</p><p class="story-paragraph dialogue">“我也觉得不错。”她对她一笑。</p><p class="story-paragraph">南看到她女儿衣领底下透出的锁骨，急忙阻止要越过雷池的视线，捧来剩下的在怀抱里给她。</p><p class="story-paragraph">后面由她亲自挑的都没出什么差池，女儿直接将最后一件白色的低领毛衣穿在身上了。南见码数和颜色都很合适，便撕掉了拿胶纸贴好的标签，她的售后服务也很周到，新的和旧的都被南一视同仁地叠好。</p><p class="story-paragraph dialogue">“谢谢。”</p><p class="story-paragraph">纱夏就站在她旁边，看着她将它们塞进了衣柜里，下一句话却让南停下了动作。</p><p class="story-paragraph dialogue">“我还以为妈妈记不得我穿多大的衣服了。”</p><p class="story-paragraph">女儿的表情依旧是那样，她的嘴角挂着很礼貌的弧度，南不知道这里面究竟是对她的尊敬还是嘲讽。</p><p class="story-paragraph">又或者纱夏只是在表达一句不需要琢磨揣测，毫无含义的感想而已。</p><p class="story-paragraph">南没说话，忍气吞声久了，也不愿意再过度解度女儿的话，她重新摆放这次从家里的衣柜里带来的呢子衣。</p><p class="story-paragraph">一时间整个卧室里只有她们两人的呼吸声。</p><p class="story-paragraph dialogue">“不过就算忘记了，妈妈这么聪明，应该也有办法，”女儿站在她身后，南也没能再将她的动作继续下去：“我还有好多没有带走的放在家里。”</p><p class="story-paragraph">纱夏的确是在阴阳怪气地向她发起责难。</p><p class="story-paragraph">南依旧低着头沉默不语，她即使站在这里都能感觉到从那具年轻身体里散发出来的情绪波动。</p><p class="story-paragraph dialogue">“妈妈觉得这里怎么样？”</p><p class="story-paragraph">女儿现在这样倒真让她体会到什么是孩子的叛逆期，她突然想通了一个道理，也许每个家庭的孩子所有的不懂事都源自于教育问题。</p><p class="story-paragraph">她自知理亏，面对纱夏时所有的逃避和两年独自在外却不管不顾的冷漠都真切地在她孩子心上一刀又一刀地划着深深的伤口。</p><p class="story-paragraph">才会引来这样带刺的、让人喘不过气的声讨。</p><p class="story-paragraph dialogue">“一个人住刚好，”女儿没等她掰着指头似的在数优点：“离工作的地方近，租金也低。”</p><p class="story-paragraph">纱夏抬着头看她，而南好像是被放在火焰上炙烤，那烟雾熏得她眼前模糊一片，连女儿也在泪光里成了一个没有面容的人。</p><p class="story-paragraph dialogue">“我现在可以自己照顾自己了，”纱夏交出的答卷是与她背道而驰的想法：“你不用非要对我负责。”</p><p class="story-paragraph">她头脑里一片空白，想着通过回答纱夏的问题来坦明心意，盘桓她嘴边的话又多到她根本挑不出来。</p><p class="story-paragraph">南紧张地绞着手指，几乎快要无法呼吸，身体在说话的间隙之中剧烈地抖动。</p><p class="story-paragraph">温度明显偏高的水液已经在她眼眶里打了很久的转。她的声音变了调，搜肠刮肚地寻遍了所有理由，也还是那一句。</p><p class="story-paragraph dialogue">“我是你妈妈。”</p><p class="story-paragraph">这句话像铁链，将她们牢牢地捆在一起、捆在长满尖刺的高柱上。</p><p class="story-paragraph">她用这个理由做过好事，比如在纱夏受欺负的时候保护她，在物质条件上极尽所能地给她最好的。</p><p class="story-paragraph">小时候的纱夏也不敢来牵她，一个人以孤单的样子度过了那样的童年，南努力地用自己的肩膀替她分掉一半的疼痛，终于让她敢在想念她的时候抱着她撒娇，终于让她壮起胆子成为这个家的主人，每天颇有责任感地监督她少应酬、少喝酒。</p><p class="story-paragraph">她同样也用这个理由做了很多坏事，她甚至没收了纱夏那样干净的爱慕，而她现在竟可笑地想在她女儿身上讨回她曾收走的东西。</p><p class="story-paragraph dialogue">“你记得你是我妈妈。”女儿低垂着目光。</p><p class="story-paragraph">心中破土的疼痛带出了一片无法挽回的塌方，女儿说话的声音被像是在经历突发性耳鸣的管道削弱，南的大脑也被这种杂音被震得麻木难当。</p><p class="story-paragraph dialogue">“记不得其他的事情吗？”</p><p class="story-paragraph">她曾下定决心不会再像父亲那样软弱，所以她自以为是地做出了勇敢的事，那是她忍气吞声的人生里唯一一点不同于逆来顺受的东西。</p><p class="story-paragraph">她有勇气面对毒瘾，有勇气接受和女儿的分别，有勇气感受尊严全无的痛楚。</p><p class="story-paragraph">却像是误食了巫女的毒药一样，没有勇气开口对她说一句爱。</p><p class="story-paragraph">谁的心愿终于在数万个分分秒秒的虔诚祷告之下起了作用呢？</p><p class="story-paragraph">南不知道，也许是她的，也许是纱夏的，也许是她和纱夏一起的。</p><p class="story-paragraph">细小的、被有意埋藏在角落里那隐晦的爱意出现在某个不善言辞的人身上时的样子诡辩莫测。</p><p class="story-paragraph dialogue">“如果你是因为内疚才做这些事，”纱夏用一句话将她从回忆拉进了现实：“没有这个必要。”</p><p class="story-paragraph">变作汹涌的痛楚。</p><p class="story-paragraph dialogue">“不是…”她摇头，眼泪从她的脸颊上滚落下来。</p><p class="story-paragraph">南重复着强调，她含泪又带着血的心意终于冲出了困兽的囚牢。</p><p class="story-paragraph">变作一句话。</p><p class="story-paragraph dialogue">“不是内疚。”变作一个拥抱，或者是一个吻。</p><p class="story-paragraph">也变作两个支离破碎的灵魂在这世界里能找到的，几乎与幻梦长得一模一样，却又真实发生了的爱情。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">纱夏不打算这么快就原谅她。</p><p class="story-paragraph">妈妈和她在静默里拥吻，而这个吻真的变得又苦又甜，怎么说也说不完的话被卷进交缠在一起的气流里。</p><p class="story-paragraph">饶是她聪明，将妈妈真正的心意猜了个八九不离十。</p><p class="story-paragraph">纱夏侧着脸躲开了南追上来的动作，对她发红的眼圈熟视无睹似的，拿出欧美人的礼节同她周旋。</p><p class="story-paragraph dialogue">“妈妈要和我玩亲嘴的游戏吗？”她和她对视，知道二选其一的题目对南而言再也不难了。</p><p class="story-paragraph">表达或是继续掩埋，南作出这个决定以后便只能朝着一边使力气，直到将它们全部耗光为止——她不免地觉得自己实在是心眼小得可怜，竟然提早开窍地知道欺负妈妈了。</p><p class="story-paragraph">也真的长成了坏孩子，如果妈妈因此不要她了，她想她也没什么理由生气。</p><p class="story-paragraph">而一谈及抛弃的话题，纱夏便又不大高兴。</p><p class="story-paragraph">妈妈真是那样惜字如金的吗？</p><p class="story-paragraph">她是等了两年，在远渡重洋的另一个国家等来了一封又一封语法规整得连她都挑不出错的邮件，也没等到南的半句话。</p><p class="story-paragraph">她没办法说服自己，纱夏知道南是很好的辩手，所以她根本不相信妈妈在这些空白的岁月里就没有生出一句想要和她说的话——想亲口和她说的话。</p><p class="story-paragraph">纱夏忍着还没完全被驯化的少年心性，心却还是渐渐地软了，眉头也没皱得那么紧，不再像赌气的孩子那样因得不到糖果而和南闹别扭——糖果就在她手心里，等她拆掉糖纸。</p><p class="story-paragraph dialogue">“什么…游戏？”妈妈没听清楚她的问题，她真的哭得太凶，说话时也环着她脖子喘气，泪水将她的头发都蹭湿了，就像她也哭过一样。</p><p class="story-paragraph dialogue">“这样的。”她又低头和南接吻，只是轻轻地碰了碰。</p><p class="story-paragraph">天真的水光在她眼底荡漾，纱夏她知道南偏爱她的这一面，便颇有心机地，又娴熟地同那个与自己一起在爱河里颠簸了不知多少次的女人装出一副纯情的样子。</p><p class="story-paragraph">而南远比她想象之中还要害羞，她脸颊上晕染出与酒醉之人差不多有几分相像的神色。</p><p class="story-paragraph">那两抹红晕是因为憋着眼泪还是憋着她别扭的爱意呢？</p><p class="story-paragraph">纱夏不清楚，但那张遮羞的布如果被明面扯开，她就要真真正正得到妈妈彻底的爱了，不再只是母女之间的爱，而是不伦的爱，她追逐了这么久才拿到手的爱。</p><p class="story-paragraph">她们会是一对能够肆意玩耍的恋人，无论是什么游戏：歌牌游戏、接吻游戏、哪怕是更过分的游戏——都可以名正言顺地去做了。</p><p class="story-paragraph">纱夏朝下摩挲，牵住她的手，显然是为了去摸南那枚碍事的戒指。</p><p class="story-paragraph">她没有帮妈妈摘，只是用小指勾着她的无名指，好像是在签订某个神圣的契约，在心照不宣地篡改它原本的定义，为这个指环填上了从未出现过的赠予者姓名。</p><p class="story-paragraph">南依旧扎着头发，这为女孩宣示主权的幼稚举动提供了很便利的条件。</p><p class="story-paragraph">她像叼着幼猫的侧颈一样咬着妈妈的脖子，牙齿碾过她雪白的皮肤，埋在其下的青色血管也慢慢显了踪迹。</p><p class="story-paragraph">纱夏想她和妈妈一样坏，她窥见了南卑劣的占有欲，而她也早就不再纯洁，将自己的童贞献给了妈妈。</p><p class="story-paragraph">女孩将南一板一眼的制服弄得七零八落，掀开了她的包臀裙。</p><p class="story-paragraph">她手上的温度好像刺得南不舒服地哼了两声，纱夏懂事地抓着妈妈的屁股摩擦了几下，又逼着她抵着卧室门板，对方欲拒还迎的抵抗立马弱了下去。</p><p class="story-paragraph">妈妈微微蹙着的眉简直惹得纱夏都心生怜爱，她将她的上衣扣子也解开，直接拨掉了胸罩，两只柔软又有弹性的乳房没了束缚便立刻跳出来，纱夏低头去亲左边的，南从鼻子里闷闷地哼了一声。</p><p class="story-paragraph dialogue">“妈妈今天好性感。”纱夏忍不住对她说一句只有情人才能用的夸赞，她挑开南湿掉的内裤，将女人能感受到愉悦的性器官捏在手里把玩。</p><p class="story-paragraph">妈妈好像真的饿极了，不管是上面还是下面都像哭过一样。</p><p class="story-paragraph">淫靡又色情的气味沾到了褶摆裙，要不然纱夏也不可能闻得到。</p><p class="story-paragraph">妈妈的腰刚好顶住了门把手，她恐怕不够舒服，身体找不到支点似地胡乱发颤，纱夏想自己未免也太不解风情，还在不懂得怜香惜玉地在那之下几寸的位置作乱。</p><p class="story-paragraph dialogue">“转过去好不好？”表面请求实则是命令的邀约被对方迷迷糊糊地接受了，南用手肘撑在门板上，不用她接着说就主动翘起了屁股。</p><p class="story-paragraph">如此好的机会，纱夏不费任何力气就褪掉她下身着的裙料，她极有先见之明地剪了指甲，去刮那像软桃一样泛着香甜气味的果肉，刮得鲜蜜潮热的汁液不停地往外涌。</p><p class="story-paragraph">纱夏侧过脸吻她的头发，南几乎彻底为这个举动麻痹而动弹不得。</p><p class="story-paragraph">女儿在蚕食她的心跳，南咬着嘴唇不让自己叫得太放荡形骸，她想纱夏的名字简直是一道咒语，那魔力牢牢地牵着她。</p><p class="story-paragraph">红晕在南脸上翻涌，她感谢此时自己是背着女儿的，却又在灯光底下愈发地忸怩。纱夏明明已经是独当一面的大人了，在她面前又是那样需要她的母爱，或者是其他什么爱的臭小孩。</p><p class="story-paragraph">不那么黏人的纱夏反而没能让她轻松些，她甚至比小时候更难对付了：纱夏不再是那个什么都不明白的，懵懵懂懂的小女孩了，南第一次把自己给纱夏的时候尚且能稳住阵脚，而现在她正身体力行地告诉纱夏——她拿捏了她的弱点，她无法对其做出反抗。</p><p class="story-paragraph">无法接受她的离开。</p><p class="story-paragraph">无法让一切回到正轨。</p><p class="story-paragraph">无法失去…</p><p class="story-paragraph">她给予她的爱情。</p><p class="story-paragraph dialogue">“纱夏…”她呜咽着，垂下眉浅浅地啜泣，被肉欲以及同女儿缠绵悱恻的滋味、包括对年轻恋人的心动在内控制住：“太用力了…</p><p class="story-paragraph">下身咬合的软肉被纱夏一次又一次地破开，她腿间湿得像被水浇过。</p><p class="story-paragraph">南眼睛都不想睁开，她需要逼迫自己深深地呼吸才不至于因缺氧跪在地上。</p><p class="story-paragraph dialogue">“是妈妈太紧了…”</p><p class="story-paragraph">她自愿在一去不复返的陌路上狂奔，也有几分像俄狄浦斯王那样的悲惨，经历了谁降下的天罚。</p><p class="story-paragraph">妈妈赐予的爱治愈了她。</p><p class="story-paragraph">而现在纱夏又让这样美妙的新生从生理意义上的另一种角度实现。</p><p class="story-paragraph">她好像真的成为了那个沉寂子宫孕育出来的生命，要不然她也不会如此着迷于妈妈的阴道。</p><p class="story-paragraph">她在南温暖的身体里重生。</p><p class="story-paragraph dialogue">“姐姐…”</p><p class="story-paragraph">女儿毫无预兆的一句话让她的心跳跟着快速地朝着从未有过预期的限值飙升，她更加清晰地感受到纱夏的手指留在她内里的形状。</p><p class="story-paragraph dialogue">“不…”南不知道女儿直接抛开身份的呼唤会惹得她这么喜欢：“不要…这样…”</p><p class="story-paragraph">纱夏哪里肯听她的，叫得一声比一声甜，南从未有过妹妹，好像纱夏真的是她从哪里捡来的一个小她十二岁的妹妹。</p><p class="story-paragraph">女儿皮肤的味道好闻极了，比催情剂更能诱惑她。</p><p class="story-paragraph">年轻人的身体带着新鲜的热量，那样蓬勃又旺盛的生命力像太阳似的，刺眼夺目得让人心生胆怯，却又让她感到温暖。纱夏放荡的情话就是彻底抛弃掉伦常的称呼，她是叫她妈妈还是姐姐呢，南不知道，她薄弱的神智几乎完全丧失在无人之境。</p><p class="story-paragraph">她已经在不可避免地朝着另外一个深渊坠落，少年时代那样甜美的悸动多年以前就被纱夏唤醒。</p><p class="story-paragraph">那是和她女儿乱伦时不可避免的、陷入爱情里的瘾。</p><p class="story-paragraph">纱夏也许有偷偷地练习过，她也许和她一样，在通过手淫获得性高潮的时候叫着心上人的名字，那短促的音节被赋予了缠绵的定义。</p><p class="story-paragraph">女儿用她的名字来抚平她心中空洞缺损的地方——身体上空洞的那处也被她抚平。</p><p class="story-paragraph">纱夏在性与爱的浇灌下提早地成为了一个比她更加懂得如何寻欢作乐的女人。</p><p class="story-paragraph">看她这个淫荡的母亲被女儿玩成了什么样子，看她又是怎样求着纱夏放过自己——劝诫的警铃在她耳畔间回响，却一次又一次地被肉体碰撞的声音盖了过去。</p><p class="story-paragraph">她们回到了寻欢作乐的花园。</p><p class="story-paragraph">那是南梦寐以求都要去的地方，但这里哪比得上创世纪的伊甸神境：枯枝朽叶腐败的气味遮不住，喷泉的源头已经干涸，没有亚当和夏娃、没有乐善好施的耶和华，同样也没有诱劝血肉之身犯罪的毒蛇。</p><p class="story-paragraph">这里只有纱夏。</p><p class="story-paragraph">在南胸口里燃烧着圣洁却又罪恶的勇气，它们飘升至云层之上，跃动着迷乱的火舌。</p><p class="story-paragraph">她简直是误入了珀耳塞福涅的禁地，获得了此生永远无法被宽恕的罪孽。</p><p class="story-paragraph">那道诅咒如若是要降在她和纱夏身上，她便让她们成为整个世界的边缘之徒。</p><p class="story-paragraph">她和她要去连神明都找不着的地方。</p><p class="story-paragraph d
