  <div hidden aria-hidden="true"><template id="template-chapter-01"><section class="chapter" aria-labelledby="heading-chapter-01">
      <header class="chapter-heading">

        <h2 id="heading-chapter-01">边缘</h2>
        
      </header>
      <div class="chapter-copy"><aside class="publication-note" aria-label="作品简介与提示">
              <div><span>Summary</span><p>南作为养母、独自在东京抚养纱夏长大的故事。</p></div>
              <div><span>Notes</span><p>37line；背德；逆年龄差；养母 x 养女；请提前避雷</p></div>
            </aside><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">纱夏被铐在床头，标准大小的手铐显然不是适合她的尺寸，金属与手腕间多余的空隙让挣扎更容易留下痕迹。</p><p class="story-paragraph">意识飘在空中，快感被剥离以后依旧在身体里横冲直撞，她的理智自万米之高的悬崖跌落。</p><p class="story-paragraph">作乱的人居高临下地审视起纱夏，手指轻点在她的额头，一路往下滑，像念咒语一样呢喃：“纱夏的这里…”滑到她因解开衬衫扣子而暴露在空气里的双乳，滑到她平坦紧绷着的小腹，再直直探向她臀肉间湿润的裂缝：“还有这里…”</p><p class="story-paragraph">南自发地截住话头，换掌心去贴近纱夏的下身，温热的水渍舔舐起她手掌的纹路，她满意地看见纱夏主动抬了腰、讨好般地迎合起她的抚摸。</p><p class="story-paragraph">因为得到快慰，纱夏微微张开的嘴唇逸出几声喘息。</p><p class="story-paragraph dialogue">“勾搭其他人的时候倒不像现在这么乖。”</p><p class="story-paragraph">南眉梢染上少许怒气，她有意羞辱纱夏，却故作温柔地拨开了她穴口的那两片花瓣似的软肉——被爱液打湿之后显得脆弱又色情、粉嫩得像可以含在嘴里化掉的草莓果冻一样，这激起了南某种近乎变态的、想把她从里到外都弄得一团糟的暴虐心。</p><p class="story-paragraph">她故意不知轻重，大拇指有一下没一下地揉着探头的肉芽。身下承欢的人发出了像猫咪一样的呜咽，腿根也在发抖。“我…没有…”纱夏的眼泪在控诉南，却并不针对她在性事上的坏心眼，只想反驳她怀疑的态度。</p><p class="story-paragraph dialogue">“我是怎么教你的？”并未因此心软，纤长又特意被主人修剪得干净手指浅浅地探到纱夏的身体里，就是不彻底满足她。</p><p class="story-paragraph">要被一点点淹没了，就连骨头都泛起了酥酥麻麻的痒，羞人的、隐秘的情潮席卷了纱夏的世界，将她的太阳熄灭了。</p><p class="story-paragraph dialogue">“不能和…男孩子有…嗯…”说到最后的那刻南像报复似的将手指插进去了，纱夏满足地呻吟出声，可令人幸福的饱胀感觉只维持了短暂的一瞬，对方不顾她的乞求，还是顺利地抽了身，“啵”的一声在安静的室内里回荡，纱夏白皙的皮肤泛起一阵薄薄的粉红。</p><p class="story-paragraph dialogue">“你好像把我的话当耳旁风了。”</p><p class="story-paragraph">南眯起眼睛，相处了这么长时间，纱夏知道这是她发脾气的征兆，以前每次都是这样的——妈妈难得责怪她，却也有少见的被惹毛的时候，比如说现在，明明该被她疼爱的，可对面这个人的神色却格外冷冽，纱夏觉得她过分得很。</p><p class="story-paragraph dialogue">“我没有…是他突然…”女孩子眼里还残留着那点可怜兮兮的水光，又落了一滴泪下来：“我不知道…”</p><p class="story-paragraph">这么良好的认错态度，放在平时她是会放过纱夏的——如果没被她撞个正着。</p><p class="story-paragraph">因公务出差了几天，回来时想早点见到养女，南干脆开车去学校接她，好巧不巧就遇上了少年人告白的这一幕，那男孩不满足于口头上的示爱，被拒绝了也要以友谊的名义提出拥抱的请求。若不是南下车赶人的话，不知道他还要以暧昧的姿势圈住纱夏多久。</p><p class="story-paragraph dialogue">“你是…”</p><p class="story-paragraph">计划被打断的追求者相当紧张地观察起明显来意不善的女人，舌头有点打结。南面无表情时收放自如的气势封住了愣头青的嘴，她亮出母亲身份之后也无视了对方往后倒退时的慌张神情，转身带着纱夏走了。</p><p class="story-paragraph">回家路上车里的温度一路跌破冰点，纱夏好几次想开口说话，但也只是凝望着南紧闭的双唇，将句子吞了下去。</p><p class="story-paragraph">她从没见过妈妈这么对别人。</p><p class="story-paragraph dialogue">“我的纱夏长大了，想谈恋爱了？”南在强调，呼吸就落在她耳畔：“我的纱夏”。</p><p class="story-paragraph dialogue">“不想…不想恋爱…”</p><p class="story-paragraph">刚刚成年的少女不和同龄人一样对爱情抱有憧憬，反而抛出了截然不同的答案。</p><p class="story-paragraph">纱夏的果断掉进了陷阱，引得南满意的轻笑，她俯下身，吻在女儿那有着优美线条的下巴上，位置是她脸颊上未干泪水划出尾迹的终点。</p><p class="story-paragraph">南继续欺负她，舔舔纱夏的侧颈，覆了嘴唇上去，纱夏反应过来她是想留下什么印记，又被温热的鼻息激起一身战栗：“今天不行…明天要上课，会被同学看到的…”“小时候不听话要罚，长大了不听话也要…”南含糊其辞地回答，趁着纱夏分心的机会如愿弄出了让人遐想联翩的暧昧记号。</p><p class="story-paragraph dialogue">“明天不许穿高领的衣服。”</p><p class="story-paragraph">典型的家长式权威，得到了乖巧的应允她才停止。</p><p class="story-paragraph">南又去找女儿的胸乳，极有耐心地、像牙牙学语的孩子一样将纱夏小巧的乳头含在嘴里。她毫不留情地逮着了她的弱点，又以下位者的姿态抬起了视线，纱夏靠着墙，因为快感低垂着脑袋，目光相撞，养女那双盛着如糖浆一般甜蜜的浅色眼眸里装满了近乎病态的心甘情愿。</p><p class="story-paragraph">南知道无论自己做什么，纱夏都不会拒绝。</p><p class="story-paragraph dialogue">“妈妈…”纱夏恳求她：“要我…”</p><p class="story-paragraph">南终于不再像最开始那样冷漠，也亲昵地喊她的名字，因为纱夏几乎一丝不挂的身体露骨地昭示着她最赤诚的愿望。</p><p class="story-paragraph">她遂了女儿的心，一点点将她填满了。</p><p class="story-paragraph">纱夏哪经得起这番攻势，手腕被割破所带来的刺痛感在骚动，她的神经因此变得脆弱无比，这种令人害羞又甜蜜的冲撞诱惑起她，纱夏主动把两条长腿打得更开，迎合起南的动作，求饶声也变得细软。</p><p class="story-paragraph">少女美妙的身体像含苞的花骨朵，从里到外都要为了她绽放。</p><p class="story-paragraph">纱夏泄在了南手上。</p><p class="story-paragraph">没从高潮的余韵里缓过神来，她失了力气，双眼闭上了，还呜呜咽咽地小声啜泣，南不忍心再折磨她，她找来钥匙解开所谓的金属束缚，温柔地扣住纱夏被勒出红痕的细腕，打量起有些出血的伤口，好像用目光将它们吻过一遍。</p><p class="story-paragraph">纱夏被抱起来，南觉得女儿一点都不重，身体轻轻的，似乎从小到大都没怎么长过一样。</p><p class="story-paragraph">南允许她以环住自己脖子的举动来撒娇，女儿那般乖顺的模样总让人疼爱不已。她的视线黏在她脸庞上，尽管已经被当事人抗议过了，南还是能透过她的五官就轻易地捉住她小时候独有的那点模样，女儿容颜的那些变化是她在陪她长大时已经一一见证了的。</p><p class="story-paragraph">南轻轻柔柔地带纱夏回到床上，体贴地为她掖好被子，又退回客厅拿了从瑞士带回来的巧克力，她以尽量不打扰她休息的力度将三角柱形的糖果搁在浅棕色的床头柜上。</p><p class="story-paragraph">这些习惯都从未改变。</p><p class="story-paragraph">床头灯晕出了昏黄的色调，卧室里的氛围让这场景变得平凡：她在纱夏的额角留下了一个吻——就像这十年来，她们共同度过的大部分夜晚一样平凡。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph dialogue">“小南，你是否考虑过这有多残忍？”</p><p class="story-paragraph">南下定决心去求她父亲的法律顾问之前就知道对方会想办法拒绝她，她依然在预设的情境里寡言不语，沉默像长了脚一般地爬遍了整间房。</p><p class="story-paragraph dialogue">“未来的她要是知道你父亲做了什么事情，该会多…”</p><p class="story-paragraph">南少见不讲礼貌地斩断了他的话。</p><p class="story-paragraph dialogue">“这是唯一能弥补她的办法。”</p><p class="story-paragraph">也是唯一能拯救我的办法——她在心里这样祈祷如此愿望得以实现，却没了多余的勇气将它说出口。</p><p class="story-paragraph dialogue">“您应该知道那个孩子的经历，我可以用父亲留下的钱带她离开这里，只要保密…”</p><p class="story-paragraph">从父亲出事的那天起到现在，南身上几乎是发生了翻天覆地的变化，年轻女孩瘦削的肩膀和紧握的拳头让钟武心里五味杂陈。</p><p class="story-paragraph dialogue">“求您了，她如果继续留在这里，根本没办法…”</p><p class="story-paragraph">南在他反应过来前便支撑不住了，她双膝狠狠朝地板下坠，像是断了线一般的泪水滚落、砸得他动作一滞。</p><p class="story-paragraph">时间好像就要以此为起点，沿着这条线无穷无尽地延伸拉长，而就在要被绝望吞噬之前，南才得到了年长者肯定的回复。</p><p class="story-paragraph dialogue">“希望你能想好，”他几乎快要能发自内心地为她感到痛苦：“把她带在你身边意味着什么。”</p><p class="story-paragraph dialogue">“如果答案还是不变，我会立刻帮你准备，不过作为同行的你应该要清楚，”钟武的话语重心长，他既像她的长辈，也像她的老师：“身份和年龄都不具备收养人的条件，这样做是有风险的。既然是通过法律的灰色途径，就要做好失败的准备。”</p><p class="story-paragraph">好在一切顺利。</p><p class="story-paragraph">院长兴许是可怜纱夏，她对这个新来的孤儿很是关照：同情的方式有很多种，原先完好的家庭因悲剧而破碎，这比一开始就一无所有更令人心碎。</p><p class="story-paragraph">然后来了两个人，说要收养纱夏的女人看起来年轻，院长不知道能不能安心将纱夏托付给她，但她身旁那个处理文件的白胡子男人很可靠。</p><p class="story-paragraph">会不会有觉悟去照顾这个孩子？</p><p class="story-paragraph">院长无意间和南一直撇得低低的眼睛对视了——就连钟武也很意外，而直到现在南依然不大明白她为何会一改开始的模糊态度、又突然选择去做这段收养关系的公证人——他们本以为要伪造身份去领养这个孩子，到头来却没想到纱夏的名字能这么简单地同她的名字写在一起。南接过自己的公民信息册，看到女孩的姓氏端正地印在上面。</p><p class="story-paragraph">凑崎。</p><p class="story-paragraph">她懵懵的，这就有一个女儿了？</p><p class="story-paragraph">去领纱夏的那天，天气不好，下了暴雨。</p><p class="story-paragraph">南待在车里，她透过车窗提前看见被牵出来的纱夏，小孩就像木偶一样，无生气的四肢随着丝线摆动。</p><p class="story-paragraph">养女没问她是谁，也没说话，只是和她上了车，见到打包的行李把车后座堆得满满当当的诡异景象时也一言未发。</p><p class="story-paragraph">南就这样带着她离开了，临走之前，她想的也很简单——</p><p class="story-paragraph">不管去哪里、不管目的地在何处。</p><p class="story-paragraph">离这个该死的地方越远越好。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">这个孩子和她差了十几岁。</p><p class="story-paragraph">南是独生女，从未有过妹妹：她本苦恼于如何与纱夏交流，但对方像是未卜先知一般地直接为她解决了这烦恼——在南和纱夏相处的前一周，她没能从女孩嘴里听到任何一个音节，自然也不会面对她所认定的这个最为困难的问题。</p><p class="story-paragraph">除此之外纱夏表现得和正常孩子无异，她饿了会吃她准备好的饭，想上卫生间就去。南出门了她就乖乖呆在家里，南到家时也只向打开的大门投向简单的一瞥，见到她之后再接着做自己的事情。</p><p class="story-paragraph dialogue">“你是好人吗？”</p><p class="story-paragraph">那天，在南把晚饭端到餐桌上的时候，她听到纱夏的问题。</p><p class="story-paragraph">女孩的声音不大，听不出疏离亲近哪个占比更多，南舀饭的手不露痕迹地暂停了一秒。</p><p class="story-paragraph">她没回答，纱夏也没接着问。</p><p class="story-paragraph">这并不代表南就此动了退却的念头，她偷偷摸摸观察女孩，看出对方喝蟹肉味噌汤时神情最放松，于是选择在这个时候继续讨论前一个话题。</p><p class="story-paragraph dialogue">“以后就这样跟着我生活，可以吗？”</p><p class="story-paragraph">时机好像已经成熟了。南默数和纱夏一起生活的日子，快两个星期了。她发现纱夏的眼珠在滴溜溜地转动：小姑娘想得很认真。南也低头继续吃饭，她不想让纱夏觉得她是一个很期待回答的人，况且，就算纱夏说不可以，她也会继续带着她生活，直到——</p><p class="story-paragraph dialogue">“可以。”</p><p class="story-paragraph">她猝不及防地听到同意。</p><p class="story-paragraph">女孩很郑重地点头，这让南觉得意外。</p><p class="story-paragraph">纱夏补充，语气耐人寻味，好像她要回答的对象不止是南，还有她自己。</p><p class="story-paragraph dialogue">“除了爸爸妈妈以外…”纱夏低头盯着自己的足尖，将那个简单的理由告诉了她：“你是第一个对我这么好的人。”</p><p class="story-paragraph">她小小的鼻子一下就红了，是想起了伤心事。</p><p class="story-paragraph">南要去扯餐巾纸，却发现盒子里空空如也，上一包早早地被用完了，她还没来得及添上新的。</p><p class="story-paragraph">她只好用一种不熟悉的姿势去拥抱这个泪人儿。</p><p class="story-paragraph">南的手很巧，在读大学的日子里她靠着手工作一技之长还能赚上不少零用钱，这双手在安慰纱夏的时候却显得有点笨拙，顿了很久才准确地拭掉了她的眼泪。</p><p class="story-paragraph">因见证了父亲的罪行而开始漏风的泣血窟窿对南而言是致命伤，她不知道血肉模糊的伤痕是否会有彻底治愈的日子，而和这个女孩的缘分是被罪孽和绝望捆绑在一起的。</p><p class="story-paragraph">带着纱夏一起生活的决定…</p><p class="story-paragraph">只能借由时间告诉南是否正确。</p><p class="story-paragraph dialogue">“和我一起住的话，”南开出条件：“需要你做一件事情。”</p><p class="story-paragraph dialogue">“什么事？”纱夏眨巴着眼睛，怯生生地问，未干的水痕在小朋友还有些肉嘟嘟的脸上反光，衬得她可爱又委屈——女孩有点紧张地捏住了裙子的下摆。</p><p class="story-paragraph">她怕自己做不到，而如果做不到，是不是又要回孤儿院？</p><p class="story-paragraph dialogue">“以后要叫我妈妈。”</p><p class="story-paragraph">南吐词清晰，尽量让自己的表达不引起歧义。</p><p class="story-paragraph">纱夏还在她怀里抽泣，听了这话顿时往后退了一步。</p><p class="story-paragraph">她瞪得圆圆的眼睛很明显地表达了某种惊诧的情感。</p><p class="story-paragraph">什么？纱夏仔仔细细地观察起这个年轻女人的面容。南是完美的东方美人，秀眉下的那双眼携着一层难以名状的光彩，漆黑的瞳仁里倒映着白炽灯散落下的辉芒，换个角度看起来像是把钻石嵌进去一样精妙。</p><p class="story-paragraph">她的脸上有两颗痣，还是三颗，如果谁脸上有这么多位置明显的痣——纱夏肯定要说了，那样一点也不好看。</p><p class="story-paragraph">但道理放在这个人身上，显然大错特错。</p><p class="story-paragraph">以前的国文老师教过纱夏，桃花是能够被用来形容漂亮女人的，所以她也觉得南鼻子上的那颗痣是上天的恩赐，可能是桃花露水从上面滚落时也不忍离开，将错就错地驻足停留了。</p><p class="story-paragraph">小孩盯着她的脸看了老半天，好像发现什么怪物一样，盯得南直想笑。</p><p class="story-paragraph dialogue">“你有三十岁啦？”</p><p class="story-paragraph">就算再没见过世面…</p><p class="story-paragraph">不管纱夏打量她几次，也还是没办法相信面前的女人的年纪到了可以做她妈妈的份上，本以为再怎么过分，也该叫这人“姐姐”才对。</p><p class="story-paragraph dialogue">“没有，”南回忆了一下纱夏的年纪：“比你大十二岁。”</p><p class="story-paragraph dialogue">“噢…”纱夏若有所思地掰着手指去算：“二十二岁？”</p><p class="story-paragraph">她的小脸都皱成了一团。</p><p class="story-paragraph">纱夏的反应让南忍不住思考是不是自己太心急了，她本不打算主动请缨让这孩子叫自己妈妈。</p><p class="story-paragraph">母亲——南跳过了几个关键的步骤就要提前扮演这角色，她也觉得怪怪的，可转念一想，就连法律文书都承认了她们之间的关系，若不教会纱夏在公众场合这样叫自己，迟早会被人说闲话。</p><p class="story-paragraph">既然要戳到她的痛处，那干脆就提前一点——会尽全力去弥补她的——而且南的担忧也没有成为实在的困扰。孩子的注意力已经被转移了，那颗纯洁无暇的心此时正在纠结天真的问题：为什么要用“妈妈”来称呼一个二十二岁的姐姐。</p><p class="story-paragraph">被纱夏看得有点羞赧，南叫停了女孩无休止的观察。</p><p class="story-paragraph dialogue">“我的名字是名井南。”她告诉纱夏。</p><p class="story-paragraph">南又将这个罗马音重重地拼了一遍。</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">纱夏比想象中适应更快。她也不会再像以前一样，生硬地用“你”或“喂”这样的词去叫南。</p><p class="story-paragraph">原因很简单：直呼名字既没有礼貌，也让纱夏不好意思，叫姓氏的话又显得太生分，南明明对自己很好。</p><p class="story-paragraph">于是最开始磕磕绊绊说出的“妈妈”，现在能很自然地被纱夏用来呼唤南。</p><p class="story-paragraph">事实上，被叫到的人也可以心安理得地接受这个身份，南几乎见到了纱夏在青春期成长的全过程。</p><p class="story-paragraph">比如生理期，第一次来月经的时候女儿慌慌张张地跑来书房打断了她在周末还未完的工作，涨红了脸却支吾半天说不出口，像是在心里天人交战了一番才扯扯她的袖子，小声地念着“流血了”。</p><p class="story-paragraph">南吓了一跳，她还以为女儿哪里受伤了，直到看见对方裤子上晕出的那片淡红色才反应过来纱夏指的是月经。</p><p class="story-paragraph dialogue">“对不起，妈妈最近太忙，”南有点歉意地揉揉女孩的头：“连这件事情都没有和你说。”</p><p class="story-paragraph">纱夏的身体也开始发育，一起出门散步时南看出她最近不知怎地在含胸走路，通过循循善诱地对她提问才知道缘由——班里有顽皮的男孩爱拿女孩的胸部开玩笑，南知道那些言语会有多么不堪入耳，更何况是对一个刚步入青春期的女孩来说。</p><p class="story-paragraph">纱夏生得漂亮可爱，就算现在年纪还小，也足够引发异性间蠢蠢欲动的荷尔蒙效应了。</p><p class="story-paragraph">南挑了个时间去解决这麻烦、在家长会的那天拉着纱夏的手一起出现在教室里。</p><p class="story-paragraph">她特意穿上了正装，吸引了几乎在场所有人的眼光，没有太多人还在意老师说什么，压低了声音的讨论锁定在这对漂亮母女的身上。</p><p class="story-paragraph">议程结束以后南要纱夏给她指出罪魁祸首，她找着那两个男孩子的家长，单刀直入地奔向主题，让他们管好自己的儿子。</p><p class="story-paragraph">当天晚上南语重心长地和纱夏谈心，同她约定好和异性相处需要时刻保持距离的条令。</p><p class="story-paragraph dialogue">“不要有亲密的肢体接触，”南怕女儿受伤，就算说教独断霸道她也没改口：“保护好自己。”</p><p class="story-paragraph">在南给纱夏编了头发之后，两人之间的关系变得更好。</p><p class="story-paragraph">那阵子羊角辫的时尚席卷整个班级，纱夏羡慕极了同班同学，她用手指去卷过肩的长发，知道如果是自己要编，一定要花上好久的时间。</p><p class="story-paragraph">她又想起工作繁忙的妈妈，南看起来不像是会为这种事费心思的样子——哪知道只是在前一天晚上的饭桌上随口一提，第二天早上纱夏就被南提早叫醒。</p><p class="story-paragraph">爱赖床的女孩没睡饱，洗漱完之后坐在凳子上继续犯困。</p><p class="story-paragraph">南用手托着她的脑袋，指节灵活地在她发间穿梭，纱夏只闻到妈妈身上的香味，觉得她在头上施的力气让人舒服，于是安心地又睡了一会儿。等被送到学校的时候她才在同学们的夸奖中后知后觉，明白妈妈早上就是在满足自己的愿望。</p><p class="story-paragraph">纱夏在洗手台前的镜子前照出了这样漂亮的新发型，觉得妈妈给她辫的羊角辫是最好看的。</p><p class="story-paragraph">南是律师，虽然年轻，但在业界上已有了不少名气，免不了遇上几个居心不良的客户，应酬也躲不掉。</p><p class="story-paragraph">多数情况下——对方看她年轻貌美，揩油的手正准备落下，南也都靠“女儿”一词将好色之徒挡在门外，久而久之她发现这招行之有效，而为了从根源上解决麻烦，南真的给自己买了颗钻戒，若是还有不死心的人追问，她就说女儿已经十四岁了，那群如狼似虎的追求者因此跑走了不少。</p><p class="story-paragraph">南的人生已走到事业蒸蒸日上的阶段，在很多个深夜都沾得一身酒气回家，一般都是纱夏把南挪到她的卧室。</p><p class="story-paragraph">看着妈妈因醉酒而显得不太好受的表情，纱夏暗下决心：她以后绝对不碰这个坏东西。</p><p class="story-paragraph">时间是无情地走在前面的，纱夏才发觉她和南已经相遇这么久了——她看着南这几年来毫无变化的容貌，这张脸还有向着更美的方向发展的趋势。</p><p class="story-paragraph">南的秘密，她又知道多少？</p><p class="story-paragraph">几年前从孤儿院把她接走，容忍了她的沉默，又像阿拉丁神灯一样无所不能，在东京找到工作以前也有不容小觑的财力保障她的一日三餐。</p><p class="story-paragraph">入职日比谷的律师事务所以后妈妈压缩了陪伴自己的时间，纱夏为此还有些难过。</p><p class="story-paragraph">她的小脑袋其实是琢磨不出其中道理的，她也不知道为什么南会尽心尽力地照顾自己：纱夏发现妈妈好像是个天才，几乎没有不会的东西，而越是深入了解她，她就越无法理解。</p><p class="story-paragraph">南明明光芒万丈，能有更好的前途——小小年纪的人儿也懂，在这个世界上还有很多职业的薪资远超律师，妈妈大可以去做别的事，却依然选择孤身一人留在法律界。</p><p class="story-paragraph">纱夏觉得妈妈有时好像很累，但她也抓不到她的什么漏洞。</p><p class="story-paragraph">她为此特意问了南。</p><p class="story-paragraph dialogue">“为什么不像以前那样留在家里，那样我们也过得很好，做律师那么辛苦，”女孩观察着妈妈的表情：“有非做不可的理由吗？”</p><p class="story-paragraph dialogue">“再多钱也会有花完的时候，”纱夏看到南神色无异地回答自己：“我哪有不工作的道理？”</p><p class="story-paragraph">纱夏想说，那也可以做轻松的工作呀，而且我很好养活。</p><p class="story-paragraph">可是她还是没讲出来，她感觉妈妈的选择别有理由，这份万能的标准答案指意不明。</p><p class="story-paragraph">南肯定不坏的，工作再忙也不会忽略她的感受，周末还特意抽空要带她去出去走走，提出的物质要求甚至也都全部满足了。要说有什么不好的——纱夏唯一能挑出来的缺点，大概就是妈妈没能给她太多个人自由——除了上学时间以外，南不会让纱夏单独出门超过两个小时，这直接导致她和朋友见面都不能去看电影的憾事，每次都只能约在附近的咖啡馆简单喝个下午茶，等到两个小时被消耗得差不多了，纱夏就要和朋友告别，对方一般都会撇嘴说：“你妈妈管你管得好严”。</p><p class="story-paragraph">纱夏只好尽最大努力扬起一个显得不那么遗憾的微笑、为她妈妈说一句好话，再挥手和朋友说再见。</p><p class="story-paragraph">可她不怪妈妈。</p><p class="story-paragraph">甚至更过分，只要看到坐在自己身侧，那个专心看文件的南，纱夏心里冒出的幸福感就要溢满全身。</p><p class="story-paragraph">虽然她在世上再没有血脉相连的亲人，但她拥有名井南。</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph">纱夏的内衣要换了，少女的身体长势惊人，体重没怎么变化，曲线却是一天天地让人惊艳。</p><p class="story-paragraph">更早些时期的婴儿肥已经褪去，她眉眼间点缀了少年人才有的气质，这份不自知的美最能显露锋芒，一下子让南没回过神来。</p><p class="story-paragraph">南之前让纱夏穿自己的内衣——尽管看到纯黑的蕾丝花边时纱夏还是会脸红心跳，暗自腹诽妈妈怎么会选这样的款式，但她最后还是会乖乖听话。</p><p class="story-paragraph">日子过去，纱夏的胸部好像变得更丰满了，南的尺码她也穿不下了。</p><p class="story-paragraph">即使已经临近高中的最后一个学年，南依然爱把女儿留在身边，这次也不例外，是她带纱夏去女性用品店。</p><p class="story-paragraph">服务员在那边目测女孩的身高体重，尽职尽责地给顾客推荐了几款内衣，而南就在这边偷听纱夏的罩杯的大小。</p><p class="story-paragraph">此刻她玩心大起，但也没打算弄得太过分，只是顺手拿了一款印了豹纹的前扣式内衣，想捉弄一下这个纯情的丫头。</p><p class="story-paragraph">纱夏没想到妈妈会跟着自己一起进试衣间，可对方的动作太快，她还没来得及阻止南，门就关上了。</p><p class="story-paragraph">看着纱夏扭捏的样子，南觉得有点好笑。</p><p class="story-paragraph dialogue">“害羞什么呢？”</p><p class="story-paragraph">她伸手为纱夏解衣服，少女借着这个机会看到了南拿在手里的内衣，柔软的耳垂都因为充血变红。</p><p class="story-paragraph">南好像没在意这细节，她惊叹于纱夏的身体的变化——似乎用一只手就能握下女儿的腰，南感觉她裸露的肌肤因为自己过分的触摸被激起了一阵鸡皮疙瘩。</p><p class="story-paragraph dialogue">“是不是太冷了？”她抱歉地问。纱夏沉默着摇了摇头，她用左手搂着脱下来的衣服，像是抱着必死的决心一样挡在胸前，南为了这场景而忍俊不禁。</p><p class="story-paragraph dialogue">“那我就来帮纱夏解扣子吧。”</p><p class="story-paragraph">南从正面去拥抱女儿、双臂绕过了纱夏的后背，她单手拉开了不算繁琐的扣环，肩带顺着少女优美的肩膀弧线往下落，为了追求方便，南偏过脑袋去调整女儿的衣服，她垂下的头发在纱夏光裸圆润的肩头轻轻地搔了两下。</p><p class="story-paragraph dialogue">“嗯…”被弄得有点痒，女孩忍不住轻哼了一声。两人的头挨得很近，纱夏呼吸的热气熏得南耳朵一热，她受了这影响，没能在这狭小的空间里站稳，不小心跌坐在身后给顾客准备的试衣椅上，又借由惯性把女儿也拉到了自己的怀里。</p><p class="story-paragraph">纱夏捧着的衣服因为这次不清不楚的拉扯全部掉在了地上，她穿着的内衣也只是堪堪挂在身上。</p><p class="story-paragraph">刚解放的乳肉像是白兔一样，弹跳着落入南的眼里。</p><p class="story-paragraph">她没想到会这样。</p><p class="story-paragraph">正处在碧玉年华的女孩，胸型比想象中还要漂亮，半圆的形状好像很适合握在手中，两点自然地挺起来，白白嫩嫩的颜色适合坏人去留下痕迹。</p><p class="story-paragraph">纱夏本来就害羞，这下脸唰地红到了耳根。她挣扎着要站起来，不敢去和妈妈对视。</p><p class="story-paragraph">被腰间的力阻止了，南拦住了她的动作。</p><p class="story-paragraph">纱夏浑身的血液先是凝固，再一齐往头上涌——妈妈居然直接剥掉了她的内衣。</p><p class="story-paragraph">她在余光里能清楚地看见南与她之间越缩越短的距离，妈妈只要再往前探身就能…</p><p class="story-paragraph dialogue">“别动。”</p><p class="story-paragraph">南开了口，声音却哑得让两人都不由自主地心跳加速。</p><p class="story-paragraph dialogue">“我来帮你，”南颤抖的音调出卖了她此刻的心绪，饶是身经百战的律师在此刻也没办法控制自己的舌头：“方便一些。”</p><p class="story-paragraph">她后悔现在说话，幸好纱夏此时也根本没心思去捉她的马脚。</p><p class="story-paragraph">南的左手还搭在纱夏腰间，她探出右手把掉在地上的内衣捡起来。</p><p class="story-paragraph dialogue">“你先穿好。”</p><p class="story-paragraph">她将衣服递给纱夏，对方咬着唇接受了——南看着女儿半裸着身体坐在自己腿上扣内衣扣子，无来由的一阵口干舌燥。</p><p class="story-paragraph dialogue">“好了…”纱夏嗫嚅了一句。</p><p class="story-paragraph dialogue">“就这样？”她的眉头皱起来。</p><p class="story-paragraph">当母亲的角色太久，南很自然地担任了家长的义务，但受制于工作繁忙的局限性，南也没办法做得面面俱到，她不知道纱夏对这些小事这么不上心。</p><p class="story-paragraph dialogue">“你穿好了？”</p><p class="story-paragraph dialogue">“嗯？”</p><p class="story-paragraph">面对纱夏的疑问，南又觉得是自己的教育出了问题。</p><p class="story-paragraph">她正视纱夏，年下的目光在闪躲。</p><p class="story-paragraph">算是见过世面的人，南靠着年龄的优势比纱夏早一点缓过来。</p><p class="story-paragraph">强迫自己不要往歪门邪道上想，南自我催眠，只是教她怎么好好穿内衣，就像别人的妈妈那样，动作快些就好了。</p><p class="story-paragraph">就连南自己都没有反应过来——她其实完全可以用说话去解决问题——可那只手却不听理智的呐喊，硬是要挤进纱夏胸部和内衣之间的空隙。</p><p class="story-paragraph">顺着曲线滑下去的瞬间纱夏睁大了眼睛，虽然是小鹿一样无辜清澈的视线，但她的腰在往前挺，身体顺从地听了南的命令。</p><p class="story-paragraph">南清楚地感觉到本来不是那么明显的、可爱的存在正顶在她掌心，好像还在因为胆怯发着抖。</p><p class="story-paragraph">一点点微小的电流往心脏蔓延。</p><p class="story-paragraph">她去捞被挤在下面的乳肉，用手腕带动起五指，又沿着纱夏胸部的弧线划了个小圆，直到女儿的乳房完全地被包裹在罩杯的钢圈里。</p><p class="story-paragraph dialogue">“要这么穿，”南的眼睫闪得有些快：“要不然会对身体不好。”</p><p class="story-paragraph">南装出一副大人的样子——她本来也就是纱夏的大人，是纱夏的监护人，是纱夏名义上的养母。</p><p class="story-paragraph">她的底气稍微足了一点。</p><p class="story-paragraph">南终于把纱夏的腰松开，她顺势站起来，女儿也跟着起身，像做错事的孩子一样退到墙角。</p><p class="story-paragraph">她看一眼纱夏。</p><p class="story-paragraph dialogue">“之后就像我教你的那样，”南尽量让背影显得沉稳，逃也似地去找门把手：“剩下的你自己试，感觉尺码合适就拿出来，我给你买。”</p><p class="story-paragraph">两个人挤在一起显得狭窄的试衣间，退出一个又变得有许空旷。女孩把掉在地上的衣服都捡起来了。可她鬼使神差地先试起南给她拿的那件豹纹胸罩：大小刚刚好。</p><p class="story-paragraph">纱夏看着镜子里的自己。</p><p class="story-paragraph">妈妈…喜欢这样的吗？</p><p class="story-paragraph">脑海里闪过这个念头的时候，她方才如梦初醒。</p></div>

        <h2 id="heading-chapter-02">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">毕业旅行的地点定在了爱知县，南给纱夏提过意见，告诉她可以借这难得的机会出国旅游一趟，却被女儿拒绝了。</p><p class="story-paragraph dialogue">“我想和我们班同学一起去。”纱夏说这话的时候眼睛亮晶晶的。“他们说夏天最适合看花火大会了，可以直接穿泡温泉的浴袍出去，我还一次都没看过呢…这么大的烟火。”</p><p class="story-paragraph">南有点犹豫，单单让纱夏和同学出去旅行，她其实不太放心。</p><p class="story-paragraph">本来都想好了，也准备和事务所的老板请个假，好带纱夏去美国几个有名的大州玩一圈。</p><p class="story-paragraph">女儿很喜欢看漫威电影。结果还没来得及告诉她计划，纱夏突然就说要去爱知县了。</p><p class="story-paragraph">而且不是和她一起…</p><p class="story-paragraph dialogue">——是不是太自私了？女儿周身环绕着欢快的氛围，让南悄悄反省了自己的行为。好像的确是她把纱夏绑得太紧了，对方明明已经长大了。</p><p class="story-paragraph">换作是别人家的孩子，在这个年纪怕是都有夜不归宿的经历。但纱夏没有怨言地听她的话，每天放学就乖乖和她待在一起，同年龄相仿的朋友一起玩乐的时间，还不如和自己相处的时间多。</p><p class="story-paragraph">就连自己更年轻的时候…</p><p class="story-paragraph">南想起读大学时和寝室同学混迹酒吧的事迹，有些犯难。于情于理都不该再这样管着纱夏了，可一想到女儿也许会被机敏的朋友带着一起，某天对家长产生逆反心理…</p><p class="story-paragraph">她就莫名其妙地觉得烦闷。</p><p class="story-paragraph">纱夏在旁边站着，妈妈没说话。其实是个很正当的请求，她又有点心虚。</p><p class="story-paragraph">潜意识放话了，它告诉纱夏，像毕业旅行这样重要的事，主人是想和南一起去的。</p><p class="story-paragraph">可面对朋友的请求，纱夏同样也没有办法铁心拒绝。</p><p class="story-paragraph">平井桃给出的理由很充分。“平时都难得和我们一起玩，这次也不能来吗？纱夏已经十八岁了诶。”</p><p class="story-paragraph">纱夏的内心更偏向妈妈。但对于同伴，她也常常怀着不能赴约的愧疚感，于是便一口应下了。</p><p class="story-paragraph">更何况，桃描述的场景真的很动人，纱夏有过憧憬。</p><p class="story-paragraph">沿海城市在夏季的夜间是怎样的？潮热海风会温柔地抚乱人们的碎发、夜幕中划过灿烂轨迹的花火会停驻在这个瞬间。</p><p class="story-paragraph">反正从爱知县回来，也可以再和妈妈去别的地方。</p><p class="story-paragraph">相比之下，七八个人的局就不好再凑了，指不定过了这个时间，大家就会因各种乌七八糟的原因分别。和相识三年的同窗好友们一起，能拥有这样的旅行机会也实属难得。</p><p class="story-paragraph">纱夏有点紧张地把玩着衣服上的纽扣。“嗯，什么时候去？”南言下之意是准了，她一愣，马上反应过来。</p><p class="story-paragraph dialogue">“下周六！”女儿雀跃的欢呼把快乐铺散开，惹得她的嘴角也沾上了笑意。</p><p class="story-paragraph">算了，纱夏好歹也毕业了。读了大学以后，女儿又能再和自己待多久呢？</p><p class="story-paragraph">属于她的人生和梦想，也不能干涉太多。</p><p class="story-paragraph">南盯着墙纸有点脱落的一角出神。</p><p class="story-paragraph">纱夏如今长得比她还要稍高一点点，脸蛋出落得完美，单看鼻子的高度，可能会被怀疑成是外国人。</p><p class="story-paragraph">眼睛是琥珀色的，跳跃着灵动的天真感。即使经历了那种事，纱夏依然长成了善良的样子，这样的孩子，内心该有多么坚韧呢。自己把纱夏保护好了，是这样的吗？南不知道能不能自负地这样说。倾泻在纱夏身上的复杂感情太多了…她一心一意地，在八年以前就决定抛弃“名井南”的身份，只以照顾纱夏为理由继续活下去。</p><p class="story-paragraph">以为再也没办法拥有的那份属于普通人的感情，终于也在和纱夏一起生活的日子里频频现身。</p><p class="story-paragraph">究竟是她帮了纱夏，还是纱夏无暇的灵魂贴近了她的痛苦，治愈了她的伤口。这个问题，南没法回答。</p><p class="story-paragraph">岁月斑驳投下的光影，打翻了眼前的一切，浓墨重彩地给纱夏涂上了颜色。</p><p class="story-paragraph">尤其是在她眼里。</p><p class="story-paragraph">接触过再多人也好，南依然觉得纱夏的色彩是最鲜明的。</p><p class="story-paragraph">不管她有没有做好心理准备去接受纱夏未来的离去，有没有能够看开她已长大的事实——</p><p class="story-paragraph">南只能承认，在此时此刻的心绪作用之下，就算要把谎言织进每一次呼吸，她也不愿解开这份染血的缘分。</p><p class="story-paragraph">纱夏，她的养女，她的孩子…会理解她的偏执吗？</p><p class="story-paragraph">女孩背对着她。天气热，家里虽然开了空调，但纱夏还是出汗了，脖子上滚落的水珠让她的一举一动都被镀上了层不大真实的美感。</p><p class="story-paragraph">纳西索斯，女儿是如水仙花那样动人又致命的存在。</p><p class="story-paragraph">松松垮垮的丝绸外套下，裹着少女初长成的身体。她走路的时候，睡裙柔软的下摆会飘起来，南可以看到纱夏如嫩藕一般的白腿。</p><p class="story-paragraph">她下身没什么东西遮，只穿了一条黑色的热裤，紧翘的臀部被很好地包了起来。</p><p class="story-paragraph">南察觉到自己的视线没办法从纱夏的身体上离开。</p><p class="story-paragraph">她的头有点疼。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">再三确认没有遗漏下的东西，南开车把纱夏送到新干线站台。</p><p class="story-paragraph dialogue">“到了之后给我发个短信。”一时间也不知道该嘱托什么，分手之前，南的手搭在方向盘上，虽然是目视前方，但话说给女儿听。</p><p class="story-paragraph dialogue">“会的，”纱夏听话地应了，像想起什么，她转过头去看南，语气里衔着狡黠的笑意：“妈妈不要太想我。”</p><p class="story-paragraph">小孩一下子就知道调侃她了。南的神色带了点放松的意味。纱夏收到了桃的短信。</p><p class="story-paragraph">对方说她已经到了，就在进站的入口那里等她，为了方便纱夏找人，还特意穿了显眼颜色的衣服。</p><p class="story-paragraph">于是纱夏一眼就看到她的高中同学。桃的穿衣风格还是照惯，踩了双舒服的运动鞋，绿色的短 T 恤让整个人都清清爽爽，露在外面的小臂有漂亮的肌肉线条。</p><p class="story-paragraph dialogue">“看到她了。”纱夏和妈妈说，在车里给她指了一下拉着行李箱的平井桃：“那我下去啦？”</p><p class="story-paragraph">南伸手去按开后备箱的开关，点了点头：“路上注意安全。”纱夏解开安全带，清脆的声音响起，几乎是一瞬间，她感觉少女甘甜的气息混合着稍高一点的体温向她靠近。</p><p class="story-paragraph">南的脖子被纱夏环住，女儿飞快地在她脸上印下了一个吻，而又因为南偏头的缘故，她们的鼻尖短暂地碰在了一起。</p><p class="story-paragraph">纱夏像触电一样退开了，可两人的脸依然离得很近。</p><p class="story-paragraph">少女垂下了眼睫，脸颊上好像晕起了一抹飞红：“刚刚和你说的不算数，”她在害羞，支吾着不知道怎么把表达爱意的话说出口：“你要记得想我…我也会想你的。”</p><p class="story-paragraph">胸腔里都吸进了纱夏的味道，缠得南昏昏沉沉的。女孩的眼神使她心旌摇曳，空气中环绕着让人有些害怕的因子，好像在酝酿一场化学反应。纱夏一定要得到个答案，南有点无奈，在她不折不挠的眼神中败下阵来。</p><p class="story-paragraph">她揉揉纱夏的发顶：“会的。”只有趁着女儿下车去取行李的时候，她才能明目张胆地收拾起自己的情绪。</p><p class="story-paragraph">南轻轻抬手，停在纱夏方才落下那个吻的位置，只感觉被双唇碰过的肌肤滚烫地燃烧了起来。</p><p class="story-paragraph">上次亲吻纱夏，是什么时候？她其实不太擅长做这种肉麻的事情。</p><p class="story-paragraph">纱夏那时似乎还小吧，南也根本不知道怎么去对付孩子。真正的母亲一般会怎么做呢？她特意在记忆里长久地搜寻了一番，没找到答案。只是有意模仿电视剧里的温馨情节罢了，为的是象征性地奖励一下做得好的纱夏。价值观的问题：南觉得请纱夏吃一顿冰激凌远比亲吻更有意义。</p><p class="story-paragraph">纱夏最后朝她挥手，南才似梦初觉一般，回应她的信号。</p><p class="story-paragraph">女儿满足地转过身去，她留在车里，目送纱夏的离开。</p><p class="story-paragraph">年轻人不知道在说些什么。在她们进站之前，南看到平井桃亲密地把手搭在纱夏的肩膀上，女儿侧过头去聆听她说话。对谁都不设防，对谁都真诚得要命，南有点后悔，是不是把她保护得太好了？</p><p class="story-paragraph">这两人好像有很多要分享的事，以至于笑得眉眼弯弯。</p><p class="story-paragraph">她想再看看纱夏，眨眼间女儿就已消失在了车站的入口。</p><p class="story-paragraph">南瞥一眼后视镜里自己，差点被这个陌生又疯狂的女人吓一大跳。她凝望着那双眼睛。说实在话，南不确定那是不是自己的眼睛。可如果是…她在好奇。嫉妒为何会出现在其中？</p><p class="story-paragraph dialogue">“你妈妈开车送你来的？”桃问纱夏，女孩好像有点气喘，可是也没走多远。桃去看朋友的行李箱，看起来也不重的样子。</p><p class="story-paragraph dialogue">“嗯。”纱夏点头，她一直在想名井南，为了分散注意力，还特意给自己找了事做。比如现在，她正努力在人潮中寻找正确的站牌。可桃这家伙，又问到妈妈了。</p><p class="story-paragraph">能不能赶快结束这个话题？</p><p class="story-paragraph">南那张脸好不容易才从脑海里擦去，现在却又变得更醒目。</p><p class="story-paragraph">再想想什么吧。</p><p class="story-paragraph">她看着脚下的阶梯，发散的思绪终于落座，暗自庆幸今天没穿裙子，要不然该有多麻烦…</p><p class="story-paragraph dialogue">“真好啊，”桃在旁边嘟囔：“你妈妈好宠你，我爸妈就让我自己搭电车来。”</p><p class="story-paragraph">才转移的注意力又徒劳无功地回到起点。纱夏只好放弃了原有的想法。我的妈妈…</p><p class="story-paragraph">名井南。纱夏在心底念了一遍这个名字。来之前亲了她，不仅如此，还厚着脸皮要求她想自己…</p><p class="story-paragraph">她的语气不自觉地变得娇软，抬眼看平井桃的时候，都压不住欣喜。</p><p class="story-paragraph dialogue">“羡慕吧？”</p><p class="story-paragraph">那样子是在炫耀妈妈吗？</p><p class="story-paragraph">桃怀疑自己看错了。</p><p class="story-paragraph">这更像…炫耀爱人吧。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">抵达爱知县的时候，太阳还没落山，之前在网站上已经预约好了房间，纱夏掏出证件之后，从应侍生那拿到一把钥匙。</p><p class="story-paragraph">底部有温泉，不同于东京都市里用钢筋水泥搭起的大酒店，这座宾馆的结构是木质的，自然也没有电子门的存在。</p><p class="story-paragraph dialogue">“他们到了吗？”纱夏躺在榻榻米上问平井。她有点累了，一闭上双眼差点没陷到梦乡里去。“到了，说就等我们了。”平井靠着墙壁，在看手机，回复着他们聊天群里的消息。</p><p class="story-paragraph dialogue">“现在是去吃饭吗？”纱夏问，坐起身来打量室内的环境。“嗯，你收拾好了我们就走。”“那出发吧。”“哗啦”的声音让平井去看纱夏，她拉开了壁橱的门，弄出不小的噪音。“你干嘛把壁橱打开？”“想看看里面有没有哆啦 A 梦…”纱夏吐吐舌头，有点不舍地又关上它，和平井桃一起下楼了。</p><p class="story-paragraph">晚饭时刻很愉快，大家往日闹闲嘴的功力终于有发挥作用的地方了。</p><p class="story-paragraph">说中学时读书好辛苦，抱怨那几个臭名昭著的老师，也有些怀念那些迟到被罚站的日子。除此之外，几乎所有人都在谈论未来，都在提问。</p><p class="story-paragraph">大学是什么样子的？</p><p class="story-paragraph">纱夏是很想回答，可她也没经历过，以后有机会的话，还是要问问南。</p><p class="story-paragraph">下次聚在这里吃饭又该是什么样的光景呢？</p><p class="story-paragraph">她忍不住这样去想。</p><p class="story-paragraph">又加了一盘寿司，纱夏刻意点了鱼腩的，结果只是把鱼腩吃得一干二净，米饭留了不少。杏子第一次看到有人这么浪费食物，忍不住皱了眉头：“纱夏，你这吃法也太费钱了吧。”</p><p class="story-paragraph">桃向杏子递眼色：“她一直都这么吃，习惯就好。”“别在意嘛，”纱夏举起手边的小酒杯，她之前明明说过不会碰酒精的，可这么多人坐在一起，不喝反而会觉得不好意思：“吃得开心就好。”</p><p class="story-paragraph">杏子笑了，和她碰杯。</p><p class="story-paragraph">时钟指针转过七点半。眼见消食消得也差不多了，大家纷纷起身向下一个目的地转移。</p><p class="story-paragraph">负一楼的温泉池。</p><p class="story-paragraph">纱夏在楼层中间拿了消过毒的浴衣。挑尺码的时候她犹豫了一下，本来有四个尺码的浴衣，不知怎么缺了最小号的，她去问管理人员，对方很抱歉地告诉她，现在这个点刚好是泡温泉的高峰期，所有人都想舒舒服服地去看花火大会。这不，五分钟前才放了一件，又被人取走了。</p><p class="story-paragraph">纱夏只好退而求其次，把腰带多绑了一圈。她回房间的时候，室友已经准备好了。桃给刚冲完凉的她拿了个皮筋，纱夏两下就把头发扎好。</p><p class="story-paragraph dialogue">“等一下。”桃出声拦住了要开门出去的朋友。虽然素颜也很漂亮，她还是不由分说地给纱夏抹了口红。“泡完温泉就会花掉的。”纱夏扭头想躲，她本来也想稍微化点妆，正是考虑到待会要去温泉池子那种水涔涔的地方，才放弃的。</p><p class="story-paragraph dialogue">“只涂嘴巴就好，不容易掉色的，相信我。”桃松开她，打量她的脸庞：“漂亮。”男女汤池入口不一样，但还是有班上的男生在大厅等她们下来。</p><p class="story-paragraph">显然有人是奔着纱夏来的，阳太看到她的时候甚至往前走了一步。</p><p class="story-paragraph">女孩对此倒是没什么反应。她对“美”没有太多概念，不甚在意其他人眼中的自己。她的身边已经有名井南了。在纱夏心中，妈妈算得上是美的代名词。而且是“最美”。再说，她从来都只听南的话。</p><p class="story-paragraph">还没忘记小时候南专门去学校给她出头。也是多亏了妈妈，那两个爱说闲话的男生才再没骚扰过她。妈妈和她说要与异性保持距离来着，她都照做了。</p><p class="story-paragraph dialogue">“凑崎…”阳太有点腼腆地叫了她的姓，这个一米八的男孩子喜欢运动，身材匀称，除了肤色偏黑一点，好像暂时挑不出什么外貌上的缺点。</p><p class="story-paragraph">他挠挠头：“待会你去花火大会吗？”纱夏抬头看他，女孩的表情让阳太看痴了。</p><p class="story-paragraph">她露出了微笑：“当然会去。”阳太脸红，他很开心地笑，不敢直视凑崎的眼睛，只好说：“那待会儿见。”有几个男生在起哄，甚至连桃都在揶揄凑崎，声音压得低低的：“你看你，果然很有魅力。”</p><p class="story-paragraph">纱夏真的不觉得有什么好自豪的，她会微笑也只是因为“花火大会”本身就是一件很美好的事情，并不是因为问她的人是阳太。她去瞪桃，但一点威慑力都没有。</p><p class="story-paragraph">其他人走得比较快，纱夏被展厅里宣传花火大会的海报吸引了，看了一会儿，直到桃叫她走了，她才勉强挪了脚步。</p><p class="story-paragraph">桃走下楼梯，纱夏也跟着她转了个弯。结果前面的人突然站住了，纱夏没预料到，一下子撞到桃的背。</p><p class="story-paragraph">虽然叫着不要涂口红，但纱夏还是怕刚刚的碰撞会把口红弄花。于是她赶快去看有没有在平井桃的衣服上留下印子。</p><p class="story-paragraph">幸好没有。</p><p class="story-paragraph">桃还是没动，纱夏出声问她：“怎么不走了？”</p><p class="story-paragraph dialogue">“那个人…”缓了一会桃才开口，好像真的是被震撼到了：“好漂亮。”</p><p class="story-paragraph">怎么还犯起花痴来了，纱夏很无语。</p><p class="story-paragraph dialogue">“也只有你才会因为这种理…”</p><p class="story-paragraph">她的话戛然而止，因为在绕过桃以后，她也看见了那个人。</p><p class="story-paragraph">对她的侧脸再熟悉不过，纱夏甚至只要一个背影，就能一眼认出她来。女人没笑，纱夏知道她一个人的时候不太爱笑。但是依然不影响那份美貌，无论看过多少次，都没办法不被惊艳。</p><p class="story-paragraph">妈妈…？</p><p class="story-paragraph dialogue">“你还不是一样。”纱夏发愣的速度甚至比桃还要快，桃去反驳她。本来只是想要戏弄一下纱夏的，结果对方真的就像哑巴一样，半个字都没说出来，眼睛直直地盯着那个女人，恨不得要把她吃了。</p><p class="story-paragraph">桃看她这架势不像是开玩笑的，有点后怕：“你…原来喜欢这种？”纱夏根本听不见桃说话。同样，她也没办法开口叫住名井南。一向引以为豪的视力也没能成为底气，纱夏甚至都怀疑是不是自己看错了。</p><p class="story-paragraph">名井南现在不应该躺在东京新宿的家里休息吗？</p><p class="story-paragraph">问题好多，多到不知从何说起…为什么才分开又在这里见到？为什么会来爱知县？为什么和她出现在同一个酒店里？</p><p class="story-paragraph">就在这踌躇的当口，那女人转过身朝着另一个方向走了。“那边好像是私人汤池。”桃的声音给出了纱夏此刻最想听到的关键词。</p><p class="story-paragraph">她迅速看向桃，把对方吓了一跳。“你怎么知道的？”桃白她一眼，指了指旁边那个大到令人发指的路牌：“我开始还说呢，这么大的路牌就算是瞎子都能看见，没想到还真有人看不见，”她拿手去试纱夏的额头，假装是被烫到了：“你今天脑子有问题？”纱夏把桃的手拍掉了。“桃，你先去泡。”她转起脑筋来，要支开桃。“啊？那你呢？”朋友显然没这么好糊弄。“我有个东西忘拿了。”这借口也太蹩脚了，纱夏在心里给了自己一耳光。“什么东西啊？”桃锲而不舍地继续问。“就是…就是…”她有点着急，怕再不去名井南就不见了，可桃在这里磨磨唧唧的。</p><p class="story-paragraph dialogue">“就是很重要的东西。”不管了，纱夏把桃往入口那里推，自己又走回楼梯，作势要上去。她头也不回：“你先去吧，我待会就来了。”</p><p class="story-paragraph dialogue">“噢，那好吧，快点来就行…”桃也不介意，声音渐渐小了。纱夏闪到一边，靠在楼梯的拐角。有点紧张，她不知如何缓解这种情绪，背死死抵住了楼梯的扶手。</p><p class="story-paragraph">打开手机，纱夏点进了和南的聊天记录。最新一条回复也是在两个小时前。</p><p class="story-paragraph dialogue">“我已经到酒店了，晚上泡温泉，现在要去吃饭了。”“好，要多吃点。”</p><p class="story-paragraph">简短的回复。纱夏的手指在屏幕上敲击。打了几个字以后很快又删掉。</p><p class="story-paragraph">太激动了，这样不行。她抬起头思索了一下，编辑了一条看上去尽量显得普通的短信。“我准备泡温泉了，妈妈在家里干什么呢？”</p><p class="story-paragraph">信息发出去了，送达的提示却迟迟未现身。关机了吗？两分钟过去，她的手机死寂，还是没弹出“已送达”的标识。</p><p class="story-paragraph">纱夏的目光最终还是落在了私人汤池的入口。</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">拉开门的时候，她感觉冒着热气的水雾正从脚边逃窜。</p><p class="story-paragraph">肉眼可见的蜿蜒的痕迹，让纱夏在恍惚间以为这是白色的毒蛇。</p><p class="story-paragraph">换衣服的地方空无一人。插着钥匙的储物柜倒是关上了一个，其他的都敞开着，里面空空如也。</p><p class="story-paragraph">纱夏在取衣服的时候看到的浴衣只有三种，黄色、红色以及蓝色。</p><p class="story-paragraph">独独缺了绿色。</p><p class="story-paragraph">她现在看到篮子里装了一件浴衣，是绿色的布料——也就是四个尺码里最小的那件。喉头滚动了一下，她是赤足踩在席子上向前移动，并没有发出声音。</p><p class="story-paragraph">纱夏在出汗，她悬空的手轻轻放在里间的纸拉门上。</p><p class="story-paragraph">打开这道门，就能看到里面的人——只要她还在。</p><p class="story-paragraph">还在的，衣服还在这里，柜子也锁了一个。不止是身体在出汗，纱夏的心脏好像也在出汗。</p><p class="story-paragraph">露天的温泉，刚入夜的天空只浅抹上了黑色，边边角角的地方依然透明，能看到光亮。树梢从侧边向院内伸进枝桠，乡下的天空被星星点缀，从这个角度看，繁星正好落在了绿叶之间，变成了大地结出的果实。看不见月亮，只有水波荡漾出的银色反光暗示着它的存在，可能是被屋檐遮住了。靠着池子边缘的女人背对着纱夏。</p><p class="story-paragraph">她应该是听到声音了，却没有回头。这种优雅高贵的姿态，纱夏只在一个人身上见过。她抿了抿唇，吐出一个词：“妈妈…”</p><p class="story-paragraph">女孩小声试探的胆怯让南觉得可爱，但她还是很给面子地应了纱夏。</p><p class="story-paragraph">纱夏的呼吸差点停止了，她咬到了舌头。</p><p class="story-paragraph">南精致的脸颊上贴着零散的湿发，光裸的脖颈曲线优美，水珠顺着轨迹往下滑。她是第一次这样去看南。那张清丽的面容上闪着纱夏读不懂的表情。南举手投足间透露出矜贵的慵懒，让纱夏一下子忘记了两人的身份。流水让气氛更加的旖旎动人，本就是一副错落有致的工笔画，作为画里点睛之人的那尤物居然活了过来。</p><p class="story-paragraph">哪有爱美之人会错过一睹她风采的机会？纱夏情难自已，她想去触碰妈妈，去确认她的存在。南是人鱼，纱夏像海上被蛊惑心智的水手。她踩着漫出来的水，小小的水花溅起了微弱的涟漪。</p><p class="story-paragraph">南不必费心歌唱，纱夏也会为她调转船头。</p><p class="story-paragraph">她靠近了妈妈，两双眼睛在这期间没偏移过一寸，彼此的倒影都落在其中。南的身体被水温温柔柔地包裹住。纱夏意识到如果再不收敛视线，就会不可避免地看到她让人脸红心跳的部位。</p><p class="story-paragraph">她慌忙地转移了目光，可离得近了，她连妈妈的眼睛也不敢看了。</p><p class="story-paragraph dialogue">“你怎么来了？”纱夏憋了半天也只憋出这句话。南往前探，胸前的风光露出来更多，她不知道怎么办才好。“你涂了口红。”答非所问，南好听的声音让纱夏一下就醉了。真的是妈妈没错，她现在才敢相信。“不怎么样吗…”纱夏的眉毛耷拉下来，露出了泄气的表情。</p><p class="story-paragraph">妈妈实在是太美了，所有人在她身边都会黯然失色吧。南摇头：“好看。”</p><p class="story-paragraph">她用更笃定地口吻补了一句：“非常。”</p><p class="story-paragraph">女人把一只手从水里抬了起来，纱夏感觉南温热的手指贴向了她的脚踝。</p><p class="story-paragraph">幸好黑夜让人看不清表情。</p><p class="story-paragraph dialogue">“好看得想把…”南的语气有点不符合她性子的调皮，几个字弄得纱夏痒痒的：“纱夏也拉进来。”</p><p class="story-paragraph dialogue">“会被弄湿的。”纱夏被妈妈露骨的挑逗弄得脸红了，有点嗔怪地去反对这个提议。言语间单纯又色情的暗示，让南握她脚腕的手紧了紧。</p><p class="story-paragraph">少女不知道自己说了什么话。</p><p class="story-paragraph">南放开了纱夏，她好像用脚踩着温泉的壁沿，蹬了一下，以游泳的姿态划向更远的地方。</p><p class="story-paragraph">她被月光笼罩着住，像刚从天上降落凡间的女神。“那就把衣服脱了再下来。”南被自己这句话弄得胆战心惊。</p><p class="story-paragraph">但她太难掩饰了。对纱夏深不见底的欲望和索求，好像再不发泄出来，她就会被折磨至死。</p><p class="story-paragraph">妈妈今天的态度好霸道，纱夏却一点儿也不想拒绝。最开始她心里还在纠结，想耍赖，要和妈妈说她来是为了陪同学玩的，看她一眼就得走了。</p><p class="story-paragraph">现在她又已经把隔壁的朋友都忘得一干二净。</p><p class="story-paragraph">纱夏纤细的手指先移到腰间，灵巧地挑了几下，就把系好的结打开了。南看女孩的衣襟慢慢舒展，雪白的肌肤也露了出来。</p><p class="story-paragraph">就是没有下一步动作，她在咬唇害羞。</p><p class="story-paragraph">南心神领会地闭上了眼睛：“我不看。”</p><p class="story-paragraph">妈妈阖上了眼帘，一副淡然自若的样子，纱夏反倒更不好意思。细嫩的皮肤沾了点粉色，不知道是被热气熏的，还是羞的。</p><p class="story-paragraph">趁现在，纱夏把浴衣剥掉，放在一旁的椅子上。</p><p class="story-paragraph">她紧张地没顾得上名井南是否在偷看。把脚伸进水里，好舒服的温度，纱夏满足地舒了口气，才潜下来。确认自己只有锁骨露在外面，她才说话：“好了。”</p><p class="story-paragraph">南把头偏向一边去看纱夏。</p><p class="story-paragraph dialogue">“过来。”她宠溺地唤女儿，像是叫一只她最爱的小狗。</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph">其实以前分离过这么久的，甚至有更久的时候。</p><p class="story-paragraph">却没哪次，南有过这样的感觉。</p><p class="story-paragraph">如坐针毡，如芒在背。大脑不受控制地回放纱夏和平井聊天的画面。</p><p class="story-paragraph">随之而来的…是可以冲垮她的占有欲。</p><p class="story-paragraph">夏季的花火大会是年轻的恋人交换誓言的最好时机吧，她不知道平井桃喜不喜欢纱夏，就算不喜欢——她的女儿那么漂亮。</p><p class="story-paragraph">一想到同行的那群男生，那种病态的痛苦感，最终还是被引爆了。</p><p class="story-paragraph">女儿什么都告诉她，要去的酒店在哪，叫什么名字。</p><p class="story-paragraph">爱知县和东京都之间的距离不长，如果现在掉转车头，能抵达的，赶在纱夏去花火大会之前。</p><p class="story-paragraph">南把地图导航的应用打开。刚进多治见市，纱夏的短信就来了。女儿说是安全抵达，准备去吃饭。和她最开始预计的没错，还有更多充裕的时间。</p><p class="story-paragraph">把车停在附近的商场，她以最快的速度买了几件能应付的衣服。</p><p class="story-paragraph">出来得太急了，什么都没准备。赶到酒店的时候是七点，得亏南有钱，才能在旺季把最高层的单人房间给订下来。离花火大会开始的时间还早，既然来了也不能太奢侈地把这次机会浪费掉。她问是否还有私人温泉的位置，得到了肯定的回答之后，南去拿了浴衣，刚好只剩最后一件小码的了。</p><p class="story-paragraph">没有抱着刻意的心态，她下楼的时候，正巧看见有一群年轻的男孩子簇拥在一起。直觉告诉她这些人是纱夏的同学，为了印证，她等了好一会。</p><p class="story-paragraph">纱夏是挽着平井桃出来的，她们两睡一间屋子吗？以为到这就结束的挑战并未完。那个看上去最受欢迎的男孩子低头看纱夏，好像是在说什么。至于内容，在南眼里，十有八九是觊觎她女儿的可恶言论。如果，南心惊地想，如果纱夏喜欢她的同班男生。</p><p class="story-paragraph">两情相悦的话，她该怎么办才好？而且，既然是两情相悦，她又为何要阻止…</p><p class="story-paragraph">不知道…南的脑子很混乱。</p><p class="story-paragraph">趁现在拦下纱夏，她只给了自己这个选择。</p><p class="story-paragraph">拦下女儿。</p><p class="story-paragraph">想着顺其自然的那份从容消失得无影无踪，南在确认纱夏看到自己之后，才进了汤池。</p><p class="story-paragraph">她起先是面对着更衣室的，直到女孩的影子离那道门越来越近，南才心满意足地转过去。</p><p class="story-paragraph">纱夏的睫毛已经拢了水珠，肩膀好像在颤抖，南把手覆上去，纱夏被她拉得靠近了一点。她示意纱夏用背对着她，所以等女儿转了个圈，南才再把手搭在对方的肩膀上。</p><p class="story-paragraph">在给自己按摩，纱夏想，妈妈手上的力气用得恰到好处，手部的皮肤保养得也好。</p><p class="story-paragraph">把她按得软绵绵的，纱夏的意识浸泡在温泉里，有点涣散。</p><p class="story-paragraph dialogue">“你…待到什么时候？”纱夏还想问妈妈为什么来，但她才吃了闭门羹，只好换一个问题。“明天有事，上午就走。”</p><p class="story-paragraph">纱夏明了，她的言下之意就是：现在没事。</p><p class="story-paragraph">南来这里不是出公差。</p><p class="story-paragraph">看纱夏沉默，南换了手法去捏她的脖子：“和同学们玩得怎么样？”“嗯…很好。”被按得舒服，纱夏吐出绵长的气音。</p><p class="story-paragraph">南的小腹一紧，差点就没控制好劲。让心智安定下来，她才接着问。“等会儿去看花火，路线计划好了吗？”</p><p class="story-paragraph">妈妈向来虑事周道，纱夏经这一提醒才想起等会还要和同学出去，这下有点不情愿了。“计划好了…”听出纱夏撒娇的意味。南笑吟吟的：“你听上去不开心。”</p><p class="story-paragraph dialogue">“还好啦。”纱夏有点抱怨地去想，妈妈要是没来就好了，和她呆在一起的缱绻情意就不会被拿来当作对比，衬得什么事情都索然无味了。</p><p class="story-paragraph dialogue">“有什么想做的吗？”</p><p class="story-paragraph dialogue">“想和…”差点把整句话都说出来，纱夏忙不迭地把“你”字往里吞。都多大了，还这么黏妈妈，会被嫌弃的吧。</p><p class="story-paragraph">虽然妈妈好像压根不在意，但她还是有点好面子的。“纱夏想和喜欢的人去看花火吗？”她眉心一跳，简单地思索了一下。</p><p class="story-paragraph">如果说…南就是自己最喜欢的人。那应该也是可以的吧？</p><p class="story-paragraph">纱夏干脆应了：“嗯。”</p><p class="story-paragraph">这个答案却在南那里掀起了巨大的风浪，她只不过是想试探。没成想，纱夏的答案居然真的是肯定。现在南哪里会想得到，纱夏口中说的人就是自己。</p><p class="story-paragraph">她生硬地用错误的念头去理解：“是那个男孩子吗？”</p><p class="story-paragraph">控制不住的情绪使她的语气变得酸溜溜的。</p><p class="story-paragraph dialogue">“什么男孩子？”因为二人心中的人选对不上，纱夏没反应过来。“在大厅找你说话的那个。”女孩有点急切地转过身，露了侧脸在南面前，和她辩解：“才没有那回事，我不喜欢他。”</p><p class="story-paragraph">怎么连这个都被看到了？纱夏心里七上八下的。“这样。”南屈起指节弹了女儿的额头，她放心不少。很了解纱夏的微表情。不是在说谎，看来女儿是真的不喜欢他。</p><p class="story-paragraph dialogue">“那是谁？”南继续问，语气有点玩味：“纱夏该不会读书的时候就早恋了吧，不告诉我吗？”</p><p class="story-paragraph">心中想着的人是名井南，结果妈妈竟然用“早恋”这个词去概括这样的感情。“没有早恋。”纱夏的头摇得像波浪鼓，脸不争气地红了。</p><p class="story-paragraph">她费力地去琢磨“早恋”一词暗含的意思。</p><p class="story-paragraph">要“早恋”的话，得是爱情。</p><p class="story-paragraph">哪里出了问题？纱夏突然找不到反驳妈妈的底气。</p><p class="story-paragraph">女儿不说话了，南敏锐地察觉到第二个回答是有猫腻的。</p><p class="story-paragraph">可是，还有必要刨根问底吗，得到回答又有什么用呢？</p><p class="story-paragraph">纱夏的想法和她那龌龊心思所希冀的不可能一样吧。</p><p class="story-paragraph">已经问得够多了。</p><p class="story-paragraph">纱夏听到南的叹气声。“纱夏…”妈妈好像在强忍着什么，第一次这样去叫她。女孩的心脏跳得很快。</p><p class="story-paragraph">妈妈的下巴轻轻靠住了她的肩膀。</p><p class="story-paragraph">南的青丝被挽起来，两人的皮肤亲密地贴在了一起，鬓发厮磨。</p><p class="story-paragraph">纱夏半边身子都麻了，快要站不稳。</p><p class="story-paragraph">她感觉，妈妈的手先是降落在她的肩膀，再隐晦地路过她的肋骨。要是靠得更近一点，纱夏被这个念头弄得心悸。</p><p class="story-paragraph">这双手就可以把她的胸乳握在手里。</p><p class="story-paragraph">她眼角泛红，没意识到有什么东西在她身上蔓延。</p><p class="story-paragraph">南最后缠住了她的腰。</p><p class="story-paragraph">又来了，她们两人之间那阵不清不楚的情潮。之前都只没到小腿肚，这次干脆是直接让人溺亡的高度。汹涌的，让人喘不过气来。</p></div>

      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">男孩从熙熙攘攘的人群挤出来，叫了纱夏和桃的名字。</p><p class="story-paragraph dialogue">“来尝尝虾饼。”</p><p class="story-paragraph">是森川，他和阳太关系很好。</p><p class="story-paragraph dialogue">“听说是每年花火祭夜市里卖得最好的小吃。”</p><p class="story-paragraph">作为最早知道兄弟喜欢纱夏的人，森川是来邀功的。</p><p class="story-paragraph dialogue">“不知道对不对得起阳太排这么久的队。”</p><p class="story-paragraph dialogue">“那阳太君呢？”桃买了他的账，往同学身后张望：“他不来试试味道吗？”</p><p class="story-paragraph dialogue">“我们买了好几份，他还在等，”森川在偷偷瞟纱夏，想看她什么反应，好向阳太汇报：“想先给你们吃，就叫老板把这一份拿出来了。”</p><p class="story-paragraph">桃很乐意，逛了这么久也差不多饿了：“阳太君真是体贴。”</p><p class="story-paragraph">她知道，如果这会儿纱夏没站在她身边，自己估计是没可能吃到这份虾饼的。</p><p class="story-paragraph">受人恩惠者可不能就这样没心没肺地独吞好处，她补充一句。</p><p class="story-paragraph dialogue">“森川君也辛苦了，给我们送过来，就和我们一起吃吧？”</p><p class="story-paragraph">桃用手肘捅了一下从花火大会开始到现在一直心不在焉的纱夏，用只有两个人才听得到的音量提醒她：“阳太那家伙是给你买的，赶快说声谢谢。”</p><p class="story-paragraph dialogue">“真是太谢谢了。”纱夏理了理一团乱麻的心，知道在比肩继踵的集市上买到热门小吃不容易，所以也还算是真诚地作出了回应。</p><p class="story-paragraph">得了这句感谢，森川的反应可能会让人误以为喜欢纱夏的是他本人而不是阳太。</p><p class="story-paragraph">大概是男生间相处时的义气作祟吧？</p><p class="story-paragraph">既然已经听到了这句话，森川摆手。</p><p class="story-paragraph dialogue">“我的那一份还在摊子上做呢，就两块，塞牙缝垫垫肚子而已，”他找借口撤退：“你们吃就是，我去看看他们。”</p><p class="story-paragraph">目送森川离开，桃才问纱夏：“你还好吗？肚子是不舒服吗？”</p><p class="story-paragraph dialogue">“还好，”纱夏没想到自己在这次旅行中，居然沦落成要厚着脸皮说谎的人：“就是有点累。”</p><p class="story-paragraph">不过这句话也不完全是谎言，纱夏的确累了。</p><p class="story-paragraph">如果要作比较，来时那高涨的兴致至少抹去了一半。</p><p class="story-paragraph">她的身体待在这里，心还留在另一个人的身边。</p><p class="story-paragraph">妈妈现在在做什么？</p><p class="story-paragraph">纱夏抬起头。</p><p class="story-paragraph">这一次比一次盛大夺目，吸引人的银花火树，此刻也像落入她眼里那样，落入了南的眼里吗？</p><p class="story-paragraph">留在耳边潮热的吐息好像黏在了触觉神经上，纱夏时不时抬起手去抚弄一下右边的耳朵。</p><p class="story-paragraph">自这里为起点，泛出了噬人心骨的痒。</p><p class="story-paragraph">从汤池里带出来的心跳还没有彻底平息。如果不是桃突然打电话来。</p><p class="story-paragraph">她今晚有可能真的会因缺氧死在妈妈的怀抱里。</p><p class="story-paragraph">手机的响动惊醒了池子中央的两人，纱夏看到她脱在椅子上的浴衣有一块布料被照得发亮。</p><p class="story-paragraph">那是还没来得及存进柜子里的手机。</p><p class="story-paragraph">铃声在这静默的时刻里中断了越燃越旺的火势。</p><p class="story-paragraph">南好像不紧不慢的。</p><p class="story-paragraph">纱夏感觉腰间存在感极强的那双手在放开之前还轻轻捏了捏她的腰。</p><p class="story-paragraph dialogue">“纱夏再这样发呆，是会被同学认为在做坏事的哦。”</p><p class="story-paragraph">被妈妈弄得久久回不过神来，她这下才逆着水流往岸边走。</p><p class="story-paragraph">纱夏的手指在干燥的浴衣上蹭了蹭。</p><p class="story-paragraph">看了眼屏幕，是桃打来的。</p><p class="story-paragraph">她才想起来，之前说好的，待会儿就去汤池里找桃，一个不小心就在妈妈这里赖上了。</p><p class="story-paragraph">纱夏回过头，南的神态倒是自在得很，好像始作俑者不是她。</p><p class="story-paragraph">不是她哄骗纱夏脱衣服下来，也不是她诱惑纱夏去忘记与同伴之间的约定。</p><p class="story-paragraph dialogue">“纱夏去哪了？怎么没看到你，我们都泡完出来了。”</p><p class="story-paragraph dialogue">“那个…桃，”纱夏支支吾吾的，终于找到一个借口：“我来姨妈了…”</p><p class="story-paragraph">她努力忽视名井南无声的轻笑。</p><p class="story-paragraph dialogue">“这么不巧…买到了卫生巾吗？”</p><p class="story-paragraph dialogue">“买到了，去了边上的便利店。”</p><p class="story-paragraph">纱夏有点心虚。</p><p class="story-paragraph">这周围有便利店吗？她搜索着来时的记忆。</p><p class="story-paragraph dialogue">“放回房间没？身体有没有难受？”</p><p class="story-paragraph">好在桃也没展开多问。</p><p class="story-paragraph dialogue">“嗯…我没事的。”“那就好，我们在这里喝大麦茶，里面还有几个人没出来，”桃停顿了一下，好像在数缺席的同学：“待会儿门口见？”</p><p class="story-paragraph dialogue">“好。”纱夏小心地挂断了电话，才安定下来。</p><p class="story-paragraph dialogue">“好像小瞧了纱夏骗人的功夫，”南双手抱胸，表情耐人寻味：“有没有骗过我？”</p><p class="story-paragraph dialogue">“没有！”纱夏急忙否认：“而且还不是因为妈妈，我才…”</p><p class="story-paragraph">她停住了，想要控诉南。</p><p class="story-paragraph">但要控诉她，就得把妈妈刚刚在她身上做的事情都列举出来，那是罪名。</p><p class="story-paragraph">南看纱夏低眉垂眼，羞态毕露的样子，心情好得要命，一路上的那些郁闷气结都消失了。</p><p class="story-paragraph dialogue">“快去吧，晚了就会错过烟花的。”她决定放纱夏一马。</p><p class="story-paragraph">妈妈终于不揪着小尾巴逗她，纱夏听她的话，手扶着岸边，她准备借水的浮力起身，再踩着台阶上去。</p><p class="story-paragraph">身后又有水流的声音，她用余光发觉妈妈正在往她这里游。</p><p class="story-paragraph">她停在了纱夏的正前面。</p><p class="story-paragraph dialogue">“怎么了吗？”女孩疑惑的音调甜美动听，像羽毛一般拂过南的心头。</p><p class="story-paragraph">轻捷的羽毛再掉落，落在月色无边的水面上。</p><p class="story-paragraph">南摇摇头：“没什么。”</p><p class="story-paragraph">但她的身体在说反话，并且离纱夏越来越近。</p><p class="story-paragraph">这次换过来了，换南亲在纱夏的下巴。</p><p class="story-paragraph dialogue">“纱夏也是，记得想妈妈。”</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">一语成谶。</p><p class="story-paragraph">因为想着妈妈，纱夏在夜市穿行的时候，一直琢磨着要给南带点礼物。</p><p class="story-paragraph">她不爱在晚上吃东西，所以食物全部被纱夏在心里否决。</p><p class="story-paragraph">女孩在人头攒动的路边摊买了个纪念品，是绘了烟花图案的御守，下面写着“平安”二字。除此之外，纱夏还决定和南分享今晚的记忆。</p><p class="story-paragraph">她打算用手机拍张照，背景定为以黑夜为幕布的烟火舞台。可无论她怎么试，都没有捕捉到烟花完全在空中绽放的那最美的一瞬——至少在她眼里，怎么拍都不够完美。</p><p class="story-paragraph">摆弄了好一阵子，纱夏都快放弃了。</p><p class="story-paragraph dialogue">“凑崎？”是阳太的声音，纱夏看到他站到自己身边来：“你在做什么？”</p><p class="story-paragraph dialogue">“啊…我想拍烟花，”她有点不好意思，咬住了嘴唇：“但好像都拍得很丑。”</p><p class="story-paragraph dialogue">“不介意的话，”阳太伸出手，做出一个请求的手势：“我可以帮你。”</p><p class="story-paragraph">想起这个男生是摄影同好会的会员，纱夏没怎么犹豫就把手机给他，阳太翻了几张所谓的“失败品”。</p><p class="story-paragraph dialogue">“凑崎对自己要求很严嘛，拍得其实都不错。”</p><p class="story-paragraph">他点开相机，因身高优势把镜头举得更高了。阳太调试了几下，他耐心地等待光影在空中舞动，在那时按下快门键。</p><p class="story-paragraph dialogue">“这样可以吗？”阳太把手机递给纱夏，纱夏凑过来看。</p><p class="story-paragraph dialogue">“拍得真好。”</p><p class="story-paragraph">纱夏忍不住感叹，她和阳太一齐低着头看那张好看的相片。</p><p class="story-paragraph">金色的花火在空中闪耀出绚烂的光芒，烟火的光迹把夜晚的天空以一种精巧的比率切割开来。</p><p class="story-paragraph">专业的果然就是不一样，纱夏真诚地对阳太说了一声谢谢。</p><p class="story-paragraph">她沐浴过后残留在发间的香气被阳太闻到了，女孩漂亮的脸因屏幕的微光而被照亮。他的太阳穴因心动在突突地跳着，那只垂下的手握成拳头，趁纱夏还在用手机的时候给自己打气。</p><p class="story-paragraph">几个知趣的朋友都已经闪开，识眼色地给他留了二人独处的空间。纱夏点开和妈妈的对话框，她发现前一条发出去的短信气泡被标记了“已读”。</p><p class="story-paragraph">把刚刚阳太拍下的照片拉进来。纱夏编辑了短信。</p><p class="story-paragraph">”本来想由我自己拍的，但是还是托同学帮忙了，因为这样才能给你看最漂亮的烟花。“</p><p class="story-paragraph">她点了发送键，放下了手机。阳太看她停下动作望过来。</p><p class="story-paragraph dialogue">“谢谢你帮我拍照。”女孩又一次道谢，笑眼弯弯，直直地击中了他的靶心。</p><p class="story-paragraph">不等了，他深吸了一口气。“凑崎同学，我有话想和你说。”</p><p class="story-paragraph">手机没暗灭，纱夏刚刚发出的消息旁边跳出“已读”。阳太不等纱夏回答，自顾自地说下去。</p><p class="story-paragraph dialogue">“我喜……”“什么？”她没听清，因为手机突然震动了一下，转移了她的注意力。</p><p class="story-paragraph">太期待名井南的回复，所以她抬手去看。有一束好大的烟花在此刻升空，“砰”一声爆裂开来。整个天空一下就像白昼一样明亮，拉长的花火线条旋转着往海洋里坠落。南回了一张看起来是从更远的角度拍下的照片，主角同样是烟花。</p><p class="story-paragraph dialogue">“……欢你。”配了一行小字：“很好看，不过我相信由你亲手拍的会更好看。”</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph dialogue">“纱夏好慢啊…”桃看着纱夏边擦头发边从浴室里走出来：“今天不是洗过澡了吗？”</p><p class="story-paragraph dialogue">“看花火的时候又出了一身汗，不洗不舒服。”</p><p class="story-paragraph dialogue">“噢，这样啊。” 桃的眼神变了，一下子变得很八卦。</p><p class="story-paragraph dialogue">“对了。”</p><p class="story-paragraph">显然她有强撑着困意也要等纱夏出来的原因。</p><p class="story-paragraph">阳太刚刚和你说什么了？”</p><p class="story-paragraph dialogue">“阳太？他帮我照了张照片。”</p><p class="story-paragraph">桃摇头，去推纱夏：“不是这个，我说他拍完照之后和你说了什么？”</p><p class="story-paragraph dialogue">“之后…”纱夏绞尽脑汁地在回想。</p><p class="story-paragraph">那个时候好像有很震撼人心的烟花，南正回她消息。</p><p class="story-paragraph">说了什么呢？阳太在光亮熄灭后好像显得有点局促，和她随便寒暄了几句就走了。</p><p class="story-paragraph dialogue">“没说什么重要的事，就随便聊了一下。”</p><p class="story-paragraph dialogue">“啧，”桃撇了撇嘴：“看你俩气氛那么好，我还以为他会和你表白。”</p><p class="story-paragraph dialogue">“瞎说什么呢。”纱夏作势要敲桃的脑袋，桃笑嘻嘻地往后躲。</p><p class="story-paragraph dialogue">“还想听劲爆消息的，算了，我还是睡觉吧。”桃装作失望至极，倒回了枕头上。不过今天从上午开始收拾行李，又坐了一下午新干线，晚上还在花火祭的场地走了一个多小时，她困得不行了。</p><p class="story-paragraph">纱夏往后退了几步，按灭了大灯。</p><p class="story-paragraph">桃闷闷的声音传过来：“你头发不是还没干吗，我开灯也能睡的。”</p><p class="story-paragraph dialogue">“没事，可以用卫生间的灯，反正我弄干头发也睡了。”</p><p class="story-paragraph">她回到里间，对着镜子擦了一会儿，头发还是有点湿湿的。</p><p class="story-paragraph">但她打算先上床玩手机，所以就没继续折腾，简单地抓了两下头发之后，她就踩到客房的榻榻米上。</p><p class="story-paragraph">桃好像就睡着了，安静地蜷缩在被窝里。纱夏因此也紧张兮兮的，生怕发出什么响声吵到她。</p><p class="story-paragraph">她去茶几上拿手机，结果在黑暗里摸到个塑料纸包着的硬东西。</p><p class="story-paragraph">完了，到酒店之后忘记把御守给名井南了。</p><p class="story-paragraph">回家给也不迟，但她今晚只是发了张照片过去，感觉有点寒酸。</p><p class="story-paragraph">在汤池的时候妈妈还特意说了明天就得走…</p><p class="story-paragraph dialogue">“桃？”纱夏小声地喊了一下平井，对方没有反应。看样子是完全睡着了。</p><p class="story-paragraph dialogue">——</p><p class="story-paragraph">南的手机发出叮咚的声音，她刚换上新买的 T 恤，打算将就着作睡衣穿。</p><p class="story-paragraph">听到手机响，她去拿。</p><p class="story-paragraph">是纱夏。</p><p class="story-paragraph dialogue">“妈妈睡了吗？”</p><p class="story-paragraph">过了几秒又发过来一条。</p><p class="story-paragraph dialogue">“你已读了，还没睡。”</p><p class="story-paragraph">她轻笑一下，打字问：“怎么了？”</p><p class="story-paragraph dialogue">“你在哪间房？我有东西要给你。”</p><p class="story-paragraph">没过一会，房门就被小小的力度敲响，南去给她开门。</p><p class="story-paragraph">纱夏穿了一件松松垮垮的深蓝色睡衣。这件衣服是她给女儿买的，因为面料摸起来高档舒服。</p><p class="story-paragraph">不过纱夏扣子没系好，领口那空了两粒没扣，头发还有些未干的在滴水。她的左手拿了个用纸包好的小方块。</p><p class="story-paragraph">名井视线再往下，纱夏是赤脚，也从侧面印证了她出来得是真的很急。</p><p class="story-paragraph">她弯腰，将房间另一双一次性凉鞋丢给纱夏：“把鞋穿上。”</p><p class="story-paragraph dialogue">“我不进来了，”纱夏说：“桃睡了，待得太晚我怕回去之后会吵醒她，我来这里是为了给你这个。”</p><p class="story-paragraph">她把左手拿着的纸包给她。</p><p class="story-paragraph">南摸了一下形状，猜到个七八分。</p><p class="story-paragraph dialogue">“御守？”</p><p class="story-paragraph dialogue">“嗯。”纱夏怕她嫌弃，因为家里有很多个不同样子的御守了，连忙加了一句：“图案是花火祭限定的，可以保佑你平安。”</p><p class="story-paragraph dialogue">“谢谢。”南好像喜欢，纱夏也就不担心了。</p><p class="story-paragraph">她正准备转身的时候，南拉起了她的手。</p><p class="story-paragraph">对上纱夏的眼神，她没解释，只是把女儿牵进了房间。</p><p class="story-paragraph dialogue">“妈妈有什么事吗？”纱夏问。</p><p class="story-paragraph">南打开浴室的门，给她拿了吹风机。</p><p class="story-paragraph dialogue">“不是说你朋友睡了吗？吹头发声音大，等头发干又要很久，在我这吹了再走吧。”</p><p class="story-paragraph">进了房间以后纱夏才开始打量南，她妈妈可能也才洗完澡没多久，因为浴室里还有未散的氤氲水汽，仔细闻的话也可以闻到南身上的沐浴露香味，和她身上的是同一种，大概是宾馆里配好的。</p><p class="story-paragraph">但其实十年以来，她们用的都是同一种味道的沐浴露。</p><p class="story-paragraph dialogue">“好，不过…” 纱夏是第一次看到名井的这件 T 恤：“你这件衣服是什么时候买的，以前没见你穿过。”</p><p class="story-paragraph">为她插上吹风机电源，妈妈示意她坐在凳子上。</p><p class="story-paragraph">南在家里也经常会给自己吹头发，所以纱夏乖乖地照做了。</p><p class="story-paragraph">吹风机打开之前，纱夏听到妈妈的答案：“今天来找你的时候买的。”</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph dialogue">“好软，”纱夏发出欢呼，滑到被子里去：“最贵的价格订到的房间果然是最好的。”南将最后一盏灯熄灭了，她想主动去适应黑暗，所以闭了会儿眼睛才睁开，看到纱夏躺在她的床上：“真不回去了？”</p><p class="story-paragraph dialogue">“不回去了，”纱夏撒娇：“妈妈都说是来找我的了。”</p><p class="story-paragraph">南也掀开被子，顺势抱住纱夏抱住，贴着她耳朵问：“明天怎么和你同学解释？”</p><p class="story-paragraph dialogue">“妈妈借我一件衣服穿就行，反正你买了那么多件，”纱夏弯着眼睛转过身，结果额头不小心撞到了南的下巴：“嘶…我就说我醒得早，看到桃睡懒觉，所以先出去散步了。”</p><p class="story-paragraph">南挑眉，帮纱夏揉揉脑袋，好像明知故问：“以前没发现你竟然是个谎话精，为什么不直接和同学说妈妈来了？”</p><p class="story-paragraph dialogue">“桃今天也看到你了，”纱夏有点抱怨名井南的意思：“你什么提示都没有，害得我都没敢认。她都看我傻站那么久了，我明天难道还要去和她说：‘昨天晚上你看到的漂亮女人其实是我妈妈’吗？”</p><p class="story-paragraph">多丢脸啊…纱夏心中诽谤她。</p><p class="story-paragraph dialogue">“不过，妈妈果然是想我了，”纱夏主动凑头去靠南的颈窝：“毕业旅行也想陪我吧？”她的声音透露着小小的得意。</p><p class="story-paragraph dialogue">“你在车上都那么直白地叫我想你了，我还能不给你长面子？”南又怪到纱夏身上。</p><p class="story-paragraph">不愧是律师，论动脑筋的速度还有嘴皮子上的功夫，纱夏想打败她得再修练个十年。</p><p class="story-paragraph">前提是南的实力也得在原地踏步才行。</p><p class="story-paragraph">被妈妈的话所提醒，纱夏想起自己在车上亲名井南的那一下，又想起离开汤池时名井回赠在下巴上的那个同样性质的吻。</p><p class="story-paragraph">她在黑暗里的脸又泛红了。</p><p class="story-paragraph">纱夏去顶嘴，故意不接这个话茬，只自顾地说下去：“妈妈，这么黏女儿可是不行的。”</p><p class="story-paragraph">不行的。</p><p class="story-paragraph">女儿只是在调侃她而已，南知道。</p><p class="story-paragraph">不行的，这样是不行的。</p><p class="story-paragraph dialogue">“纱夏是不喜欢这样？”虽然她猜测纱夏不会用否定来回答自己，但怀抱着更多难言的爱意，南显然处于下风。</p><p class="story-paragraph">至少在等待纱夏的答案的时间里，她有点忐忑。</p><p class="story-paragraph">纱夏发觉气氛变了：妈妈在等她。明明是用玩笑话开始的，为什么回答的时候又没办法以同样顽劣的方式结束结束…</p><p class="story-paragraph">她难得感觉主导权在自己手上，南好像有点不安，这种不安和她每次等考试成绩公布时的那种气氛相似。</p><p class="story-paragraph dialogue">“我…”</p><p class="story-paragraph">纱夏不知道怎么回答，如果说‘喜欢这样’，她前面干嘛还和名井南抬杠，这不是让她打自己脸吗？</p><p class="story-paragraph">可是她没有不喜欢，她还愿意和南在一起待得更久。</p><p class="story-paragraph">今晚的花火大会也是，她希望站在身边的人是名井南。</p><p class="story-paragraph">她想妈妈大概是独自开了四个小时的车，跑到她在的这个城市来了，不仅如此，因为她，南还要匆匆地去商店买衣服。</p><p class="story-paragraph">她为自己做了这么多事，所以纱夏主动丢掉了主动权。</p><p class="story-paragraph">女孩温温软软的呼吸喷在名井身上。</p><p class="story-paragraph">她听见纱夏小声地说了一句：“喜欢…”</p><p class="story-paragraph dialogue">“所以下次想我的时候也要来找我…在路上的时候要早点告诉我，这样你就不会孤单了。”</p><p class="story-paragraph dialogue">“我会等你来的。”</p><p class="story-paragraph">南没说话，但纱夏已经撑不住了，脑海       <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">屈起的指节探进纱夏身体的时候，南久违地想要爆粗口。</p><p class="story-paragraph">情潮已经激荡得冲垮她的怜爱心。</p><p class="story-paragraph">小骚货，她想羞辱纱夏：吸得这么紧是要勾引谁。</p><p class="story-paragraph">以为做好扩张了的身体经历了两次高潮，还是紧得不像话。</p><p class="story-paragraph">嫩肉贪婪地缠住南的食指，热情地迎接着攻占纱夏的第一个客人。</p><p class="story-paragraph dialogue">“纱夏，放轻松…”她看着被弄疼的女儿，心里居然泛起罪人才有的安定感。</p><p class="story-paragraph">南吻掉纱夏的眼泪：“别吃得这么用力…”</p><p class="story-paragraph">女儿被放在她的心尖尖上，平日里听话懂事得很，就算是犯了错，南也舍不得对她说重话，只在事后诚心地同她讲上一次道理就会放过她。</p><p class="story-paragraph">所以更别说体罚纱夏。女儿不小心摔倒在地上，把哪里划破一条口子，南都会心疼半天。</p><p class="story-paragraph">她什么时候像这样过？</p><p class="story-paragraph">将纱夏弄得可怜兮兮、不着寸缕。</p><p class="story-paragraph">让女儿光着身子，打开腿躺在她身下，噙着泪光，被侵犯得说不出话来。</p><p class="story-paragraph">异物的存在让纱夏蹙起了眉头，虽然这种疼痛可以忍受，但刚体会到被抛上云端的欢愉，这份快感就被硬生生地截断了。</p><p class="story-paragraph">本来想要继续做下去的念头又开始退缩，纱夏有点害怕。</p><p class="story-paragraph dialogue">“痛…”她扭着腰在向后撤，要避开这种不舒服的感觉。</p><p class="story-paragraph">可南怎么会给她这个机会，她好不容易才进来，满脑子都只想怎么把纱夏的花穴操开，怎么把她里面搅得乱七八糟。</p><p class="story-paragraph dialogue">“纱夏乖…宝贝…忍一下下就好…”她凑近纱夏，细碎的吻如夏季的骤雨一般落在纱夏身上，她感觉女儿的柔软的身躯被情事的羞意惹得发热，嘴唇所碰到的皮肤都变烫了。</p><p class="story-paragraph dialogue">“一下下就好…”</p><p class="story-paragraph">南一路吻到她的肚脐，纱夏小腹上细软的汗毛都被妈妈吻得竖起来。</p><p class="story-paragraph">她的一切好像都开始变得支离破碎…</p><p class="story-paragraph">感官、灵魂、情意。</p><p class="story-paragraph">不知道此刻到底身处天堂还是地狱。</p><p class="story-paragraph">妈妈的吻畅通无阻地在她的世界里穿行，还在往高压线前进，纱夏等湿热的呼吸拍打着她的花瓣时才察觉到，她心里警铃大作。</p><p class="story-paragraph dialogue">“别…妈妈…”她带着哭腔，羞得要去遮南的眼睛，但南还有一支手指埋在她的身子里，她轻轻一逗，纱夏就又软下去了。</p><p class="story-paragraph">南看得有点痴。</p><p class="story-paragraph">纱夏含着她手指的秘处一张一合，晶莹的爱液在小嘴吞吐的时候染到了她的指腹，交合的地方沾上了香甜的气味。</p><p class="story-paragraph">千千万万朵玫瑰…</p><p class="story-paragraph">南心里想，由她亲手栽出来的这支，一定有最美味的花蜜。</p><p class="story-paragraph">她好像着了魔一样。“妈妈亲一下就不痛了…”</p><p class="story-paragraph">南俯身贴近纱夏下身的小嘴，把头轻轻偏了一个角度，姿势正式地如同要和它接吻一样。</p><p class="story-paragraph">不行…不行…</p><p class="story-paragraph">妈妈的话无疑在纱夏的心里掀起了一场暴风。</p><p class="story-paragraph">尽全力把蒙在她意识上的那层纱布给扯掉，纱夏用手肘支起身来。</p><p class="story-paragraph dialogue">“不要……脏…”</p><p class="story-paragraph">可来不及了，南已经埋进了她的腿心。</p><p class="story-paragraph dialogue">“嗯啊啊…”她没说完，小穴就被南柔柔地含在嘴里。</p><p class="story-paragraph">妈妈托起了她的臀。</p><p class="story-paragraph">再也没办法忍住呻吟了，纱夏放荡地叫出声来。</p><p class="story-paragraph">妈妈在亲自己的…</p><p class="story-paragraph">她视觉上接纳到的刺激甚至比身体获得的快感还要强。</p><p class="story-paragraph">女孩的眼角烧得通红，好像被有着炽热温度的火苗舔过。</p><p class="story-paragraph">她看到南用空出来的手将垂下显得碍事的头发拨到耳后。</p><p class="story-paragraph">完全适应了黑暗的眼睛可以描出那张脸的轮廓，又或许是已经对妈妈的长相烂熟于心。</p><p class="story-paragraph">即使视觉被弱化，她也能猜出南的表情和神态。</p><p class="story-paragraph">那是艺术家逐帧雕刻出来的绝迹。</p><p class="story-paragraph">南往常清澈剪水的双瞳彻底沉入了想要取悦纱夏的雾霭之中。</p><p class="story-paragraph">纱夏回忆起她的嘴唇。</p><p class="story-paragraph">妈妈是律师，纱夏知道她做得好，胜诉率高。</p><p class="story-paragraph">所以她偶尔也会想象，那个坐在客厅里翻着卷宗，看上去显得沉静又无害的女人，她在法庭上到底是什么样的？</p><p class="story-paragraph">一定很帅气，靠她那张能言善辩的嘴，卷着滔天的气场把对手逼得节节败退。</p><p class="story-paragraph">在情事里，妈妈的舌头也好灵活，吸得她轻飘飘的，好舒服…南那饱满红滟的双唇…</p><p class="story-paragraph">这一切晃得纱夏的那颗心脏荡漾不已。</p><p class="story-paragraph">女人的鼻子时不时顶到勃起的小豆豆，纱夏觉得它可能会蹭到妈妈鼻梁上的那颗痣。</p><p class="story-paragraph">羞死人了…怎么能被妈妈看到…看到她这个样子…</p><p class="story-paragraph">但是，就快要融化了，好像变成了冰淇淋，会被妈妈的舌头舔成水。</p><p class="story-paragraph">可以是薄荷味道的吗？妈妈最爱吃薄荷口味的东西。</p><p class="story-paragraph">纱夏意识涣散地想。</p><p class="story-paragraph">她的眸子要失焦了，可还想再忍一下，不要被南当作坏孩子。</p><p class="story-paragraph">但妈妈这样伺候她…她真的一点都做不到。</p><p class="story-paragraph">咬住南手指的内里终于不再像刚刚一样紧。</p><p class="story-paragraph">因为被口舌安慰过，酥麻的快感逐渐覆盖掉了疼痛，纱夏的身体重新被点燃，允许她再次沉醉在这场交欢里。</p><p class="story-paragraph">南有机会抽动手腕，她的动作开始是温柔缱绻的，不想女儿再因为疼痛而落泪。</p><p class="story-paragraph">感觉到纱夏身体接纳得越来越好，吃得越来越多，腰肢迎着她的节奏开始摆动时，她才放心地用起劲来，用得女孩直求饶。</p><p class="story-paragraph">不止如此，南还不依不挠地和纱夏接吻。</p><p class="story-paragraph">她好像不知道自己的杀伤力有多强，让她的女儿有多心动。</p><p class="story-paragraph">南吻得纱夏坠入意乱情迷的漩涡。</p><p class="story-paragraph">这还只是女孩第一次做爱，南一点都不会怜香惜玉。</p><p class="story-paragraph">她的女儿哪里经得起这么弄？</p><p class="story-paragraph">纱夏不久前才体会到升入云间的怡悦，现在她的腰际酸胀麻痒，好像要断掉了。</p><p class="story-paragraph">耳朵能听到淫靡的声音，越来越响的“啪啪”声昭示着这场欢爱即将走向顶端。</p><p class="story-paragraph">纱夏什么都做不了，她攀着妈妈的肩膀，从来没想到南那看起来苗条的胳膊居然这么有力气，好像不知疲倦一样，能把她碾到坏掉。</p><p class="story-paragraph dialogue">“太…快…你慢点……”她的语气里掺了娇嗔，指甲都要嵌进南的血肉里去，硬生生地在妈妈背上刮出两条印子。“纱夏是小猫？”南被抓得痛了也没恼，只是轻咬了一下纱夏的乳头作为报复。</p><p class="story-paragraph dialogue">“还是…调皮的小猫…”她自问自答，加快了速度，把纱夏撞得七零八落。</p><p class="story-paragraph">最后纱夏哭叫着唤她眼前的人。</p><p class="story-paragraph dialogue">“呜…妈妈…”</p><p class="story-paragraph">她剧烈地痉挛了几下，额头抵着南的，爽得眼睛都没办法张开，压抑又断续地喘着气。</p><p class="story-paragraph">意识像是计算器被按了归零键，一下子全部清除。</p><p class="story-paragraph">纱夏直接被操得昏了过去。</p><p class="story-paragraph">高潮的时候女儿的花穴贪图无厌地绞着她的手指，这种力度的收缩吸得南头皮发麻。</p><p class="story-paragraph">她有点庆幸，幸亏自己不是男人。如果是，在纱夏面前，恐怕坚持不了三分钟就会被榨得丢盔弃甲。</p><p class="story-paragraph">已经累极，因为脱力的缘故，纱夏腿间虽然已是副一塌糊涂的光景，但她还是彻底地睡着了。</p><p class="story-paragraph">南有些不舍地放过她。</p><p class="story-paragraph">她拨开纱夏被汗湿的头发，轻轻吻了一下女孩的额头。</p><p class="story-paragraph">是想要更多的，可纱夏真的很累。</p><p class="story-paragraph">南不想索求无度，反正回家了她还会和纱夏住在一起。</p><p class="story-paragraph">多少次都可以…</p><p class="story-paragraph">她敛了心绪，起身去拉壁橱的门，温泉酒店大都会在里面留一套被枕，纱夏第一次和她睡榻榻米房间的时候就很惊奇，因为家里的被子一般都放在立式柜的最顶格，她没见过这样的。</p><p class="story-paragraph">那时为了哄她，南说这是给哆啦 A 梦准备的。</p><p class="story-paragraph">纱夏相信那个戴竹蜻蜓的蓝色机器猫的故事，因为她每晚都能在电视机上看到，所以她很满意妈妈的解释。</p><p class="story-paragraph">这会儿想起，她的心又被柔和的情意填满，方才暴戾恣睢的样子也没有了。</p><p class="story-paragraph">她将被子铺在地上，相当于新开了一个床铺。</p><p class="story-paragraph">好在这样的酒店都没有实木床。</p><p class="story-paragraph">她摩挲着刚刚进入纱夏身体的食指，那根手指真切地见证到女儿对她殷勤献媚的样子。</p><p class="story-paragraph">要是她们是在那样的大床上做爱…纱夏可能会把床垫都弄湿，怕是谁都睡不了了。</p><p class="story-paragraph">她将纱夏从那团惨不忍睹的床上用品中解救出来，女儿只穿着上身的那一件衣服，屁股都光溜溜地露在外面。</p><p class="story-paragraph">南抱着她一起躺进了新的被窝里。</p><p class="story-paragraph">纱夏呓语了一句什么话，没醒。</p><p class="story-paragraph">可能是闻到了南的味道，纱夏抓着妈妈的衣服，继续安心地陷在梦境里。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">最顶楼的房间第一个接到阳光的信号，那一束暖意照在纱夏的眼皮上。</p><p class="story-paragraph">全身酸痛得像是被拆卸之后又重新组装。她醒过来的时候，恍惚间觉得自己昨晚是否经历了一场惨烈的车祸。</p><p class="story-paragraph">衣不蔽体，纱夏裸露的肌肤都直接和亚麻布料亲密地贴在一起。</p><p class="story-paragraph">发生什么了？</p><p class="story-paragraph">她有点迷茫，只记得来了妈妈的房间。晚上是和南一起睡的。</p><p class="story-paragraph">她抬眼扫了一下室内的装潢，都没变，只是没看到妈妈在哪里。</p><p class="story-paragraph">纱夏掀起盖着的被子，目光往下落。</p><p class="story-paragraph">不看还不要紧，这一看——</p><p class="story-paragraph">她浑身都木了，像是连串的火星子引爆炸药，炸得她脑袋空空如也。</p><p class="story-paragraph">从锁骨开始，一直蔓延到大腿根，她的身体上都有清晰可见的粉色印记。</p><p class="story-paragraph">记忆的碎片闪回，昨夜让人脸红心跳的画面一幕幕地重映。</p><p class="story-paragraph">妈妈说给她听的情话、自己不知廉耻的迎合。</p><p class="story-paragraph">唇齿相依的幸福感，以及水乳交融的欢乐…</p><p class="story-paragraph">都是真的…</p><p class="story-paragraph">她居然和妈妈…做了那种事…</p><p class="story-paragraph dialogue">“咔”。</p><p class="story-paragraph">另一侧传来响动，是浴室门把手被按下时金属锁舌发出碰撞的清脆声音。纱夏猝不及防地看到南从里面走出来，对方好像是刻意等着这个瞬间。</p><p class="story-paragraph">四目相接，她慌忙往其他地方瞟。</p><p class="story-paragraph dialogue">“醒了？”妈妈问她，她已换了身衣服，纱夏听不出南明显的情绪。</p><p class="story-paragraph">不敢看她，也猜不到她在想什么。</p><p class="story-paragraph">纱夏难得地沉默，心脏失去控制，疯狂地怦怦直跳，要从嗓子眼里蹦出来。</p><p class="story-paragraph">不知道过去多久，纱夏觉得有什么东西在悉悉索索地移动，南的气息随之倾倒下来。</p><p class="story-paragraph">她的脸被妈妈用手掰正。</p><p class="story-paragraph">什么时候走过来的…</p><p class="story-paragraph">被不轻不重的力道扣住，她躲不开，只得愣愣地接受南的注视。</p><p class="story-paragraph">微卷的发衬得妈妈越发迷人，这致命的魅力把纱夏抓得极牢。</p><p class="story-paragraph">她看到南的光足，一阵口干舌燥，突然间明白了为什么妈妈走到她面前她才发现。</p><p class="story-paragraph dialogue">“看着不像还在睡觉的样子，”南笑得很狡猾：“怎么不回答我？”</p><p class="story-paragraph dialogue">“我…”一开口发觉自己嗓子哑了，纱夏又闭上嘴，羞赧地一个字都不肯再多说。</p><p class="story-paragraph dialogue">“要不要去洗个澡？”南体贴地问她，一点也不害臊：“会舒服点。”</p><p class="story-paragraph">大尾巴狼好像全然不管，就是她把女儿搞成这样的。</p><p class="story-paragraph">纱夏咬着唇点头。</p><p class="story-paragraph">但妈妈没有回头的意思，她也就不动。</p><p class="story-paragraph">被南盯得要晕死过去，纱夏才小声地抗议。</p><p class="story-paragraph dialogue">“我要起来了，你…别看…”她没办法裹着被子去拿衣服，这种被子是和床垫连在一起的，她浑身酸得要命，快散架了，真的没力气套着笨重的东西走来走去。</p><p class="story-paragraph">如果妈妈不动的话，她就要被看得精光…</p><p class="story-paragraph dialogue">“哪儿我没看过？”南以前说过这句话，但这次再提起，意味已经截然不同了。</p><p class="story-paragraph">少女羞恼地伸手捂妈妈的嘴，没想到南轻松地捉住她，在她掌心吻了一下。</p><p class="story-paragraph">纱夏没有谈过恋爱，好像也没有喜欢过谁。没想到棋逢的第一个敌手，竟是最了解她的人。</p><p class="story-paragraph">身子也被占了，再加上两人这禁忌的关系。</p><p class="story-paragraph">这下无论妈妈对她说什么，都能轻易地搅乱女孩心中原本平静的水潭。</p><p class="story-paragraph">别说亲密的肢体接触…</p><p class="story-paragraph">妈妈是在赤裸裸地和她调情，纱夏有点眩晕。</p><p class="story-paragraph">好在戏弄完她的南也安分下来。</p><p class="story-paragraph">她听女儿的话，闭了眼，仿佛纱夏的手覆住的不是她的嘴，而是她的眸子。</p><p class="story-paragraph dialogue">“不许睁开…”纱夏松一口气，她说话已经没什么魄力了，此刻只得小心地翻动起被子，以最快的速度从里面逃了出来。</p><p class="story-paragraph">纱夏本来想找昨天穿上来的短裤，那是她睡觉前洗澡时换上的。</p><p class="story-paragraph">可当她看向右手边那一堆几近报废的衣物时，设想的那般计划统统化作泡影。</p><p class="story-paragraph">纱夏快要崩溃了，昨晚的她到底是有多放浪，怎么会把底裤搞成那个样子…</p><p class="story-paragraph">她悄悄地去看南。</p><p class="story-paragraph">妈妈没有在偷看，只是好像通过空气的凝滞猜出了纱夏在因什么事发愁。</p><p class="story-paragraph dialogue">“衣服从桌上拿就好，有新的，”南停顿了一下：“也有一次性短裤。”</p><p class="story-paragraph">话里有话，纱夏的脸倏然红了。</p><p class="story-paragraph">南听到对方从身侧绕过去的动静，紧接着就是塑料袋被翻响的声音。</p><p class="story-paragraph">浴室门打开，又不那么利落地被关上，她这才缓缓地睁开眼睛。</p><p class="story-paragraph">她的女儿，真的很可爱。</p><p class="story-paragraph">至于纱夏，冲进浴室后就简单地在花洒下冲了冲，带着浴帽才没把头发淋湿——要不然太难弄干了。</p><p class="story-paragraph">她多挤了一点沐浴露涂在腿间，摩擦的时候被未散的粘腻触感弄得害羞极了，感觉腿心又有点泛起湿意。</p><p class="story-paragraph">趁愈演愈烈之前，她停下了动作。</p><p class="story-paragraph">洗得差不多，纱夏拿毛巾擦干水滴。</p><p class="story-paragraph">她出来对着镜子，不知道要抱以什么样的心态去看名井南。因为一直在想，纱夏手滑，内衣扣子来回扣了几次才锁进正确的位置。</p><p class="story-paragraph">这到底是有多渴望自己的身体…连乳房周围都留下了不少痕迹。</p><p class="story-paragraph">坏妈妈…</p><p class="story-paragraph">不过南还是保留了一点理性，纱夏套上短袖的时候发现露在衣服外面的皮肤，颜色都很正常。</p><p class="story-paragraph">应该是刻意为之，这是聪明的举动。</p><p class="story-paragraph">既让纱夏在同学面前不至于处境窘迫，又能让她能在一丝不挂的时候想起这场疯狂的情事。</p><p class="story-paragraph dialogue">“纱夏。”妈妈的声音在门外响起，因为还没穿上短裤，纱夏的目光急忙去检查那扇门有没有落好锁，确认南不能直接打开之后她才放心，所以紧绷着情绪一直没应答，直到对方接着往下说。</p><p class="story-paragraph dialogue">“你收好东西就可以下楼了，钥匙我取了，出去的时候把门带上。”</p><p class="story-paragraph dialogue">“你要走了吗？现在就开车回去吗？”纱夏没发现自己的语气依依不舍，以至于连着把话都问了出来。</p><p class="story-paragraph dialogue">“事务所有急事，我得去处理，”南细心地回答了纱夏所有的问题：“现在不开车，下楼吃完早餐再说。”</p><p class="story-paragraph dialogue">“嗯…”她有点扭捏，不知道出去了要怎么和妈妈讲话。</p><p class="story-paragraph">要不要让南等她一下，待会一起吃饭？</p><p class="story-paragraph">指不定会被桃撞见。</p><p class="story-paragraph">其实她也可以向朋友解释，说这是自己的妈妈…</p><p class="story-paragraph">可是昨晚发生的事…</p><p class="story-paragraph">纱夏总觉得有种私会情人被发现的感觉。</p><p class="story-paragraph">也不知道夜不归寝的事被桃知道了没有…</p><p class="story-paragraph dialogue">“我走了，你的手机别忘了拿。”南补充，纱夏回过神来，本想再说几句话，可她听到妈妈开门的声音。</p><p class="story-paragraph">好像南真的很忙，她也没办法挽留。</p><p class="story-paragraph dialogue">“知道了…”纱夏在纠结要不要叫“妈妈”。</p><p class="story-paragraph dialogue">“玩得开心。”名井南最后这么说，门被她关上了。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">纱夏下到一楼吃早餐的地方，有点做贼心虚的意味。</p><p class="story-paragraph">她在穿戴整齐地出了浴室以后，发现妈妈把她弄脏的衣服都顺手带走了。于是女孩回了趟自己的房间，桃已经离开。</p><p class="story-paragraph">但是纱夏也迟迟没接到桃发的短信，有可能是对方正如她预想的那样，以为自己有什么别的事，才没有过问的。</p><p class="story-paragraph dialogue">“纱夏。”正这样想着，她循声找到了桃的身影。</p><p class="story-paragraph">现在还早，下来吃饭的人并不多，所以纱夏很轻松地瞧见了桃。</p><p class="story-paragraph dialogue">“我起来的时候你都不见了，还以为你早就来吃饭了，怎么比我还晚到？”</p><p class="story-paragraph">桃问她，把随手带上的一个空碟子推给纱夏：“不知道你爱吃什么，所以就没帮你拿。”</p><p class="story-paragraph dialogue">“看到今天天气不错，”纱夏又撒了个谎：“就去溜达了一圈。”</p><p class="story-paragraph">她接过白瓷质地的碟：“谢谢桃给我拿餐具。”</p><p class="story-paragraph">在基础菜品区绕了一圈，她夹了点烤好的土豆作主食，水果挑了几颗草莓。</p><p class="story-paragraph">女孩盘算着再吃点什么。</p><p class="story-paragraph">临海，这是爱知县所有的温泉酒店最值得自我推销的一点了。</p><p class="story-paragraph">店里的早餐很有特色。</p><p class="story-paragraph">有个扎着白围兜的厨师在烤鱼，香气四溢，纱夏被吸引得凑过去看。</p><p class="story-paragraph">十来条的样子，她猜测，烤鱼在架子上转来转去。</p><p class="story-paragraph">纱夏很少看到这么小的秋刀鱼，被烤得外酥里嫩，绝对不会不好吃。</p><p class="story-paragraph dialogue">“您好，我想要两条。”纱夏把碟推给厨师，厨师笑眯眯地给她夹了再放在碟子上。</p><p class="story-paragraph dialogue">“您好，我也是。”纱夏回过头，发现是阳太，对方是对着厨师说话，但眼睛却毫不遮拦，直直地盯着她。</p><p class="story-paragraph">意识到半天没讲数量要求，阳太才接着和厨师点单：“和她一样。”</p><p class="story-paragraph dialogue">“这是您的。”这位厨师好像见过很多世面，习惯在暑期看到高中生情侣度假出游，于是见怪不怪地朝他们抛了一个眼色。</p><p class="story-paragraph">阳太很开心，纱夏倒是置身事外。</p><p class="story-paragraph dialogue">“凑…纱夏…”她正要走，阳太就叫住她，没喊她的姓，改称她的名字，叫得很亲昵。</p><p class="story-paragraph">以前从没被阳太这样叫过。</p><p class="story-paragraph">纱夏想，他是不是有什么重要的事对自己说，所以停住了。“那件事…你考虑得怎样？”男生有点胆怯，但怕纱夏在沉默里不耐烦，所以硬着头皮说出来了。</p><p class="story-paragraph dialogue">“什么？”和阳太间有值得以如此严肃的氛围展开讨论的话题吗？她在心里好好找了一下，也没找到。</p><p class="story-paragraph">可是阳太看起来好像在等她主动开口。</p><p class="story-paragraph">纱夏怕男生会觉得窘迫，于是很努力地琢磨起他的意思。</p><p class="story-paragraph">唯一能想起的，只是同学昨晚帮忙拍的那张照片。</p><p class="story-paragraph">她知道同龄的男孩间的习惯，他们好像都挺重视一来一往。</p><p class="story-paragraph dialogue">“想要谢礼？”纱夏确实挺感谢阳太的。</p><p class="story-paragraph">再加上…</p><p class="story-paragraph">看阳太支支吾吾的，纱夏理所当然地以为他有什么要找自己帮忙做的事。</p><p class="story-paragraph">谢礼？</p><p class="story-paragraph">这个回答和他意料中的答案差别挺大，他以为纱夏的答案只有肯定或否定两种。</p><p class="story-paragraph">阳太抬起头，有点疑惑。</p><p class="story-paragraph">不过他一下子就反应过来了。</p><p class="story-paragraph">帮纱夏拍了照之后，就和她表露了心意。</p><p class="story-paragraph">虽然不知道女孩到底有没有听清，但阳太怕她害羞。</p><p class="story-paragraph">为了让自己显得更有绅士风度，再简单地和纱夏寒暄了几句他就离开了，想给喜欢的人留一点思考的时间。</p><p class="story-paragraph">本来还有点担心，因为纱夏听到“我喜欢你”四个字的时候似乎不为所动。</p><p class="story-paragraph">早知应该问得更直白，直接问她愿不愿意做自己的女朋友。</p><p class="story-paragraph">不过今早再看到她的时候，阳太有百分之八十的把握确定纱夏是听清了那句话的。</p><p class="story-paragraph">他在学校里是摄影同好会的会员，在观察事物上特别有一套。</p><p class="story-paragraph">女孩的卧蚕处有些明显的黑眼圈。</p><p class="story-paragraph">是因为在苦恼要不要接受这个请求，以至于晚上没睡好吧。</p><p class="story-paragraph">纱夏不好意思直接应他，所以用了“谢礼”一词。</p><p class="story-paragraph">意思是，她作自己的女朋友——就是那张照片的谢礼吧？“你愿意做我的女朋友？”阳太喜出望外地确认一遍。</p><p class="story-paragraph">纱夏瞪大了眼睛。</p><p class="story-paragraph">阳太这…是什么意思？</p><p class="story-paragraph">从见面到现在，自己难道说了什么让人误会的词吗，为什么对方会问这种问题？</p><p class="story-paragraph">女朋友…</p><p class="story-paragraph">是她以为的那个女朋友吗？</p><p class="story-paragraph">纱夏觉得莫名其妙。</p><p class="story-paragraph">她清澈无辜的视线没起到控诉的作用，只是让对方觉得是自己的行为太过唐突。</p><p class="story-paragraph">是他把纱夏都吓住了。</p><p class="story-paragraph">阳太刚要道歉。</p><p class="story-paragraph dialogue">“借过。”</p><p class="story-paragraph">这声“借过”扑灭了阳太一部分高涨的情绪，让他感觉有点不舒服。</p><p class="story-paragraph dialogue">“不好意思。”阳太还是侧身，毕竟是他站在这里太久。</p><p class="story-paragraph">纱夏看着妈妈出现在同学让出来的空间里。</p><p class="story-paragraph">来酒店之后，她就只在大厅里停留了几次。</p><p class="story-paragraph">怎么次次都能碰见名井南…</p><p class="story-paragraph">妈妈出门时穿的衣服纱夏没看见，因为她还待在浴室，漂浮在自己的心事里挣扎。</p><p class="story-paragraph">南套了件纯白色的短衫，看得出来下摆还是太长。</p><p class="story-paragraph">于是妈妈扎了一个结系在腰间。</p><p class="story-paragraph">可以想象妈妈灵巧的手指翻飞、漫不经心地打着蝴蝶结的样子。</p><p class="story-paragraph">那双细长漂亮的腿套在七分长的深蓝色牛仔裤里。</p><p class="story-paragraph">即使是很休闲的装扮，在南的身上也能多出另一种味道。</p><p class="story-paragraph">禁欲的，也许可以说成是诱惑的…</p><p class="story-paragraph">纱夏看妈妈踩了双高跟鞋，她脚背漂亮的线条正提醒着纱夏，自己在今日晨间见过那双如玉瓷一般精细的光足。</p><p class="story-paragraph">昨夜在她才在妈妈的爱抚下体会到成为女人的滋味…</p><p class="story-paragraph">现在又要她和南装成一点关系都没有的陌生人。</p><p class="story-paragraph">纱夏觉得藏在衣服下那些印记都在灼烧，好像在提醒她。</p><p class="story-paragraph">宣示着妈妈对她身体的所有权。</p><p class="story-paragraph">南和她擦肩而过，纱夏闻到她身上那股晚香玉的味道，是她用得最多的那支香水——她只知沉沦其中。</p><p class="story-paragraph dialogue">“纱夏…”男孩看着这女人离开的背影，调整了一下心态，才继续和纱夏讲话：“做我的女朋友吧。”</p><p class="story-paragraph">他决定把被打断的话题复述一次，再说纱夏也已经答应了。</p><p class="story-paragraph dialogue">“阳太。”她站定，可心思怎么也没法集中。</p><p class="story-paragraph">只要想起情情爱爱的事，南就又要出来捣乱。</p><p class="story-paragraph">纱夏意识到她必须先解决眼前的麻烦，才能再去外面叫住妈妈。</p><p class="story-paragraph dialogue">“可能我们弄错了对方的想法。”她带着竭诚的歉意，勉力让自己平静下来。</p><p class="story-paragraph">但是没办法，不管阳太看起来还有多少话要对自己说，纱夏都做不到耐心听了。</p><p class="story-paragraph dialogue">“对不起，让你误会真的很抱歉，”纱夏拔腿要往餐厅外走：“但我现在有急事。”</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">纱夏追出来，在停车场前坪一下就找到妈妈那辆黑色的奔驰跑车。</p><p class="story-paragraph">女人靠在车门上的姿势实在是太显眼。</p><p class="story-paragraph">南知道纱夏会踏着自己的脚步来，她抱着成竹于胸的自在，干脆在门口等着她。</p><p class="story-paragraph">女儿一路小跑，到跟前时不住地喘着气。</p><p class="story-paragraph dialogue">“我还以为你走了…”纱夏开口，她感觉自己做了坏事，妈妈好像并不开心。</p><p class="story-paragraph">她一时间也找不到什么该谈论的话题，只是头脑一热，就跟着南走到这里了。</p><p class="story-paragraph dialogue">“那还出来干嘛，和我汇报你交了男朋友？”南一说话就没了破绽，看起来神色无异。</p><p class="story-paragraph">这让纱夏觉得就算她肯定了，妈妈的下一句也会是祝她恋爱快乐。</p><p class="story-paragraph">她有点生气，眼里是不服输的倔，好像一定要看到南松口：“妈妈觉得我谈恋爱也没关系吗？”又叫自己妈妈了，她眸子里的光跳了一下。</p><p class="story-paragraph">南甚至想把纱夏拉到车里和她做，做到纱夏乖乖听她的话扭腰，哭着说只喜欢妈妈。</p><p class="story-paragraph dialogue">“长大了谈恋爱很正常，是你自己的事情。”</p><p class="story-paragraph">这不能完全怪南，她现在不爽到了极点。</p><p class="story-paragraph">纱夏晚上还被她操得死去活来的，白天就要当人家的女朋友了。</p><p class="story-paragraph">如果不是她刻意慢条斯理地进餐，想临走之前远远望一眼女儿，也许还不知道会发生这种事情。</p><p class="story-paragraph">被她听见了…换了谁能不生气？</p><p class="story-paragraph">那个家伙果然是觊觎纱夏的。听到他表白的时候，南脑子嗡嗡响。他的措辞还是“愿意做我女朋友？”这样的问句，好像女儿已经应允了这个请求一样。</p><p class="story-paragraph">她看纱夏沉默，有点委屈地在忍泪，后知后觉地意识到自己的占有欲对她而言很不公平。</p><p class="story-paragraph dialogue">“纱夏遇到喜欢的人就去谈恋爱，妈妈支持，不会反对的，”南把话说得柔和了点：“我不是那种死板的家长。”</p><p class="story-paragraph">她打开驾驶座坐进去，车钥匙插进点火锁，但没把门关上，纱夏还站在距离她一米内的范围里。</p><p class="story-paragraph">重点居然是自由恋爱的合理与否。</p><p class="story-paragraph">纱夏觉得南根本没有落到实处。</p><p class="story-paragraph dialogue">“我没答应，”她看着妈妈好像事不关己的表情，来了一股无名火，好胜心被激起，决定不管怎么样都要说下去：“我不喜欢他，是他误会了，我已经拒绝他了。”</p><p class="story-paragraph">南依然没说话。</p><p class="story-paragraph">有几只海鸥从湛蓝的天际线那端飞过去，张开的白色羽翼足够大，纱夏用余光都看到它们了。</p><p class="story-paragraph">纱夏从昨晚开始就有点分不清。</p><p class="story-paragraph">这一切都像梦境。</p><p class="story-paragraph">或许世界的自然规律都是假的，其实鸟儿是在海洋里翱翔，鱼群是在天空中梭巡。</p><p class="story-paragraph">难以理解。</p><p class="story-paragraph">妈妈也一样，做了让人难以理解的事。</p><p class="story-paragraph">行吧，既然她的意思是无所谓了。纱夏准备离开，手腕突然被抓住。</p><p class="story-paragraph">妈妈在扯她，把她扯得坐了在她的大腿上。</p><p class="story-paragraph">纱夏的头没磕到车门，因为南的手提前帮她挡住了。</p><p class="story-paragraph">南压住纱夏的后脑勺，将她压向自己。</p><p class="story-paragraph">这样，两个人的身体就都藏在车里了。</p><p class="story-paragraph">南急不可耐地去吻她，像是得到了爱不忍释的玩具，她顶开纱夏的唇舌，吃到草莓汁液的味道，酸涩又轻甜。</p><p class="story-paragraph">纱夏还想去推她，但妈妈很有力气，昨晚做爱的时候她就已经体会到。</p><p class="story-paragraph">挣扎徒劳无功，反而会被搂得更紧，于是女孩被动地接受了这个吻。</p><p class="story-paragraph">她被吻得气短，分开的时候忍不住去怪南，纱夏有点嗔怒，但只敢压低了嗓音。</p><p class="story-paragraph dialogue">“会被人看到的…”</p><p class="story-paragraph">南又在她唇上啄了一下，好像故意要给人发现，亲得特别明目张胆：“怕什么？”</p><p class="story-paragraph">纱夏不知道妈妈的性子有这么顽劣。</p><p class="story-paragraph dialogue">“我得走了，”南很不舍地去抚摸她女儿的脸庞：“要来不及了。”</p><p class="story-paragraph">纱夏懂事地起来，她妈妈倒是还在拉着她。“不是说来不及了吗？”纱夏去看南。</p><p class="story-paragraph">南点点头，这才放开女儿。</p><p class="story-paragraph">妈妈的唇角挂着笑意，她很少见南这么高兴的样子。</p><p class="story-paragraph">纱夏帮忙把门关上，南降下车窗。</p><p class="story-paragraph dialogue">“纱夏，”她说，“东京见。”</p></div>

        <h2 id="heading-chapter-05">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">季节的变化从天上显出来，夏日的云彩销声匿迹，却让人说不出是喜是忧。</p><p class="story-paragraph">和朋友谈天时总会希冀出行那天要惠风和畅。</p><p class="story-paragraph">能把天空尽情收进眼底，也不会有哪儿飘来的柔软棉絮遮住灿阳，应该是最符合理想状态的了。</p><p class="story-paragraph">但遇上现实又免不了抱怨。</p><p class="story-paragraph">七月里的温度太过不近人情，热浪甚至有点像毒气，誓要把人的呼吸都按回肺叶。</p><p class="story-paragraph">潮热的水汽通着灵性，总要从裤腿里钻进去。汗津津的大腿蹭到裤子，能惹得人无端地恼起火来。</p><p class="story-paragraph">静冈县的情况更为恶劣，出于市政发展的考虑，这里没什么拔地而起的高楼大厦。人行道旁栽的几条绿化带可以勉强作为庇荫的去向，这还得靠着树木撇下的影子。</p><p class="story-paragraph">悬日熔金，在地面投出刺人的反光，无处可躲。</p><p class="story-paragraph">他们一行人到的时候正值中午，在烧鸟店围成一团吃了饭。</p><p class="story-paragraph">纱夏谨小慎微，努力克制着自己的动作幅度。她担心那有点宽大的衬衫袖，也许会在伸手夹菜的时候暴露妈妈留下的吻痕。所以女孩连章鱼烧的味道都没尝，那离她太远了。纱夏只一个劲地扒拉着面前的鸡块，吃得有点恶心。</p><p class="story-paragraph">来到这里是为了去富士山，她再小些的时候被南领着见识过了，所以也算是故地重游。当时坐了大巴上山，在公路上蜿蜒前行的时候，纱夏以惊叹的眼光去看云卷云舒，它们翩翩起舞，像是被造物主用来点缀天空而施以逶迤的洁白绩纱。天幕下的银峰绒布里交杂着生出绿色的长鞭，挂在山的侧面。</p><p class="story-paragraph">纱夏来时问过妈妈，知道这是座休眠火山。她有想，说不定藏在里面的不是熔岩，而是冬雪。说不定它也压根儿没有休眠，甚至每年一到九月份就开始喷发，将银白涂料盖在山口。</p><p class="story-paragraph">与现在的风景大抵全然不同。</p><p class="story-paragraph">见识过正儿八经的花火大会，纱夏顺路来看看夏日的富士山，她觉得这总是不亏的。但中暑不是件好受的事，谁也不敢在正午的这个点逃出去。峰回路转是个听起来都足够幸福的词语——他们本以为只能无所事事地挨过这漫长的时光，却迎来了转机。</p><p class="story-paragraph">这家饭店的展示柜里放着和歌纸牌。</p><p class="story-paragraph">找老板打听了，原来很有名的比赛选手也来这里吃过饭，他提前做好一切准备，买了几幅，人走之后也一直放着没动。</p><p class="story-paragraph">店面门庭冷清，大多数食客已经用完餐回家。反正在酒店也得等着，回去还要先步行一段距离。两点之后再出发，想着有人熟悉“小仓百人一首”的玩法，头脑明智的人干脆借来一副打发时间。</p><p class="story-paragraph">不好意思厚着脸皮占位，高中毕业生们纷纷提议续菜，纱夏忙不迭地补了句“要章鱼小丸子”。</p><p class="story-paragraph">她终于可以在坐席间走来走去，去夹想吃的东西。</p><p class="story-paragraph">每张牌上都写了句诗，全部摊开放在桌上。找个人随机念，念上句就行，谁在牌堆里找到写着下句诗的纸牌就能拿一分。说难不难，也算不上简单，想要赢就得把那一百首和歌背得滚瓜烂熟。</p><p class="story-paragraph">再加一点，动作必须快，抢不过别人也得输。</p><p class="story-paragraph">纱夏在旁边看得津津有味，虽然她的歌牌玩得并不好。</p><p class="story-paragraph">全都要怪妈妈。</p><p class="story-paragraph">她刚入门，还没尝到歌牌的乐趣，就被名井南杀了个灰头土脸，在那之后兴致全无。妈妈的脑子恐怕是复印机，纱夏忿忿不平。上句念都没念完，南就把牌堆里写着下句诗的纸牌斩飞了。纱夏玩了两局，没拿到什么分。</p><p class="story-paragraph">拿到的分也都是妈妈看她可怜才让给她的。</p><p class="story-paragraph dialogue">“不玩了！”她撅嘴，腮帮子鼓起来：“根本赢不过你。”南笑着去揉她的脑袋，还捏她软乎的脸：“纱夏想赢过妈妈的话，”她在玩游戏的时获胜，神情总是最得意的，只怕伤到小女孩的自尊心，才谦虚补充：“再下一点功夫就好了。”</p><p class="story-paragraph">不信你的鬼话。</p><p class="story-paragraph">纱夏没说出来，要下多少功夫才能赢过南，虽然不知道具体数值，但肯定不是妈妈说的“一点”。</p><p class="story-paragraph">不过，一到南几乎什么都会，纱夏又为她自豪。</p><p class="story-paragraph">手里拿到的牌。</p><p class="story-paragraph">女孩看看那几张因为激动被捏得有点皱巴巴的硬纸。只有一张是她抢先抓住的。纱夏觉得这句诗很浪漫，牌摆的位置又靠近自己，所以一下就拿到了。</p><p class="story-paragraph dialogue">“昨夜相逢后——”</p><p class="story-paragraph">同学们簇拥着念诗的那个男生发出了下一轮抢牌的信号。熟悉的诗句，映射出交叠的记忆，让少女重回现实。</p><p class="story-paragraph">纱夏想起与南共度的夜月花朝…妈妈那如柔丝一样、又如弯弓一般的眉，掩映着盈满灼灼爱意的双眸。下半句从她心里滚落。左胸方寸之地所埋下的器官，从未像今天这样，肆意地翻动起她世界的山江河海。纱夏眼睫轻颤。</p><p class="story-paragraph">她喃喃低语，只说给自己听。</p><p class="story-paragraph">依依…恋世间。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph dialogue">“您来了。”秘书麻生奈未在办公室等着南。“客人到了吗？”她向助理点头，看到内间的门已掩上。</p><p class="story-paragraph">答案不必再费口舌多说。</p><p class="story-paragraph">挂在白墙上的电子表再跳两分钟就到一点了，同约定好的不差。</p><p class="story-paragraph dialogue">“婚姻纠纷，诉讼请求是关于共同财产分割的问题，”奈未照例承担了记事的任务：“被告预约了半个小时的咨询。”南应了，她向来是按贴好的标签页来给资料分类，所以很轻松地抽出档案袋，又从圆筒里挑了支签字笔。</p><p class="story-paragraph">进门之前，她在手腕上轻敲两下示意秘书：“看好时间。”</p><p class="story-paragraph">听到开门声，坐在椅子上的男人有些局促地起身。</p><p class="story-paragraph dialogue">“名井…小姐，您好。”</p><p class="story-paragraph">他没想到，日比谷的这家事务所里居然有这么漂亮的…</p><p class="story-paragraph">在来之前的的确确已经看到了照片没错。推荐名井的同僚也让他做好心理准备，说这位律师可是个大美人。</p><p class="story-paragraph dialogue">“千万别在咨询的时候掉口水。”他被这样调侃道。</p><p class="story-paragraph">真人出现在眼前的时候，委托人就知道那些描述都不夸张。</p><p class="story-paragraph dialogue">“市村先生，您好，”南把办公椅拉出来，朝他礼貌地微笑，示意对方坐下：“久等了。”</p><p class="story-paragraph">市村发现律师的手指上戴了个东西。当女人的纤纤素手放在黑色的桌上时，那个东西泛出的光泽十分显眼。</p><p class="story-paragraph">是钻戒。他也跟着坐下。谈判的时间不长，案子本身简单，没有复杂的细枝末节。</p><p class="story-paragraph dialogue">“您在离婚前给儿子买了套房，它的所有权没变更。”南最后简明扼要地总结。“没错。”</p><p class="story-paragraph dialogue">“现在是您和您前妻的共有财产，对方起诉是不打算将属于自己的房子分给小孩，”她快速地在纸张上补了几笔：“要求您撤回赠予房屋的约定。”</p><p class="story-paragraph dialogue">“嗯，她有她的想法，但我也有我的，”市村语气很坚定，再度强调自己的请求：“我不会撤回，作为父母的应该信守承诺，房子是我给我孩子的礼物。”</p><p class="story-paragraph">他发现，律师在听到“孩子”一词时，表情松动很多。</p><p class="story-paragraph">那副客套疏离表情下的五官就像是从冰层里解放，被蜿蜒复苏的情感溪流一点点占据。“名井小姐，或许您……”市村想问她是不是也有孩子，却觉得有些唐突，又停住了。</p><p class="story-paragraph dialogue">“您说就是。”南看他欲言又止，却一直盯着自己的脸看，于是便认真地问他。</p><p class="story-paragraph dialogue">“我的脸上沾了什么东西么？”“没有。”市村摆摆手，觉得还是不该问。</p><p class="story-paragraph">转移话题，他又回到这次来访的核心事项：“那么，裁判…”</p><p class="story-paragraph dialogue">“请放心，我们的判事会偏袒您这种情况，”南把翻出来的文书收回夹子，言语间透出的胆量不显得傲慢：“我有把握胜诉，您只要相信我就好。”</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph dialogue">“名井律师，”奈未的声音被门掩得不大清晰：“半小时已经到了。”</p><p class="story-paragraph">市村知道对方的时间是寸土寸金，该说的都说完了，于是男人起身告别，南和奈未将他送到门口。</p><p class="story-paragraph">目送客户的背影消失，她才回过头来问自己的秘书。</p><p class="story-paragraph dialogue">“还有什么要处理的吗？”南斜靠在桌侧线条分明的硬角上，午间的阳光沾到了她的发尾。在昨天的电话里，奈未提到了一件事，说是要当面交待，正是为此南才匆匆赶来。</p><p class="story-paragraph">工作时间总是不确定。</p><p class="story-paragraph">干他们这行的人，都是靠着资历在社会上混口饭吃。讲个前后辈的礼仪，不管胜诉率有多高，人要是年轻，周末依然没办法休息，得坐在这和客户周旋。</p><p class="story-paragraph">但南的地位不一般，她已经坐到了这个位子上。这些可有可无的官司纠纷完全可以为了女儿往后推迟。要不是听到奈未压低了声音、甚至是在知道自己去爱知县找女儿之后，也依然坚持要她回来一趟。南还真的不想就这样离开纱夏。</p><p class="story-paragraph dialogue">“老板那里会有个案子，”奈未小心地观察女人的神色：“是小道消息，因为检方还在收集罪证。人在看守所里押着。”</p><p class="story-paragraph dialogue">“检方参与就是刑事案件。”南去确认，她在看自己的日历表。“是的，案子比较特殊，媒体没怎么报道。”</p><p class="story-paragraph">南的眼皮跳了一下，像是察觉到什么地抬起了头。“他们打算以什么罪名起诉？”奈未看着精明的上司好像猜到了一两分，咽了咽口水。“罪名是…毒品走私。”律师沉默了，没说话。</p><p class="story-paragraph dialogue">“老板知道您的原则，但是他还是想再争取一下，”奈未有点着急地去补充，因为南听到这四个字，就好像被惹火的猫科动物，浑身的毛都炸了：“如果能接下这个案子，在审判的时候拿到最低刑罚，会对事务所…”</p><p class="story-paragraph dialogue">“我不为贩毒的人辩护，更别说真心实意为这种人减刑。”她没等秘书说完，打断了剩下的话。</p><p class="story-paragraph">名井南没再看日程表，她刚刚还在盘算着哪天有空，可以去看守所见见这个案子的委托人。</p><p class="story-paragraph dialogue">“您不接的话，案子就会分给神木律师…”奈未怕她的风头被那个倒人胃口的中年男人压倒：“老板也是欣赏您的能力，所以才…”</p><p class="story-paragraph">不能再说下去了，奈未想。触到了这人碰不得的逆鳞。</p><p class="story-paragraph">南点到为止——虽然她没有更生气，办公室的氛围却冷冽得很。奈未拿着案子的初动调查报告书，这也是一定要她回来的原因。</p><p class="story-paragraph">得把这份称得上是机密的文件交到南手上。可是眼下的这种情况…又怎么能做得到呢？</p><p class="story-paragraph dialogue">“既然您不愿意，我让板仓先生另找其他人。”奈未看着南已经把单肩包挎好，只能出此下策了。</p><p class="story-paragraph">南掩饰了其他情绪，淡淡回应一句辛苦了。</p><p class="story-paragraph dialogue">“名井律师，抱歉把您从爱知县叫回来。”奈未叫住了她，有点忐忑。</p><p class="story-paragraph dialogue">“说了让您不愉快的事…您和纱夏玩得还开心吗？”</p><p class="story-paragraph">听到女儿的名字，南默认点头，神色柔和了些。</p><p class="story-paragraph dialogue">“真羡慕您和女儿的感情，”看到律师露出这样的表情，奈未稍微放下心来：“纱夏都这么大了，和您关系还是一如既往地好。”</p><p class="story-paragraph">感情好…</p><p class="story-paragraph">南想起纱夏在床上和自己接吻，又低泣求饶的画面。</p><p class="story-paragraph">她不露痕迹地勾唇笑笑。关系的确很好，而且变得更好了。</p><p class="story-paragraph">再等两天，南心想。</p><p class="story-paragraph">女儿就会回来了。</p><p class="story-paragraph">她很想念纱夏。</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">纱夏在静冈搭了 JR 东海特急列车到东京站。在她下新干线没多久以后，妈妈就给她打电话来了。</p><p class="story-paragraph dialogue">“到了？需不需要我来接你？”交流电没能藏住南悦耳的嗓音。</p><p class="story-paragraph">女孩没察觉自己在微笑。</p><p class="story-paragraph dialogue">“现在堵车，我坐电车回来会更快。”纱夏敏锐地捉到妈妈语气里的倦意，不想麻烦南开车，她拒绝了这个提议。</p><p class="story-paragraph dialogue">“好，饭呢，吃了吗？”南又问了，怕妈妈还要给她准备晚餐，所以纱夏也把用餐问题早早地解决了。“吃了三明治。”她回答妈妈，手上拿了西瓜卡，刷闸机进到站里。“那我在家里等你，”南停顿了一下：“路上注意安全。”</p><p class="story-paragraph">纱夏转到丸之内线，一路经过了银座，最后从新宿站出来。</p><p class="story-paragraph">天黑了，歌舞伎町的霓虹灯招牌在闪光。</p><p class="story-paragraph">慕名而来的游客很多，有的本地人也爱来这里找乐子。东京的市中心，比举行烟火祭的乡下还要热闹不少。她不敢太往里走。</p><p class="story-paragraph">以前和同学出来逛街的时候，被牛郎搭讪过。长相不错的大哥哥站在纱夏面前，嬉皮笑脸地调侃她，问要不要试试开荤的感觉。</p><p class="story-paragraph dialogue">“这么漂亮的妹妹，可以免费来一次。”</p><p class="story-paragraph">比现在还要青涩、薄脸皮的纱夏想都没想就拒绝了，但她脸红得彻底，也没能用说话表达自己的意思，只是往后退离了红灯区。</p><p class="story-paragraph">之后一周女孩偶尔做梦，以另外的方式和大哥哥再见过。</p><p class="story-paragraph">醒来的时候，纱夏总感觉脑袋昏沉沉的，身体也会泛起空虚感。激素这种东西真是害人不浅，光是暗示强的句子，就能挑逗少女的春心。</p><p class="story-paragraph">学校的性教育工作做得好。虽然大多数时间是和妈妈生活，纱夏不太好意思主动开口提起桃色之事。但和班上同学闲谈一两句，总会不可避免地听到这种话。有早恋的同学。大胆的孩子甚至已经有了性经历，闺房秘事这种事就在玩得好的几个女生之间传来传去，纱夏听得面红耳赤，恨不得把耳朵堵住。她不是没有自慰过。在发现用大腿夹着被子可以让身体舒服之后…极少数情况下，纱夏会这样安慰自己，但又害羞，她也不敢用手去摸。</p><p class="story-paragraph">自慰到达高潮，也怕被妈妈发现，她总会有点罪恶感。</p><p class="story-paragraph">这种隐秘的刺激，让纱夏一度有点沉迷于其中。</p><p class="story-paragraph">不过也仅仅维持了一段时间而已，升入高中最后一个年级，她课业的负担又加重了不少，纱夏慢慢地没了这种心思。</p><p class="story-paragraph">久而久之，情色的想法也被抛至脑后。</p><p class="story-paragraph">妈妈是成年人，难道不会想要吗…纱夏以前有过这个疑问。</p><p class="story-paragraph">和南生活了八年，没看到她带哪个男人回过家，在纱夏的印象里，南也没什么称得上是能玩暧昧的对象。</p><p class="story-paragraph">妈妈好像，仅仅只在身边留了一个位置。这个位置是给自己的。</p><p class="story-paragraph">是不是过得太清心寡欲了？</p><p class="story-paragraph">可是…又和前几天晚上的妈妈完全不一样…</p><p class="story-paragraph">纱夏耳朵尖冒了淡粉色。</p><p class="story-paragraph">一路上想着这些，女孩在不知不觉中离家更近。</p><p class="story-paragraph">公寓楼就在新宿站附近的高档小区。</p><p class="story-paragraph">纱夏没走几步路就到了。一层楼两户，她坐电梯上来。深棕色的进户门上挂了写着‘Myoui’的门牌。行李箱的轮子在空旷的楼道间发出堪比与巨响的轰鸣。这没给纱夏在门口踌躇犹豫的机会，她想，妈妈肯定已经听到了。</p><p class="story-paragraph">开门的时候钥匙都插不进锁孔，纱夏手心有点出汗。</p><p class="story-paragraph">橙树的香气在燃烧，她反应过来，是南点了香氛蜡烛。</p><p class="story-paragraph">客厅里只开了一盏护眼灯，只有坐在它身边的人才能看清周围的东西。妈妈半躺在沙发上看书，她应该是洗完澡了，黑发像翎羽一样自然地披在肩头。听到纱夏开门进来的声音，南也没说话，只是静静地翻着手头的小说。她好像沉浸在故事的氛围里。</p><p class="story-paragraph dialogue">“我回来了。”纱夏怕出声太突兀，又不想被妈妈无视，所以把音量控制了一下，不至于吵到南，也能宣布自己的存在。“欢迎回来。”妈妈回她，往下再读了几句，视线才从口袋书转移到了纱夏身上。</p><p class="story-paragraph dialogue">“不早了。”她站起来，把书搁在茶几上，朝着女孩那边走过去。</p><p class="story-paragraph dialogue">“休息一会儿就去洗澡吧，”南接过纱夏的行李：“我帮你收拾。”</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph">纱夏躺在床上，有点忐忑。应该要睡觉了，可她好像不怎么睡得着。</p><p class="story-paragraph">以为见面的时候会有不一样的气氛，但也和往常没什么区别。她预设了好多种情况，却无奈地发现妈妈对自己不是很热情。</p><p class="story-paragraph">洗完澡出来没看见南，应该是待在主卧了…那间房门是关上的，纱夏不好意思去敲。有很多话想和她说，有一肚子问题想问。为什么在妈妈面前，她一句话都说不出来呢？</p><p class="story-paragraph">纱夏伸手要去按床头的灯，打算先熄灭光源。灯开着会一直胡思乱想，她有点烦。手伸出去还没碰到开关，门被敲响了。“纱夏，”女孩听到声音，是妈妈：“睡了吗？”</p><p class="story-paragraph">她没应，但门还是被打开了，南站在门口。</p><p class="story-paragraph">妈妈从自己回来之后就挺冷淡的，所以纱夏也在和南置气。</p><p class="story-paragraph dialogue">“我还没说话呢……”</p><p class="story-paragraph">这句话的意思是，还没经过同意，南就擅自开门了。</p><p class="story-paragraph dialogue">“猜你没睡。”南移步到她床边。</p><p class="story-paragraph">纱夏和她顶嘴：“那我万一睡了呢？你这样就会吵醒我了。”</p><p class="story-paragraph dialogue">“不会的，”南轻轻地抛出自己的观点：“猜你睡不着。”</p><p class="story-paragraph">纱夏看着她笃定的样子，哑了嗓子也没说出来话。妈妈似笑非笑，眸光里蕴起了水雾。</p><p class="story-paragraph">她都不敢用力出气了。</p><p class="story-paragraph dialogue">“那…你来干嘛？”缓了一会儿纱夏才开口。“让你乖乖睡着，”南对纱夏说：“把眼睛闭上。”看女儿愣着没动，她重复了一遍：“闭眼。”</p><p class="story-paragraph">拗不过。纱夏还是听了妈妈的话。</p><p class="story-paragraph">女人的五指插进了她的发间，是在固定她的脑袋。纱夏在闭上眼睛的时候，听觉就更灵敏了。</p><p class="story-paragraph">她知道南在靠近她。</p><p class="story-paragraph">心跳的声音好像太响，纱夏怕被听到。</p><p class="story-paragraph">但是全身的血液都在不受控制地奔涌流动。</p><p class="story-paragraph">妈妈是要吻她吗？还是想，和她做更亲密的…</p><p class="story-paragraph">三秒，两秒——在磨人的窒息和期待中，纱夏先跳出来。她慌张地把头偏到一边去，躲开了名井南。</p><p class="story-paragraph">没敢看好像有点惊讶的妈妈，纱夏侧过身，死死地盯着被子。</p><p class="story-paragraph dialogue">“现在不行。”她忸怩道，红晕漫在她身上。“我来姨妈了，”想起她泡温泉的时候，在妈妈面前撒了次谎，怕南不信，她又说：“这次是真的，没骗你。”直到女人低低的笑荡漾开来，她才去看南。</p><p class="story-paragraph">视线落在对方的手上，纱夏突然知道南想干嘛了。她懊恼的神色明明白白地全给南看到了。</p><p class="story-paragraph">妈妈拿着的东西是…蒸汽眼罩。</p><p class="story-paragraph">如果没躲的话，南现在应该已经帮自己戴上了。她刚刚都说了什么…</p><p class="story-paragraph">看纱夏张皇地不停眨眼，南就更想挪揄她。</p><p class="story-paragraph dialogue">“那你的意思是，”她凑过去了一点，能闻到女儿嘴里吐出来牙膏的薄荷气味：“没来姨妈的时候就行了？”</p><p class="story-paragraph">至于是什么行不行的问题，两人都心知肚明。</p><p class="story-paragraph">纱夏的嘴张张合合，脸部表情变化有趣得很，最终只憋出一句话。</p><p class="story-paragraph dialogue">“我要睡了。”</p><p class="story-paragraph">她拉一下被子，作势要倒下去。“别嘴硬，”南把女儿扶住了：“戴上再睡，你看你黑眼圈重得成什么样子了。”还不是你害的，纱夏腹诽道。</p><p class="story-paragraph">没等妈妈要求，她就主动把眼睛闭上。自作多情真的很让人丢脸。</p><p class="story-paragraph">可是等了很久，对方也没有一点动静。</p><p class="story-paragraph">纱夏闻到眼罩的香味了，好像是柚子的味道。已经开始发热了的话，妈妈怎么还不用呢？这样很浪费。</p><p class="story-paragraph">纱夏等得快要不耐烦，她就差一点要看南在做什么了。</p><p class="story-paragraph">上一个回合留下的吻如愿以偿地降临，她的肩膀被抵在了床头。</p><p class="story-paragraph">两人本该都清醒些，纱夏却先投降。</p><p class="story-paragraph">虽然不愿意承认，但从进家门的时候就开始期待。</p><p class="story-paragraph">她等这个吻等了很久。</p><p class="story-paragraph">想和妈妈…接吻。</p><p class="story-paragraph">纱夏喜欢自己的舌头和妈妈的舌头缠在一起的感觉。</p><p class="story-paragraph">女孩情不自禁地去搂南的脖子。</p><p class="story-paragraph">感觉到女儿在小心又胆怯地回应，南索取得更加厉害。</p><p class="story-paragraph">纱夏是新手，吻技生涩得让她想笑，却又动人得紧。</p><p class="story-paragraph">南不想放开她。</p><p class="story-paragraph">吻了好一会儿，你来我往的，直到纱夏开始轻推妈妈。对方不为所动。她的心跳得更快，呼吸变得重了一些，却还是感觉周身的空气很稀薄。</p><p class="story-paragraph">再不分开就要窒息，纱夏和南拉开了一点距离，虽然水光潋滟的唇瓣还以一种暧昧的角度贴在一起——好像再过一会她们又要开始接吻一样，但这已经足够女孩开始调整混乱的呼吸了。</p><p class="story-paragraph dialogue">“你怎么…”纱夏在喘气，没完全恢复过来。</p><p class="story-paragraph dialogue">“今天放过你，”南亲热地挠挠她的耳朵，言语里露骨的暗示让女儿把头低了下去：“亲到了，这下睡得着了吗？”</p><p class="story-paragraph">有这么明显吗…全被发现了。纱夏有点难以说出口的害羞，她点点头，顺从地闭了眼。</p><p class="story-paragraph">南给有弹性的带子绕了两圈，将它绑在了女儿的后脑勺上。</p><p class="story-paragraph">眼睛被温温热热的布料覆盖住了。</p><p class="story-paragraph">睡觉之前，纱夏推翻了自己的猜测。</p><p class="story-paragraph">原来妈妈也不是那么冷淡的人。</p></div>
