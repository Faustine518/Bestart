        <h2 id="heading-chapter-06">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">咬得太用力了，纱夏吃到了铅笔尾巴的石墨。她皱起眉头，喝了几口水把这种味道冲散。已经思忖好长时间，还是没下定决心。太阳在天上转了个不小的角度，女孩已经被这事困扰将近一天了。</p><p class="story-paragraph">悬在空中的笔尖一直没落下，白纸上留了些未擦除的痕迹，唯一看起来有进展的项目是在旁边垒得越来越高的橡皮屑堆。</p><p class="story-paragraph">从爱知县回来没多久，中心考试的成绩便跟着出来了。除开世界史的分数不那么尽人意，其他的科目都发挥得出乎意料的好。</p><p class="story-paragraph">纱夏在对比高校历年来的招生数据，她按自己所报考的科目一个个检查，划掉了不能选的专业。本来也不打算把纯理科的研究工作当成未来的职业，所以在将物理学、生物科学、化学诸如此类的专业从清单上删除之后，她安心不少。</p><p class="story-paragraph">纱夏的现代社会这一科拿到了最好成绩，离满分不差多远。</p><p class="story-paragraph">其次是国语。</p><p class="story-paragraph">按兴趣再修修改改，在初步框定的范围里，最后能选的也就只剩那么几个了。</p><p class="story-paragraph">文学、法学，以及心理学。好歹不是完全没有头绪。女孩活动了一下肩膀和脖子，她长时间专注地低着头，现在肌肉都有点僵硬。堆满的晚霞是暮色降临的象征，可以准备晚饭了。便利店和窄小的马路之间有行人穿梭，染成金黄色的点点碎云在天际的另一侧。</p><p class="story-paragraph">纱夏发消息给妈妈。“裁判结束了吗？”没过一会儿收到了消息，南很快就回了她：“嗯，回家路上。”</p><p class="story-paragraph">纱夏去到厨房，打算倒腾点吃的。一起去超市买来的速冻饺子还有剩下的，她把包装纸五马分尸，盛了内容物到碗里。</p><p class="story-paragraph">直接加热也可以，但那是自己赶时间去上课时才派上用场的吃法。</p><p class="story-paragraph">纱夏不打算弄得太简单。</p><p class="story-paragraph">她扫视了一下冰箱，觉得应该再找个什么时间去逛一下街，把货给补好才行。不过，纱夏还是有机会做个菜。</p><p class="story-paragraph">夹层角落里那两个相依为命的鸡蛋很是惹人注目。反正两人的食量加起来也不大，这些东西应付一下今天的晚餐还是绰绰有余的。</p><p class="story-paragraph">她用油热了锅，把打好的蛋液往里倒，又眼疾手快地拿木制锅铲去翻动它们，怕火开得太大会烧糊。</p><p class="story-paragraph">纱夏下午思考了很长时间，这会儿确实有点饿。黄澄的鸡蛋已经有点松软的质地了，和调味汁拌在一起，香味出来得很快。但肯定还没熟好，为了转移注意力，她又去看另一个锅子里蒸着的饺子。</p><p class="story-paragraph">纱夏拿筷子去试，发现面皮基本上都软了，很轻易地被她戳破，于是夹起一个吹了两三下就送到嘴里。</p><p class="story-paragraph">猪肉和韭菜的内馅果然是最好的搭配，女孩满足得眉毛都扬起来。如果南看到她这副样子，一定会调侃她，说她像只小狗。</p><p class="story-paragraph">咽下最后一口，时间把握得也刚好，纱夏去弄隔壁煎得差不多的蛋卷。</p><p class="story-paragraph">这次也照例完成得不错。</p><p class="story-paragraph">把两道菜都装进笠式碗，她听到家里的门被打开，高跟鞋踩在地板上的声音清脆。</p><p class="story-paragraph">南心神领会地在厨房门口捕捉到了纱夏轻捷的身影。</p><p class="story-paragraph">女孩被热气熏得有点出汗。</p><p class="story-paragraph">妈妈上班的时候总是穿着女式西装，和在家里的风格是截然不同的。看起来干练又帅气。她肩部的线条，好像是为了嵌合西装款式才生成那个样子。要是自己真的是小狗，那就会有尾巴，纱夏想。恐怕在见到妈妈的时候，它会摇得最开心。</p><p class="story-paragraph dialogue">“欢迎回来。”</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph dialogue">“判决结果等几天就能出来了吗？”纱夏把碗推过去，南给女儿夹了几个离她更近的饺子。“嗯，一周之内。”“硕以，”纱夏嚼着东西，口齿有点不太清楚：“你觉得法院会肿么判？”被这样说话的方法逗笑了，南等她做完了吞咽的动作之后才接着说。“没什么值得争议的地方，驳回上诉，房子的所有权，”为了方便纱夏理解，她做了小小的停顿：“大概会在他们的儿子成年之后转到他的名下。”“那就是又胜诉了，”纱夏比她自己获得成就还要开心：“妈妈是不是全东京最厉害的女律师啊？”“被别人听到的话，就要说我得意忘形了，”南开着玩笑去教训她：“这么简单的官司也要拿出来显摆。”</p><p class="story-paragraph dialogue">“我没说错，”纱夏朝她眨眨眼，埋下头继续吃饭：“在我心里是最厉害的。”被夸的感觉很好，南决定礼尚往来。</p><p class="story-paragraph">视线落在这桌菜上，女人忍不住表扬纱夏：“你的厨艺又进步不少。”南用筷子把煎蛋卷夹碎，她喜欢这样吃。</p><p class="story-paragraph dialogue">“我也觉得，”纱夏一点都不谦虚地回答妈妈，又觉得有点可惜地补充：“本来想给你在上面涂番茄酱的，可是家里没有了…我到时候去买。”</p><p class="story-paragraph dialogue">“好，”南温柔的卧蚕浮现出来：“周末一起去。”</p><p class="story-paragraph dialogue">“不过，”雀跃的小心思又露头了，怕像上次一样，把念头直截了当地写在脸上给妈妈发现，纱夏这回稍微学聪明了点，及时转移了话题：“要当一名好律师应该很难吧。”</p><p class="story-paragraph">纱夏今天一整天都在选专业。南知道这件事，所以没觉得突兀：“刚要问，你想学法？”</p><p class="story-paragraph">小孩点了下头：“还有其他想学的，妈妈要不要猜猜看？”</p><p class="story-paragraph">南停下了手中的动作，很配合女儿，抿着唇思考：“有文学吗？”</p><p class="story-paragraph dialogue">“有，”纱夏笑眯眯地肯定：“怎么猜到的？”</p><p class="story-paragraph dialogue">“国语从小就很好，”南先从好理由开始列举，女孩还很满足。</p><p class="story-paragraph dialogue">“喜欢看书喜欢得眼睛都不要了，晚上还偷偷开手电筒躲在被子里读小说。”说到面前这人小时候的罪行时，南发现女儿变得有点窘迫。</p><p class="story-paragraph dialogue">“哦…”纱夏因心虚小声地应着妈妈。</p><p class="story-paragraph dialogue">“需要我给你出主意？”南问。“想听你的意见。”妈妈比她还要了解自己，纱夏觉得听听没坏处。</p><p class="story-paragraph dialogue">“如果学法，毕业可以考虑直接来我的事务所。”南漫不经心地把话摆出来，好像不知道她这随口一提的约定，会引得多少毕业生对纱夏投来嫉恨的眼光。</p><p class="story-paragraph dialogue">“会不会太高调了？”纱夏的眼睛瞪得圆圆的。</p><p class="story-paragraph">那可是全日本数一数二的律师事务所呢。</p><p class="story-paragraph dialogue">“想多了，真本事才是最重要的，我充其量只是你的推荐人而已。”南不加掩饰地笑她的天真。“那你还这么肯定…”“嗯，”律师很认真地考虑着：“因为我可以教你，而且你聪明。”妈妈的期待和信任，让纱夏有点不好意思。</p><p class="story-paragraph">可要是这样的想象实现了。</p><p class="story-paragraph">与妈妈一起工作，那会是什么样子的？</p><p class="story-paragraph">有理由多看妈妈两眼了。不错过她的每一场裁判，也可以和她在逼仄的茶水间相遇…</p><p class="story-paragraph">纱夏半敛了眼帘。</p><p class="story-paragraph">仅仅是在家里，她都忍不住要…</p><p class="story-paragraph">女孩埋怨自己的不争气。</p><p class="story-paragraph">如果真的和妈妈成了同事…还会有心思扑在正经事上吗？</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph dialogue">“虾好像不是很新鲜。”南离水箱有点远，她眯起眼睛在看。</p><p class="story-paragraph dialogue">“是不是下午来的原因？”纱夏在旁边把着购物车，倒觉得这些被关起来的海产品和平时没什么区别，她只是在给妈妈的结论作一个推测。</p><p class="story-paragraph dialogue">“有可能，那换一个菜可以吗，纱夏还有什么想吃的？”南自然地从女儿手里接过了推车，开始寻找别的食材。</p><p class="story-paragraph dialogue">“三文鱼？”纱夏看到切好了的刺身，突然有点食欲。循声看到女儿左手指着的那个橱窗，南有些意外地挑了挑眉：“可是做起来没什么技术含量。”“没关系，和你一起吃就很开心了，”纱夏侧过身子去拿：“两盒够了吗？”</p><p class="story-paragraph dialogue">“会吃到撑的。”南接过，示意女孩过来挽着自己的胳膊。</p><p class="story-paragraph">周末的商场依然很拥挤。不过不用太担心了，她的纱夏如今长得比她还要高一点点了。不会再和小时候一样…总害怕她在人潮里走丢。</p><p class="story-paragraph dialogue">“完美，没有漏掉的。”纱夏拿着手机，她在比对列好的购物清单。</p><p class="story-paragraph">妈妈不爱去热闹的地方，每次出来逛街的目的性都很明确，一般买完了就撤退。</p><p class="story-paragraph dialogue">“买了这么多东西，我不在家的话，妈妈也要好好吃饭，不要随便应付了事。”纱夏去牵南，她的五指从缝隙里挤进去，扣紧了妈妈的手。</p><p class="story-paragraph">真快，纱夏再等不久就要离开家了。南怔怔地想，她盯着女儿的眉梢出神。</p><p class="story-paragraph dialogue">“不过我会经常回来的，”纱夏怕她失落，追着她调皮地补充：“为了监督你。”</p><p class="story-paragraph">南好心情地捏捏她的手心：“有把握吗？”</p><p class="story-paragraph">她指的是纱夏填的志愿学校。</p><p class="story-paragraph dialogue">“当然，录到我，他们高兴还来不及。”</p><p class="story-paragraph dialogue">“最后还是选了文学，”两人已经走到了结账的队伍里，南敲敲纱夏的脑袋：“傻瓜，有我这么好的资源，也不会利用一下。”</p><p class="story-paragraph dialogue">“利用了的，”纱夏被妈妈教训了也不委屈，她吸吸鼻子装可怜：“所以选了离家近的学校。”</p><p class="story-paragraph">从超市出来的时候有点下雨，幸好南是开车来的。</p><p class="story-paragraph">地下停车场不通风，刚还待在空调房里，她们现在像挨了一闷棍，被热浪轰得有点晕，坐到车上打开冷气才好受了一点。</p><p class="story-paragraph">南熟练地抬起手刹，慢慢去踩油门，轿车平稳地从停车位上滑了出去。</p><p class="story-paragraph">还没开到室外，车里突然响了铃声。</p><p class="story-paragraph">有人给南打电话。</p><p class="story-paragraph">停车场里信号不好，她让纱夏别管放在架子上振动的手机。直到把车开到下一个路口，南才在等红绿灯的时候回拨过去。</p><p class="story-paragraph">那头是个男人，不过听筒一直靠在南的耳边，纱夏听不到他们在说什么。妈妈简单地应了几声，回了句“发地址过来”，在车再次开动前把电话挂断，又将手机放回了原位。</p><p class="story-paragraph dialogue">“纱夏，”她的语气里有点歉意：“今晚突然有个应酬，我可能不在家吃饭了。”</p><p class="story-paragraph dialogue">“没关系，我自己也可以。”纱夏很懂事地回她。当律师的女儿这么久了，一个人待在家里的这种事…</p><p class="story-paragraph">她早就习惯了。</p><p class="story-paragraph">只不过之前说好今晚一起吃饭，南还说会亲自下厨。妈妈这下又被一个电话叫走了。</p><p class="story-paragraph">纱夏忍住了不必要克制的小任性：“工作重要，”她扭头看看南：“那三文鱼我不吃，等你回来明天再吃好不好？”</p><p class="story-paragraph dialogue">“好。”南说，纱夏的乖巧让她的心脏有点柔软地抽痛着。</p><p class="story-paragraph">她专注地开车。</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">纱夏本来以为妈妈把她送到公寓楼下就要走了，没想到南不仅下车，还进了电梯。</p><p class="story-paragraph dialogue">“我不可能就穿成这样去吃饭，”南看出女儿的疑问，点醒了她：“再说，买这么多东西，你一个人也不好提。”</p><p class="story-paragraph">所以她们又一前一后地进了家门，南把鞋蹬掉，往衣帽间走。</p><p class="story-paragraph">纱夏趁这个时候把要冷藏的东西一件件地往外掏。</p><p class="story-paragraph">她还在往冰箱里塞采购回来的食材，妈妈就换好衣服出来了，衣服算不上特别正式。但名井南不管怎样都漂亮，所以能光靠脸就把服装衬得很高级。</p><p class="story-paragraph">南已经打了层粉底，但嘴巴还没上妆，纱夏出声提醒她。</p><p class="story-paragraph dialogue">“妈妈不涂口红吗？”</p><p class="story-paragraph">南此刻已经穿好高跟鞋，像是才反应过来一样，她请求纱夏。</p><p class="story-paragraph dialogue">“口红在卧室里，可以帮我把那支偏粉的拿过来吗？”南提示她：“你也夸过好看的。”</p><p class="story-paragraph">女儿听话地去了。</p><p class="story-paragraph">粉色的那支…纱夏在化妆台上寻找，一踏进这一块区域，她就能闻到妈妈最常用的香水味。所以动作在不经意间放慢了。</p><p class="story-paragraph">终于看到了，纱夏怕南的时间被自己耽搁，是踩着小碎步回来的。</p><p class="story-paragraph">她走到南的跟前，而妈妈因为穿了鞋的缘故，又比她高上了不少。</p><p class="story-paragraph dialogue">“给你，是这支…唔…”</p><p class="story-paragraph">南毫无预兆地亲了纱夏。那双唇去探她女儿的，殷切却不鲁莽。柔软又湿热的感觉。</p><p class="story-paragraph">触到了生怯的舌尖，她虚揽着纱夏的腰，不给女儿后退的机会。</p><p class="story-paragraph">南轻轻柔柔地缠住女孩的舌叶，给予纱夏的这个吻就像她本人一样温和缱绻。</p><p class="story-paragraph">松开对方的时候，纱夏又抓着自己的衣服在吸气，耳垂泛红。</p><p class="story-paragraph">忍不住要去笑女儿的稚嫩，南把她拉得更近了：“你怎么一点长进都没有？”</p><p class="story-paragraph">纱夏的鼻尖抵着她妈妈的，而此刻环绕在耳边的是南动听的浅笑。“不要笑…”她抗议着，但对方没有收敛的意思。</p><p class="story-paragraph dialogue">“谢谢纱夏。”觉得闹够了，南接过口红，发现壳子都被纱夏捂得温温热热的。</p><p class="story-paragraph">她看一眼色号，露出一副诧异的样子。</p><p class="story-paragraph dialogue">“看来是我记错了，好像不是这个颜色。”</p><p class="story-paragraph">没错啊？和妈妈给的描述有区别吗？</p><p class="story-paragraph">偏粉的，自己也夸过妈妈涂起来好看的…</p><p class="story-paragraph">电光火石间，纱夏后知后觉地抬头去看名井南。</p><p class="story-paragraph">是故意的，她被耍了。</p><p class="story-paragraph">她的妈妈工作这么久，哪天不打理得整整齐齐的才出门？</p><p class="story-paragraph">南怎么可能忘记上唇妆，只是…</p><p class="story-paragraph">只是因为……</p><p class="story-paragraph">涂了口红不好接吻罢了。</p><p class="story-paragraph">这人在车上还正经得很，一回家就要对自己动手动脚的。</p><p class="story-paragraph">见了南得逞的表情，纱夏觉得这像初恋一样的情愫甜得更厉害。她决定不能这样窝囊下去。</p><p class="story-paragraph">每次都只是妈妈捉弄她，自己也要扳回一城。</p><p class="story-paragraph">纱夏尽力让眼神安定下来，不要因心跳太快而飘忽不停。</p><p class="story-paragraph dialogue">“那你的口红在哪里？”南好看的眉毛挑起来了，她没想到纱夏还要和自己继续讨论这个话题。“我猜应该在车上。”</p><p class="story-paragraph">那就是离家之前，还可以再和她接吻的意思。纱夏得了这个答案，猜测计划是可以进行下去的。</p><p class="story-paragraph">她踮起脚。</p><p class="story-paragraph">怕把妈妈的衣服扯出抹不平的褶皱，所以那双手只是安静地垂在下方。</p><p class="story-paragraph">不知道应该怎么开启唇舌相缠的吻，纱夏带着试探的心情压下了一点力，去描南的唇形。好像她的舌头才是妈妈想要的那支粉色口红一样。</p><p class="story-paragraph">南有点惊讶。</p><p class="story-paragraph">女儿大概不清楚，这种毫无章法的吻会把嘴亲肿吧？</p><p class="story-paragraph">在反应过来以后，也不管晚上还要参加什么酒局，她任由纱夏摆布，很有耐心地纵容着这个小家伙。</p><p class="story-paragraph">在纱夏觉得妈妈好像是木头，亲了这么久还是没反应，想要退开时…</p><p class="story-paragraph">南才回吻她。</p><p class="story-paragraph">女人的动作褪去了前几次的急迫感。</p><p class="story-paragraph">知道纱夏这次是主动方，不会轻易逃跑的。</p><p class="story-paragraph dialogue">“看来以后都要纱夏先做才行。”南通过说话结束了这个吻，她用侧脸蹭蹭女儿：“这次好像没喘不上气来。”</p><p class="story-paragraph">南好像一只猫，纱夏想。</p><p class="story-paragraph dialogue">“你少喝点酒…”她不愿意回答这个丢脸的问题，把头埋在妈妈的怀里，声音有点闷闷的：“对身体不好。”</p><p class="story-paragraph dialogue">“知道，”南亲了亲纱夏头顶的发旋：“别担心。”</p><p class="story-paragraph">她把门打开，单手环着女儿，在哄她：“如果我很晚还没到家，你就先睡。”</p><p class="story-paragraph">纱夏好舍不得她，此刻也只能可怜兮兮地放她离开：“妈妈…”一时冲动，她的问题脱口而出：“今晚我可以…在你的床上睡吗？”</p><p class="story-paragraph dialogue">“可以。”南回答她，眼里的墨色滚动着汹涌的爱意，又在女孩嘴上留下了一个轻吻。</p><p class="story-paragraph dialogue">“纱夏想怎样都可以。”</p><p class="story-paragraph">妈妈关上门出去以后，纱夏这才觉得刚刚的举动是不是太过火了。南留下来的温度还没散掉。她摸摸自己发烫的脸。</p><p class="story-paragraph">温度也要突破阈值了。</p><p class="story-paragraph">自己和南说的那些话、做的那些事。</p><p class="story-paragraph">现在她和名井南的相处方式…</p><p class="story-paragraph">纱夏想把这个让人面红耳赤的想法从脑海里删除。</p><p class="story-paragraph">就好像，她是妈妈的女人一样…</p></div>

<template id="template-chapter-07"><section class="chapter" aria-labelledby="heading-chapter-07">

        <h2 id="heading-chapter-07">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">包厢里的灯调得比大厅稍暗一些，南觉得晃在餐具上的光线开始流动。</p><p class="story-paragraph">好像有点喝醉了。在场的人里面，只有她一个女性。</p><p class="story-paragraph">所有同僚与客户都希望见到漂亮女人出糗，所以无不例外地把南当成靶子，争先恐后地来灌她酒。</p><p class="story-paragraph">幸亏她在这些年的推杯换盏中累积了不少经验，能熟练地使用藏在桌下的手去调换杯子里的内容物，才躲过了其中不怀好意的暗箭。</p><p class="story-paragraph">但又考虑到在他人眼里，自己是实打实地喝下了不少。南只得作出一副不胜桮杓的样子，表示酒量已经到底了。</p><p class="story-paragraph">再喝了小半杯烧酒，她把杯子轻轻搁在圆桌上。此时，听得对面的男人爽朗地笑了两声，南抬眼去看。</p><p class="story-paragraph dialogue">“全凭了名井律师的口才，”对方锐利的目光正锁定在自己身上：“我的产业才能死里逃生。”</p><p class="story-paragraph">福田雄一，她曾经的客户。</p><p class="story-paragraph">资本家以大金额偷漏税的理由被内部举报者告上法庭，而南帮他洗脱了罪名。</p><p class="story-paragraph">这大概是半年以前的事情了。客户用来评价她的词很是夸张，显然是话里有话。“不知这次，能否依旧劳烦名井律师高抬贵手？”</p><p class="story-paragraph">要在饭局到一半，当众人都喝的七荤八素时，才能直奔主题。南看着身旁滴酒未沾，抿着清茶的老板。</p><p class="story-paragraph">她心下了然，知道板仓为何打电话叫自己过来了。酒精成了装聋作哑的借口，她笑而不语，回避了这个问题。只把头发拨到耳后，露了小巧又粉红的耳垂出来。</p><p class="story-paragraph">福田愣住了。美人计这招，果然是百试不厌。虽然有点见风转舵的谄媚，但作为拖延时间的小伎俩，还是足够了。南借机观察对面那人的神色，盘算着要怎样才能继续与他周旋。</p><p class="story-paragraph dialogue">“福田先生，您就别费力气了。”出乎意料。坐在福田左手边的神木律师，在此时打断了他们的客户，竟然给她解了围。会错意了，下一秒她就反应过来，就以神木堂的这副德性——他怎么会错过攻击对手的好机会。</p><p class="story-paragraph">神木涎皮赖脸地同福田开玩笑：“您还不知道呢，想在名井律师那儿讨裁判，是有一套规矩的。”</p><p class="story-paragraph dialogue">“哦？”福田对神木的话很是好奇：“这倒是我第一次听说，什么规矩？”“别看她这样，人可是倔得很。”神木看似醉醺醺的，不知是不是故意这样：“和毒沾边的案子，她从来不接。”</p><p class="story-paragraph dialogue">“名井律师，我一直很想问，”他讲个没停，把矛头对准名井，耍起了酒疯：“你是不是和毒贩子有什么过节啊？”</p><p class="story-paragraph dialogue">“神木。”南那边没什么动静，板仓叫停了他：“注意你的措辞。”</p><p class="story-paragraph dialogue">“对不起对不起，有点喝多了，口无遮拦的话别放在心上，”神木嘴上说着，却根本没有同名井南道歉的意思，反倒在讨好她原来的客户：“我胡说的。”</p><p class="story-paragraph dialogue">“再说了，刚刚的话也不成立，您的弟弟又怎么会是毒贩子？”</p><p class="story-paragraph">福田的眼神不动声色地敛了敛。</p><p class="story-paragraph">自己前不久才摆脱不太光彩的罪名，亲弟弟又在上周入境时被海关搜出了带在身上的致幻药物。</p><p class="story-paragraph">量还不少。</p><p class="story-paragraph">搁在谁身上都会觉得丢脸，他不知如何反应。</p><p class="story-paragraph dialogue">“我看了警方的报告，您猜我发现了什么？”神木在故弄玄虚，看到福田有在认真听他说话，才一鼓作气地说完。“贤弟带回关内的那些东西，虽说有致幻效果，但药理检测的结果都没有出来。”</p><p class="story-paragraph dialogue">“说句实话好了，在我们国家规定的条例里，它根本不能算作毒品，”他拍拍桌子，变得激动起来，声调抑扬顿挫：“药物的成分都是和传统毒品完全不同的。我们怎能就这样坐视不管，让您的弟弟被冠上莫须有的罪名呢？”</p><p class="story-paragraph dialogue">“这我的确清楚，家弟也和我说过，他那是新型…药品。”福田知道弟弟在美国有些狐朋狗友。</p><p class="story-paragraph">那个一根筋的孩子，被发财的念头煽得找不着北，只能靠吸毒寻找刺激。</p><p class="story-paragraph">弟弟没和自己商量，就搞了批货回国，出关时运气好藏了过去，下飞机之后却不小心落了网。</p><p class="story-paragraph">等福田接到弟弟的电话，他才发现在那头与自己对话的人是警察。</p><p class="story-paragraph dialogue">“神木律师，您的意思是？”好像从律师的话里瞧着点希望，福田这样问。</p><p class="story-paragraph dialogue">“我托人查了一下，”神木翻出手机，给客户聊天记录，他有相熟的警察，对方居住在美国的加利福尼亚州：“听说这种新的致幻剂在美国好几个州都很流行，吸它的年轻人都叫它‘bethlehem’。”</p><p class="story-paragraph dialogue">“为什么叫这个？”福田不能理解：“啊，请见谅，我与家弟不一样，虽然我们关系亲近，但他从小就去了国外，所以英文很流利。比较惭愧，我的英文一点都不好。”</p><p class="story-paragraph dialogue">“伯利恒。是耶稣出生的圣城，坐落在以色列，”板仓在旁边回答：“福田先生不必妄自菲薄，不知道也是很正常的，一般只有基督教徒比较了解这些。”</p><p class="story-paragraph">南在旁边听着，她皱起了眉头，觉得讽刺至极。名字是那些吸毒的年轻人取的，他们大概是觉得这种东西是上帝的恩赐。</p><p class="story-paragraph dialogue">“没错。贤弟在出关时未被拦住，并不是运气有多好，而是美国那边本来就不把伯利恒当作违禁品。”神木紧接着补充：“在日本，伯利恒的存在就是一张白纸，完全不比海洛因，要是可以的话，抓住这个结论作为突破点。</p><p class="story-paragraph">”我有过处理同类案子的经验，“神木拍拍胸口，真诚万分：“您要是愿意寄信赖于我，那真是太好不过，我能保证把这场官司打得完美。”</p><p class="story-paragraph">福田被神木说得动摇了。</p><p class="story-paragraph">他不知道，神木口中说的那个关于名井律师的规矩，是否是真的？</p><p class="story-paragraph">虽然名井还没有作出回应。</p><p class="story-paragraph">但凡事都要以最坏的情况去考虑。</p><p class="story-paragraph">如果是真的…</p><p class="story-paragraph">名井南若是真的对毒品怀着什么恨意，他还把弟弟的案子交给她，会不会有什么风险？神木律师显然已经着手开始进行资料的收集工作。无论是对案子的熟悉程度、还是对其牵涉毒品的调查情况——比起一言未发的名井律师，这位男律师好像更有热枕。</p><p class="story-paragraph dialogue">“板仓先生，”福田询问这家律师事务所的老板：“您看，如果我选择神木律师的话？”</p><p class="story-paragraph dialogue">“神木律师值得您托付信任，”板仓回答，他看着好像因酒精而变得沉默的南，还是放弃了让她接下这个官司的念头：“既然他这次准备如此充分，也主动请缨了，我看您可以放心。”</p><p class="story-paragraph dialogue">“那么就这样定下。”福田答应，想速战速决，不要再拖沓下去。他再次举起酒杯，看向名井南：“名井律师，不好意思，没有提前和您打招呼，就提出了让您有些为难的请求，我自罚一杯。”他三口就干掉了杯子里还满盈着的酒。“您别这么说，”南回以同样的方式，她与他碰杯：“我是觉得神木律师比我适合，他一定能做得很好。”</p><p class="story-paragraph">板仓看着自己最得意的手下。虽说南是微微笑着的，但她在想些什么？</p><p class="story-paragraph">要谈的事谈妥了，该离席了。</p><p class="story-paragraph dialogue">“希望这次，我们的辩手也能让您满意。”事务所老板以茶代酒，他示意所有人共同起身。</p><p class="story-paragraph">酒杯撞在一起时，发出的清脆玻璃声玲珑动听。神木堂在另一边，他透过杯子里盛着的澄澈液体去看名井南。</p><p class="story-paragraph">婊子，他恨不得大声骂出来。装什么清高？</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph dialogue">“南，我送你。”板仓目送福田和神木一起搭上计程车离开之后，叫住了女律师。</p><p class="story-paragraph">他是南的上司，对这个独自带着孩子，又生活在东京的女人很是照料。</p><p class="story-paragraph">单独相处时，他一般就用名井的名字称呼她。</p><p class="story-paragraph dialogue">“我可以叫车回去。”南猜到自己要喝酒，她没开车出来。</p><p class="story-paragraph dialogue">“我有话和你说，”板仓把他那辆 SUV 的副驾驶车门打开了：“上来吧，这么晚了，你一个人也不方便。”</p><p class="story-paragraph">她钻到老板的车上，看到他挂在后视镜上的照片。</p><p class="story-paragraph">是一家三口的全家福。</p><p class="story-paragraph dialogue">“太太在家？”板仓上车扣好安全带之后，南问他。“在，和她说好今晚不喝酒，才准我出来。”板仓无奈地笑笑，语气很温柔，显然只是口头上埋怨而已。</p><p class="story-paragraph">纱夏在她出门时，也说了类似的话。女儿现在，会在家里等着她吗？车在道路上平稳地行驶。南把车窗往按下了点缝。</p><p class="story-paragraph">东京这座城市的灵魂带着夏夜的温热渗了进来。</p><p class="story-paragraph dialogue">“关空调？”板仓问她。“不用。”南轻轻摇了摇头，只呼吸了一下外面的空气，就又把车窗关好了。</p><p class="story-paragraph dialogue">“神木那家伙，”板仓有点愠色：“越来越过分了。”</p><p class="story-paragraph dialogue">“没事，他能这么热情地接下这个案子，我倒还有点谢谢他。”不是阴阳怪气的语气，南的口吻是真的很放松。</p><p class="story-paragraph dialogue">“我以为，好歹都过了七年，你入社时说的话就不算数了。听奈未说你不开心，我还打算再试一试，劝你别太死板了，”他自嘲地说着话：“看来我不够了解你。”</p><p class="story-paragraph">车里没开灯，有一点微弱的光芒，是前方的汽车尾灯留下的。</p><p class="story-paragraph">南有点疲惫，所以在黑暗里把眼睛阖上了。</p><p class="story-paragraph dialogue">“再过七年也一样。”</p><p class="story-paragraph dialogue">“就这样给神木机会…你要是再接个毒品走私的案子，就能大满贯了，履历得有多好看，”板仓往右边打方向盘准备转弯，他觉得很可惜：“接一个也不行吗，特意找了熟人的，案子的性质也没有那么严重。”</p><p class="story-paragraph dialogue">“我知道你在为我着想，谢谢，”她轻轻说：“我不会接的，如果你想让事务所的招牌被砸掉，就尽管把这种案子分给我。”</p><p class="story-paragraph">听出她的坚持，板仓沉默着，到下一个路口时才开口。</p><p class="story-paragraph dialogue">“你今晚没带律师徽章。”</p><p class="story-paragraph">南去看自己空荡荡的衣领，承认了。</p><p class="story-paragraph dialogue">“南，”板仓突然问了她一个问题：“正义和责任，你会选哪一个？”</p><p class="story-paragraph dialogue">“这个问题我早就答过了，”女人终于给了他一点正面的反应，车里的气氛不像之前那样死寂：“现在还要再问一遍吗？”</p><p class="story-paragraph dialogue">“我们的徽章都褪成银色的了，”板仓无视了南的反问，像她的老师一样等着回答：“当了这么多年的律师，你能拎清了吗？”</p><p class="story-paragraph dialogue">“能。”被问到的人想都没想就肯定了。</p><p class="story-paragraph">他停顿了一下，相信了这个回答。</p><p class="story-paragraph">板仓以理性思辨能力闻名于法律界，年轻时创下了难以打破的胜诉率，看人的眼光又极准，这才带着一票律师蒸蒸日上，做出了令人咂舌的成绩。</p><p class="story-paragraph">他机敏地发现，南有个心结——这个心结至少存在了七年，甚至是更久的时间。</p><p class="story-paragraph">最后再对她说点什么吧，他想，难得有这样的机会。“南，这个世上没有什么东西是非黑即白的。即使是走投无路的狂徒，也有可能怀着无法诉诸的温情，”车停了下来，再走几步路就能进门禁，板仓的手按下了解锁车门的按钮：“律师眼里的正义和责任，不该是两个互相矛盾的命题，不是你死我活，存一毁一的关系。”</p><p class="story-paragraph">除了他深爱的法律，板仓很少对身外之物流露出眷恋的情意：“在和平年代里，能守护正义的东西是法典。对我们而言，守护法典就是我们的责任。”</p><p class="story-paragraph dialogue">“你的职业道德不存在问题。我虽不清楚你曾经经历了什么，它让你如此憎恶这类委托人，”板仓很郑重地总结：“我会尊重你，以后不会再让你碰这种案子，你不要再让我失望了。”</p><p class="story-paragraph">南还想同板仓争点什么，又知趣地闭上了嘴。</p><p class="story-paragraph">能换来什么吗？</p><p class="story-paragraph">南和他告别。</p><p class="story-paragraph">临走时，除了感谢老板对自己的理解之外，她什么都没说。</p><p class="story-paragraph">高跟鞋在石砖上敲出的声音回荡着。</p><p class="story-paragraph">刚刚还让人呼吸困难的热浪一霎那间便消失殆尽了，南觉得她的心脏被一股极寒攥住。</p><p class="story-paragraph">对于板仓的理论，她再了解不过了。</p><p class="story-paragraph">走投无路的狂徒，也会在心间藏着对谁的爱意吗？</p><p class="story-paragraph">那么，残忍地夺取了他人生命的凶手…</p><p class="story-paragraph">是不是也有可能是哪个家庭里慈祥和善的父亲？</p><p class="story-paragraph">她的影子被路灯拉得长长的。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">纱夏开着电视，在看今晚的综艺节目。</p><p class="story-paragraph">她有点困，以往能逗她笑的桥段也没了意思。</p><p class="story-paragraph">说好了要去妈妈床上等她的，但纱夏总觉得自己一定要守到南到家。</p><p class="story-paragraph">电视上闪动着的倒计时马上要十一点了。现在也没有太晚。如果午夜时分妈妈还回没来，她再去睡吧。</p><p class="story-paragraph">正这样想着，纱夏听到钥匙插进门锁的声音。</p><p class="story-paragraph">通过对方走路停顿的方法，甚至是分析来人呼吸的节奏——女孩都能感觉到，是名井南回来了。</p><p class="story-paragraph">她往玄关那边迎，果不其然见到了妈妈。</p><p class="story-paragraph">南的状态不是特别好，脸颊上晕了两朵酡红。</p><p class="story-paragraph">看到纱夏来了，她还是对女儿温柔地笑       <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">燃烧的白昼有无尽时？</p><p class="story-paragraph">分不清现实与虚幻是在何处交汇，也辨别不出它们又是在何时分手。</p><p class="story-paragraph">只好耽溺，纱夏想。只好耽溺。</p><p class="story-paragraph">没人凿破冰层，即使另一种形态的水分子酝酿了一场汹涌的暗流。</p><p class="story-paragraph">纱夏猜不出南为何要这样做，有的时候，她也不愿意猜。</p><p class="story-paragraph">妈妈一下发狠地来吻她，会吻得她倒退好几步，肩膀也要撞在白墙上。</p><p class="story-paragraph">但真的痛吗，她忘了。</p><p class="story-paragraph">吻又变得轻轻柔柔，在对刚才的鲁莽道歉。</p><p class="story-paragraph">纱夏不敢和她对视太久。</p><p class="story-paragraph">妈妈大抵是个情场高手，眼里旖旎缠绵的爱意是要交付给情人的。</p><p class="story-paragraph">就好像在春日误入绿意盎然的果园…</p><p class="story-paragraph">纱夏摘下了某颗未熟透的柑桔，橙色的汁液迸在舌尖。</p><p class="story-paragraph">她不知道味蕾究竟尝到了什么，哪种分子占比更多。</p><p class="story-paragraph">究竟是在嫉妒心作用下变得具有存在感的酸涩，还是在抓到了心爱之人后尝到的甜蜜？</p><p class="story-paragraph">洒着馥郁香气的外套被主人狠心地丢在脚边，无论南早晨挑的香水是哪一支，气味都会和她的脸庞很契合。</p><p class="story-paragraph">用几个夜晚就好了，八年间构建出来的生活模式被颠覆得彻彻底底。</p><p class="story-paragraph">如果南是下班回家，她会先把无名指上的戒指取下，怕它弄疼女儿。</p><p class="story-paragraph">纱夏在看到这枚泛着光泽的金属银环时，心下总要闪过无法言说的——她那近乎可以称作是耻部的兴奋感。</p><p class="story-paragraph">藏在胸腔中的气球被绵绵密密的细针戳破，爆裂的噪音在耳膜上留下痛痒的触觉。</p><p class="story-paragraph">她觉得自己就像在和妈妈偷情，对手是一个从未存在过的爸爸，或者是其他的什么人。</p><p class="story-paragraph">也被南这样爱着的人——然而会有吗？</p><p class="story-paragraph">含在口中化掉的禁忌糖衣里，裹着她那颗小小的虚荣心。</p><p class="story-paragraph">纱夏偶尔有点骄傲，毕竟只有当妈妈进入她身体的时候，她才能发现南乖戾的那一面。她越来越爱南了。</p><p class="story-paragraph">等妈妈回家的时候很想她，躺着沙发上的时候也是，想起南把自己压在上面，独断专横地把她的大腿分开的样子。</p><p class="story-paragraph">她喜欢看妈妈难以自持的表情，甚至愿意勾引妈妈…比如故意不穿内裤，她背对着南弯下腰，让妈妈看见自己下身不着一物的淫乱景象。</p><p class="story-paragraph">纱夏浮在心中升起的虚空海洋上，葡萄酒一样澄澈幽深的海面广阔无垠。</p><p class="story-paragraph">咸湿的液体沾满了她的身子，她只能跟着南的节奏漂泊。</p><p class="story-paragraph dialogue">“乖孩子。”南表扬她，纱夏跪在她面前，高高地撅起屁股，含着她的手指。</p><p class="story-paragraph">女儿的花穴被她操得又红又肿。</p><p class="story-paragraph">后入的姿势让纱夏不知道妈妈要做什么，她的身体变得比平时还要敏感。</p><p class="story-paragraph">南故意用力地拍了一下纱夏的屁股，她的五指撞到臀肉上，发出清脆的声音，而纱夏哼哼唧唧地叫唤，只是表面上看起来不满，绞住手指的软肉其实接近崩溃，又收紧了一分。</p><p class="story-paragraph">她呜咽着说不要了，但到达高潮的速度比以往任何时候都要快。</p><p class="story-paragraph">南俯下身，拥住纱夏看起来脆弱不堪的肩膀。</p><p class="story-paragraph">碰不得，一触到好像就要粉碎的少女骨骼，正被高温烧得滚烫，融成绵软金黄的蜂蜜，淌满她的手掌。</p><p class="story-paragraph">南感觉自己拢了一只振翅欲飞的蝴蝶。</p><p class="story-paragraph">蝴蝶翅膀扫过她手心时，留下了闪着微光的鳞粉。</p><p class="story-paragraph">她把这只蝴蝶牢牢地抓住了。</p><p class="story-paragraph">纱夏恃宠而骄，比以前要任性一点。</p><p class="story-paragraph">也许可以说，这要怪南。</p><p class="story-paragraph">她好像正把这个夏天当作最后一个夏天，垒起年深日久的怜爱，全部砸在纱夏身上。</p><p class="story-paragraph">毫无节制的性爱，倾倒给对方的吻…</p><p class="story-paragraph">女儿因此冲破了栅栏。</p><p class="story-paragraph">方向盘也拆除掉的那辆敞篷吉普，会驾着她去向哪里？</p><p class="story-paragraph">纱夏枕住南的手臂，找了个舒服的姿势躺好。</p><p class="story-paragraph">制冷的空调响着，呼呼地往外吹风。</p><p class="story-paragraph">南看着落日余晖从窗沿爬进来，抹在纱夏睡裙遮不住的地方。</p><p class="story-paragraph">给她最爱的蛋糕添了一勺枫糖浆。纱夏也不觉得冷，她在用南的手机。</p><p class="story-paragraph dialogue">“痒，”纱夏喉间散出模糊的娇嗔，妈妈伸进她裙子里的手又在作乱了，流连在她的腰间，来轻轻地挠她：“等我弄好嘛。”</p><p class="story-paragraph">她往南的怀里钻了一点，想压住妈妈的小臂。</p><p class="story-paragraph dialogue">“在干什么？”南凑过来，她看纱夏专心致志地盯着电子屏幕，正捣鼓着什么东西。</p><p class="story-paragraph dialogue">“装个软件，”纱夏眨眨眼，她的计划彰明较著，也不打算隐瞒：“和我的手机绑定了，点进来就能看到你在哪里。”</p><p class="story-paragraph dialogue">“这不都是为了查孩子的岗才用的，” 南含笑挪揄她：“怎么在你这里反过来了？”</p><p class="story-paragraph dialogue">“你也可以看到我在哪，”纱夏觍着脸努力争辩，她伸手去够自己的手机，亮给妈妈看：“输我的号码就可以了。”</p><p class="story-paragraph dialogue">“这么说，如果你夜不归寝，我也能知道。”南没有拒绝女儿，虽然这个请求听上去是肆意妄为的：“可别后悔。”</p><p class="story-paragraph dialogue">“我才不会夜不归寝，倒是你，”纱夏眉头皱起来，有点担心：“我住学校的时候，你万一又因为应酬很晚不回家，会被我抓到的。”</p><p class="story-paragraph">南在点头，告诉女儿她不会的，纱夏因此没说下去。</p><p class="story-paragraph">不要再喝醉，我没办法照顾你。</p><p class="story-paragraph">手机响了一声，纱夏低头去看，有验证码的短信发来了，她可以进行下一步。</p><p class="story-paragraph">-您的姓名。</p><p class="story-paragraph">只有罗马音的键盘，纱夏试了好几次，也不知为何打不出片假名。</p><p class="story-paragraph">她只好输入了‘Sana’。</p><p class="story-paragraph">-绑定用户的姓名。</p><p class="story-paragraph">纱夏悬在空中的手指停滞着。</p><p class="story-paragraph">明明是知道得很清楚，却几乎从来不叫的名字。</p><p class="story-paragraph">妈妈的名字。</p><p class="story-paragraph">M——</p><p class="story-paragraph">也是四个字母。她慢慢地去按，再停下。</p><p class="story-paragraph">输入框里的线形光标在‘a’字母的后面闪动。</p><p class="story-paragraph">Mina。</p><p class="story-paragraph">没念出声的音节，妈妈的名字就像隐秘的情话。</p><p class="story-paragraph">南…</p><p class="story-paragraph">纱夏猜测问题到此为止就结束，软件里却又弹出了提示。</p><p class="story-paragraph">-绑定用户与您的关系是？</p><p class="story-paragraph">-爸爸/妈妈/爱人/子女/朋友/自定义</p><p class="story-paragraph">南也扫了一眼选项。</p><p class="story-paragraph dialogue">“选一个，”看见女儿踌躇，南换了个姿势去抱她，靠近对方为她提议，听不出喜怒。女儿耳朵尖都红红的，南去捏她柔软的耳垂：“随便选。”</p><p class="story-paragraph">纱夏犹疑片刻，最后还是飞快地点了“妈妈”。</p><p class="story-paragraph">身旁那人的眼神一下子变得晦暗不明。</p><p class="story-paragraph">好暧昧，暧昧又色情。</p><p class="story-paragraph">纱夏在南开口说话以前，把手机锁屏扔到了一边。</p><p class="story-paragraph">她捧着妈妈的脸和她接吻。</p><p class="story-paragraph">原来并不一定要踏进极圈，才能在这个季节看见永不消亡的太阳。</p><p class="story-paragraph">在东京的这间屋子里就可以了。</p><p class="story-paragraph">白炽烈焰也在滚滚燃烧，她的身体即将化为灰烬。</p><p class="story-paragraph">纱夏想，夜已走向终焉。</p><p class="story-paragraph">敞篷吉普车驶过热带地区，在经过气旋影响的范围内，又撞见了电闪雷鸣。</p><p class="story-paragraph">她们正在前往世界的边缘。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">接近年末，进入冬季的城市开始飘雪。</p><p class="story-paragraph">天空的极点坠下白花，开遍整个本州岛。南办公室的落地窗能看见电车行经的天桥，盖在轨道上的素银地毯还有加厚的趋势……</p><p class="story-paragraph">她盘算着，从今天起，这些由块状车厢串成的交通工具大概也会开始不定期地延误。</p><p class="story-paragraph">今晚还是她开车去接女儿吧。</p><p class="story-paragraph">纱夏加入了学校的话剧社。</p><p class="story-paragraph">圣诞节碰上周五，学院说是要迎合年轻人的口味，特意选在西方的新年这天举办晚会，而社团恰巧又是要在晚会上大放异彩的主力军。</p><p class="story-paragraph">本来女儿下午就能到家了，这下必须等演出结束了才行。</p><p class="story-paragraph">纱夏几乎只有周末回来，上个星期还因为排练剧本的缘故，压缩了本就不长的二人时光。</p><p class="story-paragraph">南对此也不好说什么，她知道这挺重要。</p><p class="story-paragraph">毕竟新生只有一次参加汇演的机会，等纱夏再升一个年级，就要以学姐的身份登场，去指导后辈了。</p><p class="story-paragraph">女儿如愿以偿地考进梦想大学的文学部，读的专业是思想文化学科。</p><p class="story-paragraph">纱夏打电话和妈妈抱怨，说老师开的书单实在太多，自己要写的读后感也可以砌成高墙，第一个学期看的还都是古代文学，通篇出现的句子要花好长时间才能理解。</p><p class="story-paragraph dialogue">“得多去图书馆了……”纱夏在电话另一头叹气，南笑着鼓励她：“肯下功夫才能学到真本事。”</p><p class="story-paragraph">正因如此，名井少了能督促的对象。</p><p class="story-paragraph">纱夏不在家，她不用再早睡给女儿作榜样了，所以这位律师常不自觉地翻看卷宗，等到搁笔作罢都已至凌晨。</p><p class="story-paragraph">南买了杯热美式，来弥补不太充足的睡眠。</p><p class="story-paragraph">是事务所楼下这家咖啡店的老顾客，她不喜欢酸味太重的黑咖啡，咖啡师按她的口味挑了豆子。</p><p class="story-paragraph">借着纸杯散发出的热量暖手，推开挂着圣诞树灯饰的玻璃门时，她发现自己嘴里呵出的气也能凝成水雾，于是抬头望了一眼天空。</p><p class="story-paragraph">云层结晶，悬在头顶犹如皎皎透明的钻石。</p><p class="story-paragraph">奈未同名井确认日程，顺便给她拿来了文件。</p><p class="story-paragraph">下午那个身陷民事纠纷的客户打电话来修改了预约时间，说是临时有事。</p><p class="story-paragraph">名井想，对方可能是今天才发现圣诞节的日期，现下匆匆赴约去了。</p><p class="story-paragraph">不过，没有多余的谈判、处理完手头的工作就能下班，正好遂了她的心愿。“对了，名井律师，”奈未在退出她的办公室前停住了脚步，她思前想后，觉得还是应该和南报备：“神木堂负责的那个案子…法院二审的判决书下来了。”</p><p class="story-paragraph dialogue">“审判结果是什么？”</p><p class="story-paragraph">以为南只会简单应一声，谁知她接着问下去，助手有一瞬间的愣神，马上简明扼要地回答：“法院判定被告非法走私精神药物，有期徒刑两年。”</p><p class="story-paragraph dialogue">“很成功地粉饰太平，”南抿了口咖啡，似笑非笑：“恭喜他了。”</p><p class="story-paragraph">律师大半张脸都被装了咖啡的纸杯遮住，奈未觉得自己没什么再待下去的理由，她应该出去了。</p><p class="story-paragraph">门被合上。</p><p class="story-paragraph">南放下杯子，少见地发起了呆。</p><p class="story-paragraph">她在思考这个结果会带来什么样的影响，指尖也不自觉地敲着桌面。</p><p class="story-paragraph">在饭局上，她通过众人的谈吐就能猜出七八分。</p><p class="story-paragraph">很明显，神木是把新型毒品美化成了精神药物…</p><p class="story-paragraph">如果不出台法律条文的话，南想，这个名字也许会在未来的日本流传开来。</p><p class="story-paragraph">变本加厉的焦躁感在短时间内无法得到缓解，她没翻开奈未带来的那叠写满文书的纸张。</p><p class="story-paragraph">南像突然记起了什么一样，拉开身侧那个活动柜的抽屉，里面摆着女儿上星期回来塞给她的门票。</p><p class="story-paragraph">正下方写了一行小字，南再次确认晚会开始的时间。</p><p class="story-paragraph">周五12/25 18:30~20:30</p><p class="story-paragraph">她摩挲着这张门票，浮躁的情绪因这个动作变得平缓了一些。</p><p class="story-paragraph">不愧是高等学府，做得煞有介事的。</p><p class="story-paragraph dialogue">“真的是一票难求，我托认识的前辈才多拿了一张，”纱夏说话间也是藏不住的期待：“妈妈会来看我吗？”</p><p class="story-paragraph dialogue">“会。”南在纱夏脸上留了好几个吻，直到女儿被自己有点轻佻的动作弄得笑起来。</p><p class="story-paragraph dialogue">“纱夏要演的舞台剧是什么？”南问她。</p><p class="story-paragraph dialogue">“保密。”女儿眯起笑眼，狡猾地躲过了这个问题。</p><p class="story-paragraph dialogue">“这么神秘，”南拿出思考重大决策的架势，倒让纱夏有点不好意思：“那我一定要去了。”</p><p class="story-paragraph">纱夏知道名井见过世面，怕妈妈期望太高，急忙添了句话：“我透露一下，是童话故事。”“不演戏剧吗？像莎士比亚或者莫里哀这种大文豪写的。”南有点意外，听女儿说社里的同伴几乎都是文学部的，应该要选更华丽的作品才是。</p><p class="story-paragraph">女儿摇头否认：“前几年古典戏剧演多了，今年大家都想尝试别的风格。”</p><p class="story-paragraph dialogue">“那纱夏是不是要演公主了？”南屈起食指去刮女儿的鼻梁。</p><p class="story-paragraph">她偏心地觉得，整个学校都没有比纱夏漂亮的女孩。</p><p class="story-paragraph">更别说一个小小的戏剧社里。</p><p class="story-paragraph">纱夏被妈妈恭维得很开心。</p><p class="story-paragraph dialogue">“是的。”她回答，眼里的水泽折射起漫天的星辉。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">为了避免撞到下班高峰的堵车——路面上也还有积雪，南及时从事务所出发。</p><p class="story-paragraph">她到得很早，只把车规矩地停在位置上，进到附近的便利店里买了吞拿鱼口味的三明治，让店员把它放在微波炉里转了一圈，撕开包装就简单地解决了晚餐。</p><p class="story-paragraph">天开始黑了，太阳一刻也没有出现过。</p><p class="story-paragraph">进入夜间，恐怕还得再下一阵子雪，为了确认自己的判断，南用手去试。</p><p class="story-paragraph">现在就在下。</p><p class="story-paragraph">纯白晶莹的碎片掉在她因寒冷而微微泛红的掌心。</p><p class="story-paragraph">剧院还在进行最后的布置，不想打扰到女儿的彩排，她独自在纱夏的大学里散步。</p><p class="story-paragraph">南穿了浅灰色的羊绒大衣，内衬搭了一件高领毛衣，它被主人精巧地折了一下，领口圈住了她修长脖颈的中线。</p><p class="story-paragraph">鞋是双有跟的长靴，踩在雪地上的声音让她觉得很惬意。</p><p class="story-paragraph">她没撑伞，落入黑发间的点点雪花，即使是全部融化了，也无伤大雅。</p><p class="story-paragraph">与南擦肩而过的年轻学生，尤其是男学生，总忍不住要回头再多看她一眼。</p><p class="story-paragraph">她庆幸地去感谢着谁。托纱夏的福，在完全忘光校园记忆之前，她又得以重温了一遍…</p><p class="story-paragraph">成双的情侣、行走时也不忘相互辩论的教授、静默伫立着的教学楼，以及雪天也未销声匿迹的白鸽。</p><p class="story-paragraph">一切都有迹可循，南想起自己背着法典出入图书馆的那些日子。</p><p class="story-paragraph">八年……乍一听恐怖吓人的长度，在换算过来以后，却显得格外温和。给人以错觉，长日并未留痕。</p><p class="story-paragraph">她只能在纱夏的成长中，发现时间的强大作用。</p><p class="story-paragraph">南安静又沉默地站在空地中央。</p><p class="story-paragraph">她意识到自己似乎被仁慈地放过了。</p><p class="story-paragraph">人群开始以整齐的趋势行进，和寒暖流互相冲撞时汇在一起的鱼堆没什么区别。</p><p class="story-paragraph">估摸着差不多可以进场了，她调转了方向。</p><p class="story-paragraph">守在门口的两名学生拿着打孔器在那张卡纸上留下了一个检票的印记，左边的男生伸出手，示意她，剧场的方向在那边。</p><p class="story-paragraph">礼堂入口前摆着用来揩掉雪水的毯子，南把鞋底拭得干爽了才往里走。</p><p class="story-paragraph">聚光灯束拢光线，在舞台正中央的红色天鹅绒幕布上留下了大而显眼的正圆形光斑。</p><p class="story-paragraph">用力扯开巨幕时，人眼也能捕捉到飞扬的细小纤维。</p><p class="story-paragraph">她在梯形的剧场里挑了靠中间的位置入座。</p><p class="story-paragraph">清一色的扶手椅，都是橡木材质，她坐下来，后背靠住柔软的黑色垫子。</p><p class="story-paragraph">手机在响，南把它从口袋里掏出来，想调个静音。</p><p class="story-paragraph">是纱夏的短信。拨好按钮之后，她戳了一下那个聊天气泡。</p><p class="story-paragraph dialogue">“来了？”</p><p class="story-paragraph">南的唇角绽出了她自己都不知道有多温柔的笑意。</p><p class="story-paragraph">她点开纱夏之前安在她手机上的软件。</p><p class="story-paragraph">两个光标靠得很近，南抬起头想找找看，能不能发现纱夏，可马上又作罢了。</p><p class="story-paragraph">她猜测女儿此时在后台准备。</p><p class="story-paragraph dialogue">“嗯。”觉得有点冷淡，南加了一句：“现在心情如何？”</p><p class="story-paragraph dialogue">“又紧张又兴奋”女儿回她。</p><p class="story-paragraph">没有标点符号就直接发给自己，南都能想到纱夏的神态，好像女儿就靠在她肩膀上对她说话一样。</p><p class="story-paragraph">她的手指飞快地敲击着屏幕。“我会好好期待的。”</p><p class="story-paragraph">看到妈妈传过来的简讯，纱夏心满意足地放下手机，任凭化妆师在她的脸上施粉黛。</p><p class="story-paragraph">同辈的美沙负责后勤，她拿了租来的服装，等纱夏化好妆就让她换上。</p><p class="story-paragraph">看着编好头发的女主角，美沙只能发出惊叹：“你上台什么都不用说也可以，站在那就行了。”</p><p class="story-paragraph dialogue">“美沙你太夸张了啦。”纱夏笑吟吟地摆手，很谦虚。</p><p class="story-paragraph">少女生动灵巧的表情，让她看起来更像了…</p><p class="story-paragraph">美沙透过纱夏，捉到了故事主人公的影子。</p><p class="story-paragraph">纱夏现在已经和角色融为一体了吧。</p><p class="story-paragraph">作为剧本的策划者之一，美沙久违地放下心来。</p><p class="story-paragraph">今晚的舞台会很完美。</p><p class="story-paragraph">观众席只留了微光。</p><p class="story-paragraph">中场休息时，南瞥了一眼手表。</p><p class="story-paragraph">虽然还没等到纱夏出场，好在节目的质量算得上出色，她也不觉得无聊。</p><p class="story-paragraph">气氛被炒得火热，身边也没有一个空着的座位。</p><p class="story-paragraph">她突然对纱夏口里说的“一票难求”更有概念。</p><p class="story-paragraph">有些事得承认，就好比，时间的力量还是不容小觑的。</p><p class="story-paragraph">刚刚才得出的结论瞬间就被推翻，南无奈地笑了一下。</p><p class="story-paragraph">至少在她读大学的时候，还没有这么多人愿意聚精会神地待在礼堂里，耐心地看完一台又一台演出——要端坐在散发潮湿木头气味的椅子上，先听校长以激昂的口吻发表一篇狗屁不通的演讲，再过一遍毫无创意的流程。</p><p class="story-paragraph">别开玩笑了，甚至还不如学习有趣。</p><p class="story-paragraph">现在完全不一样，花招百出都只为争个奖状，音乐部的孩子还能弄来一座气派的三角钢琴。</p><p class="story-paragraph">穿着正装，打好领结的男孩弹了李斯特写的那首《钟》。</p><p class="story-paragraph">居然能在这里听到难度如此高的古典乐曲，南有点意外。</p><p class="story-paragraph">演奏家鞠躬谢幕时，她也跟着观众一起鼓掌。幕布被拉起，帘子后面有什么在移动，帷幕上出现了红色的波浪。</p><p class="story-paragraph">主持人站在最外圈，等耳麦里传出一切就绪的信号。</p><p class="story-paragraph">南看着他举起了话筒。</p><p class="story-paragraph dialogue">“大家多久没读过童话了？”</p><p class="story-paragraph">她眉心一跳。</p><p class="story-paragraph dialogue">“下一个节目里的故事，出自和李斯特来自同一片大陆的、一位欧洲作家笔下，”拿手持牌流畅地报幕，这个看上去是学长的男生，应该是练习了很多次：“被誉为现代童话之父，生活在丹麦的安徒生。”</p><p class="story-paragraph dialogue">“我反复强调‘童话’，因为这是一个没有美满结局的童话，”名井听着，她想题词板应该是社里的哪个同学帮忙写的：“但我依然诚挚地邀请您，跟随话剧社团演员们的脚步，走进这个故事…”</p><p class="story-paragraph">灯熄灭了，是从开场到现在唯一一次全灭。</p><p class="story-paragraph">这阵仗让南顺从地闭上了眼睛。</p><p class="story-paragraph">直到聚光灯的亮度再次召唤她的时候，才睁开。</p><div class="section-marker" aria-label="小节 4"><span>04</span></div><p class="story-paragraph">在海的远处，水是那么蓝，像最美丽的矢车菊花瓣，同时又是那么清，像最明亮的玻璃。</p><p class="story-paragraph">变换的背景闪动着湛蓝色的荧光，定格在南的瞳孔里。</p><p class="story-paragraph">不过人们千万不要以为那儿只是一片铺满了白砂的海底。不是的，那儿生长着最奇异的树木和植物。它们的枝干和叶子是那么柔软，只要水轻微地流动一下，它们就摇动起来，好像是活着的东西。所有的大小鱼儿在这些枝子中间游来游去，像是天空中的飞鸟。</p><p class="story-paragraph">南在她读过的为数不多的童话故事里寻找着。</p><p class="story-paragraph">在那儿，处处都闪着一种奇异的、蓝色的光彩。你很容易以为你是高高地在空中而不是在海底，你的头上和脚下全是一片蓝天。</p><p class="story-paragraph">即使是她这样的童话苦手，也知道了正确答案。</p><p class="story-paragraph">海的女儿。</p><p class="story-paragraph">如果是这样…纱夏一定会是那个最小的人鱼公主。</p><p class="story-paragraph">南对此深信不疑。</p><p class="story-paragraph">心有灵犀的预测，一下子就被证实。观众席很适时地响起了吸气声。</p><p class="story-paragraph">想都不用想，这些赞叹都要赠予现在出场的这个人。</p><p class="story-paragraph">没有一个词能描摹出此刻站在舞台正中央的女孩。</p><p class="story-paragraph">世间也没有什么瑰宝能够比拟她的美貌。</p><p class="story-paragraph">她的皮肤又光又嫩，像玫瑰的花瓣，她的眼睛是蔚蓝色的，像晶莹的湖水。</p><p class="story-paragraph">最美丽的，最漂亮的。</p><p class="story-paragraph">南攀在椅臂上的手微不可闻地轻颤了一下。</p><p class="story-paragraph">人鱼们在深海的宫殿里围成一圈。</p><p class="story-paragraph">她们合着歌声的旋律起舞。</p><p class="story-paragraph">现在，只剩下最小的那只人鱼没有成年。</p><p class="story-paragraph">姐姐们都知道人类的世界是什么样的了，她却必须留在海底。</p><p class="story-paragraph">年龄大一些的人鱼在白天结束之后才能回来告诉自己，陆地上有什么奇景。</p><p class="story-paragraph">就连漆黑的星夜，也离小人鱼好远。</p><p class="story-paragraph">她想亲眼去看一看。</p><p class="story-paragraph">她最愉快的事情，是听人讲人世间的故事，对此她充满了美好的幻想。</p><p class="story-paragraph">音乐剧没能给纱夏留太多发挥的空间，台词并不多，但这样便足够了。</p><p class="story-paragraph dialogue">“什么时候，我才能浮上海面？”这只最小的人鱼开口，自问的语气泫然欲泣，引人心碎。</p><p class="story-paragraph">可人鱼是不会流泪的。</p><p class="story-paragraph dialogue">“什么时候我才能满十五岁呢？”</p><p class="story-paragraph">她站起来，带流苏的裙摆轻抚着海底的地面。</p><p class="story-paragraph">女孩的目光缓慢又依恋地扫过台下的观众，双眸里蓄起一串液态的珍珠。</p><p class="story-paragraph">好像在离她所处的深海王宫极远的地方，有她深爱的人。</p><p class="story-paragraph">那个人正坐在陆地上远远地望着她。</p><p class="story-paragraph">不过很快，小人鱼也长大了，她一下就到梦想里的十五岁。在被夕阳染成玫瑰金色的云层下，她见到了王子。</p><p class="story-paragraph">在风浪卷起的无情海啸中，她又救下了他的性命。</p><p class="story-paragraph">人鱼的手触到了人类的面庞，这似乎可以慰藉双肺呛进海水的受难者。</p><p class="story-paragraph">她渐渐地开始爱起人类来，渐渐地开始盼望，她能够生活在他们中间。她觉得他们的世界比她的天地大得多。</p><p class="story-paragraph">她无法拥有一双人类的腿，即使她再深爱着她救下的那个男子，她都不能以原本的样子踏上地面。</p><p class="story-paragraph">人鱼的歌声是多么动听啊。</p><p class="story-paragraph">无论是升到最高的穹顶，还是降至最深的海沟…生活在这其中的万物生灵里，只有小人鱼的嗓音最美。</p><p class="story-paragraph">而小人鱼自己呢？</p><p class="story-paragraph">她只想告诉王子，她对他的爱。</p><p class="story-paragraph">她去求巫婆，去求上到陆地的方法。</p><p class="story-paragraph">巫婆赐给她走到爱人身旁的恩典，同时也将最可怖的诅咒施在她的身上。</p><p class="story-paragraph">她失去了舌头，成了哑巴，得到了人类的那双腿，也付出了代价。</p><p class="story-paragraph">如今，她的每一步都仿佛是踏在尖锐的利刃上。</p><p class="story-paragraph">南凝眼，细细地看她的纱夏。</p><p class="story-paragraph">她为他离开了亲人。</p><p class="story-paragraph">念白像挂钟的摆槌。</p><p class="story-paragraph">它沉稳地、重重地、不容置疑地用力锤击南的呼吸。</p><p class="story-paragraph">每天忍受痛苦。</p><p class="story-paragraph">女儿的百褶裙因轻盈的舞姿而飞旋。</p><p class="story-paragraph">她感觉自己的心被什么东西割碎了。</p><p class="story-paragraph">小人鱼的额头上沁出汗珠。</p><p class="story-paragraph">她正强忍着足下传来的那阵鲜明的撕裂感。</p><p class="story-paragraph">这一切都是为了换来王子的爱，即使他马上就要结婚了。在那个残忍的契约生效时，小人鱼已经知道了。</p><p class="story-paragraph">如果王子和其他人成婚，她就会在婚礼的第二天死去，化成海洋上的浮沫。</p><p class="story-paragraph">她的姐姐们在那个夜晚拼命地游，终于追上了那艘船。</p><p class="story-paragraph">她们交给这个可怜的哑女一把匕首。</p><p class="story-paragraph dialogue">“杀了他，让他的血溅在你的脚上，”大姐恳求她：“回到我们身边吧。”</p><p class="story-paragraph">小人鱼接过来，她沉默地退回了原位，目送姐姐们沉进海底。</p><p class="story-paragraph">碧绿的大海和深黑的夜空连在了一起，满月将清辉投到蓝墨色的海波上。</p><p class="story-paragraph">那里是她的家，她还能回去吗？</p><p class="story-paragraph">她走进船舱，右手抓着那把银柄的锐器。</p><p class="story-paragraph">王子的睡颜是那么沉静，她痴痴地看了好久。</p><p class="story-paragraph">太阳就要现身于地平线的那一端，自己的身体越来越虚弱。</p><p class="story-paragraph">此刻她已经成为了一个真正的人类。</p><p class="story-paragraph">能呼吸地面的空气，也有着同样深厚真挚的感情。</p><p class="story-paragraph">再近一步，她就可以不用死去，不用为了负心之人献上自己的生命。</p><p class="story-paragraph">而她只是不舍地，在王子额头上吻了吻。</p><p class="story-paragraph">再便如同来时那样，轻轻地离开了。</p><p class="story-paragraph">小人鱼靠近了桅杆船的侧舷，纯白的帆布被海风吹得鼓起来。</p><p class="story-paragraph">迎面拂来的…还有她最熟悉的海盐气味。</p><p class="story-paragraph dialogue">“快点动手，妹妹，太阳就要出来了，”她听见亲人们在海水里呼唤她的名字，“再这样下去，你会死掉的。”</p><p class="story-paragraph">匕首掉落的声音很响，盖过了汹涌的波浪怒吼。</p><p class="story-paragraph">如果眼泪能算得上是点睛之笔。</p><p class="story-paragraph">晶蓝色的宝石漾出碎芒，从纱夏的眼睑滚落。</p><p class="story-paragraph">刀子沉下的地方，浪花就发出一道红光，好像有许多血滴溅出了水面。</p><p class="story-paragraph">她最后一次把模糊的视线投在王子的身上。她就从船上跳到海里。</p><p class="story-paragraph">礼堂又陷入了黑暗。</p><p class="story-paragraph">她觉得她的身躯正在融化成为泡沫。</p><p class="story-paragraph">结尾的念白换了人。</p><p class="story-paragraph">不管别人知不知道，南想。</p><p class="story-paragraph">是纱夏的声音。</p><p class="story-paragraph">现在太阳从海里升起来了。阳光柔和地、温暖地照在冰冷的泡沫上。</p><p class="story-paragraph">女儿柔柔地说道。</p><p class="story-paragraph">多么天真的愚勇。</p><p class="story-paragraph">好像纱夏和小人鱼一样，也不觉得死亡会是件多么遗憾的事。</p><p class="story-paragraph">因此小人鱼并没有感到灭亡。她看到光明的太阳，同时在她上面飞着无数透明的、美丽的生物。透过它们，她可以看到船上的白帆和天空的彩云。</p><p class="story-paragraph">何况是为爱死亡呢？</p><p class="story-paragraph">南的口腔里泛起了铁锈的味道。</p><p class="story-paragraph">原来泡沫尝起来竟会如鲜血一般辛辣。</p><p class="story-paragraph">她听见有人躲起来，悄悄地哭了。</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph dialogue">“今晚的聚会，纱夏不来了吗？”</p><p class="story-paragraph">纱夏扶着美沙递过来的那只手，跃到了台下。</p><p class="story-paragraph dialogue">“我家人已经来接我了，”她的身际还环绕着童话的氛围，旁人会以为她口中的父母也是人鱼：“对不起啦，下次有机会一定去。”</p><p class="story-paragraph dialogue">“美沙，”饰演王子的伊堂喊她：“学院那边找节目负责人说是要开会，好像很急。”</p><p class="story-paragraph dialogue">“我就来了。”美沙回复伊堂，等纱夏稳稳地站好就要转身。</p><p class="story-paragraph dialogue">“糟了，”她拍了一下脑袋，问纱夏：“你的家人已经到了吗？”</p><p class="story-paragraph dialogue">“她应该就在外面。”名井的意思是要她表演完就出来，所以纱夏一退到后台就妈妈发了短信，说好了见面的地点，约在剧场的另一个出口。“储物柜的钥匙我放在包里，被佐藤拿走了。”</p><p class="story-paragraph">演员换下来的衣服都放在更衣室的柜子里。</p><p class="story-paragraph dialogue">“佐藤现在在哪，”男生在听她们讲话：“我去找她？”</p><p class="story-paragraph dialogue">“不是选了志愿观众吗，她在剧场，现在都是只让出不让进，”美沙掏出手机拨了个号码：“我看能不能让她走到门口来。”</p><p class="story-paragraph">那边一直没应，电话打不通：“估计是调静音了。”</p><p class="story-paragraph dialogue">“戏剧社的负责人呢？”过道尽头传来一声呼唤。</p><p class="story-paragraph dialogue">“在这里！”美沙应答，她有点焦灼。</p><p class="story-paragraph">佐藤没这么快出来，可也不能让纱夏的家人在这么冷的天里等到晚会结束。</p><p class="story-paragraph">纱夏看她有点懵，马上替她解围：“你快去吧，我穿这个走也没事的。”</p><p class="story-paragraph">为了方便跳舞，纱夏穿了一双很薄的软鞋，如果这样出去，鞋子没多久就会被雪水浸湿。</p><p class="story-paragraph">她的裙子也太长，拖地的下摆需要一直提着才能不被弄脏。</p><p class="story-paragraph">美沙犹豫，纱夏怕学院的领导等急了不开心，要发脾气，出言安慰她：“反正我妈妈开车来的，回家就没事了，只是要麻烦你帮我拿走柜子里衣服了。”</p><p class="story-paragraph dialogue">“这有什么的，是我抱歉。”美沙往外走，她有点内疚地看着纱夏：“戏服下周一带到学校来就行，我再找人去退。”</p><p class="story-paragraph">纱夏摇了摇头，只催促她赶快过去，别在意这些。</p><p class="story-paragraph dialogue">“伊堂，你送一下她。”美沙的背影消失在门后，不忘嘱咐一下别人。</p><p class="story-paragraph">南等在女儿短信里说的地方，这里没什么学生经过。</p><p class="story-paragraph">在声控灯关着的时候，只有“非常口”的淡绿色标识是亮着的，能隐约地听到会场里传来的音乐。</p><p class="story-paragraph">她默然地站在建筑物向外伸出的房檐下，有一半身子隐在了黑暗里。</p><p class="story-paragraph">等待的时间并不漫长，在她凝视着飘舞雪花的这当儿，那盏灯亮了，把雪片的棱角都照得很清楚。</p><p class="story-paragraph">脚步声在走廊的另一侧响起，离南越来越近。</p><p class="story-paragraph dialogue">“妈妈。”纱夏叫完她以后，才从那个狭窄的出口探出身来。</p><p class="story-paragraph">从灯亮起来的时候，南的视线便没从那扇门离开过。在看到纱夏以后，像劫数难逃似地，她的呼吸也情不自禁地放慢了一拍。</p><p class="story-paragraph">女儿还穿着表演时的裙子，如雪缎的肩膀露在外面。</p><p class="story-paragraph">纱夏戴了美瞳，蓝色的的奇光在那双鹿眸中明灭不定。</p><p class="story-paragraph">南有点分不清了。</p><p class="story-paragraph">分不清纱夏是否真的来自另一个世界？</p><p class="story-paragraph">女儿身后的人帮她提着裙子的下摆，纱夏从对方手里接过布料，礼貌地向那人道谢。</p><p class="story-paragraph">南认出这个男生是舞台上同纱夏演对手戏的主角。</p><p class="story-paragraph dialogue">“您好。”伊堂有点生怯地向南问好，他喊不出“阿姨”。</p><p class="story-paragraph">他听凑崎说，来接她的人是她的妈妈。</p><p class="story-paragraph">可凑崎同学的妈妈未免也……</p><p class="story-paragraph">太年轻了一点。</p><p class="story-paragraph">南只礼貌地向他点了头，没说话，也没再看他。</p><p class="story-paragraph">她自然地拿过了纱夏攥着的裙摆。</p><p class="story-paragraph">女儿走路的声音太小，南低头，发现纱夏穿着拆掉了足尖套的芭蕾舞鞋。</p><p class="story-paragraph dialogue">“服装出了点问题，所以耽搁了，”纱夏觉得名井的衣服很单薄，怕妈妈在外面冷到感冒：“等很久了吗？”</p><p class="story-paragraph dialogue">“没有，”南牵她到自己身边，包住她的手：“我也刚到。”</p><p class="story-paragraph">一旁的伊堂有点局促，他觉得这对母女之间流动的氛围过于温柔松弛。</p><p class="story-paragraph">这让他不知该不该开口说话。</p><p class="story-paragraph dialogue">“伊堂，快进去吧，”纱夏想起还有个同学看着呢，急忙侧过身对这位王子告别：“不用担心我了。”</p><p class="story-paragraph dialogue">“嗯。”他这才觉得没那么尴尬，走之前夸了纱夏一句，表扬她今晚绝佳的演技。</p><p class="story-paragraph dialogue">“你就在家等好消息吧。”</p><p class="story-paragraph">等伊堂彻底不见了，南有点僵硬的身体才慢慢放松下来。</p><p class="story-paragraph">纱夏察觉到对方的戒备心，她勾着妈妈的小指，明知故问道：“怎么了？”</p><p class="story-paragraph">不会轻易掉进女儿的陷阱，南没回答。她只把自己的大衣脱下，轻轻披在纱夏的身上。</p><p class="story-paragraph">两人说话的声音都不大，灯泡灭掉了，刚刚还被照亮的区域一下又回归了黑暗。</p><p class="story-paragraph dialogue">“走吧，”在带着纱夏踏上雪地之前，南和女儿十指相扣：“稍微忍耐一下，到车上就把鞋脱了。”</p><p class="story-paragraph">身体被有妈妈体温的呢子衣裹住，纱夏跟着南，亦步亦趋地走在她身边。</p><p class="story-paragraph">冬夜里的雪静谧地降在她们的头顶，掩住了纷乱嘈杂的尘嚣。</p><p class="story-paragraph">纱夏偶尔偷瞄一眼南。</p><p class="story-paragraph">耐心、体贴、可靠。</p><p class="story-paragraph">雪氤氲了南不苟言笑时的锋芒气度，让她侧脸的轮廓看起来温和极了。</p><p class="story-paragraph">纱夏觉得，妈妈比任何人都要像她的王子。</p><div class="section-marker" aria-label="小节 6"><span>06</span></div><p class="story-paragraph">进到室内时，纱夏的脚底几乎全都湿了。</p><p class="story-paragraph">女儿牵住自己的那只手，也没刚开始那么暖和。</p><p class="story-paragraph">地下三楼用来停车的场地，在这个点变得空旷。</p><p class="story-paragraph">有车的老师几乎都在上完课之后开车离校，像南这样来看女儿演出的家属——大学里并不常见。</p><p class="story-paragraph">光线不够充足，南掏出车钥匙，她凭着解锁的声音，一下找到了自己的轿车。</p><p class="story-paragraph">要让纱夏先待在车里，副驾驶的门被她拉开。</p><p class="story-paragraph">后备箱放了纸巾，干湿的都有，南去拿来之后才坐到方向盘前。</p><p class="story-paragraph dialogue">“冷不冷？”她有点心疼，为了让女儿好受一点，还把暖风空调打开了。</p><p class="story-paragraph">其实没多远，纱夏才表演完，心跳一直没办法平息，路上也有妈妈陪着，还算受得了：“不冷。”</p><p class="story-paragraph dialogue">“靠上去。”南不管纱夏的说辞，让女儿紧贴着皮革车座躺好，按下了放平椅子的按钮。纱夏能活动的范围大一点，更方便她脱鞋。</p><p class="story-paragraph">少女关节处的皮肤泛着粉红色。</p><p class="story-paragraph">南抓住她的脚踝。</p><p class="story-paragraph">女儿没有额外练过舞，南知道她只是肢体柔软，所以在表演时跳出来的动作还算有模有样的。</p><p class="story-paragraph">真正学过芭蕾的人是南。可惜的是，这个爱好由于繁重的学业被中断了。</p><p class="story-paragraph">再说，在收养纱夏以后，南也没时间跳舞。</p><p class="story-paragraph">纱夏知道南会听古典音乐，妈妈有着很厉害的技能——只听一小段旋律，就能叫出曲子的作品名。</p><p class="story-paragraph">她不清楚，妈妈的这个习惯是在学芭蕾时养成的。</p><p class="story-paragraph">所以，即使绑在纱夏脚上的那个系带很复杂，南也轻易解开了。</p><p class="story-paragraph">南把沾了冰水的鞋丢到后座，扯了几张纸去擦纱夏的脚心。</p><p class="story-paragraph">动作太轻了，纱夏被妈妈弄得很痒。</p><p class="story-paragraph">她忍不住笑，想把脚腕抽出去，但妈妈的力气又不容她逃开。</p><p class="story-paragraph dialogue">“痛吗？”南突然问她。</p><p class="story-paragraph dialogue">“不…”纱夏很直接地回答妈妈，她只是怕痒而已。</p><p class="story-paragraph">她抬头对上南的眼神，却发现了妈妈话里的另一层意思。</p><p class="story-paragraph dialogue">“痛吗？”南又问，不依不饶地。</p><p class="story-paragraph">她撇下纸巾，手指按在纱夏的足底，好像是想抚平什么伤口一样。</p><p class="story-paragraph">纱夏开始心悸。</p><p class="story-paragraph">妈妈和缓的动作间流露出的爱意里，要问出什么问题……</p><p class="story-paragraph">人鱼如果要到陆地上来，是不是很痛？</p><p class="story-paragraph">虽然每次当她的脚接触到地面的时候，她就像是在快利的刀上行走一样。</p><p class="story-paragraph">纱夏一下子说不出话，她想回答南，那是在童话里。</p><p class="story-paragraph dialogue">“现在，”她最终只是轻轻地摇了摇头，败给妈妈，以同样柔软的语气回答南：“已经不痛了。”</p><p class="story-paragraph">南得到了安心的答案，她把女儿的脚擦干。</p><p class="story-paragraph">在南用湿纸巾清洁手指时，纱夏在推敲妈妈刚刚提的那个问题。</p><p class="story-paragraph">她后知后觉地发现，南好像在换着法子夸她演技好。</p><p class="story-paragraph dialogue">“你觉得怎么样，”纱夏得意时，尾音也在上扬：“我演的人鱼公主。”</p><p class="story-paragraph">南浅浅地笑着：“现在才问，是不是太晚了？”“你都分不清了吧，我是不是人鱼，”女儿调皮地凑过来：“所以才心疼我的。”</p><p class="story-paragraph">南既没承认，也没否决，她慢条斯理地继续做自己的事。</p><p class="story-paragraph">纱夏都想按住南用的那张湿巾了。</p><p class="story-paragraph">南幽幽地开口：“真的吻了他吗？”</p><p class="story-paragraph">没头没尾的句子，纱夏倒是很懂。</p><p class="story-paragraph">没能得偿所愿地听到南的夸奖，但换来妈妈的醋意，这不吃亏。</p><p class="story-paragraph">她咯咯地笑，躺倒在放平的椅子上，歪着头看妈妈：“小气鬼。”</p><p class="story-paragraph dialogue">“纱夏现在，”南终于停下了动作，她把湿巾放下：“才是越来越放肆了。”</p><p class="story-paragraph">她知道女儿在逗她的嫉妒心，但她这次偏偏要咬钩。</p><p class="story-paragraph dialogue">“下次要是再被我发现……”</p><p class="story-paragraph dialogue">“妈妈会惩罚我吗？”纱夏不甘示弱地回击。</p><p class="story-paragraph">女儿的妆还没卸，南轻易地联想起纱夏在舞台上的样子。</p><p class="story-paragraph">恍惚间，南怀疑是不是小人鱼辜负了王子？</p><p class="story-paragraph">若是让观众席的那些人们…</p><p class="story-paragraph">让那些被纱夏干净气质吸引了的人们看见，女儿在自己面前的样子。</p><p class="story-paragraph">他们又会作何想法？</p><p class="story-paragraph">南去吻纱夏的唇，女儿伸出舌头接纳了她。</p><p class="story-paragraph dialogue">“会，”纱夏听到“咔哒”一声：“先罚你一次。”</p><p class="story-paragraph">南把车门锁住了。</p><p class="story-paragraph">纱夏才反应过来，妈妈刚刚从容不迫地清洁手指，不是她以为的那样…</p><p class="story-paragraph">不是嫌她沾在她脚上的水渍脏，而是要…“等一下…”在南的吻变得越来越急迫以前，纱夏推她。</p><p class="story-paragraph">她的羞意在黑暗里都是那么明显：“这里…万一被看到…”</p><p class="story-paragraph dialogue">“那你要憋好了，不要让别人发现。”南不打算停下，她又去堵女儿的嘴。怎么这么赖皮。</p><p class="story-paragraph">南压到纱夏的身上。</p><p class="story-paragraph dialogue">“你轻点，”纱夏知道自己逃不脱，在一切还没被彻底毁掉之前，她提醒妈妈。</p><p class="story-paragraph dialogue">“不能弄坏衣服，我要还回去的…”</p><p class="story-paragraph dialogue">“没关系，”南把头埋在纱夏的肩上，她的鼻子抵着女儿裸露的皮肤：“我买下来就是。”纱夏看不到她的表情。</p><p class="story-paragraph">还好，南后怕地想，她是纱夏。</p><p class="story-paragraph">今晚她有好几次认错了。</p><p class="story-paragraph">差点真的以为纱夏是住在深海里的精灵。</p><p class="story-paragraph">南的灵魂在震颤，在发抖。</p><p class="story-paragraph">她在害怕。</p><p class="story-paragraph">女儿…</p><p class="story-paragraph">南把这副温热的人类身体抱得更紧了一点。</p><p class="story-paragraph">是不会变成泡沫消失的。</p></div>

<template id="template-chapter-09"><section class="chapter" aria-labelledby="heading-chapter-09">
      <header class="chapter-heading">
        <span>CHAPTER 09</span>
        <h2 id="heading-chapter-09">边缘</h2>
        
      </header>
      <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">萤火虫。</p><p class="story-paragraph">脑子里闪现出来的这个词好平庸——</p><p class="story-paragraph">英夫凝望着在道路尽头闪烁着星子的橙红色光点，突然间觉得自己愚不可及。</p><p class="story-paragraph">加绒的连帽卫衣，无业游民在这个季节里最基本的搭配。</p><p class="story-paragraph">是不是过于轻率地以偏概全了？这也许会对那些喜欢穿连帽卫衣的精英人士带来偏见性的侮辱。桥墩底下静悄悄的，砖瓦居然没在反复的热胀冷缩下产生裂缝，这很让人意外。</p><p class="story-paragraph">凄清的月光被遮了大半，正持续不断地透过点点缝隙坠落。</p><p class="story-paragraph">有几个印着“什么电器”的米色纸箱子亮着，英夫看不太清楚，想必是流浪汉从处理垃圾的资源循环站里偷出来的。</p><p class="story-paragraph">不用多加思考，零零落落的箱子里，肯定也零零落落地躺着几个无家可归的人。</p><p class="story-paragraph">那些躲在纸箱子里的蜷缩身体……英夫回想起折磨了他数个月的监仓生活。</p><p class="story-paragraph">他用鼻子去嗅，渗进水泥的寒气带来了阴冷的潮湿气味，也和在牢狱里闻到的没什么区别。</p><p class="story-paragraph">除此之外，倒是多了一种味道。</p><p class="story-paragraph">缠在乞丐身上的破烂布料正在散发恶臭。</p><p class="story-paragraph">它们好像是生在一起的，没有违和感。</p><p class="story-paragraph">贫穷的味道。</p><p class="story-paragraph">英夫默念了一遍“贫穷”的罗马音，脊背发凉。</p><p class="story-paragraph">比死亡还要可怕的魔鬼，他想，幸好我没被盯上。</p><p class="story-paragraph">一条蜿蜒的河安静地从他左手边流经，很和缓，没有波纹搅乱倒映在其中的明月。</p><p class="story-paragraph">江户川延申出的支流，或者，就是江户川的主干道。</p><p class="story-paragraph">没在日本生活过多久，英夫也不知道正确答案。</p><p class="story-paragraph">他只是有个日本名字而已。</p><p class="story-paragraph">带着兜帽的黑影子离他越来越近，来人是英夫整暇以待的对象。</p><p class="story-paragraph">对方的上衣印了个大大的花体英文，写着‘Champion’的字样，嘴里还叼了支点燃的香烟。</p><p class="story-paragraph">火星在暗处发光，这是英夫最开始看到的萤火虫。</p><p class="story-paragraph dialogue">“公共场合抽烟会被罚款。”英夫好心出声提醒。男人却嗤之以鼻，他扬了扬下巴，说话间有股关西腔，调子扬得厉害：“被这群垃圾举报吗？”</p><p class="story-paragraph dialogue">“那也给我来一根吧。”英夫自然地伸手，接过被压得皱巴巴的烟盒，他摸出上衣口袋里的打火机，这才发现香烟的品牌是最普通的七星。</p><p class="story-paragraph dialogue">“就抽这个？”英夫话里有话，在吐出第一个烟圈以后，他把标准版七星交还给男人。</p><p class="story-paragraph dialogue">“样货呢？”</p><p class="story-paragraph">关西男咂了咂嘴，露出不知被什么熏得发黄的两颗门牙，喉咙深处发出声压得低沉的笑，像荒原上的野兽，让人不寒而栗。</p><p class="story-paragraph">他从衣服的袋鼠兜里掏出一包用自封袋锁好的粉末。</p><p class="story-paragraph dialogue">“老大说是加强版的。”关西男捏着袋子的顶端晃了两下：“可以爽死你。”</p><p class="story-paragraph dialogue">“大货什么时候到？”英夫收起了那层不温不火的面孔，他的心因尝过这东西而干渴，此刻正在不停地狂跳。</p><p class="story-paragraph dialogue">“等几天，你开车来接。”男人的眼里蒙上一层戏谑的阴翳，把袋子抛给面前的新人。</p><p class="story-paragraph">英夫急切地去扯开它，有点白色的粉末飘到了他三角形的衣领上。</p><p class="story-paragraph">关西男的视线一下就变得像秃鹰那样凶恶尖利：“给老子忍着。”</p><p class="story-paragraph">被这声警告叫醒，尽管现在，英夫可以直接用烟把这玩意儿吸到身体里来，但他还是去给袋子封口，最后把粉末塞进了长裤的口袋。</p><p class="story-paragraph">萤火虫交给自己一把铜制的钥匙——英夫擅自给关西男取了个绰号，他一直不知道对方的名字。</p><p class="story-paragraph dialogue">“下周四去，地点到时候再告诉你，条子抓得紧。”萤火虫的烟要到底了，他猛嗦了两口烟屁股，踩着那双蓝色的帆布鞋碾灭了烟蒂。</p><p class="story-paragraph dialogue">“规矩不用我说，不要打电话，不要发短信，用加密的域名联系，老服务器。”</p><p class="story-paragraph dialogue">“好，”英夫已经入行好一阵子，这些程序都记得清清楚楚，俨然像个贩毒的老手：“博多会和我一起去。”</p><p class="story-paragraph dialogue">“随你便，”萤火虫点头，补上一句很像寒暄的话：“博多是你介绍来的吧？”</p><p class="story-paragraph dialogue">“是的，很靠谱。”英夫耐着性子回答。</p><p class="story-paragraph">他有点想走了，尼古丁无法慰藉他，他觉得紧贴着大腿的那袋子白粉在让他的皮肤发痒。</p><p class="story-paragraph">好在也没什么可吩咐的了，萤火虫只传达了最后的消息：“老大说了，再做成两笔单子就一起吃个饭。”</p><p class="story-paragraph">他不再逗留，转身的时候，挂在腰间的金属丁零当啷地碰撞在一起，发出清脆的响声。</p><p class="story-paragraph">有个醒着的流浪汉听到动静，颤巍巍地从纸箱里坐起身子，想去看发生了什么，不过马上又躺了回去。</p><p class="story-paragraph">大概是觉得，这个点约在这里见面的人，都不会是什么好惹的角色。</p><p class="story-paragraph">萤火虫的背影消失在桥柱后面，英夫也忖思是时候回去了。</p><p class="story-paragraph">没拿到什么，比起来之前，他身上只多出一把钥匙和一袋伯利恒。</p><p class="story-paragraph">但英夫感到很满足。</p><p class="story-paragraph">毕竟，对任何一个新手而言，这不错的开端都已经算得上是完美。</p><p class="story-paragraph">他单手把住方向盘，不自觉地咬住后槽牙，浑身散发着狂热者特有的那股疯劲，决心要做出更大的事业来。</p><p class="story-paragraph">线状的车灯流光黏在玻璃上。</p><p class="story-paragraph">萤火虫，他不知怎地又想起这个生物来了。</p><p class="story-paragraph">在去到美国以前，留在日本的每个暑假都会让他翘首以待。</p><p class="story-paragraph">家人带着他去到坐落在乡间的那栋平房，年幼的英夫得以随心所欲地穿越田野。</p><p class="story-paragraph">尤其是在夏夜，他只要一拿上捕虫网，就要进到枝桠丛生的林间穿梭——去寻找拍打着翅膀的星星们。</p><p class="story-paragraph">萤火虫是地上的星星，这是母亲告诉他的。</p><p class="story-paragraph">英夫拉好手刹，他把车停在府邸门口，米黄色的信筒上用钉子设好了主人的名牌。</p><p class="story-paragraph">擦得程亮的皮鞋在半圆形的门廊前站住，鞋的主人顺便轻掸掉还留在衣服上的明显粉末。</p><p class="story-paragraph dialogue">“我回来了。”他拉开大门，毫不意外地见到坐在客厅看电视的长兄：“哥哥。”</p><p class="story-paragraph">室内很温暖，福田英夫惬意地眯起了眼睛。</p><p class="story-paragraph">现在已经是冬天。</p><p class="story-paragraph">林子里再也不会有萤火虫了。</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph">刚结束裁判没多久，名井从法院回来。</p><p class="story-paragraph">不止提着午饭，她还拿上了用绸布包好的文件。</p><p class="story-paragraph">名井两只手都满满当当的，只好屈起肘部去按电梯的按钮。</p><p class="story-paragraph">检方估计还要发起一次抗诉。</p><p class="story-paragraph">在电梯到达办公室所在的那一层以前，名井一直在回想法庭上那几名判事的眼神。</p><p class="story-paragraph">要是能读懂人心该多好，就不必每次都这么费力地去揣摩陪审团的想法。</p><p class="story-paragraph">名井踏出那个狭小的空间，走上用大理石砖铺好的走廊。</p><p class="story-paragraph">不管怎样，要开始着手准备二审的资料了，她脑子转得飞快：总该有备无患。</p><p class="story-paragraph">她把罗森便利店的袋子搁在地上，在挎包里翻起办公室的钥匙。</p><p class="story-paragraph">名井先前想着审判的事出神，这才注意到门前的情况。</p><p class="story-paragraph">来了个不速之客。</p><p class="story-paragraph">在一家事务所共事这么多年，团建活动里也能经常碰面。</p><p class="story-paragraph">名井对他的站姿和身型都很熟悉，就算不怎么喜欢他——</p><p class="story-paragraph dialogue">“神木律师？”她试探性地叫了一声。</p><p class="story-paragraph">对方应声回头。</p><p class="story-paragraph dialogue">“难得来这层办事，顺便就到名井律师这里看看。” 是神木堂，他在名井问话前就把上门的理由交代清楚。</p><p class="story-paragraph dialogue">“敲了门也没人应，我还以为是故意叫我吃闭门羹。”这阴阳怪气的讲话方式就没变过。</p><p class="story-paragraph">名井没理会他话语间的讽喻，一样地针锋相对：“神木律师不会不知道现在是午饭时间吧？”“别生气。”神木咧嘴笑了：“当然知道，所以在等你回来，要不然多可惜。”</p><p class="story-paragraph">他端正地挡在门口。</p><p class="story-paragraph">空气中涌动的氛围有些尴尬，名井只好继续出声打破这种局面。</p><p class="story-paragraph">她看向神木手里的东西，转移话题：“神木律师是来材料室拿东西了？”</p><p class="story-paragraph">被问话的这人把手背到身后去，掩住了那个发旧的信封。</p><p class="story-paragraph">名井以为他不想谈这个事，没想到神木的态度出奇温和：“托住在大阪的朋友邮的，今天接到电话说快递公司已经放在事务所了，”他依然在笑，至于是否出自真心，也无从查证：“以为这个案子很难查，没想到他真的寄过来了。”</p><p class="story-paragraph dialogue">“看来是会起到很大帮助的资料。”她应道，顺着神木的意思说。</p><p class="story-paragraph">从地方法院那搜集已判决完毕的案子，这是每个律师都有的特权。</p><p class="story-paragraph">名井偶尔也会托奈未替自己找来有参考价值的案例。</p><p class="story-paragraph dialogue">“听说是有名的案子，我就拿来借鉴一下。”神木好像说完了，他长腿一迈，给名井让路。</p><p class="story-paragraph">目的就是为了炫耀？</p><p class="story-paragraph">名井觉得莫名其妙，但她还是先进了房间，把提着的物什放在桌上。</p><p class="story-paragraph">神木跟着她往里走。</p><p class="story-paragraph dialogue">“有什么事吗？”名井去问，一个那么大只的人站进来，很难忽视这道存在感极其明显的眼神。</p><p class="story-paragraph">神木环顾了一下室内的装潢，从墙壁上的时钟看到那扇巨大的落地窗，才慢悠悠地开口。</p><p class="story-paragraph dialogue">“没事，只是觉得时间过得很快，你搬到这个办公室也有好些年了，我没来过几次，”神木的皮相本身就适合插科打诨：“上次来，还是沾你女儿的光。”</p><p class="story-paragraph">名井为自己的工作环境而烦恼，对手是资历老练的律师，她很难从对方的表情里找到漏洞。</p><p class="story-paragraph">神木说得没错，女儿上次来她办公室时，的确是在大厅的电梯口碰见了他。</p><p class="story-paragraph">纱夏当然不知道妈妈同事的葫芦里卖的什么药，也不知道这两人间的过节。神木扮演了一个好叔叔的形象，是把纱夏送到名井跟前才离开的。</p><p class="story-paragraph">他狭长的眼角上挑，似乎想起了什么值得探讨的话题：“这样说起来，纱夏今年也该读大四了吧？”</p><p class="story-paragraph">看不出神木的来意，那张脸上挂着的询问意图无懈可击，无限接近关心。</p><p class="story-paragraph">女儿的存在不是秘密，名井却有些抗拒神木的问题，但她没有不回答的理由。</p><p class="story-paragraph dialogue">“过了这个暑假就大四。”她淡淡地回复，扫了一眼神木的穿着打扮，旋即撇下目光，开始整理带回来的东西。</p><p class="story-paragraph dialogue">“神木律师，” 名井拉起了防线，怕对方听不出来，她咬字很重：“大夏天穿着长袖不热吗？”</p><p class="story-paragraph">这句话让神木有点心虚，他不落痕迹地往后退了一步。</p><p class="story-paragraph">弦外之音一听便知，名井是要赶人了。</p><p class="story-paragraph">这间办公室因午饭时间无人留守，特意关闭了空调，里间的温度可不低。</p><p class="story-paragraph">长袖白衫被攻击，对方转弯抹角地说他不适合再在里面待下去。</p><p class="story-paragraph">反正得到了确认，他安慰自己，没必要再和这女人周旋。</p><p class="story-paragraph">话说得越多，反倒越容易露出马脚。</p><p class="story-paragraph dialogue">“风热感冒，最近有点怕冷，”神木看她拿出了便当，借口离开：“行了，不打扰你吃饭。”</p><p class="story-paragraph">明明没有鼻音，在神木掩上门之后，名井皱眉。</p><p class="story-paragraph">他在演哪出好戏？</p><p class="story-paragraph">神木脚步匆匆，连电梯都没搭，直接走安全通道去了楼上。</p><p class="story-paragraph">一进工作室就风风火火地把门锁上，留在外面的助手被神木吓了一跳。</p><p class="story-paragraph">那个信封被打开，他把里面的东西一股脑地倒在自己面前。神木想拭掉纸张上那层像黄土一样的灰尘，却发现无济于事，浮在表面上的颜色应该是长年累月印刻下来的，已经渗透了这沓文件。</p><p class="story-paragraph">档案袋上标记的年份显目又赫然。</p><p class="story-paragraph">他快速地浏览着十二年前的法庭记录的庭审过程。</p><p class="story-paragraph">大四……他嘴里念念有词，一边心算纱夏的年龄。</p><p class="story-paragraph">这不是巧合。</p><p class="story-paragraph">关上文件的时候，神木找到一种堪比猎人得手时的快意。</p><p class="story-paragraph">老鼠的尾巴被自己抓住了。</p><div class="section-marker" aria-label="小节 3"><span>03</span></div><p class="story-paragraph">有先见之明的人会选择弃车步行。</p><p class="story-paragraph">大晦日这天的浅草寺挨山塞海，连脚都没地方下，名井甚至是被人潮挤上吾妻桥的。</p><p class="story-paragraph">早已预料到这里的火爆程度，反正每个新年她都要这样来祈福。</p><p class="story-paragraph">一年哪怕只经历一次这种场面，就能积累下不少经验。</p><p class="story-paragraph">何况她已经在东京生活这么久了。</p><p class="story-paragraph">名井护着自己的包，姿势很娴熟，灵敏地在人墙的缝隙中穿梭。</p><p class="story-paragraph">快要到了，她看到化为袅袅云烟的白雾从寺里升起，想必是前来祈福的人们点燃了香烛。</p><p class="story-paragraph">名井打电话给纱夏：“在哪呢？”</p><p class="story-paragraph dialogue">“左边，”听声音，女儿大概是看到自己了，怕理解出现问题，她还特意换了个方式去形容：“你的十点钟方向？”</p><p class="story-paragraph">纱夏经常迷路，描述方位可真是为难她了。名井想着女儿绞尽脑汁的样子，哑然失笑。</p><p class="story-paragraph">她的身子偏转了小小的一个角度。</p><p class="story-paragraph">还没走到跟前，名井就把贴着耳廓的手机放下。她们的目光隔着数米遥遥相遇。</p><p class="story-paragraph">纱夏在向她招手，那双伶俐笑眼望向自己。</p><p class="story-paragraph dialogue">“怎么来的？”名井条件反射地牵住纱夏，去确认她手心的温度，好知道女儿有没有偷偷减衣服。</p><p class="story-paragraph">温温热的，她放下心来。</p><p class="story-paragraph dialogue">“很近，我散步就到了。”学府离浅草寺也就几步路的距离，纱夏上完课走路来的。</p><p class="story-paragraph dialogue">“给你的礼物在家，”名井拨开女儿额间的碎发，又帮她把散落的发丝划到耳后。</p><p class="story-paragraph dialogue">“没当面和你说生日快乐，现在补上。”</p><p class="story-paragraph">大学的最后一个学年，纱夏刚满了二十二岁，忙得却是不可开交，生日也没能回来。</p><p class="story-paragraph">名井提出去学校找她的想法，被女儿贴心地回绝：“你工作辛苦就别来了，反正两天之后就放寒假，我们到时一起去浅草祭拜，怎么样？”</p><p class="story-paragraph">女儿开始安排起传统节日的行程，纱夏长大的实感在名井这里更强烈了。</p><p class="story-paragraph">她答应下来，同意约在新年的前夕碰面。</p><p class="story-paragraph dialogue">“没关系，在电话里不是说了好多遍吗？”纱夏怕名井内疚，她回握妈妈的手：“每年都可以回家过生日，外地的同学都嫉妒死我了。”</p><p class="story-paragraph">这番话好像没能起到安慰的作用，妈妈“嗯”了一声，表情依然有点难以察觉的别扭。</p><p class="story-paragraph">纱夏想起前几天的事，心下了然。</p><p class="story-paragraph">生日的时候，她和妈妈说不用来学校看她，本意是叫名井在家好好休息。她记得电话那头的人在听到以后短暂地沉默了一会儿。</p><p class="story-paragraph">纱夏去整理名井的围巾，抬起的左手绕过了妈妈的脖子。</p><p class="story-paragraph">律师今天穿了平跟鞋，纱夏刚好比她高上一点。</p><p class="story-paragraph dialogue">“没弄好？”女儿的表情很认真，可能是来的时候被别人蹭乱了，名井偏过头，她想用余光看出问题所在。这会南的侧脸就无遮挡地露在她眼前。</p><p class="story-paragraph">凑崎蜻蜓点水地在上面吻了一下。</p><p class="story-paragraph dialogue">“好了，”迎着妈妈有点嗔怪意味的眼神，她露出得逞的狐狸笑容：“祝福我收到了，谢谢。”</p><p class="story-paragraph">有点粗粝的绒毛和纱夏的吻，名井不知道哪个让她的心头更痒——纱夏变狡猾了。</p><p class="story-paragraph">还没完全暗掉的天空带来寂寂光华，它留下不灭的光晕，纯净的闪烁白圈在此刻拥住女孩的面庞。</p><p class="story-paragraph">温柔是跃浪的鲸鱼，一头扎进了南的心里。</p><p class="story-paragraph">在和纱夏一齐跨过寺庙门槛的时候，住持递来两张白色的纸条。</p><p class="story-paragraph">浅草寺的预示很灵验，老人们都说，纸条上写的那句诗会揭露一个人整年的运势。</p><p class="story-paragraph">但名井向来对这种东西无感，她完全不在乎结果，随便折了两下就把它塞进了口袋里。</p><p class="story-paragraph">令她意外的是，纱夏也把纸条收起来了。</p><p class="story-paragraph">名井有点惊讶，在没学文学之前，女儿就很喜欢琢磨写在纸上的句子，这下居然反其道行之。</p><p class="story-paragraph">对纱夏的举动十分好奇，她问道：“怎么不看？”</p><p class="story-paragraph dialogue">“我还想抽个签，贪心的话，结果可能不准…”纱夏的回答让名井忍俊不禁。</p><p class="story-paragraph">果然，纱夏还是相信命运的。</p><p class="story-paragraph">女儿被闹得有点脸红。</p><p class="story-paragraph">为了满足她的愿望，名井踮脚去看放签筒的地方，发现旁边的人没有守在香炉面前的人多。</p><p class="story-paragraph dialogue">“刚好，现在抽可以吗？”</p><p class="story-paragraph">纱夏眼睛一亮，她惦记好久了，求之不得呢。</p><p class="story-paragraph">她们站到求签队伍的尾巴里去，这条队列看起来不短，前进得倒是很快。</p><p class="story-paragraph">上一个人记下数字去解签了，纱夏上前，拿起那个有点沉的木筒。里面的签被晃动一下就“簌簌”作响，怕掉出来的签会失去效力，她急忙放缓了动作。</p><p class="story-paragraph">纱夏的表情很认真，开始摇那个圆柱体，这阵势弄得名井南也有点想知道女儿抽出来的签会是什么。</p><p class="story-paragraph">一小截木片从缺口那掉出来，纱夏眯起眼睛去看。</p><p class="story-paragraph">十…四。</p><p class="story-paragraph">纱夏一路小跑到解签的窗口。</p><p class="story-paragraph">名井跟在她身后，递给女儿一枚一百元的硬币。</p><p class="story-paragraph dialogue">“抽到了十四号。”纱夏和坐在里面那个穿和服的女人交谈，交完钱才接过了签文。</p><p class="story-paragraph">纱夏紧攥着宣纸，一直没打开，犹犹豫豫的。</p><p class="story-paragraph">她向名井投来求援的眼神：“万一结果不好……”</p><p class="story-paragraph dialogue">“刚刚不是很想抽吗，”名井轻拍她的手背，说话也温声细语：“别怕，实在不行就不看。”</p><p class="story-paragraph">最后这句话起到了决定性作用，纱夏重振了士气。</p><p class="story-paragraph">来的目的就是为了求签，大费周章排了这么久队，没得到结果也说不过去。</p><p class="story-paragraph">她慢慢展开纸张，把它摊平。</p><p class="story-paragraph">看到汉字之后，名井想，签应该带不回去了。</p><p class="story-paragraph">捕捉到纱夏脸上一瞬即逝的失望，是末吉。</p><p class="story-paragraph">名井在一旁安静地等待女儿把剩余的部分读完。</p><p class="story-paragraph">不过，纱夏的眉头渐渐舒展开来，神态也变得轻松不少。</p><p class="story-paragraph dialogue">“不算特别差。”纱夏总结道，让妈妈也来看。</p><p class="story-paragraph">顺手环上了对方的腰，这个姿势很省力，她的下巴抵在女儿的肩上</p><p class="story-paragraph dialogue">“花发应残枝……”名井念这句话，有点不确定是好是坏：“是说开花的时候，枝叶已经枯萎了吗？”</p><p class="story-paragraph">纱夏停顿，想研究它背后的含义，但也没得出什么结果：“可能吧。”</p><p class="story-paragraph">南小幅度地点点头，继续往下。</p><p class="story-paragraph">恋爱运的下面写了一个“迟”字。</p><p class="story-paragraph">有句话说得很好，信则有，不信则无，这也算得上是南对神秘学的信条了。</p><p class="story-paragraph">不想让自己的行动被飘渺抽象的枷锁禁锢，她很少抽签，得到的签文也从来不解。</p><p class="story-paragraph">南是不懂的，她只是猜测而已。</p><p class="story-paragraph dialogue">“迟”。</p><p class="story-paragraph">本不信这些的。</p><p class="story-paragraph">南现在却不知为何，一刻没停地盯着这个字。</p><p class="story-paragraph">能得到各路神明保佑的爱恋，应该都是光明正大，不违正道的关系。</p><p class="story-paragraph">纱夏是她的女儿。</p><p class="story-paragraph">她哪里有资格享到上天的宽恕。</p><p class="story-paragraph">南怔怔地出神，灵魂的悲悯心甚至都在自我同情。纱夏的正缘……</p><p class="story-paragraph">在未来会把女儿从乱伦关系解救出去的谁，他能和纱夏终身厮守。</p><p class="story-paragraph">吸进来的气体变成了一个又一个小而紧实的汞，将她的血液全部推到了心口。</p><p class="story-paragraph">她入迷地胡思乱想，没注意到女儿的身体变得有点紧张。</p><p class="story-paragraph">纱夏突然往前走了一步。</p><p class="story-paragraph">南的重心还靠在对方身上，差点没站稳。</p><p class="story-paragraph">怎么了？</p><p class="story-paragraph">她猜签上写了什么东西，于是看到下一行字。——注意的事项是偷盗。</p><p class="story-paragraph">要说最有可能遭遇小偷的场所，不就是她们现在待着的浅草寺吗？</p><p class="story-paragraph dialogue">“都在吧。”名井看女儿小心翼翼地把双肩包背到前面。</p><p class="story-paragraph">没发出惊叫，担心的事目前还没发生。</p><p class="story-paragraph dialogue">“嗯，”纱夏心有余悸：“看来以后得注意点了…”</p><p class="story-paragraph dialogue">“没关系，”名井退开，给她提解决方法：“把不好的签挂在树上能消灾，我们走之前留下它就好。”</p><p class="story-paragraph">接下来许愿的时候，纱夏特别诚恳，她双手合十地夹着线香，闭了好长时间的眼睛。</p><p class="story-paragraph">直到名井出声打断她：“和观音说好了没有？”</p><p class="story-paragraph">暮色将至，浅草寺没一会就该关门。</p><p class="story-paragraph">游人越发少了。</p><p class="story-paragraph">在离开之前，名井带着纱夏找到那个专门用来系签的院落。</p><p class="story-paragraph dialogue">“哪棵？”她随纱夏手指的方向，看到了东面墙壁附近那棵靠外生长的光秃枯木。</p><p class="story-paragraph">这个季节看不出树的种类，自然也叫不出它的名字。</p><p class="story-paragraph">名井行至树下，她拿出折好的白纸，再接过了纱夏的签文，三两下就把她们 class="story-paragraph">纱夏没说，没说一切的开端都是南。</p><p class="story-paragraph">纱夏也没问南，问她为什么总这样反复，一边用占有欲和爱控制自己，一边又大发慈悲地要放过自己。</p><p class="story-paragraph">她不想把责任全部推到南身上，她怕南真的就妥协了。</p><p class="story-paragraph">可是，遇到关键问题只知道逃跑，碰到重要的部分就马上躲开。</p><p class="story-paragraph dialogue">“所以，”纱夏气笑了：“你是想要我和别人结婚？”</p><p class="story-paragraph">妈妈没有果断地肯定，纱夏从南的神色里看出她呼之欲出的情绪。</p><p class="story-paragraph">不想。</p><p class="story-paragraph dialogue">“不一定是结婚，”南松开环在纱夏腰际的手，还在强撑，她找到了另外的说辞：“陪伴也可以。”</p><p class="story-paragraph dialogue">“和你在一起就很好，”纱夏不知道除了南，她还有什么合适的人选。</p><p class="story-paragraph dialogue">“你是这个世界上对我最好的人。”</p><p class="story-paragraph">可是这句话好像更猛烈地击中了南。</p><p class="story-paragraph dialogue">“那你的意思是，”纱夏看到妈妈淡淡地笑了一下，眼底却流动着不轻信于人的谨慎：“要永远留在我身边？”</p><p class="story-paragraph">到底在害怕什么，纱夏实在不知道妈妈为什么不安。</p><p class="story-paragraph">我可是你的女儿啊，她想对南说，我们在一起这么多年，你难道不相信我吗？</p><p class="story-paragraph dialogue">“嗯，”纱夏打了直球，不偏不倚的眼神迎上南的：“永远。”</p><p class="story-paragraph">南无言。</p><p class="story-paragraph">她沉默了一会才开口。</p><p class="story-paragraph dialogue">“永远。”南好像觉得这个词很荒诞，她又重复了一遍。</p><p class="story-paragraph dialogue">“我比你大十二岁，等到老了，只会留你一个人。”</p><p class="story-paragraph">如果这就是南的理由——纱夏想，这未免也太可笑了一点。</p><p class="story-paragraph">她尽量让自己有点耐心，至少这个问题她可以解决：“没关系，我不会怕的。”</p><p class="story-paragraph dialogue">“而且，”不想要南再往后退，纱夏一股脑地直接把想的东西全部说出来：“谁说要我等你，说不定我会死在你前……”</p><p class="story-paragraph">妈妈把自己的嘴捂住了。</p><p class="story-paragraph dialogue">“不许，”纱夏看到南在流泪：“再也不许说这种话。”</p><p class="story-paragraph">怎么……</p><p class="story-paragraph">纱夏没想到南会哭。</p><p class="story-paragraph">她手忙脚乱地去擦南脸上的泪珠，但好像怎么擦都擦不完。</p><p class="story-paragraph">纱夏去吻南，想止住妈妈的眼泪。</p><p class="story-paragraph dialogue">“对不起，”纱夏慌了阵脚，她从没见过南的眼泪：“是我不听话，我惹你生气了。”</p><p class="story-paragraph">她把妈妈抱在怀里，同时感觉南纤弱的肩膀在颤抖。</p><p class="story-paragraph">不争了，她的心都要碎了，她不争了。</p><p class="story-paragraph">滚烫的眼泪就从衣服宽大的领口那里掉下来，滴落在自己的皮肤上。</p><p class="story-paragraph dialogue">“我不会走的。”纱夏不厌其烦地重复：“别赶我走。”</p><p class="story-paragraph">这份爱究竟是属于亲人的，还是恋人的……南的选择对她而言已经完全不重要了。       <div class="chapter-copy"><div class="section-marker" aria-label="小节 1"><span>01</span></div><p class="story-paragraph">出门太急，没把充电器带在身上。</p><p class="story-paragraph">南问了一圈，身边居然没有同事和自己手机型号相同。</p><p class="story-paragraph">好不容易碰到一个，对方也一样，办公室没充电器。</p><p class="story-paragraph">这下糟了，再怎么节约用电，手机也不敌客户轮番的电话轰炸。晚宴开始之前它壮烈牺牲，任凭南怎么按开机键都毫无反应。</p><p class="story-paragraph">相反，“需要充电”的信号灯倒是不知好歹地亮个没停。</p><p class="story-paragraph">她这阵子特别忙，忙着站稳脚跟。委托金额一单高过一单，辩论表现一场胜过一场的同时，南在律政界声名鹊起。</p><p class="story-paragraph">投过来的视线太多了。</p><p class="story-paragraph">对家事务所的同行、对自己抱以厚望的上司、垂涎三尺的追求者，包括同一个阵营里的笑面虎…敌友难辨，南干脆对所有人一视同仁。</p><p class="story-paragraph">她的行动越变越谨慎，叫人抓不到破绽。</p><p class="story-paragraph">要确保万无一失，珍惜时间去接触信用良好的客户，之后获得的声誉就能成为底牌。若孑然一身，南当然是不怕的。</p><p class="story-paragraph">可事与愿违，如果她做不出什么成绩——作为独身女性，还带着纱夏生活在东京的这件事情本身，就会变成别人眼中的把柄。挺过去了就好。她以这种说辞宽慰自己。</p><p class="story-paragraph">但南也愧疚，心本向着女儿，却也为此频频错过陪伴纱夏的机会。</p><p class="story-paragraph">尤其是最近，她觉得自己没起到家长的作用。</p><p class="story-paragraph">全东京的公立初中都是这周考试，别人的父母是怕孩子考试累着，名井倒好，在当甩手掌柜，喝得酒气熏天才回家，还要麻烦纱夏替她操心。</p><p class="story-paragraph">她白天趁午休打电话给女儿，抱歉地和她说，晚上恐怕又得陪客户谈生意了，不过也顺便问了问纱夏备考的情况。</p><p class="story-paragraph dialogue">“数学复习得怎么样？”</p><p class="story-paragraph dialogue">“还不错，最后一门了。”女儿在这个时候还惦记着自己，关于考试的话题，纱夏用简单的几笔寥寥带过，就把话题转向更在意的方向：“妈妈今天可不可以少喝一点？”</p><p class="story-paragraph dialogue">“放心，我会尽早回来的。”南这次真的会信守诺言，毕竟，她已经连续几天都没能说到做到了。</p><p class="story-paragraph">要是再不听女儿的话，家长的公信力都要丢光。</p><p class="story-paragraph dialogue">“考试辛苦了，”她正要挂电话，突然想起纱夏晚饭还没着落：“听说三丁目的饮食街开了家烤肉店，今晚可不可以先派你去踩点？”</p><p class="story-paragraph dialogue">“好，”语气是很雀跃的，她听到纱夏答应：“如果好吃…”</p><p class="story-paragraph dialogue">“就再一起去，”南接话，又问她：“钱够不够？”</p><p class="story-paragraph dialogue">“够的，你给那么多，我都用不完…”</p><p class="story-paragraph">拖长的尾音，怎么像是在抱怨？</p><p class="story-paragraph">南有点无奈地笑了。</p><p class="story-paragraph">女儿还真是好养，连钱都不喜欢，就要她陪。</p><p class="story-paragraph dialogue">“注意安全，最好和同学去。”她耐心地补充。</p><p class="story-paragraph dialogue">“八点之前要回家。”</p><p class="story-paragraph">纱夏有没有听话不知道，名井南反正是没有的。</p><p class="story-paragraph">九点才散场的酒局，几个系领带的男人还打算拉着她去唱歌。</p><p class="story-paragraph">南婉言谢绝了。说女儿一个人在家，要早点回去。她抬手拦了辆计程车，上去时还特意问了司机时间。“快十点了。”师傅告诉她。希望纱夏没等急。不长的距离因焦躁的心绪而变得有点难挨，南感觉车开了好久，她合理推测，司机是不是看她一个人好欺负，所以故意绕了远路。</p><p class="story-paragraph">看到小区门禁的治安亭，递给师傅几张日币以后，南就匆匆下了车。不过，还没那么快就走到家。关键时刻，南有点看不清路。踩着高跟鞋怕摔倒，她只好放慢了脚步。</p><p class="story-paragraph">是酒精的缘故吗？</p><p class="story-paragraph">可今晚她也没喝很多。</p><p class="story-paragraph">南抬头，发现了问题所在。</p><p class="story-paragraph">月亮好好地挂在头顶，今天甚至是云彩最少的日子。</p><p class="story-paragraph">周边的环境依然很暗。</p><p class="story-paragraph">原本该亮着的路灯都灭掉了。</p><p class="story-paragraph">她刚好走到保安面前，对方认出南来，拿工位卡给她开门：“晚上好。”</p><p class="story-paragraph dialogue">“这是怎么回事？”她边进去边问，指的是为什么没开灯。</p><p class="story-paragraph dialogue">“施工的原因，照明电源要等两个小时才恢复，”保安回答：“不过不用担心，电梯能正常使用。”</p><p class="story-paragraph">停电了。</p><p class="story-paragraph">纱夏很怕黑，南有点不安。她得赶快上楼才行。</p><p class="story-paragraph">可能是闻到了女人身上的酒味，保安怕业主有个什么闪失，抄起门口小桌上的一个手电筒给她。</p><p class="story-paragraph dialogue">“没关系，反正就是给你们用的，我在外面又不需要，”南拿着手电筒走到电梯间的时候，心里感谢这个善良保安慷慨的赠予行为：“明天还回来就行。”</p><p class="story-paragraph">电梯里也是一片黑，但南喝了酒，手上还持着光源，自然不紧张。</p><p class="story-paragraph">楼道的感应灯没反应，她凭记忆走到门前。</p><p class="story-paragraph">手上的动作不稳，南插了几次才成功扭开了锁芯。</p><p class="story-paragraph dialogue">“纱夏？”她把大门关好之后，唤着女儿的名字，拿着手电筒往家里照。</p><p class="story-paragraph">幸亏楼高，满月悬着的微光能够漏进客厅。南听到沙发那边传来了很轻很轻的呼吸声。</p><p class="story-paragraph">纱夏蜷着身体，她的两只手紧紧地抱着膝盖。</p><p class="story-paragraph dialogue">“妈妈…”女儿应了，好像终于放松下来，发出微弱的呜咽。</p><p class="story-paragraph">南把包随手丢在一边，快步走到纱夏身侧，马上就被女儿撞了个满怀。</p><p class="story-paragraph dialogue">“你去哪里了，电话也打不通……”纱夏抓着南的衣服，手指用了很大的力气。</p><p class="story-paragraph">南感觉小臂上的肉都被女儿揪住了，有点痛。</p><p class="story-paragraph dialogue">“对不起，”纱夏像树袋熊一样粘着自己，细软的头发蹭得她脖子很痒：“手机没电了。”</p><p class="story-paragraph dialogue">“我等了好久，你都没回来…”纱夏在抽泣，话也说不完整，却还是没有怪南：“我好怕你不见了，万一你不见了，我…”</p><p class="story-paragraph">就又要一个人了。</p><p class="story-paragraph">南的酒醒了大半。</p><p class="story-paragraph dialogue">“不怕，没事了。”南放任纱夏去确认自己的存在，尽管她有点担心，女儿把头死命地埋在她胸前会不会窒息。</p><p class="story-paragraph">她心疼得要命。</p><p class="story-paragraph">极尽耐心地哄了纱夏一会，南才松开女儿的后脑勺，借着月光去看她的脸蛋。</p><p class="story-paragraph dialogue">“哭了？”应该是的，纱夏的泪痕依然未干，可怜兮兮的。</p><p class="story-paragraph dialogue">“突然停电了，我也不敢到外面去…”她吸了吸鼻子，越说越难过，眼泪还在往外掉。</p><p class="story-paragraph">南终于感受到少女对自己完完全全的依赖。</p><p class="story-paragraph">这份信任来之不易，她一方面感谢纱夏的宽容，一方面又深知自己责任重大。纱夏乐观，年龄…也正值最天真无邪的时候。</p><p class="story-paragraph">她体会得到生命里的善，才能回馈近乎同等的爱。</p><p class="story-paragraph">可是，亲身经历失去双亲的疼痛，是没办法被轻易抹去的。</p><p class="story-paragraph">南差点就这样，忽略了纱夏内心的敏感纠结。</p><p class="story-paragraph">女儿如何能不害怕呢？她把纱夏的坐姿摆好，再一次将女孩拢进怀里。</p><p class="story-paragraph">已经是纱夏的亲人了。也是纱夏的妈妈。</p><p class="story-paragraph">不会再这样了，南下定决心。</p><p class="story-paragraph dialogue">“明天妈妈把同事的号码都给你好不好，”她对纱夏说：“找不到我的时候，就给他们打电话。”</p><p class="story-paragraph">纱夏听话地点头。</p><p class="story-paragraph">不知道静默的时间就这样过了多久，两人的呼吸自然而然地变得和缓。</p><p class="story-paragraph">胆怯已经从纱夏的身体里逃离，南觉得是时候了，于是想站起来。</p><p class="story-paragraph">女儿不肯放她走。</p><p class="story-paragraph">居然又要哭了，这要是被别人看到，南怀疑自己会被冠上家暴纱夏的罪名。</p><p class="story-paragraph dialogue">“只是去洗个澡，”她蹲下来，平视女儿的目光：“今晚我陪你睡。”</p><p class="story-paragraph dialogue">“乖，”南止住了纱夏满溢的悲伤情绪，她轻揉小女孩的头顶。</p><p class="story-paragraph dialogue">“不哭了。”</p><div class="section-marker" aria-label="小节 2"><span>02</span></div><p class="story-paragraph dialogue">“不哭了…”</p><p class="story-paragraph">纱夏推着妈妈倒在书房的扶手椅上。</p><p class="story-paragraph">她用手垫住了南的腰。</p><p class="story-paragraph">眼泪融在舌尖，好像化成了极细的玻璃碎片扎进喉咙，刺得纱夏说不出话。</p><p class="story-paragraph">南的眸子里积了一帘水幕。</p><p class="story-paragraph">从源头让它消失掉吧，纱夏去亲妈妈的眼角，把南吻得不得不闭上眼。</p><p class="story-paragraph dialogue">“不要生我的气。”她好像一头不知疲倦的幼兽，抖抖沾湿的皮毛，要继续往雨里冲。</p><p class="story-paragraph">纱夏换了方向，留恋地在南的鼻尖痣上停留了很久，最后用舌头撬开她的牙关。</p><p class="story-paragraph">眼泪明明是咸的，为什么她在妈妈这里尝到的味道又这么甜？</p><p class="story-paragraph">得亏南教得好，把纱夏教得这么有耐心。</p><p class="story-paragraph">她一副永不厌倦的样子，锲而不舍地哄着妈妈。</p><p class="story-paragraph">除此之外，还要感谢南教她怎么接吻，女孩的吻技今非昔比。南在抽噎，她因此被纱夏占了上风。女儿的安慰夺走了她呼吸的氧气，南这下分身乏术，顾不上伤心。</p><p class="story-paragraph">这套无章法的吻好像卓有成效，纱夏松开南，她发现对方的鼻子没那么红了。</p><p class="story-paragraph">糅杂在行动里的爱意好好地传达出去，纱夏稍微放心了一点。</p><p class="story-paragraph">为了确定南的泪水不会接着涌出来，她眨眼看妈妈。</p><p class="story-paragraph">南的眼睛底下，也有一圈不明显的青色痕迹。</p><p class="story-paragraph">和自己一样，妈妈失眠了。她忍不住去轻轻摩挲女人的卧蚕。</p><p class="story-paragraph">被女儿仔仔细细地盯着，南受制于对方探究又关切的神色，这才觉得刚刚在纱夏面前流泪是不是过激了，有些吓到对方。</p><p class="story-paragraph">她再次想起女儿的表白。</p><p class="story-paragraph">笨蛋，南又惊又喜。</p><p class="story-paragraph">怎么能把爱说给自己听…</p><p class="story-paragraph dialogue">“看什么，”她把头偏过去，因为哭过，声音雾雾的：“很丑吗？”</p><p class="story-paragraph">纱夏一愣，为了回答这个问题，她更认真地端详起妈妈来。</p><p class="story-paragraph dialogue">“不是，”硬是不能从南的脸上择出半点瑕疵，她实话实说：“很漂亮。”</p><p class="story-paragraph dialogue">“少哄我，长皱纹了。”南自讽，没有真正怪纱夏的意思。</p><p class="story-paragraph">她默数和女儿共同度过的日子，十二年了，即使是神仙也会老去的：“这样了还漂亮。”</p><p class="story-paragraph">纱夏觉得奇怪，南的这张脸是得了造物主垂怜的，就连落泪也是这样楚楚动人。</p><p class="story-paragraph">要是妈妈都对自己的容貌不自信，世界上还能有几个美人呢？</p><p class="story-paragraph">她低头，脑袋去碰南小巧的耳朵，叫妈妈不要担心：“真的，是我见过最漂亮的。”</p><p class="story-paragraph">第一眼见到的时候就这样想了，纱夏当时以为是自己没见过世面。长到现在，她终于发现，根本问题没出在她身上，是出在南身上。</p><p class="story-paragraph">一上来就让她碰到了，纱夏想。</p><p class="story-paragraph">名井南年轻时的样子，现在的样子，包括以后的样子。没人比得过妈妈。</p><p class="story-paragraph dialogue">“知道了。”女儿的直截了当把南弄得更不好意思，在被发现以前，她截住了话题。</p><p class="story-paragraph">扶手椅不大，两个人挤在上面的姿势显得有点局促，南的背枕住了一条椅臂，纱夏就撑在她的上方。</p><p class="story-paragraph">会很累的，南拉一下女儿，纱夏的体重顺势就压过来。</p><p class="story-paragraph">她们两人的身体贴在了一起。</p><p class="story-paragraph">那人沉默着没说话，南挑起眉毛：“没别的了？”</p><p class="story-paragraph dialogue">“有。”可以让战火消停了，日思夜想的人就偎在自己怀里。</p><p class="story-paragraph">纱夏用手背蹭蹭南的鬓发。</p><p class="story-paragraph dialogue">“我好想你。”</p><p class="story-paragraph">闹了两个星期的别扭终于结束，握手言和之后的安宁显得格外难得。</p><p class="story-paragraph">谁也没马上出声。</p><p class="story-paragraph dialogue">“不饿吗？”似乎待得太久了，南想起纱夏是来叫自己吃中饭的。</p><p class="story-paragraph">女儿在用食指绕她的头发玩。</p><p class="story-paragraph">她很体贴地依纱夏去做这些调皮的小动作。</p><p class="story-paragraph 就混上道了，顺便带了个朋友一起——反正他说那是自己的朋友。</p><p class="story-paragraph">那人因为身份不便，于是取了个外号，让大家叫他“博多”。不过外号这种东西，都只是在买家那里才能起到遮掩的作用。</p><p class="story-paragraph">怕下面的人出尔反尔，搞出两面三刀的事情，龙之介把所有小弟的家底都摸得一清二楚。</p><p class="story-paragraph">博多的真名是什么，他早就知道了。</p><p class="story-paragraph">说来也有趣，最开始做伯利恒的明明是英夫。</p><p class="story-paragraph">但恐怕是气场不合的原因，龙之介始终没怎么喜欢上他。</p><p class="story-paragraph">加入的新人几乎都是和英夫从一个模子里倒出来的。</p><p class="story-paragraph">这和伯利恒的特点有关。</p><p class="story-paragraph">名字新颖，味道也好，吸食它的人基本上是有钱的富二代。</p><p class="story-paragraph dialogue">——懒惰、天真又自大。</p><p class="story-paragraph">龙之介是有点后悔的，他以为英夫会有所改变。起码学聪明一点吧，可英夫没有。</p><p class="story-paragraph">随着日子久了，在这堆人里，和龙之介关系最好的那位变成了博多。</p><p class="story-paragraph">与其说博多是他的小弟……不如说，两人现在相处的模式更像朋友。</p><p class="story-paragraph">这也是他出现在拉面馆的原因。</p><p class="story-paragraph">龙之介摇了一下面前装烧酒的小玻璃杯。</p><p class="story-paragraph dialogue">“你小心点，”他让博多下班就赶快过来，是为了警告他：“英夫被盯上了。”</p><p class="story-paragraph dialogue">“到底怎么回事？”博多难得露出慌张的样子，他平时总嬉皮笑脸。</p><p class="story-paragraph dialogue">“太张扬，”龙之介把刚喝干的酒杯又倒满了：“条子那边有我们的人，我们这边也有条子的人。”</p><p class="story-paragraph dialogue">“和他说了不要骄傲，他就是不听。”博多不耐烦地哼了一声，很恼火。</p><p class="story-paragraph dialogue">“他是这样的，”龙之介把最新的消息告诉博多：“酒吧里几乎全是他的货，在年轻人里传来传去。”</p><p class="story-paragraph">引起了条子的注意力，还挡了传统毒品的销路。</p><p class="story-paragraph">把同行和敌人全得罪了。</p><p class="story-paragraph">他第一眼果然没看错，英夫真是彻头彻尾的傻逼。</p><p class="story-paragraph dialogue">“你有没有什么把柄在他手上？”这问题不是废话，两人可算是白手起家的伙伴，怎么可能不留下交往的证据。博多没回答，龙之介看他紧锁眉头的样子，猜到大半。</p><p class="story-paragraph dialogue">“躲起来吧，”他打了个哈欠：“他还有个撑腰的老哥，你要是被抓了，得丢饭碗了。”“知道。”博多脸色阴沉。</p><p class="story-paragraph">他们在门口道别。</p><p class="story-paragraph">初春时节的气温不高，雨水也多，浠沥沥地掉个没停。龙之介让博多先走，他没伞，站在塑料蓬底下发呆，等着雨势小了再出去。他没告诉博多，他们大概再也不会见面了。老大已经撤回大阪的本部，他之前就伤了元气，东山再起的计划还被这个毛头愣青给毁了大半。</p><p class="story-paragraph">龙之介和几个老手给他殿后，把要处理的家伙都做掉了。安全起见，也脱手了所有的伯利恒，赶快和它洗清了关系。幸好之前小心谨慎，联系时都用加密域名和虚拟服务器。时代真是不一样了，有信息技术加持，不容易留下马脚。</p><p class="story-paragraph">况且，英夫就算是被抓了，也不敢说他老大的名字。</p><p class="story-paragraph">再蠢的人，都不会把在日本活动了二十来年的老毒枭拉出来垫背。除非他不止是想死无全尸，还要拖家人下水。</p><p class="story-paragraph">至于英夫会不会供出博多，他真不知道——龙之介为他这个称得上朋友的人祈祷了一会儿。</p><p class="story-paragraph">不过一切设想，都需要建立在英夫落网的前提之下。说不定就没事呢。</p><p class="story-paragraph">龙之介烟瘾又犯了，他去掏口袋，转眼想起自己是站在体面人吃饭的店子门口，不能抽。</p><p class="story-paragraph">他把那包香烟塞回原位。</p><p class="story-paragraph">低头的时候，他发现博多离开的位置掉了个什么东西。龙之介把它从积了雨水的地上捡起来。</p><p class="story-paragraph">街边的路灯都亮了，光束照在这个小小的金属圆片上。</p><p class="story-paragraph">它看起来就像一只萤火虫。</p><div class="section-marker" aria-label="小节 5"><span>05</span></div><p class="story-paragraph">纱夏特意回家了，她本来是打算给妈妈一个惊喜的。</p><p class="story-paragraph">可在手机上装了定位软件之后，这种惊喜存在的可能性就越来越小。</p><p class="story-paragraph">纱夏才到家十分钟，名井南一个电话就追着打来了。</p><p class="story-paragraph dialogue">“怎么回家了？”妈妈问，似乎全然忘记今天是什么日子。纱夏看她刚放在桌上的蛋糕，还有那个装了生日礼物的纸袋，一时间不知道说什么好。</p><p class="story-paragraph dialogue">“你回来就知道了。”她是这样告诉南的。</p><p class="story-paragraph">等着南到家，纱夏开始琢磨起要怎么和妈妈开口提那件事。</p><p class="story-paragraph">她在斟酌遣词造句，不停地摆弄那个装了项链的首饰盒。</p><p class="story-paragraph">这是纱夏用奖学金挣来的，是她要送给妈妈的礼物。</p><p class="story-paragraph">她最后一次去检查项链，然后确认蛋糕没有被压坏。</p><p class="story-paragraph">在把东西全部装回袋子之后，时间刚刚好。妈妈开门了。</p><p class="story-paragraph dialogue">“生日快乐！”纱夏冲到她面前的时候，南刚好关上门。</p><p class="story-paragraph">她过去抱住妈妈，笑嘻嘻地去吻她，好像一只等主人回来的小狗。</p><p class="story-paragraph">纱夏开学一个多月了，要毕业了，周末留在家中的机会不多，没人提醒名井南生日要到了。</p><p class="story-paragraph">南自己呢，她也对生日也越来越无感，觉得每过一次就要老一岁的日子让她有点害怕，所以就没怎么注意日期。</p><p class="story-paragraph">没想到纱夏还是一直惦记着。</p><p class="story-paragraph">女儿把她压在门上好好地索了一番吻。</p><p class="story-paragraph">南闻到对方身上的味道，还是馥郁的花香。</p><p class="story-paragraph dialogue">“我们最常去的那家店出了新品，听说很火，”纱夏把蛋糕推到南的面前：“而且分量也不多。”</p><p class="story-paragraph dialogue">“是不是排了很久队？”南知道，她每次去都人满为患的。</p><p class="story-paragraph dialogue">“没有，”买给南吃才是她最主要的目的，是排了一会儿，但那都是小问题了：“今天大家都要上班，没什么人。”</p><p class="story-paragraph">她给蛋糕上插了一根蜡烛，再划火柴把它点燃。</p><p class="story-paragraph">客厅里没开灯，烛光摇曳出的火苗在南的眸子里跳跃。</p><p class="story-paragraph dialogue">“许愿吧。”她让南完成寿星才有的特权。</p><p class="story-paragraph">妈妈闭上眼睛了。</p><p class="story-paragraph">纱夏在一旁看着她，很真心地同她一起祈祷。会许什么愿？</p><p class="story-paragraph">南吹熄了蜡烛。</p><p class="story-paragraph dialogue">“来试试味道。”纱夏把勺子递给她，希望这个蛋糕可以被南喜欢。</p><p class="story-paragraph">对方咀嚼的动作斯斯文文的，没说话。</p><p class="story-paragraph">人气火爆的单品应该不差吧，纱夏感觉自己在应对什么考试一样，妈妈是她的考官。</p><p class="story-paragraph dialogue">“怎么样？”她在等考官给她的打分，有点紧张。</p><p class="story-paragraph">南把勺子转了个方向：“你来试试就知道了。”</p><p class="story-paragraph">妈妈的嘴巴下面沾到了奶油，试这里的不就好了。</p><p class="story-paragraph">纱夏躲过了她递来的勺子，亲了上去。</p><p class="story-paragraph">她从南的舌头上尝到了蛋糕的余味。</p><p class="story-paragraph">比生下来以后吃过的所有甜品都要…“好吃。”她得出这个结论，南轻笑了一下。</p><p class="story-paragraph">趁着这个时候。</p><p class="story-paragraph dialogue">“还有东西要给你。”纱夏想起给妈妈准备的另一个礼物，她去袋子里翻。</p><p class="story-paragraph">要怎么戴上去呢？</p><p class="story-paragraph">她看着南空无一物的颈间，最后决定坐在妈妈的大腿上。</p><p class="story-paragraph">纱夏把盒子里装着的物什拿出来。</p><p class="story-paragraph">那是一条玫瑰金的链子，球型宝石坠在中间，闪着蓝绿色的微光。</p><p class="story-paragraph">妈妈很给面子地把头低了下去，纱夏环着她的脖子，将尾扣扣好。</p><p class="story-paragraph">她看到完成品的模样——带着项链的南，觉得很幸福。</p><p class="story-paragraph">就好像这条项链的意义已经可以媲美于戒指。</p><p class="story-paragraph dialogue">“有什么寓意吗？”南看到那颗珠子，不禁去问女儿。</p><p class="story-paragraph dialogue">“生辰石，代表月份，”纱夏回答她：“这是绿松石。”</p><p class="story-paragraph dialogue">“三月份？”南对这些不甚了解，只得猜测，毕竟她的生日是在三月里的。“不是，”女儿否认了，她公布正答：“十二月。”</p><p class="story-paragraph">纱夏出生的月份。</p><p class="story-paragraph">要自己把能象征她的东西戴在身上，南愣了一下。</p><p class="story-paragraph dialogue">“这样的话，”看到南沉默，纱夏补了句话，语气有点生硬：“就算我不在你身边，也可以陪着你。”</p><p class="story-paragraph">这是…什么意思？一鼓作气说出来吧，纱夏发现南开始思考了。</p><p class="story-paragraph">在妈妈的猜测出口以前，她把考虑了快一个月的事情告诉南。</p><p class="story-paragraph dialogue">“我们大学的文学部，有和友谊学校的交换名额，”她停顿，观察妈妈的脸色：“我的导师很推荐我去。”</p><p class="story-paragraph dialogue">“交换大学在哪？”南没看她。</p><p class="story-paragraph dialogue">“美国…纽约。”纱夏惴惴不安，她知道突然提出来，南肯定受不了。</p><p class="story-paragraph">院里公认脾气最差的服部泽教授指导她的论文，所以当对方来找自己商量的时候，纱夏也有点意外。</p><p class="story-paragraph dialogue">“我看你的英语还不错，”服部不知道从哪里找来了女孩的成绩单：“论文又是古典文学的方向，考不考虑去国外学比较文学？”</p><p class="story-paragraph dialogue">“两年，拿到文凭回来的话，”纱夏把老师的诺言复述给妈妈听：“再累积一点经验，就可以作为优秀校友，留在学校专心做研究了。”</p><p class="story-paragraph dialogue">“相当于工作有着落了。”南淡淡地帮她把意思表明。</p><p class="story-paragraph dialogue">“是…”纱夏知道自己的专业在就职这方面是不太占优势的，能得到一个留在大学做研究的职位实在是太幸运。</p><p class="story-paragraph">可是她的妈妈…</p><p class="story-paragraph dialogue">“有多少把握？”比起女儿离开她，南先害怕的事情，是纱夏被骗。</p><p class="story-paragraph">她觉得这个饵未免也太诱人，女儿真的能得到想象里的回报吗——“百分之百，有已经当上了教授的前辈，”就是服部泽，纱夏想着那位魔鬼老师，有点胆寒：“因为是和友谊院校的合作，所以相当于学校给的特惠名额。”</p><p class="story-paragraph">空气很静默，刚刚还有说有笑的。</p><p class="story-paragraph">女儿给她项链…</p><p class="story-paragraph">是为了让自己对她今后两年的缺席有个心理准备。</p><p class="story-paragraph dialogue">“你的语言…”南不知怎么应答。一边是纱夏的前途，一边是她可悲的私心，她在找能阻止女儿的理由，但显然底气不足。</p><p class="story-paragraph dialogue">“毕业的暑假上语言学校练习一下口语，在使馆能过面签就可以了。”</p><p class="story-paragraph">服部教授告诉了纱夏，对方每次提供交换名额都会赶上本科最后一个学年的三月份。</p><p class="story-paragraph">怕入学时间出现冲突，这所常青藤大学承认日本高校内部的英语考试成绩。</p><p class="story-paragraph">她便不用再准备语言资格考试了。</p><p class="story-paragraph">南平静地听纱夏陈述如何离开自己的方法。</p><p class="story-paragraph">垂在身侧的手攥成了拳头，指甲在手心留下了不浅的痕迹。</p><p class="story-paragraph">她突然希望女儿的学习成绩不要那么好，甚至有点后悔自己给女儿买了那套书。</p><p class="story-paragraph">虽然她知道，纱夏不用她的书也能取得今天的成绩。</p><p class="story-paragraph">女儿要走的路，已经被铺得很远很远了。</p><p class="story-paragraph">南无比珍视现在的时刻。</p><p class="story-paragraph">生日愿望才许下来的，想要和纱夏就这样一直生活下去。既然已经不能实现，南想。早知道换个愿望了。</p><p class="story-paragraph dialogue">“想好了的话，就去吧。”她终于还是这样说，想让纱夏从她的腿上下去。</p><p class="story-paragraph">南觉得有什么东西阻碍了她的呼吸。</p><p class="story-paragraph">妈妈不开心了，纱夏最怕出现这种结果。</p><p class="story-paragraph">两年，尽管她也很舍不得南，但她相信妈妈在家里能照顾好自己。</p><p class="story-paragraph">能不能让南寄予自己同等的信任？</p><p class="story-paragraph">纱夏想起四年前做下的决定。</p><p class="story-paragraph">她当时没想那么远，只按“自己喜欢与否”的标准去学了文学。</p><p class="story-paragraph">要是知道有今天，她肯定要再考虑一下，去学更有用的东西。</p><p class="story-paragraph">但已经走到现在，不能逃避的话，就抓住这个契机变得更好…</p><p class="story-paragraph">她也想快一点长成值得依靠的大人。</p><p class="story-paragraph">能在社会上有地位，有身份。纱夏垂下眸子。</p><p class="story-paragraph">若是忍过了这两年，以后想怎么陪着南，都可以了。她要更理直气壮一点，好名正言顺地接过妈妈身边的位置…</p><p class="story-paragraph">要能够成为南这一生的爱人。</p><p class="story-paragraph dialogue">“妈妈。”纱夏小声地去恳求南，双手扯住她的衣服。</p><p class="story-paragraph">就像小时候一样，怕自己离开…就连这声呼唤也掺了太多沉甸甸的情绪。</p><p class="story-paragraph">南还是心软了。</p><p class="story-paragraph dialogue">“你愿意…”女儿的鼻子有点红，纱夏好像用了很多勇气才把这句话说出来。</p><p class="story-paragraph dialogue">“等我回来吗？”</p><p class="story-paragraph">到底需要多大的决意，才能提前预支两年后的承诺。</p><p class="story-paragraph">明明也不知道未来会发生什么。</p><p class="story-paragraph">南在女儿的眼睛里看到了爱。</p><p class="story-paragraph">是爱情，她再三确认，没有认错。</p><p class="story-paragraph">太多意外…</p><p class="story-paragraph">和纱夏相遇是意外。</p><p class="story-paragraph">人生的轨迹因此改变是意外。</p><p class="story-paragraph">成为纱夏的妈妈是意外。</p><p class="story-paragraph">和纱夏突破那个界限是意外。</p><p class="story-paragraph">听到纱夏把难言的喜欢说出口是意外。</p><p class="story-paragraph">南实在是不忍再拒绝这个请求。</p><p class="story-paragraph dialogue">——和纱夏走到今天这一步，究竟是意外…</p><p class="story-paragraph">她闭上眼睛，把眼泪按回了心底。</p><p class="story-paragraph dialogue">“好。”</p><p class="story-paragraph dialogue">——还是她放着自己的心不管，任凭其沦陷在禁忌之爱里的报应。</p></div>
