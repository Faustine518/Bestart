        </aside>
        <div class="chapter-copy"><p class="story-paragraph">今天是两人在北欧迎接的第一个雨天，窗外黑得如太阳没有升起一般。风雨交加，连窗户都哐当哐当地响，偶尔还能听到雷声和闪电，对于旅客来说，是最恶劣的天气。偏偏前一天还下了雪，路面泥泞不堪。</p><p class="story-paragraph">知珉把脚踝塞进没有鞋跟的靴子，将羽绒服拉链拉到底，接着给怕冷的室友戴上毛帽，连眉毛都盖地严严实实，然后在上面围上围巾。旼炡眨巴着双眼，露出勉强能看见的脸喃喃自语。</p><p class="story-paragraph dialogue">「…我是不是裹得太圆滚滚了？」</p><p class="story-paragraph dialogue">「外面风很大，一定要这么穿」</p><p class="story-paragraph dialogue">「姐姐行李都收好了吗？没什么遗留的吧？」</p><p class="story-paragraph">两人最后在房间转了一圈，确认有没有留下东西。床上、桌子、浴室等。可能是因为行李收拾惯了，整理东西所消耗的时间并不长。现在要向虽然停留时间很短，但积累了很多回忆的青年旅舍道别。知珉转动了手中的钥匙。</p><p class="story-paragraph">今天是去第四个城市的日子。旼炡说真的很期待去鲑鱼之国，表达了对下一个目的地的期待。鲑鱼之国，当然谁都知道那是挪威。</p><p class="story-paragraph dialogue">「应该没有落下什么东西，带了雨伞吧？」</p><p class="story-paragraph dialogue">「嗯，走吧？」</p><p class="story-paragraph">但是打开门出来的瞬间，彷彿预示着今天的苦难，之前平静的天空就像被穿了孔，下起倾盆大雨。被狂风暴雨吓到的知珉蜷缩着身子。紧接着传来了轰隆隆的雷声。</p><p class="story-paragraph dialogue">「...吓我一跳」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「没有，只是因为雷声吓了一跳」</p><p class="story-paragraph">由于天生敏锐的听力，知珉对噪音比别人更敏感。这在日常生活中经常会造成不便。例如，在过马路的时候，汽车突然发出叭叭的喇叭声，或者像今天这样响起震耳欲聋的雷声时，特别是嗓门大的人突然兴奋地大声说话时，心里都会一紧。甚至连陌生人看到都会特别紧张。</p><p class="story-paragraph">可怜的是，旼炡的音量相当大，这偶尔会引发两人之间的小问题。正好昨晚旼炡也陶醉地唱着歌，所以自己狠狠地提醒了一下。</p><p class="story-paragraph dialogue">「旼炡啊，现在几点了？」</p><p class="story-paragraph dialogue">「11点半，怎么了？」</p><p class="story-paragraph dialogue">「不是在问时间...不是很晚了嘛。哼歌没事，但是晚上能不能安静点？」</p><p class="story-paragraph dialogue">「有那么吵吗？」</p><p class="story-paragraph dialogue">「现在是姐姐准备睡觉的时间了吧」</p><p class="story-paragraph dialogue">「...知道了」</p><p class="story-paragraph">明天早上再好好唱，知道了吧？像哄孩子一样拍拍旼炡的头，躺在床上没多久，莫名奇妙在浴室内响了几声巨大噪音。瞬间睡意全无的知珉，猛然直起身来，浴室灯开着代表她应该是在里面。旼炡啊。一喊她的名字，圆呼呼的脸停下洗漱动作，从洗手间露出头来。</p><p class="story-paragraph dialogue">「怎么叫我，你不是说要睡觉吗？还不睡吗？」</p><p class="story-paragraph dialogue">「刚才是不是掉了什么东西在地上？」</p><p class="story-paragraph dialogue">「没有吧...？什么都没掉啊？」</p><p class="story-paragraph dialogue">「那刚才那声音是什么？」</p><p class="story-paragraph dialogue">「...啊，是在说这个吗？」</p><p class="story-paragraph">旼炡干脆走到自己面前，发出震耳欲聋的声音。哒、哒、哒。</p><p class="story-paragraph dialogue">「搞什么，太吵了，快走开」</p><p class="story-paragraph">知珉皱着眉头推开噪音的根源，问她到底在干什么。旼炡则理直气壮地说最近习惯了弹着上颚，发出“哒哒”声，声音比想象中大得多，很有意思，正在研究让声音更大的方法。总之说了这类不像样的话。</p><p class="story-paragraph dialogue">「你为什么要研究这些？以后晚上禁止发出这种声音」</p><p class="story-paragraph dialogue">「这个也不能做？姐姐太敏感了」</p><p class="story-paragraph dialogue">「别人在睡觉的时候不吵闹不是最基本的吗？」</p><p class="story-paragraph">和一刻也不得闲的狗狗待在同一个屋檐下，看来不是一件容易的事情。又不是小学生，还得一一指出在深夜不能做的事情？可能是对突然增设的限制事项不满，旼炡再次回到浴室，开始抱怨。这个也禁止，那个也禁止，不就是让我什么话都不说吗？如果要接受她发起的牢骚，可能会永无止境，所以先无视她，知珉努力闭上眼睛。到此是昨晚发生的事情。</p><p class="story-paragraph">此刻，在比刚才更响亮的雷声中，知珉再次低下了头。这份喧嚣和不祥的声响，听几遍都听不惯。</p><p class="story-paragraph dialogue">「是因为害怕打雷吗？」</p><p class="story-paragraph dialogue">「不是害怕，是因为声音太大」</p><p class="story-paragraph dialogue">「没有那么大吧？也没什么，这么这么容易吓到呢」</p><p class="story-paragraph">令人感到委屈的话进到耳里。对你来说是没什么，但谁想像这样每次都吓一跳呢。知珉只在心里发牢骚，见她半天撑不起雨伞，不停摆弄着按钮的背影。那雨伞像主人一样小小的，外观虽然可爱，但要穿越这严峻的大雨，却显得过于脆弱。</p><p class="story-paragraph dialogue">「怎么了？打不开吗？」</p><p class="story-paragraph">旼炡慌张地摇摇头说。不久前还能用的，不知道为什么会这样。只见她用力一推，伞架随着喀哒一声被撑开，但是难得的可爱的雨伞，看来已经无法再发挥功能了。</p><p class="story-paragraph dialogue">「怎么可以那么用力地推开呢？都坏了」</p><p class="story-paragraph dialogue">「...这个现在都收不起来了啊？完蛋了」</p><p class="story-paragraph dialogue">「就直接扔了吧」</p><p class="story-paragraph">怪不得从早上起就觉得不对。这不就是某种不祥的征兆吗？</p><p class="story-paragraph">旼炡啊，你怎么这么邋里邋遢的，竟然从家里带故障的雨伞出门吗？至少确认一下有没有坏再带吧。唠叨了一阵，旼炡则说谁知道今天雨伞会故障嘛。不管怎样，知珉的雨伞还能够供两人使用，是不幸中的大幸。知珉打开黑色长雨伞向旼炡伸出了手。</p><p class="story-paragraph dialogue">「快进来」</p><p class="story-paragraph dialogue">「...可以一起撑吗？」</p><p class="story-paragraph dialogue">「不然能让你一个人淋雨？」</p><p class="story-paragraph">没办法了，只能跟姐姐一起。旼炡又笑嘻嘻地钻进怀中，把胳膊紧紧地环绕在腰上。一只手撑着伞，一只手拿行李，再加上身上意外多了一个略显沉重的动物，知珉叹了口气。她甚至脸不停往自己身上钻，这样能正常走路吗。</p><p class="story-paragraph dialogue">「...什么呀，那么喜欢吗？」</p><p class="story-paragraph dialogue">「嗯，现在出发吧」</p><p class="story-paragraph dialogue">「姐姐因为你倒是从早上开始就手忙脚乱...真是的」</p><p class="story-paragraph dialogue">「不过你不觉得不方便吗？要不要我来拿行李箱？」</p><p class="story-paragraph dialogue">「没关系，这个你来拿很重的」</p><p class="story-paragraph dialogue">「要不我撑伞怎么样？」</p><p class="story-paragraph dialogue">「...那我的头会一直撞到吧」</p><p class="story-paragraph dialogue">「我们身高没差那么多好吗？」</p><p class="story-paragraph dialogue">「不了，我自己拿吧。小个子就安静点」</p><p class="story-paragraph dialogue">「我没想象中那么小的」</p><p class="story-paragraph dialogue">「知道了知道了。已经迟了，快走吧」</p><p class="story-paragraph">但即使两人紧挨在一把伞内，也无法阻止暴雨顺着风向飘进伞中。每当旼炡裹得严严实实的围巾和脸蛋被雨滴沾上时，她都会微微眯一下眼睛。自己的左肩已经淋湿，旼炡的右肩也逃不过。反正只撑一把伞，要躲过这倾盆大雨是不可能的。衣服啊，今天晚上洗就行呗。知珉直接把雨伞倒向旼炡，在雨中行走。</p><p class="story-paragraph">随着不快指数上升，机场也比平时更加繁忙。刚把雨伞收起来，水珠就哗哗落在地上。旼炡啊，你在这看一下行李吧。知珉想尽快消除身上的不适感，放下行李走向化妆室。</p><p class="story-paragraph">在明亮的灯光下，自己完全像是淋了雨的小老鼠。盥洗台一侧有个妈妈和小孩，貌似也被雨淋过，哼哼唧唧地哭闹着。在暴风雨肆虐的日子，雨伞似乎也无济于事。知珉看着亲密的外国家庭，站在一旁的空盥洗台前，擦干衣服上的雨水。没过多久，就从镜子里看见旼炡，她正吃力地拖着两人份的行李进来。让你看着行李，真是的，这一会儿都忍不住。</p><p class="story-paragraph dialogue">「姐姐的衣服怎么湿了这么多？」</p><p class="story-paragraph dialogue">「嗯？没关系」</p><p class="story-paragraph dialogue">「明明一起撑伞的，为什么只有我没事呢？连头发都湿了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「如果伞没坏掉，就不会害姐姐淋到雨了，对不起」</p><p class="story-paragraph dialogue">「没事的，头发很快就会干…」</p><p class="story-paragraph dialogue">「那还是会冷啊」</p><p class="story-paragraph dialogue">「反正这是你的衣服」</p><p class="story-paragraph dialogue">「是啊，这么一想...是我的衣服啊？」</p><p class="story-paragraph dialogue">「别担心，今天到家一定会帮你洗的」</p><p class="story-paragraph dialogue">「...衣服可以慢慢来，看下这边」</p><p class="story-paragraph">旼炡拿出纸巾，一点一点替自己擦去脸上的水滴。她的手小心翼翼地轻碰脸庞，非常痒。抬起头，专注的目光近得几乎快触碰到彼此。要再一会吗？快擦完了。耳边的轻声呢喃，让人心情很微妙。</p><p class="story-paragraph dialogue">「...干嘛盯着我看？」</p><p class="story-paragraph dialogue">「金旼炡今天有点奇怪啊」</p><p class="story-paragraph dialogue">「有什么奇怪的」</p><p class="story-paragraph dialogue">「怎么这么乖呢？今天格外」</p><p class="story-paragraph dialogue">「我很乖吗？」</p><p class="story-paragraph dialogue">「嗯、除了弄坏雨伞以外...从刚才开始就一直在做讨人喜欢的事情」</p><p class="story-paragraph dialogue">「什么啊，那你什么时候有不满意吗？」</p><p class="story-paragraph">每次都胡言乱语今天也消停了，照这样下去，旼炡今天不会被打后背了吧？自己一边笑一边说，帮忙擦脸的手却慢慢停了下来。只见旼炡皱着眉头，厌恶地往后退缩。</p><p class="story-paragraph dialogue">「...姐姐的喜好好像有点奇怪」</p><p class="story-paragraph dialogue">「我的喜好怎么了？」</p><p class="story-paragraph dialogue">「为什么这么喜欢打我？简直像变态一样」</p><p class="story-paragraph dialogue">「...真是没有什么话说不出口啊你」</p><p class="story-paragraph">这句话说出口的同时，打了今天第一下后背。一开口就知道会这样，早知道不必表扬了。突然在洗手间里啪嗒一声，令一旁的外国家庭吓了一跳，看着这边嘀咕着什么。有点尴尬，知珉干咳了一声。</p><p class="story-paragraph dialogue">「为什么又打我？」</p><p class="story-paragraph dialogue">「因为做了欠打的事」</p><p class="story-paragraph dialogue">「姐姐突然很真挚地生气，看起来倒是更奇怪，我只是开个玩笑而已」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不会真的有那种癖好吧？」</p><p class="story-paragraph">最后，话多的小狗被知珉抓住后颈，用力连打了三下后背。疼！洪亮的声音回荡在洗手间。此次发言已经超过忍耐极限，所以虽然疼，但也没有想放过她。</p><p class="story-paragraph dialogue">「今天为什么这么用力？」</p><p class="story-paragraph dialogue">「因为下定决心要打你」</p><p class="story-paragraph dialogue">「...太过分了」</p><p class="story-paragraph dialogue">「一点都不过分」</p><p class="story-paragraph dialogue">「我经常淤青的。如果淤青的话，你要负责吗？」</p><p class="story-paragraph dialogue">「就被打了几下而已，干嘛这么嚷嚷呢，旼炡啊」</p><p class="story-paragraph dialogue">「不是几下而已，是用全力被打了四下好吗？」</p><p class="story-paragraph dialogue">「旁边的人都在看我们，小声点」</p><p class="story-paragraph">两个人吵了半天，一旁的外国家庭不知道是做完该做的事，还是受不了她们的吵闹，急忙离开洗手间。随后，旼炡环顾了变得安静的四周，说了句没人了呢，然后嘻嘻笑着，接着嘟起嘴来。</p><p class="story-paragraph dialogue">「突然？在这里？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「在人来人往的地方干嘛呢？」</p><p class="story-paragraph">反正现在什么人都没有，我被雨淋到了很伤心，如果不给我的话真的会生气的。旼炡以半挑逗半威胁的口吻，不断接近。不知怎么搞的，脑袋嗡嗡作响。刚才还依恋地帮自己擦脸的乖孩子去哪儿了，现在镜子中看见的，是一个坏孩子在要亲亲。</p><p class="story-paragraph dialogue">「...你生气了会怎么样？」</p><p class="story-paragraph dialogue">「一整天都不和姐姐说话」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「快点」</p><p class="story-paragraph">知珉无奈地捧起旼炡的脸颊，轻轻地吻了一下。对此，旼炡神情惊慌，表情像是受到背叛。即使不说话，瞪得圆圆的眼睛也看得出她内心所想。这就结束了？接下来呢？</p><p class="story-paragraph dialogue">「接下来的，如果你像刚才那样做讨人喜欢的事情，我会考虑的」</p><p class="story-paragraph dialogue">「哪有那样的？」</p><p class="story-paragraph dialogue">「我说的算啊？」</p><p class="story-paragraph dialogue">「…太坏了」</p><p class="story-paragraph">快走吧。知珉微笑着与她对视，强行转过旼炡为亲亲而贴上来的肩膀。一会儿工夫，外衣上的雨水大概都干了。不知不觉已经到了乘坐飞机前往奥斯陆的时间。</p><p class="story-paragraph">听到广播后，知珉和旼炡一起走向登机门。但是等待搭乘的是令人困惑的小型 -像直升机一样的- 迷你客机。两人面对乘客数约30人左右的、像玩具一样的飞机，面面相觑，接着进入机舱。</p><p class="story-paragraph dialogue">「机票上...有座位号吗？我的没有号码」</p><p class="story-paragraph dialogue">「对欸，我的也是。怎么没有标示呢？」</p><p class="story-paragraph">飞机内部走道狭窄得只能供一名乘客行走，人们乱哄哄地向乘务员询问座位，只见他们笑着回答说是自由座，坐在想坐的地方就可以了。没有规定的体系才更令人不安。知珉踌躇着在前面的空位上找了个位置坐下。虽然已经预想到了，但座位实在非常狭窄，双腿都很难向两侧移动，让人非常压抑。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「我不确定是不是只有我有这种想法...」</p><p class="story-paragraph dialogue">「...我也有同样的想法」</p><p class="story-paragraph dialogue">「我们搭这个真的没关系吗？」</p><p class="story-paragraph dialogue">「那能怎么办？都已经搭上来了」</p><p class="story-paragraph dialogue">「我们到目的地要坐几个小时？」</p><p class="story-paragraph dialogue">「很短，大概1个小时吧。实际飞行时间30分钟左右？」</p><p class="story-paragraph dialogue">「30分...」</p><p class="story-paragraph dialogue">「不知道是不是心理作用，这飞机看起来也是旧式的...」</p><p class="story-paragraph dialogue">「不要太注意观察这些。不吉利」</p><p class="story-paragraph">这时一阵闪光照进飞机窗户，坐在窗边的旼炡吓得眨了下眼睛，没过多久，连飞机内也清晰听见知珉讨厌的轰鸣声。旼炡望着被雨点打湿而看不清的窗外说道。偏偏天气这么阴沉沉的，不知道行不行。</p><p class="story-paragraph dialogue">「…旼炡啊，我拜托你一件事」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「飞机起飞的时候握住姐姐的手」</p><p class="story-paragraph dialogue">「...手？怎么了？」</p><p class="story-paragraph dialogue">「我第一次搭这么小的飞机，感觉很不安」</p><p class="story-paragraph dialogue">「怎么突然这么紧张？害怕吗？」</p><p class="story-paragraph dialogue">「有点」</p><p class="story-paragraph dialogue">「好像不是有点啊？」</p><p class="story-paragraph dialogue">「...有点多」</p><p class="story-paragraph dialogue">「好吧知道了，一会儿牵着手吧」</p><p class="story-paragraph">随即，乘务员集中了大家的注意，开始起飞前义务性的安全教育。虽然这辈子还没有仔细听过，但是现在包括自己在内，所有需要将人身安全托付给这架小飞机的人，都在以超强的专注力聆听。因为今天只要稍有不慎，就会成为和生死存亡直接相关的问题。虽然千万别发生那种事才好。</p><p class="story-paragraph dialogue">「…你从有生以来，穿过救生衣吗？」</p><p class="story-paragraph dialogue">「没有啊」</p><p class="story-paragraph dialogue">「我也是」</p><p class="story-paragraph dialogue">「不要太担心。不会有什么事吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...如果一定要坠落，希望不要掉进海里」</p><p class="story-paragraph dialogue">「不是，是不能掉下去。绝对不行」</p><p class="story-paragraph dialogue">「姐姐不是说过自己游泳游得很好吗？」</p><p class="story-paragraph dialogue">「如果在这天气掉下去还谈什么游泳...不会死吗？只能在冰水上浮着而已」</p><p class="story-paragraph dialogue">「那活的机率也比我高吧」</p><p class="story-paragraph">知珉闭着眼睛，为了摆脱恐惧，不停碎念。而且直到现在才领悟到，刚才选的位置就在螺旋桨旁边。当飞机开始前进，各种机械运转的声音全冲进自己耳里。正如旼炡所言，这架小型客机绝对是老旧的机型。到底是哪年制造的涡轮发动机呢？如果说得夸张点，简直像身旁好几辆摩托车，声音的震度就像在耳膜边上响起。嘟嘟嘟，在螺旋桨正式划破天际的瞬间，知珉反射性堵住了耳朵。</p><p class="story-paragraph">坐飞机让原本就敏感的耳朵变得更加敏感。就像现在，飞机飞上天空导致气压下降的时候，对知珉来说是相当痛苦的。成年之后，可能是症状有所缓解，也可能已经适应了，还算能享受飞行。但飞机起降的瞬间，心脏仍会忐忑不安的跳动。更何况，这螺旋桨轰鸣声震耳欲聋，对于原本就很敏感的知珉来说，实在难以忍受。旼炡在一旁说了些什么，但现在紧张得完全听不见。</p><p class="story-paragraph dialogue">「姐姐，不是说要牵手吗？」</p><p class="story-paragraph dialogue">「什么？我听不见」</p><p class="story-paragraph dialogue">「我的手，姐姐，不是说要牵着吗？」</p><p class="story-paragraph">虽然旼炡不断大声喊出简短的单词，但知珉却皱着眉头，似乎是想阻断螺旋桨发出的噪音，将耳朵用力堵住。两人要沟通并不容易。</p><p class="story-paragraph dialogue">「耳朵要炸了，我想直接下飞机」</p><p class="story-paragraph dialogue">「知珉姐姐，从刚才开始就很闹...」</p><p class="story-paragraph dialogue">「嗯？什么？」</p><p class="story-paragraph dialogue">「...刘知珉胆小鬼」</p><p class="story-paragraph dialogue">「旼炡啊，都说听不清了。如果不是急事，过会儿再说吧」</p><p class="story-paragraph dialogue">「姐姐现在简直像个傻瓜」</p><p class="story-paragraph">虽然完全听不见，但旼炡却非常开心地嘻嘻笑着。然而知珉的紧张和焦虑达到了极点，刚才被雨淋湿的头发，现在都出汗了。</p><p class="story-paragraph">轰隆一声，飞机终于轻快地升起。瞬间，知珉紧紧握住旼炡的手，机上的视野渐渐远离地面。姐姐，没事吗？旼炡问道，但自己实在回答不了。因为才刚上升到一定高度的飞机，突然又急速下降。狭窄的机身左右摇晃，乘客们的身体也跟着剧烈晃动，惊呼声从四面八方传来。实际上，两人就像被迫乘坐了一个小时的过山车。</p><p class="story-paragraph">知珉在心底虔诚地祈祷。几乎面临昏厥的自己与坐在身旁的游乐设施高手旼炡，两人形成了鲜明的对比。在这种情况下，旼炡依然生机勃勃，喋喋不休。天啊，这摇晃真不是闹着玩的，这样下去连厕所都去不了吧，幸好刚才提前去过了。连发火的余力都没有，知珉心里暗暗下定决心一定要报仇。虽然明白你不害怕，但是不是太兴奋了？不管旁边的人要死不活，独自开心的臭小狗金旼炡。等着瞧，只要活着踏上挪威的土地，绝对不会放过你。</p><p class="story-paragraph">这简直是刘知珉的受难时代。飞机像垂直下降前的过山车不停晃动，螺旋桨的声音振聋发聩，加上外面电闪雷鸣，坐在身旁的小狗雀跃不已…</p><p class="story-paragraph dialogue">「…你为什么这么开心？不害怕吗？」</p><p class="story-paragraph dialogue">「我本来就很喜欢坐过山车。搭哈士奇雪橇的时候也说过」</p><p class="story-paragraph dialogue">「但现在处于非常状态啊」</p><p class="story-paragraph dialogue">「怎么一直觉得要死啊。就算如此，不但有乘务员，也有救生衣，姐姐还会游泳...」</p><p class="story-paragraph dialogue">「旼炡啊，我的手、牵一下我的手」</p><p class="story-paragraph">红色的警示灯提醒乘客不要从座位上起身，这令大家十分不安。虽然已经系紧安全带，依旧无法阻止身体向上漂移。好险早餐没吃得太饱，这算不幸中的大幸吗？机身又开始剧烈地上下晃动，知珉用力握住了旼炡的手。</p><p class="story-paragraph dialogue">「啊好疼、姐姐，我手好疼，抓得太紧了」</p><p class="story-paragraph dialogue">「抱歉，对不起」</p><p class="story-paragraph">在这种情况下，只能一边乖乖道歉，一边绝对不放手看着搭档，旼炡无语般笑了起来。汗怎么流得这么厉害，放松点，好好牵住手。她脸上虽是无可奈何的表情，依然紧握住自己的手，十指紧扣。</p><p class="story-paragraph dialogue">「既然如此，就当是坐游乐设施吧」</p><p class="story-paragraph dialogue">「我根本不玩可怕的游乐设施…」</p><p class="story-paragraph dialogue">「真的吗？那姐姐去游乐园都干什么？」</p><p class="story-paragraph dialogue">「就是... 坐旋转木马之类的」</p><p class="story-paragraph dialogue">「真没意思，不能一起去游乐园了」</p><p class="story-paragraph dialogue">「...我也没要跟你一起去啊？」</p><p class="story-paragraph">遭到拒绝的旼炡发出“哼”的一声。强调是自己先说不能一起去的。总之，知珉现在得安抚一下旼炡。毕竟在到达奥斯陆之前，依靠的不是救生绳，而是这只细嫩的手。</p><p class="story-paragraph dialogue">「旼炡啊，除了游乐设施之外，没有其他有用的想象吗？比如催眠」</p><p class="story-paragraph dialogue">「那就当是做梦吧」</p><p class="story-paragraph dialogue">「梦？」</p><p class="story-paragraph dialogue">「嗯，现在的梦是乘坐这架飞机」</p><p class="story-paragraph dialogue">「那从梦中醒来会怎么样？」</p><p class="story-paragraph dialogue">「醒来的话...就到姐姐的家了」</p><p class="story-paragraph">那是什么意思，我家？</p><p class="story-paragraph">随着旼炡所言，知珉想起了自己首尔房间的景象，以及每天躺着的床。这是梦，睁开眼睛就到家了？是不是太突然了？现在根本还不想回韩国。虽然更不想在挪威茫茫大海中死去。知珉就像真的陷入催眠的人一样，闭着双眼近乎哽咽地说。</p><p class="story-paragraph dialogue">「…我不想去」</p><p class="story-paragraph dialogue">「...嗯？」</p><p class="story-paragraph dialogue">「不想去韩国」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还想再去旅行...」</p><p class="story-paragraph dialogue">「怎么要哭了？」</p><p class="story-paragraph dialogue">「你这样问还怎么催眠啊」</p><p class="story-paragraph dialogue">「总之，姐姐比起回家，和我在一起看来更好是吧」</p><p class="story-paragraph">她心情很好似地呵呵笑了起来。但电光依然从窗外闪烁着，旼炡放下窗户的卷帘，接着抚上自己的手背问道。晃动比刚才小了不少，没事吧？还是很害怕吗？</p><p class="story-paragraph dialogue">「害怕是害怕，但就是今天实在太糟糕了...」</p><p class="story-paragraph dialogue">「那么从现在开始和我聊天吧。聊聊跟天气和飞机没有关系的话题，这样就不会那么害怕了」</p><p class="story-paragraph dialogue">「...知道了」</p><p class="story-paragraph dialogue">「但是不能像平时那样不集中精神，老是转移话题」</p><p class="story-paragraph dialogue">「就说知道了」</p><p class="story-paragraph">旼炡真的想到什么就问什么。姐姐上学有意思吗？学校有乐团吗？平时在家都在做什么？都是煮饭吃还是点外卖吃？</p><p class="story-paragraph">边思考着边回答后，被自己遗忘的韩国生活又浮现在脑中。已经好几周没人踏进的单色调房间，化妆台上没整理好的口红。走进家附近的星巴克，捧着一杯蜜桃冰茶，进教室前熟悉的上学路。嫌麻烦的时候做来吃的泡菜炒饭。还有大学庆典那天和同学们一起喝的那杯酒。</p><p class="story-paragraph">还没遇见金旼炡的刘知珉，所看到的那些琐碎的风景。</p><p class="story-paragraph dialogue">「姐姐在首尔一个人住吗？」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「那之后可以去你家玩吗？」</p><p class="story-paragraph">知珉根本无法想象待在自己房间的旼炡。即使在这里是24小时待在一起，时空背景回到韩国，旼炡不过是一个陌生人。知珉对日常生活中的旼炡仍然一无所知。</p><p class="story-paragraph">如果邀请她来家里的话，该一起做什么好呢。如果招待她时常挂在嘴边的锅包肉，会开心地享用吗？现在每天都裹得严严实实，如果随着季节变换，或许能看见你穿着完全不同的衣服。那时还会继续染着非常合适你的亮发色吗？</p><p class="story-paragraph">今天这个当下所感觉到的疲惫，</p><p class="story-paragraph">会成为有趣的小插曲之一吗？</p><p class="story-paragraph dialogue">「嗯？怎么不回答呢？问你可以出玩吗？」</p><p class="story-paragraph dialogue">「...知道了，我会邀请你」</p><p class="story-paragraph dialogue">「真的吗？那约定好了」</p><p class="story-paragraph">我所在的空间也有你在</p><p class="story-paragraph">虽然现在是理所当然。</p><p class="story-paragraph">等那时候你也会像现在这样调皮地笑着吗？</p><p class="story-paragraph dialogue">「但是，姐姐。从刚才开始就一直想说」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「可能今天特别像傻瓜，所以很可爱吧」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「说你可爱」</p><p class="story-paragraph">因一句毫无防备的话，热气立刻窜了上来。不知是螺旋桨的声音，还是从胸口发出的声音，总有什么在咚咚地响。明明今天上午还不是这种氛围，现在怎么变成这样了。</p><p class="story-paragraph">旼炡从刚才开始就好像要把自己盯穿，凝视着双眼。紧握的手虽然感觉很霸道，但总是扭动手背。知珉没有和她对视，只是噗嗤一笑。今天是什么日子啊，竟然能听到你说我可爱。</p><p class="story-paragraph dialogue">「不是开玩笑，真的很可爱」</p><p class="story-paragraph dialogue">「…让你别说了」</p><p class="story-paragraph dialogue">「怎么了？真的听到我说反而害羞了吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「好像真的很害羞，脸都红了」</p><p class="story-paragraph dialogue">「…算了，你现在可以放手了」</p><p class="story-paragraph dialogue">「不要，我不放」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我现在想做刚才没做完的」</p><p class="story-paragraph dialogue">「如果想挨打，就试试吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「干嘛那么看我」</p><p class="story-paragraph dialogue">「难道真的以为要在这里亲亲吗？我开玩笑的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">最后一句话莫名让人心情不好。当然不是真的有亲亲的想法。还有为什么刚才一直抚摸着我的手背，现在突然停下来了？让人没办法不在意。这个也是开玩笑，那个也是开玩笑。可以这样随时随地随便乱说，乱开玩笑吗？</p><p class="story-paragraph">突然，旼炡好像想起了什么。啊，对了！接着突然提高音量边说。那嗓门是相当大了，知珉不得不反射性地缩起肩膀。旼炡啊，把分贝调小一点...</p><p class="story-paragraph dialogue">「对不起，我的音量好像不知不觉又变大了」</p><p class="story-paragraph dialogue">「没事，我也有在努力熟悉大分贝，但不太行」</p><p class="story-paragraph dialogue">「现在不疼吗？刚才不是说耳朵要炸了嘛」</p><p class="story-paragraph dialogue">「...我有说吗？」</p><p class="story-paragraph dialogue">「嗯。早上听到雷声也吓了一跳，坐飞机的时候也会捂住耳朵。我还担心了呢」</p><p class="story-paragraph">应该很累吧，辛苦了。就快到了，再忍一下吧。就像早上帮自己擦拭被雨淋湿的脸，旼炡用非常亲暱的语气传达着安慰的话。是刚才说如果一直做讨人喜欢的事情会给你亲亲，所以才这样吗？但不管理由为何，心情飘飘然的感觉并不坏。其实，心里很想紧紧抱住讨人喜欢的小狗，或许是因为才听见她说自己可爱，到现在依然无法与她四目相对。</p><p class="story-paragraph dialogue">「嗯，现在不那么疼了」</p><p class="story-paragraph dialogue">「真是太好了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是... 听我的声音也会耳朵疼吗？」</p><p class="story-paragraph">看她嘴一张一合地嘟囔着什么，心里似乎很在意说话声音偶尔会吓到自己。没错，旼炡啊。其实你的声音就像生吞了火车头一样大声，如果就照这样说，一定会非常生气吧。到底该不该说实话呢。</p><p class="story-paragraph dialogue">「偶尔...？」</p><p class="story-paragraph dialogue">「好像不是偶尔啊？可以说实话」</p><p class="story-paragraph dialogue">「你兴奋的时候变得非常大声。一天大概会出现三次...」</p><p class="story-paragraph">是说的太直白了吗？对于具体的证言，旼炡似乎受到了一些伤害，脸上表情不太高兴。我的声音有那么大啊，甚至刺痛姐姐耳朵的程度...</p><p class="story-paragraph dialogue">「你的声音就是比较大，能怎么办？我比别人更容易吓到这点也没办法改变啊...」</p><p class="story-paragraph dialogue">「那现在开始我会小心，尽量不要让声音太大」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「歌也会少唱点...也不会再用嘴发出哒哒声...」</p><p class="story-paragraph">知珉拍了拍变得无精打采的旼炡。今天不是因为你才耳朵疼的，比起小声、嗓门大些更好，我们旼炡的声音很清脆、很动听，只要晚上稍微安静一点的话，姐姐会特别喜欢的。</p><p class="story-paragraph">在两人的交谈中，飞机克服了恶劣的天候，缓缓在空中飞翔。机组人员连忙为乘客提供零食和饮用水，也有足够的时间去厕所。飞机在奥斯陆上空飞行了整整30分钟，才慢慢降低速度，朝陆地降落。</p><p class="story-paragraph">结果，没有发生因意外事故而坠落的事情。飞机轮子着地后，知珉才放松警惕，紧绷的腰部得以缓解。乘客的心情似乎都是一样的，大家都松了一口气。在这种情况下，只有旼炡一个人精力充沛，一边用手指开着玩笑，一边开心地说。这一小时真有趣、对吧？</p><p class="story-paragraph dialogue">「只有你觉得有趣吧，别人都在经历生死存亡」</p><p class="story-paragraph dialogue">「姐姐，以后一定要去坐过山车。在旁边看着你太有意思了」</p><p class="story-paragraph dialogue">「就算给我钱也不坐」</p><p class="story-paragraph dialogue">「说真的坐一次可能会爱上的」</p><p class="story-paragraph dialogue">「...旼炡啊，现在可以放开手了吗？」</p><p class="story-paragraph dialogue">「现在是姐姐握得更紧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还要再抓一会儿吗？可以直到下飞机为止」</p><p class="story-paragraph dialogue">「...这样吗？」</p><p class="story-paragraph dialogue">「希望刘知珉今天能一直这么傻」</p><p class="story-paragraph dialogue">「吵死了」</p><p class="story-paragraph">她调皮地取笑着我的表情，真让人讨厌。但是现在不能像平时那样打她，只能安静地待着。憋了一段时间的手正在一点点出汗，但这并不是像刚才淋雨时那样让人心情不好的湿度。</p><p class="story-paragraph">不知不觉间，耳朵的疼痛自然而然消失了。</p></div>

        <div class="chapter-copy"><div class="location-badge"><strong>N O R W A Y : O S L O</strong><span>挪威 ：奥斯陆</span></div><p class="story-paragraph">今天开始，两人住的不是酒店而是公寓。没有什么特别的理由，只是旼炡说奥斯陆没找到便宜的酒店，所以选择了Airbnb。尽管如此，挪威的家庭住宅比至今为止的酒店都更宽敞舒适。从客厅、浴室到厨房都贴满了如同新家一般干净的白色壁纸，阳台虽窄但还算舒适，可以一览市内风景。从上午就升起的彩虹，依然在天上描绘清晰的轨迹。</p><p class="story-paragraph">旼炡啊，你在哪？不想错过难得放晴的天气，知珉呼唤了旼炡。我在阳台上。知珉径直走向她说话的地方。</p><p class="story-paragraph dialogue">「你在看什么？」</p><p class="story-paragraph dialogue">「没什么，就想看看外面有什么」</p><p class="story-paragraph">哪里有漂亮的地方吗？当自己靠近她的背并张开双臂时，那圆圆的后脑勺似乎吓了一跳、转过来看自己。</p><p class="story-paragraph dialogue">「那边一直在画着壁画，所以我正在看」</p><p class="story-paragraph dialogue">「人貌似很多，看来是在举办什么活动呢。我们去看看吧？」</p><p class="story-paragraph dialogue">「好」</p><p class="story-paragraph">但旼炡只是回答没有行动，又待在原地站了几分钟。知珉用下巴压住她圆圆的肩膀，缠着自己慢吞吞的室友。</p><p class="story-paragraph dialogue">「还没准备好吗？天气已经放晴了，现在就出门吧」</p><p class="story-paragraph dialogue">「我还在充AirPods，再等一会儿」</p><p class="story-paragraph">歌以后再听嘛，嗯？雨停的时候不想出去散步吗？用下巴再压了一下肩膀，就听见她说“好痛”。怎么不管做什么都疼，自己只是稍微催促一下而已。</p><p class="story-paragraph dialogue">「姐姐真的是用尽各种方法让人疼。 是想受到关注吗？」</p><p class="story-paragraph dialogue">「因为你都没动，觉得无聊所以才用力压的」</p><p class="story-paragraph dialogue">「我真的很怀疑你的喜好...」</p><p class="story-paragraph dialogue">「嗯？你说什么了？」</p><p class="story-paragraph dialogue">「不是啊，又不是猫，为什么要对我使劲」</p><p class="story-paragraph">知珉不敢反驳她的说法。最近只要看见旼炡的背影，就会去拥抱她，像习惯一样已经习以为常。看着她软绵绵的皮肤，总有想用力按压的冲动。蓬蓬的脸蛋，细嫩的手臂，雪白的手背，圆润的肩膀，不管哪个部位都想。</p><p class="story-paragraph dialogue">「本来下巴就没肉，尖尖的」</p><p class="story-paragraph dialogue">「我的下巴那么尖吗？」</p><p class="story-paragraph">果然是因为下颚线，给人冷酷的感觉吗？知珉摸着自己的脸，旼炡好像被压得受不了似的，耸了耸肩膀。</p><p class="story-paragraph dialogue">「姐姐不仅脸蛋长得神奇，全身都长得神奇」</p><p class="story-paragraph dialogue">「...旼炡啊，这算是称赞还是骂人？」</p><p class="story-paragraph dialogue">「我以为个子高的人手脚会比较大。结果个子这么高，手掌倒是像枫叶一样，脚掌也特别小」</p><p class="story-paragraph dialogue">「我的手不小啊」</p><p class="story-paragraph dialogue">「谁来看都觉得小好吗」</p><p class="story-paragraph">知珉摊开脸蛋一样大的手。枫叶...就算只是比喻也…枫叶？自尊心受到打击的知珉，下巴更用力地压住旼炡的另一边肩膀，就像是无言的示威一样。</p><p class="story-paragraph dialogue">「让你别压了」</p><p class="story-paragraph dialogue">「你明明说疼，怎么完全不躲开，还老老实实待着」</p><p class="story-paragraph dialogue">「...现在做贼的喊捉贼了？真是厚脸皮」</p><p class="story-paragraph">滴。额头上掉下一滴雨，手背上也接连滴滴答答落下来。不知不觉间，乌云从远处飘来。以为天空放晴了，没想到又变得灰茫茫一片。知珉难过地拽住旼炡的脸颊说道。</p><p class="story-paragraph dialogue">「你看，都是你慢吞吞的，现在又下雨了」</p><p class="story-paragraph dialogue">「是啊，都是我的错，只能抱歉了呢」</p><p class="story-paragraph">停滞的乌云讨厌地遮住了太阳，细雨反复地下，刚刚的彩虹已经被藏进云里不见踪影。知珉怀着遗憾的心情，手上拿着雨伞走出大门。</p><p class="story-paragraph">两人径直走向了刚才看到华丽的壁画街所在之处。位于奥斯陆北部，被称为葛鲁尼洛卡(Grunerlokka)的地区，每到周末就会有贩卖手工艺品的自由市集。沿着狭窄的河岸，有氛围独特的Live House，周围的老旧建筑上画着形形色色的涂鸦。让人联想起弘大和梨泰院小巷内的艺术街。</p><p class="story-paragraph">两个人在壁画前拍了几张照，悠哉地逛起市集。但实际来到这里后才发现，参观一圈根本不用10分钟，规模非常小。知珉为了避雨走进白色帐篷下。两侧长长的摊位上罗列着皮夹、明信片、贴纸等小商品。</p><p class="story-paragraph">这时，目光被一套明信片所吸引。大概交通卡大小的明信片上，画着可爱的北极动物的插图。游泳的北极熊、爬到树上的狐狸、在雪地上摇摇摆摆的企鹅等。所有的画都很喜欢，但其中最想要的一幅，是看着夜空中极光的北极狐。恰巧，画中狐狸的脸圆滚滚的，长得特别像某人，不自觉笑了出来。这里怎么会有这么多长得像金旼炡小小白白的动物呢？还是因为只有那些东西能吸引我呢。</p><p class="story-paragraph">二话不说买下手中的明信片后，旼炡早已消失在视线当中。一转头，正好看到对面摊位前熟悉的后脑勺。弯着腰的旼炡似乎专注地看着什么。在赫尔辛基逛服饰店时，对衣服毫无兴趣的孩子，今天在挑什么呢？知珉走到她旁边探头。旼炡啊，在看什么？有喜欢的吗？</p><p class="story-paragraph dialogue">「这个很漂亮吧？」</p><p class="story-paragraph">旼炡手里拿着一个细细的戒指，上面镶着银色的小十字架，看起来只是点缀用的装饰，并不是祈祷时用于旋转的默珠戒指。不过，和自己的食指上的戒指，乍看的确有些相似。</p><p class="story-paragraph dialogue">「但你也不是基督徒」</p><p class="story-paragraph dialogue">「十字架本身就挺漂亮的嘛」</p><p class="story-paragraph dialogue">「很喜欢吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「...那我给你买这个吧」</p><p class="story-paragraph dialogue">「姐姐吗？为什么？」</p><p class="story-paragraph dialogue">「只是想送你而已。你每次都必须问理由吗？」</p><p class="story-paragraph">戒指的价格是150克朗，换算下来大概是2万韩元左右。考虑到挪威昂贵的物价，这个价格并不高。知珉在旼炡拒绝前，赶紧掏出钱包买下礼物。包里堆满了再无用武之地的瑞典纸币。</p><p class="story-paragraph">虽然北欧的现金使用率很低，但一直持卡消费还是令人不安。因此，知珉慢慢开始随身携带现金。北欧除了芬兰使用欧元外，其他国家使用的货币名称相当相似。例如，在瑞典和挪威的货币都称为克朗，但相同的也只是名称，货币不能通用，所以每次移动到别的国家时，都必须更换货币。</p><p class="story-paragraph">总之，知珉好不容易发现了夹在钱包角落的挪威纸币，递给了店员。旼炡把戒指戴在食指上，手掌翻来复去。我的手指算比较细的，这个尺寸刚好合适呢。</p><p class="story-paragraph dialogue">「好好戴着，知道了吧？如果弄丢会被我骂的」</p><p class="story-paragraph dialogue">「怎么可能那么容易弄丢呢？」</p><p class="story-paragraph dialogue">「…这回答感觉不太靠谱。你明明不爱戴饰品之类的」</p><p class="story-paragraph dialogue">「怎么一买就先假定我会弄丢呢？不过，姐姐没有什么喜欢的吗？」</p><p class="story-paragraph dialogue">「我刚刚已经买了一个」</p><p class="story-paragraph dialogue">「这么快？买了什么？」</p><p class="story-paragraph dialogue">「秘密」</p><p class="story-paragraph dialogue">「为什么是秘密？告诉我嘛，是什么？」</p><p class="story-paragraph">知珉向旼炡炫耀一般，摆弄着画有动物的明信片。这个很可爱吧，是不是很有北欧的味道？但真的展示后，旼炡对明信片却毫无关心，忙着询问知珉有没有想买的东西。</p><p class="story-paragraph dialogue">「是很可爱，但是除了这个再选一个吧，我也给你买一个」</p><p class="story-paragraph dialogue">「真的没什么了」</p><p class="story-paragraph dialogue">「不晓得什么时候才能再这样逛市集了，我们再转一圈吧」</p><p class="story-paragraph dialogue">「真的没关系，不用非得给我买」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…那等会儿你给我买杯咖啡，行了吧？」</p><p class="story-paragraph dialogue">「知道了」</p><p class="story-paragraph">离开了涂鸦街的自由市集，知珉为了兑换货币来到了附近的银行。在窗口的中年银行职员面无表情地启动纸币计数器，并出示了兑换明细，要求签名。计数器轰隆隆运作，但旼炡什么话也没说，只是端详着刚买的十字架戒指。</p><p class="story-paragraph dialogue">「旼炡啊，你不用换钱吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「好不容易才有银行，怎么不换成挪威币呢？现在瑞典的钱都用不到了」</p><p class="story-paragraph dialogue">「都说不用了，因为有从韩国带来，所以没问题」</p><p class="story-paragraph dialogue">「你带了多少钱？」</p><p class="story-paragraph dialogue">「多少钱来着？1000克朗左右？」</p><p class="story-paragraph">1000克朗仅有14万韩元左右。但剩下两天就够用了，知珉没有再多问，而是拿着换好的钱离开银行。</p><p class="story-paragraph">没走多久，街道上就飘来了彷彿刚烘焙好的咖啡豆香。出乎意料的是，挪威人咖啡喝得很多，但比起国际连锁品牌，当地品牌的地位十分稳固，眼前的大咖啡厅就是其中之一。两人决定在这里解决午餐，两人点了失败率较小的奶油意大利面和三明治。</p><p class="story-paragraph">食物味道虽然不至于惊艳，但还是不错。 其实比起主餐，咖啡更令人期待。刚才在外面闻到了咖啡香气，现在既然来到了当地咖啡厅，就想挑战一下，知珉决定点一杯推荐品项。菜单最上方写着“Dagens Kaffe”，这是北欧文化圈中“今日咖啡”的意思。</p><p class="story-paragraph dialogue">「你要喝什么？我要喝今日咖啡」</p><p class="story-paragraph dialogue">「真反常，姐姐不点美式咖啡吗？」</p><p class="story-paragraph dialogue">「嗯，这个咖啡好像很有名，所以想喝喝看」</p><p class="story-paragraph dialogue">「…是吗？那我也要喝今日咖啡」</p><p class="story-paragraph">点完餐后，两人在咖啡做好前参观了墙壁上展示的旧型咖啡机。像在实验室中出现的机器，从沙漏模样的萃取器中，会以一定的间隔提炼出咖啡。知珉转动了一下砂轮手柄，发出嗒嗒声。旼炡随即靠近，也转动了手柄。</p><p class="story-paragraph dialogue">「旼炡啊，你从刚才开始就一直在学我」</p><p class="story-paragraph dialogue">「我哪有」</p><p class="story-paragraph dialogue">「戒指也和我买差不多的，咖啡也点一样的，我做什么就跟在旁边一起做」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「怎么总是模彷我。真的像小鸟宝宝一样」</p><p class="story-paragraph dialogue">「小鸟宝宝？」</p><p class="story-paragraph dialogue">「是啊，你就那么喜欢我吗？」</p><p class="story-paragraph dialogue">「...不是学你做的，我偶尔也会喝美式咖啡，然后这是第一次看到才试试的」</p><p class="story-paragraph">嗯嗯嗯、嗯嗯嗯，你在说什么我听不见？知珉抓住这个机会一个劲地逗她。被戏弄的旼炡反倒发脾气说。是啊，我就是都模彷姐姐，你有什么不满吗？</p><p class="story-paragraph">不，没有不满啊，我也没说不要学我啊？知珉对此表示疑惑，但旼炡也同样表示怀疑。小鸟旼炡像是不愿放过任何鸟妈妈的一举一动，执拗地盯着自己。随着时间的流逝，这孩子的精神年龄怎么越来越小，这算是杞人忧天吗？</p><p class="story-paragraph dialogue">「...你三岁吗？真幼稚」</p><p class="story-paragraph dialogue">「鸟宝宝们本来不就是模彷着长大的吗？而且姐姐和我一样幼稚，所以别想抵赖」</p><p class="story-paragraph">然而金旼炡即使绞尽脑汁，也有什么是绝对做不到的。虽然试过几次，还是觉得逗弄她个子小的效果最好。知珉满面笑容对旼炡说。啊，希望有人在后面紧紧地抱住我就好了，紧紧拥入怀中。</p><p class="story-paragraph dialogue">「我来做吗？」</p><p class="story-paragraph dialogue">「你怎么有办法把我紧紧拥入怀里」</p><p class="story-paragraph">紧贴在背后的旼炡立刻用双臂环绕自己肩膀。但以知珉的立场来看，比起投入某人怀抱，感觉更像背上挂着一只树懒一样。</p><p class="story-paragraph dialogue">「...这样的话，你是不是要掉下去了？好像妈妈在背孩子」</p><p class="story-paragraph dialogue">「没办法。为什么今天偏偏穿了一双有跟的鞋呢？」</p><p class="story-paragraph dialogue">「今天特别想呼吸上面的空气」</p><p class="story-paragraph dialogue">「弯一下肩膀」</p><p class="story-paragraph dialogue">「我不要呢？」</p><p class="story-paragraph">知珉故意垫起脚尖往更高处，旼炡似乎是死心了，从背上猛地下来，开始发起牢骚。不做了、不做了、我不做了。</p><p class="story-paragraph">两人在咖啡馆的角落里吵吵闹闹，不知不觉间，两杯今日咖啡早已上桌。幸好没有比美式咖啡苦涩，所以可以喝得很顺。而同样喝了一口咖啡的旼炡如同预期，皱着脸说太苦了，把咖啡推向远处。知珉叹了口气，熟练地从包里拿出冰茶，递给旼炡。你点餐的时候我就知道会这样，是舍不得钱放口袋还是怎么的呢？以后别跟着我的口味点了。对此，旼炡到最后也不停嘟囔，顽固地抗议。不学了、现在也不跟在姐姐旁边了！</p><p class="story-paragraph">两人一边喝着咖啡，一边数了数刚换的钱，在桌上摆放各自钞票。只要想到写着“100”的单位就是13000韩元左右，手就不由自主颤抖。</p><p class="story-paragraph">挪威的100克朗纸币上画的是海盗船，200克朗的纸币上画得是令人啼笑皆非的一只鱼。看到这旼炡说，果然因为是鲑鱼的国家，所以被画在钱上吧。事实上，那条鱼不是鲑鱼，而是鳕鱼。但对于忙着数钱的两人来说，鲑鱼还是鳕鱼，完全不重要。最后，在最大单位1000克朗上的人，被她们推测是挪威的伟人。</p><p class="story-paragraph dialogue">「这是谁呢？挪威总统吗？」</p><p class="story-paragraph dialogue">「我也不知道」</p><p class="story-paragraph">看了纸钞后面的画，是艺术家吗？难道是画家吗？知珉突然想到，昨天搜寻奥斯陆的旅游景点中，有一家孟克美术馆。</p><p class="story-paragraph dialogue">「...孟克？」</p><p class="story-paragraph dialogue">「啊，好像没错。我想看那幅有名的画」</p><p class="story-paragraph dialogue">「是在说摸着脸尖叫的画吧？」</p><p class="story-paragraph dialogue">「嗯，对。呐喊，我特别喜欢那个，甚至可以画得一模一样」</p><p class="story-paragraph dialogue">「那要不要喝完咖啡去看看？应该离这里不远」</p><p class="story-paragraph dialogue">「好啊」</p><p class="story-paragraph">两人整整齐齐地将数额小的依序一张张放入钱包。但是，手在机械式移动的过程中，知珉锐利的双眼发现了非常奇怪的一点。即使想无视，但眼睛一扫过便无法忽视它了。知珉凭着不祥的直觉，急忙拿出钱包里的钱边说道。旼炡啊，我刚才...好像发现了奇怪的地方。</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「...为什么你的钱和我的不一样？」</p><p class="story-paragraph dialogue">「说什么呢？」</p><p class="story-paragraph dialogue">「你看这个。我的1000克朗和你的不同，没有人的脸。就只有波涛汹涌的大海啊」</p><p class="story-paragraph">让人无话可说似地把钱往眼前一递，旼炡一脸第一次见的表情，摇头晃脑。虽然是相同的金额，但彼此的纸币却完全不同。不用仔细比较，从大小到设计都各不相同，完全不可能觉得像的程度。旼炡抱着头自言自语。还真是那样啊...奇怪，为什么不一样呢？</p><p class="story-paragraph dialogue">「你说这是从韩国换来的吧。还是其实不是挪威，是其他国家的钱呢？」</p><p class="story-paragraph dialogue">「不是这样的。孟克是挪威人，一定是挪威的钱，按常理来说」</p><p class="story-paragraph dialogue">「但我的钱是刚从银行换来的啊？这太不像话了。其中一个绝对有问题」</p><p class="story-paragraph dialogue">「那就来打赌吧，究竟谁的钱是真的呢？」</p><p class="story-paragraph dialogue">「那当然是...」</p><p class="story-paragraph">知珉突然停下，冷静地想了想。这真的是挪威的钱吗？上面是挪威人，把挪威名画家的脸放上去，当然是挪威币吧。但是为什么和去银行换的钱不一样呢？难道，银行职员把自己国家的钱给搞错了？在北欧，公务员能如此正大光明地诈骗吗？</p><p class="story-paragraph">简直就像是突如其来的当地常识问答秀一样。正在知珉犹豫不决的时候，旼炡自信地拿着印有孟克的1000克朗纸币，直奔收银台。收到纸币的店员摇了摇头，用英语郑重地回答。</p><p class="story-paragraph">客人，这是旧钞所以不能用。</p><p class="story-paragraph">店员看到旼炡惊慌的表情，面带歉意地补充说明“但是我们也遇到过很多人都这样”。挪威的货币在3年前左右开始更新，从2020年末开始，旧货币就不能使用了。因此，从目前来看，这些钱成了无处可用的无用之物。也就是说，旼炡这相当于14万韩元的纸钞，就和废纸片没两样。</p><p class="story-paragraph">知珉从旁边瞥了她一眼，眼里几乎失了神。这笔钱显然是旼炡带来的所有现金。不管怎么说，莫名其妙的挪威常识问答秀，以知珉的胜利告终，旼炡则瞬间成了现金乞丐。旼炡的瞳孔涣散，脚步沉重，不断自言自语吐露着不满。怪不得换钱换得那么便宜。想想确实有点奇怪...</p><p class="story-paragraph dialogue">「到底是哪家银行给的，都是不能用的旧钞。之后再换回韩币吧」</p><p class="story-paragraph dialogue">「没办法，完全就是丢水里了」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「这个是在二手市场发现的，花了10万韩元买的」</p><p class="story-paragraph dialogue">「旼炡啊...你就是被骗了啊」</p><p class="story-paragraph">如果不是那样的话，肯定是你搞错了吧。要是我没换钱的话你可怎么办才好。怎么一天天的全都不得安宁，你这只臭小狗啊。在前往美术馆的路上，小鸟宝宝受尽责备，却怎么也不敢反驳，只是摆弄着手指上的戒指，哼哼唧唧的。</p><p class="story-paragraph">顺利抵达孟克美术馆，因一楼的规模非常小，两人随即前往地下一层。把雨伞和外套都寄放在休息区后，能够轻便地穿梭在室内。这里的画作出名地有些古怪、阴暗，除此之外，两人对作品一无所知。</p><p class="story-paragraph"><em>死去的母亲与孩子(the dead mother and the child) , 1989</em></p><p class="story-paragraph">在第一个展馆，展示着画家的简历和早期作品。一开始，作品就呈现出无尽的阴郁，知珉想到，就像在斯德哥尔摩看相片展时所感受到的那样，能够涵盖北欧整体的情绪，或许就是忧郁。这幅画的名称露骨，描绘了阴沉的家中，妹妹围绕母亲哭喊的画面。</p><p class="story-paragraph">生平解说中记载了，孟克小时候母亲去世给他带来的冲击。而他的家族史比起这一幅幅描绘的画，背后的故事更加可怕。替母亲扛起家计的姐姐，和当时刚出生的弟弟，都没能成年就死了，另一个弟弟成年后也因精神病去世。像受到诅咒一样，看着所有家庭成员依次死去的人生，最后患上慢性神经衰弱，一生一直画着阴郁的画作，也是无可厚非。</p><p class="story-paragraph">又看了几幅相似的作品，知珉接着走向下一个展区。人们在某幅画作周围熙熙攘攘，也许这就是旼炡想看的最出名的画、有呐喊的展馆。</p><p class="story-paragraph"><em>呐喊(scream) , 1893</em></p><p class="story-paragraph dialogue">“我跟两个朋友一起迎着落日散步，突然间，天空变得血红。我感觉到回荡在大自然那剧烈而又无尽的呐喊。”</p><p class="story-paragraph">由于关于画家的记忆写得栩栩如生，这幅画也许更能引起世人的兴趣。看着美丽的晚霞，突然传来一声惨叫。虽然艺术是深奥的，但依旧给人难以言喻的感性。</p><p class="story-paragraph">这时，从人群中看见了被挤到一旁的小鸟。踮起脚尖的旼炡，连面前身材魁梧的西洋人叔叔的肩膀都够不着。在那里做什么啊？一喊她，像傻子一样被人群甩出去的旼炡，踉踉跄跄走过来。等人潮退去之后，知珉让旼炡站在画旁，打开了手机相机。</p><p class="story-paragraph dialogue">「拍得清楚吗？」</p><p class="story-paragraph dialogue">「嗯，做一个和他一样的表情」</p><p class="story-paragraph dialogue">「不要，大家在看」</p><p class="story-paragraph">旼炡东张西望，见没人看着自己，就调皮地将双手放在双颊上，模彷着呐喊的姿势。知珉见她摆出不折不扣的游客姿势不禁失笑，但在安静的美术馆内，总不能笑出声，只能忍着。</p><p class="story-paragraph dialogue">「拍得怎么样？」</p><p class="story-paragraph dialogue">「...这个一定要换成你的头像」</p><p class="story-paragraph dialogue">「如果很奇怪，我会马上删掉的」</p><p class="story-paragraph dialogue">「我把你拍得很好」</p><p class="story-paragraph">旼炡看到照片后，似乎很满意地笑了笑，但要以此作为头像，似乎有点丢人，便默默搪塞过去。两人决定在进入最后一个展馆之前，暂时坐在走廊的长椅上休息片刻。好像没走多久，但腿有点酸痛。可能是参观展览的时候受到画作微妙的影响，旼炡说道。虽然都很好，但画面有点忧郁，没有一幅画看起来是幸福快乐的。</p><p class="story-paragraph dialogue">「...我也这么想」</p><p class="story-paragraph dialogue">「这里的人们情绪整体上来看是很忧郁，可能是天气的原因吧，总是又冷、又阴沉」</p><p class="story-paragraph dialogue">「应该是有影响的吧」</p><p class="story-paragraph dialogue">「如果比现在再更冷的话，太阳会更快下山。简直就是暂时浮起来，就马上消失而已」</p><p class="story-paragraph">一听就觉得可怕。阳光不足的严冬。知珉突然想起明俊去英国没多久的时候，两人聊天的对话。伦敦是个太冷、太阴暗、太沉闷的城市，光是对天气的不满就抱怨了好几天。然而天气真的是让人不安的因素。是啊，反之，住在加利福尼亚的人，总有一种开朗乐观的形象。那么，如果一生都在阳光照射不到的北欧度过冬天，到底会变得多么抑郁呢？知珉将浮现出来的想法原封不动地吐露。</p><p class="story-paragraph dialogue">「听说伦敦也是如此，让人心情很沉闷」</p><p class="story-paragraph dialogue">「啊...伦敦」</p><p class="story-paragraph">是吗，伦敦也会像这里一样阴暗吗。对于突然成为话题的伦敦，旼炡适当地做出了回应，却有点含糊其辞。看见她僵硬的表情，自己好像说错话了，明明现在没必要非得提和明俊相关的话题。从座位上站起来的知珉，好像没事似的对旼炡说。休息够了的话，去下一个展区吧？</p><p class="story-paragraph"><em>爱与痛苦(Love and pain), 1895</em></p><p class="story-paragraph">到了最后一个展馆，眼前的是知珉目前为止，在该美术馆看到的作品中，较不忧郁、且最为满意的画了。一个披着褐色头发的女人抱着低着头的男人，像安慰一样亲吻着他的脖子。画家创作的《爱与痛苦》以浪漫为主题，但此作品却被称作&quot;吸血鬼&quot;，据说这在当时是被视为颓废艺术的作品。明明看起来就是可爱的恋人，竟然被说是吸血鬼。是被政治宣传所利用，还是真的被当时人们视为颓废艺术呢？已无从得知。</p><p class="story-paragraph">总之这幅画在知珉看来很美。看到黑夜中紧紧相拥的恋人，知珉想起几天前，在夜间列车上的夜晚。将彷彿马上就要哭出来的旼炡紧紧抱住，两人享有的那份寂静。一直只是默默欣赏的知珉，似乎想记住这幅画，拍下一张照片才离开。</p><p class="story-paragraph"><em>嫉妒(jealousy), 1895</em></p><p class="story-paragraph">孟克留下的画作，大多是暗淡地描绘出自己的自画像，或是亲人或熟人的死亡，又或是关于爱情的记录。画这幅画的时候，是作者和小时候亲近的女人再次相遇，坠入爱河。但是把自己喜欢的女人介绍给朋友，却成了恶梦的开始，最后女人和好友产生了情愫，最终结了婚。这就是以此创作的作品，果然和前作一样，具有直白的标题，名为《嫉妒》的一幅画。</p><p class="story-paragraph">一看就像是狗血剧中的一个场景。一对看上去很快乐的情侣，被另一个男人狠狠地盯着。可想而知，这个男人应该就是望着和朋友噼腿的旧情人的孟克本人。画中的男人用充满爱恨的眼神看着女人，好像在说。</p><p class="story-paragraph">因为爱你，所以更不能原谅。</p><p class="story-paragraph">背叛我离开的你总有一天会遭天谴的。</p><p class="story-paragraph">一定。</p><p class="story-paragraph">瞬间感觉头昏脑胀的。知珉看着这幅画感到严重的不适，甚至讨厌。因为不快的心情，想马上逃离。但身体就像着了魔一样，陷入画中男人责怪的眼神，无法动弹。避开视线的瞬间，手机打破了展间的寂静，发出了嗡嗡的震动声。</p><p class="story-paragraph">萤幕上显示着明俊的名字。知珉匆忙离开展览馆，来到人迹罕至的走廊角落，悄悄接起电话。连按通话按钮的手都还在颤抖。</p><p class="story-paragraph dialogue">「现在在哪里？能通话吗？」</p><p class="story-paragraph dialogue">「我现在在美术馆，有什么事啊？」</p><p class="story-paragraph dialogue">「...有一个好消息，一个坏消息，你想先听哪个？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「快点帮我选吧」</p><p class="story-paragraph">说实话，现在完全不想听明俊提出的任何事情。心烦意乱却只能假装若无其事，还要用明朗的声音通话实在很累人。但是，自己没有不做选择这个选项，所以只能二择一。知珉马上小声说道。</p><p class="story-paragraph dialogue">「…好消息」</p><p class="story-paragraph dialogue">「好吧，先说好消息的话...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我的出差会比预期的要早结束」</p><p class="story-paragraph dialogue">「...真的吗？」</p><p class="story-paragraph dialogue">「嗯，本来还剩下2周。但感觉下周就能回去」</p><p class="story-paragraph">下周啊。这周预定要在奥斯陆停留两天，然后前往哥本哈根。所以说下周的话，应该是两人去冰岛的时候。</p><p class="story-paragraph dialogue">「太好了...怎么回事呢？」</p><p class="story-paragraph dialogue">「我一直希望早点结束。幸好成果也很快就出来了」</p><p class="story-paragraph">我最近真的很努力了，每天都上夜班呢。明俊高兴地接连说请夸夸我。恭喜，你一定很辛苦，幸好事情没有延长。知珉调高了音调，免得自己的声音过于索然无味。视线的尽头是黑暗的走廊。</p><p class="story-paragraph dialogue">「所以说」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「下周...你换票来伦敦怎么样？」</p><p class="story-paragraph">没有不结束的旅行，任何人总有一天要结束愉快的旅行回去。明俊所在的伦敦，或者韩国。知珉不得不在其中再做一次二选一。这次也没有不回去的选项。不管去哪里，那里都会有我去年等了一年的人，按照原定计划，一个月前就该见面的明俊身边。</p><p class="story-paragraph dialogue">「我再看看能不能换」</p><p class="story-paragraph dialogue">「你再打听一下」</p><p class="story-paragraph dialogue">「...还有呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「坏消息...是什么？」</p><p class="story-paragraph dialogue">「你好像没有想到什么啊」</p><p class="story-paragraph dialogue">「我不知道。这样有点不安，能不能快点说？」</p><p class="story-paragraph dialogue">「其实坏消息也没什么。虽然对我来说是没什么」</p><p class="story-paragraph dialogue">「...所以是什么？」</p><p class="story-paragraph dialogue">「你这两天完全没有联系」</p><p class="story-paragraph">知珉屏住了呼吸。说实话，自己完全忘记了，连早晚向明俊问候这些最起码的例行公式都忘了，就这么过去了两天。</p><p class="story-paragraph dialogue">「对不起，真的对不起。看我这记性」</p><p class="story-paragraph dialogue">「我以为你出了什么事，所以很担心。你都做什么了，怎么会一直没联系呢？」</p><p class="story-paragraph">这两天做了什么。</p><p class="story-paragraph">到底做了什么，就这么毫无牵挂地到处去呢。</p><p class="story-paragraph">慢慢回想着，但越想越觉得脸红。两天前，两人刚过午夜就在斯德哥尔摩的某条巷内接了几次吻。想两个人独处，所以牵着手在凌晨的街道上漫无目的地转悠。第二天，两人暂时合眼后，一起登上瞭望台欣赏风景。晚上在大教堂祈祷后，与旼炡一起迎来了今年的第一场雪。接着怀着像要飞上云霄的幸福心情，为旼炡许下了一个小小的愿望。</p><p class="story-paragraph">今天早上，两人一起撑着雨伞，在雨中紧紧挨在一起，旼炡亲暱地为自己擦去脸上的雨水。在剧烈摇晃的小飞机里，自己紧紧握着旼炡的手，全身汗流浃背。</p><p class="story-paragraph">结果这两天，刘知珉的生活完全被金旼炡给填满。在这些记忆中，没有任何东西能轻率地对明俊说。但为了填补电话的空白，知珉只对明俊说了几句，接着做了没有诚意的报告。</p><p class="story-paragraph dialogue">「昨天有点累...因为没睡好觉，所以下午才出门」</p><p class="story-paragraph dialogue">「去了哪些好地方吗？」</p><p class="story-paragraph dialogue">「去了斯德哥尔摩大教堂，很漂亮」</p><p class="story-paragraph dialogue">「教堂？我倒是没听说过。很多可看的吗？是有名的建筑吗？」</p><p class="story-paragraph dialogue">「不是那样的...总之，出门的路上下雪了，逛了一会儿就回家了」</p><p class="story-paragraph dialogue">「你那里已经下了初雪啊」</p><p class="story-paragraph dialogue">「嗯，可能晚上就不知不觉睡着了」</p><p class="story-paragraph dialogue">「...那今天呢？今天做什么了」</p><p class="story-paragraph dialogue">「今天早上在去挪威的路上下了很大的雨，还打雷，坏了一把伞...所以特别手忙脚乱，对不起」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「什么呀，这两天发生的事情就这样结束了吗？」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph">知珉焦急地用舌头舔了好几次嘴唇。咚、咚、咚，心跳的声音一直在耳边回荡。因为犯了错，所以感觉自己成了躲避大人们的视线，蜷缩在角落的孩子。</p><p class="story-paragraph dialogue">「没有想象中有趣，我还以为你忙着玩，没有联系呢」</p><p class="story-paragraph dialogue">「可能是这两天太累了。事实上也没做什么，就是不停到处走」</p><p class="story-paragraph dialogue">「看来你和那个朋友一起去旅行非常有趣啊」</p><p class="story-paragraph dialogue">「很抱歉没联系你，哥哥」</p><p class="story-paragraph dialogue">「不，好玩就行了。但也要经常回复信息。总是忘了联系的话挺伤心的，我也很好奇啊」</p><p class="story-paragraph dialogue">「抱歉...」</p><p class="story-paragraph dialogue">「英国也快下初雪了。等你来的时候一起看就好了」</p><p class="story-paragraph dialogue">「...但我在这里已经看过初雪了」</p><p class="story-paragraph dialogue">「那又如何，如果在这里再看一次那也是初雪」</p><p class="story-paragraph">如果是和明俊一起在伦敦再次迎来第一场雪会怎么样呢？和旼炡在这个地方迎来初雪的记忆，会不会变得模糊呢？会不会像没有发生过的事情一样消失呢？明明是那么鲜明，却像今天早晨的彩虹一样销声匿迹。</p><p class="story-paragraph">如果，如果那样的话</p><p class="story-paragraph">我该如何记住你呢。</p><p class="story-paragraph dialogue">「我想你了，知珉」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「嗯，我也...想你」</p><p class="story-paragraph dialogue">「今天一定要好好玩。先挂了，我爱你」</p><p class="story-paragraph dialogue">「...我也爱你」</p><p class="story-paragraph">知珉挂断电话前左顾右盼，深怕附近有谁会听见。幸好旼炡可能还待在展馆，没有看到她的身影。知珉浑身无力，像罪人一样低下了头，就像刚才画中出现的男人一样。</p><p class="story-paragraph">对某人的爱越无法控制地增长，痛苦就越不能停止，最终溢出，矛盾的情感肆意衡量着自己的心。知珉现在非常清楚，爱情和痛苦的共存，是什么感觉。</p><p class="story-paragraph">旼炡啊，</p><p class="story-paragraph">今天的我因为罪恶感快窒息了。</p><p class="story-paragraph">在拼了命无视的现实中，</p><p class="story-paragraph">好像越来越痛苦。</p><p class="story-paragraph">对不起，用你来减轻我的罪恶感。</p><p class="story-paragraph">但是就今天，</p><p class="story-paragraph">希望你能这样紧紧地抱住我。</p><p class="story-paragraph">用多次安慰了我的那温柔的嗓音，</p><p class="story-paragraph">说一切都会好起来的。</p><p class="story-paragraph">能再说一遍给我听吗？</p></div>
      </section></template>

          <h3>Iced tea day</h3>
          <div class="lyric-lines"><p class="lyric-line stanza-break latin">오늘은 Iced tea day</p>
<p class="lyric-line">니 달콤한 두 눈에</p>

<p class="lyric-line stanza-break latin"><strong>Iced tea day</strong></p>

        </aside>
        <div class="chapter-copy"><p class="story-paragraph">气温比平时更低的冬日早晨，校园里学生三三两两，各处响起欢声笑语。知珉捧着一束花和社团准备的大礼物盒走向教室。这是前几天为即将毕业的三年级学生，准备的惊喜之一。打开教室的门，看见前辈戴着毕业帽，摸着头发微微一笑的样子。知珉走到她面前，面带微笑说：恭喜毕业，姐姐，收下这个吧。</p><p class="story-paragraph dialogue">「这是什么时候准备的？」</p><p class="story-paragraph dialogue">「快打开看看吧。这是和孩子们一起选的」</p><p class="story-paragraph dialogue">「...里面东西好多啊？」</p><p class="story-paragraph">前辈红着脸一个个拿出礼物。箱子内装满孩子们精心准备的礼物，有日记本、手环、手机壳等小东西。知珉准备的，是庆典前一天前辈说喜欢的香水。前辈打开香水瓶盖，往手腕上喷了几下，用眼神示意自己非常满意。这个香味很好闻呢，是谁挑的？</p><p class="story-paragraph dialogue">「这个是知珉挑的」</p><p class="story-paragraph dialogue">「好有Sense啊，我喜欢这个香味」</p><p class="story-paragraph dialogue">「真的吗？真是太好了」</p><p class="story-paragraph dialogue">「总觉得我的取向和你挺合的」</p><p class="story-paragraph">前辈把孩子们聚在一起说。来拍照留念吧。一伙人把教室各处当成背景，照了好多张毕业纪念照。前辈刚才笑容满面，现在却露出了难过的表情。姐姐，现在要毕业了感觉怎么样？对于知珉的提问，前辈只说感觉忐忑不安。</p><p class="story-paragraph dialogue">「怎么了姐姐，明明考上了好大学」</p><p class="story-paragraph dialogue">「...我好像对学校感情很深吧。一想到这是最后一次，就有点想哭」</p><p class="story-paragraph">这时听见有人喊了前辈。姐姐，外面有人在等你，看起来是一年级，好像还捧着花呢。知珉反射性地转过头来。只见一个女孩在门外徘徊的背影。也许早该猜到这是在自己的梦中。知珉睁大眼睛，再次将背影深深印在了眼底。虽然没见过她穿校服，但再怎么看也觉得身高和体型十分熟悉。</p><p class="story-paragraph">等一下，到底为什么？</p><p class="story-paragraph">你会突然出现在这个场景？</p><p class="story-paragraph dialogue">「进来吧，旼炡啊」</p><p class="story-paragraph dialogue">「...可以进去吗？」</p><p class="story-paragraph dialogue">「当然了」</p><p class="story-paragraph">前辈高兴地朝旼炡招手，知珉反复看着两人。竟然真的出现了这种奇妙的场景。旼炡一进来，其他人不知不觉全部消失不见，只剩三个人留在了教室。</p><p class="story-paragraph dialogue">「这是给我的吗？」</p><p class="story-paragraph">旼炡手上拿着花束，从知珉身边经过。收下这个吧。旼炡小心翼翼地把花递给了前辈。前辈说了声谢谢，双手捧起花束。前辈的笑容比打开孩子们送的礼物时要灿烂得多。旼炡接着轻声说，恭喜姐姐毕业。说着说着立刻就哭了起来。</p><p class="story-paragraph dialogue">「哭什么呢，旼炡啊」</p><p class="story-paragraph">前辈见旼炡哭得梨花带雨，心疼地抚摸着她的头发。知珉只能拿着礼物盒站在一旁。虽想说点什么，但喉咙像堵住了一样，发不出任何声音。</p><p class="story-paragraph dialogue">「别哭了，停」</p><p class="story-paragraph dialogue">「现在在学校见不到面了」</p><p class="story-paragraph dialogue">「我也特别难过，怎么办呢？」</p><p class="story-paragraph">不知怎么的，两人就像看不见观众席上的自己，动作中带有浓浓的爱意。前辈一直用手擦拭旼炡的眼角，旼炡也一直撒娇。讨厌，上了大学以后就见不到了嘛。</p><p class="story-paragraph dialogue">「不会的，我经常来看你就行了」</p><p class="story-paragraph dialogue">「到时候会很忙，不来也没关系的」</p><p class="story-paragraph dialogue">「...怎么这么说？」</p><p class="story-paragraph dialogue">「要等我毕业还有两年呢」</p><p class="story-paragraph">旼炡勉强忍住哭泣喘了口气。孩子为什么哭得那么伤心呢。虽然想上前安抚旼炡，但手脚像是被绑住，完全无法动弹。</p><p class="story-paragraph dialogue">「…旼炡啊，金旼炡」</p><p class="story-paragraph">知珉拼了命地喘息，喊出了旼炡的名字。这时，旼炡才把头转向自己。虽然眼底还带着些微水气，但从未见过她以如此冰冷的目光盯着自己。旼炡的眼神和在美术馆那幅画中男人的十分相似。虽然爱却只能怨恨的，站在自己身旁，那充满爱恨的眼神。知珉就像画中的一部分，身体越来越僵硬。这时，旼炡慢慢走近身旁，在耳边细语道。</p><p class="story-paragraph dialogue">「怎么这么僵硬？」</p><p class="story-paragraph dialogue">「...动不了，把我放开」</p><p class="story-paragraph dialogue">「我没办法，连这种事也要拜托我吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「比起那个，我有想要传达的事情」</p><p class="story-paragraph">一个好消息，一个坏消息，想先听哪个？她摆出一副猜不透的脸庞这样说道。显然这和昨天的场景似曾相识，就像轮回一样，旼炡说出口的句子和明俊的一模一样。又来到了选择的时间，知珉在梦里也做出了和昨天一样的选择。</p><p class="story-paragraph dialogue">「…好消息」</p><p class="story-paragraph dialogue">「我就知道会这样。不想听不好的事吧？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「总之，好消息是这只是梦」</p><p class="story-paragraph">旼炡一句无从查证的话，让知珉松了口气。原来如此，这荒唐的情况完全是自己创造出来的幻想。在只听到好消息的情况下想着，无论如何，只要甦醒过来就好了。但眼前的旼炡和前辈却一动不动地注视着自己。</p><p class="story-paragraph dialogue">「…坏消息是什么？」</p><p class="story-paragraph dialogue">「姐姐虽然装作彷徨的样子...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但其实心里很清楚」</p><p class="story-paragraph">那是什么意思？知珉立即反问，旼炡没理会，用冷静的目光继续说。是不是太过分了？只因为不想伤害别人，所以才不先做选择不是吗。</p><p class="story-paragraph dialogue">「其实只是逃避责任，不是吗？现在情况变成这样是谁的错？」</p><p class="story-paragraph dialogue">「逃避…不是这样的」</p><p class="story-paragraph dialogue">「应该没错啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「姐姐就是个胆小鬼」</p><p class="story-paragraph">旼炡的话语尖锐得就像要割伤自己，内心深处似乎已经留下伤痕。直到最后也没能开口说什么，而旼炡像是说完了该说的话，就头也不回地离开。现在教室内只剩下两个人。</p><p class="story-paragraph dialogue">「...知珉，你没事吧？」</p><p class="story-paragraph">为什么话说得好像什么都知道，现在到底是什么情况。对于知珉的呢喃，前辈了解似的点了点头。又开始说出魔咒般的话语。</p><p class="story-paragraph dialogue">「姐姐，现在是什么...」</p><p class="story-paragraph dialogue">「看来旼炡好像是生气了，所以就走了吧」</p><p class="story-paragraph dialogue">「她到底为什么会在这里？怎么回事？」</p><p class="story-paragraph">谁知道呢，首先应该是来祝贺我毕业的？前辈把从旼炡手中接过的花轻轻地向上举起。只见她手里捧着的其中一朵玫瑰，鲜红得让人觉得不像梦。</p><p class="story-paragraph dialogue">「总之，毕业典礼就到此结束。我也该出去了」</p><p class="story-paragraph dialogue">「等一下、姐姐」</p><p class="story-paragraph dialogue">「知珉啊，你到底想怎么做？」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「这些最终都应该由你来选择，而不是任何人」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我会好好用你送的香水的，谢谢」</p><p class="story-paragraph">等等我、等一下。正要这么说的时候，教室门就砰的一声关上了。很快，太阳就从窗外消失地无影无踪，黑夜瞬间降临。只有一人的教室，就像庆典前一天那样一片漆黑。陷入恐惧的知珉努力想移动僵直的身体。</p><p class="story-paragraph dialogue">「…旼炡啊」</p><p class="story-paragraph">你在哪里啊。</p><p class="story-paragraph">拜托你来一下好吗？</p><p class="story-paragraph">听不见我的声音吗？</p><p class="story-paragraph dialogue">「...我好害怕」</p><p class="story-paragraph">旼炡啊、旼炡啊、金旼炡。</p><p class="story-paragraph">知珉几乎是边哭边在心里喊了好几次某人的名字。但教室的门依然紧闭。这时脚底触及的地板开始软烂，接着像海水一样翻腾，已经淹过自己的脚踝并朝着膝盖而上。教室内渐渐地溢满冰冷的水，在漆黑一片的夜海中，害怕身体被吞没的知珉，自暴自弃闭上了眼睛。</p><p class="story-paragraph">随后像被扔回现实一样，从睡梦中惊醒。真是最糟糕的噩梦，被别人追赶着醒来的梦都比这更好。</p><p class="story-paragraph">旅行了几个星期？每天起床都要面对不透光的昏暗早晨，已渐渐变得熟悉。窗外仍下着毛毛细雨，只有奥斯陆冷清的深蓝冬天迎接自己。像是根本没睡过觉，耳朵里响起哔——的耳鸣。知珉艰难地起身，没有睁开眼睛，而是按住脑袋。想着喝杯茶就会清醒过来，于是径直走向厨房。把水装进杯子后，熟练地从橱柜里拿出一个红茶茶包。知珉静静地挽着胳膊，等待茶包透出颜色，旼炡从床上传来了沙沙的响声。</p><p class="story-paragraph">如果说早起的知珉勤奋，那旼炡就是起得比较晚。在平时，知珉会从冰箱拿出水果或沙拉一起吃，但由于做了太可怕的噩梦，食欲大减。所以，光一杯简单的红茶，就是今天的早餐。</p><p class="story-paragraph dialogue">「姐姐，你起床了吗？」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「今天不吃早餐吗？还剩下一些水果呢」</p><p class="story-paragraph dialogue">「不怎么饿」</p><p class="story-paragraph dialogue">「怎么了？昨天晚上吃了什么才睡的吗？」</p><p class="story-paragraph">知珉端着茶杯坐在沙发上，对旼炡的提问，只以机械式的简短句号和感叹词做回答。不是，有点？嗯，好吧。没有诚意的对话像打乒乓一样重复，旼炡从浴室咬着牙刷，露出疑惑的表情。</p><p class="story-paragraph dialogue">「今天状态不好吗？怎么感觉这么低落？」</p><p class="story-paragraph dialogue">「...嗯？你说什么？」</p><p class="story-paragraph dialogue">「看你都没办法集中精神了，在想什么？」</p><p class="story-paragraph dialogue">「没有，我什么都没想」</p><p class="story-paragraph">做了一个很悲惨的噩梦，你也脱不了关系- 也不能这么说啊。知珉担心看到旼炡的脸，会再次想起梦里发生的事情，所以一直保持沉默。梦境中的刘知珉就像是用废铁制造的机器人，无法动弹、无法说话，而现在的她，彷彿从梦中穿越到现实。</p><p class="story-paragraph dialogue">「今天要吃的饭怎么解决？吃什么好呢？」</p><p class="story-paragraph dialogue">「嗯...饭？」</p><p class="story-paragraph dialogue">「嗯、饭。早饭吃的这么敷衍，中午没有想吃的吗？」</p><p class="story-paragraph dialogue">「是啊...怎么办呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「怎么办，姐姐真的变成傻瓜了啊」</p><p class="story-paragraph">竟然说我是傻瓜。不，干脆头脑挨个打真的变成傻瓜，忘得一干二净说不定能好点。偏偏梦境过于真实，其中还混杂着现实和想象，搞得两者界限模糊不清。从旼炡对着前辈撒娇的语气，到责怪自己的冷漠眼神。</p><p class="story-paragraph dialogue">「吃鲑鱼怎么样？补充蛋白质能够醒脑」</p><p class="story-paragraph dialogue">「很奇怪，我肚子不怎么饿」</p><p class="story-paragraph dialogue">「不是哪里不舒服吧？」</p><p class="story-paragraph dialogue">「嗯，不是那样的...」</p><p class="story-paragraph dialogue">「那是？」</p><p class="story-paragraph dialogue">「...只是因为一直在到处转，所以想休息一下」</p><p class="story-paragraph">如果是昨天太累了就说嘛。那我今天也休息吧？刚洗完脸出来的旼炡用沉闷的声音咕哝着。但是，这样反而更为难。因为今天这情况，想刻意避免两个人在家呆独处。</p><p class="story-paragraph dialogue">「旼炡啊，你不是说在奥斯陆有很多想做的事情吗？想看维京海盗船，也想吃鲑鱼」</p><p class="story-paragraph dialogue">「是啊...」</p><p class="story-paragraph dialogue">「这些我也没有非得要做。今天就先待在家吧」</p><p class="story-paragraph">最近确实都没有休息。旼炡似乎不太情愿地穿上了外出服。但是…。知珉对重新开口的旼炡说了一句。没事的，今天你自己好好逛逛吧。</p><p class="story-paragraph dialogue">「能不能一起出去吃顿饭？」</p><p class="story-paragraph dialogue">「不了，我真的很想休息」</p><p class="story-paragraph dialogue">「姐姐来到北欧没多久就受到天气影响了呢。昨天明明淋着大雨还到处转悠了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是茶包不拿起来吗？颜色变得很深了」</p><p class="story-paragraph dialogue">「嗯？哦」</p><p class="story-paragraph">都忘了茶包还放在杯子里面，就拿起来咕噜咕噜地喝，还想说怎么那么苦涩。不会真的把魂都忘在梦里了吧。知珉这才拿出茶杯内泛黑的茶包说。</p><p class="story-paragraph dialogue">「我也不知道，可能真的是天气的原因吧」</p><p class="story-paragraph dialogue">「那我去去就回，好好休息」</p><p class="story-paragraph">旼炡一离开，知珉就步履蹒跚地走回床上，靠坐在床头，蜷缩着膝盖仔细思考刚才那意味不明的梦。</p><p class="story-paragraph">这是最近第二次梦到前辈。一次是关于庆典前一天的记忆，第二次是昨天，混杂着自己的幻想和前辈的毕业典礼场景。送上香水是真实存在的，自己还有和穿着毕业服的前辈、以及社团成员们的合照在Instagram。只是不管怎么想，那天的记忆只是到此为止。</p><p class="story-paragraph">完全没有在学校见过旼炡的记忆。因此，从那之后的事情都是无意识下创造出来的想象，应该这样相信的。但她们两人的台词太过真实，让自己完全投入到剧情中。平凡的梦境随着金旼炡的闯入，变得一团糟。明明从没见过那表情，但她却是一副悲伤的哭脸出现在梦里，这个噩梦肯定是去美术馆时，内心的罪恶感造成的假象。</p><p class="story-paragraph">知珉下了结论，回到厨房打开冰箱，却不见包里经常带着的立顿冰茶。刚泡的红茶太浓了不想再喝，无奈之下，知珉决定给旼炡发送信息。</p><p class="story-paragraph dialogue">-旼炡，你在哪儿？在好好逛吗？</p><p class="story-paragraph dialogue">-晚上回来的时候 能给姐姐买冰茶吗？</p><p class="story-paragraph dialogue">-如果要买，就买我常喝的吧。</p><p class="story-paragraph">旼炡确认过信息后，简短地做出了回复。</p><p class="story-paragraph dialogue">-嗯嗯</p><p class="story-paragraph">什么呀，现在就发了两个嗯？知道了，嗯。连这句话都懒得说吗？再怎么不喜欢发短信，会不会太没诚意了？还问了她有没有好好逛街，也不回答。本来想说她两句的，但才刚使唤她跑腿，所以决定算了。而正好拿着手机，顺便给明俊也发了信息。</p><p class="story-paragraph dialogue">-在干嘛？我今天打算休息一天。</p><p class="story-paragraph">昨天才刚因为联系不上而收到黄牌，所以还是好好联系一天比较好。不知是一大早就询问他在做什么，还是因为今天自己的旅行休息，明俊感觉挺开心的。</p><p class="story-paragraph dialogue">-那里没有什么好玩的吧？就说挪威没有什么可看的</p><p class="story-paragraph dialogue">-可能吧，因为天气一直阴沉沉的所以有点累</p><p class="story-paragraph dialogue">-伦敦一定更有趣。现在正值圣诞市集的季节</p><p class="story-paragraph dialogue">-很多能逛的吗？怎么样？</p><p class="story-paragraph dialogue">-这里的市集规模非常大。街上的装饰也比其它欧洲国家华丽得多。</p><p class="story-paragraph dialogue">-是吗？挺好奇的</p><p class="story-paragraph dialogue">-来了就知道了，你会非常喜欢的</p><p class="story-paragraph">竟然要圣诞节了，时间这么快就过去了吗？明俊也说出差快结束了吧，可能工作真的闲下来了，信息也比之前回得更快。</p><p class="story-paragraph dialogue">-你看过票了吗？要我去找吗？</p><p class="story-paragraph dialogue">-不用、没关系。今天时间很多，我来看一下</p><p class="story-paragraph dialogue">-好吧，我去公司看看。今天好好休息</p><p class="story-paragraph">不管怎样，顺利结束早上的问候，知珉抬起胳膊伸了个懒腰。</p><p class="story-paragraph dialogue">「...没事做真好」</p><p class="story-paragraph">知珉拿起手机趴在床上，荒唐地搜索起“忘掉坏记忆的方法”。暂且不论真实性，网上没有什么找不到的。想忘掉这些不好的记忆，方法共有四个阶段，如果按照这个方法进行，可以取得一定的效果。知珉虽然心里半信半疑，但还是想尽快忘掉那些不舒服的事情，所以还是接着往下读说明。</p><p class="story-paragraph">第一：远离唤起记忆的事物和场所。在目前的情况下，很难从这个步骤开始。当事人每天都在身边待着就是问题。但值得庆幸的是，今天和旼炡保持了一定的距离。</p><p class="story-paragraph">第二：反而要一直想，直到那些记忆失去影响力为止。但这步骤给人压力太大，实在没办法，果然还是跳过。虽然心里也有疑虑，跳过两个步骤没关系吗，但知珉没有想得太深，决定直接跳过。</p><p class="story-paragraph">第三：活在当下。这个看起来还行。忠于当下最好方法就是运动吧。虽然没有垫子，但就在地上铺点什么，自己做个瑜伽吧。一边活动身体一边整理脑中杂念，感觉是非常现实的方法。很好，打勾。</p><p class="story-paragraph">最后：创造全新的幸福记忆。忘记这些坏记忆的方法，一共分为这四个阶段完成。这样看来，看看在飞机上没看完就关掉的玩具总动员，转换一下心情是不是正好？运动两小时、再看电影两小时。想充实地度过一个大雨滂沱的下午，这个计画并不坏。为了立即实施计划，知珉正打算去浴室拿毛巾代替瑜伽垫，门铃却急促地连续响了两声。</p><p class="story-paragraph">叮咚叮咚——</p><p class="story-paragraph">什么啊？知珉穿着拖鞋站在门前犹豫了片刻。门外的客人似乎是等不及，再次按了两下门铃。叮咚、叮咚。偏偏公寓门铃声真的非常嘈杂。知珉不得不猛地打开门。眼前出现的，是双手紧握塑料袋的旼炡。</p><p class="story-paragraph dialogue">「真是的...快给我开门吧，太重了」</p><p class="story-paragraph dialogue">「你怎么又回来了？这些都是什么啊？」</p><p class="story-paragraph dialogue">「这些是今天要进我们肚子里的东西」</p><p class="story-paragraph dialogue">「...这些全部？」</p><p class="story-paragraph">我一个人能点什么吃，这些西餐厅的价格都太高了，与其那样还不如在家做饭吃。旼炡看似合理的反驳，但这些东西无论怎么看都超出必要的量。估计应该能有四人份吧。</p><p class="story-paragraph dialogue">「去餐厅吃...会不会比你买的东西便宜？」</p><p class="story-paragraph dialogue">「就说不是了？况且宿舍还有厨房，今天就一起做饭吃吧」</p><p class="story-paragraph">旼炡把买来的东西一个个放到桌上。两块厚重的生鲑鱼发出“咚”的一声，还有光看起来贵，实则空虚又潦草的沙拉和起司。</p><p class="story-paragraph dialogue">「首先，鲑鱼是今天的主菜。一块是生鱼片用，另一块是鱼排用」</p><p class="story-paragraph dialogue">「这是什么？」</p><p class="story-paragraph dialogue">「鱼子酱香蒜面包」</p><p class="story-paragraph dialogue">「好像不是真的鱼子酱啊？」</p><p class="story-paragraph dialogue">「上面不是写着鱼子酱吗？」</p><p class="story-paragraph dialogue">「那不可能是这个价格吧」</p><p class="story-paragraph">当然，知珉的怀疑是合理的。因为面包上的确不是鱼子酱，而是用鱼卵做的。但是旼炡的注意力已经不在鱼子酱身上，她正忙着炫耀自己买来的其他东西。像哆啦A梦从口袋不断拿出食材。</p><p class="story-paragraph">首先是两包夜宵用泡面。据说，这款泡面是来到挪威的韩国人经常吃的。虽然不知道味道如何，但至少外包装上的大叔看起来慈眉善目。还有两个人早餐要吃的苹果、桃子、橘子和青葡萄等水果，最后是无聊的时候要吃的两罐品客。旼炡似乎在很短的时间内，把超市逛得明明白白。</p><p class="story-paragraph dialogue">「为了找不同颜色的品客回来，逛了三家超市」</p><p class="story-paragraph dialogue">「做得很好啊」</p><p class="story-paragraph dialogue">「是吧？快表扬我」</p><p class="story-paragraph">嗖地伸出脑袋来，知珉熟悉地用手摸摸她的后脑勺。真乖、旼炡做得好，真棒。所以你花了多少钱买的？明明之前被骗连一分钱现金都没有的人，到底哪来的钱买这些？正打算开始唠叨，旼炡赶紧打断说。现在还是我的时间，还剩下一个。</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph">就像众所期盼的秘密武器一样，旼炡从袋子里庄重地拿出某样沉甸甸的东西。知珉瞬间以为自己眼花，但那厚重的瓶子无论怎么看就是酒。一瓶黄澄澄的威士忌，拿在旼炡手里。</p><p class="story-paragraph dialogue">「将将，怎么样？」</p><p class="story-paragraph dialogue">「呀，怎么连酒都买了？」</p><p class="story-paragraph dialogue">「这是店员推荐给我的。听说是挪威的国酒」</p><p class="story-paragraph">这分明是旼炡特意为了心情格外低落的自己才买来的。实际上，不怎么喝酒的旼炡不可能瞭解酒类。明明不清楚就买个啤酒或红酒啊，偏偏挑了这看起来很浓烈的威士忌。知珉想象独自逛着酒类柜台的旼炡，最后憨厚地问店员推荐什么。</p><p class="story-paragraph dialogue">「那个店员应该有点为难吧」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「会想说长得像中学生的人，怎么突然来这让我推荐酒呢？」</p><p class="story-paragraph dialogue">「我为什么是中学生？」</p><p class="story-paragraph dialogue">「你比起这里的中学生，看起来年纪更小。没被问年龄吗？」</p><p class="story-paragraph dialogue">「...让我出示护照，所以给店员看了」</p><p class="story-paragraph">也许店员是带着怀疑的表情，一边看着身份证件一边结账的。想到旼炡堂堂正正地拿着酒瓶一路回到了这里，知珉脸上忍不住微笑。</p><p class="story-paragraph dialogue">「姐姐喝过这个吗？」</p><p class="story-paragraph dialogue">「我也是第一次看到」</p><p class="story-paragraph">知珉慢慢上下打量着威士忌。瓶身上标签写着“linie aquavit”，且印有世界地图，还特别亲切地介绍酒的由来。装在橡木桶里的酒都会搭上船，在赤道航行两圈而酿成。连酒都像海盗船一样，需要不停航行在海上进行发酵，这点非常像挪威人。知珉虽然不是每周都喝，但挺喜欢喝葡萄酒的，如果慢慢喝，威士忌也没问题。</p><p class="story-paragraph">只是，目前的情况下，有一件事需要担心。</p><p class="story-paragraph dialogue">「…那是什么眼神？」</p><p class="story-paragraph dialogue">「你喝酒吗？」</p><p class="story-paragraph dialogue">「就是...喝得少啊」</p><p class="story-paragraph dialogue">「但你平时不是完全不喝吗？这也不能适量...你知道威士忌是多少度吧？」</p><p class="story-paragraph dialogue">「不知道」</p><p class="story-paragraph dialogue">「这个甚至有41度」</p><p class="story-paragraph dialogue">「那是多强啊？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「多放点冰块再喝的话，应该没问题吧」</p><p class="story-paragraph">旼炡回答这个问题的同时，正在厨房翻找平底锅之类的东西。看着桌子上成堆的食材，知珉叹了口气。就算是美食，但这么多东西能全吃下肚吗？而旼炡究竟能和期望中的一样，成功地做出料理吗？</p><p class="story-paragraph dialogue">「不过旼炡啊...你擅长做菜吗？」</p><p class="story-paragraph dialogue">「今天真是疑心重重啊。一下问我会不会喝酒，一下又问我料理做得好不好」</p><p class="story-paragraph dialogue">「不是...毕竟来旅行后是第一次做菜嘛...」</p><p class="story-paragraph dialogue">「鲑鱼只要烤得好就行了，不怎么难的」</p><p class="story-paragraph">从她的话语间满是自信的情况看来，旼炡似乎真的想担当大厨。只见冰箱旁正好挂着两件白色围裙，不愧是Airbnb超级房东的宿舍，准备地非常彻底。除了门铃声不合格外，仔细瞧瞧，屋内应有尽有。尽管只是突如其来的cooking time，厨房里从调味料到各种烹饪器具一应俱全。现在只要厨师发挥自己实力就行了。</p><p class="story-paragraph dialogue">「怎么了，觉得我不会做料理吗？」</p><p class="story-paragraph dialogue">「不是，不是那样的...」</p><p class="story-paragraph">事实上，光看旼炡站在炉火前，就足够令人担心，但知珉考虑到旼炡对料理的热忱和买菜的诚意，决定将这句话留在心里。</p><p class="story-paragraph dialogue">「那我该做什么呢？」</p><p class="story-paragraph dialogue">「不休息吗？你不是说累了嘛」</p><p class="story-paragraph dialogue">「当然可以帮忙准备啊。顺便监视你有没有搞砸」</p><p class="story-paragraph dialogue">「我可没有搞砸过，姐姐只要在旁边玩就可以了」</p><p class="story-paragraph">到底是从哪获得如此自信呢？身上穿着亮色T恤的旼炡，看上去需要围裙。等一下、旼炡啊，围上这个再继续吧。知珉站在旼炡身后，摊开白色围裙，在她的腰间系上绳子。旼炡正在处理鲑鱼，随着头部前倾，散落的头发不知道妨碍了多少次。</p><p class="story-paragraph dialogue">「...给你扎头发吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">旼炡向后伸出了左手。知珉摘下缠在手腕上的发圈，把旼炡的头发绑成漂亮的马尾。肩线下泛起波浪的金色马尾轻轻飘逸。扎好了，看下这边吧？旼炡犹豫地转身，对上自己的视线。白色围裙配上马尾，好可爱、好可爱，比想像中可爱了不止一点。</p><p class="story-paragraph dialogue">「怎么办，好可爱...」</p><p class="story-paragraph">知珉忍不住紧搂旼炡的肩膀，用脸蹭她圆呼呼的脸颊。干什么啊，我不是在处理这个嘛。旼炡似乎是对&quot;可爱&quot;一词感到害羞，将身体挪开继续手上的动作。</p><p class="story-paragraph dialogue">「...虽然像个小厨师，但还是有模有样的」</p><p class="story-paragraph dialogue">「如果要在我背后一直那样的话，干脆来帮忙吧」</p><p class="story-paragraph dialogue">「知道了」</p><p class="story-paragraph">知珉穿着另一件围裙站在旼炡身边，旼炡看了一下自己身后说。头发也要扎起来，像我一样。还这样干涉了小帮手的造型。虽然心里想有必要正式到这种程度吗，但知珉还是按照旼炡的说法，撩起头发扎了起来。</p><p class="story-paragraph dialogue">「旼炡啊，要不要切这个鱼？」</p><p class="story-paragraph dialogue">「嗯，好」</p><p class="story-paragraph dialogue">「现在要不要撒胡椒？」</p><p class="story-paragraph dialogue">「嗯，胡椒放在那里了」</p><p class="story-paragraph dialogue">「该怎么办？就撒一点吗？」</p><p class="story-paragraph dialogue">「适量」</p><p class="story-paragraph dialogue">「好难啊...适量...？」</p><p class="story-paragraph dialogue">「不管怎么说，在助手的帮助下，还是感觉比较轻松」</p><p class="story-paragraph dialogue">「我是你的助手吗？」</p><p class="story-paragraph dialogue">「我是主厨，姐姐当然是助手了。有什么不满吗？」</p><p class="story-paragraph dialogue">「…没有不满。就当是那样吧」</p><p class="story-paragraph">知珉作为小帮手十分尽力。在烤鲑鱼排的旼炡旁边切生鱼片，连摆盘都很认真。无论什么事情，只要让她做，就会认真去完成。做着做着，渐渐连食物的颜色都开始讲究起来。自称今日主厨的旼炡还纳闷助手到底在做什么需要那么久，每隔3分钟就往自己这边探头。</p><p class="story-paragraph dialogue">「现在在做什么？」</p><p class="story-paragraph dialogue">「摆盘」</p><p class="story-paragraph dialogue">「是要拍照吗？」</p><p class="story-paragraph dialogue">「不是，只是既然要吃，能看起来漂亮不就更好了吗。这就是格调」</p><p class="story-paragraph dialogue">「那只是白花时间而已嘛，进到肚子都一样的东西」</p><p class="story-paragraph dialogue">「不一样」</p><p class="story-paragraph">知珉无视主厨的牢骚，仔细看着即将装饰完毕的鲑鱼沙拉。好奇怪啊，明明快摆完了，怎么感觉空了这么多。明明自己把鲑鱼和起司拼成一个没有空隙的圆，围了起来。如果不是错觉，摆盘的部分材料肯定是消失了。证据就是，鲑鱼的数量明显比起司少。鱼不会自己逃跑，这么说来，唯一值得怀疑的人是。</p><p class="story-paragraph dialogue">「…金旼炡」</p><p class="story-paragraph dialogue">「干嘛？」</p><p class="story-paragraph dialogue">「你吃了我切好的生鱼片吗？」</p><p class="story-paragraph dialogue">「...没有啊？」</p><p class="story-paragraph dialogue">「那为什么刚才有10块，但现在有两块消失了呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「到底去了哪里呢？是因为鲑鱼自己长脚跑掉才消失的吗？」</p><p class="story-paragraph dialogue">「我不知道啊」</p><p class="story-paragraph dialogue">「你过来」</p><p class="story-paragraph dialogue">「把刀放下来再说吧，好可怕啊」</p><p class="story-paragraph">死不承认的旼炡继续烤着鱼排，一靠近她就急忙躲开视线。平时就圆圆的脸蛋，现在感觉更加圆润，当然绝对不是长胖了。就像仓鼠为了冬眠而藏起一堆橡子，旼炡的脸颊鼓起，任谁看了都觉得可疑。那里面一定装满了刚才用心切好的生鱼片。</p><p class="story-paragraph dialogue">「小偷就在身边呢。做坏事也得擦屁股啊，傻瓜」</p><p class="story-paragraph">知珉拉了拉她的脸颊肉，惩罚了生鱼片小偷。可能是还在偷吃东西，旼炡含含糊糊地让自己快放手。所以说为什么不吃切好让她吃的，硬是吃别人准备精心摆盘的东西。不管怎么说，在东西被吞下肚之前抓到了犯人，真是幸运。</p><p class="story-paragraph">虽然发生了小插曲，但第一道菜的结果相当成功。一盘是旼炡烤的三文鱼排。还有一盘是知珉发挥高度集中力摆盘的鲑鱼生鱼片沙拉。其他还有鱼子酱香蒜面包和各种小菜，这些东西让餐桌看上去十分豪华。由旼炡先吃了一口，眼睛立刻睁大边说道。虽然是我自己做的，但是真的很好吃，快尝尝看。</p><p class="story-paragraph dialogue">「真的欸，比想象中好吃多了」</p><p class="story-paragraph dialogue">「我不是说过吗？我没有搞砸过」</p><p class="story-paragraph">怀着一半期待、一半怀疑吃下肚的鱼排非常美味。可能因为刚出炉，所以感觉更是如此。总之，旼炡制作的鲑鱼排作为业余人士所做的料理，算是相当优秀。知珉点头表示贊同。多亏这些料理，两人心满意足地度过了用餐时间。</p><p class="story-paragraph">今天不喝我买来的酒吗？面对询问的旼炡，知珉搪塞说威士忌留到下次再喝吧。像现在这样兴奋的状态喝烈酒的话，一个人好像承受不来。结果，没有打开威士忌包装，两人相约下次再喝。而准备将剩下的食物放进冰箱时，看到已经空荡荡的饮料格，才想起早上拜托旼炡的跑腿。</p><p class="story-paragraph dialogue">「旼炡啊，你有买我说的冰茶吗？」</p><p class="story-paragraph dialogue">「嗯，有哦」</p><p class="story-paragraph dialogue">「放哪里了？冰箱里没有啊？」</p><p class="story-paragraph dialogue">「有啊」</p><p class="story-paragraph dialogue">「都说没有了，如果忘记了就老实说吧，我不会训你的」</p><p class="story-paragraph dialogue">「性格真急啊。请稍等一下，现在是甜点时间」</p><p class="story-paragraph">旼炡从冰箱拿出几个刚买的桃子，扔了过来。知珉满头问号问了旼炡。甜点时间是什么，还有什么东西吗？</p><p class="story-paragraph dialogue">「蜜桃冰茶」</p><p class="story-paragraph dialogue">「...蜜桃？」</p><p class="story-paragraph dialogue">「嗯，早上不是没吃水果嘛。现在吃吧」</p><p class="story-paragraph">旼炡准备了甜点时间用的蜜桃冰茶食谱，内容大致如下。把醃过糖的桃子切碎，放在锅里煮到松软，接着放入一个红茶包，依次倒入煮软的桃子和冰块，最后再放上一片新鲜的罗勒叶即可。</p><p class="story-paragraph dialogue">「...听上去好像很快就能完成了」</p><p class="story-paragraph dialogue">「这个10分钟就能做完，好像不需要助手」</p><p class="story-paragraph">旼炡叫自己坐着休息，便开始着手制作冰茶。不过虽然读过食谱，只见她的手停留在半空中，静止了几秒，看来脑袋运转还是超出负荷了。</p><p class="story-paragraph dialogue">「这次不用我帮忙吗？」</p><p class="story-paragraph dialogue">「因为很简单，一个人能做好」</p><p class="story-paragraph dialogue">「可是小锅里的桃子都快融化了...是这么做的吗？」</p><p class="story-paragraph dialogue">「不知道，我也是第一次尝试」</p><p class="story-paragraph dialogue">「那你早该让我帮忙啊，怎么一个人苦恼呢？让开一下」</p><p class="story-paragraph">知珉想尽办法救活软烂的桃子，拿起锅子不停扇风，将热气散去。虽然外表不是很好看，但是没问题。就像刚才谁说的，进到肚子里都是一样的。</p><p class="story-paragraph">旼炡把知珉救回的桃子直接倒入红茶中。知珉双手捧着杯子，眼睛直勾勾地盯着做好的冰茶。冰块一放上去，杯中呈现出淡粉的光泽环绕着橘红色，还真有蜜桃冰茶的味道。现在只剩下试喝了。</p><p class="story-paragraph dialogue">「我要开动了」</p><p class="story-paragraph">微尝一口，可能是因为加入了新鲜桃子，比平常买来喝的更为清新。明明不是那么甜，可就是不知为何感觉舌尖发甜。其实冰茶的味道很不错。金旼炡在短信中回答得那么没诚意，却独自计画好这样的惊喜。仔细想想，真是别有用心。</p><p class="story-paragraph dialogue">「不怎么样吗？怎么喝这么少？」</p><p class="story-paragraph">旼炡坐在正对面，满脸期待地等待冰茶的试喝评价。知珉摇晃着吸管，苦恼着该怎么表达。</p><p class="story-paragraph">为什么从刚刚开始全身上下都这么甜呢？为什么会像看电影一样激动呢？因为这突如其来的可爱礼物，自己从刚才开始就强忍住笑容 -然而坐在面前的那个人，仍然一无所知。</p><p class="story-paragraph">好不容易做好的冰茶却见自己爱喝不喝的，旼炡一边挠着后脑勺一边辩解。桃子好像煮太熟了、我也是第一次做这个...早知道就直接在超市买了。知珉面对不知所措的小厨师，故意皱起眉头说。</p><p class="story-paragraph dialogue">「太甜了」</p><p class="story-paragraph dialogue">「真的吗？甜到那种程度？」</p><p class="story-paragraph dialogue">「你试试看」</p><p class="story-paragraph">伸出吸管，她满面愁容地走过来。但在旼炡咬住吸管前，知珉立刻将吸管拿回自己口中。喝了一口甜甜的冰茶，旼炡的嘴无处可去，在冰茶上方静止。</p><p class="story-paragraph dialogue">「不是叫我喝吗，为什么拿走啊？」</p><p class="story-paragraph dialogue">「我没叫你用吸管喝」</p><p class="story-paragraph">知珉抬起手将旼炡的头拉近，嘴里剩下的冰茶直接推进她口中。很明显，当面对旼炡时，使出浑身解数已成为自己的习惯。因为想让旼炡知道自己从刚才就一直忍耐，所以知珉发脾气似地用力，近乎压着后脑勺般接吻。</p><p class="story-paragraph">随着时间流逝，舌头所触及之处全都散发甜甜的桃子香气。两人长时间唇舌相接，已分不清是谁在喝冰茶。等到紧贴的双唇分别，眼前旼炡的脸庞，是自己迄今为止见过最为鲜红的。</p><p class="story-paragraph dialogue">「怎么回事啊？你的脸完全变成桃子了呢」</p><p class="story-paragraph dialogue">「...干什么啊？」</p><p class="story-paragraph">知珉呆呆地欣赏起桃子、不对，是旼炡娇羞欲滴的脸庞。今天一直自信满满的小厨师，眼睛都忘了眨就只呆站着。不会是当机了吧。知珉轻按旼炡的脸颊边说。怎么僵住了？明明从几天前，就有人一直问我什么时候再亲亲。</p><p class="story-paragraph">独自受到时间暂停的旼炡，依然僵着身子。捉弄金旼炡难道会中毒吗？每当这种时候，都不想放过她，反而更想调皮地戏弄她。</p><p class="story-paragraph dialogue">「冰茶的味道怎么样啊？怎么不说话？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「今天变成傻瓜的不是我，而是旼炡呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...要姐姐再给你喂桃子吗？」</p><p class="story-paragraph">知珉故意轻轻挠着她的下巴说。这时旼炡才突然惊醒，结结巴巴地摆了摆手。不用、不用好吗？不用喂我，我自己吃就可以了。见她慌张的模样，终于忍不住爆笑出声。知珉开心地几乎快趴在桌上的时候，旼炡表情厌世将剩下的冰茶咕噜咕噜送入喉咙，然后向这边瞪了一眼，知珉耸了耸肩膀，看了回去。</p><p class="story-paragraph dialogue">「明明喝得好好的，干嘛瞪我」</p><p class="story-paragraph dialogue">「一点都不甜啊，谎话精」</p><p class="story-paragraph dialogue">「我喝起来很甜啊」</p><p class="story-paragraph dialogue">「好吧那就别喝了，我要把这些都喝完」</p><p class="story-paragraph dialogue">「那我就像刚才那样从你嘴里抢来」</p><p class="story-paragraph dialogue">「…今天是怎么了，真是的」</p><p class="story-paragraph dialogue">「因为你这种反应才更有趣啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">我这么好欺负吗。赌气的旼炡不再回答，背过身来。心满意足地享受了甜点时间的知珉，看到比预期中更好的反应，噗哧地笑了。不管怎么说，要让变红的脸恢复到原样，还需要一段时间。</p><p class="story-paragraph dialogue">「旼炡啊，做了这么多事情辛苦了」</p><p class="story-paragraph">知珉收拾完餐桌后，站在水槽前说。今天我来洗碗吧。躺在沙发上的旼炡赶紧凑上来，说要一起洗。橡皮手套也就一副，去客厅休息吧。不管自己说多少遍，旼炡就站在一旁，注视着冲洗盘子的自己。</p><p class="story-paragraph dialogue">「就洗个碗而已干嘛这样？好有负担啊」</p><p class="story-paragraph dialogue">「光是这样就感到负担了？明明羞耻的话都能厚着脸皮说出口」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「总之，今天把所有计划都做完了，我很满足」</p><p class="story-paragraph dialogue">「骗人，明明你只去了超市就回来了，哪儿都没逛到」</p><p class="story-paragraph dialogue">「没骗人啊，真的都做完了」</p><p class="story-paragraph dialogue">「计划是什么？做料理吗？」</p><p class="story-paragraph dialogue">「首先吃到了鲑鱼」</p><p class="story-paragraph dialogue">「今天吃得开心，明天我给你买好吃的」</p><p class="story-paragraph dialogue">「接着让姐姐吃了早上没吃的水果」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「然后是让姐姐心情好起来」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph">若无其事地从嘴里传来的感人话语，让知珉心头一软。要不是正在洗碗，我一定会紧紧抱住你。</p><p class="story-paragraph dialogue">「所以我现在因为你，心情有变好了吗？」</p><p class="story-paragraph dialogue">「没有吗？好像变开心了啊？」</p><p class="story-paragraph">刘知珉今天的计画是练瑜伽，然后看玩具总动员。但是，由于旼炡突然闯入，今天的计划完全告吹，还发生了很多乱七八糟的事情。想忘掉坏的记忆，其实只要做到最后一步骤“创造新的幸福记忆”，就能有充分的效果。因为这些欢声笑语，清晨的噩梦不知不觉间，已变得模糊不清。</p><p class="story-paragraph dialogue">「没错，心情好起来了」</p><p class="story-paragraph dialogue">「是吧，所以我才说必须摄取蛋白质嘛」</p><p class="story-paragraph dialogue">「是啊，你说得都对」</p><p class="story-paragraph">你想怎么做？</p><p class="story-paragraph">如果有人那样提问的话，</p><p class="story-paragraph">我该怎么回答才好。</p><p class="story-paragraph">希望每天都像今天一样开心幸福，</p><p class="story-paragraph">希望能继续过这种可爱的日子 。</p><p class="story-paragraph">再怎么可怕的噩梦，</p><p class="story-paragraph">只要你在身边一起度过，如同上天馈赠般。</p><p class="story-paragraph">对我来说那就足够了吧。</p></div>
      </section></template>

          <h3>웃어주세요</h3>
          <div class="lyric-lines"><p class="lyric-line stanza-break">나를 보며 웃어주세요</p>
<p class="lyric-line">혹시 내 두근거리는 소리가</p>
<p class="lyric-line">너무 크진 않죠</p>
