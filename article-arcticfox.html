        <aside class="ost-card" aria-label="本章配乐歌词">
          <h3>Magic</h3>
          <div class="lyric-lines"><p class="lyric-line stanza-break">의미 없다고 다들 말해도</p>
<p class="lyric-line">이렇게 내 슬픈 기분은 다 날아가</p>
<p class="lyric-line">누구도 예상 못한 일 투성이고</p>
<p class="lyric-line">그럴 땐 그냥 흘러가면 돼</p>
<p class="lyric-line stanza-break">就算大家都说没有意义</p>
<p class="lyric-line">就这样我悲伤的心情全都飞走了</p>
<p class="lyric-line">谁都无法预料的事情很多</p>
<p class="lyric-line">到那时候顺其自然就行了</p></div>
        </aside>
        <div class="chapter-copy"><div class="location-badge"><strong>K O R E A ：A I R P O R T</strong><span>韩国机场</span></div><p class="story-paragraph dialogue">「你要我怎么办？」</p><p class="story-paragraph">饱含不满情绪的声音，把周围的视线全集中过来。</p><p class="story-paragraph dialogue">「这种话在上飞机前才说，要我怎么办？」</p><p class="story-paragraph">知珉不得不咬紧牙关加快脚步。虽然不想在机场的手扶梯上吵架，但距离登机只剩下10分钟左右。都怪和明俊的通话时间拉长，如果不跑起来就要错过飞机。</p><p class="story-paragraph">明俊对知珉来说可以说是最重要的人。从20岁到现在交往快两年，是个大五岁的上班族男友。不过大概在交往一年左右，他为了工作去到伦敦，自然而然开始异地恋。简而言之，两人交往的时间有一半都是分开的。</p><p class="story-paragraph">为了迎接今年冬天即将到来的两周年纪念日，知珉下了很大的决心，买下前往伦敦的机票。她认为越是习惯远距离，如果在这个时间点无法见面，两人的关系好像会就此停滞。其实自己因为即将重逢而十分兴奋，所以提前了3小时左右来到了机场。刚才在免税店买的情侣香水还满怀诚意地抱在怀中，结果突然被对方碰了钉子，不由得发怒。</p><p class="story-paragraph dialogue">「怎么办，因为我突然被派去长期出差所以」</p><p class="story-paragraph dialogue">「所以？」</p><p class="story-paragraph dialogue">「我们见面可能要延后」</p><p class="story-paragraph dialogue">「那是要多久？」</p><p class="story-paragraph">一个月左右…明俊在电话那头简短地回答。因为他的重复辩解，自然皱起眉头。 你说的这像话吗？这是情况有所改变嘛。虽然不想感情用事，但也做不到假装冷静。不晓得是不是刚才喝的饮料逆流上食道，感觉头晕目眩。这时，视线投向机场正中央的时钟，怒气未消，但搭机时间却越来越紧迫。</p><p class="story-paragraph dialogue">「先挂了，等我到了再联系」</p><p class="story-paragraph">知珉不能平白浪费机票钱，用力按下结束通话按钮，猛力跑了起来。虽然跑起来算快，想尽可能挽回，但现在来说被毁约的现实才是问题。听见男友传来的悲惨消息，还一手拿着要送他的礼物，在机场内奔跑。该怎么办、真的。这是足以让人发火的情况吧。</p><p class="story-paragraph">就这样，在机场广播中传出刘知珉、刘知珉，三个大字被清清楚楚念了几遍后，知珉才作为最后一位乘客上机。倒数第一的乘客在进入机舱的过程中，周围不满的视线不免射向自己。座位在哪来着？是靠窗还是靠走道？好像是靠窗那边。确认走道座位上坐着人，身体向内靠近。</p><p class="story-paragraph dialogue">「抱歉，我进去一下」</p><p class="story-paragraph">知珉顾不得其他乘客的目光，有条不紊移动起身体。先是把包放上，因满身大汗脱下牛仔外套，接着放进行李舱内。平复自己急促的呼吸，坐进座位，不知为何感觉万事都变得烦躁起来。</p><p class="story-paragraph">今天，我只是期待着今天而已。但现在是什么情况？又不是浪漫喜剧中的悲情女二。抵达伦敦后，我能不能待在没有他的家，一个月后是否能见面，会不会又太忙而产生其他事情，一切都不明确。早知如此，还不如在休学期间去打工，到圣诞节再过来。因各种杂念头晕脑胀的知珉，迅速系上安全带，将头靠在椅背上。</p><p class="story-paragraph">就算想抓住明俊远在伦敦的领口，至少也得过上半天。甚至偏偏不是直航班机，为了省钱所以还必须转乘。飞机会先飞往芬兰的赫尔辛基，知珉必须停留两个小时，再转机前往最终目的地伦敦。在漫长的旅程即将到来之际，身体已经开始疲惫，但依然无法改变需要在狭窄的空间度过10小时的事实。10个小时呢，眼皮不由自主变得沉重，照着自己的想法，可能可以就这样一直睡下去。</p><p class="story-paragraph">就这样睡吧，睡吧。</p><p class="story-paragraph dialogue">「那个」</p><p class="story-paragraph">不知怎么感觉身边有什么在扭动，但精神已经放电的知珉无视那动静，继续闭着双眼。</p><p class="story-paragraph dialogue">「…那个」</p><p class="story-paragraph">最终，她轻轻睁开眼睛，再次听见了清脆的声音。声音的主人无论怎么看最多只有20岁初头，也就是和自己差不多同龄的女孩。金色的头发，白皙的脸蛋，虽然穿了件大号的毛衣，但可以预想到她体型瘦小。她用与可爱的外貌不相称，有些木讷的表情，睁着圆圆的眼睛看向这里。会不会比20岁更小呢，是高中生吗？在神游时，陌生人指了指下面，让她向下看。</p><p class="story-paragraph dialogue">「你的安全带好像系在我座位这边了」</p><p class="story-paragraph">怎么可能。知珉慌忙低下头，直视自己犯下的失误。10秒前随手拿起安全带，系在很紧的地方，到底是多混乱才会将安全带系在隔壁座位上呢。她惊慌地捋了下头发，急忙道歉。</p><p class="story-paragraph dialogue">「看我糊里糊涂的，对不起」</p><p class="story-paragraph">慌张地把安全带重新系上，这是知珉今天第二次被现实击倒。今天运气不好也是情有可原，但何必连这种丢脸的事情也跟着一起发生呢。她摇了摇头，只希望快点出发，机内的灯能赶紧熄灭。但是没有办法，紧坐在隔壁只有过一次对话的人，总进入自己眼里。女孩默默系好安全带，开始挑选电影。</p><p class="story-paragraph">见她如此，也想着趁睡着前也看看电影吧，时间过去自然就会有困意了。这么想，有没有动画电影是幸福且充满可爱角色的呢。正好推荐目录出现玩具总动员最新作品，知珉毫不犹豫按下播放按钮。</p><p class="story-paragraph">玩具总动员系列大多是可爱又明朗的内容，但最新作却出乎意料地以悲伤的离别场面拉开序幕。一开场就是牛仔胡迪与女友牧羊女分手的场景，为什么一开始就像不祥之兆一样分手了呢？即便不是悲伤的电影，但知珉算是爱哭的类型，进入状况的她，眼泪仿佛快要流下来。可是旁边还坐着不认识的人，不想无缘无故突然抽泣，深思熟虑后决定换部新的。比玩具总动员更欢快的迪士尼电影，阿拉丁。</p><p class="story-paragraph">虽然已经看过，但就再看一次吧。</p><p class="story-paragraph">由于集中注意力在电影上，比起发呆时间也过得更快。很快，乘务员就推着推车开始询问机内用餐的菜单，知珉选择了简单的牛排，在长途飞行中吃的飞机餐有些陌生。</p><p class="story-paragraph">喝杯红酒能睡得更好吗？在犹豫着要不要点酒时，隔壁又传来了动静。小手反复把耳机戴上又拿下了三、四次，知珉愣愣地看着陌生同伴的动作，虽然不太清楚，是音响出问题了吗。一抬头叫来了外国的乘务员，来到座位旁。</p><p class="story-paragraph">可以给我一杯红酒吗？然后帮旁边看一下耳机吧。应知珉要求，乘务员亲切地帮她换了副耳机，女孩眼神中带着慌张和感激，向自己点头表示感谢。知珉也简单地向她点头致意，接着又将视线转向电影。画面中扮成精灵的威尔史密斯正在和阿拉丁一起唱着欢快的歌，重新再看一遍也觉得拍得很好，迪士尼就是这个味道。 然而还没进入状况，隔壁播放的画面就进入眼中。相貌可爱的邻座旅客，津津有味地看着自己连10分钟都嫌多的枪战动作电影。</p><p class="story-paragraph">她喜欢这种类型的吗？从女孩的耳机中仿佛能听见战斗场面逼真的声音。杀时间用的动作电影。虽然不想去想，但脑中自然而然想起在韩国约会时，每次明俊挑了不符自己喜好的类型，无论如何都会说服他看其他电影，那也是很久以前的事了。</p><p class="story-paragraph">爱情电影、约会、伦敦、礼物、2周年…怎么也不愿继续去想脑中浮现的事情，为了在机内熄灯之前拍张自拍，翻了翻口袋拿出手机。如果是平时，飞机餐会拍一张、机场内也会多拍几张，但自己忙得晕头转向，结果一张都没有留下来。嗯，反正在飞机上拍个100张就行了。正当她忙于留下纪念照时，不晓得自己转来转去调整角度，侵犯到隔壁座位的空间。这时才发现不知打哪来直勾勾的视线，知珉感受到今天第三次的羞耻瞬间。</p><p class="story-paragraph">与咯吱咯吱嚼着飞机餐饼干的脸正面对上时，知珉马上尴尬了起来。就是说，这名陌生旅客用着“不但最后一个上飞机给大家造成麻烦，腆着脸给不认识的人拿来耳机，接着突然在旁边自拍起来，真是第一次看到这种戏精”的眼神盯着这边。 女孩没有移开眼，摘下耳机挂在肩上，从耳机传来碰碰枪声也随即停止。知珉低下头，本以为会听见要她安生点的抱怨，但那张小嘴说出的话却出乎意料之外。</p><p class="story-paragraph dialogue">「是上过H高的刘知珉前辈、对吗？」</p><p class="story-paragraph">谁啊？</p><p class="story-paragraph dialogue">「啊、没错，你认识我吗？」</p><p class="story-paragraph dialogue">「我也读的H高，比你低一年级」</p><p class="story-paragraph">是后辈啊？ 但是完全对她的脸没印象，仔细回忆那几年的周边人物，知珉不知道会不会失礼，小心翼翼地问道。</p><p class="story-paragraph dialogue">「不过我们认识…吗？」</p><p class="story-paragraph dialogue">「不认识，只是见过一次面，吃午餐、就一会儿」</p><p class="story-paragraph">啊~了一声，知珉只是表现出突然想起来的样子。事实上，只听了这些依然没有头绪。长得这么可爱的孩子，应该会有印象啊，怎么完全想不起来。谁啊？谁啊？ 她是谁呢？</p><p class="story-paragraph">知珉算是非常有名，在高中舞蹈社属于领导人物，也就是不但进行了社团活动，重要的对外活动也都有参加，因此在校内名声十分响亮。更何况还是学校校服模特，即使全校学生都认识也不为过，而且在社交平台上也非常活跃，在周边学校也有所传闻，甚至有人因此前来参观。所以这种“自己突然记不起来”的状况也挺多。几乎都是一面之缘都没有的同学、前辈、后辈、隔壁学校、隔壁小区认识的人、或看过Ins后第一次搭话的人而已。不管怎么说虽然很抱歉，但那种小小的会面场合自己当然不会记得。</p><p class="story-paragraph dialogue">「对不起，我记忆力真的不太好，有点模糊」</p><p class="story-paragraph dialogue">「不是的，是因为姐姐很有名」</p><p class="story-paragraph">不记得了当然也情有可原。邻座的孩子第一次露出撇了撇嘴的表情。你叫什么名字？正想询问时，孩子客气地打起招呼。话说回来，刚才谢谢了。接着立刻站起来打开行李，从大得装得下自己的背包内拿出笔记本电脑等东西。原本静静坐着的知珉怕东西掉落下来，直接站起来帮她抓着行李。两人一阵折腾，重新回到座位上的瞬间，机内照明灯像等待着两人一样，同时熄灭。电脑在黑暗的机舱内打开，人造光反射到白皙的脸庞。知珉下意识看向发着光的地方，画面上出现了叫 Kim Min Jeong的名字，以及密码输入栏。</p><p class="story-paragraph">金旼炡。</p><p class="story-paragraph">或许是电脑的主人，也是身旁孩子的名字。知珉瞥了眼旼炡的侧脸，总觉得像小动物一样的洁白脸蛋十分可爱。接着白皙修长的手指开始敲打键盘，消瘦的手腕跟着映入眼帘。身体一定也很瘦吧。与机内餐吃得干干净净的自己不同，旼炡没吃多少就收掉了，连饼干都剩了下来。</p><p class="story-paragraph">不过她拿电脑做什么呢？不知不觉，知珉的注意力已经转向旼炡。之所以有这种想法，不是因为不想去想可恶的明俊，也不是无法集中精神在看第二次的阿拉丁上，而是因为好奇在彼此紧紧相连的狭小又黑暗的飞机上，突然表示是高中后辈的孩子，突然开始要做些什么。</p><p class="story-paragraph">旼炡的电脑桌面是灿烂的极光照片，打开一个文件夹，眼前哗啦啦闪过的，看起来是各个都市的住宿照片和旅游信息。芬兰、瑞典、挪威、丹麦、冰岛。虽然用哗啦啦闪过来形容的话，自己好像又看得太仔细，这是私人的内容，是不是有点太明目张胆了。但不到3秒，又再次被华丽的风景照所吸引。本忍着不去搭话的知珉，装了装样子先开启话题。</p><p class="story-paragraph dialogue">「看来你要去北欧旅行啊」</p><p class="story-paragraph">旼炡往旁边看了一眼，神色间没有任何感到不便并回答道。</p><p class="story-paragraph dialogue">「…是的，大概一个月」</p><p class="story-paragraph dialogue">「还挺久的啊，这是哪呀？」</p><p class="story-paragraph dialogue">「是冰岛」</p><p class="story-paragraph dialogue">「哇，真漂亮」</p><p class="story-paragraph">没有再次提问，说出口的是简单的感叹，旼炡重新补充道。</p><p class="story-paragraph dialogue">「去看极光，因为是我的愿望清单之一」</p><p class="story-paragraph">既简单又适当的原因。一提到冰岛就会想到极光，明俊也曾说过，总有一天要去冰岛度蜜月，说想在浪漫的地方试试感受特有的经历。对于大学生知珉来说，度蜜月还有距离，只记得当时附和着说太好了。</p><p class="story-paragraph">对知珉来说旅行是甜蜜的梦，因为是远距离恋爱，更需要两人共同的期望和目标，每当这时知珉就会和明俊讨论海外旅行的事。 就算现在分隔两地，只要在那里见了面就没问题了一样。 冰岛也是两人幸福路上的素材之一，但排除明俊的存在，冰岛对知珉就是另个世界，非常远、非常冷的地方。</p><p class="story-paragraph">知珉单手轻轻晃动红酒杯。那样冰天雪地，会不会有什么可爱的小动物呢？北极狐住在那里吗？看着邻座的孩子，自然而然联想到与她相像的某种动物。彷佛找到了模糊的答案，知珉轻叹。</p><p class="story-paragraph">北极狐。</p><p class="story-paragraph">没错，长得像北极狐。</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「啊、没事，自言自语而已」</p><p class="story-paragraph">稍微失神的知珉赶紧进入社交模式，接续对话。说自己要去伦敦见男朋友，没想到他突然出差，一个月就这样全毁了。所以必须想想这么长时间，自己在伦敦要做什么。接着说很羡慕能去北欧旅行，一定很有趣，自己总有一天也想去冰岛看看。旼炡听了她令人惋惜的情形，时不时点点头。</p><p class="story-paragraph dialogue">「不过你是自己一个人去吗？」</p><p class="story-paragraph dialogue">「是一个人去」</p><p class="story-paragraph dialogue">「太厉害了，我从来没有独自旅行那么长时间」</p><p class="story-paragraph dialogue">「反正姐姐现在也要在伦敦独自生活一个月了」</p><p class="story-paragraph dialogue">「…是啊、是这样没错」</p><p class="story-paragraph">旼炡的一句话把情况都整理得清清楚楚。事实上自己也要独自度过一个月，没时间光傻呵呵笑着夸赞身旁的朋友。刘知珉决定立刻开始制定明天的计划，一到目的地是要哭哭啼啼，还是装作若无其事轻松度过一个月。</p><p class="story-paragraph dialogue">「真的很突然，除了男友我在伦敦没有一个认识的人」</p><p class="story-paragraph dialogue">「我也是第一次」</p><p class="story-paragraph dialogue">「出国旅行？」</p><p class="story-paragraph dialogue">「像这样长时间的旅行，只有和朋友去过短期的」</p><p class="story-paragraph">旼炡表示自己和知珉一样正在休学中，为了筹备资金长时间都在打工，真的很舍不得旅行就这么取消，所以就贸然地打包好了行李。真厉害，知珉不禁喃喃自语，我从来没想过要独自背包旅行，虽然看起来小小的，但是很了不起啊。</p><p class="story-paragraph">空气中的尴尬逐渐飘散，熟悉了机舱内地昏暗，随着几句简短的对话慢慢放松下来，旼炡朦胧的面孔慢慢在黑暗中变得清晰可见。不单是长得圆润，睁着眼的样子意外的十分犀利，知珉这么想着，也向旼炡传达了注意身体的问候。</p><p class="story-paragraph dialogue">「带来的行李也特别大，路上小心，别把护照和其他东西弄丢了」</p><p class="story-paragraph dialogue">「…其实」</p><p class="story-paragraph dialogue">「其实？」</p><p class="story-paragraph dialogue">「本来就不是想自己一个人去的」</p><p class="story-paragraph">简短的对话到了应该结束的时候，突然蹦出背后故事。是不是不应该触碰的主题呢，见她脸上的苦涩，知珉本想轻松结束话题，但接续的话却不只一句。</p><p class="story-paragraph dialogue">「现在回想起来，所有事都有点勉强」</p><p class="story-paragraph">无法辨认是开玩笑还是真心的调皮表情，旼炡摸了摸头。接着说出口的话荒唐至极。</p><p class="story-paragraph dialogue">「…不一起去吗？」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph">不晓得算不算幸运，如果当下正在喝酒，一定会呛到把葡萄酒全喷到前座。如果机舱内还有照明，一定会看见自己惊慌失措的模样。而不管身旁的人多么慌张，旼炡都事不关己接着说道。</p><p class="story-paragraph dialogue">「去北欧旅行啊」</p><p class="story-paragraph dialogue">「…和我？」</p><p class="story-paragraph dialogue">「刚才看你英语说的不错，感觉和姐姐一起出门应该挺舒服的」</p><p class="story-paragraph dialogue">「那個只是…」</p><p class="story-paragraph">要消化刚刚发生什么事需要一些时间，刚刚还腼腆不已的孩子，怎么突然那么唐突，刚才还盯着自己小心翼翼地打招呼呢。总之，与完全是陌生人的旼炡对话到现在也不过几小时，知珉十分惊慌。 丝毫没料到因好奇心开启北欧行话题后，故事会进展到这个地步。这样急速发展是什么啊？</p><p class="story-paragraph dialogue">「所以说，你是想和我一起旅行一个月的意思吗？」</p><p class="story-paragraph dialogue">「不是说时间过得很快吗？而且一个月时间也刚好」</p><p class="story-paragraph dialogue">「那个…虽然是这样没错…」</p><p class="story-paragraph dialogue">「做为参考，目前除了看极光之外，还没有其他具体的计划」</p><p class="story-paragraph">我也一样，在伦敦没有制定任何计划，但也没预计会听到这种突如其来的提议。和陌生人一起旅行，知珉想都没想过。当然和高中后辈坐在邻座也是十分偶然的事，要和她系错安全带进而进行对话的概率更是微乎其微。而这些事全都在一瞬间发生了，一个叫做金旼炡这样常见名字的女孩，就这么突然出现。</p><p class="story-paragraph">想想看吧下飞机时再回答我。简短说明之后，旼炡就像没事的人一样，盖上笔记本电脑，再次戴上耳机开始看电影。知珉脑内已经停摆，好几秒间只静静看着旼炡。</p><p class="story-paragraph">怎么能用什么事都没发生的表情重新看起电影呢，虽然她说认识自己，但对自己而言完全就是初次见面。虽然内心称赞她独自旅行很了不起，但突然觉得会很累、问自己要不要一起去。这孩子真好笑。让人如此手忙脚乱的孩子，一个人在陌生的地方待一个月没事吗？是不是谁应该跟着她一块去才行？我得跟着去才…</p><p class="story-paragraph">想到这里，应该要修改稍微脱节的部分。如果继续这么下去，她可能真的会对旼炡的提议点头。为了打起精神，剩下的时间还是睡觉好了。屏幕上显示的时间只剩下5个多小时，知珉暂时闭上眼睛。虽然在剩余的时间内打算什么都不做，但喝了不少红酒却毫无帮助，完全不能顺利入睡。</p><p class="story-paragraph">各处都亮起灯，人们从厕所进进出出，早餐拖车咯噔咯噔噪音响起。知珉配合着机上默认的起床时间，艰难地睁开眼皮。这还能算小睡一觉吗？在飞机上像这样失眠还是头一遭。好不容易阖眼一两个小时，却依然似梦非梦，时间就这么过去了。相反，旼炡倒是看完动作片就睡得很香，直到刚刚才醒来，轻轻松松又看起其他电影。</p><p class="story-paragraph">啊，完蛋了。</p><p class="story-paragraph">本来要针对明俊有什么可生气的应该写个剧本，但这珍贵的时间连觉都睡不好，完全耽误了。都是因为身旁突如其来提出荒唐提议的人。</p><p class="story-paragraph">知珉偷偷以埋怨的眼神斜视旼炡。根本不知道身旁是什么人就问要不要一起旅行？内心正在追究时，旼炡已经把时隔几小时的早餐推到一旁，要吃不吃的。又不吃了吗？对她这样子莫名担心，知珉不知不觉再次搭上话。只是因为心情不美丽、又突然被吵醒、加上一整天发生太多事情精神恍惚。</p><p class="story-paragraph dialogue">「就你这么吃饭，怎么有办法旅行一个月？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「量也不多，得全部吃掉才行啊」</p><p class="story-paragraph">对此，旼炡有些惊讶地转头。也不是朋友、认识的姐姐、妈妈，甚至不是同行的旅伴。想到自己进行了无故干涉，知珉赶紧将饭一口一口塞进嘴里。沉默了一阵，旼炡低声说了知道了，接着像挨了骂的孩子重新拿起餐具。</p><p class="story-paragraph">认识后进行第二餐的时间点十分微妙，莫名其妙的感觉。虽然吃得很认真，但饭好像不是进到胃里，而是跑到其他地方。什么啊，这都算什么。我刚才简直就像同行的人…像个监护人一样说话吧？怎么回事呢？</p><p class="story-paragraph dialogue">「…想好了吗？旅行？」</p><p class="story-paragraph">还想着什么时候问呢，该来的还是来了。</p><p class="story-paragraph dialogue">「姐姐要一起去吗？」</p><p class="story-paragraph">不不我不去，即使内心这么呐喊，但知珉依然没办法轻易说出拒绝的话。旼炡在飞机的走道上不停被挤来挤去，这虽然也是借口，但最重要的，是那张脸。</p><p class="story-paragraph">算是迟来的TMI，说实话，知珉对这样的脸的没有抵抗力。特别是面对又小又可爱、白白的小生命，已然奄奄一息。虽然并没有看起来那么矮，但总而言之，对特别喜欢可爱东西的知珉来说，在这重要的瞬间成为致命的弱点。再加上用稚嫩的嗓音亲切地喊着姐姐、姐姐，也起到一定作用。最终，知珉在自己为何说不出“NO”的辩解中，传来了机长广播。</p><p class="story-paragraph dialogue">-我们的班机即将降落在赫尔辛基班塔机场，请各位旅客入座并系上安全带。</p><p class="story-paragraph">看来今天天气十分晴朗，和煦的阳光照了进来。旼炡把问她要不要一起去的问题放一边，转过头开始看起窗外的风景。地面上的小小建筑越来越近，这是北欧的上空。旼炡睁大双眼，向窗外全神贯注，知珉只能静静看着那突然向前探过来的黄色头发。真有点无语，你、好像刚问完我很重要的问题，不集中下注意力，只看着窗外吗？</p><p class="story-paragraph">不知不觉长长的跑道近在眼前，随着哐哐声，飞机轮子落地传来巨大声响。同时间，手机开始震动，告诉人们通讯服务已经开始。之前收不到的联系一下子全出现在通知栏里，很遗憾的，其中还有来自明俊的消息。</p><p class="story-paragraph dialogue">-对不起知珉啊，真的抱歉</p><p class="story-paragraph">以此为开头的句子。第一行就是道歉，征兆实在不太好。现在就开始血压上升可不行，知珉深深叹了口气，接着往下读。</p><p class="story-paragraph">辩解的字句很长，概括起来如下。为了调整日程和老板讨论了很久，但看来是无法调整了。自己认识的妹妹也在伦敦，如果无聊的话可以一起玩，虽然工作比较忙但晚上还是可以联系，再撑一段时间快点见面吧，再久也就剩一个月而已。</p><p class="story-paragraph dialogue">「哈…」</p><p class="story-paragraph">只能干笑一下，最后一句话简直挖空自己的心。只要互相再坚持一下就好了，再久也就一个月而已。这种类型的话真的讨厌的要死，这几天一直在为要来伦敦而兴奋不已的自己简直像个傻瓜。因为想见在海外努力工作的上班族男友，而闹脾气的大学生女友。对明俊来说这就是现在的知珉。知珉努力控制自己的呼吸，直到飞机完全停下来为止，好像有什么情感快要爆发。</p><p class="story-paragraph">安全带的灯一熄灭，乘客们纷纷开始搬起行李。从座位上站起来的旼炡二话不说把行李拿出来，知珉见旼炡就这么搬起比自己更大的行李，放下原本想帮忙的手。 不久，她若无其事背起背包的背影映入眼帘。无论如何，现在已经抵达，在飞机上的等待时间已经结束。知珉紧跟着忙碌地准备下飞机，迅速穿上叠好的牛仔外套，拿起放在前排椅背的香水。头晕脑胀，事情好像经过了一整天又被重置，什么都没有发生的感觉。踏上陆地后又回到现实了吗？但现实中却依然什么事都没有解决。旼炡在这之后没说一句话，就只是像个陌生人一样转过身站着。身材纤细的旼炡被那像墙壁一样的巨大背包挡住，看不清楚。</p><p class="story-paragraph">知珉慢慢转过头来，有点空虚。虽然，那时只想着去伦敦的刘知珉，记不得说是自己后辈的旼炡。两人也没有交换联系方式，就这么结束了吗？难到她只是开玩笑而已吗？有人因为难以拒绝还失眠了呢。真正到达之后，却收到男友发来的长讯息写着亲爱的对不起，样子十分悲惨。至少现在看来，自己就是世界上最不像话的人。</p><p class="story-paragraph">只想好好休息。</p><p class="story-paragraph">总觉得和搭上飞机时有某种既视感，知珉拖着身体前往入境处。</p><div class="location-badge"><strong>F I N L A N D ：A I R P O R T</strong><span>芬兰机场</span></div><p class="story-paragraph">前往换乘登机口的走廊特别长，入境审查总是疲惫的关口。知珉连要转机往伦敦该往哪个登机口的想法都没有，只是望向地面。在无尽的等待中，不知从哪传来了呼喊自己名字的声音。</p><p class="story-paragraph dialogue">「那个、知珉姐姐」</p><p class="story-paragraph">比一开始稍微熟悉了的清脆嗓音，还以为她自己一个人走了，旼炡就这么站在那。和刚下飞机时一样，肩上背着个大背包，在充满陌生语言的机场中央，知珉再次站在旼炡身边。感觉很重啊应该先放下来的，表情怎么像做错事的小狗一样呢，害我有种做错什么的感觉。</p><p class="story-paragraph dialogue">「好像没睡好，还好吗？」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「不是我一直看电影吵到你了吧？」</p><p class="story-paragraph">只是因为你表情不太好有些担心，我因为姐姐在身边一直很放松。旼炡这么说着，一边递出从韩国带来的，一种大叔宿醉时喝的疲劳恢复剂。</p><p class="story-paragraph dialogue">「总之，如果因为我而没能好好休息的话，很对不起」</p><p class="story-paragraph">这话是什么意思、知珉感觉到目前为止所有疲劳倒是有些消退，笑了出来。不是因为感到堂皇，而是无法理解多次唐突之后，又变得小心翼翼的旼炡。</p><p class="story-paragraph">以及她说的“还好吗？”那句话，或许是今天第一次听见的安慰，并非从期待的人那里听到，而是一个陌生的人嘴中说出口，有些奇怪。因着那句算不上什么的话，气都消了，心情也像纸张翻过页一样好了起来，真的很奇怪。</p><p class="story-paragraph dialogue">「说要一起旅行也是半开玩笑的，你不会…」</p><p class="story-paragraph">突然间产生了毫无根据的自信心，也许没关系，说不定是绝妙的命运。知珉用自己都无法解释的心情看着旼炡，眼前那张呆呆的脸露出不知所措的表情，轻轻摸着自己后脑勺。</p><p class="story-paragraph dialogue">「半开玩笑？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「说什么呢，我现在才打算正式回答而已」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「要一起去旅行吗？ 旼炡啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「我一次也没去过北欧，就像你说的，一个月的时间绰绰有余」</p><p class="story-paragraph">知珉没有给旼炡回答的机会就接着说。而且很危险不是嘛，你说你是第一次独自一人旅行，所以有点担心。</p><p class="story-paragraph dialogue">「然后最后，跟你一起去的话，感觉会很有趣」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「结束了」</p><p class="story-paragraph dialogue">「但是…等等、等一下」</p><p class="story-paragraph">旼炡本就圆圆的眼睛睁得更圆，表情看来像死也不能理解。姐姐你不是不认识我吗？怎么知道我的名字的？那充满疑惑的脸蛋太过可爱，知珉再次爆笑出声。</p><p class="story-paragraph dialogue">「啊、对不起，你登入电脑时不小心看到名字了」</p><p class="story-paragraph dialogue">「…真的吗？」</p><p class="story-paragraph dialogue">「别那么惊讶」</p><p class="story-paragraph dialogue">「有点不太好吧，在别人登入电脑时偷看」</p><p class="story-paragraph dialogue">「不是故意看的，只是刚好就坐在旁边…」</p><p class="story-paragraph">明明说不知道是谁、明明说记不得了，却清楚知道自己的名字，这似乎对旼炡造成不小的冲击。如今听到自己说要一起旅行，旼炡忽然像个坏心眼的孩子一样，揪住自己手中的护照并打开。光看表情都知道她在想什么。期间，知珉对于自己对她的每个行动都感到有趣，好像有些缺心眼。</p><p class="story-paragraph dialogue">「未经许可就随便看别人的护照？」</p><p class="story-paragraph dialogue">「姐姐不是也未经许可就看我的电脑吗？」</p><p class="story-paragraph dialogue">「干嘛那么目不转睛的看别人护照，给我」</p><p class="story-paragraph dialogue">「…生日是411呢，000411」</p><p class="story-paragraph dialogue">「很容易记吧，三个零加四一一」</p><p class="story-paragraph dialogue">「也不怎么样啊」</p><p class="story-paragraph">撇撇嘴耸了耸肩，旼炡的侧脸再次让自己笑了起来。很可爱但很无语，不对顺序错了，是虽然很无语但很可爱。</p><p class="story-paragraph dialogue">「听了我的生日绝对忘不掉的」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「虽然名字很普通，但生日这点真的很独特」</p><p class="story-paragraph">炫耀般的姿态令人发笑，是能出生在多特别的日子啊。</p><p class="story-paragraph dialogue">「所以是什么时候？」</p><p class="story-paragraph dialogue">「010101」</p><p class="story-paragraph dialogue">「骗人」</p><p class="story-paragraph dialogue">「百分之百真的」</p><p class="story-paragraph dialogue">「给我看你的护照」</p><p class="story-paragraph dialogue">「才不要」</p><p class="story-paragraph">刚成为同伴的两人距离更贴近，知珉在旼炡身后帮忙分担她背负的重担，慢慢挪动脚步离开登机口。</p><p class="story-paragraph">再次踏上陆地后，现实的问题依然没有解决，现在发生的一切都像梦一样，不过在一旁一起踏出脚步的旼炡，轻盈的步伐正说着这不是梦。知珉配合她的步伐，走得更加轻快。心情并不坏，不，或许其实挺激动的。</p><p class="story-paragraph">就这样，知珉开启了人生第一次与计划之外的人、进行计划之外的旅行。</p></div>
      </section></template>

          <h3>나 요즘</h3>

<p class="lyric-line">나도 좀 그래</p>

<p class="lyric-line">心里变得有些痒痒的</p></div>
        </aside>
        <div class="chapter-copy"><p class="story-paragraph">知珉天生就备受关注。要说是周围的环境造就了刘知珉的后天性格也不为过。即使安静地走着，也能成为热门话题，她也自然而然做出与之相应的行为。在不知不觉中，知珉也被归类在某种类型的人。</p><p class="story-paragraph">只是每个人天生性格不同。到上中学为止，自己一直对人们的视线感到负担，甚至一整天都在心烦。天生的敏感性格与十分出众的外表不太相配，想要熟悉他人的视线和关心也需要努力。脱离10多岁以后，知珉比起同龄人更快成熟起来，亲身感受到了周围人对她多出数十倍的关心。例如，在酒吧被搭讪的频率增加，也经常突然接到朋友的介绍。</p><p class="story-paragraph">这也需要相应的改变，知珉为了不再费心对所有的事情一一做出反应，塑造了一个定型化的社交形自我。事实上，大部分人都是以一定的形式接近的自己。怀着好意想接近的人，带着异性目光轻浮接近的人，还有看不惯自己在人群中太过亮眼，而无缘无故挑起是非的人。当学会了适当地应对所有模式，即便受到不特定多数人的视线，也不会承受太大的压力。她觉得自己终于长大成人，正在变得坚强起来。毕竟仅仅只有20岁，那么想也不无道理。</p><p class="story-paragraph">20岁初春，知珉经朋友介绍认识了明俊，从第一次见面就对他产生了好感。早就毕业的明俊在公司上班，知珉的好感也包含着对社会人的憧憬。从个人角度来看，他很有风度，也感觉很尊重自己。之后又和他见了几次面。可惜的是，和明俊在一起并不会让自己感到开心。不过，舒服并稳定的恋爱也不坏。虽然两人很少开怀大笑，但兴趣相投，也没有发生磕磕绊绊的事情。两人在人群中都很突出，但也都不喜欢表露出来。也就是说，明俊和自己是同一类人。这个共同点正是和他继续交往的决定性契机。</p><p class="story-paragraph">转折点在一年后出现。在开始交往，感觉关系逐渐成熟的时候，明俊突然一个人去了伦敦。突如其来的物理距离令她感到无措手不及。没有过远距离恋爱的知珉，必须改变在与他交往后养成的习惯，过程中必然会感到孤独和空虚。</p><p class="story-paragraph">知珉找到的解决方法是隐藏自己的内心。首先是活动身体，约朋友出去，减少琐碎的想法。不让自己被冲动或感情起伏所左右，一切按照自己制定的规则生活。就这样，一瞬间问题似乎都已得到解决。想见恋人的思念、模糊的感情，都像泡沫一样慢慢融化了。为了遵守与自己的规则，知珉在明俊视线无法触及的地方不断努力。</p><p class="story-paragraph">但问题是，她与明俊的关系不能再耽误下去了，也许是她已独自感到倦怠。即使按照平时的方式去处理，也难以平复。其实解决方法很简单，待在两人能够触及彼此的距离。平常通话时，并不会轻易说出“想你”一词，但某一天，知珉听见明俊说工作好像会闲下来，一气之下就这么说出口。我、要不要干脆买一张去伦敦的机票？明俊因这积极态度不像平常的自己而惊慌失措，但看起来却非常高兴。从那天起就翘首期盼D-DAY到来。相信这是正确的选择，因为，在这没人抓住就会分裂、岌岌可危的关系中，有闲暇时间的一方先踏出一步才是对的。不会有问题的，如果一起度过的话，爱情会马上重新燃起，想得如此简单。</p><p class="story-paragraph">当然，这只是在准备坐飞机前往欧洲，接到他的电话之前的故事而已。</p><div class="location-badge"><strong>F I N L A N D ：H E L S I N K I</strong><span>芬兰 ：赫尔辛基</span></div><p class="story-paragraph">现在，离开韩国踏上陌生土地的知珉，又对明俊发起了新的宣战。</p><p class="story-paragraph dialogue">「偶然遇见的高中后辈？旅行？」</p><p class="story-paragraph dialogue">「…嗯」</p><p class="story-paragraph dialogue">「这么突然？」</p><p class="story-paragraph">不想把通话时间拉长，该说的话在心里挑挑选选。从机场出来后，一股早晨的冷空气朝着脸部袭来，才重新认知到自己已经来到北欧了啊。为了驱走寒气，知珉一直原地踏步，并瞄了几眼偶然间碰到的高中后辈的背影，独自坐在长凳上的旼炡正在翻找行李。刚把目光投向旼炡，电话那头就传来了不满的声音。</p><p class="story-paragraph dialogue">「知珉啊，我有点不知所措」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「就算和家人、朋友去旅行也会有争吵，要和不熟的后辈？没问题吗？」</p><p class="story-paragraph">当然不是没问题啊，我也不清楚。但这还不都是因为你吗。但是，她并没有这么理直气壮地回答，明俊说的话自己都认同。光拿着飞往伦敦的机票就上了飞机的知珉，其实也没有冲动改变目的地的想法。虽然看似很高兴偶遇后辈，但说穿了，旼炡对知珉来说就是陌生人，还只是个充满问号的存在。</p><p class="story-paragraph dialogue">「等一个月太久了，刚好见到后辈想顺便去旅行」</p><p class="story-paragraph dialogue">「竟然说见到后辈想顺便去旅行…」</p><p class="story-paragraph dialogue">「反正本来也是为了来这里休息，顺便见哥哥的」</p><p class="story-paragraph">这一半是事实，一半是谎言。如果住在明俊伦敦那空荡荡的家里，肯定整天都会被他的想法所束缚。这次的宣战与其说是欲擒故纵，不如说是向每次都只会嘴上说可惜的明俊，拿出一点点没用的自尊心。而且某种程度上，一气之下答应旼炡的旅行提案，也确实很有意思。</p><p class="story-paragraph dialogue">「这一个月打算做什么？」</p><p class="story-paragraph">面对明俊的提问，知珉稍微犹豫了一下。谁知道呢，会做什么。除了旼炡愿望清单上的极光以外，两人什么都没有定下来。</p><p class="story-paragraph dialogue">「听说现在正是看极光的好季节，可能会去冰岛露营」</p><p class="story-paragraph dialogue">「还要做什么？」</p><p class="story-paragraph dialogue">「还有…有的没的」</p><p class="story-paragraph">有的没的？明俊忧心忡忡重复了自己的原话。要去的地方应该很多的，我之前没来过北欧嘛。对于含糊的回答，明俊发出了些碎念。但他可能对因本人而毁掉的日程无话可说，只是用可惜的语气说知道了。虽然还没有出发，但听到话筒外的声音已经感到疲惫了。最终没能说服自己的明俊道了别。我虽然很忙，但会抽出时间多联系你的，一切小心，一路顺风，我爱你。</p><p class="story-paragraph dialogue">「我也爱你」</p><p class="story-paragraph">从某瞬间开始，成为挂电话前的公式问候，我也爱你。知珉怕身边有人听到这微不足道的爱意表达，把分贝稍微降低后结束了通话。</p><p class="story-paragraph dialogue">「对不起，等了很久吧？」</p><p class="story-paragraph">好像足足超过15分钟了吧。如果可以的话，本想尽量简短的，结果还是拖长了时间。歉意跟着视线转移，看向旼炡戴上的淡蓝色针织帽和围巾。虽然用色彩搭配的围巾、把脸周围裹得严严实实的旼炡很可爱，但看上去年纪比刚才又更小了。一瞬间，知珉觉得自己必须带领这个小小生命体，产生了奇妙的责任感。</p><p class="story-paragraph">两个人暂时讨论起计划。旼炡表示，首先先在芬兰待几天，知珉则根据行程的追加开始了解航班。从这里为起点，只要一小时左右飞行时间，就可以飞往北欧大部分国家，幸运的是廉价航空的机票也剩下很多。因为不是旺季，所以支出没有想象中大，这难道不是万幸吗？知珉松了口气，依次按下了结账按钮。</p><p class="story-paragraph dialogue">「住宿要怎么办？」</p><p class="story-paragraph">旼炡说，虽然住同一间房也没关系，但如果觉得住宿不算太好，也可以另外找别的房间。知珉看着一连串的信用卡使用明细，只能是一脸苦闷。像酒店一样越方便当然越好，但刚才那堆令人欲哭无泪的支出，自己也没有选择的余地。况且现在要两人一起旅行，如果非要单独住一间房的话，也很难变得亲近。因此，她向旼炡提议共享房间，自己支付一半的住宿费。</p><p class="story-paragraph dialogue">「这样感觉最干脆，一人付一半」</p><p class="story-paragraph dialogue">「很好，住宿问题结束」</p><p class="story-paragraph dialogue">「很快就解决了，挺好的」</p><p class="story-paragraph dialogue">「然后是这个，接下来一个月就借给你了」</p><p class="story-paragraph dialogue">「嗯？什么？」</p><p class="story-paragraph">旼炡把某个相当大的东西一下子推到眼前，是件黑色的厚重冬季羽绒服。其实知珉不怎么怕冷，在冬天也经常穿着秋装到处去。如果是在伦敦的话，穿着现在的牛仔夹克一定程度上还挺得住，但在赫尔辛基这样打扮就显得太少。旼炡本就计划巡游北欧，所以带了很多厚厚的冬季服装。把自己的外套和给知珉的羽绒服拿出后，旼炡的背包尺寸几乎缩减成一半，这才看起来没那么负担。都是因为衣服行李才那么大啊。</p><p class="story-paragraph dialogue">「在这里如果只穿那件夹克会冷的」</p><p class="story-paragraph">知珉说了谢谢，便把旼炡递过来的黑色厚羽绒外套穿上。还好这件防寒服的尺寸对旼炡来说和被子一样宽，非常适合知珉来穿。拍一拍，整理着穿着，一股刚洗好的衣服一样的清香扑鼻而来。</p><p class="story-paragraph">旼炡就像准备充足的人一样，走在前面两三步。两人很快沿着写有“Railway”的标志牌，坐上了前往中央车站的机场列车。列车内比想象中干净且舒适。知珉看着外面掠过陌生的风景，切身感受到自己终于来到海外。再加上披着别人的衣服，被不熟悉的东西包围的这个瞬间，有些侷促却又激动。坐在对面的旼炡也在静静看着窗外。那个，旼炡啊。小心翼翼地叫出名字，那扫视着风景游离的眼珠，朝这边看了过来。</p><p class="story-paragraph dialogue">「入住之后计划要去哪里呢？」</p><p class="story-paragraph dialogue">「不知道欸，本来打算在宿舍周遭转一转，姐姐没有什么想做的吗？」</p><p class="story-paragraph">其实刚才找了几个旅游景点。芬兰以桑拿而闻名，所以想去看看。知珉找到的地方正好离宿舍很近，但是不确定旅伴的意见。本来就不太了解彼此，突然说要先去桑拿浴的话，好像会有点尴尬。虽然那里是必须穿着泳装、男女通用的场所，而且也可以披上浴袍。尽管如此，知珉还是觉得不好意思那么爽快提出建议，于是悄悄地说了一句。</p><p class="story-paragraph dialogue">「听说我们宿舍附近有个有名的桑拿房。」</p><p class="story-paragraph dialogue">「我知道你说的在哪，只不过去桑拿的话得有泳衣才行，你有带吗？」</p><p class="story-paragraph">自己的话似乎都在旼炡预想范围之内，若无其事地进行了回答。旼炡为了去冰岛的露天温泉，所以带着泳衣。而原本就喜欢玩水的知珉，即使不是夏天，只要出去玩也一定会带上泳衣。当然，自己也没想到会穿着那件泳装去芬兰桑拿浴。总之，两人都有准备好衣物，旼炡也没有其他计划，没有理由不去。</p><p class="story-paragraph dialogue">「我也带着，想说或许会游泳」</p><p class="story-paragraph dialogue">「但我们可能不会去游泳了吧，在这种天气」</p><p class="story-paragraph">旼炡以随口的瞎说嘲讽了自己。知珉微微耸了耸肩，装腔作势做出“我也知道”的动作。旼炡再次把目光投向窗边，用和刚才一样的语气“OK，那就先去桑拿浴吧”无关紧要地说。</p><p class="story-paragraph">知珉靠在温暖的羽绒服上思考着。单看她说话的语气，不觉得她性格很爽快吗？该说的话就说、决定也很快、很有眼力见儿、自己有什么需要就会给予照顾。同时，旼炡也有着不形于色的亲切。举个例子，就像刚才什么都没说，就先帮自己准备好羽绒服，虽然旅行才刚刚开始，彼此之间也不太了解，但至少对知珉而言，两人一起旅行不会感到不舒服。</p><p class="story-paragraph">列车行驶在冷清的郊区，很快进入到赫尔辛基。知珉很幸运遇到了一个非常不错的旅行伙伴，因此决定顺着旼炡的视线，多看看这陌生的城市风景。</p><p class="story-paragraph">桑拿距离宿舍坐大概20分钟公交车的路程，是个淡季时游客依然络绎不绝的旅游胜地。位于广阔的大海附近，还有桑拿和很棒的日光浴，这里正是寒冷冬天在野外游荡的疲惫旅客们，消磨时间的最佳场所。比想象中更好的设施和清澈海景令两人赞叹不已，因此决定在这里洗完桑拿，吃饭也一块解决。</p><p class="story-paragraph">从柜台拿了钥匙进入置物柜的瞬间，两人之间略显安静。幸亏是有规模的公用设施，更衣室里还有很多人，但在陌生人面前换衣服，就算是知珉也觉得很别扭。但、也没办法。知珉装做不在意，率先将上衣脱下来折好。因为看见旼炡在一旁连衣服都没换、踌躇的样子，所以心想自己应该先走一步，以免给旼炡造成不便。</p><p class="story-paragraph dialogue">「我先进去了」</p><p class="story-paragraph">知珉进入淋浴室，用热水打湿身体。这是拖着疲惫的身躯到达后第一次洗澡，不知不觉间，紧绷的身子慢慢放松下来。知珉心里反复想着，幸亏自己有到这里。热水撒下，及腰的头发迅速透透。</p><p class="story-paragraph">几分钟过去，门吱的一声打开，知珉下意识转过头来。别说是尴尬，面对她比想象中更消瘦、白皙的身体，难以掩饰内心的慌张。穿着没有任何花纹、深色的基本款泳衣，走进来的旼炡更像是连身份证都没有的高中生，说自己20岁、应该是真的吧？</p><p class="story-paragraph">接着是又白又嫩纤细的手臂和腿。个子好像没想象中那么矮，看起来至少超过160。只是因为骨架小，露出肩膀的旼炡看起来十分脆弱，甚至感觉用手一碰就会倒下。如果再夸张点，感觉一只手就能把她举起来。知珉停下自己过多的想象，收敛了自己被小小身躯所吸引的视线。</p><p class="story-paragraph">清洗完身体，两人一起进入桑拿房。刚坐上能观看风景的木制椅，一股热气立刻涌上脸庞。如果在韩国，现在还是太阳正在升起的时间，而在太阳很快就西落的北半球天空上，已经出现晚霞。刚进来不久的旼炡脸上布满汗珠，这样并排而坐的知珉和旼炡兴奋了好一阵子，互相对第一个旅行地点表达了满意。这种地方还是第一次见，真希望韩国也能出现这样的桑拿房。</p><p class="story-paragraph dialogue">「真的很棒，以后一定要再来」</p><p class="story-paragraph dialogue">「和男朋友吗？」</p><p class="story-paragraph dialogue">「啊、嗯」</p><p class="story-paragraph">知珉对突如其来的提问点了点头。因旼炡的一句话，被遗忘的人再次浮出水面。在刚刚宣战后，目前还处于冷战状态。</p><p class="story-paragraph">这是长久以来的习惯，不管怎样，每当看到漂亮的风景、吃到美食时，知珉都会自然而然想起明俊。虽然位处新环境，但没有办法改掉已经形成的习惯。因为每次做了什么事情都会拍照，记录下来，说今天做了什么，并仔细地报告日常生活，借此获得和恋人在一起很开心的错觉。</p><p class="story-paragraph">如果明俊没有出差，按计划现在应该进行了深情重逢。如果一起来到这么好的地方，那么尖锐的感情也自然能平静下来。不对，不愉快的心情一定立刻就能纾解。在同一时间，同一个空间里一起经历的一切，是那么的珍贵。不知道是不是自己太过生气才这样，或许该直接去伦敦的、是自己太固执吗？心情低落的知珉想摆脱这些杂念，突然将矛头转向了旼炡。</p><p class="story-paragraph dialogue">「你有在交往的人吗？」</p><p class="story-paragraph">旼炡有些犹豫，拿起白色毛巾擦了擦汗并说道。</p><p class="story-paragraph dialogue">「我们在一起很久了，从高中开始就一直」</p><p class="story-paragraph dialogue">「挺好啊、同龄人？」</p><p class="story-paragraph dialogue">「比我大两岁，在社团认识的」</p><p class="story-paragraph">脸上微微一笑，泛起淡淡的红晕。知珉想象着站在旼炡身旁，会是什么样的人呢？从高中社团就在一起的情侣，交往了很久啊。听她说恋爱了这么久，不知怎么感觉有点舍不得，还好奇起旼炡青涩的高中时期。应该很可爱吧，可能比现在更矮一些，穿我们学校校服的样子也超可爱吧。</p><p class="story-paragraph dialogue">「如果和男朋友一起来一定很好，可惜了」</p><p class="story-paragraph dialogue">「一个月前已经分手了」</p><p class="story-paragraph">旼炡再次微微一笑，知珉没办法和她对视，只能透过窗户盯着雪地。要疯了，选主题偏偏选到最糟的。没想到一句“你也有交往的人吗”一下子就演变成这样的局面。知珉手足无措地眨了眨眼、擦了擦肩上的汗，并扇起扇子，汗已经顺着脊梁骨直直往下流。蒸气腾腾的桑拿房内，照明、温度和湿度令人窒息，体温也肆意飙升，简直像在沙漠里蒙着被子一样，只想赶紧出去喝口凉水。知珉正在迅速被烤熟的同时，旼炡却丝毫没有注意身边人的苦恼，非常冷静地继续往下说。</p><p class="story-paragraph dialogue">「我到现在都还是懵懵的」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「分手后明明也想过各种各样的事」</p><p class="story-paragraph">知珉正连续受到旼炡的打击，当然是在心理上。虽然希望这次谈话能转到其他主题，但旼炡仍旧面带微笑，继续讲述着令人心碎的分手故事。知珉一直回以点头，并思考着，为什么和这个小巧可爱的孩子分手呢？是吃什么东西长大的家伙？是个把天上掉下来的馅饼踢开的坏家伙啊。心里还掺杂着这些多管闲事的想法。</p><p class="story-paragraph dialogue">「本想着就不来的，但太可惜了。这可是花光一年打工钱才准备的旅行」</p><p class="story-paragraph">知珉想起了旼炡在飞机上说的话。本来不想一个人来的。但当时怕是有什么事由，也不敢多问，偏偏就在这得知了，她和恋人分手后的冬季旅行，只是想想都觉得忧郁。这才理解了对知珉说“一起旅行吧”，并干脆地和自己搭话的旼炡。</p><p class="story-paragraph dialogue">「对不起让你说了这些」</p><p class="story-paragraph dialogue">「这不是姐姐的错吧」</p><p class="story-paragraph">旼炡为了不让气氛更加低迷，迅速结束了对话。那也没办法不是嘛，但是来到这里很开心、好像来对了。知珉也有同感，对突然决定的北欧旅行非常中意。虽然中途想起了明俊，但是来到这刮着刺骨寒风的国家后，沉闷的思绪渐渐散去，周遭空气也感觉更加清新。也许这就是旅行最大的功用吧。</p><p class="story-paragraph">是啊，结论是真是来对了。</p><p class="story-paragraph">热气上来，坐在一旁的人们脸都渐渐被染红。但是，旼炡仍然洁白一片，甚至让人怀疑她是不是待在同一个空间里。想象了一下，因为怕冷而来到桑拿浴的小北极狐，旼炡便显得可爱了两倍。</p><p class="story-paragraph dialogue">「你很适合寒冷的地方，脸也很白」</p><p class="story-paragraph dialogue">「但我很怕冷」</p><p class="story-paragraph dialogue">「什么？那你竟然还想着要来一个月吗？」</p><p class="story-paragraph">嗯、不知道。旼炡好像是第一次认真思考这个问题，眉毛微微放低，露出十分真挚的表情。</p><p class="story-paragraph dialogue">「因为很漂亮啊、极光」</p><p class="story-paragraph">就这样？明明想了好一阵子，结果没出现什么特别的答案，知珉摇了摇头。旼炡在飞机上那么认真地看着极光的照片，仅仅只是为了那片天空愿意走这么远的路，听起来倒是挺浪漫的。</p><p class="story-paragraph dialogue">「很好奇如果亲眼见到，有多令人着迷。所以我还带了摄像机，虽然不是特别贵的。听说用手机拍是无法拍下那夜景的。」</p><p class="story-paragraph">再次成为话题的极光，让话不多的旼炡看起来非常兴奋。洁白的额头上，能稍微看到凝结的汗珠。水气沿着金色头发落下，知珉的目光就这么和闪闪发亮的双眼碰上。闭着嘴的旼炡就像个漂亮的小女孩，而一开口就变成顽皮的少年。偶尔兴奋时发出的笑声，让听的人心情都变得非常愉快。</p><p class="story-paragraph">有多么令人着迷呢。旼炡抛出的最后一句话，在知珉的脑中盘旋。虽然不喜欢寒冷，但为了看极光，裹得严严实实去旅行的北极狐。在大自然面前被微不足道的人们，就像国家地理那类的场面也一闪而过。每当听见自己喜欢的话题时，旼炡总掩饰不住兴奋的表情。对于善于隐藏感情的知珉来说，旼炡实在很神奇。是因为这样所以她才会看起来更像孩子吗？想想两人只相差一岁而已。</p><p class="story-paragraph">是我太老成了吗，还是因为她看上去显年轻？也许两者皆是。</p><p class="story-paragraph dialogue">「姐姐很热吗？你的脸很红欸」</p><p class="story-paragraph">不知不觉，两人进入桑拿房已经将近20分钟。其实，知珉从刚才就一直在喘气，在这闷热下真的算憋很久了。身旁的人脸本来就白，所以知珉连自己的脸已经熟得像苹果一样都不知道。她连忙举起一只手，贴上已经沸腾的脸颊。完全到了极限，体温高到这种程度说不定会有危险的。</p><p class="story-paragraph dialogue">「我怕热所以最讨厌夏天了，我们正好相反呢」</p><p class="story-paragraph dialogue">「看起来是那样没错，不行的话我们出去吧」</p><p class="story-paragraph dialogue">「嗯，感觉要窒息了，你还真是能忍」</p><p class="story-paragraph dialogue">「也不算忍，只是不怕热而已」</p><p class="story-paragraph">呼，知珉长长地呼气，推开厚重的木门向外走去。凉爽的风吹来，全身的汗瞬间蒸发。这时，一群刚出来的人，光着脚走在积雪的地面上，吸引两人的目光。他们像海狗一样依次跳进眼前的大海。知珉和旼炡见状，对视了一眼。心想现在到底看到了什么。</p><p class="story-paragraph">受到文化冲击的两人，过了一会才终于理解他们在做什么。刚才搜寻桑拿时才知道，北欧有在桑拿出汗后直接跳进冰水的文化。顾名思义，这是“冰泳”的独特习惯。旼炡在旁一脸无法理解地摇了摇头。那样的话心脏不会麻痹吗？干嘛要那样啊…</p><p class="story-paragraph dialogue">「…我也试试来跳水如何？」</p><p class="story-paragraph dialogue">「真心的吗？」</p><p class="story-paragraph">面朝自己的双眼像兔子一般。开玩笑的吧？如果感冒的话责任我可承担不起。与惊慌失措的旼炡不同，知珉看起来对冬泳十分感兴趣。并不是因为想游泳，她看着眼前若无其事地跳进水中依然好端端的人们，自己就算掉进那里也不会这么冻死，况且如果不是今天，有生之年还有机会跳进冰水吗？感觉没有比这更凉爽的了，就像在盛夏喝进一杯冰咖啡之前，感到口渴。冲动，现在驱使知珉的是一种强烈的冲动。</p><p class="story-paragraph">我已经拦过你了，姐姐，真的要进去吗？知珉抛下身后叽叽喳喳的旼炡，慢慢走向水边。因为体温升高很多，所以光脚接触地面反而很凉快。</p><p class="story-paragraph">扑通投身，刺骨般的海水席卷全身。刚才流下的汗水消失得无影无踪。第一次冰泳又冷又刺激，因为比想象中更爽快，甚至想再来几遍。站在甲板上的旼炡就像本人掉进海里、感同身受一般，皱着眉问道。</p><p class="story-paragraph dialogue">「不冷吗？」</p><p class="story-paragraph dialogue">「很冷、像要晕过去了一样。但又特别凉快？」</p><p class="story-paragraph dialogue">「冷得要晕过去，怎么可能还觉得凉快？完全是矛盾啊」</p><p class="story-paragraph dialogue">「你也快试一次，真的不会后悔的」</p><p class="story-paragraph">知珉抓住旼炡踌躇不前的手腕，本就纤细的手臂被无力地拖到水边。</p><p class="story-paragraph dialogue">「现在不做的话就没机会了，趁汗蒸发之前快点」</p><p class="story-paragraph">旼炡虽然依旧一脸不情愿，但似乎不想认输，微微皱着眉头说知道了、就一秒、不对、绝对不会待超过一秒。旼炡嘟嘟囔囔摆出犹豫不决的姿势，说着要跳了、要跳了，结果磨蹭了半天。知珉调皮劲来了，偷偷站在旼炡身后，然后轻轻推了下她拱起的背部。</p><p class="story-paragraph">瞬间，仿佛听到了微弱的悲鸣。嘣，连入水声都很可爱。旼炡一掉入冰水中，就像弹簧一样跳起来，顾不得知珉就直接跑进室内。其他准备跳水的人们看到这一幕，全都笑了起来，知珉最终也忍不住笑出来。伴随着因没能留下照片而感到后悔的有趣场景，今天的桑拿体验就此告一段落。</p><p class="story-paragraph">当然，知珉没料到“扑通”事件将引发的一系列蝴蝶效应。两人还不知道，这么毫无顾虑地愉快旅行，是第一天也是最后一天。</p></div>
      </section></template>
<template id="template-chapter-03"><section class="chapter" aria-labelledby="heading-chapter-03">
        <header class="chapter-heading">
          <span>03</span>
          <h2 id="heading-chapter-03">北极狐观察日记03</h2>
        </header>
        <aside class="ost-card" aria-label="本章配乐歌词">
          <h3>안아보고 싶어</h3>
          <div class="lyric-lines"><p class="lyric-line stanza-break">티를 내지 않는 건</p>
<p class="lyric-line">생각보다 어려운 일이야</p>
<p class="lyric-line">함부로 웃지도 못하고 눈치만 봐야 하니까</p>

        <div class="chapter-copy"><p class="story-paragraph">后悔了，早知道会这样，就不怂恿她跳进冰水了。虽然只是短暂的瞬间，旼炡从冰水中逃出后，真的受不了似地背靠在桑拿室内，颤抖着身子，踉踉跄跄向外走去。</p><p class="story-paragraph">从那时起征兆就不好。旼炡一回到宿舍，立刻瘫倒在床上。旼炡啊，得换件衣服再睡才行。知珉几次试图叫起瘫软的室友，但旼炡有如融化的果冻般，看起来连说话的力气也没有。最后，知珉也只给明俊留了个消息，便早早就睡去，手忙脚乱的第一天旅行就这么结束。</p><p class="story-paragraph">到了清晨太阳再次升起，知珉比平时更早睁眼，映入眼帘是陌生的天花板。突然回过神，看了一眼还没睡醒的旼炡，她正艰难地喘着气。知珉连头发都没整理，就站在旼炡的床边观察。可能是因为凌晨开始就已经病恹恹，旼炡的脸蛋像饿肚子的小鸟宝宝一样无力。不知道为什么自己总把她比喻成这种小动物，总之…</p><p class="story-paragraph">两人下榻的是双床的双人间，如果把行李全放到角落，至少来回走动是没问题的。从大清早开始，寒气就从生锈的窗户缝隙透进来。即使供暖不佳，旼炡还是坚持了一夜。只见她用被褥把身体裹得严严实实、缩成一团，看来今天要一起出去似乎太过勉强。明明是个怕冷的孩子，自己硬是让她跳水，得负一半责任，不、大约八成。这么一想，心情变得沉重起来。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「旼炡啊，起来一下」</p><p class="story-paragraph dialogue">「…嗯…」</p><p class="story-paragraph">旼炡眨了眨眼翻了个身，没能直起身子，就这么问道。</p><p class="story-paragraph dialogue">「…现在几点了？」</p><p class="story-paragraph dialogue">「还不到9点」</p><p class="story-paragraph dialogue">「这么快早上了吗？」</p><p class="story-paragraph dialogue">「嗯，身体还好吗？」</p><p class="story-paragraph dialogue">「那里，背包的口袋有感冒药，给我一个」</p><p class="story-paragraph dialogue">「知道了」</p><p class="story-paragraph">旼炡指着的地方有个类似药箱的东西，里面单单只放有一盒创可贴和感冒药。这作为海外旅行一个月的常备用药，实在太过简略了。知珉边想边拿出了一粒药，并递了杯矿泉水。病人咳个不停，艰难地从床上直起身。知珉赶紧伸手搀扶旼炡的身体，瘦小的背上满是冷汗。</p><p class="story-paragraph dialogue">「今天姐姐自己去外面逛逛吧」</p><p class="story-paragraph dialogue">「都烧成这样了，得有人照顾啊」</p><p class="story-paragraph">咕嘟一声，药被吞进喉咙。接着，旼炡用低沉的嗓音轻轻说道。但你不会想一直呆在房里吧？别浪费一整天时间，出去逛逛再回来，我今天一天好好休息应该就没事了。旼炡一脸平静地说着，知珉却完全不能同意。明明她看起来一点都不好，说这什么话呢。</p><p class="story-paragraph dialogue">「饭呢？你打算吃什么？」</p><p class="story-paragraph dialogue">「昨天在前面的超市不是买了很多零食吗，我随便吃吃就好」</p><p class="story-paragraph dialogue">「要是你的话，能这么留下生病的人出去转转吗？」</p><p class="story-paragraph dialogue">「都说没关系了，而且自己一个人休息心里反而比较舒服」</p><p class="story-paragraph dialogue">「什么意思？」</p><p class="story-paragraph dialogue">「感冒是会传染的」</p><p class="story-paragraph">知珉的提问像轰炸机一样什么都不放过，旼炡似乎连回应的力气都没有，答案变得越来越简短。“就算那样…”一开头，旼炡干脆直接打断。</p><p class="story-paragraph dialogue">「这种情况下，如果两个人一起感冒，就真的完蛋了」</p><p class="story-paragraph">话说得没错。虽然心不甘情不愿，但面对固执的旼炡，知珉好不容易准备好出门。等晚上再买好吃的回来吧。旼炡用力推了推知珉无法从门口离开的后背。“哐”的一声，半强制性地关上门，知珉被猛地丢到外面。在毫无计划的情况下。</p><p class="story-paragraph dialogue">「什么啊、真是…」</p><p class="story-paragraph">因预想不到的变数，开始独自旅行的第二天早晨。在门前嘟嘟囔囔的知珉，不得已移动起脚步。虽然因为无处可去，旅伴状态也不好，所以并不想移动到较远的地方。把手伸进羽绒服口袋里，一步一步独自一人走着，感觉非常可怜。怎么说呢，像是被公司辞退后，成了无处可去，寻找落脚之处的中年家长。自己的处境是不是和他们一样，想呆在家却被妻子推着赶出来，好像是相同的悲伤呢？在晴朗的冬日早晨知珉哼哼唧唧，在酒店周围徘徊了近30分钟。</p><p class="story-paragraph">越想越觉得可恶。明明自己担心死了还被赶出去。本来身体就很虚弱的孩子，如果就这样病了好几天该怎么办？</p><p class="story-paragraph">因此，着急的知珉决定从药局走起。先是拿起退烧药、止痛药、头痛药，像个来抢劫药局的人一样到处翻找。抗生素药膏和维他命等先准备起来会不会更好呢？这样就够了吗？会不会有点夸张了？在递出银行卡之前，虽然暂时犹豫了一下，但由于要照顾旼炡的意志十分坚定，所以全部结完帐，拿到了收据。想到那个只有感冒药的破药箱，完全不够用，才做出这样的决定。况且，已经排定在几天后要离开市中心，前往外围城市。在便利的大城市里做好万全准备，彼此心里都会更踏实。</p><p class="story-paragraph">还有真的万一、旼炡身体状况也有可能恶化。必须今天就痊愈了才行啊，希望不要出现需要海外就医的情况。知珉满面愁容，提着一包药推开门。现在，不得不再次思索下个目的地。</p><p class="story-paragraph">越是临近中午，人们全聚集到街上。因为没吃早饭肚子饿是自然的，但自己却没什么胃口。目前最担心的是旼炡要怎么填饱肚子，即便冰箱内有零食，也只是水果以及早餐用的面包。脑中想起不久前旼炡让自己买好吃的晚餐回来，难道必须这么悲伤地待到太阳下山吗？</p><p class="story-paragraph">知珉走着走着便停了下来。突然觉得不该这样，应该买饭回去。会有卖粥的地方吗？好巧不巧，正好在几步距离外，就看见一家泰式餐厅。</p><p class="story-paragraph">知珉进入店内点了两份有米饭和热汤的菜食，干坐在桌前焦急地等待食物。希望她能打起精神好好享用。再怎么样，现在不是说“被妻子赶走的一家之主”这种伤心话的时候。因为，自己说过要做旼炡的守护者和带领者，今天就是实现诺言的日子。知珉的最终目标就是借此机会让旼炡对自己改观，成为值得信赖的姐姐和旅行好伙伴。</p><p class="story-paragraph">今天就这样决定了，成为可靠的姐姐。结论朝着奇怪的方向发展，因为知珉被“姐姐”这一关键词深深吸引，毫不犹豫地朝酒店走去。</p><p class="story-paragraph">啪嗒。随着大门打开的声音，旼炡讶异的表情映入眼帘。她正在床上蠕动着，放在一旁的面包都没吃多少，完全和预想的一样。唉，我就知道。知珉叹了口气，蹒跚地走进房内，旼炡眼睛睁得圆圆的。</p><p class="story-paragraph dialogue">「怎么这么快就回来了？不是让你自己去逛逛吗？」</p><p class="story-paragraph dialogue">「感觉没什么意思就回来了」</p><p class="story-paragraph dialogue">「也可以去昨天的桑拿啊，你不是说想再去一次吗？」</p><p class="story-paragraph dialogue">「算了，一起吃午餐吧。今天休息一天也没关系吧」</p><p class="story-paragraph dialogue">「还真不听话啊」</p><p class="story-paragraph">旼炡嘴里嘟囔着，打开包装开始吃起饭。泰式粥非常合旼炡的口味，空着肚子大半天的知珉也坐在对面，一勺一勺地吃起来。味道挺不赖，对于刚发现的餐厅来说，算是成功。</p><p class="story-paragraph">看到旼炡用小嘴吃进好几口热汤，才放下心。或许是从昨晚开始就没吃什么，目前看来好像就这顿饭吃得最香。她吃东西的样子看上去很可爱，又漂亮。眼见小鸟终于找回力量，现在完全能理解鸟妈妈含泪的心情。</p><p class="story-paragraph dialogue">「好吃吗？」</p><p class="story-paragraph dialogue">「嗯，去哪找到这种店的？要找到亚洲餐馆应该不容易吧」</p><p class="story-paragraph dialogue">「附近正好有，想买饭给你吃就带回来了，总比面包好吧？」</p><p class="story-paragraph dialogue">「比面包好多了，啊、不过还想吃锅包肉之类的」</p><p class="story-paragraph dialogue">「说什么锅包肉，你现在吃那种油腻的东西，包准出毛病」</p><p class="story-paragraph">从那时起叨念着锅包肉、锅包肉的旼炡，可能是吃了几口饭突然食欲大增。要是早知道这样的话，还不如直接找个中餐馆呢。总之松了一口气，知珉对旼炡安抚道。</p><p class="story-paragraph dialogue">「先把这些都吃完，等身体好转后再去吃吧。但是来到北欧想吃锅包肉的你也很特别」</p><p class="story-paragraph dialogue">「总不能每天只吃面包和意大利面吧」</p><p class="story-paragraph">一转眼，几乎吃完一整碗，旼炡脸上透出白皙的光泽，看来过了今天，明天又可以一起出门了。不需要继续看护这只在严寒下无法动弹的小鸟，算是万幸。恢复活力的旼炡，再次聊起锅包肉话题，说“我们高中附近有一家好吃的中餐馆，你知道吗？”，知珉只是左耳进右耳出，想着自己的疑问，谨慎地开口。</p><p class="story-paragraph dialogue">「旼炡啊，我有点好奇」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「你不是说高中和我一起吃饭、打过一次招呼吗？」</p><p class="story-paragraph">啊~是的。旼炡点了点头，咬了咬塞满双颊的食物反问。怎么了吗突然之间？</p><p class="story-paragraph dialogue">「那是什么时候啊？」</p><p class="story-paragraph dialogue">「我一年级的时候，只是社团认识的前辈叫我们新生一起来吃饭而已」</p><p class="story-paragraph dialogue">「社团的新生？」</p><p class="story-paragraph dialogue">「是的，那时候姐姐和姐姐的朋友一起来了，其实我们两个连一句话都没说过」</p><p class="story-paragraph">听她说着，好像依稀有点印象。应该是社团进新生那天，三年级的前辈们带着一年级新生一起吃饭。见到认识的姐姐们自己就和她们一起坐下，和新面孔们打过招呼，聊了一会儿便离开了。也许就只是这样吧。</p><p class="story-paragraph">知珉以前加入的社团是舞蹈部，可以说是庆典之花，在学校有最高人气。特别是知珉演出后，不知是谁把拍摄的视频外传，成为了话题，想要加入的新生越来越多。当然，随着社团规模的扩大，不是每个人都能变得很亲。但即便如此，人群中一眼可见的可爱孩子，为什么记不得呢？不可能啊。</p><p class="story-paragraph dialogue">「可我不管怎么想，都不记得我们有一起活动啊」</p><p class="story-paragraph dialogue">「我没能参加活动」</p><p class="story-paragraph dialogue">「啊嗯？」</p><p class="story-paragraph dialogue">「因为一些个人原因，所以加入不到两个月就退出了，所以我没有和前辈或同学一起练习过」</p><p class="story-paragraph">啊啊，那么就能理解了。知珉点了点头，对高中时差一步而错过的缘分感到非常可惜。虽然不知道她离开社团的原因，但如果能一起活动的话，两人可能会亲近起来。如果有这么漂亮的后辈，自己一定非常宠爱她。</p><p class="story-paragraph dialogue">「好可惜啊。如果那时知道的话，肯定会变亲的。」</p><p class="story-paragraph dialogue">「是吗，应该不会。」</p><p class="story-paragraph dialogue">「为什么这么说？」</p><p class="story-paragraph dialogue">「姐姐本来就是名人，周围一直围着好多人…」</p><p class="story-paragraph dialogue">「是挺多人…」</p><p class="story-paragraph dialogue">「这也是理所当然的」</p><p class="story-paragraph dialogue">「哪有什么理所当然的啊」</p><p class="story-paragraph dialogue">「外人的眼光就是如此啊。而且姐姐还是学校的校服模特，不管怎么说都很显眼」</p><p class="story-paragraph">姐姐自己也知道吧。旼炡用这样的眼神注视着知珉。没办法否认，事实上，现在的大学生活也没什么不同，只是更像个大人而已。第一次见到知珉的人大都会说，想和你变得亲近，但是你太漂亮，周围的朋友们也都长得很好看、学习也好、这个也好那个也好。也就是有了所谓距离感。当然，在他人看来，这就是所谓幸福的烦恼，但当自己知道旼炡也是用与他人无异的目光看自己时，无法抹去涌上心头的怅然。面对默不吭声的知珉，眼前的旼炡再次开口。那个，姐姐。</p><p class="story-paragraph dialogue">「我也想问一件事」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph">原以为会继续高中时期的事情，但旼炡提出的问题与此全然无关。</p><p class="story-paragraph dialogue">「姐姐用的是哪款香水？」</p><p class="story-paragraph dialogue">「香水？」</p><p class="story-paragraph">这么突然？知珉从包里拿出香水瓶展示给旼炡。旼炡打开瓶盖，轻轻凑近。这款香水在黑莓上添加了木质香，比起甜，更具有浓郁且成熟的味道。当时被推荐说与自己很合适，因此从高中一直用到现在。试完香后，旼炡以捉摸不透的表情摇摇头，把香水交还给知珉。</p><p class="story-paragraph dialogue">「香味很好吧？」</p><p class="story-paragraph dialogue">「就、不坏吧」</p><p class="story-paragraph dialogue">「为什么问？想买吗？」</p><p class="story-paragraph dialogue">「只是香味很熟悉，但不知道名字」</p><p class="story-paragraph dialogue">「是吗？」</p><p class="story-paragraph dialogue">「不管怎么闻，这个好像跟我前任用的一模一样」</p><p class="story-paragraph">前任用的香水？听见这句话，知珉嗯~地一声，稍微顿了一下。</p><p class="story-paragraph dialogue">「嗯，也是有可能。只是那位的取向很特别呢」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「这是女士香水啊」</p><p class="story-paragraph dialogue">「我的爱人也是女的啊」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「怕你搞混了，换句话说，前女友，行了吗？」</p><p class="story-paragraph">等等、等一下。</p><p class="story-paragraph">感觉话题要被若无其事地就此跳过。总的来说，交往了很久、差点一起来旅行、但不久前分手的那个人，不是男朋友，而是女朋友。到这都还好，虽然有些惊慌，但也是有可能的。但是，知珉脑中清晰记得旼炡昨天说过的话。</p><p class="story-paragraph">比我大两岁。在社团认识的。</p><p class="story-paragraph">那么，旼炡那长时间交往的前女友100%是自己认识的人。知珉拼命回想舞蹈部成员们的恋爱史，却没有想到匹配的人物。我们社团里只有漂亮又成熟的姐姐们，和旼炡甜甜蜜蜜的恋人…好像没有啊。到底是谁呢？</p><p class="story-paragraph">而且，旼炡竟然和自己认识的某人秘密谈了很长时间恋爱，这个前提本身就让她非常震惊。到底是怎样亲近起来的呢，刚刚说加入社团两个月就退出了，难道是为了认识女人才加入的吗？明明长得完全不是那样的人。层层积累的好奇心，只让自己无辜的脑袋变得复杂。</p><p class="story-paragraph dialogue">「那个人是谁…」</p><p class="story-paragraph dialogue">「我才不说，我干嘛要告诉你？」</p><p class="story-paragraph">旼炡以没得商量以的姿态表示了拒绝。第一次见她充满警戒的眼神，知珉撇了撇嘴。真是无语，只是好奇才问的，干嘛突然提防起来呢？又不是什么永不背叛离你而去的主人、并乖乖等待的忠犬。知珉双臂交叉在心里嘀咕。</p><p class="story-paragraph dialogue">「反正姐姐不会知道是谁的」</p><p class="story-paragraph dialogue">「真的完全没一点头绪」</p><p class="story-paragraph dialogue">「早就猜到了，那个姐姐绝对不会公开告诉熟人自己在和我交往」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「反正我是不会告诉你的」</p><p class="story-paragraph">那个姐姐。知珉稍微有些在意这四个字。不，不是稍微，而是明摆着。好奇旼炡的姐姐是谁，好奇的要死。但也不能在再次被拒绝的情况下，死皮赖脸地求求你告诉我。因为这也算不在场的那个姐姐的隐私问题。</p><p class="story-paragraph">按照旼炡的说法，两人的关系在学校里没有公开，知珉可能也不是和旼炡的前女友、舞蹈社的某前辈那么亲近。因此，偶然在旅行中遇到的刘知珉，不需要对这个TMI再做深究，点到为止即可。知珉点了点头，决定不再执着于两个女人的恋爱史。</p><p class="story-paragraph dialogue">「…是啊，可以理解，我知道了。」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「太好奇了抱歉，我不会再好奇了」</p><p class="story-paragraph dialogue">「还是很好奇吧？」</p><p class="story-paragraph dialogue">「不，已经不好奇了」</p><p class="story-paragraph dialogue">「应该超级好奇吧」</p><p class="story-paragraph dialogue">「说真的，到底是谁？是跟我很亲的人吗？」</p><p class="story-paragraph dialogue">「不要再问了，都说了不会告诉你的」</p><p class="story-paragraph dialogue">「啊，真的是，你在玩我吗？」</p><p class="story-paragraph dialogue">「略~」</p><p class="story-paragraph">生病了也得挨打。啪嗒一掌拍下后，旼炡突然以心痛的表情，闹了起来“怎么能随便打病人呢？”，不管是病人还是小鸟宝宝，好不容易才把她喂饱，让她起死回生而已。</p><p class="story-paragraph dialogue">「那个…」</p><p class="story-paragraph dialogue">「干嘛？」</p><p class="story-paragraph dialogue">「听起来可能有点奇怪，但请不要做奇怪的想象」</p><p class="story-paragraph">就像说要去旅行一样，见旼炡脸上满不在乎的表情，总觉得不太吉利。什么呀？不要奇怪地想象听起来可能很奇怪的话，那到底该怎么听？那句话本身就很奇怪。还没来得及连胆战心惊，旼炡就直接说了出来。</p><p class="story-paragraph dialogue">「我好像有点在意，姐姐的香味」</p><p class="story-paragraph">等等、再次暂停。</p><p class="story-paragraph">这个剧本自己经历过几次。虽然女孩子是第一次，但从她21年的人生经历来看，这个发言和氛围几乎100%、甚至150%是告白前的氛围。如果是电视剧，也许会播放让人心跳加速的BGM。很遗憾，这里不是电视剧拍摄现场。</p><p class="story-paragraph">知珉非常慌张，顿时无话可说。小鸟宝宝、漂亮的小狗狗、洁白又淡漠的北极狐，被按照自己方式疼爱的旼炡，居然和某次酒桌上，从军队回来关系不怎么样的男同学嘴里，说出一样的话。每当闻到你的香味就想起前女友，很难受…像这样吗。虽然是刚回想起来的，但是台词真的特别烂，不能更糟了。男人要是这么说，自己一定会超级讨厌。因为脑内像活火山一样正在燃烧各种杂念，知珉的嘴像傻瓜一样开始胡说八道。</p><p class="story-paragraph dialogue">「你想说我长得像你前女友吗？」</p><p class="story-paragraph dialogue">「那又是什么话？是因为同样的香味，时不时会有点怪怪的」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「就这样，还有…」</p><p class="story-paragraph dialogue">「还有？」</p><p class="story-paragraph dialogue">「…一点都不像好吗？」</p><p class="story-paragraph">旼炡一脸无奈地轻笑，知珉见状，心里莫名感到不是滋味。说什么呢，刚刚不是才说很在意嘛。如果是电视剧的话，在正要播放告白BGM的瞬间，旼炡一句不是那样、太过了，被按下暂停钮。明明也不是旼炡的前女友、现女友甚至不是普通朋友，知珉却无缘无故突然自作多情。明明营造了像是重大场合一样的氛围，结果说出口是“就这样、一点都不像好吗？”。啊…本来就该这样吧、就该是这么回答。</p><p class="story-paragraph dialogue">「所以呢？让我别用那瓶香水吗？」</p><p class="story-paragraph dialogue">「随你便吧，那个是那个、这个是这个」</p><p class="story-paragraph dialogue">「意思是你心里会在意，但还是随我便？」</p><p class="story-paragraph dialogue">「别想太深了」</p><p class="story-paragraph dialogue">「不深啊，我现在想得特别浅。你自己说了那种话，为什么还这么冷静」</p><p class="story-paragraph dialogue">「算了，还是忘掉今天听到的事吧。虽然我也不是在跟姐姐告白…」</p><p class="story-paragraph">你还要抵赖吗？虽然不是告白，但是你把气氛搞的很奇怪啊，到底有过多少次这种让人心跳加速的发言。之后一个月都要和你一起度过，也不考虑一下我的处境吗？</p><p class="story-paragraph dialogue">「这个只是怕万一才说的…」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「会介意用同一间房吗？」</p><p class="story-paragraph dialogue">「嗯…不会、不会啊？」</p><p class="story-paragraph dialogue">「你慌张了呢」</p><p class="story-paragraph dialogue">「没有啊」</p><p class="story-paragraph dialogue">「明明就慌张了啊」</p><p class="story-paragraph dialogue">「就说没有慌张了」</p><p class="story-paragraph dialogue">「不是重复两次回答了吗，像卡壳的机器人一样」</p><p class="story-paragraph">如果小鸟宝宝的身体状态正常，自己也许会再打她十下后背。但在这种情况下，担心她孱弱的身体会垮掉，刚才还贴心调整了力道，其实根本没必要吗？知珉像个当机的笨蛋机器人一样，但旼炡好像觉得现在的情况很有趣，用特有的调皮表情笑了笑。姑且不说惹人厌，第一次见到她眼底的卧蚕和圆圆的酒窝，真的非常漂亮。</p><p class="story-paragraph">不对，现在不是盯着人家看的时候，回到正题。我有像现在那么想欺负生病的人过吗？今天发生的事情，其实是围绕着刘知珉的楚门世界吗。像3个月大小狗狗一样的金旼炡，跟我们社团前辈交往的是真的吗？真的有和这种像白吐司一般软绵绵的孩子谈恋爱、身体接触的想法吗？是不是有必要合理地怀疑一下，她刚才那些发言的真伪？</p><p class="story-paragraph dialogue">「眼珠子还转来转去」</p><p class="story-paragraph dialogue">「别盯着我看」</p><p class="story-paragraph dialogue">「不想看也没办法，姐姐的眼睛太大了，看得很清楚，几乎占了脸的一半」</p><p class="story-paragraph dialogue">「别开玩笑了」</p><p class="story-paragraph dialogue">「总之，姐姐好像很在意呢」</p><p class="story-paragraph dialogue">「才不、都说了完全不在意，到目前为止跟你一块旅行，一点也没有不自在，而且我们已经一起洗过桑拿了，现在共享一间房」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「有什么关系？」</p><p class="story-paragraph">知珉完全被旼炡的节奏影响，像狂奔一般Rap之后，用比蚂蚁还小的音量补充说明。</p><p class="story-paragraph dialogue">「又不是一张床」</p><p class="story-paragraph">啊、早知道不说这句了。</p><p class="story-paragraph">脑袋一阵一阵抽痛，即使这样，凝结的空气也不会放过知珉。</p><p class="story-paragraph">自从知珉说出“一张床”开始，两个人的狭小空间被印上无数休止符。嘻嘻哈哈笑着的旼炡突然停下，慌张的眼神呆滞。原本吃得津津有味的午餐黯然失色，知珉脸色一下子变得苍白。现在这种心情，好想死。早知道就别管这孩子生没生病，好好玩一会再回来就是了。都怪自己多管闲事，让气氛变得诡异。</p><p class="story-paragraph">吃晚饭的时候，两人也没有什么特别的对话。不知是不是旼炡最终真的受不了，先说了句“姐姐”开启对话。知珉早已变成比刚才更加别扭的旧型机器人，缓缓地和旼炡对视。</p><p class="story-paragraph dialogue">「现在是不是有点太努力想假装没事了？」</p><p class="story-paragraph dialogue">「…是有点」</p><p class="story-paragraph dialogue">「你的慌张我可以理解」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「突然说了那样的话逗你玩很抱歉，还有如果用一间房会不自在的话就直接说吧」</p><p class="story-paragraph dialogue">「你身体好点了吗？」</p><p class="story-paragraph">看起来好多了。尴尬地补充后，旼炡像刚才一样咕噜咕噜喝下感冒药，点头表示自己没事。微笑也缓解了尴尬的气氛。</p><p class="story-paragraph dialogue">「多亏了姐姐，而且还买了吃的回来给我，真的非常感谢」</p><p class="story-paragraph dialogue">「没什么的，不用谢」</p><p class="story-paragraph dialogue">「因为刚才说了很多我的事有点害羞，才故意逗姐姐的」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「对不起，本来想说的是，谢谢你今天照顾我」</p><p class="story-paragraph">分明听见墙的某处“啪”一声掉下了什么东西。知珉忽地环顾房间，才后知后觉。当然没有掉下任何东西，因为便宜酒店的墙上连一幅画都没有，这只是心脏的一角有点抽痛的声音。</p><p class="story-paragraph">十分讶异，这个叫金旼炡的孩子搞什么啊，尽情地调皮捣蛋完了，立刻又筑起高墙警惕着自己，现在却摆出像个做错事小孩的脸，说是因为害羞才那样的。但见她这么老实的模样又…好可爱，确实很可爱。如此一来什么都想原谅了啊，甚至想取消刚才打她后背的程度。</p><p class="story-paragraph dialogue">「知道了」</p><p class="story-paragraph">将这些心里话放在一旁，知珉微微一笑回答道。</p><p class="story-paragraph">不知不觉，到了旅行的第二晚。</p><p class="story-paragraph">刚摘下面膜的知珉“啪啪”拍了拍光滑的脸，慢慢地回想着今天。虽然没发生什么特别的事情，但总觉得今天比昨天更疲惫、也更充满活力。难道是因为突然听到旼炡的过去而头晕脑胀？从结果来看，由于这个事件，知珉倒是和旼炡亲近了许多。问题是，这种亲近和知珉所希望的“成为可靠的姐姐”有着相当大的不同。</p><p class="story-paragraph">和旼炡在一起的时候，自己怎么就会不由自主把脑中的话说出来呢？想到自己支支吾吾的样子，真丢脸。知珉用手轻轻拍打涂满润唇膏的嘴唇膏，看着已经躺下的旼炡。你知不知道这种心情呢。熄灯不到10分钟，旼炡就蜷缩在自己的床上睡着了。随着规律的呼吸声，小小的肩膀微微起伏。身体不舒服，应该很累吧。不久前笑着嬉闹的样子消失无踪，只剩垂放在床边的白皙手腕，看在眼里更是心疼。</p><p class="story-paragraph">知珉把手伸向了旼炡的前额。虽然还发着低烧，但比昨天好了许多。只是酒店提供的被子很薄，如果可以再裹紧一点好像会更好。除了被子之外，没有更暖和的东西了吗？苦恼了一番，想起旼炡的巨大背包，里面应该有能盖的东西吧。</p><p class="story-paragraph">知珉跪在旼炡的包旁，因为没开灯，所以想拿个触感像被子一样的东西。背包拉链一拉开，正好抓到了细纤维毛毯。正当她准备重新整理被弄乱的背包时，有什么东西突然掉下。知珉生怕细碎的声响吵醒旼炡，看向床边，所幸她并没有醒过来。</p><p class="story-paragraph">掉在地上的东西无论大小还是形状都像个钱包。散落在地上的方形钱包，看来是塞在里面的零钱和门票都散了出来。知珉先捡起脚边散落的东西，接着用手在黑暗中摸索。</p><p class="story-paragraph">有个东西被拿起。四角形的…卡片？不对，是照片之类的。</p><p class="story-paragraph">和预想的一样，是张照片。知珉产生了奇妙的即视感。和飞机上照明灯刚熄灭、瞄到旼炡的侧脸和笔记本电脑时一样。自己好像在暗自窥视旼炡的隐私。习惯了黑暗的双眼，将照片中两人模糊的脸庞看得清清楚楚。</p><p class="story-paragraph">自从这次莽撞的旅行开始，警告的声音第一次响起。照片中摆出亲密姿势的两人，头靠着头拍照，脸上的表情像不知道将来会发生什么事，笑得非常灿烂。</p><p class="story-paragraph">不是、不是的话就好了，拜托。</p><p class="story-paragraph">听见自己坦诚的心声，最惊讶的还是自己。到底希望什么不是呢？在寂静的黑夜里，知珉反问自己。难道是想否定认识的前辈与旼炡交往了很长时间的事实吗？为什么对这个明明与自己没有任何关系的主题，有这种扭曲的心理。</p><p class="story-paragraph">知珉作为外人，算是插足了两人建立的警戒线。从这里开始走向完全不同的道路，虽然只是意外，却开启了目的地不详的秘道。在那里，旼炡摆着一张陌生的面孔，好像在责备自己为什么非要翻开那些过去。</p><p class="story-paragraph">要不要进入那个地方，已经不是知珉能决定的了。</p></div>
      </section></template>

        <div class="chapter-copy"><p class="story-paragraph">旼炡的前女友。</p><p class="story-paragraph">那个人的名字是——</p><p class="story-paragraph">不、好像不需要说名字。</p><p class="story-paragraph">还是统称前辈吧。</p><p class="story-paragraph">她总是在社团教室的中心，被其他孩子包围着。这就是知珉记忆中对前辈的印象。前辈在舞蹈部以实力强和漂亮著称，所以对这个名字和脸蛋印象深刻。</p><p class="story-paragraph">入部当天，第一次与前辈面对面，和传闻没有太大区别。适合白衬衫的清冷形象、细嫩娇小的身材和白皙的皮肤，即使看起来有些面无表情，但嘴角总是微微上扬，以及偶尔捋过散落在背后褐色长发的手。前辈支着下巴呆呆地看着新生们提交的申请书，接着低声开口。很抱歉想问个无关的问题，你身高多少？</p><p class="story-paragraph">知珉一直都比同龄人高。刚上高中时比现在矮一点，167左右。听到回答的前辈噗哧笑着自言自语。太不像话了，是因为比例好吗？看起来好像超过170了，个子高真好，好羡慕啊。</p><p class="story-paragraph">一块儿面试的其他人水平不相上下，部员们正在讨论这次要淘汰多少名新生。不知道是不是纯粹看舞蹈实力，还是因为有着前辈羡慕的高个子，当天参加面试的孩子中，只有一半能进入社团，其中也包括自己的名字。知珉和社团成员很快就熟络起来了，等待练习的同时，几乎每天都会在社团教室进进出出。那之前，没有和前辈有特别的交点。</p><p class="story-paragraph">那时知珉是学校校服模特，在拍摄结束后，包括学报在内几家媒体大篇幅刊登了照片。第二天，前辈格外亲切地与自己搭话。</p><p class="story-paragraph dialogue">「我看到照片了，拍得特别漂亮。」</p><p class="story-paragraph">校服很适合你。突然受到称赞的知珉害羞又礼貌地打了招呼。虽然不知道有什么原因，但那天之后前辈的态度变得友好起来，照顾自己的次数明显增多，每次有团体活动时都会主动联系。一起吃午饭的机会也自然而然增加了。在人群中特别显眼，知珉觉得这就是前辈对自己产生某些共鸣的原因。当然，两人的性格不同。前辈就像从出生就备受瞩目的天生艺人，似乎非常享受向着自己的视线，当然也擅长带领其他人。</p><p class="story-paragraph">姐姐好像真的很厉害，看她表演之前完全不紧张，即使错了表情也不会乱…听到知珉一连串赞美，前辈的反应倒是十分平静。</p><p class="story-paragraph dialogue">「我好像从来都没想过要紧张」</p><p class="story-paragraph dialogue">「怎么说，在人多的地方总是会紧张的吧」</p><p class="story-paragraph dialogue">「知珉你更特别」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「对别人的视线这么在乎的孩子，怎么有办法当制服模特呢？」</p><p class="story-paragraph">恰逢学校庆典前夕。舞蹈部成员们为了演出，一起准备了整整一个月。时常扎着头发、穿着运动服练习到深夜。在临近庆典之际，到了校庆前一天，同甘共苦的成员们团结的气氛依然持续着，在练习室排练最后的舞台走位。忙碌了一整天，到了稍微休息片刻的夜宵时间。</p><p class="story-paragraph dialogue">「我稍微出去一下」</p><p class="story-paragraph">接到某人联系的前辈，面带笑容匆匆地从后门溜走了。于是，前辈最近的恋情自然而然成了剩下的人八卦的话题。</p><p class="story-paragraph dialogue">「姐姐现在的男朋友是谁来着？」</p><p class="story-paragraph dialogue">「不是说和隔壁学校长得帅的棒球部前辈交往吗？」</p><p class="story-paragraph dialogue">「不是的，跟那个人已经分手有一段时间了」</p><p class="story-paragraph">前辈交往的人换得很快。据说，如果有人向她表白就会接受，如果说要分手，也不会挽留。不会在SNS上留下情侣合照，更不是会对身边的人详谈自己恋情的人。也因此，社团的成员们甚至都分不清现在的男朋友是谁。</p><p class="story-paragraph">对知珉来说，前辈是成熟的典范。即使像流水一样不停换男人，前辈也有着同龄女孩所向往的帅气姐姐形象。当时还觉得那样看起来很酷，挺适合的。只是她秘密的恋爱史知珉完全不了解，所以无法对孩子们的推测多说什么。</p><p class="story-paragraph dialogue">「上次好像说过，现在交往的是年下」</p><p class="story-paragraph dialogue">「真的吗？一年级？还是二年级？是谁啊？」</p><p class="story-paragraph dialogue">「这个我也不知道」</p><p class="story-paragraph">孩子们三三两两地围坐在一起，对前辈的现男友进行了一阵推测后，依然没有得出答案，决定各自休息。大家等得无聊，都在盯着表看。时间已经过去很久，但前辈还是没有回到练习室。一直看着手机发呆的知珉也越来越感觉疲惫，拿起洗漱用品走向了厕所。</p><p class="story-paragraph">熄了灯的学校走廊一片漆黑。不想呆在无声无息的洗手间太久，一个人孤零零地站在阴森的走廊上，挤着牙膏。但是，正要将牙刷放进嘴里时，不知从哪传来了惊悚的金属撞击声。</p><p class="story-paragraph">唧~</p><p class="story-paragraph">声音像是桌子刮过地板。从隔壁教室发出的噪音非常清晰，不可能听错。知珉停下动作，僵直地望向教室内。完全不见人影。那么，刚才到底是什么东西？不知自己在想什么，虽然害怕地发抖，知珉依旧无法抑制好奇心，慢慢深呼吸推开门。漆黑的教室内果然是空荡荡的。</p><p class="story-paragraph dialogue">「…谁在这里吗？」</p><p class="story-paragraph">知珉努力装冷静，说出恐怖电影女主才会说的台词。当然，并没有得到回答。这时，只见桌上散落的一件衣服，这是前辈穿的连帽夹克，明明去见男朋友，怎么把衣服丢在这里了？将手上拿着的牙刷尴尬地咬在嘴里，往教室后面扫视一番。但是怎么看都不见人影。不管了，如果继续呆在里面，好像会起鸡皮疙瘩。她赶紧拿好衣服离开教室。</p><p class="story-paragraph">那天的记忆过渡到在学校前面的车站，两个人等公交车的时候。见前辈只穿着白色短袖T恤，才想起，自己把捡到连帽衫的事忘得一干二净。知珉把从空教室拿来的衣服递给前辈说。那个、这个…是姐姐的吧？</p><p class="story-paragraph dialogue">「嗯，是我的没错」</p><p class="story-paragraph dialogue">「怎么把衣服丢下就走了呢，如果我没拿来差点要出大事呢」</p><p class="story-paragraph dialogue">「这个是从哪里找到的？」</p><p class="story-paragraph dialogue">「好像是在空教室里，在教室换了衣服吗？」</p><p class="story-paragraph dialogue">「嗯，流了太多汗，穿着运动服去见男朋友有点那个」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「我都忘了，谢啦」</p><p class="story-paragraph dialogue">「没什么」</p><p class="story-paragraph dialogue">「你明明一起练习的，都没流什么汗呢」</p><p class="story-paragraph dialogue">「我对味道有点敏感，所以常常喷香水」</p><p class="story-paragraph dialogue">「怪不得，每次见面都散发好闻的香味」</p><p class="story-paragraph dialogue">「香味很棒吧，下次带样品推荐给你」</p><p class="story-paragraph">过了一段时间，对话很顺利地进行。在公车来之前，两人谈到了明天庆典时穿的衣服和舞台准备等等事情，前辈偶尔会看一下响起提示音的手机。应该是刚才见面的男朋友吧，想着想着知珉诧异地问道。姐姐的男朋友不是来接你的吗？不一起回去吗？本来集中于回复讯息的前辈，目光转向了提问的知珉。</p><p class="story-paragraph dialogue">「因为说必须先离开，所以见了个面就走了」</p><p class="story-paragraph dialogue">「听说了是年下，一定很可爱吧」</p><p class="story-paragraph">前辈默默地噗哧一笑。表情像是在问“消息都传到那里了吗？”，这时以为前辈会像平时一样潇洒地略过。原本预设她会回答：就是个喜欢我的孩子，向我告白后才开始交往的。年下也是为了消遣才试试的。但真正收到的却是意料之外的反应。</p><p class="story-paragraph dialogue">「嗯，超级可爱的」</p><p class="story-paragraph">看到前辈满脸笑容炫耀似地说道，知珉反而愣住了。非常意外，还以为前辈对私生活是绝对不公开的。之所以对那天的简短对话记忆如此深刻，也许是因为前辈的下一句话。</p><p class="story-paragraph dialogue">「因为太可爱了，偶尔会咬一口」</p><p class="story-paragraph">咬？</p><p class="story-paragraph">这是可以说的吗？姐姐是会说“咬年下男友”这种话的人吗？形象是不是稍微反转了？但在惊慌失措的知珉做出反应前，两人各自等待的公交车就双双到站了。前辈和刚才去见男朋友时一样匆匆跑去，轻盈地搭上车。</p><p class="story-paragraph dialogue">「知珉啊，我先走了，明天见吧」</p><p class="story-paragraph">知珉挥手向前辈再见，像是没听到前辈说的，关于她可爱到想咬一口的年下恋人的话。</p><p class="story-paragraph">在北欧某个寒冷的城市，知珉在梦里陷入徘徊。没想到昨晚突然看到的一张照片，会让自己陷入当时的记忆。甚至连以为忘记的小事情，也记得这么清楚。</p><p class="story-paragraph">在这之后，知珉也没有醒来，接连做了几个短暂的噩梦。背景是前两天乘坐飞往伦敦飞机的瞬间。哥哥，我现在出发了，真想快点见面。带着激动的心情与明俊联系的瞬间，手机通知栏上浮现他像罪人一样谢罪的信息。</p><p class="story-paragraph">亲爱的对不起。怎么办呢。因为突然要长期出差。感觉我们见面的时间会延后。亲爱的对不起。怎么办呢。因为突然要长期出差。感觉我们见面的时间会延后。亲爱的对不起。亲爱的对不起。亲爱的对不起。亲爱的对不起。</p><p class="story-paragraph">删了又删，却没完没了。就像中毒一样，连续收到了大概100则通知。担心手机可能就要会爆炸，她双手捂住耳朵大叫。好吵、太吵了。这时，声音突然停下。知珉蜷缩着身体，观察周围。旁边的座位上本来应该有的人-就是指旼炡-她不在，只有一只又白又漂亮的小狗在喘着气坐着。就像自己是人一样，肩上还挂着耳机。</p><p class="story-paragraph">知珉被吓了一跳，急忙去找乘务员。你可不能待在这里。那个，这里有条狗跑进来了。没骗人，是真的。谁来？自己急得想伸手，旁边的小狗便开始扭动起小身子，吵吵嚷嚷地大叫了起来。</p><p class="story-paragraph">太吵了，小白狗啊。光那些短信都快烦死了，不要连你也这样，别叫了。当然就算嚷嚷，狗也不可能听懂人话。可小白狗却立刻吭哧吭哧地用鼻子顶了顶，扑向知珉撒娇。这又是怎么了？老实呆着吧。抚摸着小白狗毛茸茸的背，扑进怀里的捣蛋鬼才停止了喘气。接着用看上去像人的眼神，露出软绵绵的模样。什么呀、怎么了，你为什么用那种眼神？</p><p class="story-paragraph">你很在意吗？</p><p class="story-paragraph dialogue">「…嗯？」</p><p class="story-paragraph">刚刚小白狗是不是说了什么？如果没听错…还用的是金旼炡的声音。知珉抚摸着白狗的下巴，再次问道。你刚刚…跟姐姐说了什么？小白狗用更清脆的声音这样说道。</p><p class="story-paragraph">我好像有点在意，姐姐的香气</p><p class="story-paragraph">不对、其实是姐姐…</p><p class="story-paragraph">没听错啊。知珉吓了一跳，直接将抱在怀里的白狗丢下。白狗可能是因为自己对它会说话的态度而生气，又开始吠叫，知珉则因腰上怎么也解不开的皮带挣扎着。当然乘务员始终没有过来。最终，被咆哮的小白狗咬住手指，就是这个噩梦的最后一个场景。</p><p class="story-paragraph dialogue">「姐姐，还在睡觉吗？」</p><p class="story-paragraph">直到耳边传来的清脆嗓音，刚刚还在梦里听到的声音成为morning call，知珉才得以睁开眼睛。刚挣脱漫长的梦境，回到了现实世界。凉飕飕的卧室，又过了一天，天花板变得稍微熟悉。还有声音的主人小白狗。不是、是金旼炡。自从看见那张情侣合照，晚上辗转反侧回想起高中时期。无法想象，所有事情可能都在自己不知情的情况下，全部连接在了一起，知珉慢慢地眨了眨眼睛。</p><p class="story-paragraph dialogue">「看看你的黑眼圈」</p><p class="story-paragraph dialogue">「…不要盯着别人刚起床的脸看」</p><p class="story-paragraph dialogue">「昨天很晚睡吗？我叫了你好几次都没起来」</p><p class="story-paragraph">自己在床上翻来覆去时，旼炡已经从冰箱翻出了一大堆食物，全放在小桌子上。</p><p class="story-paragraph dialogue">「该吃早饭了，还是想再睡一会儿吗？」</p><p class="story-paragraph dialogue">「不了，也该起床了」</p><p class="story-paragraph dialogue">「不过你是怎么知道我有毯子的？是在晚上给我盖的吧？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「托您的福，我睡得很香」</p><p class="story-paragraph">旼炡嚼着刚从冰箱拿出来的沙拉，浅浅地笑了。知珉埋在被窝里，呆呆地看着今天特别喋喋不休的室友。这孩子从一大早就精神焕发。可能因为睡得很香，脸上重新散发光泽，恢复食欲后还自己从冰箱拿东西出来吃。复杂又微妙的叹了口气。很庆幸小鸟宝宝能康复，但现在问题出在，因意外的梦而状态不佳的鸟妈妈身上。</p><p class="story-paragraph">总之今天是在赫尔辛基的最后一天。傍晚要办理退房手续，前往城郊，还需要乘坐夜间火车，行程算是挺赶的。剩下的时间做什么好呢，两人仔细想了想。</p><p class="story-paragraph dialogue">「来到这里一次也没逛过街，要不要逛逛商店？」</p><p class="story-paragraph">旼炡在地图上标了几处值得去的地方。购物是个不错的选择，白天去买衣服，晚上以坐火车收尾。整整一天的行程简单明了，很不错。一想到要参观当地商店，知珉就鼓足了劲，马上准备出发。</p><p class="story-paragraph">两人比前一天裹得更加严实，只要是卖手制物品的漂亮小店、或免税服饰店，都会停下脚步进去。只是两人的风格有着天壤之别，知珉对衣服十分讲究，所以会认真挑选，而旼炡只需要10分钟。知珉每次换完衣服出来，都会反复询问一旁旼炡的意见。结果，从店里拿出来的购物袋，其实全是知珉买的。</p><p class="story-paragraph">旼炡喜欢什么样的衣服？知珉看了看一旁的室友，仔细地推测了一下。在宿舍，旼炡的衣服全都是宽松的衬衫或连帽衫。除此之外，还有格子睡衣等。</p><p class="story-paragraph">知珉抵达北欧后，一直依赖旼炡厚实的羽绒服。怀着感激的心情，想给她买点小东西，但没有遇到合适的机会。为此，只要直接问她想要什么就行，很简单。所以，知珉偷偷地拿起一件适合旼炡的衣服。这个好像挺适合你的。莫名其妙开了个头。</p><p class="story-paragraph dialogue">「这个不好看吗？」</p><p class="story-paragraph dialogue">「嗯…太轻飘飘了吧？比起我好像更适合姐姐」</p><p class="story-paragraph dialogue">「那这个呢？」</p><p class="story-paragraph dialogue">「花纹不怎么样好看，也不是我的喜好，pass」</p><p class="story-paragraph dialogue">「这个也不怎么样吗？这个真的很适合你欸」</p><p class="story-paragraph dialogue">「袖子的部分很奇怪，看起来就不太舒服」</p><p class="story-paragraph dialogue">「就是因为特别的袖子很漂亮才选的啊」</p><p class="story-paragraph dialogue">「特别的话姐姐穿就好，干嘛总用我的身体来比？」</p><p class="story-paragraph">听见顾客挑剔的批评声，知珉不禁叹了口气。她好像也不是为了气人故意这样的，两人真的这么不合吗？旼炡的服装哲学十分顽固，如果有看起来不舒服的装饰，就绝对不会喜欢。但真的很努力为她挑选了可爱的衣服。“既然是姐姐选的，那就试穿一下吧？”知珉一直等不到这句话，对旼炡感到十分心寒。</p><p class="story-paragraph dialogue">「这个不错吧？」</p><p class="story-paragraph dialogue">「哦、你发现喜欢的东西了吗？」</p><p class="story-paragraph">知珉因久违的反应而眨了眨眼，视线转向她。但那件衣服果然是带有不规则格子的衬衫。旼炡挑选的简单双层格子衫，与自己带来的衬衫，除了微妙的颜色差异外，完全感觉不到差别。难道是格子的间距有什么不同吗？但这些根本无所谓，知珉一点都不想买那件衣服。</p><p class="story-paragraph">自己奇怪的固执正在发作。嗯、当然，就是想给她买件喜欢且能常穿的衣服——本来是这么想的，不过现在更想买件自己也觉得漂亮的衣服送她。穿着宽松的衬衫虽然很可爱，但是她的身材本来就比较纤细，所以露腰的一定也很适合，带蕾丝的也想让她试穿看看。</p><p class="story-paragraph">不过在这之后，旼炡不顾自己持续的求爱，只说了句“不是我喜欢的类型”拒绝。因为不停反复着这种情况，知珉最终只好拿了比被旼炡拒绝的衣服大一两码，以自己穿为目的购买。手上的衣服越来越多，依然没有放弃给她送礼物。一定要挑到固执的金旼炡无法拒绝兼具实用、舒适、又适当漂亮的东西。转念的瞬间，就看到了一个非常恰当的东西。</p><p class="story-paragraph">知珉摆弄着放在柜台正中央的灰色系连指手套。这几天她光着手出门，看上去很冷，所以想给她戴上手套。应该很适合吧。想了想，这正是最棒的礼物。一定程度上满足了知珉想让她穿上可爱服装的需求，再加上不喜欢寒冷的旼炡，没有理由拒绝毛手套。</p><p class="story-paragraph">很好，这就是刘知珉的pick。</p><p class="story-paragraph">知珉怕被旼炡看见了，赶紧拿了两个同样的颜色到收银台。心里打算一个自用，另一个给挑剔的客人。但是应该在什么时候给呢，今晚要坐夜间火车，要不把礼物作为惊喜放在枕头边？知珉比收到礼物的人还要兴奋，开心地抱起包装简洁的盒子。真想赶快看到她双手戴上可爱的手套。</p><p class="story-paragraph dialogue">「手上提着那么多东西，你打算怎么逛啊？」</p><p class="story-paragraph">旼炡还不知道其中之一是给自己的东西，以无聊的表情等待着知珉的出现。旼炡在听见不管这件格子、那件格子，喜欢的衣服都被说不怎么样后，刚才就开始闹起别扭。某刻开始，就不再问自己挑的衣服好不好看，所以至今仍然空着手。自己是不是说得太直白了？可是还是希望她别一直把无聊的格子穿在身上。</p><p class="story-paragraph dialogue">「要先回酒店再出来吗？」</p><p class="story-paragraph dialogue">「不用，没关系」</p><p class="story-paragraph dialogue">「可是看你这样东西太多了」</p><p class="story-paragraph dialogue">「都是些不重的衣服，没关系的。No problem」</p><p class="story-paragraph dialogue">「完全就是购物狂…」</p><p class="story-paragraph">不知不觉，随着手上购物袋数量的急剧增加，旼炡也开始抱怨。现在提在手中的东西如下：连指手套，还有被旼炡拒绝后知珉自己买下的三件衣服，要和明俊一起穿的圣诞礼物用红色丑毛衣两件。随意逛逛收获还不错。</p><p class="story-paragraph dialogue">「要在那么短的时间内，买这么多东西也不简单吧。真的」</p><p class="story-paragraph dialogue">「是因为你都不买，所以才那样的」</p><p class="story-paragraph dialogue">「少拿我当借口。总之我们分着拿吧」</p><p class="story-paragraph">两人和睦地分着行李，慢慢朝商店街的尽头走去。</p><p class="story-paragraph dialogue">「哦，这里好像也在卖什么呢。」</p><p class="story-paragraph">在巷子尽头，偶然遇到店铺挂着写有MOOMIN SHOP的英文招牌。可能是卖姆明周边的卡通商店。这么看来，姆明好像是芬兰作家创作的角色，在机场也设有姆明咖啡厅。</p><p class="story-paragraph">要不要去看看？听见这句话，旼炡就乖乖地跟在自己后头进来。知珉一进入商店，就和蓝眼睛、脸蛋蓬蓬可爱的姆明玩偶对视。见那呆呆的表情，不由得露出笑容。北极狐和小白狗都很像，但怎么跟这个也那么像呢。无论怎么看，姆明都和后面跟过来的旼炡长得一模一样。为什么只要白白嫩嫩都长得像金旼炡呢？看着陈列柜上堆满看上去简直和旼炡是一家人的姆明，总情不自禁笑出声来。</p><p class="story-paragraph dialogue">「旼炡啊，它跟你长得完全一模一样吧？」</p><p class="story-paragraph">也许是觉得被取笑而委屈，旼炡立刻瞪着眼睛反驳。才不像。</p><p class="story-paragraph dialogue">「很像吧，简直是你弟弟」</p><p class="story-paragraph dialogue">「他不是河马吗？」</p><p class="story-paragraph dialogue">「河马…不是吧，不知道」</p><p class="story-paragraph dialogue">「到底哪里像了？」</p><p class="story-paragraph dialogue">「就是整体看来都像」</p><p class="story-paragraph dialogue">「我实在不懂」</p><p class="story-paragraph dialogue">「很像啊，要不然为了公平起见，去问问店员？」</p><p class="story-paragraph dialogue">「算了吧你，这里没什么好买的，我们赶紧出去吧」</p><p class="story-paragraph dialogue">「我要带他回去」</p><p class="story-paragraph">知珉就这样抱着玩偶走出了店铺。虽然任谁看了都会觉得有点奇怪，但是如果从纸袋缝隙和姆明呆呆的眼神对视上，就会忍不住失笑。人的认知是很奇怪的，一旦开始想象，印象就会被固化。</p><p class="story-paragraph dialogue">「姐姐从刚才开始到底在干嘛啊？」</p><p class="story-paragraph dialogue">「旼炡啊，能帮我拿这个玩偶吗？」</p><p class="story-paragraph dialogue">「为什么，那个那么轻」</p><p class="story-paragraph dialogue">「就是每次和他对视，我都觉得好好笑」</p><p class="story-paragraph dialogue">「别一直笑了，真的。在街上这样很丢脸」</p><p class="story-paragraph">旼炡一边碎念，立刻抓起娃娃放进自己包里。不晓得是因为在路上大笑被搞得不好意思，还是因为被戏弄像不知道是河马还是什么的姆明，旼炡的耳朵即使戴上了淡蓝色的帽子，也依然通红。她比呆愣愣的姆明娃娃还可爱多了，知珉又露出微微一笑。</p><p class="story-paragraph">到了下午，徐徐的微风也停了下来，阳光从云层中透出。在商店街街道旁停放着一辆雪糕车。我们买一个分着吃吧？旼炡却以“天气冷，还吃什么冰淇淋”为由拒绝。但在自己执意要她尝尝看时，也乖乖吃了一口没有推辞。两人逛久了，速度慢了下来，现在正是补充糖份的最佳时机。</p><p class="story-paragraph">知珉一边等待着电车，瞟了眼正在吃第五口冰淇淋的旼炡。如果手一直伸出去的话，看她气势汹汹，连底部甜筒都会吞掉的。满嘴冰淇淋那圆圆的脸蛋，实在非常可爱。原来喜欢甜食啊。如果思绪就此停下就好了，但梦里前辈的声音突然在耳边响起。</p><p class="story-paragraph">超级可爱，因为太可爱了，偶尔会咬一口。</p><p class="story-paragraph">一句深刻到无法忘记的话。可爱到想咬一口，自己现在虽然能够理解…到底，前辈会咬旼炡哪里呢？像藏了零食的嘴巴吗。还是紧握着购物袋的手指呢？除此之外其他部位似乎真的不合适再想，决定把想法从脑中抹去。</p><p class="story-paragraph dialogue">「好好吃啊这个，真是买对了」</p><p class="story-paragraph">结果，看到已经咔嚓咔嚓嚼起甜筒的旼炡，回到现实的知珉偷偷地叹了口气。这时，从远处传来哐哐响声，紧接着，长得像玩具的路面电车缓缓地靠近轨道停下。</p><p class="story-paragraph dialogue">「这是Tram吧？我还是第一次坐路面电车呢」</p><p class="story-paragraph dialogue">「我也是」</p><p class="story-paragraph">知珉坐上电车，把之前随身携带的重担堆放在角落。双手终于获得自由，心里轻松多了。电车缓慢地行驶在市中心，每个角落都有让人放松的地方，当下似乎就要犯困了。</p><p class="story-paragraph">如果每天乘坐像玩具一样的电车，去学校或公司会怎么样呢？即使迟到，心情也能平静下来吧？洗桑拿的时候也感觉到，赫尔辛基非常适合白色和蓝色。与游客如织的其他欧洲首都相比，这里少了许多华丽氛围，空气平静而安静。知珉甚至想，在这座城市里，似乎只有自己和旼炡两个游客。</p><p class="story-paragraph">像这样在移动的时候，知珉习惯了偷偷看向旼炡软绵绵的侧脸。看见那充满好奇心的眼神，观察着她的自己也感到兴奋不已。正好黄色的路面电车和旼炡的头发也很般配。突然想把这一幕拍成照片留下来，一整天一直拿着购物袋，所以没怎么拍照，想在手上空空的现在留下一张。知珉在行李之间翻来翻去，寻找装有手机的包。</p><p class="story-paragraph dialogue">「旼炡啊，我在这儿给你拍一张」</p><p class="story-paragraph">奇怪，为什么摸不到呢？应该埋在里面的某个地方吧。知珉先喊了旼炡，接着继续找包。但是无论怎么翻找，都摸不到熟悉的质感。直到仔细地翻看堆积如山的购物袋后，才出现不详的预感。说不定不只是手机不见了。</p><p class="story-paragraph">啊，不会吧，拜托。</p><p class="story-paragraph">这是在愉快的购物后最糟糕的情况。脸和手同时僵住，坐在对面的旼炡表情也跟着跟着严肃起来。电车仍然在安静地行驶中。</p><p class="story-paragraph dialogue">「干嘛，怎么那样？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「什么东西不见了吗？」</p><p class="story-paragraph">我的老天啊、刘知珉。</p><p class="story-paragraph">今天真的不是疯了吧。</p><p class="story-paragraph">没有、怎么也找不到包包。姆明玩偶代替包包，从购物袋里蹦了出来，用呆愣的眼睛看着失语的知珉。姆明的眼神好像在说。从刚才开始就一直哈哈大笑，你现在可出大事了啊。</p></div>
      </section></template>

        </aside>
        <div class="chapter-copy"><p class="story-paragraph">救救刘知珉。</p><p class="story-paragraph">活到这么大了竟然把包弄丢。又不是在家附近，在陌生的旅行地把包丢下，让知珉陷入了恐慌。失去主人的皮包现在应该也在赫尔辛基的某处漂泊。也许早已成了某人的目标。难道是被扒手偷走了吗？但是赫尔辛基与西欧大城市不同，并不是治安不好或小偷盛行的地方。知珉不得不承认，今天会丢了包，都是自己的错。</p><p class="story-paragraph">现在可不适合悠闲地挑选礼物，再捉弄长得像姆明的室友。也不是说要买冰淇淋吃、思考前辈是不是真的咬了旼炡仓鼠般脸颊的时候。如果不是为了拍纪念照找起手机，说不定过了很久才会发现包不见了。总之，现在的心情，只想把头伸进购物袋大哭。虽然如果自己真的这样做，旼炡一定会劝自己忍一忍。</p><p class="story-paragraph">好在旼炡平静的嗓音，让知珉跟着冷静下来。我给姐姐打个电话吧。旼炡拿着电话等着信号音，摇头表示无人接听。</p><p class="story-paragraph">旼炡啊，对不起，能不能再试一次？知珉语气里满是焦急，这之后又连续打了两三次电话，但结果都一样。想要轻松找到遗失的包，变得没那么容易。出大事了，该怎么办。知珉低着头失魂落魄地站着。</p><p class="story-paragraph dialogue">「包里有什么吗？」</p><p class="story-paragraph dialogue">「手机、钱包还有…」</p><p class="story-paragraph">目前最紧急的是手机和钱包。其他还有香水、护手霜和喝剩的冰茶。还有一大堆珍贵的口红，以及化妆包。</p><p class="story-paragraph dialogue">「…我的化妆包可怎么办？」</p><p class="story-paragraph">本来今天早上就听她说。这么重全都要带吗？知珉一边往化妆包里塞着口红，一边像没什么似的回答旼炡。一点都不重，我本来出门就是这样。</p><p class="story-paragraph">虽然旼炡反复劝阻说：“在旅行中，不是应该把可能弄丢的东西，尽量放着吗？”，但知珉却把这建议当作耳边风。在包里装得好好的，有什么可丢的？真是爱操心。结果，大言不惭地说完，过几个小时之后，竟然发生了包包整个消失的重大事故，真没脸见旼炡。</p><p class="story-paragraph dialogue">「我的口红…好可惜。都是我很珍惜的孩子啊…」</p><p class="story-paragraph dialogue">「姐姐不是带了超级多嘛。那边有几个？」</p><p class="story-paragraph dialogue">「应该有10个以上…？」</p><p class="story-paragraph">知珉没有灵魂地回答。买那些口红的钱都够买一个小包了，要是能分开放就好了。旼炡逮住这个机会叨念，知珉死气沉沉无力反驳，只能垂下耳朵乖乖听旼炡的训诫。想到用了很久的化妆包跟着一起消失，就觉得身体被挖空。虽然在丢失手机的情况下，这还不算最可惜的。</p><p class="story-paragraph dialogue">「护照没带着吧？有没有象是票…或其他重要文件？」</p><p class="story-paragraph dialogue">「嗯，护照在酒店里」</p><p class="story-paragraph dialogue">「那你想想钱包内的东西」</p><p class="story-paragraph">首先是两张卡，然后身份证，还有旅行时提取的现金。幸好钱包内只有今天要用的少量欧元，剩下的都放在宿舍的行李箱里。</p><p class="story-paragraph dialogue">「先把信用卡停用吧，用我的手机联系客服」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">知珉先按照旼炡的话报了失。虽然阻止了资金进一步流出，但也不能就此松懈下来。一挂断电话，旼炡象是在等着自己，不停地提问。</p><p class="story-paragraph dialogue">「还记得钱包里有多少钱吗？」</p><p class="story-paragraph dialogue">「好像拿了100欧元左右。」</p><p class="story-paragraph dialogue">「现在身上钱呢？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「难道完全没有吗？」</p><p class="story-paragraph dialogue">「嗯…没有」</p><p class="story-paragraph dialogue">「那我给你点现金，拿去重新买张交通卡吧」</p><p class="story-paragraph">说完，旼炡赶紧拿钱递给自己。在如此紧急的情况下，知珉的目光投向了旼炡的手。昨天晚上不小心掉下来的钱包，被她拿在手上。回忆起前辈和旼炡亲密的合照，知珉呆呆地把几张欧元放进羽绒服口袋。姐姐，我想了一下。比起丢失皮包的当事人，忙碌的旼炡重新恢复了运转。</p><p class="story-paragraph dialogue">「我们分开行动后再集合会好一点」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「今天不是要准时退房吗？」</p><p class="story-paragraph">是啊，还要退房啊。知珉点了点头。粗略估算一下，考虑到行程，可以来回的时间只剩2-3个小时。</p><p class="story-paragraph dialogue">「而且要拿的行李也很多」</p><p class="story-paragraph dialogue">「…很难拿着这些东西快速移动」</p><p class="story-paragraph dialogue">「所以我觉得我先把购物袋全部拿走，放进姐姐的行李箱，再一起拖过来会更好。姐姐的话，就去刚才去过的地方找包吧」</p><p class="story-paragraph dialogue">「等一下，那我们怎么联系啊？」</p><p class="story-paragraph dialogue">「我借你我的手机」</p><p class="story-paragraph dialogue">「你的吗？」</p><p class="story-paragraph dialogue">「嗯，现在只想到这个方法。有别的方案吗？」</p><p class="story-paragraph dialogue">「…确实没有」</p><p class="story-paragraph dialogue">「等退房的时候，我会在前台借个电话联系你，看看那时的情况，再约地方见面吧」</p><p class="story-paragraph">旼炡就像事先准备好了一样，立即做出回答，有条不紊地整理起购物袋。在陌生的地方，没有包包、钱、身份证孤零零的知珉，其实有点害怕自己一个人往返。但目前看来没有比这更好的选择。也就是说，两人必须配合，才能克服危机。</p><p class="story-paragraph dialogue">「约个地方？如果位置太模糊的话呢？」</p><p class="story-paragraph dialogue">「嗯，那就在火车站？最好不要太晚到」</p><p class="story-paragraph dialogue">「…我会尽快找到的」</p><p class="story-paragraph dialogue">「还有，今天晚上会坐夜间列车，太晚的话，晚餐在列车上随便解决就好」</p><p class="story-paragraph">知珉最担心的，就是今天要离开这座城市。两人退房后，要乘坐10小时以上的夜间火车，前往下个城市。正如旼炡所言，即使跳过晚餐，也得根据何时找到包包，时间随时可能会变得紧迫。如果不能在约定的时间内找到，包包内的手机、心爱的化妆包以及口红，就等于永远再见了，这事死也不能发生。</p><p class="story-paragraph dialogue">「那么我们从现在开始分头行动吧」</p><p class="story-paragraph dialogue">「知道了」</p><p class="story-paragraph dialogue">「我退房后也会马上赶来这里」</p><p class="story-paragraph dialogue">「…要快点来哦」</p><p class="story-paragraph dialogue">「别太担心，应该能找到」</p><p class="story-paragraph">等会儿见。旼炡解锁后，将手机紧紧交付在自己手里，用娇小的身体顶着堆积如山的购物袋，走进地铁站。为什么金旼炡能够如此泰然地迅速行动起来呢？那种爽快的性格确实帮助自己很多。知珉现在真的孤零零地站在路边，没有一个人可以帮忙。虽然脑袋一片空白，但也没有时间闲着了。</p><p class="story-paragraph">知珉从刚来的地方往回走去，冷静地逐步巡视。虽然本来就不觉得走街串巷就能找到，但旼炡的最后一句话就像咒语一样，对知珉起到了镇定的作用。</p><p class="story-paragraph">不要太担心。应该能找到。</p><p class="story-paragraph">是呀，我得找找，只能无条件去找。今天一定会找到包，在夜间列车上像什么事都没发生一样入睡。开始催眠自己，走向刚才经过的店铺。想在旼炡到酒店整理完行李之前，结束这场骚乱。</p><p class="story-paragraph">虽然已经过了30分钟左右，但与期待相反，并没有什么收获。没办法，心里烦躁不安。瞬间，好像除了包包，还忘了什么的感觉。在商店之间呆呆站着的知珉仔细想了想，还有没有什么。只是数了又数，没有其他遗失的东西。</p><p class="story-paragraph">明俊。忘得一干二净地就是明俊，连想都没想到。难道是因为手机不在手上，所以连联系都忘了吗？也许明俊对自己到现在为止都没个回复会感到惊讶。知珉用旼炡的手机按下熟悉的号码，输入信息。</p><p class="story-paragraph dialogue">-现在包不见了，正在找</p><p class="story-paragraph">今天可能联系不上</p><p class="story-paragraph dialogue">-人身安全没有问题，不用担心</p><p class="story-paragraph">现在借用的电话是后辈的电话</p><p class="story-paragraph dialogue">-有什么事就联系这个号码吧</p><p class="story-paragraph">结束联系后，知珉再次切身感受目前的窘迫。唉，嘴里不由自主流露沉重的叹息。现在又该去哪里呢。正在苦恼的时候，手中的手机轻轻地震动。知珉反射性地低头确认画面。</p><p class="story-paragraph dialogue">-旅行有趣吗？一直没收到你的回复呢</p><p class="story-paragraph">这不是明俊的号码，看来收信人是旼炡。对方看似在纠缠着知珉一样，不久又传来了新信息。</p><p class="story-paragraph dialogue">-联系我吧</p><p class="story-paragraph">或许、或许这是——</p><p class="story-paragraph">为什么总是目睹这种情况呢？无意中一个个拼图正在拼凑，在前辈和旼炡之间作为旁观者的我，没有一条可以轻易逃脱的路。知珉平白无故心里就是不太舒服，所以向不在现场的旼炡进行了简单的道歉。虽然没有人指使，但总觉得该说声对不起。</p><p class="story-paragraph">你不想说的那些话，</p><p class="story-paragraph">我偶然间知道了很多。</p><p class="story-paragraph">真的不是故意去看，</p><p class="story-paragraph">昨天也是，今天也是。</p><p class="story-paragraph">所以很对不起，</p><p class="story-paragraph">今天之后就会当没看见的。</p><p class="story-paragraph">不知不觉中，知珉回到了姆明旗舰店所在的街道，在关门之前，她进入了店铺。长得像旼炡的姆明娃娃们依然在货架上看着自己。罔顾自己的殷切期盼，店员并没有捡到遗失物。这里也没有吗？每当确认好几次，还是没有皮包的下落，就心灰意冷。只剩下不到一个小时，现在只能选择几个地方去找。</p><p class="story-paragraph">至少得找到电话才行。绑的约还剩下几个月呢？要去看看便宜的二手手机吗？在知珉考虑起现实的同时，在购买旼炡手套的商店前停住脚步。象是被什么东西吸引，走向手套柜台。也许、说不定是在这吧。</p><p class="story-paragraph">自己的预感是对的。在放有毛手套的地方，包包就好像开玩笑一般那样放着。一瞬间腿软的知珉直接就坐在地上。到底是怎么样精神恍惚去挑手套的，想对刚才的刘知珉发脾气。绑了很久约的手机、钱包、化妆包等都完好无缺。</p><p class="story-paragraph">啊，傻瓜一样。今天还真像个傻瓜。</p><p class="story-paragraph">这时，正好接到了一个电话。虽然是不认识的号码，但因为是赫尔辛基的地域号码，所以可以推测出来。显然是旼炡在酒店退房后，出发前来的联系。按下通话键，马上传来了她高声说话的声音。姐姐，你在哪里？找到了吗？听见电话那头传来旼炡的问候，真是太高兴了，几乎是离散家属相逢的程度。</p><p class="story-paragraph dialogue">「嗯，找到了」</p><p class="story-paragraph dialogue">「卡和现金都在吗？」</p><p class="story-paragraph dialogue">「嗯，嗯，都在」</p><p class="story-paragraph dialogue">「香水呢、口红也都在吗？」</p><p class="story-paragraph">旼炡如同照顾孩子般，逐一询问了包里装着的每一件东西。明明到昨天为止，还下定决心要成为可靠的姐姐，这都算什么啊。知珉松了口气后，决定只往好处想。反正都找到了包，也找回了心灵的平静，那就行了。</p><p class="story-paragraph dialogue">「嗯，东西好像都没被动过」</p><p class="story-paragraph dialogue">「能找到真是太好了…」</p><p class="story-paragraph">听到有些难为情的回答后，旼炡这才放下心来。我马上去找你。旼炡挂断电话前留下的最后一句话，在知珉耳边回荡了许久。</p><p class="story-paragraph">两人约好在中央站见面，休息一会儿一起吃晚饭。坐在咖啡厅内的知珉，把好不容易找回的包紧紧夹在肋下，等待旅伴的到来。恰好在远处，看见一个小不点儿，身上背着什么东西，晃晃悠悠地走近。知珉立刻高兴地朝那面孔挥了挥手。背上背着大背包的旼炡，还用一只手拉着行李箱。</p><p class="story-paragraph dialogue">「手不疼吗？连同我的一次拿了两个行李」</p><p class="story-paragraph dialogue">「没事，一路一直坐着来的」</p><p class="story-paragraph dialogue">「今天下午的日程都因为我乱成一团，抱歉」</p><p class="story-paragraph dialogue">「哪有人都找到了，还一副要死不活的」</p><p class="story-paragraph dialogue">「真的减寿十年了…」</p><p class="story-paragraph dialogue">「那请我吃晚饭吧。应该找到钱包了吧」</p><p class="story-paragraph dialogue">「你想吃什么？」</p><p class="story-paragraph dialogue">「锅包肉」</p><p class="story-paragraph">暂时被忘记的锅包肉又来了。知珉想，这个令人烦躁的突发事件，在旼炡的笑脸下终于落幕，才放下心来。再次见到旼炡，神奇地不再象是昨天那个孩子。也许是因为今天看到了她崭新的一面。</p><p class="story-paragraph">对于知珉来说，旼炡是由几个单一形象所构成的。长得像白嫩小动物的呆愣脸庞，一碰就会倒下的消瘦身体，像孩子一样喜欢甜食的口味，时不时有着让人惊慌失措的才能。同时，旼炡还是可以依靠的人。出乎意料地很果断的人。这瞬间能在我身边让自己感到万幸的人。至少现在的旼炡对知珉而言是那样的存在。</p><p class="story-paragraph">开往芬兰北部地区的夜间列车，开启大门迎接旅客。座位空空如也，让人怀疑是不是马上就要出发。两人预订的二楼客房更加安静。一打开房门，左侧的上下铺立即映入眼帘。床上放着两条毛巾和矿泉水。得益于旼炡先说要使用上铺，知珉自然就占据了下面的空间。</p><p class="story-paragraph">知珉环顾雅致的房间。窗边有张小桌子和简易椅子，在列车行驶期间可以一边观赏风景。空间虽然不大，但带有洗手台和淋浴间也算是应有尽有。列车出发不久，站务员敲了敲房门，简单确认两人的车票后就离开了。在新住处放下行李后，有了安定的感觉，这才放松下来。真的是非常刺激的一天，一块儿行动的旼炡也是这么想。</p><p class="story-paragraph">知珉趁着空闲时间联系了明俊，说自己安全到达。果然电话马上打了过来。像往常一样，一边打电话一边扫视窗外朦胧的夜景。太阳快下山了，窗外看不见多少东西，列车内只有自己的声音在静静回荡，知珉盯着旼炡稍微解开的背包附近。好不容易重逢的室友刚才说出去一会儿就回来，却离开了一阵子。时间也不早了，列车上哪有什么地方好去，这样乱跑。</p><p class="story-paragraph">嗯嗯，知道了，我再给你打电话。结束简短的通话后，考虑了一会儿。要不要去外面找孩子，还是就这样洗澡准备睡觉呢。不知所措的时候，门正好被打开，等待中的脸出现了。</p><p class="story-paragraph dialogue">「你去哪里了？」</p><p class="story-paragraph dialogue">「看看外面的小卖部，有没有卖饼干之类的东西？」</p><p class="story-paragraph dialogue">「应该喊我一起去的，买了什么东西吗？今天忙得不可开交，都没剩什么可吃的了」</p><p class="story-paragraph dialogue">「在列车上确实没什么。早上到目的地后再去买东西比较好」</p><p class="story-paragraph dialogue">「就那样吧」</p><p class="story-paragraph dialogue">「还有，要不要看一下这个？」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「短信。好像是给姐姐的」</p><p class="story-paragraph dialogue">-如果有什么事一定要联系我</p><p class="story-paragraph dialogue">-知珉在旅行期间请多多关照</p><p class="story-paragraph dialogue">「他说请多多关照」</p><p class="story-paragraph">啊，完全忘了。明俊给旼炡留下的信息让知珉感到不好意思，于是顺手摸了摸头发。刚才我用你的手机联系了。抱歉，无视就好。这时坐在窗边的旼炡无心地呢喃道。</p><p class="story-paragraph dialogue">「…男朋友那么体贴真好」</p><p class="story-paragraph">那么体贴真好？</p><p class="story-paragraph">虽然可以当作是随口一说，但不知为何心情很微妙。两年的恋爱好像被一一窥见，然而真正深入了解了旼炡过去的，反而是自己。</p><p class="story-paragraph">明俊如旼炡所说，是体贴的人吗？对于刘知珉来说，他是怎样的人呢？成熟的大人，工作稳定，有很多相似之处相处起来很平稳，一直给予自己很多关爱的人。但是，偶尔会让自己感到孤独的人。虽然是最靠近的存在，但却离得越来越远的恋人。</p><p class="story-paragraph dialogue">「…哥哥会认为我就是傻瓜。把包包丢了」</p><p class="story-paragraph dialogue">「那有什么、找到了就行了」</p><p class="story-paragraph">已经很晚了，我关灯了哦。关上主开关后，旼炡没有直接上床，而是一直望着夜景。知珉不久前开始喜欢上旼炡看向窗外的眼睛，现在看上去十分疲惫。列车早已脱离市中心。窗外只见一名路过的人，和一片没有灯光的空旷雪地。</p><p class="story-paragraph">突然，开始在意起埋藏在心底的东西。旼炡给前辈的讯息回了什么呢？说分手和先联系的都是前辈吗？为什么说男朋友体贴真好的你，是带着十分孤独的表情说出口呢？</p><p class="story-paragraph">知珉认为旼炡天生就带有不经修饰的性格。虽然她十分为人着想，尽量不提及分手的恋人，但偶尔也会掩饰不住真实的情感，直接表露出来。就像现在这样。唯独在这瞬间，旼炡就像在用全身表示“我身上留下了很多伤痕”。好似要向谁倾诉。</p><p class="story-paragraph">你没有告诉我的事实、没有让我看过的样子，究竟还有多少呢？</p><p class="story-paragraph dialogue">「旼炡啊，我有话要说」</p><p class="story-paragraph">结果只能如实相告，即使会让旼炡感到不快，也没有办法。因为自己不想再假装没看见。知珉故意不和旼炡对上眼，直接了当地说。对不起，我看到你钱包里的照片了，为了给你盖毯子，拿出来的时候把钱包弄掉了，正好是我认识的人——</p><p class="story-paragraph dialogue">「找不到时机坦白，所以一直假装不知道，抱歉」</p><p class="story-paragraph">房内只有微弱的床前灯，阴影倒映在旼炡脸上。坐在床上的知珉，凝视着看向漆黑窗外的白皙脸庞。一时间，沉默的空气在房内徘徊不散。</p><p class="story-paragraph">旼炡啊。再次叫了她的名字，旼炡才慢慢转过头来，这时才把视线看向这里。噙满泪水、含着埋怨的眼睛。</p><p class="story-paragraph dialogue">「姐姐」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「为什么现在说这个？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「为什么偏偏要现在说，真丢脸」</p><p class="story-paragraph dialogue">「因为觉得对不起」</p><p class="story-paragraph dialogue">「说了对不起就没事了吗？习惯性的道歉呢」</p><p class="story-paragraph dialogue">「就算那么说也是对不起」</p><p class="story-paragraph dialogue">「没怎么感受到，你的歉意」</p><p class="story-paragraph">跟傻瓜一样。旼炡自言自语地说道。知珉无法马上理解，那充满颤抖的声音里，层层堆叠的内心。</p><p class="story-paragraph dialogue">「无论怎么做，最终只有我像傻瓜一样。一点都没变」</p><p class="story-paragraph">金旼炡是什么样的人呢。</p><p class="story-paragraph">讨厌只会表面上道歉的人。因为长时间的感情，受到非常多伤害的人。判断力快又聪明的人。不善于撒谎的人。性格爽快的人。本以为内心会像性格一样坚强，但突然变成哭丧着脸，让看着的人反而心软的人。</p><p class="story-paragraph">不管旼炡是什么样的人，现在只想给她拥抱。比起哭泣的脸，更想看到她灿烂的笑容。我虽然还不够了解你，但不能这么想吗？</p><p class="story-paragraph">知珉从床上慢慢站起身，走近旼炡。但旼炡似乎不想让人看见她哭丧着脸，在狭小的位置上转过身。即便如此，在狭窄的卧铺车厢内，没有可以相互逃避的地方。静静地看着那可怜的背影，知珉慢慢伸出胳膊，搂住她的身体。</p><p class="story-paragraph dialogue">「你哪算什么傻瓜啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「今天的我才是傻瓜」</p><p class="story-paragraph">也许是被意料之外的拥抱动摇，怀里的身体开始颤抖。从薄薄的连帽衫上，可以感受到背部突出的骨感，似乎一把就能握住的消瘦肩膀，不忍靠在她身后，只能缩着身体。知珉没有安慰她说没事了，反而将旼炡抱得更紧。</p><p class="story-paragraph dialogue">「今天一整天我都依赖着你。」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「如果没有你，我可能都到不了这里」</p><p class="story-paragraph">就这样过了几分钟，不，也有可能是几秒钟。只有列车颠簸的声音轻轻回荡。寒冷又干燥的室内空气毫无作用，体温依旧逐渐升高，看来相叠的小身躯也跟着热气腾腾了。像人偶般静静地被抱在怀里的旼炡，终于微微转过身来与自己面对面。</p><p class="story-paragraph dialogue">「那我也先道歉吧」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph">依然无法读懂旼炡的想法。为什么用那种眼神看着我，是什么让你那么伤心啊？强忍着想问问题的冲动，轻抚旼炡的头发。饱含泪水的双眼完全不回避，凝视着知珉。</p><p class="story-paragraph dialogue">「…我提前说了，这次不是因为香味」</p><p class="story-paragraph">知珉因为突然凑近的脸，瞬间身体向后退。但因身后是窗户，已经退无可退，只能让倚靠自己上身的旼炡，更加靠近。</p><p class="story-paragraph">很快就感觉到上嘴唇被含住。知珉在身体僵住的状态下，反射性地抬起左手。无法理解现在到底发生了什么事，就被突如其来的热气和柔软的触感吓了一跳，无辜的胸口开始剧烈动跳起来。</p><p class="story-paragraph">啪，随着手碰上脸颊的声音，旼炡的头向一边倾斜。换句话说，知珉打了旼炡的脸颊。希望她不要看自己，即使害羞，旼炡的视线也没有回避，只是凝视着知珉。由于过度慌张，没有像平常一样习惯性地说对不起。相反，此次道歉的是旼炡。</p><p class="story-paragraph dialogue">「…所以我不是先说了对不起吗？」</p><p class="story-paragraph dialogue">「什么…」</p><p class="story-paragraph dialogue">「已经道过歉，不就没事了吗？我也是这样」</p><p class="story-paragraph">毫无愧疚的表情，自己的手还放在旼炡红彤彤的脸颊上，两人面面相觑。知珉在那露骨的视线下调整了呼吸。眨眼间，列车进入隧道，行驶在完全的漆黑下。轰隆隆的噪音和刚才就开始加速的脉搏，现在已经完全失控。使热气上升的沉默还在持续，车厢内的时间再次静止。</p><p class="story-paragraph">为什么更想了解金旼炡呢？</p><p class="story-paragraph">哪怕是现在也想问。她高中时是什么样的学生？看到当时的刘知珉后有什么想法？为了什么事放弃社团？是怎样跟前辈交往的呢？当然，其他琐碎的小事也好奇。是从小就怕冷吗？如此执着于你那么喜欢的极光有什么契机吗？当初是为什么会提议一起去旅行呢？最后，为什么现在会露出渴求着什么表情呢？</p><p class="story-paragraph">拜托不要那样看着我。</p><p class="story-paragraph">但是很好奇你现在是什么表情。</p><p class="story-paragraph">知珉现在才醒悟过来，自己心中有两种矛盾地感情在互相冲突，也了解到自己的真心更接近其中哪一方。</p><p class="story-paragraph">随着列车移动造成的轻微晃动，两人僵持的身体也晃动着。旼炡再次慢慢把脸凑近。这么长时间明明可以离开，但知珉既不回避也没阻止，就静静地待着。以为旼炡会再次往刚才触碰的上嘴唇靠近，所以自己用舌头润湿了干燥的嘴唇。这是非常紧张时，下意识的习惯动作。</p><p class="story-paragraph">但是，柔软碰触的地方，比嘴唇稍微低一点。旼炡在知珉嘴唇左下那一点，小心翼翼地附上嘴唇、接着放开。那么反复了几次，才在小点上亲吻。就像要求得许可一样，自己也给了她“想怎么做都可以”的信号。</p><p class="story-paragraph">深邃的脸庞上阴影更加鲜明。在不到一寸的距离，视线相接时，砰砰直跳的心脏声音震耳欲聋。原以为圆圆的脸蛋，却越看越有棱有角。也许正是因为如此，在第一次见到旼炡时，才会觉得她像只狐狸。</p><p class="story-paragraph">列车哐哐行驶的声音，不知不觉间变成了白噪音。旼炡将右手放在知珉的后颈上，慢慢拉向自己。接着，比刚才更用力咬住上嘴唇，并不疼。知珉似乎不想错过旼炡在眼前的任何一个动作，一直注视着她。“啊、真是的”，旼炡只能小声低叹了一声。</p><p class="story-paragraph dialogue">「…我也很害羞，希望你能稍微闭上眼睛」</p><p class="story-paragraph">逐渐熟悉的呼吸，再次慢慢拉近距离。两人头部同时倾斜并碰撞后，旼炡将头朝反方向转。这次，从胸部边缘到腰部，感觉身体紧贴在一起，全身都在发烫。知珉必须想办法呼吸一下冷空气，喘了口气，随后两人几乎同时闭上眼睛。已经不分彼此完全相贴，但旼炡却好像渴求更多接触，身子不停缠上来。虽然身体被挤压着，但知珉没有抗拒，反而用力抱紧怀中的旼炡，炙热的气息从相接的双唇钻入。</p><p class="story-paragraph">在某个冬天的夜间列车上，两人就这样第一次接吻，对于时间流逝浑然不知。</p></div>
