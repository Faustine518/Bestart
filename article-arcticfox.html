        </aside>
        <div class="chapter-copy"><p class="story-paragraph">今天是待在奥斯陆的最后一天。可惜的是，能够享受该城市的最后期限只到下午为止。因为晚上要乘坐大型邮轮，预计在海上度过整整17个小时。在船上漂泊一天后，第二天早晨将抵达丹麦首都哥本哈根。哥本哈根与其他北欧国家相比，离西欧本土更近，所以知珉期待天气或许会更暖和。当然，还是必须依靠旼炡的羽绒服。</p><p class="story-paragraph">行李大幅增加，两人也因此伤透脑筋，一一挑选该带什么上船，一早就这么度过了。首先，考虑到肚子可能会饿，所以决定带走昨天买的威士忌和剩下的食物。旼炡不停抱怨，背包好像要爆炸了，连剩下的食物全都带上实在太沉了，怎么拿得动这个。</p><p class="story-paragraph dialogue">「所以应该适当地买一些就好，剩了这么多，太可惜了」</p><p class="story-paragraph dialogue">「还不是为了姐姐才买的嘛，昨天鲑鱼也吃得很香」</p><p class="story-paragraph">本来哼哼唧唧地，一转眼就露出欲哭的表情是旼炡的特长，知珉早就习惯了。但想起来，每次对上那张脸上还是会心软。</p><p class="story-paragraph dialogue">「...知道了，我来拿吧」</p><p class="story-paragraph dialogue">「真的吗？不能反悔哦」</p><p class="story-paragraph dialogue">「除了酒之外，还有什么重的东西要交给我吗？」</p><p class="story-paragraph dialogue">「既然要拿，就把这个和这个也拿走不行吗？」</p><p class="story-paragraph dialogue">「等一下...这是两回事吧」</p><p class="story-paragraph dialogue">「为什么？不是你自己问的吗？」</p><p class="story-paragraph">一听说要帮自己分担行李，旼炡兴奋地胡乱把重的东西丢给自己。知珉摇了摇头，把所有杂物一股脑全塞进行李箱。能帮我压一下这里吗？放不太进去啊。结果还是自己孤军奋战，终于把酒瓶放进行李箱，旼炡则用纤细的胳膊，哼哼着帮忙打气。</p><p class="story-paragraph">正想着房内的空气比平时干燥，才发现这几天像背景音乐一样的雨声，今天完全没听见。说不定天空已经放晴了。一打开窗户，太阳就和预想的一样高高升起。多亏了今天晴朗的天气，才能看到挪威清澈的天空，但也为此感到遗憾。知珉一边晒着太阳让阳光透进皮肤，一边自言自语。</p><p class="story-paragraph dialogue">「…这时机真是，到了该走的时候太阳才升起来」</p><p class="story-paragraph dialogue">「天气变幻无常嘛，就像某人说天气不好、不想出门一样」</p><p class="story-paragraph dialogue">「昨天就让你一个人去玩了，真是的，真啰嗦」</p><p class="story-paragraph">知珉想让她不要再说了，戳了戳坐在自己对面嘀嘀咕咕的旼炡的脸颊。怎么突然戳我？旼炡一边摸着被戳的脸颊，一边玩着手，这时知珉已经挣扎着关上了行李箱。好，现在只要拉上拉链就可以了。因为装的太扎实，所以没有想像中那么简单。而实际上没有起到任何作用的旼炡，对此叹了口气。</p><p class="story-paragraph dialogue">「关不上吗？还是我坐在上面吧？」</p><p class="story-paragraph dialogue">「可以坐上来，但小心点」</p><p class="story-paragraph dialogue">「我很轻的，没关系」</p><p class="story-paragraph">旼炡一坐上行李箱，简直就像魔法一样，整体体积一下子压缩不少。原本合不上的行李，现在看来被压得毫无空隙。噢呼。没想到金旼炡可以作为压缩机使用，这是比想象中更有效的方法。</p><p class="story-paragraph dialogue">「今天邮轮之前打算做什么？」</p><p class="story-paragraph dialogue">「你从昨天开始不就在说那个了嘛、维京海盗船。去看那个吧」</p><p class="story-paragraph dialogue">「只去那里吗？没有更想去的地方吗？」</p><p class="story-paragraph dialogue">「嗯，我没有特别想到的地方。反正剩下的时间也只够出去转一圈」</p><p class="story-paragraph dialogue">「只去一个地方倒也行」</p><p class="story-paragraph">即使阳光灿烂，在奥斯陆也没有想去的地方。特别是前天从美术馆回来后，知珉更想尽快离开这座城市。对于知珉来说，只有坐船才是最令人期待的行程。想象一下在邮轮上看着日落的天空，感觉会非常浪漫。</p><p class="story-paragraph dialogue">「姐姐，等一下」</p><p class="story-paragraph dialogue">「...怎么了？」</p><p class="story-paragraph dialogue">「脸颊上沾了什么东西，真邋遢」</p><p class="story-paragraph dialogue">「什么啊？」</p><p class="story-paragraph dialogue">「没什么，只是掉了根睫毛而已」</p><p class="story-paragraph">知珉因突如起来的手，微微一颤向后退。摘下沾在脸颊上的睫毛后，旼炡的脸依然贴得很近。但自己惊讶的原因不单单是距离，还有陌生的视角。在下面仰视旼炡的脸庞，对自己来说十分陌生，心情有些奇怪。反之，坐姿一下子变高的小狗，似乎对拥有绝佳视野而非常满意，一直嘻嘻笑着。</p><p class="story-paragraph dialogue">「这是我第一次比姐姐高呢，心情真好」</p><p class="story-paragraph dialogue">「什么呀，只是坐着比较高也开心吗？」</p><p class="story-paragraph dialogue">「嗯，喜欢从上面往下看」</p><p class="story-paragraph dialogue">「...为什么？」</p><p class="story-paragraph dialogue">「就是，跟平时的视角不同啊」</p><p class="story-paragraph">旼炡渐渐将身体向前倾。双唇也许是朝向近在眼前的脸颊、或是朝向嘴唇而去。但是还没感觉到她温热的气息，就听见非常直接“啪咔”的撕裂声。</p><p class="story-paragraph dialogue">「...刚才没听到什么碎裂的声音吗？」</p><p class="story-paragraph dialogue">「没有啊？应该是听错了」</p><p class="story-paragraph">啊~出门之前先去一趟厕所。旼炡立即站起身想逃跑，但随即被行李箱主人抓住后颈，只能挣扎着。</p><p class="story-paragraph dialogue">「喂，你等一下」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph">旼炡压在行李箱上并没出问题。只是被她踩踏的手柄连接部分发出咯吱咯吱不安的声音。知珉愁眉苦脸拉起把手，但仅能延伸一格的手把，位置比自己的腰还低很多。行李箱把手要拉到第二格才更便于拉着走，现在的情况非常令人头疼。</p><p class="story-paragraph dialogue">「我的行李箱怎么办，旼炡啊？都是你踩到所以都坏了啊。快点赔偿我」</p><p class="story-paragraph dialogue">「行李箱怎么这么烂，怎么不买个好的品牌呢？」</p><p class="story-paragraph dialogue">「不要怪行李箱，它就是非常普通的品牌」</p><p class="story-paragraph dialogue">「现在一时半会的，目前也不是不能拖着走，再忍忍吧，以后再赔偿」</p><p class="story-paragraph dialogue">「手把太低了，很不方便的。而且今天一整天都要拖着行李出门」</p><p class="story-paragraph dialogue">「没那么低啊」</p><p class="story-paragraph dialogue">「应该就是符合你的身高吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我帮你拿点东西，今天你来拉」</p><p class="story-paragraph dialogue">「不要，这个箱子对我来说太大了。重的也都在里面」</p><p class="story-paragraph dialogue">「看来这就是所谓自作自受吧？为了不拿重的东西而耍赖，结果遭到报应了吧」</p><p class="story-paragraph">知道了，我来提不就行了嘛，但是就今天而已哦。旼炡连声抱怨，最终还是接受了行李箱。两人就这样带着好不容易整理好的行李，前往今天的第一个目的地，也就是包含挪威象征物的场所、维京海盗船博物馆。</p><p class="story-paragraph dialogue">「好像是那个建筑。比想象中要小啊？」</p><p class="story-paragraph">维京海盗船博物馆的位置，应该就在旼炡所指的建筑内。原本以为会是座威风凛凛的大型建筑，结果却只见教堂般干净整洁的普通房子。两个人在外面晃了一会儿，才进到内部，一艘巨大的船映入眼帘。刚才还想这空间会不会太狭窄，结果一进到室内反而豁然开朗。在正中间就放着一艘长长的船。</p><p class="story-paragraph">正好一旁有英语解说的导游和团体游客，知珉和旼炡就和一行人紧挨在一起行动。刚才一下子吸引游客目光的这艘船，名叫奥塞贝格号 (Oseberg)。该船长30公尺左右，是博物馆内三艘船中最具代表性的船只，也是全世界保存了最完整装饰的海盗船之一。也因其名字为“奥塞”，被称作西元9世纪北欧女王的船，这巨大的文物也因而广为人知。</p><p class="story-paragraph">维京人通常在举行领袖的葬礼时，有将船埋入大海的习俗。也就是说，这艘有如鲸鱼般的大船，最后也作为女王的坟墓沉入海中。应该说感觉挺可怕的，还是该说像传说故事感觉有点浪漫呢。</p><p class="story-paragraph">导游走到第二层，游客们也纷纷跟上船。彷彿是与团体同行的两人，也悄悄爬上船去。十分符合女王之船的名号，内部装饰也相当豪华。摆满高档的食材、贵族应有的华丽首饰。据说，当时还发现了可能是首饰主人的两名女子的遗骸。</p><p class="story-paragraph">虽然以现在的标准很难想象，但据说她们身高只有150多一点。旼炡听完后，开心地说明明是北欧人，个子却比自己矮，在莫名其妙的点上感到自豪。但是21世纪和9世纪的人在同一条水平线上比身高，根本不合理。知珉在脑中进行了批评，对旼炡的胡言乱语充耳不闻。</p><p class="story-paragraph dialogue">「…真羡慕姐姐个子高」</p><p class="story-paragraph dialogue">「你的身高也不矮的」</p><p class="story-paragraph dialogue">「但是...不知是不是因为形象的原因，大家都以为我比实际年龄小」</p><p class="story-paragraph dialogue">「这不是很好吗？我很羡慕呢。希望能像你那么娇小可爱」</p><p class="story-paragraph dialogue">「从今天早上开始，为什么一直拿身高说事呢？是在逗我吧？」</p><p class="story-paragraph dialogue">「是真心的」</p><p class="story-paragraph dialogue">「但是你知道吗？身高几乎都是由先天因素所决定的」</p><p class="story-paragraph dialogue">「是吗？」</p><p class="story-paragraph dialogue">「嗯，所以听说同卵双胞胎不管在什么环境下长大，身高都会一样」</p><p class="story-paragraph dialogue">「…那我是什么呢？我家除了我，其他人都很矮」</p><p class="story-paragraph dialogue">「仔细看看的话，会发现家中也有人是高个子。但也有可能是隔代遗传」</p><p class="story-paragraph dialogue">「好神奇，以后要问妈妈了」</p><p class="story-paragraph dialogue">「总之，这么说是因为身高是先天决定的，不是透过努力就可以改变」</p><p class="story-paragraph dialogue">「你还真像万事通，感觉就像为了长高而搜过很多方法的人」</p><p class="story-paragraph dialogue">「...不是让你不要再逗我了嘛」</p><p class="story-paragraph">如果不是有人在早上弄坏行李箱，我就会安静待着。我是想弄坏才弄坏的吗？所以说今天不都是我带着姐姐的东西嘛。在两人吵吵闹闹无法集中的时候，导游还继续解说维京船。和女王一起埋葬的女人是谁还是未知数，可以推论她的身份年龄比女王要小。到底是女王的家人、亲戚、还是单纯的侍从、又或者其他什么关系，目前还无法查明。</p><p class="story-paragraph dialogue">「一起被埋葬的人会是谁呢？」</p><p class="story-paragraph dialogue">「应该就是侍从吧。以前都那样把侍从当做祭品一起埋了的」</p><p class="story-paragraph dialogue">「这种概率应该很高吧？毕竟是女王，当然会有侍从了」</p><p class="story-paragraph dialogue">「太过分了」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「女王死后，不就只能在一夜之间一起葬身海底吗？」</p><p class="story-paragraph dialogue">「干嘛那样带入自己呢？你是侍从吗？」</p><p class="story-paragraph dialogue">「但像这种人生也挺好啊。不管怎样，总比孤独地死去要好」</p><p class="story-paragraph">是那样吗。女王会因为有人陪葬而开心吗？如果认真想想，和某人永远一起被埋葬在深海，感觉非常奇怪。那些被一起埋葬的人，可以算是命中注定吗？</p><p class="story-paragraph dialogue">「她们可能也没想到，会在海底待了上千年后被人发现」</p><p class="story-paragraph dialogue">「这么说确实有点浪漫。像在庞贝城发现的恋人」</p><p class="story-paragraph dialogue">「刚才不是还说一起被埋葬太过分了吗？」</p><p class="story-paragraph dialogue">「但如果把两人想成是恋人，那倒不错」</p><p class="story-paragraph dialogue">「你好好想想。你那么怕冷，在冰冷的海水中待上上千年」</p><p class="story-paragraph dialogue">「那也是不错，不管在哪」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「能够永远不分离，永远在一起」</p><p class="story-paragraph">旼炡与平时不同，语气非常认真，倒是知珉感到有些难为情，稍微走在前头，平白无故转移话题。</p><p class="story-paragraph dialogue">「总之，今天夹在游客中间，看得很开心吧？」</p><p class="story-paragraph dialogue">「嗯，现在去看别的吧」</p><p class="story-paragraph">不过，剩下的两艘船，实际上保存情况并不好，可以说是文物的残骸。因此，在博物馆里，展览室变成了影像馆。在昏暗的空间里，投影仪在圆顶上放映出画面。海盗船很快登场，海浪拍打的声音充斥整个空间。10分钟左右的内容，展示了海盗民族是如何生存的。其中战斗场面更是如同动作游戏一样，充满真实感，非常值得一看。</p><p class="story-paragraph">影片最后，是太阳下山时北海的维京海盗们看到极光的画面。虽然屏幕中只是图像，但由于出色的感染力，一起观看的人也都发出了惊叹。这也是理所当然的事情，会到这里的人大都是期待着极光的游客。身旁的旼炡也是如此。哇。旼炡的感叹瞬间从嘴里脱口而出，连知珉也听得清清楚楚。只见旼炡完全沉迷于影像的表情，附在她耳边轻声说话也没看自己一眼。直到自己悄悄拉起她的手，发出“看看我”的信号后，旼炡才转过头来。</p><p class="story-paragraph dialogue">「...在身边喊你都听不到，看得那么有意思吗？」</p><p class="story-paragraph dialogue">「这做得很好吧？看来在CG上花了点钱。特别是极光，真的很酷」</p><p class="story-paragraph dialogue">「现在离我们去冰岛没剩几天了」</p><p class="story-paragraph dialogue">「是啊，时间过得真快」</p><p class="story-paragraph dialogue">「希望现场也能看得那么清楚」</p><p class="story-paragraph dialogue">「是啊，可不能像在挪威的时候，天天下雨啊」</p><p class="story-paragraph dialogue">「应该没问题的」</p><p class="story-paragraph dialogue">「只是天空如果这么亮，照片能拍成吗...？」</p><p class="story-paragraph dialogue">「那要亲自去试才知道吧？看你总是这么期待，我本来没什么想法，现在也变得很期待呢」</p><p class="story-paragraph dialogue">「当然要期待了。因为冰岛就是这次旅行的重点」</p><p class="story-paragraph">知珉在心里反复咀嚼旼炡的话。这次旅行的重头戏、以及终点站是冰岛，冰岛是蕴含着旼炡梦想的地方。还有灿烂的极光绽放在夜空。</p><p class="story-paragraph">现在还不知道冰岛的天气是阴是晴。但是，希望下周在冰岛至少能有一天放晴。非常想看见期待已久的旼炡、看到极光时高兴的模样。她一定会站在比这更华丽的风景下，目不转睛。</p><p class="story-paragraph">也许你也会像这样专注地望着天空。</p><p class="story-paragraph">不知道旁边有人在注视着你吧。</p><p class="story-paragraph">在博物馆吃过午饭后，两人在附近闲晃，很快就到了出海的时间。前往哥本哈根的邮轮原定于4点半出发。预约的邮件中注明，请在30-40分钟前到达，在港口进行入住登记。见柜台前排队的人潮，知珉赶紧排在后头。报到后拿到的船票上印有条码，可以用作房间的钥匙，底下则用图章印着房号。</p><p class="story-paragraph"><em> Deck : 6 / Number : 6006 A.</em></p><p class="story-paragraph dialogue">「我们的房间好像在6楼」</p><p class="story-paragraph dialogue">「刚刚登记的时候一看，好像有很多人会开车上船」</p><p class="story-paragraph dialogue">「那船真的超级大吧」</p><p class="story-paragraph dialogue">「你有看到那个写着DFDS的船吗？好像就是我们的船」</p><p class="story-paragraph">知珉转向旼炡所指的方向。只见船身巨大，刚才的海盗船完全没得比，几乎是一片水泥墙遮挡住视线。船刚停靠岸边，船上轰隆作响，简易楼梯被放了下来。</p><p class="story-paragraph">一上船就看到了巨大的指示牌。在主要入口处有船舱内部介绍图，按照楼层分类介绍各种公共设施。这艘船足足有11层楼高。1-2层是船上职员们使用的地下室，3层是让乘客们出入的主要入口兼车库。从4楼开始则是客房。7楼以上有各式各样的公用设施，餐厅、休息室、咖啡厅、免税店等应有尽有，再往上一层则是赌场和酒吧等有卖酒的地方。在最顶部的11层甲板还有sky bar。</p><p class="story-paragraph">为了放下行李，两人首先前往房间所在的第六层。知珉心里预想房间氛围可能和夜间列车差不多，原本以为只有狭窄的双层床和放行李的空间，但一打开门，先入为主的想法马上消失无踪。房间中央的四方形窗户外，就是如画般的蔚蓝大海。看到这里，不由得发出“哇”的一声感叹。从小窗看出去的大海、以及脚下踩着海水波动般晃动的地面。仅凭这点，就感觉到自己正乘船在大海之上。靠近窗边的旼炡瞟了一眼脚底说。</p><p class="story-paragraph dialogue">「房间还不错，但地板比想象中还要晃」</p><p class="story-paragraph dialogue">「来旅行好像真的做了很多事情」</p><p class="story-paragraph dialogue">「比如说什么？」</p><p class="story-paragraph dialogue">「像是坐了电车、坐了夜间列车，还坐了轻型飞机。该坐的都坐了。今天还搭了船」</p><p class="story-paragraph dialogue">「少说了一个」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「什么啊，忘掉哈士奇雪橇了吗」</p><p class="story-paragraph">啊、对了。虽然和其他交通工具不同，但确实是坐了哈士奇雪橇。知珉摇了摇头，似乎不想再继续回想。都是被某人脸上沾满雪、快要死了的样子给吓了一跳，现在记忆倒是稍微模糊了。</p><p class="story-paragraph dialogue">「这之中姐姐最喜欢哪个？」</p><p class="story-paragraph dialogue">「可是邮轮才刚搭上，得多待一会儿才能知道」</p><p class="story-paragraph dialogue">「那么除了邮轮，到目前为止呢？」</p><p class="story-paragraph dialogue">「我...嗯，喜欢在赫尔辛基的路面电车上观赏城市风景。因为开得不快，所以感觉很从容。你呢？」</p><p class="story-paragraph dialogue">「我当然是来奥斯陆时的轻型飞机」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph">我个人觉得很有意思。旼炡满面笑容说道。知珉一想到当时在轻型飞机上，震耳欲聋的螺旋桨噪音，手心还是会出汗。但是在船上想这个可能也不是很好，所以决定重新思考愉快的主题。比如说今天的晚餐。是的、马上就要去船上的自助餐厅吃饭了。</p><p class="story-paragraph dialogue">「旼炡啊，这里的晚餐几点开始」</p><p class="story-paragraph dialogue">「为什么转移话题？」</p><p class="story-paragraph dialogue">「就不能配合一下吗？几点开始？」</p><p class="story-paragraph dialogue">「是几点来着...5点半去就可以了」</p><p class="story-paragraph dialogue">「我们早点出门怎么样？」</p><p class="story-paragraph dialogue">「好」</p><p class="story-paragraph">两人想选在用餐人数不多的时间段，以免过于拥挤。旼炡想早点吃完，顺便在晚餐时间看日落，还特地提前预约。在用餐之前，两人决定先在船上逛逛。</p><p class="story-paragraph">或许是韩国人经常乘船，服务中心竟然使用韩语介绍了WIFI的使用方法。从“on-board access购买”来看，WIFI应该是需要另外花钱才能使用。现在约有17个小时不能上网。应该庆幸在上船之前有匆忙给明俊留下信息吗？反正等早上到哥本哈根，再联系就行了。知珉大概想过，便离开了服务中心。</p><p class="story-paragraph">又上了一层楼梯，便来到餐厅。只见外面挂着“维京海盗自助餐”的招牌。自助餐的菜色比想象中丰盛许多，可以挑选各种料理很有乐趣。其中，包括虾、牡蛎、干贝、龙虾等各种海鲜料理很快就被端出来，尤其人气最高的就是大虾。看到盛满一盘虾的旼炡，知珉既欣慰又担心。看她吃的香当然很好，但是这样吃会太撑吧？</p><p class="story-paragraph dialogue">「…旼炡啊，好吃吗？你吃得比平时多呢」</p><p class="story-paragraph dialogue">「快吃虾吧，这里的虾真的很好吃」</p><p class="story-paragraph dialogue">「整体来说，海鲜都很好吃呢」</p><p class="story-paragraph dialogue">「刚好像又出来新的了，要再拿过来吗？」</p><p class="story-paragraph dialogue">「但还是克制一下自己吧，今天吃太多的话...」</p><p class="story-paragraph dialogue">「吃太多怎么了？」</p><p class="story-paragraph dialogue">「担心睡觉时船如果晃动会出大事」</p><p class="story-paragraph">啊哈。旼炡理解了什么似的表情，挑起一双眉毛，说道。事先说好了，我可没有晕车药，以防万一，我们先定个规则怎么样？</p><p class="story-paragraph dialogue">「...难道有什么紧急状况？规则？」</p><p class="story-paragraph dialogue">「嗯，如果感觉要吐了，就绝对不要靠近我」</p><p class="story-paragraph">旼炡右手的叉子还在不停地动作。知珉揪住一旁无辜的左手，猛地打了手背，嚼着虾的旼炡一脸好像在问为什么打我，疑惑地看着自己。</p><p class="story-paragraph dialogue">「谁会吐啊？」</p><p class="story-paragraph dialogue">「说不定啊」</p><p class="story-paragraph dialogue">「别说废话了，吃饭吧」</p><p class="story-paragraph">也不是讨人厌的5岁小孩。为什么金旼炡必须定期挨一次打，才能少说些奇怪的话呢？</p><p class="story-paragraph">吃完晚饭，两人在甲板上闲晃。吹着风旼炡感觉有些凉。姐姐，我去房间拿个围巾，在这里等一下。看着匆匆跑走的背影，知珉静静地站在原地。风势相当大，嘴唇变得很干。知珉想顺便补妆，熟悉地在包里翻找，可没有找到化妆包。是刚才放在行李箱里了吗？立刻给旼炡打了电话，“姐姐，怎么了？”电话那头马上传来高亢的嗓音。</p><p class="story-paragraph dialogue">「旼炡啊，你到房间了吗？」</p><p class="story-paragraph dialogue">「嗯，怎么了？现在正要出去呢」</p><p class="story-paragraph dialogue">「你找找我的行李箱，里面应该有化妆包，能拿来给我吗？」</p><p class="story-paragraph dialogue">「知道了」</p><p class="story-paragraph dialogue">「打开的时候...小心把手，也不要坐在上面」</p><p class="story-paragraph dialogue">「不坐、我才不会坐。别再说了」</p><p class="story-paragraph dialogue">「总之，记得小心地打开」</p><p class="story-paragraph dialogue">「...等一下。这个锁上了啊？你的密码是什么」</p><p class="story-paragraph">密码是0411，是知珉的生日。虽然以前告诉过旼炡，但来个突击考试也不错。知珉决定闭口不提数字，只是含糊地回答。</p><p class="story-paragraph dialogue">「是我的生日」</p><p class="story-paragraph dialogue">「...生日？真是耿直的密码啊？」</p><p class="story-paragraph dialogue">「所以，你打开了吗？」</p><p class="story-paragraph dialogue">「什么呀，难道是想测试一下，看我还记不记得姐姐生日吗？」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph">你还怕我记不住吗？等一下。电话那头传来了沙沙的响声。咔嚓咔嚓几下，感觉行李箱的锁被调好，可能是终于打开，听见旼炡自信满满地说。找到化妆包了、我带过去。</p><p class="story-paragraph dialogue">「恭喜，你顺利过关了呢？」</p><p class="story-paragraph dialogue">「那如果不过关的话会怎么样？」</p><p class="story-paragraph dialogue">「我还没想到。等下次测验，我会想好惩罚的」</p><p class="story-paragraph dialogue">「...有必要吗？」</p><p class="story-paragraph dialogue">「总之，快过来」</p><p class="story-paragraph">说话语气调皮，心情也很好，总是不停露出笑容。旼炡没有忘记第一天闲聊过去的对话，还记得自己并不特别的生日，毫不犹豫地解开了密码。这样想想，金旼炡不仅弄坏了行李箱的把手，现在连密码也被她弄地明明白白，怎么办才好呢？</p><p class="story-paragraph">嗯，暂时保持这样也不赖吧？</p><p class="story-paragraph">夕阳美景下，人们陆续来到甲板上观赏北海的日落。两人也在适当的地方就座。一旁是船上的乐队表演，来到现场的家庭坐在周围，偶尔一起唱歌呼应。有着船只顺利航行在海上的和平氛围。</p><p class="story-paragraph">港口城市每条街道都弥漫着平静的海港气味。但是像这样站在船上甲板，明显地刮起了强烈又带腥味的海风。知珉非常喜欢眼前吹着清新海风的大海，想长时间站在这里。虽然头发被吹乱，但自己也主动迎上吹拂的风。一边紧紧抱住旁边蜷缩着身体的旼炡的肩膀，一边给她按住帽子，以免飞掉。</p><p class="story-paragraph">这风景是有几分运气造就。如果像昨天那样阴沉沉的雨天，是绝对看不到晚霞的。想起了在美术馆看到的《呐喊》。忧郁的挪威画家、明明看着美丽的日落，却画出抑郁的画作，自己的感知能力太过平凡，可能永远无法理解。红色的夕阳余晖被海水反射到远处，知珉只是呆呆地望着耀眼的光芒随波荡漾。</p><p class="story-paragraph dialogue">「…旼炡啊，我决定好了」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「到现在为止，我最喜欢的」</p><p class="story-paragraph dialogue">「要换成邮轮吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「只因为有日落的场景吗？」</p><p class="story-paragraph dialogue">「怎么了，你知道人的内心会在一瞬间受到触动吗？我现在就是那种感觉」</p><p class="story-paragraph dialogue">「或许是因为我们来到奥斯陆后，一直在下雨，所以才会这样」</p><p class="story-paragraph dialogue">「嗯，那也是，而且我本来就很喜欢大海」</p><p class="story-paragraph dialogue">「坐船真是选对了。当初只是因为比飞机便宜，所以没多想就买票」</p><p class="story-paragraph dialogue">「我好像一辈子都忘不了今天看到的大海」</p><p class="story-paragraph dialogue">「...看来真的很喜欢啊」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「我也是」</p><p class="story-paragraph">旼炡手臂靠在栏杆上，凝望着天空，简短地回答。一道夕阳般的红色光芒掠过她线条分明的脸庞。知珉莫名地想拍下这一幕，所以打开了相机。旼炡马上做出调皮的表情，并用手指比了个V。</p><p class="story-paragraph dialogue">「我本来想拍的不是这种氛围」</p><p class="story-paragraph dialogue">「...这种氛围？」</p><p class="story-paragraph dialogue">「旼炡啊，像刚才一样露出高冷的表情吧」</p><p class="story-paragraph dialogue">「什么高冷啊，我不要」</p><p class="story-paragraph dialogue">「没错，这就是我说的表情。然后是受日落所感动的表情」</p><p class="story-paragraph dialogue">「够了吧」</p><p class="story-paragraph dialogue">「再来是看向这边可爱的笑脸」</p><p class="story-paragraph dialogue">「…竟然得寸进尺啊」</p><p class="story-paragraph dialogue">「快点」</p><p class="story-paragraph">旼炡虽然嘴上不配合，但还是一一摆出了被要求的姿势。因为忙着拍照，不知不觉间太阳已经下山了。天空渐渐变成淡紫色、深蓝色，时刻都在变化着。最后，甲板像熄灯的舞台暗淡下来，澄黄色的灯紧接着一个个亮了起来。</p><p class="story-paragraph dialogue">「好像连10分钟都不到，太阳就完全下山了」</p><p class="story-paragraph dialogue">「是啊，真的太短了」</p><p class="story-paragraph dialogue">「得正好赶上这个时辰才看得到」</p><p class="story-paragraph dialogue">「啊，对了。我们明天不来看一下日出吗？」</p><p class="story-paragraph dialogue">「如果能起得来的话。姐姐起得比较早，试试看吧」</p><p class="story-paragraph dialogue">「你不看吗？」</p><p class="story-paragraph dialogue">「早上我睡觉就行」</p><p class="story-paragraph dialogue">「我把你叫醒不就行了。不能一起看吗？」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph">没看日出真的会后悔的好吗？我睡前定好闹钟，一起来看吧。即使说到这个份上，旼炡在下甲板的过程中，也只是说“算了，不要”，直接拒绝了。</p><p class="story-paragraph">知珉完全想不到理由。是因为拍照的时候要求她摆各种姿势？难道是因为自助餐吃了很多虾吗？那也不对，还是因为早上一直捉弄她的身高，突然觉得不开心吗？不知道具体原因，但看她表情有些消沉，实在令人担心。</p><p class="story-paragraph dialogue">「旼炡啊，你心情不好吗？」</p><p class="story-paragraph dialogue">「...嗯？没有啊？」</p><p class="story-paragraph dialogue">「从刚才开始怎么了？」</p><p class="story-paragraph dialogue">「我怎么了？」</p><p class="story-paragraph dialogue">「说不想一起看日出」</p><p class="story-paragraph dialogue">「那是因为我起得比较晚，感觉会很累」</p><p class="story-paragraph dialogue">「可不可以告诉我你为什么生气？」</p><p class="story-paragraph dialogue">「说什么呢，我没有生气」</p><p class="story-paragraph dialogue">「...好像生气了啊」</p><p class="story-paragraph dialogue">「都说没生气了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...知道了。那么明天清晨一起去看日出，行了吧？」</p><p class="story-paragraph dialogue">「听起来像是不情愿但又迫不得已」</p><p class="story-paragraph dialogue">「都是姐姐坚持向我提出约会申请，所以我才答应的」</p><p class="story-paragraph dialogue">「真是的，突然又变厚脸皮了...」</p><p class="story-paragraph dialogue">「我说的没错啊」</p><p class="story-paragraph">是啊，而且你明明没什么事竟然拒绝我，感觉有点受伤，不觉得对不起我吗？知珉用两只手捏着讨人厌的旼炡的脸颊，轻轻将嘴角向上提起。</p><p class="story-paragraph dialogue">「干嘛提我的嘴角？」</p><p class="story-paragraph dialogue">「如果没生气的话，现在笑一笑」</p><p class="story-paragraph dialogue">「不要勉强人，必须心情好才笑得出来啊」</p><p class="story-paragraph dialogue">「因为你表情不太好，一直让我很在意」</p><p class="story-paragraph">知道了，我会笑的，现在放手吧。虽然嘴上这么说，但旼炡依然面无表情。都已经这样放低姿态，但她到现在还不消气是吧。知珉没有放弃，走向旼炡身后用手拍了拍她的屁股。旼炡啊，现在不能看着姐姐消消气吗？</p><p class="story-paragraph dialogue">「...干嘛突然摸别人屁股？」</p><p class="story-paragraph dialogue">「因为你一直气呼呼的，所以给你拍拍而已」</p><p class="story-paragraph">双手继续轻轻拍打，还用手不停地搓揉可爱的屁股，旼炡皱起眼睛，露出疑惑的表情。</p><p class="story-paragraph dialogue">「怎么了，连这个也不喜欢吗？」</p><p class="story-paragraph dialogue">「这是在消气吗？姐姐好像只是为了满足私欲才摸的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">知珉手刚好就在那位置，直接攻击了旼炡的屁股。想着这边肉多，所以应该不会比后背疼，所以毫不留情地猛力一拍，结果”啪”的一声十分清脆。</p><p class="story-paragraph dialogue">「好疼，为什么最后一定要以打我做结尾？」</p><p class="story-paragraph dialogue">「本来想好好解决的...我就说你那张嘴是个问题」</p><p class="story-paragraph">就这样两人一边吵吵嚷嚷，太阳已经完全消失。知珉像是故意挑衅一般，一只手不停拍着旼炡的屁股，催促她“快走、快走”，就这么走到了甲板下。</p><p class="story-paragraph">一进入室内，一股热气笼罩全身。旼炡摘下帽子，只见她头发乱蓬蓬的。但是，还没来得及给她整理后脑勺，突然活力充沛的旼炡就开始默默地跑来跑去。</p><p class="story-paragraph dialogue">「一起走啦，哪有像你那么走的？」</p><p class="story-paragraph dialogue">「我想去8楼看看，姐姐有想去的地方吗？」</p><p class="story-paragraph dialogue">「8楼？8楼有什么来着」</p><p class="story-paragraph dialogue">「有赌场，好玩的地方都在那里」</p><p class="story-paragraph">在邮轮的8楼，有酒吧和赌场，就像楼层介绍图中看到的那样。但与其说是赌场，也不过是有几台吃角子老虎机的娱乐室，只是一个小房间。旼炡一脸失望地在机器前徘徊。</p><p class="story-paragraph dialogue">「听说是赌场，还以为会很华丽」</p><p class="story-paragraph dialogue">「...你不会想象成拉斯维加斯吧？」</p><p class="story-paragraph dialogue">「我以为氛围会差不多」</p><p class="story-paragraph dialogue">「既然来了，要不要试试老虎机？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">旼炡一点一点投入硬币，拉动机器。随着咔嗒一声，屏幕开始快速转动。但是第一局结果是落空了，从开始到结束不用10秒钟。旼炡表情空虚看向自己。在请求允许的目光下，知珉稍微安慰了一下说。如果觉得可惜，就再试一次吧...</p><p class="story-paragraph">咔嗒——</p><p class="story-paragraph">但这次的结果也相同。再来一次、就一次。旼炡开始更加悲惨地哀求。就像今天早上那样，金旼炡的主要特长1号，露出让刘知珉心软的可怜表情。</p><p class="story-paragraph dialogue">「不行」</p><p class="story-paragraph dialogue">「真的就一次。不能就这么白白失去啊」</p><p class="story-paragraph dialogue">「你知道吗？丹麦的钱可是比挪威还贵」</p><p class="story-paragraph dialogue">「…比挪威的钱还贵吗？真的？」</p><p class="story-paragraph">不想回去饿肚子就别乱花钱。你本来就已经受骗没钱了，还在这里挥霍，真会出大事的。旼炡如果真的一贫如洗，最终自己的钱包也会被掏空。所以知珉拼命阻止，努力让她摆脱赌博成瘾。但是，看到那充满胜负欲的眼神，想必已经对自己的唠叨充耳不闻。</p><p class="story-paragraph dialogue">「继续下去，如果我赚钱了呢？」</p><p class="story-paragraph dialogue">「旼炡啊，你可能不太清楚，但这些地方的机器都是为了让你消磨时间才摆的」</p><p class="story-paragraph dialogue">「不是还有万一嘛」</p><p class="story-paragraph dialogue">「那你是要把那些钱都花了？」</p><p class="story-paragraph dialogue">「真的可以吗？以后就别多说什么。我开始了、现在要开始了？」</p><p class="story-paragraph dialogue">「行吧...」</p><p class="story-paragraph">现在知珉整个人吓得要死，简直看不下去。她怎么突然成了赌徒呢？想想还有什么最后手段，但没能想到一个好办法。看来旼炡已经没有所谓理智了，干脆让她昏过去，然后偷偷带她回房间吧。与其把钱都输掉，也许那样更好。这时，旼炡快速地拉下把手。</p><p class="story-paragraph">咔嗒——</p><p class="story-paragraph">瞬间，知珉忽然委屈了起来，甚至想写诉愿书给防止赌博委员会。因为随着叮铃铃音效、运势大好地出现了连续三个心形图案。甚至接下来也叫人烦躁。旼炡一边拍手，一边指指点点叫自己看清楚。姐姐看到了吗？看到了吗？刚才看到了吗？她的表情十分得意，气势如虹。</p><p class="story-paragraph dialogue">「…看得非常清楚」</p><p class="story-paragraph dialogue">「我刚才不是说了吗，我运气意外地很好」</p><p class="story-paragraph">因此，旼炡没有经过任何努力，就将挪威1000克朗 ，约14万韩元收入囊中。现在看来，在一旁极力劝阻的知珉，立场变得非常尴尬。旼炡已经忘却刚刚在甲板上闹情绪的事，开怀大笑说。啊，心情超好，我也要把到目前为止搭乘过最满意的换成邮轮，老虎机真的很有趣呢。</p><p class="story-paragraph dialogue">「...好吧，是该开心的」</p><p class="story-paragraph dialogue">「要不要去旁边的酒吧？既然赚到钱了，就喝一杯吧」</p><p class="story-paragraph dialogue">「但是我们不是还有带来的酒吗？」</p><p class="story-paragraph dialogue">「带来的酒？」</p><p class="story-paragraph">旼炡显然忘了在挪威超市购买的威士忌。虽然心里又想再打一记后背，但至少她挣了钱，还是忍着吧。知珉挽着胳膊细细跟她解释。</p><p class="story-paragraph dialogue">「不记得了吗？你昨天买来的黄色威士忌。linie aqua beat」</p><p class="story-paragraph dialogue">「啊啊...」</p><p class="story-paragraph dialogue">「早上因为太重了，还碎唸着把它放进我的行李箱里。不会扔给我之后就忘了吧？」</p><p class="story-paragraph dialogue">「对了，那个。当然没有忘记」</p><p class="story-paragraph dialogue">「少来了，表情看来完全忘记了」</p><p class="story-paragraph">那个待会儿再喝，今天我请客。旼炡已经鼻孔朝天完全意气风发。一直说是自己赢来的似乎很想请客，可能她就想折磨自己。呼、叹了口气，知珉便乖乖地跟在旼炡身后。</p><p class="story-paragraph">今天感觉必须吃点头痛药才能入睡。</p><p class="story-paragraph">早上想亲亲，结果弄坏别人的行李箱，</p><p class="story-paragraph">用超级真挚的面孔说着话，</p><p class="story-paragraph">突然又自己一个人闹脾气，</p><p class="story-paragraph">一下子心情又变好了，笑嘻嘻的。</p><p class="story-paragraph">全都是这个瞬息万变的某人害的。</p></div>

        <div class="chapter-copy"><p class="story-paragraph">知珉点了一杯度数不高的鸡尾酒。听着乐队主唱的歌声一整天，现在已经不陌生了。白天是在甲板上，晚上在酒吧。然而，明明不是邮轮上雇请的乐队成员，却一直不知疲倦地唱着歌的人，在自己眼前还有一位。</p><p class="story-paragraph">也许是听见自己喜欢的歌，旼炡跟随节奏摇头晃脑哼唱着旋律。酒吧喧嚣起来，旼炡似乎是不想输，也跟着放大音量。无奈之下，知珉只能用一只手捂住耳朵，试图让陶醉在兴奋中的旼炡冷静下来。</p><p class="story-paragraph dialogue">「...你看起来心情还不错啊？」</p><p class="story-paragraph dialogue">「拿到钱当然开心啦」</p><p class="story-paragraph dialogue">「但只有我们的桌子像是是办喜事的气氛」</p><p class="story-paragraph dialogue">「刚刚如果听某人的话，差点把钱输掉就玩完了」</p><p class="story-paragraph dialogue">「还不是赚了钱嘛，少说两句」</p><p class="story-paragraph">旼炡看似轻松，却跟着唱了几乎所有歌，令人惊讶的是歌词背得还不错。看她不停哼唱的样子，不禁想到，原来你真的很喜欢唱歌啊。高中时期，一次也没见过旼炡站上庆典舞台，真是可惜。如果上台表演一定会很棒。</p><p class="story-paragraph dialogue">「你在大学乐队里是主唱吧？」</p><p class="story-paragraph dialogue">「是的，我是什么时候说过的呢」</p><p class="story-paragraph">旼炡似乎有点害羞，停下了歌声。怎么每次夸她都这么腼腆呢？喝了几口甜甜的鸡尾酒，旼炡已经酒醉得差不多了。赢回一笔钱后，看着那张容光焕发的脸庞，自己心里也踏实了。比起之前噘着嘴的她，笑脸看起来更合适。</p><p class="story-paragraph dialogue">「不过怎么了吗？」</p><p class="story-paragraph dialogue">「你在大学庆典上表演过吗？」</p><p class="story-paragraph dialogue">「嗯，今年夏天是第一次」</p><p class="story-paragraph dialogue">「我很好奇，以后有机会的话唱歌给我听吧」</p><p class="story-paragraph dialogue">「唱给姐姐吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「我为什么要？」</p><p class="story-paragraph dialogue">「还问为什么，就直接唱给我听不行吗？不要哼唱，想听你好好唱」</p><p class="story-paragraph dialogue">「就出一张嘴说吗？」</p><p class="story-paragraph dialogue">「啊、不是免费吗？」</p><p class="story-paragraph dialogue">「当然了，即使是业余乐队，也需要进行费用协商不是吗？」</p><p class="story-paragraph dialogue">「...真无情啊，那我取消」</p><p class="story-paragraph dialogue">「如果有空，随时可以请我去唱。就算要延长到3个小时也可以」</p><p class="story-paragraph dialogue">「现在已经每天都听1个小时，听到耳朵要掉下来了」</p><p class="story-paragraph dialogue">「当然和乱唱是不一样的。就只唱姐姐喜欢的歌曲、唱一整首」</p><p class="story-paragraph">不知不觉间，旼炡在愉快地跟唱结束后，开始播放节奏稍微慢下来的抒情歌曲。与此相反，酒吧内的环境却更加嘈杂，让人有点担心，知珉不禁环顾四周。到了深夜，陆续能看到各种醉汉，可能是刚刚在夜店狂欢后，到这里续摊的人。</p><p class="story-paragraph">这时看见几名醉醺醺的男子，在附近的空桌坐下。也许是两名东方女子孤零零地坐着特别显眼，感受到对方一个劲地瞟着自己和旼炡流露出微笑的眼神。知珉直直瞪了回去，这时男子才悄悄转移了视线。然而，当目光继续落在旼炡身上那一刻，自己就被激怒了。金旼炡现在都不知道发生了什么事，一直在傻乐着。很不安。在她比现在更兴奋之前，赶紧把她带回房间才好。</p><p class="story-paragraph dialogue">「旼炡啊，快喝完这个回房间吧」</p><p class="story-paragraph dialogue">「不要，才刚播了我喜欢的歌」</p><p class="story-paragraph dialogue">「如果你想唱歌的话，以后我全天雇请你」</p><p class="story-paragraph dialogue">「真的吗？多少钱呢？」</p><p class="story-paragraph dialogue">「费用到时候再协商，今天先走吧」</p><p class="story-paragraph dialogue">「你答应我了哦」</p><p class="story-paragraph dialogue">「知道了」</p><p class="story-paragraph dialogue">「一定！」</p><p class="story-paragraph dialogue">「…我知道了，快起来」</p><p class="story-paragraph">知珉拉着还在挑自己字眼的旼炡，好不容易终于走出了酒吧。往下两层就是房间所在的第六层。但是不知道是船在晃动还是鸡尾酒的原因，下楼梯并没有刚才那么容易。最终，知珉只能拉着旼炡的手，一步步慢慢迈出脚步。</p><p class="story-paragraph">正搀扶着行动迟缓的室友，艰难地从7楼走到6楼路口，知珉的视线中出现了一个无法辨认的身影。低头坐在楼梯正中央的，看起来是一个身材高大且醉醺醺的男子。一听见有人下楼的声音，男人猛地望向两人。眼神像吃了药的人一样双眼无神，从外表看起来就不正常，预感真的不好。</p><p class="story-paragraph">在自己惊慌的一刹那，男子突然用听不懂的语言搭讪起来。舌头像是完全打结，即使是英语也听不懂。本来保持最起码的安全距离，没有反应地观察时，男子突然站起身，开始摇摇晃晃地朝两人走过来。没夸张，就如同丧尸一般。所以走廊才需要安装扶手啊，都是因为那些吃药到失神的人...不对，现在不是想这些的时候。</p><p class="story-paragraph dialogue">「...出事了」</p><p class="story-paragraph">怎么办呢？一个人可以还跑得动，但问题是现在必须连同喝了酒、摇摇晃晃的金旼炡一起跑。知珉想尽一切办法只要能尽快下楼，但也只能紧紧拉着旼炡的手腕。旼炡还一边说着。姐姐，等一下，我感觉快要摔倒了，怎么突然走这么快？安然无恙地说。知珉心里焦急万分，实在没空安抚旼炡。</p><p class="story-paragraph dialogue">「来这边，我们走另一条路吧」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「你没看到那个喝醉了像丧尸一样的人吗？眼睛看起来神智不清了，很危险」</p><p class="story-paragraph dialogue">「真的吗？哪里？在哪里？」</p><p class="story-paragraph">喂、现在是看他的时候吗？知珉一把搂住旼炡的腰。接着以抱着旼炡的姿势，头也不回地跑下楼梯。好险金旼炡十分轻盈，如果体格再大一点，是绝对不可能了。仅仅到了6楼，知珉就像是刚跑完100公尺赛跑的人，气喘吁吁。随着紧张气氛的缓解，腿也放松下来，这才开始颤抖。知珉抓着走廊扶手，暂时依靠着疲惫的身躯。</p><p class="story-paragraph dialogue">「啊...要死不活的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「旼炡啊，没事吧？」</p><p class="story-paragraph">旼炡刚才一下子被提起来，像快递一样安全地送到房间门口，直到门前才用自己的腿缓慢地站立起来。只见她的表情，貌似是很难理解到底发生了什么事情。这一会儿时间酒醒了吗？只见她双眼目光渐渐恢复，又重新变得炯炯有神。</p><p class="story-paragraph dialogue">「你没事吧，醒酒了吗？」</p><p class="story-paragraph dialogue">「姐姐力气真大啊！」</p><p class="story-paragraph dialogue">「...我也知道，快开门进去吧？趁他追到之前」</p><p class="story-paragraph">旼炡就像看见什么奇人异事，甚至揉捏起自己僵硬的肩膀。把人的话听哪去了，背后可是有丧尸般的人在追赶啊。</p><p class="story-paragraph dialogue">「胳膊肌肉真不是闹着玩的。怎么那么轻易就能把人当成包袱一样举起来呢？」</p><p class="story-paragraph dialogue">「金旼炡，把房间的钥匙给我」</p><p class="story-paragraph dialogue">「可以去练武了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">啪啪拍打的声音响彻六楼走廊。幸好男子没有追到这里，走廊空荡荡，当然也没有目击者看到一个女孩子被狠狠地打后背的场景。旼炡什么都来不及说，就被抓着后颈强行拖进了房间。</p><p class="story-paragraph">因这起突发事件而头昏脑胀，好不容易平复心情，两人决定今晚就坐在地上，把包里剩下的零食全部解决。知珉拿出两盒品客和昨天买的威士忌。然后将从酒吧要到的冰块和免洗杯摆放好。只是目前还带着酒劲的旼炡让自己非常担心。</p><p class="story-paragraph dialogue">「...喝完鸡尾酒可以马上再喝吗？」</p><p class="story-paragraph dialogue">「怎么了，你又想延后吗？这个特别重，要随身携带到哥本哈根吗？」</p><p class="story-paragraph dialogue">「我可以喝，但问题是你」</p><p class="story-paragraph dialogue">「我没怎么醉啊，现在完全没问题好吗？」</p><p class="story-paragraph">虽然不能相信“没怎么醉”这句话，但就如旼炡所言，第二天要还带着沉重的酒瓶到处走，并不是最佳选择。那么最好的方法，就是刘知珉一边照顾金旼炡、一边喝酒，并当场全部喝光。</p><p class="story-paragraph dialogue">「...行吧，今天就喝掉吧。但是你只能在我让你喝的时候才喝」</p><p class="story-paragraph dialogue">「哪有这样的」</p><p class="story-paragraph dialogue">「这是规则，不接受就不要喝了」</p><p class="story-paragraph">知道了，快打开看看。听到旼炡的话，知珉似乎下了很大的决心，毅然决然点了点头，打开威士忌。一直被压抑在瓶中的水果香气马上飘散在房内。两个人同时品尝后，对视着说。这个味道有点...</p><p class="story-paragraph dialogue">「像烧酒一样」</p><p class="story-paragraph dialogue">「像烧酒啊？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">陌生的挪威威士忌，却让人意外地想起烧酒。口中蔓延的橙子香相当酸。虽然本来克制着只润润喉，但旼炡不知何时已经拿走酒杯，将酒倒进嘴里，还回来的只剩下空杯子。</p><p class="story-paragraph dialogue">「喂，不是说你不经允许不能随便喝吗？还拿走别人的杯子随便干杯？」</p><p class="story-paragraph dialogue">「好不容易才能喝到，我只是想像当地人那样试试看」</p><p class="story-paragraph dialogue">「别因为味道熟悉就喝那么快。把杯子给我，再放点冰块吧」</p><p class="story-paragraph dialogue">「现在这个浓度刚刚好」</p><p class="story-paragraph dialogue">「你一次都没喝过威士忌是吧，竟然就这么干掉，这真的要慢慢喝」</p><p class="story-paragraph dialogue">「那酒就全权由姐姐来负责吧」</p><p class="story-paragraph dialogue">「刚还说如果我想吐就别靠近你？」</p><p class="story-paragraph dialogue">「那个...」</p><p class="story-paragraph dialogue">「我先说吧，我喝酒从来没吐过，也从来没有大发酒疯。你呢？」</p><p class="story-paragraph dialogue">「我？其实没喝过很烈的酒，酒疯... 我也不太清楚」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还是把酒重新关上吧？」</p><p class="story-paragraph dialogue">「怎么了？干嘛那样」</p><p class="story-paragraph dialogue">「感觉很不安。你知道自己喝醉的习惯吗？而且要喝的还是之前没喝过的烈酒...」</p><p class="story-paragraph dialogue">「没关系，没关系。适量喝不就行了嘛，也没一定要喝到那种程度」</p><p class="story-paragraph">话说得容易，知珉用不安的眼神看向旼炡。刚才还被人用手抓进屋的是谁呢。可以轻易和完全无法预测之后的走向，如同弹力球一般的金旼炡一起喝酒吗？这真的是最佳选择吗？</p><p class="story-paragraph">不是开玩笑，在这片漆黑的大海中，在这狭小封闭的空间里，能负责旼炡的只有刘知珉一人。在得到这样单纯而又深刻的领悟后，只见旼炡大口大口地喝起酒，更让人毛骨悚然。知珉一边配合总是要求干杯的旼炡，一边慢慢喝。绝对不能让速度上升，要保持克制。但两人都忽略了，这不是在陆地上。不管喝多少，船只上下颠簸必定会使醉意更浓。</p><p class="story-paragraph">瞬间，船体向外大回转，随意放在地上的背包倾倒的同时，旼炡的身体也倒向自己。知珉立刻抓住酒瓶，以免酒瓶倒下，自己的身体向后仰，但没能躲开瞬间扑上来的旼炡。结果，两人稍微撞在一起。哐、的一声，传来后脑勺与地板撞击的声音，知珉疼地皱起眉头。</p><p class="story-paragraph">重新睁开眼睛的时候，眼前情况多少有些变化。只见旼炡手扶着地板，俯视着自己。两人的上半身之间，只有一个手掌左右的暧昧距离。</p><p class="story-paragraph dialogue">「没事吧？后脑勺是不是撞到地板了？」</p><p class="story-paragraph dialogue">「脑袋倒是还好，比起这个，那个杯子...」</p><p class="story-paragraph">能死守酒瓶已算是万幸，但地板上不仅是人，杯子也一起倒下了。从皱巴巴的杯内滚出几块小碎冰。在自己伸手的瞬间，旼炡突然粗暴地拍打起杯子，将纸杯内剩下的酒全洒在地上，最后纸杯只能无力地滚到角落。别说收拾，反而该清扫的范围还增加了，知珉突然激动地说道。</p><p class="story-paragraph dialogue">「喂，你在干什么？洒出来了应该擦干净啊」</p><p class="story-paragraph dialogue">「待会儿再说」</p><p class="story-paragraph dialogue">「待会儿？」</p><p class="story-paragraph dialogue">「地板不是之后也可以收拾嘛。也没有洒出来太多」</p><p class="story-paragraph dialogue">「...让开」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「都说了让开」</p><p class="story-paragraph dialogue">「都说了不要」</p><p class="story-paragraph dialogue">「哈...」</p><p class="story-paragraph dialogue">「为什么冷笑？」</p><p class="story-paragraph dialogue">「…金旼炡，你现在和我干什么呢？」</p><p class="story-paragraph dialogue">「我们像在干什么？」</p><p class="story-paragraph dialogue">「别开玩笑」</p><p class="story-paragraph dialogue">「没在开玩笑」</p><p class="story-paragraph">听了那句话不知为何，全身的力气都被抽光了。连用纤细的手腕撑着地板的旼炡都无法推开。睁着呆呆的双眼，嘴里说着固执的话，能感觉到她的厚脸皮。旼炡接着低下头，干脆在自己身上放松力道、上身紧贴。这下子，彼此之间连一个手掌的距离都消失无踪。光亮细滑的发丝搔痒着自己的脸颊。</p><p class="story-paragraph">旼炡反复眨了眨圆圆的眼睛，慢慢闭上眼。仔细看的话，她的左眼角有块浅浅的疤痕。应该是小时候受伤了吧？手指轻轻搭上她的眼角。旼炡在细微的动作下，依然一动不动，却皱起了眉头。知珉又轻轻地抚摸起受过伤的眼角。不需要吓一跳的。用手指十分温柔地传达自己的情感，接着是一片柔和的寂静。</p><p class="story-paragraph dialogue">「…这里有个伤口啊」</p><p class="story-paragraph dialogue">「那是我小时候就有的，但一直没消失」</p><p class="story-paragraph dialogue">「感觉你应该是打打闹闹着长大的」</p><p class="story-paragraph dialogue">「说什么呢，家里一男一女不都这样」</p><p class="story-paragraph dialogue">「是兄妹？还是姐弟？」</p><p class="story-paragraph dialogue">「是哥哥，大两岁」</p><p class="story-paragraph">原来是兄妹啊。旼炡的哥哥和旼炡长得像吗？会不会是这张脸换了性别的版本呢？带着这样的想法，知珉的脑回路自行想像起来。如果是去掉婴儿肥、长大版的旼炡，也许会看起来特别削瘦。或许只是被脸圆圆的印象所影响，其实她意外的眼神很犀利，下颚线分明。</p><p class="story-paragraph dialogue">「姐姐也有哥哥吗？」</p><p class="story-paragraph dialogue">「我有姐姐。比我大五岁。这样看来我们两个都是老么」</p><p class="story-paragraph dialogue">「终于找到一个共同点」</p><p class="story-paragraph">总觉得你在家里是撒娇鬼、撒娇鬼老么小狗。知珉露出浅浅的笑，像往常一样抚摸起旼炡的脑袋。但是娇惯的狗狗似乎对这只手不太满意，脸上带着不悦的表情，进行了无言的抗议。</p><p class="story-paragraph dialogue">「怎么，有什么不满吗？」</p><p class="story-paragraph dialogue">「姐姐为什么总叫我小狗？」</p><p class="story-paragraph dialogue">「...好像突然出现了一个根本性的问题」</p><p class="story-paragraph dialogue">「我...有那么像小狗吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「哪里？」</p><p class="story-paragraph dialogue">「嗯，哪里都像啊？更具体一点的话...应该是又小又白的狗狗吧？」</p><p class="story-paragraph dialogue">「又小又白...？」</p><p class="story-paragraph dialogue">「嗯，可爱的白狗，或者马尔济斯」</p><p class="story-paragraph dialogue">「不满意」</p><p class="story-paragraph dialogue">「不满意也没什么办法，你长得太像了，怎么办？」</p><p class="story-paragraph dialogue">「姐姐也有长得像的动物」</p><p class="story-paragraph dialogue">「...我？是什么？」</p><p class="story-paragraph">等了又等，却没等到回答，知珉举起手，在旼炡面前挥了挥。这时，旼炡才清醒过来，眨了两下眼睛。人家在问问题呢，不集中精神还发呆，让人很好奇啊。</p><p class="story-paragraph dialogue">「怎么不说话呢？是什么动物？」</p><p class="story-paragraph dialogue">「这么一看，姐姐的脖子真的好长啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「难道是因为这样吗？像蛇一样」</p><p class="story-paragraph dialogue">「...喂，你怎么说人是蛇啊？」</p><p class="story-paragraph">出现从未想像过的动物，让自己有点受伤。蛇？至少说像猫咪吧？蛇绝对不是看起来温柔的类型，不但是爬虫类、又冰冷、舌头还长得可怕，在迪士尼动不动就被描写成反派。结果说我像蛇？</p><p class="story-paragraph dialogue">「这是称赞你，虽然我很怕蛇」</p><p class="story-paragraph dialogue">「怕蛇吗？」</p><p class="story-paragraph dialogue">「不喜欢没有胳膊和腿滑熘熘爬行的动物」</p><p class="story-paragraph dialogue">「刚才不还说我长得像蛇？连我也害怕吗？」</p><p class="story-paragraph dialogue">「怎么突然这么说？我的意思是，长相和蛇的形象很类似而已。</p><p class="story-paragraph dialogue">「听起来一点都不像是在夸我」</p><p class="story-paragraph">真是空虚。小小白白的狗狗、小鸟宝宝，北极狐，和可爱又毛茸茸的动物都长得像，自己也时常把这些挂在嘴边。结果竟然听到 -姐姐像蛇一样- 怎么能这么说呢。而且其实自己很怕蛇。如果真的是蛇的话，肯定会把眼前的小白狗卷起来。但现在喝了酒，怕突然发脾气把自己心里话没有修饰说出口，决定先往好处想然后略过话题吧。</p><p class="story-paragraph dialogue">「好吧，虽然不知道算什么称赞。总之谢谢你说我长得像蛇」</p><p class="story-paragraph dialogue">「我的意思是...姐姐长得很特别」</p><p class="story-paragraph dialogue">「特别吗？」</p><p class="story-paragraph dialogue">「嗯，和其他人在一起的话非常引人注目」</p><p class="story-paragraph dialogue">「像什么时候？是之前说的，在食堂开新生欢迎会的时候？」</p><p class="story-paragraph dialogue">「不是，不是那个」</p><p class="story-paragraph dialogue">「不是吗，那是什么时候？」</p><p class="story-paragraph dialogue">「...我不说了」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「就是，不想说」</p><p class="story-paragraph dialogue">「什么呀，说吧、快说」</p><p class="story-paragraph">知珉把手放在旼炡的腹部和肋骨下，模彷起挠痒的动作。旼炡立即弹起身子呜咽着。反应比想象中要好，所以不想停手。我说、我会说的。知珉好不容易得到旼炡肯定的答复，才停下了手。</p><p class="story-paragraph dialogue">「...先把手从肋骨下面松开」</p><p class="story-paragraph dialogue">「不是停下搔痒了嘛，在你说之前我是不会把手放开的哦？」</p><p class="story-paragraph">没办法，金旼炡总要受到威胁和恐吓才能乖乖听话。快点说，所以是什么时候？接着又催促了一声，这时旼炡才说出那天的答案。学校庆典的时候看过，姐姐站在舞台上。</p><p class="story-paragraph dialogue">「啊，那个吗？我还以为是什么呢」</p><p class="story-paragraph dialogue">「现在不能把手放开吗？一碰到就痒」</p><p class="story-paragraph dialogue">「不能」</p><p class="story-paragraph dialogue">「让说不都说了嘛。刚才不是说要放手吗？」</p><p class="story-paragraph dialogue">「但我没有说马上就放啊」</p><p class="story-paragraph dialogue">「这么看来...人还真卑鄙」</p><p class="story-paragraph dialogue">「这么怕痒，让人很想欺负你」</p><p class="story-paragraph dialogue">「不要、不要，真的」</p><p class="story-paragraph">持续进行挠痒攻击后，旼炡再次被吓了一跳，赶紧拉着自己的手放下。然后一副调皮的表情，突然戳了一下自己的脸。</p><p class="story-paragraph dialogue">「你在干什么？」</p><p class="story-paragraph dialogue">「我也要反击啊」</p><p class="story-paragraph">触碰脸颊的手指慢慢地向下。旼炡忽然上上下下轻轻扫过纤长的脖子。轻触着戏弄的手指，使脖子周围渐渐开始发烫，神经好像都集中在附近了。知珉没有反应，只是静静地待着，因为不想按照你想要的那样，乖乖的给予反应。事实上，虽然搔痒难耐 -但手上的动作柔软，让人心情特别好，所以想要她再多做一点。</p><p class="story-paragraph dialogue">「姐姐好像不怕痒。怎么有办法就这样待着不动？」</p><p class="story-paragraph dialogue">「可能是因为喝了酒有点迟钝」</p><p class="story-paragraph dialogue">「...没意思」</p><p class="story-paragraph dialogue">「好像没能好好反击啊？真可惜」</p><p class="story-paragraph">瞬间，挠脖子的手突然停了下来。旼炡身上的黑色连帽衫似乎很闷，她不断拉扯脖子的部分，并扇了起来。</p><p class="story-paragraph dialogue">「干嘛一直扯自己的衣服。那样衣领会松掉的」</p><p class="story-paragraph dialogue">「...现在太热了，姐姐不热吗？」</p><p class="story-paragraph dialogue">「没那么热啊」</p><p class="story-paragraph">不，太热了。结果，独自中暑的小狗为了脱掉衣服抬起胳膊时，知珉反射性转过头。啪的一声，衣物掉落在地上，知珉视线慢慢向上。身穿白色T恤的旼炡，面无表情地看着自己泛红的脸颊。</p><p class="story-paragraph dialogue">「为什么转头？难道以为我里面什么都没穿吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「怎么自己有这些色色的想法？」</p><p class="story-paragraph">可惜现在要打她的后背太高了。知珉只能着急地，啪啪打了旼炡的肋下进行辩解。不是有奇怪的想法，是你好像要脱衣服，所以才避开视线，那不是礼貌吗。</p><p class="story-paragraph dialogue">「姐姐可以不用对我那么客气啊？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…但是好奇怪，我怎么还热呢？」</p><p class="story-paragraph dialogue">「等等、等一下」</p><p class="story-paragraph">旼炡啊，至少要穿件T恤啊！慌忙说完，知珉又转过头。吧嗒，旼炡穿在身上的白色T恤再次掉在了黑色连帽衫旁边。虽然多少有些无语，但旼炡身上依然穿着衣服。连帽衫里面是白色长袖，再里面是白色短袖。穿上那身衣服又喝酒，当然热了。</p><p class="story-paragraph dialogue">「...到底有几件衣服迭在一起？这样下去当然热了」</p><p class="story-paragraph dialogue">「这是最后了」</p><p class="story-paragraph dialogue">「旼炡啊，你简直就是俄罗斯娃娃...像Matryoshka...」</p><p class="story-paragraph dialogue">「Matryo...什么？」</p><p class="story-paragraph dialogue">「没事，不知道也没差」</p><p class="story-paragraph">知珉看着地上成堆的衣服叹了口气。虽然时间很短，但这瞬间感官太过强烈。也许今晚会梦见脱不下白衣的白狗。那只在飞机上代替旼炡坐在身边的神奇小狗。她说着很在意香味，凑上鼻子闻，噩梦中生气地咬住自己手指的那只白狗，或许会再次出现...</p><p class="story-paragraph dialogue">「但是姐姐，刚刚说的话是真心的吗？」</p><p class="story-paragraph dialogue">「嗯？什么？」</p><p class="story-paragraph dialogue">「说想看我唱歌的样子」</p><p class="story-paragraph dialogue">「是真心的啊」</p><p class="story-paragraph dialogue">「那我现在心情很好，即使不收钱也给你唱。想听什么？」</p><p class="story-paragraph">语气非常温柔，看着闭着眼睛微笑的旼炡，知珉挠了挠脸。今天的金旼炡怎么随着时间推移，心情越来越好了呢？刚刚还拍拍屁股来让她消气。早知道她的心情会这样曲线上升的话，就放任不管了，真不晓得怎么回事。明明为了让她消气那么努力，结果也没成功。</p><p class="story-paragraph dialogue">「没有想听的吗？快点」</p><p class="story-paragraph dialogue">「你为什么突然这样笑容满面？真让人不爽」</p><p class="story-paragraph dialogue">「不知道，可能是因为在姐姐上面吗？」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「果然能在上面俯视，心情就很好」</p><p class="story-paragraph dialogue">「不用给我唱歌，现在该下来了吧？你胳膊不疼吗？」</p><p class="story-paragraph dialogue">「不疼」</p><p class="story-paragraph dialogue">「你如果一直这样，我会推开你站起来的，好好说话的时候赶紧让开」</p><p class="story-paragraph dialogue">「...真的要我让开吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「明明只是说说而已，又不把我推开」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不是吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「好像是紧张了，从刚才开始就一直舔嘴唇」</p><p class="story-paragraph dialogue">「这只是习惯」</p><p class="story-paragraph dialogue">「这么一想，这习惯也像蛇一样」</p><p class="story-paragraph">只有我这么认为吗？因耳边软糯的嗓音起了鸡皮疙瘩。她稍微向下望的眼眸，感觉自己脑中无论想什么都会被读懂。接下来，她随口抛出的一句话让自己口干舌燥。</p><p class="story-paragraph dialogue">「要我帮你吗？」</p><p class="story-paragraph dialogue">「...嗯？」</p><p class="story-paragraph">这时嘴唇上突然贴上柔软的感觉。吓了一跳的知珉缩起肩膀。白皙的脸庞彷彿要触碰到似的十分靠近。旼炡闭着双眼，伸出舌头代替嘴唇。舌头轻轻一扫，脑内顿时变得昏昏沉沉。明明没喝多少酒。</p><p class="story-paragraph">一开始是从嘴唇上扫过，目光被通红的舌头吸引。平时舌头虽然也是鲜红色，但今天显得格外红润。视线从脸往下，就看见她颈部肌肉微微耸立。接下来从脖子根部继续延伸，可以窥探到笔直漂亮的锁骨。再向下是特别宽松的T恤之间，凸显出纤细的腰线...</p><p class="story-paragraph">知珉猛地摇了摇头。即便那样，烦恼也没有消失。视线转而投向身体的各部位，反而比刚才看得更加清晰。</p><p class="story-paragraph">都是因为有人骑在自己身上，还必须忍住才这样啊。</p><p class="story-paragraph">视线内只有这些东西能怎么办？</p><p class="story-paragraph dialogue">「…姐姐」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「又一个人发呆了」</p><p class="story-paragraph dialogue">「没有啊」</p><p class="story-paragraph dialogue">「你在想什么？为什么总是不集中」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还是...那么讨厌被说长得像蛇吗？」</p><p class="story-paragraph">那我给你换一个。普通的猫怎么样？看眼神的话，长得像猫咪。旼炡似乎想更仔细地观察，不断将脸靠近。喘息一次次撒在脸上，热度就不停向上飙升。</p><p class="story-paragraph dialogue">「不是那样...我就是也有点热了」</p><p class="story-paragraph dialogue">「是吧？不觉得挺热的吗？」</p><p class="story-paragraph dialogue">「都怪我讲了好几次让开、让开，但有人就是在上面紧贴不放」</p><p class="story-paragraph dialogue">「什么呀，是那个意思吗？」</p><p class="story-paragraph">本来是想转换气氛而开玩笑，却让默不作声的旼炡以受伤的表情，喃喃自语道。从刚才开始姐姐就一直拒绝。说不要、让开，让我下来。</p><p class="story-paragraph dialogue">「...就那么讨厌我吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「知道了，我就按你想要的去做。让开不就行了吗」</p><p class="story-paragraph">听见她说的泄气话，心里一阵一阵抽痛。就像有人用利器刺了心脏一样。这不是自己的意图。她会很生气吗？怎么办，该怎么办呢。知珉慌张地不知所措，只见旼炡想要起身，便拉住她的手臂说。</p><p class="story-paragraph dialogue">「不，不是的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…就待在这里」</p><p class="story-paragraph dialogue">「那...可以继续做吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「为什么不回答？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…可以做吗？」</p><p class="story-paragraph">话要讲清楚才能回答啊。</p><p class="story-paragraph">是问我能不能继续接吻？</p><p class="story-paragraph">还是、在指别的？</p><p class="story-paragraph">但是，我们不可能将自己的想法原封不动地问出口。旼炡郑重地提问后，却完全不等自己回答，就将脸凑上。感觉到呼吸比平时更加急促，像是搔痒一般反复浅吻，散发着完全不适合她稚嫩脸蛋的浓烈酒精味。知珉抬起头闭上眼睛，更加红润的嘴唇轻轻扫过脖子，继续向下。等嘴唇碰触到锁骨，便轻轻地接吻，接着在脖颈处反复一系列动作。</p><p class="story-paragraph">和刚才戏弄的手相比，带来的刺激感更加强烈，身体也开始颤抖。旼炡似乎想让自己不要逃避，双唇更加深入，朝后颈咬了一口。很危险。这是单纯的痒，还是超越痒的快感- 现在身体已经热得搞不清楚。自己所能做的最大努力，就是向旼炡发出信号。</p><p class="story-paragraph dialogue">「...够了」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「很痒...」</p><p class="story-paragraph dialogue">「…就这样？因为痒吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「用手搔痒的时候就完全不动。结果还是有点怕痒啊？」</p><p class="story-paragraph">旼炡的视线立刻朝上，以捉摸不透的眼神凝视着自己。这次又要做什么呢？内心焦急得眼神一刻也离不开旼炡。每当陷入沉默，温度似乎就会成倍上升，所以知珉必须喊出旼炡的名字。</p><p class="story-paragraph dialogue">「…旼炡啊」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「你在想什么？」</p><p class="story-paragraph dialogue">「刚才有传送心电感应没听到吗？」</p><p class="story-paragraph dialogue">「...好像没听到啊」</p><p class="story-paragraph dialogue">「反正，姐姐从以前开始，就听不到我的心电感应」</p><p class="story-paragraph dialogue">「说什么呢」</p><p class="story-paragraph dialogue">「没什么，不知道就算了」</p><p class="story-paragraph">心电感应？完全不知道是什么意思。但是，没有留下解释的余地，旼炡轻轻将刘海撩进耳后，亲吻了自己的额头。</p><p class="story-paragraph">只穿着薄T恤的旼炡，身体却非常热。知珉再次闭上眼睛。软嫩的触感慢慢从额头移至眼皮上方。因为嘴唇接触到不熟悉的地方，所以不自主皱起右眉。旼炡在自己用力的眉间也落下一吻，接着一步步往下。像个想在所有地方留下痕迹的孩子一样。</p><p class="story-paragraph">太痒了，心情好奇怪。</p><p class="story-paragraph">被气息触碰的地方有反应，好像要起鸡皮疙瘩。嘴唇在鼻翼上轻轻掠过时，不禁颤动了肩膀，旼炡这才露出满意的微笑。无法冷却的热气经过高挺的鼻尖，从上唇掠过。双唇立刻张开，舌头慢慢地交缠。</p><p class="story-paragraph">亲吻过后，旼炡再次把脸埋在脖颈处。就像把自己托付给他人一样，姿势非常安逸。正好感受到了踏实的重量。每当平静的呼吸洒在肩膀，温度就会上升。等旼炡安定下来，知珉叹了口气，这才轻轻抚摸着她的后脑。</p><p class="story-paragraph dialogue">「...你现在稍微冷静一下」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「真是不听话」</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「…怎么了？」</p><p class="story-paragraph dialogue">「脖子好烫」</p><p class="story-paragraph dialogue">「因为喝了酒」</p><p class="story-paragraph dialogue">「心脏也跳得很快，有咚咚的声音」</p><p class="story-paragraph dialogue">「那是因为你的鼻子挠得我痒，你这只小狗」</p><p class="story-paragraph dialogue">「我不是小狗」</p><p class="story-paragraph">旼炡再次抬起头，鼓起腮帮子。好像不懂为什么，从刚才开始就被看作是狗狗。虽然不能理解，但是本人对小白狗的爱称似乎不是很满意。金旼炡一定不知道，她越是露出直白的表情就越想捉弄她。想故意没有节制地把它当成小白狗。</p><p class="story-paragraph dialogue">「任谁看都是小狗啊？」</p><p class="story-paragraph dialogue">「...那姐姐是什么？」</p><p class="story-paragraph dialogue">「当然是小狗的主人了，我不久前不是还给你戴了项圈嘛」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「要再戴一次吗？颈链」</p><p class="story-paragraph dialogue">「我再也不戴了。都说了因为闷不喜欢那个嘛」</p><p class="story-paragraph dialogue">「应该认真思考一下，为什么金旼炡会有拒绝小狗这个自我认同感的情况呢？」</p><p class="story-paragraph dialogue">「...什么、自我认同感？说完了吗？」</p><p class="story-paragraph">知珉一边笑，一边摆弄着旼炡气呼呼的脸蛋。现在才感觉到气势有所逆转。这反正都是金旼炡的错。谁让一念出小狗一词她就气噗噗的，让人更想捉弄她。</p><p class="story-paragraph dialogue">「主人好不容易给系上漂亮的项圈，却一直拒绝说很闷。明明还有很多想给小狗试穿的东西」</p><p class="story-paragraph dialogue">「是要一直逗我玩到最后吧？」</p><p class="story-paragraph dialogue">「我会一直逗你玩到你睡着」</p><p class="story-paragraph dialogue">「…哪有和自己的狗狗做这种事的主人呢，变态啊」</p><p class="story-paragraph">好可爱，好可爱，太可爱了。</p><p class="story-paragraph">因为这句话，自己的心声就这么脱口而出。</p><p class="story-paragraph dialogue">「你今天要把可爱的话全说完吗？」</p><p class="story-paragraph dialogue">「我知道很可爱」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…旼炡啊，你知道什么了？」</p><p class="story-paragraph dialogue">「我知道自己很可爱」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「所以别再说那个了，说点别的吧」</p><p class="story-paragraph dialogue">「你...是喝醉了吗？突然脸皮变得好厚啊」</p><p class="story-paragraph dialogue">「我可能也是因为喝醉才这样吧」</p><p class="story-paragraph">该怪接吻时散发出的酒气，还是该怪不知不觉中已经到来的凌晨？现在不是一个人，而是两个人一起醉了。但是至少知珉现在还有点理智，能认清她的发言相当厚脸皮。小狗竟然说知道自己可爱。因为这唐突的宣言实在太可爱，所以噗哧笑了出来。</p><p class="story-paragraph dialogue">「又有什么好笑的」</p><p class="story-paragraph dialogue">「...那你想听我说什么？」</p><p class="story-paragraph dialogue">「不要小狗、不要可爱，别的」</p><p class="story-paragraph dialogue">「我们宝宝因为被叫小狗很难过呢」</p><p class="story-paragraph dialogue">「我们宝宝，那句话从现在开始也禁止」</p><p class="story-paragraph dialogue">「...如果都禁止的话，到底该叫什么才好？」</p><p class="story-paragraph">旼炡拒绝的三个关键词是小狗，可爱，宝宝。等于是把与本人形象相符的词都拒绝了，真是不理解。不该定下禁用词，干脆说请对我说哪些，这样要求不是更简洁明瞭吗？但也可能不好意思直接说，旼炡一直默不作声，结果干脆咬住了别人的脖子。看着她蜷缩的背影，一定是这么说的。</p><p class="story-paragraph">即使不说出口，自己看着配合的话不行吗？</p><p class="story-paragraph dialogue">「怎么了，直接跟我说没关系的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「看你不说话就咬人，还真是一只小狗」</p><p class="story-paragraph dialogue">「别再说小狗了」</p><p class="story-paragraph dialogue">「那该说什么啊，给点提示吧」</p><p class="story-paragraph dialogue">「不是一直在接吻嘛，刚刚」</p><p class="story-paragraph dialogue">「你意外的很会接吻啊？这样？」</p><p class="story-paragraph dialogue">「不是那样的」</p><p class="story-paragraph dialogue">「那是什么？」</p><p class="story-paragraph dialogue">「...你是真的这么想吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还想再吻一次？」</p><p class="story-paragraph dialogue">「那个也...有点偏了」</p><p class="story-paragraph dialogue">「那是什么，你就痛快地说出来吧」</p><p class="story-paragraph">也许是表示自己非常生气，旼炡开始更加用力地咬住相同的位置，感觉会留下牙印。啊呀...知珉因为刺痛感，皱起眉头拍了拍执着的小狗。</p><p class="story-paragraph dialogue">「知道了，知道了，能不用牙齿咬了吗？」</p><p class="story-paragraph">但似乎是表示拒绝，旼炡反而继续加大力度向下。喝醉酒简直用上全身的力气，推她身子也纹丝不动。</p><p class="story-paragraph dialogue">「那个，旼炡啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「金旼炡，够了、好疼。姐姐好疼」</p><p class="story-paragraph">动作明显比刚才粗暴多了，使全身燥热不已。半开玩笑的爱意行为，已经不再是让人觉得痒痒的程度而已。呼吸明显变得急促起来。早知道局势会被逆转，就不捉弄她了。</p><p class="story-paragraph dialogue">「旼炡啊，停一下」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...为什么总是让我停下？」</p><p class="story-paragraph">就这样，几分钟过去了，旼炡几乎像吸血鬼一样咬着脖子吸血，但不知不觉中，贴在脖子上的嘴唇都已经来到凹陷的锁骨。自己则好像完全瘫痪，动弹不得。坐在自己身上的人非要向下不可，心脏无法控制地剧烈跳动。</p><p class="story-paragraph dialogue">「够了、停下…」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「等一下，真的…到底要下到哪里去啊？」</p><p class="story-paragraph">即使自己伸手揉了揉她的头发，一头扎进胸前的脑袋却毫无停歇之势。这个有点危险吧。</p><p class="story-paragraph dialogue">「啊...」</p><p class="story-paragraph">知珉立刻紧闭双唇，自己不知不觉发出了呻吟声。疼吗？对不起。旼炡在说完简短的一句话后，暂时又陷入沉默。脖颈处反复几次亲吻后，动作逐渐慢下来。随着时间的流逝，旼炡依然一动不动。知珉伸手去摸她的小脑袋。这时才传来了嘀咕。</p><p class="story-paragraph dialogue">「…真漂亮」</p><p class="story-paragraph dialogue">「...嗯？」</p><p class="story-paragraph dialogue">「知珉姐姐真漂亮」</p><p class="story-paragraph dialogue">「虽然很感谢你的称赞...但这么突然？」</p><p class="story-paragraph">喂，旼炡啊。像敲门一样叩叩敲了她的脑袋，但这次一直没有回答。啊、难道是想听别人说你漂亮吗？所以把话说完后，现在可能是因为害羞了。</p><p class="story-paragraph dialogue">「真漂亮啊我们旼炡，太漂亮了。早说你想听这个不就得了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在...能不能不要再咬姐姐的脖子了？」</p><p class="story-paragraph">虽然说到这地步，但旼炡却依然沉默不语。知珉这才察觉到异常，迅速地转头。现在是什么情况，不会吧，孩子不会在哭吧。知珉突然揉揉旼炡的肩膀，试图安慰她。</p><p class="story-paragraph dialogue">「...哭了吗？ 旼炡啊？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「对不起...刚才我拿小狗逗你逗得太过了吧」</p><p class="story-paragraph">其实是你的反应太有趣了，每天都想着要克制一点，但都失败了...尽管自己不断辩解，但旼炡仍然没有回应。肩膀一动不动，没发出一点抽泣声，看来也不是在哭。像个孩子一样被抱在怀中的旼炡，发出规律的呼吸声，像晕倒一样趴着。</p><p class="story-paragraph dialogue">「…旼炡啊」</p><p class="story-paragraph">不知怎么的，感觉冷飕飕的，知珉更用力敲了敲旼炡的头。砰、砰两下，如果是平时早就开始抱怨。实验的结果很明确。每次招惹她的时候，都会毫无抵抗地轻轻摇动圆圆的后脑勺，现在事实摆在眼前。</p><p class="story-paragraph dialogue">「你现在是...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...睡了？」</p><p class="story-paragraph">旼炡，金旼炡？知珉决定铤而走险，喊出旼炡规定好的禁用词。小可爱、宝宝、小狗、白狗呀？但完全成了自言自语，回荡在房间。也许是因为完全失去意识，旼炡的头与刚才相比更重了。</p><p class="story-paragraph dialogue">「…金旼炡」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...开玩笑的吧？」</p><p class="story-paragraph">现在的情况下，精神恍惚的人明显不是金旼炡，而是刘知珉。刚才乱咬别人的脖子，结果竟然在这种气氛下睡着了？和在下面扑腾的自己不同，旼炡就像进入冬眠的熊，没有一丝动静。</p><p class="story-paragraph dialogue">「你...就这样睡着了吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「是啊，困意突然来了，应该就会这样睡着吧...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是你就这样睡着的话，我该怎么办呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「如果你10分钟内不起来的话，真的...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「真的死定了」</p><p class="story-paragraph">又不敢抛下已经打着呼噜进入梦乡的某人，知珉只能自言自语。</p><p class="story-paragraph">在哥本哈根的大海中央，迎来一个格外寂静的黎明。</p></div>

        <div class="chapter-copy"><p class="story-paragraph">叩叩。旼炡突然意识到有人轻碰自己的额头。</p><p class="story-paragraph dialogue">「睡得好吗？」</p><p class="story-paragraph">醒来却彷彿还置身梦境之中，耳边传来的，是知珉的低语。抬头一看，果然是知珉格外温柔灿烂的笑容。旼炡被太过靠近的距离给吓了一跳，把身体往后挪。</p><p class="story-paragraph dialogue">「何必那么惊讶」</p><p class="story-paragraph">但由于背部被微微按住，起身的动作被轻易制止。知珉依然露出可怕的静态微笑，旼炡则像从冬眠中惊醒的兔子环视四周。你好像现在才掌握情况啊。对视的瞳孔猛地一颤。概括一下现在的情况，醉酒后直接睡着的金旼炡，在房间的地板上，拿刘知珉当床垫，只顾自己睡得饱饱的。</p><p class="story-paragraph dialogue">「…姐姐」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「我...睡了多久啊？」</p><p class="story-paragraph dialogue">「整整3个小时？」</p><p class="story-paragraph">旼炡视线朝上计算着。昨天是几点睡来着？那么现在时间...</p><p class="story-paragraph dialogue">「早上6点」</p><p class="story-paragraph">6点？早上6点吗？一听这话，旼炡慌忙将视线转向窗外。清晨蔚蓝的天空中，太阳正在升起。这是昨天就一直想看的丹麦蓝色大海的日出。知珉帮旼炡整理翘起的刘海，用前所未有的温柔嗓音说。</p><p class="story-paragraph dialogue">「哎呀，睡前狂饮了那么多烈酒，看你脸色苍白的」</p><p class="story-paragraph dialogue">「…烈酒…」</p><p class="story-paragraph dialogue">「睡得很好吧？拿别人的身体当床」</p><p class="story-paragraph">虽然手上的动作轻柔，但不知是不是感受到流淌出的杀气，旼炡颤抖着缩起身体。就像是草食动物的直觉，知道自己已被猛兽盯死。怪不得...感觉比枕头还柔软呢。知珉没有漏掉旼炡的喃喃自语，一把抓住她的衣领反问。</p><p class="story-paragraph dialogue">「...柔软？什么东西柔软啊？」</p><p class="story-paragraph dialogue">「放开我，是称赞的意思，是真的」</p><p class="story-paragraph dialogue">「你现在要起身了吗？感觉都要抽筋了」</p><p class="story-paragraph dialogue">「啊、抱歉，对不起」</p><p class="story-paragraph">旼炡连声道歉，并赶紧起身。几个小时压在上半身的重量一消失，瞬间全身都麻了。好像快瘫痪了一样，浑身酸痛，不禁皱起脸来。不敢靠近的旼炡，用平时1/10不到的音量、像蚊子一般嘀咕着。姐姐...没事吗？</p><p class="story-paragraph">呼。知珉无法控制自己的情绪，长长地叹息。等了许久，终于迎来了早晨，也是开始旅行以来状态最差的一次。旼炡入睡后，自己一直挣扎着，最后还是放弃了。也仅剩2个小时左右的时间，还是以这种姿势入睡。这得感谢金旼炡，不说梦话、不翻身、不从人型床上掉下来，简直比夏天挂在树上的蝉，还更执着。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「不管再怎么醉，也有分成可以原谅和不能原谅的嘛。是吧？」</p><p class="story-paragraph dialogue">「不能原谅的...？」</p><p class="story-paragraph dialogue">「从这一瞬间开始，绝对不会有像平时一样，你做出可爱的行为就放过你的事了」</p><p class="story-paragraph dialogue">「可爱的行为…从来就没做过...」</p><p class="story-paragraph dialogue">「别碎念了，回答我」</p><p class="story-paragraph dialogue">「是...」</p><p class="story-paragraph dialogue">「你、昨天的事什么都不记得了吗？」</p><p class="story-paragraph">旼炡完全不知道现在的回答即将决定生死，还乐呵呵地说。记得啊，当然记得，昨天好多有趣的事啊。</p><p class="story-paragraph dialogue">「是啊...昨天确实发生很多有趣的事，也比平时活力满满」</p><p class="story-paragraph">我从想起的开始先说说看吧。旼炡没受到指使，就一个人自作主张，开始阐述事情的经过。搭了船吃晚饭，看了日落。在赌场玩了会老虎机。后来偶然挣到钱，去了8楼的一家酒吧。</p><p class="story-paragraph dialogue">「Stop！」</p><p class="story-paragraph dialogue">「...怎么了？」</p><p class="story-paragraph dialogue">「这些都是进酒吧之前的事，当然要记住。接下来呢？」</p><p class="story-paragraph dialogue">「之后是...下楼梯时，姐姐一直走得很快，感觉都快摔倒了。所以...」</p><p class="story-paragraph">我为什么要那这样呢？为什么要带着喝醉的孩子催她快点呢？知珉用手敲打地板，催促着患上失忆症的室友。但是从旼炡口中说出的下一句话，直接将怒火点燃。</p><p class="story-paragraph dialogue">「就是说啊，为什么...为什么要那样呢…？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你...不会是从这里开始断片的吧？」</p><p class="story-paragraph">知珉不自觉握紧拳头，旼炡看到这一场景，为了重新拼凑起脑中剩余的残影，紧皱眉头，使出浑身解数。等一下、等一下，感觉要想起来了稍等一下啊，楼梯上有个奇怪的人。</p><p class="story-paragraph dialogue">「是吧，所以呢？」</p><p class="story-paragraph dialogue">「然后气喘吁吁地跑进了房间，这里我还记得」</p><p class="story-paragraph dialogue">「…你没跑进来，是我抱着你跑了起来的」</p><p class="story-paragraph dialogue">「哎呀，是啊。对、对」</p><p class="story-paragraph dialogue">「还有？」</p><p class="story-paragraph dialogue">「进到房间里...开了饼干和一起带过来的酒，吧？」</p><p class="story-paragraph dialogue">「在这之前还对我说我力气大，让我去练武。如果想看的话，需要现在表演给你看吗？」</p><p class="story-paragraph">不是、没关系，真的没关系。见旼炡渐渐向后退，知珉拽着她的脖子，让她重新坐回身边。还在说话呢干嘛离那么远，到这边来。</p><p class="story-paragraph dialogue">「所以，在房间里喝酒之后的事...你还记得吗？」</p><p class="story-paragraph dialogue">「姐姐...你的脸好像要杀人，表情稍微放松一下吧」</p><p class="story-paragraph dialogue">「…我的脸怎么了？本来就是这样」</p><p class="story-paragraph dialogue">「当然是一直盯着我看所以可怕啊。之前不是还让我笑一笑嘛」</p><p class="story-paragraph dialogue">「旼炡啊，我现在可是在拼命忍住怒火」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「要知道你睡觉时我没有把你扔到船外，就该庆幸了」</p><p class="story-paragraph">知珉天使般温柔的面孔，不知何时变成一口生吞狗狗般的掠食者 -就像吞食食物前的蛇。旼炡不由自主向后退了一步。当然，在颈部被抓紧的情况下移动，并没有任何回避效果。</p><p class="story-paragraph dialogue">「...我记不太清了，对不起」</p><p class="story-paragraph dialogue">「还真让人有点不知所措…」</p><p class="story-paragraph">喝完酒可能会断片。本以为至少会记住一点点，没想到她会直接说不知道就想抵赖。刚说完就被狠狠瞪着，旼炡只能偷偷看眼色轻声呢喃。</p><p class="story-paragraph dialogue">「不好意思，姐姐能不能说一点...？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「昨天发生了什么事吗？我们...」</p><p class="story-paragraph dialogue">「哈...」</p><p class="story-paragraph">对于旼炡的发言知珉嗤之以鼻，一字一句断开来回击。昨天、发生了、什么事吗、我们？</p><p class="story-paragraph dialogue">「我喝酒之后有什么失误吗？」</p><p class="story-paragraph dialogue">「现在已经不好笑了。你刚才说失误吗？失误？」</p><p class="story-paragraph dialogue">「不要太抠字眼了。只是...问一下我有没有做奇怪的举动...」</p><p class="story-paragraph dialogue">「你现在说的这个字眼就是最大的失误」</p><p class="story-paragraph">你昨天对我做了什么，需要看一下证据吗？知珉立刻用手指着自己胸口。上面留着一个乍看之下看不太清的圆形痕迹。</p><p class="story-paragraph dialogue">「证据一，你在我衣服上留下的口水印。」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「直到刚才都还边流边睡，所以还没干」</p><p class="story-paragraph dialogue">「…怎么可能，我从来没在睡觉时流过口水」</p><p class="story-paragraph dialogue">「我发誓这是你的口水。一直是躺在地上，从人类身体结构来看，能流到这的不可能是我吧？」</p><p class="story-paragraph dialogue">「不是酒吗？虽然有痕迹，但看不清楚啊」</p><p class="story-paragraph">那你来闻闻味道吧，看是酒精还是你的口水。旼炡立刻凑上鼻子对上胸前的斑点，但结局似乎是无可辩驳，只能用双手捂住了脸。本来就娇小的身材，现在更像泄了气的气球一样瘪下去。</p><p class="story-paragraph dialogue">「要疯了...第一次趴着睡觉，所以可能张着嘴睡着了。我简直是傻瓜...」</p><p class="story-paragraph dialogue">「你不会以为光流口水一件事就让我这样吧？」</p><p class="story-paragraph dialogue">「感觉很可怕，能不能不听...」</p><p class="story-paragraph dialogue">「很抱歉，今天你没有决定权」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「证据二。如果你长着眼睛，就看得到这个吧」</p><p class="story-paragraph">现在才进入正题。知珉以堂堂的气势直指自己的脖子。脖子中间刚才被长发遮住而看不清，现在即使从远处看也一清二楚，上面刻着深深的吻痕，存在感十分强烈。旼炡目睹第二证据后瞳孔逐渐放大，薄薄的耳朵就像脖子上的痕迹，瞬间被染红。旼炡双手捂着脸，只留两只眼睛，骨碌碌地转动。</p><p class="story-paragraph">是啊，如果你是人的话，无话可说才是正常的。知珉似乎想让她看得更仔细，将昨天的痕迹摊在旼炡的眼前。是谁在别人的脖子上盖了这么大的章呢？昨天有只小狗竖着牙齿、一个人胡闹的不行，到底是搞什么啊。别说了、别说了。</p><p class="story-paragraph dialogue">「姐姐，所以这个...」</p><p class="story-paragraph dialogue">「怎么，应该没有借口了吧？喝了酒什么都不记得了？都是失误？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「金旼炡，无话可说了吧？」</p><p class="story-paragraph dialogue">「这个...就是结束了吧？」</p><p class="story-paragraph dialogue">「...等一下、要再说一次吗？」</p><p class="story-paragraph dialogue">「所以昨天...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「在脖子上留下吻痕...就结束了吗？」</p><p class="story-paragraph">啪。瞬间，心中仅存耐心的绳索应声断裂。像个大逆罪人般低头坐着有什么用，我刚刚还在说什么，结果竟然敢问只是吻痕就结束了吗？这简直超越居心叵测，是不知羞耻啊。</p><p class="story-paragraph dialogue">「...你现在是为了问我这个才坐在这吗？真的想死吗？」</p><p class="story-paragraph">知珉最终对眼前的无耻之徒进行了惩罚。那当然只能问姐姐啊、还能问谁啊！本来就只有两个人，在这样的情况下，还光会耍嘴皮子、不停顶嘴，真是令人大开眼界。</p><p class="story-paragraph dialogue">「你今天就闭嘴吧。我生气了，说不下去了」</p><p class="story-paragraph dialogue">「等一下、暂停，也给我一点解释的时间」</p><p class="story-paragraph dialogue">「什么解释？你想说只是咬着舔着就睡着了吗」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「从今天开始3天内禁止肢体接触。一边自我管理一边反省吧」</p><p class="story-paragraph dialogue">「...亲亲也不行吗？」</p><p class="story-paragraph dialogue">「当然不行。走路牵手、偷偷靠在背上、摸头，这些都是禁止的」</p><p class="story-paragraph dialogue">「哪有那样的，而且摸头的不是我，姐姐才是跟家常便饭一样常做啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「别挑字眼了。总之就这么决定了」</p><p class="story-paragraph dialogue">「但3天对人性而言实在...」</p><p class="story-paragraph dialogue">「怎么，太短了？如果不满意就改成一周吧？」</p><p class="story-paragraph dialogue">「没有，没有」</p><p class="story-paragraph">不管怎样，无法否认自己留下如此明显的痕迹，旼炡就像一只鱼，张口闭口却说不出话来。这时，向前行驶的邮轮以极大的角度猛地转弯，坐在地上的两人也跟着晃动起来。旼炡停顿了片刻，差点摔倒在前面，知珉反射性地拉住她的身体。</p><p class="story-paragraph dialogue">「没事吧？」</p><p class="story-paragraph dialogue">「不、有点...很晕...」</p><p class="story-paragraph dialogue">「先抓着我吧」</p><p class="story-paragraph dialogue">「可是姐姐...我好像要吐了」</p><p class="story-paragraph dialogue">「我提前说过了，这里可没有铁桶之类的东西」</p><p class="story-paragraph">昨晚的事情经过一一回顾，不知旼炡是否真的认清了现实，她独自低下头没脸见人。真的没有喝完酒就这样睡着过，疯了吧、感觉丢脸死了...</p><p class="story-paragraph dialogue">「你还知道丢人？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「而且这种程度不会死的」</p><p class="story-paragraph dialogue">「太过分了」</p><p class="story-paragraph dialogue">「过分的是你，旼炡啊。最好知道一下，如果吐了就再也别想踩到陆地」</p><p class="story-paragraph dialogue">「…我一定会忍住的」</p><p class="story-paragraph">旼炡几乎是以趴着的姿势，拖着身子往角落去。她把头靠在墙上，垂头丧气的样子，就像被融化的软糖。</p><p class="story-paragraph dialogue">「为什么偏要靠在角落里呢？像个奇怪的人」</p><p class="story-paragraph dialogue">「刚才那样晃动后头一直很晕...」</p><p class="story-paragraph dialogue">「把头靠在墙上，会不会更晕？」</p><p class="story-paragraph dialogue">「我只是想靠在什么地方」</p><p class="story-paragraph dialogue">「觉得晕就让你抓着我啊，靠在我身上不就行了嘛」</p><p class="story-paragraph dialogue">「故意逗谁呢？不是说三天内禁止肢体接触嘛、还说吐了就不让我踩到陆地嘛」</p><p class="story-paragraph">很快，旼炡对无法停止晃动的痛苦折磨，呃呃...小声呻吟着。哎哟，臭小狗。这次算是例外，你过来。敲了几下地板发出“快来”的信号后，旼炡看着自己眼色慢慢靠近，将头依靠在知珉肩膀上。</p><p class="story-paragraph dialogue">「舒服点了吗？」</p><p class="story-paragraph dialogue">「嗯...比墙好」</p><p class="story-paragraph dialogue">「但真的只是靠着。如果以头晕为借口耍什么花招，被我知道一定马上揍你」</p><p class="story-paragraph dialogue">「这一天之内，我的形象到底变成什么了」</p><p class="story-paragraph dialogue">「要不要安静地坐着？然后，你没带解酒药吗？」</p><p class="story-paragraph dialogue">「第一天都给了姐姐，我已经什么都不剩了」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「…听起来好肉麻」</p><p class="story-paragraph dialogue">「以防万一，要不要把毛巾和湿巾拿出来？」</p><p class="story-paragraph dialogue">「嗯，还是那样做比较好」</p><p class="story-paragraph dialogue">「你等一下」</p><p class="story-paragraph">知珉赶紧把手伸向行李箱。昨天行李箱明明已经解开，但现在却重新锁上了。熟练地调整密码0,4,1,1。可没有和平时一样发出搭咔声。又试了几次还是一样。</p><p class="story-paragraph">才4个数字是不可能弄错的，真奇怪，难道是锁坏了？昨天明明还好好的。意外的难关让人头晕目眩。但是，由于旼炡尴尬的回答，最终触动了知珉的直觉。是啊、还真是怪事啊...</p><p class="story-paragraph dialogue">「金旼炡」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「难道你昨天边动我的行李箱，边把密码换了吗？」</p><p class="story-paragraph">知珉询问的同时，就对起脑海中的数字。0,1,0,1。虽然心想该不会做出这种幼稚的事情，但如果是金臭小狗旼炡的话，绝对有可能...这时，随着轻快的“搭咔”声，行李箱打开了。知珉立即从地板上站起来接近旼炡，旼炡则是被逼到角落、蜷缩着身体。</p><p class="story-paragraph dialogue">「呀，谁让你随便把别人的密码换掉的」</p><p class="story-paragraph dialogue">「别打了、别打了。是我错了」</p><p class="story-paragraph dialogue">「吐了也没什么办法，再打一下」</p><p class="story-paragraph">啪啪，随着几声声响，旼炡赶紧用双手抓住自己的背，说她太想吐了，几乎是躺在地上开始呜咽。我这是故意的，现今社会用生日做密码，很容易被盗的。</p><p class="story-paragraph dialogue">「是从加强安全性的角度来看，才帮你换的」</p><p class="story-paragraph dialogue">「就是你盗的啊。而且谁来看都觉得0101更不安全吧？</p><p class="story-paragraph">脑袋一阵一阵地抽痛，从一大早开始又变得一团乱了。这么想想，上次拥有宁静、悠闲的早晨场景是什么时候呢，已经想不起来了。恰好船舱内的音响响起了“嘀——”的信号音。刚才还吵吵闹闹的两人，同时把头转向声音来源。吱吱嘎嘎的噪音混合低沉的男性嗓音说，两个小时后即将抵达哥本哈根。这大概是为了让所有住客准时起床，所响起的Wake Up Call。</p><p class="story-paragraph">现在是上午7点半。起了个清早，正好肚子有点饿了。去吃早餐顺便出去兜兜风吧。穿上一身外套，旁边一双圆圆的眼睛，目光始终跟着自己。</p><p class="story-paragraph dialogue">「去哪啊？」</p><p class="story-paragraph dialogue">「姐姐吃个早饭就回来」</p><p class="story-paragraph dialogue">「我呢？把我留下吗？」</p><p class="story-paragraph dialogue">「反正你胃现在乱糟糟的，没办法一起吃饭」</p><p class="story-paragraph dialogue">「那还是可以一起去吧」</p><p class="story-paragraph dialogue">「一定要吗？这样我得一直扶着你才行啊。而且如果在外面呆着，感觉更糟怎么办」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我会带零食回来的，别担心，在房里好好休息吧」</p><p class="story-paragraph dialogue">「...知道了」</p><p class="story-paragraph dialogue">「我马上就回来，乖乖呆着」</p><p class="story-paragraph">知珉就这样把身体不适的旼炡留在房间，走向了邮轮上的早餐咖啡厅。</p><p class="story-paragraph">昨天晚餐十分豪华，早餐自助餐也摆得毫不逊色。知珉把炒蛋和沙拉夹进面包，大口大口吃完，餐后则是装了杯红茶。直到喝了口茶，才感觉平静下来，精神也渐渐恢复了。大片玻璃窗外，风景也无比完美。海水飘荡，显得晨光格外灿烂。</p><p class="story-paragraph">对，这才是我期望中邮轮上的早晨。点了点头，享受起一杯飘香的茶以及悠闲时光。没过多久，脑中突然出现房间里某人死气沉沉的脸庞。耳边像是有人开了扩音器，传来旼炡碎念的声音。</p><p class="story-paragraph">我呢，你要留下我走吗？把身体不好的人扔在房间，姐姐则看着美丽的风景一个人吃早饭，这样开心吗？不是说会快点回来嘛，为什么故意慢吞吞的？</p><p class="story-paragraph">知珉没事突然摇晃起剩下半杯红茶的茶杯。怎么说呢，想一个人休息一下，就这么不被打扰。但最终没能战胜想象中的旼炡，知珉起身，手中还握着甜点区拿的杏仁。</p><p class="story-paragraph">咖啡厅旁边，是一间规模不小的船内免税店。要去一趟再回房间吗，考虑到挪威昂贵的物价，逛免税店算是稳赚不赔。但是，如果手里拿着一包免税品，感觉会被她瞪着眼睛说些什么。脑海中病恹恹的旼炡再次“砰”一下出现，然后说道。</p><p class="story-paragraph">不是说会快点回来吗。吃完饭还购物，真把该做的都做了？</p><p class="story-paragraph dialogue">「…...」</p><p class="story-paragraph">希望每当有重要选择的时刻，不要总是这么砰砰地出现在脑中。最后，知珉抵挡住了免税商店的诱惑，径直走回房间。</p><p class="story-paragraph dialogue">「旼炡啊，姐姐回来了」</p><p class="story-paragraph">身体怎么样？因为有你喜欢的杏仁，所以带回来了。说到这里转头一看，知珉才发现自己在空无一人的房间自言自语。刚才还一直呆在房间角落，还以为她一定会原封不动地呆在那，但事实并非如此。环顾四周，狭窄的船舱里没有一个大人能躲藏的地方。知珉只能和刚才一样，一边坐在地上发呆一边等待旼炡。莫名有些焦躁地摆弄着手中的杏仁袋。</p><p class="story-paragraph">现在是8点5分，预计下船时间是9点。虽然不是很急，但是这样没问题吗？离下船只剩下不到一个小时啊？难道是因为胃不舒服，所以去了厕所吗？在还没太晚前赶紧联系吧。接着拨了电话，但旼炡连电话也没接。不对，是不可能接。因为手机正躺在地上嗡嗡作响。</p><p class="story-paragraph dialogue">「...你去哪了，连手机都忘了带」</p><p class="story-paragraph">现在居然是断绝联系的状态。知珉带着不好的预感，一下子站了起来。然后从行李里翻出舒服的运动鞋套在脚上，急忙走向走廊。在房间周围的走廊转来转去，甚至喊出声音。旼炡你在吗？直到从走廊一端，又走到另一端尽头。船舱太大了，光转一圈就花费不少时间。这么来看，肯定不在6楼。</p><p class="story-paragraph">那么，到底去了哪里？</p><p class="story-paragraph">是不是因为太饿去吃早餐？知珉走向刚才的早餐咖啡厅。人们在门口排队等候，穿过人群，环顾店内，也没看见旼炡。</p><p class="story-paragraph">时间正在无情地流逝。挂在咖啡厅内鏽迹斑斑的古董时钟指向8点20分，知珉越来越不安了。像无头苍蝇般走来走去，接着，她把目光投向一旁的大幅地图上。但是“Du Er Her-现在在这个位置”这冷漠的挪威语，对知珉来说没有任何帮助.咖啡店旁边是刚才没进去的免税店。知珉没有去看任何免税商品，只是喊出旼炡的名字，巡视了每个角落，旼炡却依然不在。能选择的地点越来越小了。</p><p class="story-paragraph">如果不是餐厅、也不是去购物，那有可能是昨天去过的8楼。知珉急急忙忙爬上楼梯时，忽然停住脚步。不对，就算是金旼炡，也不会发疯从一大早开始就去拉老虎机的。而这个时间酒吧当然是关门状态。但即使如此，抱持着说不定的心情，知珉还是到昨天的赌场前徘徊了一下，不过里面全是老人。</p><p class="story-paragraph">现在已经来到8点35分。还必须回房间准备下船。知珉已经开始往最坏的情况想。胃不舒服的人，会不会在哪里倒下呢。服务中心就没有宠物狗协寻服务吗？韩国产，20岁，毛发是金色的。如果把公告贴在门上，会不会有人帮忙找。</p><p class="story-paragraph dialogue">「...金旼炡，到底消失在哪里了？」</p><p class="story-paragraph">到了最后，知珉只能以孤注一掷的心态，径直走向甲板。在强风吹拂下捋着头发，调整急促的呼吸。在昨天欣赏挪威晚霞的前排一角位置上，终于看到了一直寻找的、那娇小的金黄色人影。看着她侧面软乎乎的脸颊肉，更加确信是自己在找的人。知珉瞬间火大，大步走去，接着啪地用力打向她的背部。</p><p class="story-paragraph dialogue">「...呀」</p><p class="story-paragraph dialogue">「现在连打招呼都用打来代替吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你是怎么知道我在这里的？」</p><p class="story-paragraph dialogue">「你怎么知道的？翻透十一层楼的船才找到的，怎样。你在这儿干嘛？」</p><p class="story-paragraph dialogue">「问我干嘛...不是在吹风嘛」</p><p class="story-paragraph dialogue">「不是说身体不太好吗？」</p><p class="story-paragraph">啊，因为船速变慢了，上下摇晃得更厉害，感觉待在房间里会吐出来，所以急忙跑出来了。旼炡如是说。刚刚还像块融化了的软糖，现在可能已经恢复状态，脸色相当明亮。</p><p class="story-paragraph dialogue">「姐姐这么快就吃完早饭了吗？」</p><p class="story-paragraph dialogue">「竟然说快，我早就吃完了。8点左右就进房间，结果没看到人，找着找着就到了这里」</p><p class="story-paragraph dialogue">「怎么了？反正时间还剩下很多，怎么不慢慢吃呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「餐厅里有很多好吃的吗？没有给我带什么吗？」</p><p class="story-paragraph dialogue">「...带了一点零食来」</p><p class="story-paragraph dialogue">「是吗？肚子饿了，待会儿吃」</p><p class="story-paragraph">旼炡伸直胳膊伸了个懒腰。虽然很冷 但是出来吹吹风后好多了，早知道就早点出来。天下太平的样子讨厌得要命。如果要待在甲板上，留一个讯息不行嘛。知珉放心的同时也感到很空虚，只能抓住旼炡的两边脸颊，使劲拉长。</p><p class="story-paragraph dialogue">「好疼，怎么了？」</p><p class="story-paragraph dialogue">「我不是让你老实呆着嘛，傻瓜」</p><p class="story-paragraph">怎么这么不听话。你出来了的话就要说啊，手机为什么不带在身上？这样怎么联系。旼炡不服输地解释。刚才不是说了房间很闷才出来的嘛，手机是为了充电故意放着的，干嘛这样？我只是出来兜兜风而已。</p><p class="story-paragraph dialogue">「要是我没找到的话你怎么办？」</p><p class="story-paragraph dialogue">「说什么呢，姐姐是不是把我当小孩子看了？」</p><p class="story-paragraph dialogue">「...当小孩子？」</p><p class="story-paragraph dialogue">「是啊，当小孩子看」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我也知道什么时候该下船，肯定会准时回去的吧。为什么这么生气？」</p><p class="story-paragraph">哈。知珉混合着心中的不耐烦，叹了口气。今天的金旼炡有点讨厌。起床后一直说讨人厌的话，做讨人厌的事。就像患上失忆症一样，还反问我们昨天发生了什么事吗、脖子上的吻痕就结束了吧。说了一堆无耻的话。然后，现在竟然问自己为什么把她当孩子，问自己为什么这么生气。</p><p class="story-paragraph dialogue">「是啊，吃完饭因为内疚，想早点回去的我才是傻瓜」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「担心活得好好的人会在哪里晕倒，这也是我的错。行了吗？」</p><p class="story-paragraph">说完直接转身。旼炡掩饰不住慌张的神色，赶紧拉住手。对不起，我应该发个短信再出来的，没想到会害你一直找来找去。</p><p class="story-paragraph dialogue">「不，正如你说的，我的确是太敏感了」</p><p class="story-paragraph dialogue">「...我不是这个意思」</p><p class="story-paragraph dialogue">「算了，你再休息一会吧。我先下去了」</p><p class="story-paragraph dialogue">「姐姐、那个...」</p><p class="story-paragraph dialogue">「干嘛？」</p><p class="story-paragraph dialogue">「虽然已经是早上的太阳，我们看一下再下去怎么样？错过了日出...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「从昨天开始就想看了不是吗」</p><p class="story-paragraph dialogue">「不看也罢」</p><p class="story-paragraph">知珉甩开她的胳膊起身。等一下、不要就这么走。挽留的声音让原本打算离开的脚步逐渐放缓。</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「...都要走了，干嘛一直叫我」</p><p class="story-paragraph dialogue">「都是因为早上有奇怪的规定，所以不能让你消气」</p><p class="story-paragraph dialogue">「那个还会维持3天，你记得就好」</p><p class="story-paragraph dialogue">「再通融一次不行吗？」</p><p class="story-paragraph dialogue">「不行」</p><p class="story-paragraph">不要这样、再给一次例外吧。紧贴在身后的旼炡十分哀怨。都说了走开。知珉故意冷漠地说，但她的胳膊硬是缠上自己的腰。</p><p class="story-paragraph dialogue">「…旼炡啊，把胳膊放下来」</p><p class="story-paragraph dialogue">「因为冷，所以想再靠一下」</p><p class="story-paragraph dialogue">「明明刚才吹着海风一直坐在这，事到如今才说冷？」</p><p class="story-paragraph dialogue">「嗯，太冷了」</p><p class="story-paragraph dialogue">「...你今天怎么这么厚脸皮？」</p><p class="story-paragraph">是啊，可能酒还没醒吧。旼炡在自己背上蹭着脸，几句话一直反复。对不起、姐姐，消消气、消消气吧。</p><p class="story-paragraph">啪一声，理性的绳索又断了，虽然跟刚才属于不同范畴。总之...明明已经严肃地威胁过她，绝对不会因为她做出可爱的事就放她一马，就这么食言实在没意思。但仅仅因为这讨人喜欢的行为，怒气就像白雪融化一般，慢慢消了下去，刚刚还在生气的人简直像个傻瓜。</p><p class="story-paragraph dialogue">「现在消消气吧。嗯？」</p><p class="story-paragraph dialogue">「知道了，别在背上磨蹭了。消气不就行了嘛」</p><p class="story-paragraph dialogue">「心情变好了吗？」</p><p class="story-paragraph dialogue">「...大概」</p><p class="story-paragraph dialogue">「不要大概，要全部才行啊」</p><p class="story-paragraph dialogue">「喂，吃这个吧。你的早餐」</p><p class="story-paragraph">知珉有些难为情，将从自助餐厅拿来的杏仁递给旼炡。终于得到早餐的旼炡露出了幸福的表情。不理会摇摇晃晃的船，像仓鼠一样鼓起腮帮子吃了起来，看来宿醉已经完全恢复。</p><p class="story-paragraph dialogue">「快下船了，感觉怎么样？继昨天之后说说感想吧？」</p><p class="story-paragraph dialogue">「继昨天之后的感想？」</p><p class="story-paragraph dialogue">「姐姐说邮轮是目前为止乘坐过最喜欢的，现在还是最喜欢吗？」</p><p class="story-paragraph">知珉脑海中慢慢回想着昨天夜晚到今天早晨的事。好吃的海鲜自助餐和挪威晚霞的风景，然而浪漫就到此为止。没想到，这艘邮轮竟是艘地狱邮轮，直到今天早晨一刻也没有休息过。</p><p class="story-paragraph">无缘无故闹情绪的金旼炡、在老虎机上挣钱后高兴地唱歌的金旼炡、在楼梯上与殭尸的追击战、喝酒后兴奋地咬别人脖子的金旼炡、还在别人胸口流下口水的情况下，竟然还厚颜无耻地说“挺柔软的”的金旼炡、一夜之间行李箱密码变成了0101、吃完早饭回到房间突然消失的金旼炡。</p><p class="story-paragraph">真是无比完美的一天对吧。</p><p class="story-paragraph dialogue">「...不，也许我的人生中，不会再乘坐邮轮了」</p><p class="story-paragraph dialogue">「突然在一天之内？为什么？」</p><p class="story-paragraph dialogue">「就是那样...不要再问了」</p><p class="story-paragraph">不知不觉间，船似乎已经到达码头附近。汹涌的波涛逐渐平静下来。知珉一踏入这个陌生国度，就有种奇妙的感觉。与其说是感到激动，不如说是不安。这和刚抵达奥斯陆时，从轻型飞机上下来的感觉很相似。为了消除未知的不安，想立刻感受某人温暖的体温。因此知珉默默地抚摸旼炡的脑袋，船上微风轻轻掠过。</p><p class="story-paragraph dialogue">「刚才不是说连头都不摸吗？」</p><p class="story-paragraph dialogue">「是因为你头上乱七八糟的」</p><p class="story-paragraph">明明昨天是最糟糕的夜晚，但是为什么呢？发生各种怪事，一整晚几乎都没睡，累得快晕过去了。明明是噩梦般的邮轮旅行。两个人一起飞上天又漂浮在海面，为什么就这么不愿踏上这片土地呢？</p><p class="story-paragraph">原因不得而知。只是想再次确认旼炡就在自己身边的事实，知珉紧握她骨节分明、纤细的手。把头靠在她的肩膀上。意料之外的动作，让吃着早饭的旼炡转过头问。怎么了？</p><p class="story-paragraph dialogue">「...讨厌吗？」</p><p class="story-paragraph dialogue">「不是的...只是以为姐姐还在生气」</p><p class="story-paragraph dialogue">「我真的没生气」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「只是因为你不见了，有点担心」</p><p class="story-paragraph dialogue">「对不起」</p><p class="story-paragraph dialogue">「没事」</p><p class="story-paragraph">对不起，没有联系就擅自出去。旼炡对着本人昨晚制作的红印子，轻轻一吻，并直接埋头撒娇。干嘛呢，好痒啊。即使这么说，也不见她离开的迹象。如果从一大早开始就这样，那制定禁止肢体接触的规定，似乎没有任何意义。</p><p class="story-paragraph dialogue">「你都被教训了还不打起精神？」</p><p class="story-paragraph dialogue">「禁止条款现在不都解除了嘛」</p><p class="story-paragraph dialogue">「没有啊？」</p><p class="story-paragraph dialogue">「为什么，而且刚才是姐姐先靠着我的」</p><p class="story-paragraph dialogue">「我先做的话是例外」</p><p class="story-paragraph dialogue">「...那又是什么规定？完全就是随心所欲啊」</p><p class="story-paragraph">知珉抚摸着正在发牢骚的旼炡的脑袋，望向新城市晴朗无比的天空。这是哥本哈根凉爽的冬季早晨。</p></div>
