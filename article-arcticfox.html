        <div class="chapter-copy"><div class="location-badge"><strong>D E N M A R K : C O P E N H A G E N</strong><span>丹麦 ：哥本哈根</span></div><p class="story-paragraph">每当船稍微颠簸，胃总是隐隐作痛。知珉直到现在才醒悟过来。比起单纯因宿醉而病恹恹的旼炡，自己的身体状态更糟糕。躺在冰冷的地板上熬了一夜，再加上在11层的大型邮轮上和一只小狗玩捉迷藏。</p><p class="story-paragraph">渐渐升起的太阳使头脑发蒙。如果闭上眼睛，可能会马上入睡。当简易楼梯又哐当哐当地连接起陆地。或许是一天时间身体适应了在波涛的船上移动，一下船反而感觉地面摇晃起来。知珉勉强抓稳重心，慢慢向前走了一步，在不会摇晃、稳定的陆地上。</p><p class="story-paragraph">身体靠着行李箱，暂时平复呼吸。繁忙的码头上船只不断停靠、出港，自己是唯一一个呆呆站着的人。故障了一部分的手把，仍然拉不起来地嘎嘎作响。</p><p class="story-paragraph dialogue">「姐姐，我来拿吧」</p><p class="story-paragraph">这时，旼炡抓起行李箱，将自己的背包放在上面。</p><p class="story-paragraph dialogue">「...干什么呢？把行李给我」</p><p class="story-paragraph dialogue">「等到宿舍为止，我就这么带过去」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「很累吗？肩膀完全都垂下来了」</p><p class="story-paragraph dialogue">「也不至于连行李箱都拉不动」</p><p class="story-paragraph dialogue">「刚才看你下船的时候也摇摇晃晃」</p><p class="story-paragraph">别这样，今天就先休息，补充能量再继续走吧，我在哥本哈根没什么非得要去的地方。哄孩子似的口吻，反而让人心烦。不想再因为身体不好，而浪费宝贵的时间。旼炡当初似乎只把丹麦当成是途经的中间点，因为把最后一周的时间都留到了紧接在后的冰岛，所以这次在哥本哈根只会停留一天，成了不怎么重要的行程。</p><p class="story-paragraph dialogue">「在丹麦只会度过今天一天。不要只待在宿舍，出去转转更好吧？」</p><p class="story-paragraph dialogue">「还是感到很抱歉，昨天没睡好觉一定很累吧」</p><p class="story-paragraph dialogue">「真的没关系的」</p><p class="story-paragraph">咔嗒咔嗒，轮子与地砖的摩擦声相当刺耳。把两大件行李迭在一起拖着走的旼炡，今天看起来更像个小豆粒，那模样看的人都会感到不安。大步走到她身边，然后把她的背包抢了过来，但旼炡偏偏执拗地跟在一旁。就这样，两人就像绕圈圈，互相抢夺行李。到底在街上干什么呢。</p><p class="story-paragraph dialogue">「旼炡啊，就不能分着拿吗？这样下去更没力气了...」</p><p class="story-paragraph dialogue">「不要再固执了，反正就离这不远」</p><p class="story-paragraph">两人在人潮汹涌的街道中挡路，行人似乎觉得烦，只能悄悄躲开。而对面街道上，看似王宫的华丽建筑下，正在举行交接仪式。军人穿着整齐制服，有节奏地配合步伐行动。知珉暂时被那个场面吸引住视线，旼炡则趁机抢走包包，这下又开始了幼稚的第二场斗嘴。</p><p class="story-paragraph">为什么你要拿两个？之前明明还说重啊。昨天扔掉了那么重的酒瓶，所以很轻的，姐姐明明说过把手太低拿不了，今天就让我拿吧，别吵了。</p><p class="story-paragraph dialogue">「别总找借口，快给我。你那样哼哼唧唧地拖着走让人很不安。快点」</p><p class="story-paragraph dialogue">「...知道了」</p><p class="story-paragraph">如果一开始就这么走的话早就到了。吵吵闹闹白白浪费体力。总之，今天是在丹麦度过的第一天，也是最后一天，没有时间再混了。</p><p class="story-paragraph">哥本哈根的住处，就位于离旅游胜地新港(Nyhavn)不远处。这条街意思为商人的港口，是哥本哈根这座城市本身的象征。中间有条运河，其中有一整排小船，风景如画，美不胜收。古时候这里是船员们喝酒的酒吧街，建筑工人们为了标明自己的家，拿身边的颜料涂上房子。即便到了现代，这个传统仍然在现代化的城市中进行。五颜六色的低层建筑节比鳞次，成了哥本哈根的形象代表。</p><p class="story-paragraph">多亏这一点，这里几乎没有新的建筑物。旼炡进入的建筑，也是由旧房屋改造而成的五层公寓，内部经过装修十分干净，却保留了古老的框架。目前为止还算不错，但没有电梯这点令人绝望。这里的楼梯，即使一个人走动也显得狭窄，现在只能提着沉重的行李，一步一步慢慢爬到5楼。</p><p class="story-paragraph dialogue">「偏偏是没有电梯的建筑物啊...」</p><p class="story-paragraph dialogue">「对不起，我选了个便宜的地方，本来就打算只停留一天」</p><p class="story-paragraph dialogue">「你不需要抱歉啊，看来今天是把体力耗尽的日子」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「赶紧上去把行李放下休息吧」</p><p class="story-paragraph">等着吧，我先上去放下行李，再下来帮姐姐一起提行李箱吧。旼炡独自背上背包，一鼓作气爬上楼梯，很快又轻盈地回到了1楼。旼炡抓着上半部，知珉则撑着下面，两人合力把行李箱抬起来。受苦的不只是我，与自己的主人一起度过旅行的行李箱也很可怜。车轮在石阶上好几次碰撞，发出砰、砰的声音。知珉一边想，别说边角被磨损，只要车轮不出事就算万幸了，一边还哼哼着抱怨。</p><p class="story-paragraph dialogue">「欧洲古建筑的台阶怎么这么窄？」</p><p class="story-paragraph dialogue">「快到了，再加把劲。再上去就是5楼了」</p><p class="story-paragraph">房门一打开，没能参观宿舍，只顾着坐在客厅沙发上。使出全身上下的力气，渴得不行。她吸了一口包里的冰茶，用眼睛观察起家中各个角落。</p><p class="story-paragraph">正对面的墙壁上，挂着小幅的画布画框，是个可以瞭解房东喜好的绘画作品。用铅笔绘画而成的素描，似乎描绘了哥本哈根各个景点。像是刚才看到举行卫兵交接仪式的丹麦女王冬季宫殿、从宿舍的窗外能看见的成排的各色砖瓦房、小美人鱼铜像所在的海岸、还有具有寂静氛围的古老游乐园…</p><p class="story-paragraph">来回走了两次5层台阶的旼炡，似乎也感到疲惫不堪，直接回到了房间。旼炡啊，出来吧，这里有好看的。自己坐在沙发上喊道，马上听见远处传来回答。等一下、我马上出去。旼炡很快走到客厅问。</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「看看这里的画」</p><p class="story-paragraph dialogue">「...这是什么？」</p><p class="story-paragraph dialogue">「上面画了旅游景点，很漂亮。装饰得还不错吧？」</p><p class="story-paragraph dialogue">「姐姐，我之后再看画...」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「现在房间...要来看一下吗？」</p><p class="story-paragraph dialogue">「怎么，有虫子吗？」</p><p class="story-paragraph dialogue">「不是那个，先过来吧」</p><p class="story-paragraph">知珉跟着踌躇的旼炡走进房间。只见卧室中孤零零地摆着一张床，是旅行期间从未见过的，宽敞的Queen size双人床。</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「一张床啊」</p><p class="story-paragraph dialogue">「这个姐姐用吧，我在外面睡」</p><p class="story-paragraph dialogue">「这张床让我一个人睡吗？」</p><p class="story-paragraph">看着旼炡脸上表情不知如何是好，甚至悄悄地避开视线。她为了不跟自己对视，而扭动身体的样子，实在很值得一看。怎么回事，天上掉下来这么有趣的机会。旼炡似乎对昨天发生的事还有点在意。</p><p class="story-paragraph dialogue">「嗯，我睡在客厅的沙发上」</p><p class="story-paragraph dialogue">「...沙发？」</p><p class="story-paragraph">虽然对姐姐来说可能有点小，但我觉得能躺下就够了，而且昨天睡在地板上，所以今天在这里就能舒服地睡了吧，那我的行李就放在外面吧。旼炡这么决定好，接着把背包拖了出去。知珉呆呆地望着手忙脚乱的旼炡，并挽起了胳膊。从她黑色连帽衫中看见了白皙的脖颈。明明在别人的脖子上留下红色痕迹，真看不惯她那光滑的脖子。如果去掐一下她的后脖颈，会喊疼吗？</p><p class="story-paragraph dialogue">「为什么非要分开睡？」</p><p class="story-paragraph dialogue">「为什么分开睡...」</p><p class="story-paragraph dialogue">「昨天就那么扑过来，为什么现在才要这样回避呢？」</p><p class="story-paragraph">我以前也说过吧？和你用一张床没关系。听到最后一句话，旼炡的双耳几乎每瞬间都变得更加通红，甚至可以用早上涂的口红来比较。知珉把嘴唇紧紧贴在她圆圆的耳朵上，轻声低语道。都是某人总说很在意香味，所以我好一阵子都没用过香水。</p><p class="story-paragraph dialogue">「今天睡前要撒上很多，让你一整夜都睡不着觉」</p><p class="story-paragraph dialogue">「...从今天早上开始，就喜欢逗我玩」</p><p class="story-paragraph">嗯，太有意思了。然后轻拍她的屁股，把脸凑上去，眼前就是一颗熟透了的鸡蛋。反应比预想的要好，认真逗她真有成就感。</p><p class="story-paragraph dialogue">「你怎么那么红？到底在想什么？」</p><p class="story-paragraph dialogue">「故意挑奇怪的话来说的人是谁啊...」</p><p class="story-paragraph dialogue">「这怎么是奇怪的话，从昨晚开始，我看你就只是只小狗」</p><p class="story-paragraph dialogue">「...现在明目张胆地把我当狗吗？」</p><p class="story-paragraph dialogue">「是啊，一只把鼻子都挤进别人脖子的白狗」</p><p class="story-paragraph">一定要在床上和姐姐一起睡吗？当然是禁止肢体接触，所以你不能碰我。知珉用手指轻轻的挠了她的下巴，旼炡好像接受了自己的处境，摆出死心了的狗狗般脸庞，接着说道。</p><p class="story-paragraph dialogue">「很难受的，所以不要再捉弄我了...」</p><p class="story-paragraph dialogue">「都是你自作自受」</p><p class="story-paragraph">旼炡完全背过身去，在嘴里倒满杏仁，大口大口地嚼着。这样想来，她在船上连早餐都没吃，胃里应该空荡荡的，是不是该吃点什么了？但是昨晚在船上已经把零食全部吃光，所以包里也没有什么可以充饥。</p><p class="story-paragraph dialogue">「你没吃饭应该很饿吧。出去吃点什么吧？」</p><p class="story-paragraph dialogue">「不是还有两个拉面嘛。用那个解酒怎么样？」</p><p class="story-paragraph">是啊，这才想起还有拉面。</p><p class="story-paragraph dialogue">「我家狗狗记忆力真好啊」</p><p class="story-paragraph dialogue">「...我去煮面了」</p><p class="story-paragraph">自己没让她煮，只见她急忙跑到厨房。想让金旼炡乖乖听话，再也没有比这更好的特效药。难得这么有趣，今天就一直当小狗狗吧。知珉几乎躺在沙发上伸懒腰，对着厨房大喊。旼炡啊，姐姐的不要太辣，拜托你了。</p><p class="story-paragraph">过了一阵子，听到咕嘟咕嘟的声响，香辣的气味立刻传到客厅。没想到在挪威超市买的泡面，竟被当作如此重要的解酒食品。不管怎样，这比出去吃带实验性的油腻食物，要好上百倍。热汤将噁心的胃渐渐缓解了。</p><p class="story-paragraph dialogue">「休息一个小时再出去吧？」</p><p class="story-paragraph dialogue">「好吧，可以再多休息一会儿，准备好的话就说吧」</p><p class="story-paragraph">简单的饭后，两人决定休息。旼炡觉得身上不舒服，马上就去浴室洗漱，知珉则是喝着茶，再次坐在客厅沙发上。神奇的是，与外界联系中断了一整天，却也没有感到烦躁不安。但是坐船联系不上的理由也已经过了有效期，报告工作不能再拖延了。</p><p class="story-paragraph">知珉搜索并连接了宿舍提供的WIFI。一收到信号，手机就像出故障了开始疯狂震动，压力指数已经开始上升。每次越过国境时，都会一次性删除通讯社的琐碎通知。看完系群里正在聊这次期末考试是&quot;史上最恶劣的难度&quot; 之后，最后才确认明俊发来的三四个信息。</p><p class="story-paragraph dialogue">-今天不是说坐船了吗？这时间应该已经下船了吧？</p><p class="story-paragraph dialogue">-没晕船吗？肚子还好吗？</p><p class="story-paragraph dialogue">-对了，我现在工作都忙完了。</p><p class="story-paragraph">工作都忙完了吗？那是什么意思。</p><p class="story-paragraph dialogue">-现在才中午而已，工作这么快就结束了？</p><p class="story-paragraph dialogue">-不是，是说我出差的事都结束了。</p><p class="story-paragraph">马上就来了回复，看样子是正看着手机。很自然地，和明俊进行了实时对话。</p><p class="story-paragraph dialogue">-现在在宿舍吗？可以打个电话吗？</p><p class="story-paragraph">连“嗯”都还没来得及回复，电话很快就打来了。</p><p class="story-paragraph dialogue">「...喂？」</p><p class="story-paragraph dialogue">「嗯，安全到达了吗？」</p><p class="story-paragraph dialogue">「嗯，刚吃完饭了」</p><p class="story-paragraph dialogue">「还没换机票吧？」</p><p class="story-paragraph dialogue">「嗯，还没...」</p><p class="story-paragraph">知珉对没准备好的提问，含糊地回答道。是啊，还没吧。明俊像是逼迫一样轻声问道。</p><p class="story-paragraph dialogue">「不是说会看看吗，没找？」</p><p class="story-paragraph dialogue">「…有看了，只是没有合适的票」</p><p class="story-paragraph">这当然是谎话。因为自己根本连找的想法都没有。知珉无缘无故摸起指甲，补充了各种理由。看到的票都莫名售空了。这么着急的情况下找，太贵了-</p><p class="story-paragraph dialogue">「是吗？难道是因为圣诞节吗？」</p><p class="story-paragraph dialogue">「嗯，很难找到合适的票」</p><p class="story-paragraph dialogue">「那个，我直接过去那里怎么样？」</p><p class="story-paragraph dialogue">「...嗯？」</p><p class="story-paragraph dialogue">「你不是说明天去冰岛吗？对吧？」</p><p class="story-paragraph dialogue">「等一下、哥哥要来冰岛吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「...跟我一起旅行吗？」</p><p class="story-paragraph dialogue">「当然了。怎么了，有什么问题吗？」</p><p class="story-paragraph">有什么问题，从头到尾都是问题。</p><p class="story-paragraph dialogue">「那住宿怎么办？」</p><p class="story-paragraph dialogue">「我们另外预约要住的地方吧。听起来，和你一起的后辈...找的酒店好像都不像什么好地方」</p><p class="story-paragraph dialogue">「不像好地方是什么意思？」</p><p class="story-paragraph dialogue">「不是嘛，还去了几个人一起住的旅馆，也经常长途跋涉。昨天去坐船，也一直联系不上」</p><p class="story-paragraph dialogue">「船已经搭完了。反正去冰岛的话，住宿的地点就不会再移动了」</p><p class="story-paragraph dialogue">「你不觉得不舒服吗？」</p><p class="story-paragraph dialogue">「完全不会好吗？今天酒店也很不错啊」</p><p class="story-paragraph">虽然是没有电梯、费尽力气才爬到了的5楼。忍受这种琐碎的不便，与三人一起旅行这种可怕的事情相比，根本不算什么。只有那个是绝对，绝对不行。</p><p class="story-paragraph dialogue">「真是的，刚刚才问过但没听到回答，你在船上没什么事吧？」</p><p class="story-paragraph dialogue">「嗯。吃的也好，天气也好，风景也很漂亮」</p><p class="story-paragraph">还有，昨晚是迄今为止度过最热的夜晚。</p><p class="story-paragraph">知珉想起昨晚旼炡从上方俯视自己，慵懒的视线，连忙低下头。好像有谁在看着似的，慌忙地举起手捂住了脖子。上面红肿的痕迹清晰，看来还需要很长时间才能恢复到原来的肤色。</p><p class="story-paragraph">总之，知珉重新回到冰岛的事。明俊开始擅自谈论起旅行计画，好像是从很早之前就想好了。想着干脆预定个好的酒店，舒舒服服待着怎么样。按照日程安排，你还是会在那里待上一周，是吧？</p><p class="story-paragraph">勉强解完酒的胃好像快翻过去了。知珉想象了一下，如果自己对旼炡说这种荒唐的事情是什么情况。旼炡啊，从明天开始我的男朋友要来了，现在开始我们三个人要和睦相处。让我对金旼炡说这种话？是开玩笑吧？</p><p class="story-paragraph dialogue">「等一下，那我的后辈怎么办？哥哥突然同行的话...」</p><p class="story-paragraph dialogue">「我们两个住在一起，吃饭、白天旅行的时候再三个人一起就行了。这样不就没大问题了吗？如果那位朋友觉得跟我一起不舒服，也可以干脆分开来」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「她本来就想一个人去旅行的吧？」</p><p class="story-paragraph dialogue">「即使这样，和我一起旅行应该已经习惯了很多事情。如果突然一个人的话，也会觉得无聊」</p><p class="story-paragraph dialogue">「也说不定啊，先问问那个朋友吧」</p><p class="story-paragraph dialogue">「但是为什么...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「为什么突然想到要来这里？」</p><p class="story-paragraph">明俊要来冰岛的想法让人感到不安。难道是因为单纯地联系不上？是不是在怀疑呢？但是紧接着明俊的回答并没有消除知珉的不安。我喜欢冰岛很久了，不是说想去那度蜜月吗。一直听你提起，我也觉得趁这个时候去比较好。而且正好提前一周结束出差...</p><p class="story-paragraph dialogue">「…事情很快就结束，太好了」</p><p class="story-paragraph dialogue">「冰岛没有车要出门肯定很困难。那位朋友没有驾照吧？」</p><p class="story-paragraph dialogue">「好像会坐公车...」</p><p class="story-paragraph dialogue">「坐公车不是很不方便嘛，和没有车去济州岛一样。我来租车，出门不怕危险，应该也更方便」</p><p class="story-paragraph dialogue">「我知道，计划都很好。都很好但...」</p><p class="story-paragraph dialogue">「都很好怎么了。有什么问题吗？」</p><p class="story-paragraph dialogue">「她和哥哥是初次见面，当然会不方便吧？为什么没考虑这些，突然就强行决定呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「说实话有点...不对、是非常惊慌」</p><p class="story-paragraph">实在忍不住，嗓门稍稍提高了些。知珉环顾了下四周，再次降低音量。虽然淋浴器的声音停了，所幸旼炡好像还在浴室。</p><p class="story-paragraph dialogue">「为什么生气？」</p><p class="story-paragraph dialogue">「不是生气。如果让你觉得是那样的话，对不起」</p><p class="story-paragraph">我只是提议，如果让你别去冰岛来伦敦，好像也很可惜，所以才这样说。然后一直让你一个人待着也很抱歉。明俊的声音过于平静。但那反而让知珉感到不安和神经质。</p><p class="story-paragraph dialogue">「但是，当初我们两人已经约定一起旅行，如果男朋友突然来的话...」</p><p class="story-paragraph dialogue">「我过去是那么为难的事吗？」</p><p class="story-paragraph dialogue">「不是，虽然不是那样...」</p><p class="story-paragraph dialogue">「那为什么？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「知珉抱歉，我得出去一下，待会儿再打电话」</p><p class="story-paragraph">讽刺的是，听到要挂断这句话后，知珉松了一口气。这么高兴是对的吗？知珉冷笑，努力镇定地回答。那就之后再说吧，反正也没办法长话短说。但是明俊一下子打断了那句话。不，现在就决定吧。</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「所以你打算怎么办？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「是你来伦敦，还是你、后辈和我三个人一起去冰岛旅行？」</p><p class="story-paragraph">为什么、为什么大家总是催促我做选择呢？</p><p class="story-paragraph">知珉怎么也无法理解明俊为何那么着急。当初离开韩国去伦敦的，明明是他本人。这一年，已经习惯待在彼此无法触及的地方。为了见你坐上飞机，结果也是因为你出差而推迟一个月，一切才变得错综复杂起来。为什么明明只剩一周的时间要这样催促，好像见不到对方活不下去一样？</p><p class="story-paragraph">自己与旼炡一起旅行的时候，整整一两天忘了与明俊联系。在斯德哥尔摩度过两人的亲密时光后，又不断和他进行各种辩解和撒谎。现在，又对一些无关紧要的对话提高嗓门、争吵，彼此进行着只会互相消磨的心理战，这真可笑。</p><p class="story-paragraph dialogue">「不用浪费钱了。旅行结束之后再去伦敦不是最直接的吗」</p><p class="story-paragraph dialogue">「是不让我去冰岛吗？」</p><p class="story-paragraph dialogue">「…反正我们马上就能见面了」</p><p class="story-paragraph">哥哥、现在就剩1周了，再等一会吧 再一会。谁知道最讨厌听到的话，现在自己竟然笑着说出口。知珉连自己已经在手掌上留下深深的指甲印都不知道，就等着明俊下一句话。在沉寂了好一阵子之后他才开口。</p><p class="story-paragraph dialogue">「知珉啊，我实话实说吧」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「其实我一直想定下日期」</p><p class="story-paragraph dialogue">「...日子？」</p><p class="story-paragraph dialogue">「嗯，下周嘛。」</p><p class="story-paragraph dialogue">「下周...圣诞节前？有什么吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">你在开玩笑吧？轻笑声伴随着明俊的话。</p><p class="story-paragraph">是在说我们2周年啊。</p><p class="story-paragraph">顿时一阵发热，感到尴尬。感觉头脑被狠狠地敲了一下。和明俊的2周年纪念日，就是为了这个，几个月前为了去伦敦，买了机票，闹得沸沸扬扬，结果不到一个月，刘知珉不但忘却了自己犯下的罪行，心里只想挂电话，真是令人难以置信。</p><p class="story-paragraph">怎么会变成这样呢？</p><p class="story-paragraph">旧公寓不再是两人在哥本哈根留下回忆的秘密基地，而是知珉面对现实的空间，周围好像全都暗了下来。美术馆内黑漆漆的走廊，再次回到自己眼前。几天前，身穿校服的旼炡眼睛泛红，在教室里哭泣的噩梦，也清晰地浮现在脑海。</p><p class="story-paragraph">还是干脆像梦境的结局一样，沉入海底吧。今天我面对的现实，显然比那更糟糕。原本想推迟决定就结束的这个话题、没想到自己把2周年纪念日忘得一干二净、以及没有责怪自己的明俊等等事情。不知何时受了伤，伤口直到现在才疼了起来。</p><p class="story-paragraph">糟糕透了。</p><p class="story-paragraph">我不想再这样了。</p><p class="story-paragraph dialogue">「对不起」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「对不起...」</p><p class="story-paragraph dialogue">「知珉，你在哭吗？」</p><p class="story-paragraph dialogue">「不…没哭」</p><p class="story-paragraph dialogue">「别哭，干嘛哭啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我们在冰岛过纪念日吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那样的话，一定可以留下难忘的回忆」</p><p class="story-paragraph">因为想和旼炡多呆一会儿，所以几次把时间倒转回去。但是，现在连一点借口都没有了。在无止尽的快乐和甜蜜之后，沉重的罪恶感似乎在正等待着，直接掐住自己脖子。眼前空荡荡的黑暗走廊，现在，旼炡站在了尽头。那模样比明俊的声音还生动。不知是梦境还是现实，旼炡慢慢走进。令人非常害怕，也很混乱。</p><p class="story-paragraph">姐姐，说不要。</p><p class="story-paragraph">其实你想跟我在一起不是吗。</p><p class="story-paragraph">为什么每当我处在选择的十字路口，你就会出现，扰乱我的心呢？</p><p class="story-paragraph dialogue">「不了，哥哥」</p><p class="story-paragraph">说吧。</p><p class="story-paragraph">为什么犹豫？</p><p class="story-paragraph dialogue">「我...」</p><p class="story-paragraph">和我在一起。</p><p class="story-paragraph">再多跟我在一起一会儿吧。</p><p class="story-paragraph dialogue">「我去吧，去伦敦...」</p><p class="story-paragraph">姐姐，不要扔下我。</p><p class="story-paragraph">不要丢下我走。</p><p class="story-paragraph">那就那样吧？随着明俊轻快的嗓音，知珉艰难地睁开了眼睛。刚刚悲伤地哭泣的女孩不再，现在站在眼前的旼炡冷笑着，似乎在嘲笑自己迟来的痛苦。</p><p class="story-paragraph">我之前就说过。</p><p class="story-paragraph">姐姐以不想伤害别人为借口。</p><p class="story-paragraph">对任何一方都不会先做选择。</p><p class="story-paragraph">比起今天早上，知珉现在更是无力地瘫坐在沙发上。听到浴室门打开的声音，赶紧擦了擦红肿的眼角，平复呼吸。旼炡很快披着毛巾，一边说着冷一边走向客厅。</p><p class="story-paragraph dialogue">「对不起，我浴室用太久了」</p><p class="story-paragraph dialogue">「...不会的」</p><p class="story-paragraph">旼炡正在擦干头发上的水气，浑身发冷颤抖不已。可能是因为房子年代久远吧，水温不冷不热的，水压好像也不太够，我洗澡的时候都急死了。</p><p class="story-paragraph">知珉看了一眼她开朗的表情，接着别开视线。面对这种情况，已经没有任何自信去演戏。但是，旼炡还没吹头发，就对自己问了各种问题，也因此进行了简短的对话。眼睛很疼吗？一直在眨眼睛呢。不疼。如果需要人工泪液我给你一个吧？不、不用了。</p><p class="story-paragraph">从嘴里说出的话，自己听也觉得十分生硬。还以为会听到她询问自己脸上严肃的表情、或者直接又毫无诚意的回答。但是旼炡只是静静地注视着，接着用双手轻轻地将自己的嘴角向上提，开玩笑地说。smile, smile。</p><p class="story-paragraph dialogue">「...你在干嘛？」</p><p class="story-paragraph dialogue">「不是和你对我做的一样嘛。因为姐姐做了什么我都跟着模彷」</p><p class="story-paragraph dialogue">「不要模彷这些」</p><p class="story-paragraph dialogue">「为什么？昨天看着我让我这么笑…」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在是在报仇吗？」</p><p class="story-paragraph">嘴角上那温暖的手，划破了现实和想象的界限。可怜地流着眼泪的旼炡，是受到罪恶感折磨的刘知珉创造出来的。在我面前不仅没有生气，反而面带亲切微笑的旼炡，才是现实。</p><p class="story-paragraph dialogue">「姐姐，我洗澡的时候发生了什么事吗？」</p><p class="story-paragraph dialogue">「什么事都没发生」</p><p class="story-paragraph dialogue">「那为什么表情那么僵硬呢？明明直到刚才还一直拿我开玩笑的人」</p><p class="story-paragraph">眼睛怎么又这么红，有人吃完拉面眼睛肿得这么厉害的吗？知珉对旼炡玩笑般的口吻也没有反应，只是静静地僵在原地。旼炡没有等待自己回答，而是直接坐上膝盖。现在然仍不习惯高处俯视自己的视线。</p><p class="story-paragraph dialogue">「...是不是胃不舒服？积食了吗？」</p><p class="story-paragraph dialogue">「没有」</p><p class="story-paragraph dialogue">「那是因为饭后想睡了吗？」</p><p class="story-paragraph dialogue">「不是那样的」</p><p class="story-paragraph dialogue">「如果这也不是那个的话...是什么呀？好难哦」</p><p class="story-paragraph">知珉姐姐为什么心情不好呢，在转眼之间。抚摸着头发她温柔的手，强忍着的泪水好像快要溃堤。虽然金黄色的头发上掉下了几滴水珠，沾湿了腹部，但因为脸上的热气，丝毫不觉得冷。现在照照镜子的话，一定自己都看不下去吧，双眼和鼻尖都红透了，表情一定像失魂落魄的人。难道是因为我弄坏行李箱还在生气吗。面对接连不断的提问，知珉轻轻摇了摇头。</p><p class="story-paragraph dialogue">「那也不对的话，其实只是因为太累了，不想出去吗？」</p><p class="story-paragraph dialogue">「都说了不是」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你打算什么时候出去？再这样拖下去，今天哪儿都去不了」</p><p class="story-paragraph dialogue">「我会等到姐姐说要出去的时候」</p><p class="story-paragraph dialogue">「如果我不去的话？」</p><p class="story-paragraph dialogue">「那就这样坐在沙发上一整天也好」</p><p class="story-paragraph dialogue">「…那是什么话？傻瓜啊」</p><p class="story-paragraph dialogue">「是真的，别再想一个人待在家了」</p><p class="story-paragraph">旼炡低下身体张开双臂，适当的重量感袭来。知珉背靠在沙发上，不经意间将旼炡拥入怀中。刚洗完头发的香气扑鼻而来，心都化了，终于还是拍了拍她抱上来的消瘦后背。</p><p class="story-paragraph dialogue">「希望你能像刚才那样逗我就好了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在的表情像是要哭了一样，所以很在意...」</p><p class="story-paragraph">这种时候，金旼炡为什么不说一句令人讨厌的话呢？为什么只挑温柔的话讲，让自己心里更煎熬呢？能不能不要那么乖巧地撒着娇，你都不知道我刚才想了什么。</p><p class="story-paragraph dialogue">「对不起，我身体不舒服，让你也担心了」</p><p class="story-paragraph dialogue">「我不会硬是让你微笑的...但至少不要做出那种表情」</p><p class="story-paragraph">也许是安慰的话不够用，旼炡慢慢抚上自己脸颊，噘起嘴唇。每当湿答答的头发碰到发烫的脖子周围，就感到一阵头晕目眩。轻轻的接吻结束，旼炡依然像只小狗一样，把鼻子贴近自己的脸上撒娇。再次对视，她的目光似乎在向自己询问，有没有好点了？</p><p class="story-paragraph dialogue">「...你这样又想得感冒了吗？」</p><p class="story-paragraph dialogue">「那姐姐帮我吹头发不就行了嘛」</p><p class="story-paragraph dialogue">「放着吹风机干什么呢？」</p><p class="story-paragraph dialogue">「快点」</p><p class="story-paragraph">知珉拿起挂在纤细脖子上的毛巾，擦了擦头发上剩余的水份。爱撒娇的小狗在吹头发的时候，一动不动地坐在自己膝盖上。如果自己不动的话，看她的气势，好像是要几个小时都黏在一起。</p><p class="story-paragraph dialogue">「旼炡啊，你要一直坐在我的膝盖上吗？你得先起来我才能起来啊」</p><p class="story-paragraph dialogue">「要出去吗？」</p><p class="story-paragraph dialogue">「只有今天一天，可惜了。我们去外面散步吧」</p><p class="story-paragraph dialogue">「现在？」</p><p class="story-paragraph dialogue">「...不是，再这样待一会儿再去」</p><p class="story-paragraph dialogue">「嗯...」</p><p class="story-paragraph">衬衫虽然湿漉漉的，但没有冰冷的感觉。知珉抚摸着还带有水气的头发，慢慢地闭上了眼睛。</p><p class="story-paragraph">稍微再、稍微再多一点。</p><p class="story-paragraph">稍微再和你多待在一起...</p><p class="story-paragraph">两人沿着港口旁的街道慢慢散步。只走了一会儿，夜晚正在大步靠近。随着时间的推移，太阳每天都比前一天更早落下，知珉不禁埋怨。因为这是个无可辩驳的证据，时间就是快得无法控制。</p><p class="story-paragraph">两人没有目的地，不知不觉间到了繁杂的中央车站附近。忙碌的观光客和排着长长队伍的黄色计程车，与悠闲散步的两人格格不入。会不会走得太远了？应该重新回头了吧。一边想一边走路，知珉没注意到脚下有个突起，一脚踩空，幸亏没有摔倒。</p><p class="story-paragraph dialogue">「从刚才开始真的...」</p><p class="story-paragraph dialogue">「...你看到了吗？」</p><p class="story-paragraph dialogue">「是纸娃娃吗？要是这样的话，还是牵着手走吧」</p><p class="story-paragraph">纤细的手一把抓住自己的胳膊。圆圆的脸不停唠叨着。酒都醒了，怎么姐姐好像比昨天更醉了呢？所以说在宿舍休息吧，还一直不听话。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「记得从斯德哥尔摩散步到凌晨回来的那天吗？」</p><p class="story-paragraph dialogue">「当然记得了。和某人不同，我可没喝醉」</p><p class="story-paragraph">知珉听到这话后微微一笑，停下脚步，慢慢地前后摆动紧握的双手。睡前你不是说，那天发生的所有事情都像梦一样吗。</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「我从昨天到现在都是这样」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「好像一直在做梦」</p><p class="story-paragraph dialogue">「这不是梦，打起精神来。如果姐姐倒下，我就要背着你走了」</p><p class="story-paragraph dialogue">「对了，你还到我梦里来哭过呢？」</p><p class="story-paragraph dialogue">「我...？我在姐姐的梦里？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「我为什么哭了？」</p><p class="story-paragraph dialogue">「这个不能说」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「总之，哭着说了些过分的话。对我来说」</p><p class="story-paragraph dialogue">「什么啊，那你为什么要告诉我？」</p><p class="story-paragraph dialogue">「因为那时候是第一次见你哭得那么伤心」</p><p class="story-paragraph dialogue">「我有什么事能哭得那么伤心啊？」</p><p class="story-paragraph dialogue">「...就是说啊」</p><p class="story-paragraph">偶尔真不知道姐姐在想什么，到底为什么做那种梦啊。知珉面对接连不断的牢骚，把很多话都埋在心中，用玩笑般的口吻进行了回应。</p><p class="story-paragraph dialogue">「看来我睡觉的时候还一直想着你」</p><p class="story-paragraph dialogue">「...真会说话啊」</p><p class="story-paragraph dialogue">「你没做过关于我的梦吗？」</p><p class="story-paragraph dialogue">「...关于姐姐的梦？」</p><p class="story-paragraph dialogue">「看你这么墨迹，好像没有啊」</p><p class="story-paragraph dialogue">「不，确实是有」</p><p class="story-paragraph dialogue">「是悲伤的梦吗？」</p><p class="story-paragraph dialogue">「...不是」</p><p class="story-paragraph dialogue">「那是个愉快的梦吗？」</p><p class="story-paragraph dialogue">「是不想醒来的梦」</p><p class="story-paragraph">然而一句并不轻松的话，让知珉哑口无言。梦中的旼炡和自己是什么样子呢？对于旼炡来说，幸福到不想醒来的梦，究竟是什么样的呢？</p><p class="story-paragraph">突然觉得有点过分。</p><p class="story-paragraph">我梦中的你明明是那样悲伤的脸。</p><p class="story-paragraph dialogue">「...现在散步完了，我们回去吧」</p><p class="story-paragraph dialogue">「再走一会儿再回去吧。等太阳完全下山」</p><p class="story-paragraph dialogue">「今天怎么格外爱耍赖呢？反正也没其他地方去了」</p><p class="story-paragraph dialogue">「散步本来就是这样的，随心所欲-」</p><p class="story-paragraph">这时，突然听见只有在棒球场才会出现的“哇啊”的惊呼。接着看到在马路对面、哐当哐当，一列火车在空中穿行驶过。两人一同把目光投向那里。</p><p class="story-paragraph dialogue">「刚才那是什么？」</p><p class="story-paragraph dialogue">「是游乐设施吗？」</p><p class="story-paragraph">只见一个摩天轮高高耸立在远处。再近一点，就能看到和宿舍墙上挂着的素描一模一样的游乐园入口。圆形拱门建筑入口的招牌上，用英文写着趣伏里(Tivoli)。</p><p class="story-paragraph">列车再次穿过天空，旼炡的眼睛跟着绚烂的游乐设施移动。抬起头来寻找已经消失的过山车，就是旼炡会做的事，那可爱的样子让人忍俊不禁。原来这里有游乐场啊，她喃喃自语的语气里，充满了可惜。</p><p class="story-paragraph dialogue">「要去那边看看吗？」</p><p class="story-paragraph dialogue">「...不用」</p><p class="story-paragraph dialogue">「你现在不是特别想去那里吗？」</p><p class="story-paragraph dialogue">「不用了，姐姐很累啊」</p><p class="story-paragraph dialogue">「不要再拿我当借口了，我不累」</p><p class="story-paragraph dialogue">「而且，姐姐也不坐游乐设施」</p><p class="story-paragraph dialogue">「那又怎么样，你坐就行了啊」</p><p class="story-paragraph dialogue">「那你一个人干什么呢？」</p><p class="story-paragraph dialogue">「就在下面等你」</p><p class="story-paragraph dialogue">「…什么啊？那样不是很有负担吗？」</p><p class="story-paragraph">里面除了娱乐设施还有很多东西吧，就随便一个人逛逛嘛。知珉不顾旼炡一脸严肃，迳自一步步走向游乐园入口。</p><p class="story-paragraph dialogue">「姐姐，不要自己随便走。等一下」</p><p class="story-paragraph dialogue">「...怎么了？」</p><p class="story-paragraph dialogue">「真的要去吗？真的还好吗？」</p><p class="story-paragraph">瞬间感觉到了即视感。初次见到旼炡的那天，突然想起了是那一句话，让自己下定决心去长途旅行。</p><p class="story-paragraph">还好吗？</p><p class="story-paragraph">对你来说毫无意义的话，怎么总给我安慰呢？</p><p class="story-paragraph">知珉拉住了旼炡犹豫不决的手。这时连接到游乐园内一长排的照明灯一同亮了起来。进出入口的人流和游乐设施的灯光都变成慢动作，就像戏剧中的场景一样。知珉着了迷似的盯着游乐园的灯火。当然，灯光也同样吸引旼炡的视线。虽算不上华丽，但整齐一致的白色装饰在圣诞树上，闪耀着光芒，有如无数星光下的盛宴。</p><p class="story-paragraph dialogue">「…开了灯好漂亮啊」</p><p class="story-paragraph dialogue">「到晚上就像童话一样」</p><p class="story-paragraph">两人呆呆地望着灯光，静静地将视线固定在彼此身上。奇怪的是，在这条路上的灯火亮起的瞬间，脑海中的担忧好像消失在远处。一直努力装作没事，像傻瓜一样演戏，已经够了吧？</p><p class="story-paragraph">现在最想看到的是你的笑脸。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「不和我去游乐园约会吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…回答我一下吧」</p><p class="story-paragraph dialogue">「是真心的吗？明明你只能一直在下面等我」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「如果我不去的话呢」</p><p class="story-paragraph dialogue">「第二次约会的邀约，你还要放我鸽子吗？」</p><p class="story-paragraph dialogue">「这和在船上看日出不一样。姐姐和我没有可以一起做的事情嘛」</p><p class="story-paragraph dialogue">「就算是这样」</p><p class="story-paragraph dialogue">「怎么了呢？还不如回家一起看电影呢…」</p><p class="story-paragraph dialogue">「旼炡啊，拜托了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「今天不是最后一晚嘛」</p><p class="story-paragraph">在几乎是恳求的拜托下，旼炡面有难色地摘下戴得好好的帽子，用手梳开被压扁的刘海。她紧皱眉头，似乎十分为难。</p><p class="story-paragraph dialogue">「为什么脱掉帽子？很郁闷吗？」</p><p class="story-paragraph dialogue">「当然郁闷了，我看起来像不闷吗？从刚才开始就不听别人的话，一直随心所欲」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「姐姐真的...太狡猾了」</p><p class="story-paragraph dialogue">「我怎么了？」</p><p class="story-paragraph dialogue">「明明知道我反正都会跟着你走」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还明知故问，干嘛非要问？」</p><p class="story-paragraph dialogue">「因为我想听你亲口说」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「所以，到底是要跟我约会、还是不要...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你还是不告诉我吗？」</p><p class="story-paragraph dialogue">「...我想要」</p><p class="story-paragraph">我也想去游乐园约会，和姐姐。旼炡像挤牙膏一样，硬是挤出一句话，重新把帽子戴回通红的脸颊上。知珉这才满意地笑着，向旼炡伸出手。</p><p class="story-paragraph dialogue">「那我们走吧？」</p><p class="story-paragraph dialogue">「...嗯，走吧」</p><p class="story-paragraph">两人手拉着手，在闪烁的金黄色路灯之间慢慢走着。这一瞬间，开启了唯一一天的哥本哈根之夜。</p><p class="story-paragraph">这次旅行的每个瞬间，</p><p class="story-paragraph">就像是一本编好的童话。</p><p class="story-paragraph">常常无可比拟，</p><p class="story-paragraph">像是不切实际的梦。</p><p class="story-paragraph">在深不见底的一天尽头，</p><p class="story-paragraph">如果恰好被邀请到童话世界，</p><p class="story-paragraph">没有理由不去啊。</p><p class="story-paragraph">何况是和你一起的话，</p><p class="story-paragraph">一定会成为完美的夜晚。</p><p class="story-paragraph">旼炡啊，</p><p class="story-paragraph">对我来说这场旅行，</p><p class="story-paragraph">是绝对不想醒来的梦。</p></div>
      </section></template>

          <h3>반짝이던 안녕</h3>
          <div class="lyric-lines"><p class="lyric-line stanza-break">내일 그대와 눈부시게 투명한 낮을 걷고 싶어</p>

        </aside>
        <div class="chapter-copy"><p class="story-paragraph">两人刚踏进哥本哈根市中心的游乐园——趣伏里公园，这是世界上历史最悠久的游乐园之一，虽然规模较小，但能作为迪士尼乐园的前身，展示古典的风貌。每棵树上挂着淡淡的橙色装饰灯，尖尖的圣诞树上散发的灯光营造出冬天的氛围。看着各色木制游乐设施，甚至产生了彷彿置身电影摄影棚的错觉。就在这时，高耸的钟楼为了分别黄昏时刻，亮起夜间照明。激动的心情使两人渐渐加快脚步。</p><p class="story-paragraph">在入口处，能看见绿色邮筒模样的售票机，像是在迎接初来乍到的客人。旼炡和知珉各要了一张游乐设施自由使用券，和一张入场券。直到手腕处戴上写着Tivoli字样的红绳、两人合影留念，才有了置身游乐园的实感。</p><p class="story-paragraph dialogue">「我可以坐过山车吗？」</p><p class="story-paragraph dialogue">「为什么要得到我的允许？你想坐什么就坐什么」</p><p class="story-paragraph">那先去那边吧。高兴的旼炡拖着知珉的手腕，直奔游乐设施。刚才还闹着脾气不走，结果一转身就只见她兴奋的背影，不禁露出微笑。很能理解久违地出来散步的小狗，被牵着跑来跑去的情景。早知道她这么高兴，早点来这里就好了。</p><p class="story-paragraph dialogue">「开心吗？这里真的来对了吧？」</p><p class="story-paragraph dialogue">「姐姐既然来了就挑战一下吧」</p><p class="story-paragraph dialogue">「...你看过我在飞机上冒冷汗的样子，还想说那句话吗？」</p><p class="story-paragraph dialogue">「这个比较不可怕。就是按照规定的路线上去，再下来而已」</p><p class="story-paragraph dialogue">「我真的坐不了那种器材，我pass」</p><p class="story-paragraph">是不是太没有挑战精神了？接连遭到顽强拒绝的旼炡终于开口。结果，知珉拍拍碎念的旼炡的屁股哄她。我会一直跟你等到排上为止，所以别生气了。</p><p class="story-paragraph">不知道是不是大家去吃晚饭了，等待的队伍比较冷清。现在旼炡要搭乘的绿色过山车相当老旧，甚至有安全人员亲自上车驾驶，完全以被动方式运作。这座游乐园建成大概有二百多年了，一想到来到几乎是两个世纪前建成的游乐园，心里说不出的奇妙。随着排队人潮往前，终于轮到旼炡，知珉轻轻的走出队伍，向她打招呼。旼炡啊，姐姐在下面，你好好玩完再下来。</p><p class="story-paragraph dialogue">「你打算做什么？」</p><p class="story-paragraph dialogue">「我在这附近逛逛」</p><p class="story-paragraph dialogue">「马上就下来了，等我一会儿」</p><p class="story-paragraph dialogue">「...已经让前面的人入场了，快去吧」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">说完再见挥了挥手，旼炡似乎有些遗憾地也挥动了手。安全人员在转动把手的同时，器材发出轰鸣声，并缓慢地向上爬动。知珉往后退了几步，替乘坐在车上的旼炡拍了张照片。不知不觉中，到达顶端的列车顺着光滑的曲线快速下降。快乐的呐喊声如同渐变效果一样放大。金旼炡现在会在那里兴奋地尖叫吗？</p><p class="story-paragraph">知珉呆呆地看着列车上下乱窜，接着把目光转向了附近的摊位。在一长列咖啡馆中有一家小糖果店，像哈利波特和迪士尼童话中的商店一样，精心设计的外观令人着迷。</p><p class="story-paragraph">一推开门，空气中甜甜的糖果味立刻扑鼻而来。店内从照明到小装饰都是细緻的糖果形状。透过巨大的玻璃墙，还能看到师傅亲自制作糖果的模样。巨大的糖果圣诞树、普通的三色条纹糖果，不愧是北欧、还有画着姆明的糖果。这里甚至可以试吃味道，知珉一边挑选、一边把喜欢的东西放进篮子。哈密瓜口味如何呢？还是更喜欢草莓味呢？杏仁虽然好吃，但是加在一起的巧克力会不会太小孩子口味了？当然，只要是甜甜的零食，给金旼炡什么她就吃什么。</p><p class="story-paragraph">看见旁边的孩子拼命地垫着脚想拿糖果，知珉替孩子拿了之后，孩子的父母轻声道谢。拿着装满糖果的玻璃瓶从店里出来后，就看见一只开心的小狗站在面前。</p><p class="story-paragraph dialogue">「等了很久吧？」</p><p class="story-paragraph dialogue">「没有，好玩吗？」</p><p class="story-paragraph dialogue">「好玩，很有意思」</p><p class="story-paragraph dialogue">「...还真开心啊？」</p><p class="story-paragraph dialogue">「你知道吗？我刚才坐的那座游乐设施竟然超过100年了」</p><p class="story-paragraph dialogue">「噪音超级大，不害怕吗？」</p><p class="story-paragraph dialogue">「但毕竟是以前的游乐器材，所以高度也比较低」</p><p class="story-paragraph">那种程度连害怕都提不上。旼炡开始自豪地称自己是&quot;涉猎了全世界游乐设施的超高手&quot;。虽然不玩游乐设施的人完全不知道她在说什么。知珉还是点了点头，轻轻地打开刚买的装有糖果的玻璃瓶。</p><p class="story-paragraph dialogue">「什么啊，那个？」</p><p class="story-paragraph dialogue">「我家小狗的零食罐」</p><p class="story-paragraph dialogue">「...零食罐？」</p><p class="story-paragraph dialogue">「来，啊，你吃吃看」</p><p class="story-paragraph">手中的一块条纹糖果被旼炡吃进嘴里。在嘴里品尝了一会，似乎很合旼炡口味，点了点头。她的眼睛炯炯有神，好像补充了活力。</p><p class="story-paragraph dialogue">「好甜，真好吃啊。这是从哪里来的？」</p><p class="story-paragraph dialogue">「那前面有间糖果店，所以就买了几个。由我拿着，等你搭了什么回来，再一个一个拿出来喂你」</p><p class="story-paragraph dialogue">「什么啊，不要说的像喂食一样」</p><p class="story-paragraph dialogue">「都要吃掉哦，这是按照你的口味选的」</p><p class="story-paragraph dialogue">「不要只给我吃，姐姐也吃点吧」</p><p class="story-paragraph">我刚才一个个全试吃过了，所以没关系。虽然自己这么说，但旼炡还是从瓶子里拿出一个同样的条纹糖果，放进自己嘴里。虽然是同样的味道，但感觉比在店里尝到的甜多了。嘴里含着糖果，在轻轻跺着脚的脚踝下，看见她白色的匡威。刚才为了玩游乐设施跑得那么开心，结果左边的鞋带松开了。真是的，邋里邋遢。</p><p class="story-paragraph dialogue">「你站着别动」</p><p class="story-paragraph">知珉原地蹲下，重新系上了匡威的鞋带。右侧打的结也非常粗糙，实在不太满意，所以干脆解开后重新绑了个漂亮的蝴蝶结。知珉啪啪地拍着手站起来，只见旼炡瞪大了眼睛，露出惊慌的表情。为什么要蹲在地上给我系呢？明明我重新系上就可以了。</p><p class="story-paragraph">因为你总是随随便便乱捆，才会都松开了。反正现在都弄好了。</p><p class="story-paragraph dialogue">「...谢谢」</p><p class="story-paragraph dialogue">「话说回来，接下来要坐什么？决定好了吗？」</p><p class="story-paragraph dialogue">「嗯，我想坐黄金塔」</p><p class="story-paragraph dialogue">「黄金塔？」</p><p class="story-paragraph dialogue">「能看到那边高高的吗？是像自由落体的东西」</p><p class="story-paragraph">旼炡手指向的是高高耸立的铁塔。看外观应该能达到63大厦的高度吧，还是再小一点吗？不管多高，对知珉来说都是具威胁性的高度。</p><p class="story-paragraph dialogue">「看起来超级可怕」</p><p class="story-paragraph dialogue">「就是往上爬，然后往下落。很快就结束了，一起坐吧」</p><p class="story-paragraph dialogue">「旼炡啊，我如果坐那个的话...上到最顶端可能会晕过去」</p><p class="story-paragraph dialogue">「...胆小鬼」</p><p class="story-paragraph dialogue">「我还是当胆小鬼吧」</p><p class="story-paragraph dialogue">「真的要以这种方式全部pass吗？」</p><p class="story-paragraph">快点走吧，在排队的队伍变长之前。这次也是推着她的肩膀，好不容易让哼哼唧唧的旼炡搭上后，才找到一个可以独自消磨时间的场所。不会离得太远，只在前面的湖边转一圈，就能配合上时间。</p><p class="story-paragraph">露天剧场正在演出哑剧，知珉看了一会儿不明所以的表演，又重新迈开脚步。恰好看到附近有个附有露台的酒吧，暂时将身体靠在看台角落。桌上的横幅写着作为圣诞节活动，免费提供一杯嘉士伯。</p><p class="story-paragraph">嘉士伯？应该是丹麦啤酒吧？但是，再想想也觉得疯了。昨天经历了那场混战，还能喝酒吗。然而，不顾身体状况不佳，知珉还是决心喝一杯免费啤酒，于是掏出了钱包。柜台前，一位戴着头巾的阿拉伯女性正在为顾客点餐。</p><p class="story-paragraph">随即，橘黄色的啤酒和炸得焦脆的薯条一起端上桌来。知珉就那样靠在吧台上，看着旼炡乘坐的自由落体，不，黄金塔从最顶端垂直下降。喝了一杯啤酒，自然而然回想起昨天。昨晚喝了威士忌，闹出的事端。</p><p class="story-paragraph">知珉不确定旼炡何时才会从梦中醒过来，就这么呆呆地躺着。只能在她耳边喊着旼炡，焦急地叫着名字，当自己暴躁时，会拍拍她的后脑勺，然后像洋娃娃一样用手臂紧紧地抱住她。但是，不管付出多少努力，旼炡仍像晕倒一样，纹丝不动。</p><p class="story-paragraph">不会就一个人呼呼大睡一整晚吧？</p><p class="story-paragraph">虽然因为太无语不禁失笑，但旼炡偏偏枕着自己胸口睡，所以也不能笑得太过。是谁说忍一时风平浪静，退一步海阔天空。知珉只好以来到寺院的心情，心里写了几次“忍”后，静静地自言自语起来。</p><p class="story-paragraph dialogue">「…金旼炡，你就算有十张嘴也无话可说」</p><p class="story-paragraph">知珉轻轻抚上紧紧依偎在自己胸前的后颈。看向窗外，夜海变得漆黑一片，完全无法推测时间。</p><p class="story-paragraph">如果继续下去呢？</p><p class="story-paragraph">如果没有睡着，接下来会怎么样呢？</p><p class="story-paragraph">你真的有拒绝的想法吗？</p><p class="story-paragraph">不，应该没有。当时并没有拒绝的想法。也许当天晚上，旼炡不管做什么自己都会接受。虽然反复说了几次让开、很疼、等拒绝的话，但事实上，那只是因为身体不断提高的热度，令自己也吓了一跳而已。想像旼炡在上面盯着自己发烫的脸。</p><p class="story-paragraph">可以做吗？</p><p class="story-paragraph">因为那简短的一句话，我又期待了什么？</p><p class="story-paragraph">算了，别再想了。知珉轻轻地皱着眉头，闭上了眼睛。把手上的啤酒用力地放在桌上，想让回忆到此为止。丹麦啤酒实在多余，本来期待喝杯酒能稍稍缓解一下焦虑，但昨天的记忆却变得格外清晰。</p><p class="story-paragraph">正要从座位起身。知珉姐姐、刚刚在哪里来着？从远处传来了寻找自己的声音。知珉朝远处那小小的金黄色人型挥了手。旼炡啊，这里。</p><p class="story-paragraph dialogue">「我在下面没看到，所以一直找」</p><p class="story-paragraph dialogue">「这么快就坐完了吗？」</p><p class="story-paragraph dialogue">「我不是说很快就会结束的嘛」</p><p class="story-paragraph dialogue">「有趣吗？」</p><p class="story-paragraph dialogue">「就普通吧，但是这是什么？是姐姐点的吗？」</p><p class="story-paragraph dialogue">「嗯，怎么了？」</p><p class="story-paragraph dialogue">「...真的腻了」</p><p class="story-paragraph">旼炡就像个老师目睹了学生做坏事，睁着眼睛盯着啤酒杯。接着开始唠叨起来。姐姐昨天喝了那么多现在还能喝下肚吗？让你来游乐园坐游乐设施不坐，看来你是想喝酒啊？</p><p class="story-paragraph dialogue">「只是点了一杯免费啤酒而已。说是这里的代表啤酒」</p><p class="story-paragraph dialogue">「为什么总是这样？喝不了酒会发疯吗？」</p><p class="story-paragraph dialogue">「度数很低的，这种程度不会有事。要喝一口看看吗？」</p><p class="story-paragraph">有点淡，不知道算好不好喝。知珉递上杯子说道，但可怜的是，北欧的看台对旼炡来说好像太高了，对面站着的旼炡无法轻易伸手，只能露出脸。怎么办，你完全变成坐在大人桌上的孩子了。出乎意料的可爱场景，让知珉放声大笑。</p><p class="story-paragraph dialogue">「不要笑...姐姐也是勉勉强强」</p><p class="story-paragraph dialogue">「这里的人个子高，可能是按照那个尺寸做的」</p><p class="story-paragraph dialogue">「无语，桌子怎么能摆得这么高？」</p><p class="story-paragraph">真好玩，一边戏弄慌张的旼炡，一边又喝了口啤酒。这时，旼炡脸上笑意全收，绷着脸说道。啤酒给我，别喝了。</p><p class="story-paragraph dialogue">「不要，既然是免费的我就要喝完」</p><p class="story-paragraph dialogue">「不是开玩笑的，不要再喝了。刘知珉」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「一定要这么生气才能听话吗？」</p><p class="story-paragraph dialogue">「旼炡啊，你知道这是你第二次随便叫我的名字吗？」</p><p class="story-paragraph dialogue">「不知道」</p><p class="story-paragraph dialogue">「而且上次也是我喝酒的时候，怎么了？」</p><p class="story-paragraph dialogue">「...怎么了？你是真的不知道才问的吗？」</p><p class="story-paragraph">我绝对忘不了那一天，姐姐说什么来着？坐在旁边的男人们约一起喝酒，然后就要跟着去了，还耍赖地说就要和陌生人一起在外面喝。正常来说听到这样的话，谁都会生气的不是吗？面对喋喋不休的旼炡，知珉只能用弱弱地回答。那只是说说而已，本来是想开个玩笑的...</p><p class="story-paragraph dialogue">「是为了捉弄我才这么说吗？伤害之后再一边捉弄，有意思吗？」</p><p class="story-paragraph dialogue">「不是那样的」</p><p class="story-paragraph dialogue">「今天明明不能一起坐游乐设施，又非得要来不可。一个人孤零零地坐在这，又咕咚咕咚地喝着酒，你觉得我做何感想？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「当然是很担心才会那样啊，明明知道自己身体状态不好」</p><p class="story-paragraph dialogue">「...对不起」</p><p class="story-paragraph">刚才开始眼睛就泛红还肿了，完全不知道发生了什么事，但我每次不安地提到时，你又在想别的事情。旼炡像爆发一样，难过地宣泄着一直以来忍受的痛苦，再等一下好像真的会哭。受到责怪的知珉，把旼炡紧紧拥入怀中说。旼炡啊，对不起，是我错了。</p><p class="story-paragraph dialogue">「姐姐...为什么在对自己不利的时候，要这样偷偷抱住我解决问题？」</p><p class="story-paragraph dialogue">「拥抱是最有效的方法，不是吗？」</p><p class="story-paragraph dialogue">「看来是没有用语言反驳的自信」</p><p class="story-paragraph dialogue">「不会反驳，因为你说的都是对的」</p><p class="story-paragraph dialogue">「真好笑，明明知道干嘛还这样？」</p><p class="story-paragraph dialogue">「不会再喝了，所以别再训我了」</p><p class="story-paragraph">在她小小的肩膀上，像往常一样压住下巴，追究的声音才渐渐停止。本想她会暂时乖乖地被抱着，但旼炡突然伸出手指，在面前晃来晃去。姐姐，这是几根手指头？</p><p class="story-paragraph dialogue">「你在干什么？」</p><p class="story-paragraph dialogue">「刘知珉饮酒衡量测试」</p><p class="story-paragraph">知珉眯着眼睛反问。饮酒测试？一定要做吗？旼炡厚着脸皮点了点头。在三秒内必须回答正确答案，如果有一个答不上来，就当是喝醉了，那么我会马上送你回家，知道了吧。</p><p class="story-paragraph dialogue">「太严格了，至少延长到五秒」</p><p class="story-paragraph dialogue">「没得讨价还价，那么从现在开始」</p><p class="story-paragraph dialogue">「从现在开始？」</p><p class="story-paragraph dialogue">「姐姐，前面有几根手指头？如果连视力测试都过不了，就难办了」</p><p class="story-paragraph dialogue">「不就三个嘛」</p><p class="story-paragraph dialogue">「我的名字和年龄、生日呢？」</p><p class="story-paragraph dialogue">「难度没有想象中那么难啊？就算喝醉了也答得出来」</p><p class="story-paragraph dialogue">「不要太自满。现在还剩2秒」</p><p class="story-paragraph dialogue">「金旼炡，20岁，生日是01年1月1日」</p><p class="story-paragraph dialogue">「没错」</p><p class="story-paragraph dialogue">「作为补充，我的行李箱密码也是0101」</p><p class="story-paragraph dialogue">「...我又没问这个问题。那么这里是哪里？」</p><p class="story-paragraph dialogue">「这里是哥本哈根，我们现在所在的地点是趣伏里公园」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「问题结束了吗？」</p><p class="story-paragraph dialogue">「还有呢等着吧。姐姐的故乡是哪里？」</p><p class="story-paragraph dialogue">「水原」</p><p class="story-paragraph dialogue">「长期记忆力好像也没有问题呢」</p><p class="story-paragraph dialogue">「...真是庆幸，是吧」</p><p class="story-paragraph dialogue">「最喜欢的颜色是？」</p><p class="story-paragraph dialogue">「蓝色」</p><p class="story-paragraph dialogue">「为什么都答得那么快呢？早知道把问题改得难一点了」</p><p class="story-paragraph">知珉又向旼炡重申了一次。旼炡啊，我真的没醉，问题全都回答得很好，就这样结束吧？但是，旼炡却固执地说，剩下最后一个了</p><p class="story-paragraph dialogue">「最后一个问题是什么？」</p><p class="story-paragraph dialogue">「...你的理想型是什么？」</p><p class="story-paragraph dialogue">「等一下，怎么是问你好奇的问题」</p><p class="story-paragraph dialogue">「这是监考官的想法。如果一个都回答不上来，你就要回家了」</p><p class="story-paragraph dialogue">「这个测试到底是谁出题的。太牵强了」</p><p class="story-paragraph dialogue">「别找借口了快一点。时间在流逝」</p><p class="story-paragraph dialogue">「知道了，首先...」</p><p class="story-paragraph">知珉认真动起脑子。理想型，虽然记不太清了，但中学时期确实有想象的理想型。是当时人气电视剧男主几人的合成体。但姑且不论外表，知珉喜欢诚实、且即使不去确认也能知道对方喜欢自己，总是温柔地、只注视着自己的人。</p><p class="story-paragraph dialogue">「无条件喜欢我的人。那是第一个条件」</p><p class="story-paragraph">听到这个，旼炡点了点头说道。喜欢姐姐的人，然后呢？</p><p class="story-paragraph dialogue">「是啊... 笑点合得来的？因为希望在一起的时候很有趣」</p><p class="story-paragraph dialogue">「还有吗？」</p><p class="story-paragraph dialogue">「结束了」</p><p class="story-paragraph dialogue">「什么呀，太简单了吧？以为会很挑剔，没想到也没什么」</p><p class="story-paragraph">理想型大概就是这样的吧，这到底是什么饮酒测试啊。本来想弹一下她的脑袋做结束的，但知珉改变了想法。突然增加了刚想到的理想型条件。</p><p class="story-paragraph dialogue">「还有一个」</p><p class="story-paragraph dialogue">「什么啊？」</p><p class="story-paragraph">我喜欢适合蓝色的人。知珉边说边抚摸着旼炡的淡蓝色毛帽。旼炡的耳朵稍稍有些泛红，然后上下点了点头表示同意。忐忑的表情非常有趣、也很可爱。难道是认为目前为止所讲的条件，都和本人相符吗？</p><p class="story-paragraph">旼炡啊、对不起，我最后再伤害你之后逗你玩一次。</p><p class="story-paragraph dialogue">「对了，我忘了最重要的，这是必备条件」</p><p class="story-paragraph dialogue">「什么呀？」</p><p class="story-paragraph dialogue">「可以在这个桌子上喝酒的个子，考虑到我的身高，应该超过185就够了」</p><p class="story-paragraph">旼炡仍然在无意识中点头表示同意，在听到最后一句话后才露出被骗了的表情。接着僵住动作嗖地转过身来，一个人嘀嘀咕咕。已经听够了，比姐姐的理想型身高差20公分的人，先去玩游乐设施了。我通过测试了吧？知珉大步跟旼炡身后，从背后抱上。弯着腰紧贴着她的身体，旼炡瞬间来气。</p><p class="story-paragraph dialogue">「太重了，放开吧。块头大也没什么用」</p><p class="story-paragraph dialogue">「不要，一起走嘛」</p><p class="story-paragraph dialogue">「连185左右都到不了的人，实在太伤心了没办法一起走」</p><p class="story-paragraph dialogue">「为什么，就算个子矮，用可爱来决胜负就行了啊」</p><p class="story-paragraph dialogue">「领域不是完全不一样吗？」</p><p class="story-paragraph dialogue">「明明某人曾经亲口说，知道自己很可爱的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">现在别跟我搭话了，我不要跟姐姐说话。不顾已经闹起别扭的旼炡，知珉顽强地继续说下去。旼炡啊，刚才那句话好像需要更正，你的身高到185...</p><p class="story-paragraph dialogue">「不止20公分，应该差距更大吧？」</p><p class="story-paragraph dialogue">「我正在长个子呢。补完刀了开心吗？」</p><p class="story-paragraph dialogue">「别再长高了。这个高度抱起来刚刚好」</p><p class="story-paragraph dialogue">「不要诅咒我，离远一点」</p><p class="story-paragraph">但是知珉下巴依然抵着她的肩膀，没有放过正在挣扎的旼炡。两人紧挨在一起，沿着湖边摇摇晃晃地走了一阵子。</p><p class="story-paragraph dialogue">「姐姐，我们一起搭一个吧」</p><p class="story-paragraph">不知道是不是因为从刚才开始都是一个人去玩，旼炡一直缠着自己一起坐游乐设施。但是两人能一起乘坐的设施几乎就只能是儿童等级。</p><p class="story-paragraph dialogue">「只要不升高就行了吧？那时候不是说可以坐旋转木马嘛」</p><p class="story-paragraph dialogue">「硬要吗？那对你来说一点意思都没有吧」</p><p class="story-paragraph dialogue">「没关系」</p><p class="story-paragraph">被旼炡拉着手到达的地方，是规模小巧的双层旋转木马。被黄色的照明包围，古典风格的木马闪闪发光。两个人夹在以家庭为单位的游客中间着排队。前后也都是以家庭为单位的人群。知珉上了2楼，坐在可以和旼炡并肩的椅子上。</p><p class="story-paragraph dialogue">「旼炡啊，这里...好像除了我们都是小孩子在坐」</p><p class="story-paragraph dialogue">「那有什么关系，反正我们是外国游客」</p><p class="story-paragraph dialogue">「不是，真的好像全都是孩子和妈妈。有点丢人...要不下去算了？」</p><p class="story-paragraph dialogue">「干嘛都搭上来了又要下去呢？反正已经上来了，和孩子们一起坐又怎么样」</p><p class="story-paragraph">被强行拉坐在位子上的知珉，为了不与前前后后坐着的孩子们对视，低下了头。随着歌声，旋转木马一圈、两圈开始旋转。旼炡好像要报仇似的，一个人笑着一边喃喃自语。这是我小学以后第一次坐旋转木马，都是因为某人不能坐过山车，我才能过了20岁再次搭上旋转木马。知珉从零食袋里掏出成堆的几块糖，放进那个可恶的嘴里。突然一把把糖果塞进嘴里，旼炡用眼神代替了话语，艰难地嘟囔着。</p><p class="story-paragraph dialogue">「所以缩和我一己搭斗好…」</p><p class="story-paragraph dialogue">「听不懂你在说什么，吃完再说吧」</p><p class="story-paragraph dialogue">「所以说，和我一起玩游乐设施不是很好嘛」</p><p class="story-paragraph">俯冲的时候五脏六腑分离的感觉多么让人上瘾啊。塞满糖的嘴叽叽喳喳地说着奇怪的话。知珉见旼炡快吃完了，又把糖塞进去。五脏六腑不分离也很好，而且在下面看也挺有趣的好嘛。</p><p class="story-paragraph">旋转木马缓缓地提升速度。不知不觉间，旼炡蓬蓬的脸颊凹陷进去，挠着脸的手指冻得硬邦邦。可能是因为在这样的天气下，还必须一直抓着游乐设施的安全绳吧。</p><p class="story-paragraph dialogue">「旼炡啊，我给你买的手套没带出门吗？」</p><p class="story-paragraph dialogue">「那个今天落在宿舍了」</p><p class="story-paragraph dialogue">「因为你总是看起来很冷才买的，怎么不戴着呢？」</p><p class="story-paragraph dialogue">「姐姐明明说要散个步？没想到今天也会这样逛到晚上」</p><p class="story-paragraph dialogue">「把手给我」</p><p class="story-paragraph">旼炡乖乖地伸出自己的手。在外面走了有一段时间，好像有点干了。你等一下。知珉握着旼炡的手，熟练地翻找包包。</p><p class="story-paragraph dialogue">「在找什么？」</p><p class="story-paragraph dialogue">「手都裂了，我给你抹点护手霜」</p><p class="story-paragraph">这时，雪白手指上戴着的戒指映入眼帘。是下雨天，在奥斯陆的自由市集给旼炡送的礼物。与自己食指上戴的墨珠戒指相似，那银色戒指隐约反射着光芒。知珉用手在戒指上轻轻扫过，比墨珠戒指更光滑的材质，自己有些陌生。</p><p class="story-paragraph dialogue">「你意外地挺喜欢戴戒指啊？」</p><p class="story-paragraph dialogue">「意外？」</p><p class="story-paragraph dialogue">「我以为你很快就会忘记这个。结果一直戴着吗？」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「我帮你暂时拿掉」</p><p class="story-paragraph dialogue">「待会儿我自己涂也可以的...」</p><p class="story-paragraph">旼炡说是这么说，却安静地放任自己动作。知珉帮她从手背到手掌心，每个角落都涂上护手霜，接着就那样十指紧扣。交迭的手比刚才暖和多了。旼炡露出的手指尖依然红通通，彷彿刚打过雪仗。</p><p class="story-paragraph dialogue">「姐姐」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「不要再按我的手指了...没有忘记什么吗？」</p><p class="story-paragraph dialogue">「忘记？」</p><p class="story-paragraph dialogue">「自己甘愿送的礼物，怎么可以再收回去？」</p><p class="story-paragraph dialogue">「我拿了什么？」</p><p class="story-paragraph dialogue">「戒指啊」</p><p class="story-paragraph dialogue">「...啊」</p><p class="story-paragraph dialogue">「快点给我」</p><p class="story-paragraph">对不起，我忘了。知珉拿出口袋里旼炡的戒指。戒指毫无阻力直接戴在她纤细的手指上。旼炡擦完护手霜，到现在一次都没对上自己的视线。</p><p class="story-paragraph">随着轻快的华尔兹，木马转了几圈，静静坐着的旼炡身后，背景迅速变化着。远处是两人一起经过的游乐园入口、接着越过旼炡乘坐的过山车，等几乎转完一圈时，大摩天轮在她身后停了下来。在经过几次反复的风景后，旼炡仍然望向别处。</p><p class="story-paragraph">微微张开地嘴巴漏出了一些气息。突然想亲吻一下旼炡白皙的左脸，但自己并没有凑上前，而是伸手摸了摸她冻僵的脸颊，旼炡这才惊讶地回望。</p><p class="story-paragraph dialogue">「...吓我一跳，怎么了？」</p><p class="story-paragraph dialogue">「有什么好看的？看我这边」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「在冰岛是不是整天都待在室外？」</p><p class="story-paragraph dialogue">「是的」</p><p class="story-paragraph">先去冰河湖、冰川洞窟、温泉，然后在极光Spot会待上一周...旼炡罗列的景点简直像是冰雪奇缘的场景。竟然要去冰河湖和冰川洞穴，虽然不确定具体气温，但一定比这个游乐园冷很多。如果有能遮住整张脸的衣服就好了，因为无论穿得多厚，你都会像现在这样瑟瑟发抖，吐着白烟。</p><p class="story-paragraph dialogue">「从明天开始一定要戴手套」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「不要只带戒指，知道了吧？」</p><p class="story-paragraph dialogue">「知道了...」</p><p class="story-paragraph dialogue">「一定要戴帽子和围巾」</p><p class="story-paragraph">都说知道了。旼炡垂下眼帘，回答得很干脆。两人乘坐的旋转木马渐渐放慢速度，慢慢停了下来。</p><p class="story-paragraph">晚上11点，临近关门时间，游乐园渐渐变得冷清。露天剧场已经结束，顾客熙熙攘攘的站立式咖啡厅也纷纷关上门。与家庭单位的游客相比，更多是手牵手的情侣。乘坐了几次游乐设施跑来的旼炡，看起来更是疲惫不堪。</p><p class="story-paragraph dialogue">「...现在回家吧？」</p><p class="story-paragraph dialogue">「不是12点才关门嘛，你好像还能再坐一次」</p><p class="story-paragraph dialogue">「姐姐，拜托了。现在回家吧...」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「走吧」</p><p class="story-paragraph dialogue">「我说了不要」</p><p class="story-paragraph">虽然旼炡拉着她的胳膊挣扎着，但知珉不可能被这么点大的力量拖动。使出吃奶的劲拉扯，知珉依然在原地纹丝不动，最后，旼炡可能是放弃了，只能松开手迈开脚步。</p><p class="story-paragraph dialogue">「固执的人」</p><p class="story-paragraph dialogue">「想一想最后想坐什么」</p><p class="story-paragraph">旼炡苦恼着在游乐园里转了一圈。要不要再搭一次过山车？要不再坐一次黄金塔吧？</p><p class="story-paragraph dialogue">「不，因为是最后了，所以还是那个比较好」</p><p class="story-paragraph">知珉抬头望向旼炡所指的方向。那是可以称为游乐场象征的大摩天轮，正像风车一样慢慢转动。趣伏里公园的摩天轮是一个非常古老的造型，上面挂着一个热气球，人则坐在篮子里。</p><p class="story-paragraph dialogue">「姐姐，一起坐这个吧」</p><p class="story-paragraph dialogue">「和我？」</p><p class="story-paragraph dialogue">「当然了，我是为了一起坐才选的这个。不会连摩天轮都坐不了吧？」</p><p class="story-paragraph dialogue">「嗯...看起来确实不高啊」</p><p class="story-paragraph dialogue">「如果连这个都说高，就难办了」</p><p class="story-paragraph dialogue">「问题是四周都是空的…」</p><p class="story-paragraph dialogue">「...所以？又没办法坐了」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「真是的...刘知珉胆小鬼」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「可怕的东西那么多，那么小的摩天轮到底有什么好怕的」</p><p class="story-paragraph dialogue">「害怕那样高度的人也是有的。看来你是没见过有惧高症的人」</p><p class="story-paragraph dialogue">「还是这其实都是辩解，是因为不想和我一起坐吗？」</p><p class="story-paragraph dialogue">「不是那样的」</p><p class="story-paragraph dialogue">「那我直接回家好了，最后一个不坐也行」</p><p class="story-paragraph dialogue">「旼炡啊，不要这样。上去看看风景，拍张漂亮的照片再下来吧」</p><p class="story-paragraph dialogue">「摩天轮不是需要很长时间吗？姐姐不是还要在下面等我嘛」</p><p class="story-paragraph dialogue">「一直等也没什么大不了的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「快去吧，这是最后一个了」</p><p class="story-paragraph dialogue">「真的很讨厌，从一开始就是这样，谁会孤独地一个人坐摩天轮呢。像个奇怪的人」</p><p class="story-paragraph dialogue">「自己一个人坐得好好的，还费什么心管别人呢」</p><p class="story-paragraph">只是，应该会觉得是个没有朋友的人吧。一边逗她，一边用力按住她的脸颊，旼炡紧闭着嘴，假装生气。坐游乐设施这么尴尬还是第一次，在不认识的人在旁边独自兴奋地大喊...</p><p class="story-paragraph dialogue">「...不是说是约会吗，这算什么啊？」</p><p class="story-paragraph dialogue">「对不起」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「我会在下面给你挥手，你不会孤单的」</p><p class="story-paragraph">哥本哈根的摩天轮虽然老旧，但十分安静，它似乎看透了我心里所有的想法。一旁的工作人员一直在观察两人是否要排队。看着眼色，旼炡最终嘟囔着走向了摩天轮。</p><p class="story-paragraph dialogue">「我去去就来」</p><p class="story-paragraph">那是今天最后的游乐设施，也是最后的等待。</p><p class="story-paragraph">最后...</p><p class="story-paragraph">知珉握着旼炡转身的手说。</p><p class="story-paragraph dialogue">「…旼炡啊」</p><p class="story-paragraph dialogue">「...怎么了？」</p><p class="story-paragraph dialogue">「今天和我一起来游乐园玩得开心吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「真的吗？」</p><p class="story-paragraph dialogue">「真的」</p><p class="story-paragraph dialogue">「很无聊吧？能一起坐的就只有旋转木马，对不起」</p><p class="story-paragraph dialogue">「所以那个最好玩」</p><p class="story-paragraph">想抱住她。</p><p class="story-paragraph">太想拥抱你了。</p><p class="story-paragraph">但是现在却再也没有可以推迟的时间了。</p><p class="story-paragraph">去吧。知珉勉强笑着拍了拍旼炡的后背。随着最后一个乘客入场，停止的摩天轮终于慢慢开始移动。很快，就看到坐在热气球篮子里的旼炡。旼炡连坐都没坐下，手臂靠在摩天轮的栏杆上挥手，知珉也抬手和她打招呼。</p><p class="story-paragraph">摩天轮渐渐升上去。侧面全是空洞的热气球篮子被风吹得吱吱作响。旼炡似乎毫不在乎强风，依然在挥着手。</p><p class="story-paragraph dialogue">「傻瓜，是让你上去看风景…」</p><p class="story-paragraph">如果真的只看着这边怎么办？知珉自言自语地笑了。旼炡渐渐升上天空。看上去并不高的摩天轮实际上很高，只有抬起头才能看到顶端。旼炡就像漂浮在天上的一个小点、或闪烁的星光。</p><p class="story-paragraph">旼炡就这样渐渐离开了我。</p><p class="story-paragraph">那情景太过悲伤。知珉再次向那小小的人影挥手，摩天轮上装饰的黄色星形灯饰闪烁着夜光。在旼炡到达绝对看不到脸的高度后，知珉才得以坦诚面对自己的感情。</p><p class="story-paragraph">虽然努力去调整急促的呼吸，但眼角已经变得红肿。其实，只注视着我的人才是我的理想型。这是多么令人寒心的话啊，因为面对这个话题，心里想的不是自己的恋人，而是其他人。无论是从早到晚，甚至是睡着的那瞬间，都在想着那个人。</p><p class="story-paragraph dialogue">「...我太傻了」</p><p class="story-paragraph">还想继续跟随旼炡在天空中的轨迹，想一直挥手，直到感到厌倦了为止。本来打算看着她再次走近的脸庞，给她拍张纪念照。从摩天轮上下来，我想摸摸她的脑袋，想给她一块糖。握着手亲暱地往家的方向走去。今天要不要定个早点的闹钟、早上起床后想吃什么，想和平时一样聊着琐碎的事情。</p><p class="story-paragraph">但是，知珉不得不瘫坐在地上低下了头，用双手捂着脸，以免自己抽泣。此时此刻，与无法忘记的梦境一样，虽然很想搭话，但是在旼炡面前，自己连一个声音都发不出来。最终被蚕食海底才结束的梦，与现实连结在一起。旼炡愤怒的脸庞和哽咽的声音，像回声一样在脑海里萦绕。</p><p class="story-paragraph">姐姐虽然装作彷徨的样子，</p><p class="story-paragraph">但其实心里很清楚。</p><p class="story-paragraph">姐姐就是胆小鬼。</p><p class="story-paragraph">姐姐就是胆小鬼。</p><p class="story-paragraph">姐姐就是胆小鬼。</p><p class="story-paragraph">那噩梦的结局就是今天吗？</p><p class="story-paragraph">一天之内多次听到说自己是胆小鬼。因为没有一个可以一起坐的，发牢骚的话语令人心痛。也是为了能握住带着遗憾的手，特意为她涂了护手霜。但是却害怕亲吻她看起来冰冷的侧脸。现在，无论旼炡说出多么惹人喜欢的话，即使她表现出可爱的一面，也无法坦率地再拥抱她。</p><p class="story-paragraph">因为刘知珉就是个胆小鬼。</p><p class="story-paragraph dialogue">「…旼炡啊」</p><p class="story-paragraph">如果我坐上了那座摩天轮，</p><p class="story-paragraph">你会觉得今天的结尾更开心吗。</p><p class="story-paragraph">现在还在挥着手吗？</p><p class="story-paragraph">你还在看向这边吗？</p><p class="story-paragraph">知珉在无人听见的空中，艰难地吐出一句话。</p><p class="story-paragraph dialogue">「我...」</p><p class="story-paragraph dialogue">「我喜欢你」</p><p class="story-paragraph">谁也没听见这句话。现在在这个游乐园里，洋溢着幸福微笑的人们，对此毫不关心。等这句话说出口，知珉才勉强找回呼吸。</p><p class="story-paragraph dialogue">「应该...比想象中更喜欢…」</p><p class="story-paragraph">对不起现在才说。</p><p class="story-paragraph">旼炡啊，</p><p class="story-paragraph">其实和你在一起的每个瞬间，</p><p class="story-paragraph">我一直都在梦里，</p><p class="story-paragraph">也许到现在才明白这一点 。</p><p class="story-paragraph">我为了不从那幸福的梦中醒来，</p><p class="story-paragraph">拼命地挣扎了。</p><p class="story-paragraph">也许是从第一次见到你开始。</p></div>
      </section></template>

        <div class="chapter-copy"><p class="story-paragraph">初春，离高中入学只剩下一周。本来正闲聊着要和同班同学一起参加什么社团，突然间话题转到校服上。起因是当时街道上，给新生的宣传纸像健身中心传单一样，被随意乱扔。至少比起阴沉的中学校服，这个更好吧。朋友递上纸张。一位身穿深蓝色夹克的女人正在笑着。</p><p class="story-paragraph dialogue">「不漂亮吗？」</p><p class="story-paragraph">当然，朋友说的是校服。但是比起校服，她那独特的脸蛋更引人瞩目。很漂亮，校服也好、穿校服的女模特也好。夹克的颜色好像很漂亮。旼炡对自己未来三年要穿的服装，给出的反应毫无诚意，却对素不相识的模特进行了评价。但这个人的比例怎么了，编辑也拉得太长了，还有像是用过特效的脸型也是。学校宣传品可以用photoshop弄得乱七八糟吗？</p><p class="story-paragraph dialogue">「实物应该也差不多哦？」</p><p class="story-paragraph dialogue">「实物？」</p><p class="story-paragraph dialogue">「这个人本来就以漂亮着称」</p><p class="story-paragraph dialogue">「连是谁都不知道」</p><p class="story-paragraph">封面上小幅地写着一个陌生的名字。</p><p class="story-paragraph">二年三班 刘知珉</p><p class="story-paragraph">开学典礼一结束，忙碌的新学期正式展开了。那一年，因为从3月中旬开始绽放的樱花，上学路上到处都是花瓣。只是17岁的旼炡即使看到花，别说兴奋了，只有气候暖化的严重性- 等等枯燥乏味的想法而已。既然春天已经到来，就选一首迎春歌曲吧。不喜欢樱花结局，还有什么关于樱花的歌来着。除了春天、爱情、樱花？</p><p class="story-paragraph">그런데 사람들 말이</p><p class="story-paragraph">但是人们却说</p><p class="story-paragraph">너만 아직도 왜 그러니</p><p class="story-paragraph">你现在怎么还这副模样</p><p class="story-paragraph">그제야 둘러보니 어느새 봄이...</p><p class="story-paragraph">环顾四周才发现 不知不觉已经春天...</p><p class="story-paragraph">在灿烂的春日，独自听着歌词感觉很清新。哼着歌边走着，不知不觉间学校的建筑物就在眼前。虽然以散步来说稍嫌太短，但以上学路来看这距离还算不错。</p><p class="story-paragraph">正要路过正门的时候，看到了一张熟悉的面孔。因为比其他学生高半个头左右，所以不可能错过，是不久前看到的校服模特。</p><p class="story-paragraph">精瘦的体格、修长的腿、比想象中更小更圆的脸蛋，竟然装得下眼睛鼻子嘴巴。实际上一看，她给人的印象更是独特，只能不由自主呆呆地看着她的脸。旼炡想纠正自己之前只看一张照片就怀疑“比例怎么这样”的发言。那张照片不是照相馆大叔使出浑身解数photoshop的结果，只是随便拍下一个漂亮的人而已。</p><p class="story-paragraph">名字是刘知珉吗？</p><p class="story-paragraph">模模糊糊地想起那三个字的瞬间，和她对上了眼。知珉笑着扬起漂亮的眉毛，她黑色眼珠的闪耀，照片根本无法与之相提并论。</p><p class="story-paragraph">那天中午之前偏偏是空腹难忍的体育课。1, 2，1, 2。体育馆内响起了哨声和有力的口令。体格健壮的体育老师偏偏一板一眼，没有给大家片刻休息时间。难度越来越高，孩子们也开始抱怨，扭动着身体。朋友在旁边说“要死了”，开始哀嚎。旼炡起身走过去，突然讲起了知珉的故事。</p><p class="story-paragraph dialogue">「我今天早上看到校服模特。和照片上一模一样」</p><p class="story-paragraph dialogue">「我不是了说和实物很相似吗？」</p><p class="story-paragraph">正巧，体育老师环顾了整个体育馆的，接着来到从容完成动作的旼炡面前，站了许久才说。你做得不错，到前面来示范一下吧？我能示范什么。虽然立刻拒绝，但老师还是啪啪地鼓掌说。大家看这里。</p><p class="story-paragraph">你这个肌肉男，真是随心所欲想干嘛就干嘛。最终，旼炡只好走到前面，半强制性地做完示范动作后，重新回到位置上。但老师不知道是不是还有其他事，自言自语地盯着这边。虽然动作很难、但是姿势很好，身体也很柔软。</p><p class="story-paragraph dialogue">「舞应该也跳得也不错啊」</p><p class="story-paragraph dialogue">「跳舞吗？」</p><p class="story-paragraph dialogue">「不感兴趣吗？」</p><p class="story-paragraph dialogue">「不怎么…」</p><p class="story-paragraph dialogue">「你有加入社团吗？」</p><p class="story-paragraph dialogue">「现在还没有。如果有乐团的话，我肯定会加入的」</p><p class="story-paragraph dialogue">「你不想试一次舞蹈部吗？」</p><p class="story-paragraph">我是舞蹈部的顾问，现在正在招新生，如果你想进来我就跟孩子们说，反正都可以上舞台，不是差不多嘛。旼炡认为那句话很牵强，乐团部和舞蹈部从里到外完全不同。自己一言不发，但旁边的朋友听见后反倒兴奋起来，吵着要一起加入舞蹈部。这间学校的舞蹈部最为有名，对外活动也很多，应该很有意思。朋友的话只让旼炡更加冷漠。如果活动多，反而会觉得很麻烦。也不是对舞蹈很有热忱...</p><p class="story-paragraph dialogue">「算了，我想在学校外面组个乐团」</p><p class="story-paragraph dialogue">「那个前辈好像也是舞蹈部」</p><p class="story-paragraph dialogue">「谁？」</p><p class="story-paragraph dialogue">「你早上看到的校服模特儿啊」</p><p class="story-paragraph">后颈一点点地冒汗。旼炡呆呆地躺在垫子上，想起今天早上见到的知珉。以为她只是学生会，没想到还是舞蹈部成员，真是令人意外。也挺适合的，那个人好像是会好好参与各种校内外活动。</p><p class="story-paragraph dialogue">「呀，一提到乐团我就想起来了」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「你没听到尚勋哥哥的事吗？」</p><p class="story-paragraph">不怎么待见的名字一出现，旼炡就皱起眉头。尚勋比自己大一岁，是哥哥的好朋友。因为幼年时期就认识，而且是一起长大的邻居，所以两人说话很亲地用非敬语。从今年开始，又和吴尚勋成为同校师兄妹。吴尚勋不知天高地厚明明只学了吉他而已，却组了个乐团。说实话，旼炡从中学时期开始关注歌曲和乐团，很大程度是受到他的影响。</p><p class="story-paragraph dialogue">「什么消息？我们最近没见面」</p><p class="story-paragraph dialogue">「因为和你关系很好，我还以为你会知道」</p><p class="story-paragraph dialogue">「怎么了，他最近还在到处做奇怪的事情吗？」</p><p class="story-paragraph dialogue">「不是、不是那样，他的新女友-」</p><p class="story-paragraph">这时响起了午餐时间的钟声。体育课匆匆结束，孩子们穿着运动服一哄而散，在一片混乱中，旼炡为了听清朋友的话，竖起了耳朵。</p><p class="story-paragraph dialogue">「听说是那个校服模特啊？」</p><p class="story-paragraph">整个下午的上课时间，都在为朋友的最后一句话费心。怪不得最近很少来联系说自己无聊，结果是有了女朋友啊。而且是早上看到的校服模特？是美女与野兽吗？两种不协调的世界观融合在一起，让人不禁皱起眉头。接着突然感到很好奇。那个校服模特到底是什么样的人。</p><p class="story-paragraph">要稍微问一下吗？</p><p class="story-paragraph dialogue">-现在正要去你家 准备好吉他。</p><p class="story-paragraph">以好奇心为借口，旼炡发出命令的讯息，下课后立即前往尚勋家。</p><p class="story-paragraph">接连按了几下门铃，从门缝中看到了不情愿的脸。干嘛突击检查呢？旼炡推开尚勋的肩膀，熟练地进入房间。坐在床上拨了下一旁整齐的吉他弦。可能已经调过音，所有弦都发出了干净的声音。尚勋这才拖着身体走进房间。</p><p class="story-paragraph dialogue">「你突然来的理由是什么？」</p><p class="story-paragraph dialogue">「不是说了嘛，教我弹吉他」</p><p class="story-paragraph dialogue">「真的想学吗？」</p><p class="story-paragraph dialogue">「嗯，你也是才练一年就弹成这样」</p><p class="story-paragraph dialogue">「竟然明目张胆地小看我」</p><p class="story-paragraph">你知道正确的指法吗？要直接略过基础进入和弦吗？我光练习这个就花了很长时间。这些唠叨根本听不进去，只是觉得他梳起的头发很碍眼。头发是怎么回事？土里土气的。遭到当面斥责的尚勋抚摸着上翘的刘海。这个最近很流行嘛，刘亚仁发型啊。别说不像话的话。一下子拨下无辜受牵连的头发，把好奇的事情问出口。</p><p class="story-paragraph dialogue">「最近不是听说你在谈恋爱吗？和我们学校的校服模特」</p><p class="story-paragraph">于是尚勋放下吉他，挠了挠头。才没几天怎么知道的。看这个厚颜无耻的人还会害羞，看来并不是谣言。他们俩真的在交往吗？想象一下两人在一起的样子，莫名的烦躁涌上心头。</p><p class="story-paragraph dialogue">「如果传闻都传到我身上，一定是你太张扬了吧」</p><p class="story-paragraph dialogue">「那是因为她很漂亮，所以有名」</p><p class="story-paragraph dialogue">「真好命啊，还吵着想交女朋友呢」</p><p class="story-paragraph dialogue">「嗯，能交往是我幸运」</p><p class="story-paragraph dialogue">「怎么认识的？」</p><p class="story-paragraph">今年我们在地方庆典上进行演出。待机室里还有那些舞蹈部的人，在那里聊着聊着就变熟了。听他说得好像没什么也挺让人不爽。越听越不高兴，难道白来一场了吗？不管他会如何反驳，事实就是如此。个子不高，发型也很土，到底是图个什么？刘知珉的取向为什么这么差劲。</p><p class="story-paragraph">尚勋笑着对皱着眉头的旼炡说。那是你不了解，做乐团的话本来就比较好追女生，即使是主唱，也一定要会弹乐器，那样才帅。旼炡也渐渐被这种荒谬的逻辑说服，果然是因为吉他吗？即使长得不怎么好看，如果说是吉他手就会加分吗？</p><p class="story-paragraph dialogue">「这样想想，我本来就打算见面跟你说的，差点忘记」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「说不定不久之后，我们乐团主唱的位置就会空出来」</p><p class="story-paragraph dialogue">「主唱？」</p><p class="story-paragraph dialogue">「嗯。你不试试看唱歌吗？」</p><p class="story-paragraph">很难找到一个不错的女主唱。虽然尚勋的话有些突然，但是对于正在寻找乐团的旼炡来说，绝对是一个有趣的提案。尚勋正在和他的朋友们组乐团进行活动，听说不是正式社团，而是同好们所组的团，而且好像很火，还受到庆典的邀请，意外地受欢迎。</p><p class="story-paragraph">进入有熟人在的乐团也不会有负担，旼炡没有理由拒绝。但实际上，她还是很苦恼。明明早上还对舞蹈部一点兴趣都没有，但某人的脸庞在脑海中盘旋。是按照原计划和尚勋一起组乐团，还是加入知珉所在的舞蹈部，两个选择放在面前，很难做决定。</p><p class="story-paragraph">旼炡按照刚学到的小和弦逐个练习，含糊地回答。现在有一个想加入的社团，我考虑一下。</p><p class="story-paragraph">每到体育课，肌肉男就不断向自己发出邀请，结果几天后，旼炡和朋友一起向舞蹈部提交了入部申请书。但并不是成为部员就能和知珉有交集。如此规模的大型社团，连部员们能同时聚在一起的机会也不多。</p><p class="story-paragraph">招收新生的当天，几位三年级前辈聚集在一起，和一年级说要一起吃饭。见面的地点是地下一楼的校内食堂，因为聚集超过十几个人，现场气氛就像开新生欢迎会一样热烈。</p><p class="story-paragraph dialogue">「啊，姐姐！」</p><p class="story-paragraph">这时，有人高兴地挥手，拿着餐盘一路跑来。是在和一年级的学生一起吃吗？哇，都很漂亮，很可爱呢。勉强挤进长桌角落里的两个女生，其中有一张是旼炡熟悉的面孔。</p><p class="story-paragraph">刘知珉，现在已经熟悉的名字。那是和知珉第二次相遇- 不对，也只是擦肩而过的瞬间。知珉对前辈们说的所有故事都拍着手回应，也吃得很香。两人座位相对较远，吃饭的过程中没有对话。我们先走了、玩得开心。饭后，知珉和朋友又匆匆离去。</p><p class="story-paragraph">第二次见面，最终连声招呼都没打，有点可惜。不管怎样，饭局已经接近尾声，想着该回教室了，向前辈们问好后，正准备挪步，远远地就听见有人在叫自己的名字。</p><p class="story-paragraph dialogue">「金旼炡？」</p><p class="story-paragraph">声音的主人是主办今天聚会的三年级前辈，她长长的褐色头发映入眼帘。</p><p class="story-paragraph dialogue">「因为人太多，名字都搞混了」</p><p class="story-paragraph dialogue">「…我就是啊」</p><p class="story-paragraph dialogue">「要不要跟我聊一会儿？」</p><p class="story-paragraph">旼炡向朋友点头，示意朋友先上去，便跟在前辈后头。打开一楼走廊的最后一扇门，就出现了像秘密花园一样的庭院，周围长出绿叶的樱花盛开。前辈静静地看着自己校服上的名牌，上写着金旼炡，三个字，接着四目相对。对上陌生的眼睛，顿时紧张了起来。突然把我叫到这里有什么事呢？刚才吃饭的时候有没有做错什么。</p><p class="story-paragraph dialogue">「你刚才说是为什么加入我们社团的？」</p><p class="story-paragraph dialogue">「体育老师一直推荐我」</p><p class="story-paragraph">看来老师又给一年级学生宣传了，我也是那么进来的。前辈用自己理解的表情，点了点头，接着意味深长地笑着靠近一步。刚才吃饭的时候就觉得好可爱。</p><p class="story-paragraph dialogue">「近距离看更可爱了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在有在交往的人吗？」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「不对，你谈过恋爱吗？」</p><p class="story-paragraph">紧接着提出的问题更是令人无语。突然问我有没有谈过恋爱吗？这个人怎么回事。难道以为新生是傻瓜吗？有点赌气地立刻回嘴。</p><p class="story-paragraph dialogue">「有恋爱过啊」</p><p class="story-paragraph dialogue">「几次？」</p><p class="story-paragraph dialogue">「...一次」</p><p class="story-paragraph dialogue">「什么时候？」</p><p class="story-paragraph dialogue">「中学的时候同班的...总之就是有」</p><p class="story-paragraph">旼炡在中学时，从关系很好的男孩子那里收到了告白，曾有过半开玩笑交往大概三周的经验。但真的成为情侣后，两人又因为无趣而分手，说着要是这样，干脆重新做朋友吧。无论如何，这也算一次。前辈犹豫着”哼- ”了一声，手支着下巴点了点头。一双好奇的眼睛，依然轮流打量着自己的名牌和脸。</p><p class="story-paragraph dialogue">「那你跟女人交往过吗？」</p><p class="story-paragraph dialogue">「没有啊」</p><p class="story-paragraph dialogue">「有交往的意愿吗？」</p><p class="story-paragraph dialogue">「...这也没有」</p><p class="story-paragraph dialogue">「真奇怪」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「你是不是喜欢刘知珉？」</p><p class="story-paragraph">我喜欢谁？意料之外的名字突然冒出来，音量一下子变大。幸好周围除了两人以外，没有其他人。</p><p class="story-paragraph dialogue">「你好像在发射激光一样，一直盯着她看」</p><p class="story-paragraph dialogue">「完全不是好吗？我们初次见面，完全是不认识的人啊？」</p><p class="story-paragraph dialogue">「你会那么盯着不认识的人吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「为什么？因为她漂亮吗？」</p><p class="story-paragraph dialogue">「是我认识的哥哥的女朋友，因为好奇所以看了一下」</p><p class="story-paragraph">事实就是事实，认识的哥哥的女友。虽然两人进入同一个社团后，连招呼都没打过，关系非常疏远。前辈模稜两可地耸了耸肩膀。嗯，因为你亲口说没有，所以就相信你。做个整理的话，就是说你现在没有交往的人，也没有其他喜欢的人吧？</p><p class="story-paragraph dialogue">「...是的」</p><p class="story-paragraph dialogue">「要和我交往吗？」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「斩钉截铁地说不要呢」</p><p class="story-paragraph">虽然遭到拒绝，但前辈反而比刚才更开朗。完全没有受到打击，这个从容的态度是怎么回事，自己还没来得及猜测，又传来下一个提问。不要的理由是什么，因为没跟女人交往过吗？</p><p class="story-paragraph dialogue">「先别说那个，和今天第一次见面的人，为什么不分青红皁白就说要交往呢？」</p><p class="story-paragraph dialogue">「为什么？当然可以说我很喜欢你的脸」</p><p class="story-paragraph dialogue">「...脸？」</p><p class="story-paragraph dialogue">「好像从来没有这样过吧？所以我才带你来这里」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「至少现在比刚才更瞭解对方了吧？如果是因为不熟悉就提出交往有负担的话，那么先变熟后再问你就行了」</p><p class="story-paragraph">听见她厚脸皮的语气、以及那让人捉磨不透的微笑，令人哑口无言。旼炡正在想要不要跟拉我进社团的体育老师求救，但想想还是算了，那个肌肉男听到这个会笑的。老师，三年级前辈突然跟我说要交往，为什么要在风纪紊乱的社团担任顾问？也不能这么说。</p><p class="story-paragraph">和煦的春风吹来，花瓣从校园内密密麻麻的樱花树上簌簌地落下。将掉在头顶上的花瓣抖落，眼睛骨碌碌地转动，对面的嘴角再次露出笑容。你的眼里流露出的情绪能看得一清二楚，真有意思。</p><p class="story-paragraph dialogue">「好吧，我换个提议。我们先变亲近吧？」</p><p class="story-paragraph dialogue">「那你想要怎么变得亲近呢？」</p><p class="story-paragraph dialogue">「就是普通地在学校见面聊聊天。偶尔去吃好吃的」</p><p class="story-paragraph dialogue">「这就结束了吗？」</p><p class="story-paragraph dialogue">「这就结束了」</p><p class="story-paragraph">真的就这些吗？</p><p class="story-paragraph">可能是刚刚还听到要交往，跟现在实在差距太大。还是刚才其实只是因为跟一年级没有交流，为了变亲近所以故意开玩笑？那张笑脸，依然让人完全猜不透。三年级前辈对自己说想要变亲近，直接回答“不要”也不好。结论就是，即使再怎么苦恼，答案已经定下来了。</p><p class="story-paragraph dialogue">「...好吧，这种程度的话」</p><p class="story-paragraph">伴随着下午的上课钟，结束了简短的对话。前辈得到想要的回答后，表情满足地挥挥手。今天很高兴能跟你聊天，下次再见。</p><p class="story-paragraph dialogue">「但是前辈」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「你叫什么名字？」</p><p class="story-paragraph dialogue">「你刚刚才和我打过招呼，连我的名字都记不得吗？」</p><p class="story-paragraph">旼炡用眼睛扫视她嘴角的细微动作。虽然同名同姓的人应该比金旼炡少，但名字也很普通。这就是第一次认识前辈的瞬间。但是，等到互相叫对方名字，而不是称呼前辈，也是很久以后的事情了。</p><p class="story-paragraph">从那天之后，前辈动不动就说无聊，自己也没有理由不出去。前辈不是光出一张嘴就来喊自己，而是经常在小卖部给自己买零食。</p><p class="story-paragraph dialogue">「你很能吃饼干呢？」</p><p class="story-paragraph dialogue">「我本来就喜欢甜甜的」</p><p class="story-paragraph">咬了一口免费的饼干，一边走着。脚下感觉有异物，旼炡低下头，只见路面上到处都是垃圾。开学好一阵子，学校的宣传单已过了期限，光小卖部地上就有好几张。旼炡在路中间默默地停了下来。不愿意看到封面上知珉的脸，被谁踩得皱巴巴的。</p><p class="story-paragraph dialogue">「做什么呢？不走吗？」</p><p class="story-paragraph">等一下。旼炡让她稍等，接着把它们一个一个地放进垃圾桶。前辈没有伸手，只是站在旁边喝着奶昔说。我不久前和知珉一起吃饭了，她说那时候没能好好跟一年级打招呼，很可惜。久违地听到名字，真是太好了。因为现在和前辈有点交情，所以认为这种程度应该可以说，所以小心翼翼地打开了话题。像那时候一样重新吃个饭怎么样？但是话音刚落，前辈立刻这样说道。</p><p class="story-paragraph dialogue">「在那之前和我一起吃怎么样？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「如果今天没事的话」</p><p class="story-paragraph">今天？</p><p class="story-paragraph dialogue">「有约吗？」</p><p class="story-paragraph dialogue">「如果要请我的话，我就去」</p><p class="story-paragraph">前辈噗哧一笑。你就回答这种问题最快，知道了我请你。难道还要我跟新生玩AA制吗？</p><p class="story-paragraph dialogue">「所以要吃什么？」</p><p class="story-paragraph dialogue">「你吃过锅包肉吗？」</p><p class="story-paragraph dialogue">「没有」</p><p class="story-paragraph">那个时期是像麻辣烫、锅包肉，各种中餐厅刚出现大流行的时候。大概就是比较大片又筋道的糖醋肉，你爱吃甜的，应该也会喜欢这个吧？学校前面有间我喜欢的中餐馆，等下在正门见。前辈啪地拍了下自己肩膀，便先走一步。</p><p class="story-paragraph">糊里糊涂地。本来是为了吃饼干来到小卖部，结果一下子连下课后的约定都约好了。正考虑今晚吃什么，最近手头紧，算好事吗？虽然不知道锅包肉有多好吃，不管怎样，因为努力进行自愿扫除，现在地上一张知珉皱巴巴的脸也看不见了。旼炡将走廊清理完毕，走向教室。</p><p class="story-paragraph">几个小时后，在正门前见到了前辈。虽然这是两人第一次在学校外见面，但并没有感到尴尬。位于商店街角落的中餐厅就像学校食堂一样，充满穿着校服的孩子们，非常热闹。</p><p class="story-paragraph dialogue">「这次庆典好像就是我最后一次活动了」</p><p class="story-paragraph">前辈用筷子一边亲自帮忙盛食物，一边说了这样的话。事实上，与升学考重迭的三年级学生中，很多人是干脆不参加活动。暑假过后参与人数减少也是理所当然的。尽管如此，前辈因为对社团的热爱，所以还是决定参加春季庆典。</p><p class="story-paragraph dialogue">「所以说，要不要一起上舞台？」</p><p class="story-paragraph">第一次尝到甜甜的中餐非常合口味。旼炡将一块锅包肉塞进嘴里，心里犹豫着如何拒绝，最后找到了合适的理由，委婉地说。自己才刚入学，忙得不可开交，打算从下次庆典再开始参加。</p><p class="story-paragraph">是吗？虽然很可惜，但也没办法。前辈反应平淡，再也没问过关于庆典的事情。或许是为自己直接回绝过意不去，突然把话题转到了食物上。锅包肉真的很好吃呢。</p><p class="story-paragraph">我不就说了很好吃吗，看你吃得特别香，请客挺值得啊？以后要经常和你来。前辈满意地笑了。总之是幸运的一天，获得免费的一餐，也第一次体验世界上最好吃的中餐。</p><p class="story-paragraph">吃完晚饭出来，天色已经暗下来了。去咖啡厅吧？听到前辈的话，旼炡拒绝了。如果被请吃饭，有良心的话，通常会买咖啡给对方，但旼炡当时连这不成文的规定都不知道。临别前，在各自回家的路上，前辈伸出被夹克微微盖住的手。</p><p class="story-paragraph dialogue">「要牵着走到站牌吗？」</p><p class="story-paragraph">旼炡犹豫了一下，还是握住那只手，前辈轻轻晃动手臂，调整步伐。在等公车的时候，彼此没有特别开口说什么。这是第一次在校外见面，也是第一次牵手。其实，面对前辈比刚开始时舒服多了。第一印象虽然很荒唐，但其实她也不是奇怪的人。偶尔问些对学校生活不了解的事情，前辈也会亲切地教自己。至少可以说，与普通的前后辈相比，她们之间的关系更为密切。但是，就算如此...</p><p class="story-paragraph">如果再问自己是否想和这个人交往，依然会含糊带过。</p><p class="story-paragraph">愉快的晚餐后又过了几周。前辈忙于考试和庆典的准备，渐渐地很少说要见面了。从来没有先联系过前辈。今天也在练习吗？认真努力、加油！最后只是发出这种不可爱的、公事公办的信息而已。当然，就算想打出亲暱又冗长的文字，自己在这方面也没有天份。</p><p class="story-paragraph">偶尔会担心地想，自己会不会太过冷淡，这时就会发动零食攻势。因为在小卖部收到很多吃的，心里感到很内疚。幸好前辈也喜欢甜食，所以要选择符合口味的食物并不难。只要送上奶昔、或甜甜的浓巧克力冰淇淋，前辈就会回复说谢谢，并在文字后附上一颗爱心。这是无需多言、表达诚意非常方便的一种方式。</p><p class="story-paragraph">而在学校庆典前一天，旼炡在家度过了悠闲的晚餐时间。因为没什么事可做，所以正在认真练习尚勋教的吉他和弦。集中精神练了大半天，手机突然嗡嗡~响了两声。</p><p class="story-paragraph dialogue">-现在在干嘛？好久不见，想见你</p><p class="story-paragraph dialogue">-要来一下学校吗？</p><p class="story-paragraph">这个时间去学校吗？这条短信让旼炡有些犹豫。前辈从来没直白地说过想见自己，更没在晚上突然找过自己。脑袋复杂的旼炡把吉他放在一旁，瘫倒在床上。</p><p class="story-paragraph">怎么办。</p><p class="story-paragraph">说实话，懒得出门。衣服都换掉了，头发也乱七八糟。要不要说今天太累了，明天庆典再去看呢。但毕竟是庆典前一天，能亲自去帮她加油，心里也会比较舒服...虽然苦恼但果然心中早已有了决定。从床上爬起来，把头发粗略地整理了一下。但由于目前的发型根本无法用手处理，最终还是将鸭舌帽戴在了头上。接着在皱巴巴的睡衣T恤外，套上一件白色连帽衫。</p><p class="story-paragraph">直接去，还是带点什么过去呢，如果空手去会尴尬吧。旼炡来到住家附近的连锁汉堡店，点了杯最近前辈爱喝的奶昔。</p><p class="story-paragraph">每天早上经过的上学路，晚上走起来颇为陌生。由于连续下了几天的雨，路边的水坑上漂浮着樱花，樱花树上的花瓣已经全部掉落，只剩下孤零零的树枝。眼前就是深夜寂静的学校。乍一看，除了晚自习室和社团练习室外，其他地方都已熄灯。三楼右侧亮着的地方，一直往那边走就可以了吗。穿过空荡的操场时，手机震动再次响起。</p><p class="story-paragraph dialogue">-你在哪里？</p><p class="story-paragraph dialogue">-快到了，直接去练习室吗？</p><p class="story-paragraph dialogue">-不，到旁边的教室来吧</p><p class="story-paragraph">推开出入口的玻璃门，发出嘎吱的摩擦声。在空无一人的学校内，任何声音都显得比平时大。出入口处至少还开着紧急逃生用灯，但看着熄灯后黑漆漆的楼梯，不禁嵴背发凉。旼炡本来想开手机手电筒，但最后还是选择闭着眼睛爬上楼梯。结果，在楼梯拐弯的部分，像个傻瓜一样摔倒在地。</p><p class="story-paragraph dialogue">「…好疼」</p><p class="story-paragraph">或许谁也没看到，但还是有点丢人。独自倒在地上的旼炡，在漆黑的楼梯上扶着小腿。这种情况下，周围的寂静和黑暗仍然很可怕，只能一边跛着脚，一边艰难地半蹲着走到练习室所在的走廊。</p><p class="story-paragraph">三楼走廊传来了和和气气的笑声。一想到周围有人就放心了。再加上灯光散落在练习室周围，并不像刚上来的阶梯那么可怕。旼炡望向前辈所说的练习室旁的教室。但是，空荡荡的教室别说是人，连一只蚂蚁都没有。作为约定场所，实在太过阴森。</p><p class="story-paragraph dialogue">-我现在在教室前，但是这里没有人啊？</p><p class="story-paragraph dialogue">-是这里没错吗？</p><p class="story-paragraph">旼炡没有收起怀疑的目光，而是压低身体走进教室。咔嗒一声，教室门关上，周围就显得更黑、更安静了。连空着的桌椅都有些阴森。她像个坏掉的机器人，一边往前眼球一边左右转动，但也没有看见与前辈类似的人影。虽然如果有相似的人影，那倒是挺可怕的。</p><p class="story-paragraph">这时，哇地一声，被谁抓住肩膀向后转。旼炡几乎吓得动弹不得，被强行转过身。收到的惊吓已经超出可以接受范围，反倒没能发出悲鸣，真是万幸。至少防止舞蹈部练习室集体过来参观自己的惨剧发生。</p><p class="story-paragraph dialogue">「吓到了吗？」</p><p class="story-paragraph dialogue">「啊...真是的，我还以为胆子要吓破了呢」</p><p class="story-paragraph">刚躲在哪里了？前辈似乎觉得很有意思，呵呵地笑着。可能是躲在后边储物柜旁的某个角落吧。</p><p class="story-paragraph dialogue">「还是来了啊？我以为你不会来呢」</p><p class="story-paragraph dialogue">「因为今天是练习的最后一天」</p><p class="story-paragraph dialogue">「是来为我加油吗？」</p><p class="story-paragraph">旼炡一脸开朗，没有进行回答，反而转移了话题。看来是努力练习了啊，流了很多汗。</p><p class="story-paragraph dialogue">「有味道吗？」</p><p class="story-paragraph dialogue">「没有」</p><p class="story-paragraph">前辈好像对流汗很在意，把披在肩膀上的连帽衫脱下来放在桌上。只穿着白色短袖T恤，露出了略显消瘦的纤细身材。</p><p class="story-paragraph dialogue">「早知道喷点护肤水也好」</p><p class="story-paragraph dialogue">「不要在意。都说了没有味道了」</p><p class="story-paragraph dialogue">「但是你拿的是什么？」</p><p class="story-paragraph dialogue">「啊...差点忘了要送这个」</p><p class="story-paragraph dialogue">「还买了这个过来吗？真乖」</p><p class="story-paragraph">因为受到不少惊吓，精神恍惚，旼炡在前辈寻问之前都忘了自己手上拿着奶昔。对于没多想就送上的礼物，前辈显得十分高兴。本来就很想吃点甜的，谢谢你，我会好好喝的。喝了奶昔的嘴唇上沾着白色的奶泡。旼炡看见后，轻轻伸出手说道。</p><p class="story-paragraph dialogue">「那个...粘到嘴上了」</p><p class="story-paragraph dialogue">「啊，真的吗？」</p><p class="story-paragraph dialogue">「不是那里，在嘴唇上面」</p><p class="story-paragraph dialogue">「我今天好像傻瓜啊。吃得都沾在嘴边了」</p><p class="story-paragraph">确实如此，这天的前辈有点奇怪。她自然的举止，恍惚的眼神和语气，都显得慵懒而放松。这副模样让面前的某人更加紧张。</p><p class="story-paragraph dialogue">「甜甜的味道真好。你要喝点吗？」</p><p class="story-paragraph dialogue">「没关系，我当然是故意挑前辈喜欢的买来」</p><p class="story-paragraph">咬着吸管微微一笑，脸上有些泛红。视线令人稍稍有些负担，所以旼炡更用力压低鸭舌帽。前辈把奶昔放在桌上，示意她拉开椅子坐下。旼炡也乖乖坐在那里，而前辈则立刻坐到自己膝盖上，调皮地笑着说，这里是我的位子。</p><p class="story-paragraph dialogue">「...不是有很多空椅子嘛」</p><p class="story-paragraph dialogue">「我就想坐在这张椅子上」</p><p class="story-paragraph">旼炡手足无措地挣扎时，前辈伸出了手。紧接着，盖住头部的连帽衫帽子被向后翻下。旼炡担心连球帽也一起被带落，反射性地抓紧了帽子帽檐。</p><p class="story-paragraph dialogue">「又是卫衣又是帽子...不热吗？」</p><p class="story-paragraph dialogue">「因为现在头发太糟糕了」</p><p class="story-paragraph dialogue">「我也是流着汗随便扎着头发，那又怎么样？」</p><p class="story-paragraph dialogue">「…到底为什么要摘别人的帽子？」</p><p class="story-paragraph dialogue">「什么呀，好可爱。脸都红了」</p><p class="story-paragraph dialogue">「在这么暗的地方还能看到脸吗？」</p><p class="story-paragraph dialogue">「看见了」</p><p class="story-paragraph">不是因为腿上重，而是因为距离太近，所以有些不自在。因为脸离得太近，自己特意用棒球帽挡住视线。偏偏前辈坐在膝盖上盯着这边看，视线无处安放。看着一个人哼哼唧唧的旼炡，前辈低声问道。</p><p class="story-paragraph dialogue">「从阶梯上来，不害怕吗？」</p><p class="story-paragraph dialogue">「有点...其实刚才闭着眼睛跑上来，结果摔了一跤」</p><p class="story-paragraph">听到这样可怜的幕后花絮，前辈呵呵笑着说，和她预想的一样。肩后垂下的褐色头发轻轻飘扬。</p><p class="story-paragraph dialogue">「不害怕吗？躲在这种地方」</p><p class="story-paragraph dialogue">「我喜欢这种氛围」</p><p class="story-paragraph dialogue">「有点可怕，不能开灯再聊吗？」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph">每当对话暂时中断，流动的寂静就显得特别别扭。体温一直在上升。虽然练习室的灯光依然亮着，但完全没听见任何声响，让人产生现在这栋建筑内，只有彼此的错觉。</p><p class="story-paragraph dialogue">「…太安静了。练习室好像没有人」</p><p class="story-paragraph dialogue">「才不是，大家应该都在休息吧」</p><p class="story-paragraph dialogue">「都有谁啊？」</p><p class="story-paragraph dialogue">「为什么要问这个？」</p><p class="story-paragraph">对于这么简短的提问，却什么话也说不出来。前辈的眼睛没有笑意。虽然不算说错话，但确实有点心虚。</p><p class="story-paragraph dialogue">「看来有其他想见的人啊？」</p><p class="story-paragraph dialogue">「不是那样的」</p><p class="story-paragraph dialogue">「有点伤心啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「今天不是来看我的吗？」</p><p class="story-paragraph">近在咫尺的距离，可以听见彼此的呼吸声，身上散发着不讨厌的汗味。拼命死守住鸭舌帽的手被猛地抓住，随着障碍物消失，前辈进入最后的空间。紧接着，光洁的手轻轻抬起自己的下巴。</p><p class="story-paragraph dialogue">「怎么办，我有点犯罪的感觉」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「现在这么一看...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你太像孩子了」</p><p class="story-paragraph">没有躲开的余地，前辈的脸庞就凑了上来。嘴唇一碰上就卸了力，人生中第一次有某人的舌头侵犯到嘴里，令人喘不过气。就像字面上说的，头上的热气蒸腾。这是她17岁人生的初吻。说实话，连品尝甜甜奶昔的工夫都没有。</p><p class="story-paragraph dialogue">「等一下，前辈。等等...」</p><p class="story-paragraph">直到紧紧相贴的双唇分开，才困难地平复呼吸。本来试图将前辈从膝盖上推开，但自己的手却不小心碰到一旁的桌子。</p><p class="story-paragraph">嘎啊——</p><p class="story-paragraph">寂静的教室内，桌子和地面摩擦，发出被推出去的声响。怎么办？这种巨大声响肯定连练习室都听见了。前辈拉着呆愣在原地旼炡的手，走向教室后面的角落。</p><p class="story-paragraph">正好有人来到这儿。门没被轻易打开，只看到外面徘徊的人影。我再也不来了，求求你离开吧。旼炡向站在门外的匿名入侵者发出心电感应。但是，这个人具有强烈好奇心，执意打开教室的门。</p><p class="story-paragraph dialogue">「有人吗？」</p><p class="story-paragraph">低沉的嗓音和长长的人影，让心脏再次扑通一声沉了下去。这是刘知珉，是知珉的声音。要不是前辈的手捂着嘴，说不定就惊呼出声了。前辈屏住呼吸轻声地说。安静、嘘。知珉往教室内探头探脑，小心翼翼地走进门，拿着笔还是牙刷的手，好像正在颤抖。如果那么害怕就别进来了啊。</p><p class="story-paragraph">千万不要过来这边。</p><p class="story-paragraph">别过来、别过来、别过来。</p><p class="story-paragraph">但是，知珉一直没接收到心电感应。知珉看着位移了的桌子，靠近放有前辈连帽衫的书桌旁，进入了旼炡的视野中心。回过头来看，其实这是个很容易被发现的位置。</p><p class="story-paragraph">简直要疯了。心脏一天吓掉了两次，今晚不会就这么断气吧。或者干脆现在直接晕过去就好了。佛祖啊，让我渡过这个危机吧。旼炡正在经历重大的生死关头，前辈见她这副模样，似乎像刚才一样觉得有趣，露出无声的笑。旼炡只能闭着嘴用自己的眼神，向毫无帮助的前辈发出心电感应。</p><p class="story-paragraph">还笑得出来？</p><p class="story-paragraph">前辈看到她卖力的眼神，又窃笑着松开了手。旼炡好不容易得到自由，大口呼吸。但是，放松警惕也是暂时的。前辈可能是不想闲着，突然开始抚摸自己的头发，接着手马上朝向脸颊和嘴唇。</p><p class="story-paragraph">疯了吗？</p><p class="story-paragraph">前辈无视再次发送的心电感应。手指在嘴唇上慢慢地左右摩擦，实在太痒了。够了。旼炡皱着脸，用嘴形说。于是，前辈停下手上的动作，也用嘴形把简短的词语传达给旼炡。说什么呢，卫衣...连帽卫衣？不是那个意思吗。因为自己听不懂，前辈用手指慢慢地擦过嘴唇，一个字一个字又说了一遍。</p><p class="story-paragraph">很柔软。</p><p class="story-paragraph">线条分明的脸慢慢朝自己靠近，上嘴唇被紧咬的感觉，让旼炡微微皱起眉头。视线中出现了知珉咬着牙刷的侧脸。一瞬间，感觉好像对上了眼，差点就要挣扎起来，最后还是勉强忍住了。知珉不安地望着教室后某个地方。砰，砰，心脏急遽跳动。这情况太过难为情，简直要疯了。</p><p class="story-paragraph">所幸知珉立刻拿起前辈扔在桌子上的连帽衫，快速朝门口走去。啪，随着教室门轻轻的关上，脚步声渐渐远离。旼炡几乎就像从水中被救上岸的人一样，呼吸急促。</p><p class="story-paragraph dialogue">「…这是在干什么？真是」</p><p class="story-paragraph">好像听说过，人一旦从紧张的情绪中放松就会腿软。 现在腿真的使不上一点力，好像骨头都软了。事实上，自己还出了一身冷汗。旼炡推开前辈的肩膀，戴上连帽衫的帽子，跑出了教室。虽然头脑混乱，但现在唯一担心的是。</p><p class="story-paragraph">刘知珉</p><p class="story-paragraph">刘知珉看到我了吗？</p></div>
      </section></template>
<template id="template-chapter-19"><section class="chapter" aria-labelledby="heading-chapter-19">
        <header class="chapter-heading">
          <span>19</span>
          <h2 id="heading-chapter-19">北极狐观察日记19</h2>
        </header>
        <aside class="ost-card" aria-label="本章配乐歌词">
          <h3>같은 말</h3>
          <div class="lyric-lines"><p class="lyric-line stanza-break">어색해져 버린 말</p>
<p class="lyric-line">우린 전과 달라서</p>
<p class="lyric-line">새삼스레 꺼내기엔</p>
<p class="lyric-line">왠지 어색해졌어</p>
<p class="lyric-line stanza-break">어쩌면 나</p>
