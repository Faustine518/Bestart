        <div class="chapter-copy"><p class="story-paragraph">耳边的闹钟声刺耳。旼炡神经质地把手伸向手机。一夜没睡好，本想睡个回笼觉，但疲惫的身体连这都帮不上忙。再加上，关闭闹钟时不小心看到的信息，偏偏这样写着。</p><p class="story-paragraph dialogue">-昨天吓到了吧，对不起。</p><p class="story-paragraph dialogue">-即使这样也希望你今天能来。</p><p class="story-paragraph">庆典什么的，要不干脆无视它吗？</p><p class="story-paragraph">但是不去的话，第二天怎么办？也不是以后就永远是陌生人。两种想法不停冲突。然而最令自己挂心的是，这是前辈最后一次上舞台。怎么也得去打个招呼吧。只要去说自己要退出社团就好了，那样就能把关系整理干净的...旼炡终于下定决心离开了家。和昨天一样，用连帽衫和帽子把全身包了起来。</p><p class="story-paragraph">进入人山人海的大讲堂，立即感受到室内的高温。因为穿得比别人更热，旼炡不得不每三秒就拉一次连帽衫扇风。庆典和往常一样，非常喧闹又混乱。因为不想偶遇任何人，只能靠在墙上哼着音响播放的歌曲。旋律一出来，旼炡就会用手一个一个地跟着学过的和弦，假装弹着吉他。歌声一结束，掌声简短地响起。</p><p class="story-paragraph">接着主持人介绍最后一首歌，旼炡径直向礼堂中央走去。舞台上已经有十来个人了。主队形以两人为中心，不意外都是昨晚见到的面孔。心里突然浮现昨天前辈温柔的声音，和轻而易举被抢走的初吻。</p><p class="story-paragraph">有点犯罪的感觉，你太像孩子了。</p><p class="story-paragraph">没想到连台词都记得那么深刻。旼炡干咳了几声，然后转移视线。这时站在前辈旁边的知珉映入眼帘。高高的个子、长长的四肢清晰可见。与在校门口面带微笑的形象不同，很新奇。</p><p class="story-paragraph">在清晰的灯光下，突然觉得知珉就像一条蛇。并不是单纯五官华丽，而是能抓住视线，那特别的冷漠眼神，就像一条蛇。也许比起温顺的蛇，更像是毒蛇。我喜欢那略带锋利和冷淡的眼神。如此呆呆地轮流看着两人，结果三分多钟的舞台就到了尾声。音乐结束后，旼炡立刻小声鼓掌。</p><p class="story-paragraph">在庆典活动即将进入尾声的氛围中，人们来来往往地移动。旼炡被撞来撞去，一直注视着后门。这时，讲堂后面陆续出现舞蹈部的成员，换完衣服出来的前辈也在其中。旼炡稍稍犹豫了一下，叫出了她的名字。这时前辈的视线转向自己。</p><p class="story-paragraph dialogue">「...没想到你来了」</p><p class="story-paragraph">在熙熙攘攘的礼堂中间，两人默默地凝视着对方。前辈叹了口气，但很快脸上就带着笑容开口。谢谢你愿意过来。</p><p class="story-paragraph dialogue">「舞台表演很精彩」</p><p class="story-paragraph dialogue">「那个...旼炡啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「昨天吓到了吗？」</p><p class="story-paragraph dialogue">「有一点」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不对，我吓了很大一跳」</p><p class="story-paragraph">对不起。旼炡拒绝了靠近的手，向后退了一步，前辈只能勉强放下胳膊。两人之间相隔着模糊的距离，旼炡再次开口。我想了一下...</p><p class="story-paragraph dialogue">「我打算放弃社团活动」</p><p class="story-paragraph dialogue">「怎么了？都还没上过舞台啊」</p><p class="story-paragraph">也只能坦白。其实舞蹈部一半是因为好奇才加入，一开始就不是自己想要的。趁着正式活动开始前，打算就此放弃，到外面找个业余乐团加入。听到原委的前辈，脸上的表情和第一次见面时一样，完全猜不透。</p><p class="story-paragraph dialogue">「这就是全部吗？」</p><p class="story-paragraph dialogue">「还有那个...有前辈的话会有点负担。总归就是这样」</p><p class="story-paragraph">旼炡盯着运动鞋的鞋尖说道。前辈压低的双眼慢慢地眨了眨。有点后悔说出“负担”两个字，不知道改成其他词会不会更好。酷热的礼堂似乎早已冷却下来，这时传出的声音语气平静。那就算了吧，如果你这么想的话。</p><p class="story-paragraph dialogue">「对不起」</p><p class="story-paragraph dialogue">「没有什么好对不起的，反正我的目的已经达成了」</p><p class="story-paragraph">目的？</p><p class="story-paragraph">这时，前辈稍微挑起眉毛，手指向前一指。</p><p class="story-paragraph dialogue">「...我吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">如果我在那一刻清醒过来，人生会朝着不同的方向发展吗？</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我们交往吧？」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「如果交往的话，就没问题了吧？昨天的事」</p><p class="story-paragraph">前辈挽着手臂、耸了耸肩膀，用她丝毫没有紧张的特有表情说。正好昨天也有人问了？问我是不是在跟年下交往。</p><p class="story-paragraph dialogue">「看来消息已经传开了，你也要负责吧」</p><p class="story-paragraph">被突如其来的胡说八道给弄糊涂了。干嘛在这种天气穿得这么热呢？前辈又为什么不停语出惊人呢？不会真的到处说自己和年下交往吧？身上的汗如洪水般哗哗地流，都分不出刚结束舞台表演的人是谁。</p><p class="story-paragraph dialogue">「在正门前见吧。我跟孩子们打完招呼马上出来」</p><p class="story-paragraph dialogue">「等等...等一下」</p><p class="story-paragraph">说完自己想说的话就消失，这就结束了吗？</p><p class="story-paragraph">这不是旼炡心里所想的剧本。但是，面对她这厚颜无耻的样子，不知怎么的，自己连一点反驳都说不出口。甚至连生气地说“我不要”都没办法，更不用说推开她了。</p><p class="story-paragraph">最终旼炡站在正门前等待前辈，那天也牵着手一起走了。正是迎来四月的春天。几天后，自己又被她真挚地告白了一次，也真的交往了。为此，一年级的第一次期中考，也不出所料地搞砸了。直到这时，绝对没有想到自己会被前辈牵着鼻子那么久。也不是四周、四个月，竟然足足有四年的时间。</p><p class="story-paragraph">当然，那么长的时间里，前辈一次也没有叫过知珉一起吃饭。</p><p class="story-paragraph">那年刚过一月的冬天，旼炡十八岁。</p><p class="story-paragraph">毕业典礼当天心情非常差。因为，早晨的空气太冷自己不喜欢，也不想举行送走前辈的毕业典礼。还有一个原因是，说好要教自己弹吉他，却突然在前一天说要和知珉约会，并毁了约可恶的尚勋。想了想，也许这是最让人心情恶劣的事。</p><p class="story-paragraph">旼炡买来一束粉红色的花，脚步沉重地走向学校。走在校园里，突然碰到了意料之外的面孔。运动场上站着身穿黑色外套的知珉，双手拿着大箱子和社团成员正愉快地交谈，吸引了自己的视线。深色长发一直留到腰际。</p><p class="story-paragraph">是因为形象比较冷吗？看着吐着白色水气的脸，就觉得非常适合冬天。虽然第一次见到她是在春天，而不是冬天。站在校门口的知珉、天空中飘散的樱花，以及当时听到的歌曲依然在记忆中栩栩如生。“除了春天、爱情、樱花”那首歌。想起那之后发生的事，现在看来，那天早晨只是令人觉得可笑罢了。</p><p class="story-paragraph">知珉先一步走上阶梯，前往前辈所在的教室。旼炡则远远地跟在那伙人后面。透过窗户，看到教室里大伙已经笑开了花。给穿着毕业服拍照的前辈一个眼神后，旼炡朝阳光灿烂的走廊尽头走去。这是第一次和前辈面对面交流的地点。这里的风景如今看来十分荒凉。要等今年的樱花开，至少还要再三个月...</p><p class="story-paragraph">过了许久，走廊安静下来。现在已经跟大家道别了吗？旼炡把边缘卷曲的花瓣轻轻摊开。恭喜毕业。说句话然后把花递过去就行了。本来不难的事情，但一站在教室门前，心里就乱糟糟的。结果在原地徘徊了一阵子才打开门。讲桌前站着身穿毕业服的前辈。强忍着欲哭的心情，好不容易递上鲜花说。前辈，祝你毕业快乐。</p><p class="story-paragraph dialogue">「谢谢」</p><p class="story-paragraph dialogue">「...这是什么香味？」</p><p class="story-paragraph dialogue">「嗯、香水。刚从孩子们那里收到的礼物」</p><p class="story-paragraph dialogue">「味道真好」</p><p class="story-paragraph dialogue">「喜欢吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「我要不继续用这个香水呢？」</p><p class="story-paragraph dialogue">「就用你喜欢的吧」</p><p class="story-paragraph">这时走廊传来了熟悉的声音。是尚勋喊女朋友的唠叨声。等很久了吗？去吃饭吧。知珉向尚勋挥了挥手，穿过走廊，两人挽着手悄然离去。传来了和睦的对话和下楼梯的声音。</p><p class="story-paragraph">亲眼看到那个样子就来气。几个月过去了，竟然还好好地在交往，真是令人震惊。刘知珉到底觉得那个吊儿郎当的乐团成员哪里好呢？取向真是...</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「我们也去吃饭吧？」</p><p class="story-paragraph dialogue">「好」</p><p class="story-paragraph dialogue">「久违地去吃锅包肉怎么样？」</p><p class="story-paragraph dialogue">「想吃什么就去吃吧，毕竟这是前辈的毕业典礼」</p><p class="story-paragraph dialogue">「还是吃你喜欢的吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我会经常回来的」</p><p class="story-paragraph dialogue">「来干嘛？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「别来了吧」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「大学生和高中生...谈什么恋爱啊」</p><p class="story-paragraph dialogue">「为什么不能？」</p><p class="story-paragraph">结果在空教室内，还是被前辈抱着抽泣了一阵子。没事了、没事了。在自己后背安慰的手，却莫名让人伤心。但此时的旼炡，却没能传达隐藏在内心深处的话。</p><p class="story-paragraph">我依然是学生，前辈却已经长大成人了。</p><p class="story-paragraph">我们会怎么样呢？</p><p class="story-paragraph">什么时候才会把我介绍给前辈身边的人呢？</p><p class="story-paragraph">对于旼炡来说，前辈是个从容大方的人。但真正成为恋人后，对她的信任却逐渐出现了裂痕。身边的人都以为金旼炡只是前辈很亲的妹妹。虽然没有直说，但她从来没有说她是我的女朋友、像这样好好介绍过。因此，旼炡也无法轻易向尚勋或其他朋友，说出自己与前辈的关系。</p><p class="story-paragraph">一起去舞蹈社团面试的朋友交了男朋友的时候，朋友很快就提议，要给自己介绍男朋友，三个人一起去玩。心里忽然想到要带前辈一起，毕竟比起自己夹在情侣之间当电灯泡，那样感觉更有趣，是叫double date吗？自己也想尝试一次。因此，旼炡萌生了把前辈介绍给朋友的想法。但在小心翼翼地说出这些话的瞬间，前辈却用警戒的口吻反问道。</p><p class="story-paragraph dialogue">「旼炡啊，三个人有什么约会的理由吗？」</p><p class="story-paragraph dialogue">「怎么了？只是互相介绍认识而已。你也知道我朋友是谁不是吗？」</p><p class="story-paragraph dialogue">「你朋友知道你在和我交往吗？」</p><p class="story-paragraph dialogue">「不，这个不知道」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「所以我才说要一起吃饭啊」</p><p class="story-paragraph dialogue">「对不起，我们交往的事不能暂时保密吗？到我毕业为止」</p><p class="story-paragraph dialogue">「...好的，知道了」</p><p class="story-paragraph dialogue">「生气了吗？伤心了？」</p><p class="story-paragraph dialogue">「不是的，没生气」</p><p class="story-paragraph dialogue">「特意跟你说了这个，对不起」</p><p class="story-paragraph">因为是同一所高中，所以应该对此很费心吧。当时自己就是这么想的。但是，前辈的毕业典礼都已经过了整整一年，到了今年的毕业典礼却依然如此。不知从何时起，旼炡不再要求前辈将自己介绍给身边的人。</p><p class="story-paragraph">先说要交往的明明是她，现在好像只有自己在盲目地坚持。姐姐为什么一次都没有把自己介绍给别人？我很丢人吗？某些时候，一看到前辈的脸就差点脱口而出，真的让人很痛苦。但前辈的态度并不是没有诚意，给自己的爱也从来没变过。旼炡反复自责，让自己不要再逼迫前辈。</p><p class="story-paragraph">而且，作为曾经的高中生，还存在着旼炡无法理解的世界。成为大学生的前辈很有人气，酒席也是满满当当。当自己嫉妒或抱怨时，前辈总是会像庆典那天一样，轻描淡写地缓解自己的情绪。这是一个理所当然的顺序，但随着时间的推移，这种关系变得越来越暧昧不明。</p><p class="story-paragraph">时间飞逝，转眼间旼炡迎来了第十九个冬天。</p><p class="story-paragraph">高中时期及肩的头发也长了不少。时间长了因为不想剪，就那样放着不管了。旼炡一结束升学考试，就将沉重的黑发染成金黄色。没什么理由，就是想着发色变亮后心情会变好，算是一种自我催眠。旼炡站在镜子前，轻轻地摸了摸染浅的头发。</p><p class="story-paragraph dialogue">「...清爽吗？」</p><p class="story-paragraph">好像有点太过显眼。不知道了。</p><p class="story-paragraph">学了一年左右的歌曲，因为考试不得不暂停，吉他当然也是摆在一旁。好想重新弹吉他，手痒痒的。其实染了头发之后，本来就让人有点亢奋。</p><p class="story-paragraph dialogue">-我高考结束了，吉他课重新开始吧</p><p class="story-paragraph">旼炡像往常一样，进行了简短的通报后，便来到了尚勋家。时隔快一年再次见到尚勋，他在进入大学后，可能成了酒鬼，一下子变老了许多。</p><p class="story-paragraph dialogue">「哦、变成黄色头发了啊？」</p><p class="story-paragraph dialogue">「你也别再把刘海往上梳了，染个发吧，看起来太土了」</p><p class="story-paragraph">放置了将近一年的吉他，声音变得相当糟糕。当然，已经有一段时间没碰吉他的旼炡，也是同样的道理。</p><p class="story-paragraph dialogue">「想要按住这个和弦，必须一次用四根手指」</p><p class="story-paragraph dialogue">「...突然也变得太难了，再一次」</p><p class="story-paragraph dialogue">「中指弯曲按住6号fret」</p><p class="story-paragraph dialogue">「这样？」</p><p class="story-paragraph dialogue">「向后折啦！方向正好相反了！」</p><p class="story-paragraph dialogue">「就说了没办法向后折，要我去参加奇人列传吗？」</p><p class="story-paragraph dialogue">「...金旼炡你稍微练习一下吉他吧」</p><p class="story-paragraph dialogue">「算了，今天就到这不练了」</p><p class="story-paragraph">旼炡抱着吉他瘫倒在床上。暂且不说进度比想象中慢多少，这难度实在太高，自尊心都受伤了。仔细想想，大学业余乐团主唱，吉他有必要弹得那么专业吗？适当地噹啷噹啷有弹就行了。当时脑中正想着这些，但尚勋却说了一句补刀，简直给本来就不太好的气氛火上浇油。这把吉他真可怜，跟着你是犯了什么罪？好好弹吧。</p><p class="story-paragraph dialogue">「呀！」</p><p class="story-paragraph dialogue">「干嘛？」</p><p class="story-paragraph dialogue">「你还在和刘知珉交往吗？」</p><p class="story-paragraph dialogue">「...刘知珉？很久之前就分了」</p><p class="story-paragraph dialogue">「什么时候？」</p><p class="story-paragraph dialogue">「完全分手都有一年了」</p><p class="story-paragraph dialogue">「被甩了吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「看来是被甩了呢。说实在的，也不可能轮到你来甩她」</p><p class="story-paragraph">听说知珉考上了Y大学。是啊，Y大应该有很多比这种邋遢的乐团成员好多了的男人吧。总之，虽然现在才知道曾经挽着手走路的两人，已经完全分手了，真是这么久以来听过最开心的消息了。尚勋让旼炡继续弹吉他，但旼炡却踢了一脚吉他老师，转身直接躺下。别惹正在休息的人。</p><p class="story-paragraph">无论以前还是现在，尚勋的房间都是乱七八糟的。稍微收拾一下房间吧，现在还能闻到一点酒味，真受不了。捂住鼻子装作痛苦的样子。尚勋好像是心虚了，突然起身把地上的东西胡乱收拾到角落。男人的房间这程度算干净了，没什么好整理的。</p><p class="story-paragraph">突然，只见尚勋的脚边有一双看似绝对不合脚的鞋子。是一双底部有细细的红线作为点缀、可爱的高筒匡威。</p><p class="story-paragraph dialogue">「呀，这是什么呀。怎么有女鞋？」</p><p class="story-paragraph dialogue">「那个... 是以前想当礼物才买的，舍不得扔」</p><p class="story-paragraph dialogue">「礼物？」</p><p class="story-paragraph dialogue">「你要穿吗？」</p><p class="story-paragraph dialogue">「看来是想买给刘知珉的吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「啊哈，被甩了之后，没来得及给，就想把剩下的礼物像剩饭一样清理掉吗？」</p><p class="story-paragraph">怎么能这么说呢，也不好卖掉，所以一直是全新的，可以的话你就穿吧。现在的女朋友脚的尺寸完全不合，连鞋都套不进去。正当尚勋反驳的时候，旼炡已经把脚踩进了新匡威里。</p><p class="story-paragraph dialogue">「...这买的尺寸对吗？有点小啊？」</p><p class="story-paragraph dialogue">「她脚小」</p><p class="story-paragraph">很意外，身高修长的人脚这么小？旼炡在尚勋的房间里穿上两只鞋走来走去。果然自己总是穿得松松垮垮，这个还是小了点吗？虽然大拇指有点磨擦，如果等脚习惯后应该就没事了。来学吉他，结果还赚到了。</p><p class="story-paragraph dialogue">「这个很好看，我拿走了」</p><p class="story-paragraph dialogue">「...金旼炡，你最近怎么样？」</p><p class="story-paragraph dialogue">「我什么？」</p><p class="story-paragraph dialogue">「最近还是没有交往的人吗？」</p><p class="story-paragraph">最近还是？</p><p class="story-paragraph">我朋友说你可爱，让我介绍一下。要见一面吗？因为这句话，双方你来我往进行了简短的对话。不，不要。你上高中的时候从来没交往过吧？有。别骗人了，是我不认识的人吗？</p><p class="story-paragraph dialogue">「别再问了。总之就是有」</p><p class="story-paragraph dialogue">「是谁啊？」</p><p class="story-paragraph dialogue">「...有段时间了」</p><p class="story-paragraph dialogue">「真的吗？」</p><p class="story-paragraph dialogue">「别再问了。我要回家了」</p><p class="story-paragraph dialogue">「怎么突然不说了？」</p><p class="story-paragraph dialogue">「今天吉他实在弹不下去了。鞋我会好好穿的」</p><p class="story-paragraph dialogue">「回去多练习再来吧」</p><p class="story-paragraph">哐地一声把门关上，从尚勋家出来。走路的时候，稍嫌有点小的匡威都会摩擦脚跟让人生疼。一气之下说出已经交往很久，心里真不是滋味。如果就这么结束的话，这一天一定会成为糟糕的一天。这时正好，让人心烦意乱的罪魁祸首，来了联系。</p><p class="story-paragraph dialogue">-宝宝现在在干什么？</p><p class="story-paragraph">面对这简短的信息，只是想装模作样一下。</p><p class="story-paragraph dialogue">-我刚练完吉他，正在回家的路上</p><p class="story-paragraph dialogue">-顺利吗？</p><p class="story-paragraph dialogue">-不，搞砸了</p><p class="story-paragraph dialogue">-搞砸了可怎么办？要努力啊</p><p class="story-paragraph">没事的有时候就是会这样，但很幸运地找到一双鞋，这个漂亮吗？旼炡给前辈拍了一张匡威的照片。虽然因为尺码不合适，脚后跟都磨破了。</p><p class="story-paragraph dialogue">-好可爱啊很适合你</p><p class="story-paragraph dialogue">-是吧？</p><p class="story-paragraph dialogue">-但是旼炡啊。这次生日想做什么？</p><p class="story-paragraph dialogue">-是啊，本来想见面吃饭的</p><p class="story-paragraph">像往常一样，一直都是那样。不过还剩下一个月的时间，为什么要提起生日呢？旼炡害怕她突然说那天不能见面。因为前辈家在元旦经常举行家庭聚会。</p><p class="story-paragraph dialogue">-姐姐，你没有时间吗？</p><p class="story-paragraph dialogue">-不是，你从以前就说过想看星星嘛</p><p class="story-paragraph dialogue">-嗯</p><p class="story-paragraph dialogue">-我们那期间去济州岛旅行怎么样？三天两夜...</p><p class="story-paragraph dialogue">-真的吗？能去吗？</p><p class="story-paragraph dialogue">-好像可以</p><p class="story-paragraph">突然的旅行提议让人很激动，练习搞砸之类的事一点都不重要了，20岁生日去济州岛看星星旅行。而且前辈很少先开口...</p><p class="story-paragraph dialogue">-我觉得很好</p><p class="story-paragraph">那天在床上，旼炡搜寻了济州岛旅行相关的资讯，睡得比平时晚多了。</p><p class="story-paragraph">一个月后，旼炡20岁生日的1月1日，前辈在旅行前一周才联系说，一直担心的家庭聚会还是要举行，很抱歉。</p><p class="story-paragraph">旅行告吹虽然很伤心，但是旼炡不想表现出来。生日当天，前辈的家族聚会结束后，计划变更为一起吃晚饭约会。一见面，前辈就递上一束粉红色的花。她的手依恋地轻抚自己的肩膀。</p><p class="story-paragraph dialogue">「很抱歉没能去济州岛，明明是我先开口的」</p><p class="story-paragraph dialogue">「已经说好别说这些了，看星星以后再去看就行了」</p><p class="story-paragraph dialogue">「旼炡啊，你去过冰岛吗？」</p><p class="story-paragraph dialogue">「没去过，怎么了？」</p><p class="story-paragraph dialogue">「如果你看到极光感觉会很喜欢」</p><p class="story-paragraph dialogue">「极光？」</p><p class="story-paragraph dialogue">「毕竟我们这里看不到，感觉应该比星星漂亮多了」</p><p class="story-paragraph dialogue">「只要看得清星星，就够漂亮了」</p><p class="story-paragraph dialogue">「既然提到了，我们以后去北欧看看吧？」</p><p class="story-paragraph dialogue">「...是不是离济州岛太远了？」</p><p class="story-paragraph">先去济州岛吧。即使这么说，前辈还是喋喋不休说着关于北欧的事。看了瑞典和挪威的风景，非常干净漂亮。我想了一下，如果慢慢游览北欧，最后再去冰岛，这样行程正好。能去城市，也能去大自然。</p><p class="story-paragraph dialogue">「好像迷上北欧了？是看了旅行综艺吗？」</p><p class="story-paragraph dialogue">「嗯，昨天看完才睡的，因为太兴奋了」</p><p class="story-paragraph dialogue">「我就知道是这样」</p><p class="story-paragraph dialogue">「但是你知道吗？」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「看着极光许愿的话，一定会实现」</p><p class="story-paragraph dialogue">「这和朝喷水池中扔硬币有什么区别吗？」</p><p class="story-paragraph dialogue">「别那么说，以后一起去吧」</p><p class="story-paragraph">竟然敢说这种话吗？济州岛旅行明明也是她本人先取消的。</p><p class="story-paragraph">虽然前辈那句怂恿的话，两人根本没有立下约定，还是给自己留下了很长时间的印象。是因为年纪太小的时候就交往了吗？旼炡讨厌前辈仍然把自己当孩子看待。之前还是个高中生，没有为前辈做任何惊喜的事，这一点也很讨厌。因此，这天的闲聊，成为旼炡人生的一个转泪点。</p><p class="story-paragraph">北欧，也许不坏。一起去海外旅行的话，这个关系会不会更加牢固呢？如果下定决心准备这份大礼的话，会不会让自己更成熟一点呢、已经不再是需要照顾的对象，而是能成为真正的恋人呢、心中还隐隐约约期待着。</p><p class="story-paragraph">自己生日一过，就开始辗转于网吧、餐厅、校内各种兼职，就这样度过了几个月。存摺上开始印着从没见过的金额。每当身心疲惫的时候，就会想像前辈旅行时高兴的表情。北欧的天空上，映照着比平时看到的星星更加闪耀的极光，想象在那片天空下前辈和自己的模样。如此迫切地想像，不知不觉间&quot;看极光&quot;也成了旼炡的梦想。</p><p class="story-paragraph">因为前辈喜欢。</p><p class="story-paragraph">因为前辈想看。</p><p class="story-paragraph">在她旁边也会幸福吧。</p><p class="story-paragraph">一起旅行的话一定很开心吧。</p><p class="story-paragraph dialogue">「收下吧，这是生日礼物」</p><p class="story-paragraph">当天，旼炡递出经长时间准备的欧洲行预售明细。同时还有从芬兰开始，一直到冰岛结束的旅行路线日程表。前辈可能只期待着和往常一样的小东西吧，脸上看起来好像很慌张。这久违的表情让人心情舒畅。收到惊喜礼物的前辈，就像三年前庆典前夜，买奶昔送她时一样，笑得十分灿烂。</p><p class="story-paragraph dialogue">「这是什么啊？怎么准备的？」</p><p class="story-paragraph dialogue">「不是说想去看看极光吗？」</p><p class="story-paragraph dialogue">「我是说，这笔钱是从哪里来的？」</p><p class="story-paragraph dialogue">「我不是偷来的，所以不用担心」</p><p class="story-paragraph dialogue">「谢谢你，旼炡啊」</p><p class="story-paragraph">孩子都长大了呢？前辈似乎真的深深受到感动。旼炡的计划到此为止获得大成功，现在只要一起愉快地准备旅行就可以了。只是问题的起因是-</p><p class="story-paragraph">某一天看到前辈的SNS留言。前辈拍了预售明细的照片，并附上两个爱心一起上传了贴文。在许多人祝贺前辈生日快乐中，某个男人不停纠缠，并执着地留言。</p><p class="story-paragraph dialogue">-和谁一起去？男朋友？</p><p class="story-paragraph">前辈只回复了“秘密”。随后，该男子文字中带着玩笑又问。怎么男友的照片一张都没有，说实话这不是和朋友一起去吗？</p><p class="story-paragraph">这真的算不上什么大事的。事实上，已经无数次看到男人们对前辈挑逗般的留言。但前辈亲自在那里回复秘密两个字，奇怪地让旼炡烦躁起来。对于连女朋友的名份都没听到，就不停努力工作的旼炡来说，这不再是微不足道的问题。</p><p class="story-paragraph">秘密，一切都是秘密。已经认识前辈四年了，为什么连和前辈单独去旅行的事也要保密呢？为什么哪怕是开心的事情，也不对周围的人说呢？而且，就算说是交往很久的年下男友或什么都好，即使是瞎编的。</p><p class="story-paragraph">金旼炡，你呢？</p><p class="story-paragraph">最近也没有交往的人吗？</p><p class="story-paragraph">旼炡啊，你朋友知道你和我在交往吗？</p><p class="story-paragraph">对不起，我们交往的事不能暂时保密吗？到我毕业为止。</p><p class="story-paragraph">要等到什么时候？到底要我等到什么时候？现在要让我等到大学毕业吗？虽然不想对这些句子一句一句赋予其他意义，但不管怎么说，现在真的很难过。即使只是开口说说也没关系，想亲自确认这份爱情。旼炡心一软，直接按下了通话键。</p><p class="story-paragraph dialogue">「...可以通话吗？」</p><p class="story-paragraph">怎么了，旼炡啊？有什么事吗？短暂的连接后传来了声音。是酒席吗？周围因为噪音十分吵杂。像往常一样，电话那头前辈的声音很稳定。</p><p class="story-paragraph dialogue">「好像在喝酒啊？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「你没跟任何人说吗？我们去旅行的事」</p><p class="story-paragraph dialogue">「今天上传了照片，没看到吗？」</p><p class="story-paragraph dialogue">「现在才看到。不是指那个」</p><p class="story-paragraph dialogue">「不是这个吗？」</p><p class="story-paragraph dialogue">「为什么没有提到我？」</p><p class="story-paragraph dialogue">「...旼炡啊，你怎么了？」</p><p class="story-paragraph dialogue">「姐姐周围的人，到底是怎么看姐姐的？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「是一个抓着从不露面的年下男友一起住的人？还是完全没想过会和女人交往的人？」</p><p class="story-paragraph">不想说得这么感情用事。真的、真的没什么大不了。对于两人来说，这是一次愉快的纪念旅行。但是旼炡最终忍不住气愤到抽泣。就这样伤心了几年，一直到今天，小小的事件才成为让自己痛哭失声的导火线。</p><p class="story-paragraph dialogue">「你相信我吗？」</p><p class="story-paragraph dialogue">「...为什么问那样的话，当然信了」</p><p class="story-paragraph dialogue">「但我们为什么有这么多秘密呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我现在有点不相信姐姐了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我不知道自己喜欢的是谁」</p><p class="story-paragraph dialogue">「...旼炡啊」</p><p class="story-paragraph dialogue">「这也是秘密，那也是秘密」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「去旅行有什么吗，现在连这些小事都要保密吗？」</p><p class="story-paragraph dialogue">「只是因为不喜欢关于你的事被问长问短，所以才那么回答的啊。为什么这样？」</p><p class="story-paragraph dialogue">「所以呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「要一直活在只有两个人世界到什么时候？」</p><p class="story-paragraph">为了我这种借口已经行不通了，我们都是成年人不是高中生啊。前辈只是默默地听着。旼炡任由爆发的泪水肆意流下，接着说道。我害怕我所认识的姐姐，只要没了我，所有一切都会像没存在过一样消失，真的很痛苦。</p><p class="story-paragraph dialogue">「...为什么有这些没用的想法？」</p><p class="story-paragraph dialogue">「不就是姐姐让人产生没用的想法的吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「除了每天安慰我之外，真的没有其他话想说吗？」</p><p class="story-paragraph dialogue">「对不起，让你有这种想法」</p><p class="story-paragraph dialogue">「来回答吧。所以，你有没有跟朋友说过我的事？在姐姐的世界里，认识我的人只有姐姐一个，足足四年的时间，我就是个不存在的人...」</p><p class="story-paragraph dialogue">「旼炡啊，我现在就回家，见面再说吧」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph">希望她不要来。因为只要是前辈来安慰我的话，就会像以往那样被略过，就像不曾发生。会产生自己被爱着的错觉。很明显，两人的关系在没有任何变化的情况下，停滞不前。旼炡已经厌倦了被包装地漂漂亮亮的爱情，所驯服的自己。</p><p class="story-paragraph dialogue">「我非常爱你」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你明明也知道我有多么珍惜你」</p><p class="story-paragraph">没有比这种时候听到的“我爱你”这句话，更空洞的回响。不管两个人的世界如何牢固，对前辈来说，在现实中所占的比重究竟是多少呢？大学毕业后的前辈，人生中还会有自己的位置吗？让旼炡更无能为力的是，没有可以证明的方法。</p><p class="story-paragraph">在气头上打了电话。然而旼炡依稀看见，长时间努力堆迭的高塔正在被砸碎，就像流逝的时间，无法修复，支离破碎。心中的怒火始终没有熄灭，旼炡将心中堆积已久的情绪，全部吐露出来。只有我知道有什么用？不、说实话，现在连我好像也不知道了，光说珍贵有什么用。</p><p class="story-paragraph dialogue">「旼炡啊，我该怎么做呢？」</p><p class="story-paragraph dialogue">「怎么做？」</p><p class="story-paragraph dialogue">「要让你缓解心情，我该怎么做才好呢？」</p><p class="story-paragraph">跟谁打了那么长时间的电话，不进去吗？这时电话那头传来了一个男人的声音。但是前辈听见后只是默默不语。</p><p class="story-paragraph dialogue">「...介绍一下我」</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「向朋友们介绍我。就算不是现在那个酒局也好」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐不是每天都有很多酒席嘛。就算只是其中一个，也请带我去，好好地说」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我们在交往，彼此很喜欢对方」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「这样说一句不就可以了嘛...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不要总是把人当做不存在」</p><p class="story-paragraph">我是谁？</p><p class="story-paragraph">我是前辈的恋人，女朋友。</p><p class="story-paragraph">前辈爱的人。</p><p class="story-paragraph">比在你身边的那些人，待在一起的时间要长得多。</p><p class="story-paragraph">真可悲。怎么也无法整理情绪。现在叫我过去不就行了嘛，还是又要说些甜言蜜语，来避免发生那种情况。即使自己这样说，前辈从头到尾没有展示任何行动的想法。</p><p class="story-paragraph">那就真的结束吧，再也受不了了，就让我结束一切吧。旼炡也做出了这样的发誓。一想到这里，握着电话的手不停发抖，就像独自站在悬崖上。只能用原本抓着脑袋的手，紧紧握住不停颤抖的另一只手。为什么不回答？做不到吗？ 那个有那么难吗？但是，仍然没有等到自己想听的回答。只听见人们大声嬉闹的噪音，特别响亮。</p><p class="story-paragraph dialogue">「知道了，姐姐现在没有秘密了」</p><p class="story-paragraph dialogue">「...你到底在说什么？」</p><p class="story-paragraph dialogue">「我会在姐姐的生活中消失」</p><p class="story-paragraph dialogue">「旼炡啊、旼炡啊，等一下」</p><p class="story-paragraph dialogue">「我厌倦了。四年的话我也忍得够久了」</p><p class="story-paragraph dialogue">「是因为你突然哭着给我打电话，所以很慌张。我们见面后再...」</p><p class="story-paragraph dialogue">「很抱歉这种话竟然用电话说」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「因为如果见面，一定说不出口」</p><p class="story-paragraph">再见。用沙哑地声音说完最后一句话，接着像逃跑一样挂断了电话。</p><p class="story-paragraph">结束了，真的结束了。</p><p class="story-paragraph">旼炡坐在原地大哭到近乎昏厥。荒唐无法置信的结局让人不禁想，这是真的结束了吗？和那个夺走自己十几岁所有回忆的人的关系，好像透过一通电话，就被全部剪断了一样。不像是爱情的初恋，只留下不像话的伤痛，便落下了帷幕。</p><p class="story-paragraph">这是20岁天到来之前，所发生的事。</p></div>
      </section></template>

          <h3>A whole new world</h3>
          <div class="lyric-lines"><p class="lyric-line">I&#x27;m like a shooting star</p>
<p class="lyric-line latin">I&#x27;ve come so far</p>
<p class="lyric-line latin"><br>I can&#x27;t go back to where I used to be<br><br>Let me share this whole new world with you<br></p>
<p class="lyric-line"><strong>崭新的世界</strong></p>

<p class="lyric-line stanza-break">让我与你分享这崭新世界<br></p></div>
        </aside>
        <div class="chapter-copy"><p class="story-paragraph"><br>旼炡还想人生中第一次面对的离别，会成为很大的苦难。本以为分手后世界会崩溃，但自己也没有真的食不下咽，因为时间过得太快了。每当中午睁开眼睛就呆呆地待着，很快就到了晚上，日复一日。</p><p class="story-paragraph"><br>到了秋季学期，朋友们也开始忙碌起来，连一点邀约都没有，越来越经常独自度过一整天。从那时起，平日和周末的界限逐渐消失，凌晨一直看电影，直到早上才入睡，这成了旼炡的日常。能联系到人的只有尚勋。不是因为想联系，而是因为乐团成员的身份。正好今天早上就收到了问候的短信。<br><br>-你是把乐团放弃了吗？<br><br>多亏这段令人厌恶的大学姻缘，旼炡终于加入尚勋的乐团成为主唱。盼望已久的乐团活动很有意思，歌唱实力也逐渐提高。只是和前辈分手后，练习时间缺席就像习惯一样。偶尔会在乐团聊天群中报告自己存活的事实，但现在，群里已经累积300多个未读信息、学校需要重修的课很多、吉他仍然未达中级水准、褪色后断层的发色也——</p><p class="story-paragraph"><br>一句话就是一团糟。<br><br>在随意地无视他的联络之后，尚勋第二天干脆来到家里折腾自己。为什么不看群聊啊？大家都以为你死了。耳边嗡嗡的唠叨很刺耳，躺在被窝里连双眼都没睁开就回答。干嘛突然来别人家啊。<br><br>「这不是你最擅长的嘛。孩子们好奇你在干嘛了，所以我代表他们来了」</p><p class="story-paragraph dialogue"><br>「已经确认活着就够了。离开吧」<br><br>喂。看看你房间这副模样。尚勋在杂乱不堪的房间里来回踱步。吉他被荒废在一角。在家也不是努力练习，到底在干什么？你哥哥知道自己妹妹活成这副德行吗？<br><br>「...出去」</p><p class="story-paragraph dialogue"><br>「别说我脏，把你的房间收拾一下」</p><p class="story-paragraph dialogue"><br>「别烦我，快走」<br><br>「金旼炡完全...变成死宅废物了啊？」</p><p class="story-paragraph">死宅废物。因为没能否定，所以一直默默不答。为了表示自己不想听，干脆把被子盖到头顶上。尚勋似乎放弃了，转过身去。不管怎样，确认了你还在呼吸，我就先走了。</p><p class="story-paragraph"><br>赶走入侵者，屋内又变得一片寂静。旼炡眨巴着眼，吃力地站了起来。家里到处堆满了放置了一个月的邮件和快递。有一次晚上走路没开灯，还被箱子绊到，吓了一跳。虽然现在还是光着脚随便乱踢。总之，房内各处看起来很乱。竟然连肮脏鬼都让自己打扫...旼炡蹲在地上叹了口气，并挽起袖子。至少想从死宅废物当中，先去掉废物。</p><p class="story-paragraph"><br>先拆开眼前这个莫名的箱子吧。是衣服吗？但自己有订购过这么大件的衣服吗？胡乱把快递拆开，被自己忘得一干二净的东西这才显现出真面目。在和前辈分手前，订购的50L大型背包。<br><br>「...这个就算拆开也是垃圾啊」<br><br>旼炡检视起足足有自己身体一半大小的背包，重新堆到墙角。另外，将不重要的所有通知书和文件，看都不看直接撕掉、扔进垃圾桶。</p><p class="story-paragraph"><br>用切割刀割开压在最底下的包裹时，或许里面地东西也被划到，纸张碎片蹦了出来。那是自己下了很大决心，作为生日礼物送给前辈的门票预售明细，和日程表。还有个小信封，可能是前辈写的信。</p><p class="story-paragraph"><br>切割刀没有割到信封的部分，这是值得庆幸的事吗？但自己现在根本没信心打开。如果只是普通的信件，一定会好好读，但摆在眼前的是分手的恋人写的亲笔信。老实说，想过内容是不是复合，但也可能是自作多情。看到作为礼物送的预售明细被寄回来，也许只是已经整理好这段感情而已。再不然...我和你分手后有了男朋友、当时在我Ins上留下很多评论的他、你知道吧？也有可能是这种轻浮的内容...</p><p class="story-paragraph"><br>一想到这里，脑袋就嗡嗡作响。不管前辈在这封信上写了什么，自己都会受到动摇。旼炡躺在床上，呆呆地看着曾经愉快地计划好的日程表。要退票，现在已经是最后机会。立即取消的话，至少不会有高昂的手续费。<br><br>「今天必须快完成」<br><br>真的吗？<br><br>真的要取消吗？不是啊，再想想吧。为了买到这张票，苦苦挣扎那么久，实在太可惜了。甚至为了这次旅行还休学准备，辛苦打工几个月挣的钱全用在上面了。飞机票、船票，花了多少心力才订到的。<br><br>不，这也不是问题。<br><br>现在还提北欧、极光有什么用。一个人去那里能玩得多开心呢，而且除了冰岛，也没有其他具体的安排。去了之后心情更差怎么办？即使自己犹豫不决，时间也不会暂停。这时，前辈说过的话突然从脑海掠过。看着极光许愿一定能实现，旼炡对此只是嗤之以鼻。<br><br>如果真的能实现，该许什么愿呢？如果是这样，我不想再谈这种只留下伤痛的恋爱了，我想祈求让自己忘记这段停滞不前的记忆。无论是春日的回忆、那次十分寒冷的毕业典礼、或是收到粉红色鲜花的20岁生日。<br><br>旼炡无所事事地躺在床上，做出了人生中最重要的决定。既然如此，干脆先去看看冰岛的极光，接着规划自己的21岁。在那之前除了旅行之外，打算什么都不去想了。</p><p class="story-paragraph">首先需要来点欢快的音乐。<br><br>选择了几首适合做事的歌曲，将音响音量调大。随后拿起几分钟之前还堆放在角落的大型背包。一边哼着歌一边打包行李，不知是不是被心情影响，真的对旅行感到很激动。果然，坐而言不如起而行。<br><br>北欧很冷，最好带上毛帽和围巾。带上一条毯子，说不定可以用得上，看极光的时候会在野外露营区，所以要带好防寒服。冰岛的旅游行程中有温泉，所以不能忘记泳衣。带上为了拍摄夜空的相机、再放几种常备用药。鞋子光一双高筒匡威能撑一个月吗？以防万一，不要只戴太破旧的衣服，要不带一套半正装和皮鞋吧，虽然好像没有什么可穿的场合，反正就都带着吧。</p><p class="story-paragraph"><br>不知不觉间，瘦瘪的背包鼓起了大肚子。大致收拾好行李，旼炡即刻前往银行，兑换了欧元和各种北欧货币。还顺便去了趟美容院，重新补染了发根。吹完头发，干净利落的发丝飘逸，心情也跟着清爽起来。是啊，即使没人管着，也不能像废人一样游手好闲。</p><p class="story-paragraph"><br>披着一头金黄色头发回到屋内，就看见整理得整整齐齐的背包，不由得感叹，人的意志力真是惊人，早上房里还堆满了各种杂物和快递的箱子，下定决心要去旅行还不到半天，就到了收尾阶段呢。<br><br>但是，旼炡整理钱包时，受到了意外的打击，再次变得忧郁起来。钱包里放着拍立得，上面是甜蜜微笑着的自已和前辈。没能去济州岛，前辈请自己吃晚餐的那天——就是今年1月1日，20岁生日时拍的照片。</p><p class="story-paragraph"><br>原因自己也不得而知。</p><p class="story-paragraph"><br>是因为没完没了的留恋，还是因为残存爱情，又或是单纯不愿忘记这些珍贵的回忆。不管怎样，旼炡直到旅行前一天，也没能把那张照片从钱包拿出来。<br></p><p class="story-paragraph"><br><strong>Rewind</strong><strong> </strong><strong>：</strong><strong>Airport</strong></p><p class="story-paragraph"><strong>倒回</strong><strong> </strong><strong>：</strong><strong>机场</strong><strong><br></strong><br>行李箱在地上拖行的声音、用各种语言对话的人们、罗列起降班机的蓝色电子屏幕、“出发”二字下面的白色箭头。旼炡喜欢机场特有的活力和兴奋的氛围。也许，只要是出国旅游的人们，都会有共同的想法。虽然离别让心情变得疲惫，不过到达喧闹的休息室后，感觉时隔许久重新提起精神。</p><p class="story-paragraph"><br>只是，从旼炡身旁走过的人们，表情都止不住惊讶。因为背着足以塞进棉被的大背包、等待出国审查的旼炡，看上去毫无疑问像个离家出走的青少年。虽然她本人只是面无表情地望着前方。<br><br>-12时40分***航空飞往赫尔辛基的乘客请到24号登机口<br><br>来到登机口附近，刚好听见登机广播通知。正对玻璃窗，可以看见灿烂阳光下的大型飞机。坐在自己对面的是哭闹撒娇的孩子和一对夫妇，还有一对青涩的情侣，拿着在免税店买东西的纸袋、正忙碌地整理着背包。旼炡身边没有可以愉快聊天的对象，孤零零地一个人坐着。<br><br>既是所剩时间不多的休学生、又是结束四年卑微恋情的悲情单身狗、还是把存了一年的积蓄全部花光，拿到两个月左右北欧行机票的旅客。就是现在照映在玻璃窗上的自己。<br><br>「...最终还是去了啊」<br><br>金旼炡确实还是去了欧洲。本来只是想结束废物生活。结果来到了机场。旼炡直觉认为，这次旅行结束后，自己的人生会有一些变化。不管是好的还是坏的。</p><p class="story-paragraph">一开始登机，旼炡就站到前排。令人头疼的是，即使行李十分沉重，也必须尽快坐到位子上整理。很快，空着的座位被陆续上机的旅客填满，直到出发之前，旁边的座位都是空荡荡的，内心因此十分高兴。<br><br>噢耶，我要舒舒服服把腿伸直。然而以期待的心情等了许久，飞机也没有移动的迹象。出发时间已经推迟了30多分钟，到处都传来叹息声。这时，延迟的罪魁祸首，一名女子在大家的怒视之下，气喘吁吁地上来了。<br><br>脚步声渐渐朝自己走近。微卷的长发配上牛仔夹克。自只刚要选电影，没怎么注意她的脸，像跑完接力赛的选手一样，女人喘看气脱下夹克，放进行李箱里。<br><br>「对不起，我进去一下」<br><br>她从狭窄的缝隙中挤进来，噗通坐在窗边的空位。沉甸闻的马丁靴稍微踩在自己脚趾上，面对突如其来的疼痛感，旼炡皱起鼻尖，唉，小声地叹了口气。人生第一次长途飞行，旁边好像坐着一个头痛人物。<br><br>真倒霉。<br><br>不用多说，这是最糟糕的第一印象。女人身上的热气似乎还没有退去，用手连连扇风，撩动头发，浓郁的香气立刻就飘进旼炡鼻尖。那一定就是前辈从高中毕业后就开始使用的、淡淡木香。和她十分相似的香味，脑袋反射性僵住。<br><br>俗话说，香味更能唤起过去的记忆。仅仅在刹那间，遥远的记忆又重新浮现眼前。送出飞机票时高兴的笑眼，庆典前一天带着奶昔去学校时，脸上惊讶的笑容，我们交往吧？厚着脸皮说出口的脸被汗水浸湿，这些破碎的记忆。<br><br>直可笑。为什么人的大脑只选择最想记住的瞬间呢？那些悲伤和讨厌的记忆都去哪儿了呢，曾经的香气里满是思念。<br><br>-入座后请系好安全带<br><br>不，在旅行中不要有这种想法。旼炡摇摇头，把手伸向安全带。但不知怎么的，安全带却短得出奇。这样不行吧？赶紧使出浑身解数，试看拉了几下绳子。是卡在哪了？当然也不是，只有亲眼看见才能找到问题的根本。结果是慌乱的牛仔夹克、就是坐在旁边的女人，弄错方向，把安全带系在别人的座位上。<br><br>事情还真多啊。自己强忍住想说这句话的冲动。这难道不算可以换座位的正当理由吗？不能举手投诉吗？但是女人已经安坐在座位上，挽着胳膊闭上了眼睛。旼炡尽量以恭敬的语气唤醒女人。<br><br>「那个，那个」<br><br>那时才看清她的侧脸——</p><p class="story-paragraph"><br>十分熟悉，五官华丽得让人一看就难以忘怀。等一下，自己明明记得这张脸。脑袋里一边这么想着，一边先说了该说的话。你的安全带好像系在我座位这边了。女人立即用慌张的语气回答。看我糊里糊涂的，对不起。<br><br>听到她特有的低沉嗓音，高中时代的记忆有如全景画面一样闪过。在学校的宣传单上看到的校服模特儿，在校门口看到的鹌鹑蛋一般大的脸、在食堂第一次见面，连名字都没说上就结束了的新生欢迎会、在舞台上特别显眼修长的四肢、让人想到冬天的冷清长相、和长外套非常相配那直挺的身姿、毕业典礼当天在走廊上，和尚勋挽着手臂。所有的情景掠过脑海。现在脚上穿着的帆布鞋的原主人、还有深夜在空教室偷偷接吻，怕被发现而心惊胆颤的那段记忆——这里不需要，所以先免了吧。<br><br>不管怎么说，作为决定性证据，这张脸的大小，迄今为止只见过一个人。就算巡遍全国，能出现这种漫画比例的脸概率也极小。那么从逻辑上来说，这个女人。<br><br>刘知珉</p><p class="story-paragraph"><br>不会是刘知珉吧？</p><p class="story-paragraph">很快，大家期待的飞机餐就被推了出来。但旼炡比起饭注意力更集中于旁边的座位。虽然有99%以上的概率被推定为刘知珉，但身份尚未被确定的这名散漫女子从刚才就一直在看动画片。本来看玩具总动员，突然停下来看阿拉丁的女人，一边吃牛排，一边用非常专注的表情看着装扮成蓝色精灵的威尔史密斯。原来她竟然喜欢和本人外表不符的迪斯尼电影吗？<br><br>总之，牛仔夹克如果是刘知珉的话，再次遇见的知珉依然很漂亮。但疑问的是，自己为什么没能马上认出她那独特的脸呢？是高中时期的婴儿肥消了，还是轻轻上扬的眉峰消失，变成了一字眉？从看起来乖乖的印象，变得更加成熟，眼神变得更加犀利，妆容也变得更华丽了。不，这么回想起来，最后一次见到她是在两年前。这期间有这么大的变化是合理的吗？<br><br>旼炡决定从知珉那收回视线，集中于刚刚开始的动作片。看到哪儿来着。虽然错过了些故事情节，但动作片只要动作戏华丽就够了。一边期待着即将展开的高空战斗场面，一边目不转睛，但一下子扫兴了。因为，逼真的音效一瞬间消失不见。<br><br>「...搞什么啊，突然」<br><br>摘下耳机再次戴上，还重置了几次屏幕，但依然毫无改变。从整趟飞行初始至今，真的事事不顺。<br><br>那时知珉在旁边点了一杯红酒，小声对乘务员说了什么随后乘务员点了点头，便将新耳机交给旼炡，并拿走了不良品。虽然马上就收下了，但一瞬间没能掌握情况。难道她刚才替自己说了要换吗？到底为什么？对刘知珉来说，我只是一个陌生人。难道是记得当时在食堂打过招呼吗？自己可是连舞蹈部一次活动都没参加就离开了啊？<br><br>难得的高空战斗场面再次上演，但自己却无法集中精神。抱着说不定的心情，稍微将视线转向她，但知珉好像完全没有在乎旼炡似的，正在连续自拍。甚至没转震动模式，声音非常吵闹。咔嚓咔嚓咔嚓咔嚓咔嚓。不仅是旼炡，坐在附近的大叔也用无言以对的表情看着知珉。知珉可能是意识到了从四面八方盯着自己的眼神，尴尬地放下手机，干咳了一声。<br><br>这个人...是不是没在用脑？<br><br>旼炡现在倒想问问自己。这个女人真的是记忆中的刘知珉吗？所以鼓起勇气，发出了声音。那、那个。第二次喊她，她看起来好像被吓到了，赶紧朝自己的方向转来。很快，两人的目光都看向彼此。恍惚之间，好像还能看到高中时期那张脸。<br><br>「请问是上过H高的刘知珉前辈、对吗？」</p><p class="story-paragraph dialogue"><br>「啊、没错，你认识我吗？」<br><br>果不其然，坐在旁边的女人就是刘知珉。但是知珉完全不知道旼炡。问我们认识吗，那生涩的声音，让自己有点不好意思。虽然并没有期待她知道自己名字。其实不认识，只是见过一次面，吃过午餐、就一会儿。知珉再三表示歉意，说自己记忆力不太好。<br><br>「不是的，是因为姐姐很有名」</p><p class="story-paragraph dialogue">「...」<br><br>「不记得了当然也情有可原」<br><br>白问了，结果只让自己心情不好。旼炡总是和知珉擦肩而过，但知珉今天才第一次知道自己的存在，这让人感到很伤心。就算了吧，她帮了忙就是帮了忙。话说回来刚才谢谢了。旼炡礼貌性的感谢问候完，就这么结束了简短的对话。</p><p class="story-paragraph"><br>再看看旅行日程吧。反正重新看电影也无法集中。坐久了渐渐身上有些酸痛，旼炡从座位上站了起来，打开了行李柜。刚打开，不久前和乘务员一起努力塞好的包一下子就要倾倒。很怕行李撞到头，慌忙缩起身子来。也许是看到了自己独自挣扎的样子，知珉站起身，用手抓着背包，以免自己在拿出笔记本电脑时摔倒。</p><p class="story-paragraph"><br>虽然很感谢，但是某人说过，过度的亲切只会造成负担，那句话正适合现在的情况。明明可以不用帮我的。没关系。谢谢。几次轻轻点头，重新坐回原位，飞机上的照明装置在此时依次熄灭。</p><p class="story-paragraph">Kim Min Jeong</p><p class="story-paragraph">屏幕保护上大大的英文名字，旼炡在下方栏位输入密码。kmj_010101!虽然还包含了一个特殊文字，但这简直连一个连幼儿园学生来都能破解。01年1月1日生，金旼炡。在某几个网站上，这种密码有时会因为同样的数字反复，而被禁止使用，真是倒霉的生日。<br><br>屏幕保护一打开，立即出现了熟悉的风景。几个月来一直把碧绿、耀眼的极光照片设置为背景。都是因为这张照片，对冰岛的期待值大幅上升。现在冷静想想，这会不会也是有人通过photoshop修改的。虽然想改掉看到非同寻常的照片就先怀疑的习惯，但是天生的性格，想改变没那么简单，<br><br>旼炡一边支着下巴，一边打开昨晚好不容易整理好的文件夹，名称简洁明了的“北欧旅行”文件夹里，有经过芬兰、瑞典、挪威、丹麦、以及冰岛等五个国家后，重新回到韩国的长途旅行日程表。<br><br>等一下，这个行程怎么回事，再看一遍，被过去的自己安排的恶劣行程弄得头晕目眩。去芬兰郊区的夜间列车不害怕吗？听说列车是两人一室，和奇怪的人成为室友怎么办。难道为了骑一次哈士奇雪橇，要承担这样的危险吗？哥本哈根又为什么只定了一个晚上？这样坐船移动一整天的理由是什么？本来就听说邮轮因为喝醉酒的人，晚上乱得很，难道不会被关在房间十几个小时吗？预约的时候没仔细想，排定这个行程完全就是让身体受苦。就算再没有海外旅行经验也不能这样，过去的金旼炡到底在搞什么。<br><br>「...看来是去北欧旅行啊」<br><br>陷入恐慌的旼炡，听到旁边低沉的嗓音后，好不容易回过神来。发现知珉播放着阿拉丁但根本没在看，而是用圆圆的，充满好奇心的眼神，盯着别人的旅行日程表。就这样，两人在黑暗中再次进行了简短的对话。嗯、一个月左右。去挺久的啊。<br><br>「这是哪里？」</p><p class="story-paragraph dialogue"><br>「冰岛」</p><p class="story-paragraph dialogue"><br>「哇、好漂亮」<br><br>前辈如此心心念念的极光。旼炡之所以到冰岛旅游，是好奇那风景有多震撼人心。如果把这些都装进眼底，好像就能毫无留恋地忘掉过去的记忆。无论如何，至少旼炡已经摆脱了停滞不前的生活，现在到了要抵达目的地的时刻。如果用蹦极打个比方，现在的自己已经连绳索都系上，还瑟瑟发抖地爬上了顶端。<br><br>「去看极光，因为是我的愿望清单之一」<br><br>自己一边回忆往事，还沉浸在感伤之中——结果知珉根本没有在听，喃喃自语。北极狐，没错、长得像北极狐。<br><br>「什么？」</p><p class="story-paragraph dialogue"><br>「啊、没事，自言自语而已」<br><br>什么呀？在说什么啊？<br><br>知珉说她的目的地不是赫尔辛基而是伦敦。原因是为了见交往2年的男朋友。虽然自己完全不感兴趣，但还是先假装好好听别人说，这也许是和尚勋分手后认识的人。知珉虽然讲述了一段自己的恋爱史，但比起伦敦，他更关心北欧，连连嘟囔着。</p><p class="story-paragraph dialogue">「真好啊，竟然去北欧旅行」<br><br>「...」</p><p class="story-paragraph dialogue"><br>「亲眼见到的极光，真的会像这张照片一样漂亮吗？」</p><p class="story-paragraph dialogue"><br>「因为是专业摄影师拍的...说实话，应该不会这么华丽吧」</p><p class="story-paragraph dialogue"><br>「反而是相反吧？」</p><p class="story-paragraph dialogue"><br>「相反？」</p><p class="story-paragraph dialogue"><br>「也可能是照片只有办法展示这个程度的美」</p><p class="story-paragraph dialogue"><br>「心态真是意想不到的积极啊」</p><p class="story-paragraph dialogue"><br>「你是不是看得太消极了？」</p><p class="story-paragraph dialogue"><br>「毕竟并不是去到冰岛就能看到。能不能看见极光全凭运气」</p><p class="story-paragraph dialogue"><br>「不是说这是愿望清单吗？既然要去就往好处想吧」<br><br>所谓的“全凭运气”就是事实。所以所有游客都是极光猎人，也就是去猎捕极光的人。去看极光的人，都是在地球磁极上的猎人，谁也不知道狩猎结果。即使在冰岛呆上足足一周，旼炡也不能保证成功或失败。<br><br>「怕会失望，所以不想太期待。毕竟也可能看不到」</p><p class="story-paragraph dialogue"><br>「别担心，一定会看到的」<br><br>「...」</p><p class="story-paragraph dialogue"><br>「还有就像我说的，亲眼目睹或许会比照片上漂亮很多也说不定吧？」<br><br>虽然这句安慰的话毫无根据，但就算只是听着知珉轻声说道，旼炡就放下心来了。事实上，这也是一直想从某人口中听到的话。别担心，这次旅行会没事的。<br><br>「不过你是自己一个人去吗？」<br><br>点头表示独自一人时，知珉称赞自己太厉害了。反正姐姐也要一个人在伦敦生活一个月了。不加修饰直接说出事实，这才仿佛领悟到现实的知珉，一下子变得垂头丧气。是啊、是那样没错...<br><br>「真的很突然」<br><br>「除了男友我在伦敦没有一个认识的人」<br><br>我也是。下了飞机的话，就没有人能这样和我说话了。<br><br>旼炡向知珉说，自己正在休学，因为舍不得几个月的打工钱才来旅行的。没想到，两人的谈话时间一长，埋藏在心底的情感瞬间涌上心头。就像在山林隐居，刚出山一样，这是第一次和别人坦白自己的分手旅行，所以有点兴奋。虽然已经筛选过可以说的东西，但是不必要的话却不断冒出来。<br><br>「本来就不是想自己一个人去的」<br><br>旼炡现在只有孤单一人。因为是一个人出发的旅行，所以整段旅程要一直独自生活。即使现在耳机突然没声音、从架子上拿出沉重的背包都有知珉帮忙，但今后面对到的问题，都只能靠自己来解决。这甚至是自己第一次到这么远的地方，所以更是害怕。因为谁也不能保证，独自来到陌生的城市，会面临什么突发状况。</p><p class="story-paragraph"><br>怎么办，现在没有人会待在自己身边了。在语言不通的地方，一个人该怎么度过一个月呢。如果去冰岛之前突然想放弃一切、一了百了怎么办呢。究竟是不是真的系好了蹦极绳？我可以就这么跳下去吗？其实现在有点害怕，万一没看到极光，心情低落地回国后，接下来呢？<br><br>为了享受而出发的旅行，自己脑中先想到的却是恐惧。虽然很可悲，但真实的想法确实如此。不管怎样，知珉因为男朋友突然出差，出现了一个月的空白期，北欧旅行也正好是一个多月。现在两人在飞往赫尔辛基的飞机上偶然相遇。四年前第一次遇见的刘知珉，兜兜转转才认识了金旼炡。那么——<br><br>延续这个偶然，应该也不错吧？<br><br>「...不一起去吗？」</p><p class="story-paragraph dialogue"><br>「嗯？」</p><p class="story-paragraph dialogue"><br>「刚才看你英语说的不错」</p><p class="story-paragraph dialogue"><br>「所以说，你是问我这一个月...要不要一起旅行的意思吗？」</p><p class="story-paragraph dialogue"><br>「不是说时间过得很快吗？而且一个月时间也刚好」<br><br>虽然是我亲口说出来的，但确实是奇怪的理由。谁会以英语好为理由，让旁边不熟的人当旅伴呢。知珉可能听到突然的提议很慌张，自言自语道，那个只是...<br><br>「想想看吧，下飞机时再回答我」</p><p class="story-paragraph">很怕马上就听到拒绝的话，旼炡带着逃避的心态，重新打开了电影。为了无视知珉目瞪口呆的表情，还故意把耳机音量调到最大。刚才暂停的电影画面，出现了耗费大量制作费的大规模枪战。<br><br>知珉默默地看着屏幕画面，呆呆地看向自己，又重新戴上耳机。恰巧旁边的屏幕上出现的，是看过阿拉丁的人都知道的名场面。阿拉丁向茉莉伸出手，乘着魔法飞毯在夜空中翱翔——<br><br>两人坠入爱河之前的浪漫邂逅。<br><br>-Do you trust me？</p><p class="story-paragraph dialogue">-What did you say？</p><p class="story-paragraph dialogue"><br>-Do you trust me？</p><p class="story-paragraph dialogue">-...Yes.<br><br>茉莉犹豫了一下，握住阿拉丁的手，魔毯飞向天空。那一瞬间，旼炡小声地哼着歌，谁也没听见。只是脑中浮现出现在知珉的耳机里，应该会响起的甜美旋律。<br><br>I can show you the world<br>shining,shimmering,splendid<br></p><p class="story-paragraph">我可以带你看看<br>这闪烁、璀璨、绚丽的世界<br><br>Tell me,princess,<br>now when did you last<br>Let your heart decide<br><br>告诉我吧公主<br>你最后一次听从自己心中所想</p><p class="story-paragraph">是什么时候<br><br>但是，当茉莉愉快的魔毯兜风结束，再次回到王国的瞬间，知珉似乎已经看完想看的内容，便点了点头，很快就关掉了画面。觉得可惜的是旼炡，就像正在KTV热唱，突然有人切歌一样。可能是剩余的时间想睡个觉，知珉慢慢靠在椅背上，闭上了眼睛。<br><br>飞机上静悄悄的，飞行高度越高，耳朵越是耳鸣。旼炡摘下厚重的耳机，反复张口闭口。知珉可能是已经睡着了，毫无动静。不管怎么想，歌曲被打断就像刚才耳机坏掉的瞬间，实在非常可惜，只能用嘴型小声地接着唱后面的部分。<br><br>虽然自己眼前的画面血迹四溅、各种连环爆炸，但心里却想象着，和谁一起飞越美丽的阿格拉巴沙漠。</p><p class="story-paragraph">I can open your eyes<br>Take you wonder by wonder<br><br>我能打开你的视野<br>带你遨游各个奇妙的地方<br><br>Over,sideways and under</p><p class="story-paragraph">On a magic carpet ride</p><p class="story-paragraph">乘坐魔法飞毯</p><p class="story-paragraph">无论上天下海<br><br>这是一段非常浪漫的求爱歌词。但旼炡没有魔法飞毯，在巨大的飞机上浪费着昂贵的油，一边在天上飞一边唱着“坐飞毯兜风”的歌，实在有点搞笑。平时若是爱情电影，旼炡根本毫无兴趣，但唱着迪斯尼风格的情歌却让人心潮澎湃。<br><br>冰岛的极光能代替神灯精灵实现愿望吗？结束旅行后21岁的金旼炡，会比现在过得更好吗？<br><br>谁知道呢。就算像是知珉说的往好处想，这个问题对现在的旼炡来说，还是很难回答。瞬间脑中放映出夜空下的绿洲，变得不再浪漫，只感受到孤独。如果直面现实，金旼炡既没有魔法飞毯，也没有可爱的猴子朋友，也没有神灯精灵，只是个孤独的阿拉丁。<br><br>这一点也不浪漫不是吗。</p><p class="story-paragraph"><br>最重要的茉莉在哪？<br><br>这时，右肩嘟地一下，感觉到重量。接触到肩膀末端的是知珉的头，不晓得今天到底要打扰自己几次，时隔许久才在迪士尼动画投入感情。旼炡说不出话，只是朝倚靠在自己肩上的侧脸看了一眼。<br><br>然而她的脑袋像在点头行礼，总是往前倾。从近处观察，她的脖子还长，更让人感到不安。怕这样下去会扭到脖子，旼炡轻轻地把手伸向知珉的额头。<br><br>「啊啊...真是的」<br><br>知珉似梦非梦，只要一碰触到脸就下意识吐出“哦，对不起...”。在这种情况下，怎么还能坚持真诚地道歉呢？旼炡愣愣地望向知珉，呢喃道。<br><br>「越看越像个奇怪的人」<br><br>「...」</p><p class="story-paragraph dialogue"><br>「为什么总说对不起呢？」</p><p class="story-paragraph dialogue"><br>「...」</p><p class="story-paragraph dialogue"><br>「你知不知道自己在向谁道歉啊...」<br><br>没期待她会和自己对话，果然也是如此。她刚把头抬回自己的位置上，过没几分钟，长长的脖子又重新落回自己肩膀。<br><br>真是的。早知道身边会坐着一个这样控制不住脑袋的人，就带个坐飞机用的颈枕了。看着她边说梦话，好像睡得并不深，旼炡便放任知珉把头靠在肩上。<br><br>光线很刺眼吧，要不要把电影关掉？苦恼了一会后，旼炡将视线转向了正面的屏幕上。电影中的城市已经变成了废墟，只剩下枪战后的残骸。暂且不说剧情，连一个动作戏都没看到，就出现了庄严的结尾。这样的话，就没有选动作片的理由了啊。<br><br>「...都是因为姐姐，所有精彩部分都错过了啊」<br><br>旼炡小声抱怨完，关掉了屏幕。两人周围变得更加漆黑和寂静。这样黑暗的环境下，无论是谁都能睡得很香。可能是高度越高湿度越低，与刚坐飞机时相比，脸部感觉更加干燥。知珉也许是喉咙有点干，皱着眉头小声地咳了几声。<br><br>头顶上的风是不是对人吹了？不穿外套就睡觉，看起来很冷。旼炡伸手将两个座位的空调风力减到最小。咳嗽也渐渐停下来，又听见她恢复平静的呼吸声。<br><br>旼炡用手稍微摸了一下自己的脸颊。虽然用尽办法挡住了风，但空调仍让皮肤变得干燥。阿格拉巴的沙漠会比飞机内部更干燥吗？阿拉丁和茉莉的皮肤还好吗？实际情况下，如果在沙漠中乘坐飞毯，会不会被风沙吹得睁不开眼呢？感觉自己不能去沙漠了。就这样，脑中净想些没用的东西。</p><p class="story-paragraph">啪——<br><br>这时，某人突然踢了小腿，胡闹着。无意中还发出了呻吟。旼炡双手熟练地抓住她的腿骨，让知珉只能在狭窄的座位上蹬着膝盖。偏偏她还傻乎乎的穿了马丁上飞机。<br><br>「真是...睡觉习惯真糟糕」<br><br>毫无空隙的座位间距，对身旁的人来说似乎太窄了。知珉继用脚踢，可能腰部也不舒服，还翻来覆去。旼炡只能在黑暗中摸索着，找到了她的座位扶手，碰到突起的座椅按钮。小心翼翼地按下按钮后，知珉的椅背开始向后倒。</p><p class="story-paragraph"><br>现在椅子一前一后，反倒换成靠在脖子上不舒服，旼炡只好将自己椅子也往后移。就这样一点一点、交替着把两个椅子的椅背都往后挪，背上的负担也减轻许多。<br><br>早知道这样就好了。<br><br>干嘛为了连我的名字都记不得的人，做到这种地步？心中不免对自己发起牢骚。多亏旼炡伸出援手，让知珉能躺下、舒服地睡觉。谁知她竟然得寸进尺，把身体扭向自己侧躺，甚至干脆把上身靠过来。可能是刘海盖到眼睛，偶尔会摇摇头。旼炡小心翼翼地伸手拨开知珉的碎发。手碰到她圆圆的耳朵时，深垂的睫毛微微颤动。旼炡帮她把头发撩到一边，用比刚才更小的声音低语。<br><br>「那个，刘知珉小姐。以防万一先告诉你」<br><br>「...」</p><p class="story-paragraph dialogue"><br>「都是因为姐姐，我现在也开始困了...」<br><br>「...」</p><p class="story-paragraph dialogue"><br>「我们说不定会靠着对方的脑袋睡觉」<br><br>只是想说，睁开眼睛的时候不要被吓到了。即使耐心与她搭话，知珉也只用呼吸声代替了回答。说出来有些不好意思。每当低沉的呼吸声在耳边响起时，体温就会上升，以至于完全无视了机舱内干燥的空气。</p><p class="story-paragraph dialogue">「我已经先说了」<br></p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue"><br>「总之，晚安」<br><br>这时，耳边听见了小声的“呃嗯”。难道是醒了吗？忐忑地看向身边，原本安静的知珉，胳膊直接伸到旼炡胸前，接着环绕后颈。难道是在梦里抱着什么吗。这下子旼炡成了只小熊玩偶，被睡觉习惯恶劣的主人欺负，只能眨眨眼睛。<br><br>「在别人的肩膀上这样翻来覆去，是不是太过了...？」<br><br>「...对不起」<br><br>在睡梦中无力的道歉声有点可爱，让人不禁笑了出来。<br><br>「...道歉就到此为止，快睡吧」<br><br>对于混杂着回忆的香水味，可能闻久已经习惯，所以不再那么在意。现在搭乘的不是用魔法飞毯，而是用坚硬的钢铁复合材料制造的飞机，默默提高了飞行高度。旼炡一边在脑海里哼唱，一边慢慢地闭上了眼睛。<br><br>But when I&#x27;m way up here<br>It&#x27;s crystal clear<br>That now I&#x27;m in a whole new world with you</p><p class="story-paragraph">但当我飞到这么高的地方</p><p class="story-paragraph">一切都变得明确</p><p class="story-paragraph">我与你已经到了一个全新的世界</p><p class="story-paragraph"><br>那一夜，做了一个很短的梦。</p><p class="story-paragraph"><br>眼前星星布满整个夜空。脚下的不是沙漠，而是陌生的城市夜景。刹那间，一道道天际线一遍又一遍地掠过。来不及好好欣赏风景，就顺着横跨城市的水路离开了。过不久，灯光逐渐消失，眼前出现大海。穿越云层飞了许久，只见远处有一片洁白的雪原。</p><p class="story-paragraph"><br>那块耀眼的土地彷彿永远都是冬天，天空中布满了梦寐以求的极光。比起一直以来见过的照片，极光闪烁着更加鲜明的湛蓝光芒。</p><p class="story-paragraph"><br>乘着风飞行的过程中，丝毫感觉不到寒冷。心里对这陌生的冒险完全不感到害怕，在开心的兜风过程中，旼炡与某人亲昵地肩并肩。那个人大概是茉莉吧？只隐约记得，她那乌黑的长发，随风飘扬的样子——<br><br>这是非常甜蜜的夜间飞行。<br><br>每一瞬间都感受到喜悦和幸福，<br><br>如果可以，永远都不想醒来。</p></div>
      </section></template>

<p class="lyric-line">这一切都因为是你</p></div>

        <div class="chapter-copy"><p class="story-paragraph dialogue">「不都说了一个月前已经分手了嘛」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「现在什么关系都不是」</p><p class="story-paragraph">这至少不是说谎，虽然听起来像是辩解，但也没办法。</p><p class="story-paragraph dialogue">「明明说什么关系都没有…还乖乖回复」</p><p class="story-paragraph">但听的人看来根本不相信，真冤枉。除了让她别联系我以外，没有其他回复了。旼炡在电话那头，像哄孩子一样轻声说道。姐姐，你好像喝醉了。</p><p class="story-paragraph dialogue">「不要总是转移话题，我真的很清醒」</p><p class="story-paragraph">模糊的画面，稍微泛红的脸蛋，比平时更沉静的嗓音。眼前看到的一切都令人不安。我现在去接你。旼炡急切地喊道，然而突然间，屏幕上的小脸索性消失在画面外。自己因此成了对着一片漆黑自言自语的人，旼炡无奈地叹了口气。喂，刘知珉小姐，哪有人在视频通话时把镜头盖上的，就是因为想见你，才打的电话，怎么能这样？</p><p class="story-paragraph">当然，知珉的突发行为也让人惊慌失措，但更让人无力的是，阻拦两人的只是这一堵小小的墙。怕电话被挂断，旼炡把嘴对准收音孔，焦急地喊道。姐姐、姐姐，不要挂电话，等一下。</p><p class="story-paragraph dialogue">「旼炡啊，我再问你一个问题」</p><p class="story-paragraph dialogue">「…问吧」</p><p class="story-paragraph dialogue">「我们...坐火车的那天」</p><p class="story-paragraph">演出结束后，爵士乐队的气氛非常融洽。酸酸的白葡萄酒，几乎只喝了一口就摆在桌上。旼炡看着前面甜蜜相拥的恋人们，等待着知珉要说的下一句话。</p><p class="story-paragraph dialogue">「那天…」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「…为什么吻我？」</p><p class="story-paragraph">当我听到她颤抖的声音时，正好传来了欢快的爵士乐。或许是首能跟着伴奏、节奏感极强的爱情歌曲。但是现在，已经没有时间像平时那样玩手指了。</p><p class="story-paragraph">好想你。</p><p class="story-paragraph">好想见你。</p><p class="story-paragraph">只有声音已经不足够了。</p><p class="story-paragraph">见面再说吧，知道了吗。单方面挂断电话，旼炡开始狂奔。摘下了妨碍行动的贝雷帽，握在手里。推开门，照耀斯德哥尔摩的阳光已经消失，朦胧的月光照映在云上，是黄昏连接到夜晚的暧昧时段。旼炡呼吸着冰凉的空气，脑中浮现一些荒唐的事。</p><p class="story-paragraph">也许，现在才是开启这一天的瞬间。</p><div class="location-badge"><strong>Rewind : Dawn in Stockholm</strong><span>倒回 ：斯德哥尔摩 清晨</span></div><p class="story-paragraph">站在空荡荡的公车站牌前，内心十分焦急，一直不见开往目的地的巴士。因此下一班能到目的地附近的车一来，旼炡就马上上车了。被淹没在身穿大衣的乘客中，稍稍喘了口气，想起了刚才的对话。</p><p class="story-paragraph">这么长的通话还是第一次。到目前为止，两人一直在一起，这也是理所当然的。每天晚上都觉得，知珉和男朋友打电话的样子看起来十分厌倦。但今天和自己通话那无力的声音，比任何时候都更加陌生。</p><p class="story-paragraph">两人之间刚有了规律的生活模式。比如，结束当天的旅行回到家后，知珉会默不吭声直接先进入浴室。洗完出来后，将头发往上扎起，披上一件白色开衫，在脸上轻轻贴上面膜，然后在床上做起伸展运动。</p><p class="story-paragraph">旼炡啊，姐姐可以通电话吗？</p><p class="story-paragraph">即使自己点点头说没关系，她还是会再问一次：如果会吵到你，要不还是出去吧？外面没有地方可去，所以就直接在房间里打吧。重复一遍后，这时才会拨电话。连续好几天，每天都会寻求许可，这样的诚意在某种意义上来说很了不起。</p><p class="story-paragraph">等到开始和远距离男友通话，就是谁都能预想到的对话。内容一半以上是每天日程的简单罗列。很抱歉这么晚才联系你，等很久吧，今天去购物了...多亏后辈，好不容易找到了包包。知道了，我会好好打起精神的。哥哥没什么事吗？是啊，肯定很累。</p><p class="story-paragraph dialogue">「晚安...再联系吧。我也爱你」</p><p class="story-paragraph">通话从不超过所需的时间，必会在一定的期间内结束。甚至在挂电话时所有问候语，都和前一天说过的一字不差。没什么事吗？累了吧，那我先挂了。我也爱你。</p><p class="story-paragraph">就像父母每天晚上给孩子问候一样，每次重复的话，连旼炡听起来都有些无聊。虽然声音听起来亲切，但脸上却笑得不那么灿烂。即使好似深情地每晚通电话，但连嘴上说”想你了” 这种爱意表达，却从来都毫无真心。然而这样的刘知珉。</p><p class="story-paragraph">呀、金旼炡。你懂什么？</p><p class="story-paragraph">你知道我一整天都在想什么吗？</p><p class="story-paragraph">竟然用像孩子闹脾气的声音这么说。直率表达嫉妒的刘知珉，把心中的情感原封不动地表露的刘知珉。初次见到这样陌生的你，到底是从哪冒出来的呢？</p><p class="story-paragraph">和焦急的心情相反，公车停了好几次红灯。在北欧并不复杂的交叉路口，车子却始终无法向前行驶。从后面陆续响起喇叭声。</p><p class="story-paragraph">都已经过了十分钟，还去不了下一个站牌，这像话吗。难道是前面出了车祸吗？与其在路上浪费时间，走过去会不会更快？经过一番思考，旼炡按下下车铃站了起来。但是从公车上急忙赶下车的瞬间，随着“咚”的一声钝响，视线开始摇晃，手赶紧撑在柏油路面。</p><p class="story-paragraph">幸好没有直接摔倒，只是稍微拐了一下。但因为这一下，脚踝刺骨的疼，好像完全扭伤了。虽然时间紧迫，但也由不得自己，在疼痛消失之前只能稍作停留。都怪脚上的鞋子，连跑跳都没办法。早知道就穿原来的匡威去爵士酒吧，偏偏穿了带过来的皮鞋。</p><p class="story-paragraph dialogue">「真是的...再也不穿这种东西了」</p><p class="story-paragraph">突然，心里对刚才还看得很开心的演出感到生气。要不是去爵士吧，就不会陷入这样的境地。因为爵士酒吧而吵架，因为爵士酒吧一整天都没能见面。早知道就听刘知珉的不去了。自从来到斯德哥尔摩之后，好像没一件顺利的事。旼炡从头到脚穿着别扭的半正装，还是扶着脚踝站了起来。毕竟现在已经没空发牢骚了。</p><p class="story-paragraph">到了河边的路旁，大风刮得树叶随处乱飞。寒气逼人，旼炡赶紧戴上贝雷帽。用双臂紧紧环住自己瑟瑟发抖的肩膀，加快了脚步。见面后该说什么好，她的脸，会不会像早上那样生气呢？会不会问自己为什么这么晚才来呢？带着种种想法，朝狭窄又陌生的小巷走去。但是眼前出现的是——</p><p class="story-paragraph">好像一碰就会倒下般，脆弱的知珉。</p><p class="story-paragraph">鹅黄路灯下昏暗的阴影、靠在墙上微微仰着头、适当地扎好的头发之间，微微露出的碎发、喝醉了有些泛红的双颊。大冬天穿着薄薄的牛仔夹克，里面是宽松的黑色连帽衫，在紧身裤的末端露出了白皙的脚踝，靠在墙上无心地用脚后跟敲着地板的马丁靴。</p><p class="story-paragraph">只想抱抱你。</p><p class="story-paragraph">旼炡冻得雪白的脸上先是出现怒气。到底为什么那么无力地靠在墙上呢？即使小心翼翼地靠近，知珉也没有开口说话，只是用呆呆的眼神注视着自己。</p><p class="story-paragraph dialogue">「干嘛这么盯着我看？」</p><p class="story-paragraph dialogue">「看到你吓了一跳」</p><p class="story-paragraph">旼炡真是打扮得很漂亮去玩啊，还化了之前没化过的妆。一直面无表情站着的知珉突然露出淡淡的笑容。今天初次见到的笑脸，寒碜得不像样。</p><p class="story-paragraph dialogue">「...但是那些人呢」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「说要跟姐姐一起去喝酒的人，在哪里啊？」</p><p class="story-paragraph dialogue">「啊、那个...其实是骗你的，跟你打电话的时候，早就拒绝了」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph">哈。真是无语，不禁失笑出声。人家扭伤了脚，还一瘸一拐地跑过来，结果什么？竟然说在店里就拒绝了。不是说要和不认识的男人们一起喝酒的吗？她原来就是这样的人吗。刘知珉今天脸皮真厚，让跑过来的人显得多么可笑。又不是把人当傻瓜。为什么要说谎？知珉立即扬起一边眉毛，调皮地笑着说。</p><p class="story-paragraph dialogue">「想看到你这幅表情」</p><p class="story-paragraph">总算比刚才那样淡淡一笑要好，但心情还是没有变好。</p><p class="story-paragraph dialogue">「但是姐姐，等一下」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「…你站在这里多久了？」</p><p class="story-paragraph">知珉似乎在寒风凛冽的小巷内，待了整整20分钟。在这样的情况下，她竟然摸着自己的头发说“没过多久”，就像毫不在意，真令人无话可说。那算没过多久吗？我要是坐在公车上再晚点来你怎么办？是傻瓜吗？为什么像个无处可去的人一样待在外面。旼炡本想发火，但看到她泄气的脸，就只是温柔的回答。</p><p class="story-paragraph dialogue">「等了很久啊，明明不知道我什么时候会来，就不该盲目地在外面等的」</p><p class="story-paragraph dialogue">「你是在担心我吗？」</p><p class="story-paragraph dialogue">「担心是...随时都在担心啊」</p><p class="story-paragraph dialogue">「随时？」</p><p class="story-paragraph dialogue">「...当然是一整天，傻瓜啊」</p><p class="story-paragraph">发着牢骚低下了头。一张看不出她是高兴还是难过的脸，在视线尽头被收进眼底。她的嘴角微微颤抖，彷彿在挑选合适的话语。路灯的火光在头顶上闪烁。</p><p class="story-paragraph dialogue">「你一整天有在想我，还是没在想我...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那个我怎么知道？」</p><p class="story-paragraph">看着知珉依然含糊的微笑，旼炡心里不舒服。早上还在生气的你，一整天到底发生了什么事，才变成这副表情呢。连每天吃得饱饱的早饭都没吃，还把红茶倒进水槽，说着“我不去”推绝的冰冷语气。真幼稚。你才是从昨天开始一次也没有对我笑过。</p><p class="story-paragraph">我不是为了看你笑得那么痛苦的脸，才来到这里的。</p><p class="story-paragraph dialogue">「…只有你对我表现出来，我才能知道啊」</p><p class="story-paragraph">知珉一脸愣愣的表情，垂下的双臂抬起，伸向半空中。摆动的手指似乎在让旼炡快过来，旼炡不禁轻轻一笑。</p><p class="story-paragraph dialogue">「…怎么突然张开手臂？」</p><p class="story-paragraph dialogue">「过来，我冷」</p><p class="story-paragraph dialogue">「是啊，早上就让你穿我的外套出去的。这种天气穿一件夹克出门，是吃错药了吗？」</p><p class="story-paragraph dialogue">「…都说冷了，旼炡啊快过来」</p><p class="story-paragraph">脸靠在右肩上，散发着思念已久淡淡的香水味。本想抱住她，结果变成了被拥抱的人。如果这样依偎在怀里撒娇的话，会喜欢吗？但是对方的身体像冰块一样冷，又让自己开始烦躁起来。如果像平时一样戴着围巾和毛帽出来的话，至少能摘下来给她戴上保暖的帽子。今天偏要去爵士酒吧，偏偏穿上这身衣服。旼炡自责地推开了知珉的肩膀。太冷了，先找个室内再聊吧。但是知珉好像对这句话听而不闻，紧紧抓住自己的手腕。手的动作略显粗糙，不禁皱起眉头。</p><p class="story-paragraph dialogue">「你去哪里啊？」</p><p class="story-paragraph dialogue">「太冷了，找找能进到室内的地方吧」</p><p class="story-paragraph dialogue">「...你不要自己决定」</p><p class="story-paragraph dialogue">「知珉姐姐，没开玩笑是真的很疼，放开我」</p><p class="story-paragraph">预想过她不会乖乖地放手，然而接下来地行动更是出乎自己意料之外。知珉别说放手了，直接把自己的手拉到唇边。没给反抗的机会，她红色的嘴唇在手背上慢慢地擦过。</p><p class="story-paragraph">很陌生。</p><p class="story-paragraph">手上令人惊慌的力度也是、绝对不放过我，那沉静地生气的脸庞也是。在亲吻手腕的过程中，一直盯着自己不放的视线也是、比平时更加深邃的瞳孔也是。我找到的这个等待已久的刘知珉，是对的人吗？刚才打电话时哽咽的人是刘知珉，现在眼前站着的也是刘知珉？</p><p class="story-paragraph">真的吗？</p><p class="story-paragraph dialogue">「但是你为什么一直在躲我，你要退后到哪里去？」</p><p class="story-paragraph dialogue">「...有点害怕，今天」</p><p class="story-paragraph dialogue">「害怕吗？」</p><p class="story-paragraph dialogue">「嗯，姐姐简直像另一个人」</p><p class="story-paragraph">那句话之后陷入暂时的沉默。深深的阴影下看不清表情，知珉就那样望着地面，喃喃自语。说不定我就是别人，金旼炡记忆中的刘知珉…可能去哪玩了会儿吧。</p><p class="story-paragraph">不知道是玩笑还是真心话。面容憔悴的知珉一步一步走近，自己只能踌躇着后退，直到背抵在硬邦邦的墙上。双眼之间不知不觉已经近到一个手掌的距离。抓住的手总是使劲。</p><p class="story-paragraph dialogue">「如果我放开这只手，你会怎么做？会逃跑吗？」</p><p class="story-paragraph dialogue">「我为什么要逃跑？」</p><p class="story-paragraph dialogue">「你是不是又会装没事，什么都不做？」</p><p class="story-paragraph">她是一个很容易理解的人。</p><p class="story-paragraph">很温柔，不太会说谎，而且很容易慌张和结巴。在与其他人打交道时很笨拙，是个很容易能看透内心的人。但也许是自己太过自负，越看越不了解刘知珉这个人。</p><p class="story-paragraph dialogue">「如果在这里躲开我的话，旼炡啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我们之间应该就什么都不是了吧。对吗？」</p><p class="story-paragraph">现在很难用一句话来形容你。</p><p class="story-paragraph dialogue">「...姐姐是不是太不信任我了？」</p><p class="story-paragraph dialogue">「嗯，我不信。」</p><p class="story-paragraph dialogue">「真是太过分了」</p><p class="story-paragraph dialogue">「过分也没办法」</p><p class="story-paragraph dialogue">「...真是的，刘知珉。嘴上功夫倒是一次都不认输啊」</p><p class="story-paragraph dialogue">「为什么认为我会输给你？」</p><p class="story-paragraph">这才灿烂地扬起笑容的嘴角、和弯弯的眼尾，真有些可恶。一刹那，美丽的双眸立刻将笑意一扫而空，朝自己更加靠近。双唇中间散发着淡淡的柑橘香气。</p><p class="story-paragraph dialogue">「...虽然很抱歉但你今天跳不掉了，旼炡啊」</p><p class="story-paragraph">危险。用这种嗓音说话的话，是没办法拒绝的。</p><p class="story-paragraph">由于瞬间的力道过猛，后背再次贴上冰冷的墙壁。双唇丝毫没有松开的想法，呼吸急促。听到她比平时更加低沉的嗓音，兴奋感无法轻易平息。接受了钻进嘴唇的舌头，脑袋变得越来越混乱。</p><p class="story-paragraph">每当短暂地喘息时，如果连她口中散发的酒味都令自己感到晕眩，我是不是也变得有点奇怪了呢？没想到是个这么任性的人。而且其实很会说谎，只要和谁待在一起就会嫉妒。会突然在别人的手腕上留下口红印。很执着于过去的事情，占有欲也很强。光顾着说完想说的话，就像要把自己吃掉似的。</p><p class="story-paragraph">金旼炡记忆中的刘知珉真的是去哪玩会儿了吗？也许那句话说得没错。一个人发着呆、在街上说自己长得像娃娃，独自拍手大笑，像傻瓜一样的刘知珉。还有把包忘得干干净净，垂头丧气地发着呆的刘知珉。以及不专心听别人的话，一直想别的事情，说着奇怪的话的刘知珉，现在去哪儿了？</p><p class="story-paragraph">如果到现在为止的样子都是假的，如果这才是真的刘知珉怎么办？</p><p class="story-paragraph">耳边回荡粗重的呼吸声，心跳不停加速。热气腾腾的气息一松开，马上和散乱的视线对上。可能是头发有些碍眼，她微微皱起一边眉毛。继续凝视那双深邃眼眸，好像就会被吃掉一般。</p><p class="story-paragraph">今晚你陌生的模样，为何让我如此颤动。</p><p class="story-paragraph">好像真的弄错了。</p><p class="story-paragraph">现在似乎已经无法挣脱了。</p><p class="story-paragraph">松开嘴唇后，视线向下默默不语，让自己两颊发烫。如果继续对视，脑海中羞涩的话语似乎要脱口而出。怀着比平时更坦诚的欲望，为了表达想继续接吻，紧紧拽住知珉的夹克袖子。</p><p class="story-paragraph">这样的表情只想我一个人能看到。</p><p class="story-paragraph">在这之后，两人手牵着手，漫无目的地走在斯德哥尔摩的深夜路上。</p><p class="story-paragraph">旼炡说，今天感觉身体特别轻盈。并不是心情所致，而是因为在半大衣上没有像平时的羽绒服有宽大的口袋。现在大衣的口袋内，只装了手机和钱包。换句话说，就是穿着简洁，无可奈何只能将必须品全部放在宿舍。唇膏啊、充电器啊等等。凌晨的空气使嘴唇变得越来越干，正好看见知珉在擦润唇膏，马上伸出手。</p><p class="story-paragraph dialogue">「姐姐，我也要润唇膏」</p><p class="story-paragraph dialogue">「没带吗？」</p><p class="story-paragraph dialogue">「…我今天什么都没带出门」</p><p class="story-paragraph">早就让你出门时带个包。在责怪中打开润唇膏的盖子后，彷彿芳香蜡烛般散发出甜甜的茶香。刚才嘴唇贴近时飘来的淡淡香气，大概是就这个吧。好闻的香味再闻一次，接着才盖上盖子。</p><p class="story-paragraph">两个人在寒冷的凌晨正面迎着冷空气散步，没有什么理由，只是为了度过两人的亲暱时光，所以故意在宿舍周围徘徊。这么晚了，多人间的灯肯定关着。旼炡想着在各方面都没有帮助的室友，在潮湿的河边游荡。</p><p class="story-paragraph">走着走着，扭伤的脚踝越来越疼。忍不下去，只能坐在附近的长凳上，脱下鞋子。脚踝肿了是个问题，但疼痛主要原因，是整天穿着新皮鞋，脚后跟都磨破了。一碰皮肤被磨得红肿的后脚跟，不禁皱起眉头。</p><p class="story-paragraph dialogue">「怎么了？脚疼吗？」</p><p class="story-paragraph dialogue">「都是因为皮鞋...」</p><p class="story-paragraph dialogue">「脚后跟磨破了吗？」</p><p class="story-paragraph dialogue">「有一点」</p><p class="story-paragraph dialogue">「我看看」</p><p class="story-paragraph">知珉小心抬起脚踝，叹了口气，用温柔的声音责备自己。傻瓜，这不是都破皮了嘛。然后忙着翻找包包，喃喃自语。等着吧，姐姐连这些都带了。甚至像医生一样拿出一个透明袋子，露出得意洋洋的表情。帮自己小心翼翼地贴上创可贴，再紧紧按住。</p><p class="story-paragraph dialogue">「刚才莫名往你手腕上哈气了吧？早知道在脚踝上呼就好了」</p><p class="story-paragraph dialogue">「不要光说，现在做不就行了嘛」</p><p class="story-paragraph">本来只是说说而已，结果知珉真的呼- 地哈气到伤口上。可以吗？旼炡轻轻点点头。虽然伤口还是很痛，但是充满担心的语气和轻触皮肤的气息，让人心情愉快，所以紧紧地抱住双膝。</p><p class="story-paragraph dialogue">「姐姐今天是我的哆啦A梦呢」</p><p class="story-paragraph dialogue">「哆啦A梦？」</p><p class="story-paragraph dialogue">「什么都拿得出来」</p><p class="story-paragraph">如果一起出门的人准备充分，就会很自然地放下心来。最近，不管是什么东西，跟知珉借已成为习惯，导致独自出门的今天，不经意间就忘记带东西。幸好在爵士酒吧急急忙忙充到了电，一想到差点整夜都失去联系，就感到头晕目眩。正好，坐在一旁的哆啦A梦刘知珉小姐没错过这个机会，开始语重心长。旼炡啊，就是可能会发生这样的事，所以才让你一定要带着包，虽然你包里应该也没带创可贴。</p><p class="story-paragraph dialogue">「但是晚上手机重新开机后一看」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「早上互相发完自拍后...结果姐姐一个字都没给我发呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我有点伤心了，所以才打了视频电话的」</p><p class="story-paragraph">那个嘛，本来想发短信的，但因为你没有联系，还以为你一个人去爵士酒吧玩得很开心。不用辩解了吧？知珉见状迅速说了句对不起，赶紧示弱，但扬起的眉毛出卖了她。水润的大眼睛一眨一眨地盯着自己，想生气也无可奈何，因为那双眼睛太漂亮了。</p><p class="story-paragraph">总之，很庆幸姐姐在包里带了很多东西，谢谢。眯着眼睛说完，只见她表情立刻放松，扬起了嘴角。</p><p class="story-paragraph dialogue">「也可以把金旼炡放进哆啦A梦的口袋里」</p><p class="story-paragraph dialogue">「…我为什么要进去」</p><p class="story-paragraph dialogue">「想见你的话，就可以马上拿出来看了啊」</p><p class="story-paragraph dialogue">「这样随身携带要干嘛？」</p><p class="story-paragraph dialogue">「无聊的话，可以拿出来聊天。如果肚子饿哭闹的话，还会喂饭给你吃」</p><p class="story-paragraph dialogue">「我是什么电子宠物吗？」</p><p class="story-paragraph dialogue">「然后像现在这样嘀嘀咕咕的话，就重新放进去」</p><p class="story-paragraph dialogue">「总想一些奇怪的事情...真是的」</p><p class="story-paragraph">快点变得更小吧，从明天开始要把你装进姐姐包里。紧挨着自己坐在长凳上的知珉，挠一般轻抚自己的左脸。刚才好像要把自己吃掉似的，现在又逗弄着自己，笑得像个傻瓜一样，真是无语。会不会是真的有两种人格，但拜托一天就让一个出现吧。</p><p class="story-paragraph">这一天就这样稀里糊涂地过去了，心里非常不是滋味，旼炡趁着彼此贴坐在一起，字字句句吐露出心中不满。今天能和我一起去爵士酒吧就好了，早上散步的地方，其实是斯德哥尔摩有名的约会场所。还想着当然会一起去，毕竟姐姐喜欢红酒。</p><p class="story-paragraph dialogue">「所以才问姐姐要不要一起去的」</p><p class="story-paragraph dialogue">「...是吗？」</p><p class="story-paragraph dialogue">「除了我之外都是情侣...」</p><p class="story-paragraph">我们旼炡一个人应该很孤独吧？好像对这种程度的抱怨不在意似的，搔痒般摸了摸自己的脸颊，接着知珉非常坚决地说。可是，不管你怎么劝我，我也不会去的。</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「因为你早上和那个男人散步回来的时候，就已经够烦的了」</p><p class="story-paragraph dialogue">「所以连早饭都不吃；把我的外套丢下，就这么碎念着离开了吗？」</p><p class="story-paragraph dialogue">「我以为你至少会挽留我一次」</p><p class="story-paragraph">连收下个胶原蛋白都看起来那么不甘愿，脸上满是厌恶地离开的人，我还能怎么抓住。仔细想想，知珉在转移焦点方面挺有才能的。本想说出来，最后还是放了她一马。结果，因生气而独自扬长而去的人，似乎逮到了机会，开始滔滔不绝阐述起伤心事。但是旼炡啊，你怎么能跟着不认识的人去呢？如果真的是个奇怪的人该怎么办。下次别再那样了，我真的会生气的。</p><p class="story-paragraph dialogue">「总是跟奇怪的人跑掉的话，会在你脖子上套上项圈的哦？」</p><p class="story-paragraph dialogue">「怎么会有那种想法？」</p><p class="story-paragraph dialogue">「不是...我说的是狗狗用的那种项圈」</p><p class="story-paragraph dialogue">「那个听起来更奇怪」</p><p class="story-paragraph dialogue">「如果不是你跟谁跑了，我还会说这样的话吗？」</p><p class="story-paragraph dialogue">「那有这么奇怪的逻辑」</p><p class="story-paragraph dialogue">「总之，不要跟别人乱跑」</p><p class="story-paragraph">看她这气势，好像再跟着别人走，就要把自己关在家里了。不过目前充电器、创可贴等都是借的，所以旼炡只是乖乖地点点头，揉了揉扭伤的脚。知珉也随自己弯下腰，用担心的语气问。脚跟还好吗？怎么样？扭了扭脚踝，疼痛感好像比刚才减轻了不少，走起来不至于太费劲。</p><p class="story-paragraph dialogue">「好多了。因为贴得很厚，所以完全不疼」</p><p class="story-paragraph dialogue">「还疼的话要不回家吧？」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph">明明知道，就别问了。</p><p class="story-paragraph">这句话没有说出口，而是瞪着眼睛用视线代替了回答。不知是不是几年来的心电感应终于成功了，知珉无声地笑着不再多问，站起身子伸出手。</p><p class="story-paragraph dialogue">「知道了，那我们继续走吧？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">在凌晨的路上走了很久。空气渐渐变冷，手指有些僵硬。冷吗？那这样子吧？知珉把牵着的手伸进牛仔夹克，不停地揉搓。虽然夹克口袋的空间对于两人的手来说不太够，但是作为避寒的临时措施还算不错。走近寒冷的河岸边，不知不觉间，看见隐藏在市中心的广阔绿地。在公园的中心，高大的松树排成一排，形成林荫小径，向外延伸。</p><p class="story-paragraph">去那边看看吧？嗯。但是树真的好高啊，不像公园而是森林。原来北欧连在市中心都有这样的树林，真好。一边喃喃自语一边走着，突然知珉发现了什么，急忙拍了拍自己的胳膊。</p><p class="story-paragraph dialogue">「旼炡啊，你看看那边」</p><p class="story-paragraph">只见圆圆的坟墓密密麻麻，看见这阴森森的场景，旼炡不自觉停下脚步。</p><p class="story-paragraph dialogue">「姐姐、或许这里不是森林，是...」</p><p class="story-paragraph dialogue">「看来是公墓」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">重新闭眼再睁眼，连墓誌铭都看得一清二楚。还想说树怎么那么茂盛。两个人独处固然好，但实在没必要到一个活人都没有的地方来。寒风飕飕地刮，树枝颤动的声音显得颇为阴森。姐姐，我们转身出去好不好？放在口袋里的手紧握，望着墓园旁的知珉戳了一下自己的肩膀，压低了声音。</p><p class="story-paragraph dialogue">「要不要给你讲恐怖故事啊？」</p><p class="story-paragraph dialogue">「凌晨还要做胆量测试吗？别这样」</p><p class="story-paragraph dialogue">「其实我昨天被鬼压床了」</p><p class="story-paragraph dialogue">「让你别这样，看来连听都听不到...」</p><p class="story-paragraph">知珉接着说，昨天睡觉的时候看见了坐在椅子上的女人。只见脚在晃动，所以往上一看，结果没有头。乍听之下，像是网络怪谈，但现在却无法一笑而过。而且故事中的女人偏偏出现在我们房间。听到鬼魂的出没地点，瞳孔动摇的旼炡，尽量保持镇定问道。</p><p class="story-paragraph dialogue">「那...当时怎么做了？抓到了吗？还是跑掉了吗？」</p><p class="story-paragraph dialogue">「抓什么抓？鬼是蚊子吗？」</p><p class="story-paragraph dialogue">「那至少应该让它离开房间吧。姐姐做了什么？」</p><p class="story-paragraph dialogue">「因为太累了，当然是倒头又继续睡了一觉啊？」</p><p class="story-paragraph dialogue">「...重新睡着了吗？」</p><p class="story-paragraph dialogue">「是啊，都是因为昨天你倒下了，我接着替你开哈士奇雪橇，当然累了」</p><p class="story-paragraph dialogue">「我就是很怕冷，能怎么办...」</p><p class="story-paragraph">知珉挠着后颈说，今天也会出现鬼吗？不以为然地坐着。绝了，这样到底算是胆小还是胆大，真是个奇怪的人。这种情况下，正常来说不都是大叫或跑出去吗？</p><p class="story-paragraph dialogue">「你怕鬼吧？」</p><p class="story-paragraph dialogue">「与其去鬼屋，还不如待在公墓睁着眼熬夜」</p><p class="story-paragraph dialogue">「旼炡竟然比想象中要胆小啊？」</p><p class="story-paragraph dialogue">「对不起我就是胆小鬼」</p><p class="story-paragraph dialogue">「如果害怕的话，要不要和姐姐睡在一层的床上？」</p><p class="story-paragraph dialogue">「待在姐姐旁边感觉会看得更清楚，我还是在二层睡吧」</p><p class="story-paragraph">吵吵嚷嚷了一阵子，嗖地有什么东西从眼前闪过。两人同时僵住，互相凝视了一会儿，好不容易开口。</p><p class="story-paragraph dialogue">「旼炡啊，你看到刚才有什么嗖地过去了吗？」</p><p class="story-paragraph dialogue">「不，不知道。那边好像有什么东西在动...」</p><p class="story-paragraph dialogue">「会不会是人？」</p><p class="story-paragraph dialogue">「大半夜的，这里除了我们哪还会有其他人。拜托、拜托、拜托不要」</p><p class="story-paragraph">突然，从不远处又传来了树叶沙沙作响的声音，旼炡赶紧躲在知珉身后，脑袋飞速运转。是藏匿在墓地的罪犯？还是刘知珉梦中的无头女鬼跟来了？不管出现哪一个，不都是最糟的情形吗？</p><p class="story-paragraph">姐姐，我们快出去吧。虽然拉了拉牵着的手，但知珉看上去炯炯有神，丝毫没有害怕的样子。</p><p class="story-paragraph dialogue">「你要去哪里？」</p><p class="story-paragraph dialogue">「等一下。我去确认一下再回来」</p><p class="story-paragraph dialogue">「不要…是要去确认什么啦，傻瓜」</p><p class="story-paragraph dialogue">「这样下去不是很好奇嘛，我就看看是什么。等着吧」</p><p class="story-paragraph">虽然哭着哀求，但知珉还是大步走到墓碑附近，旼炡则孤零零地留在了北欧的墓园中。如果当初不是想独处的话，根本就没想到会站在这种地方。空荡荡的小径完全没有照明，四周黑漆漆的，树林也显得格外冷清。</p><p class="story-paragraph">太糟糕了。不知道是不是错觉，好像能听到远处乌鸦阴森的叫声，而刘知珉为了寻找不明声响的来源，把牵着的手放开，就这么走远了。即使一点一点挪起身子向前张望，也依然不见知珉的身影。到底走了多远？</p><p class="story-paragraph">姐姐...你在哪里？快点出来吧，我真的很害怕这样的。旼炡近乎呜咽，急切地叫唤着知珉。这时，从远处传来了令人高兴的声音。</p><p class="story-paragraph dialogue">「旼炡，我在这里啊」</p><p class="story-paragraph">视线转向传出声音的地方，漆黑一片的树林缝隙，突然冒出一个脸孔白皙的黑发女子。就像打开任意门出现的哆啦A梦一样，瞬间，旼炡被吓得瘫坐在地。本来就已经跛着脚，现在脚踝又再次扭伤了。</p><p class="story-paragraph dialogue">「...吓我一跳。在别人的墓碑前干什么呢？」</p><p class="story-paragraph dialogue">「你看、是不是很可爱？」</p><p class="story-paragraph">知珉把手中黑麻麻的东西伸到眼前。不知怎么回事，她的怀里竟抱着一只黑猫。喵~看着用可爱的目光盯着自己的猫咪，一下子身上力气全被卸下。该带上项圈的不是我，而是刘知珉、你才对吧？</p><p class="story-paragraph dialogue">「但是你怎么坐在这呢？没事吗？」</p><p class="story-paragraph dialogue">「姐姐、都是因为你...」</p><p class="story-paragraph">旼炡勉强站了起来，又慢吞吞地走上林间小路。但在突发事件之后，情况发生了微妙的变化。现在知珉的目光全都集中到了新登场的可爱生命体上。甚至说话也只对着猫，表达爱意也只对猫。</p><p class="story-paragraph dialogue">「小漂亮...你太可爱了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「可能出生没多久吧。小可爱，你妈妈在哪里？」</p><p class="story-paragraph">小漂亮？小可爱？</p><p class="story-paragraph">明明刚才还牵着自己的手，把手放进牛仔夹克口袋揉捏。眼前知珉则不断对着手掌大的小猫亲亲，就这么走着。被突然出现的流浪猫，抢走了宝宝、小可爱等修饰语和肢体接触，这种心情实在荒唐。对着刚出生的小猫感到嫉妒，还真是能吃的醋都吃了。</p><p class="story-paragraph dialogue">「姐姐，现在把猫放下来」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「还问为什么，你要带牠回家吗？」</p><p class="story-paragraph">也不是...但它太可爱了，不想和孩子分开。知珉脸对着猫咪一顿乱蹭。不能在这里感到屈辱，这是作为人应有的尊严。旼炡勉强压住心中怒火，才把话说出口。都是因为谁从公墓里突然冒出来，害得脚踝又扭到了，难道没看见吗？</p><p class="story-paragraph dialogue">「...对不起」</p><p class="story-paragraph dialogue">「你要怎么做？负责，给我负起责任啊」</p><p class="story-paragraph">听见自己的催促，知珉才把猫抱在怀里，心不甘情不愿伸手。旼炡看着她厚脸皮的样子，哑口无言。就算不能赶紧把牠放下来抱我，但你抱着猫咪还想牵我的手？一看就是那样。</p><p class="story-paragraph dialogue">「不牵，走开」</p><p class="story-paragraph dialogue">「怎么又不开心了。不是说要牵手吗？」</p><p class="story-paragraph dialogue">「姐姐把牠放在包里吧。应该很轻松就能装进去了」</p><p class="story-paragraph dialogue">「旼炡啊，你为什么要牵制动物...」</p><p class="story-paragraph dialogue">「不是牵制，是因为你把受伤的人晾在一旁，注意力都被吸走了」</p><p class="story-paragraph dialogue">「啊，难道是那个吗？」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「听说狗主人身上如果沾上其他动物的气味，狗狗就会嫉妒。原来是真的吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">知道了、知道了，把猫咪送走不就行了嘛。知珉一脸遗憾地放下小猫，又摸了摸它，才匆匆走了过来。</p><p class="story-paragraph dialogue">「旼炡啊过来。现在牵着我家小狗的手走吧？」</p><p class="story-paragraph dialogue">「...姐姐，把衣服上粘着的猫毛抖一抖再说吧」</p><p class="story-paragraph">两人重新回到公墓入口，再次往河岸边走去。因为扭伤两次的脚踝，步伐越来越缓慢。走得太久，现在连脚后跟都开始酸痛了。</p><p class="story-paragraph dialogue">「脚很疼吗？还走得动吗？」</p><p class="story-paragraph">旼炡再次坐上附近的长椅。穿着皮鞋还一直走到了深夜，脚都软了。如果要等太阳升起还得等一阵子。公车也至少要再等一个小时。不管怎样，除了走回去，别无他法。</p><p class="story-paragraph dialogue">「休息一会再走就行。反正再10分钟就到家了」</p><p class="story-paragraph dialogue">「...我来背你吧？」</p><p class="story-paragraph dialogue">「说什么呢，算了吧」</p><p class="story-paragraph dialogue">「刚才不是要我负责吗？」</p><p class="story-paragraph dialogue">「干嘛，干嘛这样？」</p><p class="story-paragraph dialogue">「说了要背你啊？」</p><p class="story-paragraph">我今天穿着舒服的鞋子，所以没问题的，还是因为害羞吗？大半夜路上没人看见的。知珉半蹲着，拍了拍背。旼炡莫名接过知珉的包，挂在身后。哼~的一声，视野很快就提高了。这到底是时隔多久再次被人背起来呢。脚在空中晃动，心情非常复杂。</p><p class="story-paragraph dialogue">「...我不重吗？」</p><p class="story-paragraph dialogue">「完全不好吗」</p><p class="story-paragraph dialogue">「待会儿换我背你吧？」</p><p class="story-paragraph dialogue">「你要背我的话，脚会再受伤的」</p><p class="story-paragraph dialogue">「我力气很大...」</p><p class="story-paragraph dialogue">「嗯...就当作是那样吧」</p><p class="story-paragraph">走着走着，像迷宫一样的道路，又变回了熟悉的景色。今天两人重逢的狭窄小巷也出现在不远处。黑漆漆的清晨，顺着风声传来河水的川流声。知珉似乎不冷，连外套都没穿就这么走着。</p><p class="story-paragraph dialogue">「不冷吗？」</p><p class="story-paragraph dialogue">「现在反而不怎么冷了？」</p><p class="story-paragraph dialogue">「我好像还是很冷啊」</p><p class="story-paragraph dialogue">「难道是因为在走路吗？还是因为凌晨空气清新？」</p><p class="story-paragraph">听了这句话，感觉刚刚还刺骨的空气一下子变得清新起来。&quot;好凉爽啊&quot;，吐着白烟的脸上，清晰地浮现出几年前毕业典礼上见到的模样。当时也觉得这种色彩单调的季节，冰冷的冬天很适合你。直到现在，这个想法依然没有改变。</p><p class="story-paragraph dialogue">「…姐姐果然适合冬天」</p><p class="story-paragraph dialogue">「我？」</p><p class="story-paragraph dialogue">「嗯，看着你就会想起寒冷的天气」</p><p class="story-paragraph dialogue">「是吗？但我喜欢春天」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「就是，花开得鲜艳不是更好吗？」</p><p class="story-paragraph dialogue">「我们学校的樱花真的很漂亮。还记得吗？」</p><p class="story-paragraph dialogue">「当然了，我做学生会的时候赏了好多樱花」</p><p class="story-paragraph">突然间，感觉樱花树下知珉的脸庞变得遥远。上扬的漂亮眉峰，还有稚嫩的脸庞。如果当时我们相见，会有什么对话呢？连这种毫无意义的事情也暂时想象了一下。也是吧，因为正门口有很多樱花树，也开得很漂亮。话音刚落，走得好好的脚步却突然停了下来。随即，知珉一脸疑惑地转过身。</p><p class="story-paragraph dialogue">「...不是那里啊？」</p><p class="story-paragraph dialogue">「正门不是最漂亮的地方吗？」</p><p class="story-paragraph dialogue">「嗯，你不知道我们学校的樱花名胜地啊？」</p><p class="story-paragraph dialogue">「名胜地在哪里？」</p><p class="story-paragraph dialogue">「一楼走廊的尽头」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「从那里推开门出去，就会看到像庭院一样的地方，树木茂盛」</p><p class="story-paragraph dialogue">「不用说明我也知道是哪里」</p><p class="story-paragraph dialogue">「我经常去那里赏花，好怀念啊」</p><p class="story-paragraph">旼炡默默地靠在知珉背上。回忆也能再次修改吗？因为知珉的一句话，拥抱了很久的回忆碎片变得不再可怕或疼痛。凹陷的伤口好像结了痂。脑海中只剩下那天的樱花，生动地浮现在眼前。</p><p class="story-paragraph dialogue">「如果能和姐姐一起去那里赏花就好了」</p><p class="story-paragraph dialogue">「是啊」</p><p class="story-paragraph dialogue">「之后去看看吧？明年樱花开的话」</p><p class="story-paragraph dialogue">「...好」</p><p class="story-paragraph">用手揉了揉她的肩膀，知珉转过身问道。你在干什么？胳膊会疼的，别太累了。这时，她噗嗤一笑，又重新向前看。又做这种可爱的事呢，你只顾好好抓着，别掉下来了。</p><p class="story-paragraph">这时，被身后的某种触感吓了一跳，旼炡不由自主，紧紧抓住自己依靠着的肩膀。虽然肩膀的主人就是罪魁祸首，但情急之下也别无他法。知珉轻轻抬起撑着腿的手，对着自己的屁股摸来摸去。干嘛呢？别摸了。然而不管自己怎么用力，腿都被她紧紧的抱在身前，丝毫没有松开。被背在身后手忙脚乱的样子，看起来倒是像个傻瓜。</p><p class="story-paragraph dialogue">「这样乱动也下不去吧？真有趣」</p><p class="story-paragraph dialogue">「别摸了，变态」</p><p class="story-paragraph">原本气氛暧昧，一转眼她就忍不住做了奇怪的事情。直到自己在身后拉她的耳朵进行惩罚，知珉才停下了恶作剧。不要在真挚的气氛中这样，一有空就只想着摸屁股吗？</p><p class="story-paragraph dialogue">「你这么说，搞得我像个奇怪的人」</p><p class="story-paragraph dialogue">「总之，别再用手开玩笑了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐你觉得我像什么季节？」</p><p class="story-paragraph">那句话让知珉有点苦恼。果然还是冬天吧，然后回答。</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「我初次见到你，就想到一只白色狐狸」</p><p class="story-paragraph dialogue">「白色狐狸？」</p><p class="story-paragraph dialogue">「嗯，不过虽然是冬天...但还是换成夏天吧」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「因为你是只很怕冷的狐狸」</p><p class="story-paragraph">现在还是有点讨厌她像是在逗人一般的笑脸。</p><p class="story-paragraph">但是实在太可爱了，讨厌也没有用。</p><p class="story-paragraph dialogue">「好吧，就算再冷我也要冬天」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「就那样」</p><p class="story-paragraph dialogue">「就那样吗？」</p><p class="story-paragraph">旼炡在她长长的后颈轻轻贴上双唇。然后直接埋着脸，轻声呢喃。</p><p class="story-paragraph dialogue">「因为我现在也喜欢上冬天了...」</p><p class="story-paragraph">将我冻僵的手融化的温度，现在依然很温暖。珍贵的瞬间越是积累，内心也神奇地慢慢被融化。 曾经充满回忆的香水味，好像已经完全属于你了。这一切都不关于任何人，而是——</p><p class="story-paragraph">刘知珉，因为是你才有可能吧？</p><p class="story-paragraph">今后所有冬天到来，</p><p class="story-paragraph">我一定都会想起这个瞬间。</p><p class="story-paragraph">让我遇见你的这个冬天，</p><p class="story-paragraph">绝对忘不了。</p><p class="story-paragraph">不知不觉间天空透出淡淡的蓝色，是凌晨和清晨微弱的分界线，在外头愉快地散步的一整晚终于结束了。睡眼惺忪，知珉每挪动一步，身体就摇晃得厉害，在短时间内旼炡的睡意突然袭来。明明不是用自己的脚走，风景却不停变换，让人分不清这是梦境还是现实。旼炡啊。如果没有像闹钟一样的叫声，也许真的会睡着...</p><p class="story-paragraph dialogue">「你不会在后面睡觉吧？」</p><p class="story-paragraph dialogue">「没睡...」</p><p class="story-paragraph dialogue">「那个，客人？请不要睡着，已经到家了，请下车」</p><p class="story-paragraph dialogue">「不能再转一圈吗？」</p><p class="story-paragraph dialogue">「姐姐现在胳膊麻了...你不是小猫咪，能不能下来了？」</p><p class="story-paragraph dialogue">「...太过分了」</p><p class="story-paragraph">在背上贴了好一阵子，下来后真有点舍不得。想回家把毯子卷起来抱着睡，但果然不行吧，即使不是这样便宜的多人间。慢吞吞抬起手，准备推门进入大厅时，感觉到她凝视自己的目光。</p><p class="story-paragraph dialogue">「旼炡啊，来个晚安吻吧？」</p><p class="story-paragraph dialogue">「都到了日出前还什么晚安吻啊...」</p><p class="story-paragraph dialogue">「我就想」</p><p class="story-paragraph">嘴唇立刻靠近，不像刚才那样急躁、粗糙。就像睡觉前在身旁哄着一样，温柔地伸进嘴里的感觉，全身都放松下来。希望能再吻久一点。自己这么想着，但嘴唇很快就分开了。心里感到很难为情，不禁低下脑袋。还有，因为她凝视着自己的眼神。</p><p class="story-paragraph">今天格外露骨的视线，使得心跳絮乱。要是每天晚上都有这样的晚安吻就好了。要不要说每天都做呢？说起来有点害羞，还是算了吗。苦恼的旼炡不知不觉皱起了眉头。</p><p class="story-paragraph dialogue">「你的表情怎么回事？」</p><p class="story-paragraph dialogue">「我的表情怎么了？」</p><p class="story-paragraph dialogue">「皱着眉头。感觉不怎么样吗？」</p><p class="story-paragraph">被问到这个问题时，也只是叹了一口气。我知道你是追求好表现的性格，但哪有接吻后问对方感想的人啊。</p><p class="story-paragraph dialogue">「...干脆每次都给写一则评分后记怎么样？」</p><p class="story-paragraph dialogue">「倒也没必要那么做」</p><p class="story-paragraph dialogue">「太奇怪了」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「姐姐，到现在为止只跟男人交往过吗？」</p><p class="story-paragraph dialogue">「干嘛问这个，你呢」</p><p class="story-paragraph dialogue">「快点回答」</p><p class="story-paragraph dialogue">「是啊，怎么了。对这个好奇吗？」</p><p class="story-paragraph">只知道她高中的时候和奇怪的傢伙交往了，接着到底发生了什么事？怎么想都觉得很奇怪。为什么好像对比自己矮一些的人做过，能把人推到墙上那么熟练地接吻呢。和女人是第一次吧？所以才惊慌的不是吗？</p><p class="story-paragraph dialogue">「但是为什么...那时候像个新手一样」</p><p class="story-paragraph dialogue">「新手？」</p><p class="story-paragraph dialogue">「第一次在列车上接吻的时候啊。哪有人接吻连眼睛都不闭的啊？」</p><p class="story-paragraph dialogue">「我只是觉得这个小不点突然靠上来很神奇」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「你不会是因为那个...觉得我比你没经验吧？」</p><p class="story-paragraph">只见她眼睛眯成圆曲的半月型，以及那上翘的嘴角。啊、那张脸是要逗人的表情。得在她说奇怪的话之前赶紧防御。旼炡急急忙忙地说。不是那样的，是因为姐姐和那时后完全像两个人。</p><p class="story-paragraph dialogue">「但是真搞笑。今天看着你我也有一模一样的想法」</p><p class="story-paragraph dialogue">「...一样的想法？」</p><p class="story-paragraph dialogue">「我在想，金旼炡当时一副老油条的样子，都是在演戏吗？」</p><p class="story-paragraph">然而，那句话又引发了另一场争论。老油条？不，那只是以为，事实是你就是个新手。那样才不能叫新手好吗？ 看你气的，好像被戳到痛点了，今天你脸上表情就写着“我什么都不知道”。我该知道的都知道。</p><p class="story-paragraph dialogue">「旼炡啊，能不能一直像今天一样保持纯洁的风格？逗你玩的时候打击感太有趣了」</p><p class="story-paragraph dialogue">「真不知道你是这种品味，死也不要」</p><p class="story-paragraph dialogue">「你更喜欢哪一种我？是那时候还是今天的？」</p><p class="story-paragraph dialogue">「…我是不会说的」</p><p class="story-paragraph dialogue">「刚才不是说了嘛，只有你对我表现出来，我才能知道啊？」</p><p class="story-paragraph">结果谈了那么长的恋爱，好像还是个新手。知珉随意下了结论，并挠了挠旼炡的脸颊。显然，她正在享受200%的快乐。感觉今天也被那双比平时更清新的笑眼给骗了。这时知珉不知想起什么有趣的事，一个人乐呵呵笑了起来。</p><p class="story-paragraph dialogue">「然后虽然现在才说...」</p><p class="story-paragraph dialogue">「干嘛笑成那样？让人心情不好」</p><p class="story-paragraph dialogue">「当时竭尽全力的你很可爱，所以就放过你了」</p><p class="story-paragraph dialogue">「我哪有...竭尽全力」</p><p class="story-paragraph dialogue">「你真的太用力了，一直推着我的身体吻我，所以我还推了你一把」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「都是因为你，我的头都撞到窗户上了。还记得吗？」</p><p class="story-paragraph">调皮的眼珠子将事实钉在自己面前，旼炡只是无话可说。有需要让人陷入如此尴尬的境地吗？这种事难道就不能放过我吗？</p><p class="story-paragraph dialogue">「姐姐好像把我捉弄你不会撒娇的事情，都记在心底了。在日出之前还报仇啊」</p><p class="story-paragraph dialogue">「不是，这根本不算报仇啊？」</p><p class="story-paragraph dialogue">「脸上倒是笑得非常灿烂」</p><p class="story-paragraph">真的要这样吗？</p><p class="story-paragraph">虽然想看你发自内心的笑，</p><p class="story-paragraph">结果最好看的笑容偏偏是此刻吗？</p><p class="story-paragraph dialogue">「我只是怕不给指点的话，你又会不分青红皂白把嘴唇撞上来而已」</p><p class="story-paragraph dialogue">「不做了，现在开始我绝对不会先做了」</p><p class="story-paragraph dialogue">「...真的吗？」</p><p class="story-paragraph dialogue">「真的」</p><p class="story-paragraph">那我先来吧。知珉立刻伸出手环抱，并靠在自己背上。清晨的街道上，依然没有来往的人。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「干嘛。总叫我」</p><p class="story-paragraph dialogue">「今天真的很想你」</p><p class="story-paragraph dialogue">「....」</p><p class="story-paragraph dialogue">「...你呢？」</p><p class="story-paragraph">每天都捉摸不透的刘知珉小姐，</p><p class="story-paragraph">我也一样。</p><p class="story-paragraph">非常非常想念那张笑脸。</p><p class="story-paragraph dialogue">「…我也是」</p><p class="story-paragraph">虽然不知道你会不会相信，</p><p class="story-paragraph">我真的等了一整天。</p></div>
