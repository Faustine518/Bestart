        <div class="chapter-copy"><div class="location-badge"><strong>Rewind : 2020/11/20</strong><span>倒回 ：2020/11/20</span></div><p class="story-paragraph">入境审查官把视线固定在萤幕上，用没有高低起伏的语气说。在赫尔辛基要去哪里哪里？没有熟人吗？打算在哪里停留？身上现金是多少？</p><p class="story-paragraph">据说芬兰的入境审查比较严格，果然没有错。知珉像打乒乓球一样，适当地回应，看着对面柜台吞吞吐吐的旼炡的背影。还好吗？但同样，面对接连不断的提问，不知是否感到惊慌，只见她的手不停摸头。</p><p class="story-paragraph">因为不怎么用心的审查官，知珉比预想的还要顺利通关。现在有了必须一起行动的同行者，即使一个人结束得早，也没有任何意义。看她过了很久才慢慢走出来，一脸憔悴。</p><p class="story-paragraph dialogue">「怎么花了这么长时间？」</p><p class="story-paragraph dialogue">「因为听说我的停留时间很长，所以问了有100多个问题」</p><p class="story-paragraph dialogue">「但我没有那样啊」</p><p class="story-paragraph dialogue">「为什么只怀疑我，完全是差别对待啊」</p><p class="story-paragraph">还被检查了两三次护照，我跟照片长得很不一样吗？听到旼炡充满委屈的话语，被她白皙的手上拿着的护照照片吸引。不知道是不是高中时拍的，比现在更加稚嫩的脸，配上端庄的黑发。和现在一样圆圆的眼睛和稍微不自然的微笑，以及旁边印上的单调的数字。</p><p class="story-paragraph">2001年1月1日，听她炫耀自己的生日很独特，看来并没有说谎。和新年倒计时一起迎接生日这一天，会是什么心情呢？无论何时开学，新学期开始没多久就迎来生日的知珉，很难想象旼炡每年是怎么过生日的。因为很独特，不是好事吗？就这样看着旼炡的护照，没有多想就低声说。</p><p class="story-paragraph dialogue">「真希望我的生日是1月1日」</p><p class="story-paragraph dialogue">「一点都不好」</p><p class="story-paragraph dialogue">「为什么？这样别人绝对不会忘记」</p><p class="story-paragraph dialogue">「但永远是连休嘛」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「大家都是和家人一起过，所以谁都叫不动」</p><p class="story-paragraph">也是，新年就是这样的。对不太亲近的人也会进行新年问候。旼炡表示，在生日当天只听到“新年快乐”的话，心里会很难过。虽然那些人可能只是简单做了新年问候，但如果每次都特别补一句今天是自己生日，也有点别扭。听来听去还是挺为难的。</p><p class="story-paragraph dialogue">「看来大概平凡就是好事吧」</p><p class="story-paragraph dialogue">「太平凡也是很累的」</p><p class="story-paragraph dialogue">「…刚刚不是才说不喜欢太特别吗？」</p><p class="story-paragraph dialogue">「你知道全国有多少金旼炡吗？」</p><p class="story-paragraph">知珉对从未想过的问题摇头回答。是啊，大概有数千，不，可能会有数万人吗...？旼炡立刻发起了牢骚，看来似乎发生过很多故事。</p><p class="story-paragraph">一个学校里，肯定有一个以上的Kim Min Jeong。即使是Min Jeong这个名字，估计有10万人。其中姓金的占一半左右吧？同名的人多的话，叫错人是常有的事，也常常互相拿错东西。所以在确认身份的时候，一定要一并说出自己的出生年月日。01年1月1日金旼炡这样。</p><p class="story-paragraph">原来如此，这也是自己意想不到的事情。如果非要说的话，刘知珉这个名字，4月11日这个生日，也属于比较平凡的。</p><p class="story-paragraph dialogue">「突然很好奇。叫刘知珉的到底有多少人呢？」</p><p class="story-paragraph dialogue">「Ji Min应该比Min Jeong多吧？因为是比较中性的名字」</p><p class="story-paragraph dialogue">「会不会超过20万人...」</p><p class="story-paragraph dialogue">「但是姓刘还是比较少见。4月11日出生的刘知珉应该没有几个人吧」</p><p class="story-paragraph dialogue">「那样的话，01年1月1日生的金旼炡应该也不多吧？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「说不定只有唯一一个人」</p><p class="story-paragraph">旼炡听到那句话后，接连摇头碎念。太不像话了，怎么可能只有一个人，光是旼炡就有10万人了。</p><p class="story-paragraph">在互相闲聊对方名字的时候，机场自动扶梯正从地下慢慢上升到地面。知珉好奇地看着站在自己面前，发牢骚的金黄色后脑勺。随处可见的名字和非常独特的生日。把这两件事情加在一起，就成了眼前的金旼炡。</p><p class="story-paragraph dialogue">「那么你生日会和家人一起过吧？」</p><p class="story-paragraph dialogue">「一般都是这样的」</p><p class="story-paragraph dialogue">「今年生日做了什么呢？」</p><p class="story-paragraph dialogue">「早上拜访亲戚们，晚上约好吃饭」</p><p class="story-paragraph dialogue">「明明是你的生日，这就完了吗？」</p><p class="story-paragraph dialogue">「...旅行」</p><p class="story-paragraph dialogue">「旅行？」</p><p class="story-paragraph dialogue">「本来计划去看星星的，济州岛」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「虽然后来突然取消，变成了晚餐」</p><p class="story-paragraph dialogue">「应该有点遗憾吧」</p><p class="story-paragraph dialogue">「也没有特别遗憾，毕竟济州岛随时可以去」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「而且现在都来到了这里」</p><p class="story-paragraph">知珉细细重复了旼炡的最后一句话。没错，现在来到了这里，对于选择去北欧而不是伦敦、选择留在旼炡身边的自己来说，也是很合适的一句话。虽然什么都没有确定下来，但心情却格外平静。之后的一个月里，只要烦恼该和这个陌生的旅伴每天玩点什么，就可以了。</p><p class="story-paragraph">不知不觉中，已经到达地面，脚下的自动扶梯已经重新变得平坦。洒在脸上的阳光十分灿烂。现在还不太了解对方，两个人在一起还是有点别扭。如果旅行结束之前能多亲近一些就好了。知珉抱着这样的想法，走向阳光明媚的大门。</p><p class="story-paragraph">睡意朦胧地掀起被子，手摸到软绵绵的东西。不看也知道是什么。河马，早安。虽然打了招呼，但姆明仍然沉默不语，没有说话。昨天还疯狂嘲笑我是傻瓜，今天就直接无视了呢。只有自己想说话的时候才随心所欲地开口，果然是金旼炡的弟弟啊。但是连你也躺在我的肚子上睡觉吗？我是你们的共用床吗？</p><p class="story-paragraph">说到这儿，从一大早就感觉自己精神有问题的知珉，有些尴尬地直起了腰。竟然成了连续两天和玩偶对话的人，赶紧到此为止吧。知珉随手扔掉肚子上的姆明，蹒跚地走向浴室。接着，一看到镜子就差点喊出声，幸亏捂住了嘴、好不容易才忍住。</p><p class="story-paragraph">你谁啊？</p><p class="story-paragraph">对面站着一个陌生女子，脸上表情十分不快。暂且不说晚睡导致皮肤干涩，因为昨天一次性流了一年的眼泪和鼻涕，双眼几乎像被蜜蜂蜇过一样肿得圆滚滚。知珉必须快点认清浴室镜子不会说谎的现实。出事了、这简直是一只青蛙吧。</p><p class="story-paragraph">如果是假日，不管肿不肿都不会有任何问题，但今天是金旼炡向伦敦宣战的日子。作为证据，手机上还留下了一个多小时的通话记录。遗憾的是，从睡梦中醒来后，能想起的只有冰岛苍茫的夜空，以及羞耻的晨间电视剧般的台词。</p><p class="story-paragraph">旼炡啊。</p><p class="story-paragraph">听说只要看着冰岛天空许愿，就能实现愿望。</p><p class="story-paragraph">我好想你，我想你，太想你了。我想见你，金旼炡。</p><p class="story-paragraph">哪怕一会儿也好，我想看看你...</p><p class="story-paragraph">疯了吗？这都说的什么呢。</p><p class="story-paragraph">知珉不敢再照镜子，直接瘫坐在地上。昨晚的刘知珉，似乎有种凌晨的感性，坐在下雨的玻璃窗前，说着像悲情女主一样的台词，该有多傻啊。如果看到金旼炡的脸的话，说不定会害羞地躲开...</p><p class="story-paragraph">带着悲伤青蛙的眼睛，脸上也像是被染红，真是可观。但是在这样重要的日子，外貌绝对不能放弃，一定得想尽办法修复。相隔几天再次见面，这副模样当然不行。还有时间，无论如何也要让外表恢复原貌。</p><p class="story-paragraph">有重要约会时的快速消肿Tip！</p><p class="story-paragraph">知珉怀着悲壮的心情，再次躺回床上，开始执行在网路这个信息海洋中得到的启示。需要准备的物品是冷冻的勺子和一桶1.5公升矿泉水。首先咕咚咕咚把水喝下肚，用手不停地揉搓耳下的淋巴。听说这样的话，血液循环会加快两倍。结束指压按摩后再次照镜子，可以看出复原率达到了30%左右。恢复得并不慢，真是万幸。知珉稍微松了口气，再次将两个冷冻过的勺子放在眼皮上。</p><p class="story-paragraph">又凉快又舒服，但是睁不开眼睛，有点无聊。知珉以此为借口，在床上摸索着，紧紧抓住刚才扔下的软绵绵的东西，再次试图进行密切的交流。因为实在太想炫耀，嘴都发痒了。绝对不是因为没有地方可说。</p><p class="story-paragraph dialogue">「那个、今天啊…」</p><p class="story-paragraph dialogue">「我家小狗说要来见我」</p><p class="story-paragraph">当然不是真的双边对话，只是为了消除紧张、自顾自的独白。知珉仍然抓着没有回答的姆明的肚子，前后乱摇乱晃。该穿什么出去好呢。但是那孩子怎么偏偏今天来。虽然很想见她，但偏偏挑在状态最糟糕的时候来，真是的。虽然有点没眼力见，但突然说要来自己家门口，真是唐突又可爱，这可真是。</p><p class="story-paragraph">因为一个人开开心心地闹腾，不知不觉间，敷在两眼上的勺子都变得暖乎乎了。冷敷的效果非常卓越。眼睛已经恢复到原来大小的一半以上。恢复率达70%，不错。</p><p class="story-paragraph">加快速度，又敷了两次补水面膜。眼形变得比平时稍微深邃一点，嘴唇也用上最珍惜的Tom Ford唇膏。作为点缀搭配了珠光耳坠，头发的话弄成像没刻意做造型的自然卷发。准备结束后，恢复率直线上升至120%。</p><p class="story-paragraph">这比起平时...会太夸张吗？</p><p class="story-paragraph">不对，今天是重要的日子，哪有什么夸张的。</p><p class="story-paragraph">从窗外望出去，看来没必要打伞。今天连一片乌云都没有，甚至让人怀疑是否还待在那个不断下雨的伦敦，这绝对是难得的晴空万里。虽然距离约定时间还久，但早点出去逛逛是不是也不错呢？在伦敦，像今天这样温暖的阳光可是很珍贵的。</p><p class="story-paragraph">考虑完后，知珉把只穿了一天的长大衣放回衣柜，穿着熟悉的牛仔夹克出门了。</p><p class="story-paragraph">天气晴朗，家门口的风景也焕然一新。一直都阴沉沉的伦敦，这样一看也感觉像个非常值得旅游的城市。打开手机相簿，里面充满旼炡闷闷不乐独自乘坐摩天轮的照片，时间似乎停止了，停留在哥本哈根。知珉久违地打开相机，拍摄了一两张伦敦街景。镜头内出现一家小花店。竟然有街角花店，怎么现在才知道家门口有这种东西呢？</p><p class="story-paragraph">街上摆放的鲜花各个都散发香气。茂盛的满天星旁边是粉红色的非洲菊，上排则是橙色万寿菊和淡紫色的绣球花。当然，花店的主角——玫瑰也是各色各样。</p><p class="story-paragraph">种类如此多样，没有比挑选花束更苦恼的了。只要挑选看起来让心情变好的颜色就可以了吧。知珉拿起摆放在花丛中的一束黄色玫瑰。看起来不是一般的玫瑰，而是有像蕾丝一样黄色花瓣，圆圆地层层迭迭包裹的独特外型。一边结帐，一边向店员询问花的名字，接着，熟悉的名字蹦了出来。</p><p class="story-paragraph dialogue">「这是卡塔琳娜玫瑰」</p><p class="story-paragraph">你也是卡塔琳娜啊。偶然的巧合，让人不禁露出笑容。花语是什么呢？接着被店员反问是不是要送给恋人的礼物，知珉默默点了点头。那样的话，是很好的选择。</p><p class="story-paragraph">因为，卡塔琳娜玫瑰的花语是永恆的爱情。可以向长时间分别的爱人发誓要永远，所以又被称为约定之花。因此，也常被用做结婚花束。听了这番话，心里好像更激动了。虽然只是挑了一个看到某人就会想到的颜色，这难道不是与今天见面的意义非常合适吗？知珉十分满意，闻了花香后小心翼翼地放进了包里。</p><p class="story-paragraph">好，现在一时冲动买了花</p><p class="story-paragraph">该怎么交给她呢。以之前累积的数据为基础来看，仔细模拟一下，预想反应一：为什么买了这个？你不知道我除了实用的东西之外、其他全部扔掉吗？姐姐你自己收着吧，然后马上还给自己。预想反应二：虽然很感谢，但是为什么要给我啊。今天是什么日子吗？像这样追问。还有预想反应三。</p><p class="story-paragraph">难道现在是在告白吗？</p><p class="story-paragraph">停止，停止。停止模拟。这是最糟糕的情形。如果像这样直言不讳地问该怎么办？金旼炡的话，估计会跳过1号、2号，直接到3号。</p><p class="story-paragraph">知珉站在伦敦街头苦苦思索，被路上行人挤到了角落。当然，不管怎么绞尽脑汁也得不到答案，因此决定先振作精神，迈开脚步。下一站是餐厅，旼炡来到伦敦肯定没有好好吃饭，所以想买点东西给她充饥。这附近正好有一家炸鱼薯条的排队名店。虽然不是特别喜欢这类食物，但还是为首次来到英国的旼炡，选择了这项菜单。</p><p class="story-paragraph">准备这些应该不会太简陋吧。知珉双手捧着炸鱼薯条和玫瑰花束，毅然决然走向决战地点。</p><p class="story-paragraph">西敏站位于伦敦的市中心。检票出入口前人潮熙熙攘攘，道路对面是阻挡西敏寺的巨大钟塔。实际一看，大本钟在远处看的时候还挺好的，但现在正门被保安人员围起，甚至无法入内参观。</p><p class="story-paragraph">没什么可做的，干嘛没事来得这么早呢。突然，有人用熟悉的语言向交叉着手臂的知珉搭话。请问您是韩国人吗？</p><p class="story-paragraph">啊、是的。这样回答后也不能装作不是了。幸好提出要求很单纯。只是想拍一张全家福。反正今天心情很好，那种程度也没什么。知珉爽快地要了手机，甚至像自拍时一样，用上全身的干劲，竖拍、横拍、全身、放大镜头，像是习惯一样。谢谢你帮我们拍得这么好。不、没什么。和和气气地简短问候，在旁边看眼色的其他家庭见状，也拜托知珉帮忙拍照。不好意思、我们能不能也...</p><p class="story-paragraph">游客们接二连三，不知不觉知珉在大本钟前成为摄影师，专门拍摄所有东方家庭的团体照。刚开始觉得这没什么，直到最后所有人都满意地笑着离开，还感觉自己做了件有意义的事，心情并不差。但果然还是有点累了，正想着要慢慢避开这里——</p><p class="story-paragraph dialogue">「那个、那个」</p><p class="story-paragraph">这时不知从哪里又传来韩语。嗯？直接下意识就回了。啊、真的。知珉掩饰不住不耐烦，直接停下动作。在她侧身的视线尽头，映入眼帘的是沾有污痕的象牙色匡威。</p><p class="story-paragraph dialogue">「可以给我也拍一张吗？」</p><p class="story-paragraph">在这一瞬间，脑海中闪过一幕幕熟悉的场景。一个月前，搭上飞机的刘知珉，连身旁的人瞧都没瞧一眼就坐上座位。因为有人像现在这样叫醒我，也是以”那个” 开头、用同样的声音和自己搭话。</p><p class="story-paragraph dialogue">「我刚一个人来到伦敦」</p><p class="story-paragraph">回头一看，那张思念的脸庞，以伦敦最具代表性建筑为背景。一如既往淡蓝色的毛帽和围巾。裹住双手的灰色手套，身穿白色毛衣和牛仔裤。才过了几天，脸上就好像瘦了不少，脸庞凹陷。和刚买的花同样色系的金黄色头发，和微微张开的红唇。不给我拍一张吗？以及露出笑意的嘴角。</p><p class="story-paragraph">知珉呆愣着，上下打量她的模样，旼炡则再次催促知珉，这才赶紧接住她伸出的手机。还没来得及相逢，打开相机时，旼炡匆匆走近钟楼，作为游客却丝毫没有一丝喜悦，面无表情地比了V手势。让拍的人也兴奋不起来。</p><p class="story-paragraph dialogue">「那个...如果笑一笑会更好」</p><p class="story-paragraph dialogue">「我才不要」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「拍好了吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「没想到你在英国还找到了摄影师的工作」</p><p class="story-paragraph dialogue">「我也是不知不觉被卷入那个氛围...」</p><p class="story-paragraph dialogue">「要学会拒绝啊，傻瓜」</p><p class="story-paragraph">奇怪。</p><p class="story-paragraph">怎么比初次见面更紧张和尴尬呢。</p><p class="story-paragraph">越想越觉得心情微妙。身在伦敦的金旼炡，而且还是在大本钟前面的金旼炡。直到知珉听到钟声噹噹响起，才歪着头，发现有点奇怪。再看一遍，现在是下午2 点，也就是在约定时间之前。当然，大本钟的时间不可能有误差，只是彼此都提前两个小时出来才碰到面而已。</p><p class="story-paragraph dialogue">「什么呀，既然来了就要联系我啊。差点就让你等了」</p><p class="story-paragraph dialogue">「姐姐为什么来得这么早？」</p><p class="story-paragraph">虽然是自己率先提问，但面对突如其来的反问，知珉像是被旼炡传染了习惯一样，眼睛向上看。就是起得太早了，在家也没什么事可做，最近刚好对拍照很有兴趣… 听到这，旼炡像是已经掌握情况，直接打断。</p><p class="story-paragraph dialogue">「原来是因为太兴奋了，所以等不及啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「就这么想我吗？」</p><p class="story-paragraph">刚才进行的模拟有什么意义吗？怎么今天这么唐突？而且说出口的话都中肯到自己无法反驳。在知珉惊慌的时候，因为人潮总是从身边挤过，旼炡只能缩起肩膀。由于着名的钟楼前挤满了游客，两人想谈谈彼此之间的往事，这地点似乎并不理想。</p><p class="story-paragraph dialogue">「不过这里人太多了，乱七八糟的」</p><p class="story-paragraph dialogue">「我不就说了因为整修刚结束，所以很拥挤吗？」</p><p class="story-paragraph dialogue">「去哪里才好？我对伦敦不瞭解，姐姐带路吧」</p><p class="story-paragraph">尽管如此，目前情况还在自己的预想之中。刚才不仅用勺子冷敷、欺负玩偶，还是有做好功课的。西敏有英国王室官邸白金汉宫。这里是伊丽莎白女王下榻、并举行卫兵交接仪式的地方。在宫殿旁有一个正好能够散步的皇家公园，为了在室外享受温馨的野餐，同时为了给小鸟宝宝喂食些有营养的食物，还准备了炸鱼薯条。简直是一箭双鵰。扮演起伦敦导游的知珉微笑着对旼炡说。</p><p class="story-paragraph dialogue">「午饭吃什么了？肚子不饿吗？」</p><p class="story-paragraph dialogue">「吃了飞机餐，感觉有点空虚」</p><p class="story-paragraph dialogue">「我就知道会那样，所以特地买了点东西」</p><p class="story-paragraph dialogue">「怎么回事，今天好老实啊」</p><p class="story-paragraph dialogue">「当然是因为你都来到这里了嘛...」</p><p class="story-paragraph dialogue">「难道把约会行程都安排好了吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「看来没错呢」</p><p class="story-paragraph dialogue">「嗯... 心里倒是有点想法...」</p><p class="story-paragraph dialogue">「那就不要犹豫了，带路吧」</p><p class="story-paragraph dialogue">「嗯...」</p><p class="story-paragraph">感觉一见面就被吃得死死的。</p><p class="story-paragraph">难道今天会一直维持着这种基调吗？这样下去，到送花的那一刻，是不是会像傻瓜一样结结巴巴呢？知珉赶紧甩开不祥的预感，走向公园。</p><div class="location-badge"><strong>L O N D O N : ST. J A M E S ’S  P A R K</strong><span>伦敦：圣詹姆士公园</span></div><p class="story-paragraph">圣詹姆士公园(St James&#x27;s Park)内包含一座大湖，环绕着一条安静的散步路。这是知珉昨天调查到的全部内容。因为了解得很浅，所以两人一进公园就碰到了一些意料之外的东西。</p><p class="story-paragraph">鸟，Bird。换句话说，就是刘知珉死而后怕的、身上带着羽毛的生物。讽刺的是，公园入口处的标示牌上，早就写有“Birdcage Walk”的字样，甚至还设置了画有各种鸟类的指示牌。惊慌失措的知珉在心里发出了尖叫声，但因为旼炡紧跟在身后，所以硬是装作若无其事走在前头。是啊，即使是城市中心，但大自然总会有鸟类吧，清溪川也有白鹭、首尔林也有苍鹭。努力调整好心态迈开脚步，但越往内走，越是感觉身处在动物园。准确地说，人类和鸟类比例大约是五五开。这种程度的话，叫公园有什么意义？</p><p class="story-paragraph dialogue">「姐姐，你看那边」</p><p class="story-paragraph dialogue">「干嘛...我是故意只向前看的」</p><p class="story-paragraph dialogue">「好大啊，那只是什么鸟？」</p><p class="story-paragraph">往旼炡指的方向一看，就看到高达一公尺的巨大鹈鹕在嚎叫。不该看的。知珉扭过头本能地深呼吸。偏偏看到张嘴打哈欠的场面，觉得自己好像更着急了。完全没想到，比北欧凶猛的海鸥更巨大的东西，会聚集在这种人潮熙熙攘攘的地方。不幸的是圣詹姆士斯公园正是鹈鹕的栖息地，因此对患有鸟类恐惧症的知珉来说，更像是一种地狱。</p><p class="story-paragraph">知珉躲在旼炡身后，小跑步地走，才终于安稳地坐在正对湖水的长椅上。天气好、风景也好，除了飘浮在水面上丑陋的大鸟之外，构图十分完美。</p><p class="story-paragraph">终于到了等待已久的午餐时间。一打开已经变软的炸鱼薯条的外包装，气味就顺着微凉的空气，一下子散了开来。旼炡一边说“给我吧”，一边伸出戴着手套的手，说肚子饿。</p><p class="story-paragraph">递上食物的知珉感到有些奇怪，瞥了眼坐在旁边的旼炡。她为什么不脱手套呢？虽然有乖乖听话很棒，但戴着连手指都用不了的手套，像个原始人一样用叉子叉，看起来很诡异。明明之前总叮咛你戴，你都不戴。是因为手很冷吗？这该不该指责呢。但是从现在就开始唠叨还是不太好...知珉想了想，最终还是忍不住说了一句。</p><p class="story-paragraph dialogue">「旼炡啊，难道要戴着手套吃吗？」</p><p class="story-paragraph dialogue">「又不是筷子，用叉子没问题」</p><p class="story-paragraph">戴着手套厚厚的手似乎不在意，猛地插了一下碗，结果炸鱼排果然被可怜地被弄碎了。这就是当地的炸鱼薯条啊，我开动了。旼炡马上吃了一口，眉间随即用力紧皱。</p><p class="story-paragraph dialogue">「怎么了？味道不怎么样吗？」</p><p class="story-paragraph dialogue">「...这是食物吗？真的真的不好吃」</p><p class="story-paragraph">到底有多么糟？直到油炸食品碰到舌头，知珉也后悔自己花钱买了这块油炸物。如果硬是要评价的话，就是比便利店卖的还不如。果然按照惯例准备英国当地食物错了吗？麻烦了、从一开始就出状况。早知道就挑些吃过的。天气这么冷，如果带点热汤给她喝就好了。知珉满脸后悔，面露愁容，旼炡则继续慢慢咀嚼炸鱼薯条。</p><p class="story-paragraph dialogue">「这里的食物真不怎么样。吃得还习惯吗？」</p><p class="story-paragraph dialogue">「如果避开英国食物的话，出乎意料地挺好」</p><p class="story-paragraph dialogue">「是吗？看来吃得很香啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「结果送这种东西给我吗？」</p><p class="story-paragraph dialogue">「...对不起」</p><p class="story-paragraph">旼炡把鱼切成碎块，只不停喝水。而她嘴里含着水，一直盯着吃东西的自己看，知珉也跟着放下叉子，摸了摸嘴角。我嘴上沾了什么东西吗，没有啊？</p><p class="story-paragraph dialogue">「为什么那么盯着我看？」</p><p class="story-paragraph dialogue">「太神奇了」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「昨天哭得那么厉害，眼睛居然一点都没肿」</p><p class="story-paragraph">都是为了见你，才拼命地用汤匙冰敷的。金旼炡应该不懂，这可是自己不懈努力的结果。虽然她也没必要知道这些幕后故事。不、是不能知道。知珉回忆着多灾多难的早晨，旼炡继续用充满疑问的眼神上下打量知珉。</p><p class="story-paragraph dialogue">「还有今天...」</p><p class="story-paragraph dialogue">「又怎么了？」</p><p class="story-paragraph dialogue">「姐姐为什么打扮成这样...？」</p><p class="story-paragraph">瞬间，被口中的鱼卡住了喉咙，知珉抢下了旼炡手中的水，大口大口地灌下去。</p><p class="story-paragraph dialogue">「因为之前整整下了三天雨，刚好今天天很晴朗...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「总之，我就是想这么打扮」</p><p class="story-paragraph dialogue">「这是平时的样子吗？倒有点新奇」</p><p class="story-paragraph dialogue">「...奇怪吗？」</p><p class="story-paragraph dialogue">「不会」</p><p class="story-paragraph">姐姐打扮后真的很漂亮很不错啊，这样子也很适合。原来是为了这样称赞自己才提的啊，主要是因为害羞吧？虽然自己心里在等着，但只见她突然一脸不高兴地说道。</p><p class="story-paragraph dialogue">「我在冰岛经历生死的时候，有人还吃得饱饱的。现在看来，脸上也变得更有光泽...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「总觉得真气人」</p><p class="story-paragraph">结果是自己想多了啊。</p><p class="story-paragraph dialogue">「吃完了吗...？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「可以抱一下吗？」</p><p class="story-paragraph dialogue">「不行」</p><p class="story-paragraph">带着愤怒的果断拒绝回荡在耳边。知珉尴尬地耸了下肩膀，把视线转向漂浮在湖中的野鸭。也许彼此都在看同样的东西，旼炡的眼睛也跟着鸭子们左右摇晃。知珉将原本的侧身转正，不自然地侧眼瞟了一下旼炡，只等她开口。</p><p class="story-paragraph dialogue">「不是该先挨训吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我可还没消气呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「只是你昨天哭得太伤心，所以先忍住了。今天我不会再放过你的」</p><p class="story-paragraph dialogue">「...到底想说什么？」</p><p class="story-paragraph dialogue">「这段时间想说的所有事情」</p><p class="story-paragraph">面对那张毫无笑容的脸，实在无话可说。宁愿挨个巴掌或被打个几拳就结束，但依照现在的情况，绝不可能那样就放过我。焦急地往嘴唇涂了点唇膏，那淡薄的眼睛直视自己，并叫出了名字。</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「那天为什么把我丢下了？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不说也能想象得到。要不要来猜一猜？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「又是独自思考就突然暴走了吧」</p><p class="story-paragraph dialogue">「突然暴走？」</p><p class="story-paragraph dialogue">「在想别的事情时，姐姐最擅长的就是突然自言自语」</p><p class="story-paragraph dialogue">「我平时不会那样」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「当然...可能是在旅行的时候变严重了」</p><p class="story-paragraph">事实上，现在没办法多说什么。知珉双手整齐地放在膝盖上，紧握拳头又反复张开。鸭子一家在这段时间早就悠悠地消失了，视线无处安放。旼炡噗哧一笑，像嘲弄一样重复自己最后一句话。啊，平时不会这样吗？</p><p class="story-paragraph dialogue">「所以姐姐可以分成旅行模式和日常模式吗？」</p><p class="story-paragraph dialogue">「我本来不是这么浮躁的人」</p><p class="story-paragraph dialogue">「怎么一直在狡辩，心虚了吗？」</p><p class="story-paragraph dialogue">「只有和你在一起的时候，才会出现这一面」</p><p class="story-paragraph dialogue">「太好了，那就继续那样生活」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不要再勉强自己模彷奇怪的人」</p><p class="story-paragraph dialogue">「…说什么模彷」</p><p class="story-paragraph dialogue">「总是像个机器人一样配合对方。我实在看不下去了」</p><p class="story-paragraph">等一下，这是什么意思？不禁提高嗓门，而旼炡只是张开嘴叹了口气。她到底是真的鼻子痒，还是和自己一样紧张呢。在旼炡用连指手套摸了几次鼻尖时，知珉下意识挺直了腰杆。</p><p class="story-paragraph dialogue">「我来模彷一下姐姐打电话的样子怎么样？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「没有什么特别的事情吗？工作很累吧。不用担心」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我想你了，我也爱你」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「每次说出这种刻在模板上的话，心里都在想什么呢？」</p><p class="story-paragraph">听见一句句熟悉的话，知珉不禁羞愧难当。我每天晚上和明俊通话，她到底看了多少天？从她嘴里再现自己枯燥乏味的声音，让人非常惊慌。虽然有预想会被严厉地指责，但没想到会提及这样的话题。即便已经低头不语，旼炡也没有顾及自己，继续用明亮的嗓音说。</p><p class="story-paragraph dialogue">「连台词都一模一样，边打瞌睡边说也不会出错」</p><p class="story-paragraph dialogue">「金旼炡，到此为止吧」</p><p class="story-paragraph dialogue">「我都还没开始呢？」</p><p class="story-paragraph dialogue">「你...来这儿是为了跟我吵架吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">哈。气得话都说不出口。才刚见面不久，真不敢相信和好不容易相逢的旼炡之间，再次出现了难以忍受的不和谐音。昨天在电话里安慰我不要哭的甜言蜜语，还有今天刚见面时笑眯眯的笑眼都消失无踪。现在是什么让你如此不满，以至于一脸不悦地与自己争论。</p><p class="story-paragraph dialogue">「我无法理解喜欢这些的男朋友」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「他只要你做出人偶般的反应就满意了吗？」</p><p class="story-paragraph">冷漠的眼神十分陌生。嘴里故意说出如匕首一般伤人的话语。尽管知道这明显是在挑衅，但还是没办法冷静思考。事实上，自己无法适应的，是冲突爆发的现状。因为这是自己第一次，可能伤害到对方地、和别人大声争吵。甚至那个对方，竟是等待了一整天的金旼炡。太不像话了啊。知珉只能表情凝重地面对旼炡。</p><p class="story-paragraph dialogue">「你知道自己现在说的话已经越线了吗？」</p><p class="story-paragraph dialogue">「那只是姐姐定好的界线吧。那我才不管」</p><p class="story-paragraph dialogue">「你真的...」</p><p class="story-paragraph dialogue">「就这样每天按时打电话，但你的脸上从来没有灿烂地笑过」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「没有和我在一起时那样的笑容」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是姐姐最终还是选择了来这里」</p><p class="story-paragraph">现在不一样了，虽然醒悟得有点晚，但至少现在不同了。</p><p class="story-paragraph dialogue">「刘知珉的优先顺序第一位是什么？」</p><p class="story-paragraph">是你。</p><p class="story-paragraph dialogue">「我也思考过，也许姐姐想守护的不是爱情...」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「可能是自己的体面？」</p><p class="story-paragraph dialogue">「…金旼炡」</p><p class="story-paragraph dialogue">「说说看，逃跑后你对他的罪恶感有消失吗？」</p><p class="story-paragraph dialogue">「我真的...真的生气了，别说了」</p><p class="story-paragraph">知珉握紧拳头，用颤抖的嗓音艰难地吐出这句话。也许她的眼底蕴藏太多力量，所以无法直视吧。不想连续两天让她看到自己丑陋的面容。虽然你受到的伤害，无论我怎么安慰都不会好起来。但是够了，拜托、已经够了。</p><p class="story-paragraph dialogue">「是因为听到这样的话生气吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你到现在为止有生过气吗？」</p><p class="story-paragraph">已经到极限了。</p><p class="story-paragraph">直到最后，知珉实在受不了这种咄咄逼人的语气，举起了手。旼炡虽然认为会被打但没有回避，反而紧紧闭上了眼睛。几秒钟过去，那只手几乎停在了她的脸颊旁。只见知珉急促地喘着气放下胳膊，旼炡才睁开半眯着的眼。</p><p class="story-paragraph">无力地背靠在长椅上，用颤抖的手捂住了脸庞。旼炡呆呆地看着这一幕，然后稍微往旁边靠近。只剩下马上就能触碰到彼此的空隙。</p><p class="story-paragraph dialogue">「没上钩啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还以为会用尽全力打个五下左右」</p><p class="story-paragraph dialogue">「旼炡啊，我」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我真的很讨厌你说这种惹人生气的话」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是现在，不管你对我说什么...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我都不可能打你的」</p><p class="story-paragraph dialogue">「...为什么？」</p><p class="story-paragraph">因为我的优先顺序除了你之外，再没有其他了。</p><p class="story-paragraph dialogue">「我知道我错了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「也知道即使对你说一百遍对不起也不够。但是...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「一定要一见面就针锋相对吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我真的很讨厌被用这样的方式试探、动摇」</p><p class="story-paragraph dialogue">「讨厌也没关系」</p><p class="story-paragraph dialogue">「…什么？」</p><p class="story-paragraph dialogue">「因为以后也会一直这样」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「每当你一个人苦恼、一个人随便下结论时，我还是会继续动摇你的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐不喜欢因为自己，让问题扩大吧？」</p><p class="story-paragraph dialogue">「嗯...」</p><p class="story-paragraph dialogue">「因为这样的性格，所以也没有和谁大吵过吧」</p><p class="story-paragraph">是这样没错，但实在没必要连这些第一次都献给你。</p><p class="story-paragraph dialogue">「但那是个坏习惯」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那天晚上真的很累了，但为什么一句话都不愿对我说呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「这很难吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「反正只要姐姐一通电话，我就会义无反顾地来找你」</p><p class="story-paragraph">今天好几次令自己心脏骤停的坏心眼，现在才终于开怀大笑。由于这种被隐藏摄影机拍摄般的迷惑感，眼眶再也无法忍住泪水。旼炡长叹了一口气，直到这时才摘下手套。昨天手机画面中的白皙手掌朝脸庞靠近，轻轻抚摸着自己的眼角。哎哟、水龙头又打开了...</p><p class="story-paragraph">以后如果有任何烦恼，不要一个人闷在心里，一定要说出来。语气像是告诫小孩般说道。知道了。旼炡虽然点了点头，但对这个回答还是不信任地嘟囔着。</p><p class="story-paragraph dialogue">「既然这样，要不要做个练习？」</p><p class="story-paragraph dialogue">「练习？」</p><p class="story-paragraph dialogue">「姐姐这段期间有没有对我感到心寒的事情？」</p><p class="story-paragraph dialogue">「...没什么特别的」</p><p class="story-paragraph dialogue">「什么呀，不可能一个都没有吧。我们都在一起好几个星期了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「互相跟对方说怎么样？」</p><p class="story-paragraph">但知珉只是眨巴着大眼睛，旼炡则一下子举起双手。如果一时说不出来，我可以先说吗？接着像等这机会等待许久一样，一、二、三，把手指一个一个折了起来。不会是超过三个吧？那种程度应该有哦。旼炡一边回答、一边笑嘻嘻地耸着肩膀。不知为何，她看起来也太兴奋了吧。</p><p class="story-paragraph dialogue">「好，刘知珉需要改正的地方是第一点」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「说了很饱，但你不听，总是喂我吃水果」</p><p class="story-paragraph dialogue">「那是因为你吃得太少了...」</p><p class="story-paragraph dialogue">「现在发言权还在我这」</p><p class="story-paragraph dialogue">「...好的」</p><p class="story-paragraph dialogue">「第二，这点希望立即改善」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「用脚趾摇摇晃晃地夹起我的东西递给我。第一次见的时候说实话，受到不少惊吓」</p><p class="story-paragraph dialogue">「那是很琐碎的小问题吧...」</p><p class="story-paragraph dialogue">「站在共用房间的人的立场上来看，一点都不琐碎」</p><p class="story-paragraph">虽然才到第二点，但挫折感比想象中要大。怎么办。虽然正在挨骂，但是能不能干脆把她碎念的嘴堵上呢。要不让她吃个暴栗之类的。</p><p class="story-paragraph dialogue">「第三，这点为了自己一定要改正」</p><p class="story-paragraph dialogue">「我已经开始害怕了...」</p><p class="story-paragraph dialogue">「洗完自己的内衣裤，直接挂在毛巾架上」</p><p class="story-paragraph">知珉低下头，像个罪人一样默哀的时候，旼炡干脆举起手指指点点，嘴上像装了马达一样追问。不考虑一起生活的人吗？你知道每次我进浴室有多惊吓吗？即使我把它放在一边，它又会被重新挂起来，还以为在抗议呢。或者是在对我... 发出什么信号？但想想好像也不是。结论就是，姐姐完全不顾及室友也没有眼力见。有需要反驳吗。</p><p class="story-paragraph dialogue">「…拜托告诉我结束了」</p><p class="story-paragraph dialogue">「不，最糟糕的还没说」</p><p class="story-paragraph dialogue">「什... 什么...」</p><p class="story-paragraph dialogue">「自己开心的时候随便亲亲，到处磨蹭，结果突然一说困了，在三分钟内直接睡着」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「某人看来真自私，是吧？」</p><p class="story-paragraph">根本不是向姆明炫耀的时候、也不是边买花边哼歌的时候。原来金旼炡今天是为了让刘知珉颜面扫地，特地来报仇的。想说来这么痛快就来伦敦，怎么回事呢。知珉揪住自己晕眩的脑袋叹息道。</p><p class="story-paragraph dialogue">「突然头痛... 可能是低体温症...」</p><p class="story-paragraph dialogue">「说什么呢。现在轮到你发言了」</p><p class="story-paragraph dialogue">「将我凌迟处斩之后，还把发言权交给我，真是太感谢了」</p><p class="story-paragraph">姐姐有几个想说的？虽然艰难地撑到现在，但是心里真的想不到。知珉沉默不语，旼炡则严厉地催促道。难道还没想到吗？感到心寒的、对金旼炡感到心寒的地方。从头到尾回想起来，脑袋中也只有这点了。</p><p class="story-paragraph dialogue">「昨天打电话的时候没有露脸」</p><p class="story-paragraph dialogue">「就这一个？」</p><p class="story-paragraph dialogue">「除此之外没别的了」</p><p class="story-paragraph dialogue">「什么啊... 别骗人了」</p><p class="story-paragraph dialogue">「是真的」</p><p class="story-paragraph">也许并不是预料之中的回答，旼炡干脆侧过身子，带着失落的表情嘀咕。这点应该除外啊，都不是在一起的时候发生的事情，怎么能一点遗憾的事都没有呢？那说了四个的我算什么。姐姐是不是对我一点都不感兴趣？</p><p class="story-paragraph dialogue">「想法不要那么飞跃。慢慢想到就会告诉你」</p><p class="story-paragraph dialogue">「那对我没有什么好奇的吗？」</p><p class="story-paragraph dialogue">「那倒是有」</p><p class="story-paragraph dialogue">「什么呀？」</p><p class="story-paragraph dialogue">「你是从什么时候开始喜欢我的？」</p><p class="story-paragraph">问题都还没问完，旼炡咳嗽就接连不断，并用手拍打胸口。明明今天说什么都应对如流，结果被问到这种问题好像很尴尬呢？再稍微诱导，希望让她更加慌张。</p><p class="story-paragraph dialogue">「眼睛都不眨一下就直接问了这种问题...」</p><p class="story-paragraph dialogue">「不是让我随便问吗？」</p><p class="story-paragraph">但是那咳咳的声音听起来不像呛到，而是像咳嗽声。仔细看的话，她的眼睛好像也比平时更红，昨天打电话时还连续打了三次喷嚏，难道是身体不舒服吗？你感冒了吗？即使自己都这样问了，旼炡也像个不愿吃感冒药的孩子，皱着眼睛默默不答。</p><p class="story-paragraph dialogue">「金旼炡，你感冒了吗？」</p><p class="story-paragraph dialogue">「得了超级重感冒，干嘛？」</p><p class="story-paragraph">咳咳。旼炡再次发出像小动物一样的喘息声，赶紧用手捂住嘴。知珉以为自己眼花了，更专注盯着她看。刚才她说话时手总是往下，一直没来得及察觉，现在才发现，捂着嘴的白皙手背上布满了创可贴。看到那些透明的绷带下，一道道红肿的伤痕，不禁生气地拽住她的手腕，猛地抬起来。你的手怎么这样了？</p><p class="story-paragraph dialogue">「不是说没受伤吗？昨天跟我说谎了吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「原来是为了遮住这个，才戴着手套像个傻瓜一样吃东西啊」</p><p class="story-paragraph">你又不是拳击手，这到底怎么回事？遇到北极熊和牠打架了吗？那我应该没办法来这儿吧...不是、没出什么大事故。旼炡的声音渐渐缩小，噘起唇嘟着嘴说。只是脚踩空了，在雪路上踩到冰滑倒了，刚好也没戴手套...</p><p class="story-paragraph dialogue">「...太伤心了」</p><p class="story-paragraph dialogue">「伤心吗？姐姐都到了现在才觉得伤心吗？」</p><p class="story-paragraph dialogue">「为什么又突然生气？」</p><p class="story-paragraph dialogue">「重要的时候不在身边，现在才迟来的对我这么温柔」</p><p class="story-paragraph dialogue">「对不起...」</p><p class="story-paragraph">剥夺小鸟宝宝监护人的资格。谁晓得视线才离开几天，就会发生这种不幸意外。知珉一边求饶一边道歉，突然想起了刚才的重要提问。至少要听到回答后再结束，不能就这样不了了之。</p><p class="story-paragraph">刚才问的问题还没告诉我答案啊，从什么时候开始喜欢我的。旼炡立即摇摇头说真爱纠缠，然后把脸深深地埋进围巾里。只露出一双圆圆的眼睛，特别可爱，又不是五岁小孩，以为这样就看不见你了吗？</p><p class="story-paragraph dialogue">「可能很久之前就开始了吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「当时好像没有自觉...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「总之就是这样，结束」</p><p class="story-paragraph dialogue">「什么啊...这么没有诚意的回答。害羞了吗？」</p><p class="story-paragraph dialogue">「现在跳过这个话题吧...」</p><p class="story-paragraph">谁说的？把她的帽子往上拉一下，泛红的脸展露无遗。在这样的状态下，旼炡张开双臂挣扎着。问她突然干什么呢，便听见她无奈地轻哼。姐姐常常自己说完都会忘记吧？</p><p class="story-paragraph dialogue">「你刚不是问我可以抱抱了吗？」</p><p class="story-paragraph dialogue">「...啊」</p><p class="story-paragraph dialogue">「气都消了，现在可以抱了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还有，刚才说了很重的话，对不起」</p><p class="story-paragraph">出大事了。</p><p class="story-paragraph">怎么被这么可爱的孩子吃得死死的。</p><p class="story-paragraph">好不容易得到许可，赶紧朝她扑过去。由于力量控制得不好，瘦弱的身子向旁边倾倒，原本坐着的身体翻躺下去。原本坐在长凳上的旼炡，撞到后脑勺，用力皱起了眉头。</p><p class="story-paragraph dialogue">「不是说了抱抱，有让你躺下吗…快起来」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「大家都在看，不要用脸蹭衣服」</p><p class="story-paragraph dialogue">「谁在看都无所谓」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「比起姆明，还是金旼炡更柔软、更温暖、更好」</p><p class="story-paragraph dialogue">「不要拿人跟毛绒娃娃比」</p><p class="story-paragraph dialogue">「...我想你了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「非常非常」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「你呢？」</p><p class="story-paragraph dialogue">「...我也是」</p><p class="story-paragraph">听说只要闻到恋人的气味，就能很快入睡。在这个状态下一点也不想睁开眼睛，或许这句话说得没错。一把将自己的脑袋按在胸前，旼炡的手摸了摸自己的后脑勺。这段时间的辛苦，终于有了回报。好幸福。感人的重逢场面，没有任何不足。公园约会大成功。</p><p class="story-paragraph dialogue">「知珉姐姐、那个...」</p><p class="story-paragraph dialogue">「干嘛一直叫我」</p><p class="story-paragraph dialogue">「现在好像该起来了」</p><p class="story-paragraph dialogue">「才刚抱没多久，为什么一直让我放开」</p><p class="story-paragraph dialogue">「从刚才开始，就有人在偷吃我们的炸鱼薯条」</p><p class="story-paragraph dialogue">「...谁会做那种没常识的事？」</p><p class="story-paragraph dialogue">「在姐姐后面的巨大鹈鹕」</p><p class="story-paragraph">彷彿为了印证了那句话，传来刺耳的哭喊。哎，那你得赶快告诉我啊！急忙转身一看，只见一只鹈鹕一口一口吃掉旼炡剩了大半的炸鱼薯条。知珉赶紧把旼炡当作护盾，从混乱的场面中转过头来。</p><p class="story-paragraph">环顾四周，发现还有两三只体型差不多的大鸟。可能是炸鱼的味道从原地飘散出去，现在身处的不是美丽的公园，简直是地狱。也许直接在这里晕倒还比较干脆...</p><p class="story-paragraph dialogue">「没事吧？脸色都发白了？」</p><p class="story-paragraph dialogue">「旼炡啊，我... 我有鸟类恐惧症。那么大只的鸟有点...」</p><p class="story-paragraph dialogue">「那你刚才怎么不说要出去呢？为什么要进来鸟类公园？」</p><p class="story-paragraph dialogue">「谁能想到我会在长椅上被袭击...」</p><p class="story-paragraph dialogue">「真的很大只，还是来拍个照吧」</p><p class="story-paragraph dialogue">「现在是拍照的时候吗？应该想办法把他们赶走吧」</p><p class="story-paragraph dialogue">「我吗？」</p><p class="story-paragraph dialogue">「不是你谁来，我来吗？」</p><p class="story-paragraph dialogue">「姐姐真是不像话」</p><p class="story-paragraph dialogue">「不过小心点。听说有人因为被鹈鹕啄伤失明」</p><p class="story-paragraph dialogue">「别推着我的后背一边说这种可怕的话」</p><p class="story-paragraph">知道了，去不就行了吗？旼炡一脸无奈从长凳上站起来，走向和自己差不多大的鸟。嘴里叼着油炸食品的鹈鹕也瞪着大眼睛接近旼炡。眼睛太可怕了，嘴也特别大，简直像鳄鱼。金旼炡这样的孩子会不会被一口吃掉？没问题吗？突然想到，好像在某处看过鹈鹕把小狗活生生吃掉的新闻。</p><p class="story-paragraph dialogue">「不要离得太近...把你吃掉怎么办...」</p><p class="story-paragraph dialogue">「不是你叫我赶走的吗？别嚷嚷了，能不能老实待着？」</p><p class="story-paragraph">虽然嘴上无法说出口，但远远的，心里还是很努力地为她加油助威。旼炡啊、吼牠，不然就咬牠吧，赶快赶走那只怪鸟。旼炡挥舞着纸张般纤细的胳膊，但鹈鹕只是呆呆地站着，又大力挥动手臂威胁了几下，这时牠才扑棱着翅膀飞走了。</p><p class="story-paragraph dialogue">「都走了，可以了吧？」</p><p class="story-paragraph">啪啪，用手拍了拍回到主人身边的忠犬马尔济斯。真有用啊，身材虽小但很勇猛，看起来还真有点帅... 知珉怀着自豪又美丽的心情，紧紧拥抱在与鸟类的战斗中获胜的旼炡，并拍拍她的屁股。</p><p class="story-paragraph dialogue">「做得好，非常勇猛」</p><p class="story-paragraph dialogue">「明明是称赞，但是心情感觉不怎么好...」</p><p class="story-paragraph dialogue">「今天要不就这样把金旼炡绑走好了？」</p><p class="story-paragraph dialogue">「你想带我去哪？」</p><p class="story-paragraph dialogue">「当然是我家了不然呢？」</p><p class="story-paragraph dialogue">「原来还是个富翁啊，在伦敦有房子吗？」</p><p class="story-paragraph">等等。现在想来，那不是我家啊。</p><p class="story-paragraph dialogue">「不...现在该去找找酒店了...」</p><p class="story-paragraph dialogue">「怎么突然变得小心翼翼...」</p><p class="story-paragraph dialogue">「我可以欠你个人情吗？我会做很美味的早餐」</p><p class="story-paragraph dialogue">「如果可以接受睡地板的话。房租就我来出」</p><p class="story-paragraph dialogue">「姐姐跟你一起用床也没关系啊」</p><p class="story-paragraph dialogue">「谁说好了吗？又想像之前那样随便摸完直接睡着吗？」</p><p class="story-paragraph dialogue">「....」</p><p class="story-paragraph dialogue">「但如果收下我的礼物，我会考虑一起睡的」</p><p class="story-paragraph dialogue">「...礼物？」</p><p class="story-paragraph">这才想起，昨天说过有想要给自己的东西。会不会是冰岛的纪念品呢？难道和自己一样准备了花吗？或者虽然感觉太过了，也不是没想过送戒指。也可能是一笔一画用心写的亲笔信之类的。是不是抱太大期望了？不管怎样，知珉兴奋地、恭敬地伸出双手，眨了眨眼睛。</p><p class="story-paragraph dialogue">「快点给我吧」</p><p class="story-paragraph dialogue">「期待什么呢？不是实物」</p><p class="story-paragraph dialogue">「什么啊... 那是」</p><p class="story-paragraph dialogue">「姐姐失望地太明显了吧...」</p><p class="story-paragraph">旼炡从牛仔裤口袋里掏出的，是一张皱巴巴的飞往伦敦的机票。为什么把垃圾扔给我？旼炡严肃地咳了一声。好好读，这不是垃圾而是保证书，是我亲自写的，针对刘知珉的反省文。</p><p class="story-paragraph">她到底在说什么。知珉一脸诧异地看着手上的机票，只见背面写有令人难以读懂的涂鸦般的字样。最上面大大的标题写着《青蛙保证书》几个大字。</p><p class="story-paragraph dialogue">「这...这是什么啊？」</p><p class="story-paragraph dialogue">「快复诵吧。开始」</p><p class="story-paragraph dialogue">「现在？在这里？」</p><p class="story-paragraph dialogue">「现在应该庆幸不需要跪下」</p><p class="story-paragraph dialogue">「好的...」</p><p class="story-paragraph dialogue">「不开始吗？」</p><p class="story-paragraph dialogue">「我...我、刘知珉...」</p><p class="story-paragraph dialogue">「别结结巴巴的，声音也太小了。重来」</p><p class="story-paragraph dialogue">「等一下，为什么打开相机？」</p><p class="story-paragraph dialogue">「我会把这作为证据留下来的」</p><p class="story-paragraph dialogue">「太过分了，简直是对人格的侮辱」</p><p class="story-paragraph dialogue">「想想姐姐自己做的事，这一点都不过分」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「作为参考，是录视频。好了、Cue」</p><p class="story-paragraph">活着活着真是什么事都得经历。我怎么会喜欢上这种奇怪的孩子呢。为什么要在伦敦的公园读这种东西呢？虽然心中不停抱怨，但知珉还是叹了口气，转动了默珠戒指画十字圣号。请帮助我顺利地从金旼炡挖的陷阱中逃脱，并尽快逃离这个侮辱人的现场。不过没办法，该读的还是要读。</p><p class="story-paragraph dialogue">「我刘知珉...」</p><p class="story-paragraph dialogue">「对金旼炡犯下了一个大错」</p><p class="story-paragraph dialogue">「真心反省」</p><p class="story-paragraph dialogue">「呀、这根本不是反省文，而是威胁恐吓...」</p><p class="story-paragraph">都说了正在录影，不要说一些有的没的，请继续读。旼炡集中精神将视线固定在相机上，轻轻摆手。看起来完全没有听取自己意见的想法。</p><p class="story-paragraph dialogue">「无论下雨还是下雪」</p><p class="story-paragraph dialogue">「心里只想着旼炡、只注视着旼炡…」</p><p class="story-paragraph dialogue">「我将把今后的人生都奉献出来」</p><p class="story-paragraph">最后一排也不要忘了读，应该还没结束吧？我会念的，我要念了，你能不能关掉相机？不要，那可是重点。知珉一边思考，不是身在韩国是该感谢的事情吗，一边闭着眼睛喊道。</p><p class="story-paragraph dialogue">「...噹噹约定。呱、呱、呱」</p><p class="story-paragraph">听见呵呵的笑声、看着她笑眯眯的双眼，看起来高兴得要死。见她这般笑得合不拢嘴的模样，是迄今为止看过金旼炡的表情中最幸福的。早知道刚才就用五倍力气打人了。绝对不会忘记今天受到的屈辱。</p><p class="story-paragraph dialogue">「...你现在是连我这样瞪着都拍下来了吗？」</p><p class="story-paragraph dialogue">「嗯，脸还放大了」</p><p class="story-paragraph dialogue">「删掉」</p><p class="story-paragraph dialogue">「啊，为了忍住笑，相机一直在颤抖。完全是名场面...抱歉，我们再拍一次吧」</p><p class="story-paragraph dialogue">「想被埋在这里，就继续吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你... 是为了给我这样的东西才来伦敦的吗？」</p><p class="story-paragraph dialogue">「不行吗？」</p><p class="story-paragraph dialogue">「让人觉得羞耻，很开心吗？」</p><p class="story-paragraph dialogue">「我这机票钱花得很满意」</p><p class="story-paragraph dialogue">「别说了...」</p><p class="story-paragraph">模拟比赛的结果是大惨败。没想到竟然准备了这份超出预想的大礼。甚至在读草稿的时候，还稀里糊涂地向她表白了。但准备好的花该怎么办呢？发出青蛙叫后，再把花送她也太奇怪了。真可恶，还是干脆别送了吧。</p><p class="story-paragraph">知珉按住刺痛的太阳穴。这么闹哄哄的一天到底过了多久啊。望着被染红的天空呆坐着，正好远处传来叮叮噹噹的钟声。太阳快下山了，现在大约四点左右吧。旼炡向钟塔方向的夕阳望去，猛然站起身来，脸色发青，整个人僵住了。请问现在是四点了吗？</p><p class="story-paragraph dialogue">「嗯。四点多了吧？」</p><p class="story-paragraph dialogue">「怎么办，出大事了...」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「我忘了有时差，算错了」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「对不起我得走了。已经晚了」</p><p class="story-paragraph dialogue">「为什么？本来不是说好这个时间见面的嘛」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「有其他约会吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「跟谁...？」</p><p class="story-paragraph dialogue">「秘密，反正我先走了」</p><p class="story-paragraph dialogue">「喂，你要这样把我留在这里直接走人吗？」</p><p class="story-paragraph dialogue">「觉得可惜的人自己跟上来不就行了吗？」</p><p class="story-paragraph">旼炡留下这句话后，就头也不回地奔向某处。真是无语，刚刚还称赞她是只忠犬，没想到主人会被狗狗遗弃在鸟类公园。完美的计算失误了。和金旼炡在一起，不可能不让自己头疼。静静地呆着也乱七八糟，一天至少会需要狂奔一次。但是没想到来到伦敦后，还会持续这样。</p><p class="story-paragraph">这下得给她系上带GPS的项圈了。知珉一边自言自语，一边追赶旼炡。</p><p class="story-paragraph">一边注视着跑来跑去的浅蓝色帽子，一边离开了地狱。看来旼炡是朝着泰晤士河方向前进。虽然她像只松鼠一样快速奔跑，但在斑马线前被迫停下了，现在正是追赶的绝佳机会。因为伦敦新手金旼炡不会知道，这里独特的步行体系。</p><p class="story-paragraph">在伦敦只要不是大道，就可以无条件横越马路。就算是红灯，如果没车通行，就可以和对面的人对视，直接过马路。法律是这样规定，警察也是这样执行，所以不用担心被抓走。但旼炡对此毫不知情，只是乖乖按下过路按钮。那个傻瓜。</p><p class="story-paragraph dialogue">「臭小狗站住。你要逃到哪里去？」</p><p class="story-paragraph dialogue">「什么啊，怎么马上就跟过来了」</p><p class="story-paragraph dialogue">「因为我的腿比你长」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不是说很着急嘛，不过去干嘛呢？走吧」</p><p class="story-paragraph dialogue">「很危险啊，明明是红灯却要过马路吗？」</p><p class="story-paragraph dialogue">「伦敦本来就是这样」</p><p class="story-paragraph dialogue">「您来这都成伦敦人了啊」</p><p class="story-paragraph">寒冬之下，知珉拉着旼炡的手在西敏桥上奔走，穿梭在一个个慢跑的当地人之间。奇怪的是，一直认为不怎么样的泰晤士河畔，今天看起来格外漂亮，穿越伦敦红灯的人行道也很有趣。桥上排着长队，古典风格的路灯像在告知伦敦的夜晚一样，一个接一个亮起。身边这只淘气的小狗，在伦敦街头奔跑的情景，总是让人忍俊不禁。感觉脚步像是飘在天上。</p><p class="story-paragraph dialogue">「啊，就是这里」</p><p class="story-paragraph">在欢快的奔跑过程中，听见旼炡的声音停下脚步，眼前是城市中心的游乐园。虽说是游乐园，也只有旋转木马和高空秋千而已。这里之所以让游客趋之若鹜，并不是因为零碎的设施。抬起头看，巨型自行车轮般的伦敦眼，在夕阳西下时，遮住了黄昏的天空。</p><p class="story-paragraph">伦敦眼（London Eye）和大本钟是伦敦两大地标，位于宽阔的河畔，是无论身处伦敦任何角落，都能看到的巨型摩天轮。人们排着队，一个个涌进有如宇宙飞船造型的透明椭圆形胶囊里。虽然用钢绳连接的轮轴非常细，但停下的摩天轮中心轴，似乎没有任何问题，慢慢地开始旋转。</p><p class="story-paragraph">旼炡啊，看那边，旼炡啊。在旁边叫了好几次，但旼炡只是用相机纪录下伦敦眼，一边自言自语。哇，摩天轮比哥本哈根的大多了。果然伦敦就是伦敦。</p><p class="story-paragraph dialogue">「约在这里吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「所以是跟谁？」</p><p class="story-paragraph dialogue">「当然是不听话的青蛙姐姐了，还能是谁啊？」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「我是故意跑过来的。因为太明显的话姐姐可能就说不来了」</p><p class="story-paragraph">啊，是吗？</p><p class="story-paragraph dialogue">「我现在对姐姐是不是了若指掌？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还记得刚才读过的保证书内容吧，说说看」</p><p class="story-paragraph dialogue">「我...刘知...刘知珉...」</p><p class="story-paragraph dialogue">「是金鱼吗？这么快就忘了啊」</p><p class="story-paragraph">因为突袭测试才这样啊。不管下雨下雪，一辈子都想着旼炡什么什么...好像有几个这样的句子，但脑海中留下的，只剩呱、呱、呱。真的好烦啊、金旼炡。</p><p class="story-paragraph">放哪里了。不会扔了吧。翻找着包，想拿出青蛙保证书，但密密麻麻贴着创可贴的手突然靠近了眼前。手里拿着的是伦敦眼的门票。因为太过慌张，看着她脸皮厚的面孔和票一起映入眼帘，花了好些时间才理清现况。</p><p class="story-paragraph dialogue">「难道以为我坐飞机来，就是为了给你一张纸吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「要想把人生献给我，这种程度的至少得搭吧」</p><p class="story-paragraph dialogue">「旼炡啊，这可是欧洲最高的。远远超过100公尺...」</p><p class="story-paragraph dialogue">「是的」</p><p class="story-paragraph dialogue">「你明明知道我怕高」</p><p class="story-paragraph">旼炡叹了口气，摇了摇头。高处也害怕、小飞机也坐不了、大声点也会吓一跳、又害怕脱离规定的界限，也没办法先对别人说讨厌的话。如果有全国胆小鬼比赛，姐姐就是第一名。</p><p class="story-paragraph">全都说得没错呢。知珉把视线投向地面，并点了点头，这时旼炡又走近了一步。害怕改变吗？</p><p class="story-paragraph dialogue">「我也很害怕来这里」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「去到大笨钟前，刘知珉真的会在那里吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「如果只有我来了怎么办？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「即使见到面了，会不会再次被拒绝，会不会又马上消失在某处」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但因为你和我约定好了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「实在太想你所以就来了」</p><p class="story-paragraph">在一字一句说话的过程中，两只眼睛一次都没有移开视线。除了从旼炡口中听见的声音以外，其他的一切似乎都被静音了，非常安静。</p><p class="story-paragraph dialogue">「你不懂自己一个人玩游乐设施的心情吧？真的很尴尬、很无趣」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐也是，只是等待很没意思吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「能不能相信我一次？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「如果我在姐姐身边，就不用害怕」</p><p class="story-paragraph">跑过来已经过了好一阵子，奇怪的是依旧呼吸急促，嗓子干渴。再次出现了选择题，现在是需要慎重决定的重要时刻。第一、马上跑过去抱住她。第二、对她说”这种感动的求婚，应该在读青蛙保证书之前先做吧”然后打她后背。然后是第三</p><p class="story-paragraph">再多享受一下唯一一次的珍贵瞬间。</p><p class="story-paragraph dialogue">「还是很可怕」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「搭不了，一看就想吐」</p><p class="story-paragraph dialogue">「开玩笑的吧？」</p><p class="story-paragraph dialogue">「我会像那时候一样挥手，你自己坐吧」</p><p class="story-paragraph dialogue">「哪有那样的」</p><p class="story-paragraph dialogue">「觉得可惜的话就更认真说服我啊」</p><p class="story-paragraph dialogue">「明明听说黄昏时分，在摩天轮前用直接莽撞的台词告白的话，绝对会被骗过来的」</p><p class="story-paragraph dialogue">「听谁说...？」</p><p class="story-paragraph dialogue">「有一个人，在冰岛遇到的贵人」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「结果，演员还真的没有按照剧本去演」</p><p class="story-paragraph dialogue">「剧本？」</p><p class="story-paragraph dialogue">「她带着感动的表情拿起门票。拥抱彼此，牵着手走上前搭上摩天轮。当摩天轮升到最高处时，仰望着夜空亲吻，Happy Ending」</p><p class="story-paragraph dialogue">「...挺具体的啊...」</p><p class="story-paragraph">看样子旼炡也演练得很卖力。而且连一句浪漫的句子都不写不出来的人，能做出这样的举动，看来是在冰岛努力学习的结果吧。不知道是谁教她这些的，到底是从哪里学来这种奇怪的东西。摩天轮？直接又莽撞的台词？冰岛的贵人？这都是什么呀。</p><p class="story-paragraph">尽管如此，一系列看下来旼炡还是取得了不错的成绩。但真的没想到会递出伦敦眼的门票。如果按照满分100 分来算的话，大约能给个95分吧？扣5分是因为惊慌失措、开始乱说心中预想的剧本。虽然久违地看到她无处安放的双眼，确实很可爱，但在这个场景下，很遗憾的也是扣分项目。因此，总成绩为95分。</p><p class="story-paragraph dialogue">「呀，再说说看更莽撞的台词试试」</p><p class="story-paragraph dialogue">「啊呜...真是的...」</p><p class="story-paragraph dialogue">「快点」</p><p class="story-paragraph dialogue">「好吧。你也看到我跟到伦敦了吧？我可是十分执着的，无论姐姐去哪里我都会跟着你」</p><p class="story-paragraph dialogue">「这是什么啊，我养的狗都也不会那样」</p><p class="story-paragraph dialogue">「真的有养狗吗？怪不得手的动作这么熟练」</p><p class="story-paragraph dialogue">「不、没养...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「总之，现在姐姐24小时都不能离开我，去见别人也必须得到允许」</p><p class="story-paragraph">啊、这句话太可爱了，给你加3分吧？目前为止，金旼炡的总成绩是98分。</p><p class="story-paragraph dialogue">「还差2分，该拿什么弥补呢...」</p><p class="story-paragraph dialogue">「真讨厌…没想到这种瞬间还会想别的事情」</p><p class="story-paragraph dialogue">「我承认，这是我的老毛病」</p><p class="story-paragraph dialogue">「真是个奇怪的人」</p><p class="story-paragraph dialogue">「你本来不知道吗？」</p><p class="story-paragraph dialogue">「现在知道了」</p><p class="story-paragraph dialogue">「但还是喜欢我？」</p><p class="story-paragraph dialogue">「喜欢」</p><p class="story-paragraph">忍不住了现在要抱上去吗，还是再等一会儿呢。虽然自己也在认真考虑，但旼炡好像很焦虑，急得直跺脚。这是有时间限制的，搭不上的话姐姐要负责。</p><p class="story-paragraph dialogue">「还有...我都做到这个地步了，算是直接喂到嘴里了吧」</p><p class="story-paragraph dialogue">「...嗯？」</p><p class="story-paragraph dialogue">「姐姐，理想型都送到家门口了，你不抓紧吗？」</p><p class="story-paragraph">等一下、说什么呢？</p><p class="story-paragraph dialogue">「有什么好笑的？」</p><p class="story-paragraph dialogue">「对不起，对刚刚那句话好像需要点…附加说明」</p><p class="story-paragraph dialogue">「不是说喜欢只注视着自己的人吗」</p><p class="story-paragraph dialogue">「首先，你身高不是不到185嘛」</p><p class="story-paragraph dialogue">「我直接删除了身高」</p><p class="story-paragraph dialogue">「竟然随便改别人的理想型...」</p><p class="story-paragraph dialogue">「刘知珉」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我本来可是看着世界上最美丽的天空，为了见你才来到这的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「哪还有人能像我这么喜欢姐姐这种自私鬼的」</p><p class="story-paragraph">全国的金旼炡可能有五万人还是十万人。01年1月1日生的金旼炡不确定是不是只有这一个。但是看了极光后，因为思念刘知珉而跑来的金旼炡呢。</p><p class="story-paragraph">可以自信地说，不就只有唯一一个人吗？</p><p class="story-paragraph dialogue">「姐姐就只是在这样的氛围下，想开玩笑吧」</p><p class="story-paragraph dialogue">「察觉到了吗？」</p><p class="story-paragraph dialogue">「刚才发现了」</p><p class="story-paragraph dialogue">「...真的吗？」</p><p class="story-paragraph dialogue">「姐姐每次捉弄我时，嘴唇都一动不动的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「非常明显，我只是故意被骗而已」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「在收下这个之前不告诉你」</p><p class="story-paragraph">听到她可爱的威胁，强忍住笑容，紧紧闭上嘴。不管怎么说，自己好像被小狗驯服了。已经尝够甜头的知珉轻轻靠近旼炡，嘴唇贴上她的脸，使劲按压让蓬蓬的脸颊如糯米糕般凹陷下去。右边一次，左边一次，额头也一次。</p><p class="story-paragraph">别在公共场所时不时这样！旼炡一边倒退，一边用袖子轻轻擦拭留有唇印的脸颊。知珉直接无视，又在上面再吻了一次后，她无语地瞪大了眼睛。快接下这个啦。知道了、知道了。知珉努力哄着闹别扭的小狗，把嘴贴在帽子下通红的耳边低语。</p><p class="story-paragraph">旼炡啊。</p><p class="story-paragraph">我也喜欢你。</p><p class="story-paragraph">可能比想象中更喜欢...</p><p class="story-paragraph">初次坐在摩天轮上观看伦敦全貌，感到非常陌生。伦敦眼的摩天轮是25人座，内部非常宽敞，只在中间设有座位。两人乘坐的胶囊形缆车总共搭了十五人左右，门被关上了。接着，伦敦眼开始向上空奋力移动。</p><p class="story-paragraph dialogue">「要坐椅子吗？」</p><p class="story-paragraph dialogue">「不，我想站在边缘看」</p><p class="story-paragraph dialogue">「没问题吗？」</p><p class="story-paragraph dialogue">「不是说只要你在我身边就没问题的吗，即使我晕倒，你也会看着办的」</p><p class="story-paragraph dialogue">「姐姐越来越厚脸皮了」</p><p class="story-paragraph dialogue">「是谁说这种程度必须搭的？」</p><p class="story-paragraph dialogue">「但是刘知珉」</p><p class="story-paragraph dialogue">「是的」</p><p class="story-paragraph dialogue">「从包里露出来的黄色花束...到底打算什么时候给我？」</p><p class="story-paragraph">唉哟？</p><p class="story-paragraph">干嘛看上这个，不是给你的好吗？自己正打算耍赖装蒜时，旼炡盯着自己说。这种东西应该在搭上摩天轮之前给啊，姐姐也看过很多浪漫电影，应该要知道吧？因为她开始一字一句表露不满，知珉决定在被唠叨更多之前赶紧送出去，立刻把花递上。是给你的没错、收下吧。</p><p class="story-paragraph dialogue">「什么啊...」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「这样的日子，即使是便宜的戒指也该买一个来吧，只有花束吗？」</p><p class="story-paragraph dialogue">「这是只给我一张纸条的人该说的话吗…」</p><p class="story-paragraph dialogue">「亏我还有点期待」</p><p class="story-paragraph dialogue">「还有戒指不是已经给你买过了嘛。那个在哪里？」</p><p class="story-paragraph dialogue">「我捐献给了冰岛温泉」</p><p class="story-paragraph dialogue">「你...弄掉了啊？」</p><p class="story-paragraph">旼炡装作没听见，自顾自说起花香很好闻。对自己不利的就不回答了是吧。好在几个小时后从包里取出的玫瑰，还是香喷喷的，她的头发颜色和鲜艳的黄色非常相配。待在一起的话是双倍的华丽。</p><p class="story-paragraph dialogue">「这花长得真奇特，叫什么名字？」</p><p class="story-paragraph dialogue">「猜猜看」</p><p class="story-paragraph dialogue">「我怎么会知道，给点提示吧」</p><p class="story-paragraph">非常简单欸。说完知珉用手指戳了戳自己的脸。</p><p class="story-paragraph dialogue">「刘知珉」</p><p class="story-paragraph dialogue">「...你真的有想猜对吗？那怎么样也不会是花的名字吧...」</p><p class="story-paragraph">好吧，为了傻瓜旼炡的第二个提示。知珉拿起食指上的墨珠戒指，在旼炡面前挥动。和这个有关的，知道吧？旼炡沉思了一会儿，好像明白了什么似的，感叹地喊了一声。</p><p class="story-paragraph dialogue">「...难道是卡塔琳娜？」</p><p class="story-paragraph dialogue">「对，听说叫卡塔琳娜玫瑰」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不觉得很漂亮吗？」</p><p class="story-paragraph">这个真的是我偶然选中的，最近迷上了黄色，恰好这花的名字也叫卡塔琳娜，感觉到了命中注定就买下来了。知珉讲述着街头花店的小故事时，旼炡静静地摆弄着花瓣。就和第一次给她买戒指时一样，那样静静地看着。</p><p class="story-paragraph dialogue">「真漂亮」</p><p class="story-paragraph dialogue">「是啊」</p><p class="story-paragraph dialogue">「今天真的非常漂亮」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「我在说花，卡塔琳娜玫瑰」</p><p class="story-paragraph">在可爱的笑容背后，橘红色的晚霞格外灿烂。旼炡身后的伦敦，看起来就像迷你模型。今天的约定场所——大本钟塔、和远处的圣詹姆士公园。疯狂奔跑过的西敏桥的灯光、以及底下流淌的泰晤士河。还有将这些不现实的事物作为背景，出现在眼前的这个人，全都一起攀升至半空中。</p><p class="story-paragraph">摩天轮到达顶端后，慢慢停了下来。旼炡靠在窗边，观赏着风景。与她空着的手十指紧扣，拉向自己。旼炡似乎被这举动吓了一跳，视线不禁朝这边看。</p><p class="story-paragraph dialogue">「...怎么了？」</p><p class="story-paragraph dialogue">「你也是 没有忘记什么吗？」</p><p class="story-paragraph dialogue">「没有啊？」</p><p class="story-paragraph dialogue">「有啊，最重要的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不是说要在摩天轮里接吻吗，臭小狗」</p><p class="story-paragraph dialogue">「...啊」</p><p class="story-paragraph dialogue">「现在到最高点了。这里不就是高潮部分吗？」</p><p class="story-paragraph dialogue">「不是...我本来以为只有两个人坐...」</p><p class="story-paragraph dialogue">「就应该好好了解过再制定计划」</p><p class="story-paragraph dialogue">「这应该也适合对某人说」</p><p class="story-paragraph dialogue">「今天是我第一次坐摩天轮，本来还有点期待」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那个...耳朵能靠近一下吗？」</p><p class="story-paragraph">把头低下，但旼炡忽然犹豫不决，终于把嘴贴在耳边。看似要说什么重要的事，但过了好一阵子都没听见她出声。刚把耳朵移开，她又闹着要自己快过来。</p><p class="story-paragraph">又再等了一阵，当摩天轮再次开始移动，小声到其他人听不见的声音，一个字一个字清晰地传了出来。</p><p class="story-paragraph">刘知珉我爱你。</p><p class="story-paragraph">这世上最喜欢姐姐。</p><p class="story-paragraph">第一次听见这句“我爱你”，被可爱得连话都说不出，只有嘴角露出了笑容。旼炡就像刚才一样，把脸深深地埋进围巾，视线再次转向窗外。正好红潮蔓延到两颊，再加上夕阳西下，她的脸像要爆炸一样被染得通红。该怎么给她答复才好呢，虽然考虑了一会儿，但不想改变这可能受到指责的最后回应。</p><p class="story-paragraph">无论再怎么抱怨没有诚意也没用。</p><p class="story-paragraph">从现在开始，你每天都会听到这句话。</p><p class="story-paragraph">知珉把遮住旼炡脸庞的围巾拉下，轻轻地亲吻她的脸颊，依然用其他人都听不见的音量，小声地说。</p><p class="story-paragraph dialogue">「...我也爱你」</p><p class="story-paragraph">就这样，北极狐进入了我的冬天。</p><p class="story-paragraph">在绝对不愿放手的21岁寒冬。</p></div>

          <h2 id="heading-chapter-bonus">北极狐观察日记BONUS</h2>

        <div class="chapter-copy"><p class="story-paragraph">不过知珉姐姐，从今天开始没地方住了吧？现在是流浪汉呢？真的要来我住的地方吗？</p><p class="story-paragraph">如果旼炡大人如此大度我会十分感激的。</p><p class="story-paragraph">同时打开Airbnb和Hotels.com向下滚动,就这样已经过了几分钟。或许是因为心急，脑海里突然掠过她那半开玩笑的话。本来不想给好不容易来到伦敦的旼炡添麻烦，所以特意另外找了酒店。但因为年末连休，已经有一半以上显示Sold Out，这是个大问题。</p><p class="story-paragraph">即使是游手好闲光在这玩，无家可归也是很痛苦的。回到现实问题，能看到大笨钟的西敏区超豪华公寓，现在只存在在梦想中的世界。因为此刻若是一个不小心，说不定只能住到比格林威治更远的地方。</p><p class="story-paragraph">知珉为一夜之间被颠覆的身世叹了一口气，把头撞到桌子上。在伦敦，即使到了冬天，也有很多跑进超市与店员发生争执的高龄流浪汉。几天前还想着“即使发达国家也会有令人遗憾的现实啊”的刘知珉，视野太过狭隘，才会觉得如此安逸。而自己现在这个样子，和流浪汉有什么区别。只是个游客、无所事事的无业游民，眼下无处安身，钱也快花光了，现在怎么办？</p><p class="story-paragraph">从大白天开始，就因资金问题而头痛不已，这时手机响起了震动。乍一看，还以为是垃圾信件那种恶质的广告。本想要封锁号码，但定睛一看，发信人竟是臭小狗。等一下，那必须要读啊。</p><p class="story-paragraph">刘知珉❤</p><p class="story-paragraph">欢迎入住旼炡之家 恭、喜、你！</p><p class="story-paragraph">明天晚7点OPEN！</p><p class="story-paragraph">也请一定要参加MOVIE NIGHT哦哦哦~</p><p class="story-paragraph">P.S.必须带零食☆☆☆</p><p class="story-paragraph">旼炡之家？还有MOVIE NIGHT？带零食？又一个人计划着什么奇怪的事情呢？立即拨通视频通话，一块白色年糕马上从画面上蹦了出来。呀，金旼炡，你现在传来的是什么呀？什么MOVIE NIGHT？</p><p class="story-paragraph dialogue">「嗯嗯，这是庆祝姐姐入住的纪念私人派对啊~」</p><p class="story-paragraph dialogue">「派对？这只有给我吧？」</p><p class="story-paragraph dialogue">「不然还能再叫谁呢...」</p><p class="story-paragraph dialogue">「真的可以一起住吗？」</p><p class="story-paragraph dialogue">「不想就算了」</p><p class="story-paragraph">谢谢、真的谢谢。Nice timing.</p><p class="story-paragraph dialogue">「...不,我要去」</p><p class="story-paragraph">难道是为了不让自己感到负担，才举办这样的活动吗？谢谢你惦记着我。但这句话不容易说出口，所以莫名对无辜的信件内容挑起了事端。喂、刘知珉旁边只有一颗爱心，为什么带零食旁边有三颗星星？看起来好像在重要程度上输了啊。</p><p class="story-paragraph dialogue">「真是什么都...」</p><p class="story-paragraph dialogue">「快点修改」</p><p class="story-paragraph">旼炡摇了摇头，说知道了。按照主办人的权限给你加爱心。然后假装给自己左右两颊各一个吻。现在满意了吗？</p><p class="story-paragraph">没能把刚才的画面截图下来，实在太可惜了。啊，年下太可爱了。虽然其实才差一岁，但金旼炡晚一天出生，成为01年生真是太好了。在伦敦无所事事又怎样、寒冷的冬天无家可归又如何。年下女友为了让自己到她的房间玩，做了那么多可爱的举动。</p><p class="story-paragraph dialogue">「主办人,movie night的服装要求是什么？」</p><p class="story-paragraph dialogue">「睡衣就好」</p><p class="story-paragraph dialogue">「有想吃的东西吗？」</p><p class="story-paragraph dialogue">「既然要买，就买品客吧」</p><p class="story-paragraph dialogue">「知道了，我会准备好的，明天晚上过去」</p><p class="story-paragraph">接下来这两天，知珉真的准备得非常认真。当然指的不是品客，而是体力。</p><p class="story-paragraph">反正是个有大把时间的无业游民，早起沿着河边转一圈，再铺上垫子，用丹田呼吸和瑜伽来热身后，通过强化肌肉运动来完成训练。虽然是冬天，但果然能够出一身汗，不管做什么都很有意义。人果然还是要活动身体。</p><p class="story-paragraph">休息片刻后，看了眼手机，发现接连传来了10条信息。另外还有2个未接来电。发信人果然全是臭小狗。姐姐在做什么？刘知珉在干嘛？不会是忘记约会了吧？有正在路上吗？电话也不接。</p><p class="story-paragraph">因为一整天都在运动，联系断断续续也没办法，看来这让她非常烦躁。姐姐再做一组平板支撑就过去。将这一行发送不久，很快就收到了回复。是运动中毒吗？我是在跟健身教练交往吗？明明一起旅行的时候，早上只是做点伸展运动而已，总之7点准时开始，晚了就自己看著办吧。</p><p class="story-paragraph">如果晚了一分钟，主办人连门都不会给开的。不想挨训，就赶紧洗洗准备吧。</p><p class="story-paragraph">窗外的伦敦今晚也是雾蒙蒙一片，而且淅沥哗啦下着大雨。天气很差又怎样。即使雨滴落在自己伸出的手中，一想到马上就能见到她可爱的脸，嘴角克制不住上扬。当然，并不是期待后面会有什么进展，真的只是很高兴能以纯洁的心态受到邀请...</p><p class="story-paragraph">我知道你很兴奋。</p><p class="story-paragraph">稍微冷静一下再出发吧？</p><p class="story-paragraph">即使不看也能知道在这瞬间嘀嘀咕咕的是谁。金旼炡的弟弟，aka大肚子芬兰河马。</p><p class="story-paragraph">不冷静我也要去。</p><p class="story-paragraph">知珉拽着姆明的脖子走出大门。刚买不久的黄色行李箱闪闪发亮，在身后发出轻快的声响。</p><div class="location-badge"><strong>L O N D O N ：M J ’S  R O O M</strong></div><p class="story-paragraph dialogue">「来了吗？」</p><p class="story-paragraph">目前时间是6点50分，惊险地压线到达。一按下门铃，马上就看见她清爽的脸庞。知珉满脸笑容，抓着事先拿在手上的姆明挥动起小手。旼炡啊，我把你弟弟也一起带过来了。好久不见了吧？</p><p class="story-paragraph dialogue">「我应该没给姆明发邀请函吧」</p><p class="story-paragraph dialogue">「但他说想和我们一起玩」</p><p class="story-paragraph dialogue">「真是位特别的朋友...」</p><p class="story-paragraph dialogue">「他可不是普通的娃娃，话说得可好了」</p><p class="story-paragraph dialogue">「姐姐、拿着娃娃说那种话有点...」</p><p class="story-paragraph dialogue">「为什么悄悄地往后退？」</p><p class="story-paragraph dialogue">「像个宅男，是我非常不想交往的类型...」</p><p class="story-paragraph dialogue">「...我可是收到邀请函来的，能快点让开吗？」</p><p class="story-paragraph dialogue">「但是姆明是不是变瘦了？」</p><p class="story-paragraph dialogue">「那是因为睡觉时被压扁了」</p><p class="story-paragraph">过了好几天，再次抓住姆明胖胖的肚子，带著胁迫的语气说。</p><p class="story-paragraph dialogue">「总之，姆明说他很高兴见到你。让你赶紧抱住他」</p><p class="story-paragraph dialogue">「...又开始了」</p><p class="story-paragraph dialogue">「快点」</p><p class="story-paragraph">河马、在伦敦过得好吗？遇到奇怪的主人脸都凹陷了呢。那个人和长相不同，性格上有很多缺陷。旼炡紧紧抱着娃娃，每一句话都用力击中知珉的要害，还不忘摇了摇头。现在可以了吧？</p><p class="story-paragraph dialogue">「那个...不抱抱我吗？」</p><p class="story-paragraph dialogue">「我为什么要抱一个因为运动一整天联系不上的人？」</p><p class="story-paragraph dialogue">「那都是有理由的...」</p><p class="story-paragraph dialogue">「不要在门口装可怜了，快进来吧」</p><p class="story-paragraph">早知道就不带河马了。收到邀请函的是我，为什么只有你可以抱抱？知珉给姆明送去了威胁的心电感应，跟着旼炡进入了玄关。</p><p class="story-paragraph dialogue">「MOVIE NIGHT算是...某种睡衣派对吧？」</p><p class="story-paragraph dialogue">「不，我们会边看电影，边进行具有深度的讨论」</p><p class="story-paragraph dialogue">「讨论...」</p><p class="story-paragraph dialogue">「你知道Movie Room这个节目吧？就像那样」</p><p class="story-paragraph dialogue">「一定很有意思又有意义」</p><p class="story-paragraph">说什么鬼话。</p><p class="story-paragraph">在公园因为鹈鹕而闹出笑话，但今天已经不同了。交往后第一次进行家中约会。甚至是只有两人一起度过的夜晚。反正之后顶多被狠狠教训一顿，从现在开始，这就是个无处可逃的密室。不管金旼炡怎么闹只要让她躺下一切就在堂握之中就像瓮中捉鳖。自己当然不是无缘无故不分昼夜坚持运动的。明明很想见面但拼命忍住，就是为了锻炼过才来的。</p><p class="story-paragraph">还有一点，想到自己视频通话一边流泪一边说想见面，就觉得非常丢脸，想打破那个印象。一直等到面对面，本来想进行正常告白的，却羞耻地被小狗折磨，甚至从嘴里发出青蛙的叫声。</p><p class="story-paragraph">金旼炡应该还在循环播放吧。今天想快点让她累倒，把她哄睡后，然后永久删除原件。</p><p class="story-paragraph dialogue">「好好给你开门，为什么瞪我？」</p><p class="story-paragraph dialogue">「我原来就长这样」</p><p class="story-paragraph">好啊，反正再等一会儿，就在床上复仇。</p><p class="story-paragraph">准确来说，今天的约会场所——旼炡之家并不是家，而是房间。是在设有公用卫生间和客厅，拥有五六个房间的share house结构。客厅里有男女老少不同国籍的人们，正聚在一起谈笑风生。</p><p class="story-paragraph">想象了一下，大概是和之前住过的宿舍一样，有着小窗户的廉价酒店吧。但说实话，走进房间后有点惊讶。可能是位处城市外围，风景非常好。这种住处怎么弄到的？不贵吗？一问之下才知道，价格远没有想象中高。说是很幸运才预约到，只剩下最后一个房间。</p><p class="story-paragraph dialogue">「好神奇啊，怎么这么便宜？」</p><p class="story-paragraph">听到这句话，旼炡似乎有什么难言之隐，小声说了一句。因为这里的隔音有点...不太行啊，就当没有墙壁吧。这话让人突然好奇起来，知珉竖起耳朵，集中精神，在墙上安静地听了一会。是吗？是能听到一些生活噪音，自己不太清楚，但欧洲老房子不都是这样吗？</p><p class="story-paragraph">无论如何，既然已经摆脱了流浪汉的身份，就直接换上睡衣，躺在宽敞的床上。感觉到被子贴在背上的温暖，再次感到温馨，简直要流泪了。虽然不是我家，但毕竟是我家小狗的家，那就和我家没两样。</p><p class="story-paragraph">但MOVIE NIGHT还没开始，金旼炡眼底的黑眼圈却掉到脸颊上，让人看得十分不安。我好不容易练出了最好的状态，她怎么回事。是不是又快要睡着了？真有点担心邮轮之夜会在今晚再次上演。</p><p class="story-paragraph dialogue">「你看起来很困啊？」</p><p class="story-paragraph dialogue">「有点吧？但看电影没问题的」</p><p class="story-paragraph dialogue">「金旼炡如果今天睡着的话真的...」</p><p class="story-paragraph dialogue">「睡着的话怎么？又要逃跑吗？」</p><p class="story-paragraph dialogue">「有前科的人还是安静闭上嘴吧？」</p><p class="story-paragraph dialogue">「是...」</p><p class="story-paragraph">因为心虚，只好闭紧嘴巴。偏偏上一次看电影的时候有如此惊人的前科，所以无话可说。</p><p class="story-paragraph">放在床上的笔记本电脑锁屏画面中，依然显示着大大的英文名字。旼炡把饮料倒进杯子，连看都没看自己一眼就说。姐姐，别光打混摸鱼，能在我的电脑上开一下Netflix吗？</p><p class="story-paragraph dialogue">「我不是在摸鱼，是在做伸展运动」</p><p class="story-paragraph dialogue">「即使不用眼睛看，也能听到无聊地滚来滚去的声音」</p><p class="story-paragraph dialogue">「也不是什么难事嘛，这种程度还是可以帮忙吧」</p><p class="story-paragraph dialogue">「锁屏画面不是需要密码嘛」</p><p class="story-paragraph dialogue">「猜猜看」</p><p class="story-paragraph dialogue">「我猜吗？」</p><p class="story-paragraph dialogue">「如果猜对了，就给你亲亲」</p><p class="story-paragraph">最近真的沉迷于调教主人的乐趣了是吧。但还是想被亲亲，先努力看看再说。</p><p class="story-paragraph">虽然自己斗志高昂，输入了各种不同密码，但输入栏总是出现请重新输入的警告字样。旼炡、金旼炡、旼炡0101，但金旼炡再怎么随便，也不可能把这些当做密码。</p><p class="story-paragraph dialogue">「...我猜不到，给点提示吧」</p><p class="story-paragraph dialogue">「三个英文字母、四个数字、一个特殊符号,简单吧？」</p><p class="story-paragraph">kmj...？不对啊，要不用这个试试吧。本想着说不定是yjm0411!，结果一输入，画面真的打开了。真是拦不住她啊，又做这种可爱的事。待会儿来床上的话，要给她摸摸头疼爱她才行。原本还咧着嘴笑嘻嘻，结果被背景画面跳出的一张大脸吓了一跳。只见画面上的刘知珉露出灿烂笑容，是在哥本哈根用金旼炡手机拍的自拍。</p><p class="story-paragraph dialogue">「喂，你...把别人的脸...」</p><p class="story-paragraph dialogue">「怎么了？姐姐不是自己留在我的手机里了嘛。那不管怎么用都是我的自由」</p><p class="story-paragraph dialogue">「原来的背景图不是极光照片吗？」</p><p class="story-paragraph dialogue">「比起那个，我拍的天空更漂亮」</p><p class="story-paragraph dialogue">「真的吗？本来那张就超级漂亮了，突然觉得好羡慕啊」</p><p class="story-paragraph dialogue">「是啊，要是没逃跑的话，一定也会一起看的」</p><p class="story-paragraph">飞来的话中一个个都带着刺，总让自己意志消沉。虽然逃跑的烙印无法抹除，但是这种羞辱要持续到什么时候呢？</p><p class="story-paragraph dialogue">「怎么这么慢,Netflix还没开吗？」</p><p class="story-paragraph dialogue">「现在就开...」</p><p class="story-paragraph">首先必须按照房主的指示，乖乖听从才行。如果被赶出这间房子的话，就真的完蛋了。在严寒中，将成为在伦敦卖火柴的小女孩。</p><p class="story-paragraph">连接的Netflix账号名是‘旼炡’。推荐的全都是看了就讨厌的电影，看着这些片名不禁皱起脸，坐在一旁的旼炡则满脸兴奋嘀咕着。我选了几个要一起看的，怎么样？有喜欢的吗？</p><p class="story-paragraph">我的选择清单</p><p class="story-paragraph dialogue">-Sweet Home</p><p class="story-paragraph dialogue">-美国恐怖故事</p><p class="story-paragraph dialogue">-尸战朝鲜2</p><p class="story-paragraph dialogue">-厉阴宅</p><p class="story-paragraph dialogue">-宿怨</p><p class="story-paragraph dialogue">-绝地战警FOR LIFE</p><p class="story-paragraph dialogue">-终极警探：跨国救援</p><p class="story-paragraph dialogue">-延坪海战</p><p class="story-paragraph dialogue">-敦克尔克大行动</p><p class="story-paragraph">从头到尾都是毫无妥协的凄惨名单。知珉不得不为了将来的两个小时，竭尽所能说服旼炡。别这样，今天看爱情电影怎么样？</p><p class="story-paragraph">姐姐也有口袋名单，有名的The Kissing Booth呢？最近人气很高的柏捷顿家族、詹妮弗劳伦斯主演的派特的幸福剧本、或者艾蜜莉在巴黎，这个也可以轻松看...</p><p class="story-paragraph dialogue">「说什么呢，不是说好要看溅血的电影吗？」</p><p class="story-paragraph dialogue">「当时不是约好了嘛。在姐姐抛下我的两个小时前」</p><p class="story-paragraph dialogue">「好吧...看不就行了吗...」</p><p class="story-paragraph dialogue">「要不要把Sweet Home一直看下去？喜欢僵尸吗？」</p><p class="story-paragraph dialogue">「我会从今天开始试著喜欢...」</p><p class="story-paragraph">随着雄壮的前奏的回荡在房内，强制观赏就此展开。旼炡将音量调到了最高，知珉则眼神涣散地入座。开启了开心的movie night。</p><p class="story-paragraph">放映过了10分钟。老早就知道胆小的刘知珉不可能喜欢上僵尸。连缩图都不想看的东西，硬是盯着画面能有什么用，只是产生反效果而已。在这种情况下，只能听着阴森的音效瑟瑟发抖，然后瞥一眼坐在旁边的旼炡。</p><p class="story-paragraph">久违的睡衣打扮总吸引目光。领口宽松的黑色T恤。松垮的格子衬衫，袖子微微遮住小嘴。短裤下露出纤细的腿和贴着大号创可贴的一侧膝盖。在冰面上摔倒的伤口就是这个吗？</p><p class="story-paragraph">应该很疼吧。用手扫过膝盖上的创可贴，旼炡咯吱咯吱地嚼着品客，没什么大不了似地回答。现在只剩下一点淤青，所以没事了。不过你的身体为什么这么滑？</p><p class="story-paragraph">我在冰岛泡了温泉，啊哈。</p><p class="story-paragraph">摸了摸她的腿，一只手不留情啪地拍打自己手背。不要假装在摸伤口，结果偷摸大腿。</p><p class="story-paragraph">被发现了呢，这时候倒很有眼力见。</p><p class="story-paragraph">那么就找一个更像样的借口吧。正好电影里一只变形僵尸跳了出来，手捂着脸，身子完全依靠在她身上。旼炡身体被挤得一晃，像不倒翁一样重新找回重心。</p><p class="story-paragraph dialogue">「干嘛推我？」</p><p class="story-paragraph dialogue">「太害怕了，可以像那时候一样在后面抱着你看吗？」</p><p class="story-paragraph dialogue">「姐姐给你做靠垫吧」</p><p class="story-paragraph dialogue">「借口还真是各式各样...随便吧」</p><p class="story-paragraph">获得同意后赶紧往后挪，胳膊一把缠上她纤细的腰。后座果然是好地方。抱着金旼炡就像抱着小熊玩偶一样，柔软又温暖，刚洗完澡出来的发香也很棒。还能在可爱的肚子上摸来摸去，最重要的是，把视线放在圆圆的后脑勺上，连被压成肉饼的僵尸们也看不见了。</p><p class="story-paragraph dialogue">「果然因为是原创系列吗？」</p><p class="story-paragraph dialogue">「太绝了是吧」</p><p class="story-paragraph dialogue">「别随便乱说」</p><p class="story-paragraph dialogue">「在CG上花了很多钱啊，看到刚刚死掉的场面了吗？」</p><p class="story-paragraph dialogue">「没看到，错过了」</p><p class="story-paragraph dialogue">「姐姐，别再摸我的肚子了，集中一下吧。就我自己在看吗？」</p><p class="story-paragraph dialogue">「我听你说就行」</p><p class="story-paragraph dialogue">「原来根本没想看啊...」</p><p class="story-paragraph">这也被她发现了呢。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「电影结束后...」</p><p class="story-paragraph">话尾含糊不清，掏出她藏在袖子里的手，与她十指相扣。手掌像小狗的脚一样光滑，但手背上贴著的创可贴却很粗糙。</p><p class="story-paragraph dialogue">「可以做吗？」</p><p class="story-paragraph">磨蹭的手不自然僵住。原本固定在屏幕上的视线，稍稍往下沉，接着重新上抬，犹豫不决的那张嘴终于给出答案。</p><p class="story-paragraph dialogue">「不,不行」</p><p class="story-paragraph">什么呀。</p><p class="story-paragraph">这是不是拒绝得太坚决了？</p><p class="story-paragraph">那为什么喊我来房间？旼炡对此冷笑一声，似乎感到无法接受。姐姐、你的思想真不纯洁，为什么叫你？因为没地方住，还不是因为你脸上露出像被抢走肉泥的猫咪表情，看起来太心酸了所以才想共用房间啊，就只是释出善意，非得...</p><p class="story-paragraph">啊，单纯的邀请？只是为了救济流浪汉？但是你知道吧，在西方国家，一起看Netflix和在韩国吃完拉面再走，是同样的意思。而且不是说这是入住纪念私人派对吗，还说不用交钱只要身体来就行了，这样说不是非常可疑嘛，不就是要让人误会吗？我当然以为今天的目的是...</p><p class="story-paragraph">那怎么办！要我怎么说啊！竟然以为是那个意思才叫你的吗？你以为我是姐姐你吗？脑袋里到底装了什么？</p><p class="story-paragraph">知道了就别老乱在屁股上乱摸。后脑勺撞了几下自己鼻子，紧紧抓住双臂不让动。她倒是一个人身体发红，扑腾起来。</p><p class="story-paragraph">不管怎么想，被当面拒绝实在是特别迷茫且无法接受，一边捏了捏她的肚子，一边反问。喂、但是为什么不行？</p><p class="story-paragraph dialogue">「现在都已经交往了，为什么不行？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我是真的很好奇」</p><p class="story-paragraph dialogue">「姐姐难道有健忘症吗？」</p><p class="story-paragraph dialogue">「我只是专注力比较差...」</p><p class="story-paragraph dialogue">「傻瓜，我不是说过自己感冒了嘛」</p><p class="story-paragraph">啊，对了。</p><p class="story-paragraph">虽然她还在吸鼻涕有点可怜，但不想承认这就是拒绝的理由。这两天努力做的肌肉运动呢？这下辛苦完全没了意义。竟然让我看个僵尸电影就结束，太不像话了。</p><p class="story-paragraph">如果是感冒的问题，别接吻不就行了吗...？等一下、你说别什么？刚才那句话未免太糟糕了，简直是垃圾发言吧。抱歉、这当然是开玩笑...开玩笑的。姐姐口中的自言自语100%是真心的，别胡说八道了继续看电影吧，敢碰我一根汗毛的话，自己看着办。</p><p class="story-paragraph">旼炡一转过头，知珉就抿著嘴满脸嘲讽。马尔济斯生气了，真可怕，连主人都要咬。这时，她的后脑勺向后撞过来，直撞上鼻尖。</p><p class="story-paragraph dialogue">「有什么不满就直说吧」</p><p class="story-paragraph dialogue">「...后面有长眼睛吗？」</p><p class="story-paragraph dialogue">「不用看也知道」</p><p class="story-paragraph dialogue">「能知道我在想什么吗？」</p><p class="story-paragraph dialogue">「整个脑袋好像都在想著要脱衣服」</p><p class="story-paragraph">神奇吧。</p><p class="story-paragraph">我家小狗还会读心术。</p><p class="story-paragraph">再一次盯着她的后脑勺，哑口无言。就在这个时候，被迫陷入守势的刘知珉瞬间迎来了大逆转。说得直白一点，隔壁屋子开始办事了。</p><p class="story-paragraph">声响穿过薄薄的墙壁，清晰地传了进来。高亢的嗓音、床撞在墙面上的吱吱声，以及有规律地撞击声，全都融合在一起。隔壁房间的噪音，明显比僵尸的吼叫更强烈。Nice Timing，这么早就开始大战了呢。</p><p class="story-paragraph dialogue">「啊、真是的...那个房间昨天也是这样」</p><p class="story-paragraph">旼炡叹了口气，向发出令人难为情的声音一侧投去哀怨的眼神。原来如此啊，现在才将所有拼图都拼凑起来。原来是因为隔壁房间的情侣睡不好觉，所以黑眼圈才这么重。据悉，旼炡昨天是把被子蒙在头上，用枕头捂住耳朵才勉强入睡。想想就觉得可怜，但现在越来越红的耳朵实在很可爱。如果在上面咬一口又会闹吧。</p><p class="story-paragraph dialogue">「那你昨晚独自在房间干什么了？」</p><p class="story-paragraph dialogue">「还用说吗？什么都没做」</p><p class="story-paragraph dialogue">「没上钩啊...」</p><p class="story-paragraph dialogue">「说什么呢」</p><p class="story-paragraph dialogue">「听着那些声音，心里在想什么？」</p><p class="story-paragraph">她只是动了动手指，理所当然没有回答。黑暗中，看着被电脑光线反射的脸，想起两人在飞机上第一次交谈的瞬间。和那时没有丝毫改变的眼珠，原封不动地展露出情感，一刻也不停歇，骨碌骨碌地滚动著。</p><p class="story-paragraph">像傻瓜一样可爱。</p><p class="story-paragraph">明明你不会说谎、也不会拒绝。</p><p class="story-paragraph dialogue">「现在如何？」</p><p class="story-paragraph dialogue">「现在也没有任何想法吗？」</p><p class="story-paragraph dialogue">「不要离耳朵那么近」</p><p class="story-paragraph dialogue">「...怎么了？」</p><p class="story-paragraph">这次也没有收到回答。</p><p class="story-paragraph">知珉没有再多问，直接把手伸进衬衫下摆。贴近后能感受到背部的温暖，身体不禁颤抖。</p><p class="story-paragraph dialogue">「手好冰...」</p><p class="story-paragraph">抱歉。只做了简单的道歉。旼炡立刻做出反应
