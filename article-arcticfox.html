        <div class="chapter-copy"><p class="story-paragraph">每一天都期待着睁开眼。</p><p class="story-paragraph">仅仅只是看着都觉得幸福的瞬间。</p><p class="story-paragraph">我还以为那只是电影里的故事情节。</p><p class="story-paragraph">半睁着的眼睛，看到的壁钟的指针即将指向八点。知珉在嘈杂的闹铃声成为噪音之前，赶紧关了闹钟。胳膊向上伸展，肩关节咔咔作响。轻轻地扎起头发，走到旁边的床前，看到在被窝里缩成一团的圆形。即使用力揉捏她的脸颊，也只会微微皱眉，平稳的呼吸声依旧。</p><p class="story-paragraph">不用看就熟练地撕下桌子上的一张小纸条。今天写些什么好呢？把笔放在太阳穴上，左思右想，结果还是没有什么满意的想法。旼炡啊，起床后整理一下扔在地上的袜子好吗？但这简直就是唠叨。我看你小熊AirPods弄脏了所以帮你擦干净了。也不是什么大事，感觉太显摆了。苦思冥想，终于艰难地写下了一句话。</p><p class="story-paragraph">昨天鲑鱼很好吃，小厨师。</p><p class="story-paragraph">因为空白处看起来有点无聊，所以画上了穿围裙的狗狗。还自卖自夸了起来。画得挺好的，很可爱啊？感觉挺像的...</p><p class="story-paragraph">旼炡的药箱很久之前就成了知珉的邮筒。旼炡在赫尔辛基身体不舒服的时候，为了说明从药店买回来的药品，才开始放纸条。如今，看到箱子内堆满小纸片，心里有些不是滋味。至今为止，自己从旼炡那收到的，都只有不超过一句话的简短回答。</p><p class="story-paragraph">嗯嗯，嗯。好的，知道了。</p><p class="story-paragraph">好啦好啦好啦~别唠叨了~</p><p class="story-paragraph">就是这种类型的句子。第一次看见她这种回复的时候还特别震惊。说话声音那么可爱，结果转换为文字后看起来毫无诚意，连父母也不会这么回。虽然很清楚性格差异是没办法改变的事，但她每次回答都没有核心内容，始终觉得太可惜了。</p><p class="story-paragraph dialogue">「我明明那么喜欢写信的…」</p><p class="story-paragraph">即使搓着手求她也绝对不会写吧？</p><p class="story-paragraph">对一个连一条短信都不发的人说什么呢。我也知道，所以完全不会期待。知珉撑着下巴，望着睡得很香的那张白皙面孔，摇了摇头。旼炡这段时间翻了几次身，才发现她睡衣都掀起、露出后背了，还沉浸在睡梦中。知珉伸出手指，在洁白的背上小心翼翼地抚摸，然后慢慢地写起字。虽然写满了那么多纸条还是不够，连她光滑的后背都被当成黑板，总觉得自己有点恋爱脑。</p><p class="story-paragraph">金旼炡傻瓜。</p><p class="story-paragraph">睡懒觉的小狗。</p><p class="story-paragraph dialogue">「你不知道我每天早上都这样吧」</p><p class="story-paragraph dialogue">「…衣服都穿不好，就呼呼大睡」</p><p class="story-paragraph">非常非常</p><p class="story-paragraph">喜欢你。</p><p class="story-paragraph">手指接触的背部依然没有动静，呼吸也非常安稳。知珉俯下身子，把乱蓬蓬的金黄色刘海撩开，在光滑的额头上轻轻落下一吻。</p><p class="story-paragraph">...只一下太可惜了，再来一次。</p><p class="story-paragraph">虽然说是一次，但事实上又亲了两次。啾啾声在狭小的房间响起。明明没有其他人，但总感觉从哪里能感受到莫名的视线... 抬头一看，床边的姆明娃娃正用锐利的眼神凝视这边，正好与他四目相对。那呆呆的脸好像在说着。对睡觉的人做奇怪的事情，我都看到了好吗？知珉害羞地干咳了一声，把掀起的睡衣拉回去。</p><p class="story-paragraph dialogue">「你怎么偏偏在那儿」</p><p class="story-paragraph dialogue">「...全看到了吗？」</p><p class="story-paragraph">双手抓住他蓬蓬的肚子进行审问，但目击者没有回答。长相跟某人真是一模一样。今天的事绝对不准对金旼炡说哦、知道了吧？本来正在严格要求保密，突然传来了细微的声音。姐姐。迷茫的眼睛眨了眨，刚睡醒的时候特别像个娃娃。知珉强行拉着姆明的小短手，在旼炡面前挥啊挥。</p><p class="story-paragraph dialogue">「我家小狗，good morning」</p><p class="story-paragraph dialogue">「…一大早就躺在别人床上干嘛啊？」</p><p class="story-paragraph dialogue">「我无聊」</p><p class="story-paragraph dialogue">「那姐姐就去床上做伸展吧」</p><p class="story-paragraph dialogue">「已经做完了」</p><p class="story-paragraph dialogue">「那就先吃个早饭什么的」</p><p class="story-paragraph dialogue">「我自己？当然要一起吃啊」</p><p class="story-paragraph dialogue">「知珉姐姐...你要一直跟我聊天吗？我还想再睡一会儿…」</p><p class="story-paragraph">跟你弟弟打个招呼吧。从刚刚就一直摇着手臂，但是你不跟他打招呼，所以他说他很伤心。对此，旼炡满脸厌恶，并开始嘟嘟囔囔。他为什么是我弟弟，哪里跟我长得像？一边去吧，一大早就莫名其妙。</p><p class="story-paragraph dialogue">「快点」</p><p class="story-paragraph dialogue">「河马你好，早安啊」</p><p class="story-paragraph dialogue">「都说了他叫姆明...」</p><p class="story-paragraph dialogue">「现在可以了吧？快走」</p><p class="story-paragraph dialogue">「睡得好吗？快问他」</p><p class="story-paragraph dialogue">「...这是姆明想听的话吗？」</p><p class="story-paragraph dialogue">「没错」</p><p class="story-paragraph">知珉抓住姆明的后颈，点点头。如果娃娃会说话，也许会有不少意见。旼炡伸着懒腰慢慢直起身来。打哈欠没遮嘴，知珉把手指迅速伸进圆圆的嘴又抽了出来，半梦半醒的脸上露出了微笑。</p><p class="story-paragraph">一有空就想逗我玩，整天都在想这些有的没有吗？俏皮地回应后，旼炡无奈般平静地笑了笑，并挠了挠脸，低声说道。</p><p class="story-paragraph dialogue">「...睡得好吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「什么呀，结果不是姆明，而是自己回答」</p><p class="story-paragraph">虽然很想亲吻她微笑的眼角，但似乎会被唸从早上开始就在干什么，所以还是稍微忍忍吧。别磨蹭了，快起来吃早餐。旼炡挠了挠头，心情似乎很好，闭着眼睛揉了揉脑袋。不能再睡一会儿吗？</p><p class="story-paragraph">不行，行李也还没收拾好。勉强抑制住想要一起赖床的心，故意训了她。你不是说想看海盗船吗？难道要放弃那个吗。啪啪拍了拍圆嘟嘟的脸颊安慰，旼炡才勉强点头说知道了。</p><p class="story-paragraph">知珉来到厨柜前，熟悉地拿了个茶包。在泡茶期间，谨慎挑选小鸟宝宝要吃的水果，这也是早晨的小小乐趣之一，有种自己成为营养师的感觉。昨天吃了很多橘子和草莓，今天正好吃苹果吧。好啊。</p><p class="story-paragraph">苹果可以吗？手里拿着一个熟透的红苹果摇了摇。姐姐想吃什么就吃什么吧。然后就会听见没有任何实质帮助的答复。知珉一边小声哼唱甜美的旋律，一边慢慢移动握着水果刀的手。嚓嚓，削皮的声音立刻在狭窄的房内响起。</p><p class="story-paragraph dialogue">「一边准备早餐还一边哼歌呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐今天心情怎么这么好？」</p><p class="story-paragraph dialogue">「秘密」</p><p class="story-paragraph dialogue">「...什么呀」</p><p class="story-paragraph">透进窗户缝隙的金黄色阳光，窄小的厨房内色彩鲜艳的水果碗。我饿了，快过来。身后充满撒娇的声音。知珉在温暖的早晨中，心情莫名感觉有些微妙。是无法解释的不快。不需要刻意去揣摩的、很细微的不和谐。</p><p class="story-paragraph">奇怪。</p><p class="story-paragraph">明明这时候应该有红茶的味道 。</p><p class="story-paragraph">慌忙回头一看，刚才旼炡躺着的床变得空荡荡，照进房内的和煦阳光也消失无踪。旼炡啊，金旼炡。呼唤了她的名字也没有回应。望着渐渐扭曲的房间，像部没有框架的电影，破碎的影像从眼前掠过。</p><p class="story-paragraph">到了午夜，游乐园的入口就像不能再拖延一样关了灯。哥本哈根的凌晨，看着她的睡脸，像逃跑一样关上门逃了出来。令人窒息的安全带。在天空中看到伦敦华丽的夜景。姐姐就是胆小鬼，姐姐就是胆小鬼。飞行的过程中，耳边一直回荡着她受伤的声音。</p><p class="story-paragraph">知珉无法忍受疯狂涌向自己的记忆碎片，用力睁开眼睛。眼前是一整片白色。</p><p class="story-paragraph">…啊。</p><p class="story-paragraph">我现在，</p><p class="story-paragraph">在伦敦。</p><p class="story-paragraph">茶香之类的，总是很不错吧？</p><p class="story-paragraph">早知道不训斥你，应该多抱抱你的。</p><p class="story-paragraph">再更多...</p><p class="story-paragraph">刚才不是熟悉的早晨，只不过是一个混杂着记忆的梦而已。知珉被挑高的灰色天花板害得头晕目眩，重新闭上了眼睛。暂时回想着再也回不去的晨间时光。</p><div class="location-badge"><strong>L O N D O N : W E S T M I N S T E R</strong><span>伦敦：西敏市</span></div><p class="story-paragraph">越过国境后，起床时间逐渐提前。第一天是8点，第二天是7点半，今天则是7点，再加上过于真实的梦。想要怪在时差，但实际上也才差一小时。还是问题出在长期旅行所积累的疲劳？打开胳膊做起伸展运动，但与梦境中不同，身体一点也不放松。这是带着糟糕的心情，第二次起床。</p><p class="story-paragraph">喝杯茶吧。</p><p class="story-paragraph">缓缓站起身，走到充满冷气的客厅，映入眼帘的是整面镜子倒映出空荡荡的房子。茶包放在哪里了。知珉四处张望，很快就意识到自己真傻。想起来，现在不需要那个了。</p><p class="story-paragraph">今天已经是第三天，没有拿出茶包的日子。因为最近明俊订购的小型胶囊机，能够完全不动手。还能用胶囊泡茶，真是方便的世界。一边想一边按下了启动按钮。挽着胳膊等待了好一阵子，结果机器只发出咔嗒的声音，没有提炼出茶的迹象。机器是不会反抗的，十之八九是人的问题。果不其然，托盘里根本连茶叶胶囊都没放，就启动了机器。不仅是梦中的姆明，如果胶囊机能说话，受了这种委屈肯定有很多意见。</p><p class="story-paragraph">知珉拖着拖鞋，走在冰冷的大理石地板。生薑柠檬路易博士茶、伯爵红茶、洋甘菊、水果洛神花。放在厨柜内的茶种类太多，光选择就让人头疼。喝喝可以提神的路易博士茶吧。拿起一个胶囊放在托盘里，很快就发出嗡嗡~的运作声，散发出酸酸甜甜的柠檬香气。</p><p class="story-paragraph">机器终于开始认真工作，知珉站在玻璃窗前，呆呆地看着窗外。虽然眼前是和明俊打电话时见过几次的风景，但即使站在这里，还是像面对屏幕中的背景画面，没有实感。</p><p class="story-paragraph">在老旧的低楼层建筑之间，坐落着雄伟的大本钟。钟楼经过几年的修缮工程后，再次露出干净利落的面貌，游客们不分昼夜前来观赏。底下开着像玩具一样的红色双层巴士。简直就是明信片上印着的伦敦街景。</p><p class="story-paragraph">明俊的家位于伦敦市中心的西敏区(Westminster)。虽说是公寓，但事实上相当于提供包括管家和健身中心在内的高级住宅。由于以商务目的访问的人占绝大多数，所以知珉这几天不得不挤在穿正装的人中间乘坐电梯。和大楼外观一样，内部的气氛也同样生硬。整栋建筑隔音做得很彻底，连一点白噪音都没有。就连现在这个瞬间也是。</p><p class="story-paragraph">嗡嗡~等茶滴落最后一滴时，只剩一片寂静。没有一丝缝隙，室内装修由干净利落的同色调组成，彷彿置身办公室，连一丝灰尘也没有的纯白客厅，看起来十分清冷。而时隔一年再见到的明俊，就在这里。</p><p class="story-paragraph">你不是说几天后回来吗？现在怎么...</p><p class="story-paragraph">知珉为了躲避他充满喜悦和慌张的双眼，故意抱住了明俊。明俊身上依然散发着和自己一样的香气。喷在身上一段时间，甜味变淡的黑莓香。没什么变化，一切如同过去。知珉通过这些，向自己暗示一切已经回到原位。</p><p class="story-paragraph dialogue">「这么快就起来了？」</p><p class="story-paragraph">回头一看，房子的主人就站在那里。与通话时相比，更加柔和的声音显得格外不自然。怎么那么盯着窗外，有什么东西吗？</p><p class="story-paragraph dialogue">「看起来就像一幅画，很神奇」</p><p class="story-paragraph">外面只有钟楼啊，没什么可看的。明俊靠在窗边摇着头说。今天也是满天都是乌云，天气好像不太好？怎么你来了以后天天都是阴天。</p><p class="story-paragraph dialogue">「看来之前天气很好啊」</p><p class="story-paragraph">至少有点阳光，好像是你把雨带到这里来，在伦敦这种天气下真的会忧郁的。现在总算明白为什么欧洲人一看到天空放晴，就会跑向室外。因为冬天过没几个小时，太阳就要下山了...</p><p class="story-paragraph dialogue">「但是这里」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「本来就这么安静吗？」</p><p class="story-paragraph dialogue">「这算是比较安静的吧。没有噪音是不是很好？」</p><p class="story-paragraph dialogue">「耳朵嗡嗡作响，很让人烦闷」</p><p class="story-paragraph dialogue">「是吗？我不太清楚」</p><p class="story-paragraph">明俊摸着窗边的花。显然是搭配室内设计才选的白色花瓣，随着手上粗糙的动作，无精打采地来回晃动。是啊我也是，在你来之前经常一个人待在这里，也会有点寂寞。明明在市中心却这么安静。知珉望着没有生机干燥的花瓣，低声呢喃。可能是我对这里还不熟悉，所以才这样吧。</p><p class="story-paragraph dialogue">「但是回到家里，总觉得很空虚」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「对了，我想养狗，你觉得呢？」</p><p class="story-paragraph dialogue">「宠物？」</p><p class="story-paragraph dialogue">「嗯，如果要养，就养又小又白的小狗」</p><p class="story-paragraph dialogue">「...为什么？」</p><p class="story-paragraph">最近朋友养了只小马尔济斯，白白嫩嫩的，真的很可爱。我本来也是不怎么喜欢动物嘛，而且小狗也会掉很多毛... 感觉会搞得很乱。但狗狗一看到主人就扑上来撒娇，真是太可爱了。</p><p class="story-paragraph dialogue">「晚上总是想起牠」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是你对狗无感吧？不是说更喜欢猫咪嘛」</p><p class="story-paragraph dialogue">「...也不是不喜欢」</p><p class="story-paragraph dialogue">「总之，我想找个专家了解一下」</p><p class="story-paragraph dialogue">「有信心照顾好吗？」</p><p class="story-paragraph dialogue">「喂饭、散步...大概就这些吧」</p><p class="story-paragraph dialogue">「如果只是因为可爱而开始养的话，一定会后悔的」</p><p class="story-paragraph">也是，毕竟我是连花都养死的人。当然，大小便训练也很让人担心。果然比起小狗，感觉还是喜欢猫咪吧？既然如此，干脆养一只长得像你的黑猫吧？明俊喋喋不休，轻轻一碰胶囊机器，冷漠的机械音再次响起。</p><p class="story-paragraph dialogue">「或者是黑猫和白狗。我觉得这个组合也不错」</p><p class="story-paragraph dialogue">「两只吗？」</p><p class="story-paragraph dialogue">「如果让小狗自己呆着，也会很孤独吧？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「是吧？」</p><p class="story-paragraph">是啊，不知道是不是好主意，或是干脆别养了。知珉喝完剩下的茶，又望向窗外。不知不觉间，粗大的雨点打湿干净的玻璃窗。这么看来，乌云就好像死死地追着自己头顶。</p><p class="story-paragraph">就像受到谁的诅咒一样。</p><p class="story-paragraph">带着郁闷的心情一进房间，又看见一件麻烦事。这段时间只拿出要换的衣服，行李箱就这么丢着。因为害怕某人在里面留下的深刻痕迹，所以根本不想整理。即便如此，也不能放任这种状态一直持续。</p><p class="story-paragraph">把手柄向上拽，随着哐噹一声，行李箱又无力地倒在地上。看到这里，无力地笑了出来。走过那么多城市，现在连这么短的距离也动不了。既感到寒心，又有些伤心。</p><p class="story-paragraph">刚才咚的一声是什么呀？在没有任何声响的地方，行李箱摔得七零八落的声音应该格外大声吧？从打开的门缝中，看见明俊不解的表情。对不起，没什么，只是我不小心。</p><p class="story-paragraph dialogue">「哎呀，现在一看着行李箱简直乱七八糟的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你到底是...去过山区吗？」</p><p class="story-paragraph dialogue">「欧洲不是有很多石板路嘛。我只是走了条比较崎岖的路」</p><p class="story-paragraph dialogue">「再怎么难走也太严重了吧？这个现在也用不了了」</p><p class="story-paragraph">没有什么可否认的，被旼炡的脚踩坏的把手，现在连半截都拉不起来。而且，在来到伦敦之后，还有一个轮子完全被甩掉，算是受了严重致命伤。一团糟，用这句话形容正合适。</p><p class="story-paragraph">不，还可以再用的。连一个可以这么说的借口都想不出来。玻璃窗上，反射自己蹲在地上的样子，还有地上只经过几个星期的旅行就破烂不堪的行李箱。无精打采的脸庞和破旧的行李箱非常般配。</p><p class="story-paragraph dialogue">「今天去买你的行李箱吧。找个结实的」</p><p class="story-paragraph dialogue">「...好吧」</p><p class="story-paragraph">知珉缓缓地转动数字，对准了密码。0,1,0,1。随着咔嗒声，锁头轻松打开。拉开拉链就蹦出一只白色毛茸茸的姆明娃娃。刚在梦里见过，所以并不是特别高兴。明俊看到姆明后，不出门去，而是笑着搭话。</p><p class="story-paragraph dialogue">「这是什么啊，什么玩偶？」</p><p class="story-paragraph dialogue">「在赫尔辛基买的纪念品」</p><p class="story-paragraph">刘知珉和玩偶？好意外啊，如果喜欢这种东西的话就直说嘛，会送你礼物的。反正我得暂时去下公司，大概中午会回来，到时候再一起出门吧。</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph">听到模稜两可的回答，明俊只说完自己想说的话就关上门出去了。知珉这才像为了完成讨厌的作业，伸出手在行李箱乱翻。但与心中的担忧相反，含有两人回忆的东西并不多。借来的羽绒服也挂在衣架上。好不容易在奥斯陆自由市集买的动物明信片也放进了药箱。</p><p class="story-paragraph">幸好...该这样想吗？</p><p class="story-paragraph">身子倒在床沿，与被丢在床上的姆明蓝色眼睛对视，作为北欧旅行的证明，剩下唯一的纪念品就只有他吗？知珉和在梦里一样，双手紧紧环住胖胖的肚子。不知为什么，那看似嘲弄的呆愣表情，让人烦躁不已。</p><p class="story-paragraph">刘知珉笨~蛋。</p><p class="story-paragraph">偏偏带到伦敦的这只大肚娃娃，好像总和自己搭话。就像是丢失包包那天他对自己说。你是傻瓜吗？感觉像是在取笑人。今天也一样。</p><p class="story-paragraph dialogue">「…别那样看着我」</p><p class="story-paragraph">你的想法和行动完全对不上啊。</p><p class="story-paragraph">像掉了一颗螺丝的人一样。</p><p class="story-paragraph">脖子上贴着创可贴来到伦敦真好笑。</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph">知珉不可置信般，眼睛一眨一眨地盯着姆明。不会是在做梦吧。还是因为看玩具总动员太认真而精神失常呢。明明电影只是玩具在2小时内一直寻找自我的内容而已。</p><p class="story-paragraph">我会说话啊，你不知道吗？</p><p class="story-paragraph">我还记得你那天对小狗做的坏事呢。</p><p class="story-paragraph">还有为了满足你的私心，随便挥动我的胳膊。</p><p class="story-paragraph">反正人类就是这样...</p><p class="story-paragraph dialogue">「抱...抱歉」</p><p class="story-paragraph">先是结结巴巴地道了歉，另一方面是真挚地后悔。当然没想到真的都被看到了。即便是非生物，目击者就不该出现的。正在娃娃主人苦恼的时候，姆明连嘴都不动一下，说话倒是说的很顺口。</p><p class="story-paragraph">呼，都是因为没有小狗，所以气氛不好吧。</p><p class="story-paragraph">现在永远都见不到了吗？</p><p class="story-paragraph dialogue">「...见不到了」</p><p class="story-paragraph">好可惜啊。</p><p class="story-paragraph">话又说回来，最近你就像玩具一样呢？</p><p class="story-paragraph">简直像身体被关在监狱，只能动动嘴巴。</p><p class="story-paragraph dialogue">「你太吵了」</p><p class="story-paragraph dialogue">「...如果这些就是你想说的，以后别说了」</p><p class="story-paragraph">然后把只会说气人的话的娃娃放倒。也许吧。</p><p class="story-paragraph">再次睁开眼是在两下短暂的震动声之后。</p><p class="story-paragraph dialogue">-我30分钟后到达。准备好就出来大厅</p><p class="story-paragraph dialogue">-打开衣柜最左边，就会看到你的大衣</p><p class="story-paragraph">按住阵阵发疼的脑袋，猛地直起身来。30分钟后就要到了，现在到底几点了？已经连是第几次起床都不太清楚。看来是没有盖被子倒头就睡着，姆明娃娃歪斜着被抱在肋下，指针已经指向12点。显然，生理时钟完全乱了。</p><p class="story-paragraph">但是刚才到底是什么？是梦吗？</p><p class="story-paragraph">你跟我搭话了吗？即使再次握住他软软的肚子问道，姆明也只是一副呆愣的表情。这是在做什么傻事，赶紧准备一下吧。知珉把手中的毛绒玩偶随便乱扔，从床上站了起来。这是今天令人不适的第三次起床。</p><p class="story-paragraph">一按没有手把的白色墙壁，门就轻轻地弹了出来。虽说是衣柜，但其实算客厅的一面墙，里面全是衣服，最角落挂着刚干洗完的黑色长大衣。像用尺子量过一般准确的款式非常陌生。</p><p class="story-paragraph">知珉看着面前的镜子，捋下了还没干透的头发。明俊的衣柜内只有暗到让人分不清的色系，然而镜子中的自己却像这冷清房屋中的一件装饰品，丝毫没有违和感。一头长长的黑发、黑色的长大衣和马丁靴。手上的皮包和颜色搭配的长雨伞。</p><p class="story-paragraph">我本来就是这副模样吗？</p><p class="story-paragraph">不知不觉到了时间，电话准时打来。按下通话按钮，响起了简短的声音。不过我们要去哪里啊？一问他，明俊说苏活区附近正好有SAMSONITE的专门店。但是苏活的话，不就在西敏寺附近吗？</p><p class="story-paragraph dialogue">「不就5分钟车程，不能走路过去吗？」</p><p class="story-paragraph dialogue">「特意用走的吗？」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「你不是不喜欢在下雨天走路嘛」</p><p class="story-paragraph">是吗。好像是那样。</p><p class="story-paragraph">知道了...随便吧。说话间露出一丝自嘲的笑容。不久前还散步了一整个凌晨，走得脚都肿了，现在连散步都不算的路程竟然要开车去。知珉挂断电话后，离开了空荡荡的房子。在走廊长长的红地毯上，连轻微的脚步声都听不见。</p><p class="story-paragraph">从大厅看出去，正中午的伦敦还是一片朦胧。雨势虽然很弱，但令人郁闷的乌云仍然飘在头顶上方。很快，随着引擎声，黑色的中型轿车停在面前。透过窗户，只见明俊也穿着一身黑色西装。和僵硬的服装不搭，满脸笑容的男朋友过来迎接了知珉。穿大衣了啊？真漂亮，快坐吧。</p><p class="story-paragraph">坐在副驾驶，一股新车的味道十分呛鼻。竟然还能用正常的表情握着方向盘，真是神奇。知珉微微皱起眉头，挥了挥手。</p><p class="story-paragraph dialogue">「…应该稍微通风一下吧」</p><p class="story-paragraph dialogue">「抱歉」</p><p class="story-paragraph dialogue">「不，我开会儿窗户」</p><p class="story-paragraph dialogue">「那样雨水应该会飘进来吧？」</p><p class="story-paragraph dialogue">「但我感觉要晕车了」</p><p class="story-paragraph">才过了5分钟就忍不住了？你也真是。明俊笑着转了方向盘。不知道是自己反应过度，还是因为下雨嗅觉比平时更敏锐。吹着寒风，感觉呼吸变得顺畅。从窗户缝隙透进新鲜空气，也漏进了一点雨。但知珉没有想闪躲，望着车窗外，让小小的雨点滴滴答答掉落在脸颊上。</p><p class="story-paragraph">姐姐的衣服怎么湿了这么多？</p><p class="story-paragraph">明明一起撑伞的，为什么只有我没事呢？</p><p class="story-paragraph">...等一下 看下这边</p><p class="story-paragraph dialogue">「做什么呢？脸都淋到雨了。关窗户吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「给你纸巾吗？」</p><p class="story-paragraph dialogue">「不...我自己来吧」</p><p class="story-paragraph">下雨天果然不怎么样。</p><p class="story-paragraph">自己没按下按钮，窗户就刷刷地往上爬，关上了。知珉像是要把脑海中浮现的画面擦掉一般，轻轻用手背擦去脸上的雨滴。水珠很快就消失，反倒是今早梦见的面孔，还盘旋在脑中。微微翘起的金黄色刘海，和阳光般灿烂的微笑。</p><p class="story-paragraph">现在你应该在寒冷的雪地中看着极光吧。有没有按时吃饭？若是连包都没带出门的话，会不会丢东西呢。这才想到，雨伞坏掉的时候还不如给她买把新的呢。没人可以说话，应该很孤单吧。但出乎意料的是，她和陌生人聊得挺好，或许已经交到新朋友了吧？</p><p class="story-paragraph">算了吧，你没有资格担心这些。</p><p class="story-paragraph">既然都已经逃跑了。</p><p class="story-paragraph">快到了，准备下车吧。方向盘再次快速转动，车就停在门口。一进入店内，店员就介绍起最新产品，并亲自拿起行李箱做展示。反正也听不清快速的英式英语。知珉在店员旁边，用韩语敷衍地回答明俊的提问。嗯、都好，功能无所谓，适当的结实就行其他随便。</p><p class="story-paragraph dialogue">「想要什么颜色？」</p><p class="story-paragraph dialogue">「普通的」</p><p class="story-paragraph dialogue">「黑色？蓝色？」</p><p class="story-paragraph dialogue">「...不，我要黄色的」</p><p class="story-paragraph dialogue">「真的吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「会不会太亮了？虽然很显眼」</p><p class="story-paragraph dialogue">「伦敦太暗了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我想看看明亮的颜色」</p><p class="story-paragraph">自己也觉得这是幼稚且无力的反抗。明俊没有多问，直接向店员要了一个黄色的行李箱，并递出信用卡。</p><div class="location-badge"><strong>L O N D O N : G R E E N W I C H</strong><span>伦敦 ：格林威治</span></div><p class="story-paragraph">回去的路简直糟糕透顶。前车尾灯的红色灯光在前面停了几分钟，眼睛都看得生疼。在壅塞的马路上，完全动弹不得的情况下，雨势逐渐变大，窗户也开不了。在密闭的新车内，被内装散发的塑料味污浊空气搞得快要窒息。落在车顶的雨声滴滴答答，雨刷规律地擦去雨水，这些小细节都让人难受。知珉拉了拉安全带，深深地叹了口气。</p><p class="story-paragraph">现在该何去何从呢？明天又要去哪里呢？圣诞节、新年呢？即使这样日复一日，每一天结束都是在没有一丝噪音的灰色房子内。</p><p class="story-paragraph">喘不过气了。</p><p class="story-paragraph">无意中说出口的话让明俊转过头来。很闷吧？早知道就按你说的用走的去了，路上比想象中堵得厉害，既然已经出来了，兜个风再回去吧？</p><p class="story-paragraph dialogue">「兜什么风啊。直接...」</p><p class="story-paragraph">虽然想立刻拒绝，但又不想说“直接回家吧”，十分矛盾。因为无论去哪，我都讨厌。既然如此，就没有比较开阔的地方了吗？比如瞭望台之类的。随后，明俊打开导航，输入了什么。那里比较像郊外，要去吗？因为风景很好，这里的居民也经常去。</p><p class="story-paragraph"><strong>格林威治皇家天文</strong><strong>台</strong></p><p class="story-paragraph">Royal Observation Greenwich</p><p class="story-paragraph">下着雨从市中心经过一个多小时的车程，抵达的地方是伦敦东部的格林威治。天文台座落在宽阔的绿地。但实际上，这个知名旅游胜地不能观赏星星，而是更接近博物馆。知珉撑着雨伞爬上陡峭的斜坡。登上这里就能看见天空吗？虽然有点期待，但是眼前的风景却令人非常空虚。</p><p class="story-paragraph">来到开阔的地方有什么用。</p><p class="story-paragraph">没什么意义。</p><p class="story-paragraph">十二月的英国，太阳四点就要下山。天色已经变得昏暗，天空中弥漫着雾霾一样的深蓝色雾气。虽然从格林威治公园旁能瞥见泰晤士河，但别说风景，就连前面那颗树的轮廓也看不清楚。曾经那么喜欢蓝色，现在却只感觉到冷清。甚至产生了在偏僻的角落里被孤立的错觉。</p><p class="story-paragraph">明俊大步走向某处，停在了设有像铁路一样长长水平线前。</p><p class="story-paragraph dialogue">「你知道这是什么吗？」</p><p class="story-paragraph dialogue">「不知道」</p><p class="story-paragraph dialogue">「这座天文台最有名的就是这个。大家都在这条线上拍照」</p><p class="story-paragraph dialogue">「这是什么？」</p><p class="story-paragraph dialogue">「本初子午线」</p><p class="story-paragraph">虽然只是象征性的，但这就是世界标准时间。GMT就以这条线为基准，左边的你和右边的我时间就不同。听着明俊的说明，知珉稍微靠近了地上的直线。中央线两侧写着各城市的名称和经度。而世界所有时间的基准点——经度0度，格林威治。</p><p class="story-paragraph">Reykyavik 21°, W</p><p class="story-paragraph">Helsinki 25°, E</p><p class="story-paragraph">Stockholm 18°, E</p><p class="story-paragraph">Greenwich 00°, W</p><p class="story-paragraph">脚下是伦敦的格林威治，前面依次写上的是，曾与旼炡共同经历的斯德哥尔摩和赫尔辛基。只要朝那里迈出一步，雷克雅维克正好就在鞋尖。至少在这条线上，可以一步去到冰岛。仅仅是这一点，就给自己带来些许安慰。</p><p class="story-paragraph">只差一步。</p><p class="story-paragraph">难道是因为没有迈出这一步，所以彼此的时间一直交错在一起吗？时差只有1个小时，坐飞机过去只需要3个小时。冰岛过去一直离自己很遥远，但对于伦敦却不是那么遥远的地方。只要迈出一步，不到半天就能见到她。只需要抬起脚步，就能碰到。</p><p class="story-paragraph">你还在那里等我吗？</p><p class="story-paragraph">那么说不定为时未晚。也许还有时间去那里，也许还有机会把没说出口的话传达给她。也许还能再紧紧抱住她一次。然而，当把希望寄托在淼茫的可能性上时，沉寂的恐惧像是要把自己吞噬一般说道。</p><p class="story-paragraph">你觉得很简单吗？</p><p class="story-paragraph">跟着脚底的线迈出脚步不算什么，但觉得现在的自己，能迈出这一步吗？拼了命逃跑的也是你，就别装成受害者了。就是你以暧昧不明的态度，伤害了重要的人。</p><p class="story-paragraph">我知道，那个我当然知道。</p><p class="story-paragraph">你以为金旼炡会想念你吗？一句话都没说就把她扔下走人，肯定在埋怨你吧。是谁都会那样。你离开都已经三天了，到现在连个联系都没有就是证据。如果觉得怀疑就打电话试试吧，联系了还是会乖乖接电话的吧，当然被挂断或不打才是理所当然。</p><p class="story-paragraph">说得没错，会讨厌我吧。那当然。</p><p class="story-paragraph">终于见到了一年没见的恋人，不应该幸福吗？这不是你所期待的风景嘛。在高级的房子里安心地生活有什么困难。旅行结束了，破裂的关系也无法挽回。只要把心态整理好，就能干净利落地抹去一切。</p><p class="story-paragraph">......</p><p class="story-paragraph">一句话也无法反驳。感觉内心深处被暴露在外。知珉紧闭双眼，深深地吸气。全都是事实嘛，现在真的要抛弃那种萎靡不振的态度了。迷恋的心，没有整理的照片，还有哪怕只是一点点、会让人回忆起当时的娃娃。</p><p class="story-paragraph">…姐姐。</p><p class="story-paragraph">知珉瞬间听见耳边传来的声音，反射性地转过头来。但是转了一圈，周围除了两人以外，再没有其他人。</p><p class="story-paragraph dialogue">「刚才没听到什么声音吗？」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「好冷，快走吧」</p><p class="story-paragraph dialogue">「...我再待会儿再走。就5分钟」</p><p class="story-paragraph dialogue">「快来，我先发动车子」</p><p class="story-paragraph">虽然抱着侥倖心态四处张望，但天文台附近连一个游客都没有，十分冷清。位于脚下的格林威治和雷克雅维克之间，仍有一步之隔。虽然看似触手可及，但绝对不近的这一条缝隙，现在感觉比物理距离差得还要更远。知珉摇摇头，从空旷的山坡上转过身离去。</p><p class="story-paragraph">不可能的。果然是错觉啊。</p><p class="story-paragraph">知珉姐姐，不要再看脚下了...</p><p class="story-paragraph">你应该是错觉的，但为什么总是…</p><p class="story-paragraph">看看天空。快点。</p><p class="story-paragraph">天空？</p><p class="story-paragraph">黑色的伞向后一掀，一抬起头，白色的雪花慢慢落上鼻尖。雾茫茫的深蓝色天空，冰冻的雨滴和雪交织在一起落下。这是伦敦迟来的第一场雪。</p><p class="story-paragraph">知珉把雨伞完全放下，呆呆地仰望。如同这一片灰濛濛的天空，视野也变得模糊。本以为在这里迎接初雪的话，会增添很多回忆。相信如果距离变远，共同经历的那些记忆也会自然而然地消失。</p><p class="story-paragraph">然而，映着鹅黄色路灯的脸庞，却从脑海中清晰地蔓延开来。戴着黑色贝雷帽跑进小巷，脚踝一瘸一拐，被自己背在背上，在清晨的街道上撒娇的那些情景。</p><p class="story-paragraph">脖子后面好烫啊，姐姐。</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">为什么这么烫？</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">不怕冷果然是有原因的吧。</p><p class="story-paragraph">但平时是不会这么烫的。</p><p class="story-paragraph">那现在怎么这么烫？</p><p class="story-paragraph">...你还要装作不知道吗？</p><p class="story-paragraph">什么？说得好像我常装作不知道似的。</p><p class="story-paragraph">...没什么，傻瓜啊。</p><p class="story-paragraph">因为泪水涌上心头，后颈还热烘烘的发烫。知珉回想起搂在脖子后面，纤细又发凉的手指。把自己的手伸向后颈，但并没有她那么凉。噙着雨的雪花不停落在脸上，与泪水交织。</p><p class="story-paragraph">我现在最想见到的是...</p><p class="story-paragraph">虽然长，但圆圆的眼睛，眼角有个小伤疤，还有可爱的脸蛋。偶尔嘟起的嘴唇。好像一掰就会折断的细胳膊。总是想要抓住某个地方而伸出的那双雪白的手。天冷的话会变得更加通红的指尖。还有用那双手拨弄湿发的背影。</p><p class="story-paragraph">从后面抱上去就会被拥在怀中削瘦的背。稍稍用力，就能拖过来的干瘦肩膀。一犯错就低声叫着知珉姐姐的清脆嗓音。相反，开玩笑时不高兴的表情马上消失得无影无踪的眼角。还有像孩子一般可爱的笑声。</p><p class="story-paragraph">还有，还有...</p><p class="story-paragraph">还好吗？</p><p class="story-paragraph dialogue">「......不」</p><p class="story-paragraph">一点都不好。</p><p class="story-paragraph">知珉低着头哭了好一阵子。空荡荡的天空中，那张思念的脸庞彷佛在注视着自己浮肿的双眼，于是撑起雨伞，遮住了哭红的脸。</p><p class="story-paragraph">随着时间的流逝，伦敦的第一场雪没有积雪，就这么无声无息地消失了。</p><p class="story-paragraph dialogue">「今天有点累，先睡了」</p><p class="story-paragraph">适当的糊弄后，进到房间已经3个小时。今天一直睡到中午，只在天文台看了风景，哭了一会儿就回来了，当然不可能乖乖睡着。在漆黑的房内只亮着手机的灯光，已经过了午夜。知珉眯着眼，机械般滑动屏幕。今天雷克雅维克的天气是零下10度，暴风雪刮到下午，从晚上到凌晨的天气都很晴朗。</p><p class="story-paragraph">在无聊的北欧国家中，冰岛除了自然景观之外，更是无趣的地方。这几天所谓的消息，也只有这些而已。今年统计人口接近37万，或者迎来年末食品价格减半等等新闻。而主流媒体所报道的消息，是休火山时隔几百年，熔岩再次喷发的近况。</p><p class="story-paragraph">知珉哑然失笑。每天晚上查看冰岛日刊新闻，到底是多么令人寒心的事？在即将出现人生第一次失眠之前，决定不睡了。正准备把手机扔到枕头上，恰好看到了刚更新的最新新闻头条。</p><p class="story-paragraph">在这样的凌晨 速报？</p><p class="story-paragraph"><strong>[紧急速报] 54号国道因结冰发生大型坠落事故</strong></p><p class="story-paragraph">晚上10点左右，位于斯奈山半岛的大本营，一辆大型巴士坠落海岸。20名乘客中有10人轻伤、7人重伤、3人昏迷，伤者被送往附近急救。事故路段全面封控中。</p><p class="story-paragraph">听闻凌晨传来关于小岛国的噩耗，知珉的手颤抖不已。位置和日程一模一样，让人害怕。试了几次刷新，都没有接获后续报道。报道最后只写着“正在调查事故相关人员的身份”这一行字。竟然有一半以上是重伤。虽然绝对不可能，但万一、如果真的。</p><p class="story-paragraph">如果乘坐的人是金旼炡的话？</p><p class="story-paragraph">实在无法镇定下来，握着手机走到客厅。完全没有一点光，与早晨看到的景象没有任何不同。胶囊机、听不见任何脚步声的大理石地板、叶子彷彿要断了似的假花，没有手把的衣柜，还有窗外的大本钟。</p><p class="story-paragraph">知珉像个刚跑完步的人，用力地喘着气，反复打了几个简短的句子，又删掉。旼炡啊，没事吧？现在在哪啊？我看到了出事故的新闻。看到这个马上联系姐姐...</p><p class="story-paragraph">但是直接这样发送没关系吗。</p><p class="story-paragraph">怎么办？怎么办？怎么办？</p><p class="story-paragraph">刘知珉</p><p class="story-paragraph">笨蛋、笨蛋、笨蛋</p><p class="story-paragraph dialogue">「......」</p><p class="story-paragraph">真的要傻事做到底吗？</p><p class="story-paragraph">不担心小狗的安危吗？</p><p class="story-paragraph dialogue">「...很担心」</p><p class="story-paragraph">那就不要再自欺欺人了。</p><p class="story-paragraph">现在想见谁想到受不了？</p><p class="story-paragraph">最后掠过脑海的话，或许是床上被自己翻倒的娃娃的声音，抑或是忍无可忍、不知是从哪里冒出来的刘知珉的呐喊。但现在这些并不重要。</p><p class="story-paragraph">深呼吸三四下后，立刻按下通话键。信号连接声不到1分钟，却感觉像10分钟一样渐渐拉长。接了电话应该说些什么呢？问她现在在哪里？问她身体怎么样？然后...不，首先应该准备好护照。最早的凌晨班机是几点？</p><p class="story-paragraph">…您拨的电话无人接听。</p><p class="story-paragraph">但是长长的连接音后，传来的却是未接收的提示语。这还在知珉的预想范围内，便沉着地再次按下通话键。是啊现在是凌晨，肯定很累在睡觉。打个两次电话说不定就醒了，再打一次试试吧。</p><p class="story-paragraph">…您拨的电话无人接听。</p><p class="story-paragraph">但是这次干脆连接音都没有就被挂断了。知珉虽然有些惊慌失措，但依然附上了接受的理由，强迫自己镇定下来。如果是大本营的话，信号一定不怎么好。要不然就是一直待在外面，手机可能没电了，她又总是把充电器乱放，所以完全有可能。</p><p class="story-paragraph">…您拨的电话无人接听。</p><p class="story-paragraph">枯燥乏味的台词再三重复，焦虑感就越是加倍。原本只盯着手机的知珉开始神经质地挠乱头发，几度舔了舔干凅的嘴唇。即使正向思考，脑中也马上出现负面想法。怎么能真的坐上了出事的巴士呢？难道是因为在医院所以不能接电话吗？万一是最坏的情况呢，是昏迷患者之一？监护人是谁？</p><p class="story-paragraph">…您拨的电话无人接听。</p><p class="story-paragraph">不，别去想那些不吉利的事了。知珉猛地摇头，像催促般急迫地连续按下通话键。尽管夜里空气凉飕飕，但手心还是直冒汗。</p><p class="story-paragraph">…您拨的电话无人接听。</p><p class="story-paragraph">准确地说，这是第5次拒绝。啪的一声，听见信号中断的声音，腿部已经使不上力。坐在窗边，知珉茫然地叹了口气。现在怎么办呢？</p><p class="story-paragraph">只能自问自答，逃到伦敦的刘知珉实在无能为力。也许旼炡只是不愿接听反复打来的电话，单纯地挂断而已。这样的可能性不是更大吗？但是，无论是如何被拒接的，被挂电话的一方任何事都无从知晓。</p><p class="story-paragraph">知珉缩着双脚，双手捂脸。身后，一片漆黑的虚空正凝视着自己，窗外，一座干枯的灰色城市像路障一样挡住了去路。围绕着自己的那些东西好像都在低语。你现在再怎么挣扎，哪儿也去不了，任何事都是不可能的。</p><p class="story-paragraph">到此，唯一一线希望破灭。胸口像是被穿透般锥心地疼。因为即使已经鼓起勇气，也没能解决任何问题。直到现在，才想到自己已经失去了所有珍贵的东西，只留下无比空虚。</p><p class="story-paragraph">还是太晚了吗？</p><p class="story-paragraph">现在已经不能被原谅了吗？</p><p class="story-paragraph">唧嘤——</p><p class="story-paragraph">这时，细微的震动声打破了痛苦的寂静。扔在地上的手机以固定的频率响着。画面上出现三个字，金旼炡。</p><p class="story-paragraph">而且竟然是，某一天晚上用过的视频电话。</p><p class="story-paragraph">今天实在分不清梦境与现实现实。但是，倘若接起这通电话，一切会不会变得明确呢？只需要心中迫切渴求的声音，对自己说一句话。</p><p class="story-paragraph">知珉毫不犹豫地按下接通按钮，把手机放到眼前。画质依然糟糕，但至少从画面中可以看出，屏幕内并不是白皙的面孔。听见噼里啪啦火花飞溅的声音，才勉强知道那是篝火。有人正在把干枯的树枝扔进熊熊烈火中，即使联系上了，也听不见任何声音，心里依旧焦急万分。但可以确定的是，这就是有旼炡在的冰岛。知珉犹豫了一会儿，艰难地开口。</p><p class="story-paragraph dialogue">「…旼炡啊」</p><p class="story-paragraph">时隔好几天再次呼唤她的名字，既尴尬又紧张。</p><p class="story-paragraph dialogue">「你在那里吗？」</p><p class="story-paragraph">但是回答的只有沉默。是听到自己的问话了，还是装作没听见。只能小心翼翼地再叫了遍名字。旼炡啊，你在那里...吗？</p><p class="story-paragraph dialogue">「金旼炡不在」</p><p class="story-paragraph">三天来久违的声音听起来非常生气。知珉想象着眉毛上翘、噘着嘴的那张脸，把音量一直提高到最大。</p><p class="story-paragraph dialogue">「自拍也拍了五张」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「电话也打了五次呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「刘知珉」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你这个时间不睡觉干什么呢？」</p><p class="story-paragraph">一下子听见思念已久的清澈嗓音，并一字一字说出了自己的名字，刘知珉三个字。如果是平时的话，会笑着回答对姐姐怎么能直接叫“你” ，然后用力按她的脑袋。但现在整个人像冰块一样僵硬，连如此简单的问题都答不上来。在这段空白期间，知珉把正在视频通话忘得一干二净，只像个傻瓜一样摸着无辜的头发。</p><p class="story-paragraph dialogue">「睡不着吗？」</p><p class="story-paragraph dialogue">「...嗯」</p><p class="story-paragraph dialogue">「这里是1点。那伦敦现在是凌晨2点呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在是睡觉时间。为什么现在才给我打电话？」</p><p class="story-paragraph dialogue">「因为紧急事故...刚看新闻」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我担心你会不会有事」</p><p class="story-paragraph dialogue">「不是我们的车」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不是我，我没事」</p><p class="story-paragraph dialogue">「那...真是幸好...」</p><p class="story-paragraph">太好了，真是万幸。终于放下心来，像傻瓜一样喃喃自语，只听见“呵哼”不知是笑声还是叹息声。</p><p class="story-paragraph dialogue">「还想着怎么回事」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「原来是为了问这个，才这么着急给我打电话的啊」</p><p class="story-paragraph dialogue">「首先是...」</p><p class="story-paragraph dialogue">「所以还有什么话要对我说吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「看你无话可说的样子，好像没有了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那事情就结束了吧？我挂了」</p><p class="story-paragraph dialogue">「不要挂.....」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph">想问的话全都萦绕在嘴边。身体还好吗？现在是在哪里？这段时间有没有按时吃饭？一个人去寒冷的地方累不累？但是，听见她断然拒绝的语气，所有的问题都被抛在一边，暴露出自己的真心。</p><p class="story-paragraph dialogue">「我想再听听你的声音」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…我等了整整一天」</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「谢谢，虽然很感谢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但已经太晚了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我已经把心情全都整理好了」</p><p class="story-paragraph">听见这一句最令人恐惧的话语，眼眶一下子发热，最后知珉只能用手背擦了几次自己的眼角。旼炡看着她那寒碜的面孔，却一言不发。篝火因为不停地投入的小树枝,比刚才烧得更大、更旺。</p><p class="story-paragraph dialogue">「抱歉...对不起。凌晨还随便给你打电话」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那我就挂了...」</p><p class="story-paragraph dialogue">「放弃还真是很快」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「如果是我的话，既然有连打五次电话的傲气，会再多说点什么吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不觉得可惜吗？」</p><p class="story-paragraph dialogue">「但你刚才不是说整理好心情了吗...」</p><p class="story-paragraph dialogue">「还有挽回的余地」</p><p class="story-paragraph dialogue">「那可以...继续通话吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「只要姐姐不困的话」</p><p class="story-paragraph dialogue">「我一点都不困」</p><p class="story-paragraph dialogue">「好像在说谎吧」</p><p class="story-paragraph dialogue">「真的」</p><p class="story-paragraph dialogue">「如果敢打哈欠的话，我会马上挂断的」</p><p class="story-paragraph dialogue">「嗯...」</p><p class="story-paragraph dialogue">「但是不好奇我在哪里吗？」</p><p class="story-paragraph">是冰岛最西边的极光点。旼炡没有等待自己的回答，把镜头转了一圈。画面中可以看见透出亮光的露营帐篷。原来营区就是这样的风景啊。篝火燃烧的声音随着移动渐行渐远，取而代之是一阵阵刺骨的寒风。这样想来，今天是零下10度。</p><p class="story-paragraph dialogue">「...风声听起来很冷」</p><p class="story-paragraph dialogue">「嗯，感觉要冻伤了」</p><p class="story-paragraph dialogue">「你穿了最暖和的羽绒服吧？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「帽子和围巾有好好戴上吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「手套呢？」</p><p class="story-paragraph dialogue">「全部都不告诉你」</p><p class="story-paragraph">这有什么可神神秘秘的？明明可以撒谎，可却故意说不告诉我，看来是找了借口其实穿得不够暖吧。每当说出这种带有玩笑性质令人讨厌的话时，自己不由得忧心忡忡，同时压抑的思念也像气球般膨胀起来。</p><p class="story-paragraph">我好想你，金旼炡。现在非常非常想念你。</p><p class="story-paragraph">再也忍不住了，本来正要将思念脱口而出，突然，画面中的视野一下子变得混乱。能看清吗？嗯...还是这儿的风景更好吗？随着她的自言自语，视野摇摆不定。过了很久，好不容易固定下来的画面中，出现了朦胧的绿色夜空。</p><p class="story-paragraph dialogue">「将，看一下冰岛的天空吧？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「想展示下我刚才看到的风景」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐不是说过嘛。也可能是照片没办法展示这个程度的美」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我亲眼看到的，真的更漂亮」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「虽然极光已经过去了。还是看看这个吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还有什么可拍的呢...等一下」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「啊，给你看看我晚上吃的棉花糖怎么样？」</p><p class="story-paragraph">刚接起电话时生的气，不知是不是已经消了，只见她一个人兴奋地叽叽喳喳，让人心里很不是滋味。头靠在冰冷的窗户上，凌晨时分下着雨的伦敦夜景映入眼帘。滴滴答答，不知停歇的雨点打在玻璃窗上。奇怪的是，雨下得越大，内心深处的情感也随之涌上心头。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「姐姐已经看够夜空了，不要这个...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不要这样的...」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「能不能让我看看你的脸？」</p><p class="story-paragraph">掺杂着啜泣的声音很糟糕。说到话尾哽咽了，说话的途中还接连喘了几次气、不停抽泣。但也没有办法。因为，只有发出这种糟糕的声音，才能传达出自己忍耐到极限的心情。旼炡“呼”地吐露出不满。</p><p class="story-paragraph dialogue">「刘知珉还真是厚脸皮」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「明明连晚安吻都忘了，就那么睡着」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在几天没见面，还哭着要我露脸吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「真是...你这个不听话的小青蛙」（青蛙指什么事都反着做或者对着干的人）</p><p class="story-paragraph">光用手擦去满脸的泪水就感到有点吃力，只能抽出纸巾轻轻擦拭眼角，但听筒却传来旼炡的低语。啊...真的...</p><p class="story-paragraph dialogue">「你要一直哭吗？我可不想看到眼睛肿得像鸡蛋的脸」</p><p class="story-paragraph dialogue">「不想看就别看」</p><p class="story-paragraph dialogue">「才说一句就又生气了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「别人看了还以为是我扔下姐姐走了呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不应该是我哭吗？」</p><p class="story-paragraph dialogue">「...对不起」</p><p class="story-paragraph dialogue">「算了，只是这样看来视频通话不太值得」</p><p class="story-paragraph">让我不要在这个时候哭，是不是太过分了？而且你自己躲在画面背后。知珉感到特别委屈，甚至还稍微提高了嗓门耍赖。金旼炡，不都是因为你不露脸才这样嘛，给看一次脸有什么困难的，为什么拼了命就是不给看呢？</p><p class="story-paragraph dialogue">「...等一下，为什么怪我？好像是我的错一样」</p><p class="story-paragraph dialogue">「是啊，是你的错」</p><p class="story-paragraph dialogue">「哎哟...」</p><p class="story-paragraph dialogue">「你撒谎」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不是说哭的时候会一起哭吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「一直只能听到声音，真的好想好想见你...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「要是这样的话为什么要给我打视频电话啊、傻瓜...」</p><p class="story-paragraph dialogue">「真的不知道吗？」</p><p class="story-paragraph dialogue">「...不知道」</p><p class="story-paragraph dialogue">「这是那天的报复。让你感受一下我的心情」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「虽然我绝对不会露出我的脸」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是，我想看看你的脸啊」</p><p class="story-paragraph">没料到最后一句话，说得让人心里一阵阵发麻。</p><p class="story-paragraph dialogue">「你...真的太坏了」</p><p class="story-paragraph dialogue">「我本来完全不会欲擒故纵的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「这都是从谁那里学来的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「知道吧？是姐姐先开始把手机倒过来的」</p><p class="story-paragraph dialogue">「那不是为了让你学起来、用在这种时候的啊」</p><p class="story-paragraph dialogue">「真是活该呢，这就是报应吧。人就该善良的活着是吧」</p><p class="story-paragraph dialogue">「...真的很讨厌」</p><p class="story-paragraph">终于今天，第一次听见了她咯咯的笑声。什么事那么好笑？</p><p class="story-paragraph dialogue">「现在换姐姐告诉我吧」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「今天一整天都做了什么？」</p><p class="story-paragraph">知珉摸着发红的鼻尖想。这忙碌的一天，到底做了什么来着？从早上开始梦见你、睡了回笼觉到12点，然后买了一个和你的发色一样的行李箱，到天文台一边迎接初雪，一边像个前女友沉浸在感伤中哭了… 但绝对不能这么说出口，所以稍微省略了一部分。</p><p class="story-paragraph dialogue">「我只逛街了...」</p><p class="story-paragraph dialogue">「我就知道会这样。买什么了？」</p><p class="story-paragraph dialogue">「你弟弟」</p><p class="story-paragraph dialogue">「又买了娃娃吗？」</p><p class="story-paragraph dialogue">「不，行李箱」</p><p class="story-paragraph dialogue">「虽然不能理解...我到底有多少个弟弟？」</p><p class="story-paragraph dialogue">「我会一直聚齐你的弟弟妹妹们」</p><p class="story-paragraph dialogue">「嗯...是吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「总之应该很有意思吧。你不是喜欢购物吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「今天笑得很开心吗？」</p><p class="story-paragraph">知珉被那句话堵住了喉咙，脑袋再次碰在玻璃窗上。从早到晚令人窒息的瞬间快速闪过。这么一想，我今天一次都没有笑过。明明一整天和恋人在一起...唧唧~指尖在透明的玻璃窗上揉搓，知珉哽咽着说出答案。</p><p class="story-paragraph dialogue">「...没有」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「真的一点都不好玩」</p><p class="story-paragraph dialogue">「好不容易去了伦敦，怎么把时间都浪费了呢？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「明天要过得更开心呀」</p><p class="story-paragraph">这里没有你，那还有什么意义。</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「做不到」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「旼炡啊...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我再也撑不下去了...」</p><p class="story-paragraph">低下头，电话那头传来长长的叹息。</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你说过想我吧？」</p><p class="story-paragraph dialogue">「嗯...」</p><p class="story-paragraph dialogue">「有多想？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「…我问你有多想我」</p><p class="story-paragraph dialogue">「再也受不了的程度」</p><p class="story-paragraph">画面中映着如画般的云彩，旼炡没有特别说什么。今晚，冰岛的夜空如果出现在梦里也不奇怪，对自己来说似乎已经非常熟悉了。从听筒听到风声的同时，还听到了旼炡的干咳。</p><p class="story-paragraph dialogue">「如果我受伤的话」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐会来冰岛吗？」</p><p class="story-paragraph dialogue">「哪里受伤了？」</p><p class="story-paragraph dialogue">「没受伤，一切正常」</p><p class="story-paragraph dialogue">「那你为什么说那样的话？让我很担心」</p><p class="story-paragraph dialogue">「我只是说说而已」</p><p class="story-paragraph dialogue">「...别开这种玩笑了...」</p><p class="story-paragraph dialogue">「对不起、对不起。不要再从眼睛里流出眼泪了...冷静一下」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「怎么会这样，真是的。今天完全是水龙头啊」</p><p class="story-paragraph dialogue">「因为你一直说一些不像话的话」</p><p class="story-paragraph dialogue">「是啊，刘知珉一点都不坏，都是我的错」</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「听说只要看着冰岛天空许愿，就能实现愿望」</p><p class="story-paragraph dialogue">「那是在看到极光的时候」</p><p class="story-paragraph dialogue">「没差」</p><p class="story-paragraph dialogue">「真是拿你没办法啊...」</p><p class="story-paragraph dialogue">「我好想你」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我想你」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「太想你了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我想见你，金旼炡」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「哪怕一会儿也好，我想看看你...」</p><p class="story-paragraph">完全不知羞耻，像宣泄心声似的喊了几次，黑压压的天空中突然冒出一只白皙的手。纤细的手指对着画面，像抚摸着脸安抚一般蠕动。虽然想隐藏声音，但提高到音量上限的听筒，还是能听到噗嗤噗嗤的笑声。</p><p class="story-paragraph dialogue">「你为什么笑....」</p><p class="story-paragraph dialogue">「真的白白打了视频通话。也不能拥抱你」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「连续说几次重复的话明明是我的口头禅。什么时候传染给姐姐了？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「真有点可爱。撒娇的时候必须反复做5次」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「留下自拍的时候不知道，那个原来是在撒娇啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「抱歉，我那时候不知道」</p><p class="story-paragraph dialogue">「…我要去」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我现在就去见你…...」</p><p class="story-paragraph dialogue">「不，不用来了」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「为什么不让我去…」</p><p class="story-paragraph dialogue">「我再来应该不在冰岛了」</p><p class="story-paragraph">听完这句声音微弱的话，愣住了。听她说话的人心里总是忐忑不安。这么重要的事情为什么现在才说？难道要回韩国吗？这么快？</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「约定是以什么为基础的？」</p><p class="story-paragraph dialogue">「...信任？」</p><p class="story-paragraph dialogue">「没错，刘知珉没有的东西」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「因为姐姐是在别人睡觉的时候逃跑的人。说实话，从我的立场来说，信赖值完全降到最底」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「即使这样，要和我做个约定吗？」</p><p class="story-paragraph">画面上给自己摸摸脸的手，摆出了“约定”的姿势。只露出那可爱的小指在镜头前晃动。</p><p class="story-paragraph dialogue">「要、还是不要」</p><p class="story-paragraph dialogue">「...我要做」</p><p class="story-paragraph dialogue">「如果那么想我的话，明天出来吧。这是最后一次机会」</p><p class="story-paragraph dialogue">「怎么出来？去哪里啊？」</p><p class="story-paragraph dialogue">「姐姐家门口」</p><p class="story-paragraph">...什么？</p><p class="story-paragraph dialogue">「你要来这儿吗？」</p><p class="story-paragraph dialogue">「嗯，我有一件东西特别想给你」</p><p class="story-paragraph dialogue">「...什么？」</p><p class="story-paragraph dialogue">「那是秘密」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在住在哪里？」</p><p class="story-paragraph dialogue">「西敏区附近，你知道是哪里吗？」</p><p class="story-paragraph dialogue">「不太清楚地名。附近有什么有名的东西吗」</p><p class="story-paragraph">伸开蜷缩在沙发上的姿势，一转头，从朦胧的夜景中，看到了淋着雨耸立的钟楼。</p><p class="story-paragraph dialogue">「...大本钟」</p><p class="story-paragraph dialogue">「明天下午在那前面见吧。4点左右」</p><p class="story-paragraph dialogue">「等一下」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「我想了一下，那里重新开放参观没多久，人潮应该会很多。还是去别的地方...」</p><p class="story-paragraph">阿嚏、阿嚏、阿嚏。这时，知珉因透过听筒传出的嘈杂喷嚏声，反射性捂住耳朵。</p><p class="story-paragraph dialogue">「…吓我一跳」</p><p class="story-paragraph dialogue">「抱歉，我在外面坐了很久，实在太冷了」</p><p class="story-paragraph dialogue">「都说了让你穿...」</p><p class="story-paragraph dialogue">「反正已经约好了，我就挂了」</p><p class="story-paragraph dialogue">「这么快...？」</p><p class="story-paragraph dialogue">「竟然说这么快，你知道现在已经凌晨3点了吗？已经很晚了，快睡吧」</p><p class="story-paragraph dialogue">「我今天睡了很久，还不困」</p><p class="story-paragraph dialogue">「现在是我困了...也请考虑一下我的体力」</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「明天真的会来伦敦吗？」</p><p class="story-paragraph dialogue">「真是...刘知珉真的疑心重重」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「姐姐相信我吗？」</p><p class="story-paragraph dialogue">「...你说什么？」</p><p class="story-paragraph dialogue">「啊，刚才的台词和茉莉说得一模一样呢」</p><p class="story-paragraph">茉莉？这么突然？</p><p class="story-paragraph dialogue">「不知道吗？在飞机上没认真看电影吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那一幕不是重点嘛。在飞上天空之前...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「知道阿拉丁在伸出手时问了什么吧？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「那就一定也知道茉莉公主回答什么了呢」</p><p class="story-paragraph">记忆逐渐清晰起来。当时只是为了看那可爱的飞行场面，才看的阿拉丁。</p><p class="story-paragraph">Do you trust me？</p><p class="story-paragraph">...What did you say？</p><p class="story-paragraph">Do you trust me？</p><p class="story-paragraph">...Yes.</p><p class="story-paragraph dialogue">「明天见，姐姐」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「晚安」</p><p class="story-paragraph">固执的某人始终没有露出自己的脸，只挥挥手就消失了。还没等自己回一句晚安，电话就挂断了，但不生气，只是露出傻笑。窗外的风景和今天早晨一样，依然没有现实感。</p><p class="story-paragraph">漫长的一天终于结束了。</p><p class="story-paragraph">출발이 좀 늦었지만</p><p class="story-paragraph">기다려줄래</p><p class="story-paragraph">나는 널 향해 가고 있어</p><p class="story-paragraph">虽然出发有点晚</p><p class="story-paragraph">你能等等我吗</p><p class="story-paragraph">我正在朝你走去</p><p class="story-paragraph">마음 막 벅차올라</p><p class="story-paragraph">보고 싶었다고 말할까</p><p class="story-paragraph">아니 더 근사하게</p><p class="story-paragraph">사랑한다 말해볼까</p><p class="story-paragraph">心潮澎湃</p><p class="story-paragraph">要说我想你了吗</p><p class="story-paragraph">不 应该更潇洒一点</p><p class="story-paragraph">说我爱你吗</p><p class="story-paragraph">마음 막 벅차올라</p><p class="story-paragraph">눈물 날 것 같다 말할까</p><p class="story-paragraph">어쩌면 이 순간을</p><p class="story-paragraph">너무 오래 기다렸다고</p><p class="story-paragraph">心潮澎湃</p><p class="story-paragraph">要说我快要流泪了吗</p><p class="story-paragraph">也许这一瞬间</p><p class="story-paragraph">已经等了太久</p></div>
