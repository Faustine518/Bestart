          <h3>I’m falling in love</h3>
          <div class="lyric-lines"><p class="lyric-line stanza-break latin">Come a little closer</p>
<p class="lyric-line latin">I wanna dance with you</p>
<p class="lyric-line stanza-break latin">Everything is moving slower</p>
<p class="lyric-line latin">I don&#x27;t know what it is you do</p></div>
        </aside>
        <div class="chapter-copy"><p class="story-paragraph">清晨，离太阳光照进来还有些过早，就被上铺的翻身给吵醒了。上层的床头灯忽地闪了几下又熄灭。知珉呆呆望着挡在旼炡和自己之间的床板。即使再次闭眼，也没有丝毫困意。完全搞不清昨晚发生的事情，到底是梦境还是现实。</p><p class="story-paragraph">就在几个小时前，知珉与小心翼翼却又急促地靠近的旼炡，彼此好不容易找到适合的节奏。显然，两人的身体已经交缠了很长时间。旼炡给了自己喘息的空隙，但似乎无法给予更多等待，双唇再次贴上。知珉被旼炡压着向后退，伸手扶上桌子边缘。</p><p class="story-paragraph">这时，列车车底响起了巨大的摩擦声。正在充电的手机掉了下来。两人同时看向发出声音的地方，这才松开嘴。两人接触了好一阵子，旼炡的嘴明显涨红。从肿胀的双唇间还看见了通红的舌头。刚才的感觉依旧鲜明，赶紧转移视线。从被突如其来的声响惊醒、以及对自己依然与旼炡面对面站着这状况的困惑，交织在一起，大脑混乱不堪。</p><p class="story-paragraph">显然，当晚旼炡的脸庞不像平时跟孩子一样，所以才让自己接受她的靠近。但是，一瞬间打起精神，重新看到的旼炡的脸蛋，就跟高中生没两样，简直像吃了瞬间变年轻的药。</p><p class="story-paragraph">内心十分惊慌。虽然忽略男朋友一事，和刚认识不久的女孩子接吻也是个问题，但是自己刚刚竟然与看起来软绵绵、稚气未脱的她断了理智般接吻，更让自己无法接受。很快，沉重的负罪感有如潮水渗透进来，知珉退后一步，与旼炡拉开距离。</p><p class="story-paragraph dialogue">「…好像有点太晚了」</p><p class="story-paragraph">旼炡对那句话没有回应，只是低着头，也看不见她的表情，时间慢慢流逝。我出去一下，先休息吧。旼炡转过身说道。啪嗒，听见门被锁上的声音，知珉直接倒在床上，蒙上被子。事情已经发生了，自己能做的，就是旼炡在回来之前赶紧睡着。</p><p class="story-paragraph">浅浅的床垫微微晃动。不舒服的床、从一早上就多灾多难丢了包、尘封的记忆纠缠不清，以及近在咫尺旼炡的面孔，正在同时折磨着知珉。知珉为了使飞速的心跳平静下来，开始数起数。一、二、三。</p><p class="story-paragraph">脑袋好像快炸了，都怪这一天之内发生了太多事。然而今天不过是个开始，一切早已无法挽回，知珉只是还没准备好接受这个事实。</p><p class="story-paragraph">一大早袭来的现实感，就如同想象中那样残酷。知珉感觉到气息，赶紧掉头躺下。旼炡从上铺下来，走进洗手间，直到脚步声停止才悄然睁开眼睛。自己几乎近得要贴上墙去。</p><p class="story-paragraph">不知多久没有这么近感受与人接触的体温。也许明俊去英国的那天，在机场互相拥抱的瞬间是最后一次。虽然心里不舒服，但两人都没有哭。因为一个人哭的话，另个人难免也会哭。回想起来，那个场面很明俊，也很知珉。</p><p class="story-paragraph">昨天的拥抱，至少与一年前拥抱恋人时的感觉非常不同。身体瘦弱的女孩，泫然欲泣抱着自己，不知为什么心情很微妙。背后拥抱时只是朋友之间的肢体接触，知珉一直极力忽视与旼炡说话间的暧昧气氛。虽然也只是在旼炡转身正视自己之前。</p><p class="story-paragraph">当自己面对她的视线，心脏就不受控制怦怦直跳。特别是嘴唇被咬上的瞬间，因为过于吃惊，便对她的脸上手。如果再干这种事，说不定会打得更重，以为自己能够坚决拒绝看起来力气很小的孩子。但是当那小小的嘴唇小心翼翼地触及嘴角时——</p><p class="story-paragraph">脑海中剩下为数不多的理性、对以陌生的面孔接近的旼炡所持有的警戒心，像沙堡一样全数倒塌。知珉埋怨起自己，对那一刹那记忆竟然如此深刻。</p><p class="story-paragraph">正好，淋浴的水声停止。因为觉得丢脸的要死，只好把被子盖到头顶。为了见恋人来到欧洲的刘知珉、尽量不冲动选择的刘知珉。然而自从开始旅行之后，知珉就成了一个反复做出突发行为的人。虽然想找借口昨晚和旼炡做的事全因为孤单，但没人会接受这种虚僞的理由。这份罪恶感完全由自己承担。</p><p class="story-paragraph">你，不是感觉很好嘛。</p><p class="story-paragraph">就好像谁在指责，心里感到害怕，因为这是无法否认的事实。因为那有如逼迫般焦急的接吻，让自己感觉非常好。最终，昨天的刘知珉不顾一切地接受了旼炡的求爱。要说是气氛所致，其实不过是火上浇油而已，让自己至今还记忆犹新的程度。自己只是不想承认这个简单的事实。</p><p class="story-paragraph">如果真的去了伦敦，刘知珉现在到底在做什么呢？如果没走上这条岔路、如果如期见到明俊、是不是就不会在哐啷作响的狭窄火车床铺上，而是在明俊温馨的家中紧紧抱在一起呢？还有，会像期盼的那样，积累的孤独感全部被融化吗？究竟会幸福吗？</p><p class="story-paragraph">是呀，在这想也想不明白。去假设无法改变的事实，也没有什么意义。不管怎样，知珉必须准备出门。今天知珉的身边还有旼炡，两人未知的旅行还在继续。</p><div class="location-badge"><strong>F I N L A N D : L A P L A N D</strong><span>芬兰 ：拉普兰</span></div><p class="story-paragraph">雪地上孤零零的小火车站，迎接两个人的到来。知珉放下行李，在列车开走前拍了照，给明俊留下了比平时更亲切更长的信息。还附上美丽的风景照片。</p><p class="story-paragraph dialogue">-工作还顺利吗？</p><p class="story-paragraph dialogue">-虽然列车确实有点晃</p><p class="story-paragraph">但睡得不错 刚下车</p><p class="story-paragraph">这里是早上8点 打算简单吃个早饭</p><p class="story-paragraph dialogue">-可能是因为太冷了</p><p class="story-paragraph">电池用得很快</p><p class="story-paragraph">会偶尔联系一下的</p><p class="story-paragraph">明俊正好在看手机，马上回问这是哪里。现在位于芬兰北部的拉普兰（Lapland）。这是乘坐10多个小时的夜间列车后，抵达的郊区村落。</p><p class="story-paragraph">准确来说，拉普兰并不是城市名，而是区域名。芬兰领土自上而下延伸，首都赫尔辛基位于靠海的南边，而寒冷的北方地区则被称为“拉普兰岛”。并不只芬兰，瑞典、挪威，以及俄罗斯都有名为&quot;拉普兰&quot;的地区。简单来说，拉普兰是斯堪的纳维亚最北端的统称，意思是极为偏僻的地区。</p><p class="story-paragraph">两人来到这块看似绝对不会再来的陌生土地，只有一个理由，为了乘坐奔驰在雪原上的哈士奇雪橇。</p><p class="story-paragraph">与知珉和旼炡一样，等待着旅游巴士的人们都坐在站内的三明治店前。离巴士到站还有20多分钟。旼炡从店里买了两个三明治走到桌子旁，递给知珉。谢谢。知珉机械式回答，没有与旼炡对视吃起早餐。</p><p class="story-paragraph">火车站虽然是在室内，但没有将冷空气完全阻断，天气比赫尔辛基还要冷，极端点说简直是冰库。知珉一边吃着潮乎乎的三明治，瞥了眼坐在前面的旅伴。戴着帽子和围巾的旼炡好像很冷，拿着面包的手还微微颤抖。就这样小口小口吃着，可能是没胃口，被剩下的三明治超过大半，就光喝着咖啡。在彼此僵化的关系中只剩叹息，连呼吸都觉得尴尬的气氛，到底该怎么办才好呢？</p><p class="story-paragraph">昨晚搭的列车，车厢比普通的酒店房间要小。所以两人早上忙进忙出的，很难不碰到面。知珉和刚从洗手间洗完澡出来的旼炡撞个正着，旼炡咬着牙刷嘀咕着说“对不起”，然后赶紧转身让开。</p><p class="story-paragraph">下火车后，旼炡也到处回避。两个人从太阳升起到现在，除了这些单调的回应之外，没有一句像样的对话。当然知珉也不想一早非去提起昨晚相关的话题。但是，如果一直维持这样的氛围，不只心里难受，其实看着不搭话的某人，胸口也感觉空落落。也不是团体旅游，而是两个人一起的旅行。事情不是互相回避就能解决的，难道今天要一直像陌生人一样吗？</p><p class="story-paragraph">不自在，怎么办。</p><p class="story-paragraph">知珉把无味的三明治全塞进口中，伸手去拿桌子对面的纸巾。一旁旼炡的手背不小心和自己的手碰上。明明不算什么事，旼炡却再次用怯懦的声音迅速道歉。啊、对不起。</p><p class="story-paragraph dialogue">「…为了什么？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「有什么好对不起的，从刚才开始就一直」</p><p class="story-paragraph">嗓音比平时更低沉，不想听到的话总是反复出现，这点让人很不满意。不，其实现在有点生气。金旼炡真是太厚脸皮了，难道忘了昨晚你对我说对不起的时候是什么情景吗？何必失魂落魄地不停道歉，你对我犯了什么罪吗？</p><p class="story-paragraph dialogue">「很抱歉撞到你了」</p><p class="story-paragraph dialogue">「…把手给我」</p><p class="story-paragraph">知珉握住旼炡放在桌子上的手腕。那冰凉的手腕似乎被吓到一般颤抖。但是，旼炡并没有乖乖伸出手，反而不愿意似的用力抵抗。在自己慌乱时，旼炡慢慢扭开了被抓住的手腕。</p><p class="story-paragraph">现在是把手抽走了吗？</p><p class="story-paragraph">坚定的拒绝让知珉完全僵住，连伸出的胳膊都收不回来。第一次遇到如此充满戒心的眼神，手部动作就是让自己不要随便碰触。心脏骤然下沉。</p><p class="story-paragraph">再加上可能是自己多想，从刚才开始旼炡的脸颊就显得格外红肿，自己看了也难过。昨晚见她被伤害而流露出可怜的眼神，还替她难受。今天那眼神则直直朝向自己，好像说着“那个伤害我的不是别人，就是你”。最终，知珉将视线看向旼炡。</p><p class="story-paragraph">对于昨晚的事，以及面子什么的，现在想想都无所谓了，只是想抚慰一下她的脸。然而与焦急的心情相反，知珉无法轻易伸出手。脸颊怎么还是这么红？难道是因为我吗？还好吗？不疼吗？脑中出现的明明都是亲切的安慰，嘴里说出口的却是刺痛旼炡而没意思的话。</p><p class="story-paragraph dialogue">「…让你把手伸出来，快点」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph">短暂而冰冷的一句回答，让沉淀在心底的那些话随着嘈杂的环境，浮现在脑海中。知珉再次生气了。</p><p class="story-paragraph">为什么说得那么厌恶的感觉？</p><p class="story-paragraph">拒绝的话怎么能那么轻易说出口。</p><p class="story-paragraph dialogue">「…讨厌和我接触吗？」</p><p class="story-paragraph dialogue">「不是那样的」</p><p class="story-paragraph dialogue">「那能不能听话点？」</p><p class="story-paragraph dialogue">「我为什么要听？」</p><p class="story-paragraph">看来旼炡并不想乖乖听话。面对令人郁闷的情况，知珉大叹一口气。虽然没料到在短短几天内，竟然会出现这种最糟糕的气氛，但也别无他法。昨天的刘知珉计划的事，今天的刘知珉就要来实行。知珉拿起从刚才就攥在另一只手上的小盒子，轻轻放到桌子上。</p><p class="story-paragraph dialogue">「这是什么？」</p><p class="story-paragraph dialogue">「…给你的礼物。」</p><p class="story-paragraph">旼炡双手捧着咖啡，呆呆地看着盒子。似乎是无法理解，稍微睁大的眼睛和微微皱起的眉毛，不知怎么的让人感到紧张。你会怎么回答呢。这是什么啊、为什么要给我、如果说不需要或不喜欢的话，接下来我该怎么做才好？</p><p class="story-paragraph">实在等不下去，知珉拉住旼炡的一只手。有如纸张一般的胳膊，又轻而易举被知珉拉近，亲手给她戴上了手套。从外表上来看，不算太大也不会小，正适合旼炡。</p><p class="story-paragraph dialogue">「…很适合你」</p><p class="story-paragraph">尺寸可以吗？这时，戴着灰色连指手套的旼炡伸出双手。可爱的样子果然不出所料，穿的衣服正好也很搭。</p><p class="story-paragraph dialogue">「这是给我的吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「…为什么？」</p><p class="story-paragraph dialogue">「因为一直穿你的羽绒服，想送你些什么，所以就买了这个。怎么了」</p><p class="story-paragraph dialogue">「原来如此」</p><p class="story-paragraph dialogue">「…不怎么样吗？」</p><p class="story-paragraph">不、挺好的，谢谢。都是突然抓住我的手，才害我吓了一跳嘛，至少说一下是送礼物吧。这时，旼炡脸上的陌生表情终于消散，露出微微一笑。今天第一次见她的脸上流露一丝笑容，似乎也慢慢消除自己的失落，这点令自己也感到十分无语。如果她笑得更灿烂些，也许连刚才可恶的事都能原谅。明明把抓着的手就那么放开了、明明刚才还说了不要，现在又让别人的心瞬间动摇。</p><p class="story-paragraph dialogue">「…表情放松一点吧，为什么那样盯着我看呢？」</p><p class="story-paragraph dialogue">「我没盯着看啊？」</p><p class="story-paragraph dialogue">「哪有人送礼物这么扭扭捏捏的啊」</p><p class="story-paragraph dialogue">「才不是扭扭捏捏，还不都是因为你从早上开始就不说话」</p><p class="story-paragraph dialogue">「我故意没跟你搭话的」</p><p class="story-paragraph dialogue">「…为什么？」</p><p class="story-paragraph dialogue">「还问为什么，姐姐不是都拒绝我了吗？」</p><p class="story-paragraph">瞬间视线无处安放。本以为瞳孔地震只是个比喻，但事实上真的可能发生。旼炡像是没有看到知珉的眼神，只是以十分平静的面孔，翻看摆放在桌子前的旅游手册。</p><p class="story-paragraph dialogue">「…那个之后再谈吧」</p><p class="story-paragraph dialogue">「明明该做的都做了」</p><p class="story-paragraph">这是公共场合，有些话可以说、有些话不能说啊。知珉脸上火辣辣，直接上手捂住旼炡的嘴。旼炡挣扎着想脱困，两人吵吵闹闹了半天，像傻瓜一样争执不休。</p><p class="story-paragraph dialogue">「放开我。为什么突然堵住别人的嘴？」</p><p class="story-paragraph dialogue">「你小声点。都不会羞耻吗？这里人很多欸」</p><p class="story-paragraph dialogue">「这里有谁能听懂韩语？」</p><p class="story-paragraph dialogue">「反正这不是在早上边吃三明治，可以边说的话。」</p><p class="story-paragraph">老实说，早上见旼炡比想象中更面无表情地刷着牙，心里非常乱，一个人胡思乱想了很多。她如果一直躲着自己、什么话也不说，那我该怎么办？要一起装作若无其事吗？两人走路的距离应该比昨天离得远一些吗？行李看起来很重，好想帮你拿一下，该怎么办。连帽衫的帽子翻了，可以用手帮你整理一下吗？可以先搭话问早上要吃什么吗？不然的话——</p><p class="story-paragraph">不对，还是算了吧。</p><p class="story-paragraph">结果刘知珉的脑海里，从一大早开始就被金旼炡占据，其他什么都不重要了。</p><p class="story-paragraph">该如何是好。自己对这些琐碎的小事，全都变得在意起来。明明你才是，突然吻了我之后就放任不管，都不知道已经把别人的心情搞得一团糟，结果起床后，身体一点点接触就好像犯了大错，只知道道歉，搞什么啊？就不能先对我开口吗？知珉开始对今早不负责任的旼炡，发起迟来的脾气。当然，只是在心里。</p><p class="story-paragraph">不管怎样，旼炡仍然没有看向知珉，只是随意地撕下了小册子内的优惠券。这边写拿着优惠券会送蓝莓果汁欸，好赞。还突如其来说出这种莫名其妙的话。</p><p class="story-paragraph dialogue">「…所以姐姐喜欢怎么样的？」</p><p class="story-paragraph dialogue">「…嗯？」</p><p class="story-paragraph dialogue">「喜欢帅气的还是可爱的？」</p><p class="story-paragraph">因为太集中在对想象中的旼炡发泄怒火，知珉错过了与旼炡的对话。等一下 ，刚才在说什么啊，我喜欢的？帅气还是可爱？让我选一个？话题怎么突然跳到开始选理想型了呢？反正要选就选吧。老实说，自己从来没想过要跟可爱的人交往，但如果对方可爱的话，一定会被迷得晕头转向，所以投可爱的一票。</p><p class="story-paragraph dialogue">「…非要选的话可爱的吧。你呢？」</p><p class="story-paragraph">我？这个嘛。知珉一直盯着旼炡，等待她的回答，不自觉地全神贯注，连眼睛都不眨一下。</p><p class="story-paragraph dialogue">「首先，如果体型比我大的话，会有点负担」</p><p class="story-paragraph dialogue">「大会有负担吗？」</p><p class="story-paragraph dialogue">「嗯，我不喜欢太大」</p><p class="story-paragraph dialogue">「…然后呢？」</p><p class="story-paragraph dialogue">「长得可怕或犀利的也不喜欢」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph">等一下，这是新的糊弄手法吗？现在是想说你跟我的取向完全相反，跟我的理想型简直差了180度，只是接了吻，就别再自作多情了吗？</p><p class="story-paragraph dialogue">「还是小一点的好」</p><p class="story-paragraph dialogue">「…为什么？」</p><p class="story-paragraph dialogue">「抱的时候如果太重会很累」</p><p class="story-paragraph">知珉在最后忍不住摇了摇头。要轻到金旼炡能抱起来？那不就只有像羽毛一样轻的人才可能了吗？感觉那胳膊一折就要断了，有你的胳膊能抱起来的人吗？</p><p class="story-paragraph dialogue">「你啊…条件太苛刻了」</p><p class="story-paragraph dialogue">「这算苛刻？哪里啊？」</p><p class="story-paragraph dialogue">「你的手能抱起来的人能有几个啊。不是吗？」</p><p class="story-paragraph dialogue">「…说什么呢。我干嘛要抱人？」</p><p class="story-paragraph dialogue">「你刚才不是说喜欢轻的人吗？」</p><p class="story-paragraph dialogue">「姐姐，那个…」</p><p class="story-paragraph">旼炡听了这话，眉头紧皱，把椅子往后挪。怎么了？干嘛突然像看到奇怪的人一样退后？</p><p class="story-paragraph dialogue">「…是在说狗」</p><p class="story-paragraph dialogue">「…狗？」</p><p class="story-paragraph dialogue">「是啊，狗。小狗狗。问你喜欢什么种类」</p><p class="story-paragraph">我刚刚到底在和谁对话啊，拜托说话的时候不要一个人胡思乱想，集中一下吧。知珉只能低着头默默接受旼炡的抱怨。实在太丢人了，简直想爬到桌子底下去。</p><p class="story-paragraph dialogue">「真的太过分了。我们不是正在谈等下要坐的雪橇吗？」</p><p class="story-paragraph">旼炡一边说，一边把正在看的小册子转过来。上面印着欢迎词，以及哈士奇在雪地里拉雪橇的画面，也就是两人即将体验的灿烂风景。</p><p class="story-paragraph">Welcome to Lapland Husky Farm!</p><p class="story-paragraph">Fall in love with the winter wilderness.</p><p class="story-paragraph">虽然车窗蒙上了一层白烟，还是可以看出窗外纯白的风景。搭了长达1个小时的巴士，目的地比刚才的火车站人烟更加稀少。拉普兰的导游马上说明了注意事项。听说这里最冷的时候气温会降到零下40度，并给所有人发了防寒服和保暖贴。</p><p class="story-paragraph">现在该决定坐什么雪橇了，简单的二选一。可以像圣诞老人一样，坐慢悠悠的驯鹿雪橇，或者是带有速度感的哈士奇雪橇。知珉询问意见时，旼炡表示没什么好选的，并坚持说“慢的有什么意思，要搭就一定要快的，去游乐园不就是享受云霄飞车带来的刺激嘛”。虽然完全不敢搭游乐器材的知珉无法苟同，但是总之，今天决定配合这个速度狂。也不是在空中飞来飞去，只是雪橇而已，应该没必要太害怕。</p><p class="story-paragraph">到达中心听完安全教育后，两人在厚重如被褥般的防寒服内贴上保暖贴，将外套牢牢地盖到脚尖。旼炡戴着毛帽、围巾、礼物的手套，裹得严严实实，只露出圆圆的双眼。看着怕冷的孩子裹得那么严实，自己有提前给她买手套真是太好了。</p><p class="story-paragraph">两人跟着活动组的人员做好一切准备，便走到了户外。哈士奇们嗅到陌生人的气味，不停吠叫。五六条狗一起绑在雪橇上，比想象中要传统得多。</p><p class="story-paragraph">知珉自然是和旼炡一组，搭上雪橇。即便是两人一组，只要一人站在后面操纵雪橇，另一人就不需要做任何事情，只要舒服地坐着休息即可。通常是一人先驾驶，休息时间后再换另一人。对知珉来说，实在不喜欢速度型游乐设施，所以如果可以的话，能一直坐着最好，带着这份期望看向旼炡。</p><p class="story-paragraph dialogue">「旼炡啊，我们出发的时候谁来驾驶？」</p><p class="story-paragraph dialogue">「驾驶的话我一个人来就可以了」</p><p class="story-paragraph">旼炡的回答与自己期待的相同，让知珉安心地松了口气。本人都说自己全包了，就行了吧。真的没关系吗？出于礼貌陆续问了几次，旼炡脸上自信满满，让自己不要担心。</p><p class="story-paragraph">在听完雪橇操纵方法之后，所有的事前准备都告了段落。因为是简单的机械结构，只有几个点需要留意，没有什么特别难的。出发时稍微抬起脚后跟、踩后面的木板就会刹车、与前面的雪橇至少保持几公尺距离、左转右转的技巧、要熟知交换驾驶者的方法、以及上坡路时，为了帮助狗狗们，要一起蹬脚等等。随着解释时间延长，哈士奇们像是迫不及待，更大声地吠了起来。人生中第一次被这么多狗围着，一听到回响在耳边的狗叫声，才有了自己脱离日常生活的实感。</p><p class="story-paragraph">随着导游一声短促的信号，狗像赛马一样飞奔而去，雪橇速度也比想象中要快得多。身体紧贴座椅幅度稍微向后仰，知珉不由自主紧握住前方的把手。道路两侧是积满雪高耸的针叶树林，哈士奇们似乎已经对路线非常熟悉，沿着林间小路疾驰，风景十分壮观。</p><p class="story-paragraph">照片，这个一定要留下照片。</p><p class="story-paragraph">知珉赶紧打开相机。早上就有感觉到，由于天气冷，电池的消耗速度比平时快得多。现在大概奔驰了10分钟左右，虽然没有下雪，但是风刮得比想象中要大，连贴在防寒服内的保暖贴都毫无作用。这么想来，后面的驾驶从出发前就兴奋不已，怎么现在应该喋喋不休的人，却只赶着路默不作声。</p><p class="story-paragraph">到底在干嘛？回头一看，知珉差点叫出声来。眼前旼炡连眼睛都睁不开，只能哆哆嗦嗦地站在驾驶台上。</p><p class="story-paragraph dialogue">「…旼炡啊，没事吧？」</p><p class="story-paragraph dialogue">「我看起来像没事吗？」</p><p class="story-paragraph dialogue">「不像」</p><p class="story-paragraph dialogue">「不要和我搭话，雪一直进到嘴里」</p><p class="story-paragraph dialogue">「但很危险啊，驾驶不是应该睁开眼睛吗？」</p><p class="story-paragraph">就在几分钟前，她还气焰嚣张地说自己要驾驶整路。但现在，旼炡的霸气早已不知去向，甚至白雪已经复盖上眉毛和鼻尖，几乎像要死了。不是人在操作狗雪橇，而是狗在牵着人。</p><p class="story-paragraph">这样下去，如果重心不稳不慎摔倒，可是会发生大型事故的。但是现在踩刹车的话，会和后面的雪橇相撞。怎么办。知珉忐忑不安反复确认前方视野，以及身后旼炡的状态。也许正好到了大家轮换驾驶的时间，前面的雪橇慢慢在减速，想解决这一状况只能是现在。</p><p class="story-paragraph dialogue">「金旼炡，下来。跟我交换吧。」</p><p class="story-paragraph">知珉赶紧从座位上站起来，走向旼炡。脸被雪冻得硬邦邦的，眉毛和鼻樑上零零星星沾着雪花，看起来真像个傻瓜。</p><p class="story-paragraph dialogue">「你是从雪地滚过来的吗？脸上真精彩」</p><p class="story-paragraph dialogue">「…驾驶就拜托你了」</p><p class="story-paragraph">在体力不支前，旼炡好不容易从雪橇上下来，而知珉则替她抓紧雪橇站了起来。哈士奇们似乎不管鼻子上结没结冰，就不停催促着出发。雪橇从前面依次行驶，知珉也跟着抬起脚。</p><p class="story-paragraph">坐着和抓着雪橇的感觉完全不同。雪橇滑出没多久，体感温度就明显下降。随风飞舞的雪花不时掠过脸庞，眼睛一阵阵发紧，简直寒风刺骨。现在才理解，为什么旼炡的鼻尖上会积这么多的雪。</p><p class="story-paragraph">甚至前半部分是广阔的平地，后半才是更加陡峭的林间小路。偏偏带头的狗不顾道路险峻，带领其他狗在惊险的路上奔跑。无论在哪，总会有那种太嚣张而受伤的孩子。就像金旼炡一样。</p><p class="story-paragraph">领头的狗狗不顾驾驶的苦恼，在结束长长的爬坡后，或许是因为太兴奋，突然开始狂奔。随即，其他跟在后面的傢伙也乘着气势，滑雪般飞速下坡。知珉感觉速度太快，踩了刹车，但是越踩狗狗们越不满被牵住绳子，开始进行拉锯战。</p><p class="story-paragraph">真是的，最讨厌速度型游乐设施。</p><p class="story-paragraph">也许是旼炡灵魂出窍，跑到那条狗的身上。完全有可能。因为背靠着椅子一动不动地坐着的旼炡，后脑勺看起来早已丢了魂。不会晕倒了吧。无论走到哪都会引起骚乱的金旼炡，简直是问题制造者。到底是狗还是人啊。</p><p class="story-paragraph">这时狗狗们加快了速度，最后冲刺全力奔跑着。知珉不由地用力抓住绳子，一瞬间想起了车上导游说的话。“奔跑是哈士奇的本能，因为长时间生活在雪原上，孩子们越冷则跑得越快…”</p><p class="story-paragraph">那是怎样的本能呢？雪花飞扬，身体几乎快要冻僵，怎么有办法能跑得更快呢？是因为没有知觉，反而跑得更快吗？雪橇以几乎要飞起来的速度疾驰在下坡路上，奔向知珉等待了许久的终点。</p><p class="story-paragraph">虽然只搭了30多分钟、但体感上像在雪原待了很长时间。导游点燃了露天炉火，给结束骑行的游客们用杯子盛上热咖啡和蓝莓汁。</p><p class="story-paragraph">幸亏旼炡刚才撕下的优惠券，才有免费的蓝莓汁可以喝。对于在严寒中乘坐雪橇回来的人，算是非常甜蜜的补偿。旼炡因为精神恍惚，没能好好享受这趟兜风，似乎感到遗憾而絮絮叨叨。哈士奇们唯独扑向站着不动地旼炡，想和她开玩笑。导游见状上前道歉，并带着那些不停吠叫的狗离开了。</p><p class="story-paragraph dialogue">「…看来是觉得你看起来像朋友」</p><p class="story-paragraph dialogue">「是觉得我比姐姐看起来亲切吧」</p><p class="story-paragraph dialogue">「是啊，眉毛上沾着雪的脸和狗狗们不相上下啊」</p><p class="story-paragraph dialogue">「别逗我了好吗？真的差点要死了」</p><p class="story-paragraph dialogue">「我以为你是跟牠们一起用跑的过来呢」</p><p class="story-paragraph">就说别逗我了。说完，旼炡掉头走人，知珉则笑着跟在后面。旼炡可能想挽回颜面，开始找借口。出发时风比想象中大、腿抽筋了等，对自己刚才几乎闭着眼睛，进行了大篇幅的辩论。好、知道了、嗯，嗯。知珉演起左耳进右耳出，旼炡眯起眼盯着自己看。</p><p class="story-paragraph">走在雪地里，知珉说还要听刚才没听完的旼炡与小狗的故事。“从小就想养只小狗，但现在还没能养成。总有一天要养的”。看着旼炡喋喋不休，知珉认真思考了起来。感觉她牵小狗去散步，自己会被拖着走。小狗能养狗吗？金旼炡是不是也需要一个主人？但是，因为有过想别的事情而错过对话的前科，所以这次，知珉为了集中在旼炡身上，十分努力。</p><p class="story-paragraph dialogue">「姐姐觉得怎么样？」</p><p class="story-paragraph dialogue">「什么怎么样？」</p><p class="story-paragraph dialogue">「驾驶是不是比想象中有趣？」</p><p class="story-paragraph">确实，不得已被推着上场的雪橇还挺有趣的，虽然自己再也不想坐了。总之，今天一天对于知珉来说，会是长久留存在记忆中的回忆。</p><p class="story-paragraph">未来谁能确定呢？在飞机上气得火冒三丈时还什么都不知道，没想到一个星期后，自己会在偏僻的小地方搭上哈士奇雪橇。谁能料到，胆小的刘知珉竟突然开起雪橇来。这么一想，噗嗤地笑了出来，现在这个情况真的很搞笑也很奇怪。</p><p class="story-paragraph">我到底在这里干什么呢。</p><p class="story-paragraph">每过一天就会变得截然不同的奇怪旅行。</p><p class="story-paragraph">为什么这么有趣呢？</p><p class="story-paragraph">回想起来、没有一天过得平淡。但是这次旅行的所有瞬间、新的风景都令人非常愉快。虽然自己也对无法理解的感情感到不确定，但是不想中断这种肆意妄为的日子。最好是和现在在旁边忙得不可开交的某人一起，光看着你也很开心。</p><p class="story-paragraph">如果这样想，似乎可以理解哈士奇在失去知觉的情况下，依然用力奔跑的心情。</p><p class="story-paragraph">不知道会飞奔到哪里去的小狗，</p><p class="story-paragraph">让人一瞬间都无法把视线移开的金旼炡。</p><p class="story-paragraph">如果和你在一起的话，明天好像也很值得期待。</p><p class="story-paragraph">后天也是，大后天也是。</p></div>
      </section></template>

<p class="lyric-line">即使思考了好多次还是不知道</p></div>

        <div class="chapter-copy"><p class="story-paragraph">两人离开平静的哈士奇村，前往下一个预定地点。知珉再三确认了之后的日程。这架飞机从现在起，大约3个小时后会抵达瑞典首都斯德哥尔摩。就在几天前，和旼炡在邻座相遇，正是这一趟旅行的开始，不知不觉中，他们越过了国境，掏出放在行李一角的护照，一眨眼功夫3小时就过去了，知珉把疲惫的身躯靠在飞机椅背上。</p><p class="story-paragraph">赫尔辛基很冷，位于北部的拉普兰更甚。那么斯德哥尔摩天气如何呢？即使不用特别搜寻，明显也是冷得让旼炡讨厌的地方。但是，偏偏有人在冬天执意要来到严寒之地，现在在旁边吸鼻涕也是无可奈何。旼炡今天为了雪橇耗尽所有气力，虽然疲惫不堪，但所幸没有像上次那样出状况。</p><p class="story-paragraph dialogue">「旼炡啊，身体还好吗？不冷吗？」</p><p class="story-paragraph dialogue">「目前还能坚持下去。」</p><p class="story-paragraph dialogue">「…斯德哥尔摩真的比这里冷吗？」</p><p class="story-paragraph">旼炡从刚才就一直是闭着眼回答。因为纬度低，所以这儿的气温和赫尔辛基差不多。斯德哥尔摩和赫尔辛基一样，人口不到100万，果然也是十分清幽的地方。与伦敦和巴黎相比，北欧城市大多显得冷清。比起过度华丽或人来人往的景色，确实更明显地感觉到其中留白，也许这就是北欧旅行的乐趣所在。</p><p class="story-paragraph">能给我看看宿舍的位置吗？一问完旼炡就拿出手机，发来了一个地址链接。地图中可以看到，斯德哥尔摩非常独特。湖水横贯整个中心地区，周围布满大大小小的岛屿，形成了密密麻麻的网状。总而言之，这座城市看起来并非整片土，而是各个岛屿的集合。</p><p class="story-paragraph">宿舍位于湖中央某个大岛的边缘，虽然位置不错，但是从机场到市中心距离相当远，这让自己很担心，移动时间可能会比预测更久。出发时间现在是晚上8点，办理完入住手续，可能就接近午夜了。</p><p class="story-paragraph">去酒店的话得马上休息才行。知珉认为今天日程十分累人，一个人自言自语说着。这时，旼炡似乎想到了什么，转过头与自己对视。用一双刚睡醒呆呆的眼睛，附带微微上翘的刘海。知珉一边用手整理旼炡翘起的刘海，一边问怎么了？</p><p class="story-paragraph dialogue">「姐姐，那个…今天住的不是酒店，是多人间」</p><p class="story-paragraph dialogue">「多人间？是指青年旅舍吧？」</p><p class="story-paragraph dialogue">「嗯，是四人室。可能比之前住的地方不方便」</p><p class="story-paragraph">这样吗。在旅行开始之际，旼炡就告知过这件事。记不太清了，当时可能是失魂落魄地坐在飞机上吧。</p><p class="story-paragraph">总之，如果是四人一间，不确定室友可能会感到不便。往好处想的话，说不定是个不错的借口。总之，今天是和旼炡经历了夜间列车后的第一个夜晚。比起两个人待在小房间里，几个人吵吵闹闹的，应该比较不会尴尬。因此，对两人来说，共用多人室算一件好事。</p><p class="story-paragraph">…不是，这是好事吗？</p><p class="story-paragraph">为什么突然变成疑问句了呢，这是好事啊。知珉再次给自己洗脑。没错，这也许是上天的安排，不要再冲动而犯错了。虽然无法挽回在列车上犯下的错误，但以斯德哥尔摩为起点，重新与金旼炡嘻嘻闹闹地相处就可以了。就像什么事都没发生一样，像好朋友一样。知珉没和旼炡商量，自己随心所欲地这么想。</p><div class="location-badge"><strong>S W E D E N : S T O C K H O L M</strong><span>瑞典 ：斯德哥尔摩</span></div><p class="story-paragraph">抵达市中心后，斯德哥尔摩的夜景迎接初次光临的知珉和旼炡。夜风徐徐吹上湖面，漆黑的湖水晃动着昏黄的路灯。不过刚在拉普兰经历了酷寒回来，这里的寒气还算可以忍受。只是深夜在人烟稀少的路边寻找住处，比想象的要难。旼炡一边看着谷歌地图，一边来回转悠，最后以&quot;这个建筑物好像是对的&quot;，快步走到知珉前面。</p><p class="story-paragraph">走进大厅，一个戴着眼镜、呆呆的招待所员工迎接了两人。但是，也许是新职员，在寻找预约对象上花了很长时间。已经过了午夜，时间正朝黎明走去。员工介绍完共用休息室，正在讲解洗衣房的使用方法，不知道是不是还没背好介绍事项，反复说了几句相同的话，说话速度也慢的让人集中不了精神。这是休息室、这是洗衣房，这样不就行了，房间钥匙赶快拿来吧。</p><p class="story-paragraph">知珉困地连连点头，恰巧电话响起才回过神来。明俊的名字浮现，回头接电话的知珉轻声说道。嗯抱歉，正在办入住手续，我之后再打。短暂的电话打完后，职员才结束漫长的说明，微笑着拿起钥匙。</p><p class="story-paragraph">知珉原先以为房内有其他人了，就小心翼翼地敲了门才推开。但两人看来是该房的第一位旅客，没有看见其他人的痕迹。左右并排放着两张上下舖，床和床之间都立着很高的隔板，即便是陌生人，也不会有什么不便。虽然现在床全都空着。</p><p class="story-paragraph">不会再有其他人了吗？照这样下去，又将成为独处的夜晚。为了避免和列车的早晨一样，再次出现尴尬的气氛，知珉突然忙着打开行李箱。</p><p class="story-paragraph dialogue">「今天真的太累了，是吧？」</p><p class="story-paragraph">知珉唯一的室友没有回应，只是微微一笑。哪里有些不对劲，现在那张脸是在发现可以逗人的地方时，按耐不住的表情。她又想说什么呢。姐姐。听到她的叫唤，知珉不情不愿地回答。</p><p class="story-paragraph dialogue">「…干嘛？」</p><p class="story-paragraph dialogue">「刚才人家说明的时候，你是不是打嗑睡了？」</p><p class="story-paragraph">也许刚才她就一直凝视着自己打瞌睡的样子吧，所以才会这么嘻皮笑脸吗。旼炡连这些都不放过，故意说出来逗知珉。知珉难为情地盯着她，接着说。嗯，我突然犯困了，你看到了？</p><p class="story-paragraph dialogue">「因为我的观察力很好，所以不会错过的」</p><p class="story-paragraph dialogue">「你不累吗？看起来倒是很精神？」</p><p class="story-paragraph dialogue">「刚才睡了一觉，没有那么累了」</p><p class="story-paragraph dialogue">「我好像也在飞机上睡了一会儿」</p><p class="story-paragraph dialogue">「姐姐不是在移动中睡不好觉的人吗？」</p><p class="story-paragraph">她为什么像对一切了若指掌一样地说呢。我吗？虽然进行了自问自答，但旼炡推测的没错，知珉不是想睡就睡的人。在必须睡觉的情况下，会故意喝啤酒或红酒帮助入眠。之前的长途飞行中也是如此。</p><p class="story-paragraph dialogue">「在这么短时间你是怎么知道这些的呢？」</p><p class="story-paragraph dialogue">「还会在旁边说梦话呢」</p><p class="story-paragraph">我说梦话了？意想不到的回答，让半睁着眼的知珉瞬间惊醒。旼炡脸上的表情写着多的是呢，接着从大背包里拿出一大堆衣服。有没有说错话啊？知珉脸色发白连忙问了旼炡。</p><p class="story-paragraph dialogue">「…我说什么了？」</p><p class="story-paragraph dialogue">「你不是说太吵了，让我安静一点嘛？对旁边老老实实待着的人说这种话，真是无语」</p><p class="story-paragraph dialogue">「如果骗人的话我会生气的」</p><p class="story-paragraph dialogue">「谁为了这个而说谎啊，就说是真的了」</p><p class="story-paragraph dialogue">「反正我也没办法验证啊」</p><p class="story-paragraph dialogue">「那我们就用可以验证的来猜猜看吧？」</p><p class="story-paragraph dialogue">「随你便」</p><p class="story-paragraph dialogue">「姐姐早上漱口的时候偶尔会咽下去吧？」</p><p class="story-paragraph dialogue">「…没错」</p><p class="story-paragraph dialogue">「喜欢自己扎头发的样子吧」</p><p class="story-paragraph dialogue">「你到底看到什么才这么想？这个也得回答吗？」</p><p class="story-paragraph dialogue">「是YES还是NO？」</p><p class="story-paragraph dialogue">「…YES」</p><p class="story-paragraph">突然感到头疼起来。问题怎么这样，怎么连这些都知道呢？这么不以为然地说着，结果为什么都猜对了？难道金旼炡在我后脑勺安装了24小时摄像头吗？光是想象到现在为止她在一旁观察的自己的样子，也觉得有些难为情。代表自己不但说梦话，还吞漱口水，每天早上绑着包包头自拍，应该都被她看在眼里了。</p><p class="story-paragraph">加上旼炡似乎对自顾自地开始的夏洛克游戏颇感兴趣，直到喊停为止，看来不会放过自己。放弃抵抗的知珉想干脆适当地给与回应，至少在旼炡提出下一个问题之前。</p><p class="story-paragraph dialogue">「姐姐属于不爱撒娇的类型吧」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「不是吗？」</p><p class="story-paragraph dialogue">「…你为什么这么想？」</p><p class="story-paragraph dialogue">「听你和男朋友说话就知道了」</p><p class="story-paragraph">撒娇。刘知珉和撒娇。</p><p class="story-paragraph">尽管无奈，此次的回答仍然是“YES”。不管别人怎么评价，撒娇和刘知珉是不搭调的相克单词。几天来，在房间里和明俊有过几次简短的电话，所以旼炡大概知道自己是如何对待他的。但是观察之后，结果竟然断定自己属于不爱撒娇的人，这让人想进行一些反驳。真的吗？我是那种说话一板一眼的人吗？</p><p class="story-paragraph">只要有人让自己撒娇知珉就会僵住。因为从小就是看起来成熟的形象，所以觉得撒娇起来很害羞。而且不擅长wink，总是两只眼睛都闭起来。特别是用可爱语气说话，真的不敢想象，还不如直接咬舌…所以重新回到现实，金旼炡刚才嘻嘻哈哈地笑着说了什么？刘知珉你为什么那么不会撒娇，是这么说的吗？</p><p class="story-paragraph dialogue">「因为不太撒娇，而且一板一眼，真是抱歉啊」</p><p class="story-paragraph dialogue">「我明明没说过你一板一眼啊」</p><p class="story-paragraph dialogue">「你说这些话倒是很厚脸皮」</p><p class="story-paragraph dialogue">「我纯粹按照自己的感受说的」</p><p class="story-paragraph dialogue">「真好啊，你很会撒娇吧」</p><p class="story-paragraph dialogue">「我也是不太撒娇。如果硬让我做，死也做不出来」</p><p class="story-paragraph dialogue">「感觉好像不是啊」</p><p class="story-paragraph dialogue">「我看起来很会撒娇吗？」</p><p class="story-paragraph dialogue">「…嗯」</p><p class="story-paragraph dialogue">「那姐姐可能就是这么看待我的吧」</p><p class="story-paragraph">知珉本来就怕撒娇。想想看，是不是因为天生的成熟造成反作用，才特别喜欢小巧可爱的东西呢？所以知珉从小就喜欢和自己相反的女孩子。女艺人如果个子娇小、可爱、童颜的话，首先就会产生好感。而青少年时期形成审美，一直延续至今。</p><p class="story-paragraph">特别是现在眼前小而可爱、皮肤白皙的金旼炡，与知珉喜欢的女性取向，可以说是几乎120%以上吻合。因此更无法反驳旼炡的说法，毕竟第一次见面就觉得她可爱也是事实。但是一码归一码，现在那嘚瑟的脸真可恶，好想捏住她的脸蛋，像糯米糕一样拉长。几个小时前，刘知珉还曾担心如果两个人独处会不会很尴尬，看来这完全是杞人忧天，想回到过去告诉自己完全没必要。太小看金旼炡了，只要一睁开眼睛，她就会忙着找可以逗自己的地方。</p><p class="story-paragraph dialogue">「一想到有人在旁边听，我就很在意，连电话都打不了」</p><p class="story-paragraph dialogue">「为什么，明明都已经打了好几次」</p><p class="story-paragraph dialogue">「反正现在因为你，我不会再在房间打电话了，你知道就行」</p><p class="story-paragraph dialogue">「不过就是有点意外」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「在喜欢的人面前不是会变得更可爱吗，一般来说」</p><p class="story-paragraph">没错，一般都会变得更可爱。但是知珉完全无法想像在明俊面前撒娇的样子。交往期间，幸好没被要求做那种可怕的事，以后也永远不会。话又说回来，她为什么要说这种难为情的话，也没做什么为什么要这样挑衅自己，真是的。</p><p class="story-paragraph dialogue">「能不能别再戳我痛处了？我也知道我不怎么可爱，就像你说的也不怎么撒娇，也常常听到长得很冷漠…」</p><p class="story-paragraph dialogue">「干嘛突然批评自己呢？姐姐还算挺可爱的」</p><p class="story-paragraph dialogue">「…还算？」</p><p class="story-paragraph dialogue">「嗯，还算」</p><p class="story-paragraph dialogue">「…像什么时候？」</p><p class="story-paragraph dialogue">「意外地松懈下来的时候」</p><p class="story-paragraph">虽然希望她不要那么含糊，可以说得更详细一些，但实在不好意思再问了，所以知珉故意嫌弃地回嘴。算了吧，现在才甜言蜜语来不及了。</p><p class="story-paragraph dialogue">「怎么突然不高兴呢？」</p><p class="story-paragraph dialogue">「你不是对老实人落井下石了嘛」</p><p class="story-paragraph dialogue">「我落井下石？不要曲解我的意思」</p><p class="story-paragraph dialogue">「…短舌音的撒娇…我就是做不了啊，死也做不了」</p><p class="story-paragraph dialogue">「冷静点，谁都没要你做啊」</p><p class="story-paragraph dialogue">「总之，我不适合撒娇」</p><p class="story-paragraph dialogue">「那别勉强，简单地换个称呼怎么样？」</p><p class="story-paragraph dialogue">「称呼？」</p><p class="story-paragraph dialogue">「还是叫做“可爱的爱称”吗」</p><p class="story-paragraph">爱称，知珉和明俊之间没有那种东西。明俊叫知珉的名字，知珉叫哥哥。有点枯燥吗？是男女交往最基本的称呼。但是你为什么突然开始恋爱指导？</p><p class="story-paragraph dialogue">「那你呢？」</p><p class="story-paragraph dialogue">「…什么？」</p><p class="story-paragraph dialogue">「你是怎么叫的？」</p><p class="story-paragraph">旼炡是以前辈的名字称呼吗？都交往了4年，所以互相不说敬语了吧。还是会有其他的爱称呢？知珉在想东想西时，旼炡犹豫了一下，说道。就是…一直以来都是叫前辈，习惯了。</p><p class="story-paragraph">叫前辈不是比哥哥更奇怪吗？这难道不是只有在公开场合才会用的称呼吗？在交往的时候不是这么叫的吧。即使反复追问，但旼炡全都避而不答。</p><p class="story-paragraph dialogue">「虽然你说的没错。但又没什么特别的，突然要我说很害羞啊」</p><p class="story-paragraph dialogue">「…什么呀」</p><p class="story-paragraph dialogue">「只是不想说了」</p><p class="story-paragraph">这是你先开的话题吧？既然没什么特别的就快说。即使催促，也只是让旼炡的脸变得更红而已。刚才欺负我不会撒娇，结果轮到自己还这么磨磨唧唧。所以呢？我倒要听听看，是用多了不起的爱称来称呼年上女朋友。</p><p class="story-paragraph dialogue">「亲爱的」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「…亲爱的」</p><p class="story-paragraph">亲爱的？</p><p class="story-paragraph">知珉好像听错了似的，盯着旼炡看。旼炡当然很害羞，眼珠看着天花板滴熘熘地转。这简直比至今听到的任何撒娇，都要厉害。真的没什么特别的称呼，但是让知珉的脑海中关于今天漫长的记忆，全消失得无影无踪，只剩下害羞的旼炡口中的“亲爱的”。亲爱的、亲爱的、亲爱的。</p><p class="story-paragraph">为什么脸红了呀。用那么好听的声音喊亲爱的，是不是太犯规了？原来没必要发出短舌音啊。对于金旼炡来说，撒娇并不用特别做什么，而是三个音节就能结束。</p><p class="story-paragraph">旼炡和喜欢的人在一起会有怎样的变化呢？如果比现在更可爱，到底会是什么样子呢？不自觉露出微笑的脸庞上也满是撒娇，她本人会知道吗？如果在真正信任的人面前，会乖乖躺下，翻着肚子撒娇吗？这样真的和小狗一模一样。在胡思乱想的瞬间，旼炡再次搭话。</p><p class="story-paragraph dialogue">「姐姐对我没有什么好奇的吗？」</p><p class="story-paragraph">知珉停下抹润唇膏的手。好奇的事情早就堆积如山了，等了整整一天，现在才抛出自己期待已久的话，真是不负责任的人。无论自己多么努力试图忽视冲向自己胸口的漩涡，旼炡还是不断地回到她身边，搅乱她的思绪。昨天也是，今天也是。不，其实从旅行第一天到现在，每个瞬间都是。</p><p class="story-paragraph dialogue">「…当然有好奇的」</p><p class="story-paragraph">你明明说过。</p><p class="story-paragraph">并不是因为和前辈一样的香味才接吻的。</p><p class="story-paragraph">但我每次喷香水都会想起那时候。</p><p class="story-paragraph dialogue">「…什么？」</p><p class="story-paragraph">为什么那么轻易接近我呢？</p><p class="story-paragraph">明明对现在的情况不能负责。</p><p class="story-paragraph">连我男朋友的事对你来说是那么轻松的话题吗？</p><p class="story-paragraph">金旼炡，现在和我在一起没任何感觉吗？</p><p class="story-paragraph dialogue">「犹豫那么久真好奇，是什么啊？」</p><p class="story-paragraph">即使传递了心急如焚的眼神，问题制造者也只是用“干嘛那样看着我”的表情作回应。知珉想，都到这时候了，还像今天早上一样到处闪躲的旼炡，实在太无情了。</p><p class="story-paragraph">无名火无处发泄，自己也想挑衅一下她。</p><p class="story-paragraph">这样说不定，能听见你的心里话吧。</p><p class="story-paragraph dialogue">「如果没有好奇的事情，也不用硬想」</p><p class="story-paragraph dialogue">「我不是说有吗？」</p><p class="story-paragraph dialogue">「所以是什么？」</p><p class="story-paragraph dialogue">「你…」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「咬别人嘴唇的习惯，是跟谁学的？」</p><p class="story-paragraph">这句话包含了很多意义。平时因为害羞绝对说不出口，但是现在不想再顾虑以后的事情了。想看到旼炡的动摇，希望她能动摇，想和她四目相对，把她逼到角落让她再也逃不掉。</p><p class="story-paragraph">叩叩。</p><p class="story-paragraph">好巧不巧，好不容易鼓起勇气的知珉，却等不到旼炡的回答。不速之客就像故意在外头等待，这才敲开了两人的房门。</p><p class="story-paragraph">突然响起敲门声，知珉迅速披上了开衫。我来开门吧。旼炡立即走近门口。原以为是柜台拿了什么东西过来，结果从门那边看到的，是素未蒙面的无精打采且瘦弱的白人男子，喘着气走进房间。</p><p class="story-paragraph">难道是预约这个房间的另一位旅客吗？年龄看起来顶多30岁出头。男子在凌晨进来后，立刻把背在背上的吉他放在床上，表示歉意。旼炡盯着吉他，男人这才介绍自己是独立音乐人。</p><p class="story-paragraph">一切都十分突然，知珉向无预警登场的新室友询问会在这住多久，男子似乎只打算在这家旅馆待两天左右。也就是说，他和知珉、旼炡两人，只有今晚和明天一天的时间重叠。陌生人的闯入使情况变得微妙起来。本来就知道可能会和谁用一间房，可突然以这种状态要过两天？</p><p class="story-paragraph">男人在自己的床上捣鼓时，知珉向旼炡用眼神发出“聊一会儿吧”的信号。两个人为了谈话走到角落。旼炡看来不知道自己为何把她叫来，知珉挽着胳膊小声并严肃地说。所以我们，现在要跟那个人共用一个房间吗？你没关系吗？</p><p class="story-paragraph">情况突然变成这样，心里很焦急。正要谈重要话题时，画风突然一变，便要和突如其来外国男人睡同一间房。知珉悄悄地说“换房间怎么样”，但旼炡表情淡然，似乎在问“能有什么问题”。</p><p class="story-paragraph dialogue">「姐姐，这里是欧洲嘛」</p><p class="story-paragraph dialogue">「是啊…」</p><p class="story-paragraph dialogue">「在这里这样是很自然的」</p><p class="story-paragraph dialogue">「但房间也不是完全分开的…而且只有三个人，所以有点怪」</p><p class="story-paragraph dialogue">「很在意吗？」</p><p class="story-paragraph dialogue">「在房里只穿睡衣也很不方便」</p><p class="story-paragraph">即使说明各种理由，旼炡还是一副无所谓的表情。如果产生额外费用，就让我来付吧。知珉的想法没有改变，专心思考着什么的旼炡便挠了挠头说。知道了，我去问问看别的房间，虽然不知道还有没有剩的双人间…</p><p class="story-paragraph dialogue">「如果真的在意的话，明天就换房吧」</p><p class="story-paragraph dialogue">「…可以吗？」</p><p class="story-paragraph dialogue">「如果姐姐觉得不舒服，我也放不下心」</p><p class="story-paragraph dialogue">「对不起」</p><p class="story-paragraph dialogue">「不会啦，只是…」</p><p class="story-paragraph dialogue">「只是？」</p><p class="story-paragraph dialogue">「今晚过去了就没事了吧」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「其实也只有明天会和那个人见面」</p><p class="story-paragraph">这程度没关系吧？不用非得花钱，就呆一晚而已。就这样旼炡最终说服了知珉。听着听着就想通了，为了明天就离开的人，两个人特意换房间只是浪费钱。是啊，只是睡觉的地方，而且行李也已经打开。平心而论，自己是不是太莫名了，因此知珉同意了旼炡的意见。事情即将落幕时，手机上静静响起短暂的震动声。</p><p class="story-paragraph dialogue">-知珉啊、在干嘛？还在整理？</p><p class="story-paragraph">唉哟。</p><p class="story-paragraph">由于一个劲地在解决突发状况，忘记了联系。怎么办，有陌生人在，在房内通电话不太好，在厕所也是。结果知珉为了打电话，只能跑出房间。幸好深夜的楼道十分寂静。拨出不久明俊就接起电话，伦敦比这快两个小时，就快到睡觉时间了。</p><p class="story-paragraph dialogue">「哦，今天有点晚了，刚办完入住手续吗？」</p><p class="story-paragraph dialogue">「嗯，刚刚整理完，抱歉联系晚了」</p><p class="story-paragraph">知珉靠着墙，把今天发生的事情说了一遍。坐了雪橇，发现雪都结在后辈眉毛上，所以代替后辈哆哆嗦嗦地开了雪橇，很有趣。虽然很冷，但是以后可以一起来逛逛。因为是有趣的小插曲，还附上了今早的照片，可能是因为自己比平时更亲切，明俊回答的声音也比平时更柔和。一定很有趣吧，但肯定也很累。嗯，刚才职员说明的时候，我都打瞌睡了…</p><p class="story-paragraph">知珉像往常一样和明俊聊了一些琐事。总之安全抵达了，不用担心，很晚了，明天再联系你。然而，正要说出背诵般最后一句问候时。</p><p class="story-paragraph dialogue">「但是为什么声音这么小啊，今天特别小」</p><p class="story-paragraph dialogue">「啊，我现在在走廊上。房里除了我们还有其他人」</p><p class="story-paragraph dialogue">「啊，是吗？现在不是在酒店吗？」</p><p class="story-paragraph">知珉最终不得不提到想要回避的主题。因为后辈以较为便宜的价格订了房间，结果是多人室的青年旅舍，凌晨突然有人敲门进来。所以最终是三个人一起住了一个房间这个故事。</p><p class="story-paragraph dialogue">「一起用房间的人是谁？是女的吗？」</p><p class="story-paragraph">就知道会这样。知珉不得不小心翼翼地说出事实。即使很麻烦，自己也不想为了跳过话题而对明俊撒谎。</p><p class="story-paragraph dialogue">「不，一个外国男人」</p><p class="story-paragraph">什么？听筒那边，明俊的声音变大。怕在寂静的走廊里响起他的声音，知珉默默把电话音量调低了。</p><p class="story-paragraph dialogue">「马上说要换房间，现在就去跟那个后辈说」</p><p class="story-paragraph">明俊的声音比刚才低沉不少。虽然很平静，但感觉的出来很生气。因这不算误会的误会，知珉浅浅地叹了口气。两人刚才的深情交谈，似乎都成了无用之物。至今为止，他还没有用这种命令的口吻说过话，这更让自己感到惊慌。</p><p class="story-paragraph dialogue">「…可是那个人说明天也只待一天就离开了」</p><p class="story-paragraph dialogue">「所以呢？」</p><p class="story-paragraph dialogue">「好像没有必要换房间。已经把行李都摊开了，特地那样也不太好」</p><p class="story-paragraph dialogue">「特地？什么特地啊？」</p><p class="story-paragraph dialogue">「不是、我的意思是…」</p><p class="story-paragraph dialogue">「那你是要和那个男人睡一个房间吗？」</p><p class="story-paragraph dialogue">「就说了…不是和他两个人一起，而是和后辈一起」</p><p class="story-paragraph dialogue">「知珉」</p><p class="story-paragraph">明俊斩钉截铁般打断自己的话。</p><p class="story-paragraph dialogue">「你不知道我为什么生气吗？」</p><p class="story-paragraph">最终该爆发的还是爆发了。知珉听着远处的恋人烦躁的声音，闭上眼睛。就是累了。如果直接说谎，听的人也会觉得比较舒服吗？如果说是外国女人，事情会到此为止吗？</p><p class="story-paragraph dialogue">「你在开玩笑吗？」</p><p class="story-paragraph">竟然说开玩笑。明俊的最后一句话再次让知珉大吃一惊。好像从来没听过这种语气，虽然吵过几次架，但没有像今天这么情绪化的。可以理解只能接收消息的那种心情，如果去旅行的爱人和其他女人共用一间房，自己也会发脾气。但是仔细想想，知珉也同样感到委屈。自己又不是为了和那个男人用一间房才故意为之，他就在10分钟前突然闯进我们房间，能怎么办？</p><p class="story-paragraph dialogue">「本来打算理解你突然要去旅行的事，毕竟你来之前突然有工作是我的错」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「但是这我不可以生气吗？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「不是吗？是我很奇怪吗？」</p><p class="story-paragraph">今天完全大败。这个回答也是YES。知珉对像子弹一样射向自己的责难无话可说，为了安抚生气地明俊，凌晨的通话拉得越来越长。</p><p class="story-paragraph dialogue">「…是我对不起你。没考虑哥哥的心情」</p><p class="story-paragraph">这时，从另一间客房传来开门的响声。知珉趁着机会对明俊说，可能有人会出来要回房间看看。身心俱疲，好像要晕过去了，想赶紧挂断电话。哥哥，对不起，在走廊打太久电话不好，我得进去看看，明天再说吧。</p><p class="story-paragraph dialogue">「…刚才对你大声，对不起」</p><p class="story-paragraph dialogue">「没事啦，晚安」</p><p class="story-paragraph">其实自己很生气，想和明俊理论。可以理解你生我的气，但能不能说话好听点？即使会被你误会也不想说谎，所以实话实说而已，那也错了吗？我也不是不敢生气才这么安静的。</p><p class="story-paragraph">但是知珉收敛了动荡的心情，和往常一样用亲切的语气结束通话。因为不想吵架，害怕继续听到讨厌的话。不对，其实自己从来都没有好好展示过自己的情绪，或者认真生过气。因为彼此距离太远，所以很难把伤人的话原封不动告诉对方。</p><p class="story-paragraph">而最终，讨厌说谎的刘知珉还有一个一直隐藏的真相。</p><p class="story-paragraph dialogue">「我爱你」</p><p class="story-paragraph dialogue">「我也爱你」</p><p class="story-paragraph">知珉靠在墙上轻轻地蹲了下来，心情非常忧郁。莫名其妙感情用事、为了自尊心而来到北欧，结果今天却遇见了恋人陌生的面孔，都是因为这趟没有计划的旅行。亏自己还把一切都如实相告。</p><p class="story-paragraph">太不像话了，刘知珉。</p><p class="story-paragraph">知珉直接把脸埋在膝盖上。今天，产生全都受够了的想法。那些为了安慰明俊而不必要的微笑、因失去真心的“我也爱你”而不安的问候。还有，一直假装什么都不知道，看着调皮捣蛋的旼炡的自己。</p><p class="story-paragraph">以及问了愚蠢的问题，</p><p class="story-paragraph">却独自茫然地等待她的回答也是，全都受够了。</p></div>

        <div class="chapter-copy"><p class="story-paragraph">知珉因独自一人的不安感，直起身来。房内冷飕飕的，上铺的似乎没有动静，昨天像不速之客一样登场的那个男人也不在，熄灯的厕所更印证自己的不安。强制清醒的知珉大步走向玄关，进入视线的只有自己那双黑色军靴。</p><p class="story-paragraph">其他两个人怎么不见了呢？搞什么啊。突如其来的情况让自己十分紧张。不好的想法总是在脑中浮现。难道在睡觉的时候，旼炡发生什么事了？</p><p class="story-paragraph">这时，知珉迎面碰上了开门进来的两个室友。旼炡表情非常明朗朝自己打招呼。姐姐，刚起来吧，睡得好吗？相反，知珉刚起床，用依旧浮肿的脸，不开心地看着两人。还是穿着软绵绵的睡衣，心情真差。</p><p class="story-paragraph dialogue">「去哪里了？」</p><p class="story-paragraph dialogue">「起得太早，刚去散步了」</p><p class="story-paragraph">明明平时不会早起的人。却一大早起了床。两人说，在房内对话不太好，想说顺便逛了一圈再回来。</p><p class="story-paragraph dialogue">「…啊，是吗」</p><p class="story-paragraph">知珉面无表情地回答，并斜视男人。昨晚的不速之客，和别人的旅行伙伴一起悠闲地散步的该男子，名叫理查德。旼炡从昨晚开始就对理查德的吉他表现出关心，现在也在问他各种各样的事情。真是无语，你不是说我英语很好才让我一起旅行的吗。</p><p class="story-paragraph">现在看来，旼炡似乎根本不需要翻译人员，就能喋喋不休。她说自己也向认识的人学过吉他，但吉他水平很基础，所以还想学。零和弦怎么样、变奏怎么样。听她说着陌生的故事，知珉过了好一阵子才附和一句。</p><p class="story-paragraph dialogue">「你还会弹吉他啊？」</p><p class="story-paragraph dialogue">「是啊，因为兴趣所以和朋友一起组了乐队」</p><p class="story-paragraph dialogue">「那你在乐队是负责什么？」</p><p class="story-paragraph dialogue">「我主要是主唱」</p><p class="story-paragraph">是自己不知道的事情。但实际上，相互认识根本没有多久，当然比起相互了解，不了解的部分肯定更多。怪不得时不时都会听她哼起歌。原来旼炡喜欢音乐啊，而且还是担任大学乐队主唱的程度，是很认真地喜欢吧。</p><p class="story-paragraph dialogue">「其实，我放弃社团也是因为这个」</p><p class="story-paragraph dialogue">「想做乐队？」</p><p class="story-paragraph dialogue">「嗯，我们学校没有乐团部。一半也是因为兴趣，就去学唱歌了」</p><p class="story-paragraph">如果是因此才放弃舞蹈部，那么可以接受。知珉想象在舞台上唱歌的旼炡，一定很不错。她说话时，有着独特的嗓音，加上旋律唱歌一定非常适合，绝对。</p><p class="story-paragraph">知珉被大量的信息搞得一愣，旼炡这时发现了和理查德具有许多共通点，两人欢快地聊起了音乐。最近喜欢这个乐队、一定要听谁的新歌、如果想要买乐器的话推荐这个品牌。好长一段时间，知珉一直默不吭声，因为除了听他们说以外，也无事可做。怎么说呢，当两人认真展开音乐话题，就感觉自己格格不入。</p><p class="story-paragraph">毕竟彼此有着共同的兴趣，没办法。虽然逼自己这么想，但内心还是很失落。明明看上去很怕生的孩子，竟然这么快就和陌生人好上了。准确地说，旼炡与除自己以外的其他人嬉笑打闹的样子，才是非常陌生。真不知道是怎么回事，而且正好昨晚才和明俊吵了一架。</p><p class="story-paragraph dialogue">“姐姐，刚才听到了吧？”</p><p class="story-paragraph">知珉今天也没能集中精神进行对话，无缘无故地咽了一口红茶，反问道。呃，说了什么来着？</p><p class="story-paragraph dialogue">「听说今天在爵士酒吧有演出，还有免费的红酒」</p><p class="story-paragraph dialogue">「爵士酒吧…」</p><p class="story-paragraph dialogue">「嗯，姐姐不是喜欢红酒嘛。晚上去那里看演出怎么样？」</p><p class="story-paragraph dialogue">「想去那看看吗？」</p><p class="story-paragraph">嗯，感觉会很有趣，一起去吧。旼炡眼睛闪闪发光，像个请求许可的小孩。但即便如此，也不能随便答应。旼炡啊，你来一下。知珉继昨天之后，再次拖着纤细的手腕走向走廊。</p><p class="story-paragraph dialogue">「真的要去吗？」</p><p class="story-paragraph dialogue">「姐姐不想去吗？」</p><p class="story-paragraph dialogue">「看演出是很好。但是那个男人不是才刚认识的人嘛。甚至都不知道他是干什么的」</p><p class="story-paragraph dialogue">「什么啊...是他说自己要在那演出」</p><p class="story-paragraph dialogue">「但说不定是奇怪的地方啊」</p><p class="story-paragraph dialogue">「所以我搜了一下地点，好像只是个可以安静喝酒的地方」</p><p class="story-paragraph dialogue">「用说的当然容易」</p><p class="story-paragraph dialogue">「这样算来，姐姐和我在飞机上见面，也和第一次没什么两样吧」</p><p class="story-paragraph">哈？要这么说吗。</p><p class="story-paragraph dialogue">「这个和那个不一样。他毕竟不是韩国人，而且是男人嘛。而且没有一起旅行的人，一个人去有点不妥」</p><p class="story-paragraph dialogue">「唉，不会有什么事的。他知道很多音乐，感觉是个好人」</p><p class="story-paragraph">知珉反驳的时候还在想，自己怎么会像昨晚的明俊一样，唠叨个没完。但紧接着听见旼炡不以为然的回答，再次点燃怒火。感觉是好人吗？在这么短的时间到底了解了什么？</p><p class="story-paragraph dialogue">「一起去吧，你不想看演出吗？」</p><p class="story-paragraph dialogue">「说了不要，我不去」</p><p class="story-paragraph dialogue">「真的吗？」</p><p class="story-paragraph dialogue">「真的不会去的」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「还有，你自己要有戒心。在那里不管发生什么事我都没办法负责」</p><p class="story-paragraph dialogue">「会有什么事发生，好像说得太过分了吧」</p><p class="story-paragraph dialogue">「那你怎么知道？你是那个男人的发言人吗？」</p><p class="story-paragraph dialogue">「…为什么要这么说？」</p><p class="story-paragraph dialogue">「今天分开行动吧。我的心情不是特别想看演出」</p><p class="story-paragraph dialogue">「那在演出之前，一起逛吧」</p><p class="story-paragraph dialogue">「不要，我已经说过好几次了不要了」</p><p class="story-paragraph">别说了。虽然心底的某处传出警告，但嘴上却不停吐出刺耳的话。不至于说到这个地步吧。在旼炡受伤的眼眸，以及泼了冷水般的氛围下，知珉蹬了蹬脚，无端望着脚下。</p><p class="story-paragraph dialogue">「我只是想自己去」</p><p class="story-paragraph dialogue">「…好的，知道了」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「我也不想勉强你，我不会再问了」</p><p class="story-paragraph">在好奇旼炡各种面貌的同时，对旼炡不太喜欢的面貌也在增加。例如刚才那样乱说陌生人的事情时，不知为什么会有种失落的感觉。也不喜欢她跟在异地初次见面的人走。不知不觉中知珉心里充斥着不满，只能暂时闭上眼睛，做了点反省。</p><p class="story-paragraph">金旼炡又不是我的宠物。</p><p class="story-paragraph">这还真是重症啊。</p><p class="story-paragraph">心里很清楚，对旼炡的冷漠，其实是自己对昨晚的事情幼稚的发泄。但是在情感爆发的现在，自己只想离开这里。一个人待着的话，头就不会那么疼了吧。还有要自己在身后挥手，看着他们俩一起出去，实在无法忍受。</p><p class="story-paragraph">知珉把剩下一半的红茶直接倒进洗手台，熟练地扎起头发，包里带了一罐冰茶。旼炡借给自己的羽绒服，被整齐地挂在衣架上，唯独今天不想碰它。披上旅行第一天穿来的牛仔外套，随便穿上鞋子，就这样一个人在玄关处捣鼓着，旼炡则畏畏缩缩地靠近自己。</p><p class="story-paragraph dialogue">「…今天要去哪儿啊，姐姐？」</p><p class="story-paragraph">这个嘛，我还没决定呢。知珉生硬的语气不耐烦地回答。还没有决定要去哪里其实是实话。</p><p class="story-paragraph dialogue">「为什么今天…」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「不穿我给你的羽绒服吗？」</p><p class="story-paragraph dialogue">「看起来不怎么冷，所以只穿夹克也没事」</p><p class="story-paragraph dialogue">「早上出门散步的时候天气很冷的」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「外面很冷的，不能就直接穿着出门吗？」</p><p class="story-paragraph dialogue">「没关系，我不像你那么怕冷」</p><p class="story-paragraph">旼炡则开始对准备好出门的人一个劲地追问。为什么这么早就要出去了，有什么急事吗？早饭吃了没有？充满担忧的温暖嗓音，现在怎么也不想听见。</p><p class="story-paragraph dialogue">「嗯，不怎么饿」</p><p class="story-paragraph dialogue">「明明每天都吃会水果，怎么不吃点就出去。因为姐姐喜欢桃子和橘子，我才拿出来的」</p><p class="story-paragraph dialogue">「没关系」</p><p class="story-paragraph dialogue">「茶也没喝就倒掉了」</p><p class="story-paragraph dialogue">「…旼炡啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「一会儿我会自己看着办的。从什么时候开始操心我的早餐了」</p><p class="story-paragraph dialogue">「…没必要说成这样吧」</p><p class="story-paragraph">起床开始，不知道和那双受伤的眼睛对视了几遍。刚才说的太难听了吗？其实自己并不是故意冷淡回应的。</p><p class="story-paragraph dialogue">「…对不起」</p><p class="story-paragraph">那就拿着这个路上吃吧。旼炡从背后窸窸窣窣拿出了什么东西，是一包小小的胶原蛋白。好，知道了。旼炡听到知珉毫无诚意的道歉后，便不再多问，而是做了道别。</p><p class="story-paragraph dialogue">「姐姐，路上小心」</p><p class="story-paragraph">我出门了。知珉也留下一句话，没有回头就离开了宿舍。</p><p class="story-paragraph">啊、好幼稚啊，刘知珉。</p><p class="story-paragraph">高中时期好像也没有这样过。尽管如此，也无可奈何。因为如果继续面对旼炡的话，肯定只会说出惹人厌的话。</p><p class="story-paragraph">但是这一整天，一个人该做什么好呢。至今为止，虽然旅行中有很多曲折，但像今天这样完全孤身一人还是第一次。旼炡在芬兰发烧生病，到处去买食物时，还有遗失包包的时候，都只是暂时分开而已。知珉摇了摇头，甩掉记忆。现在反而应该什么都不管，自由自在的享受才对。一定要度过比去爵士酒吧还要充实的一天。</p><p class="story-paragraph">计划，先制定计划吧。</p><p class="story-paragraph">知珉看了各种斯德哥尔摩旅行后记，很快便选定两个去处。第一是宜家。虽然位置比较偏远，但听说是瑞典总店，就产生了去参观的想法。来到北欧后，还没有真的参观过傢俱。总之，既然已经确定了目的地，便马上迈出脚步。</p><p class="story-paragraph">知珉像是不想错过每条街景，慢慢地散着步。反正今天没有什么可着急的。比起和旼炡在一起时一边聊着天，可能错过各种细节，现在自己可以更集中精神去观察周遭琐碎的风景，以及细微的氛围。同样是北欧，斯德哥尔摩和赫尔辛基感觉起来却大不相同。首先，在寒冷的天气下，这里的人们服装较为华丽，游客明显更多，自行车道也更加完善，路上很多人骑着公共自行车出门。如果不是很冷的话，真想骑一次试试。也许正因为如此，知珉对斯德哥尔摩的印象是更加明朗和商业的地方。</p><p class="story-paragraph">虽然特有的氛围和眼前的风景令人很满意，但走不到10分钟，寒气就逐渐袭来。在这样的天气下，只穿牛仔夹克是有点夸张了吗？知珉在公车站直跺脚，车一来就赶紧往内走。</p><p class="story-paragraph">宜家总店的位置比想象中更外围，因此需要搭好一阵子的车。而且刚到达，就发现建筑比韩国宜家要小得多。是不是白来了。虽然有过暂时的后悔，但一进到内部，这个想法立即改变了。</p><p class="story-paragraph">在採光良好的窗边，一排排傢俱彷彿把北欧的家居照搬过来。顾客中也有很多情侣或带孩子的夫妇。理想的新婚房，会是这种氛围吗？知珉想在回到韩国后改变装潢，因此四处参观。虽然因为之前衣服买得太多，没有想到要买室内装饰品，但还是先下定了决心。虽然遗憾，但是今天只用眼睛看，卡不能再刷了。</p><p class="story-paragraph">突然想起，自己的行李箱就那么随意摊在旅店里。昨天，那个叫理查德的男子冲了进来，都没能好好整理就睡了。房内乱糟糟的，今天是不是该趁着机会好好收拾一下。知珉无意中想象了一下旼炡的家会是什么感觉。看到金旼炡带着一大堆行李，金旼炡的房间也会像她一样乱糟糟吗？她能好好打理自己家吗？</p><p class="story-paragraph">其实，旼炡连续几天都把饼干袋子乱放，早起的知珉整理垃圾已成习惯。而且旼炡很多行李经常侵犯别人的位置，等知珉忍无可忍就会被训斥。旼炡啊，整理一下行李吧？旼炡这才会看眼色行事。有没有有效的习惯养成方法呢？知珉摇摇头，似乎想摆脱关于旼炡的想法。旅行一开始就这样，挺难办的。</p><p class="story-paragraph">刚好手中的手机传来短短的震动。心想是明俊吗，结果意外的是来自旼炡的信息。一张看上去像露天公园的背景照片。</p><p class="story-paragraph dialogue">-我现在一个人来这种地方散步呢</p><p class="story-paragraph">什么呀，怎么一个人在公园？以为一大早就跟那个男的出门，看来不是。知珉只是确认了内容，没有回复便专心看起室内装潢。几分钟后，通知又接连响起。</p><p class="story-paragraph dialogue">-比想象中普通</p><p class="story-paragraph dialogue">-早知道就跟着姐姐了~</p><p class="story-paragraph dialogue">-在做什么？</p><p class="story-paragraph">就算现在说想跟我一起来，我也不会带着你的。但是，手机震动声丝毫没有间断，就像刚才旼炡不知所措地在背后喊自己。姐姐，你在干什么，你在哪里。这样。</p><p class="story-paragraph">这么一想，刚才看都没看她的脸，就直接出门了。那样的话，无论谁都会伤心的吧。仔细想想，旼炡到底做错什么，自己竟然说出那些讨人厌的话。但是，现在路已经走远，无法回头。没办法，今天只能通过短信和旼炡联系。知珉叹了口气，简短地回了讯息。</p><p class="story-paragraph dialogue">-我在宜家</p><p class="story-paragraph dialogue">-有很多能参观的吗？</p><p class="story-paragraph dialogue">-没有想象中那么大</p><p class="story-paragraph dialogue">-发个照片吧</p><p class="story-paragraph">嗯、要照片啊。知珉马上拍了一张前方展示房的照片发给她。对此，旼炡立即提出了其他的要求。不是这个，是有姐姐的照片。</p><p class="story-paragraph">虽然不是自己乐意，但既然接受了请求，就拍一张吧。知珉东张西望，物色光线合适的地点，毕竟照片中的光就是生命。正好色彩饱满的自然光就撒落在眼前的宜家展厅，加上柔和色调的饰品点缀，非常适合自拍。当周围参观的人群离开，知珉便悄悄走进去拍照。</p><p class="story-paragraph">在确认相片时，自己忍不住”哦”的一声，併发出自夸的感叹。从小开始累计拍了几千张照的自拍达人，也觉得这次拍得太好了，大概是能进入人生照TOP 10的程度。还有用这张当头贴一整年都用换的程度。知珉倒是很期待她会做出什么反应，并兴奋地向旼炡传送了照片。很快，又接连响起几声提示声。</p><p class="story-paragraph dialogue">-照片拍得很好啊~</p><p class="story-paragraph dialogue">-可以在YouTube上开自拍课了</p><p class="story-paragraph dialogue">-开个账号吧我会订阅</p><p class="story-paragraph">什么呀，这不冷不热地反应。虽然称赞是称赞了，但心情却不是很好，刚获得人生自拍本来还很开心来着。虽然不是特别期待着什么，但即使是客套话也好啊，完全不说自己漂亮的她，有点讨厌。而且期待着她的反应，暂时心跳加速的自己，有点丢脸。那就不能光自己一个人害羞。</p><p class="story-paragraph dialogue">-你也拍张自拍给我吧</p><p class="story-paragraph dialogue">-我不太会拍啊</p><p class="story-paragraph dialogue">-那也得尽最大的努力试试</p><p class="story-paragraph">知珉给出了任务，从包里拿出冰茶喝了一口。等了几分钟，收到一张旼炡的照片，知珉看到结果后不禁失笑。自己失手拍的照片也比这个好。</p><p class="story-paragraph">后脑勺发疼。根本不用评价，就一句话，乱七八糟。首先，拍照地点就很奇怪，为什么在垃圾桶旁边拍呢？白天又为什么突然开闪光灯呢？甚至，后面戴墨镜的游客大叔们看来似乎被闪光灯吓到，面对着镜头。总之，总体上看来是一团乱。</p><p class="story-paragraph dialogue">「…金旼炡，这到底是什么？」</p><p class="story-paragraph dialogue">「要拍出这样充满动态效果的照片，也不简单吧」</p><p class="story-paragraph">而且最重要的是旼炡的脸看起来并不兴奋，反而非常僵硬，就像被检查作业的小学生。这种程度还行吗？她的表情就是这样。由于莫名的逆光，所以旼炡稍微眯着眼睛。知珉想要清楚看到她的脸，用手指稍微放大，圆圆的脸蛋充满整个画面，更是像傻瓜一样可爱。</p><p class="story-paragraph">真受不了。</p><p class="story-paragraph">即使拍得乱七八糟也得保存下来。</p><p class="story-paragraph">知珉的下一个目的地，是斯德哥尔摩最有名的相片美术馆。要前往美术馆不得不重新回到住处附近。也是因为能待在室内，至少不用在室外冷得发颤，而且最近几天都是与旼炡同行，完全没有机会静静度过，所以才选择了这个场所。</p><p class="story-paragraph">知珉沿着湖边慢步，看见停泊的一艘艘巨型轮船，就知道快到目的地了。只见正面写有“Fotografiska”的招牌，和饶富韵味的砖石建筑相互调和。知珉购买了主要展区的门票，缓缓走进场馆。建筑物内部放满了黑白照片。参观者们一眼就能看出，这是场气氛沉闷的摄影展。</p><p class="story-paragraph">其实，阴暗的照片实在不符合知珉的喜好，但能在展场安静地待着也不错。原本就是为了享受这种宁静才来的，且由于解说全都是用瑞典语进行，对内容完全无法理解。想想既然这样，就用眼睛看过就好，结果发现了一道大大的英文字。</p><p class="story-paragraph">Everything might not be enough.</p><p class="story-paragraph">一张黑白照上，只有歪歪斜斜黑字写在皱巴巴的白纸上。伫足了一阵的知珉拿起手机拍了张相。为什么突然被这种照片感动了呢，自己也很难解释。</p><p class="story-paragraph">照片这个东西很奇怪，在那个世界里，只有匿名的观察者和被拍摄到的东西。如果有其他人看到那被拍下的瞬间，就会产生不同的意义吗？在展出的作品中，有些作品长篇大论的解说让人觉得毫无意义，只能看见作者膨胀的自我。但是，如果观众按照自己的内心进行解读，那么这件作品就会成为触动其心灵的作品。</p><p class="story-paragraph">安静是很好，但自己还是不太懂现代艺术。这就是知珉参展后的短暂感想。一直站着，腿也酸了，便将身体靠在展场的空椅上。一有空就拿出来喝的冰茶已经见底，刚才没吃早饭，肚子咕噜咕噜响。只喝一瓶冰茶不可能填饱肚子。知珉翻着包，拿出旼炡给的胶原蛋白，一口吃掉。</p><p class="story-paragraph dialogue">“不会自拍都是有原因的，只要稍微练习一下就能做好的…”。这是旼炡在乱七八糟的照片上进行的辩解，但她从这之后就失去了联系。现在在做什么呢？难道是因为移动中不能使用WIFI吗？</p><p class="story-paragraph dialogue">-你现在在哪？</p><p class="story-paragraph">短短的一句话，却反复删改。知珉摇了摇头，才与旼炡分开多久而已，一直盯着手机的自己真是可笑。要是这样，从一大早开始耍脾气就没意义了。快忘掉，就自己一个人专心旅游吧。</p><p class="story-paragraph dialogue">「…想联系的话，会看着办的」</p><p class="story-paragraph">刚从与阳光隔绝的展馆出来，知珉眯起眼睛。太阳就快下山了。可能是由于气温下降，活力也跟着下降，有点饿了。但也不是特别想吃东西，所以知珉买了一大盒沙拉，坐在附近的公园长椅上。但独自享受宁静的氛围没过多久，鸟儿就开始在头顶上飞来飞去。</p><p class="story-paragraph">直到那之前，还不知道北欧海鸥的攻击性和凶恶程度。原以为一挥手就能将海鸥赶走，可不料马上又飞来两三只，坚持扑过来抢饭吃，简直像流氓一样，甚至体型还很大。作为患有严重鸟类恐惧症的知珉，很难再继续待下去。知珉被鸟儿的执着和疯狂给打败，最终把没吃多少的沙拉盒收进包里。虽然不知道这算不算有用的情报，但还是记住了。这里的海鸥非常具有攻击性，在觅食困难的冬季，在室外吃东西的话，就算人类也会成为牠们的目标。</p><p class="story-paragraph">至此，看着日落用餐的计划，因饥饿的飞禽而化为泡影。反正都这样了，就改变计划吧。行吧，今天倒没怎么花钱，去找个好地方吧。光吃沙拉算什么，别因为独自旅行而亏待自己，去又贵又好的餐厅吃肉吧。既然要去，就要大吃一顿。</p><p class="story-paragraph">知珉带着突然下定的决心，马上找到了一家评价不错的餐厅。正好10分钟路程，有一家专卖瑞典食物的餐厅。好，就是这里。知珉决定去填饱肚子，找到最短路线，毫不犹豫地迈开脚步。</p><p class="story-paragraph">突然决定的餐厅是肉丸专卖店。规模比想象中小，每张桌子上都点着蜡烛，非常温馨。虽然之前不清楚，肉丸是瑞典的传统饮食。知珉在职员的推荐下点了最有人气的餐点，还要了杯红酒。</p><p class="story-paragraph">上桌的餐点很简单。餐盘里盛着薯泥、蔓越莓果酱和几个肉丸。好歹吃上了肉，心里很满足。或许是空腹直接吃晚上，盘子上的食物很快就一扫而空，甜甜的红酒也非常棒。不知不觉间，室内变得拥挤，每张桌子上都说着听不懂的瑞典语。</p><p class="story-paragraph">不知从何处感受到的视线，知珉擦拭着嘴角观察周围。在一旁的座位上，同样说着听不懂的语言的两位男子，朝自己瞥了一眼。虽然想装作没看到，但是那男人开始明目张胆地盯着自己看，所以没办法无视。一个人的话，真的很讨厌这样。知珉不得不把杯中剩下的葡萄酒喝掉，反正饭也都吃完了，就干脆起身吧。但瞬间，那个男人就用英语向自己搭话。是一个人来的吗？刚好要去喝酒，如果时间允许的话，一起去怎么样？</p><p class="story-paragraph">听了这些话，拿着红酒杯的手不自觉紧握。事实上，在观光地区或酒吧搭讪，并不是什么稀奇的事。但是今天这个挑逗，实在是令人恼火。第一次的独自旅行并不坏。不，反而和预期的一样游刃有余。</p><p class="story-paragraph">但令人印象深刻的，莫名都是些烦人的事。现在坐在旁边的这个男人、在宿舍生气地问“要和男人用一个房间吗”的明俊、觊觎别人的沙拉而绞尽脑汁的瑞典海鸥、以及突然出现就用吉他拐跑小孩的理查德。还有最大的问题是，被骗后就抛弃刘知珉，随波逐流的金旼炡，你，你就是最大的问题。</p><p class="story-paragraph">虽然“抛弃刘知珉”不太正确，但不管怎样，知珉个人受到了很大的伤害。对不起已经有约了。知珉干脆利落地拒绝男子，站了起来。没有露出礼貌的微笑，表情很冷淡。但知珉一点也不在乎，结完账就直接离开。</p><p class="story-paragraph">来到室外街道，太阳完全下山，不知不觉已是夜晚。寒冷的空气再次袭来，知珉把手插进夹克口袋，然后茫然地看向湖边沿岸，温暖的路灯闪烁着打开。</p><p class="story-paragraph">在做什么呢？</p><p class="story-paragraph">即使心里这样问，旼炡也不会回答。在昏暗的灯光下独自蹒跚地走着，突然感受到孤独。一整天都以为自己忍得很好，是因为天气太冷吗？还是太阳下山令人感伤呢？知珉此刻想把不久前在旼炡手机上看到的那些信息，也就是前辈给旼炡发的话，原封不动地复制下来问她。</p><p class="story-paragraph">怎么突然没有联系。</p><p class="story-paragraph">和那个男一起看的表演，就那么有意思吗？</p><p class="story-paragraph">心情很复杂。一部份是对她突然失去联系的不安，另一部份则担心万一她发生了什么事。早知道让自己一起去爵士酒吧的时候就跟着去了，还想起自己作为小鸟宝宝的监护人，这么丢下孩子，不知道到底对不对。更重要的是，对那个吉他手的不信任占了四成左右。提着个吉他就行了吗？什么独立音乐人啊。把来旅行的孩子带走，是不是做了什么奇怪的事情，果然还应该拿到那个男人的联系方式的。</p><p class="story-paragraph">还有金旼炡你也是，这么容易跟着陌生人走。“姐姐不去的话我也不去”，哪怕是句哄自己的话也不说。如果哐的一声生气地关上门出去的话，当然要把我拦住啊，连挽留都不挽留。难道连一部浪漫电影都没看过吗？虽然自己并不期待喜欢枪战动作片的人，会知道那样细微的信号。</p><p class="story-paragraph">怪不得搞得我筋疲力尽。</p><p class="story-paragraph">你不知道我心里都在纳闷这些事情吧。</p><p class="story-paragraph">这几天一直待在一起，难道已经习惯了两个人吗？一般和陌生人去旅行的话，就像明俊所说的那样，通常只有大吵大闹或感到很不舒服。</p><p class="story-paragraph">但是为什么今天的自由时间，我一直无法集中，总是只想着你。本来想今天晚上见到你的脸，绝对不会先跟你搭话的。本来想，一定不告诉你我做了什么，也不给你看照片。本来想也可能干脆宣布明天也要自己出门，然后直接躺下睡觉。</p><p class="story-paragraph">旼炡在不在身边，结果都一样。今天我的脑子里，充满了没能说给旼炡听的话。如果有人问一个人旅行是否满意，答案是否定的。只看见早上发来乱七八糟的自拍远远不够，不知道旼炡和谁在何处做什么，心里带着茫然不安，一整天就这么流逝掉，至少对知珉来说一点都不充实。</p><p class="story-paragraph">现在以金旼炡为中心旋转的所有情况都不公平。</p><p class="story-paragraph">遇到你之前明明自己也能好好过，</p><p class="story-paragraph">怎么一夜之间变成这样了。</p><p class="story-paragraph">叮——</p><p class="story-paragraph">正被闷闷不乐的气氛淹没，恰好电话响了起来。电话？这个时间？这样不可能是明俊。屏幕上显示的是今天一直困扰知珉的三个字。刚才还在埋怨着的某人。</p><p class="story-paragraph">要接吗？</p><p class="story-paragraph">真来电话，自己倒害怕了。旼炡又会如何动摇我呢？会说多少奇怪的话，让人心烦意乱呢？知珉没有马上接起电话，只是望着画面中的名字。但回过神来一看，甚至不是普通的电话。</p><p class="story-paragraph dialogue">「…甚至是视频通话？」</p><p class="story-paragraph">这样的话该提早说啊，真是的。知珉迅速用镜子确认了自己的状态，在电话被切断之前，按下了通话钮。</p><p class="story-paragraph dialogue">「…有在好好旅行吗？」</p><p class="story-paragraph">仅仅隔了几个小时，再次听见她的声非常亢奋。画面上看到的地方大概是爵士酒吧，但室内灯光太暗，看不清脸。旼炡头上看来戴着一顶黑帽子。但因为像素问题画面看着很破碎，实在看不清。因网路限制，画面总是断断续续。简直分不清这是视讯通话还是无线电通话，在斯德哥尔摩的远距离对话实在令人郁闷。其中值得庆幸的是，即使无法显示高画质的脸蛋，声音并不会断掉，能听得很清楚。</p><p class="story-paragraph dialogue">「怎么突然视频通话，不发讯息？」</p><p class="story-paragraph dialogue">「电话比讯息好多了」</p><p class="story-paragraph dialogue">「要打电话应该提早说啊」</p><p class="story-paragraph dialogue">「本来想拍照传给你的，但实在拍不好。想顺便看看你的脸，就试着打过去了」</p><p class="story-paragraph dialogue">「但你那里太暗了，连脸都看不清。去亮一点的地方怎么样？」</p><p class="story-paragraph">于是旼炡找了个有光的地方，就坐在光源下。可能是边拍自己的脸一边对话有些别扭，她的眼睛一眨一眨，虽然画面上旼炡的脸蛋，大概只有480px低画质。</p><p class="story-paragraph">不管怎样，旼炡就算是全损画质也显得特别可爱。几乎可以说是白色的圆上印有两个黑点。如果说这是情人眼里出西施也没什么可反驳的。但是绝对不能看她可爱而露出开心的表情，不能露出笑容，不能因为见她就激动地提高音量。</p><p class="story-paragraph dialogue">「所以今天都做什么了？」</p><p class="story-paragraph dialogue">「不告诉你」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「因为你好像不怎么好奇」</p><p class="story-paragraph dialogue">「现在不就是因为好奇才打电话的嘛」</p><p class="story-paragraph dialogue">「你从下午开始不就干脆连联系都没有了嘛」</p><p class="story-paragraph">怎么这么晚，让我一直等着你。</p><p class="story-paragraph dialogue">「啊，都是手机没电了。所以我借了充电器，到现在才重新打开」</p><p class="story-paragraph">怪不得。手机好像关机有一段时间了。一句简短的解释，让自己心烦意乱的误会突然砰地消失不见。根本就没什么大不了的，本来就是这样。</p><p class="story-paragraph dialogue">「所以表演呢？有趣吗？」</p><p class="story-paragraph dialogue">「嗯，气氛很好，选曲也很好。乐队实力也非常棒」</p><p class="story-paragraph">接着旼炡讲了演出怎么样、理查德又怎么怎么样。另外，还讲了很多只有本人听得懂的话。嗯，是吗，是吗。机械式回答了几次，这时旼炡才换了话题。今天没有什么有趣的事情吗？去宜家后去哪儿了？但是即使她问了，自己却没有什么可炫耀的。有趣的事啊，其实今天根本没有什么有趣的事情，刚才被海鸥追赶的事情也说不出口。知珉清了清嗓，故作镇定。</p><p class="story-paragraph dialogue">「去看了照片展，还不错，你明天也去看看吧」</p><p class="story-paragraph dialogue">「只有我自己吗？明天开始还是要一起旅行啊」</p><p class="story-paragraph dialogue">「就听你的？不要」</p><p class="story-paragraph dialogue">「怎么这样，自己一个人一整天不应该够了嘛」</p><p class="story-paragraph dialogue">「一个人出门挺好的啊」</p><p class="story-paragraph dialogue">「哪里好？」</p><p class="story-paragraph dialogue">「因为旁边没有人吵闹，非常安静，很好」</p><p class="story-paragraph dialogue">「骗人」</p><p class="story-paragraph dialogue">「是真的，就说真的很好」</p><p class="story-paragraph">说好至少不是谎话。因为省略了各种细节与小插曲。为了一整天不想你，我多努力地到处去啊。</p><p class="story-paragraph dialogue">「好伤心啊，为什么这么闹别扭。真的吗？」</p><p class="story-paragraph dialogue">「我没有闹别扭」</p><p class="story-paragraph dialogue">「知道了，然后晚餐呢？吃什么了？」</p><p class="story-paragraph dialogue">「瑞典肉丸」</p><p class="story-paragraph dialogue">「肉丸？应该很好吃吧」</p><p class="story-paragraph dialogue">「这是宿舍附近，之后去看看吧」</p><p class="story-paragraph dialogue">「怎么总是让我之后去呢？都说了一起旅行了」</p><p class="story-paragraph dialogue">「我只是推荐给你而已」</p><p class="story-paragraph dialogue">「姐姐」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「不过…你是喝酒了吗？」</p><p class="story-paragraph dialogue">「嗯，怎么了？」</p><p class="story-paragraph dialogue">「脸好像有点红。没事吗？」</p><p class="story-paragraph dialogue">「只喝了两杯红酒」</p><p class="story-paragraph dialogue">「是吗？」</p><p class="story-paragraph dialogue">「…其实我正在考虑」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「我想等等去啤酒屋喝两杯。坐在旁边的人约我一起喝酒」</p><p class="story-paragraph dialogue">「…什么？」</p><p class="story-paragraph">虽然这是骗人的，但确有此事，掺杂真相的谎言反而更难以辨认，知珉这次真的想好好戏弄旼炡。所以厚着脸皮把刚才的小插曲，适当编造成了有模有样的故事。</p><p class="story-paragraph dialogue">「什么意思？坐在旁边的人？」</p><p class="story-paragraph dialogue">「嗯。吃饭的时候偶然聊到了一起」</p><p class="story-paragraph dialogue">「偶然？和陌生人？」</p><p class="story-paragraph dialogue">「当然了，这里哪有我认识的人」</p><p class="story-paragraph dialogue">「不是…是干什么的人啊？」</p><p class="story-paragraph dialogue">「我怎么知道」</p><p class="story-paragraph dialogue">「是男人吗？」</p><p class="story-paragraph dialogue">「嗯，两个男人」</p><p class="story-paragraph">对每个问题都一一回答，但旼炡却只说“啊，是吗”，没有做出自己满意的回答。知珉为了煽风点火，故意叙述起细节。好像是本地人，说不定能带我去好地方，感觉很有趣打算要一起去。</p><p class="story-paragraph dialogue">「所以要去哪里？我也去」</p><p class="story-paragraph dialogue">「怎么了？不来也没关系」</p><p class="story-paragraph dialogue">「他们不是不认识的人嘛」</p><p class="story-paragraph dialogue">「不会有事的，感觉是好人啊？」</p><p class="story-paragraph">知珉终于把今天早上旼炡所说的话，原封不动地还给了她。自己只是单纯地想逗她，但旼炡的反应却如此认真，真是太有意思了。就像没有预料就突然打出全垒打，心情非常痛快。金旼炡，你也体验一下我的感受吧。</p><p class="story-paragraph dialogue">「别开玩笑了」</p><p class="story-paragraph dialogue">「你现在不也是和陌生人在一起吗？半斤八两」</p><p class="story-paragraph dialogue">「他是和我们同个宿舍的人啊。干嘛这样，真是的」</p><p class="story-paragraph dialogue">「站在我的立场看没有什么不同啊？」</p><p class="story-paragraph dialogue">「别说了，现在人在哪？」</p><p class="story-paragraph dialogue">「不告诉你。」</p><p class="story-paragraph dialogue">「是故意的吧。如果真的想去喝一杯的话，一定要告诉我在哪里，一定」</p><p class="story-paragraph">情况和平时有了逆转，自己非常满意。知珉没就此放过处于劣势的旼炡，不断往火中加油添醋。我干嘛要全都告诉你？不用担心，我自己喝完就会回去，你在爵士酒吧和那个男人多玩会儿，不管你回不回来。</p><p class="story-paragraph dialogue">「…不要闹脾气了。直接回宿舍喝不行吗？」</p><p class="story-paragraph dialogue">「我想在外面喝」</p><p class="story-paragraph dialogue">「要不然和我一起喝吧。来爵士酒吧喝一杯吧」</p><p class="story-paragraph dialogue">「不要，我一定要和陌生人一起喝」</p><p class="story-paragraph dialogue">「…刘知珉，你真的太过分了」</p><p class="story-paragraph dialogue">「…什么？」</p><p class="story-paragraph dialogue">「是因为喝醉了吗？今天真是不听话啊」</p><p class="story-paragraph">明明自己正在玩弄她，但这一句话就像打了自己后脑勺一样。刘知珉？你刚刚说的是刘知珉吗？你是因为加姐姐两个字太难现在说了平语吗？</p><p class="story-paragraph dialogue">「你刚才说什么？」</p><p class="story-paragraph dialogue">「我叫你的名字了，怎么？」</p><p class="story-paragraph dialogue">「现在跟我连敬语都不说了？」</p><p class="story-paragraph dialogue">「反正我生日早一天就是00年生了，我们也算是同岁」</p><p class="story-paragraph dialogue">「所以现在也不叫我姐姐了吗？就随便来了？」</p><p class="story-paragraph dialogue">「随便的是姐姐。我那么担心，但你今天都不先联系，还说要和不认识的男人们一起去喝酒」</p><p class="story-paragraph dialogue">「呀，金旼炡」</p><p class="story-paragraph">你突然提这个的话，我也有很多话要说好吗？</p><p class="story-paragraph dialogue">「干嘛？」</p><p class="story-paragraph dialogue">「你懂什么？你知道我一整天都在想什么吗？」</p><p class="story-paragraph dialogue">「我怎么知道。刚才我打电话之前连个短信都不给我发。说好一起旅行，结果一个人就这么出去了」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「感觉心里不好受，所以今天都是我先联系的。因为觉得对不起姐姐」</p><p class="story-paragraph dialogue">「好吧，你既然感到抱歉，那就更抱歉吧。你之前问我有没有好奇的，不是都问了吗。我不都问了嘛，你为什么不回答呢？」</p><p class="story-paragraph dialogue">「你昨天问了什么？」</p><p class="story-paragraph dialogue">「…你不会是装作不知道吧？这都不记得，就真的不是人了」</p><p class="story-paragraph dialogue">「喝了酒开始乱说话了呢」</p><p class="story-paragraph dialogue">「所以你是记得，还是不记得」</p><p class="story-paragraph">问你从谁那里学到随便咬别人嘴唇。</p><p class="story-paragraph">明明都听到了还装蒜？</p><p class="story-paragraph">由于北欧的漫游数据，旼炡的脸已经不是480px，几乎是240px。事实上，画面几乎是停止的。但旼炡的脸似乎比刚才红了不少。全损画质也可以看出她变红的样子。</p><p class="story-paragraph dialogue">「…一定要现在说那个吗？」</p><p class="story-paragraph dialogue">「不说就不跟你去旅行了」</p><p class="story-paragraph dialogue">「啊，真是拿你没办法，刘知珉」</p><p class="story-paragraph dialogue">「比起一直逃避、只会辩解的金旼炡小姐，我应该更好」</p><p class="story-paragraph dialogue">「我高中时真不知道姐姐是这种人。这执拗的性格怎么藏起来的呢？」</p><p class="story-paragraph dialogue">「不要转移话题。我高中时也不知道前辈在和你交往」</p><p class="story-paragraph dialogue">「怎么突然又出现前辈了？不合逻辑」</p><p class="story-paragraph dialogue">「至少你很清楚，不是吗？」</p><p class="story-paragraph dialogue">「还抓小辫子呢？」</p><p class="story-paragraph dialogue">「今天也不回答我的话…」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「我真的不会跟你一起出门的，你知道一下」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「…不，是没办法」</p><p class="story-paragraph dialogue">「声音怎么突然那样？你在哭吗？」</p><p class="story-paragraph dialogue">「…没哭」</p><p class="story-paragraph">其实从刚才开始就有点哽咽了。倒不必这么快察觉，如果能好好回答问题就好。今天如果再躲开，就没办法一起旅行，这句话有一半是真心，一半是谎言，还有一半威胁。也许听起来很幼稚，但一直憋在心里的话终于脱口而出，虽然痛快，但也很害怕。</p><p class="story-paragraph dialogue">「我还在问你问题呢。所以现在别绕圈子了，回答我」</p><p class="story-paragraph dialogue">「…知道了」</p><p class="story-paragraph dialogue">「前辈发的短信你回复了吗？」</p><p class="story-paragraph dialogue">「…是的，我回了」</p><p class="story-paragraph dialogue">「你们俩是不是分手了？」</p><p class="story-paragraph dialogue">「不都说过一个月前已经分手了嘛。现在什么关系都不是」</p><p class="story-paragraph dialogue">「明明说什么关系都没有，还乖乖回复」</p><p class="story-paragraph dialogue">「姐姐，你好像喝醉了」</p><p class="story-paragraph dialogue">「不要总是转移话题，我真的很清醒」</p><p class="story-paragraph dialogue">「…我现在去接你」</p><p class="story-paragraph dialogue">「算了吧」</p><p class="story-paragraph">知珉把手机直接反过来盖上，只听得见旼炡的声音。有如告解一般吐露心声后，酒反而醒了不少。神志变得清醒，不知道是好事还是坏事。旼炡面对只剩黑屏的手机，一直喊着“姐姐、姐姐，不要挂电话”。知珉无视内心恐惧，向旼炡提出了最后一个问题。</p><p class="story-paragraph dialogue">「旼炡啊，我再问你一个问题」</p><p class="story-paragraph dialogue">「…问吧」</p><p class="story-paragraph dialogue">「我们...坐火车的那天」</p><p class="story-paragraph dialogue">「…嗯」</p><p class="story-paragraph">知珉现在，连面对小画面中几乎看不清的旼炡的自信都没有。可能是因为自己满脸通红。可能是边哭还依然边说这些话，实在太傻了。这可能是自己肆意嘲弄旼炡的一种报应吧。</p><p class="story-paragraph">现在正屏住呼吸等着你，</p><p class="story-paragraph">不想期待了又失望，</p><p class="story-paragraph">不想再一个人变得像傻瓜了。</p><p class="story-paragraph dialogue">「…那天为什么吻我？」</p><p class="story-paragraph">再也不想装作不知道了。</p><p class="story-paragraph">实在撑不住了。</p><p class="story-paragraph">你不是吗？</p></div>

        <div class="chapter-copy"><p class="story-paragraph">知珉蜷缩着身体咬着下唇，手机画面依然被翻过盖上。把在心底反复思索的问题全部说出来，心里痛快多了。像刚跑完100米一样，心脏砰砰直跳。在无尽地等待着旼炡回答时，电话那头传来了欢快的爵士乐。</p><p class="story-paragraph dialogue">「见面再说吧，知道了吗」</p><p class="story-paragraph">与拼命隐藏紧张情绪的我不同，旼炡的声音很平淡、干净。</p><p class="story-paragraph">靠墙站了好一会儿，一股冷空气朝身体席卷而来。即使喝了酒，身上的体温依旧不足以抵挡寒夜。知珉突然听见脚步声，把头转向巷口，不自觉张开嘴，含着夜晚的空气。</p><p class="story-paragraph">在昏暗的小巷内，鹅黄色的路灯照映着那个人。眼前呼吸平稳的旼炡像个陌生人。身穿干净利落的黑色短大衣，与之相配的贝雷帽，搭配有跟的鞋子。似乎是对鞋子不太习惯，步伐稍微慢了些。她那每天戴着毛帽乱糟糟的头发，现在正柔顺地盖过肩头。心情非常奇怪。</p><p class="story-paragraph">知珉接着将视线转移至旼炡脸上。比平时稍长的睫毛和深邃的眼眸，给人稍微成熟的印象。至少已经没有之前那个学生样了。刚习惯了480px、不240px的画质，现在旼炡的脸庞又变得清晰明确，显得特别没有实感。如果早点面对这种高清画面，也许就不会那么兴高采烈地嘲弄她了。</p><p class="story-paragraph dialogue">「干嘛这么盯着我看？」</p><p class="story-paragraph dialogue">「看到你吓了一跳」</p><p class="story-paragraph dialogue">「怎么了？吓什么啊？」</p><p class="story-paragraph dialogue">「…旼炡真是打扮得很漂亮去玩啊，还化了之前没化过的妆」</p><p class="story-paragraph">旼炡在感到害羞时会出现的几种行为。无缘无故地挠挠头，摆摆手。但不知是不是今天戴了贝雷帽，本来想伸到头顶上的手无处安放，再次尴尬地垂下。像个笨拙的机器人般，动作相当可爱。</p><p class="story-paragraph dialogue">「是因为要约会，所以今天才这么穿的吗？」</p><p class="story-paragraph dialogue">「…我那有什么约会？」</p><p class="story-paragraph dialogue">「就是约会啊，明明平时根本不这样穿」</p><p class="story-paragraph dialogue">「不是那样的，去爵士酒吧总不能穿着连帽上衣吧」</p><p class="story-paragraph">我当然知道，但重点不是那个啊。明明可以穿得这么漂亮，但是和我走在一起的时候，衣服就像在东大门批发的一样，每次都是格子衬衫配上你爱得要死的卫衣。在逛街的时候，苦口婆心地劝你试穿漂亮衣服，又看都不看一眼。</p><p class="story-paragraph dialogue">「…但是那些人呢？」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「说要跟姐姐一起去喝酒的人，在哪里啊？」</p><p class="story-paragraph dialogue">「啊 那个…其实是骗你的」</p><p class="story-paragraph dialogue">「…什么？」</p><p class="story-paragraph dialogue">「跟你打电话的时候，早就拒绝了」</p><p class="story-paragraph">什么？旼炡皱起眉头，眉间出现了可爱的皱摺。不知道是不是这才理解了情况，几秒钟内表情变得像漫画一样生动逗趣。什么呀，我都到这里来接你了…又不是把人当傻瓜。嘟囔的嘴上很是不满。</p><p class="story-paragraph dialogue">「为什么说谎？」</p><p class="story-paragraph dialogue">「想看到你这幅表情」</p><p class="story-paragraph dialogue">「什么意思？早知如此…」</p><p class="story-paragraph dialogue">「就不来了？」</p><p class="story-paragraph dialogue">「不是那样的」</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「都到这里来了，你想说的话就是这些吗？」</p><p class="story-paragraph">你不是有话要对我说吗。对此，旼炡似乎是感到为难，长叹了一口气。就像收到比自拍难100倍的作业一样，动了动手指，旼炡才赶紧用蚂蚁走路般的音量呢喃道。那时候，我对姐姐…</p><p class="story-paragraph dialogue">「听不见」</p><p class="story-paragraph dialogue">「就…想」</p><p class="story-paragraph dialogue">「不能再大声一点吗？」</p><p class="story-paragraph dialogue">「…那时就是想接吻，对姐姐」</p><p class="story-paragraph">金旼炡害羞时会出现两个习惯，一是回避视线，二是莫名盯着脚下看。可以说是平时为了给她拍照靠近时，经常出现的动作。虽然也不知道与她现在一边说那些话一边盯着脚下，有什么不同。旼炡的回答果然不尽如人意，但是严格来说，也并不令人惊讶。知珉抱着胳膊静静地等待旼炡抬头。</p><p class="story-paragraph dialogue">「所以，因为想亲，所以就亲了。就这样吗？」</p><p class="story-paragraph dialogue">「…首先是」</p><p class="story-paragraph dialogue">「首先？你这理由倒是说得简单」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「谁会想做就做？对认识没几天的人也是这样？」</p><p class="story-paragraph dialogue">「不是那样的。姐姐怎么不管我说什么，总想找茬啊？」</p><p class="story-paragraph dialogue">「你的话就是这个意思啊。仔细想想真的很好笑，哪有被打了耳光还继续靠过来的啊？你真的是，我如果狠下心来你可是会被告的」</p><p class="story-paragraph dialogue">「但你没有告我啊」</p><p class="story-paragraph dialogue">「也可能会改变决定，全看你今天怎么做」</p><p class="story-paragraph dialogue">「但是姐姐，等一下」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「…你站在这里多久了？」</p><p class="story-paragraph dialogue">「大概20分钟左右？没过多久」</p><p class="story-paragraph dialogue">「等了很久啊，明明不知道我什么时候会来，就不该盲目地在外面等的」</p><p class="story-paragraph dialogue">「你是在担心我吗？」</p><p class="story-paragraph">旼炡终于从脚下移开视线，抬起头露出脸。眼底满是柔情，好像在诉说什么似的。</p><p class="story-paragraph dialogue">「担心是…随时都在担心啊」</p><p class="story-paragraph dialogue">「随时？」</p><p class="story-paragraph dialogue">「…当然是一整天，傻瓜啊」</p><p class="story-paragraph">时隔许久的面对面交谈，在最后一句轻声呢喃后，旼炡再次回避了视线。几天前那样目不转睛盯着自己的金旼炡到底去了哪里呢？现在，映入眼帘的，是羞涩地不知所措的脸庞。但是，无论现在多么可爱的撒娇，时间也无法倒流。</p><p class="story-paragraph">没有你的这一天已经过去了。</p><p class="story-paragraph dialogue">「你一整天有在想我，还是没在想我…」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「那个我怎么知道？」</p><p class="story-paragraph dialogue">「现在不就在说嘛」</p><p class="story-paragraph dialogue">「…只有你对我表现出来，我才能知道啊」</p><p class="story-paragraph">知珉摇了摇头，朝旼炡张开双臂。其实从刚刚就想碰触她，但为了等待慢吞吞的金旼炡说出理由，一直在苦苦忍耐。现在已经忍不住了，想轻轻抱住眼前的小鸟宝宝。</p><p class="story-paragraph dialogue">「…怎么突然张开手臂？」</p><p class="story-paragraph dialogue">「过来，我冷」</p><p class="story-paragraph dialogue">「是啊，早上就让你穿我的外套出去的。这种天气穿一件夹克出门，是吃错药了吗？」</p><p class="story-paragraph dialogue">「…都说冷了，旼炡啊快过来」</p><p class="story-paragraph">旼炡犹豫着走过来，进到双臂之中。知珉对两人之间剩下的空隙不太满意，弯下肩膀紧紧与旼炡贴近。一整天一直思念的拥抱，纤细的身躯和温暖的体温，让努力镇定下来的心再次飘扬。和平时一样又小、又可爱、又温暖的金旼炡，今天打扮得格外漂亮，说话温柔，总是吸引自己目光的金旼炡。知珉环抱的手不自觉加大力度。</p><p class="story-paragraph dialogue">「我的保暖贴好暖啊」</p><p class="story-paragraph dialogue">「…是姐姐的身体太凉了吧」</p><p class="story-paragraph dialogue">「我身子很冷，所以不想碰吗？」</p><p class="story-paragraph dialogue">「…不是」</p><p class="story-paragraph">旼炡轻轻摇了摇头。就这样将她一动不动地抱在怀里，过了好一阵子。几次呼吸过后，右肩渐渐变得暖和起来。但没多久，旼炡便小心翼翼地推了推肩膀，把自己的身体移开。</p><p class="story-paragraph dialogue">「…怎么了？」</p><p class="story-paragraph dialogue">「要一直这样待着吗？这样下去姐姐好像要感冒了」</p><p class="story-paragraph">太冷了，先找个室内再聊吧。独自匆忙转身的旼炡整理着大衣，见她正要离开，知珉赶紧拽住旼炡的手腕。</p><p class="story-paragraph dialogue">「你去哪里啊？」</p><p class="story-paragraph dialogue">「太冷了，找找能进到室内的地方吧」</p><p class="story-paragraph dialogue">「…你不要自己决定」</p><p class="story-paragraph dialogue">「姐姐，放一下手」</p><p class="story-paragraph dialogue">「我不放呢？」</p><p class="story-paragraph dialogue">「…让你先放开，我手腕疼」</p><p class="story-paragraph">知珉没有想乖乖听话，只是摆弄着旼炡的手腕。金旼炡的手又白又软，薄薄的手腕，纤细漂亮的手指，一个个都好漂亮。刚发起愣，旼炡就吵了起来，再一次生气了。知珉姐姐，没开玩笑是真的很疼，放开我。</p><p class="story-paragraph">只见她语气中带着呜咽，不能再使性子了。知珉抚弄着手腕的手重新将旼炡的胳膊拉近，接着把脸凑上，对着手腕哈气说。抱歉，很疼吗？对此，旼炡怒气冲冲瞪着兔子般圆圆的眼睛，摇了摇头。</p><p class="story-paragraph dialogue">「你在干什么啊？」</p><p class="story-paragraph dialogue">「你不是说疼吗？」</p><p class="story-paragraph dialogue">「那还不是因为姐姐很用力抓。现在是打一巴掌再给个糖吗？」</p><p class="story-paragraph dialogue">「那我再给你些糖，能原谅我吗？」</p><p class="story-paragraph">呼出暖气的嘴唇瞬间碰上白皙的手腕。知珉沿着骨节分明的手背移动，嘴唇对准了手指。每次嘴唇贴上时旼炡都会慌张地想把手抽回，但是这次知珉依然没有松手的打算。</p><p class="story-paragraph dialogue">「…这样的话，会沾上啊」</p><p class="story-paragraph">什么？原本装作不知道，但旼炡好像想让自己看个仔细，把手伸到眼前。纤细的手腕上沾着淡淡的口红印，这是几次亲吻的证据。知珉微微一笑，用手将颜色揉散。抱歉，可能是因为刚才补妆，结果沾上很多呢。</p><p class="story-paragraph">那一瞬间，旼炡向后退了一步。只是背后正是一道墙，没有更多退路。旼炡背靠在墙，声音颤抖着说。</p><p class="story-paragraph dialogue">「姐姐今天有点奇怪」</p><p class="story-paragraph dialogue">「…我吗？」</p><p class="story-paragraph dialogue">「嗯，今天特别奇怪。本来不会这样的吧，是因为醉了吗？刚才不是说没喝多少吗？」</p><p class="story-paragraph dialogue">「不奇怪的时候…是什么时候，是怎么样？」</p><p class="story-paragraph dialogue">「很容易吓到，慌慌张张的，还把包都丢了。整天想着别的事情，如果向你搭话才会回过神来」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「到昨天为止，一直是这样的。不要以为假装不知道就可以抵赖」</p><p class="story-paragraph dialogue">「那有什么，这只是基于事实的说明啊，我不会抵赖的」</p><p class="story-paragraph dialogue">「你承认吗？」</p><p class="story-paragraph dialogue">「是啊，我承认。但是你为什么一直在躲我，你要后退到哪里去？」</p><p class="story-paragraph dialogue">「…有点害怕，今天」</p><p class="story-paragraph dialogue">「害怕吗？」</p><p class="story-paragraph dialogue">「嗯，姐姐简直像另一个人」</p><p class="story-paragraph">遇见你之后我的每天都过得不同</p><p class="story-paragraph">但是你现在才说对陌生的我感到害怕的话——</p><p class="story-paragraph">我该怎么回答才好呢。</p><p class="story-paragraph dialogue">「说不定我就是别人」</p><p class="story-paragraph dialogue">「…你说什么？」</p><p class="story-paragraph dialogue">「金旼炡记忆中的刘知珉，可能去哪玩了会儿吧」</p><p class="story-paragraph dialogue">「…爱说些奇怪的话这点看来还是一样」</p><p class="story-paragraph">不过，今天怎么总是做出截然不同的行动呢。旼炡的小嘴唇有些慌乱似地一张一合。从刚才开始，旼炡每回答一句话、手上每做一个小动作，就往后退一步，现已退无可退。</p><p class="story-paragraph">虽然每做点什么都结结巴巴的样子，像个傻瓜一样可爱。也不想想，几天前莽撞地强行贴上嘴唇的是谁。不是我而是金旼炡，你现在才像另一个人吧？到底是真笨，还是在演戏？甚至怀疑是不是被鬼迷心窍了。明明打电话的时候还特别紧张，但真正面对你之后，莫名就变得不害羞了。偏偏今天穿得这么漂亮，还语带哽咽说“担心了一整天，傻瓜啊”。都说了这种话，还要我怎么忍？</p><p class="story-paragraph">做了那些之前没做过的事，让人心绪波动的，不就是你嘛。</p><p class="story-paragraph dialogue">「仔细想想，就是你把我变成这样的」</p><p class="story-paragraph dialogue">「我吗？」</p><p class="story-paragraph dialogue">「等啊等的，等不到回应…」</p><p class="story-paragraph dialogue">「到底是想说什么」</p><p class="story-paragraph">知珉没有回答，又向旼炡迈进一步，踌躇的旼炡背已经完全靠墙。虽然前面说过的样子都很可爱，但最喜欢的还是把头抬起，眼睛滴熘熘转动的表情。就像现在，反正不管如何转动眼珠，都会和身高更高一些的我四目相接。</p><p class="story-paragraph dialogue">「如果我放开这只手，你会怎么做？会逃跑吗？」</p><p class="story-paragraph dialogue">「我为什么要逃跑？」</p><p class="story-paragraph dialogue">「你是不是又会装没事，什么都不做？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「如果在这里躲开我的话，旼炡啊」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「我们之间应该就什么都不是了吧。对吗？」</p><p class="story-paragraph">我也害怕。</p><p class="story-paragraph">早上一起床，你不在眼前的时候、一整天都没有联系的时候、但是一接到电话就高兴不起来时也是、像这样用陌生的视线看着我时、现在对你说我们之间什么都不是时，其实全都很害怕。</p><p class="story-paragraph">但还是很高兴你能来找我。</p><p class="story-paragraph">今天光这点就足够了吧？</p><p class="story-paragraph dialogue">「…姐姐是不是太不信任我了？」</p><p class="story-paragraph dialogue">「嗯，我不信。」</p><p class="story-paragraph dialogue">「真是太过分了」</p><p class="story-paragraph dialogue">「过分也没办法」</p><p class="story-paragraph dialogue">「…真是的，刘知珉。嘴上功夫倒是一次都不认输啊」</p><p class="story-paragraph dialogue">「为什么认为我会输给你？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「…虽然很抱歉但你今天跳不掉了，旼炡啊」</p><p class="story-paragraph">等一下、姐姐。急切的话语还没说完，知珉就低下头慢慢地张开嘴。旼炡无处安放的双手最终安顿在知珉的腰间。这个吻，就像是对期待已久的彼此，简短的问候。</p><p class="story-paragraph">今天初次相接的嘴唇分开后，相互对视的目光慢慢移向嘴唇，接着对上她娇羞不已的双眸。独自泛红的脸庞，可爱至极。知珉再次靠近的瞬间，旼炡急切地搭话。等一下。</p><p class="story-paragraph dialogue">「…又怎么了？」</p><p class="story-paragraph dialogue">「我、帽子…」</p><p class="story-paragraph">原来，头上轻轻戴着的贝雷帽，好像要掉了。知珉抓住总想乱动的旼炡，拿起贝雷帽。把乱糟糟的刘海撩到耳后，轻轻地抚上旼炡的左脸。现在行了吧？旼炡害羞地点点头。鹅黄的路灯下，嘴唇看起来比刚才稍微肿胀了些。知珉轻抚了几下她的左脸，旼炡看来心情很好，脸颊靠在手掌上闭着眼。在脸颊一点点泛起热气时，眼皮张开，长长的睫毛轻颤。</p><p class="story-paragraph">相视的两人像是按耐不住，再次缠上彼此。今天和几天前不同，没有再撞到头。就像同床共枕了几个晚上，亲吻对方时，头该侧向哪一边，现在即使不说也有了共识。然而，过于着急的两人，鼻尖还是轻轻的撞上。知珉在可爱地小擦撞之后，虽然想笑，但更想继续与旼炡相接，所以把脸贴得更近。</p><p class="story-paragraph">接吻持续了一段时间，结束后旼炡喜欢在嘴唇上轻快地挑弄。如果想再缠上舌头的话，就不会对视，而是用手紧紧抓住知珉的衣服。如孩子一般直接的表达，实在非常可爱。</p><p class="story-paragraph">每当相贴的双唇短暂分开时，夜晚的冷空气总是趁虚而入，激动地喘气的旼炡口中呼出白色烟雾。直到知珉的手碰到冰冷的墙壁，才突然开始担心。还是像刚才说的，去暖和点的地方比较好吧，她的背靠在墙上好一阵子了。知珉这才松开纠缠的嘴唇，问旼炡没关系吗？不冷吗？</p><p class="story-paragraph dialogue">「其他地方不冷。但是…」</p><p class="story-paragraph dialogue">「但是？」</p><p class="story-paragraph dialogue">「手有点凉」</p><p class="story-paragraph dialogue">「那你要环住我的脖子吗？」</p><p class="story-paragraph dialogue">「那样没关系吗？我的手很凉的…」</p><p class="story-paragraph dialogue">「没关系」</p><p class="story-paragraph">虽然被冰凉的手缠上脖子，微微起了鸡皮疙瘩，但冻僵的手指放在颈部，很快就被热度融化了。不知道旼炡是不是因温暖的触感而心情变好，开始呢喃着。脖子后面好烫啊，姐姐。为什么这么烫？不怕冷果然是有原因的吧。</p><p class="story-paragraph dialogue">「但平时是不会这么烫的」</p><p class="story-paragraph dialogue">「那现在怎么这么烫？」</p><p class="story-paragraph dialogue">「…你还要装作不知道吗？」</p><p class="story-paragraph dialogue">「什么？说得好像我常装作不知道似的」</p><p class="story-paragraph dialogue">「…没什么，傻瓜啊」</p><p class="story-paragraph dialogue">「但是、姐姐」</p><p class="story-paragraph dialogue">「怎么了？」</p><p class="story-paragraph dialogue">「…再一次」</p><p class="story-paragraph dialogue">「…嗯？」</p><p class="story-paragraph dialogue">「再来做一次」</p><p class="story-paragraph">抿着嘴边说边笑的脸太过可爱，忍不住噗嗤笑了起来。这种撒娇到底是从哪学来的呢？脖颈处环绕的手也渐渐施力，随着这让人心情好的压迫感，知珉紧紧地搂住旼炡的腰，接受她靠近的嘴唇。</p><p class="story-paragraph">在夜间列车上第一次接吻后，仅仅过了两天，就又变成这样的局面，而且是口干舌燥有来有往地相互接吻，是两个人都没想到的事情。但事情还是发生了，已经慎重地确认了对方的心意，以今天为起点，两人之间幼稚的眼力游戏，再次打成平局。</p><p class="story-paragraph">从那之后又过了多久呢？连路灯都熄灭了，两人在漆黑的夜晚就这么牵着手散步。如果牵住的手变冷，就会将旼炡的手放入夹克口袋，将它温暖起来再拿出，就这么反复着。明明有预约好的宿舍，但两人硬是在周围徘徊了好几圈，直到凌晨才筋疲力尽地回去了。</p><p class="story-paragraph">旼炡小心翼翼地打开房门，以免发出声响。桌子上亮着橘黄色的照明灯，一旁还放着一张便条，而理查德的床已经清空了。</p><p class="story-paragraph dialogue">「…嗯？好像已经走了」</p><p class="story-paragraph">有些虚脱。本来就是为了不被妨碍，才在外熬了一夜，结果宿舍却空空如也。早知道这样就早点回来了。那么大概——</p><p class="story-paragraph">不是、不是的，现在还不要想那么多。知珉莫名咽了下口水，润了润干燥的嗓子问道。留了纸条了吗？说什么？旼炡晃着纸条说。他说没能打招呼就走了，真可惜，还说冰箱里放了好吃的，让我们早上吃吧。</p><p class="story-paragraph dialogue">「…好吃的？」</p><p class="story-paragraph">冰箱里装着的好像在超市买的肉丸。偏偏挑了自己晚饭吃过的菜，果然，作为室友的这个男人，明显和知珉相性不合。</p><p class="story-paragraph dialogue">「现在饿了的话要吃吗？几小时后就是姐姐吃早饭的时间了」</p><p class="story-paragraph dialogue">「连续两餐吃肉丸有点…腻了」</p><p class="story-paragraph dialogue">「那一会儿起来吃吧？」</p><p class="story-paragraph dialogue">「其实不饿，现在倒是困得快要晕过去了」</p><p class="story-paragraph dialogue">「…我也是」</p><p class="story-paragraph">两人默默地躺在床上，现在大概是凌晨5点，不，快6点了。这个时间点如果醒着，就会随着模糊的意识出现胡言乱语。</p><p class="story-paragraph dialogue">「…有点像梦一样」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「今天见到姐姐后发生的一切」</p><p class="story-paragraph dialogue">「这不是梦」</p><p class="story-paragraph dialogue">「我知道」</p><p class="story-paragraph dialogue">「但如果正如你所说，是做梦怎么办？」</p><p class="story-paragraph dialogue">「我只是说说而已。不要说那种可怕的话，趁太阳升起之前快点睡觉吧。」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「…姐姐」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「…睡了吗？」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「什么呀，真是的。话说到一半就睡着了」</p><p class="story-paragraph">旼炡对不到3秒就失去意识的知珉感到神奇，呆呆地看着她。帮她盖上被子后，紧贴在身旁的旼炡，也很快就阖上眼。斯德哥尔摩似乎在等待着她们，两人入睡不久，就出现了微熹的晨光。</p><p class="story-paragraph">由于天亮前在外头不停走动，两人第一次在午餐时间才睁开眼睛。知珉在床上一边做伸展运动，一边预估剩下的时间。太阳升起的时间只剩三四个小时，今天下午怎么度过才好呢。旼炡在一旁睁着浮肿的眼睛吹头发。明明自己才是喝酒的那个，结果没喝酒的人看起来更没精神。</p><p class="story-paragraph dialogue">「…姐姐看起来挺好的啊」</p><p class="story-paragraph dialogue">「怎么了，你很累吗？」</p><p class="story-paragraph dialogue">「可能是因为很久没有逛到凌晨了，完全放电」</p><p class="story-paragraph dialogue">「你体力那么差，剩下的旅行该怎么办？」</p><p class="story-paragraph dialogue">「难道是因为整个假期都没有运动，一直呆在屋子里吗？」</p><p class="story-paragraph dialogue">「运动是一个问题，但主要你太常不好好吃饭，总的来说都是问题。」</p><p class="story-paragraph dialogue">「…我真的算体力很弱的吗？」</p><p class="story-paragraph dialogue">「你看看你胳膊也太细了，腰也一把能握住，感觉手指一碰就会倒下」</p><p class="story-paragraph dialogue">「又不是纸片，才没到那种程度」</p><p class="story-paragraph">嗯嗯，金纸片小姐这么说。面对捉弄般地嘲讽，旼炡就盯着这边看，一个人发起牢骚。</p><p class="story-paragraph dialogue">「昨天还把像纸片的人推到墙上」</p><p class="story-paragraph dialogue">「那个…就」</p><p class="story-paragraph">知珉为了避免在夹缝中被攻击，故意假装更认真做伸展运动，向上伸展着胳膊。</p><p class="story-paragraph dialogue">「所以今天的计划是什么？你不是说今天也要一个人旅行吗」</p><p class="story-paragraph dialogue">「你还记得那句话啊，现在要说这个？还在生气吗？」</p><p class="story-paragraph dialogue">「没有生气啊，只是问你的计划哦？」</p><p class="story-paragraph dialogue">「今天我的计划是和你一起出门哦？」</p><p class="story-paragraph dialogue">「我不会告诉你要去哪里哦」</p><p class="story-paragraph dialogue">「那就偷偷跟着呗。昨天你不在，有点无聊」</p><p class="story-paragraph dialogue">「…知道了，谁让姐姐一直哀求我，所以今天我陪你一起吧」</p><p class="story-paragraph">用放你一马的口气说话真是可爱。起床的知珉走向旼炡拱地圆圆的背后。用手指轻轻一碰她的背，便听见她“怎么了”接着回头看自己。像牛奶一样白皙的脸庞，微红的眼睛，上面披着湿漉的头发。知珉轻轻拍了拍散落着发丝的纤细肩膀，像哼歌一般说道。旼炡啊，你今天要穿什么出去？</p><p class="story-paragraph dialogue">「…穿什么好呢？」</p><p class="story-paragraph dialogue">「能不能再穿昨天那套衣服？」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「因为我喜欢你戴贝雷帽，所以今天也想看你那么穿」</p><p class="story-paragraph">旼炡一听便极力摆手。虽然还不知道今天要去哪，但不是要去什么有格调的地方。而且皮鞋也高，不怎么方便。</p><p class="story-paragraph dialogue">「我都这样求你了，再穿一次吧」</p><p class="story-paragraph dialogue">「姐姐现在连我的衣着都要决定了吗？」</p><p class="story-paragraph dialogue">「你戴那个的时候真的超级可爱」</p><p class="story-paragraph dialogue">「…又不是什么玩偶」</p><p class="story-paragraph">对了，昨天有个想给你的东西，等一下。知珉想起被遗忘的东西，啪啪拍了两下手奔向衣柜，并立即将翻找了一阵子才找到的东西交到旼炡手上。比手链稍微大一点的，像黑线一样的东西。从旼炡的表情看来，是无论如何想不到那是什么。</p><p class="story-paragraph dialogue">「…这是什么？」</p><p class="story-paragraph dialogue">「不知道吗？是颈链啊，戴在脖子上的」</p><p class="story-paragraph dialogue">「姐姐...你竟然带着这种奇怪的项圈吗？」</p><p class="story-paragraph dialogue">「昨天看到你戴的帽子后，就觉得应该很适合你，要试试吗？」</p><p class="story-paragraph dialogue">「不要，不戴」</p><p class="story-paragraph">知珉无视了想逃跑的旼炡，让她坐在地上，勉强在脖子上戴上了黑色颈链，然后对着镜子。怎么样？不错吧？知珉满脸期待地问道。可能是觉得陌生，也许是佩戴起来不太舒服，旼炡皱眉看着镜中自己戴上颈链的模样。就像穿着不舒服的衣服，发出呼噜声的小狗一样。</p><p class="story-paragraph dialogue">「给我拿掉吧，真郁闷」</p><p class="story-paragraph dialogue">「只有今天戴着不行吗？就今天一天」</p><p class="story-paragraph dialogue">「我…这个真的真的忍不了的」</p><p class="story-paragraph dialogue">「为什么，和黑色帽子颜色都很搭，很漂亮的，还能防止丢失」</p><p class="story-paragraph dialogue">「防止丢失？」</p><p class="story-paragraph dialogue">「可以标示这是有主人的狗」</p><p class="story-paragraph dialogue">「…你说什么？」</p><p class="story-paragraph">旼炡看着在一旁笑咪咪的知珉，也跟着无语地笑了。</p><p class="story-paragraph dialogue">「从昨天之后怎么变得这么厚脸皮啊 ，知珉姐姐」</p><p class="story-paragraph dialogue">「不要倔脾气了，一定要戴着出去哦，乖乖等姐姐洗完澡出来」</p><p class="story-paragraph">什么呀，真是的。不顾嘟嘟囔囔的旼炡，知珉直接进了浴室。一切准备完毕后，虽然室友依旧抱怨连连，还是乖乖地戴上被强迫与贝雷帽搭配的颈链，站在门口。对漂亮的打扮感到满足的知珉，不停说她可爱，还接连拍了几张照片。</p><p class="story-paragraph">接续昨天凌晨，从今天开始，两人自然而然地牵着手出发了。</p><p class="story-paragraph">从住处一路往北，就能看到由公路连接的巨大岛屿。这是被称为斯德哥尔摩老城(Gamla Stan)的地区。类似首尔的北村或仁寺洞，有着充满传统氛围的商店街，是斯德哥尔摩的旅游胜地。听说规模不大，步行两个小时就能看完，考虑到旼炡的体力，今天决定只在这附近逛逛。</p><p class="story-paragraph">在通过前往旧城区的桥之前，旼炡指向右侧的一栋建筑说。姐姐，看那边，好像是瞭望台。从旼炡所指的方向看去，一栋建筑物在空中延伸出长长的桥，有个大概6-7层楼高的瞭望台。虽然不高，但看起来像是这里的地标。瞭望台附近的广场上还摆起了餐车。</p><p class="story-paragraph dialogue">「去那边看看，顺便解决午饭怎么样？」</p><p class="story-paragraph dialogue">「好」</p><p class="story-paragraph">两人呆站在餐车前，一副看不懂菜单的模样，等不及的主厨叔叔直接帮忙选了个招牌菜。从周围散发的气味来看，果不其然是卖海鲜的地方。知珉搜索了招牌上大大的“strömming”，很快查出了其真实身份。是一种名叫鲱鱼的鱼类，其味道无法预料。发酵的鲱鱼味道比较浓，对来到瑞典的游客来说，是在喜好上具有分歧的食物。如果一定要比较的话，就像在韩国也分成吃斑鳐和不吃的人。</p><p class="story-paragraph dialogue">「虽然是三明治…但没有上层面包呢，小心别撒了」</p><p class="story-paragraph dialogue">「这个味道真不是闹着玩的，这可以吃吗？」</p><p class="story-paragraph">无论如何，毕竟是北欧地区的招牌菜，手上的鲱鱼三明治，对知珉来说味道并不差。相反，从闻到味道开始就难以接受的旼炡，则皱着眉头表示实在是太腥了，吃不下去。</p><p class="story-paragraph dialogue">「有到那种程度吗？我没问题啊」</p><p class="story-paragraph dialogue">「你开玩笑的吧，吃完不要靠近我」</p><p class="story-paragraph">旼炡这话不说也罢，说出来就是找打。正好吃了一大口的知珉，稍微拍了旼炡的肩膀。虽然只是轻轻打了一下，还是发出了啪的声音。好疼！为什么打人这么痛？力气怎么这么大？啪，接着也给了另一边肩膀惩罚，这才让她乖乖闭嘴。</p><p class="story-paragraph dialogue">「因为是今天第一餐，所以讨厌也得吃一半。毕竟早餐也跳过了」</p><p class="story-paragraph dialogue">「但一点都不好吃啊」</p><p class="story-paragraph">那也得全部吃掉，不要剩下。坚决地说完，旼炡愁眉苦脸，把鲱鱼三明治塞进嘴里。虽然本人很痛苦，但表情实在太可爱了，不能错过。知珉打开相机，对焦在脸颊中全是讨厌的食物的旼炡身上。</p><p class="story-paragraph dialogue">「干嘛拍这个？」</p><p class="story-paragraph dialogue">「我是为了拍了三明治」</p><p class="story-paragraph dialogue">「但是为什么笑得那么开心，仔细想想，你好像喜欢在表情很奇怪的时候拍照」</p><p class="story-paragraph dialogue">「是因为可爱才拍的，可以了吗？」</p><p class="story-paragraph dialogue">「…其实我也拍了很多照片哦？」</p><p class="story-paragraph">这是什么意思？对这事不能一笑置之，知珉一脸严肃盯着旼炡。眼前有一只小狗摆出在捣蛋时被发现了的表情。哎呀对了！虽然看起来想转移话题，但为时已晚。</p><p class="story-paragraph dialogue">「什么照片？」</p><p class="story-paragraph dialogue">「就是姐姐搞笑的照片」</p><p class="story-paragraph dialogue">「什么时候拍的？」</p><p class="story-paragraph dialogue">「睡觉的时候也有拍...嗯就，一有空就拍」</p><p class="story-paragraph dialogue">「把手机给我」</p><p class="story-paragraph dialogue">「我才不给呢」</p><p class="story-paragraph">结果旼炡被打了3次后背，才肯乖乖地拿出手机。与自己担心的不同，虽被说是奇怪的照片，也只是累地打瞌睡的画面。虽然心里怀疑这些是不是全部，但总之、遭到突击检查的旼炡，以心痛的表情接过自己的手机，远远地眯着眼睛，彷彿要盯穿自己的脸。知珉向警惕主人的小狗伸出手，示意和解。</p><p class="story-paragraph dialogue">「…怎么了呢，不伸手吗？」</p><p class="story-paragraph">听到这句话，旼炡立刻过来把手牵在一起。两只手摇摇晃晃，开心地前后摆动。刚才的骚动就像不存在一样，两人再次紧贴在一起，漫步朝瞭望台入口走去。</p><p class="story-paragraph">眼前有块写着“Katarinahissen”的铁制招牌。可以到达瞭望台的hisen，也就是乘坐电梯的地方。因此，这里又被称为“卡塔琳娜瞭望台”。这里难得可以将斯德哥尔摩市内看得一览无遗。啊，卡特琳娜！知珉这样惊呼，接着拍了张空无一物的瞭望台通道，走在前头的旼炡停下脚步回过头。</p><p class="story-paragraph dialogue">「…为什么要拍这个？」</p><p class="story-paragraph dialogue">「这是我的名字」</p><p class="story-paragraph dialogue">「姐姐的名字？」</p><p class="story-paragraph">知珉笑着将戴在食指上的墨珠戒指摊在旼炡面前。</p><p class="story-paragraph dialogue">「卡塔琳娜，这是我的洗礼名」</p><p class="story-paragraph dialogue">「…这个戒指是做什么？」</p><p class="story-paragraph dialogue">「默珠戒指，祈祷时代替默珠转动」</p><p class="story-paragraph dialogue">「原来如此，我不知道你一直戴着它，原来和宗教有关」</p><p class="story-paragraph">聊着有关戒指的话题，两人来到了瞭望台上层。可能是因为天气冷，没人想到野外来，瞭望台十分安静。虽然不是超过100层的天空风景区，只是个简单的免费瞭望台，但依然将斯德哥尔摩全景尽收眼底。左侧是河对岸的市政厅，右侧似乎有个游乐场，高耸的游乐设施映入眼帘。下面是刚刚买东西的餐车，广场上站满了人。在欣赏风景时，大型游轮缓缓驶过河面。</p><p class="story-paragraph">真漂亮，差点错过了，还好有上来。知珉感叹地呢喃。旼炡胳膊靠在栏杆上，默默地扫视着风景，开启了话题。</p><p class="story-paragraph dialogue">「卡塔琳娜这个洗礼名，和姐姐很般配」</p><p class="story-paragraph dialogue">「我也很喜欢。旼炡啊，你的洗礼名…不对，你有宗教吗？」</p><p class="story-paragraph dialogue">「我家是佛教家庭。小时候还戴着念珠手链呢」</p><p class="story-paragraph">真是意外。知珉想象着小时候聪明伶俐的旼炡，去寺庙在佛祖面前参拜的模样。是啊，比起教会或教堂，旼炡更适合寺庙。知珉再次觉得旼炡和自己在很多方面完全相反。从外表和性格到穿衣风格，从口味到电影，从天气情况到今天刚知道的宗教。除了毕业于同一所高中之外，两人之间没有任何共同点。因此，每天了解一点彼此不同之处，成为知珉的小乐趣。</p><p class="story-paragraph dialogue">「听说我们要去的小岛，中间有一座大教堂。去看看怎么样？」</p><p class="story-paragraph dialogue">「…突然？去教堂？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">但你又不是天主教徒。知珉本来想问，但最终没有说出口。旼炡看似脱口而出的话语中，总是充满柔情。明明本人似乎没什么兴趣，却对自己说“要去教堂看看”，就是让人感受细腻的关心和温暖。</p><p class="story-paragraph">虽然到这为止都很不错，气氛也很温馨，但是却有一点让知珉看不顺眼的地方。旼炡一直莫名地摆弄刚才给她戴上的颈链。明明那么漂亮的耳环和颈链，被她不停地摸来摸去，看的人都烦了。如果没戴帽子出来的话，可能连旁边的头发也会挠个不停。为什么手闲不下来？</p><p class="story-paragraph dialogue">「旼炡啊，你两只手一直摸颈链…怎么不能好好放下吗？真的像小狗一样，把手放下来」</p><p class="story-paragraph dialogue">「…早上我不是说了这个不舒服吗」</p><p class="story-paragraph dialogue">「你这样整天摸的话，项圈会断的」</p><p class="story-paragraph dialogue">「…项圈？你现在是说项圈吗？我是什么狗吗？」</p><p class="story-paragraph dialogue">「因为是给我家小狗戴的，所以是项圈没问题吧？」</p><p class="story-paragraph dialogue">「…不要叫什么我家小狗」</p><p class="story-paragraph dialogue">「今天就是我家小狗没错啊」</p><p class="story-paragraph">来这边，快点。摸着她下巴下缘，旼炡好像略显不满，瞪了一眼。金旼炡一天到底会生气多少次？估计足足超过10次吧。</p><p class="story-paragraph dialogue">「总之，我刚刚说的教堂，要去还是不去」</p><p class="story-paragraph dialogue">「如果近的话，就去看看呗」</p><p class="story-paragraph dialogue">「…那就直接过去吧？」</p><p class="story-paragraph dialogue">「好。还有，旼炡啊」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph">知珉从背后轻轻拥抱旼炡，轻声耳语。谢谢你先跟姐姐说要一起去。</p><p class="story-paragraph">漂浮的云彩不知不觉间消失在天空的另一端，太阳从彩霞中展露光芒。城市的风景瞬间被温暖的阳光所照亮。最后，两人将这一风景深深收进眼底，朝下一个目的地走去。</p><p class="story-paragraph">越过桥到达当初的目的地——旧城区岛屿，没走多远就看到了斯德哥尔摩大教堂。教堂的名称叫“Storkyrkan”，总觉得古色古香。旼炡似乎怎么也记不下来，将名称反复问了几次。</p><p class="story-paragraph dialogue">「这里是斯图尔…什么来着？」</p><p class="story-paragraph dialogue">「斯图尔…等一下。斯图尔什卡恩」</p><p class="story-paragraph">总觉得这个名称好像只有在科幻电影中才会出现，其实直翻就是大教堂的意思。虽然很难读，但仔细一想，这些地名确实很简单。居然就是位于“古老的城市”的“大教堂”。</p><p class="story-paragraph dialogue">「姐姐也不太清楚吧？确定是这么读的吗？」</p><p class="story-paragraph dialogue">「在网上查的，不就说没错了吗？」</p><p class="story-paragraph">平白无故地指责了语带质疑的旼炡，知珉一边走进教堂入口。这座教堂内布置了像欧洲百年建筑那样经典的雕塑，轻柔的风琴声回荡在挑高的天花板。知珉喜欢这种只有在古老的教堂才能感受到的氛围。正当她像往常一样双手合十准备祈祷，旼炡突然探出头来问道。要在这里祈祷吧？</p><p class="story-paragraph dialogue">「不就是为了这个来的吗？」</p><p class="story-paragraph dialogue">「那在这里想一个合适的愿望，然后许愿吧。」</p><p class="story-paragraph dialogue">「…为什么？」</p><p class="story-paragraph dialogue">「听说看着极光许愿的话，一定会实现。所以啊，把最重要的愿望先保留下来」</p><p class="story-paragraph dialogue">「来教堂许愿？虽然你信佛教…但我是天主教徒啊？」</p><p class="story-paragraph dialogue">「今天就随便吧，信仰生活回韩国后再重新努力就行」</p><p class="story-paragraph">虽然从头到尾都太过牵强，但最后还是决定随便吧。适当的愿望，有什么是适当的呢？知珉一边转着墨珠戒指，一边思考。但越想越奇怪，完全没有什么适当的愿望。</p><p class="story-paragraph">不知为何，今天没有为了自己祈祷的心情。但不是天主教徒的旼炡正在旁边，非常认真地闭着眼睛祈祷。白皙的脸庞，纤长的睫毛垂下。不再忙里忙外摸着颈链，乖乖地戴在脖子上，看起来那么文静乖巧。知珉将她的侧影映在眼中，最后，还是硬着头皮许了一个适当的愿望。</p><p class="story-paragraph dialogue">「…都祈祷完了吗？」</p><p class="story-paragraph">一睁开眼睛，不知何时已经结束祷告的旼炡，就呆呆地望着自己。挽着手两人出了教堂。一转眼，红色的晚霞就变成了深蓝的夜。走在前面几步的旼炡兴奋地喊道。</p><p class="story-paragraph dialogue">「姐姐，你看天空」</p><p class="story-paragraph">抬起头的一刹那，鼻尖碰到了一个冰凉的雪花。在祈祷时，教堂建筑上慢慢下起了鹅毛大雪，地面逐渐被白色复盖。两人戴着帽子，迎着雪漫步。虽然昨天在斯德哥尔摩的街道上走了好一阵子，但与旼炡一起走在雪路上却很是新鲜。</p><p class="story-paragraph">这是在寒冷的冬天，迎来的今年第一场雪。</p><p class="story-paragraph dialogue">「旼炡啊，看下这边」</p><p class="story-paragraph">知珉想用相机拍下雪白的世界下旼炡的模样。因此，她找了个适宜的灯光，催促旼炡站在那里。面对持续了一整天的摄影师对姿势的要求，只听见模特儿抱怨说“好冷”。</p><p class="story-paragraph dialogue">「现在都拍完了吗？」</p><p class="story-paragraph dialogue">「还没，再等一会儿」</p><p class="story-paragraph">照片中的素颜非常可爱。今天，头戴黑色贝雷帽、身穿黑色外套的旼炡依然漂亮，背景也很完美。但奇怪的是，知珉对自己拍的照片并不满意。</p><p class="story-paragraph dialogue">「我想拍的东西好像都拍不进去」</p><p class="story-paragraph dialogue">「创作精神倒是很透彻呢，还想拍什么？」</p><p class="story-paragraph">是啊，我到底想拍什么呢。握着相机的知珉见旼炡依旧停在原地。姐姐快点，好冷啊。嘴角上满是呼出的白烟，脸上洋溢着微笑。知珉看到这样的旼炡，突然想到了。真可爱，再看一遍也惹人怜爱。</p><p class="story-paragraph">我是什么时候开始以这样的目光看待这个孩子的呢？</p><p class="story-paragraph">第一次动心是在什么时候呢？在飞机上第一次见面那天？那么，整天想着旼炡是什么时候呢？是生病时照顾她的那天吗？</p><p class="story-paragraph">那么接下来，无法控制地喜欢上呢，是第一次接吻的那天吗？还是在那之前呢？这颗心到底是从什么时候改变的，即使认真回想也无从知晓。但是像野火一样燃烧的心，从昨晚开始变得温暖的理由大概是——</p><p class="story-paragraph dialogue">「拍好了吗？怎么要花这么久」</p><p class="story-paragraph">听到远处传来的抱怨，知珉再次举起相机，将旼炡记录下来。希望每张相片上清晰的脸，都能像自己看到的那样动人。还有希望这一瞬间领悟到的自己的心意，也能一起永远珍藏在这刹那的照片之中。</p><p class="story-paragraph">咔嚓，随着相机快门，同时露出了满意的微笑。</p><p class="story-paragraph dialogue">「…现在都拍完了，我们走吧？」</p><p class="story-paragraph dialogue">「不过，姐姐刚才许了什么愿望？」</p><p class="story-paragraph dialogue">「你会告诉我吗？」</p><p class="story-paragraph dialogue">「我的现在还是秘密」</p><p class="story-paragraph">知珉不知道旼炡到底做了什么适当的祈祷，旼炡看来也不想告诉自己，只是闭着嘴露出调皮的表情。那也没关系，现在的心情就像要飞上云霄。</p><p class="story-paragraph">也许我能够永远记住今天的你。在瞭望台上一起看风景，在教堂祈祷的侧脸，还有现在白雪中，关于你的所有瞬间。</p><p class="story-paragraph dialogue">「…那我也不说」</p><p class="story-paragraph">雪原上突然出现的北极狐，</p><p class="story-paragraph">在我人生中差点就错过的金旼炡。</p><p class="story-paragraph">当旅行结束时，</p><p class="story-paragraph">我希望你能像现在这样笑着。</p><p class="story-paragraph">这算是适当的愿望吗？</p><p class="story-paragraph">还是连这个都是过分的愿望呢？</p><p class="story-paragraph">希望今天有谁能倾听这个祷告。</p></div>
      </section></template>
