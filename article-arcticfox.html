面仰视自己，有点...</p><p class="story-paragraph">危险吗？</p><p class="story-paragraph">这么喜欢她这副样子没问题吗。</p><p class="story-paragraph">看得愣神，旼炡不分青红皂白就朝自己打了一拳。把衣服都脱了还呆着干什么呢？到了这时候还在想别的事情吗？</p><p class="story-paragraph dialogue">「没有，只是正在观察金旼炡」</p><p class="story-paragraph dialogue">「不要说些奇怪的话」</p><p class="story-paragraph dialogue">「因为是第一次，所以想看得更仔细」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「远比想象中还要漂亮」</p><p class="story-paragraph dialogue">「我的身体要被盯穿了...能关一下台灯吗？」</p><p class="story-paragraph dialogue">「不要」</p><p class="story-paragraph">旼炡的身体和脸差不多，都充满了曲线。虽然个子不矮，但骨架看起来却很小，也许是由于圆滑的消瘦肩线。直到现在才发现，在规律地上下起伏的胸部中间，有一点非常明显的印记。</p><p class="story-paragraph">好可爱。知珉用手指按住她白皙皮肤上显眼的黑点，轻轻地吻了一下。</p><p class="story-paragraph dialogue">「干什么呢？」</p><p class="story-paragraph dialogue">「还不是学你的嘛，从亲吻痣开始」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">就在几天前，还以为永远见不到的金旼炡。飞来伦敦后莽撞地告白、硬要一起坐天轮的金旼炡。现在，金旼炡则在自己身下眨巴着眼睛、像一只乖巧的小狗一样，等待着触碰。终于可以毫无顾忌地、给予金旼炡完整的爱。</p><p class="story-paragraph">此刻心情难以形容。想把这个样子全收进眼底，同时也想尽快拥抱她。关于旼炡的一切，全都想一一了解。一想到即将面对只有自己才能看到的那副模样，就产生了奇妙的优越感。</p><p class="story-paragraph">对一个人的爱情，可以分为几个阶段呢？虽然仍然不知道哪一瞬间开始，对旼炡从单纯的好感转变为爱情，但现在不断涌现的情感或许——</p><p class="story-paragraph">或许是，在接近占有欲和痴迷两者之间的界限。</p><p class="story-paragraph dialogue">「在想什么...？」</p><p class="story-paragraph">细嫩的手抚摸上脸的瞬间，脑海中的想法终于停止。抱歉，不会再想其他事了。</p><p class="story-paragraph">俯下上半身交叠，旼炡小声轻叹了一口气。她的手摸索着背上每处肌肉，搔痒难耐。想尽一切办法，为了表达刚才感受到的那些模糊情感，但张口却只喊出了她的名字。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「嗯...」</p><p class="story-paragraph dialogue">「金旼炡」</p><p class="story-paragraph dialogue">「怎么了...」</p><p class="story-paragraph dialogue">「没什么」</p><p class="story-paragraph dialogue">「什么呀？」</p><p class="story-paragraph dialogue">「不知道怎么说，我好像被迷住了」</p><p class="story-paragraph dialogue">「被我？」</p><p class="story-paragraph dialogue">「嗯...」</p><p class="story-paragraph">旼炡好像认为这句话是玩笑似的，笑得很开心。什么啊，突然告白？</p><p class="story-paragraph dialogue">「我喜欢你」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「穿着衣服也好脱掉也好」</p><p class="story-paragraph dialogue">「...如果不加这句话就好了」</p><p class="story-paragraph dialogue">「你的一切都喜欢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我还不了解的部分也是」</p><p class="story-paragraph">嘴角挂着的调皮微笑变得含糊。向上抬起的两只胳膊轻触到脸庞。她那像捂着脸颊般抚摸的手特别可爱，两人身体更加贴近。</p><p class="story-paragraph dialogue">「我喜欢姐姐的声音」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不说话的时候也很喜欢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但更喜欢说话的时候」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「所以像刚才那样多叫我的名字吧」</p><p class="story-paragraph">很难再忍耐下去。</p><p class="story-paragraph">手刚碰到胸口，旼炡的颈部微微地抬起。轻柔地抚摸着那漂亮的曲线，握住后揉搓，凸起的部分渐渐变硬。把挺立的乳尖含进嘴里，舌头沿着轮廓一卷，就能听见她口中泄漏出轻薄的呻吟。</p><p class="story-paragraph">耳朵靠在左胸口，砰砰的心跳声令人心情愉悦。当自己趴在上面用牙齿精心制作印记时，旼炡皱起鼻子。有点疼...</p><p class="story-paragraph dialogue">「这程度还行吗？」</p><p class="story-paragraph dialogue">「不」</p><p class="story-paragraph dialogue">「那还是不要咬了？」</p><p class="story-paragraph dialogue">「不是...」</p><p class="story-paragraph">看来连自己在说什么都不知道了吧。</p><p class="story-paragraph">旼炡脸上不知不觉布满潮红。随着絮乱的呼吸，脉搏跳动得很快。用手摸索着凹陷的肋骨向下移动，感觉特别结实，让知珉吓了一跳。本以为她全身上下没什么肌肉，结果腹部摸得到鲜明的一字腹肌。</p><p class="story-paragraph">用舌头扫过全身，偶尔喊句旼炡啊，她声音很轻地“嗯、嗯”回答了两次。虽然这是秘密，比起强忍的声音，这样的回答更接近呻吟，所以特意又叫了好几次名字。</p><p class="story-paragraph">伸手想脱下骨盆上的内裤，突然听见一声急促的呼喊，等一下。怎么了？关掉床头灯吧。就算关了那个也不是看不到。反正把它关掉。</p><p class="story-paragraph">由于她不停闹，最终还是关掉了照明，但眼睛只用了不到几秒，就适应昏暗，把手伸向臀部脱下内裤时，还能清楚地看见转向一侧的脸。一刻都无法再放过，包含她一直蜷缩起的双腿。</p><p class="story-paragraph">没事的，没关系姐姐的眼睛太暗了看不清，真的看不清的。夸张地说着谎话哄她，好不容易才张开双腿，便把头伸进腿间。</p><p class="story-paragraph">看着眼前，不得不暂时停下动作搭话。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「你下面非常非常...」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph">因为实在太想捉弄你了。</p><p class="story-paragraph dialogue">「太神奇了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「刚刚随便摸了几下，什么时候变成这样了...」</p><p class="story-paragraph dialogue">「这样的感想不能只放在脑海吗？」</p><p class="story-paragraph dialogue">「你就那么喜欢我的声音吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「原来你的性癖是低音嗓啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「要是每次说话都这样，平时都不敢开口了」</p><p class="story-paragraph dialogue">「不要太夸张，才没到那种程度...」</p><p class="story-paragraph">不管怎样，以后想哄她消气时，这招好像可以当做必杀技，先记在脑中。看来想和金旼炡做的时候，低声说话就是最直接有效的。</p><p class="story-paragraph">逗弄了一回，现在把目光转向腹部底下。本来皮肤就特别白，大腿内侧更是像白纸一样，让人觉得很神奇。稍微用力的话，柔嫩的肌肤上就会留下清晰的牙印，既像弹力十足的海绵，又像白色的年糕...咬着她身体的每个角落，稍微让人分不清这到底是性欲还是食欲。</p><p class="story-paragraph dialogue">「现在是在往我全身涂口水吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「好黏啊」</p><p class="story-paragraph dialogue">「感觉不好吗？」</p><p class="story-paragraph dialogue">「不是...」</p><p class="story-paragraph dialogue">「那你别嘀咕了」</p><p class="story-paragraph">从膝盖上到腰间，嘴唇越是浅浅擦过每处，她的腿就越是弹动。故意不去触碰中间地带，只是在两边的大腿内侧和肚脐下边交替咬了很久。若有似无，但绝对不碰上。</p><p class="story-paragraph">也许是这才察觉到异常，旼炡抬起头，呆呆地看着下方。很高兴她终于上钩，知珉尽可能隐藏笑意，耸着肩膀装傻。怎么了？</p><p class="story-paragraph dialogue">「姐姐现在...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「是故意的吧」</p><p class="story-paragraph dialogue">「我不知道你在说什么」</p><p class="story-paragraph dialogue">「为什么只在周围转圈？」</p><p class="story-paragraph dialogue">「青蛙本来就是这样的」</p><p class="story-paragraph dialogue">「...怎么用这么卑鄙的手段报仇呢？」</p><p class="story-paragraph dialogue">「你也不删掉那段视频啊」</p><p class="story-paragraph">终于，在一次都没有刺激过的地方，亲亲似的贴上几次嘴唇，只见她好像急得不行似的，双膝微微弯曲，接着张开，可真是精彩。</p><p class="story-paragraph">唉呦，还真有意思，好满足。还开始自己动腰了呢，下面的床单都有点湿了，好色。</p><p class="story-paragraph dialogue">「...给我」</p><p class="story-paragraph">如果不是紧接着的轻吟，也许自己会更享受。</p><p class="story-paragraph dialogue">「别玩了...给我，快点」</p><p class="story-paragraph">仿佛要爆炸般发烧的脸上，终于忍不住露出了笑容。</p><p class="story-paragraph">再也忍不住了？</p><p class="story-paragraph">这次依旧没有回答，倒是干脆从空中踢来一脚。肩膀稍微被脚后跟敲了一下，反正一点都不疼、所以完全没有意义。</p><p class="story-paragraph">今天学到的教训，比起锻炼肌肉，复仇更有价值。千辛万苦爬上山顶时的成就感和征服心理，简直不可同日而语。好欣慰，知珉啊做得好，真优秀。</p><p class="story-paragraph">相反，光着身子躺在床上的小狗，几乎是哭丧着脸。在这种情况下，如果又开始想别的事情，下次她的脚可能会直接飞到脸上，所以必须停下来安慰安慰。</p><p class="story-paragraph">再稍微张开一点...</p><p class="story-paragraph">紧抓着大腿后侧，将她放松下来的双膝朝两侧打开。瞬间，旼炡闭上双眼深吸一口气。</p><p class="story-paragraph">在湿润的腿间，用力按压舌头上下扫开，全身上下都抖动得十分厉害。反复舔咬有反应的地方，原本放松的内侧不断紧缩。</p><p class="story-paragraph">在昏暗的环境中，呼吸声稍稍变得粗重，马上就能听得出来。承受不住的哀求一点点从嘴里泄漏。短暂的几句话一并流出。</p><p class="story-paragraph">好舒服...</p><p class="story-paragraph">但是压着太久会疼的。</p><p class="story-paragraph">虽然从微张的嘴中看到粉红色舌头，便有了想要接吻的欲望，但现在没有其他办法了。如果说还有一点遗憾，就是散乱的金黄色头发，遮住了那双眼睛。</p><p class="story-paragraph">虽然并未朝自己望过来，但如果自己的脸在旼炡的视线中，应该也是一团糟。越往内深入，鼻尖和脸颊越能感受到粘腻感。</p><p class="story-paragraph">把舌头深深地推进湿滑的下体，小肚子便鼓足了力气。背部向上挺起，能看见突出的骨盆。趁此机会直接将手伸入，把住腰部不断向下拉。</p><p class="story-paragraph">传来了点点的抽泣声。毫无缝隙紧密贴合的部位太过炙热。</p><p class="story-paragraph dialogue">「姐姐...」</p><p class="story-paragraph dialogue">「那里...太紧了...」</p><p class="story-paragraph dialogue">「等等...等一下...」</p><p class="story-paragraph">旼炡急切地喊了几声，赶紧用两只胳膊捂住眼睛。知珉并没有理会，在泛红的皮肤上，大口吮吸红肿的部位，手里握着的大腿微微颤抖。配合着越来越急促的呼吸，舌头不停抽插。</p><p class="story-paragraph dialogue">「姐姐、姐姐、姐姐...」</p><p class="story-paragraph">比刚才更加焦急的声音，断断续续地传了过来。或许是因为无法承受，旼炡的上身一下子扭向一侧，颈部向后翻折，能看见枕头被抓出许多折痕。持续压着腿，让双腿张得更开，身体开始不停剧烈颤抖。</p><p class="story-paragraph">眼睛已经完全熟悉了昏暗的灯光。直到嘴上力道一松，身体无力地瘫软在床垫上。</p><p class="story-paragraph">她依旧激动地蜷缩着背，平复呼吸的身躯显得格外娇小。知珉小心翼翼地来到她身旁，从后面抱住她并搭话。没事吧？</p><p class="story-paragraph">她的背部微微渗出汗水。虽然不期待马上得到答复，但眼睛无法对视有点可惜。想亲吻她涨红的脸颊，然而不但被制止，还挨了一巴掌。怎么动不动就打人呢，这次是为什么？</p><p class="story-paragraph dialogue">「把嘴上沾着的东西擦一擦再过来...」</p><p class="story-paragraph">啊。</p><p class="story-paragraph dialogue">「抱歉，我忘了」</p><p class="story-paragraph dialogue">「要不要去照照镜子？脸上真够瞧的」</p><p class="story-paragraph dialogue">「要不再给你做一次？反正都已经乱七八糟了」</p><p class="story-paragraph dialogue">「不要...现在就感觉快死了」</p><p class="story-paragraph dialogue">「舒服得要死吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「别光瞪我...」</p><p class="story-paragraph dialogue">「今天看起来特别开心啊」</p><p class="story-paragraph dialogue">「很明显吗？」</p><p class="story-paragraph dialogue">「一脸笑嘻嘻的样子让人很烦躁...」</p><p class="story-paragraph dialogue">「刚才几乎是一边哭一边缠着我，怎么回事呢？」</p><p class="story-paragraph dialogue">「吵死了，你下去吧」</p><p class="story-paragraph">你？</p><p class="story-paragraph">明明不久前还一直乖乖说敬语。</p><p class="story-paragraph dialogue">「躺下，快点」</p><p class="story-paragraph">旼炡出力拉住自己胳膊，知珉也温顺地将身体躺下。头刚靠在中间凹陷的枕头上，一只小狗就爬到身上来了。她伸出手将自己的头发扫到耳后，这一举动让人心情很好，就那样直接闭上了眼睛。</p><p class="story-paragraph">姐姐的耳朵圆圆的，像面疙瘩年糕一样，不搭。这有什么不搭的。旼炡摸了好一会儿耳朵，直接上嘴咬住拉拽。举动仍然像个不会说话的小孩一样。</p><p class="story-paragraph dialogue">「干嘛咬别人的耳朵？」</p><p class="story-paragraph dialogue">「有这耳朵有什么用？反正一点也不听话」</p><p class="story-paragraph">为什么又生气呢？明明刚才做得很有诚意，她也哼哼唧唧的好像很舒服的样子，到底做错了什么呢？趁着自己正在回想，一股热气窜进耳中。赶紧缩起脖子，只见旼炡噗哧地笑了起来。</p><p class="story-paragraph dialogue">「姐姐不但对噪音很敏感，连对这种也很敏感呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「以后要经常做了」</p><p class="story-paragraph dialogue">「...别太高兴」</p><p class="story-paragraph">慵懒的视线从上方扫视身体，让人感觉更加敏感。从脸部经过脖子，来到胸口。她的手伸向自己，不知不觉间咽下口水。旼炡触及的地方是脖颈。摆弄着圆型坠饰项链的链子，再次让人心跳加速，产生了想亲吻她细长指节的想法。</p><p class="story-paragraph dialogue">「脖子又长又细，戴短链也很适合呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但是刚接触到身体，感觉有点凉」</p><p class="story-paragraph dialogue">「抱歉」</p><p class="story-paragraph dialogue">「不是的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「把项链解开吧？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">当啷。随著链子掉落在桌上的声音，再次对视。抚摸着脸庞的手现在毫无阻碍顺着脖子下到锁骨。</p><p class="story-paragraph dialogue">「喜欢被这样摸吗？」</p><p class="story-paragraph dialogue">「喜欢...」</p><p class="story-paragraph">趁着手指来到唇边，将总是泛红的指尖，一个个放入嘴里嚼了嚼。</p><p class="story-paragraph dialogue">「做什么呢？」</p><p class="story-paragraph dialogue">「看到你手指红红的，一直很想尝尝看」</p><p class="story-paragraph dialogue">「好吃的话再多给你一点吧？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">旼炡无语地笑着伸出手。但是不可以太用力咬。小心翼翼地细细品尝起伸进嘴里的一根手指。她将视线固定在自己嘴角的双眼、以及红扑扑的脸蛋实在很可爱。</p><p class="story-paragraph dialogue">「我的手指是糖果吗？现在放开吧」</p><p class="story-paragraph">因为不能说话，所以用眼神代替了回答。不是你先伸进来的嘛。</p><p class="story-paragraph dialogue">「...感觉很奇怪。放开」</p><p class="story-paragraph">就说奇怪了。</p><p class="story-paragraph">玩到一半的玩具一下子从嘴里抽走，有点空虚。心情就像小猫突然失去踩奶的地方，呆呆地望着旼炡，却只受到“有什么好可惜的”指责般的目光。</p><p class="story-paragraph dialogue">「不过姐姐...」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「喜欢用嘴做吗？」</p><p class="story-paragraph dialogue">「也不是特别那样...」</p><p class="story-paragraph dialogue">「但感觉起来好像特别喜欢」</p><p class="story-paragraph dialogue">「因为你的身体像年糕一样柔乎乎，让人食欲大增...」</p><p class="story-paragraph dialogue">「...这句话听起来超级奇怪」</p><p class="story-paragraph dialogue">「但如果一定要选的话，还是面对面最好」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「像刚才那样的话，连表情都看不清楚」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「而且中间又不能接吻」</p><p class="story-paragraph dialogue">「刚才没能看著我的脸，觉得可惜吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph">一脸调皮的表情渐渐靠近。不知在想什么，总感觉那意味深长的微笑让人有些不安。</p><p class="story-paragraph dialogue">「那这次我来帮你实现愿望吧」</p><p class="story-paragraph">深埋进胸口，因为落下吻的嘴唇太过酥痒，不禁缩瑟起肩膀。气息所及之处都像被熨烫一般发热。她用双手轻轻拽着两侧乳头，这一举动让后脑勺的头发被折腾得乱七八糟，紧紧地搂住她消瘦的背部。两只胳膊马上用力蹭着自己的腰。</p><p class="story-paragraph">刺激的感觉使呼吸变得急促，但抚摸着腰部的右手毫不犹豫地向下移动。粗短的大拇指一摸到前方，周遭立刻全湿透了。比平时敏感得多吗。害羞不已只能闭上眼睛。</p><p class="story-paragraph dialogue">「你这里比嘴里热多了」</p><p class="story-paragraph dialogue">「干嘛说那种理所当然的话...」</p><p class="story-paragraph">手指稍微探入的瞬间，从口中流露出急促的呼吸。一点点疼痛很快就变成了快感。旼炡竖起指尖，处处挠痒，有时用手掌大面积揉搓，有时还用骨节猛力往内壁压。</p><p class="story-paragraph">过度的刺激让大脑变得一片空白，感官似乎也变得迟钝起来。</p><p class="story-paragraph">舒服是舒服，可对她莫名熟练的手法总有些烦躁。这些东西都是从哪里学的呢。还有不问自己疼不疼、不问舒不舒服，出于礼貌至少也该问一次吧，但她就只顾着追赶逼迫自己。然而最难以忍受的是，享受着自己每个反应、目不转睛注视着自己的那张脸。</p><p class="story-paragraph dialogue">「姐姐可没资格说对我说什么吧？」</p><p class="story-paragraph dialogue">「...别吵」</p><p class="story-paragraph">从下身传出的声音很让人羞耻，什么话都说不出口。两人四目相对，只见旼炡微微一笑，将脸推到了自己眼前。这样的情况下已经很难再承受更多，除了扭过头，实在别无他法。然而，无论自己躲到哪，她圆圆的脸颊都牢牢跟着。</p><p class="story-paragraph dialogue">「为什么一直躲我？」</p><p class="story-paragraph dialogue">「走开点」</p><p class="story-paragraph dialogue">「太过分了...」</p><p class="story-paragraph dialogue">「你现在是故意弄出声音的吧」</p><p class="story-paragraph dialogue">「都是因为出了很多水才会这样，哪有什么故意的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「脸红了呢」</p><p class="story-paragraph dialogue">「别看...」</p><p class="story-paragraph dialogue">「害羞了吗？」</p><p class="story-paragraph">想着干脆无视而闭上了眼睛，底下的手却一动不动，不晓得她在干什么，睁眼一看，这时她才又咧开嘴嘻嘻笑着，慢慢动起手指。然而再次闭上双眼，就像开关被关闭了一样，又是一动不动。</p><p class="story-paragraph">她到底在干嘛呢？</p><p class="story-paragraph dialogue">「...呀」</p><p class="story-paragraph dialogue">「刚刚不是说没看见我的脸很可惜吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「选选看吧，要闭着眼睛自己动」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「或者一直看着我做」</p><p class="story-paragraph dialogue">「就这么拼命地想赢我吗？」</p><p class="story-paragraph dialogue">「我也得耍些小聪明，至少能赢一局吧」</p><p class="story-paragraph dialogue">「...真是坏透了啊你」</p><p class="story-paragraph">快啊让你选呢。露骨的视线今天格外讨人厌。刚才在身下娇吟的孩子去哪儿了，只剩下一只变态觉醒的小狗，在自己身上摇着尾巴。</p><p class="story-paragraph">瞪大眼睛怒视着旼炡，却见她一脸高兴地笑着。嗓音听上去格外兴奋，在耳边轻声细语。</p><p class="story-paragraph">比起自己做，更喜欢我帮你吗？</p><p class="story-paragraph">话音未落，她又伸出手指，直接钻进湿透的缝隙。发出短促呻吟的瞬间，嘴唇碰上自己皱起的鼻梁。只剩彼此微微交错的喘息在房内回荡。</p><p class="story-paragraph">对视的双眼太过靠近，连长长的睫毛眨了眨眼都看得一清二楚。手指越插越深，发出的声响就越是强烈。忙着喘气的双唇早就已经干渴，旼炡时不时用舌头从上面扫过。上下同时感受到刺激，脸好像快炸裂了。</p><p class="story-paragraph dialogue">「别看了...」</p><p class="story-paragraph dialogue">「不要，我要再近一点看」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「舒服吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「要我帮你压著肚子吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「看来连说话的力气都没有了呢...」</p><p class="story-paragraph">在下腹被压住的瞬间，传来了几次短暂如叹息般的呻吟。脑袋向后仰，不由自主闭上了眼睛，再无法顾及自己面前那张脸。</p><p class="story-paragraph">待身体的抖动完全停止，花了一段时间。四目相对太过难为情，只能望向天花板，然而透过玻璃窗反射，映入眼帘的是自己布满红潮的脸庞。</p><p class="story-paragraph dialogue">「旼炡啊，手...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「把手抽出来...」</p><p class="story-paragraph dialogue">「现在还没结束吧？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「待会儿力气用尽的话再说」</p><p class="story-paragraph">这话说得太露骨了吧。竟然可以面不改色、厚着脸皮说那种话。</p><p class="story-paragraph">对上眼的瞬间，腹部稍微用力是自己的失误。一看见她甜甜的笑容就感觉不妙，果然刚才静静的手指像要玩弄自己一样，开始往内挑弄。接着伸出像鸭子一样的嘴唇，在乳头一下一下啾啾地吮吸，像要把自己吃掉似的不停汲取。她这是怎么了，真是的。</p><p class="story-paragraph">和头脑不同，身体倒是很坦率，下腹自然而然地用了力。在兴奋状态尚未平息的情况下，又受到更强烈的刺激，感觉到内壁很快开始紧缩。突出的手腕骨头总是碰撞自己的敏感处，从下方朝上撞击再上提。说真的，好像快要晕过去了。</p><p class="story-paragraph dialogue">「为什么一直动...」</p><p class="story-paragraph dialogue">「要停下吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「继续吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「如果不想说话就抱紧我」</p><p class="story-paragraph">紧紧地抱住她朝自己而来的背，直到兴奋消失前不停喊出她的名字。旼炡啊、旼炡啊、旼炡啊。然而没有得到回答，取而代之的是舌头从双唇间伸了进来。在短暂且强烈的刺激下，全身力气终于被卸下。</p><p class="story-paragraph">脑袋往各处转得太过，弄得自己乱七八糟。虽然不知道现在才来整理有没有意义，但还是把刘海向后拨开。明知道已经结束了，但从上方俯视的视线却依旧没有移开。</p><p class="story-paragraph dialogue">「你知道自己刚刚很用力咬了我的舌头吧？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「以后不能在结束之前接吻了」</p><p class="story-paragraph dialogue">「少说点奇怪的话...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「现在差不多...可以拿出来了吧，你这只变态狗狗」</p><p class="story-paragraph">变得迟钝的触感慢慢回复，下身的感觉显得非常奇怪，不禁又颤动了一下身体。好不容易缓过来，旼炡却像故意要展示一般，在自己面前挥动着粘满透明液体的手指。</p><p class="story-paragraph">最后又去了一次呢，嘿嘿。</p><p class="story-paragraph">无奈全身力气都被抽光，除了冷笑之外什么都做不了。和自己在上面做的时候完全相反，心情非常糟。简直是让金旼炡站在头顶上跳舞的感觉，甚至在原定会玩弄她的床上反被调教，那样的屈辱。</p><p class="story-paragraph dialogue">「不过姐姐...」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「边张着嘴边盯着我看，真的好色」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还有边喊我的名字边皱鼻子...」</p><p class="story-paragraph dialogue">「快把纸巾拿来，你这只臭小狗」</p><p class="story-paragraph dialogue">「好~」</p><p class="story-paragraph">啊，好烦啊。</p><p class="story-paragraph">连听见她这么兴奋的回答都烦死了。</p><p class="story-paragraph">振作精神一看，屋内乱成一团。一个枕头落在地板上，没有观众的电影依然传来悲鸣声。原本干净的床单上，到处都是不知道谁的...还是省略吧。</p><p class="story-paragraph">不确定是不是末梢神经刚才不停受到刺激的缘故？现在看到那些长得奇形怪状的僵尸，倒也没什么感觉，虽然也不想更仔细看。一关掉Netflix，背景画面上笑容灿烂的刘知珉又蹦了出来。</p><p class="story-paragraph">你好，知珉啊，你还不知道几天后会从金旼炡那经历什么，还笑得那么开心。可不能因为她长得像个孩子就小看她。她床上的性癖比想象中奇怪得多，变态般的话也能毫不犹豫地说出口。真希望当时有人给我这种建言。</p><p class="story-paragraph">但是，以这张照片做背景画面，无论如何也难以适应。趁着主人暂时离开，要不要换一下。正好桌面上有一个叫北欧旅行的文件夹，孤零零地放在角落。因为里面放满了照片，忍不住好奇地将游标移至上方。</p><p class="story-paragraph">里面完整地记录着一个月里在一起的每个日子。在纪念品店前面强行递上姆明娃娃拍的照片。在教堂前迎接初雪的旼炡的侧脸。还有一起围着围裙，在饭桌前亲密地依偎。</p><p class="story-paragraph">这些都成了回忆啊。随着时间一天天推移，原本生疏的脸庞渐渐变得明朗起来。看着这些，脸上不禁露出了欣慰的笑容。</p><p class="story-paragraph">接在游乐园拍摄的照片后面，全是荒芜的雪地。也许从这开始就是冰岛旅行。旼炡视野中的极光非常璀璨，甚至到了不现实的程度。仅仅从照片上看，也让人感觉像做梦一般。</p><p class="story-paragraph">你独自看着这样的风景，心里想的是什么呢？</p><p class="story-paragraph dialogue">“如果”一词在脑海中浮现，如果知道未来，过去的刘知珉会做出怎样的选择呢？如果两人能一起欣赏冰岛的夜空，是不是能够更快获得幸福呢？但是，一想到永远没机会见到一路追到伦敦的金旼炡，就觉得太可惜了。</p><p class="story-paragraph">冰岛的纪录十分空虚，只充满夜空。即使从头到尾一张张翻看，却没有一张照片出现心中所想的那张脸。总是在嘴边不停叨念着冰岛、冰岛。结果连一张包含本人的纪念照都没有留下。</p><p class="story-paragraph">这时匆匆的脚步声越来越近，房门被打开。知珉拉高被子，轻轻拍打床铺让她过来，旼炡露出一脸满足的表情，蹦地跳上床。在看照片啊？天空很漂亮吧？</p><p class="story-paragraph dialogue">「为什么只有你的照片没整理上来？」</p><p class="story-paragraph dialogue">「因为没拍」</p><p class="story-paragraph">听她果断的回答，一时无话可说，不好意思地撩了下头发。不该这样，应该请别人帮你拍的呀。其实有拍一张，但删掉了。怎么了？就是...因为表情很奇怪，而且当下也不是想留下照片的心情。</p><p class="story-paragraph">看她的表情虽然不是气乎乎的，语气听起来也并未发脾气，但却让自己心里很难过。因为想不到什么安慰的话语，只能抱着旼炡的肩膀，反复进行道歉。对不起、姐姐很抱歉。</p><p class="story-paragraph dialogue">「算了，反正可以拿这个一直捉弄」</p><p class="story-paragraph dialogue">「今天别睡觉了，我会拿身体来做偿还，只要你让做我都会做的」</p><p class="story-paragraph dialogue">「不是...拜托乖乖睡觉就行...」</p><p class="story-paragraph dialogue">「那我要抱着睡」</p><p class="story-paragraph dialogue">「...随你吧」</p><p class="story-paragraph">把被子盖到头顶后，旼炡说着喘不过气，接着把脑袋伸到外面。在被窝内紧紧抱住她纤细的腰，不让她动弹，接着问道。旼炡啊，新年要做什么？</p><p class="story-paragraph dialogue">「目前还没有什么计划」</p><p class="story-paragraph dialogue">「明明是生日，却没有一个朋友能找吗？真是可怜啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「没办法，只能由我来陪你玩了呢」</p><p class="story-paragraph dialogue">「一天不找事就浑身难受是吧？」</p><p class="story-paragraph dialogue">「其实我把你那天要穿的衣服都决定好了」</p><p class="story-paragraph dialogue">「不要...又要给我穿不舒服的衣服是吧？」</p><p class="story-paragraph dialogue">「只在晚上穿的」</p><p class="story-paragraph">看她满脸厌恶，心情挺不错。本来是开玩笑的，看来得认真准备准备，真兴奋。</p><p class="story-paragraph dialogue">「你要陪我玩什么？」</p><p class="story-paragraph dialogue">「去看星星」</p><p class="story-paragraph dialogue">「星星？」</p><p class="story-paragraph dialogue">「你不是说去年生日的时候没看到嘛」</p><p class="story-paragraph">我是什么时候说过的？那些你都记得吗？旼炡似乎没有想到，圆圆的眼睛不停闪烁。即使久违地用下巴用力压住她的肩膀，也没有喊疼。顺手抓住被窝里扭动的手说。那天和我一起去看夜空吧，嗯？</p><p class="story-paragraph dialogue">「虽然无论去哪里，肯定都比不上冰岛」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「但我会努力找找看漂亮的地方的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你笑什么？」</p><p class="story-paragraph dialogue">「这段时间撒娇变多了呢」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「再多表现看看吧。看完我再决定」</p><p class="story-paragraph dialogue">「突然让我表现我会僵住的，这样有点...」</p><p class="story-paragraph dialogue">「但只看这些照片好像搞错什么了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「冰岛真的不怎么样好嘛？」</p><p class="story-paragraph">虽然一直盖着被子，却不觉得郁闷反而只感觉格外温馨。近在眼前圆圆的脸颊，环绕在脖颈的胳膊。即使是每天下雨的伦敦也要好得多。她在耳边如此低语。温暖的肌肤互相摩擦，心情特别愉悦。即使是微微移动身子，被子也会发出沙沙响声。慵懒的眼神一边催促着赶紧睡觉，又不停向下看著嘴唇。</p><p class="story-paragraph">喜欢死了。</p><p class="story-paragraph">才做完多久又觉得欲火焚身了。</p><p class="story-paragraph">要不直接扑倒吧？</p><p class="story-paragraph">这时，从隔壁房内再次传来赤裸裸的呻吟声。两人在被子中相互对视，不禁爆笑出声。音量挺大的，甚至比刚才还激烈呢。</p><p class="story-paragraph dialogue">「真的...那边也是挺烦人的」</p><p class="story-paragraph dialogue">「看来是爱得死去活来吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「也可能是因为好久没见面了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「也许是才刚开始交往的情侣」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「或许今天是第一晚...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「既然如此，我们也再来一次吧？」</p><p class="story-paragraph dialogue">「你不觉得结论很奇怪吗？」</p><p class="story-paragraph dialogue">「不知道为什么，不想输给那个房间」</p><p class="story-paragraph dialogue">「不要在奇怪的地方展现出胜负欲...」</p><p class="story-paragraph dialogue">「总之重新轮到我了，对吧？」</p><p class="story-paragraph dialogue">「是按顺序轮流的吗？」</p><p class="story-paragraph dialogue">「不、抱歉，从现在开始我会一直在上面」</p><p class="story-paragraph dialogue">「哪有这样的？」</p><p class="story-paragraph dialogue">「如果不满，就拿出力气压制啊」</p><p class="story-paragraph">姐姐真的是为了身体才来这里的啊？庸俗。虽然撅起嘴不停嘟嘟囔囔，但压根没把自己推开。姐姐如果觉得被压在身下丢人，就安静待着嘛。为了让她闭嘴，手伸向肋下挠痒，结果旼炡只得蜷缩着挣扎，够了、够了。</p><p class="story-paragraph dialogue">「今天打算几点睡觉？」</p><p class="story-paragraph dialogue">「等你发不出声音的时候」</p><p class="story-paragraph dialogue">「...说什么呢」</p><p class="story-paragraph dialogue">「没开玩笑啊？」</p><p class="story-paragraph">因为夜晚还很长，而且复仇行动还没有结束。</p><p class="story-paragraph">从现在正式开始享受第二轮比赛。</p><p class="story-paragraph">虽然今天不哄我家狗狗睡觉，</p><p class="story-paragraph">但还是祝大家Good night and sweet dreams!</p></div>
      </section></template></div>

  <script>
    (() => {
      const chapterIds = ["chapter-01", "chapter-02", "chapter-03", "chapter-04", "chapter-05", "chapter-06", "chapter-07", "chapter-08", "chapter-09", "chapter-10", "chapter-11", "chapter-12", "chapter-13", "chapter-14", "chapter-15", "chapter-16", "chapter-17", "chapter-18", "chapter-19", "chapter-20", "chapter-21", "chapter-22", "chapter-23", "chapter-24", "chapter-25", "chapter-bonus"];
      const stage = document.getElementById('chapter-stage');
      const select = document.getElementById('chapter-select');
      const controls = {
        previous: [document.getElementById('top-previous'), document.getElementById('previous-chapter')],
        next: [document.getElementById('top-next'), document.getElementById('next-chapter')]
      };
      const progress = document.getElementById('chapter-progress');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let current = Math.max(0, chapterIds.indexOf(location.hash.slice(1)));

      function showChapter(index, updateHistory = true) {
        current = Math.min(Math.max(index, 0), chapterIds.length - 1);
        const id = chapterIds[current];
        const source = document.getElementById(`template-${id}`);
        stage.replaceChildren(source.content.cloneNode(true));
        select.value = id;
        controls.previous.forEach(button => button.disabled = current === 0);
        controls.next.forEach(button => button.disabled = current === chapterIds.length - 1);
        progress.textContent = `${current + 1} / ${chapterIds.length}`;
        document.title = `${select.options[select.selectedIndex].text.split(' · ')[0]} · 北极狐观察日记`;
        if (updateHistory) history.replaceState(null, '', `#${id}`);
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
      }

      select.addEventListener('change', () => showChapter(chapterIds.indexOf(select.value)));
      controls.previous.forEach(button => button.addEventListener('click', () => showChapter(current - 1)));
      controls.next.forEach(button => button.addEventListener('click', () => showChapter(current + 1)));
      addEventListener('hashchange', () => {
        const index = chapterIds.indexOf(location.hash.slice(1));
        if (index >= 0) showChapter(index, false);
      });
      showChapter(current, false);
    })();
  </script>
