        <div class="chapter-copy"><p class="story-paragraph">不和我去游乐园约会吗？</p><p class="story-paragraph">…回答我一下吧。</p><p class="story-paragraph">那天晚上被拉到了预料之外的地方。</p><p class="story-paragraph">旼炡啊，拜托了。</p><p class="story-paragraph">今天不是最后一晚嘛。</p><p class="story-paragraph">就因为那一句话。</p><div class="location-badge"><strong>Rewind : Midnight in Copenhagen</strong><span>倒回 ：哥本哈根 午夜</span></div><p class="story-paragraph">在接近午夜的时刻，华丽的游乐园渐渐失去色彩。热气球造型的摩天轮从远处看像是玩具风车，但真正乘坐时却能听到老旧建筑物般嘎嘎作响。由于晚风刮得厉害，游客乘坐的篮子一摇一摆地晃动。</p><p class="story-paragraph">如果一起坐的话，会很害怕吧。</p><p class="story-paragraph">一对情侣坐在自己底下的篮子，互相搂着肩膀。到达顶端的摩天轮突然停了下来。眼前是彷彿时间静止的哥本哈根城市夜景。旼炡朝着某处挥手，向着一整天都在等待自己的某人。只是视线中只能看见模糊的黑色身影。理所当然看不见知珉的脸。旼炡靠在摩天轮上，小声地喃喃自语。能看见吗刘知珉？</p><p class="story-paragraph dialogue">「都是因为你，我变成了独自坐摩天轮的人」</p><p class="story-paragraph">上去看看风景，拍张漂亮的照片再下来吧。想起她拍着自己后背说的话，随即打开相机环顾四周。高耸的市政厅钟楼、中央车站附近延伸的铁路、第一个跑过去搭乘的木制云霄飞车，两人唯一一起乘坐的旋转木马。全都进入视线的尽头。</p><p class="story-paragraph">旼炡揉搓着护手霜还没有干透的左手。当举起手腕闻到香味时，脑海里浮现的是，像音乐盒那样旋转着古色古香的木马，以及当时响起的轻快的华尔兹。对不起，我忘了。还有，惊慌地为自己戴上戒指亲密的举动。那一瞬间，无论如何也无法直视知珉的脸。因为独自在心里真挚地想象，感到很害羞。已经膨胀到无法控制的情感，让人感到害怕。</p><p class="story-paragraph">今天的知珉一点都不像她，反而特别像个小孩。洗完澡出来一看，眼睛肿得好像哭过一样，不知道发生了什么事情。出来散步的时候，都已经像纸片人一样摇摇晃晃的，还耍赖说一定要去游乐园，明明自己一个游乐设施都搭不了。实在是一团乱。今天本来只是打算去冰岛之前，短暂休息一天而已。完全没想过要来这种地方。</p><p class="story-paragraph">事实上旅行开始后，从来没有一天像预想的那样度过。赫尔辛基、斯德哥尔摩、奥斯陆、哥本哈根……所有行程都被旁边糊里糊涂的人给打乱了，这俨然已经成为非常熟悉的日常。</p><p class="story-paragraph">摩天轮不是需要很长时间吗？</p><p class="story-paragraph">姐姐不是还要在下面等我嘛</p><p class="story-paragraph">一直等也没什么大不了的</p><p class="story-paragraph">竟然说这种话。</p><p class="story-paragraph">那一整晚都在让你等待的我，成什么了？</p><p class="story-paragraph">旼炡突然想起了斯德哥尔摩的凌晨，当时特别想拥抱知珉。今天那张固执的脸，和在路灯下无力地靠墙的样子很类似。双眼泛红拉着自己的手，说一定要去游乐园的刘知珉。以及毫无计画就独自跑掉的刘知珉。</p><p class="story-paragraph dialogue">「对不起，知珉姐姐」</p><p class="story-paragraph">上到这里没几分钟，为什么这么思念那张脸呢？站在这上面，你是什么样的表情，我一点都看不见。</p><p class="story-paragraph dialogue">「对不起，让你久等了」</p><p class="story-paragraph">去冰岛的话会全部告诉你的。</p><p class="story-paragraph">甚至连一小会儿都忍不住</p><p class="story-paragraph">我已经变得这么喜欢你了。</p><p class="story-paragraph">几小时前一起走过的林荫道，路边所有照明都关了，暗得让人无法想象是同一条路。游乐园的打烊时间，看起来就像一个熄灯的舞台。知珉看着那一情景满脸不舍。姐姐，我们走吧。待孩子急忙喊道，这时她才慢悠悠地跟过来。</p><p class="story-paragraph dialogue">「对了，刚才在上面拍照了吗？」</p><p class="story-paragraph dialogue">「随便拍了。不怎么漂亮」</p><p class="story-paragraph">但是，听到某人缠着要自己展示，不得不把手机递给她，结果知珉一看到照片，就笑得停不下来。</p><p class="story-paragraph dialogue">「旼炡啊，你真的...我不行了」</p><p class="story-paragraph dialogue">「干嘛？」</p><p class="story-paragraph">拍照的瞬间，偏偏坐在自己下一台的情侣正在亲密接触。仅仅只有一张的摩天轮自拍照，却以接吻的情侣为背景，成了孤单地露出不情愿表情的悽惨照片。而勉强拍摄的哥本哈根全市夜景，全因光晕太重，重要的背景都消失了。</p><p class="story-paragraph dialogue">「你真的像是勉强坐上的人」</p><p class="story-paragraph dialogue">「就是被勉强推上去的啊？因为姐姐不在，所以一点意思都没有」</p><p class="story-paragraph dialogue">「搭得好好的，干嘛呀」</p><p class="story-paragraph dialogue">「不过这张真的看起来很可怜。我要删掉」</p><p class="story-paragraph dialogue">「这么可爱，为什么要删掉？传给我吧」</p><p class="story-paragraph dialogue">「这有什么可爱的」</p><p class="story-paragraph dialogue">「你本人不知道也没差」</p><p class="story-paragraph dialogue">「...都看完了就把手机还我吧」</p><p class="story-paragraph">知珉说着等一下，打开相机，瞬间换了几个姿势，接连拍了好几张照片。用别人的手机干什么呢？一问才知道，这是给自己自拍的示范作业。旼炡啊，姐姐教你我经常用的姿势，像这样拍5张</p><p class="story-paragraph">果然，知珉拍的照片如果满分100分就有100分，没有一丝晃动。第一是闭着双眼向下望的基本姿势。然后是用手指戳右脸颊。第三个是稍微鼓鼓的侧脸嘟起嘴唇。第四个是拿起头发做鬍鬚，最后是正面笑得圆圆的脸。旼炡停在最后一张照片看了好久，用不耐烦的语气说道。</p><p class="story-paragraph dialogue">「为什么要拍五张？」</p><p class="story-paragraph dialogue">「那样才能成功一张」</p><p class="story-paragraph">行吧，我会看着姐姐的照片学习的。虽然说得不情愿似地，旼炡再次伸出手，但知珉看上去没有离开游乐园的想法。寂静的街道上，除了彼此，没有其他人。想着或许是想吻我吗，暂时对视的目光马上转向地面。</p><p class="story-paragraph dialogue">「我从下面看，风挺大的，摩天轮有点晃」</p><p class="story-paragraph dialogue">「...在看我吗？」</p><p class="story-paragraph dialogue">「一直都」</p><p class="story-paragraph dialogue">「也挥手了吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「刘知珉胆小鬼」</p><p class="story-paragraph dialogue">「...真的对不起」</p><p class="story-paragraph dialogue">「算了，如果被强迫，到时候一个人在刮风的摩天轮上怕得不行，会晕倒吧」</p><p class="story-paragraph dialogue">「嗯...我不否认」</p><p class="story-paragraph dialogue">「姐姐为什么不喜欢恐怖和高的呢？」</p><p class="story-paragraph dialogue">「这是天生的」</p><p class="story-paragraph dialogue">「哪有这种事。你不是连挑战都没挑战过吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「其实…我不是想说这种话」</p><p class="story-paragraph dialogue">「…」</p><p class="story-paragraph dialogue">「今天让你久等了，很抱歉」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「为了等我辛苦了」</p><p class="story-paragraph">旼炡羞涩地说出口，这是在摩天轮上一直想说的话。往旁边瞟了一眼，知珉的嘴角露出了淡淡的笑容。什么呀，就说了真的没关系，游乐场也是我说要去的，还听你对我说辛苦了...</p><p class="story-paragraph dialogue">「听金旼炡你问我今天为什么这么耍赖，还挺值得的」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不过你在上面的时候不冷吗？」</p><p class="story-paragraph dialogue">「一般。不觉得现在更凉吗？」</p><p class="story-paragraph">唧咿。听到拉链拉开的声音，回头看的同时，身体也被搂在腰间的手臂拉住。一件硕大的羽绒服像被子一样，暖暖地裹住身体。旼炡埋在其中，上半身向前倾斜。</p><p class="story-paragraph">比平时更浓郁的体香，让心里有些荡漾。很快，被紧紧环抱的胳膊压得喘不过气来。好疼、稍微往后回望。但是黑色的瞳孔却避开了视线。虽然彼此相贴，都能听见呼吸声，但心中却是一阵刺痛。</p><p class="story-paragraph">这心情是怎么回事呢？</p><p class="story-paragraph">什么事都没有吧。什么事都。</p><p class="story-paragraph">没什么的，就只是刘知珉今天太娇气了，连自己都觉得怪怪的。什么事都没有。就说了没事的。旼炡像咒语一样反复呢喃，在羽绒服中一点一点活动被胳膊抱住的腰部。知珉莫名噗哧一笑，语气和往常一样亲暱。</p><p class="story-paragraph dialogue">「比刚才好点了吗？」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「这件拉上拉链真的很暖和」</p><p class="story-paragraph dialogue">「这是从家里带来最暖和的外套」</p><p class="story-paragraph dialogue">「那你留着穿啊，为什么给我？」</p><p class="story-paragraph dialogue">「就那样」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「我想像这样走着回家」</p><p class="story-paragraph dialogue">「那就走回去吧？」</p><p class="story-paragraph dialogue">「…开玩笑的」</p><p class="story-paragraph">再次紧紧抓住羽绒服的一角，知珉讶异地问。怎么了？姐姐你今天是不是忘记什么了？这时，她面无表情地眨了一下眉毛。很重要的事吗？嗯。好像忘了呢？有点失望。用兔子般圆圆的眼睛瞪了她一眼，这时她才乖乖举起手，做出投降的姿势。对不起，我真的不知道是什么事。</p><p class="story-paragraph dialogue">「真的很重要」</p><p class="story-paragraph dialogue">「能快点告诉我是什么吗？自从我那次丢了包后，这样真的很恐怖的」</p><p class="story-paragraph dialogue">「今天为什么没给我晚安吻？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「那无语的表情是什么啊？」</p><p class="story-paragraph dialogue">「我又...想说这是什么话呢」</p><p class="story-paragraph">明明是姐姐先开始的嘛，为什么忘记了？知珉赶紧大声说”知道了、知道了”，眼睛画出漂亮的半月形曲线，慢慢朝自己靠近。 半威胁后，旼炡在嘴唇触及之前，把手举了起来。</p><p class="story-paragraph dialogue">「等一下」</p><p class="story-paragraph dialogue">「...怎么了？」</p><p class="story-paragraph dialogue">「又想到一个还没回答的事情」</p><p class="story-paragraph dialogue">「这次又是什么？」</p><p class="story-paragraph dialogue">「刚才哭了吧」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「不是还没告诉我理由嘛」</p><p class="story-paragraph">我可以问你为什么哭吗？面对最后一个问题，知珉马丁靴鞋尖在地上敲了敲。鼓起脸颊，呼，微微呼出了一口气。彼此依然没有对视。今天的刘知珉真像个孩子，而且是犯错的孩子，一脸不知所措，手上焦躁的举动也像被什么人压迫。抱着在回答之前绝对不走的心态看向对方，最后知珉像是认输一般，开口说道。</p><p class="story-paragraph dialogue">「电影」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「看电影看哭了。玩具总动员」</p><p class="story-paragraph">等了好一阵子才获得的回答，令自己很意外。明明眼睛都哭肿了，还以为有什么厉害的理由呢。结果只是在看电影的时候哭的？而且还是小孩子看的电影？</p><p class="story-paragraph dialogue">「...什么呀，真无趣」</p><p class="story-paragraph dialogue">「我在飞机上没看完」</p><p class="story-paragraph dialogue">「但那电影是那种字字句句都赚人热泪...的吗？」</p><p class="story-paragraph">当然了。知珉打断了旼炡的碎唸，玩具总动员最后一季的内容，是玩具们离开成年的主人，最终找到自我与自己的人生，这样充满人文主义的电影...总的来说，具有值得大人们投入、非常深奥的内容。那到底有什么好那么悲伤的？不就是个学龄前的儿童看的电影吗。知珉一听就开始嘟囔，你懂什么，金旼炡你平时不看这类电影所以不知道，我很容易哭的，就算不是看哀伤的电影。</p><p class="story-paragraph dialogue">「那姐姐就不能跟我一起看电影了」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「因为如果旁边有人哭的话，我也会跟着流泪」</p><p class="story-paragraph dialogue">「...那样真的是因为难过才哭的吗？」</p><p class="story-paragraph dialogue">「干嘛怀疑别人的眼泪？」</p><p class="story-paragraph">我也有自己的感性。听见这话，知珉像是听不懂似的，噗哧笑了出来。金旼炡和感性？就像妈妈哭的话，孩子也会跟着一起流泪的道理吗？别再拿我的眼泪说事了。所以那个悲伤的玩具总动员结局是什么？是美满结局吗？对于毫无意义的提问，知珉轻轻耸了耸肩，含糊其辞。</p><p class="story-paragraph dialogue">「就是啊？我也不知道」</p><p class="story-paragraph dialogue">「为什么？」</p><p class="story-paragraph dialogue">「我没看最后就关掉了」</p><p class="story-paragraph">知珉的视线依然向着灯光熄灭后的游乐园。紧紧抱住腰间的手，突然一下子松开。路上不见人影。我们可能是最后的客人了。知珉带着若有似无的微笑，走在前面几步距离。</p><p class="story-paragraph">待两人到家已经过了午夜。长时间在外面待着，一回到室内，疲惫不堪的身体发出了 &quot;请休息吧&quot; 的信号。旼炡瘫倒在床上眨巴着眼，呆呆地看着知珉默默卸妆的背影。要是没有这些啪嗒声，说不定就进入梦乡了。在眼睛就快阖上时，听见呼喊自己名字的声音，一下子又醒了过来。旼炡，在睡觉吗？</p><p class="story-paragraph dialogue">「没有」</p><p class="story-paragraph dialogue">「现在很累吗？」</p><p class="story-paragraph dialogue">「非常...」</p><p class="story-paragraph">嗯，那就算了。知珉回答，然后把棉花沾湿。只是她镜子中反射的眼睛好像十分在意自己这边，所以追问了一句。</p><p class="story-paragraph dialogue">「为什么问我累不累？」</p><p class="story-paragraph dialogue">「...要不要看电影？」</p><p class="story-paragraph">想着可能是自己听错了，旼炡一下子转过头来。知珉用平静得让人疑惑的表情，一字一句地说。如果可以的话，一起看一部电影吧。</p><p class="story-paragraph dialogue">「现在已经过12点了」</p><p class="story-paragraph dialogue">「我知道」</p><p class="story-paragraph dialogue">「刚才喝的不是红牛吧？能不能考虑一下我的体力？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「还有在飞机上不是看了很多嘛。为什么突然要看电影？」</p><p class="story-paragraph dialogue">「我们没有一起看过啊」</p><p class="story-paragraph dialogue">「那当然了，每天光出门久够忙了」</p><p class="story-paragraph dialogue">「其实我有点好奇」</p><p class="story-paragraph dialogue">「什么？」</p><p class="story-paragraph dialogue">「金旼炡看见我哭的时候，是真的会一起哭、还是不会哭？」</p><p class="story-paragraph dialogue">「...还真是固执的人啊」</p><p class="story-paragraph">可现在是姐姐的睡觉时间，不困吗？知珉则说她精神抖擞。眼睛发着光，用充血的双眼说这么，还真可怕。我们明天必须早起，还是快睡觉吧。即使诚恳地拒绝，知珉则说在飞机上边睡不就行了吗？只好一声不吭，乖乖就范。毕竟以自己的力量，是不可能让固执的刘知珉入睡的。</p><p class="story-paragraph dialogue">「知道了，要看就快点放吧」</p><p class="story-paragraph dialogue">「请推荐一部旼炡会喜欢的电影吧」</p><p class="story-paragraph dialogue">「有血到处乱喷的随便一部」</p><p class="story-paragraph dialogue">「…你真的很没有情调」</p><p class="story-paragraph dialogue">「是不是觉得不应该问...」</p><p class="story-paragraph dialogue">「所以浪漫题材死都不看吗？」</p><p class="story-paragraph dialogue">「我什么时候说过死都不看了。阿拉丁就还行」</p><p class="story-paragraph dialogue">「那个我在飞机上看过了」</p><p class="story-paragraph dialogue">「如果要找到我们意见一致的电影，天都要亮了... 算了，再继续看姐姐看哭的那个吧」</p><p class="story-paragraph dialogue">「嗯？」</p><p class="story-paragraph dialogue">「玩具总动员啊。不是说没看到结局吗？」</p><p class="story-paragraph">把枕头堆好，手机放好，然后两人为了看手机上的小屏幕，几乎贴着脑袋并排坐在床上。虽然播放了皮克斯熟悉的开场动画，但旼炡似乎从开头就半睡半醒。说实话，几乎是连内容都没有看懂，就只是盯着而已。她说过电影内容非常难过，甚至连大人都会痛哭，但知珉本人现在则是好端端的看着电影。</p><p class="story-paragraph dialogue">「听说刘知珉小姐看电影时都会哭，结果没哭啊」</p><p class="story-paragraph dialogue">「现在气氛还很明朗」</p><p class="story-paragraph dialogue">「那什么时候哭？」</p><p class="story-paragraph dialogue">「干嘛对哭那么执着？」</p><p class="story-paragraph dialogue">「不是说想要确认吗？本来想看着气氛一起哭的」</p><p class="story-paragraph dialogue">「我只是说说而已。而且你明明不怎么喜欢这种电影」</p><p class="story-paragraph dialogue">「现在看来挺有趣的」</p><p class="story-paragraph">你现在根本在胡言乱语，眼睛几乎都快闭上了啊？知珉说着，用手舒展自己皱着的眉头。旼炡眼睛盯着手机画面，嘴巴则对耳边的每句话乖乖做回应，脑中其实特别忙碌。因为之前没有看过这一系列电影，所以必须知珉给自己做背景介绍，但听她说这些反而更困。胡迪几年前和女朋友分手了，怎么怎么样...</p><p class="story-paragraph dialogue">「我就边看就行，不用说明了」</p><p class="story-paragraph dialogue">「什么呀，我还亲切地给你讲解」</p><p class="story-paragraph dialogue">「这大概看一看就能理解吧。毕竟是玩具总动员啊」</p><p class="story-paragraph dialogue">「我的声音听起来催眠吗？」</p><p class="story-paragraph dialogue">「不，我很喜欢姐姐的声音」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「只是因为太舒服了」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">但是旼炡啊，飞机上看你一直看动作片，知道枪声都传到我座位上了吗？是啊，最喜欢看打打杀杀、也喜欢溅血的战争电影。啊真的讨厌...嗯？没事。跟我的喜好很不一样啊。那以后还可以和我一起看吗？知道了。真的吗？约定。嗯，约定。</p><p class="story-paragraph">轻声低语交谈没过几分钟，旼炡又开始点头打嗑睡。甚至还发生了额头撞到知珉肩膀的碰撞事故。</p><p class="story-paragraph dialogue">「哎哟，真是的」</p><p class="story-paragraph dialogue">「对不起」</p><p class="story-paragraph dialogue">「你今天也要把我当枕头用吗？」</p><p class="story-paragraph dialogue">「这种可能性好像很高...」</p><p class="story-paragraph dialogue">「...真是厚脸皮」</p><p class="story-paragraph">过来。知珉噗哧一笑，把身体打开。旼炡从后背被紧抱，感到暖和的同时，困意也如同暴风雨一般袭来。电影中玩具们说的台词，已经听不见了。</p><p class="story-paragraph dialogue">「如果困了可以睡的」</p><p class="story-paragraph dialogue">「我要看完再睡」</p><p class="story-paragraph dialogue">「...你知道要想哄不听话的小狗睡觉，该怎么做吗？」</p><p class="story-paragraph dialogue">「不知道...」</p><p class="story-paragraph">知珉的手突然靠近，盖住了自己的眼皮。在温暖的温度和被隔绝的视线下，像被催眠一样，眼睛就这样慢慢地闭上。旼炡，睡觉也要摘下戒指再睡啊。似梦非梦地，感觉到知珉的手指碰到戒指上，旼炡无意识地呢喃道。</p><p class="story-paragraph dialogue">「感觉快哭了就告诉我」</p><p class="story-paragraph dialogue">「…不会哭了」</p><p class="story-paragraph dialogue">「知珉姐姐」</p><p class="story-paragraph dialogue">「嗯」</p><p class="story-paragraph dialogue">「刚才啊」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「搭旋转木马的时候，姐姐为我戴戒指的时候...」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph dialogue">「你知道我在想什么吗？」</p><p class="story-paragraph dialogue">「...」</p><p class="story-paragraph">知珉什么话也没有说，但耳边的心跳声稍微加快，还传来浅浅的呼吸声。她现在是什么表情呢？到底想表露什么呢？</p><p class="story-paragraph">但是，因为温柔地抚摸着自己眼角的双手，精神再次渐渐变得模糊。低声的耳语中，夹杂着轻微的颤抖。</p><p class="story-paragraph dialogue">「旼炡啊」</p><p class="story-paragraph dialogue">「…嗯」</p><p class="story-paragraph dialogue">「快点...该睡觉了」</p><p class="story-paragraph">晚安，旼炡。</p><p class="story-paragraph">分不清现实还是梦境，朦胧的晚安问候结束，记忆像保险丝一般被剪断。唯一能想起来的只有顺着自己头发的手。</p><p class="story-paragraph">这一瞬间，是旼炡记忆中哥本哈根的最后一个夜晚。</p><div class="location-badge"><strong>I C E L A N D  : G E Y S I R</strong><span>冰岛：盖锡尔</span></div><p class="story-paragraph">早晨的阳光斜斜地照进玻璃窗缝隙。一辆大巴士无声地行驶在白雪皑皑的道路上。反射太阳光的雪好像刚下过一样，在无人侵犯的广阔大地上洒满白色光芒。这样开阔又充满想像中冬天的白色空间，看上去比任何地方都缺乏现实感。一直非常期待的冰岛。</p><p class="story-paragraph">旼炡脑袋静静地靠着巴士窗边，闭上了眼睛。轻轻闭上的双眼间缝隙还能感受到阳光，前一天的残影乱七八糟地重迭在脑海中。昨天早晨，没有平常的红茶香，没有了客厅里切水果的声音，也没有在梳妆台摆放口红的声响。</p><p class="story-paragraph">姐姐，起来了吗？</p><p class="story-paragraph">习惯性地躺着叫知珉，但没有得到回应。甩开胳膊扫过床边也感觉不到一丝热意，只有冷冰冰的床单。瞬间，一种奇怪的不安感从背部涌上心头。之前空空如也的墙面现在挂着衣架，上面整齐地吊着旅行时借给知珉的黑色羽绒服。</p><p class="story-paragraph">虽然抱着侥倖心理拿起了手机，但没有发现任何讯息，也没有未接来电。旼炡连鞋都没来得及穿，就猛然打开前门大喊。姐姐、知珉姐姐你在哪里？</p><p class="story-paragraph">当然，没有回答。旼炡呆呆地站在门边，耳边彷彿传来了嗡嗡的耳鸣。越是观察四周，一心想无视的痕迹全都浮现在眼前。每次都随便乱放的匡威，被摆放得整整齐齐，以及消失得无影无踪的知珉的行李箱。</p><p class="story-paragraph">这是什么情况？</p><p class="story-paragraph">旼炡挠着头，瘫坐在沙发上。因为太过慌张，反而脑袋一片空白。几个小时后就要出发去冰岛了，怎么办呢。在看完电影睡觉的时候，是不是发生了什么事情？说不定是自己错过了什么。这时，视线触及到了沙发前的桌子。桌上还放着昨晚知珉替自己摘下的戒指，以及一个莫名其妙的购物袋。</p><p class="story-paragraph">旼炡好不容易才想起旅行第一天的事情。知珉一手拿着这个，一边气喘吁吁地上飞机，那个样子还历历在目。踌躇了半天，终于把它打开。其中放着一款香水，即使不去闻也能猜到，散发着熟悉的香气。小香水瓶。这是知珉留下唯一的痕迹。</p><p class="story-paragraph">唧咿——</p><p class="story-paragraph">随着车轮在粗糙的碎石上停下的声响，慢慢睁开了闭着的双眼。在巴士前端传来了啪啪、的拍手声。在导游洪亮的声音中，旼炡将黑色羽绒服拉链拉到最高，把微微松脱的毛帽戴好。</p><p class="story-paragraph">在冻得结冰的指示牌上，可以看见模糊的文字。盖锡尔(Geysir)。这里熔岩沸腾，是冰岛着名的间歇泉。来这里唯一的目的，就是观看每隔几分钟就会有水柱砰地爆发的奇观。但是，在设置三脚架、准备拍摄的人群中，旼炡只是呆呆地坐着，神情恍惚。</p><p class="story-paragraph">现在是上午七点。对于早上才睡的旼炡来说，简直算是彻夜未眠。有一个小时时差的伦敦应该刚过八点，如果是平时，知珉就要起床喝茶了。导游正在把温热的饮料分发给大家。</p><p class="story-paragraph">旼炡接过平时连碰都没碰过的红茶，一口喝掉。苦涩的味道不禁让人皱起眉头。早晨的一杯茶还不足以醒脑，而深坑内只是冒着烟，也还没有爆出喷泉的迹象。想着自己是否需要去釐清这悽惨的局面，但无论怎么想也想不通，脑子里有一个问号抹不掉。</p><p class="story-paragraph">为什么只留下一瓶香水呢？</p><p class="story-paragraph">乍一看，这瓶香水应该是作为礼物要送出去的。还想问，既然这样，就应该带去伦敦，为什么孤零零地丢在这儿就走了呢？那天晚上到底在想什么，怎么能一句话也没有，就消失得无影无踪呢？事实上，旼炡努力回避的现实，只需要用一句话来整理。</p><p class="story-paragraph">刘知珉像烟一般蒸发了。</p><p class="story-paragraph">换句话说，刘知珉离开了金旼炡。</p><p class="story-paragraph">更直白地说，</p><p class="story-paragraph">逃跑了。</p><p class="story-paragraph">知珉直到最后还戏弄了旼炡才离开。这瓶香水连被抛弃都不知道，和知珉不在身边的自己没什么两样。痛快地承认后，感觉更加悲惨。虽然余味很苦，但旼炡还是在凉之前把剩下的茶喝完了。</p><p class="story-paragraph">砰、砰、砰…这时，熔岩迸发出轰鸣声。人们在爆炸声响起的同时，兴高采烈地欢呼起来。间歇泉涌出的水柱，比想像中更大。</p><p class="story-paragraph">旼炡慢慢地抬起头。如果不是因为心情跌落谷底，这应该是很值得一看的风景，但现在连拿起相机的力气都没有。结果把毫无用处地香水扔在背包深处，来到了冰岛。旼炡剩下的，真的只有极光了。因为不管是原本打算一起旅行的人、还是偶然相遇的旅行伙伴，现在自己身边，谁也没有留下。</p><div class="location-badge"><strong>I C E L A N D : DIAMOND  BEACH</strong><span>冰岛：钻石海滩</span></div><p class="story-paragraph">今天比平时更早起，在巴士行驶的三四个小时的时间里，旼炡反复浅眠又惊醒。打起精神一看，没想到一眨眼就到了中午。旅游巴士提供的好像是附近的餐厅送来的午餐。是这里的特产——奇怪的驯鹿汉堡。虽然看其他人吃得不错，但肉饼散发的腥臭气味，让人食欲大减。结果，旼炡只吃了几勺沙拉，便直接盖上了盖子。</p><p class="story-paragraph">没有饼干吗？翻了翻背包，手上抓到一个小玻璃瓶。是每次乘坐游乐设施回来时，知珉会一个一个喂进自己嘴里的糖果罐，里面的糖果还剩下一半。</p><p class="story-paragraph">我家小狗的零食罐。</p><p class="story-paragraph">来，啊~吃吃看。</p><p class="story-paragraph">都要吃掉哦。</p><p class="story-paragraph">这是按照你的口味选的。</p><p class="story-paragraph">吃还是不吃呢，还是吃点东西吧。旼炡拿出一块糖，放进嘴里含了起来。随着时间的流逝，变软的糖果依然甜美，比腥臭的鹿肉要好得多。想着要不再吃几个，一下子又拿了两三个放进嘴里。</p><p class="story-paragraph">脸颊鼓鼓的，视线转向窗外，旁边是整片蔚蓝的冬季大海，对面则是一整座雪山，不再只是白雪皑皑的平原。毕竟已经从冰岛中央向南移动了很长时间。旼炡拿出今天收到的日程表，察看下一个目的地。</p><p class="story-paragraph"><strong>DAY 1</strong></p><p class="story-paragraph dialogue">-08:00 AM.</p><p class="story-paragraph">盖锡尔(Geysir)间歇泉之旅</p><p class="story-paragraph dialogue">-11:30 AM.</p><p class="story-paragraph">巴士内午餐（特产汉堡）</p><p class="story-paragraph dialogue">-12:00 PM.</p><p class="story-paragraph">冰河湖与钻石海滩散步</p><p class="story-paragraph dialogue">-04:00 PM.</p><p class="story-paragraph">瓦特纳冰原(Vatnajokull)蓝冰洞洞窟徒步旅行</p><p class="story-paragraph dialogue">-09:00 PM.</p><p class="story-paragraph">抵达雷克雅维克(Reykjavik)宿舍后休息</p><p class="story-paragraph">现在的位置是位于冰岛南部，一条满是冰块漂浮的冰河湖，对面有一间着名的照相馆。像今天这样阳光明媚的日子，由火山灰堆积形成的黑色沙滩上，到处都是冰堆，犹如宝石般闪烁着，因此这里又被称为钻石海滩。</p><p class="story-paragraph">巴士不久后就停靠在海岸边。或许是以同样的姿势睡了太久，脖子有些酸痛。导游正在讲解几条安全守则，说冰山十分危险，千万不能上去。但人们早已被眼前的美景吸引，四散而去。</p><p class="story-paragraph">旼炡沿着大海缓慢地移动。黑色沙滩上布满一块块璀璨的冰块，每当平静的海浪拍打上岸时，海沙交界处的冰就会慢慢浮起，最后漂到沙滩上。</p><p class="story-paragraph">伸手朝向正好在脚底下的一小块冰。虽然这是理所当然的事情，旼炡感觉到冰块十分冻人。把另一只手伸进口袋里，柔软的触感。羽绒外套内有早上随便塞进去的连指手套。</p><p class="story-paragraph">从明天开始一定要戴手套。</p><p class="story-paragraph">不要只带戒指，知道了吧？</p><p class="story-paragraph">旼炡只戴上一只手套，再次蜷缩身躯坐在地上。将手掌朝各个方向转动，散发光彩的冰块收进眼底。看着散落在海滩上晶莹剔透的宝石，钻石这个词用的正合适。反射蓝色大海光线的碎冰太漂亮了，让人想带个小碎片回去做纪念。虽然，自己也知道想带走美丽的冰块这想法很傻。</p><p class="story-paragraph">刘知珉喜欢大海。刘知珉肯定会喜欢冰岛的大海，这里到处都是闪耀的宝石。但是，灿烂的风景看起来让人有些空虚。因为这里肯定没有像手套一样，可以永久珍藏的纪念品。</p><p class="story-paragraph dialogue">「冰岛真的...」</p><p class="story-paragraph dialogue">「不怎么样」</p><p class="story-paragraph">对着波涛的海浪自言自语，并毫不留恋地把手中的冰块扔向海里。随着扑通一声，美丽的光线就那么沉入了水中。把手套重新脱下来，塞进口袋。虽然自由时间还有很长一段时间，但旼炡已经不再去看大海，而是坐上巴士。相机连一张照片都没有拍下。</p><div class="location-badge"><strong>I C E L A N D  : V A T N A J O K U L L</strong><span>冰岛 ：瓦特纳冰原</span></div><p class="story-paragraph">观光巴士再次沿着海岸公路，向东边驶去。在这期间好天气逐渐转阴，并开始刮起暴风雪。巴士逐渐减速，最终在越来越暗的天空中，打开了夜间车灯，照亮前进的道路。或许是因为突如其来的恶劣天气，路边发生了小事故，可以看见路中央出现汽车车轮掉进雪地里，人们正在使劲抬起轮胎的场景。</p><p class="story-paragraph">只是过了几个小时，就突然被困在雪路上。但这里是冰岛，这种事故恐怕比比皆是。在龟速的大巴上，也没有什么事可以转换心情，所以旼炡就像平时一样，戴着蓝牙耳机随着音乐小声地跟唱。跟随节奏，手指轻轻敲着窗。</p><p class="story-paragraph">至少这一天过得很顺利。虽然喜欢的人一声不吭地离开、外面还刮起了暴风雪。客观来说，这其实非常凄惨。像今天这样天气阴沉的某天，知珉这样说过。伦敦的天气也和北欧一样阴沉。</p><p class="story-paragraph">现在是下午3点。伦敦是下午4点。如果伦敦因气候异常下冰雹该有多好。如果发了洪水，整天只能呆在家就好了。明天、大后天也继续。请让刘知珉头顶上一直跟着乌云。如果可以，和男朋友激烈地大吵更好。</p><p class="story-paragraph">也许是手指敲击窗户的声音太大，坐在一旁的白发老爷爷凝视着自己。sorry...旼炡轻声说道，在简短地道歉后，暂停了音乐。再次把头靠在巴士窗边，开始向伦敦发起没什么用的诅咒。</p><p class="story-paragraph">反正也没其他事可做。</p><p class="story-paragraph">最终抵达下一个目的地的时间，比预定时间晚了一个小时左右。瓦特纳冰原(Vatnajokull)。是位于冰岛东部国家公园的名字。另外，这里有着欧洲规模最大的冰河。巴士克服一路上重重困难，好不容易到达蓝冰洞洞窟的入口。</p><p class="story-paragraph">穿上防寒服的人们，跟着嚮导缓慢移动到白雪深陷的洞口。为了不让身体湿透，旼炡也穿上防水型滑雪裤，但是不知哪来的寒气，身体不停发抖。脚一滑差点摔倒，好不容易抓住墙壁，才一瘸一拐地走进洞窟内。</p><p class="story-paragraph">进入被阳光复盖的蓝冰洞，彷彿来到人类无法触及的世界，里头散发着神奇又梦幻的氛围。虽然冷得就像进到冰箱一样，但实在值得一看。心里正想着，简直像把艾莎制作的冰宫搬到面前一样。刚好导游说到，这里就是冰雪奇缘的取景地。</p><p class="story-paragraph">原来如此，遗憾的是，喜欢迪士尼成痴的刘知珉看不到。但那是她自己要离开的错，有什么办法呢。只能由我来看个够。</p><p class="story-paragraph">旼炡点了点头，环顾四周。在湛蓝的冰河洞窟里，产生一种置身深海的错觉。如果永远被困在这样的地方，会是什么心情呢，天马行空般想像着，突然脑海浮现出看海盗船那天，与知珉聊天的对话。那时胡乱想着千年之后，在大海中发现的两个女人。</p><p class="story-paragraph">你好好想想，你那么怕冷。</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">在冰冷的海水中待上上千年。</p><p class="story-paragraph">那也是不错，不管在哪。</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">能够永远不分离，永远在一起。</p><p class="story-paragraph">说什么上千年，</p><p class="story-paragraph">连一个月都不到。</p><p class="story-paragraph">现在回想起来，这就是对未来毫不知情的人会说的话。单纯来看，和知珉一起的旅程也只有一个多月。但是为什么感觉光这一个月，比四年的恋爱留下更多回忆呢？据说，比起单调的日常生活，人们的大脑对旅行时经历的事情记忆更久远，难道是因为这个原因吗？</p><p class="story-paragraph">这也许是再正常不过的道理。因为在不熟悉的环境中，要启动所有感官。记住陌生的道路、偶尔尝试新的食物、每天克服各种突发状况，这就是旅行。想将所有过程都一同经历的人从记忆中剔除，是几乎不可能的。</p><p class="story-paragraph">所以，现在无论看什么都会想起刘知珉，这并不仅仅是一个问题。唯一错的只有，偏偏在这个陌生的地方遇到了刘知珉。就是自己运气太差了。旼炡一边自我安慰，一边将蓝冰洞的样子最后印在脑海，才走出了洞窟。</p><p class="story-paragraph">短暂的暴风雪，在此期间停了下来。</p><div class="location-badge"><strong>I C E L A N D : R E Y K J A V I K</strong><span>冰岛 ：雷克雅维克</span></div><p class="story-paragraph">巴士又从岛的东侧向西边长途移动了五个小时，直到深夜才到达冰岛首都雷克雅维克。这个城市和去过的北欧其他首都相比，就像一个小村庄。只是旼炡对周围环境的改变毫无兴趣，没有四处走动，反而直接去了房间。</p><p class="story-paragraph">喀哒一声，门被关上，紧张感一下子就缓解。在只足够一个人躺下的小小胶囊房间里，扔下感觉比平时更沉重的背包。结束一整天的长途旅行后，这瞬间，再次成为孤单一人。</p><p class="story-paragraph">突然感到口渴，把水咕嘟咕嘟倒进口中。如果一直这样静静地呆坐着，可能会产生不必要的情绪，这么想来便迅速洗完澡，钻进了被窝。然而睡意并不是那么容易就能酝酿出来，房间内静悄悄的，旼炡把脸埋在硬硬的枕头里，小声地自言自语。</p><p class="story-paragraph dialogue">「...我安全到达了」</p><p class="story-paragraph">连接网络后，短暂和漫长的震动虽然响起了几次，但却没有等到期待中的人。虽然并没有期待。不、如果说没期待过的话才是说谎。和矛盾的心情相反，身体像果冻一样瘫软。手机画面上显示的数字是10:00，那么伦敦是晚上11点。按照一直以来的习惯，是知珉睡觉前，打电话的时间。</p><p class="story-paragraph">没什么事吗？很累了吧。</p><p class="story-paragraph">我想你。</p><p class="story-paragraph">我也爱你。</p><p class="story-paragraph">不过，去了伦敦的刘知珉，不用再打这种形式上的电话了吧。当然，也不会想念独自留在冰岛的某人。见到思念的恋人，应该度过了非常温馨的时刻吧。可以在游乐园玩得很开心，谈天说地。</p><p class="story-paragraph">把被子盖到头顶，这才恍然大悟。一个人旅行，就没有人能谈论今天做了什么。这时，房间内的寂静显得有些悲伤。</p><p class="story-paragraph">旼炡在被窝内蜷缩着身子，又拿起手机。打开空白记事本，记下今天发生的事情。因为没有自信一个人记住一整天所见过的风景，感觉再过一天就会被忘得一干二净。因为，除了文字以外，没有什么东西可以留下。可惜的是，连一张照片都没有。</p><p class="story-paragraph"><strong>冰岛</strong><strong> </strong><strong>Day 1</strong><strong> </strong><strong>今日日程报告</strong></p><p class="story-paragraph">今天一大早就坐上巴士，最先到达的是水柱会砰地喷出的地方。其实这时候还没睡醒，记忆有点模糊。</p><p class="story-paragraph">中午吃了有生以来第一次看到的驯鹿汉堡...太腥了，整个都剩下了。虽然海边的风景不错，但非要说的话，邮轮上看到的大海更漂亮。</p><p class="story-paragraph">最后一站是蓝冰洞。这里很冷，不过是个像姐姐喜欢的迪士尼电影里会出现的场景，那样漂亮的地方。</p><p class="story-paragraph">逛了一整天，其实也没什么，总之就这样结束了。顺便说一下，照片一张也没拍。无论风景照、还是自拍照。</p><p class="story-paragraph">写着写着就成了书信，而非日记。即使这封信十分尴尬，那又如何。再看一遍，虽然文章内容不太流畅，但这种程度和平时写出来的分量相比，算奇迹般的长篇了。</p><p class="story-paragraph">旼炡将文字储存，并关掉了房间内的灯。在辗转了几个小时之后，才得以深睡。今天，没有闻到已经视为理所当然的香气，没有抚摸头发的手，也没有听到耳边传来“快睡吧”的低沉嗓音。</p><p class="story-paragraph">踏上冰岛后第一次独自入睡，是一个陌生又可怕的夜晚。</p><p class="story-paragraph">几个小时后，太阳重新升起，好像什么事都没有发生过一样。当天早晨，旼炡在身旁无人寂静的房内醒来，没有太过惊讶，只是一边揉着眼睛一边起身。知珉姐姐、起来了吗？在睡意朦胧的状态下，喃喃自语。已经是第二天了，下意识说出这些话，依旧无可奈何。</p><p class="story-paragraph">但是作为刚失恋的人，这种程度应该算还好吧。旼炡一边刷牙一边安慰自己。这时“嗡”的一声震动，因洗脸台上的声响迅速转移了视线。但那是来自辛勤工作的导游，以“Morning！”轻快标题开头的今日行程公告。</p><p class="story-paragraph"><strong>DAY 2</strong></p><p class="story-paragraph dialogue">-12:00 PM.<br>上午自由时间 12点到大厅集合</p><p class="story-paragraph dialogue">-01:00 PM.</p><p class="story-paragraph">蓝湖(Blue Lagoon)温泉</p><p class="story-paragraph dialogue">-05:00 PM.</p><p class="story-paragraph">前往大本营</p><p class="story-paragraph">旼炡莫名感到烦躁，咳了几下，还吞下了一点牙膏。幸好今天的日程比昨天宽松一些。离12点集合时间还有2个小时。外出太麻烦了，就这样待在房间，到中午再出去吧。想到这的瞬间，肚子就开始咕噜咕噜叫。这是非常正常的身理反应。毕竟昨天只吃了几块糖，连一顿正餐也没吃。</p><p class="story-paragraph dialogue">「...吃饭也算工作吧」</p><p class="story-paragraph">真是麻烦死了。人类的身体得在进食和润滑后才能工作。旼炡从一大早就开始碎念，拖着身体，走向酒店前的超市。</p><p class="story-paragraph">超市门上印有讨人厌的粉红猪，推开门后，眼睛扫视了一下陈列的食物。接着拿起几个自己吃过的东西，啪啪全放进购物篮。呆呆地靠着收银台，用眼睛估算后，心里咯噔了一下。不过拿了几片面包，就超过三万韩元，这像话吗？合理吗？</p><p class="story-paragraph">其实很合理。旼炡忽视了冰岛的物价是世界最高。而且之前伙食费的管理一直是由知珉负责，所以现在买吃的才会没有头绪，这也是原因之一。</p><p class="story-paragraph">旼炡啊，这些你都要买吗？</p><p class="story-paragraph">嗯。怎么了？</p><p class="story-paragraph">我说过多少次了。 这里物价很贵，必须吃多少买多少。</p><p class="story-paragraph">好麻烦啊，餐费姐姐能帮我处理就好吗？</p><p class="story-paragraph">干嘛把钱存在我这？我是你的银行吗？</p><p class="story-paragraph">天天听这些唠叨，就当存银行吧。</p><p class="story-paragraph">那么从今天开始财务紧缩，你不准发牢骚。</p><p class="story-paragraph">紧缩？...好疼，干嘛掐我的脸啊。</p><p class="story-paragraph">意思是从你的零食减半开始。</p><p class="story-paragraph">银行会这样关门大吉吗。要是早知道这样的话，就不会把饭钱交给刘知珉保管了，虽然她也不是拿着钱逃跑。总之旼炡急忙从排队结帐的队伍跳出来，把东西都回归原处。为了避免破产，不得不非自愿地继续紧缩财务，最终旼炡选了个松软的面包和酸奶。</p><p class="story-paragraph">旼炡步履蹒跚地从超市走出来，坐到前面广场的一角。现实问题还是令人很烦脑。没钱，面包又贵又不好吃。听说冰岛乳制品很有名，酸奶味道倒是不错，但是冬天吃起来有点凉。在抱怨的同时已经把早饭吃完，很快站起身。不知怎么的，来到冰岛之后，好像越来越常自言自语了，反正没人听得懂韩语，所以也不用在乎吧。</p><p class="story-paragraph">离中午还有一点时间。旼炡无所事事在广场逛了一圈。空旷的场地中央，矗立着一座颇有朝气的铜像，凋像后面是像隐形战斗机、火箭、宇宙飞船那类造型的建筑物。</p><p class="story-paragraph">冰岛的建筑大部分高度较低，如果高到这个程度，无论在城市何处看来都会很显眼。建筑顶端是钟塔，下面则是十字架，这也许是座教堂吧。在打开地图之前，正好看到墙上附有亲切的英文指示牌。</p><p class="story-paragraph">Welcome to Hallgrímskirkja!</p><p class="story-paragraph">北欧的专有名词实在不必要。如斯德哥尔摩大教堂的名字也很难发音。明明当时知珉给出了另一个名字，但不管怎么绞尽脑汁，就是想不起来。唯一留在记忆中的，只有斯德哥尔摩的瞭望台。因为那里的名字和知珉的洗礼名相同。所以名字、或许是——</p><p class="story-paragraph">是卡塔琳娜。卡塔琳娜瞭望台。旼炡似乎不想遗忘，心里再三回味这个名字，朝高高的教堂迈出脚步。</p><p class="story-paragraph">一推开厚重的门，巨大的管风琴就映入眼帘。清澈的音律在高耸的建筑内响起。也许这首歌是用于弥撒的前奏曲。旼炡望着集中演奏的管风琴手的背影，坐在最后一排椅子上。座位上三三两两的人们，正低着头祈祷。旼炡稍稍打量着戴在左手的戒指。回想起划十字的纤细胳膊、温柔地低垂着双眸、嘴里默念着什么的嘴唇，以及虔诚地转动默珠戒指的手。</p><p class="story-paragraph">不过姐姐的默珠戒指。</p><p class="story-paragraph">嗯。</p><p class="story-paragraph">不是说只在重要日子戴嘛，结果天天戴着呢。</p><p class="story-paragraph">来旅行后每天都戴着。</p><p class="story-paragraph">那不就显得没有特别意义吗？</p><p class="story-paragraph">因为都很有意义。</p><p class="story-paragraph">那最有意义的一天是什么时候？</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">在飞机上第一次见到我的时候？</p><p class="story-paragraph">不是，是昨天凌晨。</p><p class="story-paragraph">为什么？</p><p class="story-paragraph">因为你为了见我一步一步跑来。</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">还穿了这么漂亮的衣服。</p><p class="story-paragraph">…说什么呢。</p><p class="story-paragraph">钟楼响起了悠扬的钟声。管风琴的回音很快就停止了。同时，知珉坐在身旁祈祷的身影也消失无纵。坐在这里发呆了多久呢？旼炡怀着有点遗憾的心情，从座位上站起来，朝教堂上层走去。</p><p class="story-paragraph">到达顶层的电梯门，随着噪音慢慢打开。冰岛最高的瞭望台与自己的期待相反，呈现的风景十分简单。望向正前方到处都是小房子，远处连一艘经过的船只都没有，平静的大海静静地画出地平线。旼炡倚靠在瞭望台的墙上，以那平平无奇的风景为背景，拍了一张自拍照。只是照片上的表情，比在摩天轮上拍的还要僵硬。</p><p class="story-paragraph">真不怎么样。这时候还留什么纪念照啊，用眼睛看就行了。旼炡决定删除来到冰岛后的第一张照片，正想把手机放回口袋，可偏偏在删除后，看到了知珉随意拍下的照片。就像离别的礼物一样，原封不动地保存在手机相簿的五张自拍照。</p><p class="story-paragraph">...要删除吗？就这样直接删了吗？</p><p class="story-paragraph">然而别说删除了，还是忍不住一张张翻看。滑到最后一张照片，手再次停了下来。背景是夜晚漆黑的游乐园，熄了灯的林荫路。被风吹得微微飘起的刘海、大大的眼睛和漂亮的嘴角、嘴角下那一点比平时看起来模糊、以及那天晚上连晚安吻都没给的红唇。</p><p class="story-paragraph">照片中定格住笑嘻嘻的脸令人讨厌。虽然讨厌得不行，但还是用手抚过照片中微笑的知珉。</p><p class="story-paragraph">竟然还笑得出来吗？一点都不懂别人的心情</p><p class="story-paragraph">瞭望台不知何时变得空荡荡。伴随着刺骨的寒风，钟声再次响起。叮、叮、叮。旼炡低下头低声说道。</p><p class="story-paragraph dialogue">「刘知珉」</p><p class="story-paragraph dialogue">「你现在在哪里做什么？」</p><p class="story-paragraph">今天早上也喝了红茶吗。很好奇你有没有好好吃完水果才出门，也好奇你是不是扎了头发，套上总是穿着的马丁靴。还是只穿一件夹克硬撑着吗？应该没什么暖和的衣服，该穿什么好呢。如果是你的话，也许一到那里就立刻开始购物了吧。</p><p class="story-paragraph">不是说容易因为天气忧郁嘛。伦敦有着这世界最郁闷的天气，没关系吗？听说英国食物不好吃，你在吃什么。晚上还会喝你喜欢的红酒吗？</p><p class="story-paragraph">对每件事都很好奇，但无从得知。</p><p class="story-paragraph dialogue">「现在某人应该觉得心里舒服了吧」</p><p class="story-paragraph dialogue">「只要偷偷藏起来就像没发生过」</p><p class="story-paragraph dialogue">「我以为刘知珉不会说谎」</p><p class="story-paragraph dialogue">「还以为只是个整天乐呵呵、单纯的傻瓜呢...」</p><p class="story-paragraph dialogue">「你的演技真的很好，真厚脸皮」</p><p class="story-paragraph">虽然帽子压得很低，但晨风依然十分寒冷。用脚踢了一下无辜的墙壁，这才燃起压在心底的怒火。积蓄已久的悲伤，顿时成了夹杂着怨恨的话语，从口中迸发而出。</p><p class="story-paragraph dialogue">「你也知道自己很自私吧」</p><p class="story-paragraph dialogue">「想玩，又不想当坏人」</p><p class="story-paragraph dialogue">「离开之前可能觉得有点可惜吧？」</p><p class="story-paragraph dialogue">「所以才那么缠着我，说要去游乐园吗？」</p><p class="story-paragraph dialogue">「…你这傢伙真坏」</p><p class="story-paragraph">如果你像一阵风一样，不留余地就直接消失，那我呢。</p><p class="story-paragraph">我呢？</p><p class="story-paragraph dialogue">「必须给你留下最后的回忆吗？」</p><p class="story-paragraph dialogue">「比起划清界限后离开，这才是最糟糕的。知道吗？」</p><p class="story-paragraph dialogue">「是啊...就是因为不知道，所以头也不回就逃跑了吧」</p><p class="story-paragraph dialogue">「这样随便玩弄人，开心吗？」</p><p class="story-paragraph">明明曾经那么亲密地缠绵。</p><p class="story-paragraph dialogue">「你不是说过不要都是我自己作决定吗？」</p><p class="story-paragraph dialogue">「不是让我不要逃跑吗？」</p><p class="story-paragraph dialogue">「结果擅自决定的是你」</p><p class="story-paragraph dialogue">「...逃跑的也是你啊」</p><p class="story-paragraph">胆小鬼。</p><p class="story-paragraph dialogue">「连从我面前离开的勇气都没有」</p><p class="story-paragraph dialogue">「明明连说一句讨厌的话都做不到」</p><p class="story-paragraph">怎么能那么轻易就丢掉呢？</p><p class="story-paragraph dialogue">「你知道吗？你...」</p><p class="story-paragraph dialogue">「真的真的真的 最糟糕了」</p><p class="story-paragraph">旼炡靠在墙上，坐了下来，忍了很久的眼泪溃堤，顺着两颊流下。但是连擦去泪水的心思都没有，还依恋地用指尖抚摸着戴在手上的戒指。</p><p class="story-paragraph dialogue">「我连这个都舍不得丢掉…」</p><p class="story-paragraph">怀念着某人的手最后触及之处，已经凉透。</p></div>
      </section></template>

<p class="lyric-line">那样看着我吧</p></div>

        <div class="chapter-copy"><div class="location-badge"><strong>I C E L A N D  : B L U E  L A G O O N</strong><span>冰岛 ：蓝湖</span></div><p class="story-paragraph">到了中午，熟悉的面孔一个个聚集到大厅。旼炡把手插在羽绒服口袋，走向发出巨大引擎声响的巴士。原以为自己是最先上车的，结果只见昨天敲窗户时的白发老人。只好和堵在通道上、不怎么欢迎的邻座进行浅浅的眼神问候，接着把身体挤进狭窄的靠窗座位上。</p><p class="story-paragraph">阴沉的天气、和昨天一样的衣着、同一辆巴士上同一个邻座。尽管如此，连续两天在冰岛的风景依然很陌生。连窗外都看腻了，脑袋靠上前座椅背闭上了眼睛。到底做了什么，身体如此疲惫不堪呢？早上也只有去教堂里哭过而已。</p><p class="story-paragraph">幸好，今天的第一个行程就是温泉。这之后，为了看极光，将会持续坐车前往大本营，所以不会再有休息的时间了。换句话说，温泉体验就是最后的休息。因此日程安排太过宽裕，也不应该高兴得太早。</p><p class="story-paragraph">头靠前座打瞌睡的过程中，巴士行驶了一小时，很快就抵达目的地。爬上两边堆满石堆的山坡，离写有“Blue lagoon”的白色招牌入口处越来越近。蓝泉是位于雷克雅维克附近的温泉湖地区。以四周积雪为背景，天蓝色的温泉水有如加勒比海湾，一望无际。</p><p class="story-paragraph">换完衣服后，每人各自戴上分配好的手环，朝温泉走去。泥浆面膜这种基本选项被包含在行程里，而且似乎还会免费提供一杯酒。算是比普通门票还高级一点吗？</p><p class="story-paragraph">旼炡在冒着白烟的温泉中轻轻地浸湿脚踝。细滑的水质和适当的温度。在自己扑通扑通用脚玩水时，职员像供餐一样，用大勺子在人们的手上倒上白色的泥浆面膜。</p><p class="story-paragraph">怪不得大家都是团体旅客，自己弄真有点不好意思。看着眼色，一边左顾右盼走过去，捧起一小堆面膜，啪啪地涂在脸上。之前的旅行已经习惯随便逛逛，现在参加套装行程，这部分倒有些为难。在心里嘟嘟囔囔，接着滑进泉水，慢慢洗掉了泥浆面膜。只是不管怎么洗，脸都过份滑嫩。就像麦饭石煮成鸡蛋一样。</p><p class="story-paragraph">导游手忙脚乱地说，现在要点饮料了。是池畔酒吧？各种各样的酒精饮料被运送过来方便大家取用，可以在不出温泉的情况下饮酒。正当自己还蹲在水里用嘴吐泡泡，职员就来到了面前，在桌上留下了一杯写着Gull的缩胶杯。看来好像与选择无关，订单全都是默认的了。</p><p class="story-paragraph">好吧。毕竟是跟团旅游。</p><p class="story-paragraph">被云层遮蔽的阳光再次露脸，经过阳光照射，温泉水呈现翡翠绿色。旼炡肩膀以下全泡得严严实实，一口喝下黄澄澄的拉格啤酒。其实直到现在看到酒还是觉得头晕。在乘坐邮轮前往哥本哈根的那天，因为喝威士忌而睡得很香的记忆不可能忘记，毕竟也还是最近的事情。</p><p class="story-paragraph">...就那么讨厌我吗？</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">知道了。</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">我就按你想要的去做。让开不就行了吗。</p><p class="story-paragraph">不，不是的。</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">…就待在这里。</p><p class="story-paragraph">那...可以继续做吗？</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">为什么不回答？</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">…可以做吗？</p><p class="story-paragraph">如果那天藉着酒劲告白，情况会改变吗？如果没有睡着，那天晚上会怎么样呢？还不如别忍着，就直接做了。就算断得一干二净，那也比现在好得多。如果对她说喜欢，说是不轻易说出口的真心喜欢。如果那样说的话，究竟会用什么样的表情看着我呢？</p><p class="story-paragraph">到此为止吧。</p><p class="story-paragraph">到了现在想这些有什么用？</p><p class="story-paragraph">明知已是泼出去的水，却执着于过去的事情，真是可悲。啤酒已经喝得见底，脸颊立刻开始发烫。突然想起，刚才导游好像说过，这里的温泉中含有海水，泡太久可能会有脱水现象，所以要小心。感觉到头晕成了危险的信号，旼炡赶紧拖着摇摇晃晃的身躯，起身走向浴室。</p><p class="story-paragraph">温水一洒下，渐渐恢复精神。但是冰岛温泉中到底含有什么成份，发质变得很糟，但全身依旧光滑。虽然眼睛看不见，但总感觉留下了痕迹，心情非常不好。旼炡用手拍了拍脸擦干。奇怪地感到空虚和不自在。毫无摩擦的光滑触感。是不是因为泡太久了？可能是手都水肿了吧。接着看向镜子才突然醒悟过来。</p><p class="story-paragraph">戒指。</p><p class="story-paragraph">左手的戒指不见了。</p><p class="story-paragraph">原来原因不出在水中，而是现在手指上空荡荡的。突如其来的事件使太阳穴一阵阵刺痛。即使冷水淋在身上，心脏还是扑通扑通狂跳，热气不停上升。难道进温泉的时候连戒指都忘了摘吗？真不是傻瓜吗？包着头发的旼炡抠着无辜的指甲。怎么办，马上就要离开这里了，若要一个人进温泉里翻找，场地实在太大了。要现在马上跟导游说有遗失物吗？</p><p class="story-paragraph">这时，心中冷静的自我突然冒出来，这么说道。</p><p class="story-paragraph">有必要吗？为了找这么点大的戒指，想把温泉水都倒掉吗？如果找到了，又有什么不同。刘知珉就会从伦敦回来吗？在自由市集上买的廉价戒指，你要一直戴到什么时候。为何还要执着于已经过站的公车。</p><p class="story-paragraph">刘知珉抛弃金旼炡离开了。</p><p class="story-paragraph">就是不争的事实啊。</p><p class="story-paragraph">直到自己入睡的最后一瞬间，一直演得那么好。</p><p class="story-paragraph">呼。忍不住深深叹息。知珉的存在对自己来说，就像在皮肤上洗不掉的光滑温泉水。旼炡故意把身体洗到皮肤变红为止，才决定静下心来，不再因为一点琐事就陷入与知珉的回忆。因为，每当看到什么东西就赋予其意义，这样的行为比想象中要痛苦。越是停滞不前怀念过去，悲惨的也只有自己。</p><p class="story-paragraph">此刻，被划开的伤口火辣辣生疼，因为怕痛，只能赶紧擦去所有，将一切尘封。这就是旼炡一直以来面对离别的方式。虽然很笨拙，但也是最简单的应对方法。现在这个瞬间也一样。</p><p class="story-paragraph">不是说这是愿望清单吗？</p><p class="story-paragraph">既然要去就往好处想吧。</p><p class="story-paragraph">是啊。正如刘知珉所言，既然来到这里，就应该往好处想。今天状态有比前一天好，明天早上会不会更好呢？在冰岛待着，到处走走看看，回忆或许就会变得模糊。再也不会下意识呼唤那个名字了。说不定回到韩国的时候，就完全忘记了，反正我们本来就是陌生人，只是暂时的缘分而已。</p><p class="story-paragraph">旼炡用毛巾擦拭着未干的头发。金黄色发根，不知不觉间长出不少黑色头发。回去的话得再重新染一次了。想着还是干脆剪成短发吧，一边压低了帽缘。</p><p class="story-paragraph">好不容易才来到这里。</p><p class="story-paragraph">是为了看期待已久的极光。</p><p class="story-paragraph">不想以这样的心情去。</p><p class="story-paragraph">回想起来，当初是为了好好整理与前辈的关系，想好好在冰岛结束自己的20岁。带着这种心情来到这里，却被如同彗星降落般登场的某人给扰乱。</p><p class="story-paragraph">刘知珉</p><p class="story-paragraph">一切都是因为刘知珉。</p><p class="story-paragraph">越是看着镜中的自己，越感到无力。原来昨天和今天，一直都是一副傻瓜一样的表情。旼炡想既然已经决定放弃，就更深刻地回忆过去的痛苦吧。没有任何承诺，只相信着爱情撑下去的那些日子。被珍视的某人刻印为不存在的那些时间。回忆起当时，心中还是隐隐作痛。可现在，迫切需要那句伤了自己许久、如匕首般的话语。为了尽快擦去知珉的痕迹，不让伤痕再次加重。</p><p class="story-paragraph">你知道吗？</p><p class="story-paragraph">看着极光许愿的话 一定会实现</p><p class="story-paragraph">这和朝喷水池中扔硬币有什么区别吗？</p><p class="story-paragraph">想真心相信20岁生日那天，听到的那句傻话。不，必须无条件相信。如果冰岛的极光能够实现愿望的话，现在旼炡迫切希望的就只有一件事。</p><p class="story-paragraph">把时间倒回旅行之前。回到乐团之类平凡的日常生活。就像什么事都没有发生过一样，迎接1月1日生日。不认识刘知珉的金旼炡，希望把两人相遇的所有瞬间，都化作泡影。</p><p class="story-paragraph">像这样拼命乞求，会不会有人答应呢？</p><div class="location-badge"><strong>I C E L A N D : B A S E  C A M P</strong><span>冰岛：大本营</span></div><p class="story-paragraph">到了晚上，整辆旅游巴士沉浸在兴奋的氛围里。毕竟今天是当极光猎人的第一天，包括旼炡在内，第一次到冰岛的大部分游客，都对此充满期待。巴士停在雷克雅维克西北侧的一个偏僻露营区。面对空旷的视野，还是让人有些心潮澎湃</p><p class="story-paragraph">在导游的指使下，人们分别在各处搭下今晚要住的帐篷。另外，作为公共休息空间，在大本营中心地还设置了能容纳10人以上活动的大型帐篷。里面附有用皮毛复盖的椅子及热饮。在准备露营的过程中，天空渐渐暗了下来。不知不觉间，帐篷内开始透出淡淡的黄色灯光。除了营区以外，环顾四周完全没有人造灯光。</p><p class="story-paragraph">住在旁边帐篷里的，是一对上了年纪的老夫妇。本来还想那位丈夫的脸怎么有些熟悉，仔细一看，原来是坐在自己旁边的老爷爷。旼炡偏偏又和这对老夫妇成为邻居，再次尴尬地打了招呼。</p><p class="story-paragraph">老两口说他们来自意大利。特别看到这个脸上毫无皱纹的小孩在搭帐篷，也到旁边帮忙，并开始唠唠叨叨地搭起话来。是从哪个国家来的，是不是一个人来的。虽然只想一个人静静待着，但旼炡还是带着微笑向他们表示感谢，并进行了简短的对话。</p><p class="story-paragraph">搭到一定程度后，导游在金字塔帐篷前点起篝火，开始烤棉花糖。人们像飞蛾一样聚集到篝火周围，旼炡也拿出一张简易椅子坐在前面。棉花糖被烤得焦甜的味道刺激味觉，但不知为什么，就是毫无食欲。想想看，这两天除了糖果、面包、酸奶以外，什么都没吃，这程度简直就和没吃东西一样。早上肚子还挺饿的，但饿到现在却没什么感觉了。这是不是自己第一次这么不按时吃饭呢？</p><p class="story-paragraph">就你这么吃饭，怎么有办法旅行一个月？</p><p class="story-paragraph">量也不多，得全部吃掉才行啊。</p><p class="story-paragraph">虽然想起了某人的责怪，但旼炡似乎是想要极力回避，对食物一概不予理睬。来到冰岛后，彷彿能听见身体削瘦下来的声音。和经常早饭吃得饱饱的某人一起旅行时相比，手腕好像变细了不少，但那又怎样。</p><p class="story-paragraph dialogue">「…只要不倒下就行了」</p><p class="story-paragraph dialogue">「今天的天气对极光的出现，算是好日子吗？」</p><p class="story-paragraph">有人这么问道，导游则挑着眉回答。虽然很难预测具体情况，但根据周期是有一套标准的。首先重点是季节。据说，极光季节通常是9月到4月，其中，日照变短的严冬是最适合观赏极光的季节。也就是从季节上看，现在正是最佳时期。</p><p class="story-paragraph">第二点是月球周期。一般来说，月亮的大小越小，极光越明显，因为必须是完全黑暗的天空，所以最好不要是满月升起的时候。正好，头顶上挂着的只有微弱的月牙。一般来说，在满月前后2-3天左右，极光照射会非常清楚，之后大概4-5天则可能模糊不清，周期就是这样反复。这几天来冰岛一直都是阴天，所以今天或明天很有可能再次转为晴空，倒也不坏。</p><p class="story-paragraph">第三点是当天的天气。由于极光是在低空飘浮，若云层遮蔽，用肉眼就看不到了。第一和第二条件都满足了，可惜今天的天空一直雾茫茫的。听到这句话后，一度沸腾的气氛变得有些沉闷。导游说冰岛有句俗话“即使现在天气不好，也要再等5分钟”，缓解了阴沉的天气下焦急的人心。</p><p class="story-paragraph">旼炡的老伙伴把眼镜放到头顶上，盯着小小的手机屏幕看。老年人看不到近的，这句话看来没错呢。我老了也会变成那样吗，回家后要马上补充叶黄素吗？旼炡一边为日后的自己担心不已，一直盯着旁边看。</p><p class="story-paragraph">老爷爷认真盯着的，是导游推荐给大家的极光观测app。旼炡看了眼严重老花眼的老同伴，也开启了应用程序。My Aurora Forecast。功能是像气象预报一样，能预测特定位置、特定时间点的极光强度。</p><p class="story-paragraph">通常，极光活跃度被标记为KP指数，分为1到10个等级。今天的KP指数是最低的1，云的分布度是100%。到明天上午，也只升到2。一般来说，该指数达到3以上才能用肉眼见到，达到5以上就能看到非常美丽的极光。而7-8级以上就真的是运气好才能出现的天空。</p><p class="story-paragraph">结论，今天晚上是不适合当极光猎人的日子。</p><p class="story-paragraph dialogue">「最后最重要的，就是瞬间的运气」</p><p class="story-paragraph">瞬间的运气其实不算什么。由于极光是太阳中产生的粒子与地球大气碰撞产生的结果，因此，如果太阳黑子爆炸或太阳表面出现日冕洞，看到极光的可能性也会因而增大。但这属于突发现象，很难进行预测，导游也进行了长篇大论的说明。</p><p class="story-paragraph">听着听着，不禁让人怀疑究竟能不能亲自用双眼看见那片极光。如果已经战胜了这一切，但没有瞬间的运气，真的可能只看着这样阴沉天空就离开了。旼炡嘟起下唇，对着天空发牢骚。阴暗的乌云留给刘知珉就好了，为什么跟来冰岛。</p><p class="story-paragraph">Hey~</p><p class="story-paragraph">这时，旁边有人突然递出一根棉花糖串。惊讶地看向对方，果不其然，是隔壁的好邻居。在心情低落的时候总是关心我，好像有点产生感情了。</p><p class="story-paragraph">对于对方问自己为什么不吃，旼炡只回答说没什么胃口。当然，棉花糖只是开始对话的跳板，旼炡与有缘的邻居已经不再是简单对话，而是开始进行漫长的谈话。当被问到来冰岛之前是否去过别的城市时，旼炡跳过其他城市，只说了哥本哈根。</p><p class="story-paragraph">我也喜欢哥本哈根。那里有很古老的游乐园，你去过吗？旼炡只是点了点头。但是，又被问到是不是自己一个人去的时，不得不暂停下来。这样下去像个奇怪又忧郁的孩子了啊。一个人去游乐园，又一个人来看极光。</p><p class="story-paragraph">自己一个人坐得好好的，还费什么心管别人呢。</p><p class="story-paragraph">只是，应该会觉得是个没有朋友的人吧。</p><p class="story-paragraph">等等、下定决心要忘记才过了多久？不要再去想起这些琐碎的事情，现在开始从记忆中一点点抹去吧。旼炡用力地摇了摇头。但旁边的人好像毫不在乎别人脑中一团乱，老爷爷嘴里像装了马达一样，快速地用英语说着。他是在那座摩天轮底下求的婚，接着和妻子结婚了，听说今年是结婚40周年，但从来没来过冰岛，所以就来旅行了。</p><p class="story-paragraph">每一个字都像是给自己重重一击，但也无法从篝火旁离开，只是静静地听着。这就是参加旅行团最大的问题。旼炡在一旁聆听70年代意大利人的浪漫爱情故事，开始吃起手中的棉花糖。</p><p class="story-paragraph">为什么在摩天轮上求婚成功率高？为什么喜欢选在日落时分？还有比平时更加直率的台词的重要性。听着蕴含意大利爷爷人生精髓的恋爱学讲座，已经足足过了两个小时。旼炡在课堂上一边吸鼻涕，一边点了数百次头。</p><p class="story-paragraph">可能是待在外面太久，在篝火前坐着的身体也凉了。别说是极光，连一颗星星都看不见，只见大家的表情都黯淡下来。甚至，篝火上开始飘落一滴滴雨点。等待的人们也一个个钻进了各自的住处。旼炡也离开座位，走向身后小巧的帐篷。</p><p class="story-paragraph">淅淅沥沥的细雨丝毫没有停止的迹象。话又说回来，待在极光Spot，下雨后还真是无事可做。网速太慢，看什么都不行，在帐篷里闲晃又很冷，一天就要这么过去了吗？运气真差。</p><p class="story-paragraph dialogue">「时间多得是，要不整理一下背包...」</p><p class="story-paragraph">被迫享受闲暇时光的旼炡，卷起了两边袖子。从赫尔辛基开始，一路陪着自己长途跋涉的背包，不知不觉间装满了不必要的杂物。其中当然包括知珉留下的东西。为了将这些痕迹全部扔掉，旼炡把包翻了个底朝天。</p><p class="story-paragraph">虽然初衷是好的，但行李中大部分都是冬装，能马上扔掉的东西，也只有从昨天开始一点点吃掉，已经空空如也的糖果玻璃瓶。吃得真香。这个可以直接扔了吧。</p><p class="story-paragraph">接着，旼炡翻出塞在羽绒服口袋内的手套。这可怎么办？毕竟暂时还会待在雪原中，如果没有手套的话...是吧？如果刘知珉当时坚持己见，送的是一件带蕾丝的奇怪衣服，自己一定会马上扔进垃圾桶。但这个还是再用一会儿吧。只要离开冰岛，就会立刻扔掉的。</p><p class="story-paragraph">与旼炡所想不同，整理完的背包，大小和刚才一模一样，还是鼓鼓的。在帐篷里哼着歌，想起了来旅行之前，收拾行李的那一天。当时明明根本没有旅行的想法，无所事事躺在床上，结果一天之内全都收拾好了。拿起钱包，里面乱七八糟夹杂着各个国家的纸钞。说实话，有些甚至不知道是哪个地方的钱，所以也不敢乱收拾。记得的只有在二手市场被骗的、没能在咖啡店内使用、让自己丢尽脸面的挪威旧钞。</p><p class="story-paragraph">还有前辈和自己一起拍的照片，也是原封不动地放着。稍微往室外看，篝火似乎还残存着火苗。旼炡毫不犹豫取下那张照片，放进篝火堆里，静静地坐在一旁看着。没过多久，照片就烧没了。</p><p class="story-paragraph">再见，慢走。</p><p class="story-paragraph">寒风呼啸而过。虽然现在心中愿望有所改变，但当初旅行就是为此而来。忘却比想象中还要平淡，心情非常暧昧。虽然还是会感到可惜，但也没有很伤心，也不是很痛快。然而这全都不是对前辈的感情。</p><p class="story-paragraph dialogue">「…我好像忘得比想像中要快呢」</p><p class="story-paragraph">用没人听得懂的语言喃喃自语后，旼炡重新回到了帐篷。在拉上外侧拉链时，脑海中突然浮现和知珉最后一天的残影。很快就明白了，还没有整理干净。背包最底下，装着最应该丢弃的第一名——对旼炡来说毫无用处的东西。那就是，自私的刘知珉扔下的一瓶香水。</p><p class="story-paragraph">这大概是他们两人用的情侣香水吧。这么一想还真是不爽。白白带来这遥远的冰岛。刘知珉男朋友的东西我到底为什么要留着？马上扔掉，现在马上。</p><p class="story-paragraph">就像受到诅咒的物品一样，旼炡一把抓起香水，再次走出帐篷。但是，对自己该往哪去却毫无头绪。应该把液体丢到哪才好呢。直接洒在雪上没问题吗。但是与瓶身相连的盖子比想象中难打开。可能因为像主人，所以香水也很固执。旼炡费尽全身力气，和小小的香水瓶打了一会架，大步走向离营地不远的地方。</p><p class="story-paragraph">咔嚓——</p><p class="story-paragraph">这时脚下发出的声音不妙。随着某种东西碎裂的一声巨响，一侧膝盖滑入雪坑。虽然瞬间伸手扶地，但周围没有积雪，只能摸到冰。没看着脚走路结果掉到冰面上了吗？徒手抓着刺骨的冰，手冻得厉害。</p><p class="story-paragraph dialogue">「好疼...」</p><p class="story-paragraph">再加上，随着膝盖着地，可能是被石头或冰块撞得正着，关节处越来越刺痛。四周一片漆黑。唯一看到帐篷灯光十分遥远，到现在雨还在淅淅沥沥地下，连导游都没有待在外头。</p><p class="story-paragraph">旼炡想尽办法把脚撑在地面上，不停挣扎着。但是，由于身体向一边倾斜，已经破碎的冰坑裂得更深。随着哐当一声，连腰都掉进坑洞里了。两手指节僵硬得几乎冻伤，一点儿也动弹不得。随着重量越来越重，手臂肌肉颤抖不已。很明显目前状况十分危急。</p><p class="story-paragraph dialogue">「…真是要疯了」</p><p class="story-paragraph">早知道就多运动了。即使事后后悔，纤细的手臂也没有更多力量。呼吸随着时间的流逝变得粗犷，吐出白色水气的嘴唇也干裂了。难道要死在这种地方吗？偏偏来到这毫无人烟之地。不但下着雨，还没看到极光，只是处理完刘知珉丢下的礼物，就这样凄凉地迎来人生尽头。</p><p class="story-paragraph">真是太不幸的结局了。</p><p class="story-paragraph">我才20岁啊？</p><p class="story-paragraph">这时，有人拉着自己的手向上拽。是等待已久的王子... 不，救世主并不是刘知珉小姐，而是年老体弱的意大利老爷爷。旼炡的身体被轻松地拉了起来，好不容易从破碎的冰面逃出。面对这位询问她是否没事的邻居，从来没那么高兴过。</p><p class="story-paragraph">这附近有很多浅的冰面，不是说了不要走过来嘛，没听见吗？瞬间放松警惕的旼炡，没能完全听懂爷爷带有口音的英语训话，而是先喘了口气。</p><p class="story-paragraph">和这种酷寒之地果然不合。昨天在蓝冰洞就已经很惊险，今天竟然掉进了陷阱般的雪坑。幸好保住了性命，还是感觉有点丢脸。用尽力气重新站起来的瞬间，爷爷把掉在地上的东西递给自己。造成这一切事件的元凶。</p><p class="story-paragraph">香水。</p><p class="story-paragraph">刘知珉扔下就跑了的该死的香水。</p><p class="story-paragraph">不会是为了让人掉进雪坑而受了诅咒的吧？</p><p class="story-paragraph">旼炡结合了事实和谎言，这样说道。有人送了自己礼物，但不太喜欢这个香味，所以想扔掉。如果喜欢的话爷爷可以拿走。完全是新的。于是，老爷爷亮出眼睛底下的眼睛，说自己会好好用，就这么把香水拿走了。虽然回去的路上，只能一瘸一拐艰难地走回帐篷，但至少达成了目的，心里轻松不少。</p><p class="story-paragraph">解决。</p><p class="story-paragraph">看都不想看见，终于扔掉了。</p><p class="story-paragraph">阿嚏、阿嚏、阿嚏</p><p class="story-paragraph">连续打了三次喷嚏。到了就寝时间，在帐篷内铺上睡袋，把毯子裹得严严实实，躺在床上，身体却还是瑟瑟发抖。难道是感冒的征兆吗？毕竟刚才掉进雪地里挣扎了半天。看着极光许愿也因为天气而推迟了一天。尽管如此，如果正面思考，也许这一天扔掉的东西比自己想像中要多。最重要的是，把知珉的香水丢给别人后，心情似乎有比较舒畅。</p><p class="story-paragraph">在睡袋里翻来复去，想着还有什么可扔的，旼炡拿起手机。想想也不能光扔手边的东西啊，手机里储存的也要全部清除。恰好，手机内有一封昨晚写好的、没有给任何人看过的信。稀稀落落的句子，连小学生的假期日记都不如，重读一遍都觉得不好意思的信。但是，还是令自己犹豫不决。也不是亲笔信，只要用手指按一下就会消失。</p><p class="story-paragraph">旼炡把手放在毛毯上，呆呆地看着帐篷的棚顶。手背上到处都是伤痕。这是刚刚在抓冰块时留下的伤口。但是似乎还没有到需要涂药的程度，决定不去理会。现在根本也不在意天气原因让手变得粗糙了。在睡袋内翻腾了一段时间，不知哪来的想法，不仅没有删除昨天的信，反而打开新的备忘录，在题目栏上输入。冰岛 Day2。</p><p class="story-paragraph">绝对没有寄出的想法。</p><p class="story-paragraph">只是觉得记忆会变得模糊，所以还是纪录下来。</p><p class="story-paragraph"><strong>冰岛 Day 2</strong><strong> </strong><strong>今日日程报告</strong></p><p class="story-paragraph">今天早上去教堂，突然想起我们一起登上瞭望台的那一天。是卡塔琳娜瞭望台，对吧？（事实上今天去的教堂名字是...不知道）</p><p class="story-paragraph">只照了一张相就删掉了。那里好像是整座城市最高的地方，真想知道伦敦最高的地方是哪里，应该比这里华丽多了吧。现在我来看盼望已久的极光，但因为下雨了，所以第一夜好像就这么结束了。</p><p class="story-paragraph">还有现在写这个的理由。<br></p><p class="story-paragraph">本来想装作若无其事撑下去，果然还是太累了，今天作为最后，已经尽量抹去       对你的记忆。其实戒指已经不见了...</p><p class="story-paragraph">刚才也扔掉了你留下的香水。送我的手套，也打算回韩国之前扔掉。那么，现在已经没有什么能让我想起你的。至少，我能做的好像都做了。今天本来不想写出没头没脑的东西，果然写信不适合我吧？</p><p class="story-paragraph"><br>所以这份日程报告是最后一次了。</p><p class="story-paragraph">有没有写出比昨天自然的文章呢？但是，怎么样都无所谓。反正这个不会传达给刘知珉，只是为了整理心情而写的。不会传达给任何人的信，竟然是人生中写得最长的一封，真可笑。就因为这样，最后连知珉的名字都没提到一次，连再见这两个字都没能说出口。</p><p class="story-paragraph dialogue">「真是的。我也真...不像话」</p><p class="story-paragraph">自嘲地说着，其实心里还是很痛。虽然不想都到这来了还一直哭，但一个人在空无一人的帐篷里，简直就像在拍电视剧，又想哭了。不想每天都这样以泪洗面。真的。</p><p class="story-paragraph">旼炡把膝盖合拢，低下头。默默地待着，膝盖上盖着毛毯的部分却感觉刺痛。刚才脚踩空，膝盖和地面撞了个正着，也许是受伤了吧。怀着不安的心情，把裤子往上拉，只见膝盖中间肿得厉害，还带着血泡。这样没问题吗？明天应该就能走了吧。在旅行期间没人照顾，生病了就真的完蛋了。</p><p class="story-paragraph">唉。叹了口气，旼炡解开了塞满的背包，拿出药箱。药箱比想象中装得满满当当的，重量也相当大。有点奇怪，带过来的时候肯定不是这种手感。</p><p class="story-paragraph">而且其中放有很多没带的药，甚至还有维他命之类的。这些东西绝对、绝对不可能是从家里带来的。甚至，连不知是否含抗生素的药膏也备齐了。还想过要不要去隔壁聒噪老爷爷的帐篷借药，但看来好像没必要。算是好事吧。</p><p class="story-paragraph">旼炡在膝盖涂上软膏，贴上了大大的创可贴。顺便在手背上留有伤痕的部分也涂了点药。这才感到伤口火辣辣地疼。来冰岛才第二天就把自己搞得这么凄惨，真该小心点。为了扔掉香水受到诅咒，这么辛苦这算什么啊。旼炡独自待在的帐篷里，生疏地一边治疗一边嘟嘟囔囔。</p><p class="story-paragraph">适当的收尾后，把药膏放回原位，视线转向了透明的药箱。里面装满了莫名其妙的纸张。看到这些意想不到的东西，旼炡干脆将箱子也翻了个底朝天，五六张便利贴尺寸的纸条飘了下来。</p><p class="story-paragraph">这是什么？</p><p class="story-paragraph">旼炡愣了一下，把纸条一一打开。上面整齐地一笔一划写着字。与用手机备忘录随意乱写的信件相比，看得出无法与之比拟的诚意。</p><p class="story-paragraph"><strong>药箱太糟了 就多买了几个放在里面</strong><strong>~</strong><strong><br></strong></p><p class="story-paragraph"><strong>注意！这不是垃圾，不能扔。 </strong></p><p class="story-paragraph">...什么时候还写了这个？</p><p class="story-paragraph">正在想下一张纸条上怎么写了那么多东西、画得密密麻麻毫无空白处，甚至用箭头贴心地附上说明。就像老师为小学生画的图画日记一样。</p><p class="story-paragraph"><strong>怕可能会混淆，所以记下来吧。 </strong><br></p><p class="story-paragraph"><strong>首先，白色的小药丸是止痛药。然后红色的胶囊是退烧药。黄色是感冒药。不难区分吧？ </strong></p><p class="story-paragraph">下面还字迹斑斑留下小小的附注。其实买综合感冒药就可以了...这算是我的失误。旼炡看着纸条，觉得这发言太像知珉了，不禁小声笑了出来。明明可以显摆一下，何必要把心里话这样写下来呢。</p><p class="story-paragraph dialogue">「…总之，还是不用心」</p><p class="story-paragraph dialogue">「我只是身体有点不舒服」</p><p class="story-paragraph dialogue">「没必要买这么多啊。好浪费...」</p><p class="story-paragraph">虽然不是说给某人听，但依然自言自语般说了出来。只是一张一张看着这些纸条，感觉就像是坐在一起聊天。明知只是假象，但无论如何都不想从那种心情很好的错觉中醒来。</p><p class="story-paragraph"><strong>这个维生素我也是第一次见，不知道效果好不好。(其实是因</strong><strong>为</strong><strong>线包装很可爱才买的啦)</strong></p><p class="story-paragraph"><strong>以后回韩国吃吃看！ </strong><strong><br></strong><strong> </strong></p><p class="story-paragraph"><strong>我偷偷吃一个不算</strong><strong>秘</strong><strong>密</strong><strong><br></strong></p><p class="story-paragraph"><strong>啊对了。连一条药膏都没有，就买了一个。虽然不可以受伤</strong><strong>...</strong></p><p class="story-paragraph dialogue">「...刚刚已经涂了」</p><p class="story-paragraph dialogue">「我都不知道是姐姐给我买的」</p><p class="story-paragraph">每确认一张纸条时，手都会颤抖。就像发现不可思议的宝物的孩子一样，心底怦怦直跳。旼炡把刚刚才治疗过的膝盖忘得一干二净，跪在地上翻箱倒柜。里面还有几个，赶紧拿在手中打开看看。</p><p class="story-paragraph"><strong>几天前乖乖吃粥终于打起精神的小鸟宝宝。</strong></p><p class="story-paragraph"><strong>幸好没去医院就康</strong><strong>复</strong><strong>了，真是万幸。</strong></p><p class="story-paragraph"><strong>所以不要碎念 平常也要按时好好吃饭</strong></p><p class="story-paragraph"><strong>暂且由我来检查你有没有乖乖吃东西。  </strong></p><p class="story-paragraph dialogue">「…骗人」</p><p class="story-paragraph dialogue">「光是说得这么贴心」</p><p class="story-paragraph">明明现在一点都不关心我做了什么、吃了什么。刚才我滑到差点死掉都不知道。姐姐对现在的我一无所知不是嘛，为了装傻才逃跑的不是嘛。</p><p class="story-paragraph dialogue">「我...昨天吃了面包和酸奶」</p><p class="story-paragraph dialogue">「今天只吃了棉花糖」</p><p class="story-paragraph dialogue">「饮食检查到底什么时候才做？」</p><p class="story-paragraph dialogue">「姐姐为什么只顾自己说完，结果每天都忘了？」</p><p class="story-paragraph">再底下的不是纸，而是印着画的小卡片。这是在奥斯陆的市集上买的。很可爱吧？是知珉炫耀般展示给自己看的小小明信片。一只望着极光的白色狐狸。在狐狸的旁边，画上了一个与知珉长得很像的女孩的侧脸。看到这普通的小涂鸦，一瞬间，心痛的旼炡终于还是哽咽起来。</p><p class="story-paragraph">姐姐你觉得我像什么季节？</p><p class="story-paragraph">果然还是冬天吧。</p><p class="story-paragraph">为什么？</p><p class="story-paragraph">我初次见到你，就想到一只白色狐狸。</p><p class="story-paragraph">白色狐狸？</p><p class="story-paragraph">嗯，不过虽然是冬天…</p><div class="scene-divider" aria-hidden="true">· · ·</div><p class="story-paragraph">但还是换成夏天吧。</p><p class="story-paragraph">怎么了？</p><p class="story-paragraph">因为你是只很怕冷的狐狸。</p><p class="story-paragraph dialogue">「小鸟、小狗、姆明、白色狐狸...」</p><p class="story-paragraph dialogue">「你到底觉得我是什么？」</p><p class="story-paragraph dialogue">「从来不把人当一回事呢」</p><p class="story-paragraph dialogue">「还有这幅画也是假的」</p><p class="story-paragraph dialogue">「...现在狐狸旁边什么都没有」</p><p class="story-paragraph"><strong>你什么时候才会看到这个呢？ </strong></p><p class="story-paragraph"><strong>好想快点看到你吓一跳的表情。</strong><br></p><p class="story-paragraph"><strong>这可是我精心准备的惊喜啊。</strong><br></p><p class="story-paragraph"><strong>每天都在等，但你完全没有想打开看看吧？</strong></p><p class="story-paragraph dialogue">「刘知珉，如果你的目的是让我哭的话，那你成功了」</p><p class="story-paragraph dialogue">「没能看到我好笑的脸，真是太可惜了。是吧？」</p><p class="story-paragraph dialogue">「现在...一点都不想我吗？」</p><p class="story-paragraph dialogue">「哪有准备了惊喜结果逃跑的人啊」</p><p class="story-paragraph">旼炡犹豫了一下，打开了最后一张便条。现在手中的纸条，也许是知珉留下的最后一封信。因为时间差，这段对话一次都没能听到回答。虽然可惜，结束已经近在眼前了。</p><p class="story-paragraph"><strong>你...刚才睡觉的时候衣服都翘到腰上了 是我放下的</strong><br></p><p class="story-paragraph"><strong>真是邋遢。</strong></p><p class="story-paragraph"><strong>但是今天我们本来打算去哪里来着。</strong></p><p class="story-paragraph"><strong>（如果</strong><strong>为</strong><strong>了问这个叫醒你的话 会生气吧？）</strong></p><p class="story-paragraph"><strong>（那我就安静地等你...）</strong></p><p class="story-paragraph"><strong>我正在喝早茶！你还在被窝里。</strong></p><p class="story-paragraph"><strong>快起床吧。 </strong></p><p class="story-paragraph"><strong>P.S.</strong><strong> </strong><strong>我这也有很多你睡觉时的照片好吗？敬请期待。</strong></p><p class="story-paragraph">视线已经变得模糊不清。已经看不见知珉留下的字了。旼炡最终还是将一直以来忍耐的眼泪全都爆发。剧烈跳动的心脏，又开始阵阵抽痛。膝盖上的伤口也再次疼痛起来。在帐篷内包着毯子躺着，却冷地浑身颤抖。</p><p class="story-paragraph dialogue">「刘知珉，真的...」</p><p class="story-paragraph dialogue">「真的...太过分了...」</p><p class="story-paragraph">你明明总是有很多话想说。</p><p class="story-paragraph">离开的时候怎么能一句话都不说就走了呢。</p><p class="story-paragraph">好不容易消除了你的痕迹。</p><p class="story-paragraph">对我来说真的下了很大的决心。</p><p class="story-paragraph">为什么连这一点都不让我做？</p><p class="story-paragraph dialogue">「笨蛋」</p><p class="story-paragraph dialogue">「现在才看到这个、让我怎么办...」</p><p class="story-paragraph">这天晚上身体几乎动态不得，没能睡个好觉。好像做了噩梦，但内容却记不起来了。半夜惊醒了两三次，每次醒来身体都被冷汗浸透，就这样一直到了早晨。就连从睡袋中起身也不容易。这比在赫尔辛基得到的感冒还要难受，身体非常热。</p><p class="story-paragraph">旼炡从睡袋里，几乎是一颤一颤地爬出来，抓起药箱内知珉写下的各种感冒药，一口吞下。接着像晕倒一样又睡着了。</p><p class="story-paragraph">眯着眼大概就可以感觉得到，太阳已经升起。期间好像有人走进帐篷，总向自己搭话，但自己每次都像晕倒一样，昏睡过去。旼炡真正睁开眼睛，就已经是太阳下山前了。能知道已经到了傍晚，是因为柴火燃烧的声音和呛鼻的味道。</p><p class="story-paragraph">而现在眼前出现了表情严肃的两个巨大人影。是导游和邻居爷爷。两人走进帐篷，先给自己送了食物和咖啡，问自己还好吗。当下正好热得满头大汗，手背上全是伤痕，膝盖上还有大块大块的淤青。本想着这真够瞧的，可旼炡目前只能勉强坐起上半身。</p><p class="story-paragraph">导游说，如果需要可以先回到雷克雅维克。但是旼炡不想去，虽然感觉要死了，可还是不想就这样离开。所以只能说服他们说，就忍到今晚，刚才吃了药应该没事的。两人脸上虽然满是担忧，但也只能告诉旼炡，只要健康状况进一步恶化，随时都会叫救援队过来，就这样离开了帐篷。旼炡像昨晚一样，呆呆地望着帐篷棚顶。</p><p class="story-paragraph">到底睡了几个小时呢？</p><p class="story-paragraph">整个人就像在昏迷状态下打点滴，精神恍惚。首先用热毛巾擦拭湿透的身体。接着紧紧围着帽子、围巾和毯子坐在篝火旁，并吃了当天的第一顿饭。心里想着，即使消化不良也没办法，硬是把什么都往嘴里塞，终于填饱肚子。</p><p class="story-paragraph">今天的KP指数是5，云的分布度是20%。</p><p class="story-paragraph">虽然指数看来比较合适，但还没有出现极光。不过导游反复强调，其实就算是KP指数高的日子，也不一定能看到极光，所以重要的是要等待每个瞬间，才能捕捉到那片美景。</p><p class="story-paragraph">此外，图表还显示该露营地所在的地区，1小时内KP指数将大幅上升。顺利的话，KP指数将达到8，也就是可以看到非常鲜明的极光，怪不得人们的表情比昨天开朗多了。旼炡决定拿出事先准备的相机和三脚架，先进行设置。本来还觉得只是占位置和增加负担，到今天终于拿出来，心情还不错。但身体状况果然很糟糕，呼吸有些困难，好在并没有像刚才那样直接晕倒的程度。这也许得多亏刚才勉强自己填饱了肚子。</p><p class="story-paragraph">旼炡用冻僵的手摆弄相机。曝光设定在几秒钟才能拍到极光呢？15秒？20秒？还是更长？这么想来我是个机器白痴啊。为什么昨天没想过要找找资料呢。想找个好位置架设三脚架，但左顾右盼，没有一个满意的地方。膝盖还没痊癒，旼炡只能一瘸一拐地移动，被突出的三脚架直接击中膝盖，痛得发出短促的低吟，瘫坐在地上。</p><p class="story-paragraph dialogue">「...从昨天开始，就我一个人不停搞事情」</p><p class="story-paragraph">不管怎样，至少谁都没看见。旼炡想尽办法，迅速起身，在离帐篷稍远的平地上终于设置完毕。广阔的天空就这么展现在眼前，无论在哪个位置出现极光，应该都不会错过。无论身体如何不舒服得要死，一想到终于能以极光猎人的名义站在猎场上，心情就一阵激荡。</p><p class="story-paragraph">大约过了半个小时，不远处传来一声喊叫。旼炡也将目光投向大家视线朝向之处，南边的天空上出现了一小块像云彩一样的淡绿色痕迹。</p><p class="story-paragraph">旼炡将右眼对准了摄像头。但是，拍摄出来的结果却与首尔的夜空无异，什么都没有，风景看起来平淡无奇。如果连一张照片都没留下的话，真的会出大事的。急急忙忙地调整光圈和快门，准备拍出最佳照片。虽然不太懂原理，但只要跟着旁边的意大利老爷爷做，大概就会了一半了。</p><p class="story-paragraph">Look at that！</p><p class="story-paragraph">这时有人大声欢呼。刹那间，强烈的光环笼罩了整个天空。刚才的淡绿色块朦胧的云彩消失得无影无踪。旼炡忘记按下相机快门，只是抬起头，恍惚地注视着美丽的风景。</p><p class="story-paragraph">白绿色彩鲜艳的曲线，从天空一侧开始肆意扩张，直达头顶上方。彷彿将颜料完全散开，直到整个天空都被色彩蔓延为止，只用了不到几分钟的时间。看到这，好像知道海盗船的传说中，为什么会出现飞龙。在一无所知的情况下，面对这一切的古人们，除了感到惊奇之外，还能想到什么呢？</p><p class="story-paragraph">今天明明是极光指数5到7的好日子。但这种亮度，显然超越那个程度。导游兴奋地喊道。可能是因为突然的太阳活动而产生了次风暴，你们可能是近年来来到冰岛的人中最幸运的。</p><p class="story-paragraph">亚爆(Substorm)。被称为极光风暴中最美丽的极限。这种荒诞的风景，现在正展现在眼前的夜空中。</p><p class="story-paragraph">用眼睛看起来是浪漫的，但其实算是奇观。这是太阳爆发时产生的瞬间冲突，不过只是磁场扭曲后所产生的干扰。但反过来说，冲突越大，扭曲越严重，极光就会越明亮。能够正确预测Substorm的概率趋近于0%。因为爆炸的太阳粒子，是像箭一样飞向地球，进入地球的时间不过1分钟左右。虽然听了导游的讲解，还是不太能理解，不过可以知道的是，绝对不能错过这片天空。</p><p class="story-paragraph">无论如何，这一瞬间，旼炡的眼睛里只装得下布满光芒的天空。极光彷彿有生命一般，在天空中缓缓泛起涟漪，时而变成红色，时而转为紫色。连续拍摄的照片中，一对意大利老夫妇在后方看着天空亲吻，成为背景。</p><p class="story-paragraph">旼炡将视线从相机中移开，专注用双眼直接仰望天空。光束如同在天空中舞动般，比想象中还要迷人。直到现在才明白，为什么只要在这个天空下许愿，所有的愿望都会实现。</p><p class="story-paragraph">亲眼见到的极光，真的会像这张照片一样漂亮吗？</p><p class="story-paragraph">因为是专业摄影师拍的...说实话，应该不会这么华丽吧。</p><p class="story-paragraph">反而是相反吧？</p><p class="story-paragraph">相反？</p><p class="story-paragraph">也可能是照片只有办法展示这个程度的美。</p><p class="story-paragraph">就这样看了几分钟，不、是几秒钟。没有眨过几次眼，光束再次消失在眼前，天空中只剩浅浅的淡蓝色残留。虽然冰岛的天气变化无常，无法保证极光会不会再次出现，但旼炡的直觉告诉自己。</p><p class="story-paragraph">今天最棒的风景刚才已经结束了。</p><p class="story-paragraph">在极光绽放的夜空下，</p><p class="story-paragraph">独自留在雪原上的北极狐 所看到的风景...</p><p class="story-paragraph">结束了吗？</p><p class="story-paragraph">这就结束了吗？</p><p class="story-paragraph">...真的吗？</p><p class="story-paragraph">如此心心念念，如此盼望的这片天空和知珉非常相似。突然出现动摇别人的心，结果闭上眼睛再睁开，就又消失得无影无踪。</p><p class="story-paragraph">只用一次相遇改变了自己所看到的世界的刘知珉。总是带领着自己去到没有计划的地方的刘知珉。与你在这场旅行中相遇，就像今天看到的极光一样，只是不可思议的巧合吗？</p><p class="story-paragraph">但无论是偶然还是命运，</p><p class="story-paragraph">遇见你之后的我</p><p class="story-paragraph">再也不能回到从前的生活了。</p><p class="story-paragraph">旼炡慢慢地闭上眼睛。隐约想起了夜间列车上，知珉第一次在身后拥抱哭喊的自己那段记忆。不管怎么想，只有我像个傻瓜一样。这个想法仍然没有改变。因为不管怎么挣扎着想抹去记忆，一切都是徒劳。</p><p class="story-paragraph dialogue">「如果早些承认这一点的话，应该会很轻松的」</p><p class="story-paragraph dialogue">「…我是这么想」</p><p class="story-paragraph dialogue">「你呢？」</p><p class="story-paragraph">开启新早晨的红茶。冬天的凌晨小巷内干燥的空气。迎着甲板上吹来的海风飘扬的头发。给自己戴戒指温柔的手指。埋在你后颈处充满的香气。</p><p class="story-paragraph">这些东西怎么也扔不掉。</p><p class="story-paragraph">所以，虽然是像傻瓜一样的愿望，但我还是会这么许愿。</p><p class="story-paragraph dialogue">「刘知珉」</p><p class="story-paragraph dialogue">「...知珉姐姐」</p><p class="story-paragraph">想象过好几次这样呼唤你的名字，一起望向璀璨的夜空，亲眼看到你许愿的侧脸。但是现在已经不重要了。和你在一起的所有瞬间全部被抹去也没关系。我希望的只是——</p><p class="story-paragraph dialogue">「现在马上出现在我面前吧」</p><p class="story-paragraph">向着天空昂首挺胸的旼炡，用颤抖的声音高喊。就像把愿望寄托在神灯精灵身上一样，参杂着耍赖般的语气。当然，冰岛的夜空没有回应，只是静悄悄的。颤抖的嗓音不知不觉间变成了哭泣。旼炡双手附上眼角，把憋了很久的话艰难地说出口。</p><p class="story-paragraph dialogue">「然后现在...」</p><p class="story-paragraph dialogue">「能不能抱抱我？」</p><p class="story-paragraph">像你从摇晃的列车中朝我靠近的夜晚那样。像在小巷内等我的那天凌晨那样。就像在熄灯的游乐园前紧紧抱住我那样。</p><p class="story-paragraph">你更喜欢哪一种我？</p><p class="story-paragraph">是那时候还是今天的？</p><p class="story-paragraph">…我是不会说的。</p><p class="story-paragraph">刚才不是说了嘛，只有你对我表现出来，我才能知道啊？</p><p class="story-paragraph">因为任何一个你我都喜欢。</p><p class="story-paragraph">一阵凉风拂过未干的泪痕。旼炡蹲在原地，呆呆地望着天空。极光已经完全消失的漆黑夜空，听到自己哀切的愿望后，始终没有回答。旼炡脱下披在肩上的羽绒服，脸上满是泪水。厚厚的羽绒服没有知珉怀抱那么温暖，也没有心脏的脉搏跳动，但还弥漫着自己思念的余香。这瞬间，甚至让人产生两人没有分别的错觉。</p><p class="story-paragraph">使出全身的力气，用双臂紧紧地抱住羽绒服。撒娇似的用脑袋摩擦，发出沙沙声，衣服都弄皱了。</p><p class="story-paragraph dialogue">「...我好想你」</p><p class="story-paragraph">像傻瓜一样的刘知珉。</p><p class="story-paragraph">不会说谎的刘知珉。</p><p class="story-paragraph">比任何人都适合冬天的刘知珉。</p><p class="story-paragraph">偶尔自私又任性的刘知珉。</p><p class="story-paragraph">但是要抛弃我离去时，</p><p class="story-paragraph">非常温柔的你。</p><p class="story-paragraph dialogue">「现在非常非常思念你...」</p><p class="story-paragraph">既是长途旅行的终点，也是最精彩的一站。</p><p class="story-paragraph">北极狐期盼已久的风景</p><p class="story-paragraph">独自一人填满的夜空</p><p class="story-paragraph">不在这里的某个人会知道吗？</p></div>
      </section></template>

          <h2 id="heading-chapter-24">北极狐观察日记24</h2>
        </header>

          <h3>LambC(램씨) - WINTER</h3>
